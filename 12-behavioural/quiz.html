 and cannot be fixed incrementally.<\/li><li><strong>Cut early<\/strong>, when there are options, rather than at the point where the cut is forced.<\/li><li><strong>Never cut the things that are expensive to retrofit<\/strong> - the data model, security, observability, the migration path. Say which ones you protected and why; that list is where the judgement shows.<\/li><li><strong>Get the business owner to choose<\/strong> from a costed list, so the cut is theirs.<\/li><\/ul><blockquote><p>&quot;We shipped <em>[the core]<\/em> on the date. What went was <em>[three named things]<\/em>, agreed with <em>[the owner]<\/em> in week two. What I refused to drop was the audit log and the migration tooling, because retrofitting either would have cost more than the features we cut.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "\"describe a time you cut scope to make a date.\" see q126 and q127 for the full shape. what to emphasize here: - cut whole features, not quality within features. a shipped subset works; a full set at 70 percent quality is a support burden and cannot be fixed incrementally. - cut early , when there are options, rather than at the point where the cut is forced. - never cut the things that are expensive to retrofit - the data model, security, observability, the migration path. say which ones you protected and why; that list is where the judgement shows. - get the business owner to choose from a costed list, so the cut is theirs. \"we shipped [the core] on the date. what went was [three named things] , agreed with [the owner] in week two. what i refused to drop was the audit log and the migration tooling, because retrofitting either would have cost more than the features we cut.\""}, {"n": 170, "category": 11, "difficulty": "T", "html": "&quot;Have you ever shipped something you knew was not good enough?&quot;", "answerTitle": "Shipping something you knew was not good enough", "answer": "<p>Answer yes - everyone has - and make the answer about how the decision was made and bounded.<\/p><blockquote><p>&quot;Yes. <em>[The feature]<\/em> went out with <em>[the known limitation]<\/em>, because <em>[the reason - a contractual date, a customer already live, the alternative was nothing]<\/em>. The parts that made it a decision rather than a lapse: it was known and written down; <em>[the business owner]<\/em> signed for it; we limited exposure to <em>[the small set of customers]<\/em>; support had a script; and there was a dated plan to fix it, which we actually did in <em>[when]<\/em>.&quot;<\/p><\/blockquote><p>Then the line: <em>&quot;what I will not ship is something where the failure is silent or where the customer cannot tell they are affected. Degraded and visible is a trade; wrong and quiet is not.&quot;<\/em><\/p><p><strong>Red flag:<\/strong> claiming you have never done it. At nineteen years that reads as either untrue or as never having shipped under real constraints.<\/p>", "source": "answers.md", "search": "\"have you ever shipped something you knew was not good enough?\" answer yes - everyone has - and make the answer about how the decision was made and bounded. \"yes. [the feature] went out with [the known limitation] , because [the reason - a contractual date, a customer already live, the alternative was nothing] . the parts that made it a decision rather than a lapse: it was known and written down; [the business owner] signed for it; we limited exposure to [the small set of customers] ; support had a script; and there was a dated plan to fix it, which we actually did in [when] .\" then the line: \"what i will not ship is something where the failure is silent or where the customer cannot tell they are affected. degraded and visible is a trade; wrong and quiet is not.\" red flag: claiming you have never done it. at nineteen years that reads as either untrue or as never having shipped under real constraints."}, {"n": 171, "category": 11, "difficulty": "D", "html": "How do you decide what technical debt to pay and what to leave forever?", "answerTitle": "Which debt to pay and which to leave forever", "answer": "<p>The framework, stated as questions rather than a matrix:<\/p><ul><li><strong>Is it charging interest?<\/strong> Debt that costs something every week - toil, incidents, slow changes - is real. Ugly code in a stable component that nobody touches costs nothing and should be left alone forever.<\/li><li><strong>Is it in the path of what we are about to do?<\/strong> Pay debt just before you need to change that area, not on principle.<\/li><li><strong>Does it block detection?<\/strong> Missing observability and missing tests are special: they prevent you from knowing about everything else, so they come first.<\/li><li><strong>Is it a safety or security exposure?<\/strong> Different category, not a prioritization question.<\/li><li><strong>Will it be deleted within the year?<\/strong> Then it is not debt, it is a legacy system with an exit date.<\/li><\/ul><p><strong>The sentence that scores:<\/strong> <em>&quot;the majority of what people call technical debt should never be paid, and being able to say which is which is the actual skill. What I insist on paying is anything that stops us seeing what is happening.&quot;<\/em><\/p>", "source": "answers.md", "search": "how do you decide what technical debt to pay and what to leave forever? the framework, stated as questions rather than a matrix: - is it charging interest? debt that costs something every week - toil, incidents, slow changes - is real. ugly code in a stable component that nobody touches costs nothing and should be left alone forever. - is it in the path of what we are about to do? pay debt just before you need to change that area, not on principle. - does it block detection? missing observability and missing tests are special: they prevent you from knowing about everything else, so they come first. - is it a safety or security exposure? different category, not a prioritization question. - will it be deleted within the year? then it is not debt, it is a legacy system with an exit date. the sentence that scores: \"the majority of what people call technical debt should never be paid, and being able to say which is which is the actual skill. what i insist on paying is anything that stops us seeing what is happening.\""}, {"n": 172, "category": 11, "difficulty": "D", "html": "&quot;Tell me how you made the case for work with no visible customer value.&quot;", "answerTitle": "Making the case for invisible work", "answer": "<p>See Q161 for the executive framing. The additional moves specific to this question:<\/p><ul><li><strong>Convert toil to headcount.<\/strong> &quot;This costs us <em>[N]<\/em> days a month&quot; becomes &quot;that is a third of an engineer, every month, forever.&quot;<\/li><li><strong>Use the incident record.<\/strong> Three incidents with dates, durations and business impact is an argument that does not need a slide.<\/li><li><strong>Show the trend, not the state.<\/strong> &quot;It is bad&quot; invites debate; &quot;it has doubled in eight months and here is the line&quot; invites a decision.<\/li><li><strong>Attach it to a committed outcome<\/strong> rather than requesting it standalone.<\/li><li><strong>Ask for a bounded experiment<\/strong> when the argument is not landing: two engineers, six weeks, a specified measurable outcome. Much easier to approve, and the result makes the larger case for you.<\/li><\/ul><p>Close with the number that moved and what it enabled - the second half is what makes the next one easier to fund.<\/p>", "source": "answers.md", "search": "\"tell me how you made the case for work with no visible customer value.\" see q161 for the executive framing. the additional moves specific to this question: - convert toil to headcount. \"this costs us [n] days a month\" becomes \"that is a third of an engineer, every month, forever.\" - use the incident record. three incidents with dates, durations and business impact is an argument that does not need a slide. - show the trend, not the state. \"it is bad\" invites debate; \"it has doubled in eight months and here is the line\" invites a decision. - attach it to a committed outcome rather than requesting it standalone. - ask for a bounded experiment when the argument is not landing: two engineers, six weeks, a specified measurable outcome. much easier to approve, and the result makes the larger case for you. close with the number that moved and what it enabled - the second half is what makes the next one easier to fund."}, {"n": 173, "category": 11, "difficulty": "D", "html": "What framework do you actually use to prioritize, and how do you avoid it sounding like a template?", "answerTitle": "Your actual prioritization framework", "answer": "<p>Name a real one, then say where it fails - that is the part that makes it yours rather than recited.<\/p><blockquote><p>&quot;For a backlog I use cost of delay divided by effort, roughly - what does waiting a quarter cost, over what it takes. It works when the items are comparable and it fails in three places: anything with a deadline imposed from outside is not a priority question at all, it is a constraint; anything that is a safety, security or legal matter comes out of the ranking entirely; and it systematically under-rates work that unlocks other work, so I hold a fixed fraction - about <em>[20 percent]<\/em> - for the enabling and reliability work rather than competing it against features it will always lose to.&quot;<\/p><\/blockquote><p>That structure - a method, three named failure modes, and a protected allocation - reads as lived experience. A framework recited without its failure modes reads as a book.<\/p>", "source": "answers.md", "search": "what framework do you actually use to prioritize, and how do you avoid it sounding like a template? name a real one, then say where it fails - that is the part that makes it yours rather than recited. \"for a backlog i use cost of delay divided by effort, roughly - what does waiting a quarter cost, over what it takes. it works when the items are comparable and it fails in three places: anything with a deadline imposed from outside is not a priority question at all, it is a constraint; anything that is a safety, security or legal matter comes out of the ranking entirely; and it systematically under-rates work that unlocks other work, so i hold a fixed fraction - about [20 percent] - for the enabling and reliability work rather than competing it against features it will always lose to.\" that structure - a method, three named failure modes, and a protected allocation - reads as lived experience. a framework recited without its failure modes reads as a book."}, {"n": 174, "category": 11, "difficulty": "T", "html": "Everything is priority one and the person who set that is your skip-level. What do you do?", "answerTitle": "Everything is priority one, set by your skip-level", "answer": "<p>Do not argue about the list. <strong>Make the arithmetic visible and ask them to choose<\/strong>, which converts a values statement into a resource decision.<\/p><blockquote><p>&quot;I took the list to <em>[them]<\/em> with an estimate against each and the team&#x27;s actual capacity for the quarter at the top - the total was about twice the capacity. Then I said: &#x27;If we start all of these, we finish none of them by <em>[the date]<\/em>. Here is the order I would run them in and what that means for the last three. Which of these is wrong?&#x27; They moved two and dropped one.&quot;<\/p><\/blockquote><p>The techniques inside that: <strong>capacity as a fact, not an opinion<\/strong>; a proposed order rather than a request for one, because reacting is easier than deciding; and asking which is wrong rather than which to cut.<\/p><p>If they insist on all of it, the fallback is a written record of the sequence and the expected outcome, plus a checkpoint. Then deliver in that order and let the checkpoint have the conversation for you.<\/p>", "source": "answers.md", "search": "everything is priority one and the person who set that is your skip-level. what do you do? do not argue about the list. make the arithmetic visible and ask them to choose , which converts a values statement into a resource decision. \"i took the list to [them] with an estimate against each and the team's actual capacity for the quarter at the top - the total was about twice the capacity. then i said: 'if we start all of these, we finish none of them by [the date] . here is the order i would run them in and what that means for the last three. which of these is wrong?' they moved two and dropped one.\" the techniques inside that: capacity as a fact, not an opinion ; a proposed order rather than a request for one, because reacting is easier than deciding; and asking which is wrong rather than which to cut. if they insist on all of it, the fallback is a written record of the sequence and the expected outcome, plus a checkpoint. then deliver in that order and let the checkpoint have the conversation for you."}, {"n": 175, "category": 11, "difficulty": "D", "html": "&quot;Describe a time you killed a project.&quot;", "answerTitle": "Killing a project", "answer": "<p>The most valuable version is one <strong>you initiated and had something invested in<\/strong>.<\/p><ul><li><strong>Situation.<\/strong> <em>[The project]<\/em>, <em>[N]<\/em> months in, <em>[the investment]<\/em>.<\/li><li><strong>Task.<\/strong> I owned it, and I was its main advocate.<\/li><li><strong>Action.<\/strong> The signal was <em>[the evidence - adoption after the pilot, the cost per unit, the assumption that turned out false]<\/em>. I checked it against the criteria we had set at the start, or - honestly - I realized we had never set any, which was part of the problem. I wrote up the case for stopping, including the strongest argument for continuing, and took it to <em>[the sponsor]<\/em> with a recommendation to stop and what to salvage.<\/li><li><strong>Result.<\/strong> We stopped, redirected <em>[the people]<\/em> to <em>[what]<\/em>, and kept <em>[the salvage - the library, the learning, the data]<\/em>. Sunk cost was <em>[the number]<\/em>, and continuing would have cost <em>[the estimate]<\/em>.<\/li><li><strong>Learning.<\/strong> Every project I start now has written kill criteria and a date to check them, because the hard part is not the decision, it is having permission to make it.<\/li><\/ul><p><strong>Include the human part:<\/strong> how you told the team, and what you did to make sure it did not read as their failure.<\/p>", "source": "answers.md", "search": "\"describe a time you killed a project.\" the most valuable version is one you initiated and had something invested in . - situation. [the project] , [n] months in, [the investment] . - task. i owned it, and i was its main advocate. - action. the signal was [the evidence - adoption after the pilot, the cost per unit, the assumption that turned out false] . i checked it against the criteria we had set at the start, or - honestly - i realized we had never set any, which was part of the problem. i wrote up the case for stopping, including the strongest argument for continuing, and took it to [the sponsor] with a recommendation to stop and what to salvage. - result. we stopped, redirected [the people] to [what] , and kept [the salvage - the library, the learning, the data] . sunk cost was [the number] , and continuing would have cost [the estimate] . - learning. every project i start now has written kill criteria and a date to check them, because the hard part is not the decision, it is having permission to make it. include the human part: how you told the team, and what you did to make sure it did not read as their failure."}, {"n": 176, "category": 11, "difficulty": "D", "html": "How do you handle a request that is reasonable in isolation and disastrous in aggregate?", "answerTitle": "Reasonable in isolation, disastrous in aggregate", "answer": "<p>Name the aggregate explicitly, because the requester genuinely cannot see it - they are making one request and you are receiving the twentieth.<\/p><blockquote><p>&quot;Each customer-specific flag was a day&#x27;s work and completely reasonable. At <em>[N]<\/em> of them, the test matrix was unrunnable and nobody could reason about behaviour. So I stopped answering the individual requests and put the aggregate in front of <em>[the stakeholder]<\/em>: <em>[N]<\/em> flags, <em>[the cost]<\/em> per release in testing, <em>[the incident]<\/em> that came from an interaction between two of them. The answer was not &#x27;no more flags&#x27; - it was <em>[the mechanism: a configuration model with defined dimensions, an expiry date on every flag, a limit with an owner]<\/em>.&quot;<\/p><\/blockquote><p>The pattern: <strong>the answer to a bad aggregate is a mechanism with a budget, not a refusal.<\/strong> A limit that someone owns and can spend converts an endless stream of individual negotiations into one design decision.<\/p>", "source": "answers.md", "search": "how do you handle a request that is reasonable in isolation and disastrous in aggregate? name the aggregate explicitly, because the requester genuinely cannot see it - they are making one request and you are receiving the twentieth. \"each customer-specific flag was a day's work and completely reasonable. at [n] of them, the test matrix was unrunnable and nobody could reason about behaviour. so i stopped answering the individual requests and put the aggregate in front of [the stakeholder] : [n] flags, [the cost] per release in testing, [the incident] that came from an interaction between two of them. the answer was not 'no more flags' - it was [the mechanism: a configuration model with defined dimensions, an expiry date on every flag, a limit with an owner] .\" the pattern: the answer to a bad aggregate is a mechanism with a budget, not a refusal. a limit that someone owns and can spend converts an endless stream of individual negotiations into one design decision."}, {"n": 177, "category": 11, "difficulty": "D", "html": "&quot;Tell me about a trade-off you made between speed and quality, and what it cost.&quot;", "answerTitle": "Speed versus quality, and the cost", "answer": "<p>Choose an example where <strong>the cost actually arrived<\/strong>, because a trade-off story with no bill is not a trade-off story.<\/p><blockquote><p>&quot;We took <em>[the shortcut]<\/em> to make <em>[the date]<\/em>. It was the right call - the alternative was missing <em>[the commitment]<\/em>. The bill arrived <em>[when]<\/em>: <em>[the specific cost - the incident, the three weeks of rework, the two quarters of slower change in that area]<\/em>, which was roughly <em>[factor]<\/em> what the original work would have cost. I would still make the same decision, because <em>[the date&#x27;s value]<\/em>, but I under-estimated the interest rate, and now I put a date on the repayment when I take the shortcut and treat that date as a commitment rather than an intention.&quot;<\/p><\/blockquote><p>The elements: a real cost with a number, a re-affirmation or revision of the decision, and the mechanism you added. <strong>The candidates who score badly here are the ones who present the shortcut with no consequence, or who claim they never take them.<\/strong><\/p>", "source": "answers.md", "search": "\"tell me about a trade-off you made between speed and quality, and what it cost.\" choose an example where the cost actually arrived , because a trade-off story with no bill is not a trade-off story. \"we took [the shortcut] to make [the date] . it was the right call - the alternative was missing [the commitment] . the bill arrived [when] : [the specific cost - the incident, the three weeks of rework, the two quarters of slower change in that area] , which was roughly [factor] what the original work would have cost. i would still make the same decision, because [the date's value] , but i under-estimated the interest rate, and now i put a date on the repayment when i take the shortcut and treat that date as a commitment rather than an intention.\" the elements: a real cost with a number, a re-affirmation or revision of the decision, and the mechanism you added. the candidates who score badly here are the ones who present the shortcut with no consequence, or who claim they never take them."}, {"n": 178, "category": 11, "difficulty": "T", "html": "How do you say no to a peer whose goodwill you need next quarter?", "answerTitle": "Saying no to a peer you need", "answer": "<p>Protect the relationship by being <strong>fast, honest about the reason, and generous with something else<\/strong>.<\/p><blockquote><p>&quot;I said no the same day, and I told them the actual reason - we had committed <em>[the capacity]<\/em> to <em>[the thing]<\/em> and I was not going to quietly under-deliver on both. Then I gave them what I could: <em>[the smaller thing - two days of someone&#x27;s time, the design review, the pointer to the team that had solved it]<\/em>. And I told them when I would be able to help properly.&quot;<\/p><\/blockquote><p>What preserves goodwill: <strong>the honest reason<\/strong> (peers can tell when they are being managed), speed, a partial, and a future commitment you then honour. What destroys it: a vague no, a slow no, or a yes that quietly does not happen - the last being by far the most damaging and the most common.<\/p>", "source": "answers.md", "search": "how do you say no to a peer whose goodwill you need next quarter? protect the relationship by being fast, honest about the reason, and generous with something else . \"i said no the same day, and i told them the actual reason - we had committed [the capacity] to [the thing] and i was not going to quietly under-deliver on both. then i gave them what i could: [the smaller thing - two days of someone's time, the design review, the pointer to the team that had solved it] . and i told them when i would be able to help properly.\" what preserves goodwill: the honest reason (peers can tell when they are being managed), speed, a partial, and a future commitment you then honour. what destroys it: a vague no, a slow no, or a yes that quietly does not happen - the last being by far the most damaging and the most common."}, {"n": 179, "category": 11, "difficulty": "D", "html": "How do you decide what not to do when you have surplus capacity rather than a shortage?", "answerTitle": "Deciding what not to do with surplus capacity", "answer": "<p>A better question than it looks, because the failure mode is different: with surplus, work is chosen by whoever is most enthusiastic rather than by value, and it creates permanent obligations.<\/p><p>The discipline:<\/p><ul><li><strong>Every new thing is a running cost, forever.<\/strong> A service built with spare capacity in Q2 needs on-call, patching and upgrades in perpetuity. The question is not &quot;can we build it&quot; but &quot;will we still want to own it in three years&quot;.<\/li><li><strong>Prefer deleting, paying down, and raising the floor<\/strong> - the work that never wins in a scarcity contest and has the best long-run return.<\/li><li><strong>Prefer reversible experiments<\/strong> with an explicit end date and kill criteria.<\/li><li><strong>Beware building for a demand nobody has expressed.<\/strong> The most expensive artifacts in most organizations were built with slack.<\/li><li><strong>Consider giving the capacity away<\/strong> to the team that is the bottleneck for something that matters. It is usually the highest-value option and almost nobody chooses it.<\/li><\/ul>", "source": "answers.md", "search": "how do you decide what not to do when you have surplus capacity rather than a shortage? a better question than it looks, because the failure mode is different: with surplus, work is chosen by whoever is most enthusiastic rather than by value, and it creates permanent obligations. the discipline: - every new thing is a running cost, forever. a service built with spare capacity in q2 needs on-call, patching and upgrades in perpetuity. the question is not \"can we build it\" but \"will we still want to own it in three years\". - prefer deleting, paying down, and raising the floor - the work that never wins in a scarcity contest and has the best long-run return. - prefer reversible experiments with an explicit end date and kill criteria. - beware building for a demand nobody has expressed. the most expensive artifacts in most organizations were built with slack. - consider giving the capacity away to the team that is the bottleneck for something that matters. it is usually the highest-value option and almost nobody chooses it."}, {"n": 180, "category": 11, "difficulty": "A", "html": "Build the prioritization argument for spending a quarter of a team&#x27;s capacity on reliability.", "answerTitle": "A quarter of capacity on reliability", "answer": "<p>The argument, in the order that works:<\/p><ol><li><strong>Open with the customer and the money, not the engineering.<\/strong> &quot;We had <em>[N]<\/em> incidents last quarter affecting <em>[N]<\/em> customers for <em>[N]<\/em> minutes. <em>[The named account]<\/em> raised it in their review, and their renewal is in <em>[month]<\/em>.&quot;<\/li><li><strong>Convert unreliability into lost capacity.<\/strong> &quot;Unplanned work is <em>[N]<\/em> percent of the team&#x27;s time. We are already spending a quarter of the team on reliability - we are just spending it reactively, at night, on the wrong things.&quot;<\/li><li><strong>Make the ask specific and bounded.<\/strong> Not &quot;invest in reliability&quot; but three named outcomes: <em>[the top source of pages removed]<\/em>, <em>[detection for the class we keep missing]<\/em>, <em>[the failover exercised]<\/em>. One quarter, then a review.<\/li><li><strong>State what will not happen<\/strong> as a result, in feature terms, and say it before they ask.<\/li><li><strong>Commit to measurable outcomes<\/strong> - pages per shift, change failure rate, percentage of incidents customer-detected - and agree to report against them.<\/li><li><strong>Name the alternative<\/strong>: continue, accept the incident rate, and be explicit that it will grow with the service count, because the failure modes are combinatorial.<\/li><\/ol><p>The strongest framing overall: <strong>this is not a request for new investment, it is a request to move existing spend from reactive to planned.<\/strong><\/p>", "source": "answers.md", "search": "build the prioritization argument for spending a quarter of a team's capacity on reliability. the argument, in the order that works: 1. open with the customer and the money, not the engineering. \"we had [n] incidents last quarter affecting [n] customers for [n] minutes. [the named account] raised it in their review, and their renewal is in [month] .\" 2. convert unreliability into lost capacity. \"unplanned work is [n] percent of the team's time. we are already spending a quarter of the team on reliability - we are just spending it reactively, at night, on the wrong things.\" 3. make the ask specific and bounded. not \"invest in reliability\" but three named outcomes: [the top source of pages removed] , [detection for the class we keep missing] , [the failover exercised] . one quarter, then a review. 4. state what will not happen as a result, in feature terms, and say it before they ask. 5. commit to measurable outcomes - pages per shift, change failure rate, percentage of incidents customer-detected - and agree to report against them. 6. name the alternative : continue, accept the incident rate, and be explicit that it will grow with the service count, because the failure modes are combinatorial. the strongest framing overall: this is not a request for new investment, it is a request to move existing spend from reactive to planned."}, {"n": 181, "category": 11, "difficulty": "A", "html": "What is the most expensive thing you have ever chosen not to build, and how did you defend it?", "answerTitle": "The most expensive thing you did not build", "answer": "<p>Pick something big and defensible, and make the reasoning portable.<\/p><blockquote><p>&quot;The bespoke <em>[rules engine / workflow platform / internal framework]<\/em>. It was scoped at roughly <em>[N]<\/em> engineer-months and there was real appetite for it. I argued against on three grounds: the requirement was <em>[N]<\/em> rules and the ceiling of the simple approach was well above that; the maintenance would be permanent and would fall on a team of <em>[N]<\/em>; and the flexibility being asked for was for use cases nobody could name. What we did instead was <em>[the simple thing]<\/em>, which took <em>[weeks]<\/em>.<\/p><\/blockquote><blockquote><p>The honest follow-up: three years later it is still fine, and we did hit <em>[the limitation]<\/em> once, which cost us <em>[the smaller number]<\/em>. The rule I took is that generality should be bought when you have three concrete cases, not when you can imagine three.&quot;<\/p><\/blockquote><p>The elements: the number you saved, the argument in three grounds rather than a preference, the cost you did incur by being wrong at the margin, and a portable rule.<\/p>", "source": "answers.md", "search": "what is the most expensive thing you have ever chosen not to build, and how did you defend it? pick something big and defensible, and make the reasoning portable. \"the bespoke [rules engine / workflow platform / internal framework] . it was scoped at roughly [n] engineer-months and there was real appetite for it. i argued against on three grounds: the requirement was [n] rules and the ceiling of the simple approach was well above that; the maintenance would be permanent and would fall on a team of [n] ; and the flexibility being asked for was for use cases nobody could name. what we did instead was [the simple thing] , which took [weeks] . the honest follow-up: three years later it is still fine, and we did hit [the limitation] once, which cost us [the smaller number] . the rule i took is that generality should be bought when you have three concrete cases, not when you can imagine three.\" the elements: the number you saved, the argument in three grounds rather than a preference, the cost you did incur by being wrong at the margin, and a portable rule."}, {"n": 182, "category": 12, "difficulty": "C", "html": "&quot;Tell me about a time you had to make progress with unclear requirements.&quot;", "answerTitle": "Progress with unclear requirements", "answer": "<p><strong>Skeleton.<\/strong> The best material is a project where the requirement was a sentence and the system was a year.<\/p><ul><li><strong>Situation.<\/strong> <em>[The ask, in the vague form it arrived in]<\/em> - for example, &quot;we need to use AI in <em>[the product]<\/em>&quot;, with no owner, no success measure and <em>[the constraint]<\/em>.<\/li><li><strong>Task.<\/strong> Turn it into something decidable within <em>[weeks]<\/em> without waiting for someone else to specify it.<\/li><li><strong>Action.<\/strong> I did not ask for requirements - nobody had any. Instead: I found the three people who would use it and watched what they actually did; I wrote down <em>[N]<\/em> candidate uses with a guess at value and cost for each; I picked the one that was smallest and most falsifiable and built <em>[the thin slice]<\/em> in <em>[weeks]<\/em>; and I wrote the assumptions down so that being wrong would be visible.<\/li><li><strong>Result.<\/strong> <em>[The outcome - the slice showed X, we killed two of the candidates, and the third became Y]<\/em>. The requirement that eventually got written was <em>[the concrete one]<\/em>, and it came out of the evidence rather than the meeting.<\/li><li><strong>Learning.<\/strong> Ambiguity is not resolved by asking; it is resolved by producing something specific enough to be argued with. My first artifact is now always a strawman, deliberately wrong in a way people can correct.<\/li><\/ul>", "source": "answers.md", "search": "\"tell me about a time you had to make progress with unclear requirements.\" skeleton. the best material is a project where the requirement was a sentence and the system was a year. - situation. [the ask, in the vague form it arrived in] - for example, \"we need to use ai in [the product] \", with no owner, no success measure and [the constraint] . - task. turn it into something decidable within [weeks] without waiting for someone else to specify it. - action. i did not ask for requirements - nobody had any. instead: i found the three people who would use it and watched what they actually did; i wrote down [n] candidate uses with a guess at value and cost for each; i picked the one that was smallest and most falsifiable and built [the thin slice] in [weeks] ; and i wrote the assumptions down so that being wrong would be visible. - result. [the outcome - the slice showed x, we killed two of the candidates, and the third became y] . the requirement that eventually got written was [the concrete one] , and it came out of the evidence rather than the meeting. - learning. ambiguity is not resolved by asking; it is resolved by producing something specific enough to be argued with. my first artifact is now always a strawman, deliberately wrong in a way people can correct."}, {"n": 183, "category": 12, "difficulty": "D", "html": "What do you do first when handed a problem with no defined scope, and how do you narrate it?", "answerTitle": "The first thing you do with an undefined problem", "answer": "<p>Narrate it as a sequence, because the sequence is the competency:<\/p><ol><li><strong>Find who is unhappy and why.<\/strong> Every vague brief has a real irritant behind it. Talk to the three people closest to it before you talk to the sponsor again.<\/li><li><strong>Write down what success would look like in a sentence<\/strong>, and take it back to the sponsor. Their correction is worth more than their original brief.<\/li><li><strong>List what is fixed and what is negotiable<\/strong> - date, budget, compliance, the systems you must integrate with. Constraints define the space faster than requirements do.<\/li><li><strong>Name the decision that costs the most to get wrong<\/strong>, and design the cheapest thing that would inform it.<\/li><li><strong>Produce a strawman quickly<\/strong> and circulate it. Being specific and wrong is the fastest route to being specific and right.<\/li><li><strong>Set a date for the next decision<\/strong>, so exploration has a boundary (Q195).<\/li><\/ol><p>Say the anti-pattern out loud: the multi-week discovery phase that ends in a document, during which nothing was built and nothing was learned.<\/p>", "source": "answers.md", "search": "what do you do first when handed a problem with no defined scope, and how do you narrate it? narrate it as a sequence, because the sequence is the competency: 1. find who is unhappy and why. every vague brief has a real irritant behind it. talk to the three people closest to it before you talk to the sponsor again. 2. write down what success would look like in a sentence , and take it back to the sponsor. their correction is worth more than their original brief. 3. list what is fixed and what is negotiable - date, budget, compliance, the systems you must integrate with. constraints define the space faster than requirements do. 4. name the decision that costs the most to get wrong , and design the cheapest thing that would inform it. 5. produce a strawman quickly and circulate it. being specific and wrong is the fastest route to being specific and right. 6. set a date for the next decision , so exploration has a boundary (q195). say the anti-pattern out loud: the multi-week discovery phase that ends in a document, during which nothing was built and nothing was learned."}, {"n": 184, "category": 12, "difficulty": "D", "html": "&quot;Describe the most ambiguous project you have worked on.&quot; What made it ambiguous rather than just hard?", "answerTitle": "Ambiguous versus merely hard", "answer": "<p>Hard means you know the target and the path is difficult. <strong>Ambiguous means the target itself is contested or unknown<\/strong>, and the distinguishing symptom is that two competent people would build different things and both be defensible.<\/p><p>Sources of genuine ambiguity worth naming: nobody owns the decision; the users cannot articulate what they need until they see something; the success measure does not exist; the constraint that matters has not been discovered yet; or the sponsor&#x27;s real goal is different from the stated one.<\/p><blockquote><p>&quot;It was ambiguous rather than hard because <em>[the specific symptom - three stakeholders each described a different system when asked the same question]<\/em>. The engineering was not the difficulty. The difficulty was that no version of it could be shown to be right, so I had to make it falsifiable before I could make it work.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "\"describe the most ambiguous project you have worked on.\" what made it ambiguous rather than just hard? hard means you know the target and the path is difficult. ambiguous means the target itself is contested or unknown , and the distinguishing symptom is that two competent people would build different things and both be defensible. sources of genuine ambiguity worth naming: nobody owns the decision; the users cannot articulate what they need until they see something; the success measure does not exist; the constraint that matters has not been discovered yet; or the sponsor's real goal is different from the stated one. \"it was ambiguous rather than hard because [the specific symptom - three stakeholders each described a different system when asked the same question] . the engineering was not the difficulty. the difficulty was that no version of it could be shown to be right, so i had to make it falsifiable before i could make it work.\""}, {"n": 185, "category": 12, "difficulty": "D", "html": "How do you make a decision that is expensive to reverse when the information will not arrive in time?", "answerTitle": "An expensive-to-reverse decision without enough information", "answer": "<p>The reasoning to demonstrate:<\/p><ul><li><strong>Test whether it is really one-way.<\/strong> Most decisions are more reversible than they feel, and the first move is to look for the version that keeps the option open - an abstraction, a phased commitment, a pilot on a subset.<\/li><li><strong>If it is genuinely irreversible, buy information proportionate to the cost.<\/strong> A two-week spike against a three-year commitment is cheap. Say the arithmetic out loud.<\/li><li><strong>Decide on the failure mode, not the expected case.<\/strong> When information is missing, choose the option whose bad outcome you can survive.<\/li><li><strong>Set the decision date and hold it<\/strong>, because the cost of not deciding is usually invisible and often larger than either option.<\/li><li><strong>Write down what you assumed and what would falsify it<\/strong>, so the reversal, if needed, is triggered by evidence rather than by argument (Q98).<\/li><\/ul><blockquote><p>&quot;I gave us two weeks to remove the biggest unknown, made the call on the Friday whether or not it was resolved, and wrote down the two assumptions the decision rested on and how we would know if either was wrong.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "how do you make a decision that is expensive to reverse when the information will not arrive in time? the reasoning to demonstrate: - test whether it is really one-way. most decisions are more reversible than they feel, and the first move is to look for the version that keeps the option open - an abstraction, a phased commitment, a pilot on a subset. - if it is genuinely irreversible, buy information proportionate to the cost. a two-week spike against a three-year commitment is cheap. say the arithmetic out loud. - decide on the failure mode, not the expected case. when information is missing, choose the option whose bad outcome you can survive. - set the decision date and hold it , because the cost of not deciding is usually invisible and often larger than either option. - write down what you assumed and what would falsify it , so the reversal, if needed, is triggered by evidence rather than by argument (q98). \"i gave us two weeks to remove the biggest unknown, made the call on the friday whether or not it was resolved, and wrote down the two assumptions the decision rested on and how we would know if either was wrong.\""}, {"n": 186, "category": 12, "difficulty": "T", "html": "How do you distinguish real ambiguity from someone declining to make a decision?", "answerTitle": "Real ambiguity versus an unmade decision", "answer": "<p>The diagnostic: <strong>ask who would have to agree, and what they are waiting for.<\/strong> If there is a clear owner and they have the information they need, the problem is not ambiguity - it is an unmade decision, and treating it as ambiguity means you will do a lot of analysis that changes nothing.<\/p><p>How to tell them apart in practice:<\/p><ul><li>Ambiguity produces different answers from different people when you ask what success looks like. An unmade decision produces the same answer plus &quot;but nobody has signed off&quot;.<\/li><li>Ambiguity is resolved by evidence. An unmade decision is resolved by a person, a deadline, or an escalation.<\/li><li>Ambiguity has no owner because the problem is undefined. An unmade decision has an owner who is avoiding it - usually because it has a cost they do not want to carry.<\/li><\/ul><p>The move for the second case: make the cost of not deciding visible, propose a default, and set a date. <em>&quot;Unless I hear otherwise by Friday, we are going with <\/em>[X]<em>&quot;<\/em> resolves an enormous proportion of these, and it is legitimate as long as it is genuinely reversible.<\/p>", "source": "answers.md", "search": "how do you distinguish real ambiguity from someone declining to make a decision? the diagnostic: ask who would have to agree, and what they are waiting for. if there is a clear owner and they have the information they need, the problem is not ambiguity - it is an unmade decision, and treating it as ambiguity means you will do a lot of analysis that changes nothing. how to tell them apart in practice: - ambiguity produces different answers from different people when you ask what success looks like. an unmade decision produces the same answer plus \"but nobody has signed off\". - ambiguity is resolved by evidence. an unmade decision is resolved by a person, a deadline, or an escalation. - ambiguity has no owner because the problem is undefined. an unmade decision has an owner who is avoiding it - usually because it has a cost they do not want to carry. the move for the second case: make the cost of not deciding visible, propose a default, and set a date. \"unless i hear otherwise by friday, we are going with [x] \" resolves an enormous proportion of these, and it is legitimate as long as it is genuinely reversible."}, {"n": 187, "category": 12, "difficulty": "D", "html": "&quot;Tell me about a time the direction changed completely mid-project.&quot;", "answerTitle": "The direction changed completely", "answer": "<p>Focus on <strong>what you preserved and how fast you stopped<\/strong>, not on the disruption.<\/p><blockquote><p>&quot;<em>[N]<\/em> months in, <em>[the change - the acquisition, the strategy shift, the customer we were building for left]<\/em>. We stopped within <em>[days]<\/em>, which I think is the part that mattered - the instinct is to finish the sprint or to argue, and both are expensive. Then: what is salvageable (<em>[the components, the data model, the learning]<\/em>), what is genuinely wasted (<em>[be honest]<\/em>), and what does the new direction need that we now have that we would not otherwise.<\/p><\/blockquote><blockquote><p>The team part was harder than the technical part. I told them the same day, with the actual reason rather than a sanitized one, and I made sure the work they had done was written up and credited, because the worst outcome is people concluding that six months of their life evaporated.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "\"tell me about a time the direction changed completely mid-project.\" focus on what you preserved and how fast you stopped , not on the disruption. \" [n] months in, [the change - the acquisition, the strategy shift, the customer we were building for left] . we stopped within [days] , which i think is the part that mattered - the instinct is to finish the sprint or to argue, and both are expensive. then: what is salvageable ( [the components, the data model, the learning] ), what is genuinely wasted ( [be honest] ), and what does the new direction need that we now have that we would not otherwise. the team part was harder than the technical part. i told them the same day, with the actual reason rather than a sanitized one, and i made sure the work they had done was written up and credited, because the worst outcome is people concluding that six months of their life evaporated.\""}, {"n": 188, "category": 12, "difficulty": "D", "html": "How do you keep a team motivated through a change of direction you did not agree with?", "answerTitle": "Keeping a team motivated through a change you disagreed with", "answer": "<p>This is Q78 and Q87 applied to a team, and the honest answer is layered:<\/p><blockquote><p>&quot;I do not pretend to agree. What I do is separate three things: the decision, which is made and which I present as ours; my assessment, which I give honestly if asked - &#x27;I argued for the other one, here is why, and here is why the decision is defensible&#x27;; and the work, which we do properly.<\/p><\/blockquote><blockquote><p>What actually restores motivation is not enthusiasm from me, it is agency: I gave the team the parts of the new direction that were genuinely theirs to decide, and I got the first visible thing shipped quickly, because a team that is delivering recovers faster than a team being reassured.&quot;<\/p><\/blockquote><p><strong>The thing not to do<\/strong>, and worth naming: performing loyal enthusiasm. Engineers detect it instantly and it costs you the ability to be believed when you are sincere.<\/p>", "source": "answers.md", "search": "how do you keep a team motivated through a change of direction you did not agree with? this is q78 and q87 applied to a team, and the honest answer is layered: \"i do not pretend to agree. what i do is separate three things: the decision, which is made and which i present as ours; my assessment, which i give honestly if asked - 'i argued for the other one, here is why, and here is why the decision is defensible'; and the work, which we do properly. what actually restores motivation is not enthusiasm from me, it is agency: i gave the team the parts of the new direction that were genuinely theirs to decide, and i got the first visible thing shipped quickly, because a team that is delivering recovers faster than a team being reassured.\" the thing not to do , and worth naming: performing loyal enthusiasm. engineers detect it instantly and it costs you the ability to be believed when you are sincere."}, {"n": 189, "category": 12, "difficulty": "D", "html": "&quot;Describe starting something from nothing - no team, no precedent, no requirements.&quot;", "answerTitle": "Starting from nothing", "answer": "<ul><li><strong>Situation.<\/strong> No team, no precedent, no requirements - <em>[the AI work in 2024, or a new platform, or the first service in a domain]<\/em>. <em>[What existed: a sponsor, a budget, an intent.]<\/em><\/li><li><strong>Task.<\/strong> Get to something real, and to a decision about whether to continue, within <em>[the timeframe]<\/em>.<\/li><li><strong>Action.<\/strong> In order: found the first real user and the first real use case, rather than designing a platform; built the thinnest end-to-end thing that touched every layer, because the integration points are where the unknowns live; deliberately made throwaway choices in <em>[the areas]<\/em> and durable ones only in <em>[the area]<\/em>; wrote down the decisions and why, because in six months nobody remembers, including you; and got a second person involved early so it was never only in my head.<\/li><li><strong>Result.<\/strong> <em>[The outcome]<\/em>, <em>[the timeline]<\/em>, and <em>[what it became]<\/em>.<\/li><li><strong>Learning.<\/strong> The instinct on a blank page is to build the framework first. Every time I have done that, the framework was wrong, because you cannot see the shape of the problem until something is running end to end.<\/li><\/ul>", "source": "answers.md", "search": "\"describe starting something from nothing - no team, no precedent, no requirements.\" - situation. no team, no precedent, no requirements - [the ai work in 2024, or a new platform, or the first service in a domain] . [what existed: a sponsor, a budget, an intent.] - task. get to something real, and to a decision about whether to continue, within [the timeframe] . - action. in order: found the first real user and the first real use case, rather than designing a platform; built the thinnest end-to-end thing that touched every layer, because the integration points are where the unknowns live; deliberately made throwaway choices in [the areas] and durable ones only in [the area] ; wrote down the decisions and why, because in six months nobody remembers, including you; and got a second person involved early so it was never only in my head. - result. [the outcome] , [the timeline] , and [what it became] . - learning. the instinct on a blank page is to build the framework first. every time i have done that, the framework was wrong, because you cannot see the shape of the problem until something is running end to end."}, {"n": 190, "category": 12, "difficulty": "D", "html": "How do you set milestones for work whose shape you do not yet know?", "answerTitle": "Milestones for work whose shape you do not know", "answer": "<p>Use <strong>decision milestones and learning milestones<\/strong>, not delivery milestones. The mistake is committing to a date for an artifact whose definition will change.<\/p><table><thead><tr><th>Instead of<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>&quot;API complete by March&quot;<\/td><td>&quot;By March we will know whether <em>[the approach]<\/em> can hit <em>[the number]<\/em>, and we will have decided go or no-go&quot;<\/td><\/tr><tr><td>&quot;Phase 1 delivered in Q2&quot;<\/td><td>&quot;By end of Q2, one real user doing one real task end to end&quot;<\/td><\/tr><tr><td>A twelve-month plan<\/td><td>Three months planned in detail, the rest as intentions with a re-plan date<\/td><\/tr><\/tbody><\/table><p>Two more mechanisms: <strong>fixed time-boxes with variable scope<\/strong> - the date is certain, what is in it is not, which is the only honest commitment available for exploratory work - and <strong>explicit kill criteria at each milestone<\/strong>, agreed in advance so stopping is a normal outcome rather than a failure.<\/p><p>Say the communication half: stakeholders can accept &quot;we will know X by then&quot; if you say it up front. They cannot accept a delivery date that moves three times.<\/p>", "source": "answers.md", "search": "how do you set milestones for work whose shape you do not yet know? use decision milestones and learning milestones , not delivery milestones. the mistake is committing to a date for an artifact whose definition will change. instead of use --- --- \"api complete by march\" \"by march we will know whether [the approach] can hit [the number] , and we will have decided go or no-go\" \"phase 1 delivered in q2\" \"by end of q2, one real user doing one real task end to end\" a twelve-month plan three months planned in detail, the rest as intentions with a re-plan date two more mechanisms: fixed time-boxes with variable scope - the date is certain, what is in it is not, which is the only honest commitment available for exploratory work - and explicit kill criteria at each milestone , agreed in advance so stopping is a normal outcome rather than a failure. say the communication half: stakeholders can accept \"we will know x by then\" if you say it up front. they cannot accept a delivery date that moves three times."}, {"n": 191, "category": 12, "difficulty": "T", "html": "&quot;Tell me about a time you were the least experienced person in the room.&quot;", "answerTitle": "The least experienced person in the room", "answer": "<p>The competency is <strong>how you operate without status<\/strong>, and the good answers involve contributing something other than expertise.<\/p><blockquote><p>&quot;I was the only one in the room who had not worked in <em>[the domain]<\/em>, with people who had done it for fifteen years. What I did was ask the questions the others could not - the ones that come from not knowing why something is done that way. Two of them were naive and one of them turned out to matter: nobody could say why <em>[the constraint]<\/em> existed, and when we chased it, it had come from a system that had been decommissioned in <em>[year]<\/em>.<\/p><\/blockquote><blockquote><p>The other half was doing the unglamorous work well - I took the notes, I wrote up the decisions, I chased the actions. That is how you earn the right to have an opinion in a room like that, and it took about two months.&quot;<\/p><\/blockquote><p>Include what you did about the gap: what you read, who you asked, and how long before you were genuinely contributing on the substance.<\/p>", "source": "answers.md", "search": "\"tell me about a time you were the least experienced person in the room.\" the competency is how you operate without status , and the good answers involve contributing something other than expertise. \"i was the only one in the room who had not worked in [the domain] , with people who had done it for fifteen years. what i did was ask the questions the others could not - the ones that come from not knowing why something is done that way. two of them were naive and one of them turned out to matter: nobody could say why [the constraint] existed, and when we chased it, it had come from a system that had been decommissioned in [year] . the other half was doing the unglamorous work well - i took the notes, i wrote up the decisions, i chased the actions. that is how you earn the right to have an opinion in a room like that, and it took about two months.\" include what you did about the gap: what you read, who you asked, and how long before you were genuinely contributing on the substance."}, {"n": 192, "category": 12, "difficulty": "D", "html": "How do you handle joining an organization whose domain you do not know?", "answerTitle": "Joining an organization whose domain you do not know", "answer": "<p>The parallel to Q150 with the emphasis on domain rather than team:<\/p><ul><li><strong>Learn the money first.<\/strong> How the company makes it, who the customer is, what the unit is. Most domain confusion resolves once you understand what is being bought.<\/li><li><strong>Follow one transaction end to end<\/strong>, through every system, by hand. A day spent tracing one real order teaches more than a week of documentation.<\/li><li><strong>Sit with the operations or support people.<\/strong> They know the actual behaviour of the system, including the parts the documentation denies.<\/li><li><strong>Build a glossary and validate it.<\/strong> Domain terms overloaded across teams are the source of most cross-team misunderstanding, and being the person who wrote them down is quietly valuable.<\/li><li><strong>Ask the naive questions during the window<\/strong> where they are free - about the first six weeks - and say explicitly that you are using it.<\/li><li><strong>Do not propose architecture in month one.<\/strong> Domain-specific weirdness is usually load-bearing; a proposal that ignores it costs you credibility that takes a year to rebuild.<\/li><\/ul>", "source": "answers.md", "search": "how do you handle joining an organization whose domain you do not know? the parallel to q150 with the emphasis on domain rather than team: - learn the money first. how the company makes it, who the customer is, what the unit is. most domain confusion resolves once you understand what is being bought. - follow one transaction end to end , through every system, by hand. a day spent tracing one real order teaches more than a week of documentation. - sit with the operations or support people. they know the actual behaviour of the system, including the parts the documentation denies. - build a glossary and validate it. domain terms overloaded across teams are the source of most cross-team misunderstanding, and being the person who wrote them down is quietly valuable. - ask the naive questions during the window where they are free - about the first six weeks - and say explicitly that you are using it. - do not propose architecture in month one. domain-specific weirdness is usually load-bearing; a proposal that ignores it costs you credibility that takes a year to rebuild."}, {"n": 193, "category": 12, "difficulty": "D", "html": "&quot;Describe a time you had to learn something substantial fast in order to make a decision.&quot;", "answerTitle": "Learning something substantial fast", "answer": "<p>Choose the AI example if the role is AI-adjacent, and make the <strong>method<\/strong> the content rather than the subject.<\/p><blockquote><p>&quot;I needed to make a build-versus-buy decision on <em>[the retrieval stack]<\/em> in about <em>[weeks]<\/em>, with no prior depth. What I did: read enough to get the vocabulary and the shape of the trade-offs - a day; found the three people who had already done it, inside and outside the company, and asked them what they got wrong rather than what they chose; built the smallest thing that would expose the real constraint, which was <em>[the specific one - latency at our corpus size, or the permission model]<\/em>; and deliberately did not try to become expert in the parts the decision did not depend on.<\/p><\/blockquote><blockquote><p>The part I got wrong was <em>[the thing]<\/em>, and it cost <em>[the number]<\/em>, because I had not tested <em>[the assumption]<\/em>.&quot;<\/p><\/blockquote><p>The pattern to name: <strong>learn the decision, not the field.<\/strong> And be honest about the residual gap - claiming you became an expert in six weeks is worse than saying what you still do not know.<\/p>", "source": "answers.md", "search": "\"describe a time you had to learn something substantial fast in order to make a decision.\" choose the ai example if the role is ai-adjacent, and make the method the content rather than the subject. \"i needed to make a build-versus-buy decision on [the retrieval stack] in about [weeks] , with no prior depth. what i did: read enough to get the vocabulary and the shape of the trade-offs - a day; found the three people who had already done it, inside and outside the company, and asked them what they got wrong rather than what they chose; built the smallest thing that would expose the real constraint, which was [the specific one - latency at our corpus size, or the permission model] ; and deliberately did not try to become expert in the parts the decision did not depend on. the part i got wrong was [the thing] , and it cost [the number] , because i had not tested [the assumption] .\" the pattern to name: learn the decision, not the field. and be honest about the residual gap - claiming you became an expert in six weeks is worse than saying what you still do not know."}, {"n": 194, "category": 12, "difficulty": "A", "html": "What is your method for reducing ambiguity to a set of decidable questions, and where does it fail?", "answerTitle": "Reducing ambiguity to decidable questions", "answer": "<p>The method:<\/p><ol><li><strong>List every open question<\/strong>, without filtering, from every stakeholder.<\/li><li><strong>Sort by cost of being wrong<\/strong> - what does a wrong answer cost, and is it reversible?<\/li><li><strong>Discard the ones that do not change any decision.<\/strong> A large fraction of open questions are interesting rather than load-bearing, and this step is where most of the value is.<\/li><li><strong>For each remaining one, name the cheapest thing that would answer it<\/strong> - a spike, a conversation, a measurement, a prototype, or a decision that makes the question moot.<\/li><li><strong>Assign each a person and a date.<\/strong><\/li><li><strong>Decide the rest by default<\/strong>, in writing, reversibly.<\/li><\/ol><p><strong>Where it fails<\/strong>, and saying this is what makes it a real method rather than a recipe: it assumes the questions are knowable. Some ambiguity is about what people will <em>want<\/em>, and that cannot be resolved by analysis at all - only by putting something in front of them. It also fails when the real ambiguity is political, because the question &quot;who decides?&quot; does not appear on anyone&#x27;s list and is usually the binding one.<\/p>", "source": "answers.md", "search": "what is your method for reducing ambiguity to a set of decidable questions, and where does it fail? the method: 1. list every open question , without filtering, from every stakeholder. 2. sort by cost of being wrong - what does a wrong answer cost, and is it reversible? 3. discard the ones that do not change any decision. a large fraction of open questions are interesting rather than load-bearing, and this step is where most of the value is. 4. for each remaining one, name the cheapest thing that would answer it - a spike, a conversation, a measurement, a prototype, or a decision that makes the question moot. 5. assign each a person and a date. 6. decide the rest by default , in writing, reversibly. where it fails , and saying this is what makes it a real method rather than a recipe: it assumes the questions are knowable. some ambiguity is about what people will want , and that cannot be resolved by analysis at all - only by putting something in front of them. it also fails when the real ambiguity is political, because the question \"who decides?\" does not appear on anyone's list and is usually the binding one."}, {"n": 195, "category": 12, "difficulty": "A", "html": "How do you decide between exploring further and committing, and what signal ends the exploration?", "answerTitle": "Explore or commit", "answer": "<p>The signals that exploration should end:<\/p><ul><li><strong>The last two experiments did not change the decision.<\/strong> This is the clearest one: when new information stops moving your estimate, you are gathering comfort rather than data.<\/li><li><strong>The remaining unknowns are cheaper to discover by building<\/strong> than by investigating - which is usually true sooner than people think.<\/li><li><strong>The cost of delay now exceeds the cost of being wrong<\/strong>, including the option value of the decision. Say the arithmetic.<\/li><li><strong>The decision is reversible<\/strong> and the reversal cost is less than the remaining exploration cost. Then commit immediately; exploring a two-way door is waste.<\/li><\/ul><p>Set the boundary at the start rather than discovering it: <strong>a time-box with a decision date, and a statement of what you are trying to learn<\/strong>. And name the opposite failure too - committing before the one unknown that determines everything has been touched, which is how expensive rewrites start.<\/p><blockquote><p>&quot;The rule I use is that I decide on the date regardless, and the exploration is only there to make the decision better - not to make it certain. If I need certainty, I have chosen an architecture that is too expensive to be wrong about, and that is the thing to fix.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "how do you decide between exploring further and committing, and what signal ends the exploration? the signals that exploration should end: - the last two experiments did not change the decision. this is the clearest one: when new information stops moving your estimate, you are gathering comfort rather than data. - the remaining unknowns are cheaper to discover by building than by investigating - which is usually true sooner than people think. - the cost of delay now exceeds the cost of being wrong , including the option value of the decision. say the arithmetic. - the decision is reversible and the reversal cost is less than the remaining exploration cost. then commit immediately; exploring a two-way door is waste. set the boundary at the start rather than discovering it: a time-box with a decision date, and a statement of what you are trying to learn . and name the opposite failure too - committing before the one unknown that determines everything has been touched, which is how expensive rewrites start. \"the rule i use is that i decide on the date regardless, and the exploration is only there to make the decision better - not to make it certain. if i need certainty, i have chosen an architecture that is too expensive to be wrong about, and that is the thing to fix.\""}, {"n": 196, "category": 13, "difficulty": "C", "html": "&quot;Walk me through the most consequential technical decision you have made.&quot;", "answerTitle": "The most consequential technical decision", "answer": "<p><strong>Skeleton.<\/strong> Choose by consequence, not by cleverness - the decision whose effects are still visible.<\/p><ul><li><strong>Situation.<\/strong> <em>[The system]<\/em>, <em>[the scale]<\/em>, <em>[the fork in the road and what forced it]<\/em>.<\/li><li><strong>Task.<\/strong> I owned the decision. The reason it was consequential is <em>[the reversal cost - it defined the data model, it committed us to a vendor, it set the operating model for N teams]<\/em>.<\/li><li><strong>Action.<\/strong> The options were <em>[A]<\/em>, <em>[B]<\/em> and <em>[C]<\/em>. The dimension that decided it was <em>[the one that mattered - not the one most discussed]<\/em>, and the number was <em>[X]<\/em>. I rejected <em>[B]<\/em> because <em>[the mechanism]<\/em> and <em>[C]<\/em> because <em>[the cost]<\/em>. <em>[Named person]<\/em> disagreed, on the grounds of <em>[their point, fairly stated]<\/em>, and what resolved it was <em>[the experiment / the concession / the escalation]<\/em>.<\/li><li><strong>Result.<\/strong> <em>[Outcome with numbers]<\/em>. Second-order: <em>[what changed elsewhere]<\/em>.<\/li><li><strong>Learning.<\/strong> <em>[The rule]<\/em>, and the part I would change: <em>[the honest one]<\/em>.<\/li><\/ul><p><strong>Have the &quot;what would you do now&quot; answer ready<\/strong> - it is the guaranteed follow-up, and &quot;exactly the same&quot; is a weak answer at nineteen years.<\/p>", "source": "answers.md", "search": "\"walk me through the most consequential technical decision you have made.\" skeleton. choose by consequence, not by cleverness - the decision whose effects are still visible. - situation. [the system] , [the scale] , [the fork in the road and what forced it] . - task. i owned the decision. the reason it was consequential is [the reversal cost - it defined the data model, it committed us to a vendor, it set the operating model for n teams] . - action. the options were [a] , [b] and [c] . the dimension that decided it was [the one that mattered - not the one most discussed] , and the number was [x] . i rejected [b] because [the mechanism] and [c] because [the cost] . [named person] disagreed, on the grounds of [their point, fairly stated] , and what resolved it was [the experiment / the concession / the escalation] . - result. [outcome with numbers] . second-order: [what changed elsewhere] . - learning. [the rule] , and the part i would change: [the honest one] . have the \"what would you do now\" answer ready - it is the guaranteed follow-up, and \"exactly the same\" is a weak answer at nineteen years."}, {"n": 197, "category": 13, "difficulty": "D", "html": "How do you tell a build-versus-buy story so that the reasoning is portable rather than specific?", "answerTitle": "A portable build-versus-buy story", "answer": "<p>Make the <strong>decision criteria<\/strong> the content, so it transfers to the interviewer&#x27;s context rather than being a story about your vendor.<\/p><p>The criteria worth naming:<\/p><ul><li><strong>Is it differentiating?<\/strong> Build what customers buy you for; buy everything else. This is the first filter and it eliminates most candidates for building.<\/li><li><strong>Total cost over the horizon<\/strong>, not licence versus zero. Build includes maintenance, on-call, upgrades and the people who leave. A rule of thumb worth saying: the build cost is the smaller half.<\/li><li><strong>Time to value against the window.<\/strong> If the opportunity is this year, a nine-month build is not an option regardless of the economics.<\/li><li><strong>The exit.<\/strong> What does leaving cost, and can the data get out? This is the question most build-versus-buy analyses skip.<\/li><li><strong>The fit gap.<\/strong> Buying means adopting someone&#x27;s model. Quantify the workarounds; if the gap needs more than a thin adapter, the buy is a build with extra steps.<\/li><\/ul><blockquote><p>&quot;We bought <em>[X]<\/em> and built <em>[Y]<\/em>. The line was that <em>[Y]<\/em> encoded <em>[the thing that is actually our business]<\/em> and <em>[X]<\/em> did not. The cost was <em>[number]<\/em> against an estimated <em>[number]<\/em> to build, and the thing I insisted on was the export path, which we used two years later when we moved to <em>[Z]<\/em>.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "how do you tell a build-versus-buy story so that the reasoning is portable rather than specific? make the decision criteria the content, so it transfers to the interviewer's context rather than being a story about your vendor. the criteria worth naming: - is it differentiating? build what customers buy you for; buy everything else. this is the first filter and it eliminates most candidates for building. - total cost over the horizon , not licence versus zero. build includes maintenance, on-call, upgrades and the people who leave. a rule of thumb worth saying: the build cost is the smaller half. - time to value against the window. if the opportunity is this year, a nine-month build is not an option regardless of the economics. - the exit. what does leaving cost, and can the data get out? this is the question most build-versus-buy analyses skip. - the fit gap. buying means adopting someone's model. quantify the workarounds; if the gap needs more than a thin adapter, the buy is a build with extra steps. \"we bought [x] and built [y] . the line was that [y] encoded [the thing that is actually our business] and [x] did not. the cost was [number] against an estimated [number] to build, and the thing i insisted on was the export path, which we used two years later when we moved to [z] .\""}, {"n": 198, "category": 13, "difficulty": "D", "html": "&quot;Describe a migration you led.&quot; What must be in it beyond the technology?", "answerTitle": "A migration story, beyond the technology", "answer": "<p>What must be in it:<\/p><ul><li><strong>Why now<\/strong> - the forcing function. Migrations without one do not finish.<\/li><li><strong>The strategy decision<\/strong> and the alternative you refused: rehost then improve, strangle incrementally, or rewrite. Say which and why, with the date arithmetic (there is a worked version in <a href=\"../15-mock-interviews/scenario-questions.md\">../15-mock-interviews<\/a> S14).<\/li><li><strong>How you kept delivering<\/strong> during it, because a long migration with a feature freeze is a political failure waiting to happen.<\/li><li><strong>The cutover mechanics<\/strong>: rehearsals, go/no-go criteria agreed in advance, the rollback and whether it was ever tested.<\/li><li><strong>The people<\/strong>: who did not want to move, the integration owners you did not control, and how you got dates from them.<\/li><li><strong>The finish.<\/strong> The most common migration failure is the last 15 percent that never moves. Say what you did about it, or admit it is still there.<\/li><li><strong>Numbers<\/strong>: duration, cost before and after, incidents during, and what was decommissioned.<\/li><\/ul><p><strong>The decommissioning number is the one to lead with<\/strong>, because it proves the migration actually ended.<\/p>", "source": "answers.md", "search": "\"describe a migration you led.\" what must be in it beyond the technology? what must be in it: - why now - the forcing function. migrations without one do not finish. - the strategy decision and the alternative you refused: rehost then improve, strangle incrementally, or rewrite. say which and why, with the date arithmetic (there is a worked version in ../15-mock-interviews s14). - how you kept delivering during it, because a long migration with a feature freeze is a political failure waiting to happen. - the cutover mechanics : rehearsals, go/no-go criteria agreed in advance, the rollback and whether it was ever tested. - the people : who did not want to move, the integration owners you did not control, and how you got dates from them. - the finish. the most common migration failure is the last 15 percent that never moves. say what you did about it, or admit it is still there. - numbers : duration, cost before and after, incidents during, and what was decommissioned. the decommissioning number is the one to lead with , because it proves the migration actually ended."}, {"n": 199, "category": 13, "difficulty": "T", "html": "&quot;Tell me about a time you chose the boring solution and were right - and one where you were wrong.&quot;", "answerTitle": "The boring solution, right and wrong", "answer": "<p>Prepare <strong>both halves<\/strong>; the pair is what demonstrates judgement rather than a temperament.<\/p><p><em>Right:<\/em> <em>&quot;We used <\/em>[Postgres / a cron job / a monolith]<em> where the pressure was to use <\/em>[the fashionable thing]<em>. The reasoning was <\/em>[the concrete ceiling - our volume was N and the simple thing handles 50N]<em>. Three years later it is still fine and the operational cost has been roughly zero.&quot;<\/em><\/p><p><em>Wrong:<\/em> <em>&quot;I chose <\/em>[the conservative option]<em> for <\/em>[the case]<em>, and the signal I missed was <\/em>[the specific one - the access pattern was not what I assumed, the growth was in dimension X not Y]<em>. It cost us <\/em>[the number]<em> and a migration eighteen months later. The rule I took is <\/em>[the trigger that would have flagged it]<em>.&quot;<\/em><\/p><p>The close that ties them: <em>&quot;the boring choice is a default, not a principle. What I have learned to check is the one dimension where the workload is not ordinary - and if I cannot name that dimension, I have not understood the problem yet.&quot;<\/em><\/p>", "source": "answers.md", "search": "\"tell me about a time you chose the boring solution and were right - and one where you were wrong.\" prepare both halves ; the pair is what demonstrates judgement rather than a temperament. right: \"we used [postgres / a cron job / a monolith] where the pressure was to use [the fashionable thing] . the reasoning was [the concrete ceiling - our volume was n and the simple thing handles 50n] . three years later it is still fine and the operational cost has been roughly zero.\" wrong: \"i chose [the conservative option] for [the case] , and the signal i missed was [the specific one - the access pattern was not what i assumed, the growth was in dimension x not y] . it cost us [the number] and a migration eighteen months later. the rule i took is [the trigger that would have flagged it] .\" the close that ties them: \"the boring choice is a default, not a principle. what i have learned to check is the one dimension where the workload is not ordinary - and if i cannot name that dimension, i have not understood the problem yet.\""}, {"n": 200, "category": 13, "difficulty": "D", "html": "How do you describe a decision whose payoff arrived after you left the team?", "answerTitle": "A payoff that arrived after you left", "answer": "<p>Tell it as a <strong>design-for-succession<\/strong> story, because that is what makes it principal rather than nostalgic.<\/p><blockquote><p>&quot;I made the call in <em>[year]<\/em> and moved teams in <em>[year]<\/em>. The payoff - <em>[what happened]<\/em> - landed in <em>[year]<\/em>, and I was not there. What I did do was make sure it did not depend on me: the reasoning was written down, <em>[named person]<\/em> co-owned it from the start, and the mechanism was in the template rather than in anyone&#x27;s head. I know the outcome because <em>[how - they told me, it is public, I still talk to them]<\/em>.&quot;<\/p><\/blockquote><p>Two things being tested: whether you invest in things whose reward you will not collect, and whether you can be honest about attribution when someone else carried it. Give them credit explicitly - <em>&quot;most of the value came from what <\/em>[name]<em> did with it after&quot;<\/em> - which makes your part more credible, not less.<\/p>", "source": "answers.md", "search": "how do you describe a decision whose payoff arrived after you left the team? tell it as a design-for-succession story, because that is what makes it principal rather than nostalgic. \"i made the call in [year] and moved teams in [year] . the payoff - [what happened] - landed in [year] , and i was not there. what i did do was make sure it did not depend on me: the reasoning was written down, [named person] co-owned it from the start, and the mechanism was in the template rather than in anyone's head. i know the outcome because [how - they told me, it is public, i still talk to them] .\" two things being tested: whether you invest in things whose reward you will not collect, and whether you can be honest about attribution when someone else carried it. give them credit explicitly - \"most of the value came from what [name] did with it after\" - which makes your part more credible, not less."}, {"n": 201, "category": 13, "difficulty": "D", "html": "&quot;Tell me about deprecating something people were still using.&quot;", "answerTitle": "Deprecating something people still use", "answer": "<p>The sequence that works, and each step is there because skipping it causes a specific failure:<\/p><ol><li><strong>Know who uses it.<\/strong> Instrument first; the usage list is always wrong and the surprises are always the important ones.<\/li><li><strong>Have a migration path that is genuinely ready<\/strong>, with a working example. Deprecation without a destination is a request that will be refused.<\/li><li><strong>Announce with a date and repeat it<\/strong> - at announcement, at the halfway point, at two weeks, at the day. Assume everyone missed the first three.<\/li><li><strong>Do the first migrations yourself<\/strong>, especially for the biggest and the most reluctant users.<\/li><li><strong>Make the old path visibly worse, gently<\/strong> - a deprecation warning, no new features, a slower support path.<\/li><li><strong>Brownout before blackout.<\/strong> Turn it off for an hour, announced, then a day. This finds the users who did not respond, safely (Q63).<\/li><li><strong>Turn it off, and remove the code.<\/strong> A deprecation that leaves the code running is not finished, and it will be re-adopted.<\/li><\/ol><p><strong>The number:<\/strong> <em>&quot;from <\/em>[N]<em> consumers to zero in <\/em>[months]<em>, and the code is deleted.&qu
