ote><p>The other honest ending is that it did not resolve: they left, or their manager had to take it on. That is fine to say, as long as you have the reflection: what you would look for earlier, and the point at which you should have involved their manager.<\/p><p><strong>Do not describe the person as lacking ability.<\/strong> Describe what you misdiagnosed.<\/p>", "source": "answers.md", "search": "\"tell me about a mentee where it did not work out.\" have this one; it is a common follow-up and the absence of an example reads as either inexperience or spin. \" [person] and i worked on it for about [months] . i did [the things] , and it did not move. what i got wrong is that i had diagnosed a skills problem and it was a motivation problem - they did not want the role i was preparing them for and had not said so, partly because i had not asked. when i finally did, we had a different and much better conversation, and they moved to [a different track] where they have done well.\" the other honest ending is that it did not resolve: they left, or their manager had to take it on. that is fine to say, as long as you have the reflection: what you would look for earlier, and the point at which you should have involved their manager. do not describe the person as lacking ability. describe what you misdiagnosed."}, {"n": 137, "category": 9, "difficulty": "D", "html": "How do you describe mentoring someone more experienced than you, or in a different specialism?", "answerTitle": "Mentoring sideways or upward", "answer": "<p>The reframe: at principal level most of your development work is on peers and seniors, and it is not called mentoring. It is <strong>review, framing and giving them something they do not have<\/strong>.<\/p><blockquote><p>&quot;I would not have used the word mentoring - <em>[name]<\/em> had more experience than me in <em>[their domain]<\/em>. What I had was <em>[the thing - production operations, or the AI work, or how the client&#x27;s architecture group actually made decisions]<\/em>. So it was an exchange: I reviewed their designs for <em>[the specific angle]<\/em> and they taught me <em>[X]<\/em>. The concrete outcome is that they now run <em>[the thing]<\/em> without me.&quot;<\/p><\/blockquote><p>Key moves to show: <strong>ask permission implicitly by offering rather than instructing<\/strong>, be specific about the narrow area where you have an edge, and make the exchange two-way. The failure mode is a story where you condescended to a more senior person, and the interviewer will be listening for the tone rather than the facts.<\/p>", "source": "answers.md", "search": "how do you describe mentoring someone more experienced than you, or in a different specialism? the reframe: at principal level most of your development work is on peers and seniors, and it is not called mentoring. it is review, framing and giving them something they do not have . \"i would not have used the word mentoring - [name] had more experience than me in [their domain] . what i had was [the thing - production operations, or the ai work, or how the client's architecture group actually made decisions] . so it was an exchange: i reviewed their designs for [the specific angle] and they taught me [x] . the concrete outcome is that they now run [the thing] without me.\" key moves to show: ask permission implicitly by offering rather than instructing , be specific about the narrow area where you have an edge, and make the exchange two-way. the failure mode is a story where you condescended to a more senior person, and the interviewer will be listening for the tone rather than the facts."}, {"n": 138, "category": 9, "difficulty": "D", "html": "&quot;Describe how you delegated something you were better at than the person you gave it to.&quot;", "answerTitle": "Delegating something you were better at", "answer": "<p>This is a leverage question. The evidence is that you <strong>accepted a worse short-term outcome for a better long-term one, and said so up front<\/strong>.<\/p><blockquote><p>&quot;I could have done <em>[the thing]<\/em> in two days and it took <em>[name]<\/em> two weeks, and the first version was worse than mine would have been. I gave it away because I was the only person who could do it, which made it a risk rather than an achievement. What I did was define the outcome and the constraints, not the approach; agreed two checkpoints; and made myself available without reviewing between them. The one thing I kept was <em>[the irreversible decision]<\/em>.&quot;<\/p><\/blockquote><p>Then the result in leverage terms: <em>&quot;they have done <\/em>[N]<em> more since and I have reviewed none of them.&quot;<\/em> And the honest cost: <em>&quot;it did cost us about <\/em>[time]<em> on that delivery, which I had budgeted for and told <\/em>[the stakeholder]<em> about.&quot;<\/em><\/p>", "source": "answers.md", "search": "\"describe how you delegated something you were better at than the person you gave it to.\" this is a leverage question. the evidence is that you accepted a worse short-term outcome for a better long-term one, and said so up front . \"i could have done [the thing] in two days and it took [name] two weeks, and the first version was worse than mine would have been. i gave it away because i was the only person who could do it, which made it a risk rather than an achievement. what i did was define the outcome and the constraints, not the approach; agreed two checkpoints; and made myself available without reviewing between them. the one thing i kept was [the irreversible decision] .\" then the result in leverage terms: \"they have done [n] more since and i have reviewed none of them.\" and the honest cost: \"it did cost us about [time] on that delivery, which i had budgeted for and told [the stakeholder] about.\""}, {"n": 139, "category": 9, "difficulty": "D", "html": "How do you show you scale through others rather than through output?", "answerTitle": "Scaling through others rather than output", "answer": "<p>The four kinds of evidence, from weakest to strongest:<\/p><ol><li><strong>You delegated things.<\/strong> Necessary, unremarkable.<\/li><li><strong>People do things without you<\/strong> that previously required you - the review you no longer attend, the decision you no longer make.<\/li><li><strong>You built the mechanism that raises everyone<\/strong> - the template, the checklist, the training, the paved road. This is where a principal&#x27;s output mostly lives (Q64).<\/li><li><strong>People you developed are now developing others.<\/strong> Second-order growth, and it is the strongest available claim.<\/li><\/ol><p>Frame the story around the <strong>capacity created<\/strong>, not the work done: <em>&quot;three people can now take a design from problem to review without me, where a year ago it was one. The measurable version is that I am in <\/em>[N]<em> fewer meetings a week and design review throughput went from <\/em>[before]<em> to <\/em>[after]<em>.&quot;<\/em><\/p>", "source": "answers.md", "search": "how do you show you scale through others rather than through output? the four kinds of evidence, from weakest to strongest: 1. you delegated things. necessary, unremarkable. 2. people do things without you that previously required you - the review you no longer attend, the decision you no longer make. 3. you built the mechanism that raises everyone - the template, the checklist, the training, the paved road. this is where a principal's output mostly lives (q64). 4. people you developed are now developing others. second-order growth, and it is the strongest available claim. frame the story around the capacity created , not the work done: \"three people can now take a design from problem to review without me, where a year ago it was one. the measurable version is that i am in [n] fewer meetings a week and design review throughput went from [before] to [after] .\""}, {"n": 140, "category": 9, "difficulty": "T", "html": "What is the difference between mentoring, coaching, sponsoring and managing, and why does an interviewer care?", "answerTitle": "Mentoring, coaching, sponsoring, managing", "answer": "<table><thead><tr><th><\/th><th>What you supply<\/th><th>Typical failure<\/th><\/tr><\/thead><tbody><tr><td><strong>Mentoring<\/strong><\/td><td>Experience and answers, on request<\/td><td>Answering questions they should be working out<\/td><\/tr><tr><td><strong>Coaching<\/strong><\/td><td>Questions, not answers; they own the solution<\/td><td>Coaching someone who genuinely lacks the information<\/td><\/tr><tr><td><strong>Sponsoring<\/strong><\/td><td>Your credibility - putting their name forward, giving them the visible work<\/td><td>Doing it only for people like you<\/td><\/tr><tr><td><strong>Managing<\/strong><\/td><td>Direction, resources, the performance conversation<\/td><td>-<\/td><\/tr><\/tbody><\/table><p>The interviewer cares because they are different levers and choosing wrongly wastes both people&#x27;s time - and because <strong>sponsorship is the one most senior engineers never do<\/strong>, despite it being the highest-leverage.<\/p><p>The sentence that scores: <em>&quot;the shift that changed my mentoring was realizing that most of what a strong engineer needs from me is not advice, it is the room to do the visible piece of work and my name behind it when it is allocated.&quot;<\/em> Have an example of sponsorship - a person, a piece of work, the outcome.<\/p>", "source": "answers.md", "search": "what is the difference between mentoring, coaching, sponsoring and managing, and why does an interviewer care? what you supply typical failure --- --- --- mentoring experience and answers, on request answering questions they should be working out coaching questions, not answers; they own the solution coaching someone who genuinely lacks the information sponsoring your credibility - putting their name forward, giving them the visible work doing it only for people like you managing direction, resources, the performance conversation - the interviewer cares because they are different levers and choosing wrongly wastes both people's time - and because sponsorship is the one most senior engineers never do , despite it being the highest-leverage. the sentence that scores: \"the shift that changed my mentoring was realizing that most of what a strong engineer needs from me is not advice, it is the room to do the visible piece of work and my name behind it when it is allocated.\" have an example of sponsorship - a person, a piece of work, the outcome."}, {"n": 141, "category": 9, "difficulty": "D", "html": "&quot;Tell me about a difficult performance conversation.&quot; How do you answer without a manager title?", "answerTitle": "A difficult performance conversation without a manager title", "answer": "<p>You have had these; they were just not called that. Legitimate material: telling a senior engineer their design reviews were driving people away; telling a contractor their work was not at the level agreed; telling a peer their component was the reason the team was on call every weekend.<\/p><p><strong>Skeleton.<\/strong><\/p><ul><li><strong>Situation.<\/strong> <em>[The behaviour and its effect, with the observable]<\/em>.<\/li><li><strong>Task.<\/strong> Not my report. I had it because <em>[I was the tech lead / the effect was on my team / their manager was remote and had not seen it]<\/em> - and I told their manager I was going to.<\/li><li><strong>Action.<\/strong> Private, prompt, one behaviour, one impact, then a question and silence (Q93). I did not diagnose their motives and I did not stack three complaints.<\/li><li><strong>Result.<\/strong> <em>[What changed, over what period, and how I checked]<\/em>. Or, honestly: <em>[it did not, and I escalated to their manager with what I had already tried]<\/em>.<\/li><li><strong>Learning.<\/strong> <em>[Usually about timeliness - the third instance is too late, or about telling the manager in advance rather than afterwards.]<\/em><\/li><\/ul><p>The detail that reads as mature: <strong>you told their manager beforehand<\/strong>, so nobody was ambushed.<\/p>", "source": "answers.md", "search": "\"tell me about a difficult performance conversation.\" how do you answer without a manager title? you have had these; they were just not called that. legitimate material: telling a senior engineer their design reviews were driving people away; telling a contractor their work was not at the level agreed; telling a peer their component was the reason the team was on call every weekend. skeleton. - situation. [the behaviour and its effect, with the observable] . - task. not my report. i had it because [i was the tech lead / the effect was on my team / their manager was remote and had not seen it] - and i told their manager i was going to. - action. private, prompt, one behaviour, one impact, then a question and silence (q93). i did not diagnose their motives and i did not stack three complaints. - result. [what changed, over what period, and how i checked] . or, honestly: [it did not, and i escalated to their manager with what i had already tried] . - learning. [usually about timeliness - the third instance is too late, or about telling the manager in advance rather than afterwards.] the detail that reads as mature: you told their manager beforehand , so nobody was ambushed."}, {"n": 142, "category": 9, "difficulty": "D", "html": "How do you handle a story about a strong engineer with a bad effect on the team?", "answerTitle": "A strong engineer with a bad effect on the team", "answer": "<p>The principal-level position, and it should be stated plainly because it is what the question is testing:<\/p><blockquote><p>&quot;Net output is what matters, not individual output. If someone is producing at 150 percent and taking 30 percent off four other people, that is a net loss, and the fact that it is hard to see does not make it less true.&quot;<\/p><\/blockquote><p>Then the story, and the sequence: <strong>name the behaviour with specifics<\/strong> (not &quot;they are abrasive&quot; but &quot;in the last three reviews you opened with...&quot;), <strong>assume it is unintentional the first time<\/strong> because it usually is, <strong>give them a concrete alternative behaviour<\/strong>, and <strong>check for the cause<\/strong> - often frustration at something real, like a decision they think is wrong or work being allocated away from them.<\/p><p>Include the boundary: what you would do if it did not change. The honest answer at principal level involves their manager, and eventually the conclusion that the trade is not worth it - and being willing to say that out loud is the signal.<\/p>", "source": "answers.md", "search": "how do you handle a story about a strong engineer with a bad effect on the team? the principal-level position, and it should be stated plainly because it is what the question is testing: \"net output is what matters, not individual output. if someone is producing at 150 percent and taking 30 percent off four other people, that is a net loss, and the fact that it is hard to see does not make it less true.\" then the story, and the sequence: name the behaviour with specifics (not \"they are abrasive\" but \"in the last three reviews you opened with...\"), assume it is unintentional the first time because it usually is, give them a concrete alternative behaviour , and check for the cause - often frustration at something real, like a decision they think is wrong or work being allocated away from them. include the boundary: what you would do if it did not change. the honest answer at principal level involves their manager, and eventually the conclusion that the trade is not worth it - and being willing to say that out loud is the signal."}, {"n": 143, "category": 9, "difficulty": "D", "html": "&quot;Describe how you have raised the technical bar of a team.&quot;", "answerTitle": "Raising a team's technical bar", "answer": "<p>Distinguish <strong>standards<\/strong> from <strong>capability<\/strong>, because raising the bar by rejecting work makes the bar higher and the team no better.<\/p><p>Mechanisms that actually move it:<\/p><ul><li><strong>Make the standard visible and concrete<\/strong> - a checklist, a worked example, a good design document that people can copy. Most &quot;low bar&quot; problems are actually &quot;nobody has seen a good one&quot; problems.<\/li><li><strong>Review as teaching<\/strong>, with the reason attached to every comment, and the labels from Q95.<\/li><li><strong>Pair on the first instance<\/strong> of anything new, then get out.<\/li><li><strong>Change the defaults<\/strong> so the bar is met by the template rather than by discipline (Q71).<\/li><li><strong>Recruit above the current median<\/strong> for one or two roles, and let the effect propagate.<\/li><li><strong>Give the hard work to people who are not yet ready<\/strong>, with support, which is the only thing that actually grows capability.<\/li><\/ul><p>Evidence: defect escape rate, review turnaround, the number of people who can take a design to review, the proportion of changes needing rework. Pick one and have the before and after.<\/p>", "source": "answers.md", "search": "\"describe how you have raised the technical bar of a team.\" distinguish standards from capability , because raising the bar by rejecting work makes the bar higher and the team no better. mechanisms that actually move it: - make the standard visible and concrete - a checklist, a worked example, a good design document that people can copy. most \"low bar\" problems are actually \"nobody has seen a good one\" problems. - review as teaching , with the reason attached to every comment, and the labels from q95. - pair on the first instance of anything new, then get out. - change the defaults so the bar is met by the template rather than by discipline (q71). - recruit above the current median for one or two roles, and let the effect propagate. - give the hard work to people who are not yet ready , with support, which is the only thing that actually grows capability. evidence: defect escape rate, review turnaround, the number of people who can take a design to review, the proportion of changes needing rework. pick one and have the before and after."}, {"n": 144, "category": 9, "difficulty": "D", "html": "What does your interview process look like, and what signal do you personally own on a panel?", "answerTitle": "Your interviewing process and the signal you own", "answer": "<p>Answer as a designer of the process, not a participant:<\/p><blockquote><p>&quot;On a panel I take <em>[the round]<\/em> and I own one signal: <em>[for example, whether they can debug a system they did not build]<\/em>. I write the feedback before I talk to anyone else, and I write evidence rather than impressions - what they said, not how I felt about it. My bar for a hire is that I could point to one specific thing they said that I would not have expected from someone a level down.&quot;<\/p><\/blockquote><p>Add two things that show you have thought about the mechanics: how you avoid the obvious biases (a consistent question set, evidence-first notes, deciding before the debrief), and what you do with a candidate who is strong but not for this role. If you have designed a loop or a rubric, say so - that is a scoped organizational contribution.<\/p>", "source": "answers.md", "search": "what does your interview process look like, and what signal do you personally own on a panel? answer as a designer of the process, not a participant: \"on a panel i take [the round] and i own one signal: [for example, whether they can debug a system they did not build] . i write the feedback before i talk to anyone else, and i write evidence rather than impressions - what they said, not how i felt about it. my bar for a hire is that i could point to one specific thing they said that i would not have expected from someone a level down.\" add two things that show you have thought about the mechanics: how you avoid the obvious biases (a consistent question set, evidence-first notes, deciding before the debrief), and what you do with a candidate who is strong but not for this role. if you have designed a loop or a rubric, say so - that is a scoped organizational contribution."}, {"n": 145, "category": 9, "difficulty": "T", "html": "&quot;Have you ever argued to reject a candidate everyone else wanted to hire?&quot;", "answerTitle": "Arguing to reject a candidate everyone wanted", "answer": "<p>The question is about <strong>whether you will hold a bar under social pressure<\/strong>, and the good answer is specific and unemotional.<\/p><blockquote><p>&quot;Everyone had them as a strong hire on the technical rounds. My concern was one thing: in my round they described <em>[the specific behaviour - blaming a named colleague for an outage, or being unable to name a single thing they had got wrong]<\/em>. I said so in the debrief with the quote, and I said explicitly that I might be over-weighting one data point and asked whether anyone had seen the opposite. <em>[The outcome]<\/em>.&quot;<\/p><\/blockquote><p>Two details that make it credible: you brought <strong>evidence rather than a feeling<\/strong>, and you left room to be overruled. And be ready for the inverse question - &quot;have you ever been wrong about a rejection?&quot; - which is worth having an answer to.<\/p><p>If you have never done this, the honest version is the near-miss: the time you had the concern and did not raise it, and what happened.<\/p>", "source": "answers.md", "search": "\"have you ever argued to reject a candidate everyone else wanted to hire?\" the question is about whether you will hold a bar under social pressure , and the good answer is specific and unemotional. \"everyone had them as a strong hire on the technical rounds. my concern was one thing: in my round they described [the specific behaviour - blaming a named colleague for an outage, or being unable to name a single thing they had got wrong] . i said so in the debrief with the quote, and i said explicitly that i might be over-weighting one data point and asked whether anyone had seen the opposite. [the outcome] .\" two details that make it credible: you brought evidence rather than a feeling , and you left room to be overruled. and be ready for the inverse question - \"have you ever been wrong about a rejection?\" - which is worth having an answer to. if you have never done this, the honest version is the near-miss: the time you had the concern and did not raise it, and what happened."}, {"n": 146, "category": 9, "difficulty": "D", "html": "How do you onboard a senior hire, and what would you change about how you were onboarded?", "answerTitle": "Onboarding a senior hire", "answer": "<p>The specifics that separate a real answer from a generic one:<\/p><ul><li><strong>A first piece of work chosen deliberately<\/strong> - small enough to finish in two weeks, real enough to matter, and touching three or four parts of the system so the map builds itself.<\/li><li><strong>A named buddy<\/strong> who is not you and not their manager.<\/li><li><strong>Explicit permission and a deadline for questions<\/strong>: &quot;for the first month, ask anything; after that you will start being the person asked.&quot;<\/li><li><strong>The unwritten map<\/strong> - who actually decides things, which parts of the codebase are dangerous, which conversations are political. This is what senior hires need and almost never get.<\/li><li><strong>A thirty-day expectation set in writing<\/strong>, because senior hires damage themselves trying to demonstrate value in week two.<\/li><li><strong>Ask them what is strange.<\/strong> Their first month is the only time they can see your organization clearly, and capturing that is worth more than the onboarding itself.<\/li><\/ul><p>Close on what you would change about your own onboarding: usually that nobody told you how decisions were really made, and you learned it by getting one wrong.<\/p>", "source": "answers.md", "search": "how do you onboard a senior hire, and what would you change about how you were onboarded? the specifics that separate a real answer from a generic one: - a first piece of work chosen deliberately - small enough to finish in two weeks, real enough to matter, and touching three or four parts of the system so the map builds itself. - a named buddy who is not you and not their manager. - explicit permission and a deadline for questions : \"for the first month, ask anything; after that you will start being the person asked.\" - the unwritten map - who actually decides things, which parts of the codebase are dangerous, which conversations are political. this is what senior hires need and almost never get. - a thirty-day expectation set in writing , because senior hires damage themselves trying to demonstrate value in week two. - ask them what is strange. their first month is the only time they can see your organization clearly, and capturing that is worth more than the onboarding itself. close on what you would change about your own onboarding: usually that nobody told you how decisions were really made, and you learned it by getting one wrong."}, {"n": 147, "category": 9, "difficulty": "D", "html": "&quot;Tell me about building a team&#x27;s confidence after a bad quarter.&quot;", "answerTitle": "Rebuilding confidence after a bad quarter", "answer": "<p>The mechanism is <strong>a visible win and an honest account<\/strong>, in that order of importance but the reverse order of delivery.<\/p><blockquote><p>&quot;First I said out loud what had happened and what part of it was mine, because a team that thinks the leadership is pretending stops believing anything else. Then I did not launch a improvement programme - I found the smallest thing that had been annoying everyone for months, <em>[the specific thing]<\/em>, and we fixed it in a week. Then the next one. The point was to re-establish that we could finish things.&quot;<\/p><\/blockquote><p>Additional levers worth naming: protect them from the retrospective blame coming from outside; make progress visible to the people whose opinion the team cares about; and be careful about who leaves - one departure after a bad quarter is normal and two becomes a narrative.<\/p><p>Evidence it worked: delivery predictability, attrition, and the qualitative one that matters - people started disagreeing with you in meetings again.<\/p>", "source": "answers.md", "search": "\"tell me about building a team's confidence after a bad quarter.\" the mechanism is a visible win and an honest account , in that order of importance but the reverse order of delivery. \"first i said out loud what had happened and what part of it was mine, because a team that thinks the leadership is pretending stops believing anything else. then i did not launch a improvement programme - i found the smallest thing that had been annoying everyone for months, [the specific thing] , and we fixed it in a week. then the next one. the point was to re-establish that we could finish things.\" additional levers worth naming: protect them from the retrospective blame coming from outside; make progress visible to the people whose opinion the team cares about; and be careful about who leaves - one departure after a bad quarter is normal and two becomes a narrative. evidence it worked: delivery predictability, attrition, and the qualitative one that matters - people started disagreeing with you in meetings again."}, {"n": 148, "category": 9, "difficulty": "D", "html": "How do you describe growing a peer rather than a junior?", "answerTitle": "Growing a peer", "answer": "<p>The framing is <strong>reciprocity and specificity<\/strong>; see Q137 for the mechanics. What is different when it is a true peer:<\/p><ul><li>It is almost always <strong>an exchange<\/strong>, and saying so removes the condescension.<\/li><li>The most valuable thing you can give a peer is usually <strong>information rather than skill<\/strong> - how the decision got made, what the director actually cares about, why their proposal failed last time.<\/li><li><strong>Sponsorship matters more than advice<\/strong> (Q140): recommending them for the visible work, or naming them in a room they are not in.<\/li><li>Feedback between peers has to be <strong>asked for or offered<\/strong>, never delivered unbidden as a judgement.<\/li><\/ul><p>The strong close: <em>&quot;the outcome I would point to is that they got <\/em>[the role or the work]<em>, and the thing I did was <\/em>[the specific, small intervention]<em>, which is much less than it sounds.&quot;<\/em><\/p>", "source": "answers.md", "search": "how do you describe growing a peer rather than a junior? the framing is reciprocity and specificity ; see q137 for the mechanics. what is different when it is a true peer: - it is almost always an exchange , and saying so removes the condescension. - the most valuable thing you can give a peer is usually information rather than skill - how the decision got made, what the director actually cares about, why their proposal failed last time. - sponsorship matters more than advice (q140): recommending them for the visible work, or naming them in a room they are not in. - feedback between peers has to be asked for or offered , never delivered unbidden as a judgement. the strong close: \"the outcome i would point to is that they got [the role or the work] , and the thing i did was [the specific, small intervention] , which is much less than it sounds.\""}, {"n": 149, "category": 9, "difficulty": "A", "html": "Design a twelve-month growth plan for a senior engineer stalled on the way to staff.", "answerTitle": "A twelve-month plan for a stalled senior", "answer": "<p>Start with the diagnosis, because the plans differ entirely and prescribing before diagnosing is exactly the failure being tested.<\/p><table><thead><tr><th>Cause<\/th><th>What it looks like<\/th><th>The intervention<\/th><\/tr><\/thead><tbody><tr><td><strong>Scope<\/strong><\/td><td>Excellent work, all inside one team<\/td><td>Give them a problem that spans two teams, with sponsorship<\/td><\/tr><tr><td><strong>Visibility<\/strong><\/td><td>High impact, nobody outside knows<\/td><td>Make them present it; put their name on the document; stop presenting their work for them<\/td><\/tr><tr><td><strong>Influence<\/strong><\/td><td>Right, and cannot bring people<\/td><td>Coaching on the mechanics in Q65-Q71, with a live case<\/td><\/tr><tr><td><strong>Depth<\/strong><\/td><td>Broad and shallow<\/td><td>A domain to own end to end, including operationally<\/td><\/tr><tr><td><strong>Motivation<\/strong><\/td><td>They do not want it<\/td><td>Say so honestly, and stop<\/td><\/tr><\/tbody><\/table><p>Then the plan, roughly: a written definition of what the next level looks like <em>in this organization<\/em> with two examples; one significant piece of work chosen for the missing dimension; a monthly review against evidence rather than feelings; a visible platform; and a checkpoint at month six where you say honestly whether it is on track.<\/p><p><strong>The part most candidates miss:<\/strong> the plan must include what <em>you<\/em> will stop doing - the reviews you will not attend, the decisions you will hand over - because otherwise there is no room for them to grow into.<\/p>", "source": "answers.md", "search": "design a twelve-month growth plan for a senior engineer stalled on the way to staff. start with the diagnosis, because the plans differ entirely and prescribing before diagnosing is exactly the failure being tested. cause what it looks like the intervention --- --- --- scope excellent work, all inside one team give them a problem that spans two teams, with sponsorship visibility high impact, nobody outside knows make them present it; put their name on the document; stop presenting their work for them influence right, and cannot bring people coaching on the mechanics in q65-q71, with a live case depth broad and shallow a domain to own end to end, including operationally motivation they do not want it say so honestly, and stop then the plan, roughly: a written definition of what the next level looks like in this organization with two examples; one significant piece of work chosen for the missing dimension; a monthly review against evidence rather than feelings; a visible platform; and a checkpoint at month six where you say honestly whether it is on track. the part most candidates miss: the plan must include what you will stop doing - the reviews you will not attend, the decisions you will hand over - because otherwise there is no room for them to grow into."}, {"n": 150, "category": 9, "difficulty": "A", "html": "What would you do in your first ninety days leading a team of engineers you did not choose?", "answerTitle": "First ninety days with a team you did not choose", "answer": "<p><strong>Days 1-30: understand, and change almost nothing.<\/strong><\/p><ul><li>One-to-ones with everyone, with the same four questions: what should we keep, what is broken, what would you fix, and what do you want to be doing in a year.<\/li><li>Read the last six months of incidents, the last quarter of retrospectives, and the actual delivery record against what was promised.<\/li><li>Get the numbers: lead time, change failure rate, page volume, cost, the top three sources of unplanned work.<\/li><li>Ship one small thing yourself, to establish that you can still do the job and to learn the toolchain the hard way.<\/li><\/ul><p><strong>Days 30-60: one visible fix and a stated direction.<\/strong><\/p><ul><li>Pick the thing that appeared in most of the one-to-ones and fix it, with the team, quickly. Credibility before strategy.<\/li><li>Write down what you have learned and what you intend, circulate it, and invite correction. Being wrong in writing early is cheaper than being wrong for a year.<\/li><li>Start the two conversations that need time: the underperformer, and the person who is quietly the single point of failure.<\/li><\/ul><p><strong>Days 60-90: the plan, and the first hard decision.<\/strong><\/p><ul><li>A twelve-month direction with two or three outcomes, tied to what the business needs, agreed with your manager.<\/li><li>Make one decision that will not be universally popular, because a leader who has made none in ninety days is not yet leading.<\/li><li>Say what you will not do this year, explicitly.<\/li><\/ul><p><strong>What to avoid, and worth saying out loud:<\/strong> reorganizing in month one, importing the practices from your last company wholesale, and criticizing your predecessor. All three are common and all three are expensive.<\/p>", "source": "answers.md", "search": "what would you do in your first ninety days leading a team of engineers you did not choose? days 1-30: understand, and change almost nothing. - one-to-ones with everyone, with the same four questions: what should we keep, what is broken, what would you fix, and what do you want to be doing in a year. - read the last six months of incidents, the last quarter of retrospectives, and the actual delivery record against what was promised. - get the numbers: lead time, change failure rate, page volume, cost, the top three sources of unplanned work. - ship one small thing yourself, to establish that you can still do the job and to learn the toolchain the hard way. days 30-60: one visible fix and a stated direction. - pick the thing that appeared in most of the one-to-ones and fix it, with the team, quickly. credibility before strategy. - write down what you have learned and what you intend, circulate it, and invite correction. being wrong in writing early is cheaper than being wrong for a year. - start the two conversations that need time: the underperformer, and the person who is quietly the single point of failure. days 60-90: the plan, and the first hard decision. - a twelve-month direction with two or three outcomes, tied to what the business needs, agreed with your manager. - make one decision that will not be universally popular, because a leader who has made none in ninety days is not yet leading. - say what you will not do this year, explicitly. what to avoid, and worth saying out loud: reorganizing in month one, importing the practices from your last company wholesale, and criticizing your predecessor. all three are common and all three are expensive."}, {"n": 151, "category": 10, "difficulty": "C", "html": "&quot;Explain a complex technical decision to a non-technical executive.&quot; Do it now, with a real one.", "answerTitle": "Explaining a technical decision to a non-technical executive", "answer": "<p>The structure: <strong>decision, business consequence, cost, what you need from them.<\/strong> No mechanism unless asked.<\/p><blockquote><p>&quot;We are going to run the AI feature on a smaller model with a retrieval step in front of it, rather than the largest model. In business terms: answers are about as good on our questions, it costs roughly <em>[fraction]<\/em> per query, and it means we can offer it to all customers instead of the top tier. The trade is that we have to maintain the search index, which is about <em>[the ongoing cost]<\/em>. I do not need a decision - I want you to know the quality bar is set at <em>[the measure]<\/em>, and if that is too low for <em>[the segment]<\/em> we should talk now.&quot;<\/p><\/blockquote><p>Rules: <strong>no analogies unless they are exact<\/strong> (a bad analogy invites a bad decision), no jargon including the words you think are common, one number, and an explicit statement of whether you are informing or asking. Executives are interrupted constantly; the first sentence is the whole message.<\/p>", "source": "answers.md", "search": "\"explain a complex technical decision to a non-technical executive.\" do it now, with a real one. the structure: decision, business consequence, cost, what you need from them. no mechanism unless asked. \"we are going to run the ai feature on a smaller model with a retrieval step in front of it, rather than the largest model. in business terms: answers are about as good on our questions, it costs roughly [fraction] per query, and it means we can offer it to all customers instead of the top tier. the trade is that we have to maintain the search index, which is about [the ongoing cost] . i do not need a decision - i want you to know the quality bar is set at [the measure] , and if that is too low for [the segment] we should talk now.\" rules: no analogies unless they are exact (a bad analogy invites a bad decision), no jargon including the words you think are common, one number, and an explicit statement of whether you are informing or asking. executives are interrupted constantly; the first sentence is the whole message."}, {"n": 152, "category": 10, "difficulty": "D", "html": "What is the structure of an executive update, and how does it differ from a technical one?", "answerTitle": "Executive update versus technical update", "answer": "<table><thead><tr><th><\/th><th>Technical<\/th><th>Executive<\/th><\/tr><\/thead><tbody><tr><td>Opens with<\/td><td>Context<\/td><td>The conclusion or the ask<\/td><\/tr><tr><td>Content<\/td><td>How it works<\/td><td>What it means, in money, time or risk<\/td><\/tr><tr><td>Detail<\/td><td>As deep as needed<\/td><td>One level, with more available<\/td><\/tr><tr><td>Uncertainty<\/td><td>Ranges and caveats<\/td><td>A number with a confidence, and what would change it<\/td><\/tr><tr><td>Length<\/td><td>As long as required<\/td><td>One page, or ninety seconds<\/td><\/tr><tr><td>Ends with<\/td><td>Next steps<\/td><td>The decision needed, from whom, by when<\/td><\/tr><\/tbody><\/table><p>The single most useful discipline: <strong>lead with the answer<\/strong>. Engineers are trained to build to a conclusion; executives read the first line and skim the rest, so a message whose point arrives in paragraph four has not been delivered.<\/p><p>Second: <strong>say what you need<\/strong>. A large fraction of engineering updates to executives contain no ask, which means the reader has to work out what to do with them.<\/p>", "source": "answers.md", "search": "what is the structure of an executive update, and how does it differ from a technical one? technical executive --- --- --- opens with context the conclusion or the ask content how it works what it means, in money, time or risk detail as deep as needed one level, with more available uncertainty ranges and caveats a number with a confidence, and what would change it length as long as required one page, or ninety seconds ends with next steps the decision needed, from whom, by when the single most useful discipline: lead with the answer . engineers are trained to build to a conclusion; executives read the first line and skim the rest, so a message whose point arrives in paragraph four has not been delivered. second: say what you need . a large fraction of engineering updates to executives contain no ask, which means the reader has to work out what to do with them."}, {"n": 153, "category": 10, "difficulty": "D", "html": "How do you deliver bad news to a stakeholder, and what makes the difference between early and late?", "answerTitle": "Delivering bad news", "answer": "<p>The rule is <strong>early, complete, with options, and never twice-degraded<\/strong>.<\/p><ul><li><strong>Early<\/strong> means as soon as you believe it, not once you have a plan. &quot;I think we have a problem, I will have options in two days&quot; is a complete message.<\/li><li><strong>Complete<\/strong> means the whole of it. A problem that gets worse each week destroys trust far more than a big one delivered once - after the second downgrade nobody believes any of your numbers.<\/li><li><strong>Options with costs<\/strong>, and a recommendation. Bad news with no options is a request for rescue.<\/li><li><strong>No surprises in public.<\/strong> Whoever will be asked about it hears it from you first, privately.<\/li><\/ul><blockquote><p>&quot;I told <em>[the stakeholder]<\/em> on the Tuesday, three days after I first suspected it, with &#x27;here is what I know, here is what I do not, here is what I am doing to find out, and I will update you Friday whether or not I know more.&#x27;&quot;<\/p><\/blockquote><p>Contrast it with the case you got wrong (Q113) - that pairing is the strongest version of this answer.<\/p>", "source": "answers.md", "search": "how do you deliver bad news to a stakeholder, and what makes the difference between early and late? the rule is early, complete, with options, and never twice-degraded . - early means as soon as you believe it, not once you have a plan. \"i think we have a problem, i will have options in two days\" is a complete message. - complete means the whole of it. a problem that gets worse each week destroys trust far more than a big one delivered once - after the second downgrade nobody believes any of your numbers. - options with costs , and a recommendation. bad news with no options is a request for rescue. - no surprises in public. whoever will be asked about it hears it from you first, privately. \"i told [the stakeholder] on the tuesday, three days after i first suspected it, with 'here is what i know, here is what i do not, here is what i am doing to find out, and i will update you friday whether or not i know more.'\" contrast it with the case you got wrong (q113) - that pairing is the strongest version of this answer."}, {"n": 154, "category": 10, "difficulty": "T", "html": "&quot;Tell me about a time you had to say no to an executive.&quot;", "answerTitle": "Saying no to an executive", "answer": "<p>You rarely say &quot;no&quot;. You say <strong>&quot;yes, and here is what it costs&quot;<\/strong>, or you convert it into a choice they own.<\/p><blockquote><p>&quot;<em>[The executive]<\/em> wanted <em>[the thing]<\/em> by <em>[the date]<\/em>. I said: &#x27;We can do that. It means <em>[the named project]<\/em> stops for six weeks, and I would need <em>[the two people]<\/em> off <em>[the other thing]<\/em>. My recommendation is not to, because <em>[the reason in their terms]<\/em> - but it is your call and I will do it either way if you want it.&#x27;&quot;<\/p><\/blockquote><p>Why it works: it takes the request seriously, it makes the real currency visible (capacity, not willingness), and it puts the decision where it belongs. The failure modes are the flat no (which reads as an engineer protecting their patch) and the silent yes (which is worse, because the cost is paid invisibly by other commitments).<\/p><p>Add the case where the answer had to be an actual no - safety, legality, a commitment already made to a customer - and how you delivered it (Q223).<\/p>", "source": "answers.md", "search": "\"tell me about a time you had to say no to an executive.\" you rarely say \"no\". you say \"yes, and here is what it costs\" , or you convert it into a choice they own. \" [the executive] wanted [the thing] by [the date] . i said: 'we can do that. it means [the named project] stops for six weeks, and i would need [the two people] off [the other thing] . my recommendation is not to, because [the reason in their terms] - but it is your call and i will do it either way if you want it.'\" why it works: it takes the request seriously, it makes the real currency visible (capacity, not willingness), and it puts the decision where it belongs. the failure modes are the flat no (which reads as an engineer protecting their patch) and the silent yes (which is worse, because the cost is paid invisibly by other commitments). add the case where the answer had to be an actual no - safety, legality, a commitment already made to a customer - and how you delivered it (q223)."}, {"n": 155, "category": 10, "difficulty": "D", "html": "How do you present options rather than a single recommendation, without abdicating the decision?", "answerTitle": "Options without abdicating", "answer": "<p>Two or three options, never five. For each: <strong>what it costs, what you get, what you risk<\/strong>. Then a clear recommendation and the reason, in one sentence.<\/p><blockquote><p>&quot;Three ways to go. One: <em>[X]<\/em>, six weeks, cheapest, and we carry <em>[the risk]<\/em> for a year. Two: <em>[Y]<\/em>, four months, removes the risk, and <em>[the other project]<\/em> slips. Three: <em>[Z]<\/em>, which I am including because it will be suggested - it is faster but it locks us into <em>[the vendor]<\/em> and I do not recommend it. I would take one, because <em>[the reason]<\/em>, and I would revisit in <em>[timeframe]<\/em> if <em>[the condition]<\/em>.&quot;<\/p><\/blockquote><p>The abdication failure is presenting options with no recommendation, which reads as unwillingness to own a judgement. The opposite failure is presenting one option with two strawmen - transparent, and it costs you the next decision as well. Include the third option you do not recommend but that will be raised anyway; pre-empting it saves the meeting.<\/p>", "source": "answers.md", "search": "how do you present options rather than a single recommendation, without abdicating the decision? two or three options, never five. for each: what it costs, what you get, what you risk . then a clear recommendation and the reason, in one sentence. \"three ways to go. one: [x] , six weeks, cheapest, and we carry [the risk] for a year. two: [y] , four months, removes the risk, and [the other project] slips. three: [z] , which i am including because it will be suggested - it is faster but it locks us into [the vendor] and i do not recommend it. i would take one, because [the reason] , and i would revisit in [timeframe] if [the condition] .\" the abdication failure is presenting options with no recommendation, which reads as unwillingness to own a judgement. the opposite failure is presenting one option with two strawmen - transparent, and it costs you the next decision as well. include the third option you do not recommend but that will be raised anyway; pre-empting it saves the meeting."}, {"n": 156, "category": 10, "difficulty": "D", "html": "&quot;Describe a time you had to translate a business requirement into an architecture, and push back on part of it.&quot;", "answerTitle": "Translating a business requirement, and pushing back on part of it", "answer": "<p>The move is to <strong>separate the requirement from the solution embedded in it<\/strong>, which is where most bad requirements hide.<\/p><blockquote><p>&quot;The ask was &#x27;we need real-time reporting&#x27;. The question I asked was what decision the report supports and how quickly it has to change behaviour. The answer was that <em>[the ops team]<\/em> checks it twice a day. So the requirement was actually &#x27;fresh within a few hours, and reliable&#x27;, and that is a completely different system - it removed the streaming pipeline and about <em>[the cost]<\/em> from the design. Where I did push back is <em>[the part that was genuinely needed and expensive]<\/em>: I said we could do it, and what it would cost, and asked them to confirm it was worth that.&quot;<\/p><\/blockquote><p>The pattern to name: <strong>ask what decision the requirement supports.<\/strong> It is the single most useful question in stakeholder work, and it makes for a portable answer.<\/p>", "source": "answers.md", "search": "\"describe a time you had to translate a business requirement into an architecture, and push back on part of it.\" the move is to separate the requirement from the solution embedded in it , which is where most bad requirements hide. \"the ask was 'we need real-time reporting'. the question i asked was what decision the report supports and how quickly it has to change behaviour. the answer was that [the ops team] checks it twice a day. so the requirement was actually 'fresh within a few hours, and reliable', and that is a completely different system - it removed the streaming pipeline and about [the cost] from the design. where i did push back is [the part that was genuinely needed and expensive] : i said we could do it, and what it would cost, and asked them to confirm it was worth that.\" the pattern to name: ask what decision the requirement supports. it is the single most useful question in stakeholder work, and it makes for a portable answer."}, {"n": 157, "category": 10, "difficulty": "D", "html": "How do you talk about cost and risk to someone who does not want to hear about either?", "answerTitle": "Talking about cost and risk to someone who does not want to hear it", "answer": "<p>Three reframes, and pick by audience:<\/p><ul><li><strong>Cost as a choice, not a complaint.<\/strong> Not &quot;this is expensive&quot; but &quot;this costs <em>[X]<\/em> a year; here is the <em>[Y]<\/em> version and what we lose.&quot;<\/li><li><strong>Risk as a probability with a price<\/strong>, on their timeline. &quot;There is maybe a one in three chance of a day&#x27;s outage in the next year; a day costs us <em>[the number]<\/em>. Removing it costs <em>[the number]<\/em>.&quot; That is a business conversation, not an engineering worry.<\/li><li><strong>Tie it to something they already own<\/strong> - the quarterly commitment, the customer, the audit, the renewal.<\/li><\/ul><p>And the rule about frequency: <strong>raise it once, properly and in writing, then manage it<\/strong>. An engineer who raises risk continuously gets filtered out; one who raised it once with a number and a mitigation gets believed when it happens. Say what you did when they chose to accept the risk: you documented the acceptance, and you built the detection so it would not be a surprise.<\/p>", "source": "answers.md", "search": "how do you talk about cost and risk to someone who does not want to hear about either? three reframes, and pick by audience: - cost as a choice, not a complaint. not \"this is expensive\" but \"this costs [x] a year; here is the [y] version and what we lose.\" - risk as a probability with a price , on their timeline. \"there is maybe a one in three chance of a day's outage in the next year; a day costs us [the number] . removing it costs [the number] .\" that is a business conversation, not an engineering worry. - tie it to something they already own - the quarterly commitment, the customer, the audit, the renewal. and the rule about frequency: raise it once, properly and in writing, then manage it . an engineer who raises risk continuously gets filtered out; one who raised it once with a number and a mitigation gets believed when it happens. say what you did when they chose to accept the risk: you documented the acceptance, and you built the detection so it would not be a surprise."}, {"n": 158, "category": 10, "difficulty": "T", "html": "The executive asks for a date and you do not have one. What do you say?", "answerTitle": "They want a date and you do not have one", "answer": "<p>Never say &quot;I cannot give you a date.&quot; Give the shape of an answer instead:<\/p><blockquote><p>&quot;I can give you three things now. I am confident it is not before <em>[date]<\/em> and I would be surprised if it were after <em>[date]<\/em>. The thing that determines where in that range it lands is <em>[the specific unknown]<\/em>. I can have that resolved by <em>[date]<\/em>, and then I will give you a date I will stand behind. If you need a commitment today, I can commit to <em>[the reduced scope]<\/em> on <em>[the date]<\/em>.&quot;<\/p><\/blockquote><p>The components: <strong>a range with the confidence stated, the named unknown, a date for the date, and a fallback commitment.<\/strong> That last one is what stops the conversation becoming a negotiation about your willingness.<\/p><p><strong>What loses trust:<\/strong> a precise date you do not believe, in order to end the conversation. It buys three weeks and costs the relationship.<\/p>", "source": "answers.md", "search": "the executive asks for a date and you do not have one. what do you say? never say \"i cannot give you a date.\" give the shape of an answer instead: \"i can give you three things now. i am confident it is not before [date] and i would be surprised if it were after [date] . the thing that determines where in that range it lands is [the specific unknown] . i can have that resolved by [date] , and then i will give you a date i will stand behind. if you need a commitment today, i can commit to [the reduced scope] on [the date] .\" the components: a range with the confidence stated, the named unknown, a date for the date, and a fallback commitment. that last one is what stops the conversation becoming a negotiation about your willingness. what loses trust: a precise date you do not believe, in order to end the conversation. it buys three weeks and costs the relationship."}, {"n": 159, "category": 10, "difficulty": "D", "html": "&quot;Tell me about a time a stakeholder changed the requirements late.&quot;", "answerTitle": "Requirements changed late", "answer": "<p>Avoid the complaint framing entirely. Late change is normal; the question is whether your process and your architecture assumed it would not happen.<\/p><blockquote><p>&quot;In week <em>[N]<\/em> of <em>[N]<\/em> they added <em>[the requirement]<\/em>. My first question was what had changed on their side, because the answer determines whether this is a new fact or a preference - it turned out <em>[the regulator / the customer / the competitor]<\/em>, which made it real. Then we treated it as a trade rather than an addition: it costs <em>[the estimate]<\/em>, so what comes out? They chose <em>[what]<\/em>. What I should have done earlier is <em>[the design decision that would have made the change cheap]<\/em>, and the reason I did not is <em>[honest]<\/em>.&quot;<\/p><\/blockquote><p>The two signals: <strong>you asked why<\/strong>, and <strong>you made it a trade rather than absorbing it<\/strong>. Silently absorbing late scope is the single most common way a delivery becomes a crunch (Q130).<\/p>", "source": "answers.md", "search": "\"tell me about a time a stakeholder changed the requirements late.\" avoid the complaint framing entirely. late change is normal; the question is whether your process and your architecture assumed it would not happen. \"in week [n] of [n] they added [the requirement] . my first question was what had changed on their side, because the answer determines whether this is a new fact or a preference - it turned out [the regulator / the customer / the competitor] , which made it real. then we treated it as a trade rather than an addition: it costs [the estimate] , so what comes out? they chose [what] . what i should have done earlier is [the design decision that would have made the change cheap] , and the reason i did not is [honest] .\" the two signals: you asked why , and you made it a trade rather than absorbing it . silently absorbing late scope is the single most common way a delivery becomes a crunch (q130)."}, {"n": 160, "category": 10, "difficulty": "D", "html": "How do you handle a stakeholder who goes around you to your team?", "answerTitle": "A stakeholder who goes around you to your team", "answer": "<p>Address the mechanism, not the etiquette. Getting indignant about the channel is a status response and reads badly.<\/p><blockquote><p>&quot;The first thing was to find out why: it turned out they needed answers in hours and I was replying in days, so going direct was rational. So I fixed my side - a standing fifteen minutes twice a week, and a channel where anything urgent gets a same-day answer. Then I asked the team to route anything that changes priorities to me, and to answer anything that is just a question. The line is not who talks to whom, it is who commits capacity.&quot;<\/p><\/blockquote><p>That last sentence is the whole answer: <strong>direct access is fine, direct commitment is not.<\/strong> Add the protection for the team: an engineer should never be in the position of having to say no to a director on their own.<\/p>", "source": "answers.md", "search": "how do you handle a stakeholder who goes around you to your team? address the mechanism, not the etiquette. getting indignant about the channel is a status response and reads badly. \"the first thing was to find out why: it turned out they needed answers in hours and i was replying in days, so going direct was rational. so i fixed my side - a standing fifteen minutes twice a week, and a channel where anything urgent gets a same-day answer. then i asked the team to route anything that changes priorities to me, and to answer anything that is just a question. the line is not who talks to whom, it is who commits capacity.\" that last sentence is the whole answer: direct access is fine, direct commitment is not. add the protection for the team: an engineer should never be in the position of having to say no to a director on their own."}, {"n": 161, "category": 10, "difficulty": "D", "html": "&quot;Describe how you have communicated a multi-quarter technical investment with no visible feature output.&quot;", "answerTitle": "Selling a multi-quarter investment with no visible output", "answer": "<p>Four techniques, and the first two are the ones that actually work:<\/p><ol><li><strong>Attach it to something they already want.<\/strong> Pure platform investment loses to features every time. Platform investment framed as &quot;this is what makes <em>[the committed thing]<\/em> possible in Q3&quot; wins.<\/li><li><strong>Make the status quo&#x27;s cost visible and recurring.<\/strong> Not &quot;our deployment process is bad&quot; but &quot;we spend <em>[N]<\/em> engineer-days a month on release toil and it is growing; that is <em>[people]<\/em> worth of capacity.&quot;<\/li><li><strong>Deliver in slices with visible outcomes.<\/strong> A twelve-month project with a big-bang result will be cancelled in month seven; the same work as four quarterly outcomes will not.<\/li><li><strong>Report on the same axis every time<\/strong> - one chart, the same one, every month. Consistency is what makes progress legible to someone who thinks about it for four minutes a quarter.<\/li><\/ol><p>Close with the honest failure: <em>&quot;the version of this I got wrong was pitching it as technical debt reduction. Nobody outside engineering has ever funded that phrase.&quot;<\/em><\/p>", "source": "answers.md", "search": "\"describe how you have communicated a multi-quarter technical investment with no visible feature output.\" four techniques, and the first two are the ones that actually work: 1. attach it to something they already want. pure platform investment loses to features every time. platform investment framed as \"this is what makes [the committed thing] possible in q3\" wins. 2. make the status quo's cost visible and recurring. not \"our deployment process is bad\" but \"we spend [n] engineer-days a month on release toil and it is growing; that is [people] worth of capacity.\" 3. deliver in slices with visible outcomes. a twelve-month project with a big-bang result will be cancelled in month seven; the same work as four quarterly outcomes will not. 4. report on the same axis every time - one chart, the same one, every month. consistency is what makes progress legible to someone who thinks about it for four minutes a quarter. close with the honest failure: \"the version of this i got wrong was pitching it as technical debt reduction. nobody outside engineering has ever funded that phrase.\""}, {"n": 162, "category": 10, "difficulty": "T", "html": "How do you describe a situation where the business decision went against your technical advice and turned out fine?", "answerTitle": "The business went against your advice and it was fine", "answer": "<p>Answer it straight, and the value is in the recalibration.<\/p><blockquote><p>&quot;They shipped on the date and my concerns did not materialize. Two things were true: I had over-weighted <em>[the risk]<\/em> because I had been burned by it before, and the mitigations we did put in were cheap and probably sufficient. What I actually learned is that I had presented a risk without a probability - I said &#x27;this could fail&#x27; rather than &#x27;I think there is a one in five chance, and here is what it costs if it happens&#x27;. Without the probability, they had to either accept my framing or ignore it, and ignoring it was reasonable.&quot;<\/p><\/blockquote><p>This is a strong answer because it demonstrates the thing most engineers never do: <strong>treating your own risk assessments as falsifiable and updating them<\/strong>. Avoid the two poor versions - &quot;we got lucky&quot; (unfalsifiable and sour) and &quot;I was completely wrong&quot; (over-correction that reads as having no judgement).<\/p>", "source": "answers.md", "search": "how do you describe a situation where the business decision went against your technical advice and turned out fine? answer it straight, and the value is in the recalibration. \"they shipped on the date and my concerns did not materialize. two things were true: i had over-weighted [the risk] because i had been burned by it before, and the mitigations we did put in were cheap and probably sufficient. what i actually learned is that i had presented a risk without a probability - i said 'this could fail' rather than 'i think there is a one in five chance, and here is what it costs if it happens'. without the probability, they had to either accept my framing or ignore it, and ignoring it was reasonable.\" this is a strong answer because it demonstrates the thing most engineers never do: treating your own risk assessments as falsifiable and updating them . avoid the two poor versions - \"we got lucky\" (unfalsifiable and sour) and \"i was completely wrong\" (over-correction that reads as having no judgement)."}, {"n": 163, "category": 10, "difficulty": "D", "html": "What does a good written status update contain, and what makes one worthless?", "answerTitle": "A good written status update", "answer": "<p>Contents, in order:<\/p><ol><li><strong>One line of overall state<\/strong> - on track, at risk, off track - with the same three words every time, and no invented fourth category.<\/li><li><strong>What changed since last time<\/strong>, in three bullets maximum.<\/li><li><strong>The decision or help you need<\/strong>, with who and by when. If none, say so.<\/li><li><strong>The risks that are actually live<\/strong>, with what you are doing about each. Not a register - the two that matter.<\/li><li><strong>The date, and whether it moved.<\/strong><\/li><\/ol><p>What makes one worthless: a list of activity rather than outcomes; a status that goes from green to red in one step (the amber is where the information is); risk sections copied forward unchanged for two months; and no ask.<\/p><p><strong>The discipline that costs the most and pays the most:<\/strong> report at risk the week you believe it, not the week it becomes undeniable. A report that has never been amber is not being read as reassuring; it is being read as uninformative.<\/p>", "source": "answers.md", "search": "what does a good written status update contain, and what makes one worthless? contents, in order: 1. one line of overall state - on track, at risk, off track - with the same three words every time, and no invented fourth category. 2. what changed since last time , in three bullets maximum. 3. the decision or help you need , with who and by when. if none, say so. 4. the risks that are actually live , with what you are doing about each. not a register - the two that matter. 5. the date, and whether it moved. what makes one worthless: a list of activity rather than outcomes; a status that goes from green to red in one step (the amber is where the information is); risk sections copied forward unchanged for two months; and no ask. the discipline that costs the most and pays the most: report at risk the week you believe it, not the week it becomes undeniable. a report that has never been amber is not being read as reassuring; it is being read as uninformative."}, {"n": 164, "category": 10, "difficulty": "D", "html": "&quot;Tell me about presenting to a customer or an audience outside your company.&quot;", "answerTitle": "Presenting outside your company", "answer": "<p>Whether it is a client, a conference or a vendor&#x27;s architecture board, three things change: you cannot rely on shared context, the stakes include the company&#x27;s credibility, and you will be asked something you cannot answer.<\/p><p><strong>Skeleton.<\/strong> <em>&quot;I presented <\/em>[what]<em> to <\/em>[the audience]<em> - <\/em>[N]<em> people, including <\/em>[their decision maker]<em>. I prepared by <\/em>[finding out what they actually cared about beforehand]<em>, which changed the whole shape: I dropped <\/em>[the architecture section]<em> and led with <\/em>[the thing they were worried about]<em>. The question I could not answer was <\/em>[X]<em>, and I said so and came back with it in two days. The outcome was <\/em>[the decision, the contract, the follow-up]<em>.&quot;<\/em><\/p><p>The details that score: preparing by asking rather than assuming; adapting live; handling the unanswerable question with a commitment and a date; and knowing what the audience did afterwards, which is the only real measure of a presentation.<\/p>", "source": "answers.md", "search": "\"tell me about presenting to a customer or an audience outside your company.\" whether it is a client, a conference or a vendor's architecture board, three things change: you cannot rely on shared context, the stakes include the company's credibility, and you will be asked something you cannot answer. skeleton. \"i presented [what] to [the audience] - [n] people, including [their decision maker] . i prepared by [finding out what they actually cared about beforehand] , which changed the whole shape: i dropped [the architecture section] and led with [the thing they were worried about] . the question i could not answer was [x] , and i said so and came back with it in two days. the outcome was [the decision, the contract, the follow-up] .\" the details that score: preparing by asking rather than assuming; adapting live; handling the unanswerable question with a commitment and a date; and knowing what the audience did afterwards, which is the only real measure of a presentation."}, {"n": 165, "category": 10, "difficulty": "A", "html": "Draft the one-page memo you would send to a CTO recommending a significant architectural investment.", "answerTitle": "The one-page memo to a CTO", "answer": "<pre><code class=\"lang-text\">Recommendation\n  Consolidate the four service-to-service auth mechanisms onto one, over two quarters.\n  Asking for: 1.5 engineers for two quarters, and a decision by [date].\n\nWhy now\n  Three of the last twelve incidents came from this (list, with dates and duration).\n  Every new service costs ~[N] days of auth integration; we are adding ~[N] a year.\n  The [audit / customer / regulator] requirement in [month] requires [the specific thing]\n  we cannot currently demonstrate.\n\nWhat it costs\n  [N] engineer-months, mostly migration rather than build.\n  [The named project] slips by [weeks]. That is the real price and I want it explicit.\n  Run cost: roughly flat.\n\nWhat we get\n  One mechanism, one place to rotate, one place to audit.\n  New service integration from [N] days to under one.\n  The [audit] requirement satisfied without a project of its own.\n\nOptions considered\n  Do nothing: works, and the incident rate rises with service count.\n  Buy [vendor]: faster, [cost] per year, and couples our identity model to theirs.\n  Consolidate on [the existing internal one]: recommended - no new dependency, and\n  [N] of [M] services are already on it.\n\nRisks\n  Migration touches every team: mitigated by doing the first four ourselves.\n  [The legacy system] cannot move: it stays, isolated, documented, with an exit date.\n\nWhat would change my recommendation\n  If [the vendor] is being adopted elsewhere in the company, buying wins on consistency.<\/code><\/pre><p>The principles: recommendation and ask in the first three lines; the cost stated including the project that slips; alternatives given fairly; and a named condition that would change your mind, which is what makes the rest credible.<\/p>", "source": "answers.md", "search": "draft the one-page memo you would send to a cto recommending a significant architectural investment. text recommendation consolidate the four service-to-service auth mechanisms onto one, over two quarters. asking for: 1.5 engineers for two quarters, and a decision by [date]. why now three of the last twelve incidents came from this (list, with dates and duration). every new service costs ~[n] days of auth integration; we are adding ~[n] a year. the [audit / customer / regulator] requirement in [month] requires [the specific thing] we cannot currently demonstrate. what it costs [n] engineer-months, mostly migration rather than build. [the named project] slips by [weeks]. that is the real price and i want it explicit. run cost: roughly flat. what we get one mechanism, one place to rotate, one place to audit. new service integration from [n] days to under one. the [audit] requirement satisfied without a project of its own. options considered do nothing: works, and the incident rate rises with service count. buy [vendor]: faster, [cost] per year, and couples our identity model to theirs. consolidate on [the existing internal one]: recommended - no new dependency, and [n] of [m] services are already on it. risks migration touches every team: mitigated by doing the first four ourselves. [the legacy system] cannot move: it stays, isolated, documented, with an exit date. what would change my recommendation if [the vendor] is being adopted elsewhere in the company, buying wins on consistency. the principles: recommendation and ask in the first three lines; the cost stated including the project that slips; alternatives given fairly; and a named condition that would change your mind, which is what makes the rest credible."}, {"n": 166, "category": 10, "difficulty": "A", "html": "How do you build credibility with a new stakeholder group in the first month?", "answerTitle": "Credibility with a new stakeholder group", "answer": "<p>The first month, in order:<\/p><ol><li><strong>Find out what they are measured on<\/strong>, from them, in the first conversation. Not what they want from engineering - what their own boss asks them about.<\/li><li><strong>Deliver one small thing they asked for<\/strong>, fast. Credibility is bought with a delivery, not with a plan. It can be a report, a fix, a number they have been unable to get.<\/li><li><strong>Tell them one true, unwelcome thing<\/strong> early. Being the engineer who tells them the honest date is worth more than three months of good news.<\/li><li><strong>Establish a rhythm<\/strong> - a short written update on a fixed day, and a standing fifteen minutes. Predictability is most of trust.<\/li><li><strong>Learn their vocabulary<\/strong> and stop using yours. If they say &quot;orders&quot; and you say &quot;events&quot;, you are making them translate.<\/li><li><strong>Never let them be surprised in front of their own leadership.<\/strong> This one rule generates more durable credibility than everything else combined.<\/li><\/ol><p>Then the story with the outcome: <em>&quot;six months in they were bringing me into their planning before decisions rather than after, which is the only measure of this that matters.&quot;<\/em><\/p>", "source": "answers.md", "search": "how do you build credibility with a new stakeholder group in the first month? the first month, in order: 1. find out what they are measured on , from them, in the first conversation. not what they want from engineering - what their own boss asks them about. 2. deliver one small thing they asked for , fast. credibility is bought with a delivery, not with a plan. it can be a report, a fix, a number they have been unable to get. 3. tell them one true, unwelcome thing early. being the engineer who tells them the honest date is worth more than three months of good news. 4. establish a rhythm - a short written update on a fixed day, and a standing fifteen minutes. predictability is most of trust. 5. learn their vocabulary and stop using yours. if they say \"orders\" and you say \"events\", you are making them translate. 6. never let them be surprised in front of their own leadership. this one rule generates more durable credibility than everything else combined. then the story with the outcome: \"six months in they were bringing me into their planning before decisions rather than after, which is the only measure of this that matters.\""}, {"n": 167, "category": 11, "difficulty": "C", "html": "&quot;Tell me about a time you had to say no.&quot; What makes a no land well?", "answerTitle": "Saying no", "answer": "<p>A no lands when it is <strong>about capacity or consequence rather than willingness<\/strong>, when it comes with an alternative, and when it is fast. A slow no is worse than a fast one, because the requester has been planning around a maybe.<\/p><p>The four forms, in descending order of usefulness:<\/p><ul><li><strong>&quot;Yes, and here is what it displaces.&quot;<\/strong> The trade made visible (Q154).<\/li><li><strong>&quot;Not now, and here is when.&quot;<\/strong> With a real date and a trigger, not a euphemism for never.<\/li><li><strong>&quot;Not by us - here is who or what could.&quot;<\/strong> A pointer costs nothing and preserves the relationship.<\/li><li><strong>&quot;No, and here is why.&quot;<\/strong> Reserved for the cases where it is genuinely wrong, and delivered once, with the reason and without hedging.<\/li><\/ul><p><strong>Skeleton close:<\/strong> <em>&quot;I said no to <\/em>[the request]<em> on the Tuesday it was asked, gave the reason as <\/em>[the displacement]<em>, and offered <\/em>[the smaller thing]<em> which turned out to cover most of what they actually needed.&quot;<\/em><\/p>", "source": "answers.md", "search": "\"tell me about a time you had to say no.\" what makes a no land well? a no lands when it is about capacity or consequence rather than willingness , when it comes with an alternative, and when it is fast. a slow no is worse than a fast one, because the requester has been planning around a maybe. the four forms, in descending order of usefulness: - \"yes, and here is what it displaces.\" the trade made visible (q154). - \"not now, and here is when.\" with a real date and a trigger, not a euphemism for never. - \"not by us - here is who or what could.\" a pointer costs nothing and preserves the relationship. - \"no, and here is why.\" reserved for the cases where it is genuinely wrong, and delivered once, with the reason and without hedging. skeleton close: \"i said no to [the request] on the tuesday it was asked, gave the reason as [the displacement] , and offered [the smaller thing] which turned out to cover most of what they actually needed.\""}, {"n": 168, "category": 11, "difficulty": "D", "html": "How do you prioritize between two things that are both genuinely urgent and owned by different stakeholders?", "answerTitle": "Two urgent things, two stakeholders", "answer": "<p>Do not arbitrate privately - that is how you become the person both of them are annoyed with.<\/p><p>The sequence:<\/p><ol><li><strong>Establish what &quot;urgent&quot; means for each<\/strong>, in consequences and dates. Frequently one of them has a real external deadline and the other has a preference, and that ends it.<\/li><li><strong>Look for the cheap partial<\/strong> - can one get 80 percent of the value from 20 percent of the work this week? This resolves more of these than prioritization does.<\/li><li><strong>If they genuinely conflict, make it visible and take it to the owner of the trade-off<\/strong>, with both stated fairly and a recommendation (Q92).<\/li><li><strong>Tell the loser first, personally, before it is announced<\/strong>, with what they get instead and when.<\/li><li><strong>Write down the decision and the reason<\/strong>, so it is not re-litigated in three weeks.<\/li><\/ol><p>The principle to state: <em>&quot;the failure mode is doing both badly. Two half-delivered things is the worst available outcome and it is the one that happens by default.&quot;<\/em><\/p>", "source": "answers.md", "search": "how do you prioritize between two things that are both genuinely urgent and owned by different stakeholders? do not arbitrate privately - that is how you become the person both of them are annoyed with. the sequence: 1. establish what \"urgent\" means for each , in consequences and dates. frequently one of them has a real external deadline and the other has a preference, and that ends it. 2. look for the cheap partial - can one get 80 percent of the value from 20 percent of the work this week? this resolves more of these than prioritization does. 3. if they genuinely conflict, make it visible and take it to the owner of the trade-off , with both stated fairly and a recommendation (q92). 4. tell the loser first, personally, before it is announced , with what they get instead and when. 5. write down the decision and the reason , so it is not re-litigated in three weeks. the principle to state: \"the failure mode is doing both badly. two half-delivered things is the worst available outcome and it is the one that happens by default.\""}, {"n": 169, "category": 11, "difficulty": "D", "html": "&quot;Describe a time you cut scope to make a date.&quot;", "answerTitle": "Cutting scope to make a date", "answer": "<p>See Q126 and Q127 for the full shape. What to emphasize here:<\/p><ul><li><strong>Cut whole features, not quality within features.<\/strong> A shipped subset works; a full set at 70 percent quality is a support burden
