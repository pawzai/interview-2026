<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavioural Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>

<script id="data" type="application/json">{"categories": [{"index": 1, "title": "What a behavioural round measures at principal level"}, {"index": 2, "title": "Story construction and evidence"}, {"index": 3, "title": "Building the story bank - one story, many faces"}, {"index": 4, "title": "Ownership, scope and second-order impact"}, {"index": 5, "title": "Influence without authority"}, {"index": 6, "title": "Conflict, disagreement and disagree-and-commit"}, {"index": 7, "title": "Failure, mistakes and accountability"}, {"index": 8, "title": "Incident command and delivering under pressure"}, {"index": 9, "title": "Growing people - mentoring, hiring and performance"}, {"index": 10, "title": "Stakeholder and executive communication"}, {"index": 11, "title": "Prioritization, saying no, and negotiating scope"}, {"index": 12, "title": "Ambiguity, change and starting from nothing"}, {"index": 13, "title": "Technical leadership decisions"}, {"index": 14, "title": "Team, culture, distributed working and ethics"}, {"index": 15, "title": "Career narrative and role fit"}], "questions": [{"n": 1, "category": 1, "difficulty": "C", "html": "What is a behavioural round actually measuring, given that nobody can verify a word of what you say?", "answerTitle": "What a behavioural round is measuring", "answer": "<p>It is measuring <strong>the probability that you will be a problem<\/strong>, and it does that by looking for specificity. Nobody can verify your story, so the interviewer does not try. They probe for the things a fabricated story does not contain: a name, a number, a decision with a rejected alternative, a cost you paid, and a detail you would only know if you had been there.<\/p><p>Three consequences:<\/p><ul><li><strong>Detail is the currency of credibility.<\/strong> &quot;We reduced incidents&quot; is unverifiable and unusable. &quot;We went from <em>[N]<\/em> pages a week to <em>[N]<\/em> over four months, and the change that did it was moving retry policy out of each service and into the gateway&quot; is a note somebody can write down and defend for you.<\/li><li><strong>The round is a risk assessment, not a talent assessment.<\/strong> Evidence of judgement, self-correction and how you handle disagreement outweighs one more impressive system.<\/li><li><strong>They are collecting evidence for a competency they were assigned.<\/strong> You will score better if you work out which one it is and hand them the evidence for it directly.<\/li><\/ul>", "source": "answers.md", "search": "what is a behavioural round actually measuring, given that nobody can verify a word of what you say? it is measuring the probability that you will be a problem , and it does that by looking for specificity. nobody can verify your story, so the interviewer does not try. they probe for the things a fabricated story does not contain: a name, a number, a decision with a rejected alternative, a cost you paid, and a detail you would only know if you had been there. three consequences: - detail is the currency of credibility. \"we reduced incidents\" is unverifiable and unusable. \"we went from [n] pages a week to [n] over four months, and the change that did it was moving retry policy out of each service and into the gateway\" is a note somebody can write down and defend for you. - the round is a risk assessment, not a talent assessment. evidence of judgement, self-correction and how you handle disagreement outweighs one more impressive system. - they are collecting evidence for a competency they were assigned. you will score better if you work out which one it is and hand them the evidence for it directly."}, {"n": 2, "category": 1, "difficulty": "C", "html": "Name the nine competencies a principal-level behavioural loop probes, and the one question behind each.", "answerTitle": "The nine competencies", "answer": "<p>Ownership, influence, judgement, conflict, accountability, delivery under pressure, growing people, communication upward, and learning. The full table with the evidence bar for each is in <a href=\"README.md\">README.md<\/a>.<\/p><p>The question behind each, in order: what happens when it is nobody&#x27;s job; can you change what you cannot mandate; do you know which decisions are expensive; are you expensive to work with; what do you do when you are wrong; what survives contact with a deadline; do you scale through others; can you be trusted in front of an executive; and have nineteen years produced nineteen years of experience or one year nineteen times.<\/p><p><strong>Useful move in the room:<\/strong> if you cannot tell which competency is being probed, ask. <em>&quot;Are you more interested in how the decision got made, or how I got people to go along with it?&quot;<\/em> It is a twenty-second question that redirects the whole answer.<\/p>", "source": "answers.md", "search": "name the nine competencies a principal-level behavioural loop probes, and the one question behind each. ownership, influence, judgement, conflict, accountability, delivery under pressure, growing people, communication upward, and learning. the full table with the evidence bar for each is in readme.md. the question behind each, in order: what happens when it is nobody's job; can you change what you cannot mandate; do you know which decisions are expensive; are you expensive to work with; what do you do when you are wrong; what survives contact with a deadline; do you scale through others; can you be trusted in front of an executive; and have nineteen years produced nineteen years of experience or one year nineteen times. useful move in the room: if you cannot tell which competency is being probed, ask. \"are you more interested in how the decision got made, or how i got people to go along with it?\" it is a twenty-second question that redirects the whole answer."}, {"n": 3, "category": 1, "difficulty": "D", "html": "How does an interviewer convert a story into a score, and what does the note they write actually look like?", "answerTitle": "How a story becomes a score", "answer": "<p>The interviewer is writing while you speak, and what they can write is constrained by what you say. A usable note has four parts: <strong>context with a number, a decision with the alternative rejected, an outcome with a number, and what changed afterwards<\/strong>. Anything you say that does not feed one of those four slots is decoration.<\/p><p>The score is then usually a level call on a scale like <em>below bar / at bar for senior / at bar for principal<\/em>, justified by quoting the note back. This is why a brilliant but unquotable answer scores below a clear one - your advocate in the debrief can only read out what they wrote down.<\/p><p><strong>Hand them the note.<\/strong> End substantial answers with one sentence that is deliberately quotable: <em>&quot;So: a <\/em>[N]<em>-service estate, we standardized the retry and timeout policy at the gateway, cut incident volume by <\/em>[percentage]<em>, and the standard is still in the platform template three years later.&quot;<\/em><\/p>", "source": "answers.md", "search": "how does an interviewer convert a story into a score, and what does the note they write actually look like? the interviewer is writing while you speak, and what they can write is constrained by what you say. a usable note has four parts: context with a number, a decision with the alternative rejected, an outcome with a number, and what changed afterwards . anything you say that does not feed one of those four slots is decoration. the score is then usually a level call on a scale like below bar / at bar for senior / at bar for principal , justified by quoting the note back. this is why a brilliant but unquotable answer scores below a clear one - your advocate in the debrief can only read out what they wrote down. hand them the note. end substantial answers with one sentence that is deliberately quotable: \"so: a [n] -service estate, we standardized the retry and timeout policy at the gateway, cut incident volume by [percentage] , and the standard is still in the platform template three years later.\""}, {"n": 4, "category": 1, "difficulty": "T", "html": "Two candidates tell the same story. One is scored senior and one principal. What differed?", "answerTitle": "Same story, two different levels", "answer": "<p>The difference is almost always the <strong>second sentence about impact<\/strong>. Both candidates describe the same work; one stops at what happened to the project, and one continues to what changed for the organization.<\/p><table><thead><tr><th>Senior version<\/th><th>Principal version<\/th><\/tr><\/thead><tbody><tr><td>I fixed the memory leak that was crashing the service<\/td><td>I fixed the leak, then found that three other services had the same pattern from the same internal library, and changed the library<\/td><\/tr><tr><td>I led the migration<\/td><td>I led the migration, and the reason it took nine months instead of eighteen was refusing the decomposition, which I had to argue for twice<\/td><\/tr><tr><td>We reduced latency<\/td><td>We reduced latency, and the second-order effect was that the batch reconciliation job became unnecessary, which removed a class of overnight incident<\/td><\/tr><\/tbody><\/table><p>Two other separators: the principal version names the <strong>decision<\/strong> rather than only the work, and it names the <strong>cost<\/strong> - what was given up, who disagreed, what is still not fixed.<\/p>", "source": "answers.md", "search": "two candidates tell the same story. one is scored senior and one principal. what differed? the difference is almost always the second sentence about impact . both candidates describe the same work; one stops at what happened to the project, and one continues to what changed for the organization. senior version principal version --- --- i fixed the memory leak that was crashing the service i fixed the leak, then found that three other services had the same pattern from the same internal library, and changed the library i led the migration i led the migration, and the reason it took nine months instead of eighteen was refusing the decomposition, which i had to argue for twice we reduced latency we reduced latency, and the second-order effect was that the batch reconciliation job became unnecessary, which removed a class of overnight incident two other separators: the principal version names the decision rather than only the work, and it names the cost - what was given up, who disagreed, what is still not fixed."}, {"n": 5, "category": 1, "difficulty": "D", "html": "What is a second-order effect, and why does its absence cap a story at senior level?", "answerTitle": "Second-order effects", "answer": "<p>A first-order effect happens to the thing you worked on. A <strong>second-order effect<\/strong> happens to something you did not work on, because of what you did.<\/p><p>The three that carry the most weight, in order:<\/p><ol><li><strong>A class of failure disappeared.<\/strong> Not &quot;we fixed the outage&quot; but &quot;that kind of outage cannot happen now, and here is the mechanism that prevents it&quot;.<\/li><li><strong>The cost curve changed.<\/strong> Cost per request, per tenant or per engineer moved, and it stayed moved.<\/li><li><strong>Other people&#x27;s behaviour changed.<\/strong> A practice was adopted, a decision became easy that used to be argued about every time, or a team that used to escalate now handles it.<\/li><\/ol><p>Absence caps the story at senior because first-order impact is exactly what a strong senior engineer delivers. Nothing in the story distinguishes the two levels unless you supply it.<\/p>", "source": "answers.md", "search": "what is a second-order effect, and why does its absence cap a story at senior level? a first-order effect happens to the thing you worked on. a second-order effect happens to something you did not work on, because of what you did. the three that carry the most weight, in order: 1. a class of failure disappeared. not \"we fixed the outage\" but \"that kind of outage cannot happen now, and here is the mechanism that prevents it\". 2. the cost curve changed. cost per request, per tenant or per engineer moved, and it stayed moved. 3. other people's behaviour changed. a practice was adopted, a decision became easy that used to be argued about every time, or a team that used to escalate now handles it. absence caps the story at senior because first-order impact is exactly what a strong senior engineer delivers. nothing in the story distinguishes the two levels unless you supply it."}, {"n": 6, "category": 1, "difficulty": "D", "html": "&quot;What would have happened if you had not been there?&quot; What is this counterfactual testing, and how do you answer it without sounding arrogant?", "answerTitle": "Answering the counterfactual", "answer": "<p>&quot;What would have happened if you had not been there?&quot; is testing whether you know the difference between being useful and being <strong>decisive<\/strong>. The failure modes are false modesty (&quot;the team would have got there&quot;) and arrogance (&quot;it would have failed&quot;).<\/p><p>The shape that works is a specific alternative future with a mechanism:<\/p><blockquote><p>&quot;It would have shipped, but I think it would have shipped as <em>[the design that was on the table]<\/em>, because that was the direction and nobody in the room had operated one before. The reason I am fairly confident is that we hit <em>[the failure]<\/em> in the pilot, which is the exact thing I was arguing about. What I do not claim is the timeline - that was mostly <em>[named person]<\/em>&#x27;s delivery management.&quot;<\/p><\/blockquote><p>The pattern is: name the concrete alternative, give the evidence that it was really the default, and hand back the part that was not you. Giving back a piece is what makes the rest believable.<\/p>", "source": "answers.md", "search": "\"what would have happened if you had not been there?\" what is this counterfactual testing, and how do you answer it without sounding arrogant? \"what would have happened if you had not been there?\" is testing whether you know the difference between being useful and being decisive . the failure modes are false modesty (\"the team would have got there\") and arrogance (\"it would have failed\"). the shape that works is a specific alternative future with a mechanism: \"it would have shipped, but i think it would have shipped as [the design that was on the table] , because that was the direction and nobody in the room had operated one before. the reason i am fairly confident is that we hit [the failure] in the pilot, which is the exact thing i was arguing about. what i do not claim is the timeline - that was mostly [named person] 's delivery management.\" the pattern is: name the concrete alternative, give the evidence that it was really the default, and hand back the part that was not you. giving back a piece is what makes the rest believable."}, {"n": 7, "category": 1, "difficulty": "D", "html": "Why do interviewers ask for specific named people in a story, and what does &quot;the team decided&quot; signal?", "answerTitle": "Why they want named people", "answer": "<p>Because <strong>real organizations are made of people who behave inconveniently<\/strong>, and constructed stories are not. When a story contains &quot;the team decided&quot; and &quot;stakeholders agreed&quot;, the interviewer learns nothing about you and starts to suspect the story is a composite.<\/p><p>What a name buys you:<\/p><ul><li>It forces the story into the first person - &quot;I convinced <em>[name]<\/em>&quot; cannot be said by someone who was not there.<\/li><li>It creates the friction that makes influence measurable. Someone must have been against it.<\/li><li>It produces the follow-up you want: &quot;what was their objection?&quot; - which is the question where principal evidence lives.<\/li><\/ul><p>Use first names or roles (&quot;the platform lead&quot;, &quot;the QA manager at the client&quot;), never surnames or anything unflattering. <strong>&quot;The team decided&quot; is the single most common tell that a candidate is describing a project rather than a contribution.<\/strong><\/p>", "source": "answers.md", "search": "why do interviewers ask for specific named people in a story, and what does \"the team decided\" signal? because real organizations are made of people who behave inconveniently , and constructed stories are not. when a story contains \"the team decided\" and \"stakeholders agreed\", the interviewer learns nothing about you and starts to suspect the story is a composite. what a name buys you: - it forces the story into the first person - \"i convinced [name] \" cannot be said by someone who was not there. - it creates the friction that makes influence measurable. someone must have been against it. - it produces the follow-up you want: \"what was their objection?\" - which is the question where principal evidence lives. use first names or roles (\"the platform lead\", \"the qa manager at the client\"), never surnames or anything unflattering. \"the team decided\" is the single most common tell that a candidate is describing a project rather than a contribution."}, {"n": 8, "category": 1, "difficulty": "T", "html": "Your best story is your most technically impressive one. Why is that usually the wrong story to lead with in a behavioural round?", "answerTitle": "Why your most impressive story is the wrong opener", "answer": "<p>Because the behavioural round is not scoring the system, and a technically dazzling story invites you to spend four minutes on architecture that the interviewer is not empowered to credit. Two specific costs: the competency evidence gets crowded out, and the round drifts into a design conversation you will be graded on with a behavioural rubric.<\/p><p>Lead instead with the story that has the <strong>highest evidence density<\/strong> for the competency asked about - usually one with a person in it, a disagreement, a number, and a mistake. Keep the impressive one for the design round, or offer it as a second example.<\/p><p><strong>The exception:<\/strong> when the question is explicitly &quot;the largest system you have built&quot; (Q43). Then it is the right story, and the discipline is to talk about the decisions rather than the boxes.<\/p>", "source": "answers.md", "search": "your best story is your most technically impressive one. why is that usually the wrong story to lead with in a behavioural round? because the behavioural round is not scoring the system, and a technically dazzling story invites you to spend four minutes on architecture that the interviewer is not empowered to credit. two specific costs: the competency evidence gets crowded out, and the round drifts into a design conversation you will be graded on with a behavioural rubric. lead instead with the story that has the highest evidence density for the competency asked about - usually one with a person in it, a disagreement, a number, and a mistake. keep the impressive one for the design round, or offer it as a second example. the exception: when the question is explicitly \"the largest system you have built\" (q43). then it is the right story, and the discipline is to talk about the decisions rather than the boxes."}, {"n": 9, "category": 1, "difficulty": "D", "html": "What is the difference between scope of work and scope of influence, and which one is being levelled on?", "answerTitle": "Scope of work versus scope of influence", "answer": "<p>Scope of work is how big the thing you built was. Scope of influence is how far the consequences of your decisions travelled. <strong>Levelling runs on the second<\/strong>, which is why a candidate who built something huge inside one team can be levelled below someone who changed how five teams do one small thing.<\/p><p>The practical test: for each story, ask &quot;how many teams behave differently because of this, and would they still if I left?&quot; One team and no is senior. Several teams and yes is principal.<\/p><p>This is also the reason the platform, standards and migration stories are usually your strongest ones even when they were not the most technically interesting.<\/p>", "source": "answers.md", "search": "what is the difference between scope of work and scope of influence, and which one is being levelled on? scope of work is how big the thing you built was. scope of influence is how far the consequences of your decisions travelled. levelling runs on the second , which is why a candidate who built something huge inside one team can be levelled below someone who changed how five teams do one small thing. the practical test: for each story, ask \"how many teams behave differently because of this, and would they still if i left?\" one team and no is senior. several teams and yes is principal. this is also the reason the platform, standards and migration stories are usually your strongest ones even when they were not the most technically interesting."}, {"n": 10, "category": 1, "difficulty": "D", "html": "How does a behavioural round differ when run by a hiring manager, a peer, a skip-level and a bar raiser?", "answerTitle": "The four interviewers, and what each is really asking", "answer": "<table><thead><tr><th>Interviewer<\/th><th>What they are deciding<\/th><th>What to bring<\/th><\/tr><\/thead><tbody><tr><td><strong>Hiring manager<\/strong><\/td><td>Would I want this person on my team next Monday, and can I hand them a problem<\/td><td>Delivery, prioritization, how you operate day to day<\/td><\/tr><tr><td><strong>Peer<\/strong><\/td><td>Would I enjoy reviewing their design and disagreeing with them<\/td><td>Conflict, collaboration, how criticism is given<\/td><\/tr><tr><td><strong>Skip-level<\/strong><\/td><td>Can this person be pointed at an organizational problem<\/td><td>Influence, ambiguity, second-order effects<\/td><\/tr><tr><td><strong>Bar raiser<\/strong><\/td><td>Is this a principal, consistently, across the whole loop<\/td><td>Self-awareness, the mistake you volunteer, the edge of what you know<\/td><\/tr><\/tbody><\/table><p>The stories can overlap; the <strong>emphasis<\/strong> must not. The same migration story told to a peer is about how you handled the objections, and told to a skip-level is about why the organization needed it at all.<\/p>", "source": "answers.md", "search": "how does a behavioural round differ when run by a hiring manager, a peer, a skip-level and a bar raiser? interviewer what they are deciding what to bring --- --- --- hiring manager would i want this person on my team next monday, and can i hand them a problem delivery, prioritization, how you operate day to day peer would i enjoy reviewing their design and disagreeing with them conflict, collaboration, how criticism is given skip-level can this person be pointed at an organizational problem influence, ambiguity, second-order effects bar raiser is this a principal, consistently, across the whole loop self-awareness, the mistake you volunteer, the edge of what you know the stories can overlap; the emphasis must not. the same migration story told to a peer is about how you handled the objections, and told to a skip-level is about why the organization needed it at all."}, {"n": 11, "category": 1, "difficulty": "T", "html": "The interviewer nods along and asks no follow-ups at all. What has probably happened?", "answerTitle": "No follow-ups at all", "answer": "<p>Usually one of three things, and only one is good.<\/p><ol><li><strong>They got what they needed in the first ninety seconds<\/strong> and are conserving time. Rare, and you can usually tell because they move to a new competency rather than to a new topic.<\/li><li><strong>The answer was too long<\/strong>, and they are letting you finish so they can move on. The tell is that the next question is unrelated and slightly rushed.<\/li><li><strong>The answer had nothing to pull on.<\/strong> Generic stories produce no follow-ups because there is no specific claim to probe. This is the most common cause and the most dangerous, because silence feels like success.<\/li><\/ol><p><strong>The intervention<\/strong> is to create your own hook: end with a specific, slightly contestable claim. <em>&quot;The part I would do differently is that I standardized too early - I think we locked in a pattern before we had enough cases.&quot;<\/em> That is almost impossible not to ask about.<\/p>", "source": "answers.md", "search": "the interviewer nods along and asks no follow-ups at all. what has probably happened? usually one of three things, and only one is good. 1. they got what they needed in the first ninety seconds and are conserving time. rare, and you can usually tell because they move to a new competency rather than to a new topic. 2. the answer was too long , and they are letting you finish so they can move on. the tell is that the next question is unrelated and slightly rushed. 3. the answer had nothing to pull on. generic stories produce no follow-ups because there is no specific claim to probe. this is the most common cause and the most dangerous, because silence feels like success. the intervention is to create your own hook: end with a specific, slightly contestable claim. \"the part i would do differently is that i standardized too early - i think we locked in a pattern before we had enough cases.\" that is almost impossible not to ask about."}, {"n": 12, "category": 1, "difficulty": "D", "html": "What does an interviewer do with a story that has no conflict, no mistake and no cost in it?", "answerTitle": "A story with no conflict, no mistake and no cost", "answer": "<p>They discount it. Not because they think you are lying, but because a story with no friction contains no decision - if there was no cost, nothing was traded, and if nothing was traded, there was no judgement to score.<\/p><p>The three things that supply friction, cheapest first: someone who disagreed and had a point; a thing you got wrong and corrected; and something you gave up to get the rest. If your story genuinely has none of these, it is a project description, and you should pick a different one.<\/p><p><strong>Volunteer the friction before you are asked.<\/strong> &quot;The part I got wrong was...&quot; delivered unprompted is worth substantially more than the same sentence extracted by a follow-up.<\/p>", "source": "answers.md", "search": "what does an interviewer do with a story that has no conflict, no mistake and no cost in it? they discount it. not because they think you are lying, but because a story with no friction contains no decision - if there was no cost, nothing was traded, and if nothing was traded, there was no judgement to score. the three things that supply friction, cheapest first: someone who disagreed and had a point; a thing you got wrong and corrected; and something you gave up to get the rest. if your story genuinely has none of these, it is a project description, and you should pick a different one. volunteer the friction before you are asked. \"the part i got wrong was...\" delivered unprompted is worth substantially more than the same sentence extracted by a follow-up."}, {"n": 13, "category": 1, "difficulty": "A", "html": "You are given one story and must demonstrate three competencies with it. How do you choose which three, and how do you signal the pivot?", "answerTitle": "Three competencies from one story", "answer": "<p>Choose by what the story actually contains, not by what you would like it to demonstrate. Most substantial stories carry a natural triple: <strong>a decision (judgement), a person who resisted (influence or conflict), and something that broke (accountability)<\/strong>.<\/p><p>How to run it:<\/p><ul><li>Lead with the competency asked for and give the full STAR-L on that face only.<\/li><li><strong>Signal the pivot explicitly<\/strong> - the interviewer needs to re-file the evidence: <em>&quot;That was the decision itself. There is a separate part of the same project that is more about getting the other two teams on board - is that useful, or would you rather I go elsewhere?&quot;<\/em><\/li><li>Never do all three unprompted. Offer, and let them choose; the offer itself is evidence of structure.<\/li><\/ul><p>The line is reached when a face requires you to re-cast your role. Reusing the story is fine; being the architect in one telling and the mentor in the next is not.<\/p>", "source": "answers.md", "search": "you are given one story and must demonstrate three competencies with it. how do you choose which three, and how do you signal the pivot? choose by what the story actually contains, not by what you would like it to demonstrate. most substantial stories carry a natural triple: a decision (judgement), a person who resisted (influence or conflict), and something that broke (accountability) . how to run it: - lead with the competency asked for and give the full star-l on that face only. - signal the pivot explicitly - the interviewer needs to re-file the evidence: \"that was the decision itself. there is a separate part of the same project that is more about getting the other two teams on board - is that useful, or would you rather i go elsewhere?\" - never do all three unprompted. offer, and let them choose; the offer itself is evidence of structure. the line is reached when a face requires you to re-cast your role. reusing the story is fine; being the architect in one telling and the mentor in the next is not."}, {"n": 14, "category": 1, "difficulty": "D", "html": "Why is &quot;tell me about a time&quot; phrased in the past tense, and what happens when you answer hypothetically?", "answerTitle": "Why the past tense matters", "answer": "<p>Because hypothetical answers are free. &quot;I would set up a working group and align the stakeholders&quot; costs nothing to say and predicts nothing. The past tense is a request for <strong>evidence<\/strong>, and answering hypothetically reads as not having the example.<\/p><p>If you drift into the conditional, the interviewer will usually pull you back once. If you drift twice, they write &quot;could not produce a concrete example&quot;, which is a scored negative regardless of how sensible the hypothetical was.<\/p><p><strong>When you genuinely have no example:<\/strong> say so, give the nearest real thing, and only then offer the hypothetical - in that order. That is Q40.<\/p>", "source": "answers.md", "search": "why is \"tell me about a time\" phrased in the past tense, and what happens when you answer hypothetically? because hypothetical answers are free. \"i would set up a working group and align the stakeholders\" costs nothing to say and predicts nothing. the past tense is a request for evidence , and answering hypothetically reads as not having the example. if you drift into the conditional, the interviewer will usually pull you back once. if you drift twice, they write \"could not produce a concrete example\", which is a scored negative regardless of how sensible the hypothetical was. when you genuinely have no example: say so, give the nearest real thing, and only then offer the hypothetical - in that order. that is q40."}, {"n": 15, "category": 1, "difficulty": "T", "html": "How much of the technical detail belongs in a behavioural answer, and what is the failure mode in each direction?", "answerTitle": "How much technical detail", "answer": "<p>Enough that the story could only be told by someone who did it, and no more. In practice: <strong>one or two sentences of mechanism at the point where the decision was made<\/strong>, and everything else held in reserve.<\/p><ul><li><strong>Too little<\/strong> and the story floats - the interviewer cannot tell whether you understood the thing you are claiming to have led, and at principal level a leadership story with no engineering in it reads as a management story.<\/li><li><strong>Too much<\/strong> and you have converted a behavioural round into a bad design round, scored against a rubric that has no box for it. You also burn the clock: three minutes of architecture is a third of the round.<\/li><\/ul><p><strong>The technique<\/strong> is to signal that the depth exists and offer it: <em>&quot;the mechanism was an outbox rather than a dual write, for the partial-failure reason - happy to go into that if it is useful.&quot;<\/em> Half the time they say no and you have still had the credit.<\/p>", "source": "answers.md", "search": "how much of the technical detail belongs in a behavioural answer, and what is the failure mode in each direction? enough that the story could only be told by someone who did it, and no more. in practice: one or two sentences of mechanism at the point where the decision was made , and everything else held in reserve. - too little and the story floats - the interviewer cannot tell whether you understood the thing you are claiming to have led, and at principal level a leadership story with no engineering in it reads as a management story. - too much and you have converted a behavioural round into a bad design round, scored against a rubric that has no box for it. you also burn the clock: three minutes of architecture is a third of the round. the technique is to signal that the depth exists and offer it: \"the mechanism was an outbox rather than a dual write, for the partial-failure reason - happy to go into that if it is useful.\" half the time they say no and you have still had the credit."}, {"n": 16, "category": 1, "difficulty": "A", "html": "Design the behavioural round you would run for a principal candidate, and say what each question is for.", "answerTitle": "Design your own behavioural round", "answer": "<p>Six questions, forty-five minutes, each buying a different kind of evidence, and one deliberately without a right answer.<\/p><table><thead><tr><th>Minute<\/th><th>Question<\/th><th>What it buys<\/th><\/tr><\/thead><tbody><tr><td>0-5<\/td><td>&quot;What is the thing you have built that is still in use and you are least proud of?&quot;<\/td><td>Self-awareness with no rehearsed answer available<\/td><\/tr><tr><td>5-14<\/td><td>&quot;Tell me about a standard or platform decision you drove across teams you did not own&quot;<\/td><td>Influence with a named resister; the principal signal<\/td><\/tr><tr><td>14-22<\/td><td>&quot;Tell me about a decision you lost&quot;<\/td><td>Conflict and commitment, both halves<\/td><\/tr><tr><td>22-30<\/td><td>&quot;Describe an incident you led&quot; with a demand for real times<\/td><td>Delivery under pressure, and whether they command or debug<\/td><\/tr><tr><td>30-38<\/td><td>&quot;Who is doing work today that you used to do?&quot;<\/td><td>Growing people, phrased so a generic mentoring answer does not fit<\/td><\/tr><tr><td>38-45<\/td><td>&quot;What would you have to see in the first month to conclude you had made a mistake joining?&quot;<\/td><td>Judgement, honesty, and what they actually care about<\/td><\/tr><\/tbody><\/table><p>The design principles worth stating out loud if asked: every question is past tense; at least two of them cannot be answered from a prepared bank; one asks for a negative about their own work; and the follow-up for all of them is the same - <em>&quot;what would have happened without you?&quot;<\/em><\/p>", "source": "answers.md", "search": "design the behavioural round you would run for a principal candidate, and say what each question is for. six questions, forty-five minutes, each buying a different kind of evidence, and one deliberately without a right answer. minute question what it buys --- --- --- 0-5 \"what is the thing you have built that is still in use and you are least proud of?\" self-awareness with no rehearsed answer available 5-14 \"tell me about a standard or platform decision you drove across teams you did not own\" influence with a named resister; the principal signal 14-22 \"tell me about a decision you lost\" conflict and commitment, both halves 22-30 \"describe an incident you led\" with a demand for real times delivery under pressure, and whether they command or debug 30-38 \"who is doing work today that you used to do?\" growing people, phrased so a generic mentoring answer does not fit 38-45 \"what would you have to see in the first month to conclude you had made a mistake joining?\" judgement, honesty, and what they actually care about the design principles worth stating out loud if asked: every question is past tense; at least two of them cannot be answered from a prepared bank; one asks for a negative about their own work; and the follow-up for all of them is the same - \"what would have happened without you?\""}, {"n": 17, "category": 2, "difficulty": "C", "html": "What must every story contain to be usable as evidence? Give the checklist.", "answerTitle": "The evidence checklist", "answer": "<p>Every story, without exception:<\/p><ul><li><strong>A number in the Situation<\/strong> - scale, users, throughput, team size, money, or the size of the problem.<\/li><li><strong>A number in the Result<\/strong>, of the same kind, so the delta is legible.<\/li><li><strong>A decision you made<\/strong>, with the alternative you rejected and the reason.<\/li><li><strong>A named person<\/strong> who disagreed, resisted, or changed their mind.<\/li><li><strong>A second-order effect<\/strong> - what changed beyond the thing itself (Q5).<\/li><li><strong>Something you got wrong<\/strong>, or a cost you paid.<\/li><li><strong>One sentence of Learning<\/strong> that is a rule, plus evidence you have applied it since.<\/li><\/ul><p>Seven items, and the two most often missing are the Situation number and the second-order effect. Score your own stories against this before you rehearse them - a story missing three of these cannot be fixed by better delivery.<\/p>", "source": "answers.md", "search": "what must every story contain to be usable as evidence? give the checklist. every story, without exception: - a number in the situation - scale, users, throughput, team size, money, or the size of the problem. - a number in the result , of the same kind, so the delta is legible. - a decision you made , with the alternative you rejected and the reason. - a named person who disagreed, resisted, or changed their mind. - a second-order effect - what changed beyond the thing itself (q5). - something you got wrong , or a cost you paid. - one sentence of learning that is a rule, plus evidence you have applied it since. seven items, and the two most often missing are the situation number and the second-order effect. score your own stories against this before you rehearse them - a story missing three of these cannot be fixed by better delivery."}, {"n": 18, "category": 2, "difficulty": "D", "html": "How long should the Situation be, and what is the test for whether you have said too much?", "answerTitle": "How long the Situation should be", "answer": "<p><strong>Two sentences.<\/strong> One for the system and its scale, one for what was wrong or at stake. Roughly twenty seconds of a two-minute answer.<\/p><p>The test: could a colleague who does not know the domain repeat the stakes back to you? If yes, stop. Everything else you were about to say - the org chart, how the project started, who the client was - is context you can supply on demand if the interviewer asks.<\/p><p><strong>The reason it matters<\/strong> is not pacing, it is proportion. Sixty seconds of Situation in a two-minute answer means the Action gets forty and the Result gets ten, and the Result is the part being scored. Situation is the letter everyone overruns; see <a href=\"../15-mock-interviews/answers.md\">../15-mock-interviews<\/a> Q176 for the full budget.<\/p>", "source": "answers.md", "search": "how long should the situation be, and what is the test for whether you have said too much? two sentences. one for the system and its scale, one for what was wrong or at stake. roughly twenty seconds of a two-minute answer. the test: could a colleague who does not know the domain repeat the stakes back to you? if yes, stop. everything else you were about to say - the org chart, how the project started, who the client was - is context you can supply on demand if the interviewer asks. the reason it matters is not pacing, it is proportion. sixty seconds of situation in a two-minute answer means the action gets forty and the result gets ten, and the result is the part being scored. situation is the letter everyone overruns; see ../15-mock-interviews q176 for the full budget."}, {"n": 19, "category": 2, "difficulty": "D", "html": "The Task step is the one candidates skip entirely. What is it for, and what breaks without it?", "answerTitle": "What the Task step is for", "answer": "<p>Task is where you state <strong>what you were on the hook for, and what you were not<\/strong>. Skipping it produces the most common structural failure in behavioural answers: a story where it is impossible to tell which parts were yours.<\/p><p>It also does two useful things:<\/p><ul><li>It establishes scope honestly and pre-empts the &quot;what exactly was your role?&quot; probe, which is much better asked by you than by them.<\/li><li>It sets up the counterfactual, because the interviewer now knows what would have gone unowned.<\/li><\/ul><p>One sentence: <em>&quot;I was the architect on it, not the delivery lead - I owned the design and the go/no-go criteria, and <\/em>[name]<em> owned the plan and the team.&quot;<\/em><\/p>", "source": "answers.md", "search": "the task step is the one candidates skip entirely. what is it for, and what breaks without it? task is where you state what you were on the hook for, and what you were not . skipping it produces the most common structural failure in behavioural answers: a story where it is impossible to tell which parts were yours. it also does two useful things: - it establishes scope honestly and pre-empts the \"what exactly was your role?\" probe, which is much better asked by you than by them. - it sets up the counterfactual, because the interviewer now knows what would have gone unowned. one sentence: \"i was the architect on it, not the delivery lead - i owned the design and the go/no-go criteria, and [name] owned the plan and the team.\""}, {"n": 20, "category": 2, "difficulty": "D", "html": "How do you keep &quot;Action&quot; in the first person without sounding like you took credit for a team&#x27;s work?", "answerTitle": "First person without stealing credit", "answer": "<p>Use <strong>&quot;I decided&quot; for decisions and &quot;we&quot; for execution<\/strong>, and be scrupulous about which is which. That single rule resolves most of it.<\/p><p>Three reinforcements:<\/p><ul><li>Give away something specific and real: <em>&quot;the actual cutover script was <\/em>[name]<em>&#x27;s work and it was better than mine would have been.&quot;<\/em> Specific credit makes your claims more believable, not less.<\/li><li>Attach your claims to artifacts - the document you wrote, the decision you made, the conversation you had. Those are unambiguously singular.<\/li><li>Never say &quot;we&quot; for a decision you made alone. It sounds modest and reads as vague, and the interviewer cannot score it.<\/li><\/ul><p><strong>Red flag in the other direction:<\/strong> a story with no &quot;we&quot; at all. At principal level, a person who did everything themselves is describing a failure of leverage.<\/p>", "source": "answers.md", "search": "how do you keep \"action\" in the first person without sounding like you took credit for a team's work? use \"i decided\" for decisions and \"we\" for execution , and be scrupulous about which is which. that single rule resolves most of it. three reinforcements: - give away something specific and real: \"the actual cutover script was [name] 's work and it was better than mine would have been.\" specific credit makes your claims more believable, not less. - attach your claims to artifacts - the document you wrote, the decision you made, the conversation you had. those are unambiguously singular. - never say \"we\" for a decision you made alone. it sounds modest and reads as vague, and the interviewer cannot score it. red flag in the other direction: a story with no \"we\" at all. at principal level, a person who did everything themselves is describing a failure of leverage."}, {"n": 21, "category": 2, "difficulty": "T", "html": "How do you quantify a Result when the numbers are confidential, lost, or were never measured?", "answerTitle": "Quantifying a confidential or lost result", "answer": "<p>Never say &quot;I cannot share numbers&quot; and stop. Three legitimate substitutes, in descending order of strength:<\/p><ol><li><strong>Ratios and percentages.<\/strong> &quot;Costs came down by about <em>[percentage]<\/em>&quot; leaks nothing and is fully scoreable.<\/li><li><strong>Orders of magnitude and units of work.<\/strong> &quot;Tens of thousands of requests a second&quot;, &quot;a two-person team for a quarter&quot;, &quot;single-digit millions of rows&quot;.<\/li><li><strong>Structural change.<\/strong> &quot;It went from a weekly manual reconciliation to an automated one&quot; is a number of a kind - a frequency that went to zero.<\/li><\/ol><p>Say the constraint once, briefly, then give the substitute: <em>&quot;I cannot give absolute revenue, but the fraud loss rate dropped by about <\/em>[percentage]<em> and it paid for itself inside <\/em>[months]<em>.&quot;<\/em><\/p><p><strong>If it was never measured, say so and say what you would measure now.<\/strong> That is an honest answer that demonstrates the Learning. What kills you is vagueness with no acknowledgement - &quot;significantly improved&quot; with nothing behind it.<\/p>", "source": "answers.md", "search": "how do you quantify a result when the numbers are confidential, lost, or were never measured? never say \"i cannot share numbers\" and stop. three legitimate substitutes, in descending order of strength: 1. ratios and percentages. \"costs came down by about [percentage] \" leaks nothing and is fully scoreable. 2. orders of magnitude and units of work. \"tens of thousands of requests a second\", \"a two-person team for a quarter\", \"single-digit millions of rows\". 3. structural change. \"it went from a weekly manual reconciliation to an automated one\" is a number of a kind - a frequency that went to zero. say the constraint once, briefly, then give the substitute: \"i cannot give absolute revenue, but the fraud loss rate dropped by about [percentage] and it paid for itself inside [months] .\" if it was never measured, say so and say what you would measure now. that is an honest answer that demonstrates the learning. what kills you is vagueness with no acknowledgement - \"significantly improved\" with nothing behind it."}, {"n": 22, "category": 2, "difficulty": "D", "html": "What kinds of numbers actually land: absolute, relative, or cost? Give the ordering and why.", "answerTitle": "Which numbers land", "answer": "<p>The ordering, strongest first:<\/p><ol><li><strong>Money<\/strong> - cost saved, revenue enabled, spend per unit. It is the only number every interviewer in the loop can interpret without context.<\/li><li><strong>Time<\/strong> - lead time, MTTR, deployment frequency, hours of manual work removed. Second best because it converts to money mentally.<\/li><li><strong>Relative performance<\/strong> - p99 from <em>[before]<\/em> to <em>[after]<\/em>, error rate, throughput. Strong when paired with why it mattered.<\/li><li><strong>Absolute scale<\/strong> - requests per second, users, data volume. Weakest on its own, because it describes the system rather than your contribution, but essential in the Situation to establish stakes.<\/li><\/ol><p><strong>The pairing rule:<\/strong> a Result number is only meaningful against a Situation number of the same kind. &quot;p99 240 milliseconds&quot; means nothing; &quot;1.4 seconds to 240 milliseconds&quot; means everything.<\/p>", "source": "answers.md", "search": "what kinds of numbers actually land: absolute, relative, or cost? give the ordering and why. the ordering, strongest first: 1. money - cost saved, revenue enabled, spend per unit. it is the only number every interviewer in the loop can interpret without context. 2. time - lead time, mttr, deployment frequency, hours of manual work removed. second best because it converts to money mentally. 3. relative performance - p99 from [before] to [after] , error rate, throughput. strong when paired with why it mattered. 4. absolute scale - requests per second, users, data volume. weakest on its own, because it describes the system rather than your contribution, but essential in the situation to establish stakes. the pairing rule: a result number is only meaningful against a situation number of the same kind. \"p99 240 milliseconds\" means nothing; \"1.4 seconds to 240 milliseconds\" means everything."}, {"n": 23, "category": 2, "difficulty": "T", "html": "Your most impressive result was mostly caused by something outside your control. How do you tell it honestly and still get credit?", "answerTitle": "When the result was mostly not you", "answer": "<p>Tell it with the attribution built in, early, in your own voice. The risk you are managing is not modesty, it is being caught overclaiming - which retroactively discounts every other story in the loop.<\/p><blockquote><p>&quot;The headline number is <em>[X]<\/em>, and I want to be precise about attribution: most of that came from <em>[the platform change / the traffic drop / another team&#x27;s work]<\/em>. My contribution was <em>[the specific thing]<\/em>, which I would size at <em>[the smaller number]<\/em>. The reason I still think it is worth telling is <em>[the decision or the judgement in it]<\/em>.&quot;<\/p><\/blockquote><p>Then spend the story on your actual contribution. <strong>A smaller number you clearly own beats a large one you have to hedge<\/strong>, and volunteering the attribution is itself scoreable evidence of the honesty they are testing for.<\/p>", "source": "answers.md", "search": "your most impressive result was mostly caused by something outside your control. how do you tell it honestly and still get credit? tell it with the attribution built in, early, in your own voice. the risk you are managing is not modesty, it is being caught overclaiming - which retroactively discounts every other story in the loop. \"the headline number is [x] , and i want to be precise about attribution: most of that came from [the platform change / the traffic drop / another team's work] . my contribution was [the specific thing] , which i would size at [the smaller number] . the reason i still think it is worth telling is [the decision or the judgement in it] .\" then spend the story on your actual contribution. a smaller number you clearly own beats a large one you have to hedge , and volunteering the attribution is itself scoreable evidence of the honesty they are testing for."}, {"n": 24, "category": 2, "difficulty": "D", "html": "What separates a Learning that scores from one that sounds like a platitude?", "answerTitle": "A Learning that scores", "answer": "<p>A scoring Learning is a <strong>rule you now apply<\/strong>, stated in a form that could tell you what to do in a situation you have not met yet. A platitude is a description of the incident with &quot;should have&quot; in front of it.<\/p><table><thead><tr><th>Platitude<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td>I learned to communicate better<\/td><td>I now write the go/no-go criteria down and get them agreed while everyone is calm, three weeks before the cutover, not on the night<\/td><\/tr><tr><td>I learned to test more thoroughly<\/td><td>I now insist on a load test at production volume before the design is considered accepted, because the sizing assumption is the thing most likely to be wrong<\/td><\/tr><tr><td>I learned to involve stakeholders early<\/td><td>I now ask &quot;who finds out about this from a dashboard rather than from me?&quot; at the start of any migration<\/td><\/tr><\/tbody><\/table><p>The test: does the sentence constrain a future decision? If it could be printed on a poster, it is not a Learning.<\/p>", "source": "answers.md", "search": "what separates a learning that scores from one that sounds like a platitude? a scoring learning is a rule you now apply , stated in a form that could tell you what to do in a situation you have not met yet. a platitude is a description of the incident with \"should have\" in front of it. platitude rule --- --- i learned to communicate better i now write the go/no-go criteria down and get them agreed while everyone is calm, three weeks before the cutover, not on the night i learned to test more thoroughly i now insist on a load test at production volume before the design is considered accepted, because the sizing assumption is the thing most likely to be wrong i learned to involve stakeholders early i now ask \"who finds out about this from a dashboard rather than from me?\" at the start of any migration the test: does the sentence constrain a future decision? if it could be printed on a poster, it is not a learning."}, {"n": 25, "category": 2, "difficulty": "D", "html": "How do you show that a Learning is real rather than retrofitted?", "answerTitle": "Showing the Learning is real", "answer": "<p><strong>Give the second instance.<\/strong> One sentence: <em>&quot;I applied that on <\/em>[the next project]<em>, and it caught <\/em>[the specific thing]<em> about six weeks before it would have hurt.&quot;<\/em><\/p><p>This is the single highest-value sentence available in a behavioural answer and almost nobody says it, because it requires having thought about your career as a sequence rather than a set. It converts a claim about self-awareness into evidence of change.<\/p><p>Two weaker but usable forms: a durable artifact (&quot;the checklist is still in the template&quot;), or the cost you now willingly pay (&quot;it makes design review slower, and I have accepted that trade&quot;).<\/p>", "source": "answers.md", "search": "how do you show that a learning is real rather than retrofitted? give the second instance. one sentence: \"i applied that on [the next project] , and it caught [the specific thing] about six weeks before it would have hurt.\" this is the single highest-value sentence available in a behavioural answer and almost nobody says it, because it requires having thought about your career as a sequence rather than a set. it converts a claim about self-awareness into evidence of change. two weaker but usable forms: a durable artifact (\"the checklist is still in the template\"), or the cost you now willingly pay (\"it makes design review slower, and i have accepted that trade\")."}, {"n": 26, "category": 2, "difficulty": "D", "html": "What is a story spine, and why memorize it instead of the story?", "answerTitle": "The story spine", "answer": "<p>The spine is the four sentences the story reduces to: <strong>stakes with a number, the decision, the outcome with a number, the learning<\/strong>. You memorize the spine and improvise the rest.<\/p><p>Why not memorize the story: a memorized story is detectable within two sentences (the cadence changes), it cannot be re-aimed at the competency actually being asked about, and it collapses when interrupted. A spine survives interruption, because you always know which of the four sentences you have not yet said.<\/p><p>Write the spine on the one-page sheet (Q42). Rehearsing is rehearsing the spine plus the fifteen or so details you might be asked for - not the paragraph.<\/p>", "source": "answers.md", "search": "what is a story spine, and why memorize it instead of the story? the spine is the four sentences the story reduces to: stakes with a number, the decision, the outcome with a number, the learning . you memorize the spine and improvise the rest. why not memorize the story: a memorized story is detectable within two sentences (the cadence changes), it cannot be re-aimed at the competency actually being asked about, and it collapses when interrupted. a spine survives interruption, because you always know which of the four sentences you have not yet said. write the spine on the one-page sheet (q42). rehearsing is rehearsing the spine plus the fifteen or so details you might be asked for - not the paragraph."}, {"n": 27, "category": 2, "difficulty": "D", "html": "How do you compress a six-minute story into two minutes without turning it into a summary?", "answerTitle": "Six minutes into two", "answer": "<p>Compression is <strong>cutting, not summarizing<\/strong>. A summary of the six-minute version is the classic failure: it keeps the same shape and loses all the detail, so it ends up abstract, which is the opposite of what you want.<\/p><p>The method: keep the spine intact and keep <strong>one<\/strong> vivid detail. Cut in this order - background and history, the chronology of how the project started, secondary characters, the intermediate steps of the Action, the technical mechanism.<\/p><p>What must survive at two minutes: both numbers, the decision with its rejected alternative, one named person, and the Learning. That is achievable in about 250 words.<\/p><p><strong>And the reverse:<\/strong> the six-minute version is not the two-minute one slowed down. It adds the constraint that forced the design, the alternative in detail, the part that turned out wrong, and what you would do now.<\/p>", "source": "answers.md", "search": "how do you compress a six-minute story into two minutes without turning it into a summary? compression is cutting, not summarizing . a summary of the six-minute version is the classic failure: it keeps the same shape and loses all the detail, so it ends up abstract, which is the opposite of what you want. the method: keep the spine intact and keep one vivid detail. cut in this order - background and history, the chronology of how the project started, secondary characters, the intermediate steps of the action, the technical mechanism. what must survive at two minutes: both numbers, the decision with its rejected alternative, one named person, and the learning. that is achievable in about 250 words. and the reverse: the six-minute version is not the two-minute one slowed down. it adds the constraint that forced the design, the alternative in detail, the part that turned out wrong, and what you would do now."}, {"n": 28, "category": 2, "difficulty": "T", "html": "The interviewer interrupts your Situation with &quot;so what did you do?&quot; What has gone wrong and how do you recover the structure?", "answerTitle": "Interrupted during the Situation", "answer": "<p>They have told you the Situation is too long. Do not finish the sentence you were on.<\/p><blockquote><p>&quot;Sorry - short version: <em>[one clause of stakes]<\/em>. What I did was...&quot;<\/p><\/blockquote><p>Then answer, and <strong>put the structure back at the end<\/strong> rather than defending it in the middle: close with the outcome and one line of context you skipped, if it is needed. If the interruption happens twice in a round, your Situations are running long across the board and you should shorten every one of them for the rest of the loop.<\/p><p>Do not treat it as hostility. It is nearly always time management, and reacting smoothly to it is itself a small positive signal.<\/p>", "source": "answers.md", "search": "the interviewer interrupts your situation with \"so what did you do?\" what has gone wrong and how do you recover the structure? they have told you the situation is too long. do not finish the sentence you were on. \"sorry - short version: [one clause of stakes] . what i did was...\" then answer, and put the structure back at the end rather than defending it in the middle: close with the outcome and one line of context you skipped, if it is needed. if the interruption happens twice in a round, your situations are running long across the board and you should shorten every one of them for the rest of the loop. do not treat it as hostility. it is nearly always time management, and reacting smoothly to it is itself a small positive signal."}, {"n": 29, "category": 2, "difficulty": "D", "html": "How do you handle a story where the outcome was genuinely bad?", "answerTitle": "A story with a genuinely bad outcome", "answer": "<p>Tell it as a <strong>decision-quality story, not an outcome story<\/strong>. The interviewer knows that good decisions sometimes lose; what they are checking is whether you can tell the difference.<\/p><p>The structure:<\/p><ol><li>What you knew at the time, and the decision that followed from it - defensible on its own terms.<\/li><li>What actually happened, plainly, with the cost. No softening.<\/li><li><strong>The separation<\/strong>: which part was a bad decision and which was a bad outcome. This is the sentence being scored.<\/li><li>The systemic change afterwards, and the evidence it stuck.<\/li><\/ol><blockquote><p>&quot;The decision was reasonable with what we had. What was not reasonable was that we had no way to find out we were wrong for four months - that was the actual failure, and it is what I changed.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "how do you handle a story where the outcome was genuinely bad? tell it as a decision-quality story, not an outcome story . the interviewer knows that good decisions sometimes lose; what they are checking is whether you can tell the difference. the structure: 1. what you knew at the time, and the decision that followed from it - defensible on its own terms. 2. what actually happened, plainly, with the cost. no softening. 3. the separation : which part was a bad decision and which was a bad outcome. this is the sentence being scored. 4. the systemic change afterwards, and the evidence it stuck. \"the decision was reasonable with what we had. what was not reasonable was that we had no way to find out we were wrong for four months - that was the actual failure, and it is what i changed.\""}, {"n": 30, "category": 2, "difficulty": "D", "html": "Where should a story&#x27;s technical depth live so that it is available on demand but not in the way?", "answerTitle": "Where the technical depth lives", "answer": "<p><strong>At the decision point, one level deep, with an offer to go further.<\/strong> The story should contain exactly enough mechanism to explain why the alternative was rejected, and then move on.<\/p><p>Practically: hold the depth in three layers you can produce on demand - the mechanism (why an outbox rather than a dual write), the numbers (partition count, p99, cost per million), and the failure mode you actually hit. The interviewer decides how deep to go by following up; your job is to make it obvious that the depth exists.<\/p><p>The pointer sentence does this in eight words: <em>&quot;the reason was the partial-failure case, if that is interesting.&quot;<\/em><\/p>", "source": "answers.md", "search": "where should a story's technical depth live so that it is available on demand but not in the way? at the decision point, one level deep, with an offer to go further. the story should contain exactly enough mechanism to explain why the alternative was rejected, and then move on. practically: hold the depth in three layers you can produce on demand - the mechanism (why an outbox rather than a dual write), the numbers (partition count, p99, cost per million), and the failure mode you actually hit. the interviewer decides how deep to go by following up; your job is to make it obvious that the depth exists. the pointer sentence does this in eight words: \"the reason was the partial-failure case, if that is interesting.\""}, {"n": 31, "category": 2, "difficulty": "T", "html": "How recent must a story be, and what is the cost of a great story from 2013?", "answerTitle": "How old a story can be", "answer": "<p>The rule of thumb: <strong>most of your bank should be from the last five years, and nothing load-bearing older than eight.<\/strong> A great story from 2013 is usable as a supporting example and dangerous as a primary one.<\/p><p>Three reasons an old story costs you:<\/p><ul><li>It invites the question of what you have done since, which is the question you least want.<\/li><li>The technology context has moved, so the judgement may not transfer - a 2013 scaling decision may read as a solved problem now.<\/li><li>Levelling is about current operating altitude. Your strongest evidence of principal behaviour should be recent, or the panel concludes it is historic.<\/li><\/ul><p><strong>When the old story is genuinely the best one<\/strong>, bridge it forward: <em>&quot;the recent version of the same judgement is <\/em>[a 2024 example]<em>, which is smaller but the same shape.&quot;<\/em><\/p>", "source": "answers.md", "search": "how recent must a story be, and what is the cost of a great story from 2013? the rule of thumb: most of your bank should be from the last five years, and nothing load-bearing older than eight. a great story from 2013 is usable as a supporting example and dangerous as a primary one. three reasons an old story costs you: - it invites the question of what you have done since, which is the question you least want. - the technology context has moved, so the judgement may not transfer - a 2013 scaling decision may read as a solved problem now. - levelling is about current operating altitude. your strongest evidence of principal behaviour should be recent, or the panel concludes it is historic. when the old story is genuinely the best one , bridge it forward: \"the recent version of the same judgement is [a 2024 example] , which is smaller but the same shape.\""}, {"n": 32, "category": 2, "difficulty": "D", "html": "How do you tell a story about a multi-year programme without the timeline swallowing the answer?", "answerTitle": "A multi-year programme in one answer", "answer": "<p>Do not narrate the timeline. Pick <strong>one decision inside the programme<\/strong> and tell that, with the programme as the Situation.<\/p><blockquote><p>&quot;It was a <em>[N]<\/em>-month migration of <em>[scale]<\/em>. Rather than walk the whole thing, let me take the decision that defined it: we refused the decomposition and rehosted first. Here is why, who disagreed, and what it cost us.&quot;<\/p><\/blockquote><p>Then offer the rest: <em>&quot;I can walk the phases if the sequencing is what is interesting.&quot;<\/em> This gives the interviewer control and demonstrates that you can compress - which is itself the communication signal.<\/p><p><strong>The failure mode<\/strong> is the chronological walk: month one we did discovery, month two we... Nine minutes later there is no decision in the notes.<\/p>", "source": "answers.md", "search": "how do you tell a story about a multi-year programme without the timeline swallowing the answer? do not narrate the timeline. pick one decision inside the programme and tell that, with the programme as the situation. \"it was a [n] -month migration of [scale] . rather than walk the whole thing, let me take the decision that defined it: we refused the decomposition and rehosted first. here is why, who disagreed, and what it cost us.\" then offer the rest: \"i can walk the phases if the sequencing is what is interesting.\" this gives the interviewer control and demonstrates that you can compress - which is itself the communication signal. the failure mode is the chronological walk: month one we did discovery, month two we... nine minutes later there is no decision in the notes."}, {"n": 33, "category": 2, "difficulty": "A", "html": "Build a scoring rubric for your own stories that a non-technical friend could apply.", "answerTitle": "A rubric a non-technical friend could apply", "answer": "<p>Five yes/no questions, scored on the recording rather than from memory:<\/p><ol><li><strong>Did you say a number in the first thirty seconds?<\/strong><\/li><li><strong>Can I name the decision you made, and what you decided against?<\/strong><\/li><li><strong>Was there a person in the story who wanted something different?<\/strong><\/li><li><strong>Did anything go wrong, and did you say so before being asked?<\/strong><\/li><li><strong>Can I repeat back, in one sentence, what was different afterwards?<\/strong><\/li><\/ol><p>Four or five is interview-ready. Three is a story that needs work, and the missing item tells you which. Two or fewer means the story is a project description.<\/p><p>Add one open question for calibration: <strong>&quot;what did you personally do?&quot;<\/strong> If your friend cannot answer it, no interviewer will be able to either.<\/p>", "source": "answers.md", "search": "build a scoring rubric for your own stories that a non-technical friend could apply. five yes/no questions, scored on the recording rather than from memory: 1. did you say a number in the first thirty seconds? 2. can i name the decision you made, and what you decided against? 3. was there a person in the story who wanted something different? 4. did anything go wrong, and did you say so before being asked? 5. can i repeat back, in one sentence, what was different afterwards? four or five is interview-ready. three is a story that needs work, and the missing item tells you which. two or fewer means the story is a project description. add one open question for calibration: \"what did you personally do?\" if your friend cannot answer it, no interviewer will be able to either."}, {"n": 34, "category": 2, "difficulty": "A", "html": "You have nineteen years of material and can prepare eight stories. What selection criteria maximize coverage?", "answerTitle": "Selecting eight stories from nineteen years", "answer": "<p>Select for <strong>coverage and evidence density<\/strong>, not for pride. The criteria, applied in order:<\/p><ol><li><strong>Competency coverage.<\/strong> The eight must collectively cover all nine competencies in <a href=\"README.md\">README.md<\/a>, with two independent stories for the three most central to the target role.<\/li><li><strong>Recency.<\/strong> At least five from the last five years, including one from the AI work since 2024.<\/li><li><strong>Evidence density.<\/strong> Each must pass the Q17 checklist. A more impressive story that fails the checklist loses to a smaller one that passes.<\/li><li><strong>Variety of shape.<\/strong> Not four migrations. Aim for a build, a rescue, an incident, a people story, a standards story, a decision you lost, a failure, and one where you changed your own mind.<\/li><li><strong>Scale range.<\/strong> At least two where the scope was an organization rather than a system, because those are the ones that carry the level.<\/li><li><strong>Emotional range.<\/strong> At least two where you come out imperfectly. A bank of eight wins is not credible at nineteen years.<\/li><\/ol><p>Then build the coverage matrix (Q39) and look at the holes before writing a word.<\/p>", "source": "answers.md", "search": "you have nineteen years of material and can prepare eight stories. what selection criteria maximize coverage? select for coverage and evidence density , not for pride. the criteria, applied in order: 1. competency coverage. the eight must collectively cover all nine competencies in readme.md, with two independent stories for the three most central to the target role. 2. recency. at least five from the last five years, including one from the ai work since 2024. 3. evidence density. each must pass the q17 checklist. a more impressive story that fails the checklist loses to a smaller one that passes. 4. variety of shape. not four migrations. aim for a build, a rescue, an incident, a people story, a standards story, a decision you lost, a failure, and one where you changed your own mind. 5. scale range. at least two where the scope was an organizatio
