e cost and what you did about it is what turns tenure from a question into an asset."}, {"n": 233, "category": 15, "difficulty": "D", "html": "&quot;What did you do in the last two years that you could not have done five years ago?&quot;", "answerTitle": "What you can do now that you could not five years ago", "answer": "<p>Answer with a <strong>capability, not a technology<\/strong>, and give evidence.<\/p><blockquote><p>&quot;Two things. The obvious one is the AI work - not prompt engineering, but the engineering discipline around a non-deterministic component: evaluation before deployment, cost per interaction as a design constraint, and grounding and fallback for when it is confidently wrong. Concretely: <em>[the system]<\/em>, <em>[the quality measure]<\/em>, <em>[the cost figure]<\/em>.<\/p><\/blockquote><blockquote><p>The less obvious and more important one: five years ago I would have solved a cross-team problem by building something. Now I am much more likely to find out why the current behaviour is rational for the people doing it, and change that. <em>[The specific example]<\/em>. That is the change that took the longest and it is the one that matters more.&quot;<\/p><\/blockquote><p>The second half is what distinguishes a nineteen-year candidate from a nine-year one, and most candidates only give the first.<\/p>", "source": "answers.md", "search": "\"what did you do in the last two years that you could not have done five years ago?\" answer with a capability, not a technology , and give evidence. \"two things. the obvious one is the ai work - not prompt engineering, but the engineering discipline around a non-deterministic component: evaluation before deployment, cost per interaction as a design constraint, and grounding and fallback for when it is confidently wrong. concretely: [the system] , [the quality measure] , [the cost figure] . the less obvious and more important one: five years ago i would have solved a cross-team problem by building something. now i am much more likely to find out why the current behaviour is rational for the people doing it, and change that. [the specific example] . that is the change that took the longest and it is the one that matters more.\" the second half is what distinguishes a nineteen-year candidate from a nine-year one, and most candidates only give the first."}, {"n": 234, "category": 15, "difficulty": "T", "html": "Nineteen years and no manager title. How do you frame the principal track as a choice?", "answerTitle": "No manager title", "answer": "<p>Frame it as a <strong>fork you took deliberately<\/strong>, with evidence of the leadership work, and no defensiveness.<\/p><blockquote><p>&quot;I have led people - <em>[N]<\/em> engineers on <em>[the programme]<\/em>, technical leadership across <em>[N]<\/em> teams, mentoring that produced <em>[the specific outcome]<\/em>. What I have not done is own headcount, ratings and hiring plans, and that was a choice: twice, the route to more scope was a management role, and both times I took the technical one because <em>[the honest reason - the problems I want to solve are technical, and the leverage I get from architecture and standards is real]<\/em>.<\/p><\/blockquote><blockquote><p>The practical difference is that I have to get things done through influence rather than reporting lines, which I would argue is the harder version - <em>[the example]<\/em>. If the role needs someone to own performance management and headcount, I would want to talk about that specifically, because it is the part I have not done.&quot;<\/p><\/blockquote><p><strong>The honesty at the end is what makes the rest credible.<\/strong> Do not claim management experience you do not have; claim the leadership evidence you do, and be precise about the boundary (see also Q141).<\/p>", "source": "answers.md", "search": "nineteen years and no manager title. how do you frame the principal track as a choice? frame it as a fork you took deliberately , with evidence of the leadership work, and no defensiveness. \"i have led people - [n] engineers on [the programme] , technical leadership across [n] teams, mentoring that produced [the specific outcome] . what i have not done is own headcount, ratings and hiring plans, and that was a choice: twice, the route to more scope was a management role, and both times i took the technical one because [the honest reason - the problems i want to solve are technical, and the leverage i get from architecture and standards is real] . the practical difference is that i have to get things done through influence rather than reporting lines, which i would argue is the harder version - [the example] . if the role needs someone to own performance management and headcount, i would want to talk about that specifically, because it is the part i have not done.\" the honesty at the end is what makes the rest credible. do not claim management experience you do not have; claim the leadership evidence you do, and be precise about the boundary (see also q141)."}, {"n": 235, "category": 15, "difficulty": "D", "html": "&quot;Why AI, and why in 2024?&quot; Answer it so it does not sound like following a trend.", "answerTitle": "Why AI, and why 2024", "answer": "<p>Ground it in a problem rather than a trend.<\/p><blockquote><p>&quot;The trigger was <em>[the concrete problem - a document-heavy workflow at a client, a support cost, a search problem]<\/em> where the classical approach had a ceiling we had already hit. In 2024 the economics changed enough that <em>[the specific capability]<\/em> became viable, and I could actually build it rather than write a paper about it.<\/p><\/blockquote><blockquote><p>What made me stay in it is that it turned out to be an engineering problem more than a modelling one - the model is a component, and everything that makes it work in production is what I have been doing for nineteen years: latency budgets, cost per call, failure modes, evaluation, data boundaries, and what happens when the dependency is wrong. <em>[The system]<\/em> is a good example: <em>[the concrete detail with a number]<\/em>.&quot;<\/p><\/blockquote><p><strong>The anti-trend signal<\/strong> is a specific problem, a specific date, and an opinion about what does not work: <em>&quot;the thing I am most sceptical about is <\/em>[the honest one - agents with unbounded tool access, or fine-tuning as the first resort]<em>, and here is what changed my mind about it.&quot;<\/em><\/p>", "source": "answers.md", "search": "\"why ai, and why in 2024?\" answer it so it does not sound like following a trend. ground it in a problem rather than a trend. \"the trigger was [the concrete problem - a document-heavy workflow at a client, a support cost, a search problem] where the classical approach had a ceiling we had already hit. in 2024 the economics changed enough that [the specific capability] became viable, and i could actually build it rather than write a paper about it. what made me stay in it is that it turned out to be an engineering problem more than a modelling one - the model is a component, and everything that makes it work in production is what i have been doing for nineteen years: latency budgets, cost per call, failure modes, evaluation, data boundaries, and what happens when the dependency is wrong. [the system] is a good example: [the concrete detail with a number] .\" the anti-trend signal is a specific problem, a specific date, and an opinion about what does not work: \"the thing i am most sceptical about is [the honest one - agents with unbounded tool access, or fine-tuning as the first resort] , and here is what changed my mind about it.\""}, {"n": 236, "category": 15, "difficulty": "D", "html": "How do you present depth in AI acquired over two years next to nineteen years of platform work?", "answerTitle": "Two years of AI next to nineteen of platform", "answer": "<p>Position them as one thing, not two.<\/p><blockquote><p>&quot;I would not present myself as an AI researcher and I would not be believable if I did. What I am is a platform engineer who has spent two years putting probabilistic components into production systems - and the second sentence is the one that matters, because the hard part of that work is not the model.<\/p><\/blockquote><blockquote><p>Concretely, what nineteen years buys in this space: I cost it before building it; I treat the model as a dependency with a failure mode and design the fallback first; I know what an evaluation harness has to look like because it is a test suite with a different definition of pass; and I have a strong prior that the retrieval and the data plumbing will be where the quality actually comes from. <em>[The example with the number.]<\/em><\/p><\/blockquote><blockquote><p>What I would want to learn from someone deeper than me: <em>[the honest gap - the modelling side, or the serving optimizations]<\/em>.&quot;<\/p><\/blockquote><p>The pattern - <strong>claim the intersection, name the gap<\/strong> - is more convincing than claiming the field.<\/p>", "source": "answers.md", "search": "how do you present depth in ai acquired over two years next to nineteen years of platform work? position them as one thing, not two. \"i would not present myself as an ai researcher and i would not be believable if i did. what i am is a platform engineer who has spent two years putting probabilistic components into production systems - and the second sentence is the one that matters, because the hard part of that work is not the model. concretely, what nineteen years buys in this space: i cost it before building it; i treat the model as a dependency with a failure mode and design the fallback first; i know what an evaluation harness has to look like because it is a test suite with a different definition of pass; and i have a strong prior that the retrieval and the data plumbing will be where the quality actually comes from. [the example with the number.] what i would want to learn from someone deeper than me: [the honest gap - the modelling side, or the serving optimizations] .\" the pattern - claim the intersection, name the gap - is more convincing than claiming the field."}, {"n": 237, "category": 15, "difficulty": "D", "html": "&quot;What are you looking for in your next role?&quot; Answer it in terms of the problem rather than the title.", "answerTitle": "What you are looking for", "answer": "<p>Answer in terms of the <strong>problem and the operating conditions<\/strong>, not the title.<\/p><blockquote><p>&quot;Three things. A system where the hard part is architectural rather than organizational - <em>[scale, distribution, real-time, or a domain constraint]<\/em>. A role where I own the technical direction of something rather than advising on it, with the accountability that goes with that. And an environment where the AI work is a product concern rather than an experiment, because I have done the experiment version and the interesting problems are on the other side of it.<\/p><\/blockquote><blockquote><p>What I am not looking for is <em>[the honest one - pure management, or a role where architecture is separated from delivery]<\/em>. And the thing that would make me say yes to something otherwise imperfect is <em>[the specific one - the team, or the problem]<\/em>.&quot;<\/p><\/blockquote><p>Then turn it: <em>&quot;which of those does this role actually have?&quot;<\/em> - which is a real question and reads as someone evaluating rather than applying.<\/p>", "source": "answers.md", "search": "\"what are you looking for in your next role?\" answer it in terms of the problem rather than the title. answer in terms of the problem and the operating conditions , not the title. \"three things. a system where the hard part is architectural rather than organizational - [scale, distribution, real-time, or a domain constraint] . a role where i own the technical direction of something rather than advising on it, with the accountability that goes with that. and an environment where the ai work is a product concern rather than an experiment, because i have done the experiment version and the interesting problems are on the other side of it. what i am not looking for is [the honest one - pure management, or a role where architecture is separated from delivery] . and the thing that would make me say yes to something otherwise imperfect is [the specific one - the team, or the problem] .\" then turn it: \"which of those does this role actually have?\" - which is a real question and reads as someone evaluating rather than applying."}, {"n": 238, "category": 15, "difficulty": "T", "html": "&quot;Why are you leaving Sonata?&quot; Answer without one negative word.", "answerTitle": "Why are you leaving", "answer": "<p>The formula: <strong>something positive you got, something you now want, and the honest observation that this role has it.<\/strong> No criticism, no evasion, no more than forty seconds.<\/p><blockquote><p>&quot;Sonata gave me the breadth I moved for - multiple clients, multiple architectures, and the client-facing side, which I did not have before. What I want next is depth and continuity: to own a system over years rather than engagements, and to be accountable for what happens to it in production. That is structurally hard in a services model and it is not a complaint about it - it is what the model is. This role is a product organization with <em>[the specific thing]<\/em>, which is the other side of that trade.&quot;<\/p><\/blockquote><p><strong>Never say:<\/strong> anything about management, pay, politics, or a specific person. If pay is genuinely a factor, it belongs in the compensation conversation, not here. If the honest answer is a bad situation, compress it to the structural fact and move to what you want.<\/p>", "source": "answers.md", "search": "\"why are you leaving sonata?\" answer without one negative word. the formula: something positive you got, something you now want, and the honest observation that this role has it. no criticism, no evasion, no more than forty seconds. \"sonata gave me the breadth i moved for - multiple clients, multiple architectures, and the client-facing side, which i did not have before. what i want next is depth and continuity: to own a system over years rather than engagements, and to be accountable for what happens to it in production. that is structurally hard in a services model and it is not a complaint about it - it is what the model is. this role is a product organization with [the specific thing] , which is the other side of that trade.\" never say: anything about management, pay, politics, or a specific person. if pay is genuinely a factor, it belongs in the compensation conversation, not here. if the honest answer is a bad situation, compress it to the structural fact and move to what you want."}, {"n": 239, "category": 15, "difficulty": "D", "html": "&quot;What is your biggest weakness?&quot; - the version that works at principal level.", "answerTitle": "Biggest weakness at principal level", "answer": "<p>Give a real one, with the context where it bites, the accommodation, and the evidence. Use the structure from Q229.<\/p><blockquote><p>&quot;I front-load design and I am slower than I should be on work that is genuinely disposable. It comes from having maintained my own systems for years, and it is wrong for a team that is trying to find out whether something is worth building at all.<\/p><\/blockquote><blockquote><p>What I do about it: I ask what the reversal cost is before I insist on anything, and when the answer is &#x27;we will throw this away&#x27;, I say out loud that we are deliberately dropping the standards and put a date on when we revisit. <em>[The specific case where I did this.]<\/em><\/p><\/blockquote><blockquote><p>The residual: I still have to be told sometimes, and the person who tells me is usually <em>[a product manager / a specific colleague]<\/em>, which is why I want that voice close to me rather than at a distance.&quot;<\/p><\/blockquote><p><strong>What does not work:<\/strong> a disguised strength, a weakness you have completely solved, or something so severe it disqualifies you. <strong>What works:<\/strong> something a colleague would recognize, with a working accommodation.<\/p>", "source": "answers.md", "search": "\"what is your biggest weakness?\" - the version that works at principal level. give a real one, with the context where it bites, the accommodation, and the evidence. use the structure from q229. \"i front-load design and i am slower than i should be on work that is genuinely disposable. it comes from having maintained my own systems for years, and it is wrong for a team that is trying to find out whether something is worth building at all. what i do about it: i ask what the reversal cost is before i insist on anything, and when the answer is 'we will throw this away', i say out loud that we are deliberately dropping the standards and put a date on when we revisit. [the specific case where i did this.] the residual: i still have to be told sometimes, and the person who tells me is usually [a product manager / a specific colleague] , which is why i want that voice close to me rather than at a distance.\" what does not work: a disguised strength, a weakness you have completely solved, or something so severe it disqualifies you. what works: something a colleague would recognize, with a working accommodation."}, {"n": 240, "category": 15, "difficulty": "D", "html": "&quot;Where do you want to be in five years?&quot; when the honest answer is &quot;doing roughly this&quot;.", "answerTitle": "Five years, when the honest answer is \"this\"", "answer": "<p>Say it, and make it about increasing depth and scope rather than about titles.<\/p><blockquote><p>&quot;Honestly, doing a version of this job with more scope. What I want in five years is to be the person who owns the technical direction for something substantial and has been there long enough to have lived with the consequences - I have found that the second and third year on a system is where the actual learning is, and I have spent the last few years in shorter engagements.<\/p><\/blockquote><blockquote><p>The specific thing I want to be better at is <em>[the honest one - the organizational side of technical leadership, or the depth in the AI serving stack]<\/em>. What I am not aiming for is a management ladder, and I would rather say that clearly than discover it later.&quot;<\/p><\/blockquote><p><strong>The failure modes:<\/strong> an ambition that is obviously not achievable here (which reads as using the role as a step), and a non-answer. Naming what you are <em>not<\/em> aiming for is what makes the rest believable.<\/p>", "source": "answers.md", "search": "\"where do you want to be in five years?\" when the honest answer is \"doing roughly this\". say it, and make it about increasing depth and scope rather than about titles. \"honestly, doing a version of this job with more scope. what i want in five years is to be the person who owns the technical direction for something substantial and has been there long enough to have lived with the consequences - i have found that the second and third year on a system is where the actual learning is, and i have spent the last few years in shorter engagements. the specific thing i want to be better at is [the honest one - the organizational side of technical leadership, or the depth in the ai serving stack] . what i am not aiming for is a management ladder, and i would rather say that clearly than discover it later.\" the failure modes: an ambition that is obviously not achievable here (which reads as using the role as a step), and a non-answer. naming what you are not aiming for is what makes the rest believable."}, {"n": 241, "category": 15, "difficulty": "D", "html": "How do you handle a gap, a short tenure or a role that did not go well?", "answerTitle": "A gap, a short tenure, or a role that went badly", "answer": "<p><strong>Short, factual, no defensiveness, and end on what you took from it.<\/strong> The length of the answer is the signal: a long answer is read as a wound.<\/p><blockquote><p>&quot;<em>[The role]<\/em> lasted <em>[N]<\/em> months. It was not a good fit - <em>[the neutral structural reason: the role turned out to be X rather than Y, or the funding for the programme changed]<\/em>. I would not do anything differently in the work; what I would do differently is ask <em>[the specific question]<\/em> in the interview, which I now always ask. <em>[Optional: what I got out of it.]<\/em>&quot;<\/p><\/blockquote><p>Rules: no blame, no explanation longer than three sentences, and a specific thing you now do differently. If it is a gap, say what it was for - caring responsibility, health, deliberate study - state that it is resolved, and move on.<\/p>", "source": "answers.md", "search": "how do you handle a gap, a short tenure or a role that did not go well? short, factual, no defensiveness, and end on what you took from it. the length of the answer is the signal: a long answer is read as a wound. \" [the role] lasted [n] months. it was not a good fit - [the neutral structural reason: the role turned out to be x rather than y, or the funding for the programme changed] . i would not do anything differently in the work; what i would do differently is ask [the specific question] in the interview, which i now always ask. [optional: what i got out of it.] \" rules: no blame, no explanation longer than three sentences, and a specific thing you now do differently. if it is a gap, say what it was for - caring responsibility, health, deliberate study - state that it is resolved, and move on."}, {"n": 242, "category": 15, "difficulty": "T", "html": "&quot;You are overqualified for this.&quot; Answer it.", "answerTitle": "You are overqualified", "answer": "<p>The concern behind it is real and specific: <strong>they think you will be bored, expensive, or gone in a year.<\/strong> Address the actual worry rather than protesting.<\/p><blockquote><p>&quot;I think what you are asking is whether I will be engaged in eighteen months. Let me answer that directly. The things that would make me leave are <em>[not having ownership, or the technical problems being solved]<\/em> - and from what you have described, <em>[the specific hard problem]<\/em> is not going to be solved in eighteen months.<\/p><\/blockquote><blockquote><p>On level: I am not looking for a bigger title, I am looking for a system I can own. If the role is scoped below that, I would rather find out now, so - what does the person in this role own after a year?&quot;<\/p><\/blockquote><p>The moves: <strong>name the concern<\/strong>, answer it with your actual criteria, and turn it into a question that tests whether the concern is justified. Do not say &quot;I am not overqualified&quot;, and do not accept the framing that you will do anything.<\/p>", "source": "answers.md", "search": "\"you are overqualified for this.\" answer it. the concern behind it is real and specific: they think you will be bored, expensive, or gone in a year. address the actual worry rather than protesting. \"i think what you are asking is whether i will be engaged in eighteen months. let me answer that directly. the things that would make me leave are [not having ownership, or the technical problems being solved] - and from what you have described, [the specific hard problem] is not going to be solved in eighteen months. on level: i am not looking for a bigger title, i am looking for a system i can own. if the role is scoped below that, i would rather find out now, so - what does the person in this role own after a year?\" the moves: name the concern , answer it with your actual criteria, and turn it into a question that tests whether the concern is justified. do not say \"i am not overqualified\", and do not accept the framing that you will do anything."}, {"n": 243, "category": 15, "difficulty": "D", "html": "&quot;What would your last three managers say about you?&quot; - including the criticism.", "answerTitle": "What your last three managers would say", "answer": "<p>Include the criticism, unprompted - that is the whole question.<\/p><blockquote><p>&quot;I think all three would say the same two things: that I am the person they gave the ambiguous problem to, and that they did not have to check up on it.<\/p><\/blockquote><blockquote><p>The criticism would differ. <em>[Manager A]<\/em> would say I was too willing to take on other teams&#x27; problems and it diluted my own delivery - that one is fair and I have got better at it. <em>[Manager B]<\/em> would say I pushed on <em>[the technical standard]<\/em> longer than the organization wanted, which I would partly accept: I was right about the substance and wrong about the pace. <em>[Manager C]<\/em> would probably say I was slow to escalate when <em>[X]<\/em>, and that is the one I still work on.&quot;<\/p><\/blockquote><p>Two or three specific positives, at least one real criticism, and a differentiated view of each - the differentiation is what makes it credible. <strong>A candidate whose three managers would all say identical, flattering things has not thought about it.<\/strong><\/p>", "source": "answers.md", "search": "\"what would your last three managers say about you?\" - including the criticism. include the criticism, unprompted - that is the whole question. \"i think all three would say the same two things: that i am the person they gave the ambiguous problem to, and that they did not have to check up on it. the criticism would differ. [manager a] would say i was too willing to take on other teams' problems and it diluted my own delivery - that one is fair and i have got better at it. [manager b] would say i pushed on [the technical standard] longer than the organization wanted, which i would partly accept: i was right about the substance and wrong about the pace. [manager c] would probably say i was slow to escalate when [x] , and that is the one i still work on.\" two or three specific positives, at least one real criticism, and a differentiated view of each - the differentiation is what makes it credible. a candidate whose three managers would all say identical, flattering things has not thought about it."}, {"n": 244, "category": 15, "difficulty": "D", "html": "&quot;What is something you believe about software that most engineers you know disagree with?&quot;", "answerTitle": "An unpopular technical belief", "answer": "<p>Pick something you can actually defend, then defend it with a mechanism and concede the strongest counterargument. The question is testing whether you have positions and whether you hold them well.<\/p><p>Candidates that work: most teams should run fewer services than they do; the majority of technical debt should never be paid (Q171); on-call for what you build is non-negotiable and is a design intervention rather than an operational one; test coverage as a target makes systems worse; most microservice boundaries are drawn from the org chart rather than the domain; retrieval quality matters more than model choice in most production AI systems.<\/p><blockquote><p>&quot;I think <em>[the belief]<\/em>. The reason is <em>[the mechanism, with a number if possible]<\/em>. The strongest argument against it is <em>[the real one]<\/em>, and where I would concede is <em>[the condition]<\/em> - if <em>[X]<\/em> is true, I am wrong.&quot;<\/p><\/blockquote><p><strong>The failure modes:<\/strong> something uncontroversial dressed as heterodox, something that is really a complaint about a former employer, or a belief you cannot defend past the first follow-up.<\/p>", "source": "answers.md", "search": "\"what is something you believe about software that most engineers you know disagree with?\" pick something you can actually defend, then defend it with a mechanism and concede the strongest counterargument. the question is testing whether you have positions and whether you hold them well. candidates that work: most teams should run fewer services than they do; the majority of technical debt should never be paid (q171); on-call for what you build is non-negotiable and is a design intervention rather than an operational one; test coverage as a target makes systems worse; most microservice boundaries are drawn from the org chart rather than the domain; retrieval quality matters more than model choice in most production ai systems. \"i think [the belief] . the reason is [the mechanism, with a number if possible] . the strongest argument against it is [the real one] , and where i would concede is [the condition] - if [x] is true, i am wrong.\" the failure modes: something uncontroversial dressed as heterodox, something that is really a complaint about a former employer, or a belief you cannot defend past the first follow-up."}, {"n": 245, "category": 15, "difficulty": "D", "html": "How do you map your stories onto a published values framework - Amazon&#x27;s leadership principles or an equivalent - without contorting them?", "answerTitle": "Mapping stories onto a values framework", "answer": "<p>Do it by <strong>finding the story that already fits<\/strong>, never by contorting one. Panels using a published framework are trained to spot a story bent to fit a principle, and it costs more than an imperfect match.<\/p><p>The method:<\/p><ol><li><strong>Read their published values or principles and translate each into a question<\/strong> - &quot;Ownership&quot; becomes &quot;what did you take on that was not yours?&quot;; &quot;Dive Deep&quot; becomes &quot;when did the detail change the conclusion?&quot;; &quot;Have Backbone, Disagree and Commit&quot; is Q87 exactly.<\/li><li><strong>Mark your coverage matrix (Q39) against their list<\/strong> rather than against the generic nine. Usually seven or eight map cleanly.<\/li><li><strong>For the ones with no match, use Q40<\/strong> - the honest near-miss beats the stretch.<\/li><li><strong>Use their vocabulary once<\/strong>, at the start of the answer, and then tell the story in your own words. Repeating their principle names throughout sounds coached.<\/li><li><strong>Watch for the framework&#x27;s hidden pairs.<\/strong> Several frameworks pair a value with its opposite - deliver results <em>and<\/em> earn trust, move fast <em>and<\/em> be right - and the strong answers acknowledge the tension.<\/li><\/ol><blockquote><p>&quot;This is probably closest to your &#x27;Insist on the Highest Standards&#x27;. It is also a story about when I decided the standard was too high for the situation, which I think is the more interesting half.&quot;<\/p><\/blockquote>", "source": "answers.md", "search": "how do you map your stories onto a published values framework - amazon's leadership principles or an equivalent - without contorting them? do it by finding the story that already fits , never by contorting one. panels using a published framework are trained to spot a story bent to fit a principle, and it costs more than an imperfect match. the method: 1. read their published values or principles and translate each into a question - \"ownership\" becomes \"what did you take on that was not yours?\"; \"dive deep\" becomes \"when did the detail change the conclusion?\"; \"have backbone, disagree and commit\" is q87 exactly. 2. mark your coverage matrix (q39) against their list rather than against the generic nine. usually seven or eight map cleanly. 3. for the ones with no match, use q40 - the honest near-miss beats the stretch. 4. use their vocabulary once , at the start of the answer, and then tell the story in your own words. repeating their principle names throughout sounds coached. 5. watch for the framework's hidden pairs. several frameworks pair a value with its opposite - deliver results and earn trust, move fast and be right - and the strong answers acknowledge the tension. \"this is probably closest to your 'insist on the highest standards'. it is also a story about when i decided the standard was too high for the situation, which i think is the more interesting half.\""}, {"n": 246, "category": 15, "difficulty": "T", "html": "The company&#x27;s values include one you do not actually hold. What do you do?", "answerTitle": "A value you do not hold", "answer": "<p>Do not perform agreement. The mature answer distinguishes <strong>a value you disagree with<\/strong> from <strong>one you interpret differently<\/strong>, and most cases are the second.<\/p><blockquote><p>&quot;&#x27;Move fast and break things&#x27; - I would sign up to the first half. Where I would want to understand the local interpretation is what &#x27;break&#x27; covers: I will break an internal interface, an experiment or my own service&#x27;s uptime target. I will not break customer data or a security property, because those are not recoverable and the speed you buy is borrowed against something you cannot repay. So my question is really about where your line sits, because in most places I have worked the answer is closer to mine than the slogan suggests.&quot;<\/p><\/blockquote><p>That is honest, it demonstrates a position, and it turns it into a question - which is what you actually need, because if the real answer is that they do break customer data, you want to know before you accept.<\/p><p><strong>If it is a genuine, unbridgeable mismatch,<\/strong> say so plainly and take the consequence. That is a better outcome than joining.<\/p>", "source": "answers.md", "search": "the company's values include one you do not actually hold. what do you do? do not perform agreement. the mature answer distinguishes a value you disagree with from one you interpret differently , and most cases are the second. \"'move fast and break things' - i would sign up to the first half. where i would want to understand the local interpretation is what 'break' covers: i will break an internal interface, an experiment or my own service's uptime target. i will not break customer data or a security property, because those are not recoverable and the speed you buy is borrowed against something you cannot repay. so my question is really about where your line sits, because in most places i have worked the answer is closer to mine than the slogan suggests.\" that is honest, it demonstrates a position, and it turns it into a question - which is what you actually need, because if the real answer is that they do break customer data, you want to know before you accept. if it is a genuine, unbridgeable mismatch, say so plainly and take the consequence. that is a better outcome than joining."}, {"n": 247, "category": 15, "difficulty": "D", "html": "&quot;What questions do you have for us?&quot; - what does a principal candidate ask that a senior one does not?", "answerTitle": "What a principal candidate asks", "answer": "<p>The distinction: a senior candidate asks about the role; a principal candidate asks about <strong>the system, the constraints and the decisions<\/strong>.<\/p><table><thead><tr><th>Senior asks<\/th><th>Principal asks<\/th><\/tr><\/thead><tbody><tr><td>What does the team work on?<\/td><td>What is the decision you are currently stuck on?<\/td><\/tr><tr><td>What is the tech stack?<\/td><td>What is the piece of the architecture you would change if you could?<\/td><\/tr><tr><td>How do you handle on-call?<\/td><td>What was your last significant incident, and what changed after it?<\/td><\/tr><tr><td>What are the growth opportunities?<\/td><td>What does this role own after a year, and who owns it today?<\/td><\/tr><tr><td>What is the culture like?<\/td><td>When engineering and product disagree, how does it actually get resolved - can you give me the last example?<\/td><\/tr><tr><td>How is performance measured?<\/td><td>What would make you conclude in six months that this hire was a mistake?<\/td><\/tr><\/tbody><\/table><p>Two or three per interviewer, chosen for the interviewer. <strong>The best single question<\/strong> is a request for a recent, specific example, because it is impossible to answer with a platitude. Negotiation and the offer conversation are covered in <a href=\"../15-mock-interviews/questions.md\">../15-mock-interviews<\/a> Category 15.<\/p>", "source": "answers.md", "search": "\"what questions do you have for us?\" - what does a principal candidate ask that a senior one does not? the distinction: a senior candidate asks about the role; a principal candidate asks about the system, the constraints and the decisions . senior asks principal asks --- --- what does the team work on? what is the decision you are currently stuck on? what is the tech stack? what is the piece of the architecture you would change if you could? how do you handle on-call? what was your last significant incident, and what changed after it? what are the growth opportunities? what does this role own after a year, and who owns it today? what is the culture like? when engineering and product disagree, how does it actually get resolved - can you give me the last example? how is performance measured? what would make you conclude in six months that this hire was a mistake? two or three per interviewer, chosen for the interviewer. the best single question is a request for a recent, specific example, because it is impossible to answer with a platitude. negotiation and the offer conversation are covered in ../15-mock-interviews category 15."}, {"n": 248, "category": 15, "difficulty": "D", "html": "How do you assess whether the role is really at the level advertised, from inside the interview?", "answerTitle": "Is the role really at the level advertised", "answer": "<p>The signals, gathered from inside the loop:<\/p><ul><li><strong>What the role owns after a year<\/strong>, in their words. If the answer is a project rather than a domain or a class of problem, it is a senior role with a principal title.<\/li><li><strong>Who currently makes the decisions<\/strong> this role would make, and what they will stop doing. If nobody can name them, the scope does not exist yet.<\/li><li><strong>Who is in the loop.<\/strong> A principal loop usually includes a skip-level and a peer principal. If everyone interviewing you is a manager, or nobody is above the hiring manager, the level is uncertain.<\/li><li><strong>The questions they ask.<\/strong> If the technical rounds never leave implementation, the organization does not have a mental model of the level.<\/li><li><strong>How they answer &quot;what is the hardest problem&quot;<\/strong> - a specific, unresolved architectural problem means there is room; a smooth answer usually means there is not.<\/li><li><strong>Whether other people at that level exist<\/strong> and what they do. A first-ever principal role can be excellent, but it needs a sponsor and a definition, and you should ask who that is.<\/li><\/ul><p>Ask directly at the end: <em>&quot;what would this person have to do in the first year for you to consider it a clear success at this level?&quot;<\/em> The specificity of the answer tells you most of it.<\/p>", "source": "answers.md", "search": "how do you assess whether the role is really at the level advertised, from inside the interview? the signals, gathered from inside the loop: - what the role owns after a year , in their words. if the answer is a project rather than a domain or a class of problem, it is a senior role with a principal title. - who currently makes the decisions this role would make, and what they will stop doing. if nobody can name them, the scope does not exist yet. - who is in the loop. a principal loop usually includes a skip-level and a peer principal. if everyone interviewing you is a manager, or nobody is above the hiring manager, the level is uncertain. - the questions they ask. if the technical rounds never leave implementation, the organization does not have a mental model of the level. - how they answer \"what is the hardest problem\" - a specific, unresolved architectural problem means there is room; a smooth answer usually means there is not. - whether other people at that level exist and what they do. a first-ever principal role can be excellent, but it needs a sponsor and a definition, and you should ask who that is. ask directly at the end: \"what would this person have to do in the first year for you to consider it a clear success at this level?\" the specificity of the answer tells you most of it."}, {"n": 249, "category": 15, "difficulty": "A", "html": "Write the two-sentence positioning statement that should be in every interviewer&#x27;s notes about you.", "answerTitle": "Your positioning sentence", "answer": "<p>Two sentences that should appear in every interviewer&#x27;s notes, in roughly the same words. Everything else in the loop is evidence for them.<\/p><blockquote><p>&quot;Nineteen years on systems other systems depend on - twelve at Verizon owning a <em>[scale]<\/em> platform end to end, and three at Sonata across multiple client architectures. Since 2024 he has been putting AI into production as an engineering problem - evaluation, cost per call and failure modes - which is unusual next to that much platform depth.&quot;<\/p><\/blockquote><p>The construction rules: <strong>one sentence of proven depth with a number, one sentence of what is unusual about the combination.<\/strong> No adjectives about yourself. It must be repeatable by someone who met you for forty-five minutes, and every story in the bank should reinforce one half or the other.<\/p><p>Test it: if the sentence would fit another candidate with your résumé, it is not positioning, it is a summary.<\/p>", "source": "answers.md", "search": "write the two-sentence positioning statement that should be in every interviewer's notes about you. two sentences that should appear in every interviewer's notes, in roughly the same words. everything else in the loop is evidence for them. \"nineteen years on systems other systems depend on - twelve at verizon owning a [scale] platform end to end, and three at sonata across multiple client architectures. since 2024 he has been putting ai into production as an engineering problem - evaluation, cost per call and failure modes - which is unusual next to that much platform depth.\" the construction rules: one sentence of proven depth with a number, one sentence of what is unusual about the combination. no adjectives about yourself. it must be repeatable by someone who met you for forty-five minutes, and every story in the bank should reinforce one half or the other. test it: if the sentence would fit another candidate with your résumé, it is not positioning, it is a summary."}, {"n": 250, "category": 15, "difficulty": "A", "html": "If the loop concludes you are a strong senior rather than a principal, what evidence was missing, and what would you have done differently?", "answerTitle": "If they level you down", "answer": "<p>The post-mortem to run in advance, because it is also the best possible preparation checklist. If the debrief concludes strong senior, the missing evidence is almost always one of six things:<\/p><ol><li><strong>Every story was inside one team.<\/strong> No cross-team second-order effect, so nothing in the notes distinguishes the levels (Q9).<\/li><li><strong>Depth without decisions.<\/strong> You explained how things work rather than what you chose and rejected. Correct answers, senior altitude.<\/li><li><strong>No numbers<\/strong>, so nothing was falsifiable and your advocate had nothing to quote.<\/li><li><strong>No named opposition.<\/strong> Every story had consensus in it, so there is no evidence of influence.<\/li><li><strong>You did not volunteer a mistake<\/strong>, so the bar raiser had no evidence of self-correction and defaulted to caution.<\/li><li><strong>You answered the question asked instead of the level&#x27;s version of it.<\/strong> &quot;How would you fix this bug&quot; answered as a bug fix rather than as a class of failure.<\/li><\/ol><p>What to do differently, concretely: pick the cross-team story as the primary in at least two rounds; end every substantial answer with a second-order sentence; put a number in the Situation and the Result of all eight stories; and volunteer one mistake per round, unasked.<\/p><p>And if it happens anyway: ask for the specific evidence gap, in writing if possible. It is the cheapest calibration data you will ever get, and it is usually one of the six above.<\/p>", "source": "answers.md", "search": "if the loop concludes you are a strong senior rather than a principal, what evidence was missing, and what would you have done differently? the post-mortem to run in advance, because it is also the best possible preparation checklist. if the debrief concludes strong senior, the missing evidence is almost always one of six things: 1. every story was inside one team. no cross-team second-order effect, so nothing in the notes distinguishes the levels (q9). 2. depth without decisions. you explained how things work rather than what you chose and rejected. correct answers, senior altitude. 3. no numbers , so nothing was falsifiable and your advocate had nothing to quote. 4. no named opposition. every story had consensus in it, so there is no evidence of influence. 5. you did not volunteer a mistake , so the bar raiser had no evidence of self-correction and defaulted to caution. 6. you answered the question asked instead of the level's version of it. \"how would you fix this bug\" answered as a bug fix rather than as a class of failure. what to do differently, concretely: pick the cross-team story as the primary in at least two rounds; end every substantial answer with a second-order sentence; put a number in the situation and the result of all eight stories; and volunteer one mistake per round, unasked. and if it happens anyway: ask for the specific evidence gap, in writing if possible. it is the cheapest calibration data you will ever get, and it is usually one of the six above."}], "difficulty": {"C": "Core", "D": "Deep", "T": "Tricky", "A": "Architect"}, "difficultyHint": {"C": "You must answer this instantly and correctly.", "D": "Requires mechanism-level detail.", "T": "The obvious answer is usually wrong.", "A": "Judged on trade-off reasoning."}}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STORE = "interview-progress-12-behavioural-v1";
  var THEME_KEY = "interview-quiz-theme";
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { progress = {}; }

  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var searchBox = document.getElementById("search");
  var categoryBox = document.getElementById("category");
  var statusBox = document.getElementById("status");
  var activeDifficulty = new Set();

  var catTitle = {};
  DATA.categories.forEach(function (c) {
    catTitle[c.index] = c.index + ". " + c.title;
    var opt = document.createElement("option");
    opt.value = c.index;
    opt.textContent = catTitle[c.index];
    categoryBox.appendChild(opt);
  });

  var legend = document.getElementById("legend");
  var diffFilters = document.getElementById("diffFilters");
  Object.keys(DATA.difficulty).forEach(function (key) {
    var span = document.createElement("span");
    span.className = "pill " + key;
    span.textContent = DATA.difficulty[key];
    span.title = DATA.difficultyHint[key];
    legend.appendChild(span);

    var btn = document.createElement("button");
    btn.textContent = DATA.difficulty[key];
    btn.dataset.diff = key;
    btn.addEventListener("click", function () {
      if (activeDifficulty.has(key)) { activeDifficulty.delete(key); btn.classList.remove("on"); }
      else { activeDifficulty.add(key); btn.classList.add("on"); }
      render();
    });
    diffFilters.appendChild(btn);
  });

  var KEYWORDS = /\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|record|return|sealed|short|static|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while|yield|true|false|null)\b/g;

  function highlight(root) {
    root.querySelectorAll("pre code").forEach(function (block) {
      var text = block.textContent;
      var slots = [];
      function keep(cls) {
        return function (m) { slots.push('<span class="' + cls + '">' + esc(m) + "</span>"); return "\u0000" + (slots.length - 1) + "\u0000"; };
      }
      text = text.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, keep("tok-com"));
      text = text.replace(/"(?:\\.|[^"\\])*"/g, keep("tok-str"));
      text = text.replace(/@\w+/g, keep("tok-ann"));
      text = esc(text).replace(KEYWORDS, '<span class="tok-kw">$&</span>');
      block.innerHTML = text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return slots[+i]; });
    });
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function markHits(root, term) {
    if (!term) return;
    var rx = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.trim() && rx.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
      rx.lastIndex = 0;
    }
    nodes.forEach(function (node) {
      var span = document.createElement("span");
      span.innerHTML = esc(node.nodeValue).replace(rx, "<mark>$1</mark>");
      node.parentNode.replaceChild(span, node);
    });
  }

  function statusOf(n) { return progress[n] || "unseen"; }

  function setStatus(n, value) {
    if (statusOf(n) === value) delete progress[n]; else progress[n] = value;
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    render();
  }

  function card(q, term) {
    var el = document.createElement("article");
    el.className = "q";
    el.id = "q" + q.n;
    el.dataset.status = statusOf(q.n);

    var head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML =
      '<a class="q-num" href="#q' + q.n + '">Q' + q.n + "</a>" +
      (q.difficulty ? '<span class="pill ' + q.difficulty + '" title="' + DATA.difficultyHint[q.difficulty] + '">' + DATA.difficulty[q.difficulty] + "</span>" : "") +
      '<h3 class="q-text">' + q.html + "</h3>";
    el.appendChild(head);

    var actions = document.createElement("div");
    actions.className = "q-actions";
    [["known", "Known"], ["review", "Review"]].forEach(function (pair) {
      var b = document.createElement("button");
      b.textContent = pair[1];
      if (statusOf(q.n) === pair[0]) b.classList.add("on");
      b.addEventListener("click", function () { setStatus(q.n, pair[0]); });
      actions.appendChild(b);
    });
    if (q.source) {
      var src = document.createElement("span");
      src.className = "src";
      src.textContent = q.source;
      actions.appendChild(src);
    }
    el.appendChild(actions);

    var details = document.createElement("details");
    details.className = "ans";
    var summary = document.createElement("summary");
    summary.textContent = q.source ? "Show answer" : "How to answer this";
    details.appendChild(summary);

    var body = document.createElement("div");
    body.className = "ans-body";
    body.innerHTML = '<p class="ans-title">' + esc(q.answerTitle) + '</p><div class="md">' + q.answer + "</div>";
    details.appendChild(body);
    el.appendChild(details);

    var rendered = false;
    details.addEventListener("toggle", function () {
      if (details.open && !rendered) { rendered = true; highlight(body); markHits(body, term); }
    });

    return el;
  }

  function render() {
    var term = searchBox.value.trim().toLowerCase();
    var cat = categoryBox.value;
    var status = statusBox.value;

    var matches = DATA.questions.filter(function (q) {
      if (term && q.search.indexOf(term) === -1) return false;
      if (cat && String(q.category) !== cat) return false;
      if (activeDifficulty.size && !activeDifficulty.has(q.difficulty)) return false;
      if (status && statusOf(q.n) !== status) return false;
      return true;
    });

    list.textContent = "";
    var lastCategory = null;
    matches.forEach(function (q) {
      if (q.category !== lastCategory) {
        lastCategory = q.category;
        var h = document.createElement("h2");
        h.className = "cat";
        h.textContent = catTitle[q.category];
        list.appendChild(h);
      }
      list.appendChild(card(q, term));
    });

    empty.hidden = matches.length > 0;

    var total = DATA.questions.length;
    var known = 0, review = 0;
    DATA.questions.forEach(function (q) {
      if (statusOf(q.n) === "known") known++;
      else if (statusOf(q.n) === "review") review++;
    });
    document.getElementById("barKnown").style.width = (known / total * 100) + "%";
    document.getElementById("barReview").style.width = (review / total * 100) + "%";
    document.getElementById("stats").innerHTML =
      "<b>" + matches.length + "</b> shown of " + total + " &nbsp;·&nbsp; " +
      "<b>" + known + "</b> known &nbsp;·&nbsp; <b>" + review + "</b> to review &nbsp;·&nbsp; " +
      "<b>" + (total - known - review) + "</b> not marked";
  }

  searchBox.addEventListener("input", render);
  categoryBox.addEventListener("change", render);
  statusBox.addEventListener("change", render);

  document.getElementById("expandAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = true; });
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = false; });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all Known / Review marks?")) return;
    progress = {};
    try { localStorage.removeItem(STORE); } catch (e) {}
    render();
  });

  var themeBtn = document.getElementById("theme");
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  applyTheme(savedTheme || "dark");
  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
    if (e.key === "Escape" && document.activeElement === searchBox) { searchBox.value = ""; render(); searchBox.blur(); }
  });

  render();

  if (location.hash) {
    var target = document.querySelector(location.hash);
    if (target) { target.scrollIntoView(); var d = target.querySelector("details.ans"); if (d) d.open = true; }
  }
})();
</script>
</body>
</html>
