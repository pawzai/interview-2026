\/strong> is a real failure mode - past four or five, it reads as stalling or as needing to be told what to build. The rule: ask what changes the design, assume the rest, and label every assumption so it can be corrected.<\/p>", "source": "answers.md", "search": "how do you extract requirements when the interviewer is deliberately vague, and how many questions is too many? vagueness is usually deliberate, and the test is whether you can make decisions under it rather than extract your way out. so: ask a small number of high-leverage questions, then assume out loud and move. the high-leverage ones - the ones whose answers change the architecture - are: read-heavy or write-heavy and by what ratio; how much data and over what horizon; what is the tightest latency requirement and on which operation; and what is the consistency requirement on the one operation that matters. four questions, ninety seconds. everything else you assume: \"i will assume 10 million daily actives and a 100:1 read-write ratio; that gives me roughly [n] requests per second at peak. tell me if that is off by an order of magnitude, because it changes the storage choice.\" too many questions is a real failure mode - past four or five, it reads as stalling or as needing to be told what to build. the rule: ask what changes the design, assume the rest, and label every assumption so it can be corrected."}, {"n": 62, "category": 5, "difficulty": "D", "html": "Estimation out loud: which numbers must be in your head, and how precise do they need to be?", "answerTitle": "Estimation out loud", "answer": "<p>You need a small table in your head, and you need to be comfortable being <strong>wrong by less than an order of magnitude<\/strong>. Precision beyond one significant figure is a waste of round time and interviewers will say so.<\/p><table><thead><tr><th>Quantity<\/th><th>Number to carry<\/th><\/tr><\/thead><tbody><tr><td>Seconds in a day<\/td><td>~100,000 (86,400)<\/td><\/tr><tr><td>1 million writes/day<\/td><td>~12 per second average, so plan for 30-60 at peak<\/td><\/tr><tr><td>Peak-to-average<\/td><td>2-5x for consumer traffic, higher with a daily batch<\/td><\/tr><tr><td>A row with a few columns<\/td><td>~1 KB, so 1M rows/day ≈ 1 GB/day ≈ 365 GB/year<\/td><\/tr><tr><td>A modern server<\/td><td>tens of thousands of simple requests/second; a single Postgres, low thousands of transactions/second<\/td><\/tr><tr><td>Memory<\/td><td>100 GB of RAM is a normal cache node; a billion 100-byte items is not going in it<\/td><\/tr><tr><td>Latency<\/td><td>memory ns, SSD ~100 µs, same-region network ~0.5 ms, cross-region 50-150 ms, disk seek ~10 ms<\/td><\/tr><\/tbody><\/table><p><strong>How to say it:<\/strong> &quot;a million writes a day is about twelve a second, call it fifty at peak - that is nothing, so the write path is not the problem; the problem is the <em>[fan-out / storage growth / read amplification]<\/em>.&quot; The purpose of estimation is to <strong>eliminate concerns<\/strong>, and saying which concern you just eliminated is what scores.<\/p><p><strong>Depth:<\/strong> <code>../04-system-design<\/code> Category 2.<\/p>", "source": "answers.md", "search": "estimation out loud: which numbers must be in your head, and how precise do they need to be? you need a small table in your head, and you need to be comfortable being wrong by less than an order of magnitude . precision beyond one significant figure is a waste of round time and interviewers will say so. quantity number to carry --- --- seconds in a day ~100,000 (86,400) 1 million writes/day ~12 per second average, so plan for 30-60 at peak peak-to-average 2-5x for consumer traffic, higher with a daily batch a row with a few columns ~1 kb, so 1m rows/day ≈ 1 gb/day ≈ 365 gb/year a modern server tens of thousands of simple requests/second; a single postgres, low thousands of transactions/second memory 100 gb of ram is a normal cache node; a billion 100-byte items is not going in it latency memory ns, ssd ~100 µs, same-region network ~0.5 ms, cross-region 50-150 ms, disk seek ~10 ms how to say it: \"a million writes a day is about twelve a second, call it fifty at peak - that is nothing, so the write path is not the problem; the problem is the [fan-out / storage growth / read amplification] .\" the purpose of estimation is to eliminate concerns , and saying which concern you just eliminated is what scores. depth: ../04-system-design category 2."}, {"n": 63, "category": 5, "difficulty": "T", "html": "The interviewer says &quot;assume infinite scale, do not worry about numbers&quot;. What is the correct response?", "answerTitle": "\"Assume infinite scale, do not worry about numbers\"", "answer": "<p>Do not accept it. Politely convert it into a bounded number, because &quot;infinite&quot; removes the only thing that makes design decisions decidable.<\/p><blockquote><p>&quot;I will keep it light, but I need one number or every choice becomes arbitrary - a design for a thousand requests per second and one for a million are different systems, and I would rather show you the reasoning than pick the most expensive option by default. Can I assume <em>[a specific figure]<\/em> and revise if you want to see it at another scale?&quot;<\/p><\/blockquote><p>Almost always they say yes, and the exchange itself is a positive signal: it shows you know that scale is the input that determines the answer.<\/p><p>If they genuinely refuse, <strong>design for a stated tier and name the breakpoints<\/strong>: &quot;this design holds to roughly <em>[X]<\/em>; the first thing that breaks past that is <em>[Y]<\/em>, and the change is <em>[Z]<\/em>.&quot; Naming breakpoints is a better answer than any single design.<\/p>", "source": "answers.md", "search": "the interviewer says \"assume infinite scale, do not worry about numbers\". what is the correct response? do not accept it. politely convert it into a bounded number, because \"infinite\" removes the only thing that makes design decisions decidable. \"i will keep it light, but i need one number or every choice becomes arbitrary - a design for a thousand requests per second and one for a million are different systems, and i would rather show you the reasoning than pick the most expensive option by default. can i assume [a specific figure] and revise if you want to see it at another scale?\" almost always they say yes, and the exchange itself is a positive signal: it shows you know that scale is the input that determines the answer. if they genuinely refuse, design for a stated tier and name the breakpoints : \"this design holds to roughly [x] ; the first thing that breaks past that is [y] , and the change is [z] .\" naming breakpoints is a better answer than any single design."}, {"n": 64, "category": 5, "difficulty": "D", "html": "How do you drive the whiteboard so the interviewer is following your reasoning rather than watching you draw?", "answerTitle": "Driving the whiteboard", "answer": "<p>The failure mode is a candidate drawing in silence while the interviewer watches. Fix it with three habits:<\/p><ul><li><strong>Announce before you draw.<\/strong> &quot;I am going to put the write path across the top and the read path underneath, so we can talk about them separately.&quot; Now they are following a structure, not decoding a picture.<\/li><li><strong>Draw the data flow, not the org chart.<\/strong> Number the steps of a request and walk them. A diagram with no arrows labelled is not a design.<\/li><li><strong>Checkpoint every five to seven minutes.<\/strong> &quot;That is the write path - does that hold up for you, or do you want to push on it before I move to reads?&quot; This is the single highest-value habit in a design round: it prevents you spending fifteen minutes on something they did not care about, and it makes the round feel collaborative.<\/li><\/ul><p>Keep the board legible - a small number of boxes, with the interesting complexity inside one of them rather than spread over twenty. And <strong>leave space<\/strong>; you will need to add the failure and scale story later.<\/p>", "source": "answers.md", "search": "how do you drive the whiteboard so the interviewer is following your reasoning rather than watching you draw? the failure mode is a candidate drawing in silence while the interviewer watches. fix it with three habits: - announce before you draw. \"i am going to put the write path across the top and the read path underneath, so we can talk about them separately.\" now they are following a structure, not decoding a picture. - draw the data flow, not the org chart. number the steps of a request and walk them. a diagram with no arrows labelled is not a design. - checkpoint every five to seven minutes. \"that is the write path - does that hold up for you, or do you want to push on it before i move to reads?\" this is the single highest-value habit in a design round: it prevents you spending fifteen minutes on something they did not care about, and it makes the round feel collaborative. keep the board legible - a small number of boxes, with the interesting complexity inside one of them rather than spread over twenty. and leave space ; you will need to add the failure and scale story later."}, {"n": 65, "category": 5, "difficulty": "D", "html": "When do you go deep on one component versus keeping breadth, and who gets to decide?", "answerTitle": "Depth versus breadth, and who decides", "answer": "<p><strong>They decide, and you make it easy for them to.<\/strong> Get to a complete, coherent, shallow end-to-end design first - that is the thing you must have on the board by roughly the halfway mark - then offer the deep dive.<\/p><blockquote><p>&quot;That is the system end to end. The three places where I think the real difficulty is are <em>[the fan-out]<\/em>, <em>[the consistency of the ledger]<\/em> and <em>[the re-indexing path]<\/em>. Which would you like me to go into?&quot;<\/p><\/blockquote><p>Two reasons this is right. First, a design that is deep in one place and missing an end is scored as incomplete; a shallow-but-complete design is scored as a design. Second, offering the candidates demonstrates that you know where the difficulty is - which is itself a strong signal, independent of which one you then explore.<\/p><p><strong>When you should override them:<\/strong> if there is a correctness problem in a component they did not pick, say it before moving on. &quot;I will go into caching as you asked - I want to flag first that the current write path can lose an event, and I would like to come back to it.&quot;<\/p>", "source": "answers.md", "search": "when do you go deep on one component versus keeping breadth, and who gets to decide? they decide, and you make it easy for them to. get to a complete, coherent, shallow end-to-end design first - that is the thing you must have on the board by roughly the halfway mark - then offer the deep dive. \"that is the system end to end. the three places where i think the real difficulty is are [the fan-out] , [the consistency of the ledger] and [the re-indexing path] . which would you like me to go into?\" two reasons this is right. first, a design that is deep in one place and missing an end is scored as incomplete; a shallow-but-complete design is scored as a design. second, offering the candidates demonstrates that you know where the difficulty is - which is itself a strong signal, independent of which one you then explore. when you should override them: if there is a correctness problem in a component they did not pick, say it before moving on. \"i will go into caching as you asked - i want to flag first that the current write path can lose an event, and i would like to come back to it.\""}, {"n": 66, "category": 5, "difficulty": "T", "html": "You are 30 minutes in and have not written a single number. What has gone wrong, and how do you recover without restarting?", "answerTitle": "Thirty minutes in, no numbers", "answer": "<p>What has gone wrong: you have been designing a <strong>shape<\/strong> rather than a <strong>system<\/strong>, and none of your component choices are yet justified. The interviewer&#x27;s notes probably say &quot;did not size anything&quot;, which at principal level is a leveling issue (Q5).<\/p><p>Recover without restarting:<\/p><blockquote><p>&quot;Let me put numbers on this before I go further, because I have been designing without them. <em>[Do the arithmetic out loud - requests per second, storage per year, the size of the hot set.]<\/em> That tells me <em>[the read path is the whole problem / this fits on one machine / the cache does not fit in memory]<\/em>, and it means I would change <em>[the specific component]<\/em>.&quot;<\/p><\/blockquote><p>The recovery is stronger than never having had the problem, if the arithmetic <strong>changes a decision<\/strong>. If your numbers confirm everything you already drew, it looks like a retrofit - so pick the number that actually challenges something, and say what it challenges.<\/p>", "source": "answers.md", "search": "you are 30 minutes in and have not written a single number. what has gone wrong, and how do you recover without restarting? what has gone wrong: you have been designing a shape rather than a system , and none of your component choices are yet justified. the interviewer's notes probably say \"did not size anything\", which at principal level is a leveling issue (q5). recover without restarting: \"let me put numbers on this before i go further, because i have been designing without them. [do the arithmetic out loud - requests per second, storage per year, the size of the hot set.] that tells me [the read path is the whole problem / this fits on one machine / the cache does not fit in memory] , and it means i would change [the specific component] .\" the recovery is stronger than never having had the problem, if the arithmetic changes a decision . if your numbers confirm everything you already drew, it looks like a retrofit - so pick the number that actually challenges something, and say what it challenges."}, {"n": 67, "category": 5, "difficulty": "D", "html": "How do you present a data model in a design round without losing fifteen minutes to it?", "answerTitle": "Data model without losing fifteen minutes", "answer": "<p>Show the <strong>entities, their keys, and the one or two access patterns that drive the design<\/strong> - not the columns.<\/p><blockquote><p>&quot;Four entities: user, document, version, and the extraction result. The key decision is the partition key on the version table, because the dominant query is &#x27;latest version for a document&#x27; at high volume and &#x27;all versions for an audit&#x27; rarely. So I partition by document id and keep a pointer to the latest, rather than sorting on write time.&quot;<\/p><\/blockquote><p>That is 25 seconds and it contains the actual design content. Columns, types and nullability contain none of it in this setting.<\/p><p><strong>The rule:<\/strong> in a design round the data model exists to justify the storage choice and the query path. If a detail does not change either, leave it out - and say &quot;I will skip the field-level detail unless you want it&quot;, so the omission is visible as a choice.<\/p>", "source": "answers.md", "search": "how do you present a data model in a design round without losing fifteen minutes to it? show the entities, their keys, and the one or two access patterns that drive the design - not the columns. \"four entities: user, document, version, and the extraction result. the key decision is the partition key on the version table, because the dominant query is 'latest version for a document' at high volume and 'all versions for an audit' rarely. so i partition by document id and keep a pointer to the latest, rather than sorting on write time.\" that is 25 seconds and it contains the actual design content. columns, types and nullability contain none of it in this setting. the rule: in a design round the data model exists to justify the storage choice and the query path. if a detail does not change either, leave it out - and say \"i will skip the field-level detail unless you want it\", so the omission is visible as a choice."}, {"n": 68, "category": 5, "difficulty": "D", "html": "The interviewer injects a new requirement at minute 35. What is being tested, and what is the wrong instinct?", "answerTitle": "A new requirement at minute 35", "answer": "<p>Being tested: whether your design has <strong>seams<\/strong>, and whether you handle a change without defensiveness. The wrong instinct is to defend the existing design or to rebuild it.<\/p><p>The sequence: <strong>absorb, locate, cost, decide.<\/strong><\/p><blockquote><p>&quot;Good - so now we also need per-region data residency. Let me find where that lands. It does not affect the API or the write path, it lands entirely on storage placement and on the routing tier. The cheap version is to route at the edge on the user&#x27;s home region and keep regional stores that never replicate across the boundary; the cost is that cross-region queries become a fan-out and the global search index has to be rebuilt per region or dropped. I would take the cheap version and drop global search for now, and I would tell you that if global search is a hard requirement, the design changes materially - that is a different conversation.&quot;<\/p><\/blockquote><p><strong>The markers:<\/strong> you located the blast radius before proposing anything, you gave a cost, and you named the condition under which the answer changes.<\/p>", "source": "answers.md", "search": "the interviewer injects a new requirement at minute 35. what is being tested, and what is the wrong instinct? being tested: whether your design has seams , and whether you handle a change without defensiveness. the wrong instinct is to defend the existing design or to rebuild it. the sequence: absorb, locate, cost, decide. \"good - so now we also need per-region data residency. let me find where that lands. it does not affect the api or the write path, it lands entirely on storage placement and on the routing tier. the cheap version is to route at the edge on the user's home region and keep regional stores that never replicate across the boundary; the cost is that cross-region queries become a fan-out and the global search index has to be rebuilt per region or dropped. i would take the cheap version and drop global search for now, and i would tell you that if global search is a hard requirement, the design changes materially - that is a different conversation.\" the markers: you located the blast radius before proposing anything, you gave a cost, and you named the condition under which the answer changes."}, {"n": 69, "category": 5, "difficulty": "D", "html": "How do you cover failure modes and SLOs without turning the round into an operations lecture?", "answerTitle": "Failure modes and SLOs without an ops lecture", "answer": "<p>Attach them to components rather than delivering them as a section. <strong>One sentence per box, at the moment you draw the box<\/strong>: &quot;if this cache is cold or gone, we serve from the database at maybe five times the latency, which is degraded but not down - that is deliberate.&quot;<\/p><p>Then, at the end, spend ninety seconds on the two or three failures that are <strong>not<\/strong> graceful, because those are the design content: the single points of failure, the thing that loses data rather than availability, and the failure that is silent.<\/p><p>State one SLO and derive from it, rather than listing many: &quot;if the target is 99.9 percent on the read path, that is about 43 minutes a month, which means a single-AZ database is already out of budget.&quot;<\/p><p><strong>The trap<\/strong> is enumerating every failure mode in the system. Interviewers stop listening, and the signal - can you tell which failures matter - is lost in the list.<\/p>", "source": "answers.md", "search": "how do you cover failure modes and slos without turning the round into an operations lecture? attach them to components rather than delivering them as a section. one sentence per box, at the moment you draw the box : \"if this cache is cold or gone, we serve from the database at maybe five times the latency, which is degraded but not down - that is deliberate.\" then, at the end, spend ninety seconds on the two or three failures that are not graceful, because those are the design content: the single points of failure, the thing that loses data rather than availability, and the failure that is silent. state one slo and derive from it, rather than listing many: \"if the target is 99.9 percent on the read path, that is about 43 minutes a month, which means a single-az database is already out of budget.\" the trap is enumerating every failure mode in the system. interviewers stop listening, and the signal - can you tell which failures matter - is lost in the list."}, {"n": 70, "category": 5, "difficulty": "T", "html": "&quot;Would you use Kafka here?&quot; What is the trap in a component-name question, and how do you defuse it?", "answerTitle": "\"Would you use Kafka here?\"", "answer": "<p>The trap is answering the product question. Almost always the interviewer wants to know <strong>whether you know what property you need<\/strong>, and a component name reveals nothing.<\/p><blockquote><p>&quot;It depends what I need from it, so let me say what the requirement is: I need durable, ordered-per-key delivery with replay, and multiple independent consumers reading the same stream at their own pace. If that is the requirement, then yes - Kafka or Kinesis, and I would choose on operational fit rather than features. If what I actually need is a work queue with per-message acknowledgement, competing consumers and a dead-letter path, then SQS is a better fit and Kafka is the wrong shape. Given what we have described, the fan-out to three consumers is what pushes me to the log.&quot;<\/p><\/blockquote><p>Then the cost, unprompted: a log is an operational commitment - partitions, consumer groups, rebalancing, retention - and if this is the only place you need it, that is a large fixed cost for one feature.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 9; <code>../05-aws<\/code> Category 7.<\/p>", "source": "answers.md", "search": "\"would you use kafka here?\" what is the trap in a component-name question, and how do you defuse it? the trap is answering the product question. almost always the interviewer wants to know whether you know what property you need , and a component name reveals nothing. \"it depends what i need from it, so let me say what the requirement is: i need durable, ordered-per-key delivery with replay, and multiple independent consumers reading the same stream at their own pace. if that is the requirement, then yes - kafka or kinesis, and i would choose on operational fit rather than features. if what i actually need is a work queue with per-message acknowledgement, competing consumers and a dead-letter path, then sqs is a better fit and kafka is the wrong shape. given what we have described, the fan-out to three consumers is what pushes me to the log.\" then the cost, unprompted: a log is an operational commitment - partitions, consumer groups, rebalancing, retention - and if this is the only place you need it, that is a large fixed cost for one feature. depth: ../03-microservices category 9; ../05-aws category 7."}, {"n": 71, "category": 5, "difficulty": "D", "html": "The last three minutes of a design round. What do you say, and what do you write down?", "answerTitle": "The last three minutes", "answer": "<p>Do not trail off, and do not keep adding boxes. Close deliberately:<\/p><ul><li><strong>Summarize in three sentences<\/strong>: what the design is, and the two decisions that define it.<\/li><li><strong>Name the weakest part yourself.<\/strong> &quot;The part I am least happy with is <em>[X]<\/em> - it works but it couples <em>[A]<\/em> to <em>[B]<\/em>, and with more time I would look at <em>[the alternative]<\/em>.&quot; Volunteering this is one of the strongest signals available in the round; it demonstrates that you evaluate your own work, and it pre-empts the criticism.<\/li><li><strong>State the first thing that breaks at ten times the scale<\/strong>, and what you would change.<\/li><li><strong>Ask one question<\/strong> about how they solved it, if they have. It converts the last minute into a conversation and often gets you genuinely useful information.<\/li><\/ul><p><strong>What to write down before you stop talking:<\/strong> nothing new. The board should end with the assumptions from minute three still visible, because they are the justification for everything on it.<\/p>", "source": "answers.md", "search": "the last three minutes of a design round. what do you say, and what do you write down? do not trail off, and do not keep adding boxes. close deliberately: - summarize in three sentences : what the design is, and the two decisions that define it. - name the weakest part yourself. \"the part i am least happy with is [x] - it works but it couples [a] to [b] , and with more time i would look at [the alternative] .\" volunteering this is one of the strongest signals available in the round; it demonstrates that you evaluate your own work, and it pre-empts the criticism. - state the first thing that breaks at ten times the scale , and what you would change. - ask one question about how they solved it, if they have. it converts the last minute into a conversation and often gets you genuinely useful information. what to write down before you stop talking: nothing new. the board should end with the assumptions from minute three still visible, because they are the justification for everything on it."}, {"n": 72, "category": 5, "difficulty": "A", "html": "Design round, 45 minutes, run end to end: a multi-tenant document processing platform.", "answerTitle": "Multi-tenant document processing platform", "answer": "<blockquote><p>&quot;Design a platform that ingests documents from business customers, extracts structured data from them, and makes the results available through an API. Assume you are building it for our company.&quot;<\/p><\/blockquote><p><strong>Minutes 0-4 - scope and constrain.<\/strong> The questions that change the architecture, and the answers to assume if they will not give them:<\/p><ul><li><strong>What kinds of documents, and who controls them?<\/strong> Assume mixed PDFs including scans, 1-50 pages, uploaded by customers. This matters because scanned documents mean OCR, which changes the cost and latency model by an order of magnitude.<\/li><li><strong>What does &quot;extract&quot; mean - fixed fields or open-ended?<\/strong> Assume a per-tenant schema of 10-40 fields. Fixed schemas allow validation and evaluation; open-ended extraction does not.<\/li><li><strong>Latency expectation?<\/strong> Assume this is asynchronous - minutes, not seconds - and say why you are assuming it: &quot;extraction on a 50-page scan cannot be synchronous, so I will design an async submit-and-poll or webhook API. Tell me if there is a synchronous requirement, because that would change everything.&quot;<\/li><li><strong>Volume?<\/strong> Assume 200,000 documents a day, spiky, with tenant concentration.<\/li><li><strong>Accuracy and review?<\/strong> Assume there is a confidence threshold below which a human reviews - this is the single most important requirement to surface, because a system with no human path is a very different product.<\/li><li><strong>Tenancy model?<\/strong> Shared infrastructure, hard data isolation.<\/li><\/ul><p><strong>Minutes 4-10 - the arithmetic.<\/strong> Do it out loud (Q62).<\/p><p>200,000 documents a day is a bit over 2 per second average, and with a 5x business-hours peak, maybe 10-15 per second. That is a small number, and saying so is the point: <strong>the throughput is not the problem<\/strong>. Average 10 pages at, say, 2 KB of text per page is 20 KB of text per document, so 4 GB of text per day, plus the originals - say 500 KB each, so 100 GB a day of blobs, 36 TB a year. <strong>Storage growth and lifecycle are a real problem; request throughput is not.<\/strong><\/p><p>If extraction uses a model at roughly 8,000 input tokens for a long document plus a 1,000-token response, that is order-of-magnitude cents per document at current prices, so <strong>200,000 a day is a five-figure monthly model bill<\/strong> - which makes cost a first-class design constraint and justifies routing cheap documents to a cheap path (Q122).<\/p><p>Then the sentence that reframes the round: &quot;so the design problems here are cost per document, tenant isolation, the human review loop, and reprocessing - not scale.&quot;<\/p><p><strong>Minutes 10-25 - the design.<\/strong><\/p><p><em>API.<\/em> <code>POST /documents<\/code> returning <code>202<\/code> with a document id; <code>GET /documents/{id}<\/code> returning status and results; a webhook per tenant for completion; <code>POST /documents/{id}/reprocess<\/code>. Idempotency key on submit, because customers retry (Q50).<\/p><p><em>Pipeline.<\/em> Upload goes straight to object storage via a presigned URL - never through your API, which keeps large payloads off your compute. A message per document drives a <strong>state machine<\/strong>, not a chain: <code>received → classified → text-extracted → fields-extracted → validated → (needs-review) → complete<\/code>. Say why a state machine: every stage is separately retriable, the state is queryable for support, and a partial failure resumes rather than restarting the expensive stages.<\/p><p><em>Stages.<\/em> Classify first, cheaply, to decide the route: a native-text PDF skips OCR entirely, which is the largest cost saving available. Text extraction with a parser, OCR only where needed. Field extraction with a model, structured output constrained to the tenant&#x27;s schema. <strong>Validation in code<\/strong> - types, formats, checksums, cross-field arithmetic - because deterministic validation catches a large share of extraction errors for free and produces the confidence signal.<\/p><p><em>Storage.<\/em> Originals in object storage with a per-tenant prefix and lifecycle rules to colder tiers. Extracted results in a relational store, partitioned by tenant. <strong>Every result carries the model version, prompt version and pipeline version<\/strong>, which is the thing that makes reprocessing and debugging possible eighteen months later.<\/p><p><em>Tenancy.<\/em> Isolation enforced at the query layer with a tenant id required by the repository (Q141), separate object storage prefixes with IAM conditions, and per-tenant quotas and rate limits so one customer&#x27;s Monday backlog does not starve everyone else. Say explicitly: &quot;the isolation test suite is a deliverable, not a nice-to-have.&quot;<\/p><p><strong>Minutes 25-38 - the deep dives they are likely to pick.<\/strong><\/p><ul><li><strong>The human review loop.<\/strong> A confidence score per field, not per document, so review is field-level and takes seconds rather than minutes. A review queue with prioritization by tenant SLA and document age. <strong>The corrections are the most valuable data you produce<\/strong> - they are the eval set (Q125) and the fine-tuning corpus, so capture the before and after, not just the final value.<\/li><li><strong>Quality and evaluation.<\/strong> A labelled set per document type built from review corrections; field-level accuracy as the metric; run in CI on every prompt, model or pipeline change; a per-tenant dashboard so a regression on one customer&#x27;s document type is visible even when the aggregate is flat. That last point is the multi-tenant-specific insight.<\/li><li><strong>Cost control.<\/strong> Route by document class; cache by content hash so redelivery of the same document is free; cap tokens per document and truncate with a page-level relevance filter for very long documents; batch where latency allows. State the target as <strong>cost per successfully extracted document<\/strong>, which is the only metric that connects quality and cost.<\/li><li><strong>Reprocessing.<\/strong> When the model improves, you want to re-run 30 million historical documents. That is a separate, throttled, low-priority path with its own queue and budget, writing new result versions rather than overwriting - which is why results are versioned.<\/li><\/ul><p><strong>Minutes 38-42 - failure and scale.<\/strong> A poison document that crashes the parser must dead-letter with the tenant notified, not retry forever. A model provider outage should degrade to queueing rather than failing submissions, with the customer-visible SLA expressed in hours. At 10x, the first thing to break is the model provider quota and your monthly bill; the second is the review queue, because human capacity does not scale with a slider - which is the argument for spending on accuracy rather than on reviewers.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;The design is an async, versioned state machine over object storage with cost-driven routing and a field-level human review loop. The two decisions that define it are classify-first routing, which is where the cost control lives, and versioning every result, which is what makes reprocessing and audit possible. <strong>The part I am least happy with<\/strong> is the review queue - it is a human bottleneck I have designed around rather than solved, and if the accuracy is worse than assumed, it becomes the whole system&#x27;s capacity limit. At 10x I would expect the model spend and the review headcount to be the binding constraints, not the infrastructure.&quot;<\/p><p><strong>Depth:<\/strong> <code>../09-rag<\/code> Categories 2-3; <code>../08-genai<\/code> Categories 10 and 13; <code>../05-aws<\/code> Category 8.<\/p>", "source": "scenario-questions.md (S9)", "search": "design round, 45 minutes, run end to end: a multi-tenant document processing platform. \"design a platform that ingests documents from business customers, extracts structured data from them, and makes the results available through an api. assume you are building it for our company.\" minutes 0-4 - scope and constrain. the questions that change the architecture, and the answers to assume if they will not give them: - what kinds of documents, and who controls them? assume mixed pdfs including scans, 1-50 pages, uploaded by customers. this matters because scanned documents mean ocr, which changes the cost and latency model by an order of magnitude. - what does \"extract\" mean - fixed fields or open-ended? assume a per-tenant schema of 10-40 fields. fixed schemas allow validation and evaluation; open-ended extraction does not. - latency expectation? assume this is asynchronous - minutes, not seconds - and say why you are assuming it: \"extraction on a 50-page scan cannot be synchronous, so i will design an async submit-and-poll or webhook api. tell me if there is a synchronous requirement, because that would change everything.\" - volume? assume 200,000 documents a day, spiky, with tenant concentration. - accuracy and review? assume there is a confidence threshold below which a human reviews - this is the single most important requirement to surface, because a system with no human path is a very different product. - tenancy model? shared infrastructure, hard data isolation. minutes 4-10 - the arithmetic. do it out loud (q62). 200,000 documents a day is a bit over 2 per second average, and with a 5x business-hours peak, maybe 10-15 per second. that is a small number, and saying so is the point: the throughput is not the problem . average 10 pages at, say, 2 kb of text per page is 20 kb of text per document, so 4 gb of text per day, plus the originals - say 500 kb each, so 100 gb a day of blobs, 36 tb a year. storage growth and lifecycle are a real problem; request throughput is not. if extraction uses a model at roughly 8,000 input tokens for a long document plus a 1,000-token response, that is order-of-magnitude cents per document at current prices, so 200,000 a day is a five-figure monthly model bill - which makes cost a first-class design constraint and justifies routing cheap documents to a cheap path (q122). then the sentence that reframes the round: \"so the design problems here are cost per document, tenant isolation, the human review loop, and reprocessing - not scale.\" minutes 10-25 - the design. api. post /documents returning 202 with a document id; get /documents/{id} returning status and results; a webhook per tenant for completion; post /documents/{id}/reprocess. idempotency key on submit, because customers retry (q50). pipeline. upload goes straight to object storage via a presigned url - never through your api, which keeps large payloads off your compute. a message per document drives a state machine , not a chain: received → classified → text-extracted → fields-extracted → validated → (needs-review) → complete. say why a state machine: every stage is separately retriable, the state is queryable for support, and a partial failure resumes rather than restarting the expensive stages. stages. classify first, cheaply, to decide the route: a native-text pdf skips ocr entirely, which is the largest cost saving available. text extraction with a parser, ocr only where needed. field extraction with a model, structured output constrained to the tenant's schema. validation in code - types, formats, checksums, cross-field arithmetic - because deterministic validation catches a large share of extraction errors for free and produces the confidence signal. storage. originals in object storage with a per-tenant prefix and lifecycle rules to colder tiers. extracted results in a relational store, partitioned by tenant. every result carries the model version, prompt version and pipeline version , which is the thing that makes ing submissions, with the customer-visible sla expressed in hours. at 10x, the first thing to break is the model provider quota and your monthly bill; the second is the review queue, because human capacity does not scale with a slider - which is the argument for spending on accuracy rather than on reviewers. minutes 42-45 - close. \"the design is an async, versioned state machine over object storage with cost-driven routing and a field-level human review loop. the two decisions that define it are classify-first routing, which is where the cost control lives, and versioning every result, which is what makes reprocessing and audit possible. the part i am least happy with is the review queue - it is a human bottleneck i have designed around rather than solved, and if the accuracy is worse than assumed, it becomes the whole system's capacity limit. at 10x i would expect the model spend and the review headcount to be the binding constraints, not the infrastructure.\" depth: ../09-rag categories 2-3; ../08-genai categories 10 and 13; ../05-aws category 8."}, {"n": 73, "category": 5, "difficulty": "A", "html": "Design round, 45 minutes, run end to end: real-time notification and fanout for twenty million users.", "answerTitle": "Real-time notification and fanout for twenty million users", "answer": "<blockquote><p>&quot;Twenty million users. When something happens that a user cares about, they should see it within a couple of seconds, on web and mobile.&quot;<\/p><\/blockquote><p><strong>Minutes 0-4 - scope and constrain.<\/strong> Nail these before drawing anything:<\/p><ul><li><strong>What generates a notification, and what is the fan-out distribution?<\/strong> This is the question. Assume a mix: direct events (one recipient), group events (tens), and broadcast or follow-style events with a long tail up to millions. <strong>The tail is the design.<\/strong><\/li><li><strong>Delivery semantics?<\/strong> Assume at-least-once with client-side deduplication, and say why exactly-once is not on offer (Q46).<\/li><li><strong>Must an offline user get it later?<\/strong> Assume yes - so there is durable per-user state, not just a live push.<\/li><li><strong>Ordering?<\/strong> Assume per-user ordering is desirable but not strict; the notification carries a timestamp and the client sorts.<\/li><li><strong>Read state, and does it sync across devices?<\/strong> Assume yes, which means read state is server-side and is itself a write.<\/li><\/ul><p><strong>Minutes 4-10 - the arithmetic.<\/strong> Twenty million users, say 10 percent concurrent at peak - <strong>two million live connections<\/strong>. That number alone determines the architecture: at maybe 50,000-100,000 concurrent connections per node with tuned settings, that is 20-40 gateway nodes, and the gateway must be a separate tier from anything else because its scaling driver is connections, not requests.<\/p><p>If each user gets 20 notifications a day, that is 400 million writes a day, about 5,000 per second average and maybe 20,000 at peak. At ~200 bytes each, roughly 80 GB a day of notification rows - so retention is a design decision, not an afterthought; assume 30 days hot and archive beyond.<\/p><p>Now the tail: one broadcast to 5 million recipients at 20,000 writes per second of capacity is over four minutes if you materialize it. <strong>That is the number that forces the hybrid.<\/strong><\/p><p><strong>Minutes 10-25 - the design.<\/strong><\/p><p><em>Tiers.<\/em> Producers publish an event to a durable log. A <strong>fan-out service<\/strong> consumes it, resolves recipients, and writes per-user notification rows. A <strong>delivery service<\/strong> pushes to connected clients via the gateway and to APNs/FCM for the rest. A <strong>connection gateway<\/strong> holds WebSocket connections and knows nothing about business logic. Separating the gateway from the fan-out is the single most important structural decision, because they fail and scale independently.<\/p><p><em>The hybrid fan-out, which is the core of the round.<\/em> Below a threshold - say 10,000 recipients - <strong>fan-out on write<\/strong>: materialize a row per recipient, which makes reads trivial. Above it, <strong>fan-out on read<\/strong>: write one row to a broadcast feed, record the recipient set by reference (a topic), and have each user&#x27;s timeline query merge their personal notifications with the small number of broadcast topics they subscribe to. State the threshold as a tuned parameter and say what you would tune it on: the write amplification budget versus the read latency budget.<\/p><p><em>Routing to a connection.<\/em> A user&#x27;s connection lives on a specific gateway node, so you need a registry - user id to node id, in Redis with a TTL and heartbeat - or you publish to a per-node channel and let nodes filter. Say the trade-off: a registry is precise but is a hot dependency in the delivery path; broadcast-and-filter is simpler and wastes bandwidth linearly in node count. At 40 nodes, broadcast-and-filter is defensible; at 400 it is not.<\/p><p><em>Storage.<\/em> Per-user notification list keyed by <code>(user_id, created_at)<\/code> in a partitioned store - this is a textbook wide-partition access pattern, so DynamoDB or Cassandra with the user as the partition key, or a partitioned relational table if the operational simplicity is worth more. Read state on the same row. Unread count is the trap: computing it per read is expensive, so maintain a counter and accept that it can drift, with a periodic reconciliation.<\/p><p><em>Mobile push<\/em> is a different path with different failure modes - a third-party dependency with its own rate limits, tokens that expire, and no delivery guarantee. Treat it as a separate consumer of the same event, not as part of the same code path.<\/p><p><strong>Minutes 25-38 - the deep dives.<\/strong><\/p><ul><li><strong>Connection management.<\/strong> Authentication at connect, not per message. Heartbeats to detect half-open connections. <strong>The reconnect storm is the failure mode that matters<\/strong>: when a gateway node dies, its connections all reconnect at once, so clients need jittered exponential backoff and the gateway needs connection rate limiting - otherwise a single node failure cascades. On reconnect, the client sends the last notification id it saw and gets the delta, which is also how you handle missed messages without a durable per-connection queue.<\/li><li><strong>Backpressure.<\/strong> A slow client cannot be allowed to consume memory in the gateway - bound the per-connection buffer and drop the connection when it fills, because the client will reconnect and resync from the last id. Say this explicitly; it is a detail that only comes from having run one.<\/li><li><strong>Deduplication and idempotency.<\/strong> Each notification has a stable id derived from the event; clients dedupe on it. The fan-out consumer must be idempotent because the log will redeliver (Q50).<\/li><li><strong>The celebrity re-check.<\/strong> Even with the hybrid, a user following 500 broadcast topics makes the read expensive. Cap the merge set, or promote very high-traffic topics back to materialization for active users only.<\/li><\/ul><p><strong>Minutes 38-42 - failure and scale.<\/strong> If the fan-out service falls behind, notifications are late but not lost - and the SLO should be stated as a percentile of end-to-end delay, with lag as the alert. If Redis (the connection registry) is down, fall back to broadcast-and-filter rather than dropping delivery. If the log is down, producers must not block: notification is not worth failing the originating transaction over, so the producer writes to its outbox and the notification is delayed (Q48). At 10x, the first constraint is connection count and therefore gateway cost, and the second is the write amplification on the fan-out tier.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;A separate connection tier, a durable log, and a hybrid fan-out with a threshold - materialize for the many, reference for the few. The two defining decisions are the hybrid threshold and the resync-on-reconnect protocol, which is what lets me treat the gateway as disposable. <strong>The weakest part<\/strong> is unread count consistency; I have chosen a counter that can drift with periodic reconciliation, and if the product requires it to be exact, that is a materially harder design. At 10x, connections dominate cost before anything else does.&quot;<\/p><p><strong>Depth:<\/strong> <code>../04-system-design<\/code> Category 10; <code>../03-microservices<\/code> Category 3.<\/p>", "source": "scenario-questions.md (S10)", "search": "design round, 45 minutes, run end to end: real-time notification and fanout for twenty million users. \"twenty million users. when something happens that a user cares about, they should see it within a couple of seconds, on web and mobile.\" minutes 0-4 - scope and constrain. nail these before drawing anything: - what generates a notification, and what is the fan-out distribution? this is the question. assume a mix: direct events (one recipient), group events (tens), and broadcast or follow-style events with a long tail up to millions. the tail is the design. - delivery semantics? assume at-least-once with client-side deduplication, and say why exactly-once is not on offer (q46). - must an offline user get it later? assume yes - so there is durable per-user state, not just a live push. - ordering? assume per-user ordering is desirable but not strict; the notification carries a timestamp and the client sorts. - read state, and does it sync across devices? assume yes, which means read state is server-side and is itself a write. minutes 4-10 - the arithmetic. twenty million users, say 10 percent concurrent at peak - two million live connections . that number alone determines the architecture: at maybe 50,000-100,000 concurrent connections per node with tuned settings, that is 20-40 gatew inearly in node count. at 40 nodes, broadcast-and-filter is defensible; at 400 it is not. storage. per-user notification list keyed by (user_id, created_at) in a partitioned store - this is a textbook wide-partition access pattern, so dynamodb or cassandra with the user as the partition key, or a partitioned relational table if the operational simplicity is worth more. read state on the same row. unread count is the trap: computing it per read is expensive, so maintain a counter and accept that it can drift, with a periodic reconciliation. mobile push is a different path with different failure modes - a third-party dependency with its own rate limits, tokens that expire, and no delivery guarantee. treat it as a separate consumer of the same event, not as part of the same code path. minutes 25-38 - the deep dives. - connection management. authentication at connect, not per message. heartbeats to detect half-open connections. the reconnect storm is the failure mode that matters : when a gateway node dies, its connections all reconnect at once, so clients need jittered exponential backoff and the gateway needs connection rate limiting - otherwise a single node failure cascades. on reconnect, the client sends the last notification id it saw and gets the delta, which is also how you handle missed messages without a durable per-connection queue. - backpressure. a slow client cannot be allowed to consume memory in the gateway - bound the per-connection buffer and drop the connection when it fills, because the client will reconnect and resync from the last id. say this explicitly; it is a detail that only comes from having run one. - deduplication and idempotency. each notification has a stable id derived from the event; clients dedupe on it. the fan-out consumer must be idempotent because the log will redeliver (q50). - the celebrity re-check. even with the hybrid, a user following 500 broadcast topics makes the read expensive. cap the merge set, or promote very high-traffic topics back to materialization for active users only. minutes 38-42 - failure and scale. if the fan-out service falls behind, notifications are late but not lost - and the slo should be stated as a percentile of end-to-end delay, with lag as the alert. if redis (the connection registry) is down, fall back to broadcast-and-filter rather than dropping delivery. if the log is down, producers must not block: notification is not worth failing the originating transaction over, so the producer writes to its outbox and the notification is delayed (q48). at 10x, the first constraint is connection count and therefore gateway cost, and the second is the write amplification on the fan-out tier. minutes 42-45 - close. \"a separate connection tier, a durable log, and a hybrid fan-out with a threshold - materialize for the many, reference for the few. the two defining decisions are the hybrid threshold and the resync-on-reconnect protocol, which is what lets me treat the gateway as disposable. the weakest part is unread count consistency; i have chosen a counter that can drift with periodic reconciliation, and if the product requires it to be exact, that is a materially harder design. at 10x, connections dominate cost before anything else does.\" depth: ../04-system-design category 10; ../03-microservices category 3."}, {"n": 74, "category": 5, "difficulty": "A", "html": "Design round, 45 minutes, run end to end: migrating a telecom-scale nightly batch pipeline to streaming.", "answerTitle": "Telecom-scale nightly batch to streaming", "answer": "<blockquote><p>&quot;You have a nightly batch that processes call detail records - eight hours, 400 million records, producing usage aggregates and billing inputs. The business wants near-real-time. Design the migration.&quot;<\/p><\/blockquote><p>This one is as much about <strong>migration strategy<\/strong> as architecture, and candidates who design only the target system miss half the round.<\/p><p><strong>Minutes 0-4 - scope and constrain.<\/strong><\/p><ul><li><strong>Why real-time?<\/strong> Push on this, politely. Real-time fraud detection is a different requirement from a customer-facing usage dashboard, which is different again from &quot;the batch window no longer fits&quot;. Assume: customer-visible usage within a minute, and the batch window is genuinely at risk.<\/li><li><strong>Does billing have to move?<\/strong> Assume <strong>no<\/strong>, and say why loudly: billing is the correctness-critical, audited, reconciled path, and moving it to streaming is a much larger risk than the value justifies in phase one. This is the highest-scoring judgement call in the round.<\/li><li><strong>Late and duplicate records?<\/strong> Assume yes to both - network elements deliver late and re-deliver. This is the defining property of the domain.<\/li><li><strong>Correction records?<\/strong> Assume yes - a later record can amend an earlier one, which means aggregates must be revisable.<\/li><\/ul><p><strong>Minutes 4-10 - the arithmetic.<\/strong> 400 million records in 8 hours is about 14,000 per second sustained <em>if<\/em> the batch were spread evenly - and the streaming system must handle the real arrival distribution, which is peaky, so design for 30,000-50,000 per second. At ~500 bytes a record that is 200 GB a day, 70 TB a year raw.<\/p><p><strong>The point to make from the arithmetic:<\/strong> the streaming ingest rate is comparable to what the batch already processes; the hard part is not throughput, it is <strong>correctness under late arrival and the coexistence of two systems<\/strong> during the migration.<\/p><p><strong>Minutes 10-25 - the design.<\/strong><\/p><p><em>Ingest.<\/em> Records land on a partitioned log, partitioned by subscriber id so that all records for one subscriber are ordered and one consumer owns their state (Q174). Retention long enough to reprocess - at minimum longer than your worst recovery time, and ideally long enough to rebuild a day.<\/p><p><em>Processing.<\/em> Stateful stream processing with <strong>event-time windows and watermarks<\/strong>, not processing time. Explain the distinction, because it is the heart of the round: a record for 23:58 that arrives at 00:04 must land in yesterday&#x27;s window, and a system keyed on arrival time silently gets this wrong forever. Allowed lateness bounded (say two hours), and records later than that go to a <strong>late-arrival path<\/strong> that emits a correction rather than being dropped.<\/p><p><em>Deduplication.<\/em> A record id with a keyed state store and a TTL matching the maximum expected delay window. Say the cost: this state is per-key and it is the thing that determines your memory footprint and your recovery time.<\/p><p><em>Aggregates.<\/em> Emit <strong>revisable<\/strong> aggregates - each output carries a version and a watermark, and consumers must handle a restatement. This is the architectural consequence of late data and it must be in the contract, not bolted on.<\/p><p><em>Serving.<\/em> Aggregates written to a store optimized for the read pattern - per-subscriber current usage as a key-value lookup, and a columnar or time-series store for analytics.<\/p><p><strong>Minutes 25-38 - the migration, which is the real content.<\/strong><\/p><ul><li><strong>Phase 0: run in parallel, compare, change nothing.<\/strong> The streaming pipeline runs alongside the batch and writes to a shadow output. A reconciliation job compares the two nightly and reports discrepancies by class. <strong>You do not cut over until the discrepancy rate is understood, not just small<\/strong> - a 0.01 percent difference that you cannot explain is a blocker, because the explanation is usually a whole class of records.<\/li><li><strong>Phase 1: new consumers on streaming.<\/strong> The customer-facing usage dashboard reads from the streaming aggregates. Nothing that exists today changes. This delivers the business value that motivated the project, at almost no risk, and it is the phase most candidates skip.<\/li><li><strong>Phase 2: retire the batch for non-billing outputs<\/strong>, one output at a time, each with its own reconciliation period.<\/li><li><strong>Phase 3: billing, if ever<\/strong> - and only with a full parallel run over a complete billing cycle, sign-off from finance and audit, and a rollback that is &quot;keep running the batch&quot; rather than a data migration.<\/li><\/ul><p>Say the sequencing principle out loud: <strong>the batch is the reference implementation until it is provably redundant<\/strong>, and every phase keeps it running.<\/p><p><strong>Minutes 38-42 - failure and operations.<\/strong> Consumer lag is the primary SLI, with alerting on the derivative as well as the value. A bad deploy in a stateful streaming job is worse than in a stateless service because state is expensive to rebuild - so you need savepoints and a tested restore, and you must know your rebuild time. Reprocessing a day requires either a long enough log retention or a replay from cold storage, and you should know which. And the operational cost is real: a 24/7 pipeline needs on-call, and the batch effectively did not.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;Partitioned log by subscriber, event-time windowing with bounded lateness and a correction path, revisable aggregates, and a migration that runs in parallel and moves consumers rather than moving the pipeline. The two decisions that define it are event time over processing time, and keeping billing on the batch until it is proven redundant. <strong>The part I would push back on<\/strong> is the requirement itself - if the driver is only the batch window, a faster batch or a micro-batch every fifteen minutes gets most of the value for a fraction of the risk, and I would want to see the business case for seconds before committing to a stateful streaming platform and the on-call burden that comes with it.&quot;<\/p><p><strong>Depth:<\/strong> <code>../04-system-design<\/code> Categories 8 and 12; <code>../06-database<\/code> Category 11; <code>../03-microservices<\/code> Category 3.<\/p>", "source": "scenario-questions.md (S11)", "search": "design round, 45 minutes, run end to end: migrating a telecom-scale nightly batch pipeline to streaming. \"you have a nightly batch that processes call detail records - eight hours, 400 million records, producing usage aggregates and billing inputs. the business wants near-real-time. design the migration.\" this one is as much about migration strategy as architecture, and candidates who design only the target system miss half the round. minutes 0-4 - scope and constrain. - why real-time? push on this, politely. real-time fraud detection is a different requirement from a customer-facing usage dashboard, which is different again from \"the batch window no longer fits\". assume: customer-visible usage within a minute, and the batch window is genuinely at risk. - does billing have to move? assume no , and say why loudly: billing is the correctness-critical, audited, reconciled path, and moving it to streaming is a much larger risk than the value justifies in phase one. this is the highest-scoring judgement call in the round. - late and duplicate records? assume yes to both - network elements deliver late and re-deliver. this is the defining property of the domain. - correction records? assume yes - a later record can amend an earlier one, which means aggregates must be revisable. minutes 4-10 - the arithmetic. 400 million records in 8 hours is about 14,000 per second sustained if the batch were spread evenly - and the streaming system must handle the real arrival distribution, which is peaky, so design for 30,000-50,000 per second. at ~500 bytes a record that is 200 gb a day, 70 tb a year raw. the point to make from the arithmetic: the streaming ingest rate is comparable to what the batch already processes; the hard part is not throughput, it is correctness under late arrival and the coexistence of two systems during the migration. minutes 10-25 - the design. ingest. records land on a partitioned log, partitioned by subscriber id so that all records for one subscriber are ordered and one consumer owns their state (q174). retention long enough to reprocess - at minimum longer than your worst recovery time, and ideally long enough to rebuild a day. processing. stateful stream processing with event-time windows and watermarks , not processing time. explain the distinction, because it is the heart of the round: a record for 23:58 that arrives at 00:04 must land in yesterday's window, and a system keyed on arrival time silently gets this wrong forever. allowed lateness bounded (say two hours), and records later than that go to a late-arrival path that emits a correction rather than being dropped. deduplication. a record id with a keyed state store and a ttl matching the maximum expected delay window. say the cost: this state is per-key and it is the thing that determines your memory footprint and your recovery time. aggregates. emit revisable aggregates - each output carries a version and a watermark, and consumers must handle a restatement. this is the architectural consequence of late data and it must be in the contract, not bolted on. serving. aggregates written to a store optimized for the read pattern - per-subscriber current usage as a key-value lookup, and a columnar or time-series store for analytics. minutes 25-38 - the migration, which is the real content. - phase 0: run in parallel, compare, change nothing. the streaming pipeline runs alongside the batch and writes to a shadow output. a reconciliation job compares the two nightly and reports discrepancies by class. you do not cut over until the discrepancy rate is understood, not just small - a 0.01 percent difference that you cannot explain is a blocker, because the explanation is usually a whole class of records. - phase 1: new consumers on streaming. the customer-facing usage dashboard reads from the streaming aggregates. nothing that exists today changes. this delivers the business value that motivated the project, at almost no risk, and it is the phase most candidates skip. - phase 2: retire the batch for non-billing outputs , one output at a time, each with its own reconciliation period. - phase 3: billing, if ever - and only with a full parallel run over a complete billing cycle, sign-off from finance and audit, and a rollback that is \"keep running the batch\" rather than a data migration. say the sequencing principle out loud: the batch is the reference implementation until it is provably redundant , and every phase keeps it running. minutes 38-42 - failure and operations. consumer lag is the primary sli, with alerting on the derivative as well as the value. a bad deploy in a stateful streaming job is worse than in a stateless service because state is expensive to rebuild - so you need savepoints and a tested restore, and you must know your rebuild time. reprocessing a day requires either a long enough log retention or a replay from cold storage, and you should know which. and the operational cost is real: a 24/7 pipeline needs on-call, and the batch effectively did not. minutes 42-45 - close. \"partitioned log by subscriber, event-time windowing with bounded lateness and a correction path, revisable aggregates, and a migration that runs in parallel and moves consumers rather than moving the pipeline. the two decisions that define it are event time over processing time, and keeping billing on the batch until it is proven redundant. the part i would push back on is the requirement itself - if the driver is only the batch window, a faster batch or a micro-batch every fifteen minutes gets most of the value for a fraction of the risk, and i would want to see the business case for seconds before committing to a stateful streaming platform and the on-call burden that comes with it.\" depth: ../04-system-design categories 8 and 12; ../06-database category 11; ../03-microservices category 3."}, {"n": 75, "category": 5, "difficulty": "A", "html": "Design round, 45 minutes, run end to end: an AI assistant embedded in an existing enterprise SaaS product.", "answerTitle": "An AI assistant inside an existing enterprise SaaS product", "answer": "<blockquote><p>&quot;We have a mature B2B SaaS product with 3,000 customer organizations. Leadership wants an AI assistant in it. Design it.&quot;<\/p><\/blockquote><p>The trap is designing a chatbot. The round rewards designing the <strong>surrounding system<\/strong>: permissions, evaluation, cost, and the failure behaviour.<\/p><p><strong>Minutes 0-4 - scope and constrain.<\/strong> Push hard here, because the requirement as given is not a requirement.<\/p><ul><li><strong>What job does it do?<\/strong> Offer three and make them choose: answer questions about the customer&#x27;s own data; answer questions about the product (help and documentation); or take actions in the product. Say why it matters: &quot;these are three different systems with different risk profiles, and the third one is an order of magnitude harder because it needs an authorization architecture&quot; (Q127).<\/li><li>Assume: <strong>primarily question-answering over the customer&#x27;s own data, plus product help<\/strong>, with actions deferred.<\/li><li><strong>Who sees what?<\/strong> Assume the product already has a permission model with roles and record-level access. <strong>The assistant must not become a permission bypass<\/strong> - that is the requirement that shapes everything.<\/li><li><strong>Latency and volume?<\/strong> Assume first token in under two seconds, and maybe 50,000 queries a day across all tenants.<\/li><li><strong>Data handling?<\/strong> Assume enterprise contracts prohibit training on customer data and some tenants require regional residency.<\/li><\/ul><p><strong>Minutes 4-10 - the arithmetic.<\/strong> 50,000 queries a day is well under one per second - <strong>throughput is irrelevant<\/strong>, which is worth saying explicitly because it stops the round drifting into scaling. At maybe 4,000 input and 500 output tokens per query, the cost is a per-query figure in the low cents, so tens of thousands of dollars a year at this volume - material but not decisive. <strong>What matters is per-tenant cost attribution<\/strong>, because with 3,000 tenants and no per-tenant limit, a single automated integration hammering the assistant is both an outage and a bill.<\/p><p>Retrieval sizing: if a typical tenant has 100,000 documents and records, the index is per-tenant-filtered rather than per-tenant-physical - 3,000 separate indexes is an operational problem, one index with a mandatory tenant filter is not.<\/p><p><strong>Minutes 10-25 - the design.<\/strong><\/p><p><em>Shape.<\/em> A retrieval-grounded assistant, not a fine-tuned model. Say why in one sentence: the data changes constantly and is tenant-specific, which is exactly the case retrieval serves and fine-tuning does not (<code>../09-rag<\/code> Category 1).<\/p><p><em>Ingestion.<\/em> The product&#x27;s existing data changes continuously, so indexing is <strong>event-driven off the existing change stream<\/strong>, not a nightly crawl - and the permission metadata must be indexed alongside the content, because it changes too. State the hard part: <strong>when a user&#x27;s access is revoked, the index must reflect it immediately<\/strong>, which means permissions are evaluated at query time against the current source of truth, not baked into the index alone.<\/p><p><em>Permission-aware retrieval.<\/em> Filter <strong>inside<\/strong> the vector search with a mandatory tenant predicate and the user&#x27;s accessible-resource set, not after. Post-filtering silently destroys recall and, worse, leaks through result counts and citations. If the accessible set is too large to pass as a filter, invert it - retrieve then check against the authoritative service, and over-fetch to compensate. Say which you would choose and why (<code>../09-rag<\/code> Category 10).<\/p><p><em>Retrieval.<\/em> Hybrid lexical plus dense, because product data is full of identifiers, customer names and codes that embeddings handle badly. A reranker over a wide candidate set. Query routing: a question about the product goes to the documentation index, a question about the customer&#x27;s data goes to the tenant index, and an ambiguous one goes to both.<\/p><p><em>Generation.<\/em> Grounded answers with <strong>citations to records the user can click<\/strong>, which is both a trust feature and your cheapest hallucination control - a claim with no citation is visibly unsupported. Explicit abstention when retrieval returns nothing above threshold (Q126).<\/p><p><em>Placement in the product.<\/em> Behind the existing API gateway, using the existing session and permission context - not a separate service with its own auth, which is how the permission bypass gets built by accident.<\/p><p><strong>Minutes 25-38 - the deep dives.<\/strong><\/p><ul><li><strong>Evaluation.<\/strong> A per-tenant-shaped golden set built from real queries, with retrieval recall and answer groundedness scored separately (Q125). Run in CI on every prompt, model or index change. The multi-tenant twist: <strong>the aggregate score hides per-tenant regressions<\/strong>, so you need slices by tenant size and data type, and a canary set of tenants who opted in.<\/li><li><strong>Rollout.<\/strong> Off by default, on per tenant, with an admin toggle. Start with internal use, then five design-partner tenants, then general availability. A per-tenant kill switch that an account manager can pull without a deploy. This is the answer to &quot;how do you ship AI into an enterprise product safely&quot; and it is mostly product mechanics rather than model work.<\/li><li><strong>Cost and abuse.<\/strong> Per-tenant quotas and rate limits, cost attribution tagged to the tenant, a per-query token cap, and caching - both exact-match and semantic - with the honest note that cache hit rates on free-text queries are usually disappointing.<\/li><li><strong>Data handling.<\/strong> Zero-retention terms with the provider or a self-hosted model for the tenants that require it; regional routing for residency; and a clear statement of what is logged, because your request logs now contain customer data and that changes their classification.<\/li><li><strong>Security.<\/strong> The tenant&#x27;s own documents are untrusted content. If you later add actions, that is the lethal trifecta and it needs the authorization architecture from Q144 - say this now, briefly, as the reason actions are phase two (Q129).<\/li><\/ul><p><strong>Minutes 38-42 - failure and scale.<\/strong> Provider outage: fail to a clear &quot;assistant unavailable&quot; rather than a degraded wrong answer, and never block the rest of the product. Bad answers: a feedback control on every response, routed to the eval set. Index lag: show the freshness boundary rather than silently answering from stale data. At 10x tenants, the operational issue is not compute - it is the long tail of tenants with unusual data shapes on which quality is quietly poor, which is an argument for the per-tenant metrics being built first.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;Retrieval-grounded, inside the existing permission context, event-driven indexing, per-tenant everything - quotas, metrics, rollout, kill switch. The two defining decisions are filtering inside retrieval rather than after it, and deferring actions to a second phase with a real authorization design. <strong>The weakest part<\/strong> is index freshness against permission changes; I have made permissions authoritative at query time to cover it, which costs latency, and if that budget is too tight the design gets harder. The thing I would want to measure before general availability is per-tenant quality, because the aggregate will look fine while a tenant with unusual data is having a bad experience.&quot;<\/p><p><strong>Depth:<\/strong> <code>../09-rag<\/code> Categories 10-11; <code>../08-genai<\/code> Category 10; <code>../11-security<\/code> Category 12.<\/p>", "source": "scenario-questions.md (S12)", "search": "design round, 45 minutes, run end to end: an ai assistant embedded in an existing enterprise saas product. \"we have a mature b2b saas product with 3,000 customer organizations. leadership wants an ai assistant in it. design it.\" the trap is designing a chatbot. the round rewards designing the surrounding system : permissions, evaluation, cost, and the failure behaviour. minutes 0-4 - scope and constrain. push hard here, because the requirement as given is not a requirement. - what job does it do? offer three and make them choose: answer questions about the customer's own data; answer questions about the product (help and documentation); or take actions in the product. say why it matters: \"these are three different systems with different risk profiles, and the third one is an order of magnitude harder because it needs an authorization architecture\" (q127). - assume: primarily question-answering over the customer's own data, plus product help , with actions deferred. - who sees what? assume the product already has a permission model with roles and record-level access. the assistant must not become a permission bypass - that is the requirement that shapes everything. - latency and volume? assume first token in under two seconds, and maybe 50,000 queries a day across all tenants. - data handling? assume enterprise contracts prohibit training on customer data and some tenants require regional residency. minutes 4-10 - the arithmetic. 50,000 queries a day is well under one per second - throughput is irrelevant , which is worth saying explicitly because it stops the round drifting into scaling. at maybe 4,000 input and 500 output tokens per query, the cost is a per-query figure in the low cents, so tens of thousands of dollars a year at this volume - material but not decisive. what matters is per-tenant cost attribution , because with 3,000 tenants and no per-tenant limit, a single automated integration hammering the assistant is both an outage and a bill. retrieval sizing: if a typical tenant has 100,000 documents and records, the index is per-tenant-filtered rather than per-tenant-physical - 3,000 separate indexes is an operational problem, one index with a mandatory tenant filter is not. minutes 10-25 - the design. shape. a retrieval-grounded assistant, not a fine-tuned model. say why in one sentence: the data changes constantly and is tenant-specific, which is exactly the case retrieval serves and fine-tuning does not (../09-rag category 1). ingestion. the product's existing data changes continuously, so indexing is event-driven off the existing change stream , not a nightly crawl - and the permission metadata must be indexed alongside the content, because it changes too. state the hard part: when a user's access is revoked, the index must reflect it immediately , which means permissions are evaluated at query time against the current source of truth, not baked into the index alone. permission-aware retrieval. filter inside the vector search with a mandatory tenant predicate and the user's accessible-resource set, not after. post-filtering silently destroys recall and, worse, leaks through result counts and citations. if the accessible set is too large to pass as a filter, invert it - retrieve then check against the authoritative service, and over-fetch to compensate. say which you would choose and why (../09-rag category 10). retrieval. hybrid lexical plus dense, because product data is full of identifiers, customer names and codes that embeddings handle badly. a reranker over a wide candidate set. query routing: a question about the product goes to the documentation index, a question about the customer's data goes to the tenant index, and an ambiguous one goes to both. generation. grounded answers with
