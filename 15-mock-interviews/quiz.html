<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interviews Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>

<script id="data" type="application/json">{"categories": [{"index": 1, "title": "How a principal-level loop is run and scored"}, {"index": 2, "title": "Recruiter and hiring-manager screen"}, {"index": 3, "title": "Java and Spring deep-dive round"}, {"index": 4, "title": "Distributed systems and microservices round"}, {"index": 5, "title": "System design round"}, {"index": 6, "title": "Cloud and AWS round"}, {"index": 7, "title": "Data and database round"}, {"index": 8, "title": "DevOps, delivery and incident-command round"}, {"index": 9, "title": "AI round: GenAI, RAG and agents"}, {"index": 10, "title": "Security round"}, {"index": 11, "title": "Coding and pairing round"}, {"index": 12, "title": "Architecture review and code review rounds"}, {"index": 13, "title": "Behavioural and leadership under pressure"}, {"index": 14, "title": "Bar raiser, curveballs and recovery"}, {"index": 15, "title": "Reverse interview, debrief signals, offer and negotiation"}], "questions": [{"n": 1, "category": 1, "difficulty": "C", "html": "What is a hiring loop actually deciding at principal level, and why is &quot;can this person do the job&quot; not the question being asked?", "answerTitle": "What the loop is actually deciding", "answer": "<p>The loop is not deciding whether you can do the job. It is deciding <strong>whether a group of people who have each spent 45 minutes with you will collectively defend hiring you at a level, in a room, using written evidence<\/strong>.<\/p><p>Three consequences follow, and they should change how you prepare:<\/p><ul><li><strong>The unit of output is a written note, not a conversation.<\/strong> Whatever the interviewer cannot write down did not happen. An answer that was brilliant but unquotable scores lower than a clear answer with one number in it.<\/li><li><strong>The decision is about risk, not ceiling.<\/strong> At principal level the question is &quot;what is the chance this person is a problem in eighteen months&quot;, so evidence of judgement, self-correction and disagreement handling outweighs one more correct mechanism.<\/li><li><strong>Level is decided separately from hire.<\/strong> You can be a clear hire at one level below the one you applied for, which is the most common bad outcome for a 19-year candidate who answers everything at senior depth.<\/li><\/ul><p><strong>Say it in the room like this:<\/strong> give them a sentence they can copy verbatim into the notes. &quot;We cut p99 from 1.4 seconds to 240 milliseconds by moving the fan-out off the request path&quot; is a note. &quot;We improved performance significantly&quot; is not.<\/p>", "source": "answers.md", "search": "what is a hiring loop actually deciding at principal level, and why is \"can this person do the job\" not the question being asked? the loop is not deciding whether you can do the job. it is deciding whether a group of people who have each spent 45 minutes with you will collectively defend hiring you at a level, in a room, using written evidence . three consequences follow, and they should change how you prepare: - the unit of output is a written note, not a conversation. whatever the interviewer cannot write down did not happen. an answer that was brilliant but unquotable scores lower than a clear answer with one number in it. - the decision is about risk, not ceiling. at principal level the question is \"what is the chance this person is a problem in eighteen months\", so evidence of judgement, self-correction and disagreement handling outweighs one more correct mechanism. - level is decided separately from hire. you can be a clear hire at one level below the one you applied for, which is the most common bad outcome for a 19-year candidate who answers everything at senior depth. say it in the room like this: give them a sentence they can copy verbatim into the notes. \"we cut p99 from 1.4 seconds to 240 milliseconds by moving the fan-out off the request path\" is a note. \"we improved performance significantly\" is not."}, {"n": 2, "category": 1, "difficulty": "D", "html": "Name the round types in a typical principal, lead or architect loop and the single signal each round owns.", "answerTitle": "Round types and the signal each one owns", "answer": "<table><thead><tr><th>Round<\/th><th>The one signal it owns<\/th><th>What it is not measuring<\/th><\/tr><\/thead><tbody><tr><td>Recruiter screen<\/td><td>Basic fit, level plausibility, compensation range<\/td><td>Technical depth<\/td><\/tr><tr><td>Hiring manager<\/td><td>Scope match, motivation, how you would operate on their team<\/td><td>Algorithms<\/td><\/tr><tr><td>Coding / pairing<\/td><td>Can you still produce working code and collaborate while doing it<\/td><td>Cleverness (Q148)<\/td><\/tr><tr><td>Deep technical dive<\/td><td>Depth on demand - three levels of &quot;why&quot; (Q30)<\/td><td>Breadth<\/td><\/tr><tr><td>System design<\/td><td>Structured ambiguity handling and trade-off reasoning (Q60)<\/td><td>Getting the &quot;right&quot; design<\/td><\/tr><tr><td>Architecture / code review<\/td><td>Judgement about other people&#x27;s work, and how you deliver criticism (Q163)<\/td><td>Whether you would have built it that way<\/td><\/tr><tr><td>Behavioral / leadership<\/td><td>Influence, conflict, ownership, evidence of learning (Q176)<\/td><td>Technical detail<\/td><\/tr><tr><td>Bar raiser<\/td><td>Consistency across the loop, and the level call (Q192)<\/td><td>Any single topic<\/td><\/tr><\/tbody><\/table><p><strong>The useful move:<\/strong> at the start of each round, ask <em>&quot;what would you like to get out of the next 45 minutes?&quot;<\/em> It costs twenty seconds and tells you which signal to optimize for.<\/p>", "source": "answers.md", "search": "name the round types in a typical principal, lead or architect loop and the single signal each round owns. round the one signal it owns what it is not measuring --- --- --- recruiter screen basic fit, level plausibility, compensation range technical depth hiring manager scope match, motivation, how you would operate on their team algorithms coding / pairing can you still produce working code and collaborate while doing it cleverness (q148) deep technical dive depth on demand - three levels of \"why\" (q30) breadth system design structured ambiguity handling and trade-off reasoning (q60) getting the \"right\" design architecture / code review judgement about other people's work, and how you deliver criticism (q163) whether you would have built it that way behavioral / leadership influence, conflict, ownership, evidence of learning (q176) technical detail bar raiser consistency across the loop, and the level call (q192) any single topic the useful move: at the start of each round, ask \"what would you like to get out of the next 45 minutes?\" it costs twenty seconds and tells you which signal to optimize for."}, {"n": 3, "category": 1, "difficulty": "D", "html": "What happens in a debrief, and how does a hiring decision actually get made when interviewers disagree?", "answerTitle": "What actually happens in a debrief", "answer": "<p>Interviewers write independent feedback (usually before seeing each other&#x27;s), then the panel meets. The chair walks round by round, asks for the <strong>evidence<\/strong> behind each score, and looks for two things: <strong>a consistent story<\/strong> and <strong>a disqualifying data point<\/strong>.<\/p><ul><li>Scores are not averaged. A specific, well-evidenced concern from one interviewer outweighs three &quot;seemed good&quot; positives, because the positive notes are not falsifiable and the concern is.<\/li><li>Disagreement is resolved by asking <em>&quot;what did you see?&quot;<\/em> This is why generic answers are dangerous: they leave your advocates with nothing to say on your behalf.<\/li><li>The level call happens here, and is usually made on the design and behavioral rounds rather than the coding round.<\/li><\/ul><p><strong>Preparation consequence:<\/strong> you are writing your advocate&#x27;s script during the loop. Give at least one quotable, specific, numeric artifact per round.<\/p>", "source": "answers.md", "search": "what happens in a debrief, and how does a hiring decision actually get made when interviewers disagree? interviewers write independent feedback (usually before seeing each other's), then the panel meets. the chair walks round by round, asks for the evidence behind each score, and looks for two things: a consistent story and a disqualifying data point . - scores are not averaged. a specific, well-evidenced concern from one interviewer outweighs three \"seemed good\" positives, because the positive notes are not falsifiable and the concern is. - disagreement is resolved by asking \"what did you see?\" this is why generic answers are dangerous: they leave your advocates with nothing to say on your behalf. - the level call happens here, and is usually made on the design and behavioral rounds rather than the coding round. preparation consequence: you are writing your advocate's script during the loop. give at least one quotable, specific, numeric artifact per round."}, {"n": 4, "category": 1, "difficulty": "T", "html": "Two interviewers say strong hire and one says no hire with a specific example. What usually happens, and what does that imply about where to spend your preparation?", "answerTitle": "Two strong hires and one evidenced no hire", "answer": "<p>The no hire usually wins, or the loop is extended with another round - which is a materially worse position than a clean pass.<\/p><p>The asymmetry exists because a specific negative is <strong>falsifiable evidence<\/strong> and a general positive is not. &quot;He could not explain why his own retry design would not duplicate the payment&quot; is a sentence a panel can act on. &quot;Strong communicator&quot; is not.<\/p><p><strong>What that implies for your preparation:<\/strong> your marginal hour is worth more spent removing a weakness than deepening a strength. Specifically, spend it on the topic you would least like to be asked about, because the interviewer who finds it is the one whose note decides the loop. This is also the argument for mock interviews with a peer who will actually push (Q14) rather than reading answers you already agree with.<\/p>", "source": "answers.md", "search": "two interviewers say strong hire and one says no hire with a specific example. what usually happens, and what does that imply about where to spend your preparation? the no hire usually wins, or the loop is extended with another round - which is a materially worse position than a clean pass. the asymmetry exists because a specific negative is falsifiable evidence and a general positive is not. \"he could not explain why his own retry design would not duplicate the payment\" is a sentence a panel can act on. \"strong communicator\" is not. what that implies for your preparation: your marginal hour is worth more spent removing a weakness than deepening a strength. specifically, spend it on the topic you would least like to be asked about, because the interviewer who finds it is the one whose note decides the loop. this is also the argument for mock interviews with a peer who will actually push (q14) rather than reading answers you already agree with."}, {"n": 5, "category": 1, "difficulty": "D", "html": "What does leveling mean in practice, and what evidence in an interviewer&#x27;s notes moves a candidate from senior to principal?", "answerTitle": "Leveling, and what moves the needle", "answer": "<p>Leveling is decided on <strong>scope of impact<\/strong> and <strong>ambiguity tolerated<\/strong>, not years or depth.<\/p><table><thead><tr><th>Evidence in the notes<\/th><th>Reads as<\/th><\/tr><\/thead><tbody><tr><td>&quot;Solved a hard problem well&quot;<\/td><td>Senior<\/td><\/tr><tr><td>&quot;Chose not to solve it, and redefined the problem so it did not need solving&quot;<\/td><td>Principal<\/td><\/tr><tr><td>&quot;Knows the mechanism deeply&quot;<\/td><td>Senior<\/td><\/tr><tr><td>&quot;Knows the mechanism and the cost of using it at our size&quot;<\/td><td>Principal<\/td><\/tr><tr><td>&quot;Led a project&quot;<\/td><td>Senior<\/td><\/tr><tr><td>&quot;Changed how three teams work, and it stuck after he left&quot;<\/td><td>Principal<\/td><\/tr><tr><td>&quot;Handled the incident&quot;<\/td><td>Senior<\/td><\/tr><tr><td>&quot;Changed the class of incident so it stopped recurring&quot;<\/td><td>Principal<\/td><\/tr><\/tbody><\/table><p><strong>The pattern:<\/strong> principal-level evidence is about <strong>second-order effects<\/strong> - what happened to the organization, the cost curve, or the failure class, not what happened to the ticket. Every story in your bank should have that second sentence attached.<\/p>", "source": "answers.md", "search": "what does leveling mean in practice, and what evidence in an interviewer's notes moves a candidate from senior to principal? leveling is decided on scope of impact and ambiguity tolerated , not years or depth. evidence in the notes reads as --- --- \"solved a hard problem well\" senior \"chose not to solve it, and redefined the problem so it did not need solving\" principal \"knows the mechanism deeply\" senior \"knows the mechanism and the cost of using it at our size\" principal \"led a project\" senior \"changed how three teams work, and it stuck after he left\" principal \"handled the incident\" senior \"changed the class of incident so it stopped recurring\" principal the pattern: principal-level evidence is about second-order effects - what happened to the organization, the cost curve, or the failure class, not what happened to the ticket. every story in your bank should have that second sentence attached."}, {"n": 6, "category": 1, "difficulty": "D", "html": "Interviewers are trained to record evidence rather than impressions. What does a usable piece of evidence look like, and how do you hand them one?", "answerTitle": "What a usable piece of evidence looks like", "answer": "<p>An interviewer&#x27;s note is usable if a stranger reading it can tell what you did and how hard it was. The shape is: <strong>context with a number, decision with an alternative rejected, outcome with a number, and something you learned.<\/strong><\/p><blockquote><p>Weak: &quot;Has experience with performance tuning.&quot; Usable: &quot;Diagnosed a p99 regression to connection-pool exhaustion under retry storms; chose to bound retries with a budget rather than enlarge the pool because the pool was masking the real fault; p99 1.4s to 240ms, and he added the retry-budget metric to the platform template so other teams inherited it.&quot;<\/p><\/blockquote><p><strong>How you hand them one:<\/strong> end substantial answers with a compressed version of that sentence. Not a story - a caption. The four-layer answer&#x27;s fourth layer is exactly this, and most candidates drop it under time pressure.<\/p>", "source": "answers.md", "search": "interviewers are trained to record evidence rather than impressions. what does a usable piece of evidence look like, and how do you hand them one? an interviewer's note is usable if a stranger reading it can tell what you did and how hard it was. the shape is: context with a number, decision with an alternative rejected, outcome with a number, and something you learned. weak: \"has experience with performance tuning.\" usable: \"diagnosed a p99 regression to connection-pool exhaustion under retry storms; chose to bound retries with a budget rather than enlarge the pool because the pool was masking the real fault; p99 1.4s to 240ms, and he added the retry-budget metric to the platform template so other teams inherited it.\" how you hand them one: end substantial answers with a compressed version of that sentence. not a story - a caption. the four-layer answer's fourth layer is exactly this, and most candidates drop it under time pressure."}, {"n": 7, "category": 1, "difficulty": "C", "html": "What four things is every interviewer scoring, regardless of the round&#x27;s nominal topic?", "answerTitle": "The four things always being scored", "answer": "<p>Regardless of the nominal topic:<\/p><ol><li><strong>Depth on demand.<\/strong> Can you go three levels deeper than your first answer (Q30)?<\/li><li><strong>Trade-off literacy.<\/strong> Does every answer carry a cost, an alternative and a condition under which you would decide differently?<\/li><li><strong>Production judgement.<\/strong> Have you operated this, or only built it? Incidents, rollbacks, cost, migrations, on-call.<\/li><li><strong>Communication and collaboration.<\/strong> Can the interviewer follow you, and is working with you pleasant?<\/li><\/ol><p>The fourth is the one senior candidates discount and bar raisers weight heavily. A round can be lost purely on the interviewer having to work hard to follow you.<\/p>", "source": "answers.md", "search": "what four things is every interviewer scoring, regardless of the round's nominal topic? regardless of the nominal topic: 1. depth on demand. can you go three levels deeper than your first answer (q30)? 2. trade-off literacy. does every answer carry a cost, an alternative and a condition under which you would decide differently? 3. production judgement. have you operated this, or only built it? incidents, rollbacks, cost, migrations, on-call. 4. communication and collaboration. can the interviewer follow you, and is working with you pleasant? the fourth is the one senior candidates discount and bar raisers weight heavily. a round can be lost purely on the interviewer having to work hard to follow you."}, {"n": 8, "category": 1, "difficulty": "T", "html": "You answered every question correctly and still got a no hire. Give the three most common causes.", "answerTitle": "Correct answers, no hire", "answer": "<ul><li><strong>Level mismatch.<\/strong> Every answer was correct at senior depth. No second-order impact, no organizational scope, no &quot;and then I changed how we do this&quot; (Q5).<\/li><li><strong>No trade-offs.<\/strong> Answers were assertions. The panel could not tell whether you understand <em>when not to<\/em> do the thing you recommended, which at principal level is the whole job.<\/li><li><strong>Unpleasant to work with.<\/strong> You corrected the interviewer three times, or you dismissed their system, or you never once said &quot;that is a good point, I had not considered it&quot;. This is the most common invisible failure, because nobody tells you.<\/li><\/ul><p>Two more that show up in debriefs: <strong>no curiosity<\/strong> (you asked nothing about their problems) and <strong>the same story three times<\/strong> (Q182).<\/p>", "source": "answers.md", "search": "you answered every question correctly and still got a no hire. give the three most common causes. - level mismatch. every answer was correct at senior depth. no second-order impact, no organizational scope, no \"and then i changed how we do this\" (q5). - no trade-offs. answers were assertions. the panel could not tell whether you understand when not to do the thing you recommended, which at principal level is the whole job. - unpleasant to work with. you corrected the interviewer three times, or you dismissed their system, or you never once said \"that is a good point, i had not considered it\". this is the most common invisible failure, because nobody tells you. two more that show up in debriefs: no curiosity (you asked nothing about their problems) and the same story three times (q182)."}, {"n": 9, "category": 1, "difficulty": "D", "html": "How should the time inside a 45-minute round be budgeted, and what is the single most common misallocation?", "answerTitle": "Budgeting 45 minutes", "answer": "<p>A workable default for a technical round: 3 minutes of framing and scoping, 30-32 minutes of substance, 5 minutes for the interviewer&#x27;s remaining must-ask questions, 5 minutes for your questions.<\/p><p><strong>The most common misallocation is front-loading.<\/strong> Candidates spend 15 minutes on the first sub-topic because they know it well, and the interviewer never gets to ask the two questions that would have distinguished them. The fix is mechanical: <strong>say the shape first<\/strong> (&quot;there are four parts to this - I will do each in about two minutes and go deeper wherever you want&quot;), then keep to it, then explicitly offer depth. That single sentence also demonstrates the structuring the round is scoring.<\/p><p>In a design round the split is different and is covered in Q60 and Q71.<\/p>", "source": "answers.md", "search": "how should the time inside a 45-minute round be budgeted, and what is the single most common misallocation? a workable default for a technical round: 3 minutes of framing and scoping, 30-32 minutes of substance, 5 minutes for the interviewer's remaining must-ask questions, 5 minutes for your questions. the most common misallocation is front-loading. candidates spend 15 minutes on the first sub-topic because they know it well, and the interviewer never gets to ask the two questions that would have distinguished them. the fix is mechanical: say the shape first (\"there are four parts to this - i will do each in about two minutes and go deeper wherever you want\"), then keep to it, then explicitly offer depth. that single sentence also demonstrates the structuring the round is scoring. in a design round the split is different and is covered in q60 and q71."}, {"n": 10, "category": 1, "difficulty": "D", "html": "What is a mock interview for, and what makes a mock worthless?", "answerTitle": "What a mock is for, and what makes one worthless", "answer": "<p>A mock exists to produce <strong>failure under realistic conditions, cheaply<\/strong>. Its output is a list of things that broke - not a feeling that it went well.<\/p><p>A mock is worthless when:<\/p><ul><li><strong>You are both the interviewer and the interviewee, silently.<\/strong> Reading a question and thinking &quot;I know that&quot; is not practice; the failure mode being trained is <em>speaking<\/em> under time pressure, and it is not exercised.<\/li><li><strong>There is no clock.<\/strong> Time pressure is the variable that causes almost every real failure (Q203).<\/li><li><strong>There are no follow-ups.<\/strong> The whole game at this level is the second and third &quot;why&quot; (Q30). A mock without a ladder trains the wrong skill.<\/li><li><strong>You stop when it goes badly.<\/strong> The recovery is the most valuable thing to rehearse (Q193).<\/li><\/ul><p><strong>Minimum viable mock:<\/strong> a timer, a question you have not scripted, speaking out loud, a recording, and one page of notes afterwards.<\/p>", "source": "answers.md", "search": "what is a mock interview for, and what makes a mock worthless? a mock exists to produce failure under realistic conditions, cheaply . its output is a list of things that broke - not a feeling that it went well. a mock is worthless when: - you are both the interviewer and the interviewee, silently. reading a question and thinking \"i know that\" is not practice; the failure mode being trained is speaking under time pressure, and it is not exercised. - there is no clock. time pressure is the variable that causes almost every real failure (q203). - there are no follow-ups. the whole game at this level is the second and third \"why\" (q30). a mock without a ladder trains the wrong skill. - you stop when it goes badly. the recovery is the most valuable thing to rehearse (q193). minimum viable mock: a timer, a question you have not scripted, speaking out loud, a recording, and one page of notes afterwards."}, {"n": 11, "category": 1, "difficulty": "D", "html": "How do you self-score a mock with no partner, and what exactly do you record?", "answerTitle": "Self-scoring without a partner", "answer": "<p>Record audio. Then score against a fixed rubric rather than a memory of how it felt, because the memory is systematically generous.<\/p><p>Record for each answer: <strong>time taken<\/strong>, whether you gave a <strong>number<\/strong>, whether you named a <strong>trade-off<\/strong>, whether you had an <strong>experience hook<\/strong>, and where you <strong>hesitated or padded<\/strong>. Padding is audible on a recording and invisible in the moment - phrases like &quot;so basically&quot; and &quot;as I mentioned&quot; cluster exactly where you are not sure.<\/p><p>Two metrics worth tracking session over session: <strong>time to first structured sentence<\/strong> (should be under 15 seconds) and <strong>percentage of answers with at least one number<\/strong>. Both are objective and both correlate with how the round is scored (Q6).<\/p>", "source": "answers.md", "search": "how do you self-score a mock with no partner, and what exactly do you record? record audio. then score against a fixed rubric rather than a memory of how it felt, because the memory is systematically generous. record for each answer: time taken , whether you gave a number , whether you named a trade-off , whether you had an experience hook , and where you hesitated or padded . padding is audible on a recording and invisible in the moment - phrases like \"so basically\" and \"as i mentioned\" cluster exactly where you are not sure. two metrics worth tracking session over session: time to first structured sentence (should be under 15 seconds) and percentage of answers with at least one number . both are objective and both correlate with how the round is scored (q6)."}, {"n": 12, "category": 1, "difficulty": "T", "html": "You have run the same mock three times and your score improved each time. What is the likely artifact, and how do you control for it?", "answerTitle": "Your mock score improved three times", "answer": "<p>The likely artifact is <strong>memorization of the specific answer<\/strong>, not improvement in answering. You are measuring recall of a script under conditions that will not recur - the real interviewer will phrase it differently and follow up somewhere else.<\/p><p>Controls:<\/p><ul><li><strong>Rotate the question set.<\/strong> A question you have answered should not reappear for at least two weeks.<\/li><li><strong>Score the process, not the content.<\/strong> Did you scope before answering? Did you offer a trade-off unprompted? Those transfer; the content does not.<\/li><li><strong>Have the partner change the follow-up path,<\/strong> so the second and third level are never the same.<\/li><li><strong>Introduce an adjacent question you have not prepared<\/strong> in every session, and score only that one.<\/li><\/ul><p>The general principle is the one from evaluation discipline in <code>../08-genai/answers.md<\/code>: a test set you have iterated against is no longer a test set.<\/p>", "source": "answers.md", "search": "you have run the same mock three times and your score improved each time. what is the likely artifact, and how do you control for it? the likely artifact is memorization of the specific answer , not improvement in answering. you are measuring recall of a script under conditions that will not recur - the real interviewer will phrase it differently and follow up somewhere else. controls: - rotate the question set. a question you have answered should not reappear for at least two weeks. - score the process, not the content. did you scope before answering? did you offer a trade-off unprompted? those transfer; the content does not. - have the partner change the follow-up path, so the second and third level are never the same. - introduce an adjacent question you have not prepared in every session, and score only that one. the general principle is the one from evaluation discipline in ../08-genai/answers.md: a test set you have iterated against is no longer a test set."}, {"n": 13, "category": 1, "difficulty": "A", "html": "Design a six-week mock schedule across the eleven technical packs, given three sessions a week and a full-time job.", "answerTitle": "A six-week mock schedule", "answer": "<p>Three sessions a week, eighteen sessions. Constraint: full-time job, so each session is 60-75 minutes including the debrief.<\/p><table><thead><tr><th>Week<\/th><th>Session 1<\/th><th>Session 2<\/th><th>Session 3<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Screen and positioning (Cat 2)<\/td><td>Java and Spring deep dive (Cat 3)<\/td><td>Design round, framing only - first 15 minutes, three times<\/td><\/tr><tr><td>2<\/td><td>Microservices deep dive (Cat 4)<\/td><td>Full design round Q72<\/td><td>Behavioral: three stories, timed (Cat 13)<\/td><\/tr><tr><td>3<\/td><td>AWS round (Cat 6)<\/td><td>Database round (Cat 7)<\/td><td>Full design round Q76<\/td><\/tr><tr><td>4<\/td><td>DevOps and incident command (Cat 8)<\/td><td>Coding round, 45 minutes (Cat 11)<\/td><td>AI round (Cat 9)<\/td><\/tr><tr><td>5<\/td><td>Security round (Cat 10)<\/td><td>Architecture review (Cat 12)<\/td><td>Full design round Q75<\/td><\/tr><tr><td>6<\/td><td>Full loop day: <a href=\"mocks/loop-01-java-platform-principal.md\">mocks/loop-01<\/a> or the matching archetype<\/td><td>Bar raiser and curveballs (Cat 14)<\/td><td>Reverse interview and negotiation (Cat 15), plus a re-run of your weakest round<\/td><\/tr><\/tbody><\/table><p><strong>Rules that make the schedule work:<\/strong> the design rounds are always full length and always recorded; every session ends with one page of notes; the weakest round from weeks 1-4 gets re-run in week 6 with a different question. Reading time is not scheduled here - it belongs to the packs themselves, and if the material is not known, the mock is premature.<\/p>", "source": "answers.md", "search": "design a six-week mock schedule across the eleven technical packs, given three sessions a week and a full-time job. three sessions a week, eighteen sessions. constraint: full-time job, so each session is 60-75 minutes including the debrief. week session 1 session 2 session 3 --- --- --- --- 1 screen and positioning (cat 2) java and spring deep dive (cat 3) design round, framing only - first 15 minutes, three times 2 microservices deep dive (cat 4) full design round q72 behavioral: three stories, timed (cat 13) 3 aws round (cat 6) database round (cat 7) full design round q76 4 devops and incident command (cat 8) coding round, 45 minutes (cat 11) ai round (cat 9) 5 security round (cat 10) architecture review (cat 12) full design round q75 6 full loop day: mocks/loop-01 or the matching archetype bar raiser and curveballs (cat 14) reverse interview and negotiation (cat 15), plus a re-run of your weakest round rules that make the schedule work: the design rounds are always full length and always recorded; every session ends with one page of notes; the weakest round from weeks 1-4 gets re-run in week 6 with a different question. reading time is not scheduled here - it belongs to the packs themselves, and if the material is not known, the mock is premature."}, {"n": 14, "category": 1, "difficulty": "A", "html": "Design a calibration process with a peer outside your domain so that their score carries information.", "answerTitle": "Calibrating with a peer outside your domain", "answer": "<p>The problem: a peer who does not know AWS cannot tell whether your answer was right, so their score is noise unless you change what they score.<\/p><p><strong>Give them the observable rubric.<\/strong> They can reliably score four things without domain knowledge: did the candidate scope before answering; was the structure statable in one sentence afterwards; were trade-offs explicit; was there a number. Have them score only those, 1-4, with one line of evidence each.<\/p><p><strong>Give them the follow-up ladder in writing.<\/strong> Take it from this pack - each answer here has one. They do not need to understand the answer to ask &quot;why?&quot; and then &quot;what would make you change that?&quot; and then &quot;what breaks first at ten times the volume?&quot;<\/p><p><strong>Give them a stop rule.<\/strong> &quot;If you cannot restate my answer in one sentence, mark it unclear and tell me.&quot; That single instruction produces the most valuable feedback a non-expert can give, and it maps directly to the fourth thing every interviewer scores (Q7).<\/p><p><strong>Calibrate the calibrator once:<\/strong> run one session where you deliberately give a bad answer and one where you give a strong one, and check that their scores separate. If they do not, the rubric is too abstract - make it more behavioral.<\/p>", "source": "answers.md", "search": "design a calibration process with a peer outside your domain so that their score carries information. the problem: a peer who does not know aws cannot tell whether your answer was right, so their score is noise unless you change what they score. give them the observable rubric. they can reliably score four things without domain knowledge: did the candidate scope before answering; was the structure statable in one sentence afterwards; were trade-offs explicit; was there a number. have them score only those, 1-4, with one line of evidence each. give them the follow-up ladder in writing. take it from this pack - each answer here has one. they do not need to understand the answer to ask \"why?\" and then \"what would make you change that?\" and then \"what breaks first at ten times the volume?\" give them a stop rule. \"if you cannot restate my answer in one sentence, mark it unclear and tell me.\" that single instruction produces the most valuable feedback a non-expert can give, and it maps directly to the fourth thing every interviewer scores (q7). calibrate the calibrator once: run one session where you deliberately give a bad answer and one where you give a strong one, and check that their scores separate. if they do not, the rubric is too abstract - make it more behavioral."}, {"n": 15, "category": 2, "difficulty": "C", "html": "Give a 90-second introduction covering 19 years, three companies, .NET into Java, and AI from 2024, that ends somewhere useful for the interviewer.", "answerTitle": "The 90-second introduction", "answer": "<p>Structure: <strong>now, arc, proof, aim<\/strong> - roughly 20, 25, 30 and 15 seconds.<\/p><blockquote><p>&quot;I am a principal-level engineer at Sonata Software, currently leading Java and Spring Boot services on AWS with a security and AI focus. My arc is nineteen years across three companies: I started in .NET at Nittany, spent twelve years at Verizon India where I moved from .NET into Java and Spring as we broke telecom-scale systems into services, and since 2022 at Sonata I have been doing Java 17 and Spring Boot on AWS, with AI engineering from 2024. The work I would point at is <em>[one system, with a scale number]<\/em> and <em>[one AI feature, with a cost or quality number]<\/em>. What I am looking for now is a role where the architecture decisions and the standards across teams are mine to own, which is why this conversation interested me.&quot;<\/p><\/blockquote><p><strong>Why it is shaped that way:<\/strong> it ends on <em>their<\/em> problem rather than your history, which invites the next question you want. It also plants the level claim (&quot;standards across teams&quot;) early, which is what Q5 says the loop decides.<\/p><p><strong>Red flags:<\/strong> chronological narration from 2007 forward, no numbers, ending on &quot;and that is my background&quot; with nothing for them to grab.<\/p>", "source": "answers.md", "search": "give a 90-second introduction covering 19 years, three companies, .net into java, and ai from 2024, that ends somewhere useful for the interviewer. structure: now, arc, proof, aim - roughly 20, 25, 30 and 15 seconds. \"i am a principal-level engineer at sonata software, currently leading java and spring boot services on aws with a security and ai focus. my arc is nineteen years across three companies: i started in .net at nittany, spent twelve years at verizon india where i moved from .net into java and spring as we broke telecom-scale systems into services, and since 2022 at sonata i have been doing java 17 and spring boot on aws, with ai engineering from 2024. the work i would point at is [one system, with a scale number] and [one ai feature, with a cost or quality number] . what i am looking for now is a role where the architecture decisions and the standards across teams are mine to own, which is why this conversation interested me.\" why it is shaped that way: it ends on their problem rather than your history, which invites the next question you want. it also plants the level claim (\"standards across teams\") early, which is what q5 says the loop decides. red flags: chronological narration from 2007 forward, no numbers, ending on \"and that is my background\" with nothing for them to grab."}, {"n": 16, "category": 2, "difficulty": "D", "html": "&quot;Walk me through your resume.&quot; Structure it, and say what the interviewer is listening for at each transition.", "answerTitle": "\"Walk me through your resume\"", "answer": "<p>Do not walk it. <strong>Frame it, then walk the last two roles and offer the rest.<\/strong> Nineteen years narrated linearly will consume the screen and bore the listener.<\/p><blockquote><p>&quot;There is a twelve-year Verizon chapter and a Sonata chapter, and the through-line is that I have built the same architectural patterns in two ecosystems. Shall I spend most of the time on the last five years and come back to Verizon if it is relevant?&quot;<\/p><\/blockquote><p><strong>What they listen for at each transition:<\/strong> why you left (never blame), what changed in your scope, and whether the story is consistent with the resume dates. Unexplained transitions are the thing they are checking.<\/p><p>Attach one artifact per chapter: at Verizon the scale, at Sonata the AWS and AI work. Two numbers total is enough for a screen.<\/p><p><strong>Follow-up ladder:<\/strong> &quot;Why did you move from .NET to Java?&quot; (Q20) → &quot;What was your actual role in that migration?&quot; → &quot;Who disagreed with you?&quot;<\/p>", "source": "answers.md", "search": "\"walk me through your resume.\" structure it, and say what the interviewer is listening for at each transition. do not walk it. frame it, then walk the last two roles and offer the rest. nineteen years narrated linearly will consume the screen and bore the listener. \"there is a twelve-year verizon chapter and a sonata chapter, and the through-line is that i have built the same architectural patterns in two ecosystems. shall i spend most of the time on the last five years and come back to verizon if it is relevant?\" what they listen for at each transition: why you left (never blame), what changed in your scope, and whether the story is consistent with the resume dates. unexplained transitions are the thing they are checking. attach one artifact per chapter: at verizon the scale, at sonata the aws and ai work. two numbers total is enough for a screen. follow-up ladder: \"why did you move from .net to java?\" (q20) → \"what was your actual role in that migration?\" → \"who disagreed with you?\""}, {"n": 17, "category": 2, "difficulty": "T", "html": "&quot;You have been at Sonata since 2022 - why are you looking?&quot; Answer it without criticizing the employer and without sounding evasive.", "answerTitle": "\"Why are you looking?\" without criticizing the employer", "answer": "<p>The rule: <strong>pull, not push.<\/strong> Say what you are moving <em>toward<\/em>. Every complaint about Sonata, however justified, is heard as a preview of how you will describe them in two years.<\/p><blockquote><p>&quot;Nothing is wrong at Sonata - I would recommend the team. The honest answer is that the architecture decisions I most want to be making are decided a level above the role I am in, and the AI platform work I have been driving since 2024 is not the core of the business. I want a role where that is the mandate rather than something I create room for.&quot;<\/p><\/blockquote><p><strong>What makes it credible:<\/strong> it is specific, it is about scope rather than money or people, and it contains a small, non-damaging admission. A completely frictionless answer sounds rehearsed.<\/p><p><strong>Red flags:<\/strong> &quot;the management is toxic&quot;, &quot;no growth&quot; with no detail, or a long pause before answering.<\/p>", "source": "answers.md", "search": "\"you have been at sonata since 2022 - why are you looking?\" answer it without criticizing the employer and without sounding evasive. the rule: pull, not push. say what you are moving toward . every complaint about sonata, however justified, is heard as a preview of how you will describe them in two years. \"nothing is wrong at sonata - i would recommend the team. the honest answer is that the architecture decisions i most want to be making are decided a level above the role i am in, and the ai platform work i have been driving since 2024 is not the core of the business. i want a role where that is the mandate rather than something i create room for.\" what makes it credible: it is specific, it is about scope rather than money or people, and it contains a small, non-damaging admission. a completely frictionless answer sounds rehearsed. red flags: \"the management is toxic\", \"no growth\" with no detail, or a long pause before answering."}, {"n": 18, "category": 2, "difficulty": "D", "html": "&quot;Why this role?&quot; when a recruiter found you and you know almost nothing about the company.", "answerTitle": "\"Why this role?\" when the recruiter found you", "answer": "<p>Do not fake enthusiasm about a company you researched for six minutes. <strong>Be honest about the sequence and specific about the hypothesis.<\/strong><\/p><blockquote><p>&quot;A recruiter approached me, so I will be straight: I did not come looking. What made me take the call was <em>[one specific thing - the domain, the scale, the fact that they run Java on AWS at a size where the problems are real]<\/em>. What I do not yet know is whether the role has the scope it sounds like, and that is mostly what I want to work out today.&quot;<\/p><\/blockquote><p>That last clause is doing real work: it turns the screen into a two-way conversation and sets up your questions (Q209) as legitimate rather than presumptuous.<\/p><p><strong>Red flag:<\/strong> reciting the company&#x27;s mission statement back to them. Everyone can tell.<\/p>", "source": "answers.md", "search": "\"why this role?\" when a recruiter found you and you know almost nothing about the company. do not fake enthusiasm about a company you researched for six minutes. be honest about the sequence and specific about the hypothesis. \"a recruiter approached me, so i will be straight: i did not come looking. what made me take the call was [one specific thing - the domain, the scale, the fact that they run java on aws at a size where the problems are real] . what i do not yet know is whether the role has the scope it sounds like, and that is mostly what i want to work out today.\" that last clause is doing real work: it turns the screen into a two-way conversation and sets up your questions (q209) as legitimate rather than presumptuous. red flag: reciting the company's mission statement back to them. everyone can tell."}, {"n": 19, "category": 2, "difficulty": "T", "html": "Nineteen years and no manager title. How do you frame the principal track so it reads as a choice rather than a ceiling?", "answerTitle": "Nineteen years, no manager title", "answer": "<p>Frame it as a <strong>fork you took deliberately<\/strong>, with evidence that you did the leadership part anyway.<\/p><blockquote><p>&quot;I went down the technical track on purpose. I have had the choice twice and both times chose the architecture side, because the work I am good at is the design and the standards rather than the headcount. What I did not skip is the leadership: <em>[the standard you drove across teams you did not own, the engineers you mentored to independence, the incident you commanded]<\/em>.&quot;<\/p><\/blockquote><p><strong>The trap<\/strong> is defensiveness - explaining at length why management is not for you. One sentence on the choice, then straight to evidence. The interviewer is not questioning your worth; they are checking whether &quot;principal&quot; means anything in your case (Q5).<\/p><p><strong>Follow-up ladder:<\/strong> &quot;How do you get things done without authority?&quot; (Q180) → &quot;Tell me about someone who did not agree&quot; → &quot;What happened after you left?&quot;<\/p>", "source": "answers.md", "search": "nineteen years and no manager title. how do you frame the principal track so it reads as a choice rather than a ceiling? frame it as a fork you took deliberately , with evidence that you did the leadership part anyway. \"i went down the technical track on purpose. i have had the choice twice and both times chose the architecture side, because the work i am good at is the design and the standards rather than the headcount. what i did not skip is the leadership: [the standard you drove across teams you did not own, the engineers you mentored to independence, the incident you commanded] .\" the trap is defensiveness - explaining at length why management is not for you. one sentence on the choice, then straight to evidence. the interviewer is not questioning your worth; they are checking whether \"principal\" means anything in your case (q5). follow-up ladder: \"how do you get things done without authority?\" (q180) → \"tell me about someone who did not agree\" → \"what happened after you left?\""}, {"n": 20, "category": 2, "difficulty": "D", "html": "How do you present the .NET-to-Java transition as an asset, and what makes the same story sound like a gap?", "answerTitle": "The .NET-to-Java transition as an asset", "answer": "<p>The asset framing is <strong>comparative<\/strong>: you have implemented the same architectural patterns in two independent ecosystems, so you can tell which parts are essential and which are framework accidents.<\/p><p>Make it concrete rather than philosophical. Dependency injection, declarative transactions, an ORM&#x27;s identity map, an async model - you have seen two implementations of each, and the differences tell you what the pattern actually is. That is a genuinely rare vantage point and it is the reason you are hard to fool by a framework&#x27;s marketing.<\/p><p><strong>When the same story sounds like a gap:<\/strong> if you date your Java from 2016 and then answer Java questions at 2016 depth. The asset framing only survives if the depth is current - virtual threads, records, sealed types, the current GC choices (<code>../01-java<\/code>). Prepare one modern-Java answer specifically to close this.<\/p>", "source": "answers.md", "search": "how do you present the .net-to-java transition as an asset, and what makes the same story sound like a gap? the asset framing is comparative : you have implemented the same architectural patterns in two independent ecosystems, so you can tell which parts are essential and which are framework accidents. make it concrete rather than philosophical. dependency injection, declarative transactions, an orm's identity map, an async model - you have seen two implementations of each, and the differences tell you what the pattern actually is. that is a genuinely rare vantage point and it is the reason you are hard to fool by a framework's marketing. when the same story sounds like a gap: if you date your java from 2016 and then answer java questions at 2016 depth. the asset framing only survives if the depth is current - virtual threads, records, sealed types, the current gc choices (../01-java). prepare one modern-java answer specifically to close this."}, {"n": 21, "category": 2, "difficulty": "D", "html": "&quot;What is your current compensation?&quot; What do you say, what do you never say, and what changes if the jurisdiction bans the question?", "answerTitle": "\"What is your current compensation?\"", "answer": "<p>Never volunteer the current number. Redirect to <strong>expectation<\/strong>, and anchor the expectation on the role.<\/p><blockquote><p>&quot;I would rather talk about the range for the role than my current number, because they are set by different things. Based on the scope we have described, I am looking at <em>[range]<\/em>. If that is inside your band, everything else is a detail.&quot;<\/p><\/blockquote><p>If pressed hard and the question is legal where you are, giving a total-compensation figure including variable pay is better than stonewalling into hostility - but always paired with the expectation, so the current number does not become the anchor.<\/p><p>Where the question is banned, say so calmly and give the expectation. See Q214 for the case where you have no signal about their range at all.<\/p>", "source": "answers.md", "search": "\"what is your current compensation?\" what do you say, what do you never say, and what changes if the jurisdiction bans the question? never volunteer the current number. redirect to expectation , and anchor the expectation on the role. \"i would rather talk about the range for the role than my current number, because they are set by different things. based on the scope we have described, i am looking at [range] . if that is inside your band, everything else is a detail.\" if pressed hard and the question is legal where you are, giving a total-compensation figure including variable pay is better than stonewalling into hostility - but always paired with the expectation, so the current number does not become the anchor. where the question is banned, say so calmly and give the expectation. see q214 for the case where you have no signal about their range at all."}, {"n": 22, "category": 2, "difficulty": "D", "html": "The hiring manager asks what you would do in your first 90 days. What structure works when you do not yet know the systems?", "answerTitle": "\"What would you do in your first 90 days?\"", "answer": "<p>The structure that works when you do not know the systems: <strong>learn, prove, change<\/strong> - 30 days each, with the explicit statement that the plan is a hypothesis you expect to revise.<\/p><ul><li><strong>Days 1-30, learn:<\/strong> read the incident history and the on-call rotation before the code; get on-call shadow if possible; map the top five services, their owners and their SLOs; find out where the money goes. Ship something small on day one so the deployment path is in your hands.<\/li><li><strong>Days 31-60, prove:<\/strong> take one real, visible problem with a measurable outcome - a p99, a cost line, a flaky pipeline - and fix it end to end. Credibility at principal level is bought with a delivered thing, not with a document.<\/li><li><strong>Days 61-90, change:<\/strong> propose one structural change with the evidence gathered in the first sixty days, and get it agreed rather than announced.<\/li><\/ul><p><strong>The sentence that makes this land:<\/strong> &quot;I would want to be careful about proposing an architecture in the first month - I have seen people do that and spend a year paying for it.&quot;<\/p>", "source": "answers.md", "search": "the hiring manager asks what you would do in your first 90 days. what structure works when you do not yet know the systems? the structure that works when you do not know the systems: learn, prove, change - 30 days each, with the explicit statement that the plan is a hypothesis you expect to revise. - days 1-30, learn: read the incident history and the on-call rotation before the code; get on-call shadow if possible; map the top five services, their owners and their slos; find out where the money goes. ship something small on day one so the deployment path is in your hands. - days 31-60, prove: take one real, visible problem with a measurable outcome - a p99, a cost line, a flaky pipeline - and fix it end to end. credibility at principal level is bought with a delivered thing, not with a document. - days 61-90, change: propose one structural change with the evidence gathered in the first sixty days, and get it agreed rather than announced. the sentence that makes this land: \"i would want to be careful about proposing an architecture in the first month - i have seen people do that and spend a year paying for it.\""}, {"n": 23, "category": 2, "difficulty": "T", "html": "&quot;Are you still hands-on?&quot; at 19 years of experience. What proves it, and which claims actively hurt you?", "answerTitle": "\"Are you hands-on?\"", "answer": "<p>Proof is specific and recent. Claims are worthless here because everyone says yes.<\/p><p><strong>Proves it:<\/strong> &quot;I wrote the retry-budget filter that is in our platform starter&quot;; &quot;I was on the pager last month and here is what I did at 2am&quot;; a debugging story with the actual tool named and the actual finding; an opinion about a language feature that only someone who has fought it would hold.<\/p><p><strong>Fails:<\/strong> &quot;I stay hands-on through code reviews&quot; (that is oversight, not hands-on), &quot;I do proofs of concept&quot; with no example, or naming a technology you last wrote in 2019.<\/p><p><strong>The honest calibration<\/strong> is better than an overclaim: &quot;I write code most weeks, but I am not the fastest person on the team at it any more - what I am is the person who can read the whole system. If the role needs the top-throughput coder, I am not that.&quot; At principal level that answer scores; a bluff that collapses in the coding round does not.<\/p>", "source": "answers.md", "search": "\"are you still hands-on?\" at 19 years of experience. what proves it, and which claims actively hurt you? proof is specific and recent. claims are worthless here because everyone says yes. proves it: \"i wrote the retry-budget filter that is in our platform starter\"; \"i was on the pager last month and here is what i did at 2am\"; a debugging story with the actual tool named and the actual finding; an opinion about a language feature that only someone who has fought it would hold. fails: \"i stay hands-on through code reviews\" (that is oversight, not hands-on), \"i do proofs of concept\" with no example, or naming a technology you last wrote in 2019. the honest calibration is better than an overclaim: \"i write code most weeks, but i am not the fastest person on the team at it any more - what i am is the person who can read the whole system. if the role needs the top-throughput coder, i am not that.\" at principal level that answer scores; a bluff that collapses in the coding round does not."}, {"n": 24, "category": 2, "difficulty": "D", "html": "The recruiter screen includes three light technical questions. What is that segment really testing?", "answerTitle": "What the recruiter's technical questions are testing", "answer": "<p>Not depth. They are testing <strong>whether the resume is yours<\/strong>, and calibrating the level so they route you to the right loop.<\/p><p>A recruiter with a crib sheet asks &quot;what is dependency injection&quot; or &quot;what is the difference between SQS and Kinesis&quot;. The scoring is binary: fluent and unbothered, or hesitant. So answer <strong>short and plainly<\/strong>, without jargon, and stop. Over-answering a screening question is a small negative signal - it reads as not knowing what the question was for.<\/p><p><strong>One thing worth doing:<\/strong> ask what the technical loop consists of. Recruiters answer this honestly and it is the single most useful piece of information you can get in the screen.<\/p>", "source": "answers.md", "search": "the recruiter screen includes three light technical questions. what is that segment really testing? not depth. they are testing whether the resume is yours , and calibrating the level so they route you to the right loop. a recruiter with a crib sheet asks \"what is dependency injection\" or \"what is the difference between sqs and kinesis\". the scoring is binary: fluent and unbothered, or hesitant. so answer short and plainly , without jargon, and stop. over-answering a screening question is a small negative signal - it reads as not knowing what the question was for. one thing worth doing: ask what the technical loop consists of. recruiters answer this honestly and it is the single most useful piece of information you can get in the screen."}, {"n": 25, "category": 2, "difficulty": "D", "html": "How do you establish the real scope of the role before you invest four hours in a loop?", "answerTitle": "Establishing the real scope before you commit", "answer": "<p>Four questions, all askable in a screen without arrogance:<\/p><ul><li>&quot;Is this a new role or a backfill? If a backfill, what did that person do?&quot;<\/li><li>&quot;Who makes the architecture decisions today, and what would change if I joined?&quot;<\/li><li>&quot;How many teams would this role touch, and do I have any formal authority over them?&quot;<\/li><li>&quot;What is the first problem you would want this person on?&quot;<\/li><\/ul><p>The last one is the highest-yield question in the entire screen. The answer is either a <strong>class of problem<\/strong> (&quot;our services do not have a coherent story for data consistency&quot;) which indicates real scope, or a <strong>task<\/strong> (&quot;we need someone to finish the migration&quot;) which indicates a senior role with a principal title (Q26).<\/p>", "source": "answers.md", "search": "how do you establish the real scope of the role before you invest four hours in a loop? four questions, all askable in a screen without arrogance: - \"is this a new role or a backfill? if a backfill, what did that person do?\" - \"who makes the architecture decisions today, and what would change if i joined?\" - \"how many teams would this role touch, and do i have any formal authority over them?\" - \"what is the first problem you would want this person on?\" the last one is the highest-yield question in the entire screen. the answer is either a class of problem (\"our services do not have a coherent story for data consistency\") which indicates real scope, or a task (\"we need someone to finish the migration\") which indicates a senior role with a principal title (q26)."}, {"n": 26, "category": 2, "difficulty": "T", "html": "The title says Principal Engineer but the job description reads like a senior contractor role. How do you probe that in the screen without insulting anyone?", "answerTitle": "Principal title, senior contractor job description", "answer": "<p>Probe by <strong>asking about the decisions, not the title.<\/strong> Titles are cheap; decision rights are not.<\/p><blockquote><p>&quot;What would this person be expected to decide on their own, and what would they take to someone else? And can you give me an example from the last quarter where someone at this level changed the direction of something?&quot;<\/p><\/blockquote><p>If they cannot produce an example, the role is execution-shaped. That is legitimate information, not a reason to be rude - and it is better learned now than in week three.<\/p><p><strong>How to keep it inoffensive:<\/strong> attribute the ambiguity to the industry rather than to them. &quot;Principal means five different things across companies I have talked to, so I have started asking about decisions instead.&quot;<\/p><p><strong>Do not<\/strong> conclude the role is beneath you and disengage. Sometimes the JD is old, or written by HR, and the manager is describing something much bigger.<\/p>", "source": "answers.md", "search": "the title says principal engineer but the job description reads like a senior contractor role. how do you probe that in the screen without insulting anyone? probe by asking about the decisions, not the title. titles are cheap; decision rights are not. \"what would this person be expected to decide on their own, and what would they take to someone else? and can you give me an example from the last quarter where someone at this level changed the direction of something?\" if they cannot produce an example, the role is execution-shaped. that is legitimate information, not a reason to be rude - and it is better learned now than in week three. how to keep it inoffensive: attribute the ambiguity to the industry rather than to them. \"principal means five different things across companies i have talked to, so i have started asking about decisions instead.\" do not conclude the role is beneath you and disengage. sometimes the jd is old, or written by hr, and the manager is describing something much bigger."}, {"n": 27, "category": 2, "difficulty": "A", "html": "The hiring manager says the team is &quot;moving from a monolith to microservices&quot;. Turn that one sentence into five questions that change your whole approach to the loop.", "answerTitle": "\"Moving from a monolith to microservices\" - five questions", "answer": "<p>That sentence tells you almost nothing, and the answers change how you run the entire loop.<\/p><ul><li><strong>&quot;What is the business outcome you are buying with this?&quot;<\/strong> Deployment independence, team autonomy, scaling one hot path, or a compliance boundary? If the answer is &quot;it is the modern architecture&quot;, you have learned that your job would be partly to slow this down (Q59), and you should test that appetite now.<\/li><li><strong>&quot;How far in are you, and what has gone wrong so far?&quot;<\/strong> &quot;We are 18 months in with four services and a shared database&quot; is a completely different role from &quot;we start next quarter&quot;.<\/li><li><strong>&quot;Is the database split, and if not, what is the plan?&quot;<\/strong> This one question separates teams who understand the problem from teams who have moved code around. See <code>../03-microservices<\/code> Categories 4-5.<\/li><li><strong>&quot;Who owns the services after the split - are the teams reorganizing too?&quot;<\/strong> Conway&#x27;s law question. If the org is not changing, the services will not stay independent.<\/li><li><strong>&quot;What is your deployment frequency and change failure rate today?&quot;<\/strong> If they cannot deploy the monolith safely, microservices will multiply that problem, and saying so carefully is a strong signal (<code>../07-devops<\/code>).<\/li><\/ul><p><strong>What you do with the answers:<\/strong> they tell you which pack the loop will actually test, and whether the design round is likely to be a decomposition exercise (Q58).<\/p>", "source": "answers.md", "search": "the hiring manager says the team is \"moving from a monolith to microservices\". turn that one sentence into five questions that change your whole approach to the loop. that sentence tells you almost nothing, and the answers change how you run the entire loop. - \"what is the business outcome you are buying with this?\" deployment independence, team autonomy, scaling one hot path, or a compliance boundary? if the answer is \"it is the modern architecture\", you have learned that your job would be partly to slow this down (q59), and you should test that appetite now. - \"how far in are you, and what has gone wrong so far?\" \"we are 18 months in with four services and a shared database\" is a completely different role from \"we start next quarter\". - \"is the database split, and if not, what is the plan?\" this one question separates teams who understand the problem from teams who have moved code around. see ../03-microservices categories 4-5. - \"who owns the services after the split - are the teams reorganizing too?\" conway's law question. if the org is not changing, the services will not stay independent. - \"what is your deployment frequency and change failure rate today?\" if they cannot deploy the monolith safely, microservices will multiply that problem, and saying so carefully is a strong signal (../07-devops). what you do with the answers: they tell you which pack the loop will actually test, and whether the design round is likely to be a decomposition exercise (q58)."}, {"n": 28, "category": 2, "difficulty": "A", "html": "Position the same 19-year history for three different roles: platform principal, solution architect, and AI engineering lead.", "answerTitle": "Positioning the same history three ways", "answer": "<p>Same facts, different <strong>spine<\/strong>. Do not invent anything; change what the arc is <em>about<\/em>.<\/p><table><thead><tr><th>Role<\/th><th>The spine<\/th><th>Lead artifact<\/th><th>What you downplay<\/th><\/tr><\/thead><tbody><tr><td><strong>Platform principal<\/strong><\/td><td>Nineteen years of building the same patterns twice, now spent on making other teams faster<\/td><td>The standard, starter or library other teams adopted; the incident class you eliminated<\/td><td>Individual feature delivery<\/td><\/tr><tr><td><strong>Solution architect<\/strong><\/td><td>Telecom scale into cloud economics - designs that survive contact with cost and compliance<\/td><td>An end-to-end architecture with the scale numbers and the cost model; the migration you owned<\/td><td>Deep language internals<\/td><\/tr><tr><td><strong>AI engineering lead<\/strong><\/td><td>An engineer who brought production discipline to AI, rather than a researcher<\/td><td>The AI feature with cost, evaluation and guardrails, and the thing you refused to build (<code>../10-ai-agents<\/code> Q3)<\/td><td>Long pre-2016 history<\/td><\/tr><\/tbody><\/table><p><strong>The rules:<\/strong> the 90-second intro (Q15) changes; the resume does not. Your weakest framing is the one where the last five years are not the centre of the story. And in every version, the .NET chapter is compressed to one clause - it buys the comparative point (Q20) and nothing else.<\/p>", "source": "answers.md", "search": "position the same 19-year history for three different roles: platform principal, solution architect, and ai engineering lead. same facts, different spine . do not invent anything; change what the arc is about . role the spine lead artifact what you downplay --- --- --- --- platform principal nineteen years of building the same patterns twice, now spent on making other teams faster the standard, starter or library other teams adopted; the incident class you eliminated individual feature delivery solution architect telecom scale into cloud economics - designs that survive contact with cost and compliance an end-to-end architecture with the scale numbers and the cost model; the migration you owned deep language internals ai engineering lead an engineer who brought production discipline to ai, rather than a researcher the ai feature with cost, evaluation and guardrails, and the thing you refused to build (../10-ai-agents q3) long pre-2016 history the rules: the 90-second intro (q15) changes; the resume does not. your weakest framing is the one where the last five years are not the centre of the story. and in every version, the .net chapter is compressed to one clause - it buys the comparative point (q20) and nothing else."}, {"n": 29, "category": 3, "difficulty": "C", "html": "The round opens with &quot;tell me about <code>HashMap<\/code>&quot;. How do you turn a shallow prompt into principal-level evidence in 90 seconds without lecturing?", "answerTitle": "\"Tell me about HashMap\"", "answer": "<p>A shallow prompt is an <strong>invitation to choose your own depth<\/strong>. The move is to answer the literal question in two sentences, then explicitly offer the level below - and let them pick.<\/p><blockquote><p>&quot;It is an array of buckets with a hash-and-mask index, chaining on collision, and since Java 8 a bucket converts to a red-black tree past eight entries with the table at least 64, so a degenerate hash degrades to log n rather than n. The parts that actually bite in production are the resize behaviour and what happens when a key&#x27;s <code>hashCode<\/code> and <code>equals<\/code> are inconsistent or mutable. Where would you like me to go - the concurrency story, the memory footprint, or a bug I have actually had with it?&quot;<\/p><\/blockquote><p><strong>Why this scores:<\/strong> it demonstrates depth without a lecture, it hands them the steering wheel (which reads as collaborative), and the phrase &quot;a bug I have actually had&quot; invites the production-judgement thread you want (Q7).<\/p><p><strong>Red flags:<\/strong> reciting the default capacity and load factor as the substance of the answer, or talking for four minutes without pausing.<\/p><p><strong>Depth:<\/strong> <code>../01-java<\/code> Categories 1-2.<\/p>", "source": "answers.md", "search": "the round opens with \"tell me about hashmap\". how do you turn a shallow prompt into principal-level evidence in 90 seconds without lecturing? a shallow prompt is an invitation to choose your own depth . the move is to answer the literal question in two sentences, then explicitly offer the level below - and let them pick. \"it is an array of buckets with a hash-and-mask index, chaining on collision, and since java 8 a bucket converts to a red-black tree past eight entries with the table at least 64, so a degenerate hash degrades to log n rather than n. the parts that actually bite in production are the resize behaviour and what happens when a key's hashcode and equals are inconsistent or mutable. where would you like me to go - the concurrency story, the memory footprint, or a bug i have actually had with it?\" why this scores: it demonstrates depth without a lecture, it hands them the steering wheel (which reads as collaborative), and the phrase \"a bug i have actually had\" invites the production-judgement thread you want (q7). red flags: reciting the default capacity and load factor as the substance of the answer, or talking for four minutes without pausing. depth: ../01-java categories 1-2."}, {"n": 30, "category": 3, "difficulty": "D", "html": "The interviewer asks &quot;why?&quot; three times in a row about <code>@Transactional<\/code>. Map the three levels you must have ready before the round starts.", "answerTitle": "Three levels of \"why\" on `@Transactional`", "answer": "<p>Have the ladder rehearsed as three distinct plateaus, because the interviewer is testing whether your knowledge bottoms out.<\/p><ol><li><strong>What:<\/strong> it is declarative transaction demarcation - Spring starts a transaction before the method and commits or rolls back after, based on the propagation and rollback rules.<\/li><li><strong>How:<\/strong> it is an AOP proxy. Spring wraps the bean; the proxy opens the transaction and binds the connection to the thread through <code>TransactionSynchronizationManager<\/code>. <strong>Therefore self-invocation bypasses it entirely<\/strong>, and <code>private<\/code> methods are never advised.<\/li><li><strong>Why that design, and what it costs:<\/strong> proxying keeps the transaction concern out of the code, but it makes the boundary invisible at the call site, which is why the self-invocation bug is so common and so hard to see in review. The alternatives are weaving at compile time (surprising in a different way) or programmatic <code>TransactionTemplate<\/code> (explicit, verbose, and what I use when the boundary is subtle).<\/li><li><strong>The fourth level, if they keep going:<\/strong> rollback only on unchecked exceptions by default; <code>readOnly<\/code> is a hint whose effect depends on the JPA provider and driver; the transaction ends at commit but the connection may not be returned when you think it is; and combining it with <code>@Async<\/code> or a reactive stack moves the whole thread-binding assumption out from under you.<\/li><\/ol><p><strong>The tell that you are ready:<\/strong> each level should be sayable without needing the previous one as a run-up.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> transactions category.<\/p>", "source": "answers.md", "search": "the interviewer asks \"why?\" three times
