 in a row about @transactional. map the three levels you must have ready before the round starts. have the ladder rehearsed as three distinct plateaus, because the interviewer is testing whether your knowledge bottoms out. 1. what: it is declarative transaction demarcation - spring starts a transaction before the method and commits or rolls back after, based on the propagation and rollback rules. 2. how: it is an aop proxy. spring wraps the bean; the proxy opens the transaction and binds the connection to the thread through transactionsynchronizationmanager. therefore self-invocation bypasses it entirely , and private methods are never advised. 3. why that design, and what it costs: proxying keeps the transaction concern out of the code, but it makes the boundary invisible at the call site, which is why the self-invocation bug is so common and so hard to see in review. the alternatives are weaving at compile time (surprising in a different way) or programmatic transactiontemplate (explicit, verbose, and what i use when the boundary is subtle). 4. the fourth level, if they keep going: rollback only on unchecked exceptions by default; readonly is a hint whose effect depends on the jpa provider and driver; the transaction ends at commit but the connection may not be returned when you think it is; and combining it with @async or a reactive stack moves the whole thread-binding assumption out from under you. the tell that you are ready: each level should be sayable without needing the previous one as a run-up. depth: ../02-spring transactions category."}, {"n": 31, "category": 3, "difficulty": "T", "html": "You are asked about a Java feature you have read about but never used in production. What answer scores, and what answer fails?", "answerTitle": "Asked about something you have not used in production", "answer": "<p><strong>What scores:<\/strong> name the boundary, then demonstrate that you understand the mechanism and what you would check before adopting it.<\/p><blockquote><p>&quot;I have not run that in production, so I will separate what I know from what I would verify. The mechanism is <em>[X]<\/em>. What I would want to know before using it is <em>[the two things that would actually decide it]<\/em>, and I would find that out by <em>[a specific test]<\/em>.&quot;<\/p><\/blockquote><p>That answer is often scored <em>higher<\/em> than a thin claim of experience, because it demonstrates calibration - which is exactly what a principal is trusted for.<\/p><p><strong>What fails:<\/strong> bluffing. The interviewer asks about it precisely because they have used it, and the follow-up will be about a sharp edge you cannot know about. The recovery from a caught bluff costs more than the honest answer ever would (Q195).<\/p><p><strong>The one thing not to do:<\/strong> apologize repeatedly. State the boundary once, then be useful.<\/p>", "source": "answers.md", "search": "you are asked about a java feature you have read about but never used in production. what answer scores, and what answer fails? what scores: name the boundary, then demonstrate that you understand the mechanism and what you would check before adopting it. \"i have not run that in production, so i will separate what i know from what i would verify. the mechanism is [x] . what i would want to know before using it is [the two things that would actually decide it] , and i would find that out by [a specific test] .\" that answer is often scored higher than a thin claim of experience, because it demonstrates calibration - which is exactly what a principal is trusted for. what fails: bluffing. the interviewer asks about it precisely because they have used it, and the follow-up will be about a sharp edge you cannot know about. the recovery from a caught bluff costs more than the honest answer ever would (q195). the one thing not to do: apologize repeatedly. state the boundary once, then be useful."}, {"n": 32, "category": 3, "difficulty": "D", "html": "&quot;How would you find a memory leak in a running service?&quot; What does the interviewer want to hear in the first sentence?", "answerTitle": "\"How would you find a memory leak in a running service?\"", "answer": "<p>The first sentence must be <strong>evidence before hypothesis<\/strong>. Interviewers are listening for whether you jump to a cause.<\/p><blockquote><p>&quot;First I would establish that it is a leak rather than a workload change or a cache doing its job - is heap after full GC trending up over days, and did anything deploy? Then I would take a heap histogram, and only if that is inconclusive a full heap dump on a canary instance, because a dump on a production node with a large heap can pause it long enough to matter.&quot;<\/p><\/blockquote><p>Then the ladder: dominator tree, not the biggest object list. Classloader leaks look different from object leaks. Off-heap and native memory are a separate hunt (direct buffers, <code>Metaspace<\/code>, a native library) and the JVM&#x27;s heap metrics will not show them. Thread-local retention behind a pooled executor is the classic Java-web version.<\/p><p><strong>The production-judgement markers<\/strong> the interviewer is waiting for: doing this on a canary, the cost of the dump, having the artifact retained for later, and knowing that the fix might be a bound rather than a cure.<\/p><p><strong>Depth:<\/strong> <code>../01-java<\/code> JVM category.<\/p>", "source": "answers.md", "search": "\"how would you find a memory leak in a running service?\" what does the interviewer want to hear in the first sentence? the first sentence must be evidence before hypothesis . interviewers are listening for whether you jump to a cause. \"first i would establish that it is a leak rather than a workload change or a cache doing its job - is heap after full gc trending up over days, and did anything deploy? then i would take a heap histogram, and only if that is inconclusive a full heap dump on a canary instance, because a dump on a production node with a large heap can pause it long enough to matter.\" then the ladder: dominator tree, not the biggest object list. classloader leaks look different from object leaks. off-heap and native memory are a separate hunt (direct buffers, metaspace, a native library) and the jvm's heap metrics will not show them. thread-local retention behind a pooled executor is the classic java-web version. the production-judgement markers the interviewer is waiting for: doing this on a canary, the cost of the dump, having the artifact retained for later, and knowing that the fix might be a bound rather than a cure. depth: ../01-java jvm category."}, {"n": 33, "category": 3, "difficulty": "D", "html": "Concurrency questions at this level are rarely about <code>synchronized<\/code>. What are they actually about, and how do you steer toward it?", "answerTitle": "What concurrency questions are actually about", "answer": "<p>Not <code>synchronized<\/code>. At this level they are about <strong>the memory model and the failure modes you cannot test for<\/strong>: visibility versus atomicity, happens-before, why a race passes a thousand test runs and fails in production, and what you do structurally so the question stops arising.<\/p><p>Steer there deliberately. When asked &quot;what does <code>volatile<\/code> do&quot;, answer it in one sentence and then move up: &quot;the more useful version of that question is how I decide between <code>volatile<\/code>, an <code>Atomic<\/code>, a lock and just not sharing the state - and my default is the last one, because the cheapest concurrency bug is the one that is structurally impossible.&quot;<\/p><p>Then have ready: thread-pool sizing tied to whether the work is CPU- or IO-bound, what virtual threads change about that calculation (Q35), and one real story - a deadlock, a lost update, or a <code>ConcurrentModificationException<\/code> that only happened under load.<\/p><p><strong>Depth:<\/strong> <code>../01-java<\/code> concurrency category.<\/p>", "source": "answers.md", "search": "concurrency questions at this level are rarely about synchronized. what are they actually about, and how do you steer toward it? not synchronized. at this level they are about the memory model and the failure modes you cannot test for : visibility versus atomicity, happens-before, why a race passes a thousand test runs and fails in production, and what you do structurally so the question stops arising. steer there deliberately. when asked \"what does volatile do\", answer it in one sentence and then move up: \"the more useful version of that question is how i decide between volatile, an atomic, a lock and just not sharing the state - and my default is the last one, because the cheapest concurrency bug is the one that is structurally impossible.\" then have ready: thread-pool sizing tied to whether the work is cpu- or io-bound, what virtual threads change about that calculation (q35), and one real story - a deadlock, a lost update, or a concurrentmodificationexception that only happened under load. depth: ../01-java concurrency category."}, {"n": 34, "category": 3, "difficulty": "T", "html": "The interviewer states something about the Java memory model that is wrong. Play out the next 60 seconds.", "answerTitle": "The interviewer says something wrong about the memory model", "answer": "<p>The goal is to be right <strong>without making them wrong in public<\/strong>. Frame it as a question or as your own uncertainty, and let the mechanism do the work.<\/p><blockquote><p>&quot;That might be a difference in how we are using the term - my understanding is that <code>volatile<\/code> gives visibility and ordering but not compound atomicity, so a <code>volatile<\/code> counter increment can still lose updates. Is there a case you have seen where it holds?&quot;<\/p><\/blockquote><p>Three properties of that response: it is not a contradiction, it states the mechanism precisely enough that a knowledgeable interviewer immediately sees who is right, and it gives them a graceful exit.<\/p><p>If they insist and it is material, <strong>let it go<\/strong> and move on: &quot;Fair enough, I would want to check that.&quot; Winning the point is worth nothing; the note that says &quot;corrected me three times&quot; is worth a lot, negatively. If it is a deliberate test - and it often is - the calm, precise, non-combative version is exactly what they wanted to see (Q194).<\/p>", "source": "answers.md", "search": "the interviewer states something about the java memory model that is wrong. play out the next 60 seconds. the goal is to be right without making them wrong in public . frame it as a question or as your own uncertainty, and let the mechanism do the work. \"that might be a difference in how we are using the term - my understanding is that volatile gives visibility and ordering but not compound atomicity, so a volatile counter increment can still lose updates. is there a case you have seen where it holds?\" three properties of that response: it is not a contradiction, it states the mechanism precisely enough that a knowledgeable interviewer immediately sees who is right, and it gives them a graceful exit. if they insist and it is material, let it go and move on: \"fair enough, i would want to check that.\" winning the point is worth nothing; the note that says \"corrected me three times\" is worth a lot, negatively. if it is a deliberate test - and it often is - the calm, precise, non-combative version is exactly what they wanted to see (q194)."}, {"n": 35, "category": 3, "difficulty": "D", "html": "&quot;Virtual threads - would you use them?&quot; How do you avoid both the hype answer and the dismissive answer?", "answerTitle": "\"Virtual threads - would you use them?\"", "answer": "<p>Avoid both failure modes by answering with <strong>the shape of the workload<\/strong>, not an opinion about the feature.<\/p><blockquote><p>&quot;For a service that is mostly blocking IO with a thread-per-request model, yes - that is precisely what they are for, and the win is that you stop sizing a pool against downstream latency. For CPU-bound work they change nothing; the parallelism is still your core count. And there are two things I would check before switching: pinning on <code>synchronized<\/code> blocks holding a monitor across a blocking call, and any code that relies on thread-locals or on the pool as an implicit concurrency limit - because removing that limit can turn a well-behaved service into a load generator against a downstream that has not changed.&quot;<\/p><\/blockquote><p>That last clause is the principal-level part: <strong>removing a bottleneck relocates it<\/strong>. Finish with what you would need in place first - a bulkhead or semaphore where the pool used to be the limiter.<\/p><p><strong>Depth:<\/strong> <code>../01-java<\/code> concurrency and Java 21 material.<\/p>", "source": "answers.md", "search": "\"virtual threads - would you use them?\" how do you avoid both the hype answer and the dismissive answer? avoid both failure modes by answering with the shape of the workload , not an opinion about the feature. \"for a service that is mostly blocking io with a thread-per-request model, yes - that is precisely what they are for, and the win is that you stop sizing a pool against downstream latency. for cpu-bound work they change nothing; the parallelism is still your core count. and there are two things i would check before switching: pinning on synchronized blocks holding a monitor across a blocking call, and any code that relies on thread-locals or on the pool as an implicit concurrency limit - because removing that limit can turn a well-behaved service into a load generator against a downstream that has not changed.\" that last clause is the principal-level part: removing a bottleneck relocates it . finish with what you would need in place first - a bulkhead or semaphore where the pool used to be the limiter. depth: ../01-java concurrency and java 21 material."}, {"n": 36, "category": 3, "difficulty": "D", "html": "Which three Spring mechanisms must you be able to draw from memory, and what does failing to draw them signal?", "answerTitle": "Three Spring mechanisms to draw from memory", "answer": "<ul><li><strong>The bean lifecycle<\/strong>, including where <code>BeanPostProcessor<\/code> sits and therefore where proxies get created - because that is the answer to half the &quot;why doesn&#x27;t my annotation work&quot; questions.<\/li><li><strong>The security filter chain<\/strong>, in order, with <code>SecurityContextHolder<\/code> and where authentication is actually established (Q38).<\/li><li><strong>The MVC request path<\/strong>: <code>DispatcherServlet<\/code> to handler mapping to handler adapter to argument resolvers to the return-value handler and message converters - because exception handling, content negotiation and validation all hang off specific points on it.<\/li><\/ul><p><strong>What failing to draw them signals:<\/strong> that you use Spring as a set of annotations. At principal level, the expectation is that you can debug it when it misbehaves, and the debugging is always about which of these three ran, in what order, and what it wrapped.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> Categories 1-4.<\/p>", "source": "answers.md", "search": "which three spring mechanisms must you be able to draw from memory, and what does failing to draw them signal? - the bean lifecycle , including where beanpostprocessor sits and therefore where proxies get created - because that is the answer to half the \"why doesn't my annotation work\" questions. - the security filter chain , in order, with securitycontextholder and where authentication is actually established (q38). - the mvc request path : dispatcherservlet to handler mapping to handler adapter to argument resolvers to the return-value handler and message converters - because exception handling, content negotiation and validation all hang off specific points on it. what failing to draw them signals: that you use spring as a set of annotations. at principal level, the expectation is that you can debug it when it misbehaves, and the debugging is always about which of these three ran, in what order, and what it wrapped. depth: ../02-spring categories 1-4."}, {"n": 37, "category": 3, "difficulty": "D", "html": "&quot;Why Spring Boot rather than plain Spring?&quot; Give the answer everyone gives, then the one that scores.", "answerTitle": "\"Why Spring Boot rather than plain Spring?\"", "answer": "<p><strong>The answer everyone gives:<\/strong> auto-configuration, embedded server, starters, less XML. True, unremarkable, and scored as a memorized list.<\/p><p><strong>The answer that scores:<\/strong> Boot&#x27;s real product is <strong>opinionated defaults with a documented escape hatch<\/strong>, and the value is organizational rather than technical.<\/p><blockquote><p>&quot;The technical content is auto-configuration and starters. But the reason I would choose it is that it makes the boring decisions identically across forty teams, so a service is legible to someone who has never seen it - the same actuator endpoints, the same config precedence, the same metrics. That is a platform property, not a framework feature. The cost is that when a default is wrong for you, you are debugging a conditional configuration you did not write, so I want the team to know how to read <code>--debug<\/code> auto-configuration output before they need it.&quot;<\/p><\/blockquote><p>Then the trade-off you would name unprompted: Boot&#x27;s defaults assume a fairly standard web service, and the further you are from that - unusual startup ordering, a non-standard transaction manager, native images - the more the defaults cost you.<\/p>", "source": "answers.md", "search": "\"why spring boot rather than plain spring?\" give the answer everyone gives, then the one that scores. the answer everyone gives: auto-configuration, embedded server, starters, less xml. true, unremarkable, and scored as a memorized list. the answer that scores: boot's real product is opinionated defaults with a documented escape hatch , and the value is organizational rather than technical. \"the technical content is auto-configuration and starters. but the reason i would choose it is that it makes the boring decisions identically across forty teams, so a service is legible to someone who has never seen it - the same actuator endpoints, the same config precedence, the same metrics. that is a platform property, not a framework feature. the cost is that when a default is wrong for you, you are debugging a conditional configuration you did not write, so i want the team to know how to read --debug auto-configuration output before they need it.\" then the trade-off you would name unprompted: boot's defaults assume a fairly standard web service, and the further you are from that - unusual startup ordering, a non-standard transaction manager, native images - the more the defaults cost you."}, {"n": 38, "category": 3, "difficulty": "T", "html": "You are asked to walk the Spring Security filter chain and you blank on the filter order. Recover in a way that costs you nothing.", "answerTitle": "You blank on the filter order", "answer": "<p>Do not stall or guess a list. <strong>Convert it from recall to reasoning<\/strong>, out loud.<\/p><blockquote><p>&quot;I do not want to recite an order I might get wrong, so let me derive it. Whatever restores the context has to come before anything that reads it, so context persistence is early. Anything that establishes authentication comes before authorization, so the authentication filters sit in the middle. The authorization filter is effectively last because it needs the fully populated context. Exception translation has to wrap the authentication filters to turn their exceptions into a challenge, so it sits outside them. That gives me: context, then exception translation, then authentication, then authorization - and CSRF early because it should reject before anything expensive.&quot;<\/p><\/blockquote><p><strong>Why this scores better than the memorized list:<\/strong> it demonstrates that you understand <em>why<\/em> the order is what it is, which is the thing that transfers when you have to insert a custom filter. Naming that you are deriving rather than recalling is honest and costs nothing.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> Spring Security category; <code>../11-security<\/code> Categories 2-4.<\/p>", "source": "answers.md", "search": "you are asked to walk the spring security filter chain and you blank on the filter order. recover in a way that costs you nothing. do not stall or guess a list. convert it from recall to reasoning , out loud. \"i do not want to recite an order i might get wrong, so let me derive it. whatever restores the context has to come before anything that reads it, so context persistence is early. anything that establishes authentication comes before authorization, so the authentication filters sit in the middle. the authorization filter is effectively last because it needs the fully populated context. exception translation has to wrap the authentication filters to turn their exceptions into a challenge, so it sits outside them. that gives me: context, then exception translation, then authentication, then authorization - and csrf early because it should reject before anything expensive.\" why this scores better than the memorized list: it demonstrates that you understand why the order is what it is, which is the thing that transfers when you have to insert a custom filter. naming that you are deriving rather than recalling is honest and costs nothing. depth: ../02-spring spring security category; ../11-security categories 2-4."}, {"n": 39, "category": 3, "difficulty": "D", "html": "A code-reading question: 30 lines with a subtle bug. What is your reading order and what do you say while reading?", "answerTitle": "Reading 30 lines with a subtle bug", "answer": "<p>Reading order, said out loud as you go:<\/p><ol><li><strong>What is it supposed to do?<\/strong> State the intent in one sentence before criticizing anything. If you cannot, ask.<\/li><li><strong>The signature and the lifecycle.<\/strong> Is this a Spring bean? A singleton? Is any of this state shared across threads? Most subtle bugs in a 30-line Java class are here.<\/li><li><strong>Mutable state, then the boundaries<\/strong> - fields, collections handed in or returned, anything <code>static<\/code>.<\/li><li><strong>Error and edge paths<\/strong> - what happens on an exception halfway through, on empty, on null, on a duplicate.<\/li><li><strong>Only then style.<\/strong><\/li><\/ol><p>Narrating this order is worth as much as finding the bug: it shows a repeatable method rather than a lucky spot. If you find the bug in the first ten seconds, still say the method - &quot;I think I see it, but let me read properly so I do not miss a second one&quot; - because the round is scoring your review process (Q167).<\/p>", "source": "answers.md", "search": "a code-reading question: 30 lines with a subtle bug. what is your reading order and what do you say while reading? reading order, said out loud as you go: 1. what is it supposed to do? state the intent in one sentence before criticizing anything. if you cannot, ask. 2. the signature and the lifecycle. is this a spring bean? a singleton? is any of this state shared across threads? most subtle bugs in a 30-line java class are here. 3. mutable state, then the boundaries - fields, collections handed in or returned, anything static. 4. error and edge paths - what happens on an exception halfway through, on empty, on null, on a duplicate. 5. only then style. narrating this order is worth as much as finding the bug: it shows a repeatable method rather than a lucky spot. if you find the bug in the first ten seconds, still say the method - \"i think i see it, but let me read properly so i do not miss a second one\" - because the round is scoring your review process (q167)."}, {"n": 40, "category": 3, "difficulty": "D", "html": "&quot;How would you test that?&quot; is appended to every one of your answers. What is being probed, and what makes the third repetition easier than the first?", "answerTitle": "\"How would you test that?\" after every answer", "answer": "<p>It is probing three things at once: whether you actually build the things you describe, whether you know what is hard to test about them, and whether you distinguish <strong>what you would test<\/strong> from <strong>what you would monitor<\/strong>.<\/p><p>The strongest form of the answer names the boundary: &quot;I would unit test the decision logic with a fake clock, contract test the boundary so the other team&#x27;s change breaks my build, and for the concurrency behaviour I would not write a test at all - I would make the state unshared, because a test that passes a thousand times proves nothing there.&quot;<\/p><p><strong>Why the third repetition is easier:<\/strong> by then you should be pre-empting it. Append the testing sentence to your answers before being asked, and the interviewer marks it as a habit rather than a response. That is a cheap, visible upgrade in a deep-dive round.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> testing category; <code>../07-devops<\/code> Category 2.<\/p>", "source": "answers.md", "search": "\"how would you test that?\" is appended to every one of your answers. what is being probed, and what makes the third repetition easier than the first? it is probing three things at once: whether you actually build the things you describe, whether you know what is hard to test about them, and whether you distinguish what you would test from what you would monitor . the strongest form of the answer names the boundary: \"i would unit test the decision logic with a fake clock, contract test the boundary so the other team's change breaks my build, and for the concurrency behaviour i would not write a test at all - i would make the state unshared, because a test that passes a thousand times proves nothing there.\" why the third repetition is easier: by then you should be pre-empting it. append the testing sentence to your answers before being asked, and the interviewer marks it as a habit rather than a response. that is a cheap, visible upgrade in a deep-dive round. depth: ../02-spring testing category; ../07-devops category 2."}, {"n": 41, "category": 3, "difficulty": "D", "html": "JPA and N+1: how do you answer so it is a production story rather than a textbook definition?", "answerTitle": "N+1 as a production story", "answer": "<p>The definition takes ten seconds and scores nothing. Make it an incident.<\/p><blockquote><p>&quot;N+1 is one query for the parents and then one per child collection because the association is lazy and something touched it in a loop. The version worth talking about is how it got to production: it does not show up in tests with three rows, and it does not show up in the code, because the trigger is a getter in a serializer. We found it as a p99 that scaled with page size. The fix was a fetch join for that path plus an entity graph, but the durable fix was the one that stopped it recurring - we added a per-request query counter that fails the build in the integration tests above a threshold, and logs a warning in production.&quot;<\/p><\/blockquote><p><strong>The structure is deliberate:<\/strong> mechanism, why it escapes review, how it was detected, the fix, then <strong>the change that removed the class of bug<\/strong>. That last clause is the principal-level marker from Q5, and it converts a textbook topic into leveling evidence.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> Spring Data category; <code>../06-database<\/code> Category 4.<\/p>", "source": "answers.md", "search": "jpa and n+1: how do you answer so it is a production story rather than a textbook definition? the definition takes ten seconds and scores nothing. make it an incident. \"n+1 is one query for the parents and then one per child collection because the association is lazy and something touched it in a loop. the version worth talking about is how it got to production: it does not show up in tests with three rows, and it does not show up in the code, because the trigger is a getter in a serializer. we found it as a p99 that scaled with page size. the fix was a fetch join for that path plus an entity graph, but the durable fix was the one that stopped it recurring - we added a per-request query counter that fails the build in the integration tests above a threshold, and logs a warning in production.\" the structure is deliberate: mechanism, why it escapes review, how it was detected, the fix, then the change that removed the class of bug . that last clause is the principal-level marker from q5, and it converts a textbook topic into leveling evidence. depth: ../02-spring spring data category; ../06-database category 4."}, {"n": 42, "category": 3, "difficulty": "T", "html": "&quot;Do you use Lombok? Field injection? Checked exceptions?&quot; How do you answer an opinion question when you do not know the interviewer&#x27;s opinion?", "answerTitle": "Opinion questions with an unknown audience", "answer": "<p>Answer with the <strong>decision rule<\/strong>, not the verdict. Then state your default and the condition that would change it. You cannot be wrong about a rule, and it invites them to share their context.<\/p><blockquote><p>&quot;Lombok - my rule is that I will take a code generator for the mechanical parts as long as the team can read the generated result and the build does not depend on IDE plugins being installed correctly. In practice I use <code>@Getter<\/code>, <code>@Builder<\/code> and <code>@RequiredArgsConstructor<\/code>, avoid <code>@Data<\/code> on JPA entities because of <code>equals<\/code> and <code>hashCode<\/code> on a mutable id, and for new code prefer records where they fit. What is the convention here?&quot;<\/p><\/blockquote><p><strong>The failure modes are symmetrical:<\/strong> a dogmatic answer alienates half of all interviewers, and a completely non-committal answer reads as having no engineering opinions. Take a position - just make it a conditional one.<\/p><p><strong>Do not<\/strong> try to read their preference off their face and match it. Interviewers notice, and it is the worst possible signal in a round that is partly about whether you will disagree with them later.<\/p>", "source": "answers.md", "search": "\"do you use lombok? field injection? checked exceptions?\" how do you answer an opinion question when you do not know the interviewer's opinion? answer with the decision rule , not the verdict. then state your default and the condition that would change it. you cannot be wrong about a rule, and it invites them to share their context. \"lombok - my rule is that i will take a code generator for the mechanical parts as long as the team can read the generated result and the build does not depend on ide plugins being installed correctly. in practice i use @getter, @builder and @requiredargsconstructor, avoid @data on jpa entities because of equals and hashcode on a mutable id, and for new code prefer records where they fit. what is the convention here?\" the failure modes are symmetrical: a dogmatic answer alienates half of all interviewers, and a completely non-committal answer reads as having no engineering opinions. take a position - just make it a conditional one. do not try to read their preference off their face and match it. interviewers notice, and it is the worst possible signal in a round that is partly about whether you will disagree with them later."}, {"n": 43, "category": 3, "difficulty": "A", "html": "You are asked to design an internal library API that forty teams will depend on. What is the round actually scoring?", "answerTitle": "Designing a library API for forty teams", "answer": "<p>The round is not scoring API aesthetics. It is scoring whether you understand that <strong>a shared library is a distributed system with a human release cycle<\/strong>.<\/p><p>What the strong answer covers, roughly in this order: who the users are and what their failure looks like when you are wrong; the smallest possible public surface, with everything else genuinely inaccessible; <strong>versioning and deprecation policy stated before the first method<\/strong>, because you will never get all forty teams onto a new major version simultaneously; what happens when a team needs something you did not anticipate (an extension point, or your phone number); defaults that are safe rather than fast; observability built in, so a team using it badly is visible to you; and the migration path from whatever they do today.<\/p><p><strong>The trade-off to name unprompted:<\/strong> a library couples forty teams to your release cadence, and a service couples them to your uptime. Say which you would choose here and why - that single sentence is the difference between a senior and a principal answer.<\/p><p><strong>Depth:<\/strong> <code>../01-java<\/code> Category 3; <code>../03-microservices<\/code> Category 2.<\/p>", "source": "answers.md", "search": "you are asked to design an internal library api that forty teams will depend on. what is the round actually scoring? the round is not scoring api aesthetics. it is scoring whether you understand that a shared library is a distributed system with a human release cycle . what the strong answer covers, roughly in this order: who the users are and what their failure looks like when you are wrong; the smallest possible public surface, with everything else genuinely inaccessible; versioning and deprecation policy stated before the first method , because you will never get all forty teams onto a new major version simultaneously; what happens when a team needs something you did not anticipate (an extension point, or your phone number); defaults that are safe rather than fast; observability built in, so a team using it badly is visible to you; and the migration path from whatever they do today. the trade-off to name unprompted: a library couples forty teams to your release cadence, and a service couples them to your uptime. say which you would choose here and why - that single sentence is the difference between a senior and a principal answer. depth: ../01-java category 3; ../03-microservices category 2."}, {"n": 44, "category": 3, "difficulty": "A", "html": "Defend a Java and Spring stack choice against an interviewer who wants to hear why you would not use Go.", "answerTitle": "Defending Java and Spring against Go", "answer": "<p>Do not defend the language. <strong>Reframe as a decision with inputs<\/strong>, then take a real position.<\/p><blockquote><p>&quot;The honest answer is that both are fine and the choice is rarely about the language. The inputs I would use are: what the team already operates well, what the workload looks like, and what the ecosystem gives me for free. For a service that is mostly IO with heavy transactional data access, the Spring ecosystem gives me transaction management, security, data access and observability that I would otherwise assemble by hand, and Java&#x27;s operational tooling - JFR, heap dumps, async-profiler - is genuinely better when something goes wrong at 2am. Where I would pick Go: a small network-heavy component with a tight memory budget, a CLI, a sidecar, anything where a 40 MB static binary and a fast cold start matter more than the ecosystem.&quot;<\/p><\/blockquote><p>Then concede honestly - startup time and memory footprint used to be a real Java disadvantage in serverless and sidecar contexts, and CRaC and native images are a real but not free answer - and close on the organizational point: &quot;the strongest argument for either is that this team can debug it under pressure.&quot;<\/p><p><strong>Red flag:<\/strong> treating it as an attack. It is almost always a test of whether you hold technology opinions loosely.<\/p>", "source": "answers.md", "search": "defend a java and spring stack choice against an interviewer who wants to hear why you would not use go. do not defend the language. reframe as a decision with inputs , then take a real position. \"the honest answer is that both are fine and the choice is rarely about the language. the inputs i would use are: what the team already operates well, what the workload looks like, and what the ecosystem gives me for free. for a service that is mostly io with heavy transactional data access, the spring ecosystem gives me transaction management, security, data access and observability that i would otherwise assemble by hand, and java's operational tooling - jfr, heap dumps, async-profiler - is genuinely better when something goes wrong at 2am. where i would pick go: a small network-heavy component with a tight memory budget, a cli, a sidecar, anything where a 40 mb static binary and a fast cold start matter more than the ecosystem.\" then concede honestly - startup time and memory footprint used to be a real java disadvantage in serverless and sidecar contexts, and crac and native images are a real but not free answer - and close on the organizational point: \"the strongest argument for either is that this team can debug it under pressure.\" red flag: treating it as an attack. it is almost always a test of whether you hold technology opinions loosely."}, {"n": 45, "category": 4, "difficulty": "C", "html": "&quot;How do you decide a service boundary?&quot; Give the 60-second answer that earns the follow-up you want.", "answerTitle": "\"How do you decide a service boundary?\" in 60 seconds", "answer": "<blockquote><p>&quot;I start from the business capability and the data it owns, not from the code. A boundary is right when the service owns its data outright, when a typical change lands in one service, and when the team can deploy it without coordinating. The test I actually apply is the change-coupling one: if two services always ship together, that is one service with a network call in the middle. The counter-pressure is that every boundary you draw converts a method call into a partial failure, so the burden of proof is on splitting.&quot;<\/p><\/blockquote><p><strong>Why this earns the follow-up you want:<\/strong> it plants three hooks - data ownership, change coupling, partial failure - and the interviewer will pull one. All three lead somewhere you have depth.<\/p><p><strong>Red flags:<\/strong> starting with &quot;one service per team&quot; or &quot;per aggregate&quot; as a rule with no reasoning, or not mentioning data ownership at all.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 1.<\/p>", "source": "answers.md", "search": "\"how do you decide a service boundary?\" give the 60-second answer that earns the follow-up you want. \"i start from the business capability and the data it owns, not from the code. a boundary is right when the service owns its data outright, when a typical change lands in one service, and when the team can deploy it without coordinating. the test i actually apply is the change-coupling one: if two services always ship together, that is one service with a network call in the middle. the counter-pressure is that every boundary you draw converts a method call into a partial failure, so the burden of proof is on splitting.\" why this earns the follow-up you want: it plants three hooks - data ownership, change coupling, partial failure - and the interviewer will pull one. all three lead somewhere you have depth. red flags: starting with \"one service per team\" or \"per aggregate\" as a rule with no reasoning, or not mentioning data ownership at all. depth: ../03-microservices category 1."}, {"n": 46, "category": 4, "difficulty": "D", "html": "The exactly-once question. How do you answer it correctly without sounding pedantic?", "answerTitle": "Exactly-once, without pedantry", "answer": "<p>The correct content is that exactly-once <strong>delivery<\/strong> is not achievable over an unreliable network, but exactly-once <strong>processing<\/strong> is - at-least-once delivery plus idempotent or deduplicated handling, or a transactional read-process-write inside one system.<\/p><p>The pedantry risk is in the delivery. Lead with the practical answer and let the theory be one clause:<\/p><blockquote><p>&quot;In practice you get exactly-once processing by combining at-least-once delivery with a deduplication key or an idempotent operation - delivery itself cannot be exactly-once, which is why the effort goes into the consumer. Concretely: a business idempotency key, stored in the same transaction as the effect, so a redelivery is a no-op rather than a second charge.&quot;<\/p><\/blockquote><p>Then offer the harder half unprompted, because it is where the real signal is: <strong>the effect and the dedup record must commit atomically<\/strong>, which is why the outbox pattern exists (Q48) and why &quot;we check Redis first&quot; is a race, not a solution.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Categories 3-4.<\/p>", "source": "answers.md", "search": "the exactly-once question. how do you answer it correctly without sounding pedantic? the correct content is that exactly-once delivery is not achievable over an unreliable network, but exactly-once processing is - at-least-once delivery plus idempotent or deduplicated handling, or a transactional read-process-write inside one system. the pedantry risk is in the delivery. lead with the practical answer and let the theory be one clause: \"in practice you get exactly-once processing by combining at-least-once delivery with a deduplication key or an idempotent operation - delivery itself cannot be exactly-once, which is why the effort goes into the consumer. concretely: a business idempotency key, stored in the same transaction as the effect, so a redelivery is a no-op rather than a second charge.\" then offer the harder half unprompted, because it is where the real signal is: the effect and the dedup record must commit atomically , which is why the outbox pattern exists (q48) and why \"we check redis first\" is a race, not a solution. depth: ../03-microservices categories 3-4."}, {"n": 47, "category": 4, "difficulty": "T", "html": "The interviewer says &quot;we use two-phase commit across our services&quot;. How do you disagree without spending your credibility?", "answerTitle": "\"We use two-phase commit across our services\"", "answer": "<p>Assume they have a reason. Ask before disagreeing - and if they do have a legitimate one (an XA-capable resource pair, a low-throughput internal flow), you have avoided an embarrassing lecture.<\/p><blockquote><p>&quot;Interesting - is that XA across the databases, or a coordinator you built? … The reason I ask is that the failure mode I worry about is the coordinator dying between prepare and commit, which leaves the participants holding locks with no one to tell them what to do. At low volume that is survivable because a human can resolve it. Where it has hurt teams I have worked with is availability coupling: with 2PC, every participant has to be up for any write to succeed. Has that bitten you, or is the volume low enough that it does not?&quot;<\/p><\/blockquote><p><strong>The structure:<\/strong> question, then the specific mechanism (blocking coordinator, availability coupling), then hand it back. You have demonstrated the knowledge without saying &quot;that is wrong&quot;.<\/p><p><strong>Only then<\/strong> offer the alternative - saga with compensations, or collapsing the two services if they need atomicity that badly, which is the answer nobody gives and is often right (Q59).<\/p>", "source": "answers.md", "search": "the interviewer says \"we use two-phase commit across our services\". how do you disagree without spending your credibility? assume they have a reason. ask before disagreeing - and if they do have a legitimate one (an xa-capable resource pair, a low-throughput internal flow), you have avoided an embarrassing lecture. \"interesting - is that xa across the databases, or a coordinator you built? … the reason i ask is that the failure mode i worry about is the coordinator dying between prepare and commit, which leaves the participants holding locks with no one to tell them what to do. at low volume that is survivable because a human can resolve it. where it has hurt teams i have worked with is availability coupling: with 2pc, every participant has to be up for any write to succeed. has that bitten you, or is the volume low enough that it does not?\" the structure: question, then the specific mechanism (blocking coordinator, availability coupling), then hand it back. you have demonstrated the knowledge without saying \"that is wrong\". only then offer the alternative - saga with compensations, or collapsing the two services if they need atomicity that badly, which is the answer nobody gives and is often right (q59)."}, {"n": 48, "category": 4, "difficulty": "D", "html": "The interviewer conflates saga and outbox. Separate them in two sentences, then say why the confusion is common.", "answerTitle": "Saga versus outbox in two sentences", "answer": "<blockquote><p>&quot;A saga is about <strong>business atomicity across services<\/strong> - a sequence of local transactions with a compensating action for each, so a failure halfway is unwound semantically rather than rolled back. The outbox is about <strong>atomicity between a database write and a message publish inside one service<\/strong> - you write the event to a table in the same transaction as the state change, and a relay publishes it, so you can never have one without the other.&quot;<\/p><\/blockquote><p>Then why the confusion is common and worth naming: they usually appear together. A saga step is implemented <em>using<\/em> an outbox, because each step must reliably announce that it happened. Saying that out loud - &quot;they are at different levels; the outbox is how a saga step keeps its promise&quot; - is the sentence that shows you have built one.<\/p><p><strong>Follow-up ladder to expect:<\/strong> &quot;who relays the outbox?&quot; → &quot;what about ordering and duplicates?&quot; → &quot;how do you handle a compensation that itself fails?&quot; (the answer is that it must be retriable forever and eventually alert a human; there is no third option).<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Categories 3-4.<\/p>", "source": "answers.md", "search": "the interviewer conflates saga and outbox. separate them in two sentences, then say why the confusion is common. \"a saga is about business atomicity across services - a sequence of local transactions with a compensating action for each, so a failure halfway is unwound semantically rather than rolled back. the outbox is about atomicity between a database write and a message publish inside one service - you write the event to a table in the same transaction as the state change, and a relay publishes it, so you can never have one without the other.\" then why the confusion is common and worth naming: they usually appear together. a saga step is implemented using an outbox, because each step must reliably announce that it happened. saying that out loud - \"they are at different levels; the outbox is how a saga step keeps its promise\" - is the sentence that shows you have built one. follow-up ladder to expect: \"who relays the outbox?\" → \"what about ordering and duplicates?\" → \"how do you handle a compensation that itself fails?\" (the answer is that it must be retriable forever and eventually alert a human; there is no third option). depth: ../03-microservices categories 3-4."}, {"n": 49, "category": 4, "difficulty": "D", "html": "&quot;Tell me about a distributed system failure you debugged.&quot; What structure makes this land as evidence rather than a war story?", "answerTitle": "\"Tell me about a distributed failure you debugged\"", "answer": "<p>Use CIDER, but the load-bearing part is the <strong>isolation<\/strong> - it is where the evidence of real experience is.<\/p><p>The structure that lands: one sentence of system context with a scale number; how you <em>knew<\/em> (the alert or the symptom, with the number); the hypotheses you held and <strong>how you discriminated between them<\/strong> with data; the finding, including the thing that surprised you; the immediate mitigation separated from the root-cause fix; and what class of failure you eliminated afterwards.<\/p><p><strong>The details that make it credible:<\/strong> the tool you actually used, the false lead you followed first, and a timestamp or duration. Stories with no false lead sound reconstructed, because real debugging always has one.<\/p><p><strong>Keep it to three minutes<\/strong> and offer depth: &quot;that is the summary - I can go deeper on the detection or on the fix, whichever is more useful.&quot;<\/p>", "source": "answers.md", "search": "\"tell me about a distributed system failure you debugged.\" what structure makes this land as evidence rather than a war story? use cider, but the load-bearing part is the isolation - it is where the evidence of real experience is. the structure that lands: one sentence of system context with a scale number; how you knew (the alert or the symptom, with the number); the hypotheses you held and how you discriminated between them with data; the finding, including the thing that surprised you; the immediate mitigation separated from the root-cause fix; and what class of failure you eliminated afterwards. the details that make it credible: the tool you actually used, the false lead you followed first, and a timestamp or duration. stories with no false lead sound reconstructed, because real debugging always has one. keep it to three minutes and offer depth: \"that is the summary - i can go deeper on the detection or on the fix, whichever is more useful.\""}, {"n": 50, "category": 4, "difficulty": "D", "html": "&quot;We use an idempotency key.&quot; Take that answer down three levels of follow-up and say what each level tests.", "answerTitle": "\"We use an idempotency key\" - three levels down", "answer": "<ul><li><strong>Level 1 - where does the key come from?<\/strong> Weak: the service generates it. Strong: the <em>client<\/em> supplies it, scoped to the operation, because a retry by the client must carry the same key, and only the client knows that two requests are the same intent.<\/li><li><strong>Level 2 - what do you store, and when?<\/strong> Weak: &quot;we check if we have seen it&quot;. Strong: you store the key <strong>and the response<\/strong>, in the same transaction as the effect, and you return the stored response on replay. Checking-then-acting in two steps is a race under concurrent retries; you need a unique constraint doing the work, or a row lock.<\/li><li><strong>Level 3 - the concurrent in-flight case and expiry.<\/strong> What happens when the retry arrives while the first request is still running? (Reject with a conflict, or block on the lock - but decide, because the default is a double effect.) How long do you keep keys, and what happens to a retry after expiry? What if the request body differs for the same key - is that a client bug you must reject, and do you hash the body to detect it?<\/li><\/ul><p><strong>A fourth level if they keep going:<\/strong> idempotency across a saga is not the same as idempotency of one endpoint, and the retry may arrive at a different instance or after a failover.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 3.<\/p>", "source": "answers.md", "search": "\"we use an idempotency key.\" take that answer down three levels of follow-up and say what each level tests. - level 1 - where does the key come from? weak: the service generates it. strong: the client supplies it, scoped to the operation, because a retry by the client must carry the same key, and only the client knows that two requests are the same intent. - level 2 - what do you store, and when? weak: \"we check if we have seen it\". strong: you store the key and the response , in the same transaction as the effect, and you return the stored response on replay. checking-then-acting in two steps is a race under concurrent retries; you need a unique constraint doing the work, or a row lock. - level 3 - the concurrent in-flight case and expiry. what happens when the retry arrives while the first request is still running? (reject with a conflict, or block on the lock - but decide, because the default is a double effect.) how long do you keep keys, and what happens to a retry after expiry? what if the request body differs for the same key - is that a client bug you must reject, and do you hash the body to detect it? a fourth level if they keep going: idempotency across a saga is not the same as idempotency of one endpoint, and the retry may arrive at a different instance or after a failover. depth: ../03-microservices category 3."}, {"n": 51, "category": 4, "difficulty": "T", "html": "You are asked how you would migrate a monolith and you have ten minutes. What do you deliberately leave out, and how do you signal that you left it out on purpose?", "answerTitle": "Monolith migration in ten minutes", "answer": "<p><strong>Signal the omission explicitly<\/strong> - that is the whole test. Silently giving a shallow answer looks like a shallow understanding; announcing the cut looks like judgement.<\/p><blockquote><p>&quot;In ten minutes I will give you the sequencing and the first two decisions, and skip the org design and the data migration mechanics, which are the two hardest parts - flag me if you would rather I spend the time there instead.&quot;<\/p><\/blockquote><p>Then the content, compressed: do not start with code, start with <strong>why<\/strong> (Q27); pick the first slice by change frequency and data independence, not by what is easiest; strangler fig with a facade so the callers do not change; <strong>the database is the whole problem<\/strong> - a service with a shared database is a distributed monolith; keep the monolith authoritative until the new path is verified with dual reads and comparison; and have a rollback that is a routing change rather than a data migration.<\/p><p><strong>What you kept:<\/strong> the sequencing and the data point. <strong>What you cut:<\/strong> everything you named. That framing is worth more than the extra content would have been.<\/p>", "source": "answers.md", "search": "you are asked how you would migrate a monolith and you have ten minutes. what do you deliberately leave out, and how do you signal that you left it out on purpose? signal the omission explicitly - that is the whole test. silently giving a shallow answer looks like a shallow understanding; announcing the cut looks like judgement. \"in ten minutes i will give you the sequencing and the first two decisions, and skip the org design and the data migration mechanics, which are the two hardest parts - flag me if you would rather i spend the time there instead.\" then the content, compressed: do not start with code, start with why (q27); pick the first slice by change frequency and data independence, not by what is easiest; strangler fig with a facade so the callers do not change; the database is the whole problem - a service with a shared database is a distributed monolith; keep the monolith authoritative until the new path is verified with dual reads and comparison; and have a rollback that is a routing change rather than a data migration. what you kept: the sequencing and the data point. what you cut: everything you named. that framing is worth more than the extra content would have been."}, {"n": 52, "category": 4, "difficulty": "D", "html": "Retries and circuit breakers: what makes an answer here mediocre, and what single addition makes it senior?", "answerTitle": "What makes a retry answer senior", "answer": "<p>Mediocre: &quot;retry with exponential backoff and jitter, and use a circuit breaker.&quot;<\/p><p>The single addition that makes it senior: <strong>retries are a load amplifier, so they need a budget, not just a policy.<\/strong><\/p><blockquote><p>&quot;Backoff and jitter are table stakes. The two things I care about more are: retries must only apply to idempotent operations, or you need the key from the previous question; and the total retry load has to be bounded across the fleet, because every layer retrying three times gives you 27x amplification at the bottom during exactly the incident where the downstream is already failing. So a retry budget - a cap on the ratio of retries to requests, shed when exceeded - and retries at one layer only, usually the outermost.&quot;<\/p><\/blockquote><p>Then the circuit breaker&#x27;s real purpose, which most answers get wrong: it is not to protect the caller, it is to <strong>stop the caller from preventing the callee&#x27;s recovery<\/strong>. And name what you would monitor: retry ratio, and the breaker&#x27;s state transitions as an event, not a gauge.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 6.<\/p>", "source": "answers.md", "search": "retries and circuit breakers: what makes an answer here mediocre, and what single addition makes it senior? mediocre: \"retry with exponential backoff and jitter, and use a circuit breaker.\" the single addition that makes it senior: retries are a load amplifier, so they need a budget, not just a policy. \"backoff and jitter are table stakes. the two things i care about more are: retries must only apply to idempotent operations, or you need the key from the previous question; and the total retry load has to be bounded across the fleet, because every layer retrying three times gives you 27x amplification at the bottom during exactly the incident where the downstream is already failing. so a retry budget - a cap on the ratio of retries to requests, shed when exceeded - and retries at one layer only, usually the outermost.\" then the circuit breaker's real purpose, which most answers get wrong: it is not to protect the caller, it is to stop the caller from preventing the callee's recovery . and name what you would monitor: retry ratio, and the breaker's state transitions as an event, not a gauge. depth: ../03-microservices category 6."}, {"n": 53, "category": 4, "difficulty": "D", "html": "&quot;How do services find each other?&quot; looks like a screening question. Where does the depth actually live and how do you get there?", "answerTitle": "\"How do services find each other?\"", "answer": "<p>Answer the surface in one sentence - client-side or server-side discovery, a registry or DNS or the platform&#x27;s service objects - and then say where the interesting part is, because the question is a doorway:<\/p><blockquote><p>&quot;Mechanically it is a registry with health checks, or the platform&#x27;s DNS. The parts that have actually caused me problems are the two edges: <strong>health check semantics<\/strong> - liveness versus readiness, and what a service reports when its downstream is down, because a service that fails its own health check because Redis is slow will remove the entire fleet from rotation - and <strong>deregistration lag<\/strong>, where an instance is gone but callers keep dialing it for the TTL, which is what makes a rolling deploy look like an error spike.&quot;<\/p><\/blockquote><p>That reframing shows operational experience and gives the interviewer three follow-up paths. Have connection draining and pre-stop hooks ready for the deploy path.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 7; <code>../07-devops<\/code> Kubernetes category.<\/p>", "source": "answers.md", "search": "\"how do services find each other?\" looks like a screening question. where does the depth actually live and how do you get there? answer the surface in one sentence - client-side or server-side discovery, a registry or dns or the platform's service objects - and then say where the interesting part is, because the question is a doorway: \"mechanically it is a registry with health checks, or the platform's dns. the parts that have actually caused me problems are the two edges: health check semantics - liveness versus readiness, and what a service reports when its downstream is down, because a service that fails its own health check because redis is slow will remove the entire fleet from rotation - and deregistration lag , where an instance is gone but callers keep dialing it for the ttl, which is what makes a rolling deploy look like an error spike.\" that reframing shows operational experience and gives the interviewer three follow-up paths. have connection draining and pre-stop hooks ready for the deploy path. depth: ../03-microservices category 7; ../07-devops kubernetes category."}, {"n": 54, "category": 4, "difficulty": "D", "html": "How do you show you have operated a message broker rather than read about one?", "answerTitle": "Proving you have operated a broker", "answer": "<p>Read versus operated is visible in <strong>which details you volunteer<\/strong>. Operators talk about the things that are not in the tutorial:<\/p><ul><li><strong>Consumer lag<\/strong> as the primary metric, and what you did when it grew - and the distinction between lag caused by slow consumers and lag caused by a stuck partition.<\/li><li><strong>Rebalancing<\/strong>: what a rebalance does to in-flight processing, why a long poll interval causes one, and the day a deploy caused a storm of them.<\/li><li><strong>Partition count<\/strong> as a decision that is hard to change, and what determines it (ordering requirements and consumer parallelism, not throughput alone).<\/li><li><strong>Poison messages<\/strong>: the dead-letter path, and the fact that you have to be able to <em>replay<\/em> from it, which almost nobody builds until they need it.<\/li><li><strong>Retention<\/strong> and the moment you discovered it was shorter than your recovery time.<\/li><\/ul><p>One story with three of these in it is worth more than a complete conceptual explanation.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Categories 3 and 9.<\/p>", "source": "answers.md", "search": "how do you show you have operated a message broker rather than read about one? read versus operated is visible in which details you volunteer . operators talk about the things that are not in the tutorial: - consumer lag as the primary metric, and what you did when it grew - and the distinction between lag caused by slow consumers and lag caused by a stuck partition. - rebalancing : what a rebalance does to in-flight processing, why a long poll interval causes one, and the day a deploy caused a storm of them. - partition count as a decision that is hard to change, and what determines it (ordering requirements and consumer parallelism, not throughput alone). - poison messages : the dead-letter path, and the fact that you have to be able to replay from it, which almost nobody builds until they need it. - retention and the moment you discovered it was shorter than your recovery time. one story with three of these in it is worth more than a complete conceptual explanation. depth: ../03-microservices categories 3 and 9."}, {"n": 55, "category": 4, "difficulty": "T", "html": "&quot;Do you version your APIs?&quot; Everyone says yes. What is the follow-up, and which answer survives it?", "answerTitle": "\"Do you version your APIs?\"", "answer": "<p>Everyone says yes. The follow-up is <strong>&quot;how do you retire a version?&quot;<\/strong> - and that is where most answers collapse, because versioning is easy and deprecation is organizational.<\/p><p>The answer that survives:<\/p><blockquote><p>&quot;Yes, but the versioning scheme matters less than the retirement process, and that is the part that is hard. Concretely: additive-only changes within a version, so consumers do not break; a new version only for a breaking change, which I try very hard to avoid; and for retirement, <strong>usage telemetry per consumer per version<\/strong> so I know exactly who is still on the old one, a deadline agreed with those teams rather than announced, and a scheduled brownout - a deliberate short outage of the old version before the real cutoff - because that is the only thing that reliably finds the callers who did not read the email.&quot;<\/p><\/blockquote><p>The brownout detail is the one that marks real experience. Then name the trade-off: every version you keep alive is a branch in your code and your test matrix forever, which is why consumer-driven contract tests are the durable answer.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 2.<\/p>", "source": "answers.md", "search": "\"do you version your apis?\" everyone says yes. what is the follow-up, and which answer survives it? everyone says yes. the follow-up is \"how do you retire a version?\" - and that is where most answers collapse, because versioning is easy and deprecation is organizational. the answer that survives: \"yes, but the versioning scheme matters less than the retirement process, and that is the part that is hard. concretely: additive-only changes within a version, so consumers do not break; a new version only for a breaking change, which i try very hard to avoid; and for retirement, usage telemetry per consumer per version so i know exactly who is still on the old one, a deadline agreed with those teams rather than announced, and a scheduled brownout - a deliberate short outage of the old version before the real cutoff - because that is the only thing that reliably finds the callers who did not read the email.\" the brownout detail is the one that marks real experience. then name the trade-off: every version you keep alive is a branch in your code and your test matrix forever, which is why consumer-driven contract tests are the durable answer. depth: ../03-microservices category 2."}, {"n": 56, "category": 4, "difficulty": "D", "html": "Consistency questions: how do you avoid reciting CAP and still answer the question that was asked?", "answerTitle": "Consistency without reciting CAP", "answer": "<p>CAP is a partition-time statement and almost never the question being asked. Answer in terms of <strong>what the user is promised<\/strong>.<\/p><blockquote><p>&quot;I would rather talk about it per operation than per system. For each one I ask: what does the user see if they read immediately after their own write, and what is the worst staleness that is acceptable? Most systems need read-your-own-writes for the actor and are happy with seconds of staleness for everyone else - and that is a routing decision, not a database choice: send that user&#x27;s reads to the primary or to a session-pinned replica, and everything else to the replicas.&quot;<\/p><\/blockquote><p>Then the vocabulary that shows depth: strong versus eventual is too coarse; the useful distinctions are <strong>read-your-writes, monotonic reads, and bounded staleness<\/strong>, plus the fact that a cache in front of a strongly consistent store makes the system eventually consistent regardless of the store&#x27;s guarantees.<\/p><p><strong>Depth:<\/strong> <code>../03-microservices<\/code> Category 4; <code>../06-database<\/code> Category 8.<\/p>", "source": "answers.md", "search": "consistency questions: how do you avoid reciting cap and still answer the question that was asked? cap is a partition-time statement and almost never the question being asked. answer in terms of what the user is promised . \"i would rather talk about it per operation than per system. for each one i ask: what does the user see if they read immediately after their own write, and what is the worst staleness that is acceptable? most systems need read-your-own-writes for the actor and are happy with seconds of staleness for everyone else - and that is a routing decision, not a database choice: send that user's reads to the primary or to a session-pinned replica, and everything else to the replicas.\" then the vocabulary that shows depth: strong versus eventual is too coarse; the useful distinctions are read-your-writes, monotonic reads, and bounded staleness , plus the fact that a cache in front of a strongly consistent store makes the system eventually consistent regardless of the store's guarantees. depth: ../03-microservices category 4; ../06-database category 8."}, {"n": 57, "category": 4, "difficulty": "D", "html": "Which single anecdote covers tracing, sampling and cardinality at once, and why is one anecdote better than three?", "answerTitle": "One anecdote covering tracing, sampling and cardinality", "answer": "<p>One story is better than three because it demonstrates that these interact, which is the actual insight.<\/p><blockquote><p>&quot;We had a latency problem visible only at p99, so tracing was the right tool - except our head-based sampling at one percent meant we almost never captured a slow request. We moved that service to tail-based sampling so we kept the slow and errored traces and dropped the fast ones. The knock-on was cost: tail sampling means buffering, and our first attempt blew the collector&#x27;s memory. And the related mistake in the same investigation was that someone had added the customer id as a metric label to help debug it, which multiplied our time series by the customer count and nearly took out the metrics backend - the id belongs on the span, not on the metric.&quot;<\/p><\/blockquote><p><strong>Why this scores:<\/strong> three concepts, one narrative, a cost consequence, and a stated rule (high-cardinality identifiers go on traces and logs, never on metric labels).<\/p><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Category 8.<\/p>", "source": "answers.md", "search": "which single anecdote covers tracing, sampling and cardinality at once, and why is one anecdote better than three? one story is better than three because it demonstrates that these interact, which is the actual insight. \"we had a latency problem visible only at p99, so tracing was the right tool - except our head-based sampling at one percent meant we almost never captured a slow request. we moved that service to tail-based sampling so we kept the slow and errored traces and dropped the fast ones. the knock-on was cost: tail sampling means buffering, and our first attempt blew the collector's memory. and the related mistake in the same investigation was that someone had added the customer id as a metric label to help debug it, which multiplied our time series by the customer count and nearly took out the metrics backend - the id belongs on the span, not on the metric.\" why this scores: three concepts, one narrative, a cost consequence, and a stated rule (high-cardinality identifiers go on traces and logs, never on metric labels). depth: ../07-devops category 8."}, {"n": 58, "category": 4, "difficulty": "A", "html": "The interviewer asks you to decompose their actual product live. How do you run that with no domain knowledge?", "answerTitle": "Decomposing their product live with no domain knowledge", "answer": "<p>You are not being tested on their domain - you are being tested on <strong>how you extract a domain from a stranger in ten minutes<\/strong>. Run it as an interview of them.<\/p><p>Sequence: ask them to name the top five <em>nouns<\/em> the business cares about, and who changes each one; ask what changes most often and what has never changed; ask where the pain is today - what is slow to deploy, what breaks together, who has to be in the room for a release; sketch capabilities rather than services and check the data ownership for each; then propose a <strong>first slice only<\/strong>, with the reason it is first and the reason the rest waits.<\/p><p><strong>The judgement markers:<\/strong> you asked before you drew; you proposed one slice rather than a target architecture; you named what you would <em>not<\/em> split and why; and you said what evidence would change your mind after the first slice ships.<\/p><p><strong>Red flag:<\/strong> producing a full microservice diagram for a business you learned about six minutes ago. It reads as pattern application, not thought.<\/p>", "source": "answers.md", "search": "the interviewer asks you to decompose their actual product live. how do you run that with no domain knowledge? you are not being tested on their domain - you are being tested on how you extract a domain from a stranger in ten minutes . run it as an interview of them. sequence: ask them to name the top five nouns the business cares about, and who changes each one; ask what changes most often and what has never changed; ask where the pain is today - what is slow to deploy, what breaks together, who has to be in the room for a release; sketch capabilities rather than services and check the data ownership for each; then propose a first slice only , with the reason it is first and the reason the rest waits. the judgement markers: you asked before you drew; you proposed one slice rather than a target architecture; you named what you would not split and why; and you said what evidence would change your mind after the first slice ships. red flag: producing a full microservice diagram for a business you learned about six minutes ago. it reads as pattern application, not thought."}, {"n": 59, "category": 4, "difficulty": "A", "html": "Argue against splitting a service, in front of an interviewer whose company has just finished splitting theirs.", "answerTitle": "Arguing against a split, to someone who just did one", "answer": "<p>The trap is that this sounds like criticizing their decision. Separate <strong>the general case<\/strong> from <strong>their case<\/strong>, and be genuinely curious about theirs.<\/p><blockquote><p>&quot;I would want to know what they bought with it first - if it was deployment independence and they got it, that is a win and I would say so. My general position is that the burden of proof is on splitting, because a split converts a compile-time error into a runtime partial failure, adds a network hop to every interaction, and turns a transaction into a saga. So my test is: are these two things deployed together anyway, do they change together, and does the data cross the boundary in every request? If yes to all three, the split has paid all the costs and bought nothing. What did the split give you here?&quot;<\/p><\/blockquote><p>Then the constructive alternative you would offer instead of a split - modular monolith with enforced module boundaries, a separate deployment only for the component with a genuinely different scaling profile.<\/p><p><strong>What is being scored:<\/strong> whether you can hold a strong architectural position while remaining pleasant to disagree with (Q7, Q166). The content matters less than the tone.<\/p>", "source": "answers.md", "search": "argue against splitting a service, in front of an interviewer whose company has just finished splitting theirs. the trap is that this sounds like criticizing their decision. separate the general case from their case , and be genuinely curious about theirs. \"i would want to know what they bought with it first - if it was deployment independence and they got it, that is a win and i would say so. my general position is that the burden of proof is on splitting, because a split converts a compile-time error into a runtime partial failure, adds a network hop to every interaction, and turns a transaction into a saga. so my test is: are these two things deployed together anyway, do they change together, and does the data cross the boundary in every request? if yes to all three, the split has paid all the costs and bought nothing. what did the split give you here?\" then the constructive alternative you would offer instead of a split - modular monolith with enforced module boundaries, a separate deployment only for the component with a genuinely different scaling profile. what is being scored: whether you can hold a strong architectural position while remaining pleasant to disagree with (q7, q166). the content matters less than the tone."}, {"n": 60, "category": 5, "difficulty": "C", "html": "The first four minutes of a design round. What must happen, in what order, and what must not?", "answerTitle": "The first four minutes", "answer": "<p>In order: <strong>restate, scope, constrain, plan.<\/strong><\/p><ol><li><strong>Restate the problem in one sentence<\/strong> and get agreement. Thirty seconds, and it has caught a misunderstanding for me more than once.<\/li><li><strong>Functional scope<\/strong>: name five candidate features and ask them to pick the two or three that matter. You are not guessing what is in scope, you are negotiating it.<\/li><li><strong>Non-functional constraints with numbers<\/strong>: users, requests per second, read-write ratio, data size and growth, latency target, consistency requirement, availability target. Ask; if they say &quot;you decide&quot;, state an assumption out loud and write it down.<\/li><li><strong>Say the plan<\/strong>: &quot;I will do the API and data model, then the high-level architecture, then go deep on whichever component you find most interesting, then failure modes and cost. Does that order work for you?&quot;<\/li><\/ol><p><strong>What must not happen:<\/strong> drawing a box in the first four minutes. Boxes before requirements is the single most reliable predictor of a bad design round, and interviewers are explicitly watching for it.<\/p>", "source": "answers.md", "search": "the first four minutes of a design round. what must happen, in what order, and what must not? in order: restate, scope, constrain, plan. 1. restate the problem in one sentence and get agreement. thirty seconds, and it has caught a misunderstanding for me more than once. 2. functional scope : name five candidate features and ask them to pick the two or three that matter. you are not guessing what is in scope, you are negotiating it. 3. non-functional constraints with numbers : users, requests per second, read-write ratio, data size and growth, latency target, consistency requirement, availability target. ask; if they say \"you decide\", state an assumption out loud and write it down. 4. say the plan : \"i will do the api and data model, then the high-level architecture, then go deep on whichever component you find most interesting, then failure modes and cost. does that order work for you?\" what must not happen: drawing a box in the first four minutes. boxes before requirements is the single most reliable predictor of a bad design round, and interviewers are explicitly watching for it."}, {"n": 61, "category": 5, "difficulty": "D", "html": "How do you extract requirements when the interviewer is deliberately vague, and how many questions is too many?", "answerTitle": "Extracting requirements from a vague interviewer", "answer": "<p>Vagueness is usually deliberate, and the test is whether you can <strong>make decisions under it<\/strong> rather than extract your way out. So: ask a small number of high-leverage questions, then <strong>assume out loud<\/strong> and move.<\/p><p>The high-leverage ones - the ones whose answers change the architecture - are: read-heavy or write-heavy and by what ratio; how much data and over what horizon; what is the tightest latency requirement and on which operation; and what is the consistency requirement on the one operation that matters. Four questions, ninety seconds.<\/p><p>Everything else you assume: &quot;I will assume 10 million daily actives and a 100:1 read-write ratio; that gives me roughly <em>[n]<\/em> requests per second at peak. Tell me if that is off by an order of magnitude, because it changes the storage choice.&quot;<\/p><p><strong>Too many questions<
