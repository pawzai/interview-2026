ent budget instead is [the hard part that is actually hard] .\" the tone that works with someone invested in the agent: you are not saying agents are bad, you are saying the lowest rung of the autonomy ladder that solves the problem is the right one, and you are offering to be wrong - \"if the paths turn out not to be enumerable, that is exactly when i would change my mind.\" depth: ../10-ai-agents categories 1 and 7."}, {"n": 128, "category": 9, "difficulty": "T", "html": "&quot;What model do you use?&quot; Why is the answer not a model name, and what is it instead?", "answerTitle": "\"What model do you use?\"", "answer": "<p>The answer is a <strong>selection process and a swap cost<\/strong>, because any model name you give is out of date and reveals nothing.<\/p><blockquote><p>&quot;I would rather answer with how we choose, because the specific model has changed three times in the last year and will change again. We pick per task, not per product: the classification and extraction steps use a small fast model, the synthesis step uses a larger one, and we re-run the eval set whenever a candidate appears. The important architectural property is that the model is behind an interface with the eval harness attached, so switching is a configuration change plus a test run rather than a project. Right now the mix is <em>[X]<\/em> for <em>[reason]<\/em> - but the reason is the answer, not the name.&quot;<\/p><\/blockquote><p>Then the criteria that show you have actually done it: quality on <em>your<\/em> eval set rather than a public benchmark, latency at p95, cost per task, data residency and retention terms, and whether you are exposed to a provider deprecating a version underneath you.<\/p>", "source": "answers.md", "search": "\"what model do you use?\" why is the answer not a model name, and what is it instead? the answer is a selection process and a swap cost , because any model name you give is out of date and reveals nothing. \"i would rather answer with how we choose, because the specific model has changed three times in the last year and will change again. we pick per task, not per product: the classification and extraction steps use a small fast model, the synthesis step uses a larger one, and we re-run the eval set whenever a candidate appears. the important architectural property is that the model is behind an interface with the eval harness attached, so switching is a configuration change plus a test run rather than a project. right now the mix is [x] for [reason] - but the reason is the answer, not the name.\" then the criteria that show you have actually done it: quality on your eval set rather than a public benchmark, latency at p95, cost per task, data residency and retention terms, and whether you are exposed to a provider deprecating a version underneath you."}, {"n": 129, "category": 9, "difficulty": "D", "html": "How do you raise prompt injection in an answer without derailing the round into security?", "answerTitle": "Raising prompt injection without derailing", "answer": "<p>Raise it <strong>once, precisely, tied to a specific capability in the design<\/strong>, then offer to come back.<\/p><blockquote><p>&quot;One thing I want to flag on this component rather than dwell on: the moment this reads content a user or a third party controls and it also holds a tool that can write or send, the injection risk becomes an authorization problem rather than a content-filtering problem. The control I would put in is that the tool&#x27;s permissions come from the <em>user&#x27;s<\/em> identity and are enforced in code outside the model, so the worst case is bounded by what that user could do anyway. Happy to go deeper if it is useful, otherwise I will keep moving.&quot;<\/p><\/blockquote><p><strong>Why this works:<\/strong> it is fifteen seconds, it names the mechanism, it proposes a structural control rather than a filter, and it hands the interviewer the choice. Compare with the failure mode, which is a five-minute security digression in a design round.<\/p><p><strong>What not to say:<\/strong> that you would sanitize the input or add a classifier as the primary control. That answer marks you as answering the 2023 version of the question.<\/p><p><strong>Depth:<\/strong> <code>../10-ai-agents<\/code> Category 13; <code>../11-security<\/code> Category 12.<\/p>", "source": "answers.md", "search": "how do you raise prompt injection in an answer without derailing the round into security? raise it once, precisely, tied to a specific capability in the design , then offer to come back. \"one thing i want to flag on this component rather than dwell on: the moment this reads content a user or a third party controls and it also holds a tool that can write or send, the injection risk becomes an authorization problem rather than a content-filtering problem. the control i would put in is that the tool's permissions come from the user's identity and are enforced in code outside the model, so the worst case is bounded by what that user could do anyway. happy to go deeper if it is useful, otherwise i will keep moving.\" why this works: it is fifteen seconds, it names the mechanism, it proposes a structural control rather than a filter, and it hands the interviewer the choice. compare with the failure mode, which is a five-minute security digression in a design round. what not to say: that you would sanitize the input or add a classifier as the primary control. that answer marks you as answering the 2023 version of the question. depth: ../10-ai-agents category 13; ../11-security category 12."}, {"n": 130, "category": 9, "difficulty": "D", "html": "How do you present AI work starting in 2024 as depth rather than a recent pivot?", "answerTitle": "AI from 2024 as depth, not a pivot", "answer": "<p>Two moves. First, <strong>claim depth on a bounded surface<\/strong> rather than breadth on all of it: &quot;I am not an ML researcher and I do not train models. What I am is a systems engineer who has taken LLM features to production, and the hard parts there have been retrieval quality, evaluation, cost and the authorization boundary - which are all problems I have nineteen years of context for.&quot;<\/p><p>Second, <strong>connect it to the older work explicitly<\/strong>, because that is what turns two years into nineteen: an evaluation harness is a test strategy for a nondeterministic system; context assembly under a token budget is a caching and selection problem; agent durability is sagas and idempotency (<code>../03-microservices<\/code>); tool authorization is the confused deputy problem. Saying one of those out loud reframes the recency entirely.<\/p><p><strong>The trap<\/strong> is overclaiming into research territory. One question about model internals you cannot answer, after you have positioned yourself as an AI expert, costs more than the modest framing would have.<\/p>", "source": "answers.md", "search": "how do you present ai work starting in 2024 as depth rather than a recent pivot? two moves. first, claim depth on a bounded surface rather than breadth on all of it: \"i am not an ml researcher and i do not train models. what i am is a systems engineer who has taken llm features to production, and the hard parts there have been retrieval quality, evaluation, cost and the authorization boundary - which are all problems i have nineteen years of context for.\" second, connect it to the older work explicitly , because that is what turns two years into nineteen: an evaluation harness is a test strategy for a nondeterministic system; context assembly under a token budget is a caching and selection problem; agent durability is sagas and idempotency (../03-microservices); tool authorization is the confused deputy problem. saying one of those out loud reframes the recency entirely. the trap is overclaiming into research territory. one question about model internals you cannot answer, after you have positioned yourself as an ai expert, costs more than the modest framing would have."}, {"n": 131, "category": 9, "difficulty": "D", "html": "When is bringing up Java and Spring AI an advantage in an AI round, and when does it read as a limitation?", "answerTitle": "When Java and Spring AI helps, and when it does not", "answer": "<p><strong>Helps<\/strong> when the role is enterprise integration: the AI capability has to live inside an existing Java estate with its transactions, security and observability, and the interviewer&#x27;s real problem is how to get an LLM feature into a regulated Spring Boot system without a second stack. There, knowing <code>ChatClient<\/code>, advisors, tool callbacks and where the abstraction leaks is a genuine differentiator, and so is the operational argument - one deployment story, one identity model, one set of dashboards.<\/p><p><strong>Reads as a limitation<\/strong> when the team is a Python AI shop. Bringing it up unprompted there suggests you would fight the ecosystem. The correct framing is portability: &quot;the architecture I care about is the same in either language - the model behind an interface, retrieval as a service, the eval harness in CI. I have implemented it in Java; the Python ecosystem has more tooling for the experimentation half and I would use it.&quot;<\/p><p><strong>The judgement being tested:<\/strong> whether you would impose your stack on a team where it is the wrong fit.<\/p><p><strong>Depth:<\/strong> <code>../02-spring<\/code> Spring AI category; <code>../10-ai-agents<\/code> Category 17.<\/p>", "source": "answers.md", "search": "when is bringing up java and spring ai an advantage in an ai round, and when does it read as a limitation? helps when the role is enterprise integration: the ai capability has to live inside an existing java estate with its transactions, security and observability, and the interviewer's real problem is how to get an llm feature into a regulated spring boot system without a second stack. there, knowing chatclient, advisors, tool callbacks and where the abstraction leaks is a genuine differentiator, and so is the operational argument - one deployment story, one identity model, one set of dashboards. reads as a limitation when the team is a python ai shop. bringing it up unprompted there suggests you would fight the ecosystem. the correct framing is portability: \"the architecture i care about is the same in either language - the model behind an interface, retrieval as a service, the eval harness in ci. i have implemented it in java; the python ecosystem has more tooling for the experimentation half and i would use it.\" the judgement being tested: whether you would impose your stack on a team where it is the wrong fit. depth: ../02-spring spring ai category; ../10-ai-agents category 17."}, {"n": 132, "category": 9, "difficulty": "T", "html": "The interviewer is more current on models than you are. How do you keep credibility?", "answerTitle": "The interviewer is more current than you", "answer": "<p>Do not compete on recency; you will lose and it is not what is being scored. <strong>Move to the axis where your experience is the advantage<\/strong> - and be visibly interested in what they know.<\/p><blockquote><p>&quot;You are ahead of me on that - I have not used it. What I would want to know before putting it in a system is whether it changes any of the constraints I design around: does it change the cost per task by an order of magnitude, does it change the latency profile, and does it remove a failure mode or just shrink it. Those are the three things that would make me redesign rather than swap. Has it changed any of those for you?&quot;<\/p><\/blockquote><p>That response does four things: it concedes honestly, it demonstrates a durable framework, it shows you evaluate rather than adopt, and it makes them talk - which they want to do, and which converts the round into a conversation between peers.<\/p><p><strong>The general principle:<\/strong> in a field that churns quarterly, <strong>the mechanism and the evaluation discipline are what you are being hired for<\/strong>, and saying so explicitly is legitimate.<\/p>", "source": "answers.md", "search": "the interviewer is more current on models than you are. how do you keep credibility? do not compete on recency; you will lose and it is not what is being scored. move to the axis where your experience is the advantage - and be visibly interested in what they know. \"you are ahead of me on that - i have not used it. what i would want to know before putting it in a system is whether it changes any of the constraints i design around: does it change the cost per task by an order of magnitude, does it change the latency profile, and does it remove a failure mode or just shrink it. those are the three things that would make me redesign rather than swap. has it changed any of those for you?\" that response does four things: it concedes honestly, it demonstrates a durable framework, it shows you evaluate rather than adopt, and it makes them talk - which they want to do, and which converts the round into a conversation between peers. the general principle: in a field that churns quarterly, the mechanism and the evaluation discipline are what you are being hired for , and saying so explicitly is legitimate."}, {"n": 133, "category": 9, "difficulty": "A", "html": "Design round: add an AI capability to an existing product with a 300 millisecond latency budget.", "answerTitle": "An AI capability with a 300 ms budget", "answer": "<p>The first move is to establish that <strong>a large model call is not in the budget<\/strong> and therefore the design question is what can be moved off the synchronous path.<\/p><p>Work the arithmetic out loud: time to first token for a large model is typically hundreds of milliseconds before any generation, and full generation of a paragraph is seconds. So within 300 ms end to end, including retrieval and network, a general-purpose model call on the critical path is out.<\/p><p>Then the options, with what each costs: <strong>precompute<\/strong> - do the model work ahead of time and serve a lookup, which works for a bounded input space (embeddings, classifications, summaries per document) and fails for open-ended input; <strong>a small specialized model<\/strong> - a distilled classifier or an embedding model, tens of milliseconds, at the cost of generality; <strong>cache the model&#x27;s output<\/strong> on a semantic or exact key, with the honest note that hit rate decides whether this is a solution or a decoration; <strong>stream and change the UX contract<\/strong>, so 300 ms to <em>first token<\/em> is achievable even when completion is not - and check whether the requirement is really end-to-end or perceived latency, because it usually is not what the ticket says; <strong>make it asynchronous<\/strong>, showing a non-blocking result and filling in.<\/p><p><strong>The strong close:<\/strong> &quot;I would push back on the requirement once, with data - if the answer is that 300 ms is a hard product constraint on the whole response, then the honest design is a small model or a precomputed lookup, and we should scope the feature to what that supports rather than pretend.&quot;<\/p><p><strong>Depth:<\/strong> <code>../08-genai<\/code> Categories 13-14; <code>../04-system-design<\/code> Category 11.<\/p>", "source": "answers.md", "search": "design round: add an ai capability to an existing product with a 300 millisecond latency budget. the first move is to establish that a large model call is not in the budget and therefore the design question is what can be moved off the synchronous path. work the arithmetic out loud: time to first token for a large model is typically hundreds of milliseconds before any generation, and full generation of a paragraph is seconds. so within 300 ms end to end, including retrieval and network, a general-purpose model call on the critical path is out. then the options, with what each costs: precompute - do the model work ahead of time and serve a lookup, which works for a bounded input space (embeddings, classifications, summaries per document) and fails for open-ended input; a small specialized model - a distilled classifier or an embedding model, tens of milliseconds, at the cost of generality; cache the model's output on a semantic or exact key, with the honest note that hit rate decides whether this is a solution or a decoration; stream and change the ux contract , so 300 ms to first token is achievable even when completion is not - and check whether the requirement is really end-to-end or perceived latency, because it usually is not what the ticket says; make it asynchronous , showing a non-blocking result and filling in. the strong close: \"i would push back on the requirement once, with data - if the answer is that 300 ms is a hard product constraint on the whole response, then the honest design is a small model or a precomputed lookup, and we should scope the feature to what that supports rather than pretend.\" depth: ../08-genai categories 13-14; ../04-system-design category 11."}, {"n": 134, "category": 9, "difficulty": "A", "html": "You are asked how you would set AI engineering standards for an organization of 300 engineers.", "answerTitle": "AI engineering standards for 300 engineers", "answer": "<p>Standards that are documents get ignored, so answer in terms of <strong>what is paved, what is gated, and what is measured<\/strong>.<\/p><ul><li><strong>Paved road:<\/strong> one approved way to call a model - a gateway that every team uses, which gives you central key management, per-team cost attribution and quotas, request and response logging for evaluation, retries and fallbacks, and the ability to change providers once for everyone. This single piece of infrastructure is worth more than every policy document.<\/li><li><strong>Gates, and only where the risk justifies them:<\/strong> no LLM output reaching a user-visible or system-changing path without an eval set in CI; a review for anything that gives a model a tool with write access; and a data classification check before a corpus is indexed.<\/li><li><strong>Defaults in a template:<\/strong> a starter with the gateway client, tracing, a cost budget per request, prompt and model versions pinned as configuration artifacts, and an eval harness scaffold - so the right thing is the easy thing.<\/li><li><strong>Measured:<\/strong> spend per team, eval coverage on production paths, and incidents attributable to AI components.<\/li><li><strong>Explicitly not standardized:<\/strong> prompts, model choice per task, and the experimentation stack. Standardizing those is where platform teams lose their users.<\/li><\/ul><p><strong>The organizational sentence:<\/strong> &quot;I would start with the gateway and the eval requirement, because those two give you leverage over everything else. Trying to publish comprehensive standards before either exists produces a document nobody reads.&quot;<\/p>", "source": "answers.md", "search": "you are asked how you would set ai engineering standards for an organization of 300 engineers. standards that are documents get ignored, so answer in terms of what is paved, what is gated, and what is measured . - paved road: one approved way to call a model - a gateway that every team uses, which gives you central key management, per-team cost attribution and quotas, request and response logging for evaluation, retries and fallbacks, and the ability to change providers once for everyone. this single piece of infrastructure is worth more than every policy document. - gates, and only where the risk justifies them: no llm output reaching a user-visible or system-changing path without an eval set in ci; a review for anything that gives a model a tool with write access; and a data classification check before a corpus is indexed. - defaults in a template: a starter with the gateway client, tracing, a cost budget per request, prompt and model versions pinned as configuration artifacts, and an eval harness scaffold - so the right thing is the easy thing. - measured: spend per team, eval coverage on production paths, and incidents attributable to ai components. - explicitly not standardized: prompts, model choice per task, and the experimentation stack. standardizing those is where platform teams lose their users. the organizational sentence: \"i would start with the gateway and the eval requirement, because those two give you leverage over everything else. trying to publish comprehensive standards before either exists produces a document nobody reads.\""}, {"n": 135, "category": 10, "difficulty": "C", "html": "&quot;How do you secure an API?&quot; Give the layered ninety-second answer.", "answerTitle": "\"How do you secure an API?\" in 90 seconds", "answer": "<p>Answer in <strong>layers, outside in<\/strong>, one clause each - the structure is the signal.<\/p><blockquote><p>&quot;Transport: TLS everywhere including internally, HSTS, and no exceptions for internal traffic because the network is not a boundary. Identity: OAuth 2.1 or OIDC with short-lived access tokens validated locally against cached JWKS, checking issuer, audience, expiry and signature algorithm explicitly. Authorization: enforced per resource at the service, not at the gateway, and never derived from anything the client sent. Input: validated against a schema, parameterized queries, output encoding at the point of rendering. Abuse: rate limits per identity rather than per IP, quotas, and payload size caps. Data: field-level control over what is returned, so the object you serialize is a response model rather than your entity. Operations: audit logging of authorization decisions, dependency scanning, and secrets from a manager. If I had to pick the one that fails most often in the systems I have reviewed, it is authorization at the object level.&quot;<\/p><\/blockquote><p><strong>That last sentence is the differentiator<\/strong> - it shows you have reviewed real systems rather than memorized a checklist.<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Categories 4-7.<\/p>", "source": "answers.md", "search": "\"how do you secure an api?\" give the layered ninety-second answer. answer in layers, outside in , one clause each - the structure is the signal. \"transport: tls everywhere including internally, hsts, and no exceptions for internal traffic because the network is not a boundary. identity: oauth 2.1 or oidc with short-lived access tokens validated locally against cached jwks, checking issuer, audience, expiry and signature algorithm explicitly. authorization: enforced per resource at the service, not at the gateway, and never derived from anything the client sent. input: validated against a schema, parameterized queries, output encoding at the point of rendering. abuse: rate limits per identity rather than per ip, quotas, and payload size caps. data: field-level control over what is returned, so the object you serialize is a response model rather than your entity. operations: audit logging of authorization decisions, dependency scanning, and secrets from a manager. if i had to pick the one that fails most often in the systems i have reviewed, it is authorization at the object level.\" that last sentence is the differentiator - it shows you have reviewed real systems rather than memorized a checklist. depth: ../11-security categories 4-7."}, {"n": 136, "category": 10, "difficulty": "D", "html": "OAuth 2.1 and OIDC: which parts must you explain without notes, and which are fair to look up?", "answerTitle": "OAuth and OIDC: what you must know cold", "answer": "<p><strong>Without notes:<\/strong> the difference between authentication and authorization and which protocol does which; authorization code flow with PKCE and why it replaced implicit; what the access token, ID token and refresh token are each for and who is allowed to inspect each; why the ID token is for the client and the access token is for the API; token validation at the resource server - issuer, audience, expiry, signature, and pinning the algorithm to reject <code>none<\/code> and key confusion; scopes as coarse delegation versus your own fine-grained authorization; and refresh token rotation with reuse detection.<\/p><p><strong>Fair to look up:<\/strong> the exact claim names in a less common flow, device flow specifics, the details of token exchange, and the current state of any given spec&#x27;s draft status.<\/p><p><strong>The follow-up that catches people:<\/strong> &quot;the API receives a valid token - what else do you check?&quot; The answer is that a valid token proves who the caller is, not that they may touch <em>this<\/em> object, and conflating the two is the most common serious authorization bug (Q141).<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Category 3.<\/p>", "source": "answers.md", "search": "oauth 2.1 and oidc: which parts must you explain without notes, and which are fair to look up? without notes: the difference between authentication and authorization and which protocol does which; authorization code flow with pkce and why it replaced implicit; what the access token, id token and refresh token are each for and who is allowed to inspect each; why the id token is for the client and the access token is for the api; token validation at the resource server - issuer, audience, expiry, signature, and pinning the algorithm to reject none and key confusion; scopes as coarse delegation versus your own fine-grained authorization; and refresh token rotation with reuse detection. fair to look up: the exact claim names in a less common flow, device flow specifics, the details of token exchange, and the current state of any given spec's draft status. the follow-up that catches people: \"the api receives a valid token - what else do you check?\" the answer is that a valid token proves who the caller is, not that they may touch this object, and conflating the two is the most common serious authorization bug (q141). depth: ../11-security category 3."}, {"n": 137, "category": 10, "difficulty": "T", "html": "&quot;Do you store JWTs in local storage?&quot; Answer the trap question.", "answerTitle": "\"Do you store JWTs in local storage?\"", "answer": "<p>The trap is answering yes or no rather than naming the threat model.<\/p><blockquote><p>&quot;No, and the reason is XSS - anything in local storage is readable by any script on the page, so one injected script exfiltrates every session. My default is a cookie with <code>HttpOnly<\/code>, <code>Secure<\/code> and <code>SameSite<\/code>, plus CSRF protection, because that combination puts the token out of JavaScript&#x27;s reach and CSRF is a much better-understood problem than XSS. That said, the deeper answer is that storage is the second question - the first is how long the token is valid and whether it can be revoked, because a stolen fifteen-minute token with rotation is a much smaller incident than a stolen eight-hour one whichever way you stored it. For a pure SPA against a cross-origin API where cookies are awkward, keeping the access token in memory only, with a refresh in an <code>HttpOnly<\/code> cookie, is the version I would defend.&quot;<\/p><\/blockquote><p><strong>What scores:<\/strong> naming the threat, giving a default, and then relocating the question to lifetime and revocation - which is where the real risk reduction is.<\/p>", "source": "answers.md", "search": "\"do you store jwts in local storage?\" answer the trap question. the trap is answering yes or no rather than naming the threat model. \"no, and the reason is xss - anything in local storage is readable by any script on the page, so one injected script exfiltrates every session. my default is a cookie with httponly, secure and samesite, plus csrf protection, because that combination puts the token out of javascript's reach and csrf is a much better-understood problem than xss. that said, the deeper answer is that storage is the second question - the first is how long the token is valid and whether it can be revoked, because a stolen fifteen-minute token with rotation is a much smaller incident than a stolen eight-hour one whichever way you stored it. for a pure spa against a cross-origin api where cookies are awkward, keeping the access token in memory only, with a refresh in an httponly cookie, is the version i would defend.\" what scores: naming the threat, giving a default, and then relocating the question to lifetime and revocation - which is where the real risk reduction is."}, {"n": 138, "category": 10, "difficulty": "D", "html": "Threat modeling live: how do you run STRIDE over their system in eight minutes?", "answerTitle": "STRIDE over their system in eight minutes", "answer": "<p>Do not enumerate all six categories over the whole system - that takes an hour and produces nothing. <strong>Scope it, then run the categories against the boundaries only.<\/strong><\/p><ul><li><strong>Minute 1-2:<\/strong> get the data flow diagram down to trust boundaries. What crosses from untrusted to trusted, where does authentication happen, where does data at rest sit, who are the actors including the internal ones.<\/li><li><strong>Minute 3-6:<\/strong> walk each boundary and ask the categories that apply to <em>that<\/em> boundary. At the client-to-API boundary, spoofing and tampering. At the service-to-database boundary, information disclosure and elevation. At any admin path, elevation and repudiation - and admin paths are where the real findings are, because they are built for insiders and reviewed least.<\/li><li><strong>Minute 7-8:<\/strong> rank by <strong>impact times reachability<\/strong>, and give the top three with a control each. Say explicitly: &quot;these are the three I would fix; the rest I would put in a backlog rather than pretend we can do everything.&quot;<\/li><\/ul><p><strong>What is being scored:<\/strong> prioritization, not coverage. A list of thirty threats is a worse answer than three with a control and a reason.<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Category 1.<\/p>", "source": "answers.md", "search": "threat modeling live: how do you run stride over their system in eight minutes? do not enumerate all six categories over the whole system - that takes an hour and produces nothing. scope it, then run the categories against the boundaries only. - minute 1-2: get the data flow diagram down to trust boundaries. what crosses from untrusted to trusted, where does authentication happen, where does data at rest sit, who are the actors including the internal ones. - minute 3-6: walk each boundary and ask the categories that apply to that boundary. at the client-to-api boundary, spoofing and tampering. at the service-to-database boundary, information disclosure and elevation. at any admin path, elevation and repudiation - and admin paths are where the real findings are, because they are built for insiders and reviewed least. - minute 7-8: rank by impact times reachability , and give the top three with a control each. say explicitly: \"these are the three i would fix; the rest i would put in a backlog rather than pretend we can do everything.\" what is being scored: prioritization, not coverage. a list of thirty threats is a worse answer than three with a control and a reason. depth: ../11-security category 1."}, {"n": 139, "category": 10, "difficulty": "D", "html": "Secrets, key rotation and KMS: what proves operations rather than reading?", "answerTitle": "Secrets, rotation and KMS: what proves operations", "answer": "<p>Reading gives you envelope encryption and key policies. Operating gives you these:<\/p><ul><li><strong>You have actually rotated something in production<\/strong>, and you know that the hard part is not generating the new secret, it is the overlap window - both credentials valid simultaneously while every consumer picks up the new one, and the discovery that one consumer caches it at startup and only rotates on a deploy.<\/li><li><strong>Key policies are separate from IAM policies<\/strong>, and a role with <code>s3:GetObject<\/code> and no <code>kms:Decrypt<\/code> produces an error message that wastes an hour.<\/li><li><strong>You know what a rotation costs<\/strong>: re-encryption is not required for envelope encryption because you rotate the key-encrypting key, and knowing that distinction is a good marker.<\/li><li><strong>You have a revocation story<\/strong>, not just a rotation schedule, because the incident case is different from the calendar case (Q114).<\/li><li><strong>The honest gap:<\/strong> somewhere there is a secret that cannot be rotated without downtime. Naming yours is more credible than claiming there is not one.<\/li><\/ul><p><strong>Depth:<\/strong> <code>../11-security<\/code> Categories 8-9.<\/p>", "source": "answers.md", "search": "secrets, key rotation and kms: what proves operations rather than reading? reading gives you envelope encryption and key policies. operating gives you these: - you have actually rotated something in production , and you know that the hard part is not generating the new secret, it is the overlap window - both credentials valid simultaneously while every consumer picks up the new one, and the discovery that one consumer caches it at startup and only rotates on a deploy. - key policies are separate from iam policies , and a role with s3:getobject and no kms:decrypt produces an error message that wastes an hour. - you know what a rotation costs : re-encryption is not required for envelope encryption because you rotate the key-encrypting key, and knowing that distinction is a good marker. - you have a revocation story , not just a rotation schedule, because the incident case is different from the calendar case (q114). - the honest gap: somewhere there is a secret that cannot be rotated without downtime. naming yours is more credible than claiming there is not one. depth: ../11-security categories 8-9."}, {"n": 140, "category": 10, "difficulty": "T", "html": "The interviewer asks about a CVE you have never heard of. Play out the next minute.", "answerTitle": "A CVE you have never heard of", "answer": "<p>Say so immediately, then demonstrate the <strong>response process<\/strong>, which is what the question is actually about.<\/p><blockquote><p>&quot;I do not know that one. What I would do with it is the same for any advisory: first, do we use the affected component and on what path - which I can answer from the SBOM rather than by guessing; second, is the vulnerable code path reachable in our usage, because a large share of advisories are not exploitable in a given configuration and the reachability question is what prevents a fire drill; third, severity in <em>our<\/em> context rather than the CVSS base score, because a remote unauthenticated RCE on an internet-facing service and the same CVE in a build-time tool are different problems; then patch, or mitigate if the patch is not available, and document the decision either way.&quot;<\/p><\/blockquote><p><strong>The strong addition:<\/strong> &quot;and I would be more interested in how quickly we could answer the first question - if finding out whether we use a component takes two days, that is the real finding.&quot;<\/p><p><strong>Never<\/strong> pretend to recognize it. Interviewers occasionally make one up.<\/p>", "source": "answers.md", "search": "the interviewer asks about a cve you have never heard of. play out the next minute. say so immediately, then demonstrate the response process , which is what the question is actually about. \"i do not know that one. what i would do with it is the same for any advisory: first, do we use the affected component and on what path - which i can answer from the sbom rather than by guessing; second, is the vulnerable code path reachable in our usage, because a large share of advisories are not exploitable in a given configuration and the reachability question is what prevents a fire drill; third, severity in our context rather than the cvss base score, because a remote unauthenticated rce on an internet-facing service and the same cve in a build-time tool are different problems; then patch, or mitigate if the patch is not available, and document the decision either way.\" the strong addition: \"and i would be more interested in how quickly we could answer the first question - if finding out whether we use a component takes two days, that is the real finding.\" never pretend to recognize it. interviewers occasionally make one up."}, {"n": 141, "category": 10, "difficulty": "D", "html": "&quot;How do you handle authorization?&quot; Where does the depth actually live, and how do you get there quickly?", "answerTitle": "\"How do you handle authorization?\" - where the depth is", "answer": "<p>Not in the model name. The depth is in <strong>where it is enforced and what it is enforced against<\/strong>.<\/p><blockquote><p>&quot;The part that matters is object-level authorization - not &#x27;can this role call this endpoint&#x27; but &#x27;may this specific user act on this specific record&#x27;. Endpoint-level checks are easy and are almost never the vulnerability; the vulnerability is a handler that loads by id and never checks ownership. So the enforcement has to be at the point of data access, and my preference is to make it structurally impossible to skip - a repository that requires a subject, or a filter applied at the query level - rather than a check a developer has to remember.&quot;<\/p><\/blockquote><p>Then the model choice as a secondary matter, with the real trade-off: RBAC is legible and gets you a long way and then explodes into role proliferation; ABAC handles the relationship cases at the cost of policies nobody can reason about; and a policy engine centralizes decisions but the enforcement point is still yours. Mention multi-tenancy explicitly - tenant isolation is an authorization property and it deserves a test suite of its own.<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Category 4.<\/p>", "source": "answers.md", "search": "\"how do you handle authorization?\" where does the depth actually live, and how do you get there quickly? not in the model name. the depth is in where it is enforced and what it is enforced against . \"the part that matters is object-level authorization - not 'can this role call this endpoint' but 'may this specific user act on this specific record'. endpoint-level checks are easy and are almost never the vulnerability; the vulnerability is a handler that loads by id and never checks ownership. so the enforcement has to be at the point of data access, and my preference is to make it structurally impossible to skip - a repository that requires a subject, or a filter applied at the query level - rather than a check a developer has to remember.\" then the model choice as a secondary matter, with the real trade-off: rbac is legible and gets you a long way and then explodes into role proliferation; abac handles the relationship cases at the cost of policies nobody can reason about; and a policy engine centralizes decisions but the enforcement point is still yours. mention multi-tenancy explicitly - tenant isolation is an authorization property and it deserves a test suite of its own. depth: ../11-security category 4."}, {"n": 142, "category": 10, "difficulty": "D", "html": "Supply chain security: what is the concrete evidence of practice rather than awareness?", "answerTitle": "Supply chain: evidence of practice", "answer": "<p>Awareness sounds like &quot;we scan dependencies&quot;. Practice sounds like:<\/p><ul><li><strong>A generated SBOM per build<\/strong>, stored with the artifact, so the Q140 question takes minutes.<\/li><li><strong>Pinned and verified dependencies<\/strong> - a lockfile that is enforced, an internal proxy or mirror rather than pulling from the public registry at build time, and the knowledge that this also protects against a deleted package and dependency confusion.<\/li><li><strong>A build you could describe as trustworthy<\/strong>: ephemeral runners, no long-lived credentials in CI, provenance attestation on the artifact, and signed images with verification at deploy admission rather than only at push.<\/li><li><strong>A policy for what actually blocks a build<\/strong> - because &quot;fail on any high severity&quot; is how teams end up disabling the scanner. Ours blocks on reachable criticals and files everything else with an SLA.<\/li><li><strong>The uncomfortable honest bit:<\/strong> transitive dependencies are the actual exposure and nobody reviews them; the mitigation is reducing the dependency count and having the SBOM, not pretending to audit them.<\/li><\/ul><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Category 4; <code>../11-security<\/code> Category 10.<\/p>", "source": "answers.md", "search": "supply chain security: what is the concrete evidence of practice rather than awareness? awareness sounds like \"we scan dependencies\". practice sounds like: - a generated sbom per build , stored with the artifact, so the q140 question takes minutes. - pinned and verified dependencies - a lockfile that is enforced, an internal proxy or mirror rather than pulling from the public registry at build time, and the knowledge that this also protects against a deleted package and dependency confusion. - a build you could describe as trustworthy : ephemeral runners, no long-lived credentials in ci, provenance attestation on the artifact, and signed images with verification at deploy admission rather than only at push. - a policy for what actually blocks a build - because \"fail on any high severity\" is how teams end up disabling the scanner. ours blocks on reachable criticals and files everything else with an sla. - the uncomfortable honest bit: transitive dependencies are the actual exposure and nobody reviews them; the mitigation is reducing the dependency count and having the sbom, not pretending to audit them. depth: ../07-devops category 4; ../11-security category 10."}, {"n": 143, "category": 10, "difficulty": "D", "html": "How do you discuss a security incident you were part of without breaching confidentiality?", "answerTitle": "Discussing a security incident without breaching confidentiality", "answer": "<p>Abstract the identifiers, keep the mechanism, and <strong>say that you are doing it<\/strong> - the discipline itself is the signal.<\/p><blockquote><p>&quot;I will keep this non-specific about the company and the customer, but the mechanism is the interesting part anyway. The class of issue was <em>[an object-level authorization gap on an internal admin path]<\/em>. It was found by <em>[a report / a routine review]<\/em>. What mattered was the response: we scoped exposure from access logs within a few hours, which was only possible because the logs had the fields we needed - that was luck as much as design. We shipped the fix within <em>[time]<\/em>, and the durable change was <em>[the query-level enforcement so the class could not recur]<\/em>.&quot;<\/p><\/blockquote><p><strong>What is scored:<\/strong> that you did not over-disclose, that you can describe an incident in mechanism terms, and that the lesson was structural. An interviewer who watches you handle confidential material carefully learns something about how you will handle theirs.<\/p><p><strong>Never<\/strong> name an unpatched vulnerability in a current employer&#x27;s system. Some candidates do, and it ends the loop.<\/p>", "source": "answers.md", "search": "how do you discuss a security incident you were part of without breaching confidentiality? abstract the identifiers, keep the mechanism, and say that you are doing it - the discipline itself is the signal. \"i will keep this non-specific about the company and the customer, but the mechanism is the interesting part anyway. the class of issue was [an object-level authorization gap on an internal admin path] . it was found by [a report / a routine review] . what mattered was the response: we scoped exposure from access logs within a few hours, which was only possible because the logs had the fields we needed - that was luck as much as design. we shipped the fix within [time] , and the durable change was [the query-level enforcement so the class could not recur] .\" what is scored: that you did not over-disclose, that you can describe an incident in mechanism terms, and that the lesson was structural. an interviewer who watches you handle confidential material carefully learns something about how you will handle theirs. never name an unpatched vulnerability in a current employer's system. some candidates do, and it ends the loop."}, {"n": 144, "category": 10, "difficulty": "D", "html": "AI security questions inside a security round: what is genuinely specific to LLM systems?", "answerTitle": "What is genuinely specific to LLM security", "answer": "<p>Three things, and be precise, because the domain is full of generic answers:<\/p><ul><li><strong>The instruction and data channel are the same.<\/strong> There is no equivalent of a parameterized query - no way to mark retrieved text as &quot;data, never instructions&quot;. So indirect injection through a document, a web page, an email or a ticket is a structural property, not a bug to be patched.<\/li><li><strong>The consequence is authorization, not content.<\/strong> A model reading untrusted content is a nuisance; a model reading untrusted content while holding a tool that can write, send or spend is a confused deputy. The controls are therefore the ones you would use for a deputy: the tool acts with the <em>user&#x27;s<\/em> privileges, enforced in code outside the model; irreversible actions require confirmation; and the blast radius is bounded by capability rather than by detection.<\/li><li><strong>The lethal trifecta<\/strong> - access to private data, exposure to untrusted content, and an exfiltration channel. Any two are manageable; all three in one context is a data breach waiting for the right document. The architectural response is to break one of the three, most often by separating the trusted-context agent from the untrusted-content one.<\/li><\/ul><p>Then the model-specific extras: training and inference data handling and retention terms, and the fact that a prompt is not a security boundary no matter how it is worded.<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Category 12; <code>../10-ai-agents<\/code> Category 13.<\/p>", "source": "answers.md", "search": "ai security questions inside a security round: what is genuinely specific to llm systems? three things, and be precise, because the domain is full of generic answers: - the instruction and data channel are the same. there is no equivalent of a parameterized query - no way to mark retrieved text as \"data, never instructions\". so indirect injection through a document, a web page, an email or a ticket is a structural property, not a bug to be patched. - the consequence is authorization, not content. a model reading untrusted content is a nuisance; a model reading untrusted content while holding a tool that can write, send or spend is a confused deputy. the controls are therefore the ones you would use for a deputy: the tool acts with the user's privileges, enforced in code outside the model; irreversible actions require confirmation; and the blast radius is bounded by capability rather than by detection. - the lethal trifecta - access to private data, exposure to untrusted content, and an exfiltration channel. any two are manageable; all three in one context is a data breach waiting for the right document. the architectural response is to break one of the three, most often by separating the trusted-context agent from the untrusted-content one. then the model-specific extras: training and inference data handling and retention terms, and the fact that a prompt is not a security boundary no matter how it is worded. depth: ../11-security category 12; ../10-ai-agents category 13."}, {"n": 145, "category": 10, "difficulty": "T", "html": "&quot;Is our current design secure?&quot; asked about a diagram with three obvious holes and one subtle one. How do you sequence what you say?", "answerTitle": "\"Is our design secure?\" with three obvious holes and one subtle one", "answer": "<p>The sequencing is the test, and the instinct to lead with the obvious findings is the trap - it reads as a scanner rather than an architect.<\/p><blockquote><p>&quot;Let me separate what I see. Three things I would want changed and would expect you already know about: <em>[the obvious ones, one clause each, no lecture]<\/em>. The one I am more interested in is <em>[the subtle one]<\/em>, because <em>[the reason it is not visible]<\/em> - and I would want to check whether <em>[the specific test that confirms it]<\/em>.&quot;<\/p><\/blockquote><p>Three properties: you covered the obvious so you are not seen to have missed them, you gave them no more time than they deserve, and you spent your capital on the finding that demonstrates depth. Naming the subtle one as a question rather than an accusation leaves room for the possibility that it is handled somewhere you cannot see.<\/p><p><strong>Then close with severity, not a list:<\/strong> &quot;if I could only get one fixed this quarter, it is <em>[X]<\/em>, because <em>[impact × reachability]<\/em>.&quot;<\/p>", "source": "answers.md", "search": "\"is our current design secure?\" asked about a diagram with three obvious holes and one subtle one. how do you sequence what you say? the sequencing is the test, and the instinct to lead with the obvious findings is the trap - it reads as a scanner rather than an architect. \"let me separate what i see. three things i would want changed and would expect you already know about: [the obvious ones, one clause each, no lecture] . the one i am more interested in is [the subtle one] , because [the reason it is not visible] - and i would want to check whether [the specific test that confirms it] .\" three properties: you covered the obvious so you are not seen to have missed them, you gave them no more time than they deserve, and you spent your capital on the finding that demonstrates depth. naming the subtle one as a question rather than an accusation leaves room for the possibility that it is handled somewhere you cannot see. then close with severity, not a list: \"if i could only get one fixed this quarter, it is [x] , because [impact × reachability] .\""}, {"n": 146, "category": 10, "difficulty": "A", "html": "You are asked to define the secure SDLC for a team that has none, with a delivery deadline unchanged.", "answerTitle": "Secure SDLC for a team with none, deadline unchanged", "answer": "<p>The constraint is the point: you cannot introduce six practices into a team shipping to a date. <strong>Sequence by yield per unit of friction.<\/strong><\/p><ul><li><strong>Week 1, free and automatic:<\/strong> secret scanning on the repository and its history, dependency scanning with a policy that blocks only on reachable criticals, and branch protection with review. Nobody has to learn anything and it catches the highest-frequency real issues.<\/li><li><strong>Week 2-4, cheap and targeted:<\/strong> a threat model for the <em>one<\/em> highest-risk component only, timeboxed to ninety minutes with the team in the room. Doing one well teaches the team the method; attempting the whole system teaches them that security is a document.<\/li><li><strong>Ongoing, structural:<\/strong> authentication and authorization moved into shared, hard-to-misuse components, so correctness stops depending on each developer remembering (Q141). This is the highest-value item and the slowest.<\/li><li><strong>Later, once there is trust:<\/strong> a security review gate on defined change types, and a pen test before the release that matters.<\/li><\/ul><p><strong>The framing that gets it accepted:<\/strong> &quot;I am not adding a checklist to your deadline. Everything in the first month is automated and runs without you. The part that needs your time is ninety minutes on the riskiest component, and I will run it.&quot;<\/p>", "source": "answers.md", "search": "you are asked to define the secure sdlc for a team that has none, with a delivery deadline unchanged. the constraint is the point: you cannot introduce six practices into a team shipping to a date. sequence by yield per unit of friction. - week 1, free and automatic: secret scanning on the repository and its history, dependency scanning with a policy that blocks only on reachable criticals, and branch protection with review. nobody has to learn anything and it catches the highest-frequency real issues. - week 2-4, cheap and targeted: a threat model for the one highest-risk component only, timeboxed to ninety minutes with the team in the room. doing one well teaches the team the method; attempting the whole system teaches them that security is a document. - ongoing, structural: authentication and authorization moved into shared, hard-to-misuse components, so correctness stops depending on each developer remembering (q141). this is the highest-value item and the slowest. - later, once there is trust: a security review gate on defined change types, and a pen test before the release that matters. the framing that gets it accepted: \"i am not adding a checklist to your deadline. everything in the first month is automated and runs without you. the part that needs your time is ninety minutes on the riskiest component, and i will run it.\""}, {"n": 147, "category": 10, "difficulty": "A", "html": "Argue for a security investment to a stakeholder whose only metric is delivery speed.", "answerTitle": "Security investment to a delivery-speed stakeholder", "answer": "<p>Translate into their currency and never use fear as the primary argument - it works once and then it is discounted.<\/p><ul><li><strong>Cost of delay versus cost of the incident<\/strong>, expressed as expected value with an honest range: probability, and the concrete cost - engineering weeks of response, customer notification, the contractual and regulatory exposure, and the deals that stall during due diligence. That last one is often the argument that actually lands, because it is a revenue argument.<\/li><li><strong>Reframe as velocity where it is genuinely true.<\/strong> Automated scanning and shared auth components make delivery <em>faster<\/em> by removing a class of rework and a class of blocked release. Say which items are velocity items and which are pure insurance - conflating them destroys the credibility of both.<\/li><li><strong>Ask for a slice, not a program.<\/strong> &quot;Twenty percent of one engineer for a quarter, and here is what will be true at the end of it&quot; beats a security initiative.<\/li><li><strong>Give them the decision, in writing.<\/strong> &quot;Here is what we are accepting if we do not do this.&quot; A stakeholder who declines an explicitly stated risk usually funds the smaller version, and if they do not, the record exists without anyone being blamed.<\/li><\/ul><p><strong>The move that works with a hostile version of this stakeholder:<\/strong> find the item that is both a security win and a delivery win, ship it, and use it as the evidence for the next ask.<\/p>", "source": "answers.md", "search": "argue for a security investment to a stakeholder whose only metric is delivery speed. translate into their currency and never use fear as the primary argument - it works once and then it is discounted. - cost of delay versus cost of the incident , expressed as expected value with an honest range: probability, and the concrete cost - engineering weeks of response, customer notification, the contractual and regulatory exposure, and the deals that stall during due diligence. that last one is often the argument that actually lands, because it is a revenue argument. - reframe as velocity where it is genuinely true. automated scanning and shared auth components make delivery faster by removing a class of rework and a class of blocked release. say which items are velocity items and which are pure insurance - conflating them destroys the credibility of both. - ask for a slice, not a program. \"twenty percent of one engineer for a quarter, and here is what will be true at the end of it\" beats a security initiative. - give them the decision, in writing. \"here is what we are accepting if we do not do this.\" a stakeholder who declines an explicitly stated risk usually funds the smaller version, and if they do not, the record exists without anyone being blamed. the move that works with a hostile version of this stakeholder: find the item that is both a security win and a delivery win, ship it, and use it as the evidence for the next ask."}, {"n": 148, "category": 11, "difficulty": "C", "html": "The problem in a principal-level coding round is usually easy. What is the round actually scoring?", "answerTitle": "What a principal-level coding round scores", "answer": "<p>The problem is easy on purpose. The round is scoring, roughly in order of weight:<\/p><ol><li><strong>Can you still produce working code<\/strong>, without an IDE doing it for you. This is a floor check, and failing it ends the loop regardless of everything else.<\/li><li><strong>How you work with another engineer<\/strong>: do you clarify, do you take a hint, do you think out loud, is it pleasant.<\/li><li><strong>Judgement under a time constraint<\/strong>: what you chose to do first, what you consciously skipped, and whether you said so.<\/li><li><strong>Whether your code would survive review<\/strong>: naming, boundaries, error handling, testability - at a level proportional to the time you had.<\/li><\/ol><p><strong>What it is not scoring:<\/strong> the optimal algorithm, unless the round is explicitly an algorithms round. Candidates at this level lose here by treating an easy problem as a competitive programming exercise, or by being so senior that they narrate architecture instead of typing.<\/p><p><strong>The single most useful behaviour:<\/strong> state your plan in three sentences before typing, and state what you are deliberately not doing.<\/p>", "source": "answers.md", "search": "the problem in a principal-level coding round is usually easy. what is the round actually scoring? the problem is easy on purpose. the round is scoring, roughly in order of weight: 1. can you still produce working code , without an ide doing it for you. this is a floor check, and failing it ends the loop regardless of everything else. 2. how you work with another engineer : do you clarify, do you take a hint, do you think out loud, is it pleasant. 3. judgement under a time constraint : what you chose to do first, what you consciously skipped, and whether you said so. 4. whether your code would survive review : naming, boundaries, error handling, testability - at a level proportional to the time you had. what it is not scoring: the optimal algorithm, unless the round is explicitly an algorithms round. candidates at this level lose here by treating an easy problem as a competitive programming exercise, or by being so senior that they narrate architecture instead of typing. the single most useful behaviour: state your plan in three sentences before typing, and state what you are deliberately not doing."}, {"n": 149, "category": 11, "difficulty": "D", "html": "How do you narrate while coding without slowing to a crawl?", "answerTitle": "Narrating without slowing down", "answer": "<p>Narrate <strong>decisions, not keystrokes<\/strong>. &quot;I am creating a variable called total&quot; is noise; &quot;I am going to keep the counts in a map rather than sorting, because we only need the top one and this stays linear&quot; is signal.<\/p><p>The rhythm that works: talk before each block, then go quiet and type, then talk again. Silence while typing is fine and expected - what interviewers dislike is silence while <em>thinking<\/em>, because they cannot tell whether you are stuck.<\/p><p>Two phrases worth having ready: <strong>&quot;let me think for twenty seconds&quot;<\/strong> - which buys explicit silence without ambiguity - and <strong>&quot;I am going to do the simple thing here and come back to it if we have time&quot;<\/strong>, which converts a shortcut into a stated decision.<\/p><p><strong>When narration genuinely conflicts with progress<\/strong>, say so: &quot;I am going to go quiet for two minutes and get this working, then walk you through it.&quot; Interviewers universally accept this and it is a small positive signal about self-management.<\/p>", "source": "answers.md", "search": "how do you narrate while coding without slowing to a crawl? narrate decisions, not keystrokes . \"i am creating a variable called total\" is noise; \"i am going to keep the counts in a map rather than sorting, because we only need the top one and this stays linear\" is signal. the rhythm that works: talk before each block, then go quiet and type, then talk again. silence while typing is fine and expected - what interviewers dislike is silence while thinking , because they cannot tell whether you are stuck. two phrases worth having ready: \"let me think for twenty seconds\" - which buys explicit silence without ambiguity - and \"i am going to do the simple thing here and come back to it if we have time\" , which converts a shortcut into a stated decision. when narration genuinely conflicts with progress , say so: \"i am going to go quiet for two minutes and get this working, then walk you through it.\" interviewers universally accept this and it is a small positive signal about self-management."}, {"n": 150, "category": 11, "difficulty": "D", "html": "The first three minutes, before you type anything. What happens?", "answerTitle": "The first three minutes, before typing", "answer": "<ul><li><strong>Restate the problem<\/strong> in one sentence and confirm. Thirty seconds.<\/li><li><strong>Ask about the input<\/strong>: size, whether it fits in memory, sorted or not, duplicates, nulls, whether it streams. One of these usually changes the approach and asking is how you find out.<\/li><li><strong>Do one example by hand<\/strong>, including one edge case. This catches a misunderstanding before it costs twenty minutes and it is where the interviewer will help you if you are about to go wrong.<\/li><li><strong>State the approach and its complexity in one sentence<\/strong>, and offer the alternative you rejected: &quot;hash map, linear time and linear space - the sort is <code>n log n<\/code> and constant space, and I would pick that if memory were the constraint.&quot;<\/li><li><strong>State the plan for the time:<\/strong> &quot;I will get a working version, then tests, then handle the edge cases we discussed.&quot;<\/li><\/ul><p><strong>Do not<\/strong> spend more than three or four minutes here. The failure mode at senior level is designing for ten minutes and running out of clock with nothing executable.<\/p>", "source": "answers.md", "search": "the first three minutes, before you type anything. what happens? - restate the problem in one sentence and confirm. thirty seconds. - ask about the input : size, whether it fits in memory, sorted or not, duplicates, nulls, whether it streams. one of these usually changes the approach and asking is how you find out. - do one example by hand , including one edge case. this catches a misunderstanding before it costs twenty minutes and it is where the interviewer will help you if you are about to go wrong. - state the approach and its complexity in one sentence , and offer the alternative you rejected: \"hash map, linear time and linear space - the sort is n log n and constant space, and i would pick that if memory were the constraint.\" - state the plan for the time: \"i will get a working version, then tests, then handle the edge cases we discussed.\" do not spend more than three or four minutes here. the failure mode at senior level is designing for ten minutes and running out of clock with nothing executable."}, {"n": 151, "category": 11, "difficulty": "T", "html": "You see the optimal solution immediately. Do you write it straight away?", "answerTitle": "You see the optimal solution immediately", "answer": "<p>Write it - but <strong>do not skip the reasoning<\/strong>, or the interviewer cannot tell whether you understood it or recognized it.<\/p><blockquote><p>&quot;I have seen this shape before, so I will tell you where I am going rather than pretend to derive it. The trick is <em>[the insight]<\/em>, which works because <em>[why]<\/em>. The naive version is <em>[X]<\/em> time; this gets it to <em>[Y]<\/em> by <em>[the mechanism]<\/em>. Let me write it.&quot;<\/p><\/blockquote><p>Three reasons this is better than silently producing the optimal code: recognizing a memorized solution is worth little and interviewers discount it heavily; stating the insight proves comprehension in ten seconds; and admitting familiarity is honest in a way that reads well.<\/p><p><strong>The other risk:<\/strong> writing the clever version and being unable to explain an edge case in it. If the optimal solution is one you half-remember, write the simple one first, get it working, then optimize - a working simple solution beats a broken clever one in every rubric.<\/p>", "source": "answers.md", "search": "you see the optimal solution immediately. do you write it straight away? write it - but do not skip the reasoning , or the interviewer cannot tell whether you understood it or recognized it. \"i have seen this shape before, so i will tell you where i am going rather than pretend to derive it. the trick is [the insight] , which works because [why] . the naive version is [x] time; this gets it to [y] by [the mechanism] . let me write it.\" three reasons this is better than silently producing the optimal code: recognizing a memorized solution is worth little and interviewers discount it heavily; stating the insight proves comprehension in ten seconds; and admitting familiarity is honest in a way that reads well. the other risk: writing the clever version and being unable to explain an edge case in it. if the optimal solution is one you half-remember, write the simple one first, get it working, then optimize - a working simple solution beats a broken clever one in every rubric."}, {"n": 152, "category": 11, "difficulty": "D", "html": "Tests in a 45-minute coding round: how many, and when do you write them?", "answerTitle": "Tests in a 45-minute round", "answer": "<p><strong>Write one test early<\/strong>, before the implementation is complete - it costs two minutes, it demonstrates the habit, and it gives you a way to run the code. Then finish the implementation, then add the edge cases as tests rather than as print statements.<\/p><p>What to test, in priority order: the happy path, the empty or null input, the boundary (one element, duplicate keys, the exact limit), and the error path if there is one. Four small tests is plenty and each should be one assertion with a name that says what it proves.<\/p><p><strong>What not to do:<\/strong> build a test framework, parameterize everything, or write tests for code you have not written yet in a round this short. Also do not say &quot;and of course I would write tests&quot; without writing one - it is the emptiest sentence available in this round.<\/p><p><strong>If you run out of time:<\/strong> say what you would test and why, specifically. &quot;I would want a test for the concurrent case, which I have not handled - it would need a latch rather than a sleep&quot; scores far better than silence.<\/p>", "source": "answers.md", "search": "tests in a 45-minute coding round: how many, and when do you write them? write one test early , before the implementation is complete - it costs two minutes, it demonstrates the habit, and it gives you a way to run the code. then finish the implementation, then add the edge cases as tests rather than as print statements. what to test, in priority order: the happy path, the empty or null input, the boundary (one element, duplicate keys, the exact limit), and the error path if there is one. four small tests is plenty and each should be one assertion with a name that says what it proves. what not to do: build a test framework, parameterize everything, or write tests for code you have not written yet in a round this short. also do not say \"and of course i would write tests\" without writing one - it is the emptiest sentence available in this round. if you run out of time: say what you would test and why, specifically. \"i would want a test for the concurrent case, which i have not handled - it would need a latch rather than a sleep\" scores far better than silence."}, {"n": 153, "category": 11, "difficulty": "D", "html": "Naming, structure and error handling under time pressure. What do you keep and what do you consciously drop?", "answerTitle": "What to keep and drop under time pressure", "answer": "<p><strong>Keep:<\/strong> meaningful names, small functions, and a clear boundary between the logic and the IO. These cost nothing and they are what the interviewer is reading for review quality.<\/p><p><strong>Drop, and say that you are dropping them:<\/strong> exhaustive input validation, custom exception types, logging, configuration, javadoc, defensive copies everywhere.<\/p><p>The mechanism that makes dropping safe is the sentence: <strong>&quot;in production I would validate here and throw a typed exception; I am going to skip it for time and assume valid input.&quot;<\/strong> Said once, it converts a gap into evidence of judgement. Left unsaid, it is a gap.<\/p><p><strong>The one thing never to drop:<\/strong> error handling on the path where failure is <em>likely and silent<\/em> - a parse, a missing key, a division. Silent wrong answers are the worst outcome in a review, and an interviewer will notice that you handled the one that mattered and skipped the ones that did not.<\/p>", "source": "answers.md", "search": "naming, structure and error handling under time pressure. what do you keep and what do you consciously drop? keep: meaningful names, small functions, and a clear boundary between the logic and the io. these cost nothing and they are what the interviewer is reading for review quality. drop, and say that you are dropping them: exhaustive input validation, custom exception types, logging, configuration, javadoc, defensive copies everywhere. the mechanism that makes dropping safe is the sentence: \"in production i would validate here and throw a typed exception; i am going to skip it for time and assume valid input.\" said once, it converts a gap into evidence of judgement. left unsaid, it is a gap. the one thing never to drop: error handling on the path where failure is likely and silent - a parse, a missing key, a division. silent wrong answers are the worst outcome in a review, and an interviewer will notice that you handled the one that mattered and skipped the ones that did not."}, {"n": 154, "category": 11, "difficulty": "T", "html": "You are stuck at minute 25. What do you do, in order?", "answerTitle": "Stuck at minute 25", "answer": "<p>In order:<\/p><ol><li><strong>Say it.<\/strong> &quot;I am stuck - let me tell you where.&quot; Interviewers are usually allowed to help and cannot until you surface it. Hiding it burns the remaining time and scores worse than the stuck-ness itself.<\/li><li><strong>Re-read the problem statement aloud.<\/strong> A meaningful share of stuck-ness is a misread constraint, and this takes twenty seconds.<\/li><li><strong>Run the smallest failing example by hand<\/strong> and compare against what your code does. Do not stare at the code; execute it mentally with real values, or add a print and actually run it.<\/li><li><strong>Reduce the problem.<\/strong> Solve it for one element, or for the unsorted case, or without the constraint that is causing trouble - and say &quot;let me get the restricted version working and then generalize&quot;.<\/li><li><strong>Take the hint.<\/strong> If the interviewer offers one, take it visibly and gracefully: &quot;that helps - so if I <em>[X]<\/em>, then <em>[Y]<\/em> follows.&quot; Refusing help is a serious negative; using it well is a positive.<\/li><\/ol><p><strong>What not to do:<\/strong> go silent, start rewriting from scratch at minute 30, or apologize repeatedly. One acknowledgement, then work.<\/p>", "source": "answers.md", "search": "you are stuck at minute 25. what do you do, in order? in order: 1. say it. \"i am stuck - let me tell you where.\" interviewers are usually allowed to help and cannot until you surface it. hiding it burns the remaining time and scores worse than the stuck-ness itself. 2. re-read the problem statement aloud. a meaningful share of stuck-ness is a misread constraint, and this takes twenty seconds. 3. run the smallest failing example by hand and compare against what your code does. do not stare at the code; execute it mentally with real values, or add a print and actually run it. 4. reduce the problem. solve it for one element, or for the unsorted case, or without the constraint that is causing trouble - and say \"let me get the restricted version working and then generalize\". 5. take the hint. if the interviewer offers one, take it visibly and gracefully: \"that helps - so if i [x] , then [y] follows.\" refusing help is a serious negative; using it well is a positive. what not to do: go silent, start rewriting from scratch at minute 30, or apologize repeatedly. one acknowledgement, then work."}, {"n": 155, "category": 11, "difficulty": "D", "html": "The interviewer suggests an approach you believe is wrong, while you are coding. How do you handle it?", "answerTitle": "The interviewer suggests an approach you think is wrong", "answer": "<p>Do not argue, and do not silently comply. <strong>Test it cheaply, out loud.<\/strong><\/p><blockquote><p>&quot;Let me make sure I follow - you are suggesting <em>[restate it]<\/em>. My hesitation is <em>[the specific concern]<\/em>, on this input: <em>[a concrete example where it fails or costs more]<\/em>. Am I missing something, or would you like me to go that way anyway?&quot;<\/p><\/blockquote><p>Three outcomes, all fine: they show you why you are wrong and you have learned something in front of them; they realize you are right and you have demonstrated the exact judgement they were testing for; or they say &quot;go that way anyway&quot;, in which case you <strong>do it, willingly and without sulking<\/strong>, which is Q184&#x27;s disagree-and-commit in miniature.<\/p><p><strong>The version that loses the round<\/strong> is either implementing something you think is wrong while making clear you think so, or debating for four minutes of a forty-five minute round. Timebox the disagreement to about a minute.<\/p>", "source": "answers.md", "search": "the interviewer suggests an approach you believe is wrong, while you are coding. how do you handle it? do not argue, and do not silently comply. test it cheaply, out loud. \"let me make sure i follow - you are suggesting [restate it] . my hesitation is [the specific concern] , on this input: [a concrete example where it fails or costs more] . am i missing something, or would you like me to go that way anyway?\" three outcomes, all fine: they show you why you are wrong and you have learned something in front of them; they realize you are right and you have demonstrated the exact judgement they were testing for; or they say \"go that way anyway\", in which case you do it, willingly and without sulking , which is q184's disagree-and-commit in miniature. the version that loses the round is either implementing something you think is wrong while making clear you think so, or debating for four minutes of a forty-five minute round. timebox the disagreement to about a minute."}, {"n": 156, "category": 11, "difficulty": "D", "html": "Complexity analysis: when do you volunteer it, and how precise does it need to be?", "answerTitle": "Complexity analysis: when and how precise", "answer": "<p><strong>Volunteer it once<\/strong>, when you state the approach (Q150), and again briefly at the end if the implementation changed it. Do not wait to be asked - being asked means you looked like someone who does not think about it.<\/p><p>Precision needed: the big-O for time and space, and <strong>the variable it is in<\/strong> - which is the part people get wrong. &quot;Linear&quot; is meaningless if there are two inputs; &quot;linear in the number of events, constant in the number of users, because the map is bounded by the user count which is fixed&quot; is the answer.<\/p><p>The refinements worth having: amortized versus worst case where they differ (hash map resizing, dynamic arrays); the constant factor when it actually matters (two passes over an array beats one pass with a hash map at small n and interviewers like hearing that); and the space cost of the recursion stack, which candidates routinely forget to count.<\/p><p><strong>If you are unsure:<\/strong> derive it out loud from the loop structure rather than guessing a symbol.<\/p>", "source": "answers.md", "search": "complexity analysis: when do you volunteer it, and how precise does it need to be? volunteer it once , when you state the approach (q150), and again briefly at the end if the implementation changed it. do not wait to be asked - being asked means you looked like someone who does not think about it. precision needed: the big-o for time and space, and the variable it is in - which is the part people get wrong. \"linear\" is meaningless if there are two inputs; \"linear in the number of events, constant in the number of users, because the map is bounded by the user count which is fixed\" is the answer. the refinements worth having: amortized versus worst case where they differ (hash map resizing, dynamic arrays); the constant factor when it actually matters (two passes over an array beats one pass with a hash map at small n and interviewers like hearing that); and the space cost of the recursion stack, which candidates routinely forget to count. if you are unsure: derive it out loud from the loop structure rather than guessing a symbol."}, {"n": 157, "category": 11, "difficulty": "D", "html": "A pairing round on their real codebase. How do you start, and what do you ask for?", "answerTitle": "A pairing round on their real codebase", "answer": "<p>Start by <strong>establishing the map, then the smallest possible loop<\/strong>, and ask for what you need without apology.<\/p><blockquote><p>&quot;Before I change anything: can you show me how you run the tests, and can we run them once so I know they pass? Then - what is this component&#x27;s job in one sentence, and where does this ticket&#x27;s behaviour live?&quot;<\/p><\/blockquote><p>Then work in visibly small steps: find the existing pattern and follow it rather than importing your own; make one change; run the test; narrate what you expect before you run it. Reading the surrounding code and matching its conventions is a deliberately visible behaviour here, because the round is partly asking &quot;what would this person do to our codebase in week one&quot;.<\/p><p><strong>High-value questions to ask:<\/strong> &quot;is there an existing helper for this?&quot;, &quot;what does this codebase do for <em>[errors / config / logging]<\/em>?&quot;, &quot;would your team want this here or in the service layer?&quot;<\/p><p><strong>Red flags:<\/strong> rewriting something because you would have done it differently, criticizing the code, or refusing to touch anything without a full understanding of the system.<\/p>", "source": "answers.md", "search": "a pairing round on their real codebase. how do you start, and what do you ask for? start by establishing the map, then the smallest possible loo
