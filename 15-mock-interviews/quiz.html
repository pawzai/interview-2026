sengagement, and it is the most common cause of a short tenure that then costs you on the next resume."}, {"n": 218, "category": 15, "difficulty": "D", "html": "How do you evaluate an offer against the one thing you actually want next?", "answerTitle": "Evaluating an offer against what you actually want", "answer": "<p>Decide <strong>the one thing<\/strong> before you have offers, or comparison becomes rationalization.<\/p><p>At nineteen years the candidates are usually: scope and decision rights; learning in a specific direction (AI depth, scale, a new domain); people you want to work with and learn from; total compensation; stability; or time. <strong>Pick one primary and one secondary, write them down, and score offers against those<\/strong> rather than against each other.<\/p><p>Then apply three tests: the <strong>twelve-month test<\/strong> - what will be true about you in a year that is not true now, and is that the direction you want; the <strong>regret test<\/strong> - which decision would you be more annoyed about in two years; and the <strong>downside test<\/strong> - if the role is worse than advertised, what have you still gained? A role that pays well and teaches you nothing fails the last one badly.<\/p><p><strong>The trap<\/strong> is comparing on the dimension that is easiest to measure. Compensation is a single number and scope is a paragraph, so compensation dominates spreadsheets - which is precisely why the primary criterion has to be written down first.<\/p>", "source": "answers.md", "search": "how do you evaluate an offer against the one thing you actually want next? decide the one thing before you have offers, or comparison becomes rationalization. at nineteen years the candidates are usually: scope and decision rights; learning in a specific direction (ai depth, scale, a new domain); people you want to work with and learn from; total compensation; stability; or time. pick one primary and one secondary, write them down, and score offers against those rather than against each other. then apply three tests: the twelve-month test - what will be true about you in a year that is not true now, and is that the direction you want; the regret test - which decision would you be more annoyed about in two years; and the downside test - if the role is worse than advertised, what have you still gained? a role that pays well and teaches you nothing fails the last one badly. the trap is comparing on the dimension that is easiest to measure. compensation is a single number and scope is a paragraph, so compensation dominates spreadsheets - which is precisely why the primary criterion has to be written down first."}, {"n": 219, "category": 15, "difficulty": "D", "html": "Declining an offer while keeping the door genuinely open.", "answerTitle": "Declining while keeping the door open", "answer": "<p>Fast, direct, warm, and without a critique. Slow declines and vague ones are what damage relationships, not the decline itself.<\/p><blockquote><p>&quot;Thank you - and thank you for the way the whole process was run, which I genuinely appreciated. I have decided to accept another role; the deciding factor was <em>[a true, non-comparative reason - the domain, the scope, the timing]<\/em>. I have enjoyed the conversations with you and <em>[name]<\/em>, and I would like to stay in touch. If things change on either side, I would be glad to talk again.&quot;<\/p><\/blockquote><p>The mechanics: <strong>tell them by phone or a call if you have built a relationship with the manager<\/strong>, then confirm by email; do it as soon as you have decided rather than at the deadline; give a reason that is true but not a comparison (&quot;the other offer paid more&quot; invites a counter and a negotiation you have already decided against); and do not offer feedback on their process unless asked, in which case be brief and kind.<\/p><p><strong>The genuinely valuable follow-through:<\/strong> connect with the manager afterwards and stay in touch once or twice a year. A large share of senior roles come from exactly this - a manager who liked you two years ago.<\/p>", "source": "answers.md", "search": "declining an offer while keeping the door genuinely open. fast, direct, warm, and without a critique. slow declines and vague ones are what damage relationships, not the decline itself. \"thank you - and thank you for the way the whole process was run, which i genuinely appreciated. i have decided to accept another role; the deciding factor was [a true, non-comparative reason - the domain, the scope, the timing] . i have enjoyed the conversations with you and [name] , and i would like to stay in touch. if things change on either side, i would be glad to talk again.\" the mechanics: tell them by phone or a call if you have built a relationship with the manager , then confirm by email; do it as soon as you have decided rather than at the deadline; give a reason that is true but not a comparison (\"the other offer paid more\" invites a counter and a negotiation you have already decided against); and do not offer feedback on their process unless asked, in which case be brief and kind. the genuinely valuable follow-through: connect with the manager afterwards and stay in touch once or twice a year. a large share of senior roles come from exactly this - a manager who liked you two years ago."}, {"n": 220, "category": 15, "difficulty": "D", "html": "What do you do in the two weeks between the final round and the decision?", "answerTitle": "The two weeks between the loop and the decision", "answer": "<ul><li><strong>Keep other processes alive.<\/strong> Nothing weakens your position or your judgement like a single option, and momentum is expensive to rebuild if this falls through.<\/li><li><strong>Do the diligence you could not do while selling yourself:<\/strong> talk to people who have left, read the engineering blog and check whether the practices described match what you were told, look at their public repositories and job postings for what they are really building.<\/li><li><strong>Prepare the negotiation<\/strong> while you are unemotional (Q215, Q218). Write down your number and your primary criterion now, not after the offer arrives.<\/li><li><strong>Follow up once, at the point they said they would decide<\/strong> - not before. One short message, no chasing.<\/li><li><strong>Debrief yourself while it is fresh.<\/strong> Write down every question you were asked and every answer you were unhappy with; this is the most valuable input to your next loop and it evaporates in a week.<\/li><li><strong>Do not spiral.<\/strong> Reading the silence is not a source of information. Assume nothing until they tell you, and use the fortnight on the two items above.<\/li><\/ul>", "source": "answers.md", "search": "what do you do in the two weeks between the final round and the decision? - keep other processes alive. nothing weakens your position or your judgement like a single option, and momentum is expensive to rebuild if this falls through. - do the diligence you could not do while selling yourself: talk to people who have left, read the engineering blog and check whether the practices described match what you were told, look at their public repositories and job postings for what they are really building. - prepare the negotiation while you are unemotional (q215, q218). write down your number and your primary criterion now, not after the offer arrives. - follow up once, at the point they said they would decide - not before. one short message, no chasing. - debrief yourself while it is fresh. write down every question you were asked and every answer you were unhappy with; this is the most valuable input to your next loop and it evaporates in a week. - do not spiral. reading the silence is not a source of information. assume nothing until they tell you, and use the fortnight on the two items above."}, {"n": 221, "category": 15, "difficulty": "A", "html": "Design your own ten-day final ramp before a loop you care about, using these packs.", "answerTitle": "A ten-day final ramp", "answer": "<p>The constraint: ten days, a job, and no time for new material. <strong>This is a consolidation and rehearsal plan, not a learning plan<\/strong> - saying that is half the answer.<\/p><table><thead><tr><th>Days<\/th><th>Focus<\/th><th>Output<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>The specific loop: research the company&#x27;s stack and problems, then map which packs it will draw on and pick the three most likely rounds<\/td><td>A one-page target list. Everything after this is aimed at it<\/td><\/tr><tr><td>2-3<\/td><td>Cheatsheets only, for the three target packs, plus <a href=\"cheatsheet.md\">cheatsheet.md<\/a> here. Speak the answers rather than reading them<\/td><td>A list of the ten things that came out hesitantly<\/td><\/tr><tr><td>4<\/td><td>Those ten weak points, from the relevant <code>answers.md<\/code>. No breadth<\/td><td>The gaps closed or explicitly abandoned<\/td><\/tr><tr><td>5<\/td><td>Two full design rounds, recorded, timed, no pausing (Q72-Q77)<\/td><td>Self-scored with the rubric in <a href=\"mocks/scoring-sheet.md\">mocks/scoring-sheet.md<\/a><\/td><\/tr><tr><td>6<\/td><td>Story bank: five stories at two minutes and at six, out loud, with the numbers (Q185)<\/td><td>A one-page number sheet for the day<\/td><\/tr><tr><td>7<\/td><td>One full loop from <a href=\"mocks/README.md\">mocks/<\/a>, end to end, with the breaks<\/td><td>The list of what degraded in the afternoon (Q204)<\/td><\/tr><tr><td>8<\/td><td>The single weakest round from day 7, re-run with a different question<\/td><td>-<\/td><\/tr><tr><td>9<\/td><td>Reverse interview and negotiation rehearsal (Q208, Q214), plus logistics: kit, links, room, water, printed number sheet<\/td><td>Questions written per interviewer<\/td><\/tr><tr><td>10<\/td><td>Light. Re-read the cheatsheets once, one two-minute story, sleep<\/td><td>-<\/td><\/tr><\/tbody><\/table><p><strong>The rules that make it work:<\/strong> no new topics after day 4; everything spoken, nothing read silently; and day 10 is deliberately light, because cramming the day before degrades the afternoon rounds more than the extra material helps.<\/p>", "source": "answers.md", "search": "design your own ten-day final ramp before a loop you care about, using these packs. the constraint: ten days, a job, and no time for new material. this is a consolidation and rehearsal plan, not a learning plan - saying that is half the answer. days focus output --- --- --- 1 the specific loop: research the company's stack and problems, then map which packs it will draw on and pick the three most likely rounds a one-page target list. everything after this is aimed at it 2-3 cheatsheets only, for the three target packs, plus cheatsheet.md here. speak the answers rather than reading them a list of the ten things that came out hesitantly 4 those ten weak points, from the relevant answers.md. no breadth the gaps closed or explicitly abandoned 5 two full design rounds, recorded, timed, no pausing (q72-q77) self-scored with the rubric in mocks/scoring-sheet.md 6 story bank: five stories at two minutes and at six, out loud, with the numbers (q185) a one-page number sheet for the day 7 one full loop from mocks/, end to end, with the breaks the list of what degraded in the afternoon (q204) 8 the single weakest round from day 7, re-run with a different question - 9 reverse interview and negotiation rehearsal (q208, q214), plus logistics: kit, links, room, water, printed number sheet questions written per interviewer 10 light. re-read the cheatsheets once, one two-minute story, sleep - the rules that make it work: no new topics after day 4; everything spoken, nothing read silently; and day 10 is deliberately light, because cramming the day before degrades the afternoon rounds more than the extra material helps."}, {"n": 222, "category": 15, "difficulty": "A", "html": "Write your &quot;what I want from the next role&quot; statement and defend it under hostile questioning.", "answerTitle": "Your \"what I want next\" statement, defended", "answer": "<p>The statement is two or three sentences, specific enough to exclude things:<\/p><blockquote><p>&quot;I want a principal role where the architecture direction and the engineering standards across several teams are mine to own, in a system big enough that the decisions have consequences. I want the AI work to be part of the mandate rather than something I create room for, and I want to be technically hands-on enough that I keep the credibility to make those calls. What I am not looking for is a management track or a single-team scope.&quot;<\/p><\/blockquote><p><strong>The hostile questions it must survive<\/strong>, and the honest answers:<\/p><ul><li><em>&quot;That sounds like a management job you do not want the accountability for.&quot;<\/em> No - the accountability I want is for the technical outcome and the standard. I have carried the pager and I have owned failures; what I do not want is headcount and performance management, and those are different things (Q19).<\/li><li><em>&quot;What if the standards work is fifty percent politics?&quot;<\/em> It always is, and that is not a complaint - influence without authority is the job, and the evidence that I can do it is <em>[the artifact that outlived me]<\/em> (Q180).<\/li><li><em>&quot;Everyone says they want scope. Why should we give it to you on day one?&quot;<\/em> You should not. I would expect to earn it in the first ninety days by delivering something visible (Q22), and I would expect you to hold me to that.<\/li><li><em>&quot;What if the AI work dries up?&quot;<\/em> Then I want to be somewhere with the other two things, which is why the scope clause comes first in that sentence. The AI part is where I want to grow, not the condition of my joining.<\/li><li><em>&quot;Is this really about compensation?&quot;<\/em> No, and I will be straight that compensation matters - but the thing that would make me leave a well-paid role is scope, and it is the thing I would leave <em>for<\/em> (Q218).<\/li><\/ul><p><strong>The test of the statement:<\/strong> if it does not exclude any real job, it is not a statement, it is a wish. The exclusions are what make it credible under questioning.<\/p>", "source": "answers.md", "search": "write your \"what i want from the next role\" statement and defend it under hostile questioning. the statement is two or three sentences, specific enough to exclude things: \"i want a principal role where the architecture direction and the engineering standards across several teams are mine to own, in a system big enough that the decisions have consequences. i want the ai work to be part of the mandate rather than something i create room for, and i want to be technically hands-on enough that i keep the credibility to make those calls. what i am not looking for is a management track or a single-team scope.\" the hostile questions it must survive , and the honest answers: - \"that sounds like a management job you do not want the accountability for.\" no - the accountability i want is for the technical outcome and the standard. i have carried the pager and i have owned failures; what i do not want is headcount and performance management, and those are different things (q19). - \"what if the standards work is fifty percent politics?\" it always is, and that is not a complaint - influence without authority is the job, and the evidence that i can do it is [the artifact that outlived me] (q180). - \"everyone says they want scope. why should we give it to you on day one?\" you should not. i would expect to earn it in the first ninety days by delivering something visible (q22), and i would expect you to hold me to that. - \"what if the ai work dries up?\" then i want to be somewhere with the other two things, which is why the scope clause comes first in that sentence. the ai part is where i want to grow, not the condition of my joining. - \"is this really about compensation?\" no, and i will be straight that compensation matters - but the thing that would make me leave a well-paid role is scope, and it is the thing i would leave for (q218). the test of the statement: if it does not exclude any real job, it is not a statement, it is a wish. the exclusions are what make it credible under questioning."}], "difficulty": {"C": "Core", "D": "Deep", "T": "Tricky", "A": "Architect"}, "difficultyHint": {"C": "You must answer this instantly and correctly.", "D": "Requires mechanism-level detail.", "T": "The obvious answer is usually wrong.", "A": "Judged on trade-off reasoning."}}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STORE = "interview-progress-15-mock-interviews-v1";
  var THEME_KEY = "interview-quiz-theme";
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { progress = {}; }

  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var searchBox = document.getElementById("search");
  var categoryBox = document.getElementById("category");
  var statusBox = document.getElementById("status");
  var activeDifficulty = new Set();

  var catTitle = {};
  DATA.categories.forEach(function (c) {
    catTitle[c.index] = c.index + ". " + c.title;
    var opt = document.createElement("option");
    opt.value = c.index;
    opt.textContent = catTitle[c.index];
    categoryBox.appendChild(opt);
  });

  var legend = document.getElementById("legend");
  var diffFilters = document.getElementById("diffFilters");
  Object.keys(DATA.difficulty).forEach(function (key) {
    var span = document.createElement("span");
    span.className = "pill " + key;
    span.textContent = DATA.difficulty[key];
    span.title = DATA.difficultyHint[key];
    legend.appendChild(span);

    var btn = document.createElement("button");
    btn.textContent = DATA.difficulty[key];
    btn.dataset.diff = key;
    btn.addEventListener("click", function () {
      if (activeDifficulty.has(key)) { activeDifficulty.delete(key); btn.classList.remove("on"); }
      else { activeDifficulty.add(key); btn.classList.add("on"); }
      render();
    });
    diffFilters.appendChild(btn);
  });

  var KEYWORDS = /\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|record|return|sealed|short|static|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while|yield|true|false|null)\b/g;

  function highlight(root) {
    root.querySelectorAll("pre code").forEach(function (block) {
      var text = block.textContent;
      var slots = [];
      function keep(cls) {
        return function (m) { slots.push('<span class="' + cls + '">' + esc(m) + "</span>"); return "\u0000" + (slots.length - 1) + "\u0000"; };
      }
      text = text.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, keep("tok-com"));
      text = text.replace(/"(?:\\.|[^"\\])*"/g, keep("tok-str"));
      text = text.replace(/@\w+/g, keep("tok-ann"));
      text = esc(text).replace(KEYWORDS, '<span class="tok-kw">$&</span>');
      block.innerHTML = text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return slots[+i]; });
    });
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function markHits(root, term) {
    if (!term) return;
    var rx = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.trim() && rx.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
      rx.lastIndex = 0;
    }
    nodes.forEach(function (node) {
      var span = document.createElement("span");
      span.innerHTML = esc(node.nodeValue).replace(rx, "<mark>$1</mark>");
      node.parentNode.replaceChild(span, node);
    });
  }

  function statusOf(n) { return progress[n] || "unseen"; }

  function setStatus(n, value) {
    if (statusOf(n) === value) delete progress[n]; else progress[n] = value;
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    render();
  }

  function card(q, term) {
    var el = document.createElement("article");
    el.className = "q";
    el.id = "q" + q.n;
    el.dataset.status = statusOf(q.n);

    var head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML =
      '<a class="q-num" href="#q' + q.n + '">Q' + q.n + "</a>" +
      (q.difficulty ? '<span class="pill ' + q.difficulty + '" title="' + DATA.difficultyHint[q.difficulty] + '">' + DATA.difficulty[q.difficulty] + "</span>" : "") +
      '<h3 class="q-text">' + q.html + "</h3>";
    el.appendChild(head);

    var actions = document.createElement("div");
    actions.className = "q-actions";
    [["known", "Known"], ["review", "Review"]].forEach(function (pair) {
      var b = document.createElement("button");
      b.textContent = pair[1];
      if (statusOf(q.n) === pair[0]) b.classList.add("on");
      b.addEventListener("click", function () { setStatus(q.n, pair[0]); });
      actions.appendChild(b);
    });
    if (q.source) {
      var src = document.createElement("span");
      src.className = "src";
      src.textContent = q.source;
      actions.appendChild(src);
    }
    el.appendChild(actions);

    var details = document.createElement("details");
    details.className = "ans";
    var summary = document.createElement("summary");
    summary.textContent = q.source ? "Show answer" : "How to answer this";
    details.appendChild(summary);

    var body = document.createElement("div");
    body.className = "ans-body";
    body.innerHTML = '<p class="ans-title">' + esc(q.answerTitle) + '</p><div class="md">' + q.answer + "</div>";
    details.appendChild(body);
    el.appendChild(details);

    var rendered = false;
    details.addEventListener("toggle", function () {
      if (details.open && !rendered) { rendered = true; highlight(body); markHits(body, term); }
    });

    return el;
  }

  function render() {
    var term = searchBox.value.trim().toLowerCase();
    var cat = categoryBox.value;
    var status = statusBox.value;

    var matches = DATA.questions.filter(function (q) {
      if (term && q.search.indexOf(term) === -1) return false;
      if (cat && String(q.category) !== cat) return false;
      if (activeDifficulty.size && !activeDifficulty.has(q.difficulty)) return false;
      if (status && statusOf(q.n) !== status) return false;
      return true;
    });

    list.textContent = "";
    var lastCategory = null;
    matches.forEach(function (q) {
      if (q.category !== lastCategory) {
        lastCategory = q.category;
        var h = document.createElement("h2");
        h.className = "cat";
        h.textContent = catTitle[q.category];
        list.appendChild(h);
      }
      list.appendChild(card(q, term));
    });

    empty.hidden = matches.length > 0;

    var total = DATA.questions.length;
    var known = 0, review = 0;
    DATA.questions.forEach(function (q) {
      if (statusOf(q.n) === "known") known++;
      else if (statusOf(q.n) === "review") review++;
    });
    document.getElementById("barKnown").style.width = (known / total * 100) + "%";
    document.getElementById("barReview").style.width = (review / total * 100) + "%";
    document.getElementById("stats").innerHTML =
      "<b>" + matches.length + "</b> shown of " + total + " &nbsp;·&nbsp; " +
      "<b>" + known + "</b> known &nbsp;·&nbsp; <b>" + review + "</b> to review &nbsp;·&nbsp; " +
      "<b>" + (total - known - review) + "</b> not marked";
  }

  searchBox.addEventListener("input", render);
  categoryBox.addEventListener("change", render);
  statusBox.addEventListener("change", render);

  document.getElementById("expandAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = true; });
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = false; });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all Known / Review marks?")) return;
    progress = {};
    try { localStorage.removeItem(STORE); } catch (e) {}
    render();
  });

  var themeBtn = document.getElementById("theme");
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  applyTheme(savedTheme || "dark");
  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
    if (e.key === "Escape" && document.activeElement === searchBox) { searchBox.value = ""; render(); searchBox.blur(); }
  });

  render();

  if (location.hash) {
    var target = document.querySelector(location.hash);
    if (target) { target.scrollIntoView(); var d = target.querySelector("details.ans"); if (d) d.open = true; }
  }
})();
</script>
</body>
</html>
