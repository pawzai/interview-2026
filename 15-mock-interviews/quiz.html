 off the request path onto a queue, checking whether the cost is actually index maintenance, or a write-optimized store]<\/em>. If there is a hot read set inside this - say the same thousand rows are read constantly - then a cache in front of that specific path is worth it, and we can measure that from the query stats.&quot;<\/p><\/blockquote><p><strong>The structure:<\/strong> a question that produces the disconfirming number, the mechanism explaining why the instinct fails, an alternative, and a version of their idea that would work. That last part matters - people accept redirection much better when part of their suggestion survives.<\/p>", "source": "answers.md", "search": "the interviewer proposes caching as the fix for a write-heavy problem. how do you redirect without contradicting them flatly? redirect by asking for the number, not by contradicting. \"possibly - can i check the read-write ratio first? … if it is closer to one-to-one, a cache is going to be mostly misses and mostly invalidation, and we will have added a consistency problem without buying much. what i would look at instead for a write-bound workload is [batching the writes, moving them off the request path onto a queue, checking whether the cost is actually index maintenance, or a write-optimized store] . if there is a hot read set inside this - say the same thousand rows are read constantly - then a cache in front of that specific path is worth it, and we can measure that from the query stats.\" the structure: a question that produces the disconfirming number, the mechanism explaining why the instinct fails, an alternative, and a version of their idea that would work. that last part matters - people accept redirection much better when part of their suggestion survives."}, {"n": 99, "category": 7, "difficulty": "D", "html": "Schema migration on a live system: what detail proves you have actually done it?", "answerTitle": "Live schema migration - the detail that proves it", "answer": "<p>The proof is knowing that the <strong>deploy sequence is the migration<\/strong>, and that it is more than one release.<\/p><blockquote><p>&quot;Expand and contract, and it is at least three deploys. Deploy one adds the new column, nullable, with no constraint - and if the table is large I add the index concurrently, because a plain <code>CREATE INDEX<\/code> takes a lock that will take the site down. Deploy two writes both old and new, and backfills in batches with a sleep between them, watching replication lag - the backfill is the part that causes the incident, not the DDL. Deploy three reads from the new column. Deploy four stops writing the old one, and only much later do I drop it, because the rollback of deploy three has to be possible for a week, not for an hour.&quot;<\/p><\/blockquote><p><strong>The specific details that mark experience:<\/strong> <code>CREATE INDEX CONCURRENTLY<\/code>, batching with a lag check, adding a <code>NOT NULL<\/code> constraint as <code>NOT VALID<\/code> and validating separately, a lock timeout on the DDL so a migration cannot queue behind a long transaction and block everything, and the fact that the drop happens weeks later.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Category 12.<\/p>", "source": "answers.md", "search": "schema migration on a live system: what detail proves you have actually done it? the proof is knowing that the deploy sequence is the migration , and that it is more than one release. \"expand and contract, and it is at least three deploys. deploy one adds the new column, nullable, with no constraint - and if the table is large i add the index concurrently, because a plain create index takes a lock that will take the site down. deploy two writes both old and new, and backfills in batches with a sleep between them, watching replication lag - the backfill is the part that causes the incident, not the ddl. deploy three reads from the new column. deploy four stops writing the old one, and only much later do i drop it, because the rollback of deploy three has to be possible for a week, not for an hour.\" the specific details that mark experience: create index concurrently, batching with a lag check, adding a not null constraint as not valid and validating separately, a lock timeout on the ddl so a migration cannot queue behind a long transaction and block everything, and the fact that the drop happens weeks later. depth: ../06-database category 12."}, {"n": 100, "category": 7, "difficulty": "D", "html": "Replication lag: which anecdote lands, and what number must be in it?", "answerTitle": "The replication lag anecdote", "answer": "<p>Needs a number, a user-visible symptom, and a fix that is not &quot;add more replicas&quot;.<\/p><blockquote><p>&quot;We had users creating a record and then getting a 404 on the redirect, at maybe one in fifty. The reads were going to a replica and the lag was normally under twenty milliseconds but spiked to several seconds during the nightly batch. Two fixes: read-your-own-writes routing, so a request from a user who has written in the last few seconds goes to the primary, and separately we moved the batch off the primary. The permanent change was that lag became an SLI with an alert, rather than a number someone looked at during an incident.&quot;<\/p><\/blockquote><p><strong>What it demonstrates:<\/strong> you know lag is a correctness problem and not a performance problem, you know the routing fix (Q56), and you found the cause of the lag rather than tolerating it.<\/p>", "source": "answers.md", "search": "replication lag: which anecdote lands, and what number must be in it? needs a number, a user-visible symptom, and a fix that is not \"add more replicas\". \"we had users creating a record and then getting a 404 on the redirect, at maybe one in fifty. the reads were going to a replica and the lag was normally under twenty milliseconds but spiked to several seconds during the nightly batch. two fixes: read-your-own-writes routing, so a request from a user who has written in the last few seconds goes to the primary, and separately we moved the batch off the primary. the permanent change was that lag became an sli with an alert, rather than a number someone looked at during an incident.\" what it demonstrates: you know lag is a correctness problem and not a performance problem, you know the routing fix (q56), and you found the cause of the lag rather than tolerating it."}, {"n": 101, "category": 7, "difficulty": "T", "html": "&quot;How big can PostgreSQL get?&quot; How do you answer a question with no correct number?", "answerTitle": "\"How big can PostgreSQL get?\"", "answer": "<p>There is no correct number, and the interviewer knows. They are testing whether you <strong>reframe into the variables<\/strong> rather than guessing.<\/p><blockquote><p>&quot;I would not answer in terabytes, because the limit is never the size - it is the workload. The things that actually break first, roughly in order: write throughput on a single primary, because there is one; the working set no longer fitting in memory, at which point the p99 changes character rather than degrading smoothly; vacuum and bloat on a high-churn table; index maintenance on wide tables; and the operational limits - how long a restore takes, how long a major version upgrade takes, how long an index build takes. I have seen single instances in the multi-terabyte range work perfectly well because the hot set was small and the writes were modest, and I have seen a two-hundred-gigabyte database in trouble because it was write-hot with six indexes.&quot;<\/p><\/blockquote><p>Then the number that is actually useful: &quot;the question I would ask instead is what your write rate and your hot-set size are, because those two tell me whether you have a problem.&quot;<\/p>", "source": "answers.md", "search": "\"how big can postgresql get?\" how do you answer a question with no correct number? there is no correct number, and the interviewer knows. they are testing whether you reframe into the variables rather than guessing. \"i would not answer in terabytes, because the limit is never the size - it is the workload. the things that actually break first, roughly in order: write throughput on a single primary, because there is one; the working set no longer fitting in memory, at which point the p99 changes character rather than degrading smoothly; vacuum and bloat on a high-churn table; index maintenance on wide tables; and the operational limits - how long a restore takes, how long a major version upgrade takes, how long an index build takes. i have seen single instances in the multi-terabyte range work perfectly well because the hot set was small and the writes were modest, and i have seen a two-hundred-gigabyte database in trouble because it was write-hot with six indexes.\" then the number that is actually useful: \"the question i would ask instead is what your write rate and your hot-set size are, because those two tell me whether you have a problem.\""}, {"n": 102, "category": 7, "difficulty": "A", "html": "Live modeling exercise: a subscription billing domain, on a whiteboard, in twenty-five minutes.", "answerTitle": "Live modeling: subscription billing", "answer": "<p>The scoring is on whether you recognize the <strong>domain&#x27;s genuine hard parts<\/strong> rather than producing tables.<\/p><p>Get these on the board and you have passed: a <strong>subscription<\/strong> with a plan and a lifecycle (trialing, active, past due, cancelled, and the difference between cancelled-now and cancel-at-period-end); <strong>price versus plan versus subscription<\/strong> - prices change and existing subscriptions must not, so a subscription references a price version rather than a plan; <strong>the invoice as an immutable document<\/strong> with line items, separate from the subscription state; <strong>money as an integer of minor units with a currency<\/strong>, never a float, said explicitly; <strong>proration<\/strong> as the hard part - what happens on a mid-cycle upgrade, and the fact that this is where every billing system&#x27;s bugs live; <strong>payment attempts as their own entity<\/strong> with a retry schedule, because a payment is a process, not a field; and an <strong>event log<\/strong>, because billing disputes are resolved by history and &quot;what did we think was true on the 14th&quot; is a question you will be asked.<\/p><p><strong>The sentence that shows you have done it:<\/strong> &quot;the invariant I would defend hardest is that an invoice, once issued, never changes - corrections are credit notes. Every billing system that mutates invoices ends up unable to answer an auditor.&quot;<\/p>", "source": "answers.md", "search": "live modeling exercise: a subscription billing domain, on a whiteboard, in twenty-five minutes. the scoring is on whether you recognize the domain's genuine hard parts rather than producing tables. get these on the board and you have passed: a subscription with a plan and a lifecycle (trialing, active, past due, cancelled, and the difference between cancelled-now and cancel-at-period-end); price versus plan versus subscription - prices change and existing subscriptions must not, so a subscription references a price version rather than a plan; the invoice as an immutable document with line items, separate from the subscription state; money as an integer of minor units with a currency , never a float, said explicitly; proration as the hard part - what happens on a mid-cycle upgrade, and the fact that this is where every billing system's bugs live; payment attempts as their own entity with a retry schedule, because a payment is a process, not a field; and an event log , because billing disputes are resolved by history and \"what did we think was true on the 14th\" is a question you will be asked. the sentence that shows you have done it: \"the invariant i would defend hardest is that an invoice, once issued, never changes - corrections are credit notes. every billing system that mutates invoices ends up unable to answer an auditor.\""}, {"n": 103, "category": 7, "difficulty": "A", "html": "You are asked to choose the datastore for five different workloads in ten minutes.", "answerTitle": "Five datastores in ten minutes", "answer": "<p>Two minutes each. The structure for each: <strong>the dominant access pattern in one sentence, the choice, the reason, and the thing you are giving up.<\/strong> Do not hedge - the round is testing decisiveness under time pressure, and a defended wrong-ish choice scores better than five &quot;it depends&quot;.<\/p><p>A worked example of the cadence: &quot;Session state: single-key read and write, high volume, short-lived, loss is tolerable because it means a re-login. Redis or DynamoDB with a TTL; I would take DynamoDB if I did not already run Redis, because there is nothing to operate. Giving up: nothing much, this is the easy one.&quot;<\/p><p>Then keep the same rhythm for the others - a transactional core (relational, and say why not something else), an audit or event log (append-only, cheap object storage plus a query engine, or a log), a search or analytics workload (an inverted index or a columnar store, and the fact that it is a <em>copy<\/em>, never the source of truth), and a high-volume time series (a purpose-built store with downsampling and retention, because the retention policy is the design).<\/p><p><strong>The closing line that scores:<\/strong> &quot;four of those five are copies of, or subordinate to, one authoritative store - I would want to be very clear which one is the source of truth, because that is the decision that survives all the others.&quot;<\/p>", "source": "answers.md", "search": "you are asked to choose the datastore for five different workloads in ten minutes. two minutes each. the structure for each: the dominant access pattern in one sentence, the choice, the reason, and the thing you are giving up. do not hedge - the round is testing decisiveness under time pressure, and a defended wrong-ish choice scores better than five \"it depends\". a worked example of the cadence: \"session state: single-key read and write, high volume, short-lived, loss is tolerable because it means a re-login. redis or dynamodb with a ttl; i would take dynamodb if i did not already run redis, because there is nothing to operate. giving up: nothing much, this is the easy one.\" then keep the same rhythm for the others - a transactional core (relational, and say why not something else), an audit or event log (append-only, cheap object storage plus a query engine, or a log), a search or analytics workload (an inverted index or a columnar store, and the fact that it is a copy , never the source of truth), and a high-volume time series (a purpose-built store with downsampling and retention, because the retention policy is the design). the closing line that scores: \"four of those five are copies of, or subordinate to, one authoritative store - i would want to be very clear which one is the source of truth, because that is the decision that survives all the others.\""}, {"n": 104, "category": 7, "difficulty": "D", "html": "How do you carry one database story across the design, coding and deep-dive rounds without repeating yourself?", "answerTitle": "One database story across three rounds", "answer": "<p>Use different <strong>layers<\/strong> of the same incident, and say the connecting sentence out loud only if the interviewers overlap.<\/p><ul><li><strong>Design round:<\/strong> the story appears as a <em>constraint that shaped the architecture<\/em> - &quot;we knew the read path could not touch the primary, which is why the fanout is precomputed.&quot;<\/li><li><strong>Deep-dive round:<\/strong> the same incident appears as <em>mechanism<\/em> - the lag, the routing, the isolation level, in detail.<\/li><li><strong>Behavioral round:<\/strong> the same incident appears as <em>how you led it<\/em> - who you got in the room, the call you made with incomplete information, what you changed organizationally afterwards.<\/li><\/ul><p><strong>Why this is better than three separate stories:<\/strong> depth. An interviewer who hears three shallow stories learns less than one who hears three faces of one deep one, and the panel comparing notes sees consistency rather than repetition (Q182).<\/p><p><strong>The one risk:<\/strong> if two interviewers hear the <em>same<\/em> face, it reads as a script. So label the face you are giving: &quot;I have talked about the architecture of this with your colleague - I will focus on how we ran the incident.&quot;<\/p>", "source": "answers.md", "search": "how do you carry one database story across the design, coding and deep-dive rounds without repeating yourself? use different layers of the same incident, and say the connecting sentence out loud only if the interviewers overlap. - design round: the story appears as a constraint that shaped the architecture - \"we knew the read path could not touch the primary, which is why the fanout is precomputed.\" - deep-dive round: the same incident appears as mechanism - the lag, the routing, the isolation level, in detail. - behavioral round: the same incident appears as how you led it - who you got in the room, the call you made with incomplete information, what you changed organizationally afterwards. why this is better than three separate stories: depth. an interviewer who hears three shallow stories learns less than one who hears three faces of one deep one, and the panel comparing notes sees consistency rather than repetition (q182). the one risk: if two interviewers hear the same face, it reads as a script. so label the face you are giving: \"i have talked about the architecture of this with your colleague - i will focus on how we ran the incident.\""}, {"n": 105, "category": 8, "difficulty": "C", "html": "&quot;Walk me through your CI/CD pipeline.&quot; What level of detail is expected, and where do most candidates stop too early?", "answerTitle": "\"Walk me through your CI/CD pipeline\"", "answer": "<p>Expected detail: the <strong>stages, the gates, and what stops a bad change<\/strong> - roughly ninety seconds, then depth on request.<\/p><blockquote><p>&quot;Commit to trunk triggers build and unit tests, then static analysis and a dependency and secret scan, then the artifact is built once and signed - and that same artifact is what goes to every environment, which matters more than it sounds because rebuilding per environment means you never tested what you shipped. Integration tests run against ephemeral dependencies, then deploy to staging automatically, run the smoke suite, and production is a promotion of the same artifact behind a progressive rollout with automated rollback on the error-rate SLI.&quot;<\/p><\/blockquote><p><strong>Where candidates stop too early:<\/strong> they describe build and test and stop at &quot;then it deploys&quot;. The interesting half is everything after the artifact - promotion, environment configuration as a separate input, database migrations relative to the deploy (Q99), rollback, and how a failed deploy is detected without a human watching.<\/p><p>Have one number ready: lead time, deployment frequency, or the duration of the pipeline.<\/p><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Categories 1-3.<\/p>", "source": "answers.md", "search": "\"walk me through your ci/cd pipeline.\" what level of detail is expected, and where do most candidates stop too early? expected detail: the stages, the gates, and what stops a bad change - roughly ninety seconds, then depth on request. \"commit to trunk triggers build and unit tests, then static analysis and a dependency and secret scan, then the artifact is built once and signed - and that same artifact is what goes to every environment, which matters more than it sounds because rebuilding per environment means you never tested what you shipped. integration tests run against ephemeral dependencies, then deploy to staging automatically, run the smoke suite, and production is a promotion of the same artifact behind a progressive rollout with automated rollback on the error-rate sli.\" where candidates stop too early: they describe build and test and stop at \"then it deploys\". the interesting half is everything after the artifact - promotion, environment configuration as a separate input, database migrations relative to the deploy (q99), rollback, and how a failed deploy is detected without a human watching. have one number ready: lead time, deployment frequency, or the duration of the pipeline. depth: ../07-devops categories 1-3."}, {"n": 106, "category": 8, "difficulty": "D", "html": "An incident-command round: what is the structure of a good answer, and where does CIDER fit?", "answerTitle": "Structure of an incident-command answer", "answer": "<p>CIDER maps onto it, but weight it differently from a design answer: the interviewer wants <strong>command<\/strong>, not debugging.<\/p><ul><li><strong>Clarify<\/strong> becomes <em>establish<\/em>: who is incident commander (say &quot;I took command&quot; or &quot;I handed command to X and took the technical lead&quot; - the distinction is the whole signal), what the customer impact is in one sentence, and what the severity is.<\/li><li><strong>Isolate<\/strong> becomes <em>stabilize before diagnose<\/em>: what did you do to stop the bleeding before you understood the cause? Roll back, fail over, shed load, disable the feature. A candidate who diagnoses first while customers are down is describing debugging, not incident command.<\/li><li><strong>Decide<\/strong> is the call you made with incomplete information, and the fact that you made it - with the time on the clock.<\/li><li><strong>Execute<\/strong> includes communications: who you told, how often, and what you said to a stakeholder who wanted an ETA you did not have.<\/li><li><strong>Reflect<\/strong> is the blameless review and, critically, <strong>whether the action items were actually done<\/strong>.<\/li><\/ul><p><strong>The line that separates senior from principal:<\/strong> &quot;the fix stopped that outage; what I actually changed was <em>[the class of failure]<\/em> so it could not recur, and here is how I knew it worked.&quot;<\/p>", "source": "answers.md", "search": "an incident-command round: what is the structure of a good answer, and where does cider fit? cider maps onto it, but weight it differently from a design answer: the interviewer wants command , not debugging. - clarify becomes establish : who is incident commander (say \"i took command\" or \"i handed command to x and took the technical lead\" - the distinction is the whole signal), what the customer impact is in one sentence, and what the severity is. - isolate becomes stabilize before diagnose : what did you do to stop the bleeding before you understood the cause? roll back, fail over, shed load, disable the feature. a candidate who diagnoses first while customers are down is describing debugging, not incident command. - decide is the call you made with incomplete information, and the fact that you made it - with the time on the clock. - execute includes communications: who you told, how often, and what you said to a stakeholder who wanted an eta you did not have. - reflect is the blameless review and, critically, whether the action items were actually done . the line that separates senior from principal: \"the fix stopped that outage; what i actually changed was [the class of failure] so it could not recur, and here is how i knew it worked.\""}, {"n": 107, "category": 8, "difficulty": "T", "html": "&quot;What was your worst outage?&quot; How much blame do you take, and what happens if you take none?", "answerTitle": "\"What was your worst outage?\"", "answer": "<p>Take <strong>real ownership of a decision<\/strong>, not of everything and not of nothing.<\/p><p>Too little blame - &quot;the vendor had an outage&quot;, &quot;a colleague pushed a bad config&quot; - reads as someone who will not be accountable. Too much - &quot;it was entirely my fault, I should have caught it&quot; - reads as either performative or as poor judgement about systems, because at principal level a single person&#x27;s mistake causing a major outage <strong>is a systems failure<\/strong>.<\/p><p>The calibrated version:<\/p><blockquote><p>&quot;I own two things in it. I approved the change, and my review missed that the migration held a lock; that is on me and I would review differently now. The bigger thing I own is that the system allowed it - there was no lock timeout and no canary on the migration path, and I had known about that gap for months and not prioritized it. What I changed afterwards was the second one.&quot;<\/p><\/blockquote><p><strong>The structure:<\/strong> a specific personal error, a systemic gap you were responsible for, and a fix aimed at the system. Name the impact honestly with a number, do not name individuals, and do not describe the vendor or a colleague as the cause even when they were.<\/p>", "source": "answers.md", "search": "\"what was your worst outage?\" how much blame do you take, and what happens if you take none? take real ownership of a decision , not of everything and not of nothing. too little blame - \"the vendor had an outage\", \"a colleague pushed a bad config\" - reads as someone who will not be accountable. too much - \"it was entirely my fault, i should have caught it\" - reads as either performative or as poor judgement about systems, because at principal level a single person's mistake causing a major outage is a systems failure . the calibrated version: \"i own two things in it. i approved the change, and my review missed that the migration held a lock; that is on me and i would review differently now. the bigger thing i own is that the system allowed it - there was no lock timeout and no canary on the migration path, and i had known about that gap for months and not prioritized it. what i changed afterwards was the second one.\" the structure: a specific personal error, a systemic gap you were responsible for, and a fix aimed at the system. name the impact honestly with a number, do not name individuals, and do not describe the vendor or a colleague as the cause even when they were."}, {"n": 108, "category": 8, "difficulty": "D", "html": "How do you use the DORA metrics without sounding like a consultant?", "answerTitle": "DORA without sounding like a consultant", "answer": "<p>Use the metrics as <strong>diagnosis<\/strong>, never as a scorecard you recite.<\/p><blockquote><p>&quot;I use them as a pair of ratios rather than four numbers. Deployment frequency and lead time tell me how big a batch is; change failure rate and recovery time tell me what a batch costs when it is wrong. The useful insight is that they move together - teams deploy rarely <em>because<\/em> deploys are dangerous, so the batch gets bigger, which makes them more dangerous. The intervention is almost never &#x27;deploy more often&#x27;, it is to make a deploy cheap to reverse, and then frequency moves on its own. On one team, lead time was nine days and almost all of it was waiting for a manual regression sign-off - so the fix was test automation, not process.&quot;<\/p><\/blockquote><p><strong>Red flags:<\/strong> quoting the elite-performer thresholds as targets, or presenting the four metrics as a maturity model. Both read as having read the book rather than moved a number.<\/p><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Categories 1 and 10.<\/p>", "source": "answers.md", "search": "how do you use the dora metrics without sounding like a consultant? use the metrics as diagnosis , never as a scorecard you recite. \"i use them as a pair of ratios rather than four numbers. deployment frequency and lead time tell me how big a batch is; change failure rate and recovery time tell me what a batch costs when it is wrong. the useful insight is that they move together - teams deploy rarely because deploys are dangerous, so the batch gets bigger, which makes them more dangerous. the intervention is almost never 'deploy more often', it is to make a deploy cheap to reverse, and then frequency moves on its own. on one team, lead time was nine days and almost all of it was waiting for a manual regression sign-off - so the fix was test automation, not process.\" red flags: quoting the elite-performer thresholds as targets, or presenting the four metrics as a maturity model. both read as having read the book rather than moved a number. depth: ../07-devops categories 1 and 10."}, {"n": 109, "category": 8, "difficulty": "D", "html": "Kubernetes questions when you are not a Kubernetes specialist. Where exactly do you draw the line?", "answerTitle": "Kubernetes when you are not a specialist", "answer": "<p>Draw the line <strong>explicitly and by layer<\/strong>, then be genuinely strong on your side of it.<\/p><blockquote><p>&quot;I will tell you where my line is. I am solid on the application-facing model - deployments, services, ingress, config and secrets, requests and limits, probes, rolling updates and pod disruption budgets, and how a rollout actually replaces pods. I can debug why a pod is not receiving traffic or why it is being OOM-killed. Where I am not the expert is the cluster layer - CNI internals, etcd tuning, upgrade choreography, custom operators. On my teams that has been a platform function, and my job has been the contract between the app teams and that platform rather than running the cluster.&quot;<\/p><\/blockquote><p>That answer is honest, bounded and still substantial. The follow-up will usually be on your side of the line, so make sure the app-facing depth is real: what a readiness probe does during a rollout, why a memory limit behaves differently from a CPU limit, and what a pod disruption budget prevents during a node drain.<\/p><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Categories 4-5.<\/p>", "source": "answers.md", "search": "kubernetes questions when you are not a kubernetes specialist. where exactly do you draw the line? draw the line explicitly and by layer , then be genuinely strong on your side of it. \"i will tell you where my line is. i am solid on the application-facing model - deployments, services, ingress, config and secrets, requests and limits, probes, rolling updates and pod disruption budgets, and how a rollout actually replaces pods. i can debug why a pod is not receiving traffic or why it is being oom-killed. where i am not the expert is the cluster layer - cni internals, etcd tuning, upgrade choreography, custom operators. on my teams that has been a platform function, and my job has been the contract between the app teams and that platform rather than running the cluster.\" that answer is honest, bounded and still substantial. the follow-up will usually be on your side of the line, so make sure the app-facing depth is real: what a readiness probe does during a rollout, why a memory limit behaves differently from a cpu limit, and what a pod disruption budget prevents during a node drain. depth: ../07-devops categories 4-5."}, {"n": 110, "category": 8, "difficulty": "D", "html": "&quot;How do you roll back?&quot; Take it down three levels of follow-up.", "answerTitle": "\"How do you roll back?\" - three levels", "answer": "<ul><li><strong>Level 1:<\/strong> redeploy the previous artifact. Fine, and everyone says it.<\/li><li><strong>Level 2 - what makes it possible:<\/strong> the previous artifact still exists and is deployable; configuration is versioned with it; the rollback path is exercised regularly rather than theoretically available; and the decision to roll back is automated on an SLI rather than debated in a call at 3am.<\/li><li><strong>Level 3 - what makes it impossible, which is the real question:<\/strong> a database migration that dropped a column; an event schema change consumers already adopted; a cache or a data format written in the new version that the old one cannot read; a feature that has already sent emails. So the durable answer is that <strong>rollback is a design constraint, not a procedure<\/strong>: expand-and-contract migrations (Q99), backwards-compatible message schemas for at least one version, and feature flags so the <em>behaviour<\/em> can be reverted without reverting the <em>deployment<\/em> - which is faster and safer, because the code path being reverted was already running.<\/li><\/ul><p><strong>The sentence that lands:<\/strong> &quot;the question I ask in design review is not &#x27;can we roll back&#x27;, it is &#x27;what is the first hour in which we no longer can&#x27;.&quot;<\/p>", "source": "answers.md", "search": "\"how do you roll back?\" take it down three levels of follow-up. - level 1: redeploy the previous artifact. fine, and everyone says it. - level 2 - what makes it possible: the previous artifact still exists and is deployable; configuration is versioned with it; the rollback path is exercised regularly rather than theoretically available; and the decision to roll back is automated on an sli rather than debated in a call at 3am. - level 3 - what makes it impossible, which is the real question: a database migration that dropped a column; an event schema change consumers already adopted; a cache or a data format written in the new version that the old one cannot read; a feature that has already sent emails. so the durable answer is that rollback is a design constraint, not a procedure : expand-and-contract migrations (q99), backwards-compatible message schemas for at least one version, and feature flags so the behaviour can be reverted without reverting the deployment - which is faster and safer, because the code path being reverted was already running. the sentence that lands: \"the question i ask in design review is not 'can we roll back', it is 'what is the first hour in which we no longer can'.\""}, {"n": 111, "category": 8, "difficulty": "D", "html": "On-call questions are leadership questions in disguise. What are they really asking?", "answerTitle": "On-call questions are leadership questions", "answer": "<p>They are asking: <strong>do you take responsibility for the operational consequences of what you build, and do you improve life for the people carrying the pager?<\/strong><\/p><p>The answer therefore has three parts: that you carry it (&quot;I have been in the rotation at every level, including now&quot;); how you treat the load as a metric rather than a fact of life - pages per shift, percentage actionable, percentage out of hours, and what you did when it was bad; and a specific instance where you <strong>deleted alerts<\/strong> or fixed the underlying cause rather than writing a better runbook.<\/p><blockquote><p>&quot;The rotation was getting about eleven pages a week and roughly half were not actionable. We audited every alert against one rule - does a human need to do something in the next fifteen minutes - and deleted or downgraded everything that failed it. That took us to three a week, and the important part is that the remaining ones started getting taken seriously again, which is the actual damage that noisy alerting does.&quot;<\/p><\/blockquote><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Category 11.<\/p>", "source": "answers.md", "search": "on-call questions are leadership questions in disguise. what are they really asking? they are asking: do you take responsibility for the operational consequences of what you build, and do you improve life for the people carrying the pager? the answer therefore has three parts: that you carry it (\"i have been in the rotation at every level, including now\"); how you treat the load as a metric rather than a fact of life - pages per shift, percentage actionable, percentage out of hours, and what you did when it was bad; and a specific instance where you deleted alerts or fixed the underlying cause rather than writing a better runbook. \"the rotation was getting about eleven pages a week and roughly half were not actionable. we audited every alert against one rule - does a human need to do something in the next fifteen minutes - and deleted or downgraded everything that failed it. that took us to three a week, and the important part is that the remaining ones started getting taken seriously again, which is the actual damage that noisy alerting does.\" depth: ../07-devops category 11."}, {"n": 112, "category": 8, "difficulty": "T", "html": "The interviewer describes their deployment process in one sentence and asks how you would improve it. What is the trap?", "answerTitle": "\"How would you improve our deployment process?\"", "answer": "<p>The trap is answering. You have one sentence of context and a confident recommendation will be wrong, patronizing, or both.<\/p><blockquote><p>&quot;I would want to ask a few things first, because the same symptom has very different causes. What is the lead time from merge to production, and where does it actually go? Is the delay technical or is it waiting for a person? What is your change failure rate - if it is low and you deploy slowly, the process may be fine and expensive; if it is high, speed is not the problem. And what has been tried?&quot;<\/p><\/blockquote><p>Then, having earned it, offer a <strong>direction rather than a solution<\/strong>: &quot;if it is mostly waiting for a manual gate, the highest-yield work is usually making rollback cheap enough that the gate is no longer justified, rather than optimizing the gate.&quot;<\/p><p><strong>What is being scored:<\/strong> whether you diagnose before prescribing. It is the same test as Q94 and Q170, and interviewers use it because consultants and senior engineers fail it constantly.<\/p>", "source": "answers.md", "search": "the interviewer describes their deployment process in one sentence and asks how you would improve it. what is the trap? the trap is answering. you have one sentence of context and a confident recommendation will be wrong, patronizing, or both. \"i would want to ask a few things first, because the same symptom has very different causes. what is the lead time from merge to production, and where does it actually go? is the delay technical or is it waiting for a person? what is your change failure rate - if it is low and you deploy slowly, the process may be fine and expensive; if it is high, speed is not the problem. and what has been tried?\" then, having earned it, offer a direction rather than a solution : \"if it is mostly waiting for a manual gate, the highest-yield work is usually making rollback cheap enough that the gate is no longer justified, rather than optimizing the gate.\" what is being scored: whether you diagnose before prescribing. it is the same test as q94 and q170, and interviewers use it because consultants and senior engineers fail it constantly."}, {"n": 113, "category": 8, "difficulty": "D", "html": "Observability round: what does a strong answer contain beyond a list of tools?", "answerTitle": "Observability beyond a list of tools", "answer": "<p>A strong answer is about <strong>what questions you can answer<\/strong>, and about the discipline rather than the stack.<\/p><ul><li><strong>The three signals with distinct jobs<\/strong>: metrics tell you something is wrong and are cheap and aggregate; traces tell you where in a distributed path; logs tell you why, for one specific request. A team that logs everything and has no metrics cannot detect, and a team with metrics and no traces cannot localize.<\/li><li><strong>Cardinality as the cost model.<\/strong> High-cardinality identifiers belong on spans and logs, never on metric labels (Q57).<\/li><li><strong>Correlation<\/strong> - a trace id propagated into logs and surfaced in the error the user sees, so a support ticket is one query rather than an investigation.<\/li><li><strong>SLOs as the thing you alert on<\/strong>, so pages are user-impacting by construction, plus error budgets as the mechanism that converts reliability into a prioritization conversation rather than an argument.<\/li><li><strong>The honest gap:<\/strong> what could break right now without any of this noticing? Naming your own blind spot is the most senior thing you can say here.<\/li><\/ul><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Category 8.<\/p>", "source": "answers.md", "search": "observability round: what does a strong answer contain beyond a list of tools? a strong answer is about what questions you can answer , and about the discipline rather than the stack. - the three signals with distinct jobs : metrics tell you something is wrong and are cheap and aggregate; traces tell you where in a distributed path; logs tell you why, for one specific request. a team that logs everything and has no metrics cannot detect, and a team with metrics and no traces cannot localize. - cardinality as the cost model. high-cardinality identifiers belong on spans and logs, never on metric labels (q57). - correlation - a trace id propagated into logs and surfaced in the error the user sees, so a support ticket is one query rather than an investigation. - slos as the thing you alert on , so pages are user-impacting by construction, plus error budgets as the mechanism that converts reliability into a prioritization conversation rather than an argument. - the honest gap: what could break right now without any of this noticing? naming your own blind spot is the most senior thing you can say here. depth: ../07-devops category 8."}, {"n": 114, "category": 8, "difficulty": "D", "html": "Secrets management: what answer survives a security-minded follow-up?", "answerTitle": "Secrets management under a security follow-up", "answer": "<p>Survives scrutiny: secrets are <strong>never in the repository, never in the image, never in an environment variable printed by a crash dump<\/strong>; they are fetched at runtime from a manager with an identity the workload already has (an IAM role, a service account), so there is no bootstrap secret; access is audited; and rotation is automatic and <strong>tested by actually rotating<\/strong>, because a rotation path that has never run does not work.<\/p><p>Then the two follow-ups a security interviewer will ask, and you should pre-empt one:<\/p><ul><li><strong>&quot;How would you know if one leaked?&quot;<\/strong> Detection: secret scanning in CI and on the whole history, canary credentials, and anomaly detection on the audit log. And a rehearsed revocation path, because the response to a leak is revoke-then-investigate.<\/li><li><strong>&quot;What about the developer laptop?&quot;<\/strong> Local development uses a separate, lower-privilege credential set, never production values, and this is the gap in most organizations.<\/li><\/ul><p><strong>The honest admission that helps:<\/strong> environment variables are the common compromise and they are weaker than a runtime fetch - say which one you actually did and why.<\/p><p><strong>Depth:<\/strong> <code>../11-security<\/code> Category 9.<\/p>", "source": "answers.md", "search": "secrets management: what answer survives a security-minded follow-up? survives scrutiny: secrets are never in the repository, never in the image, never in an environment variable printed by a crash dump ; they are fetched at runtime from a manager with an identity the workload already has (an iam role, a service account), so there is no bootstrap secret; access is audited; and rotation is automatic and tested by actually rotating , because a rotation path that has never run does not work. then the two follow-ups a security interviewer will ask, and you should pre-empt one: - \"how would you know if one leaked?\" detection: secret scanning in ci and on the whole history, canary credentials, and anomaly detection on the audit log. and a rehearsed revocation path, because the response to a leak is revoke-then-investigate. - \"what about the developer laptop?\" local development uses a separate, lower-privilege credential set, never production values, and this is the gap in most organizations. the honest admission that helps: environment variables are the common compromise and they are weaker than a runtime fetch - say which one you actually did and why. depth: ../11-security category 9."}, {"n": 115, "category": 8, "difficulty": "D", "html": "Canary versus blue-green: what makes the answer specific to their constraints rather than generic?", "answerTitle": "Canary versus blue-green, specific to their constraints", "answer": "<p>Do not compare the two in the abstract. <strong>Name the constraint that decides it.<\/strong><\/p><blockquote><p>&quot;It comes down to three things. First, can you run both versions against the same data at the same time? If a schema or a message format change makes that unsafe, canary is out until the change is made compatible - that constraint decides more of these than anything else. Second, do you have a signal fast enough to judge a canary? If your quality metric takes an hour, a ten-minute canary tells you nothing and blue-green with a fast rollback is more honest. Third, what does a bad request cost - blue-green exposes a hundred percent of traffic to the new version for however long it takes to notice, so for high-value irreversible operations I want gradual exposure even if it is slower.&quot;<\/p><\/blockquote><p>Then land it: &quot;given a stateless service with a good error-rate signal, canary. Given a database-coupled deploy with a slow signal, blue-green with a tested rollback and a smoke suite.&quot;<\/p><p><strong>The extra credit:<\/strong> mention that neither helps if the change is behind no flag and has already written data (Q110).<\/p>", "source": "answers.md", "search": "canary versus blue-green: what makes the answer specific to their constraints rather than generic? do not compare the two in the abstract. name the constraint that decides it. \"it comes down to three things. first, can you run both versions against the same data at the same time? if a schema or a message format change makes that unsafe, canary is out until the change is made compatible - that constraint decides more of these than anything else. second, do you have a signal fast enough to judge a canary? if your quality metric takes an hour, a ten-minute canary tells you nothing and blue-green with a fast rollback is more honest. third, what does a bad request cost - blue-green exposes a hundred percent of traffic to the new version for however long it takes to notice, so for high-value irreversible operations i want gradual exposure even if it is slower.\" then land it: \"given a stateless service with a good error-rate signal, canary. given a database-coupled deploy with a slow signal, blue-green with a tested rollback and a smoke suite.\" the extra credit: mention that neither helps if the change is behind no flag and has already written data (q110)."}, {"n": 116, "category": 8, "difficulty": "T", "html": "&quot;We deploy once a quarter and it works for us.&quot; Do you challenge it, and how?", "answerTitle": "\"We deploy once a quarter and it works for us\"", "answer": "<p>Do not challenge the frequency. <strong>Ask about the consequences<\/strong>, and let them draw the conclusion - and be prepared for the possibility that they are right.<\/p><blockquote><p>&quot;That is workable in some contexts - what does a hotfix look like when you need one? … And how long does the quarterly release take from cut to done, and how often does it need a fix afterwards?&quot;<\/p><\/blockquote><p>If the answers are &quot;hotfixes take a day and go out fine&quot; and &quot;the release is smooth&quot;, they have a working system with a large batch size and low change rate, and the correct response is to say so. Regulated, embedded and vendor-shipped software genuinely lives here.<\/p><p>If the answers are &quot;hotfixes are terrifying&quot; and &quot;the release takes a week and always needs two follow-ups&quot;, the diagnosis says itself and you have not had to accuse anyone of anything: &quot;then the thing I would look at is not the frequency, it is that the batch is large enough that you cannot attribute a failure to a change.&quot;<\/p><p><strong>What is scored:<\/strong> that you did not apply a best practice to a context you had not investigated (Q112).<\/p>", "source": "answers.md", "search": "\"we deploy once a quarter and it works for us.\" do you challenge it, and how? do not challenge the frequency. ask about the consequences , and let them draw the conclusion - and be prepared for the possibility that they are right. \"that is workable in some contexts - what does a hotfix look like when you need one? … and how long does the quarterly release take from cut to done, and how often does it need a fix afterwards?\" if the answers are \"hotfixes take a day and go out fine\" and \"the release is smooth\", they have a working system with a large batch size and low change rate, and the correct response is to say so. regulated, embedded and vendor-shipped software genuinely lives here. if the answers are \"hotfixes are terrifying\" and \"the release takes a week and always needs two follow-ups\", the diagnosis says itself and you have not had to accuse anyone of anything: \"then the thing i would look at is not the frequency, it is that the batch is large enough that you cannot attribute a failure to a change.\" what is scored: that you did not apply a best practice to a context you had not investigated (q112)."}, {"n": 117, "category": 8, "difficulty": "A", "html": "A live incident simulation: alerts firing, partial information, the interviewer playing your on-call engineer.", "answerTitle": "Live incident simulation", "answer": "<p>Run as a full CIDER walkthrough in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part A. The behaviours the simulation is scoring:<\/p><ul><li><strong>You declare and take command in the first minute<\/strong>, and you say the customer impact out loud before touching a dashboard.<\/li><li><strong>You ask for the timeline<\/strong> - what changed, when did it start, do they correlate - before proposing a cause.<\/li><li><strong>You mitigate before you diagnose<\/strong> where mitigation is available, and you say that is what you are doing.<\/li><li><strong>You state hypotheses as falsifiable<\/strong> and say what evidence would discriminate, rather than pursuing one theory.<\/li><li><strong>You communicate on a cadence<\/strong> and you say what you will do if the current line of investigation fails.<\/li><li><strong>You do not go quiet.<\/strong> Silence while thinking is the most common failure in this round; narrate.<\/li><\/ul>", "source": "answers.md", "search": "a live incident simulation: alerts firing, partial information, the interviewer playing your on-call engineer. run as a full cider walkthrough in scenario-questions.md, part a. the behaviours the simulation is scoring: - you declare and take command in the first minute , and you say the customer impact out loud before touching a dashboard. - you ask for the timeline - what changed, when did it start, do they correlate - before proposing a cause. - you mitigate before you diagnose where mitigation is available, and you say that is what you are doing. - you state hypotheses as falsifiable and say what evidence would discriminate, rather than pursuing one theory. - you communicate on a cadence and you say what you will do if the current line of investigation fails. - you do not go quiet. silence while thinking is the most common failure in this round; narrate."}, {"n": 118, "category": 8, "difficulty": "A", "html": "You are asked to define a platform team&#x27;s charter and its success metrics.", "answerTitle": "A platform team's charter and metrics", "answer": "<p>The charter, in one sentence they can repeat: <em>&quot;we make the paved road the fastest way to production, and we own the things every team would otherwise build badly.&quot;<\/em> Then the parts that make it real:<\/p><ul><li><strong>Product, not policy.<\/strong> Adoption must be voluntary and won on merit. A platform that mandates gets routed around, resented, and eventually replaced. The corollary is that the platform team has users and needs a roadmap, support and a feedback loop.<\/li><li><strong>Scope by cost of duplication<\/strong>: deployment, observability wiring, service templates, secrets, identity, cost attribution. Not: business logic, and not everything that is technically shared.<\/li><li><strong>An escape hatch by design.<\/strong> Teams must be able to leave the road, and those cases are your backlog rather than your enemy.<\/li><\/ul><p>Metrics, and be careful with them: <strong>time from empty repository to a service in production<\/strong>, <strong>adoption as a percentage of eligible teams<\/strong>, <strong>change failure rate for road users versus non-users<\/strong> (the honest one - if the road is not safer, it has no case), and <strong>support load per adopting team<\/strong>, which should decline. Explicitly reject &quot;number of services migrated&quot; as a target, because it drives migration over value.<\/p><p><strong>The trade-off to volunteer:<\/strong> a platform is a coupling. Every team on it inherits your outages and your release cadence, and that has to be earned continuously.<\/p>", "source": "answers.md", "search": "you are asked to define a platform team's charter and its success metrics. the charter, in one sentence they can repeat: \"we make the paved road the fastest way to production, and we own the things every team would otherwise build badly.\" then the parts that make it real: - product, not policy. adoption must be voluntary and won on merit. a platform that mandates gets routed around, resented, and eventually replaced. the corollary is that the platform team has users and needs a roadmap, support and a feedback loop. - scope by cost of duplication : deployment, observability wiring, service templates, secrets, identity, cost attribution. not: business logic, and not everything that is technically shared. - an escape hatch by design. teams must be able to leave the road, and those cases are your backlog rather than your enemy. metrics, and be careful with them: time from empty repository to a service in production , adoption as a percentage of eligible teams , change failure rate for road users versus non-users (the honest one - if the road is not safer, it has no case), and support load per adopting team , which should decline. explicitly reject \"number of services migrated\" as a target, because it drives migration over value. the trade-off to volunteer: a platform is a coupling. every team on it inherits your outages and your release cadence, and that has to be earned continuously."}, {"n": 119, "category": 9, "difficulty": "C", "html": "&quot;You say you do AI - what have you actually built?&quot; Structure ninety seconds that survives a skeptical follow-up.", "answerTitle": "\"What have you actually built?\"", "answer": "<p>The structure that survives skepticism: <strong>one system, in detail, with numbers on both quality and cost, plus one thing you refused to build.<\/strong><\/p><blockquote><p>&quot;Concretely, <em>[a retrieval-grounded assistant over X documents for Y users]<\/em>. The parts I own the reasoning for: chunking and the ingestion path, hybrid retrieval with a reranker, the context assembly under a token budget, and the evaluation set - about <em>[n]<\/em> cases built from real production queries, scored on retrieval recall and on answer groundedness, run in CI on every prompt or model change. Cost is <em>[figure]<\/em> per query at <em>[figure]<\/em> per month, and the dominant term was <em>[X]<\/em>, which we cut by <em>[Y]<\/em>. The thing I would also mention is what we decided not to do: <em>[the agentic version]<\/em>, because <em>[the reason]<\/em>.&quot;<\/p><\/blockquote><p><strong>Why the refusal matters more than the build:<\/strong> at principal level in AI, judgement about scope is the scarcest signal (<code>../10-ai-agents<\/code> Q3). Everyone has shipped a chatbot; very few have argued one down.<\/p><p><strong>Red flags:<\/strong> framework names as the substance, no evaluation, no cost figure, and &quot;we use RAG&quot; as if it were a design.<\/p>", "source": "answers.md", "search": "\"you say you do ai - what have you actually built?\" structure ninety seconds that survives a skeptical follow-up. the structure that survives skepticism: one system, in detail, with numbers on both quality and cost, plus one thing you refused to build. \"concretely, [a retrieval-grounded assistant over x documents for y users] . the parts i own the reasoning for: chunking and the ingestion path, hybrid retrieval with a reranker, the context assembly under a token budget, and the evaluation set - about [n] cases built from real production queries, scored on retrieval recall and on answer groundedness, run in ci on every prompt or model change. cost is [figure] per query at [figure] per month, and the dominant term was [x] , which we cut by [y] . the thing i would also mention is what we decided not to do: [the agentic version] , because [the reason] .\" why the refusal matters more than the build: at principal level in ai, judgement about scope is the scarcest signal (../10-ai-agents q3). everyone has shipped a chatbot; very few have argued one down. red flags: framework names as the substance, no evaluation, no cost figure, and \"we use rag\" as if it were a design."}, {"n": 120, "category": 9, "difficulty": "D", "html": "How do you separate GenAI, RAG and agent material out loud so the interviewer can see you know the boundaries?", "answerTitle": "Separating GenAI, RAG and agents out loud", "answer": "<p>State the boundaries in three sentences, unprompted, early in the round. It immediately positions you above the candidates who treat it as one topic.<\/p><blockquote><p>&quot;I keep three things separate. <strong>The model<\/strong> is a component with a context window, a decoding behaviour, a latency profile and a price - and its behaviour under those constraints is one body of knowledge. <strong>Retrieval<\/strong> is an information system: ingestion, chunking, indexing, hybrid search, reranking and permissions - it is mostly a search problem, and most &#x27;the LLM is wrong&#x27; bugs are actually retrieval bugs. <strong>An agent<\/strong> is the system around the model, where the model chooses the control flow at runtime - and that is a distributed systems and authorization problem, not a prompting one. They fail differently and you debug them differently, which is why the distinction is worth making.&quot;<\/p><\/blockquote><p><strong>Follow-up you are inviting and want:<\/strong> &quot;so how do you tell whether a bad answer is a retrieval failure or a generation failure?&quot; Answer: check whether the correct chunk was in the context. If it was not, it is retrieval; if it was, it is generation. That single diagnostic is the most useful thing in the domain and it is the answer to Q124 too.<\/p>", "source": "answers.md", "search": "how do you separate genai, rag and agent material out loud so the interviewer can see you know the boundaries? state the boundaries in three sentences, unprompted, early in the round. it immediately positions you above the candidates who treat it as one topic. \"i keep three things separate. the model is a component with a context window, a decoding behaviour, a latency profile and a price - and its behaviour under those constraints is one body of knowledge. retrieval is an information system: ingestion, chunking, indexing, hybrid search, reranking and permissions - it is mostly a search problem, and most 'the llm is wrong' bugs are actually retrieval bugs. an agent is the system around the model, where the model chooses the control flow at runtime - and that is a distributed systems and authorization problem, not a prompting one. they fail differently and you debug them differently, which is why the distinction is worth making.\" follow-up you are inviting and want: \"so how do you tell whether a bad answer is a retrieval failure or a generation failure?\" answer: check whether the correct chunk was in the context. if it was not, it is retrieval; if it was, it is generation. that single diagnostic is the most useful thing in the domain and it is the answer to q124 too."}, {"n": 121, "category": 9, "difficulty": "T", "html": "&quot;Isn&#x27;t this all just prompt engineering?&quot; Answer without being defensive and without overclaiming.", "answerTitle": "\"Isn't this all just prompt engineering?\"", "answer": "<p>Concede the true part immediately, then relocate the work. Defensiveness confirms their suspicion.<\/p><blockquote><p>&quot;The prompt is real but it is the smallest part, and it is the part that stops mattering as models improve. The engineering is everywhere else: what goes into the context and how it was selected, which is a retrieval and ranking problem; the token and cost arithmetic; the evaluation harness, because without one you cannot change anything safely; the failure behaviour, including when the system should decline to answer; and the authorization boundary once the model can call tools. Concretely, on the last system, prompt changes accounted for a small share of the quality improvement - the improvement came from the retrieval and the reranking. And the reason I care about that distinction is that prompt work does not compound and the rest does.&quot;<\/p><\/blockquote><p><strong>The strongest evidence<\/strong> is an anecdote where a better prompt did not fix it and something structural did.<\/p>", "source": "answers.md", "search": "\"isn't this all just prompt engineering?\" answer without being defensive and without overclaiming. concede the true part immediately, then relocate the work. defensiveness confirms their suspicion. \"the prompt is real but it is the smallest part, and it is the part that stops mattering as models improve. the engineering is everywhere else: what goes into the context and how it was selected, which is a retrieval and ranking problem; the token and cost arithmetic; the evaluation harness, because without one you cannot change anything safely; the failure behaviour, including when the system should decline to answer; and the authorization boundary once the model can call tools. concretely, on the last system, prompt changes accounted for a small share of the quality improvement - the improvement came from the retrieval and the reranking. and the reason i care about that distinction is that prompt work does not compound and the rest does.\" the strongest evidence is an anecdote where a better prompt did not fix it and something structural did."}, {"n": 122, "category": 9, "difficulty": "D", "html": "Token and cost arithmetic out loud: what must you be able to compute in your head, in a round, with no calculator?", "answerTitle": "Token and cost arithmetic in your head", "answer": "<p>Carry these and be able to say them without hesitation:<\/p><table><thead><tr><th>Quantity<\/th><th>Rule of thumb<\/th><\/tr><\/thead><tbody><tr><td>Tokens per word (English)<\/td><td>~1.3, so 750 words ≈ 1,000 tokens<\/td><\/tr><tr><td>A page of text<\/td><td>~500-800 tokens<\/td><\/tr><tr><td>Cost of a call<\/td><td>(input tokens × input price) + (output tokens × output price), and <strong>output is several times more expensive per token<\/strong><\/td><\/tr><tr><td>Attention cost<\/td><td>quadratic in sequence length - doubling the context roughly quadruples that term<\/td><\/tr><tr><td>Cached input<\/td><td>typically around a tenth of the price, and only for a stable prefix<\/td><\/tr><tr><td>An agent loop&#x27;s total input<\/td><td>≈ <code>n·b + s·n²/2<\/code> for n steps, base b, per-step growth s<\/td><\/tr><\/tbody><\/table><p>The way to use it in a round:<\/p><blockquote><p>&quot;Say 3,000 tokens of context and 500 out, at <em>[prices]<\/em> - that is roughly <em>[X]<\/em> cents a call. At 100,000 calls a day that is <em>[Y]<\/em> a month, which is the number that decides whether we cache aggressively or accept it. And since output tokens dominate the per-call cost, the cheapest quality win is usually shortening the answer, not the prompt.&quot;<\/p><\/blockquote><p><strong>What scores is doing it out loud and reaching a decision from it.<\/strong> The precision does not matter; the habit does.<\/p><p><strong>Depth:<\/strong> <code>../08-genai<\/code> Categories 2 and 13.<\/p>", "source": "answers.md", "search": "token and cost arithmetic out loud: what must you be able to compute in your head, in a round, with no calculator? carry these and be able to say them without hesitation: quantity rule of thumb --- --- tokens per word (english) ~1.3, so 750 words ≈ 1,000 tokens a page of text ~500-800 tokens cost of a call (input tokens × input price) + (output tokens × output price), and output is several times more expensive per token attention cost quadratic in sequence length - doubling the context roughly quadruples that term cached input typically around a tenth of the price, and only for a stable prefix an agent loop's total input ≈ n·b + s·n²/2 for n steps, base b, per-step growth s the way to use it in a round: \"say 3,000 tokens of context and 500 out, at [prices] - that is roughly [x] cents a call. at 100,000 calls a day that is [y] a month, which is the number that decides whether we cache aggressively or accept it. and since output tokens dominate the per-call cost, the cheapest quality win is usually shortening the answer, not the prompt.\" what scores is doing it out loud and reaching a decision from it. the precision does not matter; the habit does. depth: ../08-genai categories 2 and 13."}, {"n": 123, "category": 9, "difficulty": "D", "html": "A RAG design round: the first five decisions, in order, and why that order.", "answerTitle": "The first five decisions in a RAG design round, in order", "answer": "<ol><li><strong>Is retrieval the right answer at all?<\/strong> If the corpus is small enough to fit in context, or the questions are aggregations better served by a query, say so. This is the question nobody asks and it is the strongest opener.<\/li><li><strong>What is the unit of retrieval?<\/strong> Not &quot;how do I chunk&quot; - what is the smallest thing that is independently meaningful and answers a question? Chunk size falls out of that, and the document structure drives it more than a token count.<\/li><li><strong>What is the query, really?<\/strong> Are users asking lookup questions, comparison questions or aggregations? Retrieval only serves the first well, and naming that early prevents designing a system that will fail on a third of the traffic.<\/li><li><strong>The retrieval strategy<\/strong>: hybrid by default - lexical for names, ids and exact terms, dense for paraphrase - with a reranker over a wide candidate set, because the reranker is usually the single highest-yield component.<\/li><li><strong>Permissions<\/strong>, and it must be at this point rather than later, because filtering after retrieval breaks recall and filtering before it changes the index design. If different users must see different subsets, that is an architectural input, not a feature.<\/li><\/ol><p><strong>Then, immediately:<\/strong> evaluation (Q125) and what happens when retrieval returns nothing good (Q126).<\/p><p><strong>Depth:<\/strong> <code>../09-rag<\/code> Categories 2-10.<\/p>", "source": "answers.md", "search": "a rag design round: the first five decisions, in order, and why that order. 1. is retrieval the right answer at all? if the corpus is small enough to fit in context, or the questions are aggregations better served by a query, say so. this is the question nobody asks and it is the strongest opener. 2. what is the unit of retrieval? not \"how do i chunk\" - what is the smallest thing that is independently meaningful and answers a question? chunk size falls out of that, and the document structure drives it more than a token count. 3. what is the query, really? are users asking lookup questions, comparison questions or aggregations? retrieval only serves the first well, and naming that early prevents designing a system that will fail on a third of the traffic. 4. the retrieval strategy : hybrid by default - lexical for names, ids and exact terms, dense for paraphrase - with a reranker over a wide candidate set, because the reranker is usually the single highest-yield component. 5. permissions , and it must be at this point rather than later, because filtering after retrieval breaks recall and filtering before it changes the index design. if different users must see different subsets, that is an architectural input, not a feature. then, immediately: evaluation (q125) and what happens when retrieval returns nothing good (q126). depth: ../09-rag categories 2-10."}, {"n": 124, "category": 9, "difficulty": "T", "html": "The interviewer&#x27;s team built RAG and the quality is poor. Diagnose it live with three questions.", "answerTitle": "Diagnosing a poor-quality RAG system with three questions", "answer": "<ul><li><strong>&quot;When it gives a bad answer, was the right document in the context?&quot;<\/strong> This is the whole diagnosis and almost nobody has checked. If not, it is a retrieval problem and prompt work is wasted. If it was, it is a generation, context-assembly or ordering problem.<\/li><li><strong>&quot;How do you know it is bad - what is your eval set and where did the cases come from?&quot;<\/strong> If the answer is &quot;users complain&quot;, the real problem is that they cannot measure, and nothing else can be fixed until that is true.<\/li><li><strong>&quot;What does it do when it does not know?&quot;<\/strong> If it always answers, they have no abstention path, and a large share of the perceived quality problem is confident answers to unanswerable questions.<\/li><\/ul><p>Then, if they are still talking, the two mechanical causes that account for most cases: <strong>chunking that split the answer across a boundary<\/strong>, and <strong>no reranking<\/strong>, so a top-5 from an embedding search is being handed to the model with the right chunk sitting at rank 12.<\/p><p><strong>Why this scores:<\/strong> three questions, each of which discriminates, and you did not propose a fix before diagnosing.<\/p>", "source": "answers.md", "search": "the interviewer's team built rag and the quality is poor. diagnose it live with three questions. - \"when it gives a bad answer, was the right document in the context?\" this is the whole diagnosis and almost nobody has checked. if not, it is a retrieval problem and prompt work is wasted. if it was, it is a generation, context-assembly or ordering problem. - \"how do you know it is bad - what is your eval set and where did the cases come from?\" if the answer is \"users complain\", the real problem is that they cannot measure, and nothing else can be fixed until that is true. - \"what does it do when it does not know?\" if it always answers, they have no abstention path, and a large share of the perceived quality problem is confident answers to unanswerable questions. then, if they are still talking, the two mechanical causes that account for most cases: chunking that split the answer across a boundary , and no reranking , so a top-5 from an embedding search is being handed to the model with the right chunk sitting at rank 12. why this scores: three questions, each of which discriminates, and you did not propose a fix before diagnosing."}, {"n": 125, "category": 9, "difficulty": "D", "html": "&quot;How do you evaluate it?&quot; ends most AI interviews. What is the complete answer?", "answerTitle": "\"How do you evaluate it?\" - the complete answer", "answer": "<p>Cover four layers; most candidates give one.<\/p><ul><li><strong>The dataset.<\/strong> Where the cases came from - real production queries, not invented ones - how many, who labelled them, and how it is kept from becoming a training set you have overfitted to.<\/li><li><strong>Retrieval, separately from generation.<\/strong> Recall at k on whether the correct chunk was retrieved at all. This is a cheap, objective, deterministic metric and it isolates half the system (Q120).<\/li><li><strong>Generation.<\/strong> Groundedness (is every claim supported by the retrieved context), correctness against a reference where one exists, and refusal behaviour on unanswerable questions - which must be in the set, or you will optimize for a system that never says no. LLM-as-judge is usable for groundedness <em>if<\/em> the judge is itself validated against human labels on a sample.<\/li><li><strong>The gate and the operations.<\/strong> It runs in CI on every prompt, model or index change; the release criterion covers cost and latency as well as quality; and online, you track user-visible proxies - thumbs, escalation rate, follow-up rate - because the offline set will not predict everything.<\/li><\/ul><p><strong>The sentence that closes it:<\/strong> &quot;the point of the harness is not the score, it is being able to change something and know within twenty minutes whether it made things worse.&quot;<\/p><p><strong>Depth:<\/strong> <code>../08-genai<\/code> Category 10; <code>../09-rag<\/code> Category 11.<\/p>", "source": "answers.md", "search": "\"how do you evaluate it?\" ends most ai interviews. what is the complete answer? cover four layers; most candidates give one. - the dataset. where the cases came from - real production queries, not invented ones - how many, who labelled them, and how it is kept from becoming a training set you have overfitted to. - retrieval, separately from generation. recall at k on whether the correct chunk was retrieved at all. this is a cheap, objective, deterministic metric and it isolates half the system (q120). - generation. groundedness (is every claim supported by the retrieved context), correctness against a reference where one exists, and refusal behaviour on unanswerable questions - which must be in the set, or you will optimize for a system that never says no. llm-as-judge is usable for groundedness if the judge is itself validated against human labels on a sample. - the gate and the operations. it runs in ci on every prompt, model or index change; the release criterion covers cost and latency as well as quality; and online, you track user-visible proxies - thumbs, escalation rate, follow-up rate - because the offline set will not predict everything. the sentence that closes it: \"the point of the harness is not the score, it is being able to change something and know within twenty minutes whether it made things worse.\" depth: ../08-genai category 10; ../09-rag category 11."}, {"n": 126, "category": 9, "difficulty": "D", "html": "Hallucination questions: how do you answer with mechanism rather than reassurance?", "answerTitle": "Hallucination with mechanism, not reassurance", "answer": "<p>Start with what it <em>is<\/em>, because the mechanism dictates the controls:<\/p><blockquote><p>&quot;The model is sampling a plausible continuation; it has no representation of &#x27;I do not know this&#x27;. So fluency and correctness are independent, and the fix is not to ask it to be accurate. There are three places to intervene. <strong>Before<\/strong>: ground it - put the answer in the context, and if retrieval found nothing above a relevance threshold, do not call the model at all, return the no-answer path. <strong>During<\/strong>: constrain what it can produce - a schema, an enum, an id that must exist. <strong>After<\/strong>: verify - check that every claim is supported by the retrieved text, check that cited ids exist, and for anything actionable, validate against the system of record before it reaches the user.&quot;<\/p><\/blockquote><p>Then the honest bound, which is the credibility move: &quot;none of that eliminates it. It reduces the rate and, more importantly, makes the remaining cases <em>detectable<\/em>. So the design question I actually care about is what happens when it is wrong - if a wrong answer is silent and consequential, no accuracy figure makes that architecture acceptable.&quot;<\/p><p><strong>Depth:<\/strong> <code>../08-genai<\/code> Category 11; <code>../09-rag<\/code> Category 12.<\/p>", "source": "answers.md", "search": "hallucination questions: how do you answer with mechanism rather than reassurance? start with what it is , because the mechanism dictates the controls: \"the model is sampling a plausible continuation; it has no representation of 'i do not know this'. so fluency and correctness are independent, and the fix is not to ask it to be accurate. there are three places to intervene. before : ground it - put the answer in the context, and if retrieval found nothing above a relevance threshold, do not call the model at all, return the no-answer path. during : constrain what it can produce - a schema, an enum, an id that must exist. after : verify - check that every claim is supported by the retrieved text, check that cited ids exist, and for anything actionable, validate against the system of record before it reaches the user.\" then the honest bound, which is the credibility move: \"none of that eliminates it. it reduces the rate and, more importantly, makes the remaining cases detectable . so the design question i actually care about is what happens when it is wrong - if a wrong answer is silent and consequential, no accuracy figure makes that architecture acceptable.\" depth: ../08-genai category 11; ../09-rag category 12."}, {"n": 127, "category": 9, "difficulty": "D", "html": "When do you say &quot;do not build an agent&quot;, and how do you say it to an interviewer whose team is building one?", "answerTitle": "\"Do not build an agent\" - and how to say it", "answer": "<p>Be for something rather than against their idea. The persuasive form is a <strong>comparison they can check<\/strong>.<\/p><blockquote><p>&quot;Let me ask five things first: can you draw this process as a flowchart today; how many genuinely distinct paths are there; are the actions reversible and reviewed; can you write fifty test cases right now; and what is your cost tolerance at the ninety-ninth percentile? … Given those answers, I would build a router plus four workflows, and keep one narrow agentic path for the residue that does not fit. It costs a fraction as much, you can test every path, and when it is wrong you can point at the branch. The place I would spend the agent budget instead is <em>[the hard part that is actually hard]<\/em>.&quot;<\/p><\/blockquote><p><strong>The tone that works with someone invested in the agent:<\/strong> you are not saying agents are bad, you are saying the lowest rung of the autonomy ladder that solves the problem is the right one, and you are offering to be wrong - &quot;if the paths turn out not to be enumerable, that is exactly when I would change my mind.&quot;<\/p><p><strong>Depth:<\/strong> <code>../10-ai-agents<\/code> Categories 1 and 7.<\/p>", "source": "answers.md", "search": "when do you say \"do not build an agent\", and how do you say it to an interviewer whose team is building one? be for something rather than against their idea. the persuasive form is a comparison they can check . \"let me ask five things first: can you draw this process as a flowchart today; how many genuinely distinct paths are there; are the actions reversible and reviewed; can you write fifty test cases right now; and what is your cost tolerance at the ninety-ninth percentile? … given those answers, i would build a router plus four workflows, and keep one narrow agentic path for the residue that does not fit. it costs a fraction as much, you can test every path, and when it is wrong you can point at the branch. the place i would spend the ag
