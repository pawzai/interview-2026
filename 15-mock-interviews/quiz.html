cale. provider outage: fail to a clear \"assistant unavailable\" rather than a degraded wrong answer, and never block the rest of the product. bad answers: a feedback control on every response, routed to the eval set. index lag: show the freshness boundary rather than silently answering from stale data. at 10x tenants, the operational issue is not compute - it is the long tail of tenants with unusual data shapes on which quality is quietly poor, which is an argument for the per-tenant metrics being built first. minutes 42-45 - close. \"retrieval-grounded, inside the existing permission context, event-driven indexing, per-tenant everything - quotas, metrics, rollout, kill switch. the two defining decisions are filtering inside retrieval rather than after it, and deferring actions to a second phase with a real authorization design. the weakest part is index freshness against permission changes; i have made permissions authoritative at query time to cover it, which costs latency, and if that budget is too tight the design gets harder. the thing i would want to measure before general availability is per-tenant quality, because the aggregate will look fine while a tenant with unusual data is having a bad experience.\" depth: ../09-rag categories 10-11; ../08-genai category 10; ../11-security category 12."}, {"n": 76, "category": 5, "difficulty": "A", "html": "Design round, 45 minutes, run end to end: a global API platform with regional data residency requirements.", "answerTitle": "Global API platform with data residency", "answer": "<blockquote><p>&quot;A public API used by customers worldwide. Some jurisdictions require that their residents&#x27; data never leaves the region. Design it.&quot;<\/p><\/blockquote><p>The trap is treating residency as a deployment detail. It is a <strong>data-model and routing<\/strong> problem, and saying that early is most of the round.<\/p><p><strong>Minutes 0-4 - scope and constrain.<\/strong><\/p><ul><li><strong>What exactly must stay in region - all data, personal data, or backups and logs too?<\/strong> This is the question that separates people who have done it. Assume: personal data at rest and in backups, and <strong>logs and telemetry count as data<\/strong> - which is the requirement that catches teams out.<\/li><li><strong>Can data be processed transiently outside the region?<\/strong> Assume no for the strict jurisdictions.<\/li><li><strong>Is there global data?<\/strong> Assume yes - a product catalogue, configuration, and the tenant directory - and that it is non-personal.<\/li><li><strong>Cross-region access by the customer&#x27;s own staff?<\/strong> Assume a user travelling should still work, which means the <em>access path<\/em> is global even though the <em>data<\/em> is not.<\/li><li><strong>Availability target?<\/strong> Assume 99.95 percent, which forces multi-AZ within a region and raises the awkward question of what a regional outage means when you cannot fail over.<\/li><\/ul><p><strong>Minutes 4-10 - the arithmetic and the shape.<\/strong> The key derivation is not volume, it is <strong>the number of regions and what that multiplies<\/strong>. Say it: &quot;every region multiplies my deployment surface, my on-call complexity, my per-environment cost floor and my release coordination. So the design goal is the smallest number of regions that satisfies the requirement, and a single deployment artifact that is configured per region rather than a per-region codebase.&quot;<\/p><p>If the base cost of a region - load balancing, NAT, a minimum database footprint, observability - is on the order of a few thousand dollars a month before any traffic, then five regions costs a five-figure monthly floor. That number changes the conversation with the business about which jurisdictions to support, and raising it unprompted is a strong signal.<\/p><p><strong>Minutes 10-25 - the design.<\/strong><\/p><p><em>The core decision: shard by residency.<\/em> Each tenant (or user) has a <strong>home region<\/strong> recorded in a global, non-personal <strong>directory<\/strong>. The directory maps identity to region and contains nothing that residency covers - an id and a region code. This is the linchpin: it is the only globally replicated store, and keeping it free of personal data is what makes the whole design compliant.<\/p><p><em>Routing.<\/em> A global anycast edge terminates TLS and looks up the home region from the directory (cached), then proxies to that region. Say the failure mode: if the request lands at the wrong edge and the payload contains personal data, has data left the region? Handle it by routing on identity <strong>before<\/strong> the body is processed or logged, and by treating the edge as a transit layer with no logging of bodies. If the jurisdiction forbids even transit, the answer is a region-specific hostname and DNS-level routing, and the customer&#x27;s client must use it.<\/p><p><em>Per-region stack.<\/em> Identical infrastructure deployed by the same pipeline with a region parameter. Data stores are regional with <strong>no cross-region replication of personal data<\/strong> - which means your disaster recovery story within a strict region is multi-AZ plus in-region backups, not a warm standby elsewhere. Say that trade-off explicitly: <strong>residency and cross-region DR are in direct tension<\/strong>, and the customer has to choose.<\/p><p><em>Global versus regional data.<\/em> Draw the line on the board: directory, catalogue, feature flags and configuration are global and replicated; everything user-generated is regional. Any new field is a residency decision, so the data model needs a classification annotation and a test that fails when an unclassified field is added to a regional entity.<\/p><p><em>Logs and telemetry.<\/em> Regional log storage with regional retention. Aggregate metrics - counts, latencies, error rates with no user identifiers - can be global. Traces are the problem, because they carry identifiers and cross services; either strip them at the regional boundary or keep traces regional and correlate on a hashed id.<\/p><p><strong>Minutes 25-38 - the deep dives.<\/strong><\/p><ul><li><strong>Cross-region operations that are unavoidable.<\/strong> Billing aggregation, global search, and a support engineer looking at a customer&#x27;s data. Handle the first two by exporting <strong>aggregates or pseudonymized data only<\/strong>. Handle the third with in-region support tooling and access controls - and say that this is usually where the real compliance failure happens, not in the architecture.<\/li><li><strong>Tenant migration between regions.<\/strong> It will be asked for. It is an export, an import, a cutover with a read-only window, and a verified deletion at the source - and the verified deletion is the hard part, especially in backups. Be honest: &quot;deletion from backups usually means waiting for the retention window to expire, and that has to be in the contract.&quot;<\/li><li><strong>Release engineering.<\/strong> One artifact, N regions, staged rollout region by region with the smallest first. Schema migrations run per region and must be backwards compatible, because the regions will not be at the same version simultaneously (Q99, Q110).<\/li><li><strong>The API contract.<\/strong> Regional endpoints with a documented discovery mechanism, and consistent behaviour across regions - a customer must not be able to detect which region they are in through behaviour differences, or you will get support tickets about it forever.<\/li><\/ul><p><strong>Minutes 38-42 - failure and scale.<\/strong> A regional outage in a strict jurisdiction means downtime for that jurisdiction, full stop - so say it out loud and make sure the business has agreed to it, because it is the consequence they least expect. A directory outage takes down routing globally, which makes it the single most critical component and the argument for it being tiny, heavily cached and independently deployable. At 10x tenants, the constraint is operational: the number of regions and the release coordination burden, not the request volume.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;Residency handled by sharding on a home region, with a tiny global directory that deliberately contains no personal data, identical per-region stacks from one pipeline, and a hard line between global and regional data enforced in the data model. The two defining decisions are the directory and the classification annotation with a failing test. <strong>The weakest part<\/strong> is disaster recovery in a strict region - I have traded cross-region failover for compliance and that is a real availability ceiling, so it needs to be an explicit, signed-off business decision rather than an architectural assumption.&quot;<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Categories 1 and 15; <code>../04-system-design<\/code> Category 9; <code>../11-security<\/code> Category 16.<\/p>", "source": "scenario-questions.md (S13)", "search": "design round, 45 minutes, run end to end: a global api platform with regional data residency requirements. \"a public api used by customers worldwide. some jurisdictions require that their residents' data never leaves the region. design it.\" the trap is treating residency as a deployment detail. it is a data-model and routing problem, and saying that early is most of the round. minutes 0-4 - scope and constrain. - what exactly must stay in region - all data, personal data, or backups and logs too? this is the question that separates people who have done it. assume: personal data at rest and in backups, and logs and telemetry count as data - which is the requirement that catches teams out. - can data be processed transiently outside the region? assume no for the strict jurisdictions. - is there global data? assume yes - a product catalogue, configuration, and the tenant directory - and that it is non-personal. - cross-region access by the customer's tname and dns-level routing, and the customer's client must use it. per-region stack. identical infrastructure deployed by the same pipeline with a region parameter. data stores are regional with no cross-region replication of personal data - which means your disaster recovery story within a strict region is multi-az plus in-region backups, not a warm standby elsewhere. say that trade-off explicitly: residency and cross-region dr are in direct tension , and the customer has to choose. global versus regional data. draw the line on the board: directory, catalogue, feature flags and configuration are global and replicated; everything user-generated is regional. any new field is a residency decision, so the data model needs a classification annotation and a test that fails when an unclassified field is added to a regional entity. logs and telemetry. regional log storage with regional retention. aggregate metrics - counts, latencies, error rates with no user identifiers - can be global. traces are the problem, because they carry identifiers and cross services; either strip them at the regional boundary or keep traces regional and correlate on a hashed id. minutes 25-38 - the deep dives. - cross-region operations that are unavoidable. billing aggregation, global search, and a support engineer looking at a customer's data. handle the first two by exporting aggregates or pseudonymized data only . handle the third with in-region support tooling and access controls - and say that this is usually where the real compliance failure happens, not in the architecture. - tenant migration between regions. it will be asked for. it is an export, an import, a cutover with a read-only window, and a verified deletion at the source - and the verified deletion is the hard part, especially in backups. be honest: \"deletion from backups usually means waiting for the retention window to expire, and that has to be in the contract.\" - release engineering. one artifact, n regions, staged rollout answer": "<blockquote><p>&quot;A ten-year-old Java monolith, on-premise, 400 tables, 1.2 million lines. The datacentre contract ends in fourteen months. You have a fixed budget. Go.&quot;<\/p><\/blockquote><p>The constraints are the question. A candidate who designs a target architecture and ignores the date has failed. <strong>The date is not negotiable and the scope is.<\/strong><\/p><p><strong>Minutes 0-4 - scope and constrain.<\/strong> The questions to ask, and what the answers do:<\/p><ul><li><strong>Is the date genuinely immovable, and what happens if we miss it?<\/strong> Assume immovable with a punitive extension cost. This makes it a <strong>risk-management<\/strong> exercise.<\/li><li><strong>What is the current deployment frequency and test coverage?<\/strong> Assume quarterly releases and thin coverage. This is the real constraint on how fast anything can move.<\/li><li><strong>How many integrations does it have, and who owns them?<\/strong> Assume 30, half owned by other teams. Integration coordination, not code, is usually the critical path.<\/li><li><strong>Does the business need new features during this period?<\/strong> Assume yes, some. A feature freeze is the thing everyone wants and nobody gets, so plan for parallel change.<\/li><li><strong>What is the data volume and the acceptable cutover downtime?<\/strong> Assume 4 TB and a four-hour weekend window.<\/li><\/ul><p><strong>Minutes 4-10 - the strategy, said before any architecture.<\/strong> This is the highest-scoring two minutes in the round:<\/p><blockquote><p>&quot;With fourteen months and a hard date, I would not rewrite and I would not decompose. The plan is <strong>rehost first, then improve<\/strong> - get it running on AWS as close to as-is as possible, prove it, cut over with time to spare, and use the remaining months for the highest-value modernization. A rewrite or a decomposition in this window is how you end up asking for the datacentre extension in month twelve, and I have seen that go badly. The counterargument is that lift-and-shift does not deliver the cloud benefits - true, and I would rather deliver the deadline and a roadmap than a partial architecture and a missed date. If we finish the migration in month nine, we have five months to strangle out the two components that would benefit most.&quot;<\/p><\/blockquote><p>Then set the budget frame: rehosting on right-sized instances with reserved capacity is predictable; the cost risk is in data transfer and in over-provisioning &quot;just in case&quot;, so the plan includes a load test that sets the sizing rather than guessing.<\/p><p><strong>Minutes 10-25 - the plan.<\/strong><\/p><p><em>Months 1-2: discovery and the two things that always bite.<\/em> Inventory the integrations and their network requirements, and inventory the <strong>hidden dependencies<\/strong> - the scheduled jobs on someone&#x27;s server, the shared file mount, the hard-coded IPs, the database links, the licence keys tied to a MAC address. Say that these are what actually delay migrations, not the application. In parallel, set up landing zone, network connectivity (Direct Connect or VPN) and the CI/CD pipeline, because everything else depends on it.<\/p><p><em>Months 2-5: the target and the automation.<\/em> Run the application on ECS or EC2 - choose EC2 if the app has any assumption about local state or a specific JVM tuning, ECS if it is genuinely stateless, and say the criterion. The database goes to RDS or Aurora if the engine is compatible, and <strong>the compatibility check is a month-one task<\/strong>, because an incompatibility here changes everything. Externalize configuration and secrets. Build the environment from Terraform so that the test environment and production are the same artifact.<\/p><p><em>Months 4-8: the data path.<\/em> Continuous replication from on-premise to AWS with a tool that supports ongoing change data capture, so that the cutover is a switchover rather than a copy. Practise the cutover <strong>at least three times<\/strong> in a non-production environment and once as a full dress rehearsal with the real data volume, timed. State the rollback: DNS or connection string back to on-premise, valid for as long as reverse replication runs - and that reverse replication is the part everyone forgets.<\/p><p><em>Months 8-10: cutover.<\/em> By component if the integrations allow, big-bang if they do not. Freeze non-essential change for two weeks around it. Have the go/no-go criteria written down in advance and agreed - not decided at 2am.<\/p><p><em>Months 10-14: the buffer, and then modernization.<\/em> Explicitly reserve two months of buffer before the contract ends, and say so: &quot;the plan finishes in month twelve so that a two-month slip does not become a crisis.&quot; With whatever is left, take the two highest-value improvements - typically extracting the component with the different scaling profile, and moving the batch jobs to a managed scheduler.<\/p><p><strong>Minutes 25-38 - the deep dives.<\/strong><\/p><ul><li><strong>Cutover mechanics and the go/no-go criteria.<\/strong> Replication lag under a threshold, a verified row-count and checksum comparison, the smoke suite passing, and every integration owner having confirmed readiness. Rollback rehearsed, not theoretical.<\/li><li><strong>How you keep delivering features during the migration.<\/strong> One codebase, deployed to both environments from the same pipeline as early as possible - because a long-lived migration branch is the second most common way this fails.<\/li><li><strong>Cost control.<\/strong> Right-size from a load test rather than from the on-premise specification, which is almost always over-provisioned; savings plans only after the sizing is proven; and a budget alarm from week one. Be honest that the first month on AWS will cost more than the steady state.<\/li><li><strong>The risk register<\/strong>, and name the top three: a database incompatibility discovered late, an integration owner who cannot move in time, and the hidden-dependency inventory being incomplete. Each with a mitigation and a date by which it must be resolved.<\/li><\/ul><p><strong>Minutes 38-42 - what could go wrong.<\/strong> Performance regression after cutover is the most likely surprise - different storage characteristics, different network latency between app and database, and a JVM sized for a machine that no longer exists. Mitigate with a load test at production volume in month five, not month eleven. The second is that the team is doing the migration and their day job; if the budget is fixed, say plainly that scope has to give somewhere and that you would rather cut modernization than cut rehearsal.<\/p><p><strong>Minutes 42-45 - close.<\/strong> &quot;Rehost first with a two-month buffer, then modernize with what is left. The defining decisions are refusing the rewrite and rehearsing the cutover three times. <strong>The part I would be most worried about<\/strong> is the integration owners I do not control, because that is the dependency I cannot fix with engineering - so I would want those conversations started in week one and a named owner per integration with a date. And I would want the go/no-go criteria agreed in month three, in writing, while everyone is calm.&quot;<\/p><p><strong>Depth:<\/strong> <code>../05-aws/core-services<\/code> Category 12; <code>../06-database<\/code> Category 12; <code>../07-devops<\/code> Category 1.<\/p>", "source": "scenario-questions.md (S14)", "search": "design round, 45 minutes, run end to end: rebuilding an on-premise java monolith on aws against a fixed budget and a hard date. \"a ten-year-old java monolith, on-premise, 400 tables, 1.2 million lines. the datacentre contract ends in fourteen months. you have a fixed budget. go.\" the constraints are the question. a candidate who designs a target architecture and ignores the date has failed. the date is not negotiable and the scope is. minutes 0-4 - scope and constrain. the questions to ask, and what the answers do: - is the date genuinely immovable, and what happens if we miss it? assume immovable with a punitive extension cost. this makes it a risk-management exercise. - what is the current deployment frequency and test coverage? assume quarterly releases and thin coverage. this is the real constraint on how fast anything can move. - how many integrations does it have, and who owns them? assume 30, half owned by other teams. integration coordination, not code, is usually the critical path. - does the business need new features during this period? assume yes, some. a feature freeze is the thing everyone wants and nobody gets, so plan for parallel change. - what is the data volume and the acceptable cutover downtime? assume 4 tb and a four-hour weekend window. minutes 4-10 - the strategy, said before any architecture. this is the highest-scoring two minutes in the round: \"with fourteen months and a hard date, i would not rewrite and i would not decompose. the plan is rehost first, then improve - get it running on aws as close to as-is as possible, prove it, cut over with time to spare, and use the remaining months for the highest-value modernization. a rewrite or a decomposition in this window is how you end up asking for the datacentre extension in month twelve, and i have seen that go badly. the counterargument is that lift-and-shift does not deliver the cloud benefits - true, and i would rather deliver the deadline and a roadmap than a partial architecture and a missed date. if we finish the migration in month nine, we have five months to strangle out the two components that would benefit most.\" then set the budget frame: rehosting on right-sized instances with reserved capacity is predictable; the cost risk is in data transfer and in over-provisioning \"just in case\", so the plan includes a load test that sets the sizing rather than guessing. minutes 10-25 - the plan. months 1-2: discovery and the two things that always bite. inventory the integrations and their network requirements, and inventory the hidden dependencies - the scheduled jobs on someone's server, the shared file mount, the hard-coded ips, the database links, the licence keys tied to a mac address. say that these are what actually delay migrations, not the application. in parallel, set up landing zone, network connectivity (direct connect or vpn) and the ci/cd pipeline, because everything else depends on it. months 2-5: the target and the automation. run the application on ecs or ec2 - choose ec2 if the app has any assumption about local state or a specific jvm tuning, ecs if it is genuinely stateless, and say the criterion. the database goes to rds or aurora if the engine is compatible, and the compatibility check is a month-one task , because an incompatibility here changes everything. externalize configuration and secrets. build the environment from terraform so that the test environment and production are the same artifact. months 4-8: the data path. continuous replication from on-premise to aws with a tool that supports ongoing change data capture, so that the cutover is a switchover rather than a copy. practise the cutover at least three times in a non-production environment and once as a full dress rehearsal with the real data volume, timed. state the rollback: dns or connection string back to on-premise, valid for as long as reverse replication runs - and that reverse replication is the part everyone forgets. months 8-10: cutover. by component if the integrations allow, big-bang if they do not. freeze non-essential change for two weeks around it. have the go/no-go criteria written down in advance and agreed - not decided at 2am. months 10-14: the buffer, and then modernization. explicitly reserve two months of buffer before the contract ends, and say so: \"the plan finishes in month twelve so that a two-month slip does not become a crisis.\" with whatever is left, take the two highest-value improvements - typically extracting the component with the different scaling profile, and moving the batch jobs to a managed scheduler. minutes 25-38 - the deep dives. - cutover mechanics and the go/no-go criteria. replication lag under a threshold, a verified row-count and checksum comparison, the smoke suite passing, and every integration owner having confirmed readiness. rollback rehearsed, not theoretical. - how you keep delivering features during the migration. one codebase, deployed to both environments from the same pipeline as early as possible - because a long-lived migration branch is the second most common way this fails. - cost control. right-size from a load test rather than from the on-premise specification, which is almost always over-provisioned; savings plans only after the sizing is proven; and a budget alarm from week one. be honest that the first month on aws will cost more than the steady state. - the risk register , and name the top three: a database incompatibility discovered late, an integration owner who cannot move in time, and the hidden-dependency inventory being incomplete. each with a mitigation and a date by which it must be resolved. minutes 38-42 - what could go wrong. performance regression after cutover is the most likely surprise - different storage characteristics, different network latency between app and database, and a jvm sized for a machine that no longer exists. mitigate with a load test at production volume in month five, not month eleven. the second is that the team is doing the migration and their day job; if the budget is fixed, say plainly that scope has to give somewhere and that you would rather cut modernization than cut rehearsal. minutes 42-45 - close. \"rehost first with a two-month buffer, then modernize with what is left. the defining decisions are refusing the rewrite and rehearsing the cutover three times. the part i would be most worried about is the integration owners i do not control, because that is the dependency i cannot fix with engineering - so i would want those conversations started in week one and a named owner per integration with a date. and i would want the go/no-go criteria agreed in month three, in writing, while everyone is calm.\" depth: ../05-aws/core-services category 12; ../06-database category 12; ../07-devops category 1."}, {"n": 78, "category": 6, "difficulty": "C", "html": "&quot;Walk me through what happens when a request hits your AWS architecture.&quot; What shape of answer is expected?", "answerTitle": "\"Walk me through what happens when a request hits your architecture\"", "answer": "<p>Expected shape: a <strong>narrated path with a decision at each hop<\/strong>, not a list of services. Roughly eight to ten hops, thirty seconds each, and you should be able to say what happens if each one fails.<\/p><blockquote><p>&quot;DNS resolves through Route 53 with a latency policy to the nearest region. TLS terminates at CloudFront, which serves static assets from cache and forwards the rest to a regional ALB via an origin group with failover. WAF sits at the edge with rate rules per IP and per API key. The ALB routes by path to target groups on ECS Fargate; health checks are on a readiness endpoint that does not check downstream dependencies, deliberately. The service authenticates the caller against a JWT verified with a cached JWKS, authorizes against <em>[the model]<\/em>, reads from Aurora with the reader endpoint for queries and the writer for commands, and writes an event to the outbox table in the same transaction. A relay publishes to EventBridge, which fans out to the consumers…&quot;<\/p><\/blockquote><p><strong>What makes it score:<\/strong> the small justifications embedded in it - &quot;does not check downstream dependencies, deliberately&quot; (Q53), the outbox in the same transaction (Q48), the reader endpoint. Each one is an invitation to a follow-up you are ready for.<\/p><p><strong>Red flag:<\/strong> naming services without saying why any of them is there.<\/p>", "source": "answers.md", "search": "\"walk me through what happens when a request hits your aws architecture.\" what shape of answer is expected? expected shape: a narrated path with a decision at each hop , not a list of services. roughly eight to ten hops, thirty seconds each, and you should be able to say what happens if each one fails. \"dns resolves through route 53 with a latency policy to the nearest region. tls terminates at cloudfront, which serves static assets from cache and forwards the rest to a regional alb via an origin group with failover. waf sits at the edge with rate rules per ip and per api key. the alb routes by path to target groups on ecs fargate; health checks are on a readiness endpoint that does not check downstream dependencies, deliberately. the service authenticates the caller against a jwt verified with a cached jwks, authorizes against [the model] , reads from aurora with the reader endpoint for queries and the writer for commands, and writes an event to the outbox table in the same transaction. a relay publishes to eventbridge, which fans out to the consumers…\" what makes it score: the small justifications embedded in it - \"does not check downstream dependencies, deliberately\" (q53), the outbox in the same transaction (q48), the reader endpoint. each one is an invitation to a follow-up you are ready for. red flag: naming services without saying why any of them is there."}, {"n": 79, "category": 6, "difficulty": "D", "html": "The interviewer asks which compute you would choose. What decision tree do you say out loud?", "answerTitle": "The compute decision tree, out loud", "answer": "<blockquote><p>&quot;I decide in this order. <strong>How long does one unit of work run?<\/strong> Over fifteen minutes, Lambda is out. <strong>How spiky is it?<\/strong> Idle most of the time with sharp bursts favours Lambda or Fargate; steady, predictable load favours EC2 or ECS on EC2 with savings plans, because at high steady utilization serverless is the expensive option. <strong>What is the latency requirement?<\/strong> If cold start on the p99 matters and the runtime is heavy, that pushes to a warm service. <strong>What does the team operate well?<\/strong> A team with no Kubernetes experience should not get EKS for three services. <strong>What is the state?<\/strong> Anything with a long-lived connection - WebSockets, streaming - changes the answer.&quot;<\/p><\/blockquote><p>Then land it: &quot;for most of the services I have built - steady traffic, a few hundred requests per second, JVM runtime - ECS on Fargate is the default, and I move to EC2 when the bill or a specialized instance type justifies the operational cost.&quot;<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Category 6; <code>../05-aws/core-services<\/code> Categories 1 and 11.<\/p>", "source": "answers.md", "search": "the interviewer asks which compute you would choose. what decision tree do you say out loud? \"i decide in this order. how long does one unit of work run? over fifteen minutes, lambda is out. how spiky is it? idle most of the time with sharp bursts favours lambda or fargate; steady, predictable load favours ec2 or ecs on ec2 with savings plans, because at high steady utilization serverless is the expensive option. what is the latency requirement? if cold start on the p99 matters and the runtime is heavy, that pushes to a warm service. what does the team operate well? a team with no kubernetes experience should not get eks for three services. what is the state? anything with a long-lived connection - websockets, streaming - changes the answer.\" then land it: \"for most of the services i have built - steady traffic, a few hundred requests per second, jvm runtime - ecs on fargate is the default, and i move to ec2 when the bill or a specialized instance type justifies the operational cost.\" depth: ../05-aws category 6; ../05-aws/core-services categories 1 and 11."}, {"n": 80, "category": 6, "difficulty": "T", "html": "&quot;Lambda is cheaper.&quot; How do you handle a claim that is true only within a range?", "answerTitle": "\"Lambda is cheaper\"", "answer": "<p>It is true in a range, and the honest answer names the range and the crossover.<\/p><blockquote><p>&quot;Cheaper per request at low or spiky volume, and it also removes work you would otherwise pay a person for. It stops being cheaper at sustained high utilization, because you are paying for GB-seconds with no commitment discount, while a reserved or savings-plan EC2 fleet at seventy percent utilization is dramatically cheaper per unit of compute. The crossover depends on the memory setting and duration, so the way I would settle it is arithmetic rather than opinion: <em>[requests per month × duration × memory]<\/em> against the equivalent fleet. And I would include the costs people leave out on both sides - API Gateway or the ALB, NAT data processing, and the engineering time for the parts serverless removes.&quot;<\/p><\/blockquote><p><strong>The principal-level addition:<\/strong> cost is rarely the deciding factor at small scale, and at large scale it deserves a real model rather than a rule of thumb. Offer to do the arithmetic if they want - it is a strong move and it is Q85&#x27;s answer too.<\/p>", "source": "answers.md", "search": "\"lambda is cheaper.\" how do you handle a claim that is true only within a range? it is true in a range, and the honest answer names the range and the crossover. \"cheaper per request at low or spiky volume, and it also removes work you would otherwise pay a person for. it stops being cheaper at sustained high utilization, because you are paying for gb-seconds with no commitment discount, while a reserved or savings-plan ec2 fleet at seventy percent utilization is dramatically cheaper per unit of compute. the crossover depends on the memory setting and duration, so the way i would settle it is arithmetic rather than opinion: [requests per month × duration × memory] against the equivalent fleet. and i would include the costs people leave out on both sides - api gateway or the alb, nat data processing, and the engineering time for the parts serverless removes.\" the principal-level addition: cost is rarely the deciding factor at small scale, and at large scale it deserves a real model rather than a rule of thumb. offer to do the arithmetic if they want - it is a strong move and it is q85's answer too."}, {"n": 81, "category": 6, "difficulty": "D", "html": "IAM questions at architect level: what separates a real answer from a console-driven one?", "answerTitle": "IAM at architect level", "answer": "<p>A console-driven answer talks about users, groups and attaching managed policies. An architect answer is about <strong>identity as the boundary<\/strong>:<\/p><ul><li><strong>Roles, not users.<\/strong> Workloads assume roles; humans federate through SSO into roles with a session. Long-lived access keys are an incident waiting to be reported, and their absence is a design property you can assert.<\/li><li><strong>The trust policy is the security control<\/strong>, not the permission policy. Who can assume this role, from where, under what conditions - and for cross-account or third-party access, the external id and the confused deputy problem.<\/li><li><strong>Boundaries you cannot exceed<\/strong>: service control policies at the organization level, permission boundaries for delegated administration, so a team can create roles without escalating.<\/li><li><strong>How you actually reach least privilege<\/strong>: not by writing it by hand, but by starting broad in non-production with Access Analyzer or CloudTrail-derived policies, then tightening. Say that out loud - it is what people actually do and claiming otherwise is not credible.<\/li><li><strong>Data-plane versus control-plane<\/strong>: an S3 bucket policy and a KMS key policy are separate gates, and a role with <code>s3:GetObject<\/code> and no <code>kms:Decrypt<\/code> fails in a way that confuses people for an hour.<\/li><\/ul><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Categories 1-2; <code>../11-security<\/code> Category 13.<\/p>", "source": "answers.md", "search": "iam questions at architect level: what separates a real answer from a console-driven one? a console-driven answer talks about users, groups and attaching managed policies. an architect answer is about identity as the boundary : - roles, not users. workloads assume roles; humans federate through sso into roles with a session. long-lived access keys are an incident waiting to be reported, and their absence is a design property you can assert. - the trust policy is the security control , not the permission policy. who can assume this role, from where, under what conditions - and for cross-account or third-party access, the external id and the confused deputy problem. - boundaries you cannot exceed : service control policies at the organization level, permission boundaries for delegated administration, so a team can create roles without escalating. - how you actually reach least privilege : not by writing it by hand, but by starting broad in non-production with access analyzer or cloudtrail-derived policies, then tightening. say that out loud - it is what people actually do and claiming otherwise is not credible. - data-plane versus control-plane : an s3 bucket policy and a kms key policy are separate gates, and a role with s3:getobject and no kms:decrypt fails in a way that confuses people for an hour. depth: ../05-aws categories 1-2; ../11-security category 13."}, {"n": 82, "category": 6, "difficulty": "D", "html": "VPC and connectivity: what must you be able to draw without hesitation, and what is safe to defer?", "answerTitle": "VPC: what to draw without hesitation", "answer": "<p>Must be immediate: the region and its availability zones, public and private subnets per AZ, an internet gateway for public, NAT for private egress, route tables as the thing that actually defines &quot;public&quot;, security groups as stateful instance-level rules versus NACLs as stateless subnet-level ones, and where the load balancer and the database sit.<\/p><p>Must be immediate and is often forgotten: <strong>VPC endpoints<\/strong>, and the reason - gateway endpoints for S3 and DynamoDB are free and keep that traffic off NAT, and NAT data processing charges are one of the most common surprise line items in an AWS bill.<\/p><p>Safe to defer: Transit Gateway topologies, Direct Connect versus VPN specifics, IPv6, PrivateLink for third parties. Say &quot;I would need to look at the specifics&quot; and name what would decide it.<\/p><p><strong>The one number worth knowing:<\/strong> cross-AZ traffic is charged in both directions, which is why a chatty service spread across three AZs can have a data-transfer bill larger than its compute.<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Category 3; <code>../05-aws/core-services<\/code> Category 8.<\/p>", "source": "answers.md", "search": "vpc and connectivity: what must you be able to draw without hesitation, and what is safe to defer? must be immediate: the region and its availability zones, public and private subnets per az, an internet gateway for public, nat for private egress, route tables as the thing that actually defines \"public\", security groups as stateful instance-level rules versus nacls as stateless subnet-level ones, and where the load balancer and the database sit. must be immediate and is often forgotten: vpc endpoints , and the reason - gateway endpoints for s3 and dynamodb are free and keep that traffic off nat, and nat data processing charges are one of the most common surprise line items in an aws bill. safe to defer: transit gateway topologies, direct connect versus vpn specifics, ipv6, privatelink for third parties. say \"i would need to look at the specifics\" and name what would decide it. the one number worth knowing: cross-az traffic is charged in both directions, which is why a chatty service spread across three azs can have a data-transfer bill larger than its compute. depth: ../05-aws category 3; ../05-aws/core-services category 8."}, {"n": 83, "category": 6, "difficulty": "D", "html": "&quot;How do you do multi-region?&quot; How do you answer in a way that proves you know what it costs?", "answerTitle": "\"How do you do multi-region?\" with the cost visible", "answer": "<p>Refuse the single answer and give the ladder, with what each rung costs:<\/p><table><thead><tr><th>Rung<\/th><th>What you get<\/th><th>What it costs<\/th><\/tr><\/thead><tbody><tr><td>Backup and restore to another region<\/td><td>RPO hours, RTO hours<\/td><td>Almost nothing; a plan and a tested runbook<\/td><\/tr><tr><td>Pilot light<\/td><td>RTO tens of minutes<\/td><td>Data replication plus a small standing footprint<\/td><\/tr><tr><td>Warm standby<\/td><td>RTO minutes<\/td><td>Roughly double the data cost, a fraction of the compute<\/td><\/tr><tr><td>Active-active<\/td><td>RTO near zero<\/td><td>Double everything, plus <strong>the real cost: you now have a distributed data problem<\/strong><\/td><\/tr><\/tbody><\/table><blockquote><p>&quot;The reason I would push hard on which rung you need is that active-active is not a deployment topology, it is a data model decision. The moment writes happen in two regions, you own conflict resolution, and the honest options are partitioning users by home region so conflicts cannot occur, or accepting last-writer-wins and its data loss, or CRDTs for the small set of things they fit. Most teams that say active-active mean warm standby with a fast DNS failover, and that is usually the right answer.&quot;<\/p><\/blockquote><p>Add the operational point that is the real killer: <strong>an untested failover is not a failover.<\/strong> Ask when they last ran one.<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Category 15; <code>../04-system-design<\/code> Category 9.<\/p>", "source": "answers.md", "search": "\"how do you do multi-region?\" how do you answer in a way that proves you know what it costs? refuse the single answer and give the ladder, with what each rung costs: rung what you get what it costs --- --- --- backup and restore to another region rpo hours, rto hours almost nothing; a plan and a tested runbook pilot light rto tens of minutes data replication plus a small standing footprint warm standby rto minutes roughly double the data cost, a fraction of the compute active-active rto near zero double everything, plus the real cost: you now have a distributed data problem \"the reason i would push hard on which rung you need is that active-active is not a deployment topology, it is a data model decision. the moment writes happen in two regions, you own conflict resolution, and the honest options are partitioning users by home region so conflicts cannot occur, or accepting last-writer-wins and its data loss, or crdts for the small set of things they fit. most teams that say active-active mean warm standby with a fast dns failover, and that is usually the right answer.\" add the operational point that is the real killer: an untested failover is not a failover. ask when they last ran one. depth: ../05-aws category 15; ../04-system-design category 9."}, {"n": 84, "category": 6, "difficulty": "T", "html": "You are asked about an AWS service you have never used. Bound the answer honestly and still score.", "answerTitle": "Asked about a service you have never used", "answer": "<p>Bound it, reason from the category, and say what you would check. See Q31 for the general form; the AWS-specific version has one extra move available:<\/p><blockquote><p>&quot;I have not used <em>[X]<\/em>. I know the category it sits in - it is <em>[managed streaming / a queue / a graph database]<\/em> - so the questions I would ask are the ones I ask of anything in that category: what are the throughput and size limits, what is the failure mode when I exceed them, what does it cost at my volume, and is it regional or global. What I would not do is put it on a critical path in a design review without having run a load test against those limits, because managed services fail at quotas rather than gracefully.&quot;<\/p><\/blockquote><p>That last clause is a genuinely senior observation and it converts a knowledge gap into evidence of judgement (Q89).<\/p>", "source": "answers.md", "search": "you are asked about an aws service you have never used. bound the answer honestly and still score. bound it, reason from the category, and say what you would check. see q31 for the general form; the aws-specific version has one extra move available: \"i have not used [x] . i know the category it sits in - it is [managed streaming / a queue / a graph database] - so the questions i would ask are the ones i ask of anything in that category: what are the throughput and size limits, what is the failure mode when i exceed them, what does it cost at my volume, and is it regional or global. what i would not do is put it on a critical path in a design review without having run a load test against those limits, because managed services fail at quotas rather than gracefully.\" that last clause is a genuinely senior observation and it converts a knowledge gap into evidence of judgement (q89)."}, {"n": 85, "category": 6, "difficulty": "D", "html": "What makes a cost answer credible, and what makes it sound like a slide?", "answerTitle": "What makes a cost answer credible", "answer": "<p><strong>Arithmetic, a dominant term, and a lever.<\/strong> Vague answers about right-sizing and reserved instances read as a slide.<\/p><blockquote><p>&quot;For a service like this the bill is usually three things: compute, data transfer and the managed data stores - and the one that surprises people is data transfer, specifically NAT processing and cross-AZ. So the first thing I do is not optimize, it is <strong>attribute<\/strong>: tags per service and per environment, and Cost Explorer grouped by that, because you cannot manage what you cannot attribute. Then I look for the dominant term. On the last system I looked at, <em>[X]<\/em> was sixty percent and everything else was noise, so the only conversation worth having was about <em>[X]<\/em>.&quot;<\/p><\/blockquote><p>Then the levers in order of typical yield: turn off what nobody uses, fix the storage class and retention on data that grows forever, right-size the over-provisioned thing, then commitments (savings plans and reserved capacity) last - because committing to waste locks it in.<\/p><p><strong>The credibility marker:<\/strong> naming a percentage split you have actually seen.<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Category 16; <code>../07-devops<\/code> FinOps category.<\/p>", "source": "answers.md", "search": "what makes a cost answer credible, and what makes it sound like a slide? arithmetic, a dominant term, and a lever. vague answers about right-sizing and reserved instances read as a slide. \"for a service like this the bill is usually three things: compute, data transfer and the managed data stores - and the one that surprises people is data transfer, specifically nat processing and cross-az. so the first thing i do is not optimize, it is attribute : tags per service and per environment, and cost explorer grouped by that, because you cannot manage what you cannot attribute. then i look for the dominant term. on the last system i looked at, [x] was sixty percent and everything else was noise, so the only conversation worth having was about [x] .\" then the levers in order of typical yield: turn off what nobody uses, fix the storage class and retention on data that grows forever, right-size the over-provisioned thing, then commitments (savings plans and reserved capacity) last - because committing to waste locks it in. the credibility marker: naming a percentage split you have actually seen. depth: ../05-aws category 16; ../07-devops finops category."}, {"n": 86, "category": 6, "difficulty": "D", "html": "&quot;How do you deploy infrastructure?&quot; Terraform, CDK or CloudFormation - what is actually being probed by the question?", "answerTitle": "\"How do you deploy infrastructure?\"", "answer": "<p>Being probed: whether infrastructure is <strong>code with a review, a test and a state model<\/strong>, or a console with a wiki page. The tool is nearly irrelevant.<\/p><p>Say the properties first: everything in version control, changes go through review, a plan is produced and read before apply, apply happens from CI rather than a laptop, state is remote and locked, and drift is detected rather than discovered.<\/p><p>Then the tool choice with a real trade-off: &quot;Terraform when there is more than one provider or the team already has it, because the ecosystem and the state model are mature and the language is not fighting me. CDK when the team is strong in one language and the infrastructure is AWS-only and app-adjacent - the abstraction is genuinely productive, at the cost of a compile step producing CloudFormation you then have to debug when it fails. Raw CloudFormation only where something requires it.&quot;<\/p><p><strong>The follow-up that catches people:<\/strong> &quot;how do you handle a change that Terraform wants to replace rather than update?&quot; Have an answer - plan review as the control, <code>create_before_destroy<\/code>, and the fact that this is exactly why the plan must be read by a human.<\/p><p><strong>Depth:<\/strong> <code>../07-devops<\/code> Category 9.<\/p>", "source": "answers.md", "search": "\"how do you deploy infrastructure?\" terraform, cdk or cloudformation - what is actually being probed by the question? being probed: whether infrastructure is code with a review, a test and a state model , or a console with a wiki page. the tool is nearly irrelevant. say the properties first: everything in version control, changes go through review, a plan is produced and read before apply, apply happens from ci rather than a laptop, state is remote and locked, and drift is detected rather than discovered. then the tool choice with a real trade-off: \"terraform when there is more than one provider or the team already has it, because the ecosystem and the state model are mature and the language is not fighting me. cdk when the team is strong in one language and the infrastructure is aws-only and app-adjacent - the abstraction is genuinely productive, at the cost of a compile step producing cloudformation you then have to debug when it fails. raw cloudformation only where something requires it.\" the follow-up that catches people: \"how do you handle a change that terraform wants to replace rather than update?\" have an answer - plan review as the control, create_before_destroy, and the fact that this is exactly why the plan must be read by a human. depth: ../07-devops category 9."}, {"n": 87, "category": 6, "difficulty": "D", "html": "How do you use Well-Architected in an answer without reciting the pillars?", "answerTitle": "Well-Architected without reciting pillars", "answer": "<p>Use it as a <strong>checklist you run silently<\/strong> and surface only where it changes a decision. Reciting the six pillars is the tell of someone who has read the whitepaper and not run a review.<\/p><blockquote><p>&quot;I have run reviews against it. The way it is actually useful is as a prompt for the questions nobody asked - most designs I review are strong on reliability and have never had a serious conversation about cost or about operational readiness. So the two questions I bring from it are &#x27;what does the on-call person do when this pages&#x27; and &#x27;what is the unit cost of this and how does it move with usage&#x27;.&quot;<\/p><\/blockquote><p>Then, if they push: name the pillar relevant to the thing you are discussing, once, and move on. One accurate application beats a complete recitation.<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Well-Architected category.<\/p>", "source": "answers.md", "search": "how do you use well-architected in an answer without reciting the pillars? use it as a checklist you run silently and surface only where it changes a decision. reciting the six pillars is the tell of someone who has read the whitepaper and not run a review. \"i have run reviews against it. the way it is actually useful is as a prompt for the questions nobody asked - most designs i review are strong on reliability and have never had a serious conversation about cost or about operational readiness. so the two questions i bring from it are 'what does the on-call person do when this pages' and 'what is the unit cost of this and how does it move with usage'.\" then, if they push: name the pillar relevant to the thing you are discussing, once, and move on. one accurate application beats a complete recitation. depth: ../05-aws well-architected category."}, {"n": 88, "category": 6, "difficulty": "T", "html": "The interviewer&#x27;s own architecture has a single-AZ RDS instance in it. Do you point it out, and how?", "answerTitle": "Their architecture has a single-AZ RDS", "answer": "<p>Yes, you point it out - failing to notice is worse than any awkwardness. But <strong>how<\/strong> you do it is the entire test (Q166).<\/p><blockquote><p>&quot;Can I check one thing on the database - is that single-AZ deliberate? … The reason I ask is that a single-AZ RDS has a maintenance and failure window measured in tens of minutes, which would not fit a 99.9 percent target on the read path. If this is a non-production environment or the RTO genuinely allows it, that is a reasonable cost saving and I would leave it.&quot;<\/p><\/blockquote><p>Three properties: it is a question, not a verdict; it names the specific consequence rather than the label; and it offers a world in which they are right. If they say &quot;yes, we know, it is on the list&quot;, the correct response is &quot;makes sense&quot; and move on - relitigating a known trade-off is a negative signal.<\/p>", "source": "answers.md", "search": "the interviewer's own architecture has a single-az rds instance in it. do you point it out, and how? yes, you point it out - failing to notice is worse than any awkwardness. but how you do it is the entire test (q166). \"can i check one thing on the database - is that single-az deliberate? … the reason i ask is that a single-az rds has a maintenance and failure window measured in tens of minutes, which would not fit a 99.9 percent target on the read path. if this is a non-production environment or the rto genuinely allows it, that is a reasonable cost saving and i would leave it.\" three properties: it is a question, not a verdict; it names the specific consequence rather than the label; and it offers a world in which they are right. if they say \"yes, we know, it is on the list\", the correct response is \"makes sense\" and move on - relitigating a known trade-off is a negative signal."}, {"n": 89, "category": 6, "difficulty": "D", "html": "Quotas, throttling and limits: which anecdote proves operational experience in one minute?", "answerTitle": "Quotas and limits: the anecdote", "answer": "<p>The anecdote should show that you learned quotas are a <strong>design input<\/strong>, not an operational surprise.<\/p><blockquote><p>&quot;We hit the Lambda concurrent execution limit during a replay - the backlog drained faster than steady state, concurrency spiked to the account limit, and the throttling hit an unrelated service in the same account, which is what actually caused the incident. Two lessons: reserved concurrency on the noisy function so it cannot consume the account pool, and a separate account for workloads with burst profiles. Since then, quotas are something I look up during design rather than during an incident, and the ones I check by default are concurrency, per-service TPS on anything with a hard limit, and the ENI and IP limits in the subnet, because that one fails in a way that looks like a networking bug.&quot;<\/p><\/blockquote><p><strong>Why it lands:<\/strong> a blast radius that crossed a boundary, a structural fix rather than a limit increase, and a default practice that came out of it.<\/p><p><strong>Depth:<\/strong> <code>../05-aws<\/code> Category 14.<\/p>", "source": "answers.md", "search": "quotas, throttling and limits: which anecdote proves operational experience in one minute? the anecdote should show that you learned quotas are a design input , not an operational surprise. \"we hit the lambda concurrent execution limit during a replay - the backlog drained faster than steady state, concurrency spiked to the account limit, and the throttling hit an unrelated service in the same account, which is what actually caused the incident. two lessons: reserved concurrency on the noisy function so it cannot consume the account pool, and a separate account for workloads with burst profiles. since then, quotas are something i look up during design rather than during an incident, and the ones i check by default are concurrency, per-service tps on anything with a hard limit, and the eni and ip limits in the subnet, because that one fails in a way that looks like a networking bug.\" why it lands: a blast radius that crossed a boundary, a structural fix rather than a limit increase, and a default practice that came out of it. depth: ../05-aws category 14."}, {"n": 90, "category": 6, "difficulty": "A", "html": "You are given an AWS architecture on a whiteboard and twenty minutes to review and improve it.", "answerTitle": "Twenty-minute whiteboard architecture review", "answer": "<p>Run it as an inspection with a stated order, so they can follow you (Q164).<\/p><p>Sequence: <strong>ask what it is for and what the constraints are<\/strong> (two minutes - never critique before this); <strong>trace one request end to end<\/strong> and find the hops nobody mentioned; <strong>find the state<\/strong> - where data lives, what is authoritative, what is a cache, and what happens when they disagree; <strong>find the single points of failure and the blast radii<\/strong>, including account and region boundaries; <strong>check the boring operational things<\/strong> - deploys, secrets, backups, and whether anyone would know it broke; <strong>then cost<\/strong>, because it is usually the thing they have not modelled and it is where you can add something they did not expect.<\/p><p>Deliver findings in three buckets, out loud: &quot;one thing I think is wrong, two things I would want to understand better, and one thing I would do differently but would not fight about.&quot; That framing is itself the strongest signal in the round - it separates blocking from preference (Q168) and it is what a good staff engineer sounds like in a real review.<\/p>", "source": "answers.md", "search": "you are given an aws architecture on a whiteboard and twenty minutes to review and improve it. run it as an inspection with a stated order, so they can follow you (q164). sequence: ask what it is for and what the constraints are (two minutes - never critique before this); trace one request end to end and find the hops nobody mentioned; find the state - where data lives, what is authoritative, what is a cache, and what happens when they disagree; find the single points of failure and the blast radii , including account and region boundaries; check the boring operational things - deploys, secrets, backups, and whether anyone would know it broke; then cost , because it is usually the thing they have not modelled and it is where you can add something they did not expect. deliver findings in three buckets, out loud: \"one thing i think is wrong, two things i would want to understand better, and one thing i would do differently but would not fight about.\" that framing is itself the strongest signal in the round - it separates blocking from preference (q168) and it is what a good staff engineer sounds like in a real review."}, {"n": 91, "category": 6, "difficulty": "A", "html": "Justify an on-premise-to-AWS migration to a finance-facing stakeholder who is part of the loop.", "answerTitle": "Justifying a migration to a finance stakeholder", "answer": "<p>Change the vocabulary completely. Not availability zones - <strong>money, risk and time<\/strong>.<\/p><ul><li><strong>Lead with the run-rate comparison including the parts they are already paying but do not see<\/strong>: data centre, hardware refresh cycle, the people-hours spent on maintenance, the cost of capacity bought for peak and idle the rest of the year.<\/li><li><strong>Be honest that lift-and-shift is usually not cheaper<\/strong>, because that is the claim that destroys credibility six months in when the bill arrives. The savings come from elasticity and from retiring things, and both require work after the move.<\/li><li><strong>Quantify the risk you are removing<\/strong> in their terms: the hardware that is out of support, the recovery time if the data centre is lost today versus after, and the audit findings that go away.<\/li><li><strong>Give them a staged commitment<\/strong>, not a big bang: a first workload with a measurable outcome and a defined spend cap, a decision point, then the rest. Finance stakeholders are far more comfortable with a tranche than a program.<\/li><li><strong>Name what could make it a mistake.<\/strong> &quot;If our load is genuinely flat and our hardware is depreciated, the cost case is weak and we would be doing it for agility, which is harder to put a number on.&quot; Volunteering the counter-case is what makes the rest believable.<\/li><\/ul>", "source": "answers.md", "search": "justify an on-premise-to-aws migration to a finance-facing stakeholder who is part of the loop. change the vocabulary completely. not availability zones - money, risk and time . - lead with the run-rate comparison including the parts they are already paying but do not see : data centre, hardware refresh cycle, the people-hours spent on maintenance, the cost of capacity bought for peak and idle the rest of the year. - be honest that lift-and-shift is usually not cheaper , because that is the claim that destroys credibility six months in when the bill arrives. the savings come from elasticity and from retiring things, and both require work after the move. - quantify the risk you are removing in their terms: the hardware that is out of support, the recovery time if the data centre is lost today versus after, and the audit findings that go away. - give them a staged commitment , not a big bang: a first workload with a measurable outcome and a defined spend cap, a decision point, then the rest. finance stakeholders are far more comfortable with a tranche than a program. - name what could make it a mistake. \"if our load is genuinely flat and our hardware is depreciated, the cost case is weak and we would be doing it for agility, which is harder to put a number on.\" volunteering the counter-case is what makes the rest believable."}, {"n": 92, "category": 7, "difficulty": "C", "html": "&quot;Write me a query.&quot; What is the interviewer actually reading while you type?", "answerTitle": "\"Write me a query\" - what they are reading", "answer": "<p>Not SQL syntax. They are reading: <strong>do you ask about the schema and the indexes before writing<\/strong>; do you know what the query will do to the database, not just what it returns; do you handle nulls and duplicates deliberately; and can you explain the join strategy you expect.<\/p><p>The move that scores immediately: before typing, say &quot;let me check my assumptions - is there an index on <em>[column]<\/em>, and roughly how many rows are we talking about? Because at ten thousand rows I would write the readable version and at a hundred million I would write a different query.&quot;<\/p><p>Then write the readable version, and say what you expect the planner to do. If you are asked to optimize, that is the second half of the round, and now you have set it up.<\/p><p><strong>Red flags:<\/strong> a correlated subquery per row with no comment on it, <code>SELECT *<\/code> in a production example, or <code>DISTINCT<\/code> used to paper over a join that multiplies rows.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Categories 2-3.<\/p>", "source": "answers.md", "search": "\"write me a query.\" what is the interviewer actually reading while you type? not sql syntax. they are reading: do you ask about the schema and the indexes before writing ; do you know what the query will do to the database, not just what it returns; do you handle nulls and duplicates deliberately; and can you explain the join strategy you expect. the move that scores immediately: before typing, say \"let me check my assumptions - is there an index on [column] , and roughly how many rows are we talking about? because at ten thousand rows i would write the readable version and at a hundred million i would write a different query.\" then write the readable version, and say what you expect the planner to do. if you are asked to optimize, that is the second half of the round, and now you have set it up. red flags: a correlated subquery per row with no comment on it, select in a production example, or distinct used to paper over a join that multiplies rows. depth: ../06-database categories 2-3."}, {"n": 93, "category": 7, "difficulty": "D", "html": "Indexing questions come in three levels of depth. Name them and say what each one is filtering for.", "answerTitle": "The three levels of an indexing question", "answer": "<ul><li><strong>Level 1 - what an index is:<\/strong> a B-tree keyed on the column, so lookups are logarithmic rather than a scan; writes pay for maintaining it. Everyone passes this.<\/li><li><strong>Level 2 - composite order, covering and selectivity:<\/strong> leftmost prefix rule, why <code>(a, b)<\/code> serves <code>WHERE a = ? AND b = ?<\/code> and <code>WHERE a = ?<\/code> but not <code>WHERE b = ?<\/code>; an index that includes the selected columns avoids the heap fetch entirely; and the fact that an index on a low-selectivity column may be ignored because a sequential scan is genuinely cheaper. This level separates most candidates.<\/li><li><strong>Level 3 - the planner and the operational reality:<\/strong> statistics drive the decision, so a stale or skewed distribution produces a bad plan; a function or an implicit cast on the column disables the index; parameter sniffing and plan caching cause the same query to be fast for one input and slow for another; index-only scans depend on the visibility map in Postgres; and every index you add slows every write and inflates the working set, so the right number of indexes on a hot write table is small.<\/li><\/ul><p><strong>What each level filters for:<\/strong> level 2 for people who have tuned a query; level 3 for people who have been paged because of one.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Categories 3-4.<\/p>", "source": "answers.md", "search": "indexing questions come in three levels of depth. name them and say what each one is filtering for. - level 1 - what an index is: a b-tree keyed on the column, so lookups are logarithmic rather than a scan; writes pay for maintaining it. everyone passes this. - level 2 - composite order, covering and selectivity: leftmost prefix rule, why (a, b) serves where a = ? and b = ? and where a = ? but not where b = ?; an index that includes the selected columns avoids the heap fetch entirely; and the fact that an index on a low-selectivity column may be ignored because a sequential scan is genuinely cheaper. this level separates most candidates. - level 3 - the planner and the operational reality: statistics drive the decision, so a stale or skewed distribution produces a bad plan; a function or an implicit cast on the column disables the index; parameter sniffing and plan caching cause the same query to be fast for one input and slow for another; index-only scans depend on the visibility map in postgres; and every index you add slows every write and inflates the working set, so the right number of indexes on a hot write table is small. what each level filters for: level 2 for people who have tuned a query; level 3 for people who have been paged because of one. depth: ../06-database categories 3-4."}, {"n": 94, "category": 7, "difficulty": "T", "html": "&quot;Why is this query slow?&quot; with no schema and no plan. What do you ask, in what order?", "answerTitle": "\"Why is this query slow?\" with no schema", "answer": "<p>The test is whether you gather evidence before hypothesizing. Ask in this order, and say why each matters:<\/p><ol><li><strong>&quot;Is it always slow, or slow sometimes?&quot;<\/strong> Intermittent points at plan variance, lock contention or cache state; always-slow points at the plan or the data volume.<\/li><li><strong>&quot;What does the execution plan say?&quot;<\/strong> Everything else is speculation until you have looked. Specifically: estimated versus actual row counts, because a large divergence means the statistics are wrong and the plan is built on a lie.<\/li><li><strong>&quot;How many rows does it examine versus return?&quot;<\/strong> The ratio is the whole diagnosis.<\/li><li><strong>&quot;When did it change, and what changed then?&quot;<\/strong> Data growth crossing a threshold, a deploy, a new index, an analyze.<\/li><li><strong>&quot;Is it slow, or is it waiting?&quot;<\/strong> Locks and connection-pool queueing look identical from the application side and have nothing to do with the query.<\/li><\/ol><p><strong>The point to make explicitly:<\/strong> the fifth question catches the case where the query is fine and the problem is elsewhere, which is common enough that jumping straight to query tuning is the most expensive mistake in this genre.<\/p>", "source": "answers.md", "search": "\"why is this query slow?\" with no schema and no plan. what do you ask, in what order? the test is whether you gather evidence before hypothesizing. ask in this order, and say why each matters: 1. \"is it always slow, or slow sometimes?\" intermittent points at plan variance, lock contention or cache state; always-slow points at the plan or the data volume. 2. \"what does the execution plan say?\" everything else is speculation until you have looked. specifically: estimated versus actual row counts, because a large divergence means the statistics are wrong and the plan is built on a lie. 3. \"how many rows does it examine versus return?\" the ratio is the whole diagnosis. 4. \"when did it change, and what changed then?\" data growth crossing a threshold, a deploy, a new index, an analyze. 5. \"is it slow, or is it waiting?\" locks and connection-pool queueing look identical from the application side and have nothing to do with the query. the point to make explicitly: the fifth question catches the case where the query is fine and the problem is elsewhere, which is common enough that jumping straight to query tuning is the most expensive mistake in this genre."}, {"n": 95, "category": 7, "difficulty": "D", "html": "Transactions and isolation: how do you answer without reciting the anomaly table?", "answerTitle": "Transactions and isolation without the anomaly table", "answer": "<p>Answer with <strong>the decision you actually make<\/strong>, and let the theory support it.<\/p><blockquote><p>&quot;In practice I run read committed, which is the default nearly everywhere, and I handle the anomalies explicitly where they matter rather than raising the isolation level globally. The two that bite are lost update - two transactions read, modify and write the same row - and the read-modify-write pattern generally. My default fix is not serializable, it is to make the write atomic in the database: <code>UPDATE ... SET balance = balance - ? WHERE id = ? AND balance &gt;= ?<\/code> and check the row count, or an optimistic version column and a retry on conflict. I reach for <code>SELECT ... FOR UPDATE<\/code> when I genuinely need to hold a row, and for serializable when the invariant spans multiple rows and cannot be expressed as a constraint - accepting that it means handling serialization failures and retrying.&quot;<\/p><\/blockquote><p><strong>The senior markers:<\/strong> preferring a constraint or an atomic statement over a lock, knowing that higher isolation means your application must handle retries, and knowing that MVCC readers do not block writers, which is why the naive mental model of locking is wrong on Postgres.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Category 5.<\/p>", "source": "answers.md", "search": "transactions and isolation: how do you answer without reciting the anomaly table? answer with the decision you actually make , and let the theory support it. \"in practice i run read committed, which is the default nearly everywhere, and i handle the anomalies explicitly where they matter rather than raising the isolation level globally. the two that bite are lost update - two transactions read, modify and write the same row - and the read-modify-write pattern generally. my default fix is not serializable, it is to make the write atomic in the database: update ... set balance = balance - ? where id = ? and balance = ? and check the row count, or an optimistic version column and a retry on conflict. i reach for select ... for update when i genuinely need to hold a row, and for serializable when the invariant spans multiple rows and cannot be expressed as a constraint - accepting that it means handling serialization failures and retrying.\" the senior markers: preferring a constraint or an atomic statement over a lock, knowing that higher isolation means your application must handle retries, and knowing that mvcc readers do not block writers, which is why the naive mental model of locking is wrong on postgres. depth: ../06-database category 5."}, {"n": 96, "category": 7, "difficulty": "D", "html": "SQL versus NoSQL: how do you avoid the religious answer and still take a position?", "answerTitle": "SQL versus NoSQL without religion", "answer": "<p>Take a position, make it conditional, and make the criterion <strong>access patterns and the shape of the truth<\/strong>, not scale.<\/p><blockquote><p>&quot;My default is a relational database, because most systems have relationships, most teams can hire for SQL, and the constraint system does correctness work you would otherwise write and test yourself. I move off it when there is a specific reason: an access pattern that is genuinely a single-key lookup at a volume where a partitioned key-value store is dramatically simpler; a document shape that has no stable schema and is never queried across; a write volume that no single primary can take, where the sharding is going to happen anyway and a store that does it natively beats one where I do it by hand. What I try hard to avoid is choosing a document store because the schema is not designed yet - that is not a technology decision, it is deferring one.&quot;<\/p><\/blockquote><p>Then the honest cost of each direction: relational gets painful when you must shard, and a key-value store gets painful the first time the business asks a question you did not design a key for.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Category 9.<\/p>", "source": "answers.md", "search": "sql versus nosql: how do you avoid the religious answer and still take a position? take a position, make it conditional, and make the criterion access patterns and the shape of the truth , not scale. \"my default is a relational database, because most systems have relationships, most teams can hire for sql, and the constraint system does correctness work you would otherwise write and test yourself. i move off it when there is a specific reason: an access pattern that is genuinely a single-key lookup at a volume where a partitioned key-value store is dramatically simpler; a document shape that has no stable schema and is never queried across; a write volume that no single primary can take, where the sharding is going to happen anyway and a store that does it natively beats one where i do it by hand. what i try hard to avoid is choosing a document store because the schema is not designed yet - that is not a technology decision, it is deferring one.\" then the honest cost of each direction: relational gets painful when you must shard, and a key-value store gets painful the first time the business asks a question you did not design a key for. depth: ../06-database category 9."}, {"n": 97, "category": 7, "difficulty": "D", "html": "&quot;How would you shard this?&quot; What has to be established before you are allowed to answer?", "answerTitle": "\"How would you shard this?\" - what comes first", "answer": "<p>Three things must be established before an answer is meaningful, and saying so is the answer:<\/p><ol><li><strong>Are you sure you need to?<\/strong> &quot;The largest single Postgres I have seen handle real workloads goes a long way with a read-replica fleet, partitioning and an archive strategy. Sharding is the last resort because it costs you cross-shard queries, transactions and joins forever. What is the actual constraint - write throughput, data size, or blast radius?&quot;<\/li><li><strong>What is the access pattern?<\/strong> The shard key is determined by the dominant query, not by what looks balanced. Sharding by tenant is right when queries are always within a tenant, and wrong the day the biggest tenant is ten percent of your data.<\/li><li><strong>What happens to the queries that cross shards?<\/strong> Every design has some. Name them and say whether they become a fan-out with a merge, a denormalized secondary index, or an analytics copy.<\/li><\/ol><p>Then the mechanics: hash versus range, the resharding problem and why consistent hashing or a large fixed number of logical shards mapped to physical ones is how you avoid a migration nightmare, and how you route.<\/p><p><strong>Depth:<\/strong> <code>../06-database<\/code> Category 7.<\/p>", "source": "answers.md", "search": "\"how would you shard this?\" what has to be established before you are allowed to answer? three things must be established before an answer is meaningful, and saying so is the answer: 1. are you sure you need to? \"the largest single postgres i have seen handle real workloads goes a long way with a read-replica fleet, partitioning and an archive strategy. sharding is the last resort because it costs you cross-shard queries, transactions and joins forever. what is the actual constraint - write throughput, data size, or blast radius?\" 2. what is the access pattern? the shard key is determined by the dominant query, not by what looks balanced. sharding by tenant is right when queries are always within a tenant, and wrong the day the biggest tenant is ten percent of your data. 3. what happens to the queries that cross shards? every design has some. name them and say whether they become a fan-out with a merge, a denormalized secondary index, or an analytics copy. then the mechanics: hash versus range, the resharding problem and why consistent hashing or a large fixed number of logical shards mapped to physical ones is how you avoid a migration nightmare, and how you route. depth: ../06-database category 7."}, {"n": 98, "category": 7, "difficulty": "T", "html": "The interviewer proposes caching as the fix for a write-heavy problem. How do you redirect without contradicting them flatly?", "answerTitle": "Caching proposed for a write-heavy problem", "answer": "<p>Redirect by asking for the number, not by contradicting.<\/p><blockquote><p>&quot;Possibly - can I check the read-write ratio first? … If it is closer to one-to-one, a cache is going to be mostly misses and mostly invalidation, and we will have added a consistency problem without buying much. What I would look at instead for a write-bound workload is <em>[batching the writes, moving them
