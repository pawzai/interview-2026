<em>their<\/em> ticket.<\/p>", "source": "answers.md", "search": "you have 20 minutes of a pairing session on their codebase. which java 17+ features do you introduce, and which do you leave alone because the diff would lie? introduce: text blocks for the sql/json you already touched, var on the obvious local, a record for the tuple you were about to write a class for, switch expressions if one is mid-edit. leave: a virtual-thread migration, a stream rewrite of a working loop, optional wrapping of every return. the diff should look like you were there to solve their ticket."}, {"n": 217, "category": 15, "difficulty": "A", "html": "Style guide in 15 minutes: nullability, collections, exceptions, streams, concurrency. Write the ten rules you would actually enforce.", "answerTitle": "Ten rules you would enforce", "answer": "<p>No <code>null<\/code> in new APIs (<code>Optional<\/code> return or a zero value). Collections: Q211. Exceptions: wrap at the boundary, never swallow. Streams: Q206. Concurrency: no <code>synchronized<\/code> on a public type, no <code>newCachedThreadPool<\/code> (Q224), document the thread-safety of every public type. <code>equals<\/code>/<code>hashCode<\/code> together. Money not in <code>double<\/code>. No <code>Stack<\/code>. Tests do not read <code>now()<\/code> (Q263). Reviews label blocking versus preference (Q266).<\/p>", "source": "answers.md", "search": "style guide in 15 minutes: nullability, collections, exceptions, streams, concurrency. write the ten rules you would actually enforce. no null in new apis (optional return or a zero value). collections: q211. exceptions: wrap at the boundary, never swallow. streams: q206. concurrency: no synchronized on a public type, no newcachedthreadpool (q224), document the thread-safety of every public type. equals/hashcode together. money not in double. no stack. tests do not read now() (q263). reviews label blocking versus preference (q266)."}, {"n": 218, "category": 16, "difficulty": "C", "html": "Write a thread-safe counter three ways: <code>synchronized<\/code>, <code>AtomicInteger<\/code>, and <code>LongAdder<\/code>. When is each the one you ship?", "answerTitle": "Three counters", "answer": "<p><code>synchronized<\/code> on a private final lock: simple, exclusive. <code>AtomicInteger<\/code>: CAS, the default for a single counter. <code>LongAdder<\/code>: striped, the default under high contention on a hot increment (metrics). Ship <code>LongAdder<\/code> for rates; <code>AtomicInteger<\/code> for a size you also <code>get<\/code>; synchronized for a compound invariant a single atomic cannot hold.<\/p>", "source": "answers.md", "search": "write a thread-safe counter three ways: synchronized, atomicinteger, and longadder. when is each the one you ship? synchronized on a private final lock: simple, exclusive. atomicinteger: cas, the default for a single counter. longadder: striped, the default under high contention on a hot increment (metrics). ship longadder for rates; atomicinteger for a size you also get; synchronized for a compound invariant a single atomic cannot hold."}, {"n": 219, "category": 16, "difficulty": "C", "html": "<code>wait<\/code>/<code>notify<\/code> on a bounded buffer. Write <code>put<\/code>/<code>take<\/code> with <code>while<\/code> (not <code>if<\/code>), and say why <code>notifyAll<\/code> is the safe default.", "answerTitle": "`wait` / `notify` bounded buffer", "answer": "<pre><code class=\"lang-java\">synchronized void put(T x) throws InterruptedException {\n    while (n == a.length) wait();\n    a[t++ % a.length] = x; n++;\n    notifyAll();\n}\nsynchronized T take() throws InterruptedException {\n    while (n == 0) wait();\n    @SuppressWarnings(&quot;unchecked&quot;) T x = (T) a[h++ % a.length];\n    n--; notifyAll();\n    return x;\n}<\/code><\/pre><p><code>while<\/code>, not <code>if<\/code> - spurious wake and multiple waiters. <code>notifyAll<\/code> is the safe default because <code>put<\/code> and <code>take<\/code> share one wait-set; two conditions want two locks or a <code>Condition<\/code> each (Q239). Restore interrupt on catch if you swallow.<\/p>", "source": "answers.md", "search": "wait/notify on a bounded buffer. write put/take with while (not if), and say why notifyall is the safe default. java synchronized void put(t x) throws interruptedexception { while (n == a.length) wait(); a[t++ % a.length] = x; n++; notifyall(); } synchronized t take() throws interruptedexception { while (n == 0) wait(); @suppresswarnings(\"unchecked\") t x = (t) a[h++ % a.length]; n--; notifyall(); return x; } while, not if - spurious wake and multiple waiters. notifyall is the safe default because put and take share one wait-set; two conditions want two locks or a condition each (q239). restore interrupt on catch if you swallow."}, {"n": 220, "category": 16, "difficulty": "D", "html": "Implement a latch and a one-shot gate with <code>CountDownLatch<\/code> versus <code>CompletableFuture<\/code>. When is the future the cleaner API?", "answerTitle": "Latch versus one-shot future", "answer": "<p><code>CountDownLatch<\/code> is a one-shot gate: <code>countDown<\/code> / <code>await<\/code>. <code>CompletableFuture<\/code> is a one-shot <em>value<\/em>: <code>complete<\/code> / <code>join<\/code>, plus a pipeline (Q221). The future is cleaner when the waiter needs the result or a composition; the latch is cleaner when N workers must all finish and there is no value. Neither resets - that is <code>CyclicBarrier<\/code> / <code>Phaser<\/code>.<\/p>", "source": "answers.md", "search": "implement a latch and a one-shot gate with countdownlatch versus completablefuture. when is the future the cleaner api? countdownlatch is a one-shot gate: countdown / await. completablefuture is a one-shot value : complete / join, plus a pipeline (q221). the future is cleaner when the waiter needs the result or a composition; the latch is cleaner when n workers must all finish and there is no value. neither resets - that is cyclicbarrier / phaser."}, {"n": 221, "category": 16, "difficulty": "D", "html": "<code>CompletableFuture<\/code> pipeline: <code>thenApply<\/code>, <code>thenCompose<\/code>, <code>thenCombine<\/code>, <code>exceptionally<\/code>, <code>handle<\/code>. Write a two-call compose and name the pool it runs on.", "answerTitle": "`CompletableFuture` compose", "answer": "<pre><code class=\"lang-java\">cfA.thenCompose(a -&gt; callB(a))          // flatMap: B returns a CF\n  .thenCombine(cfC, this::merge)\n  .exceptionally(ex -&gt; fallback)\n  .handle((v, ex) -&gt; ex == null ? v : fallback);<\/code><\/pre><p><code>thenApply<\/code> is map; <code>thenCompose<\/code> is flatMap - using apply when B returns a CF nests the futures. Default executor is <code>ForkJoinPool.commonPool()<\/code> (or the completing thread for some stages); a named pool is what you ship. <code>thenApplyAsync<\/code> if you mean it.<\/p>", "source": "answers.md", "search": "completablefuture pipeline: thenapply, thencompose, thencombine, exceptionally, handle. write a two-call compose and name the pool it runs on. java cfa.thencompose(a - callb(a)) // flatmap: b returns a cf .thencombine(cfc, this::merge) .exceptionally(ex - fallback) .handle((v, ex) - ex == null ? v : fallback); thenapply is map; thencompose is flatmap - using apply when b returns a cf nests the futures. default executor is forkjoinpool.commonpool() (or the completing thread for some stages); a named pool is what you ship. thenapplyasync if you mean it."}, {"n": 222, "category": 16, "difficulty": "T", "html": "<code>join<\/code> versus <code>get<\/code> versus <code>orTimeout<\/code>. Which one wraps in <code>CompletionException<\/code>, which throws checked, and what does <code>join<\/code> do to the interrupt flag?", "answerTitle": "`join` / `get` / `orTimeout`", "answer": "<p><code>get<\/code> throws checked <code>ExecutionException<\/code> / <code>InterruptedException<\/code> and <em>clears<\/em> the interrupt flag - restore it. <code>join<\/code> throws unchecked <code>CompletionException<\/code> and does not deal in interrupts the same way. <code>orTimeout<\/code> completes <em>the receiver<\/em> exceptionally with <code>TimeoutException<\/code> and does not cancel the work unless you also <code>cancel<\/code>. Know which one you are wrapping.<\/p>", "source": "answers.md", "search": "join versus get versus ortimeout. which one wraps in completionexception, which throws checked, and what does join do to the interrupt flag? get throws checked executionexception / interruptedexception and clears the interrupt flag - restore it. join throws unchecked completionexception and does not deal in interrupts the same way. ortimeout completes the receiver exceptionally with timeoutexception and does not cancel the work unless you also cancel. know which one you are wrapping."}, {"n": 223, "category": 16, "difficulty": "D", "html": "Bounded thread pool: <code>ThreadPoolExecutor<\/code> parameters. Write a constructor you would ship, and the <code>CallerRuns<\/code> versus <code>Abort<\/code> versus <code>Discard<\/code> choice.", "answerTitle": "`ThreadPoolExecutor` you would ship", "answer": "<pre><code class=\"lang-java\">new ThreadPoolExecutor(\n    core, max, 60, TimeUnit.SECONDS,\n    new ArrayBlockingQueue&lt;&gt;(bound),\n    namedFactory,\n    new ThreadPoolExecutor.CallerRunsPolicy());<\/code><\/pre><p><code>CallerRuns<\/code> is backpressure onto the submitter. <code>Abort<\/code> is a metric plus a 429. <code>Discard<\/code> / <code>DiscardOldest<\/code> lose work - say so if you pick them (S3). Unbounded queue + <code>max<\/code> is a lie: <code>max<\/code> is never reached (Q233).<\/p>", "source": "answers.md", "search": "bounded thread pool: threadpoolexecutor parameters. write a constructor you would ship, and the callerruns versus abort versus discard choice. java new threadpoolexecutor( core, max, 60, timeunit.seconds, new arrayblockingqueue< (bound), namedfactory, new threadpoolexecutor.callerrunspolicy()); callerruns is backpressure onto the submitter. abort is a metric plus a 429. discard / discardoldest lose work - say so if you pick them (s3). unbounded queue + max is a lie: max is never reached (q233)."}, {"n": 224, "category": 16, "difficulty": "T", "html": "<code>Executors.newCachedThreadPool()<\/code> in a request path. What grows, what does not shrink fast enough, and what do you write instead?", "answerTitle": "`newCachedThreadPool`", "answer": "<p><code>SynchronousQueue<\/code>, <code>max = Integer.MAX_VALUE<\/code>: every submit with no idle thread creates a thread. A burst creates tens of thousands; idle threads die after 60s, not immediately. On a request path this is an accidental fork-bomb. Write Q223. Cached is acceptable for a short-lived CLI, not a service.<\/p>", "source": "answers.md", "search": "executors.newcachedthreadpool() in a request path. what grows, what does not shrink fast enough, and what do you write instead? synchronousqueue, max = integer.max_value: every submit with no idle thread creates a thread. a burst creates tens of thousands; idle threads die after 60s, not immediately. on a request path this is an accidental fork-bomb. write q223. cached is acceptable for a short-lived cli, not a service."}, {"n": 225, "category": 16, "difficulty": "D", "html": "Virtual threads: when you just <code>Thread.startVirtualThread<\/code>, when you still need a semaphore, and what pins a virtual thread.", "answerTitle": "Virtual threads", "answer": "<p><code>Thread.startVirtualThread<\/code> / <code>Executors.newVirtualThreadPerTaskExecutor<\/code> for blocking I/O. You still need a semaphore (or a bounded pool of <em>something<\/em>) when the other side cannot take 100k concurrent calls - a DB pool of 20, an API quota. Pinning: a virtual thread inside <code>synchronized<\/code> or a JNI call cannot unmount; prefer <code>ReentrantLock<\/code> in new code if the critical section blocks. Measure, do not assume.<\/p>", "source": "answers.md", "search": "virtual threads: when you just thread.startvirtualthread, when you still need a semaphore, and what pins a virtual thread. thread.startvirtualthread / executors.newvirtualthreadpertaskexecutor for blocking i/o. you still need a semaphore (or a bounded pool of something ) when the other side cannot take 100k concurrent calls - a db pool of 20, an api quota. pinning: a virtual thread inside synchronized or a jni call cannot unmount; prefer reentrantlock in new code if the critical section blocks. measure, do not assume."}, {"n": 226, "category": 16, "difficulty": "D", "html": "Thread-safe cache with TTL. <code>ConcurrentHashMap<\/code> plus a timestamp, versus Caffeine. Write the naive version and name the two races it still has.", "answerTitle": "Thread-safe cache with TTL", "answer": "<p>Naive: <code>ConcurrentHashMap&lt;K, record E(V v, long exp)&gt;<\/code>, <code>get<\/code> checks <code>now &lt; exp<\/code>. Races still there: two loads of the same missing key (thundering herd), and expired entries you never evict (leak) unless a janitor or <code>compute<\/code> on access. Caffeine does both. Write the naive, name the two races, do not pretend it is Caffeine.<\/p>", "source": "answers.md", "search": "thread-safe cache with ttl. concurrenthashmap plus a timestamp, versus caffeine. write the naive version and name the two races it still has. naive: concurrenthashmap<k, record e(v v, long exp) , get checks now < exp. races still there: two loads of the same missing key (thundering herd), and expired entries you never evict (leak) unless a janitor or compute on access. caffeine does both. write the naive, name the two races, do not pretend it is caffeine."}, {"n": 227, "category": 16, "difficulty": "D", "html": "Dining philosophers / lock ordering. Write the ordered-lock acquire, and the tryLock-with-backoff alternative.", "answerTitle": "Lock ordering", "answer": "<p>Always acquire locks in a global order (e.g. <code>System.identityHashCode<\/code>, with a third lock on a hash collision). <code>tryLock<\/code> + backoff is the alternative when you cannot order (S2). Document the order in one comment. Dining philosophers is this problem in costume.<\/p>", "source": "answers.md", "search": "dining philosophers / lock ordering. write the ordered-lock acquire, and the trylock-with-backoff alternative. always acquire locks in a global order (e.g. system.identityhashcode, with a third lock on a hash collision). trylock + backoff is the alternative when you cannot order (s2). document the order in one comment. dining philosophers is this problem in costume."}, {"n": 228, "category": 16, "difficulty": "T", "html": "<code>synchronized<\/code> on a boxed <code>Integer<\/code> or on <code>intern()<\/code>ed strings. Why is that a cross-tenant deadlock, and what do you lock on instead?", "answerTitle": "`synchronized (boxed)`", "answer": "<p><code>Integer.valueOf<\/code> caches -128..127, so <code>synchronized (id)<\/code> on a small id is a <em>global<\/em> lock shared with every other tenant who used that id. Interned strings are the same accident. Lock on a private <code>final Object lock = new Object()<\/code> you own, or on the domain object whose monitor is documented.<\/p>", "source": "answers.md", "search": "synchronized on a boxed integer or on intern()ed strings. why is that a cross-tenant deadlock, and what do you lock on instead? integer.valueof caches -128..127, so synchronized (id) on a small id is a global lock shared with every other tenant who used that id. interned strings are the same accident. lock on a private final object lock = new object() you own, or on the domain object whose monitor is documented."}, {"n": 229, "category": 16, "difficulty": "D", "html": "A <code>CompletableFuture<\/code> fan-out of 10k calls with a concurrency cap. Write the semaphore-wrapped supply, and the <code>allOf<\/code> join.", "answerTitle": "10k fan-out, capped", "answer": "<pre><code class=\"lang-java\">Semaphore cap = new Semaphore(64);\nList&lt;CompletableFuture&lt;V&gt;&gt; all = ids.stream()\n    .map(id -&gt; CompletableFuture.supplyAsync(() -&gt; {\n        cap.acquireUninterruptibly();\n        try { return call(id); } finally { cap.release(); }\n    }, pool)).toList();\nCompletableFuture.allOf(all.toArray(CompletableFuture[]::new)).join();<\/code><\/pre><p>Cap <em>inside<\/em> the task so the pool queue does not hold 10k started permits. <code>allOf<\/code> then join; a timeout on the <code>allOf<\/code> (Q222) is the production wrapper.<\/p>", "source": "answers.md", "search": "a completablefuture fan-out of 10k calls with a concurrency cap. write the semaphore-wrapped supply, and the allof join. java semaphore cap = new semaphore(64); list<completablefuture<v all = ids.stream() .map(id - completablefuture.supplyasync(() - { cap.acquireuninterruptibly(); try { return call(id); } finally { cap.release(); } }, pool)).tolist(); completablefuture.allof(all.toarray(completablefuture[]::new)).join(); cap inside the task so the pool queue does not hold 10k started permits. allof then join; a timeout on the allof (q222) is the production wrapper."}, {"n": 230, "category": 16, "difficulty": "D", "html": "Happens-before you can actually use: unlock/lock, volatile write/read, thread start/join, <code>CF<\/code> completion. Give one code example each.", "answerTitle": "Happens-before you can use", "answer": "<p>Unlock of M happens-before a later lock of M: the bounded buffer (Q219) is correct <em>because of this<\/em>, not because of <code>volatile n<\/code>. Volatile write happens-before a subsequent read of that field. <code>Thread.start<\/code> happens-before the first action in the thread; the last action happens-before <code>join<\/code> returns. <code>CF.complete<\/code> happens-before dependents. One line of code each is the answer; a JMM lecture is not.<\/p>", "source": "answers.md", "search": "happens-before you can actually use: unlock/lock, volatile write/read, thread start/join, cf completion. give one code example each. unlock of m happens-before a later lock of m: the bounded buffer (q219) is correct because of this , not because of volatile n. volatile write happens-before a subsequent read of that field. thread.start happens-before the first action in the thread; the last action happens-before join returns. cf.complete happens-before dependents. one line of code each is the answer; a jmm lecture is not."}, {"n": 231, "category": 16, "difficulty": "A", "html": "Design a worker pool that absorbs a 100× burst without losing tasks and without OOMing. Queue bound, rejection, shedding, and the metric.", "answerTitle": "Worker pool for a 100× burst", "answer": "<p>Bounded queue (Q223), <code>CallerRuns<\/code> or a shed that returns 429 with a retry-after, a metric on queue depth and reject count, and a heap-based kill switch. Losing tasks silently (<code>Discard<\/code>) is not absorbing. OOM is the unbounded-queue failure (S3 / Q233). Virtual threads still need a bound on the <em>downstream<\/em>.<\/p>", "source": "answers.md", "search": "design a worker pool that absorbs a 100× burst without losing tasks and without ooming. queue bound, rejection, shedding, and the metric. bounded queue (q223), callerruns or a shed that returns 429 with a retry-after, a metric on queue depth and reject count, and a heap-based kill switch. losing tasks silently (discard) is not absorbing. oom is the unbounded-queue failure (s3 / q233). virtual threads still need a bound on the downstream ."}, {"n": 232, "category": 16, "difficulty": "A", "html": "A two-lock cache (map lock + per-entry lock) deadlocks in production. How do you reproduce it on a whiteboard, and what do you replace?", "answerTitle": "Two-lock cache deadlock", "answer": "<p>Reproduce: thread 1 holds the map lock, waits for entry lock; thread 2 holds that entry, waits for the map lock. Whiteboard the two stacks. Replace with one lock, or with <code>ConcurrentHashMap.compute<\/code> (per-key serialization, no outer lock), or with Caffeine. Never take locks in opposite orders (Q227). Incident: S2.<\/p>", "source": "answers.md", "search": "a two-lock cache (map lock + per-entry lock) deadlocks in production. how do you reproduce it on a whiteboard, and what do you replace? reproduce: thread 1 holds the map lock, waits for entry lock; thread 2 holds that entry, waits for the map lock. whiteboard the two stacks. replace with one lock, or with concurrenthashmap.compute (per-key serialization, no outer lock), or with caffeine. never take locks in opposite orders (q227). incident: s2."}, {"n": 233, "category": 16, "difficulty": "A", "html": "Unbounded <code>LinkedBlockingQueue<\/code> in a thread pool filled the heap. Design the replacement and the backpressure story. (Incident: S3.)", "answerTitle": "Unbounded queue filled the heap", "answer": "<p>Replacement: <code>ArrayBlockingQueue<\/code> of a size you can defend (seconds of work, not days), a rejection policy you can observe, and a producer that <em>backs off<\/em>. The story is backpressure, not a bigger heap. <code>LinkedBlockingQueue()<\/code> has capacity <code>Integer.MAX_VALUE<\/code>. Incident: S3.<\/p>", "source": "answers.md", "search": "unbounded linkedblockingqueue in a thread pool filled the heap. design the replacement and the backpressure story. (incident: s3.) replacement: arrayblockingqueue of a size you can defend (seconds of work, not days), a rejection policy you can observe, and a producer that backs off . the story is backpressure, not a bigger heap. linkedblockingqueue() has capacity integer.max_value. incident: s3."}, {"n": 234, "category": 16, "difficulty": "A", "html": "You must migrate a 200-thread pool to virtual threads. What do you keep, what do you delete, and what do you measure first?", "answerTitle": "Migrate a 200-thread pool to virtual threads", "answer": "<p>Measure first: is the pool blocking on I/O (yes → virtual) or burning CPU (no → keep a sized pool)? Delete the pool that exists only to park waiters. Keep a semaphore in front of the JDBC pool and any rate-limited client (Q225). Keep the timeout. Pinning and thread-local caches (inherited <code>ThreadLocal<\/code> of a 200-slot thing) are what you hunt in week one.<\/p>", "source": "answers.md", "search": "you must migrate a 200-thread pool to virtual threads. what do you keep, what do you delete, and what do you measure first? measure first: is the pool blocking on i/o (yes → virtual) or burning cpu (no → keep a sized pool)? delete the pool that exists only to park waiters. keep a semaphore in front of the jdbc pool and any rate-limited client (q225). keep the timeout. pinning and thread-local caches (inherited threadlocal of a 200-slot thing) are what you hunt in week one."}, {"n": 235, "category": 17, "difficulty": "C", "html": "What does &quot;design and implement&quot; score that a LeetCode problem does not: API, invariants, concurrency, and the test you write first?", "answerTitle": "What \"design and implement\" scores", "answer": "<p>API (names, what throws, what is thread-safe), invariants (capacity, TTL, uniqueness) stated before code, concurrency chosen on purpose, and one test that would fail if the invariant slipped. A LeetCode problem scores a function. This scores a type someone else will import. Write the signature and the invariant in the first five minutes.<\/p>", "source": "answers.md", "search": "what does \"design and implement\" score that a leetcode problem does not: api, invariants, concurrency, and the test you write first? api (names, what throws, what is thread-safe), invariants (capacity, ttl, uniqueness) stated before code, concurrency chosen on purpose, and one test that would fail if the invariant slipped. a leetcode problem scores a function. this scores a type someone else will import. write the signature and the invariant in the first five minutes."}, {"n": 236, "category": 17, "difficulty": "D", "html": "Object-model a parking lot or a deck of cards so the types carry the rules. What do you refuse to put on a god class?", "answerTitle": "Parking lot / deck of cards", "answer": "<p>Types carry rules: <code>Spot<\/code> holds a <code>Vehicle<\/code> of a matching <code>Size<\/code>; <code>Deck<\/code> deals from a <code>List&lt;Card&gt;<\/code> and does not expose <code>remove(i)<\/code> to callers. Refuse a <code>ParkingLotManagerServiceImpl<\/code> that also bills, opens the gate and sends email. 45 minutes: the objects and one happy-path method, not a framework.<\/p>", "source": "answers.md", "search": "object-model a parking lot or a deck of cards so the types carry the rules. what do you refuse to put on a god class? types carry rules: spot holds a vehicle of a matching size; deck deals from a list<card and does not expose remove(i) to callers. refuse a parkinglotmanagerserviceimpl that also bills, opens the gate and sends email. 45 minutes: the objects and one happy-path method, not a framework."}, {"n": 237, "category": 17, "difficulty": "D", "html": "Implement an in-memory pub/sub event bus with sync and async handlers, and say how you contain a slow subscriber.", "answerTitle": "In-process event bus", "answer": "<p><code>Map&lt;Class&lt;?&gt;, List&lt;Handler&gt;&gt;<\/code>, <code>subscribe<\/code> / <code>publish<\/code>. Sync handlers run on the publisher&#x27;s thread - a slow one stalls everyone; isolate with a per-subscriber queue or an executor, and a rejection policy (Q223). Exceptions in a handler must not abort the others. Weak refs if you do not own unsubscription. This is not Kafka; say so.<\/p>", "source": "answers.md", "search": "implement an in-memory pub/sub event bus with sync and async handlers, and say how you contain a slow subscriber. map<class<? , list<handler , subscribe / publish. sync handlers run on the publisher's thread - a slow one stalls everyone; isolate with a per-subscriber queue or an executor, and a rejection policy (q223). exceptions in a handler must not abort the others. weak refs if you do not own unsubscription. this is not kafka; say so."}, {"n": 238, "category": 17, "difficulty": "D", "html": "Implement retry with jittered exponential backoff and a retry-on predicate. Write the loop, and the one thing you never retry.", "answerTitle": "Retry with jittered backoff", "answer": "<pre><code class=\"lang-java\">&lt;T&gt; T retry(Callable&lt;T&gt; c, Predicate&lt;Exception&gt; retryOn, int max, long baseMs) {\n    ThreadLocalRandom rnd = ThreadLocalRandom.current();\n    for (int i = 0; ; i++) {\n        try { return c.call(); }\n        catch (Exception e) {\n            if (i == max || !retryOn.test(e)) sneak(e);\n            long cap = baseMs &lt;&lt; Math.min(i, 16);\n            Thread.sleep(cap / 2 + rnd.nextLong(cap / 2 + 1));\n        }\n    }\n}<\/code><\/pre><p>Never retry a non-idempotent POST without an idempotency key, and never retry a 4xx that will not change. Full library is Q255 / S16. Jitter is not optional - synchronized retries are a thundering herd.<\/p>", "source": "answers.md", "search": "implement retry with jittered exponential backoff and a retry-on predicate. write the loop, and the one thing you never retry. java <t t retry(callable<t c, predicate<exception retryon, int max, long basems) { threadlocalrandom rnd = threadlocalrandom.current(); for (int i = 0; ; i++) { try { return c.call(); } catch (exception e) { if (i == max !retryon.test(e)) sneak(e); long cap = basems << math.min(i, 16); thread.sleep(cap / 2 + rnd.nextlong(cap / 2 + 1)); } } } never retry a non-idempotent post without an idempotency key, and never retry a 4xx that will not change. full library is q255 / s16. jitter is not optional - synchronized retries are a thundering herd."}, {"n": 239, "category": 17, "difficulty": "A", "html": "Design and implement a bounded blocking queue with a waiting-producer / waiting-consumer contract. Production quality, 45 minutes. (S11)", "answerTitle": "Bounded blocking queue", "answer": "<blockquote><p>Forty-five minutes. Production quality. Multiple producers, multiple consumers. Capacity N. <code>put<\/code> blocks when full, <code>take<\/code> blocks when empty, <code>offer<\/code> / <code>poll<\/code> with timeout. The interviewer will ask about interrupt policy and a single wait-set.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Capacity is an argument, <code>&gt; 0<\/code>. Nulls: reject (<code>Objects.requireNonNull<\/code>) - that is the <code>ArrayBlockingQueue<\/code> contract. Interrupt: <code>put<\/code>/<code>take<\/code> throw <code>InterruptedException<\/code> and leave the structure unchanged. Fairness: not required unless they ask; say &quot;unfair, I can switch to a fair lock&quot;. Timeout units: <code>TimeUnit<\/code>.<\/p><p><strong>Isolate.<\/strong> The hard part is not the ring (Q86). It is two conditions (not-full, not-empty) on one lock, and not using <code>notify<\/code> on a shared wait-set so a producer wakes a producer. Interrupt and timeout must not drop an item or double-take.<\/p><p><strong>Decide.<\/strong> <code>ReentrantLock<\/code> + <code>notFull<\/code> + <code>notEmpty<\/code> <code>Condition<\/code>s, a circular <code>Object[]<\/code>, a count. <code>notifyAll<\/code> on a single monitor is correct and simpler if time is short; two conditions is the production shape. State the invariant: <code>0 &lt;= n &lt;= cap<\/code>, <code>n == 0<\/code> iff empty, <code>n == cap<\/code> iff full.<\/p><p><strong>Execute.<\/strong><\/p><pre><code class=\"lang-java\">final class BoundedQueue&lt;T&gt; {\n    private final Object[] a;\n    private int h, t, n;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition notEmpty = lock.newCondition();\n    private final Condition notFull = lock.newCondition();\n\n    BoundedQueue(int cap) {\n        if (cap &lt;= 0) throw new IllegalArgumentException(&quot;cap&quot;);\n        a = new Object[cap];\n    }\n\n    void put(T x) throws InterruptedException {\n        Objects.requireNonNull(x);\n        lock.lockInterruptibly();\n        try {\n            while (n == a.length) notFull.await();\n            a[t] = x; t = (t + 1) % a.length; n++;\n            notEmpty.signal();\n        } finally { lock.unlock(); }\n    }\n\n    @SuppressWarnings(&quot;unchecked&quot;)\n    T take() throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (n == 0) notEmpty.await();\n            T x = (T) a[h]; a[h] = null; h = (h + 1) % a.length; n--;\n            notFull.signal();\n            return x;\n        } finally { lock.unlock(); }\n    }\n}<\/code><\/pre><p><code>offer<\/code>/<code>poll<\/code> use <code>awaitNanos<\/code>. Tests: one producer one consumer; N producers N consumers on <code>cap=1<\/code>; interrupt during <code>put<\/code> when full; reject null. Complexity: O(1) per op.<\/p><p><strong>Reflect.<\/strong> A single <code>synchronized<\/code> + <code>notifyAll<\/code> (Q219) is a legal 20-minute version; say what you would add (two conditions, fairness, <code>drainTo<\/code>). Do not write a linked list - the bound is the point. After the round: JFR, a metric on wait time, and a poison-pill story for shutdown.<\/p><blockquote><p>Hook: the queue you wished S3 had been.<\/p><\/blockquote>", "source": "scenario-questions.md (S11)", "search": "design and implement a bounded blocking queue with a waiting-producer / waiting-consumer contract. production quality, 45 minutes. (s11) forty-five minutes. production quality. multiple producers, multiple consumers. capacity n. put blocks when full, take blocks when empty, offer / poll with timeout. the interviewer will ask about interrupt policy and a single wait-set. clarify. capacity is an argument, 0. nulls: reject (objects.requirenonnull) - that is the arrayblockingqueue contract. interrupt: put/take throw interruptedexception and leave the structure unchanged. fairness: not required unless they ask; say \"unfair, i can switch to a fair lock\". timeout units: timeunit. isolate. the hard part is not the ring (q86). it is two conditions (not-full, not-empty) on one lock, and not using notify on a shared wait-set so a producer wakes a producer. interrupt and timeout must not drop an item or double-take. decide. reentrantlock + notfull + notempty conditions, a circular object[], a count. notifyall on a single monitor is correct and simpler if time is short; two conditions is the production shape. state the invariant: 0 <= n <= cap, n == 0 iff empty, n == cap iff full. execute. java final class boundedqueue<t { private final object[] a; private int h, t, n; private final reentrantlock lock = new reentrantlock(); private final condition notempty = lock.newcondition(); private final condition notfull = lock.newcondition(); boundedqueue(int cap) { if (cap <= 0) throw new illegalargumentexception(\"cap\"); a = new object[cap]; } void put(t x) throws interruptedexception { objects.requirenonnull(x); lock.lockinterruptibly(); try { while (n == a.length) notfull.await(); a[t] = x; t = (t + 1) % a.length; n++; notempty.signal(); } finally { lock.unlock(); } } @suppresswarnings(\"unchecked\") t take() throws interruptedexception { lock.lockinterruptibly(); try { while (n == 0) notempty.await(); t x = (t) a[h]; a[h] = null; h = (h + 1) % a.length; n--; notfull.signal(); return x; } finally { lock.unlock(); } } } offer/poll use awaitnanos. tests: one producer one consumer; n producers n consumers on cap=1; interrupt during put when full; reject null. complexity: o(1) per op. reflect. a single synchronized + notifyall (q219) is a legal 20-minute version; say what you would add (two conditions, fairness, drainto). do not write a linked list - the bound is the point. after the round: jfr, a metric on wait time, and a poison-pill story for shutdown. hook: the queue you wished s3 had been."}, {"n": 240, "category": 17, "difficulty": "D", "html": "Implement a circular log / ring buffer of the last N events, thread-safe for many writers and one reader.", "answerTitle": "Thread-safe ring of last N", "answer": "<p><code>synchronized<\/code> on a Q86 ring, or a <code>synchronizedList<\/code> you do not want. Many writers, one reader: a single lock on <code>offer<\/code> plus a snapshot <code>toArray<\/code> for the reader is enough at modest N. For high ingest, a disruptor / many-to-one queue and a draining reader. Do not hand out the live array.<\/p>", "source": "answers.md", "search": "implement a circular log / ring buffer of the last n events, thread-safe for many writers and one reader. synchronized on a q86 ring, or a synchronizedlist you do not want. many writers, one reader: a single lock on offer plus a snapshot toarray for the reader is enough at modest n. for high ingest, a disruptor / many-to-one queue and a draining reader. do not hand out the live array."}, {"n": 241, "category": 17, "difficulty": "D", "html": "Implement a token-bucket rate limiter for a single process. The fields, the refill, and the <code>tryAcquire(n)<\/code>.", "answerTitle": "Token bucket, one process", "answer": "<p>Fields: <code>capacity<\/code>, <code>refillPerSec<\/code>, <code>tokens<\/code> (double or long micros), <code>lastNanos<\/code>. <code>tryAcquire(n)<\/code>: refill <code>min(capacity, tokens + (now-last)*rate)<\/code>, then grant if <code>tokens &gt;= n<\/code>. Clock: <code>nanoTime<\/code>, not <code>currentTimeMillis<\/code> (it jumps). Not distributed - say it (Q252 is the production one).<\/p>", "source": "answers.md", "search": "implement a token-bucket rate limiter for a single process. the fields, the refill, and the tryacquire(n). fields: capacity, refillpersec, tokens (double or long micros), lastnanos. tryacquire(n): refill min(capacity, tokens + (now-last) rate), then grant if tokens = n. clock: nanotime, not currenttimemillis (it jumps). not distributed - say it (q252 is the production one)."}, {"n": 242, "category": 17, "difficulty": "D", "html": "Implement a sliding-window log rate limiter, and say when you would pick it over the token bucket.", "answerTitle": "Sliding-window log limiter", "answer": "<p>Store timestamps of accepted events in a deque; evict <code>&lt; now - W<\/code>; accept if <code>size &lt; limit<\/code>. More accurate than a bucket at the window edge; more memory (one long per event). Pick the bucket when you need cheap <code>tryAcquire<\/code> and a little burstiness is fine; the log when compliance said &quot;no more than N in any W&quot;.<\/p>", "source": "answers.md", "search": "implement a sliding-window log rate limiter, and say when you would pick it over the token bucket. store timestamps of accepted events in a deque; evict < now - w; accept if size < limit. more accurate than a bucket at the window edge; more memory (one long per event). pick the bucket when you need cheap tryacquire and a little burstiness is fine; the log when compliance said \"no more than n in any w\"."}, {"n": 243, "category": 17, "difficulty": "D", "html": "Implement an LRU cache (<code>get<\/code>/<code>put<\/code> in O(1)). The map plus doubly linked list, and the lock story. Full walkthrough is Q251.", "answerTitle": "LRU `get`/`put` O(1)", "answer": "<p><code>HashMap&lt;K, Node&gt;<\/code> + doubly linked list, dummy ends, <code>moveToFront<\/code>, evict <code>tail.prev<\/code>. Lock: one <code>synchronized<\/code> for the toy; a <code>ReentrantLock<\/code> you document for the library. Full production (capacity 0, null policy, concurrency, metrics) is Q251 / S12. Here the invariant is &quot;map size == list length&quot;.<\/p>", "source": "answers.md", "search": "implement an lru cache (get/put in o(1)). the map plus doubly linked list, and the lock story. full walkthrough is q251. hashmap<k, node + doubly linked list, dummy ends, movetofront, evict tail.prev. lock: one synchronized for the toy; a reentrantlock you document for the library. full production (capacity 0, null policy, concurrency, metrics) is q251 / s12. here the invariant is \"map size == list length\"."}, {"n": 244, "category": 17, "difficulty": "D", "html": "LFU versus LRU. What extra structure does LFU need, and when is LFU the wrong default?", "answerTitle": "LFU versus LRU", "answer": "<p>LFU needs frequency → a map of freq to a linked list of nodes, plus the key map; min-freq is a counter you bump when a list empties. LFU is the wrong default when traffic is a scan (a one-time pass evicts the working set) or when recency <em>is<\/em> the signal. LRU is the default you write; LFU when a known hot set is stable.<\/p>", "source": "answers.md", "search": "lfu versus lru. what extra structure does lfu need, and when is lfu the wrong default? lfu needs frequency → a map of freq to a linked list of nodes, plus the key map; min-freq is a counter you bump when a list empties. lfu is the wrong default when traffic is a scan (a one-time pass evicts the working set) or when recency is the signal. lru is the default you write; lfu when a known hot set is stable."}, {"n": 245, "category": 17, "difficulty": "D", "html": "Implement a snowflake-style ID generator for one process. Timestamp, worker id, sequence, and the clock-went-backwards case.", "answerTitle": "Snowflake, one process", "answer": "<p><code>id = (ts - epoch) &lt;&lt; 22 | (worker &lt;&lt; 12) | seq<\/code>. 41 bits time, 10 worker, 12 sequence is the usual split - say yours. Same-millisecond: <code>seq++<\/code>; overflow: wait for the next millisecond. Clock went backwards: refuse to issue (throw) or wait; do not emit a duplicate. Worker id is an argument, not <code>random<\/code>.<\/p>", "source": "answers.md", "search": "implement a snowflake-style id generator for one process. timestamp, worker id, sequence, and the clock-went-backwards case. id = (ts - epoch) << 22 (worker << 12) seq. 41 bits time, 10 worker, 12 sequence is the usual split - say yours. same-millisecond: seq++; overflow: wait for the next millisecond. clock went backwards: refuse to issue (throw) or wait; do not emit a duplicate. worker id is an argument, not random."}, {"n": 246, "category": 17, "difficulty": "D", "html": "Implement a tiny in-memory KV with TTL and size eviction. The two indexes, and the lazy-versus-eager expire choice.", "answerTitle": "KV with TTL and size eviction", "answer": "<p>Two indexes: <code>HashMap&lt;K, Node&gt;<\/code> and a recency list (LRU) or a <code>TreeMap&lt;exp, K&gt;<\/code> for eager expire. Lazy expire: check on <code>get<\/code>/<code>put<\/code>, plus a sample on each write so the map cannot fill with dead keys. Eager: a delay queue / janitor. Lazy is what you write in 45 minutes; name the leak if you skip the sample.<\/p>", "source": "answers.md", "search": "implement a tiny in-memory kv with ttl and size eviction. the two indexes, and the lazy-versus-eager expire choice. two indexes: hashmap<k, node and a recency list (lru) or a treemap<exp, k for eager expire. lazy expire: check on get/put, plus a sample on each write so the map cannot fill with dead keys. eager: a delay queue / janitor. lazy is what you write in 45 minutes; name the leak if you skip the sample."}, {"n": 247, "category": 17, "difficulty": "T", "html": "A singleton &quot;service locator&quot; the interviewer sketches. What do you implement instead, and how do you say it without lecturing?", "answerTitle": "Service locator", "answer": "<p>Implement a constructor-injected object, or a small factory with an interface. Say <em>&quot;I will not add a global <code>Services.get()<\/code>; it makes tests lie and hides the graph&quot;<\/em>. If they insist on the sketch, write it as a <code>Map&lt;Class&lt;?&gt;, Object&gt;<\/code> and then say what you would delete before merge. Do not lecture for five minutes.<\/p>", "source": "answers.md", "search": "a singleton \"service locator\" the interviewer sketches. what do you implement instead, and how do you say it without lecturing? implement a constructor-injected object, or a small factory with an interface. say \"i will not add a global services.get(); it makes tests lie and hides the graph\" . if they insist on the sketch, write it as a map<class<? , object and then say what you would delete before merge. do not lecture for five minutes."}, {"n": 248, "category": 17, "difficulty": "D", "html": "Implement an iterator over a nested list of integers (flatten). The stack of iterators, and the <code>hasNext<\/code> that actually advances.", "answerTitle": "Flatten nested list iterator", "answer": "<p>Stack of <code>Iterator&lt;NestedInteger&gt;<\/code>. <code>hasNext<\/code> advances until the top is an integer (or the stack is empty): while top is a list, push its iterator; while top is exhausted, pop. <code>next<\/code> calls <code>hasNext<\/code>, then returns <code>stack.peek().next().getInteger()<\/code>. The bug is doing the advance in <code>next<\/code> only, so a trailing empty list lies.<\/p>", "source": "answers.md", "search": "implement an iterator over a nested list of integers (flatten). the stack of iterators, and the hasnext that actually advances. stack of iterator<nestedinteger . hasnext advances until the top is an integer (or the stack is empty): while top is a list, push its iterator; while top is exhausted, pop. next calls hasnext, then returns stack.peek().next().getinteger(). the bug is doing the advance in next only, so a trailing empty list lies."}, {"n": 249, "category": 17, "difficulty": "D", "html": "Implement a range module / interval set with <code>add<\/code>, <code>query<\/code>, <code>remove<\/code>. <code>TreeMap<\/code> keyed by start.", "answerTitle": "Range module", "answer": "<p><code>TreeMap&lt;Integer, Integer&gt;<\/code> of start → end, disjoint and coalesced. <code>add<\/code>: find overlapping via <code>floorKey<\/code>, merge, delete covered keys, insert the union. <code>remove<\/code> splits. <code>query<\/code>: <code>floorKey<\/code> and <code>end &gt;= right<\/code>. O(k log n) per op for k overlaps. This is Q185&#x27;s cousin with explicit remove.<\/p>", "source": "answers.md", "search": "implement a range module / interval set with add, query, remove. treemap keyed by start. treemap<integer, integer of start → end, disjoint and coalesced. add: find overlapping via floorkey, merge, delete covered keys, insert the union. remove splits. query: floorkey and end = right. o(k log n) per op for k overlaps. this is q185's cousin with explicit remove."}, {"n": 250, "category": 17, "difficulty": "A", "html": "Design the API for a library that will be used by 40 teams. Compatibility, nullability, thread-safety contract, and what you put in the Javadoc.", "answerTitle": "Library API for 40 teams", "answer": "<p>Document thread-safety (&quot;this type is immutable&quot; / &quot;one thread&quot;). Nullability: <code>package-info<\/code> + <code>@Nullable<\/code>, no silent NPE. Compatibility: no removing methods, no widening throws, no changing <code>equals<\/code>. Javadoc carries the invariant (capacity, TTL units, what <code>null<\/code> means). A preview package is allowed; a breaking v2 in week three is not. Q217 is the style; this is the contract.<\/p>", "source": "answers.md", "search": "design the api for a library that will be used by 40 teams. compatibility, nullability, thread-safety contract, and what you put in the javadoc. document thread-safety (\"this type is immutable\" / \"one thread\"). nullability: package-info + @nullable, no silent npe. compatibility: no removing methods, no widening throws, no changing equals. javadoc carries the invariant (capacity, ttl units, what null means). a preview package is allowed; a breaking v2 in week three is not. q217 is the style; this is the contract."}, {"n": 251, "category": 17, "difficulty": "A", "html": "Design and implement an LRU cache, production quality, 60 minutes. (S12)", "answerTitle": "LRU cache", "answer": "<blockquote><p>Sixty minutes. <code>get<\/code> / <code>put<\/code> in O(1), capacity N, optional TTL, a thread-safety contract you will defend. They will ask why you did not use <code>LinkedHashMap<\/code>.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Capacity 0: legal (every <code>put<\/code> evicts immediately) or rejected - pick and say. Null keys / values: reject. <code>get<\/code> of missing: <code>null<\/code> or <code>Optional<\/code> - pick <code>null<\/code> to match <code>Map<\/code>, or <code>Optional<\/code> if this is a new API (Q250). TTL: lazy on access plus a sample, unless they want a janitor. Concurrency: one lock for the round; &quot;I would use Caffeine in the repo&quot;.<\/p><p><strong>Isolate.<\/strong> The structure is Q101 / Q243: map + doubly linked list + dummy ends. The hard parts are <code>put<\/code> on an existing key (update + move, no evict unless size exceeded), <code>get<\/code> that does not leak a node, and the size invariant after every path. <code>LinkedHashMap<\/code> <em>is<\/em> enough for single-thread LRU (Q104); you write the list because they want to see <code>moveToFront<\/code> and because TTL / weighted size / concurrency will not fit in <code>removeEldestEntry<\/code>.<\/p><p><strong>Decide.<\/strong> <code>record<\/code> is the wrong node (it is mutable). A static inner <code>Node<\/code> with <code>prev<\/code>/<code>next<\/code>. One <code>ReentrantLock<\/code>. Invariant: <code>map.size() == listLength<\/code>, head is newest, tail is oldest.<\/p><p><strong>Execute.<\/strong> Write, in this order, so each step is testable: node + dummies; <code>moveToFront<\/code>; <code>evictTail<\/code>; <code>get<\/code>; <code>put<\/code>; lock wrapper; then TTL field if time. Tests: evict oldest; <code>put<\/code> existing does not grow; <code>get<\/code> refreshes; capacity 1; capacity 0 if you allowed it.<\/p><p><strong>Reflect.<\/strong> The follow-up ladder: LFU (Q244), weighted entries, <code>computeIfAbsent<\/code> without double load (Q226), distributed LRU (that is <code>04-system-design<\/code>, refuse to fake it). Weaknesses you name: one lock, lazy TTL, no metrics.<\/p><blockquote><p>Hook: an auth-token cache whose <code>LinkedHashMap<\/code> was &quot;good enough&quot; until TTL and a second writer showed up.<\/p><\/blockquote>", "source": "scenario-questions.md (S12)", "search": "design and implement an lru cache, production quality, 60 minutes. (s12) sixty minutes. get / put in o(1), capacity n, optional ttl, a thread-safety contract you will defend. they will ask why you did not use linkedhashmap. clarify. capacity 0: legal (every put evicts immediately) or rejected - pick and say. null keys / values: reject. get of missing: null or optional - pick null to match map, or optional if this is a new api (q250). ttl: lazy on access plus a sample, unless they want a janitor. concurrency: one lock for the round; \"i would use caffeine in the repo\". isolate. the structure is q101 / q243: map + doubly linked list + dummy ends. the hard parts are put on an existing key (update + move, no evict unless size exceeded), get that does not leak a node, and the size invariant after every path. linkedhashmap is enough for single-thread lru (q104); you write the list because they want to see movetofront and because ttl / weighted size / concurrency will not fit in removeeldestentry. decide. record is the wrong node (it is mutable). a static inner node with prev/next. one reentrantlock. invariant: map.size() == listlength, head is newest, tail is oldest. execute. write, in this order, so each step is testable: node + dummies; movetofront; evicttail; get; put; lock wrapper; then ttl field if time. tests: evict oldest; put existing does not grow; get refreshes; capacity 1; capacity 0 if you allowed it. reflect. the follow-up ladder: lfu (q244), weighted entries, computeifabsent without double load (q226), distributed lru (that is 04-system-design, refuse to fake it). weaknesses you name: one lock, lazy ttl, no metrics. hook: an auth-token cache whose linkedhashmap was \"good enough\" until ttl and a second writer showed up."}, {"n": 252, "category": 17, "difficulty": "A", "html": "Design and implement a rate limiter, 60 minutes, production quality expected. (S13)", "answerTitle": "Rate limiter", "answer": "<blockquote><p>Sixty minutes, production quality. Per-key limit of N events per window W, in one process, then &quot;what changes when this is six nodes&quot;. They will ask token bucket versus sliding window.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Per-key or global? Allow a burst of N at window start (token bucket, Q241) or &quot;no more than N in any W&quot; (sliding log / sliding window, Q242)? Fail-open or fail-closed when the clock jumps? Return type: boolean, or a <code>Result(allowed, retryAfter)<\/code>? Key cardinality?<\/p><p><strong>Isolate.<\/strong> The in-process object is small. The hard part is the clock (<code>nanoTime<\/code> versus wall), the memory of per-key state (a map that must evict stale keys), and the honest distributed sentence: this limiter is <em>not<\/em> global.<\/p><p><strong>Decide.<\/strong> For &quot;API quota, one node&quot;: token bucket, <code>ConcurrentHashMap&lt;Key, Bucket&gt;<\/code>, lazy refill, a sample eviction of idle keys. For &quot;compliance, any W&quot;: sliding window counter (two buckets) or a log (Q242). Distributed: Redis <code>INCR<\/code> + <code>PEXPIRE<\/code>, or a token-bucket in Redis, and accept ±1 window of error; or a central service. Do not &quot;put a HashMap in Redis&quot;.<\/p><p><strong>Execute.<\/strong> Write <code>tryAcquire(key, n)<\/code> with Q241&#x27;s refill. Document: not distributed, not fair, clock is monotonic. Tests: N+1st fails; refill after W; a key you never see again does not leak if you sample. Then say the six-node story in one minute: local limiter is a <em>protection of the node<\/em>, not a <em>quota<\/em>; quota lives in Redis or at the edge (API Gateway, Q in <code>05-aws<\/code>).<\/p><p><strong>Reflect.<\/strong> A limiter that is correct on one box and silent on six is how outages get 6× the allowed traffic. Name that before they ask. Weakness: key-map leak, and <code>nanoTime<\/code> overflowing in 292 years (you may joke once).<\/p><blockquote><p>Hook: a node-local limiter that &quot;held&quot; in staging (one box) and vanished behind an autoscaling group.<\/p><\/blockquote>", "source": "scenario-questions.md (S13)", "search": "design and implement a rate limiter, 60 minutes, production quality expected. (s13) sixty minutes, production quality. per-key limit of n events per window w, in one process, then \"what changes when this is six nodes\". they will ask token bucket versus sliding window. clarify. per-key or global? allow a burst of n at window start (token bucket, q241) or \"no more than n in any w\" (sliding log / sliding window, q242)? fail-open or fail-closed when the clock jumps? return type: boolean, or a result(allowed, retryafter)? key cardinality? isolate. the in-process object is small. the hard part is the clock (nanotime versus wall), the memory of per-key state (a map that must evict stale keys), and the honest distributed sentence: this limiter is not global. decide. for \"api quota, one node\": token bucket, concurrenthashmap<key, bucket , lazy refill, a sample eviction of idle keys. for \"compliance, any w\": sliding window counter (two buckets) or a log (q242). distributed: redis incr + pexpire, or a token-bucket in redis, and accept ±1 window of error; or a central service. do not \"put a hashmap in redis\". execute. write tryacquire(key, n) with q241's refill. document: not distributed, not fair, clock is monotonic. tests: n+1st fails; refill after w; a key you never see again does not leak if you sample. then say the six-node story in one minute: local limiter is a protection of the node , not a quota ; quota lives in redis or at the edge (api gateway, q in 05-aws). reflect. a limiter that is correct on one box and silent on six is how outages get 6× the allowed traffic. name that before they ask. weakness: key-map leak, and nanotime overflowing in 292 years (you may joke once). hook: a node-local limiter that \"held\" in staging (one box) and vanished behind an autoscaling group."}, {"n": 253, "category": 17, "difficulty": "A", "html": "Design and implement an in-memory key-value store with TTL, 60 minutes. (S14)", "answerTitle": "In-memory key-value store with TTL", "answer": "<blockquote><p>Sixty minutes. <code>put(k, v, ttl)<\/code>, <code>get<\/code>, <code>delete<\/code>, capacity eviction, a concurrency contract. They will ask lazy versus eager expire.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Null policy. TTL of 0 / negative: reject or treat as delete. Capacity: entry count or bytes? Overwrite: reset TTL or keep? <code>get<\/code> of expired: miss, and drop the entry.<\/p><p><strong>Isolate.<\/strong> Two indexes (Q246): <code>HashMap&lt;K, Node&gt;<\/code> for O(1) get, and a recency structure for eviction (LRU list) plus an expiry structure if eager (<code>DelayQueue<\/code> or <code>TreeMap&lt;exp, K&gt;<\/code>). Lazy expire is one index and a check on access; the leak is unread expired keys.<\/p><p><strong>Decide.<\/strong> Lazy + sample (on each <code>put<\/code>, inspect 5 random entries) + LRU for capacity. One lock, or <code>ConcurrentHashMap<\/code> plus a lock on the LRU list (that is the two-lock trap of S2 - prefer one lock in 60 minutes). Invariant: every live entry is in both the map and the LRU list; expired is in neither after a <code>get<\/code>.<\/p><p><strong>Execute.<\/strong> Reuse S12&#x27;s list. Add <code>expNanos<\/code> on the node. <code>get<\/code>: if expired, delete, return miss. <code>put<\/code>: overwrite path resets TTL and moves to front; then evict while <code>size &gt; cap<\/code> or the tail is expired. Tests: expire-on-get; unread expired does not live forever <em>if<\/em> a later <code>put<\/code> samples it; capacity still holds under a flood of short-TTL keys.<\/p><p><strong>Reflect.<\/strong> Eager expire needs a thread you now have to shut down - say so if they want it. Distributed KV is Redis / DynamoDB and a different pack. Weakness: sampling is probabilistic; a key that is never touched and never sampled sits until capacity evicts it (LRU saves you if the list still contains it).<\/p><blockquote><p>Hook: a session store that &quot;expired&quot; on paper and grew until an LRU was added.<\/p><\/blockquote>", "source": "scenario-questions.md (S14)", "search": "design and implement an in-memory key-value store with ttl, 60 minutes. (s14) sixty minutes. put(k, v, ttl), get, delete, capacity eviction, a concurrency contract. they will ask lazy versus eager expire. clarify. null policy. ttl of 0 / negative: reject or treat as delete. capacity: entry count or bytes? overwrite: reset ttl or keep? get of expired: miss, and drop the entry. isolate. two indexes (q246): hashmap<k, node for o(1) get, and a recency structure for eviction (lru list) plus an expiry structure if eager (delayqueue or treemap<exp, k ). lazy expire is one index and a check on access; the leak is unread expired keys. decide. lazy + sample (on each put, inspect 5 random entries) + lru for capacity. one lock, or concurrenthashmap plus a lock on the lru list (that is the two-lock trap of s2 - prefer one lock in 60 minutes). invariant: every live entry is in both the map and the lru list; expired is in neither after a get. execute. reuse s12's list. add expnanos on the node. get: if expired, delete, return miss. put: overwrite path resets ttl and moves to front; then evict while size cap or the tail is expired. tests: expire-on-get; unread expired does not live forever if a later put samples it; capacity still holds under a flood of short-ttl keys. reflect. eager expire needs a thread you now have to shut down - say so if they want it. distributed kv is redis / dynamodb and a different pack. weakness: sampling is probabilistic; a key that is never touched and never sampled sits until capacity evicts it (lru saves you if the list still contains it). hook: a session store that \"expired\" on paper and grew until an lru was added."}, {"n": 254, "category": 17, "difficulty": "A", "html": "Design and implement a process-local ID generator that will later be sharded. (S15)", "answerTitle": "Process-local ID generator, later sharded", "answer": "<blockquote><p>Forty-five to sixty minutes. Unique 64-bit ids, roughly ordered by time, one process today, many tomorrow. They will rewind the clock and ask what you emit.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Uniqueness is the invariant; monotonicity is best-effort. IDs may leak (they are not secrets). Worker id: an int you are <em>given<\/em>, not <code>random<\/code>. Clock: wall clock, with a policy on backwards steps. Rate: ids per millisecond you must support (4096 is the 12-bit default).<\/p><p><strong>Isolate.<\/strong> Snowflake (Q245) is the shape. The hard parts are: sequence overflow in a millisecond (wait or steal from the next ms), clock going backwards (throw, wait, or use a logical clock), and the later shard (worker-id bits must already exist).<\/p><p><strong>Decide.<\/strong> Layout you write on the board: 1 unused + 41 timestamp + 10 worker + 12 sequence, epoch you pick and <em>document<\/em>. <code>nextId<\/code> is <code>synchronized<\/code> (or an <code>AtomicLong<\/code> of the last id if you are careful). Clock backwards by less than X ms: wait; more: throw. Do not emit.<\/p><p><strong>Execute.<\/strong> Write <code>nextId<\/code>, the wait-for-next-ms helper, and a test that two ids in the same ms differ in the sequence bits. Test that a one-second rewind throws (or waits - you picked). Show how a second process with a different worker id cannot collide <em>if<\/em> worker ids are unique. The &quot;later sharded&quot; sentence: worker bits <em>are<\/em> the shard; a coordinator (or instance index) assigns them; you do not hash the payload into the id.<\/p><p><strong>Reflect.<\/strong> Weaknesses: 41 bits of ms is ~69 years from the epoch; 10 bits is 1024 workers; a duplicate worker id is a silent uniqueness bug - that assignment is an ops problem you name. UUID v7 is the alternative if you do not need 64 bits.<\/p><blockquote><p>Hook: an order-id scheme that collided after a leap-second because two boxes issued from a rewound clock.<\/p><\/blockquote>", "source": "scenario-questions.md (S15)", "search": "design and implement a process-local id generator that will later be sharded. (s15) forty-five to sixty minutes. unique 64-bit ids, roughly ordered by time, one process today, many tomorrow. they will rewind the clock and ask what you emit. clarify. uniqueness is the invariant; monotonicity is best-effort. ids may leak (they are not secrets). worker id: an int you are given , not random. clock: wall clock, with a policy on backwards steps. rate: ids per millisecond you must support (4096 is the 12-bit default). isolate. snowflake (q245) is the shape. the hard parts are: sequence overflow in a millisecond (wait or steal from the next ms), clock going backwards (throw, wait, or use a logical clock), and the later shard (worker-id bits must already exist). decide. layout you write on the board: 1 unused + 41 timestamp + 10 worker + 12 sequence, epoch you pick and document . nextid is synchronized (or an atomiclong of the last id if you are careful). clock backwards by less than x ms: wait; more: throw. do not emit. execute. write nextid, the wait-for-next-ms helper, and a test that two ids in the same ms differ in the sequence bits. test that a one-second rewind throws (or waits - you picked). show how a second process with a different worker id cannot collide if worker ids are unique. the \"later sharded\" sentence: worker bits are the shard; a coordinator (or instance index) assigns them; you do not hash the payload into the id. reflect. weaknesses: 41 bits of ms is ~69 years from the epoch; 10 bits is 1024 workers; a duplicate worker id is a silent uniqueness bug - that assignment is an ops problem you name. uuid v7 is the alternative if you do not need 64 bits. hook: an order-id scheme that collided after a leap-second because two boxes issued from a rewound clock."}, {"n": 255, "category": 17, "difficulty": "A", "html": "Design and implement retry with backoff, idempotency keys, and a budget, as a library. (S16)", "answerTitle": "Retry library with backoff, idempotency and a budget", "answer": "<blockquote><p>Sixty minutes. A library 40 teams will import (Q250). <code>call<\/code> with retry-on predicate, jittered exponential backoff, a deadline, and an idempotency key the caller can pass through. They will ask what you never retry.<\/p><\/blockquote><p><strong>Clarify.<\/strong> What is retried: <code>IOException<\/code> and 408/429/5xx, not 4xx, not <code>IllegalArgumentException<\/code>. Deadline: wall budget, not &quot;N attempts&quot; alone. Idempotency: the library <em>transports<\/em> a key the caller minted; it does not mint one for a POST it does not understand. Thread: the caller’s thread sleeps (simple) or scheduled executor (non-blocking) - pick and document.<\/p><p><strong>Isolate.<\/strong> The loop is Q238. The library problem is the API: what is generic, what is wrapped, what is logged, what is cancelled, and how a team cannot forget the predicate. The budget is a <code>Deadline<\/code> object, not a magic <code>maxAttempts=3<\/code> that ignores a 30-second sleep.<\/p><p><strong>Decide.<\/strong><\/p><pre><code class=\"lang-java\">public final class Retry {\n    public static &lt;T&gt; T call(Callable&lt;T&gt; c, RetryPolicy p) throws Exception { /* Q238 + deadline */ }\n}\npublic final class RetryPolicy {\n    final Predicate&lt;Exception&gt; retryOn;\n    final int maxAttempts;\n    final Duration budget, base, cap;\n    final boolean jitter;\n}<\/code><\/pre><p>Defaults: retry on <code>IOException<\/code> and a small set of status wrappers; 3 attempts; 2s budget; jitter on. <code>IdempotencyKey<\/code> is a header argument, not something <code>Retry<\/code> invents. Never retry a non-idempotent request unless the key is present - if it is absent, one attempt.<\/p><p><strong>Execute.<\/strong> Write the policy object first (that is the API review). Then the loop with <code>System.nanoTime()<\/code> against the budget. Tests: succeeds first time (zero sleeps); always-fail respects budget; 400 is not retried; interrupt stops the loop. Document thread-safety: policy is immutable, <code>call<\/code> is stateless.<\/p><p><strong>Reflect.<\/strong> Weaknesses: sleeping on the caller thread; no retry-after parsing yet; a bad default predicate will 3× a POST. The follow-up you volunteer: <code>Retry-After<\/code>, and a metric on attempts. This is the library form of S3&#x27;s &quot;do not lose work silently&quot; - here, do not <em>duplicate<\/em> work silently.<\/p><blockquote><p>Hook: a retry helper that turned a 500 into three orders because the POST had no idempotency key.<\/p><\/blockquote>", "source": "scenario-questions.md (S16)", "search": "design and implement retry with backoff, idempotency keys, and a budget, as a library. (s16) sixty minutes. a library 40 teams will import (q250). call with retry-on predicate, jittered exponential backoff, a deadline, and an idempotency key the caller can pass through. they will ask what you never retry. clarify. what is retried: ioexception and 408/429/5xx, not 4xx, not illegalargumentexception. deadline: wall budget, not \"n attempts\" alone. idempotency: the library transports a key the caller minted; it does not mint one for a post it does not understand. thread: the caller’s thread sleeps (simple) or scheduled executor (non-blocking) - pick and document. isolate. the loop is q238. the library problem is the api: what is generic, what is wrapped, what is logged, what is cancelled, and how a team cannot forget the predicate. the budget is a deadline object, not a magic maxattempts=3 that ignores a 30-second sleep. decide. java public final class retry { public static <t t call(callable<t c, retrypolicy p) throws exception { / q238 + deadline / } } public final class retrypolicy { final predicate<exception retryon; final int maxattempts; final duration budget, base, cap; final boolean jitter; } defaults: retry on ioexception and a small set of status wrappers; 3 attempts; 2s budget; jitter on. idempotencykey is a header argument, not something retry invents. never retry a non-idempotent request unless the key is present - if it is absent, one attempt. execute. write the policy object first (that is the api review). then the loop with system.nanotime() against the budget. tests: succeeds first time (zero sleeps); always-fail respects budget; 400 is not retried; interrupt stops the loop. document thread-safety: policy is immutable, call is stateless. reflect. weaknesses: sleeping on the caller thread; no retry-after parsing yet; a bad default predicate will 3× a post. the follow-up you volunteer: retry-after, and a metric on attempts. this is the library form of s3's \"do not lose work silently\" - here, do not duplicate work silently. hook: a retry helper that turned a 500 into three orders because the post had no idempotency key."}, {"n": 256, "category": 18, "difficulty": "C", "html": "In a 45-minute round, what naming, structure and error handling do you keep, and what do you consciously drop? (See also mock Q153.)", "answerTitle": "What you keep in 45 minutes", "answer": "<p>Keep: names that match the problem, a helper for a second use, a guard on null/empty, the complexity sentence. Drop: a logging facade, a strategy interface, generics that take five minutes, comments that restate the line. Say the drop out loud (Q13). Mock Q153 is the same list from the <em>round<\/em> side.<\/p>", "source": "answers.md", "search": "in a 45-minute round, what naming, structure and error handling do you keep, and what do you consciously drop? (see also mock q153.) keep: names that match the problem, a helper for a second use, a guard on null/empty, the complexity sentence. drop: a logging facade, a strategy interface, generics that take five minutes, comments that restate the line. say the drop out loud (q13). mock q153 is the same list from the round side."}, {"n": 257, "category": 18, "difficulty": "C", "html": "What tests do you write in a live coding round, how many, and when? Happy path, one edge, one invariant.", "answerTitle": "Tests in a live round", "answer": "<p>Three, after the first green path, not before you have a loop: one happy example from the prompt, one edge (<code>[]<\/code>, <code>null<\/code>, <code>k=0<\/code>, <code>MIN_VALUE<\/code>), one invariant (round-trip, <code>size<\/code> vs eviction, &quot;result is sorted&quot;). Write them as <code>assert<\/code> or a <code>main<\/code>. TDD theatre of twelve tests on an empty method wastes the clock.<\/p>", "source": "answers.md", "search": "what tests do you write in a live coding round, how many, and when? happy path, one edge, one invariant. three, after the first green path, not before you have a loop: one happy example from the prompt, one edge ([], null, k=0, min_value), one invariant (round-trip, size vs eviction, \"result is sorted\"). write them as assert or a main. tdd theatre of twelve tests on an empty method wastes the clock."}, {"n": 258, "category": 18, "difficulty": "D", "html": "Refactoring kata: extract method, introduce parameter object, replace type code with class. Show each on a 20-line example.", "answerTitle": "Three katas on twenty lines", "answer": "<p>Extract method: the inner loop that had a name in your mouth. Parameter object: the four booleans that travel together become a <code>record<\/code>. Replace type code: <code>int kind<\/code> plus a switch becomes a small type with behaviour. Do them one at a time, tests green in between (Q261). Do not rename everything first.<\/p>", "source": "answers.md", "search": "refactoring kata: extract method, introduce parameter object, replace type code with class. show each on a 20-line example. extract method: the inner loop that had a name in your mouth. parameter object: the four booleans that travel together become a record. replace type code: int kind plus a switch becomes a small type with behaviour. do them one at a time, tests green in between (q261). do not rename everything first."}, {"n": 259, "category": 18, "difficulty": "D", "html": "A 200-line method with three boolean flags. How do you split it live, and what do you not rename while you are still wrong?", "answerTitle": "200-line method, three flags", "answer": "<p>Split on the flags first: three methods, not one method with a clearer name. Do not rename while the behaviour is still wrong - you will rename the bug. Characterization test (Q261) on the whole method, then extract. Live, you narrate <em>&quot;I am isolating the <code>isRetry<\/code> path so I can see it&quot;<\/em>.<\/p>", "source": "answers.md", "search": "a 200-line method with three boolean flags. how do you split it live, and what do you not rename while you are still wrong? split on the flags first: three methods, not one method with a clearer name. do not rename while the behaviour is still wrong - you will rename the bug. characterization test (q261) on the whole method, then extract. live, you narrate \"i am isolating the isretry path so i can see it\" ."}, {"n": 260, "category": 18, "difficulty": "T", "html": "The code uses <code>Optional<\/code> as a field, <code>null<\/code> as a return, and <code>catch (Exception e) {}<\/code>. What do you say first, and what do you leave?", "answerTitle": "Optional field, null return, empty catch", "answer": "<p>First: the empty catch - that is a production incident. Then the null return versus <code>Optional<\/code> inconsistency: pick one for <em>this<\/em> type and say which. Leave the <code>Optional<\/code> field if the clock is short and it is not on the path you were asked to change; put it on the list. Ordering is judgement; a tour of every smell is a failed review (mock Q172).<\/p>", "source": "answers.md", "search": "the code uses optional as a field, null as a return, and catch (exception e) {}. what do you say first, and what do you leave? first: the empty catch - that is a production incident. then the null return versus optional inconsistency: pick one for this type and say which. leave the optional field if the clock is short and it is not on the path you were asked to change; put it on the list. ordering is judgement; a tour of every smell is a failed review (mock q172)."}, {"n": 261, "category": 18, "difficulty": "D", "html": "Characterization tests before a refactor. What do you pin, and how do you avoid gold-plating the test of a function you are about to delete?", "answerTitle": "Characterization tests", "answer": "<p>Pin <em>observable<\/em> behaviour: outputs, thrown types, order if it is part of the contract, not internal call counts. A test of a function you are about to delete should live on the façade you are keeping. Gold-plating is asserting on log lines and private state. Golden files are fine when the output is a blob; name them as characterization, not as spec.<\/p>", "source": "answers.md", "search": "characterization tests before a refactor. what do you pin, and how do you avoid gold-plating the test of a function you are about to delete? pin observable behaviour: outputs, thrown types, order if it is part of the contract, not internal call counts. a test of a function you are about to delete should live on the façade you are keeping. gold-plating is asserting on log lines and private state. golden files are fine when the output is a blob; name them as characterization, not as spec."}, {"n": 262, "category": 18, "difficulty": "D", "html": "Mutation testing versus coverage. Why is 100% line coverage compatible with a useless suite, and what mutation would you apply to this method?", "answerTitle": "Mutation versus coverage", "answer": "<p>100% lines can miss <code>x + 1<\/code> versus <code>x<\/code> if no assertion read the value. A useful mutation: flip a condition, off-by-one a bound, drop a <code>break<\/code>, replace <code>&amp;&amp;<\/code> with <code>||<\/code>. If the suite stays green, the suite is the bug. You do not run PIT in a 45-minute round; you <em>name<\/em> one mutation you would apply to this method.<\/p>", "source": "answers.md", "search": "mutation testing versus coverage. why is 100% line coverage compatible with a useless suite, and what mutation would you apply to this method? 100% lines can miss x + 1 versus x if no assertion read the value. a useful mutation: flip a condition, off-by-one a bound, drop a break, replace && with . if the suite stays green, the suite is the bug. you do not run pit in a 45-minute round; you name one mutation you would apply to this method."}, {"n": 263, "category": 18, "difficulty": "D", "html": "Flaky test: time, order, shared statics, and real I/O. Write the fix for a test that calls <code>Instant.now()<\/code> and one that depends on <code>HashMap<\/code> order.", "answerTitle": "Flaky tests", "answer": "<p><code>Instant.now()<\/code>: inject a <code>Clock<\/code>. HashMap order: assert as a set, or use <code>LinkedHashMap<\/code> if order is the contract. Shared statics: isolate with a new classloader or (better) do not use them. Real I/O: a fake or a temp dir you delete. The fix is determinism, not a retry rule. A <code>@RepeatedTest<\/code> that &quot;usually passes&quot; is not a fix.<\/p>", "source": "answers.md", "search": "flaky test: time, order, shared statics, and real i/o. write the fix for a test that calls instant.now() and one that depends on hashmap order. instant.now(): inject a clock. hashmap order: assert as a set, or use linkedhashmap if order is the contract. shared statics: isolate with a new classloader or (better) do not use them. real i/o: a fake or a temp dir you delete. the fix is determinism, not a retry rule. a @repeatedtest that \"usually passes\" is not a fix."}, {"n": 264, "category": 18, "difficulty": "T", "html": "You find a security bug in the pairing codebase. How do you raise it without turning the next 20 minutes into a lecture? (See mock Q169.)", "answerTitle": "Security bug in pairing", "answer": "<p>Name it, label it blocking, estimate blast radius in one sentence, offer to park a failing test, and <em>return to the ticket they asked you to do<\/em> unless they steer. A 20-minute lecture on OWASP is a failed pairing even when you are right. Mock Q169 is the architecture-review version of the same muscle.<\/p>", "source": "answers.md", "search": "you find a security bug in the pairing codebase. how do you raise it without turning the next 20 minutes into a lecture? (see mock q169.) name it, label it blocking, estimate blast radius in one sentence, offer to park a failing test, and return to the ticket they asked you to do unless they steer. a 20-minute lecture on owasp is a failed pairing even when you are right. mock q169 is the architecture-review version of the same muscle."}, {"n": 265, "category": 18, "difficulty": "D", "html": "What a principal-level reviewer comments on that a strong senior misses: API shape, failure modes, and the cost of the happy path.", "answerTitle": "What a principal comments on", "answer": "<p>API shape (will 40 teams have to live with this name), failure modes (what does this do when the dependency is slow), and the cost of the happy path (an extra allocation on 10 kRPS, a sync call inside a virtual thread that pins). Seniors find the NPE. Principals find the design that will still be wrong when the NPE is gone.<\/p>", "source": "answers.md", "search": "what a principal-level reviewer comments on that a strong senior misses: api shape, failure modes, and the cost of the happy path. api shape (will 40 teams have to live with this name), failure modes (what does this do when the dependency is slow), and the cost of the happy path (an extra allocation on 10 krps, a sync call inside a virtual thread that pins). seniors find the npe. principals find the design that will still be wrong when the npe is gone."}, {"n": 266, "category": 18, "difficulty": "A", "html": "Write a ten-line code-review standard you could paste into a team wiki, covering blocking versus preference.", "answerTitle": "A ten-line review standard", "answer": "<p>Blocking: correctness, security, data loss, unbounded resource, a missing test on the invariant. Non-blocking: naming, a simpler structure, a missed library call. Question: &quot;did you consider X&quot; - not a demand. Preference: style the linter should have owned. Every comment labelled. No &quot;nit:&quot; that is actually blocking. How you <em>land<\/em> this across teams is Q267 / S17.<\/p>", "source": "answers.md", "search": "write a ten-line code-review standard you could paste into a team wiki, covering blocking versus preference. blocking: correctness, security, data loss, unbounded resource, a missing test on the invariant. non-blocking: naming, a simpler structure, a missed library call. question: \"did you consider x\" - not a demand. preference: style the linter should have owned. every comment labelled. no \"nit:\" that is actually blocking. how you land this across teams is q267 / s17."}, {"n": 267, "category": 18, "difficulty": "A", "html": "You need this standard adopted by six teams you do not manage. How did you land it? (Your story. S17)", "answerTitle": "Landing a review standard across teams you do not manage", "answer": "<p>You wrote Q266&#x27;s ten-line standard. Six teams, none of them yours, had six different definitions of &quot;blocking&quot;. How did you get to one definition without a title that said they had to listen? Who resisted, what did you drop, what became the default in the template, and what changed in the revert rate or the time-to-merge?<\/p>", "source": "scenario-question
