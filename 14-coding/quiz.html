ited<\/code> will treat a node reachable by two legal paths as a cycle, or miss a cycle that goes through a &quot;visited&quot; node still on the stack. The interviewer who says &quot;just DFS&quot; is waiting for that sentence.<\/p>", "source": "answers.md", "search": "course schedule with a cycle. the interviewer says \"just dfs\". what extra state do you need so a cross-edge is not a cycle? you need the grey state (q136). a single visited will treat a node reachable by two legal paths as a cycle, or miss a cycle that goes through a \"visited\" node still on the stack. the interviewer who says \"just dfs\" is waiting for that sentence."}, {"n": 140, "category": 10, "difficulty": "D", "html": "Number of islands / connected components. Flood fill, and the union-find version. When is union-find the one you want?", "answerTitle": "Islands / components", "answer": "<p>Flood fill (DFS/BFS) from each unvisited <code>1<\/code>, count starts. Union-find on the <code>1<\/code> cells, union with right and down only to avoid double work, count roots. Union-find wins when edges arrive as a stream (dynamic connectivity) or you already have it; flood fill wins on a grid under a clock.<\/p>", "source": "answers.md", "search": "number of islands / connected components. flood fill, and the union-find version. when is union-find the one you want? flood fill (dfs/bfs) from each unvisited 1, count starts. union-find on the 1 cells, union with right and down only to avoid double work, count roots. union-find wins when edges arrive as a stream (dynamic connectivity) or you already have it; flood fill wins on a grid under a clock."}, {"n": 141, "category": 10, "difficulty": "D", "html": "Clone a graph. The <code>HashMap&lt;Node, Node&gt;<\/code> from original to clone, and the BFS that fills neighbours after the clone exists.", "answerTitle": "Clone a graph", "answer": "<pre><code class=\"lang-java\">Node clone(Node n) {\n    if (n == null) return null;\n    Map&lt;Node, Node&gt; copy = new IdentityHashMap&lt;&gt;();\n    ArrayDeque&lt;Node&gt; q = new ArrayDeque&lt;&gt;();\n    copy.put(n, new Node(n.val)); q.add(n);\n    while (!q.isEmpty()) {\n        Node u = q.poll();\n        for (Node v : u.neighbors) {\n            if (!copy.containsKey(v)) {\n                copy.put(v, new Node(v.val));\n                q.add(v);\n            }\n            copy.get(u).neighbors.add(copy.get(v));\n        }\n    }\n    return copy.get(n);\n}<\/code><\/pre><p>Create the clone <em>before<\/em> you walk its neighbours. <code>IdentityHashMap<\/code> because node equality is identity (Q36, Q96).<\/p>", "source": "answers.md", "search": "clone a graph. the hashmap<node, node from original to clone, and the bfs that fills neighbours after the clone exists. java node clone(node n) { if (n == null) return null; map<node, node copy = new identityhashmap< (); arraydeque<node q = new arraydeque< (); copy.put(n, new node(n.val)); q.add(n); while (!q.isempty()) { node u = q.poll(); for (node v : u.neighbors) { if (!copy.containskey(v)) { copy.put(v, new node(v.val)); q.add(v); } copy.get(u).neighbors.add(copy.get(v)); } } return copy.get(n); } create the clone before you walk its neighbours. identityhashmap because node equality is identity (q36, q96)."}, {"n": 142, "category": 10, "difficulty": "D", "html": "Dijkstra with <code>PriorityQueue<\/code>. The &quot;stale heap entry&quot; pattern in Java (no decrease-key), and why a visited-on-settle is enough for non-negative weights.", "answerTitle": "Dijkstra in Java", "answer": "<p><code>PriorityQueue<\/code> of <code>(dist, node)<\/code>. No decrease-key: offer a new entry, ignore stale ones when <code>d &gt; best[u]<\/code> on pop. Mark settled on pop, not on first sight (unlike unweighted BFS). Non-negative weights only. O((n+e) log n) with the stale-entry tax.<\/p>", "source": "answers.md", "search": "dijkstra with priorityqueue. the \"stale heap entry\" pattern in java (no decrease-key), and why a visited-on-settle is enough for non-negative weights. priorityqueue of (dist, node). no decrease-key: offer a new entry, ignore stale ones when d best[u] on pop. mark settled on pop, not on first sight (unlike unweighted bfs). non-negative weights only. o((n+e) log n) with the stale-entry tax."}, {"n": 143, "category": 10, "difficulty": "T", "html": "Bellman-Ford and a negative cycle. When must you mention it, and what happens if you run Dijkstra on a negative edge?", "answerTitle": "Bellman-Ford and negatives", "answer": "<p>Relax all edges n-1 times; one more success means a negative cycle reachable from the source. Mention it when weights can be negative or when &quot;arbitrage&quot; is the story. Dijkstra on a negative edge is <em>wrong<\/em>, not just slower - it can settle a node before a cheaper path exists. Do not &quot;fix&quot; Dijkstra with negatives.<\/p>", "source": "answers.md", "search": "bellman-ford and a negative cycle. when must you mention it, and what happens if you run dijkstra on a negative edge? relax all edges n-1 times; one more success means a negative cycle reachable from the source. mention it when weights can be negative or when \"arbitrage\" is the story. dijkstra on a negative edge is wrong , not just slower - it can settle a node before a cheaper path exists. do not \"fix\" dijkstra with negatives."}, {"n": 144, "category": 10, "difficulty": "D", "html": "Union-find with path compression and union-by-rank. Write <code>find<\/code> and <code>union<\/code>, and the inverse-Ackermann claim you should not oversell.", "answerTitle": "Union-find", "answer": "<pre><code class=\"lang-java\">int find(int x) { return p[x] == x ? x : (p[x] = find(p[x])); }\nboolean union(int a, int b) {\n    int ra = find(a), rb = find(b);\n    if (ra == rb) return false;\n    if (r[ra] &lt; r[rb]) { int t = ra; ra = rb; rb = t; }\n    p[rb] = ra;\n    if (r[ra] == r[rb]) r[ra]++;\n    return true;\n}<\/code><\/pre><p>Path compression + union-by-rank is inverse-Ackermann, &quot;effectively O(1)&quot; - do not say O(1) as a theorem, say &quot;I treat it as O(1) for this n&quot;.<\/p>", "source": "answers.md", "search": "union-find with path compression and union-by-rank. write find and union, and the inverse-ackermann claim you should not oversell. java int find(int x) { return p[x] == x ? x : (p[x] = find(p[x])); } boolean union(int a, int b) { int ra = find(a), rb = find(b); if (ra == rb) return false; if (r[ra] < r[rb]) { int t = ra; ra = rb; rb = t; } p[rb] = ra; if (r[ra] == r[rb]) r[ra]++; return true; } path compression + union-by-rank is inverse-ackermann, \"effectively o(1)\" - do not say o(1) as a theorem, say \"i treat it as o(1) for this n\"."}, {"n": 145, "category": 10, "difficulty": "D", "html": "Word ladder. The implicit graph, bidirectional BFS, and why the neighbour generation is the real cost.", "answerTitle": "Word ladder", "answer": "<p>Implicit graph: words are nodes, an edge if they differ by one character. Neighbour generation is the cost: either mutate each position through <code>a-z<\/code> and test a <code>HashSet<\/code> (26·L), or pre-bucket on a wildcard key. Bidirectional BFS halves the depth. Begin/end not in the list is a guard.<\/p>", "source": "answers.md", "search": "word ladder. the implicit graph, bidirectional bfs, and why the neighbour generation is the real cost. implicit graph: words are nodes, an edge if they differ by one character. neighbour generation is the cost: either mutate each position through a-z and test a hashset (26·l), or pre-bucket on a wildcard key. bidirectional bfs halves the depth. begin/end not in the list is a guard."}, {"n": 146, "category": 10, "difficulty": "D", "html": "Alien dictionary. The graph of letter-order constraints, and the invalid-input cases (cycle, prefix contradiction).", "answerTitle": "Alien dictionary", "answer": "<p>Compare consecutive words, find the first differing character, add that directed edge. Prefix contradiction: a longer word before its prefix (<code>apple<\/code> then <code>app<\/code>). Then Kahn (Q138); a leftover degree is a cycle, hence invalid. Multiple valid orders: any one, or <code>&quot;&quot;<\/code> if they want &quot;the&quot; order and it is not unique - ask.<\/p>", "source": "answers.md", "search": "alien dictionary. the graph of letter-order constraints, and the invalid-input cases (cycle, prefix contradiction). compare consecutive words, find the first differing character, add that directed edge. prefix contradiction: a longer word before its prefix (apple then app). then kahn (q138); a leftover degree is a cycle, hence invalid. multiple valid orders: any one, or \"\" if they want \"the\" order and it is not unique - ask."}, {"n": 147, "category": 10, "difficulty": "T", "html": "BFS on a grid with a visited <code>boolean[][]<\/code> versus mutating the grid. When is mutation acceptable in a round, and when is it a bug?", "answerTitle": "Mutating the grid as visited", "answer": "<p>Acceptable in a round when the problem gives you the grid and does not need it afterwards; say you are mutating. A bug when the caller reuses the grid, when <code>-1<\/code> is already a cell value, or when you must restore (some backtracking). Prefer a <code>visited[][]<\/code> unless they ask for O(1) extra.<\/p>", "source": "answers.md", "search": "bfs on a grid with a visited boolean[][] versus mutating the grid. when is mutation acceptable in a round, and when is it a bug? acceptable in a round when the problem gives you the grid and does not need it afterwards; say you are mutating. a bug when the caller reuses the grid, when -1 is already a cell value, or when you must restore (some backtracking). prefer a visited[][] unless they ask for o(1) extra."}, {"n": 148, "category": 10, "difficulty": "A", "html": "A dependency graph of 20k build targets. Design the incremental rebuild: what you store, what you invalidate, and the cycle report.", "answerTitle": "20k-target incremental rebuild", "answer": "<p>Store the DAG and the reverse DAG (dependents). On a change, BFS/DFS the dependents, mark dirty, Kahn-build only that subgraph. Cycle report is Q138 leftovers, as a list of names, not a boolean. Persist hashes of inputs so &quot;changed&quot; is content, not timestamps. This is <code>make<\/code> / Bazel, not LeetCode course-schedule.<\/p>", "source": "answers.md", "search": "a dependency graph of 20k build targets. design the incremental rebuild: what you store, what you invalidate, and the cycle report. store the dag and the reverse dag (dependents). on a change, bfs/dfs the dependents, mark dirty, kahn-build only that subgraph. cycle report is q138 leftovers, as a list of names, not a boolean. persist hashes of inputs so \"changed\" is content, not timestamps. this is make / bazel, not leetcode course-schedule."}, {"n": 149, "category": 10, "difficulty": "A", "html": "Shortest path in a time-dependent graph (edge weight = function of departure time). What algorithm still works, and what do you discretize?", "answerTitle": "Time-dependent shortest path", "answer": "<p>If waiting is allowed and the cost of departing at t is monotonic, Dijkstra still works with state <code>(node, time)<\/code> and edge weight <code>w(t_depart)<\/code>. You discretize time (seconds, minutes) or you keep time continuous and evaluate <code>w<\/code> as a function. State explosion is the design problem: bucket time, or bound the horizon. Plain Dijkstra-on-nodes is wrong because the cost of <code>u→v<\/code> is not a constant.<\/p>", "source": "answers.md", "search": "shortest path in a time-dependent graph (edge weight = function of departure time). what algorithm still works, and what do you discretize? if waiting is allowed and the cost of departing at t is monotonic, dijkstra still works with state (node, time) and edge weight w(t_depart). you discretize time (seconds, minutes) or you keep time continuous and evaluate w as a function. state explosion is the design problem: bucket time, or bound the horizon. plain dijkstra-on-nodes is wrong because the cost of u→v is not a constant."}, {"n": 150, "category": 11, "difficulty": "C", "html": "The backtracking template: choose, explore, unchoose. Write it for subsets, and name what you copy into the result.", "answerTitle": "Subsets template", "answer": "<pre><code class=\"lang-java\">void dfs(int i, List&lt;Integer&gt; path, List&lt;List&lt;Integer&gt;&gt; out, int[] a) {\n    if (i == a.length) { out.add(new ArrayList&lt;&gt;(path)); return; }\n    path.add(a[i]); dfs(i + 1, path, out, a); path.remove(path.size() - 1);\n    dfs(i + 1, path, out, a);\n}<\/code><\/pre><p>Copy <code>path<\/code> into <code>out<\/code> - the live list will change. Choose / explore / unchoose is the sentence you say. O(2ⁿ · n) for n ≤ 20.<\/p>", "source": "answers.md", "search": "the backtracking template: choose, explore, unchoose. write it for subsets, and name what you copy into the result. java void dfs(int i, list<integer path, list<list<integer out, int[] a) { if (i == a.length) { out.add(new arraylist< (path)); return; } path.add(a[i]); dfs(i + 1, path, out, a); path.remove(path.size() - 1); dfs(i + 1, path, out, a); } copy path into out - the live list will change. choose / explore / unchoose is the sentence you say. o(2ⁿ · n) for n ≤ 20."}, {"n": 151, "category": 11, "difficulty": "C", "html": "Permutations of a distinct array. The used-array versus in-place swap. Which do you write, and why is the swap version easier to get wrong?", "answerTitle": "Permutations", "answer": "<p>Used-array is the one you write: scan 0..n-1, skip used, mark, recurse, unmark. In-place swap (<code>swap(i, j)<\/code> for <code>j &gt;= i<\/code>, recurse <code>i+1<\/code>, swap back) is shorter and easier to get wrong on duplicates. Duplicates: sort and skip a value that equals the previous and the previous was <em>not<\/em> used (or the swap family with a set at this depth).<\/p>", "source": "answers.md", "search": "permutations of a distinct array. the used-array versus in-place swap. which do you write, and why is the swap version easier to get wrong? used-array is the one you write: scan 0..n-1, skip used, mark, recurse, unmark. in-place swap (swap(i, j) for j = i, recurse i+1, swap back) is shorter and easier to get wrong on duplicates. duplicates: sort and skip a value that equals the previous and the previous was not used (or the swap family with a set at this depth)."}, {"n": 152, "category": 11, "difficulty": "D", "html": "Combination sum, with and without reuse. The sort-and-skip, and the index you pass to forbid reuse of earlier elements.", "answerTitle": "Combination sum", "answer": "<p>Reuse allowed: recurse <code>i<\/code> (same index) after pushing <code>a[i]<\/code>. Reuse forbidden: recurse <code>i+1<\/code>. Sort and skip duplicates at the same depth (<code>if (i&gt;start &amp;&amp; a[i]==a[i-1]) continue<\/code>). The index you pass <em>is<\/em> the rule; a <code>used[]<\/code> is the other writing of the same thing.<\/p>", "source": "answers.md", "search": "combination sum, with and without reuse. the sort-and-skip, and the index you pass to forbid reuse of earlier elements. reuse allowed: recurse i (same index) after pushing a[i]. reuse forbidden: recurse i+1. sort and skip duplicates at the same depth (if (i start && a[i]==a[i-1]) continue). the index you pass is the rule; a used[] is the other writing of the same thing."}, {"n": 153, "category": 11, "difficulty": "D", "html": "N-Queens. The three bit-sets or boolean arrays you keep (col, diag, anti-diag), and why a board scan on each place is the slow version.", "answerTitle": "N-Queens", "answer": "<p><code>col[n]<\/code>, <code>diag[2n]<\/code>, <code>anti[2n]<\/code> (or three bitsets). Place row by row. A board scan per place is O(n) extra per attempt and is the slow version you mention only to reject. n=9 is the usual limit; bitsets make n=14 solvable.<\/p>", "source": "answers.md", "search": "n-queens. the three bit-sets or boolean arrays you keep (col, diag, anti-diag), and why a board scan on each place is the slow version. col[n], diag[2n], anti[2n] (or three bitsets). place row by row. a board scan per place is o(n) extra per attempt and is the slow version you mention only to reject. n=9 is the usual limit; bitsets make n=14 solvable."}, {"n": 154, "category": 11, "difficulty": "T", "html": "Generating parentheses. The two counts you thread, and the pruning that makes it not &quot;all strings of length 2n&quot;.", "answerTitle": "Generate parentheses", "answer": "<p>Thread <code>(open, close)<\/code> used so far. Place <code>(<\/code> if <code>open &lt; n<\/code>; place <code>)<\/code> if <code>close &lt; open<\/code>. That prune <em>is<\/em> the algorithm: you never generate the illegal strings. 2n nested loops over <code>()()<\/code>… is the version that then needs a validator.<\/p>", "source": "answers.md", "search": "generating parentheses. the two counts you thread, and the pruning that makes it not \"all strings of length 2n\". thread (open, close) used so far. place ( if open < n; place ) if close < open. that prune is the algorithm: you never generate the illegal strings. 2n nested loops over ()()… is the version that then needs a validator."}, {"n": 155, "category": 11, "difficulty": "D", "html": "Word search I (one word on a board). DFS with a visited cell, and the early <code>false<\/code> that candidates forget to unmark.", "answerTitle": "Word search I", "answer": "<p>DFS from each starting cell, consume one character, mark, recurse four ways, unmark. The early <code>false<\/code> candidates forget to unmark is a leak into the next start. Bound: if the remaining word is longer than remaining cells, stop. This is not Q116.<\/p>", "source": "answers.md", "search": "word search i (one word on a board). dfs with a visited cell, and the early false that candidates forget to unmark. dfs from each starting cell, consume one character, mark, recurse four ways, unmark. the early false candidates forget to unmark is a leak into the next start. bound: if the remaining word is longer than remaining cells, stop. this is not q116."}, {"n": 156, "category": 11, "difficulty": "D", "html": "Sudoku solver. Why is this the canonical &quot;if it returns true, stop&quot; backtrack, and what do you try first to make it finish?", "answerTitle": "Sudoku solver", "answer": "<p>Find the emptiest cell (fewest candidates) first - that is the &quot;make it finish&quot; trick. For each candidate, place, recurse, undo; if a recursive call returns true, return true immediately. The <code>if (dfs()) return true<\/code> is the canonical &quot;search, do not enumerate all&quot;.<\/p>", "source": "answers.md", "search": "sudoku solver. why is this the canonical \"if it returns true, stop\" backtrack, and what do you try first to make it finish? find the emptiest cell (fewest candidates) first - that is the \"make it finish\" trick. for each candidate, place, recurse, undo; if a recursive call returns true, return true immediately. the if (dfs()) return true is the canonical \"search, do not enumerate all\"."}, {"n": 157, "category": 11, "difficulty": "D", "html": "Merge sort and quicksort as divide-and-conquer. Write the merge, and the quicksort partition you would defend in a review.", "answerTitle": "Merge sort and quicksort", "answer": "<p>Merge: two pointers into a buffer, O(n) extra, stable if you take left-on-tie. Quicksort: Hoare or Lomuto partition, no extra array, not stable, worst O(n²) on a sorted input if the pivot is <code>a[hi]<\/code> - randomize or take median-of-three. In a review you defend merge for stability and guaranteed bounds, quicksort for cache and in-place.<\/p>", "source": "answers.md", "search": "merge sort and quicksort as divide-and-conquer. write the merge, and the quicksort partition you would defend in a review. merge: two pointers into a buffer, o(n) extra, stable if you take left-on-tie. quicksort: hoare or lomuto partition, no extra array, not stable, worst o(n²) on a sorted input if the pivot is a[hi] - randomize or take median-of-three. in a review you defend merge for stability and guaranteed bounds, quicksort for cache and in-place."}, {"n": 158, "category": 11, "difficulty": "T", "html": "Recursion that is secretly O(n) stack on a linked list or a skewed tree. When do you rewrite to iterative, and what do you say if you do not have time?", "answerTitle": "Hidden O(n) stack", "answer": "<p>A linked-list recursion or a skewed BST is n frames. Rewrite to iterative (Q90, Q110) when n is 10⁴+ or the JVM stack is the default 1 MB. If you do not have time, say <em>&quot;this is O(n) stack; I would iterate before merge&quot;<\/em> and leave it. Silence is the red flag.<\/p>", "source": "answers.md", "search": "recursion that is secretly o(n) stack on a linked list or a skewed tree. when do you rewrite to iterative, and what do you say if you do not have time? a linked-list recursion or a skewed bst is n frames. rewrite to iterative (q90, q110) when n is 10⁴+ or the jvm stack is the default 1 mb. if you do not have time, say \"this is o(n) stack; i would iterate before merge\" and leave it. silence is the red flag."}, {"n": 159, "category": 11, "difficulty": "D", "html": "Letter combinations of a phone number. The mapping, and why this is backtracking rather than a nested loop you unroll.", "answerTitle": "Phone letter combinations", "answer": "<p>Mapping <code>2→abc<\/code> … <code>9→wxyz<\/code>. Backtracking because the depth is the digits and the branching is 3–4; a nest of loops does not extend to 12 digits. Same template as Q150. Empty input → empty list, not a list of <code>&quot;&quot;<\/code> - ask, LeetCode wants empty.<\/p>", "source": "answers.md", "search": "letter combinations of a phone number. the mapping, and why this is backtracking rather than a nested loop you unroll. mapping 2→abc … 9→wxyz. backtracking because the depth is the digits and the branching is 3–4; a nest of loops does not extend to 12 digits. same template as q150. empty input → empty list, not a list of \"\" - ask, leetcode wants empty."}, {"n": 160, "category": 11, "difficulty": "D", "html": "Restore IP addresses. Four integers, leading-zero rule, and the 255 cap. Write the prune.", "answerTitle": "Restore IP", "answer": "<p>At most four parts, each 0-255, no leading zero unless <code>&quot;0&quot;<\/code>. Prune when remaining chars cannot fill remaining parts (<code>left &gt; 3*parts<\/code> or <code>left &lt; parts<\/code>). Build with a <code>StringBuilder<\/code> or a list you join. <code>&quot;25525511135&quot;<\/code> has two answers; <code>&quot;0000&quot;<\/code> has one (<code>0.0.0.0<\/code>).<\/p>", "source": "answers.md", "search": "restore ip addresses. four integers, leading-zero rule, and the 255 cap. write the prune. at most four parts, each 0-255, no leading zero unless \"0\". prune when remaining chars cannot fill remaining parts (left 3 parts or left < parts). build with a stringbuilder or a list you join. \"25525511135\" has two answers; \"0000\" has one (0.0.0.0)."}, {"n": 161, "category": 11, "difficulty": "A", "html": "A regex-like matcher you must extend later with backreferences. What do you implement now (NFA? backtrack? DP?), and what do you refuse?", "answerTitle": "Matcher that must grow backreferences", "answer": "<p>Now: DP or NFA for the Q72 subset (<code>a<\/code>, <code>.<\/code>, <code>*<\/code>). Refuse backreferences in the same 45 minutes - they make the language non-regular; you need a backtracking engine with a capture map, and that is a library (Java <code>Pattern<\/code>) not an interview function. Say the extension point: an AST node for <code>Group<\/code> you do not implement today.<\/p>", "source": "answers.md", "search": "a regex-like matcher you must extend later with backreferences. what do you implement now (nfa? backtrack? dp?), and what do you refuse? now: dp or nfa for the q72 subset (a, ., ). refuse backreferences in the same 45 minutes - they make the language non-regular; you need a backtracking engine with a capture map, and that is a library (java pattern) not an interview function. say the extension point: an ast node for group you do not implement today."}, {"n": 162, "category": 11, "difficulty": "A", "html": "Recursion over a user-supplied depth (an org chart, a bill of materials). How do you bound the stack, and what is the iterative alternative?", "answerTitle": "User-supplied depth", "answer": "<p>Bound the recursion (a <code>depth &gt; MAX<\/code> throw), or rewrite to an explicit <code>ArrayDeque<\/code> so the heap holds the stack and you can cap memory. Org charts and BOMs are data, not trusted to be balanced. The iterative alternative is a stack of <code>(node, state)<\/code> so you can resume after a child. <code>StackOverflowError<\/code> is not an acceptable product behaviour.<\/p>", "source": "answers.md", "search": "recursion over a user-supplied depth (an org chart, a bill of materials). how do you bound the stack, and what is the iterative alternative? bound the recursion (a depth max throw), or rewrite to an explicit arraydeque so the heap holds the stack and you can cap memory. org charts and boms are data, not trusted to be balanced. the iterative alternative is a stack of (node, state) so you can resume after a child. stackoverflowerror is not an acceptable product behaviour."}, {"n": 163, "category": 12, "difficulty": "C", "html": "The three questions you ask before writing DP: what is the state, what is the recurrence, what is the base? Apply them to climbing stairs.", "answerTitle": "Three questions, climbing stairs", "answer": "<p>State: <code>ways(i)<\/code> = ways to reach step i. Recurrence: <code>ways(i) = ways(i-1) + ways(i-2)<\/code>. Base: <code>ways(0)=1<\/code>, <code>ways(1)=1<\/code>. Then it is Fibonacci, O(n) time, O(1) space with two variables. If you cannot say the three sentences you do not start a table.<\/p>", "source": "answers.md", "search": "the three questions you ask before writing dp: what is the state, what is the recurrence, what is the base? apply them to climbing stairs. state: ways(i) = ways to reach step i. recurrence: ways(i) = ways(i-1) + ways(i-2). base: ways(0)=1, ways(1)=1. then it is fibonacci, o(n) time, o(1) space with two variables. if you cannot say the three sentences you do not start a table."}, {"n": 164, "category": 12, "difficulty": "C", "html": "0/1 knapsack versus unbounded knapsack. The loop-order difference, and why reversing the inner loop matters on a 1D array.", "answerTitle": "0/1 versus unbounded knapsack", "answer": "<p>0/1: each item once - inner loop on capacity <strong>downward<\/strong> so you do not reuse <code>dp[c-w]<\/code> from this item. Unbounded: inner loop <strong>upward<\/strong> so you do reuse. That loop-order sentence is the whole distinction on a 1D array. 2D is obvious (<code>item × capacity<\/code>) and safer to write if you have the space.<\/p>", "source": "answers.md", "search": "0/1 knapsack versus unbounded knapsack. the loop-order difference, and why reversing the inner loop matters on a 1d array. 0/1: each item once - inner loop on capacity downward so you do not reuse dp[c-w] from this item. unbounded: inner loop upward so you do reuse. that loop-order sentence is the whole distinction on a 1d array. 2d is obvious (item × capacity) and safer to write if you have the space."}, {"n": 165, "category": 12, "difficulty": "D", "html": "Longest increasing subsequence. O(n²) DP you write first, then the patience-sorting O(n log n) you mention.", "answerTitle": "Longest increasing subsequence", "answer": "<p>O(n²): <code>dp[i] = 1 + max(dp[j] for j &lt; i if a[j] &lt; a[i])<\/code>. Write that first. Patience sorting: <code>tails[len]<\/code> is the smallest tail of any LIS of that length, binary-search each a[i], O(n log n). Mention the second; reconstruct the sequence from a <code>prev[]<\/code> if they ask.<\/p>", "source": "answers.md", "search": "longest increasing subsequence. o(n²) dp you write first, then the patience-sorting o(n log n) you mention. o(n²): dp[i] = 1 + max(dp[j] for j < i if a[j] < a[i]). write that first. patience sorting: tails[len] is the smallest tail of any lis of that length, binary-search each a[i], o(n log n). mention the second; reconstruct the sequence from a prev[] if they ask."}, {"n": 166, "category": 12, "difficulty": "D", "html": "Longest common subsequence and edit distance. Write the 2D table and the rolling-row space optimization.", "answerTitle": "LCS and edit distance", "answer": "<p><code>dp[i][j]<\/code> on prefixes. LCS: equal → <code>1 + dp[i-1][j-1]<\/code>, else max of skip. Edit: equal → copy diagonal; else <code>1 + min(insert, delete, replace)<\/code>. Rolling two rows (or one) drops space to O(min(n,m)). You cannot then reconstruct the alignment without more storage - say so.<\/p>", "source": "answers.md", "search": "longest common subsequence and edit distance. write the 2d table and the rolling-row space optimization. dp[i][j] on prefixes. lcs: equal → 1 + dp[i-1][j-1], else max of skip. edit: equal → copy diagonal; else 1 + min(insert, delete, replace). rolling two rows (or one) drops space to o(min(n,m)). you cannot then reconstruct the alignment without more storage - say so."}, {"n": 167, "category": 12, "difficulty": "D", "html": "House robber, house robber II (circle), and the tree version. What changes in the state?", "answerTitle": "House robber family", "answer": "<p>Linear: <code>dp[i] = max(dp[i-1], dp[i-2] + a[i])<\/code>. Circle: max of &quot;drop first&quot; and &quot;drop last&quot;. Tree: return <code>(rob_this, skip_this)<\/code> from each node; <code>rob_this = node + skip(left) + skip(right)<\/code>, <code>skip_this = max(left) + max(right)<\/code>. The state is &quot;did I take the current node&quot;.<\/p>", "source": "answers.md", "search": "house robber, house robber ii (circle), and the tree version. what changes in the state? linear: dp[i] = max(dp[i-1], dp[i-2] + a[i]). circle: max of \"drop first\" and \"drop last\". tree: return (rob_this, skip_this) from each node; rob_this = node + skip(left) + skip(right), skip_this = max(left) + max(right). the state is \"did i take the current node\"."}, {"n": 168, "category": 12, "difficulty": "T", "html": "Coin change (fewest coins) versus coin change II (number of combinations). The loop order that accidentally counts permutations.", "answerTitle": "Coin change versus coin change II", "answer": "<p>Fewest coins: <code>dp[v] = min(dp[v], dp[v-c] + 1)<\/code>, any loop order of coins works for <em>min<\/em>. Number of <em>combinations<\/em>: outer loop coins, inner value upward - that way <code>{1,2}<\/code> is one combination. Outer value, inner coins counts permutations. This is the trap. Amount 0 is 1 combination and 0 coins.<\/p>", "source": "answers.md", "search": "coin change (fewest coins) versus coin change ii (number of combinations). the loop order that accidentally counts permutations. fewest coins: dp[v] = min(dp[v], dp[v-c] + 1), any loop order of coins works for min . number of combinations : outer loop coins, inner value upward - that way {1,2} is one combination. outer value, inner coins counts permutations. this is the trap. amount 0 is 1 combination and 0 coins."}, {"n": 169, "category": 12, "difficulty": "D", "html": "Unique paths with obstacles. Why is this DP and not BFS, and when would BFS be the right reading of the same grid?", "answerTitle": "Unique paths with obstacles", "answer": "<p><code>dp[i][j] +=<\/code> from above and left, zeroed on obstacles, <code>dp[0][0] = 1<\/code> if start is free. BFS would also count paths if you <em>sum<\/em> incoming, but BFS-as-shortest-path is the wrong reading: every path has the same length. Use BFS when the question is reachability or shortest <em>cost<\/em> on a graph; use this DP when the question is &quot;how many&quot;.<\/p>", "source": "answers.md", "search": "unique paths with obstacles. why is this dp and not bfs, and when would bfs be the right reading of the same grid? dp[i][j] += from above and left, zeroed on obstacles, dp[0][0] = 1 if start is free. bfs would also count paths if you sum incoming, but bfs-as-shortest-path is the wrong reading: every path has the same length. use bfs when the question is reachability or shortest cost on a graph; use this dp when the question is \"how many\"."}, {"n": 170, "category": 12, "difficulty": "D", "html": "Palindrome partition / longest palindromic subsequence. Which table do you fill first, and in which direction?", "answerTitle": "Palindrome DP", "answer": "<p>First fill <code>isPal[i][j]<\/code> by increasing length (<code>j-i<\/code>). Longest palindromic subsequence is LCS(s, reverse(s)), or <code>dp[i][j] = 2+dp[i+1][j-1]<\/code> when ends match. Palindrome partition uses <code>isPal<\/code> plus a 1D cut DP. Direction: length-up, or i downward, so <code>i+1,j-1<\/code> is already known.<\/p>", "source": "answers.md", "search": "palindrome partition / longest palindromic subsequence. which table do you fill first, and in which direction? first fill ispal[i][j] by increasing length (j-i). longest palindromic subsequence is lcs(s, reverse(s)), or dp[i][j] = 2+dp[i+1][j-1] when ends match. palindrome partition uses ispal plus a 1d cut dp. direction: length-up, or i downward, so i+1,j-1 is already known."}, {"n": 171, "category": 12, "difficulty": "D", "html": "Greedy: interval scheduling (max number of non-overlapping), Huffman, and Dijkstra. What is the matroid-shaped argument you actually say?", "answerTitle": "Greedy you can defend", "answer": "<p>Interval scheduling: sort by <em>end<\/em>, take if it starts after the last take - exchange argument (Q176). Huffman: two lightest, repeat, optimal prefix codes. Dijkstra: settle the closest unsettled, needs non-negative weights (Q142). The sentence is <em>&quot;any better solution could swap this choice without getting worse&quot;<\/em>, not &quot;it looks greedy&quot;.<\/p>", "source": "answers.md", "search": "greedy: interval scheduling (max number of non-overlapping), huffman, and dijkstra. what is the matroid-shaped argument you actually say? interval scheduling: sort by end , take if it starts after the last take - exchange argument (q176). huffman: two lightest, repeat, optimal prefix codes. dijkstra: settle the closest unsettled, needs non-negative weights (q142). the sentence is \"any better solution could swap this choice without getting worse\" , not \"it looks greedy\"."}, {"n": 172, "category": 12, "difficulty": "T", "html": "Jump game (reach the end) versus jump game II (min jumps). Why is the first a greedy scan and the second a BFS-on-the-array?", "answerTitle": "Jump game versus jump game II", "answer": "<p>I: scan, maintain <code>reach = max(reach, i+a[i])<\/code>, fail if <code>i &gt; reach<\/code>. Greedy, O(n). II: min jumps is BFS on the array - the current jump&#x27;s window, the farthest you can see, increment jumps when the window ends. A second greedy (farthest each jump) is that BFS in other clothes. Do not DP II in O(n²) unless n is tiny.<\/p>", "source": "answers.md", "search": "jump game (reach the end) versus jump game ii (min jumps). why is the first a greedy scan and the second a bfs-on-the-array? i: scan, maintain reach = max(reach, i+a[i]), fail if i reach. greedy, o(n). ii: min jumps is bfs on the array - the current jump's window, the farthest you can see, increment jumps when the window ends. a second greedy (farthest each jump) is that bfs in other clothes. do not dp ii in o(n²) unless n is tiny."}, {"n": 173, "category": 12, "difficulty": "D", "html": "Kadane again, now as DP: <code>dp[i] = max(a[i], dp[i-1] + a[i])<\/code>. When do you keep the array, and when do you keep one variable?", "answerTitle": "Kadane as DP", "answer": "<p><code>dp[i] = max(a[i], dp[i-1] + a[i])<\/code> is &quot;best subarray <em>ending at i<\/em>&quot;. Keep one variable unless they want the subarray bounds, in which case you also store start indices. The array is for the lecture; the variable is for the paste.<\/p>", "source": "answers.md", "search": "kadane again, now as dp: dp[i] = max(a[i], dp[i-1] + a[i]). when do you keep the array, and when do you keep one variable? dp[i] = max(a[i], dp[i-1] + a[i]) is \"best subarray ending at i \". keep one variable unless they want the subarray bounds, in which case you also store start indices. the array is for the lecture; the variable is for the paste."}, {"n": 174, "category": 12, "difficulty": "D", "html": "Decode ways (<code>11106<\/code>). The silent base cases, and the zero that zeros the whole suffix.", "answerTitle": "Decode ways", "answer": "<p><code>dp[i]<\/code> = ways to decode the suffix (or prefix) starting at i. A <code>&#x27;0&#x27;<\/code> cannot start a code; <code>10<\/code> and <code>20<\/code> are legal, <code>30<\/code> is not. <code>11106<\/code> dies at <code>06<\/code>. Base: <code>dp[n] = 1<\/code>. Walk from the back so the 1- and 2-digit decisions are already computed. Empty string is 0 or 1 - LeetCode 0; say it.<\/p>", "source": "answers.md", "search": "decode ways (11106). the silent base cases, and the zero that zeros the whole suffix. dp[i] = ways to decode the suffix (or prefix) starting at i. a '0' cannot start a code; 10 and 20 are legal, 30 is not. 11106 dies at 06. base: dp[n] = 1. walk from the back so the 1- and 2-digit decisions are already computed. empty string is 0 or 1 - leetcode 0; say it."}, {"n": 175, "category": 12, "difficulty": "A", "html": "A DP whose naive state is too big (subset of 40 items, or a 10⁴ × 10⁴ grid). What do you drop, meet-in-the-middle, or discretize?", "answerTitle": "State too big", "answer": "<p>40 items subset: meet-in-the-middle, 2²⁰ per half. 10⁴×10⁴ grid: drop a dimension (rolling row), or this is not DP (greedy / formula / sampling). Discretize values if only order matters (coordinate compression). The first move is &quot;what can I forget&quot;, not a bigger machine.<\/p>", "source": "answers.md", "search": "a dp whose naive state is too big (subset of 40 items, or a 10⁴ × 10⁴ grid). what do you drop, meet-in-the-middle, or discretize? 40 items subset: meet-in-the-middle, 2²⁰ per half. 10⁴×10⁴ grid: drop a dimension (rolling row), or this is not dp (greedy / formula / sampling). discretize values if only order matters (coordinate compression). the first move is \"what can i forget\", not a bigger machine."}, {"n": 176, "category": 12, "difficulty": "A", "html": "The interviewer wants a greedy proof. How do you structure &quot;exchange argument&quot; in two minutes so it is a proof and not a vibe?", "answerTitle": "Exchange argument in two minutes", "answer": "<p>State the greedy choice. Take an optimal solution that does <em>not<\/em> contain it. Show you can swap the greedy item in and the objective does not get worse, so there exists an optimal that <em>does<\/em> contain it. Repeat. If you cannot name the swap, you do not have a proof - you have a hope, and you say so.<\/p>", "source": "answers.md", "search": "the interviewer wants a greedy proof. how do you structure \"exchange argument\" in two minutes so it is a proof and not a vibe? state the greedy choice. take an optimal solution that does not contain it. show you can swap the greedy item in and the objective does not get worse, so there exists an optimal that does contain it. repeat. if you cannot name the swap, you do not have a proof - you have a hope, and you say so."}, {"n": 177, "category": 13, "difficulty": "C", "html": "Merge overlapping intervals. Sort by start, and the one comparison that decides merge versus append.", "answerTitle": "Merge overlapping intervals", "answer": "<p>Sort by start. Walk: if <code>cur.start &lt;= last.end<\/code>, <code>last.end = max(last.end, cur.end)<\/code>; else append a new interval. Inclusive endpoints: <code>&lt;=<\/code> is the merge (Q181). O(n log n) sort, O(n) extra for the output. Empty input is an empty list, not <code>null<\/code>.<\/p>", "source": "answers.md", "search": "merge overlapping intervals. sort by start, and the one comparison that decides merge versus append. sort by start. walk: if cur.start <= last.end, last.end = max(last.end, cur.end); else append a new interval. inclusive endpoints: <= is the merge (q181). o(n log n) sort, o(n) extra for the output. empty input is an empty list, not null."}, {"n": 178, "category": 13, "difficulty": "C", "html": "Insert an interval into a sorted list. The three-pass (before, overlapping, after) that avoids a full sort.", "answerTitle": "Insert an interval", "answer": "<p>One pass, no re-sort if the list is already sorted: emit everything that ends before the new start; merge everything that overlaps the new interval; emit the rest. Three regions, three loops or one loop with a state. O(n). If the list is <em>not<\/em> sorted, you are in Q177.<\/p>", "source": "answers.md", "search": "insert an interval into a sorted list. the three-pass (before, overlapping, after) that avoids a full sort. one pass, no re-sort if the list is already sorted: emit everything that ends before the new start; merge everything that overlaps the new interval; emit the rest. three regions, three loops or one loop with a state. o(n). if the list is not sorted, you are in q177."}, {"n": 179, "category": 13, "difficulty": "D", "html": "Meeting rooms II: minimum number of rooms. Heap of end times versus a sweep of +1/−1 events.", "answerTitle": "Meeting rooms II", "answer": "<p>Sweep: for each interval push <code>(start, +1)<\/code> and <code>(end, -1)<\/code>, sort by time, <strong>end before start<\/strong> on a tie so a meeting that ends at t frees the room for one that starts at t. The running sum&#x27;s max is the room count. Heap version: sort by start, min-heap of end times, pop if <code>heap.peek() &lt;= start<\/code>, then push; heap size is rooms. Same answer.<\/p>", "source": "answers.md", "search": "meeting rooms ii: minimum number of rooms. heap of end times versus a sweep of +1/−1 events. sweep: for each interval push (start, +1) and (end, -1), sort by time, end before start on a tie so a meeting that ends at t frees the room for one that starts at t. the running sum's max is the room count. heap version: sort by start, min-heap of end times, pop if heap.peek() <= start, then push; heap size is rooms. same answer."}, {"n": 180, "category": 13, "difficulty": "D", "html": "Can attend all meetings. Sort by start or by end? Which comparison, and why is this not meeting-rooms II?", "answerTitle": "Can attend all", "answer": "<p>Sort by start (or by end). Adjacent pair: <code>a[i-1].end &gt; a[i].start<\/code> is a clash. This is <em>not<\/em> rooms II - you only need a boolean. Sort-by-end is the greedy for &quot;max number you can attend&quot; (Q182), a different question. Ask which one they meant.<\/p>", "source": "answers.md", "search": "can attend all meetings. sort by start or by end? which comparison, and why is this not meeting-rooms ii? sort by start (or by end). adjacent pair: a[i-1].end a[i].start is a clash. this is not rooms ii - you only need a boolean. sort-by-end is the greedy for \"max number you can attend\" (q182), a different question. ask which one they meant."}, {"n": 181, "category": 13, "difficulty": "T", "html": "Overlapping inclusive versus exclusive endpoints. <code>[1,2]<\/code> and <code>[2,3]<\/code>: do they overlap? What do you ask before you write?", "answerTitle": "Inclusive versus exclusive", "answer": "<p>Ask. Calendar systems usually treat <code>[1,2)<\/code> and <code>[2,3)<\/code> as non-overlapping (Q179 tie-break). Closed intervals <code>[1,2]<\/code> and <code>[2,3]<\/code> overlap at 2. Writing <code>&lt;=<\/code> versus <code>&lt;<\/code> is the whole bug. Put the question in the first thirty seconds.<\/p>", "source": "answers.md", "search": "overlapping inclusive versus exclusive endpoints. [1,2] and [2,3]: do they overlap? what do you ask before you write? ask. calendar systems usually treat [1,2) and [2,3) as non-overlapping (q179 tie-break). closed intervals [1,2] and [2,3] overlap at 2. writing <= versus < is the whole bug. put the question in the first thirty seconds."}, {"n": 182, "category": 13, "difficulty": "D", "html": "Non-overlapping intervals you must remove to make the rest non-overlapping. Why sort by end, not by start?", "answerTitle": "Erase minimum to make non-overlapping", "answer": "<p>Sort by <em>end<\/em>. Take a interval if it starts at or after the last taken end; otherwise erase it. Sorting by start fails: a long early interval blocks many short later ones and you would keep the wrong one. This is Q171&#x27;s interval scheduling, inverted (&quot;erasures = n - taken&quot;).<\/p>", "source": "answers.md", "search": "non-overlapping intervals you must remove to make the rest non-overlapping. why sort by end, not by start? sort by end . take a interval if it starts at or after the last taken end; otherwise erase it. sorting by start fails: a long early interval blocks many short later ones and you would keep the wrong one. this is q171's interval scheduling, inverted (\"erasures = n - taken\")."}, {"n": 183, "category": 13, "difficulty": "D", "html": "Sweep line: skyline, car pooling, meeting-rooms. What is an &quot;event&quot;, how do you break ties, and what does the active set hold?", "answerTitle": "Sweep line as a pattern", "answer": "<p>An event is <code>(time, delta, tieBreak)<\/code>. Sort. Active set is a counter (rooms, car pooling) or a tree of buildings (skyline). Tie-break: process removals before additions at the same x when that matches the closed/open rule (Q181); skyline is its own (higher first on start, lower first on end). If you cannot name the event, it is not yet a sweep.<\/p>", "source": "answers.md", "search": "sweep line: skyline, car pooling, meeting-rooms. what is an \"event\", how do you break ties, and what does the active set hold? an event is (time, delta, tiebreak). sort. active set is a counter (rooms, car pooling) or a tree of buildings (skyline). tie-break: process removals before additions at the same x when that matches the closed/open rule (q181); skyline is its own (higher first on start, lower first on end). if you cannot name the event, it is not yet a sweep."}, {"n": 184, "category": 13, "difficulty": "D", "html": "Interval intersection of two sorted lists. Two pointers, and the <code>max(start) / min(end)<\/code> test.", "answerTitle": "Intersection of two sorted interval lists", "answer": "<p>Two pointers. <code>lo = max(a.start, b.start)<\/code>, <code>hi = min(a.end, b.end)<\/code>; if <code>lo &lt; hi<\/code> (or <code>&lt;=<\/code>, Q181) emit. Advance the interval that ends first. O(n+m). Do not build a sweep of 2(n+m) events unless the lists are unsorted.<\/p>", "source": "answers.md", "search": "interval intersection of two sorted lists. two pointers, and the max(start) / min(end) test. two pointers. lo = max(a.start, b.start), hi = min(a.end, b.end); if lo < hi (or <=, q181) emit. advance the interval that ends first. o(n+m). do not build a sweep of 2(n+m) events unless the lists are unsorted."}, {"n": 185, "category": 13, "difficulty": "D", "html": "My calendar I/II/III. <code>TreeMap<\/code> as a sweep, and the booking-III running sum.", "answerTitle": "My calendar I / II / III", "answer": "<p><code>TreeMap&lt;Integer, Integer&gt;<\/code> of delta at each time (the sweep stored as a map). I: reject if any existing interval overlaps - <code>floorKey<\/code> / <code>ceilingKey<\/code>. II: same map, running sum must not exceed 2 after a trial add; roll back if it does. III: the max running sum is k. <code>TreeMap<\/code> is the structure; a list plus linear scan is the n-small version.<\/p>", "source": "answers.md", "search": "my calendar i/ii/iii. treemap as a sweep, and the booking-iii running sum. treemap<integer, integer of delta at each time (the sweep stored as a map). i: reject if any existing interval overlaps - floorkey / ceilingkey. ii: same map, running sum must not exceed 2 after a trial add; roll back if it does. iii: the max running sum is k. treemap is the structure; a list plus linear scan is the n-small version."}, {"n": 186, "category": 13, "difficulty": "T", "html": "Sorting intervals with <code>a[0] - b[0]<\/code>. The overflow, and the <code>Integer.compare<\/code> fix (same family as Q55).", "answerTitle": "`a[0] - b[0]` on intervals", "answer": "<p>Same overflow as Q55. <code>Integer.MIN_VALUE<\/code> starts exist in toy data less often than in production timestamps-as-ints, but TimSort will still throw if the comparator lies. <code>Arrays.sort(a, Comparator.comparingInt(x -&gt; x[0]))<\/code>.<\/p>", "source": "answers.md", "search": "sorting intervals with a[0] - b[0]. the overflow, and the integer.compare fix (same family as q55). same overflow as q55. integer.min_value starts exist in toy data less often than in production timestamps-as-ints, but timsort will still throw if the comparator lies. arrays.sort(a, comparator.comparingint(x - x[0]))."}, {"n": 187, "category": 13, "difficulty": "A", "html": "A calendar of 10⁷ bookings, queries of &quot;is this range free&quot; and &quot;book if free&quot;. What index, and what do you give up on delete?", "answerTitle": "10⁷ bookings, range-free query", "answer": "<p>A segment tree or fenwick on compressed coordinates, or an interval tree / implicit treap of free ranges. You give up cheap arbitrary deletes if you only store a bitmap of booked slots; you give up O(1) book if you store a balanced tree of free intervals (then book is split, O(log n)). 10⁷ means O(n) per query is dead. This is not <code>TreeMap<\/code> of 10⁷ keys on a 256 MB heap without thinking about constants.<\/p>", "source": "answers.md", "search": "a calendar of 10⁷ bookings, queries of \"is this range free\" and \"book if free\". what index, and what do you give up on delete? a segment tree or fenwick on compressed coordinates, or an interval tree / implicit treap of free ranges. you give up cheap arbitrary deletes if you only store a bitmap of booked slots; you give up o(1) book if you store a balanced tree of free intervals (then book is split, o(log n)). 10⁷ means o(n) per query is dead. this is not treemap of 10⁷ keys on a 256 mb heap without thinking about constants."}, {"n": 188, "category": 13, "difficulty": "A", "html": "Staff a 24/7 rota from interval-availability. This is not meeting-rooms. What extra constraints do you elicit, and which algorithm remains?", "answerTitle": "Staffing a rota", "answer": "<p>Elicit: coverage required per slot, max shift length, rest rules, skills, fairness across people. The remaining algorithm is usually a sweep of demand plus a greedy or min-cost flow, not meeting-rooms. If they wanted meeting-rooms they would have given you intervals and a boolean. Say what you are <em>not<\/em> solving.<\/p>", "source": "answers.md", "search": "staff a 24/7 rota from interval-availability. this is not meeting-rooms. what extra constraints do you elicit, and which algorithm remains? elicit: coverage required per slot, max shift length, rest rules, skills, fairness across people. the remaining algorithm is usually a sweep of demand plus a greedy or min-cost flow, not meeting-rooms. if they wanted meeting-rooms they would have given you intervals and a boolean. say what you are not solving."}, {"n": 189, "category": 14, "difficulty": "C", "html": "Two&#x27;s complement: why <code>-n<\/code> is <code>~n + 1<\/code>, and what <code>Integer.MIN_VALUE<\/code> does under unary minus.", "answerTitle": "Two's complement", "answer": "<p><code>-n<\/code> is <code>~n + 1<\/code>. <code>Integer.MIN_VALUE<\/code> has no positive counterpart in 32 bits: <code>-MIN_VALUE == MIN_VALUE<\/code>, and <code>Math.abs(MIN_VALUE)<\/code> returns the same negative (Q200). That is why a <code>negate<\/code> in a money path is <code>negateExact<\/code> or a <code>long<\/code>.<\/p>", "source": "answers.md", "search": "two's complement: why -n is ~n + 1, and what integer.min_value does under unary minus. -n is ~n + 1. integer.min_value has no positive counterpart in 32 bits: -min_value == min_value, and math.abs(min_value) returns the same negative (q200). that is why a negate in a money path is negateexact or a long."}, {"n": 190, "category": 14, "difficulty": "C", "html": "Get, set, clear, toggle the k-th bit. Write the four one-liners, and say whether k is 0-based from the right.", "answerTitle": "Four bit one-liners", "answer": "<p><code>get = (n &gt;&gt;&gt; k) &amp; 1<\/code>, <code>set = n | (1 &lt;&lt; k)<\/code>, <code>clear = n &amp; ~(1 &lt;&lt; k)<\/code>, <code>toggle = n ^ (1 &lt;&lt; k)<\/code>. k is 0-based from the right. <code>1 &lt;&lt; k<\/code> for k=31 is <code>MIN_VALUE<\/code>; use <code>1L &lt;&lt; k<\/code> if you then store in a <code>long<\/code>. <code>&gt;&gt;&gt;<\/code> on get so a sign bit does not smear.<\/p>", "source": "answers.md", "search": "get, set, clear, toggle the k-th bit. write the four one-liners, and say whether k is 0-based from the right. get = (n k) & 1, set = n (1 << k), clear = n & ~(1 << k), toggle = n ^ (1 << k). k is 0-based from the right. 1 << k for k=31 is min_value; use 1l << k if you then store in a long. on get so a sign bit does not smear."}, {"n": 191, "category": 14, "difficulty": "D", "html": "Single number (every element twice, one once). XOR fold, and the two-single-numbers follow-up that needs a discriminating bit.", "answerTitle": "Single number, XOR", "answer": "<p>XOR is associative, commutative, and <code>x^x==0<\/code>, so a fold of &quot;everything twice, one once&quot; is the one. Two singles: XOR all, take a set bit of the result (they differ there), partition the array by that bit, XOR each part. Do not sort.<\/p>", "source": "answers.md", "search": "single number (every element twice, one once). xor fold, and the two-single-numbers follow-up that needs a discriminating bit. xor is associative, commutative, and x^x==0, so a fold of \"everything twice, one once\" is the one. two singles: xor all, take a set bit of the result (they differ there), partition the array by that bit, xor each part. do not sort."}, {"n": 192, "category": 14, "difficulty": "D", "html": "Number of 1 bits, and <code>n &amp; (n - 1)<\/code> to drop the lowest set bit. Brian Kernighan versus <code>Integer.bitCount<\/code>.", "answerTitle": "Popcount", "answer": "<p><code>Integer.bitCount(n)<\/code> is the production call. Brian Kernighan: <code>for (; n != 0; n &amp;= n - 1) c++;<\/code> is O(popcount). You write the loop if they banned the intrinsic. <code>n &amp; (n-1)<\/code> drops the lowest set bit - that identity is also Q193.<\/p>", "source": "answers.md", "search": "number of 1 bits, and n & (n - 1) to drop the lowest set bit. brian kernighan versus integer.bitcount. integer.bitcount(n) is the production call. brian kernighan: for (; n != 0; n &= n - 1) c++; is o(popcount). you write the loop if they banned the intrinsic. n & (n-1) drops the lowest set bit - that identity is also q193."}, {"n": 193, "category": 14, "difficulty": "T", "html": "<code>n &amp; (n - 1) == 0<\/code> as a power-of-two test. Why must you also reject <code>n &lt;= 0<\/code>, and what does it do to <code>Integer.MIN_VALUE<\/code>?", "answerTitle": "Power of two", "answer": "<p><code>n &gt; 0 &amp;&amp; (n &amp; (n - 1)) == 0<\/code>. <code>n &lt;= 0<\/code> must be rejected: <code>0 &amp; -1 == 0<\/code>, and <code>MIN_VALUE<\/code> is <code>1 &lt;&lt; 31<\/code> so <code>MIN_VALUE &amp; (MIN_VALUE - 1) == 0<\/code> as well. Both would otherwise look like powers of two.<\/p>", "source": "answers.md", "search": "n & (n - 1) == 0 as a power-of-two test. why must you also reject n <= 0, and what does it do to integer.min_value? n 0 && (n & (n - 1)) == 0. n <= 0 must be rejected: 0 & -1 == 0, and min_value is 1 << 31 so min_value & (min_value - 1) == 0 as well. both would otherwise look like powers of two."}, {"n": 194, "category": 14, "difficulty": "D", "html": "Reverse bits of a 32-bit int. The loop, and the &quot;swap halves, then quarters&quot; parallel method you mention.", "answerTitle": "Reverse bits", "answer": "<p>Loop 32 times: <code>out = (out &lt;&lt; 1) | (n &amp; 1); n &gt;&gt;&gt;= 1<\/code>. Parallel: swap 16-bit halves, then 8, 4, 2, 1 with masks - mention, do not debug it under a clock. <code>Integer.reverse<\/code> exists; say so after you write the loop.<\/p>", "source": "answers.md", "search": "reverse bits of a 32-bit int. the loop, and the \"swap halves, then quarters\" parallel method you mention. loop 32 times: out = (out << 1) (n & 1); n = 1. parallel: swap 16-bit halves, then 8, 4, 2, 1 with masks - mention, do not debug it under a clock. integer.reverse exists; say so after you write the loop."}, {"n": 195, "category": 14, "difficulty": "D", "html": "Sum of two integers without <code>+<\/code>. XOR and carry, and why a <code>while<\/code> is needed.", "answerTitle": "Add without `+`", "answer": "<pre><code class=\"lang-java\">int add(int a, int b) {\n    while (b != 0) {\n        int carry = (a &amp; b) &lt;&lt; 1;\n        a = a ^ b;\n        b = carry;\n    }\n    return a;\n}<\/code><\/pre><p>XOR is the sum without carry; <code>a &amp; b<\/code> shifted is the carry. A single XOR is not enough when carry generates carry. Overflow wraps, same as Java <code>+<\/code>.<\/p>", "source": "answers.md", "search": "sum of two integers without +. xor and carry, and why a while is needed. java int add(int a, int b) { while (b != 0) { int carry = (a & b) << 1; a = a ^ b; b = carry; } return a; } xor is the sum without carry; a & b shifted is the carry. a single xor is not enough when carry generates carry. overflow wraps, same as java +."}, {"n": 196, "category": 14, "difficulty": "T", "html": "Money in <code>double<\/code>. Show the exact failure, <code>new BigDecimal(0.1)<\/code> as the second failure, and the constructor you actually use.", "answerTitle": "Money in `double`", "answer": "<p><code>0.1 + 0.2 != 0.3<\/code>. <code>new BigDecimal(0.1)<\/code> <em>reproduces the double<\/em>, it does not fix it. Use <code>new BigDecimal(&quot;0.1&quot;)<\/code> or <code>BigDecimal.valueOf<\/code> on a long of minor units. This is S4 / Q201. <code>double<\/code> is legal for a <em>scientific<\/em> value you will never compare for equality.<\/p>", "source": "answers.md", "search": "money in double. show the exact failure, new bigdecimal(0.1) as the second failure, and the constructor you actually use. 0.1 + 0.2 != 0.3. new bigdecimal(0.1) reproduces the double , it does not fix it. use new bigdecimal(\"0.1\") or bigdecimal.valueof on a long of minor units. this is s4 / q201. double is legal for a scientific value you will never compare for equality."}, {"n": 197, "category": 14, "difficulty": "D", "html": "Integer division that must truncate toward zero, and the <code>Integer.MIN_VALUE / -1<\/code> overflow that Java... does what with?", "answerTitle": "Integer division and `MIN / -1`", "answer": "<p>Java <code>/<\/code> on ints truncates toward zero. <code>Integer.MIN_VALUE / -1<\/code> overflows 32-bit two&#x27;s complement; Java <em>returns<\/em> <code>MIN_VALUE<\/code> and does not throw. <code>Math.negateExact(Integer.MIN_VALUE)<\/code> throws. Know which one you are on in a money or index path.<\/p>", "source": "answers.md", "search": "integer division that must truncate toward zero, and the integer.min_value / -1 overflow that java... does what with? java / on ints truncates toward zero. integer.min_value / -1 overflows 32-bit two's complement; java returns min_value and does not throw. math.negateexact(integer.min_value) throws. know which one you are on in a money or index path."}, {"n": 198, "category": 14, "difficulty": "D", "html": "Fast exponentiation (<code>modPow<\/code>). Write the binary-exponent loop, and the overflow-safe modular multiply you need on large moduli.", "answerTitle": "Fast exponentiation", "answer": "<pre><code class=\"lang-java\">long modPow(long a, long e, long m) {\n    long r = 1 % m;\n    for (a %= m; e &gt; 0; e &gt;&gt;= 1, a = a * a % m)\n        if ((e &amp; 1) != 0) r = r * a % m;\n    return r;\n}<\/code><\/pre><p>If <code>m<\/code> is near 2⁶³, <code>a * a<\/code> overflows <code>long<\/code> - use <code>Math.multiplyExact<\/code> into a <code>BigInteger<\/code>, or a modular multiply. <code>e &lt; 0<\/code> is a spec question (modular inverse, only if gcd(a,m)=1).<\/p>", "source": "answers.md", "search": "fast exponentiation (modpow). write the binary-exponent loop, and the overflow-safe modular multiply you need on large moduli. java long modpow(long a, long e, long m) { long r = 1 % m; for (a %= m; e 0; e = 1, a = a a % m) if ((e & 1) != 0) r = r a % m; return r; } if m is near 2⁶³, a a overflows long - use math.multiplyexact into a biginteger, or a modular multiply. e < 0 is a spec question (modular inverse, only if gcd(a,m)=1)."}, {"n": 199, "category": 14, "difficulty": "D", "html": "UTF-8 validation as a bit problem. Leading-ones count, and the continuation-byte mask.", "answerTitle": "UTF-8 validation", "answer": "<p>Count leading ones of the first byte: 0 → ASCII, 2/3/4 → that many total bytes; 1 or &gt;4 is illegal. Each continuation is <code>10xxxxxx<\/code>. Overlong encodings and surrogates are invalid in the real spec; mention them if they want production, skip if they want the LeetCode bitmask.<\/p>", "source": "answers.md", "search": "utf-8 validation as a bit problem. leading-ones count, and the continuation-byte mask. count leading ones of the first byte: 0 → ascii, 2/3/4 → that many total bytes; 1 or 4 is illegal. each continuation is 10xxxxxx. overlong encodings and surrogates are invalid in the real spec; mention them if they want production, skip if they want the leetcode bitmask."}, {"n": 200, "category": 14, "difficulty": "T", "html": "<code>Math.abs(Integer.MIN_VALUE)<\/code> and <code>Math.negateExact<\/code>. What returns, what throws, and which one do you want in a money path?", "answerTitle": "`abs(MIN_VALUE)`", "answer": "<p><code>Math.abs(Integer.MIN_VALUE)<\/code> returns <code>Integer.MIN_VALUE<\/code>. <code>Math.negateExact<\/code> / <code>absExact<\/code> (Java 17) throw <code>ArithmeticException<\/code>. Money path: <code>absExact<\/code> or promote to <code>long<\/code> first. Silent wrap is how a debit becomes a debit.<\/p>", "source": "answers.md", "search": "math.abs(integer.min_value) and math.negateexact. what returns, what throws, and which one do you want in a money path? math.abs(integer.min_value) returns integer.min_value. math.negateexact / absexact (java 17) throw arithmeticexception. money path: absexact or promote to long first. silent wrap is how a debit becomes a debit."}, {"n": 201, "category": 14, "difficulty": "A", "html": "A billing service adding millions of currency amounts per hour. Design the numeric type, the rounding rule, and the one test that would have caught Q196.", "answerTitle": "Billing numerics", "answer": "<p>Store integer minor units (<code>long<\/code> cents) or <code>BigDecimal<\/code> with a fixed scale and an explicit <code>RoundingMode<\/code> (usually <code>HALF_EVEN<\/code> for money, and the <em>same<\/em> mode everywhere). The test that catches Q196 is <code>assertEquals(0, new BigDecimal(&quot;0.1&quot;).add(new BigDecimal(&quot;0.2&quot;)).compareTo(new BigDecimal(&quot;0.3&quot;)))<\/code> plus a million-add loop that would drift in <code>double<\/code>. Never <code>equals<\/code> on <code>BigDecimal<\/code> without <code>compareTo<\/code> (scale differs). Incident: S4.<\/p>", "source": "answers.md", "search": "a billing service adding millions of currency amounts per hour. design the numeric type, the rounding rule, and the one test that would have caught q196. store integer minor units (long cents) or bigdecimal with a fixed scale and an explicit roundingmode (usually half_even for money, and the same mode everywhere). the test that catches q196 is assertequals(0, new bigdecimal(\"0.1\").add(new bigdecimal(\"0.2\")).compareto(new bigdecimal(\"0.3\"))) plus a million-add loop that would drift in double. never equals on bigdecimal without compareto (scale differs). incident: s4."}, {"n": 202, "category": 14, "difficulty": "A", "html": "Packed bitsets for 10⁸ flags. <code>BitSet<\/code> versus <code>long[]<\/code>, cardinality, and when a roaring bitmap is the actual answer.", "answerTitle": "10⁸ flags", "answer": "<p><code>BitSet<\/code> is the JDK default: <code>set<\/code>/<code>get<\/code>/<code>cardinality<\/code>/<code>nextSetBit<\/code>. <code>long[]<\/code> is the same idea with more control. 10⁸ bits is 12.5 MB - fine. Roaring (or a sparse bitset) wins when the set bits are clustered or very sparse and you union them a lot. Do not <code>boolean[100_000_000]<\/code> - that is 100 MB plus headers, and a review comment.<\/p>", "source": "answers.md", "search": "packed bitsets for 10⁸ flags. bitset versus long[], cardinality, and when a roaring bitmap is the actual answer. bitset is the jdk default: set/get/cardinality/nextsetbit. long[] is the same idea with more control. 10⁸ bits is 12.5 mb - fine. roaring (or a sparse bitset) wins when the set bits are clustered or very sparse and you union them a lot. do not boolean[100_000_000] - that is 100 mb plus headers, and a review comment."}, {"n": 203, "category": 15, "difficulty": "C", "html": "<code>List.of<\/code> / <code>Map.of<\/code> are unmodifiable and reject <code>null<\/code>. What throws, and when do you still want <code>new ArrayList&lt;&gt;(List.of(...))<\/code>?", "answerTitle": "`List.of` / `Map.of`", "answer": "<p>Unmodifiable, no <code>null<\/code> (NPE on <code>of<\/code> and on later <code>list.add<\/code>). <code>Map.of<\/code> caps at 10 entries; <code>Map.ofEntries<\/code> does not. <code>new ArrayList&lt;&gt;(List.of(a, b))<\/code> is the mutable copy you want when you will add. <code>Arrays.asList<\/code> is fixed-size (set ok, add throws) and reflects array writes.<\/p>", "source": "answers.md", "search": "list.of / map.of are unmodifiable and reject null. what throws, and when do you still want new arraylist< (list.of(...))? unmodifiable, no null (npe on of and on later list.add). map.of caps at 10 entries; map.ofentries does not. new arraylist< (list.of(a, b)) is the mutable copy you want when you will add. arrays.aslist is fixed-size (set ok, add throws) and reflects array writes."}, {"n": 204, "category": 15, "difficulty": "C", "html": "<code>record<\/code> as a DTO and as a map key. What is generated, and what is <em>not<\/em> (defensive copies)?", "answerTitle": "`record` as DTO and key", "answer": "<p>Generates ctor, accessors, <code>equals<\/code>/<code>hashCode<\/code>/<code>toString<\/code>. Does <strong>not<\/strong> defensive-copy: a <code>record R(List&lt;String&gt; xs)<\/code> is mutable through <code>xs<\/code>. As a map key, the components you hash must not change (Q33). Compact ctor is where validation goes.<\/p>", "source": "answers.md", "search": "record as a dto and as a map key. what is generated, and what is not (defensive copies)? generates ctor, accessors, equals/hashcode/tostring. does not defensive-copy: a record r(list<string xs) is mutable through xs. as a map key, the components you hash must not change (q33). compact ctor is where validation goes."}, {"n": 205, "category": 15, "difficulty": "D", "html": "<code>Optional<\/code>: when you return it, when you never use it as a field or a parameter, and the <code>orElse<\/code> versus <code>orElseGet<\/code> trap.", "answerTitle": "`Optional`", "answer": "<p>Return type for &quot;maybe&quot;. Never a field, never a parameter, never <code>Optional&lt;T&gt;<\/code> in a collection. <code>orElse(expensive())<\/code> always evaluates the argument; <code>orElseGet<\/code> is lazy. <code>get<\/code> without <code>isPresent<\/code> is a review comment; use <code>orElseThrow<\/code>. Do not <code>optional != null<\/code>.<\/p>", "source": "answers.md", "search": "optional: when you return it, when you never use it as a field or a parameter, and the orelse versus orelseget trap. return type for \"maybe\". never a field, never a parameter, never optional<t in a collection. orelse(expensive()) always evaluates the argument; orelseget is lazy. get without ispresent is a review comment; use orelsethrow. do not optional != null."}, {"n": 206, "category": 15, "difficulty": "D", "html": "Streams: <code>filter<\/code>/<code>map<\/code>/<code>flatMap<\/code>/<code>collect<\/code>, and a reduce you should have written as a loop. When is a stream the wrong tool in a timed round?", "answerTitle": "Streams under a clock", "answer": "<p>Write a stream for a map/filter/collect that fits on three lines. Write a loop for anything with an early return, a running pair of values, checked exceptions (Q212), or a performance bound you must name. <code>reduce<\/code> that is really a <code>max<\/code> / <code>sum<\/code> should be <code>max<\/code> / <code>mapToInt.sum<\/code>. Interviewers read a 15-line stream as avoidance.<\/p>", "source": "answers.md", "search": "streams: filter/map/flatmap/collect, and a reduce you should have written as a loop. when is a stream the wrong tool in a timed round? write a stream for a map/filter/collect that fits on three lines. write a loop for anything with an early return, a running pair of values, checked exceptions (q212), or a performance bound you must name. reduce that is really a max / sum should be max / maptoint.sum. interviewers read a 15-line stream as avoidance."}, {"n": 207, "category": 15, "difficulty": "T", "html": "A stream over a shared <code>ArrayList<\/code> that another thread mutates. What happens, and what does <code>toList()<\/code> (Java 16) not make safe?", "answerTitle": "Stream over a mutating list", "answer": "<p>Non-concurrent streams are fail-fast on structural mutation: <code>ConcurrentModificationException<\/code>, or worse, a silent miss. <code>toList()<\/code> (unmodifiable copy of the <em>output<\/em>) does not snapshot the <em>source<\/em>. Another thread mutating the source is a data race, not a stream feature. Concurrent source: <code>CopyOnWriteArrayList<\/code> or a snapshot.<\/p>", "source": "answers.md", "search": "a stream over a shared arraylist that another thread mutates. what happens, and what does tolist() (java 16) not make safe? non-concurrent streams are fail-fast on structural mutation: concurrentmodificationexception, or worse, a silent miss. tolist() (unmodifiable copy of the output ) does not snapshot the source . another thread mutating the source is a data race, not a stream feature. concurrent source: copyonwritearraylist or a snapshot."}, {"n": 208, "category": 15, "difficulty": "D", "html": "<code>equals<\/code>/<code>hashCode<\/code>/<code>compareTo<\/code> consistency. Write a <code>record<\/code>-based key, then the class-based version with <code>Objects.equals<\/code> / <code>Objects.hash<\/code>.", "answerTitle": "`equals` / `hashCode` / `compareTo`", "answer": "<p><code>record<\/code> does the first two. A class: <code>Objects.equals<\/code> / <code>Objects.hash<\/code> on the same immutable fields. <code>compareTo<\/code> must be consistent with <code>equals<\/code> (Q58): <code>compare == 0<\/code> iff <code>equals<\/code>. Do not include mutable or derived fields. Do not use <code>==<\/code> on boxed values (Q3 of <code>01-java<\/code>).<\/p>", "source": "answers.md", "search": "equals/hashcode/compareto consistency. write a record-based key, then the class-based version with objects.equals / objects.hash. record does the first two. a class: objects.equals / objects.hash on the same immutable fields. compareto must be consistent with equals (q58): compare == 0 iff equals. do not include mutable or derived fields. do not use == on boxed values (q3 of 01-java)."}, {"n": 209, "category": 15, "difficulty": "T", "html": "<code>Comparator<\/code> chains with <code>nullsFirst<\/code>, and <code>comparing<\/code> on a field that can be null. Which call throws, and where?", "answerTitle": "Comparator nulls", "answer": "<p><code>Comparator.comparing(Foo::getName)<\/code> NPEs when <code>getName()<\/code> is null, <em>inside<\/em> <code>comparing<\/code>, not at sort start. <code>comparing(Foo::getName, nullsFirst(naturalOrder()))<\/code> is the fix. <code>nullsFirst<\/code> on the <em>outer<\/em> comparator handles null <em>elements<\/em>; that is a different null.<\/p>", "source": "answers.md", "search": "comparator chains with nullsfirst, and comparing on a field that can be null. which call throws, and where? comparator.comparing(foo::getname) npes when getname() is null, inside comparing, not at sort start. comparing(foo::getname, nullsfirst(naturalorder())) is the fix. nullsfirst on the outer comparator handles null elements ; that is a different null."}, {"n": 210, "category": 15, "difficulty": "D", "html": "<code>EnumSet<\/code> / <code>EnumMap<\/code> versus <code>HashSet<\/code> of enums. Why is the bit-vector version the default in a review?", "answerTitle": "`EnumSet` / `EnumMap`", "answer": "<p>Bit-vector / array, no hash, no boxing of the key. Default in a review whenever the key is an enum. <code>HashSet&lt;MyEnum&gt;<\/code> is a smell unless the set is transient and tiny. <code>EnumSet.noneOf<\/code> / <code>allOf<\/code> / <code>complementOf<\/code> are the constructors; there is no public ctor.<\/p>", "source": "answers.md", "search": "enumset / enummap versus hashset of enums. why is the bit-vector version the default in a review? bit-vector / array, no hash, no boxing of the key. default in a review whenever the key is an enum. hashset<myenum is a smell unless the set is transient and tiny. enumset.noneof / allof / complementof are the constructors; there is no public ctor."}, {"n": 211, "category": 15, "difficulty": "D", "html": "<code>ArrayDeque<\/code> versus <code>LinkedList<\/code> versus <code>ArrayList<\/code> for a stack and for a queue. Give the one-line rule you apply in every round.", "answerTitle": "Deque / list rule", "answer": "<p>Stack or queue: <code>ArrayDeque<\/code>. Random access or append-only list: <code>ArrayList<\/code>. <code>LinkedList<\/code> only for mid-list splice when you already hold an iterator (Q98). That is the one-line rule. <code>Stack<\/code> and <code>Vector<\/code> are historical.<\/p>", "source": "answers.md", "search": "arraydeque versus linkedlist versus arraylist for a stack and for a queue. give the one-line rule you apply in every round. stack or queue: arraydeque. random access or append-only list: arraylist. linkedlist only for mid-list splice when you already hold an iterator (q98). that is the one-line rule. stack and vector are historical."}, {"n": 212, "category": 15, "difficulty": "D", "html": "Checked exceptions inside a <code>map<\/code> lambda. What do you actually write (helper, sneak, wrap), and what do you refuse in production?", "answerTitle": "Checked exceptions in `map`", "answer": "<p>Production: a small private helper that wraps in an unchecked domain exception, or <code>map<\/code> to a result type. Refuse sneaky-throw utilities and <code>e -&gt; { throw new RuntimeException(e); }<\/code> as a habit - they erase the type the caller needed. In a 45-minute round, a loop with a <code>try<\/code> is cleaner than a stream you have to apologize for.<\/p>", "source": "answers.md", "search": "checked exceptions inside a map lambda. what do you actually write (helper, sneak, wrap), and what do you refuse in production? production: a small private helper that wraps in an unchecked domain exception, or map to a result type. refuse sneaky-throw utilities and e - { throw new runtimeexception(e); } as a habit - they erase the type the caller needed. in a 45-minute round, a loop with a try is cleaner than a stream you have to apologize for."}, {"n": 213, "category": 15, "difficulty": "T", "html": "<code>IdentityHashMap<\/code>, <code>WeakHashMap<\/code>, <code>ConcurrentHashMap<\/code>. One sentence each on when you reach for them, and the <code>WeakHashMap<\/code> gotcha on keys.", "answerTitle": "Three special maps", "answer": "<p><code>IdentityHashMap<\/code>: identity keys, graph clone (Q141). <code>WeakHashMap<\/code>: keys GC-able; values are <em>strong<\/em> - a value pointing back at its key pins it. <code>ConcurrentHashMap<\/code>: concurrent writers, no <code>null<\/code> keys or values, aggregates are weakly consistent. One sentence each is enough; the weak-key gotcha is the follow-up.<\/p>", "source": "answers.md", "search": "identityhashmap, weakhashmap, concurrenthashmap. one sentence each on when you reach for them, and the weakhashmap gotcha on keys. identityhashmap: identity keys, graph clone (q141). weakhashmap: keys gc-able; values are strong - a value pointing back at its key pins it. concurrenthashmap: concurrent writers, no null keys or values, aggregates are weakly consistent. one sentence each is enough; the weak-key gotcha is the follow-up."}, {"n": 214, "category": 15, "difficulty": "D", "html": "<code>String.formatted<\/code>, text blocks, and <code>NumberFormat<\/code> versus <code>DecimalFormat<\/code> versus <code>BigDecimal.setScale<\/code>. Which one for logs, which one for money?", "answerTitle": "Formatting", "answer": "<p>Logs: <code>String.formatted<\/code> or a text block, never <code>NumberFormat<\/code> on a hot path (it is mutable and not thread-safe). Money: <code>BigDecimal.setScale(2, rounding)<\/code> then <code>toPlainString<\/code>, or a <code>DecimalFormat<\/code> <em>cloned per use<\/em> / <code>NumberFormat.getInstance<\/code> carefully. Do not <code>double<\/code> format a currency (Q196).<\/p>", "source": "answers.md", "search": "string.formatted, text blocks, and numberformat versus decimalformat versus bigdecimal.setscale. which one for logs, which one for money? logs: string.formatted or a text block, never numberformat on a hot path (it is mutable and not thread-safe). money: bigdecimal.setscale(2, rounding) then toplainstring, or a decimalformat cloned per use / numberformat.getinstance carefully. do not double format a currency (q196)."}, {"n": 215, "category": 15, "difficulty": "D", "html": "<code>equals<\/code> on arrays: <code>==<\/code>, <code>array.equals<\/code>, <code>Arrays.equals<\/code>, <code>Arrays.deepEquals<\/code>. Write the one-liner you want in a test.", "answerTitle": "Array `equals`", "answer": "<p><code>==<\/code> is identity. <code>array.equals<\/code> is identity (<code>Object.equals<\/code>) - a famous trap. <code>Arrays.equals<\/code> is shallow; <code>Arrays.deepEquals<\/code> for nested arrays. In a test: <code>assertArrayEquals<\/code>. This is the stream-adjacent &quot;I thought I compared contents&quot; bug.<\/p>", "source": "answers.md", "search": "equals on arrays: ==, array.equals, arrays.equals, arrays.deepequals. write the one-liner you want in a test. == is identity. array.equals is identity (object.equals) - a famous trap. arrays.equals is shallow; arrays.deepequals for nested arrays. in a test: assertarrayequals. this is the stream-adjacent \"i thought i compared contents\" bug."}, {"n": 216, "category": 15, "difficulty": "A", "html": "You have 20 minutes of a pairing session on their codebase. Which Java 17+ features do you introduce, and which do you leave alone because the diff would lie?", "answerTitle": "Twenty minutes in their codebase", "answer": "<p>Introduce: text blocks for the SQL/JSON you already touched, <code>var<\/code> on the obvious local, a <code>record<\/code> for the tuple you were about to write a class for, <code>switch<\/code> expressions if one is mid-edit. Leave: a virtual-thread migration, a stream rewrite of a working loop, <code>Optional<\/code> wrapping of every return. The diff should look like you were there to solve
