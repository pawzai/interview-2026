<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Coding Pack</h1>
  <p>Patterns in Java, complexity, concurrency exercises and design-and-implement. Answer out loud before expanding.</p>
  <div class="legend" id="legend"></div>
</header>

<div class="toolbar">
  <div class="row">
    <input type="search" id="search" placeholder="Search questions and answers    ( / to focus )" autocomplete="off">
    <select id="category"><option value="">All categories</option></select>
    <select id="status">
      <option value="">Any status</option>
      <option value="unseen">Not marked</option>
      <option value="review">Needs review</option>
      <option value="known">Known</option>
    </select>
  </div>
  <div class="row">
    <span id="diffFilters"></span>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
    <button id="theme">Light</button>
    <button id="reset">Reset progress</button>
  </div>
  <div class="row progress">
    <div class="bar" style="flex:1"><i class="known" id="barKnown"></i><i class="review" id="barReview"></i></div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<main id="list"></main>
<div class="empty" id="empty" hidden>No questions match those filters.</div>

</div>

 complexity sentence that names <em>of what<\/em>. The interviewer is deciding &quot;would I let this person merge on week one&quot;, not &quot;did they remember the xor trick&quot;.<\/p><blockquote><p><em>Hook: a loop I watched fail a strong senior because the O(n) two-pointer was correct and the narration never named the invariant.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "what four things is a principal-level coding solution scored on, in order, and why is cleverness not one of them? correctness under the cases the interviewer will supply, then structure a reviewer would keep, then complexity you can defend, then communication that produces a written note. cleverness is not a dimension because a clever trick that breaks on the empty array, or that you cannot explain, is a no-hire artifact. a principal-level paste looks boring: names that match the domain, one helper, the edge cases in the signature or a comment, and a complexity sentence that names of what . the interviewer is deciding \"would i let this person merge on week one\", not \"did they remember the xor trick\". hook: a loop i watched fail a strong senior because the o(n) two-pointer was correct and the narration never named the invariant."}, {"n": 2, "category": 1, "difficulty": "C", "html": "State Big-O for time and extra space, and say what each of O(1), O(log n), O(n), O(n log n), O(n²) and O(2ⁿ) means for n = 10⁵ in a 45-minute round.", "answerTitle": "Big-O as a decision tool, not a recitation", "answer": "<p>O(1) is a hash get or an index. O(log n) is a binary search or a heap operation. O(n) is a single pass. O(n log n) is a sort or n heap operations. O(n²) is a nested scan. O(2ⁿ) or worse is a raw subset or permutation walk.<\/p><p>At n = 10⁵, O(n) and O(n log n) finish; O(n²) is 10¹⁰ operations and you do not write it unless n is tiny or you have a tight inner bound. At n = 20, 2ⁿ is the whole conversation. Always name the variable: O(n) of what - length, edges, alphabet, window.<\/p>", "source": "answers.md", "search": "state big-o for time and extra space, and say what each of o(1), o(log n), o(n), o(n log n), o(n²) and o(2ⁿ) means for n = 10⁵ in a 45-minute round. o(1) is a hash get or an index. o(log n) is a binary search or a heap operation. o(n) is a single pass. o(n log n) is a sort or n heap operations. o(n²) is a nested scan. o(2ⁿ) or worse is a raw subset or permutation walk. at n = 10⁵, o(n) and o(n log n) finish; o(n²) is 10¹⁰ operations and you do not write it unless n is tiny or you have a tight inner bound. at n = 20, 2ⁿ is the whole conversation. always name the variable: o(n) of what - length, edges, alphabet, window."}, {"n": 3, "category": 1, "difficulty": "D", "html": "Best, average and worst case. When does quoting only the average case lose you the follow-up, and when is the average the number that matters?", "answerTitle": "Best, average, worst", "answer": "<p>Quote worst case unless the algorithm is <em>designed<\/em> around the average (hash tables, randomized quicksort) and you say so. Quoting only the average of quicksort hides the O(n²) pivot failure; quoting only the worst of a hash map hides that the expected <code>get<\/code> is O(1) and that is why you chose it.<\/p><p>The follow-up you lose is &quot;what input makes this bad&quot;. Have that input ready: already-sorted for naive quicksort, adversarial hashes for a map, a single huge window for a sliding-window that you implemented as a rescan.<\/p>", "source": "answers.md", "search": "best, average and worst case. when does quoting only the average case lose you the follow-up, and when is the average the number that matters? quote worst case unless the algorithm is designed around the average (hash tables, randomized quicksort) and you say so. quoting only the average of quicksort hides the o(n²) pivot failure; quoting only the worst of a hash map hides that the expected get is o(1) and that is why you chose it. the follow-up you lose is \"what input makes this bad\". have that input ready: already-sorted for naive quicksort, adversarial hashes for a map, a single huge window for a sliding-window that you implemented as a rescan."}, {"n": 4, "category": 1, "difficulty": "D", "html": "Amortized versus worst-case. Explain <code>ArrayList.add<\/code> and <code>HashMap.put<\/code> in those terms, and say when you would refuse the amortized story.", "answerTitle": "Amortized versus worst-case", "answer": "<p><code>ArrayList.add<\/code> is O(1) amortized: most adds are a store, a resize copies 2ⁿ elements over a sequence of n adds, so the extra cost is O(n) across n adds. <code>HashMap.put<\/code> is the same story plus a rehash. Refuse the amortized story when a single add in a latency-critical path can copy a 10-million-element array - then you pre-size, or you use a structure whose worst case is the SLA.<\/p>", "source": "answers.md", "search": "amortized versus worst-case. explain arraylist.add and hashmap.put in those terms, and say when you would refuse the amortized story. arraylist.add is o(1) amortized: most adds are a store, a resize copies 2ⁿ elements over a sequence of n adds, so the extra cost is o(n) across n adds. hashmap.put is the same story plus a rehash. refuse the amortized story when a single add in a latency-critical path can copy a 10-million-element array - then you pre-size, or you use a structure whose worst case is the sla."}, {"n": 5, "category": 1, "difficulty": "T", "html": "&quot;This is O(n).&quot; The interviewer asks &quot;of what?&quot; What are you expected to name, and what happens if you cannot?", "answerTitle": "\"O(n) of what?\"", "answer": "<p>Name the input that grows: characters, edges, distinct keys, window length, number of queries. If two sizes matter, say O(n + m) or O(n · k). Candidates who say &quot;linear&quot; and cannot point at a variable are bluffing, and the interviewer will switch to a two-variable problem on the next question.<\/p>", "source": "answers.md", "search": "\"this is o(n).\" the interviewer asks \"of what?\" what are you expected to name, and what happens if you cannot? name the input that grows: characters, edges, distinct keys, window length, number of queries. if two sizes matter, say o(n + m) or o(n · k). candidates who say \"linear\" and cannot point at a variable are bluffing, and the interviewer will switch to a two-variable problem on the next question."}, {"n": 6, "category": 1, "difficulty": "D", "html": "Time-space trade-off: give three production examples where you spent memory to buy time, and one where you did the opposite.", "answerTitle": "Time-space trade-offs you have actually made", "answer": "<p>Spent memory: a prefix-sum array, an LRU, an inverted index. Spent time: streaming a file you could have slurp&#x27;d, recomputing a derived value to avoid a stale cache. The interview sentence is &quot;I paid O(n) memory so every query became O(1), and I would not do that if the array did not fit in the heap&quot;.<\/p>", "source": "answers.md", "search": "time-space trade-off: give three production examples where you spent memory to buy time, and one where you did the opposite. spent memory: a prefix-sum array, an lru, an inverted index. spent time: streaming a file you could have slurp'd, recomputing a derived value to avoid a stale cache. the interview sentence is \"i paid o(n) memory so every query became o(1), and i would not do that if the array did not fit in the heap\"."}, {"n": 7, "category": 1, "difficulty": "D", "html": "What does &quot;in-place&quot; actually mean in Java, and why is swapping inside the input array still not free?", "answerTitle": "What \"in-place\" means in Java", "answer": "<p>You mutate the input array or list and allocate only a handful of scalars or a recursion stack you are willing to call extra space. Swapping is not free: you dirty the caller&#x27;s data, you break other aliases, and you still pay write-barrier and cache-line costs. Say &quot;I will mutate <code>nums<\/code> unless you need it afterwards&quot; before you do it.<\/p>", "source": "answers.md", "search": "what does \"in-place\" actually mean in java, and why is swapping inside the input array still not free? you mutate the input array or list and allocate only a handful of scalars or a recursion stack you are willing to call extra space. swapping is not free: you dirty the caller's data, you break other aliases, and you still pay write-barrier and cache-line costs. say \"i will mutate nums unless you need it afterwards\" before you do it."}, {"n": 8, "category": 1, "difficulty": "T", "html": "Two solutions: O(n) time with O(n) space, and O(n log n) time with O(1) extra space. Which do you write first, and what do you say about the other?", "answerTitle": "O(n)/O(n) versus O(n log n)/O(1)", "answer": "<p>Write the O(n) time solution first - correctness and the simpler invariant - and then say &quot;if memory is the constraint I can sort and two-pointer in O(n log n) and O(1) extra, at the cost of destroying order / mutating the input&quot;. The interviewer is scoring the <em>conversation<\/em>, not that you picked the textbook optimal on the first line.<\/p>", "source": "answers.md", "search": "two solutions: o(n) time with o(n) space, and o(n log n) time with o(1) extra space. which do you write first, and what do you say about the other? write the o(n) time solution first - correctness and the simpler invariant - and then say \"if memory is the constraint i can sort and two-pointer in o(n log n) and o(1) extra, at the cost of destroying order / mutating the input\". the interviewer is scoring the conversation , not that you picked the textbook optimal on the first line."}, {"n": 9, "category": 1, "difficulty": "D", "html": "How do you pick a data structure in the first three minutes? Walk the decision: access pattern, uniqueness, order, mutation, concurrency.", "answerTitle": "Picking a structure in three minutes", "answer": "<p>Access by key → map. Uniqueness → set. Order of insertion → <code>LinkedHashMap<\/code> / list. Order of value → heap or <code>TreeMap<\/code>. Frequent insert/delete at ends → <code>ArrayDeque<\/code>. Need the kth → heap or quickselect. Concurrent writers → <code>ConcurrentHashMap<\/code> or an explicit lock. Say this ladder out loud; it is the note they write.<\/p>", "source": "answers.md", "search": "how do you pick a data structure in the first three minutes? walk the decision: access pattern, uniqueness, order, mutation, concurrency. access by key → map. uniqueness → set. order of insertion → linkedhashmap / list. order of value → heap or treemap. frequent insert/delete at ends → arraydeque. need the kth → heap or quickselect. concurrent writers → concurrenthashmap or an explicit lock. say this ladder out loud; it is the note they write."}, {"n": 10, "category": 1, "difficulty": "D", "html": "When do you write a brute-force solution on the board first, and when is that a waste of the clock?", "answerTitle": "When brute force earns the clock", "answer": "<p>When the optimal is a named pattern you do not yet see, write the O(n²) so you have a correct oracle and a complexity to beat. Skip it when you already see the two-pointer or the heap and n is 10⁵. A brute-force you cannot finish is a worse artifact than an optimal you narrate and then code.<\/p>", "source": "answers.md", "search": "when do you write a brute-force solution on the board first, and when is that a waste of the clock? when the optimal is a named pattern you do not yet see, write the o(n²) so you have a correct oracle and a complexity to beat. skip it when you already see the two-pointer or the heap and n is 10⁵. a brute-force you cannot finish is a worse artifact than an optimal you narrate and then code."}, {"n": 11, "category": 1, "difficulty": "T", "html": "You quote O(n) and the interviewer shows an input that makes it O(n²). What did you miss, and how do you recover?", "answerTitle": "Your O(n) was O(n²)", "answer": "<p>You counted the outer pass and ignored an inner scan, a <code>contains<\/code> on a list, a string <code>+<\/code> in a loop, or a hash that degraded. Recovery: name the hidden loop, give the input that triggers it (&quot;if every window is unique this rescan is n²&quot;), and replace the inner structure. Do not defend the original bound.<\/p>", "source": "answers.md", "search": "you quote o(n) and the interviewer shows an input that makes it o(n²). what did you miss, and how do you recover? you counted the outer pass and ignored an inner scan, a contains on a list, a string + in a loop, or a hash that degraded. recovery: name the hidden loop, give the input that triggers it (\"if every window is unique this rescan is n²\"), and replace the inner structure. do not defend the original bound."}, {"n": 12, "category": 1, "difficulty": "D", "html": "Recurrence relations: solve merge sort, binary search and the naive recursive Fibonacci out loud, and say which one you would never ship.", "answerTitle": "Recurrences you can solve out loud", "answer": "<p>Merge sort: T(n) = 2T(n/2) + O(n) → O(n log n). Binary search: T(n) = T(n/2) + O(1) → O(log n). Naive Fibonacci: T(n) = T(n-1) + T(n-2) + O(1) → Θ(φⁿ). You never ship the last one; you ship the O(n) loop or the matrix / closed form. Master theorem is optional; the recursion tree is enough.<\/p>", "source": "answers.md", "search": "recurrence relations: solve merge sort, binary search and the naive recursive fibonacci out loud, and say which one you would never ship. merge sort: t(n) = 2t(n/2) + o(n) → o(n log n). binary search: t(n) = t(n/2) + o(1) → o(log n). naive fibonacci: t(n) = t(n-1) + t(n-2) + o(1) → θ(φⁿ). you never ship the last one; you ship the o(n) loop or the matrix / closed form. master theorem is optional; the recursion tree is enough."}, {"n": 13, "category": 1, "difficulty": "A", "html": "The interviewer says &quot;production quality&quot;. What do you keep, what do you consciously drop, and how do you say that out loud so it is a judgement rather than an excuse?", "answerTitle": "\"Production quality\" in 45 minutes", "answer": "<p>Keep: names, a total order on error handling (reject null / empty at the top), complexity, one or two tests. Drop: logging framework, metrics, generics gymnastics, a strategy interface for a single implementation. Say <em>&quot;I am writing the production shape and omitting the telemetry you would add in the real repo&quot;<\/em> so the omission is a judgement.<\/p>", "source": "answers.md", "search": "the interviewer says \"production quality\". what do you keep, what do you consciously drop, and how do you say that out loud so it is a judgement rather than an excuse? keep: names, a total order on error handling (reject null / empty at the top), complexity, one or two tests. drop: logging framework, metrics, generics gymnastics, a strategy interface for a single implementation. say \"i am writing the production shape and omitting the telemetry you would add in the real repo\" so the omission is a judgement."}, {"n": 14, "category": 1, "difficulty": "A", "html": "Design a 45-minute budget for a medium problem: clarifying, brute force, optimal, tests, complexity. Where do 19-year candidates usually blow it?", "answerTitle": "A 45-minute budget", "answer": "<p>Four minutes clarifying and restating; six on a brute-force or a sketch; twenty-five on the optimal plus the helper; five on tests; five on complexity and the follow-up. Nineteen-year candidates blow it by designing a framework for twelve minutes, or by polishing names on a solution that still fails <code>[]<\/code>. Time-to-first-correct-loop is the metric.<\/p>", "source": "answers.md", "search": "design a 45-minute budget for a medium problem: clarifying, brute force, optimal, tests, complexity. where do 19-year candidates usually blow it? four minutes clarifying and restating; six on a brute-force or a sketch; twenty-five on the optimal plus the helper; five on tests; five on complexity and the follow-up. nineteen-year candidates blow it by designing a framework for twelve minutes, or by polishing names on a solution that still fails []. time-to-first-correct-loop is the metric."}, {"n": 15, "category": 2, "difficulty": "C", "html": "Two-sum in a sorted array. Write the two-pointer solution and state why a hash map is the wrong first move here.", "answerTitle": "Two-sum on a sorted array", "answer": "<p>Two pointers, not a map: the array already is the index.<\/p><pre><code class=\"lang-java\">boolean twoSumSorted(int[] a, int t) {\n    int i = 0, j = a.length - 1;\n    while (i &lt; j) {\n        int s = a[i] + a[j];\n        if (s == t) return true;\n        if (s &lt; t) i++; else j--;\n    }\n    return false;\n}<\/code><\/pre><p>O(n) time, O(1) extra. A hash map is O(n) extra and throws away the order you were given. Edge: empty, one element, negatives, overflow of <code>a[i] + a[j]<\/code> - use a <code>long<\/code> sum if the values can be <code>Integer.MIN_VALUE<\/code>.<\/p>", "source": "answers.md", "search": "two-sum in a sorted array. write the two-pointer solution and state why a hash map is the wrong first move here. two pointers, not a map: the array already is the index. java boolean twosumsorted(int[] a, int t) { int i = 0, j = a.length - 1; while (i < j) { int s = a[i] + a[j]; if (s == t) return true; if (s < t) i++; else j--; } return false; } o(n) time, o(1) extra. a hash map is o(n) extra and throws away the order you were given. edge: empty, one element, negatives, overflow of a[i] + a[j] - use a long sum if the values can be integer.min_value."}, {"n": 16, "category": 2, "difficulty": "C", "html": "Reverse an array in place. Write it, and say what changes if the element type is a boxed <code>Integer<\/code>.", "answerTitle": "Reverse an array in place", "answer": "<pre><code class=\"lang-java\">void reverse(int[] a) {\n    for (int i = 0, j = a.length - 1; i &lt; j; i++, j--) {\n        int t = a[i]; a[i] = a[j]; a[j] = t;\n    }\n}<\/code><\/pre><p>Boxed <code>Integer[]<\/code> is the same swap of <em>references<\/em>; you are not mutating the <code>Integer<\/code> objects. Do not use <code>Collections.reverse<\/code> on <code>Arrays.asList(intArray)<\/code> - that does not compile on an <code>int[]<\/code>.<\/p>", "source": "answers.md", "search": "reverse an array in place. write it, and say what changes if the element type is a boxed integer. java void reverse(int[] a) { for (int i = 0, j = a.length - 1; i < j; i++, j--) { int t = a[i]; a[i] = a[j]; a[j] = t; } } boxed integer[] is the same swap of references ; you are not mutating the integer objects. do not use collections.reverse on arrays.aslist(intarray) - that does not compile on an int[]."}, {"n": 17, "category": 2, "difficulty": "D", "html": "Remove duplicates from a sorted array in place, returning the new length. What does &quot;in place&quot; require you to do with the tail?", "answerTitle": "Remove duplicates from a sorted array", "answer": "<p>Write the next unique at <code>slow<\/code>, scan with <code>fast<\/code>. The tail is garbage; the contract is the new length, not a compacted array you <code>null<\/code> out. Interviewers who want the tail cleared will say so.<\/p><pre><code class=\"lang-java\">int unique(int[] a) {\n    if (a.length == 0) return 0;\n    int s = 1;\n    for (int f = 1; f &lt; a.length; f++)\n        if (a[f] != a[s - 1]) a[s++] = a[f];\n    return s;\n}<\/code><\/pre>", "source": "answers.md", "search": "remove duplicates from a sorted array in place, returning the new length. what does \"in place\" require you to do with the tail? write the next unique at slow, scan with fast. the tail is garbage; the contract is the new length, not a compacted array you null out. interviewers who want the tail cleared will say so. java int unique(int[] a) { if (a.length == 0) return 0; int s = 1; for (int f = 1; f < a.length; f++) if (a[f] != a[s - 1]) a[s++] = a[f]; return s; }"}, {"n": 18, "category": 2, "difficulty": "D", "html": "The sliding-window template: when is the window fixed, when is it variable, and what is the loop invariant you state out loud?", "answerTitle": "Sliding-window template", "answer": "<p>Fixed window: add <code>a[r]<\/code>, if <code>r &gt;= k<\/code> drop <code>a[r - k]<\/code>, record. Variable window: grow <code>r<\/code> until the invariant is satisfied (or broken), then shrink <code>l<\/code> while it stays satisfied. The invariant you say out loud is <em>&quot;the window <code>[l, r]<\/code> is the smallest/largest that still …&quot;<\/em>. One <code>l<\/code> and one <code>r<\/code>, both only move forward, so the whole scan is O(n).<\/p>", "source": "answers.md", "search": "the sliding-window template: when is the window fixed, when is it variable, and what is the loop invariant you state out loud? fixed window: add a[r], if r = k drop a[r - k], record. variable window: grow r until the invariant is satisfied (or broken), then shrink l while it stays satisfied. the invariant you say out loud is \"the window [l, r] is the smallest/largest that still …\" . one l and one r, both only move forward, so the whole scan is o(n)."}, {"n": 19, "category": 2, "difficulty": "C", "html": "Maximum sum of a subarray of length k. Write the fixed-window version, not the Kadane version.", "answerTitle": "Maximum sum of a window of length k", "answer": "<pre><code class=\"lang-java\">int maxSum(int[] a, int k) {\n    if (a.length &lt; k) throw new IllegalArgumentException(&quot;k&quot;);\n    int sum = 0, best;\n    for (int i = 0; i &lt; k; i++) sum += a[i];\n    best = sum;\n    for (int i = k; i &lt; a.length; i++) {\n        sum += a[i] - a[i - k];\n        best = Math.max(best, sum);\n    }\n    return best;\n}<\/code><\/pre><p>This is not Kadane. Kadane is any subarray; this is exactly k. Empty / <code>k &gt; n<\/code> is a precondition, not a clever return.<\/p>", "source": "answers.md", "search": "maximum sum of a subarray of length k. write the fixed-window version, not the kadane version. java int maxsum(int[] a, int k) { if (a.length < k) throw new illegalargumentexception(\"k\"); int sum = 0, best; for (int i = 0; i < k; i++) sum += a[i]; best = sum; for (int i = k; i < a.length; i++) { sum += a[i] - a[i - k]; best = math.max(best, sum); } return best; } this is not kadane. kadane is any subarray; this is exactly k. empty / k n is a precondition, not a clever return."}, {"n": 20, "category": 2, "difficulty": "T", "html": "Longest substring without repeating characters. Where do candidates off-by-one, and what is the invariant that prevents it?", "answerTitle": "Longest substring without repeating characters", "answer": "<p>Last-seen index, not a set you rebuild. Off-by-one is <code>r - l<\/code> versus <code>r - l + 1<\/code>, and moving <code>l<\/code> to <code>last[c]<\/code> instead of <code>last[c] + 1<\/code>.<\/p><pre><code class=\"lang-java\">int lengthOfLongestSubstring(String s) {\n    int[] last = new int[256];\n    Arrays.fill(last, -1);\n    int best = 0, l = 0;\n    for (int r = 0; r &lt; s.length(); r++) {\n        char c = s.charAt(r);\n        if (last[c] &gt;= l) l = last[c] + 1;\n        last[c] = r;\n        best = Math.max(best, r - l + 1);\n    }\n    return best;\n}<\/code><\/pre><p>Invariant: <code>[l, r]<\/code> has unique characters. Empty string and all-unique / all-same are the three tests.<\/p>", "source": "answers.md", "search": "longest substring without repeating characters. where do candidates off-by-one, and what is the invariant that prevents it? last-seen index, not a set you rebuild. off-by-one is r - l versus r - l + 1, and moving l to last[c] instead of last[c] + 1. java int lengthoflongestsubstring(string s) { int[] last = new int[256]; arrays.fill(last, -1); int best = 0, l = 0; for (int r = 0; r < s.length(); r++) { char c = s.charat(r); if (last[c] = l) l = last[c] + 1; last[c] = r; best = math.max(best, r - l + 1); } return best; } invariant: [l, r] has unique characters. empty string and all-unique / all-same are the three tests."}, {"n": 21, "category": 2, "difficulty": "D", "html": "Minimum window substring. State the owed-count trick and write the shrink step.", "answerTitle": "Minimum window substring", "answer": "<p><code>need<\/code> is the count of characters still owed. When you add a useful character, <code>need--<\/code>. When <code>need == 0<\/code> the window is valid; shrink from the left, and each time you evict a useful character <code>need++<\/code>.<\/p><pre><code class=\"lang-java\">String minWindow(String s, String t) {\n    int[] owe = new int[128];\n    for (int i = 0; i &lt; t.length(); i++) owe[t.charAt(i)]++;\n    int need = t.length(), best = Integer.MAX_VALUE, start = 0;\n    for (int r = 0, l = 0; r &lt; s.length(); r++) {\n        if (owe[s.charAt(r)]-- &gt; 0) need--;\n        while (need == 0) {\n            if (r - l + 1 &lt; best) { best = r - l + 1; start = l; }\n            if (owe[s.charAt(l++)]++ == 0) need++;\n        }\n    }\n    return best == Integer.MAX_VALUE ? &quot;&quot; : s.substring(start, start + best);\n}<\/code><\/pre><p>The <code>&gt; 0<\/code> / <code>== 0<\/code> on the owe array is the whole trick: extras are allowed and do not change <code>need<\/code>.<\/p>", "source": "answers.md", "search": "minimum window substring. state the owed-count trick and write the shrink step. need is the count of characters still owed. when you add a useful character, need--. when need == 0 the window is valid; shrink from the left, and each time you evict a useful character need++. java string minwindow(string s, string t) { int[] owe = new int[128]; for (int i = 0; i < t.length(); i++) owe[t.charat(i)]++; int need = t.length(), best = integer.max_value, start = 0; for (int r = 0, l = 0; r < s.length(); r++) { if (owe[s.charat(r)]-- 0) need--; while (need == 0) { if (r - l + 1 < best) { best = r - l + 1; start = l; } if (owe[s.charat(l++)]++ == 0) need++; } } return best == integer.max_value ? \"\" : s.substring(start, start + best); } the 0 / == 0 on the owe array is the whole trick: extras are allowed and do not change need."}, {"n": 22, "category": 2, "difficulty": "D", "html": "Kadane&#x27;s algorithm: maximum subarray sum. Write it, then say what changes for &quot;maximum product&quot; and why that is not the same idea.", "answerTitle": "Kadane, and why product is different", "answer": "<pre><code class=\"lang-java\">int maxSubArray(int[] a) {\n    int best = a[0], cur = a[0];\n    for (int i = 1; i &lt; a.length; i++) {\n        cur = Math.max(a[i], cur + a[i]);\n        best = Math.max(best, cur);\n    }\n    return best;\n}<\/code><\/pre><p>Maximum <em>product<\/em> must track both min and max because a negative times a min flips sign. That is two running values, not Kadane. Empty array is a spec question; the usual contract is <code>a.length &gt;= 1<\/code>.<\/p>", "source": "answers.md", "search": "kadane's algorithm: maximum subarray sum. write it, then say what changes for \"maximum product\" and why that is not the same idea. java int maxsubarray(int[] a) { int best = a[0], cur = a[0]; for (int i = 1; i < a.length; i++) { cur = math.max(a[i], cur + a[i]); best = math.max(best, cur); } return best; } maximum product must track both min and max because a negative times a min flips sign. that is two running values, not kadane. empty array is a spec question; the usual contract is a.length = 1."}, {"n": 23, "category": 2, "difficulty": "D", "html": "Prefix sums: range sum in O(1) after O(n) preprocess. Write <code>prefix[i]<\/code> as &quot;sum of the first i&quot;, and show the off-by-one that interviewers wait for.", "answerTitle": "Prefix sums and the off-by-one", "answer": "<p>Define <code>prefix[0] = 0<\/code>, <code>prefix[i] = a[0] + … + a[i-1]<\/code>. Range <code>a[L..=R]<\/code> is <code>prefix[R+1] - prefix[L]<\/code>. The interviewer waits for <code>prefix[R] - prefix[L]<\/code> on a 1-based mental model. Inclusive/exclusive is the whole game - say it.<\/p>", "source": "answers.md", "search": "prefix sums: range sum in o(1) after o(n) preprocess. write prefix[i] as \"sum of the first i\", and show the off-by-one that interviewers wait for. define prefix[0] = 0, prefix[i] = a[0] + … + a[i-1]. range a[l..=r] is prefix[r+1] - prefix[l]. the interviewer waits for prefix[r] - prefix[l] on a 1-based mental model. inclusive/exclusive is the whole game - say it."}, {"n": 24, "category": 2, "difficulty": "T", "html": "Subarray sum equals k, with negatives allowed. Why does a sliding window fail, and what does the prefix-frequency map actually store?", "answerTitle": "Subarray sum equals k, negatives allowed", "answer": "<p>A sliding window assumes you can tell which end to move from the sign of the error. Negatives break monotonicity. Store how many prefixes have seen <code>sum - k<\/code>:<\/p><pre><code class=\"lang-java\">int subarraySum(int[] a, int k) {\n    Map&lt;Integer, Integer&gt; freq = new HashMap&lt;&gt;();\n    freq.put(0, 1);\n    int sum = 0, ans = 0;\n    for (int x : a) {\n        sum += x;\n        ans += freq.getOrDefault(sum - k, 0);\n        freq.merge(sum, 1, Integer::sum);\n    }\n    return ans;\n}<\/code><\/pre><p>The map stores <em>counts of prefix values<\/em>, not indices, because the question is &quot;how many&quot;, not &quot;is there&quot;.<\/p>", "source": "answers.md", "search": "subarray sum equals k, with negatives allowed. why does a sliding window fail, and what does the prefix-frequency map actually store? a sliding window assumes you can tell which end to move from the sign of the error. negatives break monotonicity. store how many prefixes have seen sum - k: java int subarraysum(int[] a, int k) { map<integer, integer freq = new hashmap< (); freq.put(0, 1); int sum = 0, ans = 0; for (int x : a) { sum += x; ans += freq.getordefault(sum - k, 0); freq.merge(sum, 1, integer::sum); } return ans; } the map stores counts of prefix values , not indices, because the question is \"how many\", not \"is there\"."}, {"n": 25, "category": 2, "difficulty": "D", "html": "Product of array except self, without division. Write the two-pass version and the O(1)-extra-space version, and say what &quot;O(1) extra&quot; is allowed to ignore.", "answerTitle": "Product except self", "answer": "<p>Two passes: <code>out[i]<\/code> gets the product of the left, then a running right product multiplies on the way back. O(1) extra is allowed to ignore the output array. Zeros: one zero puts zeros everywhere except at that index; two zeros zeros the lot. Do not divide - a zero in the input makes division illegal, which is why the question bans it.<\/p>", "source": "answers.md", "search": "product of array except self, without division. write the two-pass version and the o(1)-extra-space version, and say what \"o(1) extra\" is allowed to ignore. two passes: out[i] gets the product of the left, then a running right product multiplies on the way back. o(1) extra is allowed to ignore the output array. zeros: one zero puts zeros everywhere except at that index; two zeros zeros the lot. do not divide - a zero in the input makes division illegal, which is why the question bans it."}, {"n": 26, "category": 2, "difficulty": "D", "html": "Dutch national flag: sort an array of 0, 1, 2 in one pass. Write the three-pointer version and name the invariant for each region.", "answerTitle": "Dutch national flag", "answer": "<pre><code class=\"lang-java\">void sortColors(int[] a) {\n    int l = 0, i = 0, r = a.length - 1;\n    while (i &lt;= r) {\n        if (a[i] == 0) swap(a, l++, i++);\n        else if (a[i] == 2) swap(a, i, r--);   // do not i++\n        else i++;\n    }\n}<\/code><\/pre><p><code>[0, l)<\/code> is 0s, <code>[l, i)<\/code> is 1s, <code>(r, n)<\/code> is 2s, <code>[i, r]<\/code> is unknown. The <code>i++<\/code> you must not take on a 2 is the bug.<\/p>", "source": "answers.md", "search": "dutch national flag: sort an array of 0, 1, 2 in one pass. write the three-pointer version and name the invariant for each region. java void sortcolors(int[] a) { int l = 0, i = 0, r = a.length - 1; while (i <= r) { if (a[i] == 0) swap(a, l++, i++); else if (a[i] == 2) swap(a, i, r--); // do not i++ else i++; } } [0, l) is 0s, [l, i) is 1s, (r, n) is 2s, [i, r] is unknown. the i++ you must not take on a 2 is the bug."}, {"n": 27, "category": 2, "difficulty": "T", "html": "Rotate an array by k places, in place. Give the reversal method, and the bug when <code>k &gt; n<\/code> or <code>k<\/code> is negative.", "answerTitle": "Rotate by k", "answer": "<p><code>k %= n<\/code>, and if <code>k &lt; 0<\/code> add <code>n<\/code>. Reverse all, reverse the first k, reverse the rest. <code>k &gt; n<\/code> without the mod writes off the end or no-ops wrongly. <code>n == 0<\/code> is a guard.<\/p>", "source": "answers.md", "search": "rotate an array by k places, in place. give the reversal method, and the bug when k n or k is negative. k %= n, and if k < 0 add n. reverse all, reverse the first k, reverse the rest. k n without the mod writes off the end or no-ops wrongly. n == 0 is a guard."}, {"n": 28, "category": 2, "difficulty": "D", "html": "Trapping rain water. Explain the two-pointer height argument, and why a stack solution is the one you mention but do not write first.", "answerTitle": "Trapping rain water", "answer": "<p>At <code>l<\/code> and <code>r<\/code>, the water on the smaller side is bounded by that side&#x27;s running max. Move the smaller side. Stack of indices is the &quot;next greater&quot; reading of the same idea - mention it, write the two-pointer: O(n) time, O(1) extra.<\/p>", "source": "answers.md", "search": "trapping rain water. explain the two-pointer height argument, and why a stack solution is the one you mention but do not write first. at l and r, the water on the smaller side is bounded by that side's running max. move the smaller side. stack of indices is the \"next greater\" reading of the same idea - mention it, write the two-pointer: o(n) time, o(1) extra."}, {"n": 29, "category": 2, "difficulty": "D", "html": "Merge two sorted arrays where the first has unused tail capacity. Write it from the back, and say why from the front is wrong.", "answerTitle": "Merge into the tail", "answer": "<p><code>A<\/code> has capacity <code>m + n<\/code>. Write from the back so you never overwrite an unconsumed value of <code>A<\/code>. From the front you would need a buffer. Three pointers: <code>i = m-1<\/code>, <code>j = n-1<\/code>, <code>w = m+n-1<\/code>.<\/p>", "source": "answers.md", "search": "merge two sorted arrays where the first has unused tail capacity. write it from the back, and say why from the front is wrong. a has capacity m + n. write from the back so you never overwrite an unconsumed value of a. from the front you would need a buffer. three pointers: i = m-1, j = n-1, w = m+n-1."}, {"n": 30, "category": 2, "difficulty": "A", "html": "You are given a 10⁸-element stream and must maintain the sum of the last k distinct values. Design the structure and the complexity.", "answerTitle": "Last k distinct on a 10⁸ stream", "answer": "<p>A <code>LinkedHashSet<\/code> (insertion-order set) plus a running sum: on each value, if already present remove and re-add to refresh order; if size exceeds k, evict the oldest and subtract. O(1) amortized per event, O(k) memory. A heap is the wrong shape - you need recency, not magnitude.<\/p>", "source": "answers.md", "search": "you are given a 10⁸-element stream and must maintain the sum of the last k distinct values. design the structure and the complexity. a linkedhashset (insertion-order set) plus a running sum: on each value, if already present remove and re-add to refresh order; if size exceeds k, evict the oldest and subtract. o(1) amortized per event, o(k) memory. a heap is the wrong shape - you need recency, not magnitude."}, {"n": 31, "category": 3, "difficulty": "C", "html": "Two-sum in an unsorted array. Write the one-pass <code>HashMap<\/code> and name the &quot;use yourself&quot; trap.", "answerTitle": "Two-sum unsorted, one pass", "answer": "<pre><code class=\"lang-java\">int[] twoSum(int[] a, int t) {\n    Map&lt;Integer, Integer&gt; seen = new HashMap&lt;&gt;();\n    for (int i = 0; i &lt; a.length; i++) {\n        Integer j = seen.get(t - a[i]);\n        if (j != null) return new int[] { j, i };\n        seen.put(a[i], i);\n    }\n    throw new IllegalArgumentException(&quot;none&quot;);\n}<\/code><\/pre><p>The &quot;use yourself&quot; trap is putting <code>a[i]<\/code> into the map <em>before<\/em> the lookup when <code>t == 2 * a[i]<\/code>. Put after. Duplicates are legal; the map keeps the latest or the first - either is fine if you look up first.<\/p>", "source": "answers.md", "search": "two-sum in an unsorted array. write the one-pass hashmap and name the \"use yourself\" trap. java int[] twosum(int[] a, int t) { map<integer, integer seen = new hashmap< (); for (int i = 0; i < a.length; i++) { integer j = seen.get(t - a[i]); if (j != null) return new int[] { j, i }; seen.put(a[i], i); } throw new illegalargumentexception(\"none\"); } the \"use yourself\" trap is putting a[i] into the map before the lookup when t == 2 a[i]. put after. duplicates are legal; the map keeps the latest or the first - either is fine if you look up first."}, {"n": 32, "category": 3, "difficulty": "C", "html": "Group anagrams. What is the key, why is a sorted <code>char[]<\/code> acceptable, and when do you count letters instead?", "answerTitle": "Group anagrams", "answer": "<p>Key is <code>char[]<\/code> sorted, wrapped as <code>new String(cs)<\/code>, or a 26-int count encoded as a string. Sorted key is O(k log k) per word and is what you write. Count key is O(k) and wins on long words. Do not use <code>int[]<\/code> as a <code>HashMap<\/code> key - it compares by identity.<\/p>", "source": "answers.md", "search": "group anagrams. what is the key, why is a sorted char[] acceptable, and when do you count letters instead? key is char[] sorted, wrapped as new string(cs), or a 26-int count encoded as a string. sorted key is o(k log k) per word and is what you write. count key is o(k) and wins on long words. do not use int[] as a hashmap key - it compares by identity."}, {"n": 33, "category": 3, "difficulty": "T", "html": "You put a mutable key into a <code>HashSet<\/code>, then mutate a field used by <code>hashCode<\/code>. What can you still observe, and what can you not?", "answerTitle": "Mutating a `HashSet` key", "answer": "<p>The entry stays in the old bucket. <code>contains<\/code> / <code>remove<\/code> of the mutated object miss; iteration still returns it; <code>size<\/code> is unchanged. It is a leak. Same story as <code>01-java<\/code> Q2 on <code>HashMap<\/code>. Keys must be immutable in the fields that <code>equals<\/code>/<code>hashCode<\/code> read.<\/p>", "source": "answers.md", "search": "you put a mutable key into a hashset, then mutate a field used by hashcode. what can you still observe, and what can you not? the entry stays in the old bucket. contains / remove of the mutated object miss; iteration still returns it; size is unchanged. it is a leak. same story as 01-java q2 on hashmap. keys must be immutable in the fields that equals/hashcode read."}, {"n": 34, "category": 3, "difficulty": "D", "html": "<code>computeIfAbsent<\/code> versus <code>get<\/code> then <code>put<\/code>. Write the frequency-map idiom, and the nested-map idiom that <code>computeIfAbsent<\/code> makes safe.", "answerTitle": "`computeIfAbsent` idioms", "answer": "<pre><code class=\"lang-java\">freq.merge(word, 1, Integer::sum);\nmap.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;()).add(value);<\/code><\/pre><p><code>get<\/code> then <code>put<\/code> of a new list races with yourself on a nested structure and is two lookups. <code>computeIfAbsent<\/code> is one, and it must not recurse into the same map (it is fail-fast on that). Do not use <code>computeIfAbsent<\/code> for a value whose constructor is expensive and can throw after the map has already reserved the key - know the JDK version; modern JDKs only insert on success.<\/p>", "source": "answers.md", "search": "computeifabsent versus get then put. write the frequency-map idiom, and the nested-map idiom that computeifabsent makes safe. java freq.merge(word, 1, integer::sum); map.computeifabsent(key, k - new arraylist< ()).add(value); get then put of a new list races with yourself on a nested structure and is two lookups. computeifabsent is one, and it must not recurse into the same map (it is fail-fast on that). do not use computeifabsent for a value whose constructor is expensive and can throw after the map has already reserved the key - know the jdk version; modern jdks only insert on success."}, {"n": 35, "category": 3, "difficulty": "D", "html": "<code>LinkedHashMap<\/code> as an insertion-order list and as an access-order LRU. Which methods trigger access order, and which do not?", "answerTitle": "`LinkedHashMap` order", "answer": "<p>Insertion-order is the default. Access-order is <code>new LinkedHashMap&lt;&gt;(n, 0.75f, true)<\/code>. <code>get<\/code>, <code>getOrDefault<\/code>, <code>put<\/code>, <code>putIfAbsent<\/code>, <code>compute<\/code>, <code>merge<\/code> count as access; <code>containsKey<\/code> does <strong>not<\/strong>. Override <code>removeEldestEntry<\/code> for an LRU (Q243, Q251).<\/p>", "source": "answers.md", "search": "linkedhashmap as an insertion-order list and as an access-order lru. which methods trigger access order, and which do not? insertion-order is the default. access-order is new linkedhashmap< (n, 0.75f, true). get, getordefault, put, putifabsent, compute, merge count as access; containskey does not . override removeeldestentry for an lru (q243, q251)."}, {"n": 36, "category": 3, "difficulty": "T", "html": "<code>IdentityHashMap<\/code> and <code>EnumMap<\/code>. When is each the right tool, and what bug does <code>IdentityHashMap<\/code> hide if you used it by accident?", "answerTitle": "`IdentityHashMap` and `EnumMap`", "answer": "<p><code>EnumMap<\/code> is the default for enum keys - array-backed, no hash, no <code>null<\/code> keys. <code>IdentityHashMap<\/code> uses <code>==<\/code> and <code>System.identityHashCode<\/code>; it is the right tool for an object-identity graph clone (Q141, Q96). Used by accident, two equal <code>String<\/code> keys are two entries and you &quot;lose&quot; updates. It also allows a <code>null<\/code> key.<\/p>", "source": "answers.md", "search": "identityhashmap and enummap. when is each the right tool, and what bug does identityhashmap hide if you used it by accident? enummap is the default for enum keys - array-backed, no hash, no null keys. identityhashmap uses == and system.identityhashcode; it is the right tool for an object-identity graph clone (q141, q96). used by accident, two equal string keys are two entries and you \"lose\" updates. it also allows a null key."}, {"n": 37, "category": 3, "difficulty": "D", "html": "Counting sort versus a <code>HashMap&lt;Integer, Integer&gt;<\/code> frequency table. When is the array faster, and when is it a memory bomb?", "answerTitle": "Counting array versus `HashMap` frequency", "answer": "<p>If the domain is <code>0..K<\/code> and K is ~n or smaller, <code>int[K+1]<\/code> is faster and kinder to the cache. If the domain is <code>Integer<\/code> or the span is 10⁹, the array is a memory bomb and you use a map of <em>observed<\/em> keys. Negative values need an offset or a map; do not silently clip.<\/p>", "source": "answers.md", "search": "counting sort versus a hashmap<integer, integer frequency table. when is the array faster, and when is it a memory bomb? if the domain is 0..k and k is ~n or smaller, int[k+1] is faster and kinder to the cache. if the domain is integer or the span is 10⁹, the array is a memory bomb and you use a map of observed keys. negative values need an offset or a map; do not silently clip."}, {"n": 38, "category": 3, "difficulty": "D", "html": "First unique character in a stream. Design it, then the &quot;first unique in a string&quot; interview version.", "answerTitle": "First unique in a stream", "answer": "<p><code>LinkedHashMap&lt;Char, Boolean&gt;<\/code> of &quot;still unique&quot;, plus a set of seen-twice. On each char, if new insert; if already unique remove from the map and add to the twice-set; if twice ignore. The first key of the map is the answer. The string version is a 26-count plus a second pass, which you write if the input is static.<\/p>", "source": "answers.md", "search": "first unique character in a stream. design it, then the \"first unique in a string\" interview version. linkedhashmap<char, boolean of \"still unique\", plus a set of seen-twice. on each char, if new insert; if already unique remove from the map and add to the twice-set; if twice ignore. the first key of the map is the answer. the string version is a 26-count plus a second pass, which you write if the input is static."}, {"n": 39, "category": 3, "difficulty": "D", "html": "Longest consecutive sequence in O(n). Why does the &quot;only start from the left edge&quot; trick make the inner loop honest?", "answerTitle": "Longest consecutive sequence", "answer": "<p>Put everything in a <code>HashSet<\/code>. Start a run only when <code>x - 1<\/code> is <em>not<\/em> in the set, then walk <code>x+1, x+2, …<\/code>. Each number is in at most one walk, so the inner loop is honest O(n). Starting a walk from every x is O(n²) on a single run.<\/p>", "source": "answers.md", "search": "longest consecutive sequence in o(n). why does the \"only start from the left edge\" trick make the inner loop honest? put everything in a hashset. start a run only when x - 1 is not in the set, then walk x+1, x+2, …. each number is in at most one walk, so the inner loop is honest o(n). starting a walk from every x is o(n²) on a single run."}, {"n": 40, "category": 3, "difficulty": "T", "html": "<code>map.get(key) == null<\/code> versus <code>!map.containsKey(key)<\/code>. When are they different, and which one do you write in a frequency map that stores zero?", "answerTitle": "`get == null` versus `containsKey`", "answer": "<p>They differ when <code>null<\/code> is a stored value. <code>HashMap<\/code> allows one <code>null<\/code> key and null values; <code>ConcurrentHashMap<\/code> and <code>Map.of<\/code> do not. In a frequency map that can store zero, use <code>getOrDefault<\/code> or <code>containsKey<\/code>. Never use <code>get == null<\/code> to mean &quot;absent&quot; if you ever <code>put(key, null)<\/code>.<\/p>", "source": "answers.md", "search": "map.get(key) == null versus !map.containskey(key). when are they different, and which one do you write in a frequency map that stores zero? they differ when null is a stored value. hashmap allows one null key and null values; concurrenthashmap and map.of do not. in a frequency map that can store zero, use getordefault or containskey. never use get == null to mean \"absent\" if you ever put(key, null)."}, {"n": 41, "category": 3, "difficulty": "D", "html": "Anagram of a substring, permutation-in-string. Write the sliding window over a 26-slot count, and the early-exit condition.", "answerTitle": "Permutation in string", "answer": "<p>A window of <code>t.length()<\/code> over <code>s<\/code>, a 26-count of owed characters, and a <code>need<\/code> of how many slots are still wrong. Slide, adjust the exiting and entering char, succeed when <code>need == 0<\/code>. Early-exit if <code>s.length() &lt; t.length()<\/code>.<\/p>", "source": "answers.md", "search": "anagram of a substring, permutation-in-string. write the sliding window over a 26-slot count, and the early-exit condition. a window of t.length() over s, a 26-count of owed characters, and a need of how many slots are still wrong. slide, adjust the exiting and entering char, succeed when need == 0. early-exit if s.length() < t.length()."}, {"n": 42, "category": 3, "difficulty": "D", "html": "Design a <code>Set<\/code> of pairs without allocating a wrapper class. What do you do instead, and when is that a mistake?", "answerTitle": "A set of pairs without a wrapper", "answer": "<p>Pack two <code>int<\/code>s into a <code>long<\/code> (<code>((long) a &lt;&lt; 32) ^ (b &amp; 0xffffffffL)<\/code>) when the domain fits. That is a mistake when <code>a<\/code> already needs 32 bits <em>and<\/em> you wanted a signed pair, or when you will later want three fields - then write a <code>record Pair(int a, int b)<\/code>. Do not use <code>List.of(a, b)<\/code> as a key in a hot path; it allocates.<\/p>", "source": "answers.md", "search": "design a set of pairs without allocating a wrapper class. what do you do instead, and when is that a mistake? pack two ints into a long (((long) a << 32) ^ (b & 0xffffffffl)) when the domain fits. that is a mistake when a already needs 32 bits and you wanted a signed pair, or when you will later want three fields - then write a record pair(int a, int b). do not use list.of(a, b) as a key in a hot path; it allocates."}, {"n": 43, "category": 3, "difficulty": "D", "html": "Collision behaviour you can actually observe: many keys with the same hash. What happens to <code>get<\/code> in Java 8+, and what do you say if asked to force it?", "answerTitle": "Observable collisions", "answer": "<p>Java 8+ treeifies a bin of <code>Comparable<\/code> keys at 8 entries (and the table capacity at least 64). <code>get<\/code> degrades from O(1) to O(log bin). You do not try to force this in a round; you say &quot;adversarial hashes plus a bad <code>hashCode<\/code> make bins long, and we once saw get at tens of microseconds on a key whose hash was constant&quot; - that is S1 / Q44.<\/p>", "source": "answers.md", "search": "collision behaviour you can actually observe: many keys with the same hash. what happens to get in java 8+, and what do you say if asked to force it? java 8+ treeifies a bin of comparable keys at 8 entries (and the table capacity at least 64). get degrades from o(1) to o(log bin). you do not try to force this in a round; you say \"adversarial hashes plus a bad hashcode make bins long, and we once saw get at tens of microseconds on a key whose hash was constant\" - that is s1 / q44."}, {"n": 44, "category": 3, "difficulty": "A", "html": "A service is seeing <code>HashMap<\/code> get/put at 40 µs instead of 40 ns. Walk the diagnostic: load factor, hash quality, GC, resize, and the rewrite you would actually ship.", "answerTitle": "40 µs HashMap get", "answer": "<p>Diagnostic order: is <code>hashCode<\/code> constant or colliding (S1); is the map being resized on the hot path (pre-size); is the key mutating (Q33); is the pause GC, not the map; is the map actually a <code>TreeMap<\/code> or synchronized wrapper. The rewrite you ship is an identity key, a perfect hash, or a stripped <code>int[]<\/code> + open addressing if the domain is dense. Do not &quot;tune load factor&quot; as the first move.<\/p>", "source": "answers.md", "search": "a service is seeing hashmap get/put at 40 µs instead of 40 ns. walk the diagnostic: load factor, hash quality, gc, resize, and the rewrite you would actually ship. diagnostic order: is hashcode constant or colliding (s1); is the map being resized on the hot path (pre-size); is the key mutating (q33); is the pause gc, not the map; is the map actually a treemap or synchronized wrapper. the rewrite you ship is an identity key, a perfect hash, or a stripped int[] + open addressing if the domain is dense. do not \"tune load factor\" as the first move."}, {"n": 45, "category": 3, "difficulty": "A", "html": "Multiset, bidimap, and &quot;map of lists&quot; keep appearing. When do you pull in Guava or a record, and when do you keep a raw <code>HashMap<\/code>?", "answerTitle": "Multiset, bidimap, map-of-lists", "answer": "<p>Keep a raw <code>HashMap<\/code> plus <code>merge<\/code> / <code>computeIfAbsent<\/code> until the third call site wants the same structure. Then a <code>record<\/code> and two small methods, or Guava <code>Multimap<\/code> / <code>BiMap<\/code> if the project already has it. Pulling Guava for one <code>HashMultiset<\/code> in an interview is a smell; saying &quot;I would&quot; is not.<\/p>", "source": "answers.md", "search": "multiset, bidimap, and \"map of lists\" keep appearing. when do you pull in guava or a record, and when do you keep a raw hashmap? keep a raw hashmap plus merge / computeifabsent until the third call site wants the same structure. then a record and two small methods, or guava multimap / bimap if the project already has it. pulling guava for one hashmultiset in an interview is a smell; saying \"i would\" is not."}, {"n": 46, "category": 4, "difficulty": "C", "html": "Write binary search over a sorted <code>int[]<\/code> that returns the index or <code>-1<\/code>. State the loop invariant and the overflow-safe <code>mid<\/code>.", "answerTitle": "Binary search, invariant and safe mid", "answer": "<pre><code class=\"lang-java\">int indexOf(int[] a, int t) {\n    int lo = 0, hi = a.length - 1;\n    while (lo &lt;= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (a[mid] == t) return mid;\n        if (a[mid] &lt; t) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}<\/code><\/pre><p>Invariant: if <code>t<\/code> is present it is in <code>a[lo..=hi]<\/code>. Empty array returns -1. Duplicates: this returns <em>a<\/em> hit, not the first (Q50).<\/p>", "source": "answers.md", "search": "write binary search over a sorted int[] that returns the index or -1. state the loop invariant and the overflow-safe mid. java int indexof(int[] a, int t) { int lo = 0, hi = a.length - 1; while (lo <= hi) { int mid = lo + (hi - lo) / 2; if (a[mid] == t) return mid; if (a[mid] < t) lo = mid + 1; else hi = mid - 1; } return -1; } invariant: if t is present it is in a[lo..=hi]. empty array returns -1. duplicates: this returns a hit, not the first (q50)."}, {"n": 47, "category": 4, "difficulty": "D", "html": "Lower bound and upper bound. Write both, and say which one <code>Arrays.binarySearch<\/code> is <em>not<\/em>.", "answerTitle": "Lower and upper bound", "answer": "<p>Lower bound: first index <code>i<\/code> with <code>a[i] &gt;= t<\/code> (or <code>n<\/code>). Upper bound: first <code>i<\/code> with <code>a[i] &gt; t<\/code>. <code>Arrays.binarySearch<\/code> returns <em>an<\/em> index of an exact hit, or <code>-(insertionPoint) - 1<\/code>. It is neither bound. Write the loop with <code>hi = n<\/code> and <code>lo &lt; hi<\/code>, assigning <code>hi = mid<\/code> or <code>lo = mid + 1<\/code>.<\/p>", "source": "answers.md", "search": "lower bound and upper bound. write both, and say which one arrays.binarysearch is not . lower bound: first index i with a[i] = t (or n). upper bound: first i with a[i] t. arrays.binarysearch returns an index of an exact hit, or -(insertionpoint) - 1. it is neither bound. write the loop with hi = n and lo < hi, assigning hi = mid or lo = mid + 1."}, {"n": 48, "category": 4, "difficulty": "T", "html": "<code>(lo + hi) / 2<\/code> versus <code>lo + (hi - lo) / 2<\/code>. Show the overflow, and say whether it still happens with <code>int<\/code> indices in a normal round.", "answerTitle": "Mid overflow", "answer": "<p><code>lo + hi<\/code> overflows a signed <code>int<\/code> when both are large (the classic <code>Integer.MAX_VALUE<\/code> pair). <code>lo + (hi - lo) / 2<\/code> does not, because <code>hi - lo<\/code> fits if they are valid indices. In a <em>normal<\/em> <code>int[]<\/code> the last index is <code>Integer.MAX_VALUE - 1<\/code> at theoretical max, so <code>lo + hi<\/code> can still overflow. Write the safe form by habit. This is S8.<\/p>", "source": "answers.md", "search": "(lo + hi) / 2 versus lo + (hi - lo) / 2. show the overflow, and say whether it still happens with int indices in a normal round. lo + hi overflows a signed int when both are large (the classic integer.max_value pair). lo + (hi - lo) / 2 does not, because hi - lo fits if they are valid indices. in a normal int[] the last index is integer.max_value - 1 at theoretical max, so lo + hi can still overflow. write the safe form by habit. this is s8."}, {"n": 49, "category": 4, "difficulty": "D", "html": "Search in a rotated sorted array. How do you decide which half is sorted, and what does a duplicate do to the argument?", "answerTitle": "Rotated sorted array", "answer": "<p>One half of <code>[lo, hi]<\/code> is always sorted (no duplicates). If <code>a[lo] &lt;= a[mid]<\/code>, the left is sorted; ask whether <code>t<\/code> lies in <code>[a[lo], a[mid])<\/code>. Duplicates (<code>a[lo] == a[mid] == a[hi]<\/code>) make that test lie - you can only shrink <code>hi--<\/code> and the worst case becomes O(n). Say that before you are asked.<\/p>", "source": "answers.md", "search": "search in a rotated sorted array. how do you decide which half is sorted, and what does a duplicate do to the argument? one half of [lo, hi] is always sorted (no duplicates). if a[lo] <= a[mid], the left is sorted; ask whether t lies in [a[lo], a[mid]). duplicates (a[lo] == a[mid] == a[hi]) make that test lie - you can only shrink hi-- and the worst case becomes o(n). say that before you are asked."}, {"n": 50, "category": 4, "difficulty": "D", "html": "Find the first and last position of a target. Why is this two binary searches, not one plus a scan?", "answerTitle": "First and last position", "answer": "<p>Two bound searches, not a hit plus a linear scan: the scan is O(n) on an all-equal array, which is the case they will feed you. Lower bound of <code>t<\/code> and lower bound of <code>t+1<\/code> (or upper bound of <code>t<\/code>) minus one. Missing target: lower bound is out of range or not equal.<\/p>", "source": "answers.md", "search": "find the first and last position of a target. why is this two binary searches, not one plus a scan? two bound searches, not a hit plus a linear scan: the scan is o(n) on an all-equal array, which is the case they will feed you. lower bound of t and lower bound of t+1 (or upper bound of t) minus one. missing target: lower bound is out of range or not equal."}, {"n": 51, "category": 4, "difficulty": "T", "html": "Binary search on a <code>double<\/code> domain. What is the termination condition if you cannot test equality, and what goes wrong with a fixed iteration count that is too small?", "answerTitle": "Binary search on doubles", "answer": "<p>Terminate on a domain width (<code>hi - lo &gt; 1e-9<\/code>) <em>or<\/em> a fixed iteration count (~100 is enough for IEEE doubles). A too-small iteration count leaves a wrong integer answer after you floor. A too-tight epsilon on a huge domain never finishes. Prefer a fixed 80–100 iterations and say so.<\/p>", "source": "answers.md", "search": "binary search on a double domain. what is the termination condition if you cannot test equality, and what goes wrong with a fixed iteration count that is too small? terminate on a domain width (hi - lo 1e-9) or a fixed iteration count (~100 is enough for ieee doubles). a too-small iteration count leaves a wrong integer answer after you floor. a too-tight epsilon on a huge domain never finishes. prefer a fixed 80–100 iterations and say so."}, {"n": 52, "category": 4, "difficulty": "D", "html": "Binary-search-on-answer: koko eating bananas / capacity to ship packages. What makes a predicate monotonic, and how do you prove it in one sentence?", "answerTitle": "Binary search on the answer", "answer": "<p>The predicate <code>feasible(x)<\/code> is &quot;can I finish / ship / eat at budget x&quot;. It is monotonic: if x works, x+1 works. Search the budget. Prove monotonicity in one sentence: <em>&quot;more capacity can only make the same packing easier&quot;<\/em>. If that sentence is false, it is not this pattern (Q24&#x27;s negatives).<\/p>", "source": "answers.md", "search": "binary-search-on-answer: koko eating bananas / capacity to ship packages. what makes a predicate monotonic, and how do you prove it in one sentence? the predicate feasible(x) is \"can i finish / ship / eat at budget x\". it is monotonic: if x works, x+1 works. search the budget. prove monotonicity in one sentence: \"more capacity can only make the same packing easier\" . if that sentence is false, it is not this pattern (q24's negatives)."}, {"n": 53, "category": 4, "difficulty": "D", "html": "Median of two sorted arrays. Sketch the partition approach and the invariant on the left-half count.", "answerTitle": "Median of two sorted arrays", "answer": "<p>Partition both arrays so the left half has <code>(n+m+1)/2<\/code> elements and <code>maxLeft &lt;= minRight<\/code> across the cut. Binary-search the cut on the shorter array. Odd total → max of lefts; even → average of max-left and min-right. You do not merge. O(log min(n, m)).<\/p>", "source": "answers.md", "search": "median of two sorted arrays. sketch the partition approach and the invariant on the left-half count. partition both arrays so the left half has (n+m+1)/2 elements and maxleft <= minright across the cut. binary-search the cut on the shorter array. odd total → max of lefts; even → average of max-left and min-right. you do not merge. o(log min(n, m))."}, {"n": 54, "category": 4, "difficulty": "D", "html": "<code>Arrays.sort<\/code> on <code>int[]<\/code> versus <code>Integer[]<\/code> versus <code>Object[]<\/code>. Why are the algorithms different, and when does that change your complexity story?", "answerTitle": "`Arrays.sort` dual path", "answer": "<p><code>int[]<\/code> (and other primitives) use dual-pivot quicksort, not stable, O(n log n) typical. <code>Object[]<\/code> / boxed uses TimSort, stable, O(n log n) worst, exploits runs. <code>Integer[]<\/code> pays boxing and TimSort. Your complexity story changes when you promised stability or when you sorted a primitive to dodge comparators.<\/p>", "source": "answers.md", "search": "arrays.sort on int[] versus integer[] versus object[]. why are the algorithms different, and when does that change your complexity story? int[] (and other primitives) use dual-pivot quicksort, not stable, o(n log n) typical. object[] / boxed uses timsort, stable, o(n log n) worst, exploits runs. integer[] pays boxing and timsort. your complexity story changes when you promised stability or when you sorted a primitive to dodge comparators."}, {"n": 55, "category": 4, "difficulty": "T", "html": "A <code>Comparator<\/code> implemented as <code>return a - b<\/code>. Show the overflow, and write the replacement.", "answerTitle": "`return a - b`", "answer": "<p><code>Integer.MIN_VALUE - 1<\/code> (or <code>a = MIN_VALUE, b = 1<\/code>) overflows and flips the sign, so the comparator lies and TimSort can throw <code>IllegalArgumentException: Comparison method violates its general contract<\/code>. Write <code>Integer.compare(a, b)<\/code> or <code>Comparator.comparingInt<\/code>. Same family as Q186.<\/p>", "source": "answers.md", "search": "a comparator implemented as return a - b. show the overflow, and write the replacement. integer.min_value - 1 (or a = min_value, b = 1) overflows and flips the sign, so the comparator lies and timsort can throw illegalargumentexception: comparison method violates its general contract. write integer.compare(a, b) or comparator.comparingint. same family as q186."}, {"n": 56, "category": 4, "difficulty": "D", "html": "When do you sort as a preprocessing step to make a later linear scan legal? Give three problems where the sort is the whole trick.", "answerTitle": "Sort as the trick", "answer": "<p>Three problems: merge intervals (Q177), two-sum closest, and &quot;meeting rooms&quot; (Q180). The sort makes a linear scan legal because any violation of the invariant would have appeared earlier. Say <em>&quot;I sort so that the candidate I now consider is the only one I need&quot;<\/em>.<\/p>", "source": "answers.md", "search": "when do you sort as a preprocessing step to make a later linear scan legal? give three problems where the sort is the whole trick. three problems: merge intervals (q177), two-sum closest, and \"meeting rooms\" (q180). the sort makes a linear scan legal because any violation of the invariant would have appeared earlier. say \"i sort so that the candidate i now consider is the only one i need\" ."}, {"n": 57, "category": 4, "difficulty": "D", "html": "kth largest via sort versus quickselect versus a heap. Give the complexity and the &quot;when I write each&quot; rule.", "answerTitle": "kth largest: sort, heap, quickselect", "answer": "<p>Sort: O(n log n), simple, mutates. Size-k min-heap: O(n log k), the default you write (Q122). Quickselect: average O(n), worst O(n²) unless you randomize or median-of-medians, mutates, not stable. Write the heap unless they ban extra memory or n is huge and k ~ n/2, then quickselect and say the worst case.<\/p>", "source": "answers.md", "search": "kth largest via sort versus quickselect versus a heap. give the complexity and the \"when i write each\" rule. sort: o(n log n), simple, mutates. size-k min-heap: o(n log k), the default you write (q122). quickselect: average o(n), worst o(n²) unless you randomize or median-of-medians, mutates, not stable. write the heap unless they ban extra memory or n is huge and k ~ n/2, then quickselect and say the worst case."}, {"n": 58, "category": 4, "difficulty": "T", "html": "<code>Collections.sort<\/code> on a list whose <code>compare<\/code> is inconsistent with <code>equals<\/code>. What can happen, and is it a <code>TreeSet<\/code> problem or a <code>TimSort<\/code> problem?", "answerTitle": "Comparator inconsistent with `equals`", "answer": "<p><code>TreeSet<\/code> / <code>TreeMap<\/code> will treat two <code>equals<\/code>-equal elements as distinct if <code>compare<\/code> says otherwise (or drop one if <code>compare<\/code> says 0 but <code>equals<\/code> is false - it uses compare only). TimSort may throw if the contract (antisymmetry, transitivity) is broken. In a review: <code>compare == 0<\/code> iff <code>equals<\/code>.<\/p>", "source": "answers.md", "search": "collections.sort on a list whose compare is inconsistent with equals. what can happen, and is it a treeset problem or a timsort problem? treeset / treemap will treat two equals-equal elements as distinct if compare says otherwise (or drop one if compare says 0 but equals is false - it uses compare only). timsort may throw if the contract (antisymmetry, transitivity) is broken. in a review: compare == 0 iff equals."}, {"n": 59, "category": 4, "difficulty": "A", "html": "You must search a 2 TiB sorted file on disk. Design the search, including what you keep in memory and how you handle a block that does not fit the predicate.", "answerTitle": "Binary search a 2 TiB file", "answer": "<p>Keep a small index of block starts (or trust a known record size). Probe the midpoint <em>block<\/em>, read one record, decide left/right. Memory holds one block plus the index. If a block contains a run that straddles the predicate, scan that block linearly. This is not <code>mmap<\/code> of 2 TiB on a 16 GiB heap.<\/p>", "source": "answers.md", "search": "you must search a 2 tib sorted file on disk. design the search, including what you keep in memory and how you handle a block that does not fit the predicate. keep a small index of block starts (or trust a known record size). probe the midpoint block , read one record, decide left/right. memory holds one block plus the index. if a block contains a run that straddles the predicate, scan that block linearly. this is not mmap of 2 tib on a 16 gib heap."}, {"n": 60, "category": 4, "difficulty": "A", "html": "The interviewer asks you to sort 10⁹ integers in 2 GiB RAM. What algorithm, what radix, and what do you say about Java&#x27;s <code>Arrays.sort<\/code>?", "answerTitle": "Sort 10⁹ ints in 2 GiB", "answer": "<p>2 GiB is 2³¹ bytes ≈ 0.5 × 10⁹ ints, so you cannot hold the data. External sort: chunk, <code>Arrays.sort<\/code> each chunk to disk, k-way merge with a heap (Q123). Radix sort of 32-bit keys is attractive <em>per chunk<\/em>. <code>Arrays.sort<\/code> on the whole thing is not an option; say that and move to the merge.<\/p>", "source": "answers.md", "search": "the interviewer asks you to sort 10⁹ integers in 2 gib ram. what algorithm, what radix, and what do you say about java's arrays.sort? 2 gib is 2³¹ bytes ≈ 0.5 × 10⁹ ints, so you cannot hold the data. external sort: chunk, arrays.sort each chunk to disk, k-way merge with a heap (q123). radix sort of 32-bit keys is attractive per chunk . arrays.sort on the whole thing is not an option; say that and move to the merge."}, {"n": 61, "category": 5, "difficulty": "C", "html": "Reverse words in a sentence. Write it with a <code>StringBuilder<\/code> and without regex, and say why <code>split(&quot; &quot;)<\/code> is a trap.", "answerTitle": "Reverse words", "answer": "<p>Trim, scan tokens by skipping spaces, push into a list or a deque, join with a single space. <code>split(&quot; &quot;)<\/code> keeps empty strings for double spaces and is the trap; <code>split(&quot;\\\\s+&quot;)<\/code> is acceptable if you then filter. <code>StringBuilder<\/code> and an index walk is what you write when they ban regex.<\/p>", "source": "answers.md", "search": "reverse words in a sentence. write it with a stringbuilder and without regex, and say why split(\" \") is a trap. trim, scan tokens by skipping spaces, push into a list or a deque, join with a single space. split(\" \") keeps empty strings for double spaces and is the trap; split(\"\\\\s+\") is acceptable if you then filter. stringbuilder and an index walk is what you write when they ban regex."}, {"n": 62, "category": 5, "difficulty": "C", "html": "Valid palindrome, ignoring non-alphanumeric. Write the two-pointer version on <code>charAt<\/code>, not a filtered copy.", "answerTitle": "Valid palindrome", "answer": "<pre><code class=\"lang-java\">boolean isPalindrome(String s) {\n    int i = 0, j = s.length() - 1;\n    while (i &lt; j) {\n        while (i &lt; j &amp;&amp; !Character.isLetterOrDigit(s.charAt(i))) i++;\n        while (i &lt; j &amp;&amp; !Character.isLetterOrDigit(s.charAt(j))) j--;\n        if (Character.toLowerCase(s.charAt(i++)) != Character.toLowerCase(s.charAt(j--)))\n            return false;\n    }\n    return true;\n}<\/code><\/pre><p>No filtered copy. Empty and punctuation-only are <code>true<\/code>.<\/p>", "source": "answers.md", "search": "valid palindrome, ignoring non-alphanumeric. write the two-pointer version on charat, not a filtered copy. java boolean ispalindrome(string s) { int i = 0, j = s.length() - 1; while (i < j) { while (i < j && !character.isletterordigit(s.charat(i))) i++; while (i < j && !character.isletterordigit(s.charat(j))) j--; if (character.tolowercase(s.charat(i++)) != character.tolowercase(s.charat(j--))) return false; } return true; } no filtered copy. empty and punctuation-only are true."}, {"n": 63, "category": 5, "difficulty": "D", "html": "Longest palindromic substring. Expand-around-centre versus DP: which do you write in 20 minutes, and what is the complexity?", "answerTitle": "Longest palindromic substring", "answer": "<p>Expand around 2n-1 centres (odd and even). O(n²) time, O(1) extra, twenty minutes. DP <code>dp[i][j] = s[i]==s[j] &amp;&amp; dp[i+1][j-1]<\/code> is O(n²) space and slower to type. Manacher is O(n) and you mention it only if they ask; you do not write it under a clock.<\/p>", "source": "answers.md", "search": "longest palindromic substring. expand-around-centre versus dp: which do you write in 20 minutes, and what is the complexity? expand around 2n-1 centres (odd and even). o(n²) time, o(1) extra, twenty minutes. dp dp[i][j] = s[i]==s[j] && dp[i+1][j-1] is o(n²) space and slower to type. manacher is o(n) and you mention it only if they ask; you do not write it under a clock."}, {"n": 64, "category"
