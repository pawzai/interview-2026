: 5, "difficulty": "D", "html": "String-to-integer (<code>atoi<\/code>) with overflow. Write the <code>long<\/code> guard, then the version that never leaves <code>int<\/code>.", "answerTitle": "atoi with overflow", "answer": "<p>Sign, skip leading spaces, accumulate in a <code>long<\/code>, clamp to <code>[Integer.MIN_VALUE, Integer.MAX_VALUE]<\/code>. The never-leave-<code>int<\/code> version checks <code>if (acc &gt; MAX/10 || acc == MAX/10 &amp;&amp; digit &gt; MAX%10)<\/code> <em>before<\/em> multiplying. Trailing junk is ignored or rejected - ask. <code>+<\/code> / <code>-<\/code> only at the start.<\/p>", "source": "answers.md", "search": "string-to-integer (atoi) with overflow. write the long guard, then the version that never leaves int. sign, skip leading spaces, accumulate in a long, clamp to [integer.min_value, integer.max_value]. the never-leave-int version checks if (acc max/10 acc == max/10 && digit max%10) before multiplying. trailing junk is ignored or rejected - ask. + / - only at the start."}, {"n": 65, "category": 5, "difficulty": "T", "html": "<code>String.split<\/code> with a trailing delimiter, and <code>split<\/code> of <code>&quot;aaa&quot;<\/code> on <code>&quot;a&quot;<\/code>. What do you get, and what should you have used instead?", "answerTitle": "`String.split` traps", "answer": "<p><code>&quot;a:b:&quot;.split(&quot;:&quot;)<\/code> is <code>[&quot;a&quot;,&quot;b&quot;]<\/code> - trailing empties dropped. <code>&quot;a:b:&quot;.split(&quot;:&quot;, -1)<\/code> keeps them. <code>&quot;aaa&quot;.split(&quot;a&quot;)<\/code> is <code>[]<\/code> (or a pile of empties depending on limit). For tokenization, prefer an index scan or <code>split(regex, -1)<\/code> when empties are data. <code>StringTokenizer<\/code> is legacy.<\/p>", "source": "answers.md", "search": "string.split with a trailing delimiter, and split of \"aaa\" on \"a\". what do you get, and what should you have used instead? \"a:b:\".split(\":\") is [\"a\",\"b\"] - trailing empties dropped. \"a:b:\".split(\":\", -1) keeps them. \"aaa\".split(\"a\") is [] (or a pile of empties depending on limit). for tokenization, prefer an index scan or split(regex, -1) when empties are data. stringtokenizer is legacy."}, {"n": 66, "category": 5, "difficulty": "D", "html": "Implement <code>indexOf<\/code> / KMP at a sketch level. When is naive O(n·m) acceptable in a round, and when do you mention KMP and stop?", "answerTitle": "`indexOf` / KMP", "answer": "<p>Naive is O(n·m) and acceptable when m is tiny or they asked for <code>indexOf<\/code> behaviour. Mention KMP (prefix table, O(n+m)) or Rabin-Karp and stop - writing KMP correctly takes the rest of the round. The production answer is <code>String.indexOf<\/code> / <code>Pattern<\/code>, not your KMP.<\/p>", "source": "answers.md", "search": "implement indexof / kmp at a sketch level. when is naive o(n·m) acceptable in a round, and when do you mention kmp and stop? naive is o(n·m) and acceptable when m is tiny or they asked for indexof behaviour. mention kmp (prefix table, o(n+m)) or rabin-karp and stop - writing kmp correctly takes the rest of the round. the production answer is string.indexof / pattern, not your kmp."}, {"n": 67, "category": 5, "difficulty": "D", "html": "Valid parentheses is a stack problem. Valid number, valid IP, valid IPv6 are parsers. Write the IP one as a split-and-check, and name the off-by-ones.", "answerTitle": "Valid IP", "answer": "<p><code>split(&quot;\\\\.&quot;, -1)<\/code> - the <code>-1<\/code> keeps empties so <code>&quot;1.1.1.&quot;<\/code> fails. Four parts, each 0-255, no leading zero unless the part is <code>&quot;0&quot;<\/code>. IPv6: eight hex groups, <code>::<\/code> once. Off-by-ones: empty part, nine groups, hex out of range. Do not use <code>InetAddress<\/code> in a round unless they permit library calls; it does DNS.<\/p>", "source": "answers.md", "search": "valid parentheses is a stack problem. valid number, valid ip, valid ipv6 are parsers. write the ip one as a split-and-check, and name the off-by-ones. split(\"\\\\.\", -1) - the -1 keeps empties so \"1.1.1.\" fails. four parts, each 0-255, no leading zero unless the part is \"0\". ipv6: eight hex groups, :: once. off-by-ones: empty part, nine groups, hex out of range. do not use inetaddress in a round unless they permit library calls; it does dns."}, {"n": 68, "category": 5, "difficulty": "D", "html": "Run-length encode and decode. Write both, and the bomb if the decode allocates from an untrusted length.", "answerTitle": "Run-length encode / decode", "answer": "<p>Encode: count runs, append <code>c<\/code> + count (or count + <code>c<\/code> - agree the format). Decode: parse the integer and <code>append(String.valueOf(c).repeat(n))<\/code>. The bomb is <code>repeat(untrusted)<\/code> on a 2 GB claim - cap the decoded length and fail closed. This is a security review comment (pack <code>11<\/code>).<\/p>", "source": "answers.md", "search": "run-length encode and decode. write both, and the bomb if the decode allocates from an untrusted length. encode: count runs, append c + count (or count + c - agree the format). decode: parse the integer and append(string.valueof(c).repeat(n)). the bomb is repeat(untrusted) on a 2 gb claim - cap the decoded length and fail closed. this is a security review comment (pack 11)."}, {"n": 69, "category": 5, "difficulty": "T", "html": "<code>char<\/code> versus code point. Show a surrogate pair that breaks <code>charAt<\/code> / <code>toCharArray<\/code> iteration, and the <code>codePoints()<\/code> fix.", "answerTitle": "`char` versus code point", "answer": "<p>A supplementary character is two <code>char<\/code>s (surrogate pair). <code>charAt<\/code> / <code>toCharArray<\/code> / <code>s.length()<\/code> are UTF-16 units. <code>s.codePoints()<\/code> / <code>offsetByCodePoints<\/code> iterate characters. <code>&quot;👍&quot;.length()<\/code> is 2. In a round, ask whether the input is BMP; most toy problems are.<\/p>", "source": "answers.md", "search": "char versus code point. show a surrogate pair that breaks charat / tochararray iteration, and the codepoints() fix. a supplementary character is two chars (surrogate pair). charat / tochararray / s.length() are utf-16 units. s.codepoints() / offsetbycodepoints iterate characters. \"👍\".length() is 2. in a round, ask whether the input is bmp; most toy problems are."}, {"n": 70, "category": 5, "difficulty": "D", "html": "Minimum window that covers all characters of t. Reuse the owed-count idea from Q21, now on a <code>String<\/code>.", "answerTitle": "Minimum window covering t", "answer": "<p>Same owed-count as Q21. On a <code>String<\/code> you still use <code>charAt<\/code> and a 128- or 256-array if the problem is ASCII; a <code>HashMap&lt;Character, Integer&gt;<\/code> if it is Unicode. Do not copy-paste Q21 without saying the alphabet.<\/p>", "source": "answers.md", "search": "minimum window that covers all characters of t. reuse the owed-count idea from q21, now on a string. same owed-count as q21. on a string you still use charat and a 128- or 256-array if the problem is ascii; a hashmap<character, integer if it is unicode. do not copy-paste q21 without saying the alphabet."}, {"n": 71, "category": 5, "difficulty": "D", "html": "Implement a simple calculator with <code>+<\/code>, <code>-<\/code> and parentheses. What does the stack store, and how do you handle unary minus?", "answerTitle": "Calculator with parentheses", "answer": "<p>One stack of integers and signs (or a stack of <code>(acc, sign)<\/code> frames). On <code>(<\/code> push the frame and reset; on <code>)<\/code> pop and combine. Unary minus is a sign on the next number, not a binary operator - treat <code>+<\/code>/<code>-<\/code> as &quot;apply the pending sign to the number you just finished&quot;. No <code>*<\/code>/<code>/<\/code> in this version; those need precedence or a second stack.<\/p>", "source": "answers.md", "search": "implement a simple calculator with +, - and parentheses. what does the stack store, and how do you handle unary minus? one stack of integers and signs (or a stack of (acc, sign) frames). on ( push the frame and reset; on ) pop and combine. unary minus is a sign on the next number, not a binary operator - treat +/- as \"apply the pending sign to the number you just finished\". no // in this version; those need precedence or a second stack."}, {"n": 72, "category": 5, "difficulty": "D", "html": "Wildcard matching versus regular-expression matching. What is the DP state, and why is <code>*<\/code> in each problem a different animal?", "answerTitle": "Wildcard versus regex matching", "answer": "<p>Wildcard (<code>?<\/code> = one, <code>*<\/code> = any sequence): DP <code>dp[i][j]<\/code> on prefixes, <code>*<\/code> can eat zero or more. Regex (<code>.<\/code> = one, <code>*<\/code> = <em>zero or more of the previous<\/em>): the <code>*<\/code> binds to the previous token, so the state must look at <code>p[j-1]<\/code>. They are not the same <code>*<\/code>. Write the 2D boolean table; mention that a greedy backtrack also works and can explode.<\/p>", "source": "answers.md", "search": "wildcard matching versus regular-expression matching. what is the dp state, and why is in each problem a different animal? wildcard (? = one, = any sequence): dp dp[i][j] on prefixes, can eat zero or more. regex (. = one, = zero or more of the previous ): the binds to the previous token, so the state must look at p[j-1]. they are not the same . write the 2d boolean table; mention that a greedy backtrack also works and can explode."}, {"n": 73, "category": 5, "difficulty": "T", "html": "Concatenating in a loop with <code>+<\/code>. Show the complexity, the bytecode story since Java 9, and the case the compiler still cannot save.", "answerTitle": "`+` in a loop", "answer": "<p>Each <code>s = s + chunk<\/code> copies the growing prefix: O(n²). Since Java 9, <em>compile-time<\/em> concatenation is <code>invokedynamic<\/code> / <code>StringConcatFactory<\/code>; a loop still allocates a new <code>String<\/code> per iteration unless you wrote a <code>StringBuilder<\/code>. The compiler cannot save the loop. This is S-adjacent to any &quot;build a string&quot; problem.<\/p>", "source": "answers.md", "search": "concatenating in a loop with +. show the complexity, the bytecode story since java 9, and the case the compiler still cannot save. each s = s + chunk copies the growing prefix: o(n²). since java 9, compile-time concatenation is invokedynamic / stringconcatfactory; a loop still allocates a new string per iteration unless you wrote a stringbuilder. the compiler cannot save the loop. this is s-adjacent to any \"build a string\" problem."}, {"n": 74, "category": 5, "difficulty": "A", "html": "You must parse a 2 GB CSV on the heap limit of a Lambda. Design the parser: encoding, quoting, and what you never load.", "answerTitle": "2 GB CSV on a Lambda heap", "answer": "<p>Do not load the file. Stream lines (or a proper quoted-CSV state machine that can hold at most one record), decode with the declared charset, never <code>Files.readString<\/code>. Quoted fields can contain newlines - a <code>readLine<\/code> parser is wrong for real CSV. Cap record size. Off-heap / pipe to the next stage. Heap limit is the design constraint, not an afterthought.<\/p>", "source": "answers.md", "search": "you must parse a 2 gb csv on the heap limit of a lambda. design the parser: encoding, quoting, and what you never load. do not load the file. stream lines (or a proper quoted-csv state machine that can hold at most one record), decode with the declared charset, never files.readstring. quoted fields can contain newlines - a readline parser is wrong for real csv. cap record size. off-heap / pipe to the next stage. heap limit is the design constraint, not an afterthought."}, {"n": 75, "category": 5, "difficulty": "A", "html": "Design a tokenizer for a tiny expression language that must report line and column on every error. What are the token types and the one state you keep?", "answerTitle": "Tokenizer with line and column", "answer": "<p>Token types: number, ident, string, operator, lparen, rparen, eof. State is <code>(i, line, col)<\/code> and the current token. On every consume, if <code>&#x27;\\n&#x27;<\/code> then <code>line++, col=1<\/code> else <code>col++<\/code>. Errors throw a <code>ParseException(line, col, msg)<\/code> - never just <code>&quot;bad token&quot;<\/code>. Leave expression parsing as a recursive-descent interface so Q71 / Q88 can sit on top.<\/p>", "source": "answers.md", "search": "design a tokenizer for a tiny expression language that must report line and column on every error. what are the token types and the one state you keep? token types: number, ident, string, operator, lparen, rparen, eof. state is (i, line, col) and the current token. on every consume, if '\\n' then line++, col=1 else col++. errors throw a parseexception(line, col, msg) - never just \"bad token\". leave expression parsing as a recursive-descent interface so q71 / q88 can sit on top."}, {"n": 76, "category": 6, "difficulty": "C", "html": "Valid parentheses. Write it, and name the three failure modes you test.", "answerTitle": "Valid parentheses", "answer": "<pre><code class=\"lang-java\">boolean valid(String s) {\n    ArrayDeque&lt;Character&gt; st = new ArrayDeque&lt;&gt;();\n    for (int i = 0; i &lt; s.length(); i++) {\n        char c = s.charAt(i);\n        if (c == &#x27;(&#x27; || c == &#x27;[&#x27; || c == &#x27;{&#x27;) st.push(c);\n        else if (st.isEmpty() || !match(st.pop(), c)) return false;\n    }\n    return st.isEmpty();\n}<\/code><\/pre><p>Three failures: leftover opens, a close on empty, a mismatched pair. <code>ArrayDeque<\/code>, not <code>Stack<\/code>.<\/p>", "source": "answers.md", "search": "valid parentheses. write it, and name the three failure modes you test. java boolean valid(string s) { arraydeque<character st = new arraydeque< (); for (int i = 0; i < s.length(); i++) { char c = s.charat(i); if (c == '(' c == '[' c == '{') st.push(c); else if (st.isempty() !match(st.pop(), c)) return false; } return st.isempty(); } three failures: leftover opens, a close on empty, a mismatched pair. arraydeque, not stack."}, {"n": 77, "category": 6, "difficulty": "C", "html": "Implement a queue with two stacks, and a stack with two queues. Which one do you actually write, and why is the other a curiosity?", "answerTitle": "Queue with two stacks", "answer": "<p>Inbound stack for <code>enqueue<\/code>, outbound for <code>dequeue<\/code>. Amortized O(1): each element moves at most once. The two-queue stack is O(n) per push or per pop and is a curiosity - write it only if they ask. State the amortized story (Q4) out loud.<\/p>", "source": "answers.md", "search": "implement a queue with two stacks, and a stack with two queues. which one do you actually write, and why is the other a curiosity? inbound stack for enqueue, outbound for dequeue. amortized o(1): each element moves at most once. the two-queue stack is o(n) per push or per pop and is a curiosity - write it only if they ask. state the amortized story (q4) out loud."}, {"n": 78, "category": 6, "difficulty": "D", "html": "Daily temperatures / next greater element. Write the monotonic decreasing stack, and state the invariant in one sentence.", "answerTitle": "Next greater / daily temperatures", "answer": "<p>Scan left to right, keep a <em>decreasing<\/em> stack of indices. When <code>a[i]<\/code> is greater than <code>a[st.peek()]<\/code>, pop and record <code>i - idx<\/code> (or <code>a[i]<\/code>). Invariant: stack heights are strictly decreasing, so the first greater to the right is the first that fails that.<\/p>", "source": "answers.md", "search": "daily temperatures / next greater element. write the monotonic decreasing stack, and state the invariant in one sentence. scan left to right, keep a decreasing stack of indices. when a[i] is greater than a[st.peek()], pop and record i - idx (or a[i]). invariant: stack heights are strictly decreasing, so the first greater to the right is the first that fails that."}, {"n": 79, "category": 6, "difficulty": "D", "html": "Largest rectangle in a histogram. Why do you store indices, not heights, and what do you flush at the end?", "answerTitle": "Largest rectangle in a histogram", "answer": "<p>Stack of increasing indices. On a descent, the popped bar&#x27;s right bound is <code>i<\/code> and its left bound is the new peek. Area = <code>height[pop] * (i - peek - 1)<\/code>. Flush with a sentinel height 0 at the end so the tail pops. You store indices because you need the width.<\/p>", "source": "answers.md", "search": "largest rectangle in a histogram. why do you store indices, not heights, and what do you flush at the end? stack of increasing indices. on a descent, the popped bar's right bound is i and its left bound is the new peek. area = height[pop] (i - peek - 1). flush with a sentinel height 0 at the end so the tail pops. you store indices because you need the width."}, {"n": 80, "category": 6, "difficulty": "T", "html": "<code>MinStack<\/code> in O(1) getMin. Two-stack versus encoding on one stack: which do you write, and where does the encoding overflow?", "answerTitle": "MinStack", "answer": "<p>Two stacks: values, and running mins (push a min when <code>x &lt;= min<\/code>, pop it when <code>x == min<\/code>). Encoding <code>2*x - min<\/code> on one stack overflows <code>int<\/code> when x is <code>MIN_VALUE<\/code>. Write two stacks, or a stack of a <code>record Node(int val, int min)<\/code>. Do not use <code>Stack<\/code>.<\/p>", "source": "answers.md", "search": "minstack in o(1) getmin. two-stack versus encoding on one stack: which do you write, and where does the encoding overflow? two stacks: values, and running mins (push a min when x <= min, pop it when x == min). encoding 2 x - min on one stack overflows int when x is min_value. write two stacks, or a stack of a record node(int val, int min). do not use stack."}, {"n": 81, "category": 6, "difficulty": "D", "html": "Sliding-window maximum. Write the deque of indices, and the two evictions on each step.", "answerTitle": "Sliding-window maximum", "answer": "<p><code>ArrayDeque&lt;Integer&gt;<\/code> of indices, decreasing values. On each <code>r<\/code>: evict from the back while <code>a[r] &gt;= a[back]<\/code>; evict from the front while <code>front &lt;= r-k<\/code>; the front is the max. O(n): each index is pushed and popped once.<\/p>", "source": "answers.md", "search": "sliding-window maximum. write the deque of indices, and the two evictions on each step. arraydeque<integer of indices, decreasing values. on each r: evict from the back while a[r] = a[back]; evict from the front while front <= r-k; the front is the max. o(n): each index is pushed and popped once."}, {"n": 82, "category": 6, "difficulty": "D", "html": "Evaluate reverse Polish notation. Write it, and the division-truncation rule Java uses that interviewers will probe.", "answerTitle": "Reverse Polish", "answer": "<pre><code class=\"lang-java\">int evalRPN(String[] tok) {\n    ArrayDeque&lt;Integer&gt; st = new ArrayDeque&lt;&gt;();\n    for (String t : tok) {\n        switch (t) {\n            case &quot;+&quot; -&gt; st.push(st.pop() + st.pop());\n            case &quot;-&quot; -&gt; { int b = st.pop(), a = st.pop(); st.push(a - b); }\n            case &quot;*&quot; -&gt; st.push(st.pop() * st.pop());\n            case &quot;/&quot; -&gt; { int b = st.pop(), a = st.pop(); st.push(a / b); }\n            default -&gt; st.push(Integer.parseInt(t));\n        }\n    }\n    return st.pop();\n}<\/code><\/pre><p>Java <code>/<\/code> truncates toward zero. Order on <code>-<\/code> and <code>/<\/code> is the bug. Overflow of <code>int<\/code> multiply is usually ignored in the toy problem; say so.<\/p>", "source": "answers.md", "search": "evaluate reverse polish notation. write it, and the division-truncation rule java uses that interviewers will probe. java int evalrpn(string[] tok) { arraydeque<integer st = new arraydeque< (); for (string t : tok) { switch (t) { case \"+\" - st.push(st.pop() + st.pop()); case \"-\" - { int b = st.pop(), a = st.pop(); st.push(a - b); } case \" \" - st.push(st.pop() st.pop()); case \"/\" - { int b = st.pop(), a = st.pop(); st.push(a / b); } default - st.push(integer.parseint(t)); } } return st.pop(); } java / truncates toward zero. order on - and / is the bug. overflow of int multiply is usually ignored in the toy problem; say so."}, {"n": 83, "category": 6, "difficulty": "D", "html": "Asteroid collision. Encode direction as sign, and write the while-condition that candidates get backwards.", "answerTitle": "Asteroid collision", "answer": "<p>Positive flies right, negative left. A collision is <code>top &gt; 0 &amp;&amp; x &lt; 0<\/code>. While that holds, compare <code>top<\/code> and <code>-x<\/code>: equal → pop and drop x; top smaller → pop and keep going; top larger → drop x. The while condition candidates reverse is &quot;same direction&quot; versus &quot;towards each other&quot;.<\/p>", "source": "answers.md", "search": "asteroid collision. encode direction as sign, and write the while-condition that candidates get backwards. positive flies right, negative left. a collision is top 0 && x < 0. while that holds, compare top and -x: equal → pop and drop x; top smaller → pop and keep going; top larger → drop x. the while condition candidates reverse is \"same direction\" versus \"towards each other\"."}, {"n": 84, "category": 6, "difficulty": "T", "html": "Using <code>Stack<\/code> (the class). Why is it wrong in modern Java, and what exactly is unsynchronized about <code>ArrayDeque<\/code> that you must not forget?", "answerTitle": "Do not use `Stack`", "answer": "<p><code>java.util.Stack<\/code> extends <code>Vector<\/code>, is synchronized on every call, and exposes the <code>Vector<\/code> API (<code>get(i)<\/code>), so it is not a stack. <code>ArrayDeque<\/code> is unsynchronized: it is <em>not<\/em> a concurrent queue. For many producers use <code>ArrayBlockingQueue<\/code> / <code>ConcurrentLinkedQueue<\/code> (Q89, Q125).<\/p>", "source": "answers.md", "search": "using stack (the class). why is it wrong in modern java, and what exactly is unsynchronized about arraydeque that you must not forget? java.util.stack extends vector, is synchronized on every call, and exposes the vector api (get(i)), so it is not a stack. arraydeque is unsynchronized: it is not a concurrent queue. for many producers use arrayblockingqueue / concurrentlinkedqueue (q89, q125)."}, {"n": 85, "category": 6, "difficulty": "D", "html": "Decode string (<code>3[a2[c]]<\/code>). Two stacks versus one stack of a small record: write the cleaner one.", "answerTitle": "Decode `3[a2[c]]`", "answer": "<p>A stack of <code>(string-so-far, multiplier)<\/code> frames. On <code>[<\/code> push and reset; on <code>]<\/code> pop, repeat the current string, append to the popped string. Cleaner than two parallel stacks. <code>repeat<\/code> on an untrusted multiplier is Q68 again - cap it.<\/p>", "source": "answers.md", "search": "decode string (3[a2[c]]). two stacks versus one stack of a small record: write the cleaner one. a stack of (string-so-far, multiplier) frames. on [ push and reset; on ] pop, repeat the current string, append to the popped string. cleaner than two parallel stacks. repeat on an untrusted multiplier is q68 again - cap it."}, {"n": 86, "category": 6, "difficulty": "D", "html": "Implement a circular buffer on a fixed <code>Object[]<\/code>. Write <code>offer<\/code>/<code>poll<\/code>/<code>size<\/code> and the full-versus-empty distinction.", "answerTitle": "Circular buffer", "answer": "<pre><code class=\"lang-java\">final class Ring&lt;T&gt; {\n    private final Object[] a;\n    private int h, t, n;\n    Ring(int cap) { a = new Object[cap]; }\n    boolean offer(T x) {\n        if (n == a.length) return false;\n        a[t] = x; t = (t + 1) % a.length; n++; return true;\n    }\n    @SuppressWarnings(&quot;unchecked&quot;)\n    T poll() {\n        if (n == 0) return null;\n        T x = (T) a[h]; a[h] = null; h = (h + 1) % a.length; n--; return x;\n    }\n    int size() { return n; }\n}<\/code><\/pre><p>Count <code>n<\/code> distinguishes full from empty. Nulling on poll avoids leaks. This is the sequential core of Q239.<\/p>", "source": "answers.md", "search": "implement a circular buffer on a fixed object[]. write offer/poll/size and the full-versus-empty distinction. java final class ring<t { private final object[] a; private int h, t, n; ring(int cap) { a = new object[cap]; } boolean offer(t x) { if (n == a.length) return false; a[t] = x; t = (t + 1) % a.length; n++; return true; } @suppresswarnings(\"unchecked\") t poll() { if (n == 0) return null; t x = (t) a[h]; a[h] = null; h = (h + 1) % a.length; n--; return x; } int size() { return n; } } count n distinguishes full from empty. nulling on poll avoids leaks. this is the sequential core of q239."}, {"n": 87, "category": 6, "difficulty": "D", "html": "Monotonic queue versus monotonic stack. Give one problem that is illegal for a stack and legal for a deque.", "answerTitle": "Monotonic queue versus stack", "answer": "<p>A stack only sees the <em>next<\/em> (or previous) greater/smaller. A deque can drop from the front as the window moves, so it can answer &quot;max of the last k&quot; (Q81). That problem is illegal for a single stack because the max may leave the window while a smaller candidate remains.<\/p>", "source": "answers.md", "search": "monotonic queue versus monotonic stack. give one problem that is illegal for a stack and legal for a deque. a stack only sees the next (or previous) greater/smaller. a deque can drop from the front as the window moves, so it can answer \"max of the last k\" (q81). that problem is illegal for a single stack because the max may leave the window while a smaller candidate remains."}, {"n": 88, "category": 6, "difficulty": "A", "html": "Design an expression evaluator that will later grow functions and units. What do you implement in 45 minutes, and what do you leave as an interface?", "answerTitle": "Expression evaluator that will grow", "answer": "<p>45 minutes: tokenizer (Q75) + recursive descent for <code>expr → term ± term<\/code>, <code>term → number | (expr)<\/code>. Leave <code>call()<\/code> / units as an interface and a <code>Map&lt;String, Function&gt;<\/code>. Do not write a shunting-yard <em>and<\/em> an AST <em>and<\/em> a visitor. The extension hook is the parser method you can override, not a framework.<\/p>", "source": "answers.md", "search": "design an expression evaluator that will later grow functions and units. what do you implement in 45 minutes, and what do you leave as an interface? 45 minutes: tokenizer (q75) + recursive descent for expr → term ± term, term → number (expr). leave call() / units as an interface and a map<string, function . do not write a shunting-yard and an ast and a visitor. the extension hook is the parser method you can override, not a framework."}, {"n": 89, "category": 6, "difficulty": "A", "html": "A producer-consumer on a bounded <code>ArrayBlockingQueue<\/code> is dropping items. Is that a stack/queue question or a concurrency question, and how do you start?", "answerTitle": "Drops on `ArrayBlockingQueue`", "answer": "<p>Start as a concurrency / backpressure question, not a stack question. <code>offer<\/code> returns false on full; <code>add<\/code> throws; <code>put<\/code> blocks. &quot;Dropping&quot; means someone used <code>offer<\/code> without a retry or used <code>DiscardPolicy<\/code> on a pool (Q223, S3). First question: which method, and is the consumer dead.<\/p>", "source": "answers.md", "search": "a producer-consumer on a bounded arrayblockingqueue is dropping items. is that a stack/queue question or a concurrency question, and how do you start? start as a concurrency / backpressure question, not a stack question. offer returns false on full; add throws; put blocks. \"dropping\" means someone used offer without a retry or used discardpolicy on a pool (q223, s3). first question: which method, and is the consumer dead."}, {"n": 90, "category": 7, "difficulty": "C", "html": "Reverse a singly linked list, iteratively and recursively. Which do you write first, and why does the recursive one use O(n) space?", "answerTitle": "Reverse a list", "answer": "<p>Iterative first: three pointers, O(1) extra.<\/p><pre><code class=\"lang-java\">ListNode reverse(ListNode h) {\n    ListNode prev = null;\n    while (h != null) {\n        ListNode n = h.next;\n        h.next = prev;\n        prev = h;\n        h = n;\n    }\n    return prev;\n}<\/code><\/pre><p>Recursive <code>reverse(h.next)<\/code> then <code>h.next.next = h; h.next = null<\/code> uses O(n) stack. You write iterative unless they ask. Empty and single-node are identity.<\/p>", "source": "answers.md", "search": "reverse a singly linked list, iteratively and recursively. which do you write first, and why does the recursive one use o(n) space? iterative first: three pointers, o(1) extra. java listnode reverse(listnode h) { listnode prev = null; while (h != null) { listnode n = h.next; h.next = prev; prev = h; h = n; } return prev; } recursive reverse(h.next) then h.next.next = h; h.next = null uses o(n) stack. you write iterative unless they ask. empty and single-node are identity."}, {"n": 91, "category": 7, "difficulty": "C", "html": "Detect a cycle. Floyd&#x27;s algorithm: prove in two sentences that the pointers meet if a cycle exists.", "answerTitle": "Cycle detection, Floyd", "answer": "<p><code>slow<\/code> +1, <code>fast<\/code> +2. If they meet, a cycle exists. Proof: once both are in the cycle of length C, the gap of <code>fast - slow<\/code> grows by 1 each step modulo C and therefore hits 0. If there is no cycle, <code>fast<\/code> hits null. Do not dereference <code>fast.next<\/code> without a null check.<\/p>", "source": "answers.md", "search": "detect a cycle. floyd's algorithm: prove in two sentences that the pointers meet if a cycle exists. slow +1, fast +2. if they meet, a cycle exists. proof: once both are in the cycle of length c, the gap of fast - slow grows by 1 each step modulo c and therefore hits 0. if there is no cycle, fast hits null. do not dereference fast.next without a null check."}, {"n": 92, "category": 7, "difficulty": "D", "html": "Find the cycle entrance, not just its existence. Why does resetting one pointer to the head work?", "answerTitle": "Cycle entrance", "answer": "<p>After they meet, put one pointer back at the head; both walk +1. They meet at the entrance. Algebra: head-to-entrance A, meet-point M inside the cycle, <code>A + M = kC<\/code>, so walking A from the meet lands on the entrance. You do not need C.<\/p>", "source": "answers.md", "search": "find the cycle entrance, not just its existence. why does resetting one pointer to the head work? after they meet, put one pointer back at the head; both walk +1. they meet at the entrance. algebra: head-to-entrance a, meet-point m inside the cycle, a + m = kc, so walking a from the meet lands on the entrance. you do not need c."}, {"n": 93, "category": 7, "difficulty": "D", "html": "Merge two sorted lists. Write it with a dummy head, and say why dummy heads are not a crutch.", "answerTitle": "Merge two sorted lists", "answer": "<p>Dummy head, tail crawls. Dummy is not a crutch: it deletes the &quot;first node is special&quot; branch that produces null bugs. O(n+m) time, O(1) extra (iterative). Recursion is O(n+m) stack - refuse it on long lists.<\/p>", "source": "answers.md", "search": "merge two sorted lists. write it with a dummy head, and say why dummy heads are not a crutch. dummy head, tail crawls. dummy is not a crutch: it deletes the \"first node is special\" branch that produces null bugs. o(n+m) time, o(1) extra (iterative). recursion is o(n+m) stack - refuse it on long lists."}, {"n": 94, "category": 7, "difficulty": "D", "html": "Remove the nth node from the end in one pass. The two-pointer gap, and the dummy you need when the head is removed.", "answerTitle": "Remove nth from end, one pass", "answer": "<p>Dummy → head. <code>fast<\/code> walks n+1 steps (because of dummy), then <code>slow<\/code> and <code>fast<\/code> walk together. <code>slow.next = slow.next.next<\/code>. Dummy is mandatory when n equals the length (head removed). n larger than the list is a spec question - throw or no-op.<\/p>", "source": "answers.md", "search": "remove the nth node from the end in one pass. the two-pointer gap, and the dummy you need when the head is removed. dummy → head. fast walks n+1 steps (because of dummy), then slow and fast walk together. slow.next = slow.next.next. dummy is mandatory when n equals the length (head removed). n larger than the list is a spec question - throw or no-op."}, {"n": 95, "category": 7, "difficulty": "T", "html": "Reverse nodes in k-group. What do you do with the remainder, and where do candidates lose the previous group&#x27;s tail?", "answerTitle": "Reverse in k-groups", "answer": "<p>Count k nodes ahead; if fewer, leave the remainder. Reverse that run (Q90), stitch <code>prevTail.next<\/code> to the new head, and set <code>prevTail<\/code> to the run&#x27;s old head (now the tail). Candidates lose the previous tail and orphan the rest of the list. Draw it.<\/p>", "source": "answers.md", "search": "reverse nodes in k-group. what do you do with the remainder, and where do candidates lose the previous group's tail? count k nodes ahead; if fewer, leave the remainder. reverse that run (q90), stitch prevtail.next to the new head, and set prevtail to the run's old head (now the tail). candidates lose the previous tail and orphan the rest of the list. draw it."}, {"n": 96, "category": 7, "difficulty": "D", "html": "Copy a list with random pointers. The weave-in-place method versus the <code>IdentityHashMap<\/code>. Which do you write, and what does the weave assume?", "answerTitle": "Copy list with random pointers", "answer": "<p><code>IdentityHashMap&lt;Node, Node&gt;<\/code> from original to clone is the one you write: first pass clone nodes, second pass wire <code>next<\/code> and <code>random<\/code>. Weave-in-place (<code>orig.next = clone<\/code>, then split) is O(1) extra and assumes you may mutate the source list temporarily - ask. Do not use <code>HashMap<\/code> on a node that did not implement <code>hashCode<\/code> by identity; default is identity, but a value-based <code>equals<\/code> would break it. <code>IdentityHashMap<\/code> is the honest type (Q36).<\/p>", "source": "answers.md", "search": "copy a list with random pointers. the weave-in-place method versus the identityhashmap. which do you write, and what does the weave assume? identityhashmap<node, node from original to clone is the one you write: first pass clone nodes, second pass wire next and random. weave-in-place (orig.next = clone, then split) is o(1) extra and assumes you may mutate the source list temporarily - ask. do not use hashmap on a node that did not implement hashcode by identity; default is identity, but a value-based equals would break it. identityhashmap is the honest type (q36)."}, {"n": 97, "category": 7, "difficulty": "D", "html": "Add two numbers stored as reversed lists, then as forward lists. What extra structure does the forward case need?", "answerTitle": "Add two numbers as lists", "answer": "<p>Reversed: dummy, carry, walk both. Forward: reverse both, add, reverse the result - or a stack each, then build the result from the LSD. The extra structure is the stack (or the reverse). Do not recurse on 10⁴-digit numbers.<\/p>", "source": "answers.md", "search": "add two numbers stored as reversed lists, then as forward lists. what extra structure does the forward case need? reversed: dummy, carry, walk both. forward: reverse both, add, reverse the result - or a stack each, then build the result from the lsd. the extra structure is the stack (or the reverse). do not recurse on 10⁴-digit numbers."}, {"n": 98, "category": 7, "difficulty": "T", "html": "<code>LinkedList<\/code> (the Java class) as a <code>List<\/code> and as a <code>Deque<\/code>. When is it the right structure, and when is it a cache-miss machine you should not have chosen?", "answerTitle": "`java.util.LinkedList`", "answer": "<p>Right as a <code>Deque<\/code> when you need mid-list splice <em>and<\/em> you already have the <code>ListIterator<\/code>. Wrong as a <code>List<\/code> you index: <code>get(i)<\/code> is O(n), and each node is a cache-miss. An <code>ArrayList<\/code> or <code>ArrayDeque<\/code> is the default. In a review, <code>new LinkedList&lt;&gt;()<\/code> without a splice is a comment.<\/p>", "source": "answers.md", "search": "linkedlist (the java class) as a list and as a deque. when is it the right structure, and when is it a cache-miss machine you should not have chosen? right as a deque when you need mid-list splice and you already have the listiterator. wrong as a list you index: get(i) is o(n), and each node is a cache-miss. an arraylist or arraydeque is the default. in a review, new linkedlist< () without a splice is a comment."}, {"n": 99, "category": 7, "difficulty": "D", "html": "Flatten a multilevel doubly linked list. Recursion versus an explicit stack: which one matches the &quot;child before next&quot; rule without a second pass?", "answerTitle": "Flatten multilevel doubly linked list", "answer": "<p>DFS: for each node, if <code>child<\/code> exists, splice the flattened child between <code>node<\/code> and <code>node.next<\/code>, then continue. Recursion matches &quot;child before next&quot;. An explicit stack of the saved <code>next<\/code> does the same without a second pass. Clear <code>child<\/code> after splice. Null <code>next<\/code> on the inner tail is the bug.<\/p>", "source": "answers.md", "search": "flatten a multilevel doubly linked list. recursion versus an explicit stack: which one matches the \"child before next\" rule without a second pass? dfs: for each node, if child exists, splice the flattened child between node and node.next, then continue. recursion matches \"child before next\". an explicit stack of the saved next does the same without a second pass. clear child after splice. null next on the inner tail is the bug."}, {"n": 100, "category": 7, "difficulty": "D", "html": "Palindrome linked list. Reverse the second half in place, compare, restore. Why restore, and what do you say if they say not to?", "answerTitle": "Palindrome list", "answer": "<p>Slow/fast to mid, reverse second half, compare, reverse back. Restore because the caller did not give you the list. If they say not to restore, say you still would in production and skip it on the clock. Odd length: skip the middle node. O(n) time, O(1) extra.<\/p>", "source": "answers.md", "search": "palindrome linked list. reverse the second half in place, compare, restore. why restore, and what do you say if they say not to? slow/fast to mid, reverse second half, compare, reverse back. restore because the caller did not give you the list. if they say not to restore, say you still would in production and skip it on the clock. odd length: skip the middle node. o(n) time, o(1) extra."}, {"n": 101, "category": 7, "difficulty": "D", "html": "LRU as a HashMap plus doubly linked list. Write the node, the move-to-front, and the eviction. (Full design is Q251.)", "answerTitle": "LRU skeleton", "answer": "<p><code>Map&lt;K, Node&gt;<\/code> plus a doubly linked list, dummy head and tail. <code>get<\/code> moves the node to front; <code>put<\/code> on a live key updates and moves; eviction removes <code>tail.prev<\/code>. Full production walkthrough is Q251 / S12. Here you write the node and <code>moveToFront<\/code> correctly.<\/p>", "source": "answers.md", "search": "lru as a hashmap plus doubly linked list. write the node, the move-to-front, and the eviction. (full design is q251.) map<k, node plus a doubly linked list, dummy head and tail. get moves the node to front; put on a live key updates and moves; eviction removes tail.prev. full production walkthrough is q251 / s12. here you write the node and movetofront correctly."}, {"n": 102, "category": 7, "difficulty": "T", "html": "Iterating a list while deleting. <code>Iterator.remove<\/code> versus <code>list.remove(i)<\/code> on an <code>ArrayList<\/code> versus a <code>LinkedList<\/code>. Which one is O(n²), and which one throws?", "answerTitle": "Iterate and delete", "answer": "<p><code>Iterator.remove<\/code> is the legal way. <code>list.remove(i)<\/code> on an <code>ArrayList<\/code> is O(n) per delete (shift) so a filter loop is O(n²), and you must <code>i--<\/code> or walk backwards. <code>list.remove(i)<\/code> while using a for-each throws <code>ConcurrentModificationException<\/code>. <code>LinkedList.remove(i)<\/code> is O(n) to find plus O(1) unlink - still O(n²) for many deletes. Prefer <code>removeIf<\/code> or an iterator.<\/p>", "source": "answers.md", "search": "iterating a list while deleting. iterator.remove versus list.remove(i) on an arraylist versus a linkedlist. which one is o(n²), and which one throws? iterator.remove is the legal way. list.remove(i) on an arraylist is o(n) per delete (shift) so a filter loop is o(n²), and you must i-- or walk backwards. list.remove(i) while using a for-each throws concurrentmodificationexception. linkedlist.remove(i) is o(n) to find plus o(1) unlink - still o(n²) for many deletes. prefer removeif or an iterator."}, {"n": 103, "category": 7, "difficulty": "A", "html": "You must splice 10⁶ nodes from one list into another under a lock. What do you store in the node to make splice O(1), and what do you give up?", "answerTitle": "O(1) splice of 10⁶ nodes", "answer": "<p>You need the node itself, not an index: a real doubly linked list (or an intrusive list) so splice is pointer rewrites. You give up array locality and O(1) random access. Under a lock, do not walk 10⁶ nodes to find the cut; the caller must hand you the endpoints. <code>java.util.LinkedList<\/code> does not expose nodes, so you cannot O(1)-splice it from the outside.<\/p>", "source": "answers.md", "search": "you must splice 10⁶ nodes from one list into another under a lock. what do you store in the node to make splice o(1), and what do you give up? you need the node itself, not an index: a real doubly linked list (or an intrusive list) so splice is pointer rewrites. you give up array locality and o(1) random access. under a lock, do not walk 10⁶ nodes to find the cut; the caller must hand you the endpoints. java.util.linkedlist does not expose nodes, so you cannot o(1)-splice it from the outside."}, {"n": 104, "category": 7, "difficulty": "A", "html": "Design an LRU that must also support O(1) delete-by-key and O(1) peek-oldest. Is the Java <code>LinkedHashMap<\/code> enough, and when is it not?", "answerTitle": "LRU with delete-by-key and peek-oldest", "answer": "<p><code>LinkedHashMap<\/code> in access-order plus <code>removeEldestEntry<\/code> is enough for get/put/evict. <code>remove(key)<\/code> is O(1). Peek-oldest without evicting is <code>iterator().next()<\/code> - that is O(1) at the head of a linked map and does <em>not<\/em> count as access if you use the entry iterator carefully; <code>get<\/code> of that key would refresh it. It is <em>not<\/em> enough when you need weighted size, TTL (Q246), or concurrency - then you write Q251 or use Caffeine.<\/p>", "source": "answers.md", "search": "design an lru that must also support o(1) delete-by-key and o(1) peek-oldest. is the java linkedhashmap enough, and when is it not? linkedhashmap in access-order plus removeeldestentry is enough for get/put/evict. remove(key) is o(1). peek-oldest without evicting is iterator().next() - that is o(1) at the head of a linked map and does not count as access if you use the entry iterator carefully; get of that key would refresh it. it is not enough when you need weighted size, ttl (q246), or concurrency - then you write q251 or use caffeine."}, {"n": 105, "category": 8, "difficulty": "C", "html": "Inorder, preorder, postorder: recursive and iterative. Which traversal produces a BST in sorted order?", "answerTitle": "Traversals", "answer": "<p>Inorder of a BST is sorted order. Recursive is three lines; iterative inorder is a stack of the left spine, then pop/visit/go right. Preorder is visit then children; postorder is the one you get wrong iteratively - two stacks or a &quot;last visited&quot; pointer. Name which you are writing before you type.<\/p>", "source": "answers.md", "search": "inorder, preorder, postorder: recursive and iterative. which traversal produces a bst in sorted order? inorder of a bst is sorted order. recursive is three lines; iterative inorder is a stack of the left spine, then pop/visit/go right. preorder is visit then children; postorder is the one you get wrong iteratively - two stacks or a \"last visited\" pointer. name which you are writing before you type."}, {"n": 106, "category": 8, "difficulty": "C", "html": "Maximum depth and whether a tree is height-balanced. Write the combined DFS that returns both so you do not walk twice.", "answerTitle": "Depth and balanced in one walk", "answer": "<pre><code class=\"lang-java\">int height(TreeNode n) {                 // -1 =&gt; unbalanced\n    if (n == null) return 0;\n    int L = height(n.left);  if (L &lt; 0) return -1;\n    int R = height(n.right); if (R &lt; 0) return -1;\n    if (Math.abs(L - R) &gt; 1) return -1;\n    return 1 + Math.max(L, R);\n}<\/code><\/pre><p>A separate <code>depth<\/code> plus a separate <code>balanced<\/code> is two walks. Interviewers notice.<\/p>", "source": "answers.md", "search": "maximum depth and whether a tree is height-balanced. write the combined dfs that returns both so you do not walk twice. java int height(treenode n) { // -1 = unbalanced if (n == null) return 0; int l = height(n.left); if (l < 0) return -1; int r = height(n.right); if (r < 0) return -1; if (math.abs(l - r) 1) return -1; return 1 + math.max(l, r); } a separate depth plus a separate balanced is two walks. interviewers notice."}, {"n": 107, "category": 8, "difficulty": "D", "html": "Lowest common ancestor in a binary tree, then in a BST. Why is the BST version not a search for both values independently?", "answerTitle": "LCA", "answer": "<p>Binary tree: recurse; if both sides return non-null, <code>root<\/code> is the LCA; otherwise propagate the non-null. You are allowed to assume both nodes exist, or you must say you do. BST: walk from the root until <code>root<\/code> is between <code>p<\/code> and <code>q<\/code> (or equals one). Two independent searches plus a path compare also works and is worse.<\/p>", "source": "answers.md", "search": "lowest common ancestor in a binary tree, then in a bst. why is the bst version not a search for both values independently? binary tree: recurse; if both sides return non-null, root is the lca; otherwise propagate the non-null. you are allowed to assume both nodes exist, or you must say you do. bst: walk from the root until root is between p and q (or equals one). two independent searches plus a path compare also works and is worse."}, {"n": 108, "category": 8, "difficulty": "D", "html": "Serialize and deserialize a binary tree. What delimiter and null marker do you pick, and why is inorder alone not enough?", "answerTitle": "Serialize / deserialize", "answer": "<p>Preorder with a <code>#<\/code> (or <code>X<\/code>) null marker and commas. Inorder alone cannot distinguish structure. Level-order also works and matches LeetCode 297. Split on the delimiter you picked; <code>split(&quot;,&quot;, -1)<\/code> if you allow empties. Do not use Java serialization.<\/p>", "source": "answers.md", "search": "serialize and deserialize a binary tree. what delimiter and null marker do you pick, and why is inorder alone not enough? preorder with a (or x) null marker and commas. inorder alone cannot distinguish structure. level-order also works and matches leetcode 297. split on the delimiter you picked; split(\",\", -1) if you allow empties. do not use java serialization."}, {"n": 109, "category": 8, "difficulty": "D", "html": "Validate a BST. The wrong check (<code>left &lt; root &lt; right<\/code> on children only) and the correct running-bound check.", "answerTitle": "Validate a BST", "answer": "<p><code>left &lt; root &lt; right<\/code> on <em>children only<\/em> accepts a left-subtree node that is larger than the root. Thread a running <code>(lo, hi)<\/code> exclusive bound. Watch duplicates: the usual contract is strictly increasing; ask. <code>long<\/code> bounds avoid <code>Integer.MIN_VALUE<\/code> sentinels that reject a legal min-value node.<\/p>", "source": "answers.md", "search": "validate a bst. the wrong check (left < root < right on children only) and the correct running-bound check. left < root < right on children only accepts a left-subtree node that is larger than the root. thread a running (lo, hi) exclusive bound. watch duplicates: the usual contract is strictly increasing; ask. long bounds avoid integer.min_value sentinels that reject a legal min-value node."}, {"n": 110, "category": 8, "difficulty": "T", "html": "A BST iterator that must be O(1) amortized <code>next<\/code> and O(h) memory. Write the stack invariant.", "answerTitle": "BST iterator", "answer": "<p>Stack holds the path to the next node: constructor pushes the left spine. <code>next<\/code> pops, then pushes the left spine of the popped node&#x27;s right. Amortized O(1): each node is pushed and popped once. Memory O(h). <code>hasNext<\/code> is <code>!stack.isEmpty()<\/code>.<\/p>", "source": "answers.md", "search": "a bst iterator that must be o(1) amortized next and o(h) memory. write the stack invariant. stack holds the path to the next node: constructor pushes the left spine. next pops, then pushes the left spine of the popped node's right. amortized o(1): each node is pushed and popped once. memory o(h). hasnext is !stack.isempty()."}, {"n": 111, "category": 8, "difficulty": "D", "html": "Invert a binary tree, flatten to a linked list, and connect next-right pointers. What is the shared pattern?", "answerTitle": "Invert, flatten, next-right", "answer": "<p>All three are &quot;rewire children, recurse (or BFS)&quot;. Invert is swap. Flatten (to a right-linked list) is postorder-ish: flatten right, flatten left, hang the old right off the left tail. Next-right is BFS, or the O(1)-space walk using the <code>next<\/code> you already set on the level above. Shared pattern: process a node, then the child pointers you still own.<\/p>", "source": "answers.md", "search": "invert a binary tree, flatten to a linked list, and connect next-right pointers. what is the shared pattern? all three are \"rewire children, recurse (or bfs)\". invert is swap. flatten (to a right-linked list) is postorder-ish: flatten right, flatten left, hang the old right off the left tail. next-right is bfs, or the o(1)-space walk using the next you already set on the level above. shared pattern: process a node, then the child pointers you still own."}, {"n": 112, "category": 8, "difficulty": "D", "html": "Path sum, path sum II, and maximum path sum (the hard one). What does the helper return in each, and why is the hard one not &quot;the sum of the path you are on&quot;?", "answerTitle": "Path sums", "answer": "<p>Path-sum I: remaining target, return boolean. Path-sum II: same plus a mutable path you add/remove, copy into the result on a leaf hit. Maximum path sum: the helper returns the best <em>downward<\/em> gain from this node (or 0 if negative); the answer is a global max of <code>leftGain + node + rightGain<\/code>. The hard one is not &quot;the path you are currently on&quot;.<\/p>", "source": "answers.md", "search": "path sum, path sum ii, and maximum path sum (the hard one). what does the helper return in each, and why is the hard one not \"the sum of the path you are on\"? path-sum i: remaining target, return boolean. path-sum ii: same plus a mutable path you add/remove, copy into the result on a leaf hit. maximum path sum: the helper returns the best downward gain from this node (or 0 if negative); the answer is a global max of leftgain + node + rightgain. the hard one is not \"the path you are currently on\"."}, {"n": 113, "category": 8, "difficulty": "D", "html": "Construct a tree from preorder and inorder. The hashmap from value to inorder index, and the shrinking range.", "answerTitle": "Build from preorder and inorder", "answer": "<p>Preorder head is the root. A map <code>value → inorder index<\/code> splits the inorder range into left and right in O(1). Recurse with a shrinking preorder index (or a pair of bounds). Duplicates break the map - the problem usually promises unique values. O(n).<\/p>", "source": "answers.md", "search": "construct a tree from preorder and inorder. the hashmap from value to inorder index, and the shrinking range. preorder head is the root. a map value → inorder index splits the inorder range into left and right in o(1). recurse with a shrinking preorder index (or a pair of bounds). duplicates break the map - the problem usually promises unique values. o(n)."}, {"n": 114, "category": 8, "difficulty": "T", "html": "Morris traversal. What pointer do you temporarily rewrite, and why would you never do this in production code you review?", "answerTitle": "Morris traversal", "answer": "<p>You temporarily set <code>predecessor.right = current<\/code> to thread the tree, then undo it. O(1) extra, O(n) time, mutates the tree while you walk. Never in production: a concurrent reader sees a cycle, an exception mid-walk leaves the thread in place, and the trick is unreadable. Mention it; do not propose it in a review.<\/p>", "source": "answers.md", "search": "morris traversal. what pointer do you temporarily rewrite, and why would you never do this in production code you review? you temporarily set predecessor.right = current to thread the tree, then undo it. o(1) extra, o(n) time, mutates the tree while you walk. never in production: a concurrent reader sees a cycle, an exception mid-walk leaves the thread in place, and the trick is unreadable. mention it; do not propose it in a review."}, {"n": 115, "category": 8, "difficulty": "D", "html": "Implement a trie: <code>insert<\/code>, <code>search<\/code>, <code>startsWith<\/code>. Array of 26 versus <code>HashMap&lt;Character, Node&gt;<\/code>, and when the map wins.", "answerTitle": "Trie", "answer": "<pre><code class=\"lang-java\">final class Trie {\n    static class N { final N[] c = new N[26]; boolean end; }\n    private final N root = new N();\n    void insert(String w) {\n        N n = root;\n        for (int i = 0; i &lt; w.length(); i++) {\n            int k = w.charAt(i) - &#x27;a&#x27;;\n            if (n.c[k] == null) n.c[k] = new N();\n            n = n.c[k];\n        }\n        n.end = true;\n    }\n    boolean search(String w) { N n = walk(w); return n != null &amp;&amp; n.end; }\n    boolean startsWith(String p) { return walk(p) != null; }\n    private N walk(String w) { /* same loop, return null on miss */ }\n}<\/code><\/pre><p><code>HashMap&lt;Character, N&gt;<\/code> wins on sparse / Unicode (Q120). Array of 26 wins on lowercase interview problems.<\/p>", "source": "answers.md", "search": "implement a trie: insert, search, startswith. array of 26 versus hashmap<character, node , and when the map wins. java final class trie { static class n { final n[] c = new n[26]; boolean end; } private final n root = new n(); void insert(string w) { n n = root; for (int i = 0; i < w.length(); i++) { int k = w.charat(i) - 'a'; if (n.c[k] == null) n.c[k] = new n(); n = n.c[k]; } n.end = true; } boolean search(string w) { n n = walk(w); return n != null && n.end; } boolean startswith(string p) { return walk(p) != null; } private n walk(string w) { / same loop, return null on miss / } } hashmap<character, n wins on sparse / unicode (q120). array of 26 wins on lowercase interview problems."}, {"n": 116, "category": 8, "difficulty": "D", "html": "Word search II (board + dictionary). Trie plus DFS with a visited flag, and the trick of deleting a found word from the trie.", "answerTitle": "Word search II", "answer": "<p>Insert the dictionary into a trie. DFS from every cell, walking the trie, marking the board visited. On <code>node.end<\/code>, add the word and set <code>end = false<\/code> (or delete the edge) so you do not report it twice. Prune empty trie branches. This is Q155 plus a trie, not 200 separate searches.<\/p>", "source": "answers.md", "search": "word search ii (board + dictionary). trie plus dfs with a visited flag, and the trick of deleting a found word from the trie. insert the dictionary into a trie. dfs from every cell, walking the trie, marking the board visited. on node.end, add the word and set end = false (or delete the edge) so you do not report it twice. prune empty trie branches. this is q155 plus a trie, not 200 separate searches."}, {"n": 117, "category": 8, "difficulty": "D", "html": "kth smallest in a BST. Inorder and stop, versus an augmented node that stores subtree size. When do you mention the augmentation?", "answerTitle": "kth smallest in a BST", "answer": "<p>Inorder and stop at k - O(h + k), simple. Augment each node with subtree size and jump - O(h) per query, O(n) extra, the structure you mention if they ask for many queries. Do not write the augmentation under a clock for one query.<\/p>", "source": "answers.md", "search": "kth smallest in a bst. inorder and stop, versus an augmented node that stores subtree size. when do you mention the augmentation? inorder and stop at k - o(h + k), simple. augment each node with subtree size and jump - o(h) per query, o(n) extra, the structure you mention if they ask for many queries. do not write the augmentation under a clock for one query."}, {"n": 118, "category": 8, "difficulty": "T", "html": "Deleting a node in a BST. The three cases, and which successor you take when both children exist.", "answerTitle": "BST delete", "answer": "<p>Leaf: unlink. One child: replace with the child. Two children: take the inorder successor (min of right), copy its value, delete the successor (which has no left child). The predecessor is symmetric. Losing the successor&#x27;s right subtree is the bug. Parent pointers versus returning the new subtree root - return the root.<\/p>", "source": "answers.md", "search": "deleting a node in a bst. the three cases, and which successor you take when both children exist. leaf: unlink. one child: replace with the child. two children: take the inorder successor (min of right), copy its value, delete the successor (which has no left child). the predecessor is symmetric. losing the successor's right subtree is the bug. parent pointers versus returning the new subtree root - return the root."}, {"n": 119, "category": 8, "difficulty": "A", "html": "Design a file-path autocomplete. Trie versus a sorted list plus binary search: the memory, the update, and the query you optimize.", "answerTitle": "File-path autocomplete", "answer": "<p>If the set is static and queries dominate, a sorted list plus binary search on the prefix (lower bound of <code>prefix<\/code>, upper bound of <code>prefix + &quot;\\uffff&quot;<\/code>) is simple and cache-friendly. If you insert and query equally, a trie (or a radix / PATRICIA tree) wins. Memory of a 26-way trie on paths is the reason you do not ship Q115 unmodified.<\/p>", "source": "answers.md", "search": "design a file-path autocomplete. trie versus a sorted list plus binary search: the memory, the update, and the query you optimize. if the set is static and queries dominate, a sorted list plus binary search on the prefix (lower bound of prefix, upper bound of prefix + \"\\uffff\") is simple and cache-friendly. if you insert and query equally, a trie (or a radix / patricia tree) wins. memory of a 26-way trie on paths is the reason you do not ship q115 unmodified."}, {"n": 120, "category": 8, "difficulty": "A", "html": "A 50-million-key prefix store with Unicode. Do you ship a trie? What do you ship instead, and what do you call the index?", "answerTitle": "50 million Unicode prefixes", "answer": "<p>A 26-array trie is the wrong machine. You ship a compressed trie (radix tree), an FM-index / suffix array if the set is static, or a search engine inverted-prefix (n-grams, finite-state transducer - what Lucene&#x27;s automaton does). Call it an index, not &quot;a HashMap of prefixes&quot;. Memory per edge is the design number you put on the board.<\/p>", "source": "answers.md", "search": "a 50-million-key prefix store with unicode. do you ship a trie? what do you ship instead, and what do you call the index? a 26-array trie is the wrong machine. you ship a compressed trie (radix tree), an fm-index / suffix array if the set is static, or a search engine inverted-prefix (n-grams, finite-state transducer - what lucene's automaton does). call it an index, not \"a hashmap of prefixes\". memory per edge is the design number you put on the board."}, {"n": 121, "category": 9, "difficulty": "C", "html": "<code>PriorityQueue<\/code> default ordering, <code>Comparator.reverseOrder()<\/code>, and why <code>poll<\/code> of an empty queue returns <code>null<\/code> rather than throwing.", "answerTitle": "`PriorityQueue` basics", "answer": "<p>Default is a min-heap of natural order. Max-heap: <code>new PriorityQueue&lt;&gt;(Comparator.reverseOrder())<\/code> or <code>comparingInt(x -&gt; -x)<\/code> only if you are sure <code>-x<\/code> cannot overflow (Q55). <code>poll<\/code>/<code>peek<\/code> on empty return <code>null<\/code>; <code>remove()<\/code> / <code>element()<\/code> throw. Not thread-safe (Q125).<\/p>", "source": "answers.md", "search": "priorityqueue default ordering, comparator.reverseorder(), and why poll of an empty queue returns null rather than throwing. default is a min-heap of natural order. max-heap: new priorityqueue< (comparator.reverseorder()) or comparingint(x - -x) only if you are sure -x cannot overflow (q55). poll/peek on empty return null; remove() / element() throw. not thread-safe (q125)."}, {"n": 122, "category": 9, "difficulty": "C", "html": "kth largest in an array. Write the size-k min-heap, and state why a max-heap of n is the worse default.", "answerTitle": "kth largest, size-k min-heap", "answer": "<pre><code class=\"lang-java\">int findKthLargest(int[] a, int k) {\n    PriorityQueue&lt;Integer&gt; pq = new PriorityQueue&lt;&gt;(k);\n    for (int x : a) {\n        pq.offer(x);\n        if (pq.size() &gt; k) pq.poll();\n    }\n    return pq.peek();\n}<\/code><\/pre><p>A max-heap of n is O(n) memory and O(n log n) to drain; you only needed k. Boxing is the Java tax - say it, do not write a raw <code>int<\/code> heap unless they ask.<\/p>", "source": "answers.md", "search": "kth largest in an array. write the size-k min-heap, and state why a max-heap of n is the worse default. java int findkthlargest(int[] a, int k) { priorityqueue<integer pq = new priorityqueue< (k); for (int x : a) { pq.offer(x); if (pq.size() k) pq.poll(); } return pq.peek(); } a max-heap of n is o(n) memory and o(n log n) to drain; you only needed k. boxing is the java tax - say it, do not write a raw int heap unless they ask."}, {"n": 123, "category": 9, "difficulty": "D", "html": "Merge k sorted lists. Heap of (value, list index, element index): the tuple you store, and the complexity.", "answerTitle": "Merge k sorted lists", "answer": "<p>Heap of a <code>record Item(int val, int list, int idx)<\/code> (or the node itself). Seed with the head of each list; on pop, offer the next of that list. O(N log k) for N total elements. Null lists are skipped at seed. This is also the k-way merge of Q60.<\/p>", "source": "answers.md", "search": "merge k sorted lists. heap of (value, list index, element index): the tuple you store, and the complexity. heap of a record item(int val, int list, int idx) (or the node itself). seed with the head of each list; on pop, offer the next of that list. o(n log k) for n total elements. null lists are skipped at seed. this is also the k-way merge of q60."}, {"n": 124, "category": 9, "difficulty": "D", "html": "Find median from a data stream. Two heaps, the invariant on their sizes, and which heap holds the extra element.", "answerTitle": "Median of a stream", "answer": "<p>Max-heap <code>lo<\/code> (left half), min-heap <code>hi<\/code> (right half). Invariant: <code>lo.size() == hi.size()<\/code> or <code>lo<\/code> has one extra; every value in <code>lo<\/code> ≤ every value in <code>hi<\/code>. Offer into <code>lo<\/code>, then move <code>lo.peek<\/code> to <code>hi<\/code> if order broke, then rebalance sizes. Median is <code>lo.peek<\/code> or the average of the two peeks. Integers: say whether you truncate the average.<\/p>", "source": "answers.md", "search": "find median from a data stream. two heaps, the invariant on their sizes, and which heap holds the extra element. max-heap lo (left half), min-heap hi (right half). invariant: lo.size() == hi.size() or lo has one extra; every value in lo ≤ every value in hi. offer into lo, then move lo.peek to hi if order broke, then rebalance sizes. median is lo.peek or the average of the two peeks. integers: say whether you truncate the average."}, {"n": 125, "category": 9, "difficulty": "T", "html": "<code>PriorityQueue<\/code> is not thread-safe and not a bounded buffer. What do you use for each of those jobs instead?", "answerTitle": "`PriorityQueue` is not those other things", "answer": "<p>Not thread-safe: <code>PriorityBlockingQueue<\/code> or a lock. Not a bounded buffer: <code>ArrayBlockingQueue<\/code> (blocking, bounded) or a <code>PriorityBlockingQueue<\/code> <em>with<\/em> an external semaphore if you need priority <em>and<\/em> a bound. Using <code>PriorityQueue<\/code> as a work queue across threads is a CME / lost-wakeup waiting to happen.<\/p>", "source": "answers.md", "search": "priorityqueue is not thread-safe and not a bounded buffer. what do you use for each of those jobs instead? not thread-safe: priorityblockingqueue or a lock. not a bounded buffer: arrayblockingqueue (blocking, bounded) or a priorityblockingqueue with an external semaphore if you need priority and a bound. using priorityqueue as a work queue across threads is a cme / lost-wakeup waiting to happen."}, {"n": 126, "category": 9, "difficulty": "D", "html": "Top-K frequent elements. Heap versus bucket sort on frequency: when is the bucket O(n), and when is it a memory bomb?", "answerTitle": "Top-K frequent", "answer": "<p>Count in a <code>HashMap<\/code>, then a size-k min-heap of entries, or bucket-sort: <code>List&lt;Integer&gt;[]<\/code> indexed by frequency (0..n). Bucket is O(n) when the frequency range is n; it is a memory bomb if you allocate <code>new List[maxValue]<\/code> on the <em>value<\/em> not the frequency. Heap is the default you write.<\/p>", "source": "answers.md", "search": "top-k frequent elements. heap versus bucket sort on frequency: when is the bucket o(n), and when is it a memory bomb? count in a hashmap, then a size-k min-heap of entries, or bucket-sort: list<integer [] indexed by frequency (0..n). bucket is o(n) when the frequency range is n; it is a memory bomb if you allocate new list[maxvalue] on the value not the frequency. heap is the default you write."}, {"n": 127, "category": 9, "difficulty": "D", "html": "Sliding-window median. Why a heap pair is awkward in Java (no delete-by-value), and the <code>TreeMap<\/code> as a sorted multiset workaround.", "answerTitle": "Sliding-window median", "answer": "<p>Java&#x27;s <code>PriorityQueue<\/code> cannot delete an arbitrary value in O(log n) - <code>remove(Object)<\/code> is O(n). Workarounds: lazy deletion (a <code>HashMap<\/code> of stale counts, skip on peek) or a <code>TreeMap&lt;Integer, Integer&gt;<\/code> multiset for each half. Write the <code>TreeMap<\/code> pair unless they let you lazy-delete. This is why Q124 does not drop straight into a window.<\/p>", "source": "answers.md", "search": "sliding-window median. why a heap pair is awkward in java (no delete-by-value), and the treemap as a sorted multiset workaround. java's priorityqueue cannot delete an arbitrary value in o(log n) - remove(object) is o(n). workarounds: lazy deletion (a hashmap of stale counts, skip on peek) or a treemap<integer, integer multiset for each half. write the treemap pair unless they let you lazy-delete. this is why q124 does not drop straight into a window."}, {"n": 128, "category": 9, "difficulty": "D", "html": "Reorganize string / task scheduler. What does the heap store, and what is the cooldown slot doing?", "answerTitle": "Reorganize string / task scheduler", "answer": "<p>Heap of <code>(count, char)<\/code> (max-heap). Pop, place, decrement, park the just-used char for <code>cooldown<\/code> steps in a small queue, then return it to the heap. Task scheduler is the same with idle slots: <code>max(tasks.length, (maxCount-1)*(n+1) + nMax)<\/code>. Write the formula if they want the count; write the heap if they want the schedule.<\/p>", "source": "answers.md", "search": "reorganize string / task scheduler. what does the heap store, and what is the cooldown slot doing? heap of (count, char) (max-heap). pop, place, decrement, park the just-used char for cooldown steps in a small queue, then return it to the heap. task scheduler is the same with idle slots: max(tasks.length, (maxcount-1) (n+1) + nmax). write the formula if they want the count; write the heap if they want the schedule."}, {"n": 129, "category": 9, "difficulty": "T", "html": "Building a heap in O(n) versus n times <code>offer<\/code> in O(n log n). How does <code>new PriorityQueue(collection)<\/code> do it, and when do you care?", "answerTitle": "Heapify in O(n)", "answer": "<p><code>new PriorityQueue&lt;&gt;(collection)<\/code> calls <code>heapify<\/code>, Floyd&#x27;s method, O(n). n times <code>offer<\/code> is O(n log n). You care when n is large and the collection already exists. <code>PriorityQueue(int capacity)<\/code> does <strong>not<\/strong> heapify an implicit array - it is just a size hint.<\/p>", "source": "answers.md", "search": "building a heap in o(n) versus n times offer in o(n log n). how does new priorityqueue(collection) do it, and when do you care? new priorityqueue< (collection) calls heapify, floyd's method, o(n). n times offer is o(n log n). you care when n is large and the collection already exists. priorityqueue(int capacity) does not heapify an implicit array - it is just a size hint."}, {"n": 130, "category": 9, "difficulty": "D", "html": "K closest points to origin. Heap of size k versus quickselect on squared distance. Which do you write, and when is squared distance mandatory?", "answerTitle": "K closest points", "answer": "<p>Size-k max-heap of squared distance, or quickselect (Q57) on <code>x*x + y*y<\/code>. Squared distance is mandatory so you do not take <code>sqrt<\/code> or compare doubles. Overflow: <code>x*x<\/code> on <code>int<\/code> can overflow - use <code>long<\/code>. Write the heap.<\/p>", "source": "answers.md", "search": "k closest points to origin. heap of size k versus quickselect on squared distance. which do you write, and when is squared distance mandatory? size-k max-heap of squared distance, or quickselect (q57) on x x + y y. squared distance is mandatory so you do not take sqrt or compare doubles. overflow: x x on int can overflow - use long. write the heap."}, {"n": 131, "category": 9, "difficulty": "D", "html": "Merge k sorted iterators that are too large to materialize. What do you store in the heap, and how do you not leak the iterators?", "answerTitle": "Merge k huge iterators", "answer": "<p>Heap of a small cursor: the iterator and its current value. <code>hasNext<\/code> is <code>!heap.isEmpty()<\/code>. Close / do not leak: if the iterators are I/O, the merge object is <code>AutoCloseable<\/code> and closes all. Do not <code>Collectors.toList<\/code> first - that was the whole point.<\/p>", "source": "answers.md", "search": "merge k sorted iterators that are too large to materialize. what do you store in the heap, and how do you not leak the iterators? heap of a small cursor: the iterator and its current value. hasnext is !heap.isempty(). close / do not leak: if the iterators are i/o, the merge object is autocloseable and closes all. do not collectors.tolist first - that was the whole point."}, {"n": 132, "category": 9, "difficulty": "A", "html": "Design a running top-K over a 24-hour sliding window of events. Heap, count-min, or a time-bucketed map - pick and defend.", "answerTitle": "Running top-K over 24 hours", "answer": "<p>Exact: time-bucketed maps (e.g. 24 hourly <code>HashMap<\/code>s of key→count) plus a heap on query, or a <code>TreeMap&lt;timestamp, key&gt;<\/code> you evict. Approximate: count-min sketch + a heap of candidates (what stream-processing libraries do). Heap-only of events does not expire cheaply. Pick buckets if they want exact; sketch if they want 10⁷ events/s.<\/p>", "source": "answers.md", "search": "design a running top-k over a 24-hour sliding window of events. heap, count-min, or a time-bucketed map - pick and defend. exact: time-bucketed maps (e.g. 24 hourly hashmaps of key→count) plus a heap on query, or a treemap<timestamp, key you evict. approximate: count-min sketch + a heap of candidates (what stream-processing libraries do). heap-only of events does not expire cheaply. pick buckets if they want exact; sketch if they want 10⁷ events/s."}, {"n": 133, "category": 9, "difficulty": "A", "html": "A &quot;priority queue&quot; in production that must support O(1) peek, O(log n) insert, and O(log n) delete-by-id. What do you add to the heap?", "answerTitle": "Heap plus delete-by-id", "answer": "<p><code>Map&lt;Id, Node&gt;<\/code> pointing into a binary heap (or a <code>TreeMap<\/code> of <code>(priority, id)<\/code>). Delete-by-id: look up, swap with last, <code>sift<\/code>. Or: lazy delete, skip stale ids on peek (Q127). Java&#x27;s <code>PriorityQueue<\/code> does not give you the index, so you write the heap or you lazy-delete. Peek is O(1), insert/delete O(log n).<\/p>", "source": "answers.md", "search": "a \"priority queue\" in production that must support o(1) peek, o(log n) insert, and o(log n) delete-by-id. what do you add to the heap? map<id, node pointing into a binary heap (or a treemap of (priority, id)). delete-by-id: look up, swap with last, sift. or: lazy delete, skip stale ids on peek (q127). java's priorityqueue does not give you the index, so you write the heap or you lazy-delete. peek is o(1), insert/delete o(log n)."}, {"n": 134, "category": 10, "difficulty": "C", "html": "Represent a graph in Java: adjacency list as <code>List&lt;List&lt;Integer&gt;&gt;<\/code> versus <code>Map&lt;Integer, List&lt;Integer&gt;&gt;<\/code>. When do you need the map?", "answerTitle": "Graph representation", "answer": "<p><code>List&lt;List&lt;Integer&gt;&gt;<\/code> when nodes are <code>0..n-1<\/code>. <code>Map&lt;Integer, List&lt;Integer&gt;&gt;<\/code> when they are sparse ids, strings, or not numbered. Weighted: <code>record Edge(int to, int w)<\/code>. Do not use an n×n <code>int[][]<\/code> at n = 10⁵. Say directed versus undirected (store both ways) before you type.<\/p>", "source": "answers.md", "search": "represent a graph in java: adjacency list as list<list<integer versus map<integer, list<integer . when do you need the map? list<list<integer when nodes are 0..n-1. map<integer, list<integer when they are sparse ids, strings, or not numbered. weighted: record edge(int to, int w). do not use an n×n int[][] at n = 10⁵. say directed versus undirected (store both ways) before you type."}, {"n": 135, "category": 10, "difficulty": "C", "html": "BFS and DFS. Write both on an adjacency list, and say which one finds unweighted shortest paths.", "answerTitle": "BFS and DFS", "answer": "<p>BFS: <code>ArrayDeque<\/code>, mark visited <em>on enqueue<\/em> (or you get exponential re-expansion). Unweighted shortest path is BFS, not DFS. DFS: recursion or an explicit stack; visited on entry. Both are O(n + e). Grid: four (or eight) deltas, bounds check, then the same.<\/p>", "source": "answers.md", "search": "bfs and dfs. write both on an adjacency list, and say which one finds unweighted shortest paths. bfs: arraydeque, mark visited on enqueue (or you get exponential re-expansion). unweighted shortest path is bfs, not dfs. dfs: recursion or an explicit stack; visited on entry. both are o(n + e). grid: four (or eight) deltas, bounds check, then the same."}, {"n": 136, "category": 10, "difficulty": "D", "html": "Detect a cycle in a directed graph. The three-colour (or recursion-stack) method, and why a visited-only set is not enough.", "answerTitle": "Directed cycle", "answer": "<p>Three colours: white / grey (on the stack) / black (done). A grey neighbour is a back-edge, hence a cycle. A visited-only set cannot tell a back-edge from a cross-edge to a finished subgraph. Recursion-stack set is the same as grey.<\/p>", "source": "answers.md", "search": "detect a cycle in a directed graph. the three-colour (or recursion-stack) method, and why a visited-only set is not enough. three colours: white / grey (on the stack) / black (done). a grey neighbour is a back-edge, hence a cycle. a visited-only set cannot tell a back-edge from a cross-edge to a finished subgraph. recursion-stack set is the same as grey."}, {"n": 137, "category": 10, "difficulty": "D", "html": "Detect a cycle in an undirected graph. Union-find versus DFS with parent. Which do you write, and why is the parent needed?", "answerTitle": "Undirected cycle", "answer": "<p>DFS with a <code>parent<\/code> argument: a visited neighbour that is not the parent is a cycle. Union-find: for each edge, if <code>find(u)==find(v)<\/code> it is a cycle, else <code>union<\/code>. You write union-find when you already need components (Q140); DFS when you already have the adjacency list and a single question.<\/p>", "source": "answers.md", "search": "detect a cycle in an undirected graph. union-find versus dfs with parent. which do you write, and why is the parent needed? dfs with a parent argument: a visited neighbour that is not the parent is a cycle. union-find: for each edge, if find(u)==find(v) it is a cycle, else union. you write union-find when you already need components (q140); dfs when you already have the adjacency list and a single question."}, {"n": 138, "category": 10, "difficulty": "D", "html": "Topological sort: Kahn&#x27;s algorithm and DFS-finish-time. Write Kahn, and say what a remaining in-degree tells you.", "answerTitle": "Topological sort, Kahn", "answer": "<p>In-degree array, queue of zeros, pop and decrement neighbours. A remaining positive in-degree means a cycle (and a partial order you cannot finish). DFS-finish-time is the other writing: push on exit, reverse the list. Kahn is the one you write because the leftover degrees <em>are<\/em> the cycle report.<\/p>", "source": "answers.md", "search": "topological sort: kahn's algorithm and dfs-finish-time. write kahn, and say what a remaining in-degree tells you. in-degree array, queue of zeros, pop and decrement neighbours. a remaining positive in-degree means a cycle (and a partial order you cannot finish). dfs-finish-time is the other writing: push on exit, reverse the list. kahn is the one you write because the leftover degrees are the cycle report."}, {"n": 139, "category": 10, "difficulty": "T", "html": "Course schedule with a cycle. The interviewer says &quot;just DFS&quot;. What extra state do you need so a cross-edge is not a cycle?", "answerTitle": "Course schedule, \"just DFS\"", "answer": "<p>You need the grey state (Q136). A single <code>vis
