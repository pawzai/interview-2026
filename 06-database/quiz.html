ULT now(),\n  published_at  timestamptz\n);\nCREATE INDEX ON outbox (id) WHERE published_at IS NULL;<\/code><\/pre><p>The business write and the outbox insert are in <strong>one transaction<\/strong>, so the event exists if and only if the state change did. The relay claims with <code>SELECT ... ORDER BY id FOR UPDATE SKIP LOCKED LIMIT n<\/code>, publishes, then marks or deletes.<\/p><p>Ordering guarantees, stated precisely: you get <strong>per-aggregate ordering only if<\/strong> the relay is single-threaded per aggregate (or partitions its claims by <code>aggregate_id<\/code> hash) <em>and<\/em> the broker preserves order for the key you publish with. You do <strong>not<\/strong> get global ordering, because <code>bigserial<\/code> values are assigned at insert time but become visible at commit time, so a transaction that took the id 100 can commit after the one holding 101 - a relay reading by id can therefore skip a row that appears later. The fixes are to read with a lag window (only rows older than a few seconds), or to use a monotonic commit-order source such as logical decoding (Q92 in <code>03-microservices<\/code> terms: CDC-based outbox).<\/p><p>Cleanup matters as much as the design: delete published rows promptly, or partition by day and drop partitions, because this table is high-churn and will bloat exactly like a queue (Q110).<\/p>", "source": "answers.md", "search": "the transactional outbox at the sql level: table design, index, the relay query, and cleanup. what ordering does it guarantee? sql create table outbox ( id bigserial primary key, aggregate_id text not null, type text not null, payload jsonb not null, created_at timestamptz not null default now(), published_at timestamptz ); create index on outbox (id) where published_at is null; the business write and the outbox insert are in one transaction , so the event exists if and only if the state change did. the relay claims with select ... order by id for update skip locked limit n, publishes, then marks or deletes. ordering guarantees, stated precisely: you get per-aggregate ordering only if the relay is single-threaded per aggregate (or partitions its claims by aggregate_id hash) and the broker preserves order for the key you publish with. you do not get global ordering, because bigserial values are assigned at insert time but become visible at commit time, so a transaction that took the id 100 can commit after the one holding 101 - a relay reading by id can therefore skip a row that appears later. the fixes are to read with a lag window (only rows older than a few seconds), or to use a monotonic commit-order source such as logical decoding (q92 in 03-microservices terms: cdc-based outbox). cleanup matters as much as the design: delete published rows promptly, or partition by day and drop partitions, because this table is high-churn and will bloat exactly like a queue (q110)."}, {"n": 117, "category": 6, "difficulty": "D", "html": "<code>LISTEN<\/code>/<code>NOTIFY<\/code> in PostgreSQL: delivery semantics, the payload limit, and why it is not a replacement for a queue.", "answerTitle": "`LISTEN`/`NOTIFY`", "answer": "<p><code>NOTIFY channel, &#x27;payload&#x27;<\/code> queues a notification that is delivered <strong>at commit<\/strong> to every session currently <code>LISTEN<\/code>ing on that channel, over their existing connection. Duplicate identical notifications within one transaction are collapsed.<\/p><p>The semantics: <strong>at-most-once, to currently connected listeners only<\/strong>. A listener that is down, restarting or reconnecting misses everything sent in the meantime; there is no persistence, no replay, no acknowledgement, no consumer group. The payload is limited to 8000 bytes, and the whole notification queue is a fixed-size (8 GB) shared area that, if a listener stalls, fills and eventually <strong>blocks committing transactions<\/strong> - a genuinely nasty failure mode. Notifications also do not cross replication to a standby, and a transaction-pooling proxy such as PgBouncer breaks <code>LISTEN<\/code> entirely.<\/p><p>So it is not a queue. What it is excellent at is <strong>eliminating polling latency<\/strong> on top of a real queue table: workers <code>LISTEN<\/code> for a wake-up signal and, on receipt, run the <code>SKIP LOCKED<\/code> claim query, while still polling on a slow timer as a backstop. That gives millisecond latency with durable semantics, and the missed-notification case costs you only the polling interval.<\/p>", "source": "answers.md", "search": "listen/notify in postgresql: delivery semantics, the payload limit, and why it is not a replacement for a queue. notify channel, 'payload' queues a notification that is delivered at commit to every session currently listening on that channel, over their existing connection. duplicate identical notifications within one transaction are collapsed. the semantics: at-most-once, to currently connected listeners only . a listener that is down, restarting or reconnecting misses everything sent in the meantime; there is no persistence, no replay, no acknowledgement, no consumer group. the payload is limited to 8000 bytes, and the whole notification queue is a fixed-size (8 gb) shared area that, if a listener stalls, fills and eventually blocks committing transactions - a genuinely nasty failure mode. notifications also do not cross replication to a standby, and a transaction-pooling proxy such as pgbouncer breaks listen entirely. so it is not a queue. what it is excellent at is eliminating polling latency on top of a real queue table: workers listen for a wake-up signal and, on receipt, run the skip locked claim query, while still polling on a slow timer as a backstop. that gives millisecond latency with durable semantics, and the missed-notification case costs you only the polling interval."}, {"n": 118, "category": 6, "difficulty": "D", "html": "Gap locks and next-key locks in InnoDB. Give a deadlock they cause that does not exist in PostgreSQL.", "answerTitle": "Gap locks and next-key locks", "answer": "<p>InnoDB at Repeatable Read locks not just matched rows but the <strong>gaps between index entries<\/strong>. A <em>record lock<\/em> covers an index entry; a <em>gap lock<\/em> covers the open interval between two entries; a <em>next-key lock<\/em> is the union of a record and the gap before it. This is how InnoDB prevents phantoms at RR - it locks the range, so a concurrent insert into that range blocks.<\/p><p>A deadlock this causes and PostgreSQL does not have:<\/p><pre><code>-- table has rows with id 10 and 20\nT1: SELECT * FROM t WHERE id = 15 FOR UPDATE;  -- gap lock on (10,20)\nT2: SELECT * FROM t WHERE id = 17 FOR UPDATE;  -- gap lock on (10,20) - compatible, both granted\nT1: INSERT INTO t VALUES (15);                 -- waits for T2&#x27;s gap lock\nT2: INSERT INTO t VALUES (17);                 -- waits for T1&#x27;s gap lock -&gt; deadlock<\/code><\/pre><p>Two transactions inserting <strong>different<\/strong> keys deadlock, because gap locks are shared for reading but block insertion. This is a classic InnoDB surprise in &quot;check then insert&quot; code and in upsert-heavy workloads. PostgreSQL has no gap locks: it detects phantoms only at Serializable, via SSI predicate locks, and would allow both inserts here.<\/p><p>The mitigations in InnoDB: use <code>READ COMMITTED<\/code> (which mostly disables gap locking) if your application does not rely on RR phantom protection, or replace check-then-insert with a real <code>INSERT ... ON DUPLICATE KEY UPDATE<\/code>.<\/p>", "source": "answers.md", "search": "gap locks and next-key locks in innodb. give a deadlock they cause that does not exist in postgresql. innodb at repeatable read locks not just matched rows but the gaps between index entries . a record lock covers an index entry; a gap lock covers the open interval between two entries; a next-key lock is the union of a record and the gap before it. this is how innodb prevents phantoms at rr - it locks the range, so a concurrent insert into that range blocks. a deadlock this causes and postgresql does not have: -- table has rows with id 10 and 20 t1: select from t where id = 15 for update; -- gap lock on (10,20) t2: select from t where id = 17 for update; -- gap lock on (10,20) - compatible, both granted t1: insert into t values (15); -- waits for t2's gap lock t2: insert into t values (17); -- waits for t1's gap lock - deadlock two transactions inserting different keys deadlock, because gap locks are shared for reading but block insertion. this is a classic innodb surprise in \"check then insert\" code and in upsert-heavy workloads. postgresql has no gap locks: it detects phantoms only at serializable, via ssi predicate locks, and would allow both inserts here. the mitigations in innodb: use read committed (which mostly disables gap locking) if your application does not rely on rr phantom protection, or replace check-then-insert with a real insert ... on duplicate key update."}, {"n": 119, "category": 6, "difficulty": "T", "html": "Two transactions insert then update the same logical entity in opposite order. Show the deadlock and give the fix that does not require changing the isolation level.", "answerTitle": "Insert-then-update in opposite order", "answer": "<pre><code>T1: INSERT parent A          T2: INSERT parent B\nT1: UPDATE parent B          T2: UPDATE parent A     -&gt; deadlock<\/code><\/pre><p>Each transaction holds a lock on the row it created (an uncommitted row is locked by its creator) and then waits for the other&#x27;s. It is the classic cycle, made less obvious because one of the locks was taken by an <code>INSERT<\/code> rather than an explicit lock statement. The same shape appears with foreign key checks: inserting a child takes <code>FOR KEY SHARE<\/code> on the parent (Q97), so two transactions inserting children of each other&#x27;s parents deadlock without either writing a shared row.<\/p><p>The fix that does not touch isolation: impose a <strong>deterministic ordering on the keys<\/strong> and process them in that order within a transaction - sort the batch by primary key before writing, and where the entities are of different types, fix a global type order (always <code>account<\/code> before <code>ledger<\/code>, never the reverse). For the batch case specifically, <code>SELECT ... WHERE id = ANY(?) ORDER BY id FOR UPDATE<\/code> at the start of the transaction acquires everything in a canonical order before any work begins.<\/p><p>The complementary measures are shortening the transaction so the window is small, and a retry on <code>40P01<\/code> - a deadlock victim is always safe to retry (Q103).<\/p>", "source": "answers.md", "search": "two transactions insert then update the same logical entity in opposite order. show the deadlock and give the fix that does not require changing the isolation level. t1: insert parent a t2: insert parent b t1: update parent b t2: update parent a - deadlock each transaction holds a lock on the row it created (an uncommitted row is locked by its creator) and then waits for the other's. it is the classic cycle, made less obvious because one of the locks was taken by an insert rather than an explicit lock statement. the same shape appears with foreign key checks: inserting a child takes for key share on the parent (q97), so two transactions inserting children of each other's parents deadlock without either writing a shared row. the fix that does not touch isolation: impose a deterministic ordering on the keys and process them in that order within a transaction - sort the batch by primary key before writing, and where the entities are of different types, fix a global type order (always account before ledger, never the reverse). for the batch case specifically, select ... where id = any(?) order by id for update at the start of the transaction acquires everything in a canonical order before any work begins. the complementary measures are shortening the transaction so the window is small, and a retry on 40p01 - a deadlock victim is always safe to retry (q103)."}, {"n": 120, "category": 6, "difficulty": "D", "html": "Long-running batch jobs against an OLTP table: how do you avoid blocking, bloat and replication lag all at once?", "answerTitle": "Long batch jobs against an OLTP table", "answer": "<p>The three problems are related, so the technique addresses all of them at once: <strong>batch, commit, throttle<\/strong>.<\/p><ul><li><strong>Blocking<\/strong>: never take locks on a large set at once. Process in key-range chunks of a few thousand rows, each in its own transaction, with <code>lock_timeout<\/code> set so a chunk that meets contention gives up and retries rather than heading a lock queue (Q100).<\/li><li><strong>Bloat<\/strong>: each chunk&#x27;s dead tuples must be reclaimable, which requires the transaction to <em>end<\/em>. One 40-million-row <code>UPDATE<\/code> produces 40 million dead tuples that vacuum cannot touch until it commits, and a table that doubles in size. Committing per chunk lets autovacuum interleave; on very large jobs I trigger <code>VACUUM<\/code> explicitly between chunks.<\/li><li><strong>Replication lag<\/strong>: every chunk generates WAL, and a standby applying WAL single-threaded will fall behind. The job should <strong>measure lag<\/strong> (<code>pg_stat_replication.replay_lag<\/code> or the LSN difference) between chunks and sleep until it recovers - a simple feedback loop that makes the job self-throttling and prevents the batch from breaking read-replica reads (Q143).<\/li><\/ul><p>Additional discipline: make the job <strong>restartable<\/strong> by driving it from a persisted cursor rather than an offset, make each chunk idempotent, and run it with a lower <code>statement_timeout<\/code> and a dedicated database role so you can identify and kill it instantly. Schedule by lag and load, not by clock alone.<\/p>", "source": "answers.md", "search": "long-running batch jobs against an oltp table: how do you avoid blocking, bloat and replication lag all at once? the three problems are related, so the technique addresses all of them at once: batch, commit, throttle . - blocking : never take locks on a large set at once. process in key-range chunks of a few thousand rows, each in its own transaction, with lock_timeout set so a chunk that meets contention gives up and retries rather than heading a lock queue (q100). - bloat : each chunk's dead tuples must be reclaimable, which requires the transaction to end . one 40-million-row update produces 40 million dead tuples that vacuum cannot touch until it commits, and a table that doubles in size. committing per chunk lets autovacuum interleave; on very large jobs i trigger vacuum explicitly between chunks. - replication lag : every chunk generates wal, and a standby applying wal single-threaded will fall behind. the job should measure lag (pg_stat_replication.replay_lag or the lsn difference) between chunks and sleep until it recovers - a simple feedback loop that makes the job self-throttling and prevents the batch from breaking read-replica reads (q143). additional discipline: make the job restartable by driving it from a persisted cursor rather than an offset, make each chunk idempotent, and run it with a lower statement_timeout and a dedicated database role so you can identify and kill it instantly. schedule by lag and load, not by clock alone."}, {"n": 121, "category": 6, "difficulty": "A", "html": "A team wants to hold a database transaction open across a user&#x27;s multi-step wizard. Talk them out of it, and give them a design that works.", "answerTitle": "A transaction across a user's wizard", "answer": "<p>Why it does not work: a database transaction holds locks and a snapshot for its whole life, so a wizard open for ten minutes means ten minutes of held row locks, ten minutes of blocked writers, and ten minutes during which vacuum cannot advance the xmin horizon <strong>for the entire database<\/strong> (Q93). Multiply by concurrent users and you exhaust <code>max_connections<\/code>, because every open transaction pins a connection - which is also incompatible with any connection pool, and impossible with transaction-mode PgBouncer. Then the user closes the laptop and nothing commits until a timeout fires. Finally, a load balancer, a rolling deployment or a failover kills the connection and the half-finished work vanishes with no way to recover it.<\/p><p>The design that works, in order of preference:<\/p><ol><li><strong>Persist the draft.<\/strong> The wizard writes each step to a <code>draft<\/code> row or table (or a JSONB document) with its own lifecycle, committed each step. The final &quot;submit&quot; is one short transaction that validates and promotes the draft into the real tables. The user can resume tomorrow, on another device, and you can report on abandonment.<\/li><li><strong>Optimistic concurrency on submit.<\/strong> The draft records the version of anything it depends on; the promoting transaction re-validates and returns a friendly conflict if the world moved (Q105).<\/li><li><strong>A reservation, if the business needs one.<\/strong> If the point of the long transaction was really &quot;hold this seat/stock for the user&quot;, model it explicitly as a reservation row with an expiry and a background reaper. That is a business concept with a business rule, and it survives restarts, which a lock does not.<\/li><\/ol><p>The framing I would use with the team: they are asking for a <em>business<\/em> lock with a <em>technical<\/em> mechanism that was never designed to be held across human time. Make the lock a row, and everything else becomes easy.<\/p><p><em>Hook: a long-held transaction you found in production and what replacing it did to lock waits.<\/em><\/p>", "source": "answers.md", "search": "a team wants to hold a database transaction open across a user's multi-step wizard. talk them out of it, and give them a design that works. why it does not work: a database transaction holds locks and a snapshot for its whole life, so a wizard open for ten minutes means ten minutes of held row locks, ten minutes of blocked writers, and ten minutes during which vacuum cannot advance the xmin horizon for the entire database (q93). multiply by concurrent users and you exhaust max_connections, because every open transaction pins a connection - which is also incompatible with any connection pool, and impossible with transaction-mode pgbouncer. then the user closes the laptop and nothing commits until a timeout fires. finally, a load balancer, a rolling deployment or a failover kills the connection and the half-finished work vanishes with no way to recover it. the design that works, in order of preference: 1. persist the draft. the wizard writes each step to a draft row or table (or a jsonb document) with its own lifecycle, committed each step. the final \"submit\" is one short transaction that validates and promotes the draft into the real tables. the user can resume tomorrow, on another device, and you can report on abandonment. 2. optimistic concurrency on submit. the draft records the version of anything it depends on; the promoting transaction re-validates and returns a friendly conflict if the world moved (q105). 3. a reservation, if the business needs one. if the point of the long transaction was really \"hold this seat/stock for the user\", model it explicitly as a reservation row with an expiry and a background reaper. that is a business concept with a business rule, and it survives restarts, which a lock does not. the framing i would use with the team: they are asking for a business lock with a technical mechanism that was never designed to be held across human time. make the lock a row, and everything else becomes easy. hook: a long-held transaction you found in production and what replacing it did to lock waits."}, {"n": 122, "category": 7, "difficulty": "C", "html": "Describe the page/block structure of a heap table, and what a tuple header contains.", "answerTitle": "Page and tuple structure", "answer": "<p>A PostgreSQL heap page is 8 KB (compile-time constant) and has four parts: a 24-byte <strong>page header<\/strong> (checksum, LSN of the last change, free-space pointers), an array of <strong>item pointers<\/strong> (line pointers) growing from the front, <strong>free space<\/strong> in the middle, and the <strong>tuples<\/strong> themselves growing from the back. Item pointers give a stable address (page, offset) so a tuple can move within a page during compaction without invalidating index entries - and they are what a HOT chain repoints.<\/p><p>A tuple header is 23 bytes plus alignment: <code>t_xmin<\/code>, <code>t_xmax<\/code> (MVCC, Q90), <code>t_cid<\/code>/<code>t_ctid<\/code> (the command id, and the pointer to the next version - the basis of HOT chains), <code>t_infomask<\/code> bits caching whether xmin/xmax committed so visibility checks avoid consulting the commit log, and the null bitmap.<\/p><p>Two consequences worth stating: a row can never exceed a page, which is why wide values must be TOASTed (Q129); and column order affects size because of alignment padding - putting eight-byte columns first and one-byte columns last can shrink a wide row measurably.<\/p>", "source": "answers.md", "search": "describe the page/block structure of a heap table, and what a tuple header contains. a postgresql heap page is 8 kb (compile-time constant) and has four parts: a 24-byte page header (checksum, lsn of the last change, free-space pointers), an array of item pointers (line pointers) growing from the front, free space in the middle, and the tuples themselves growing from the back. item pointers give a stable address (page, offset) so a tuple can move within a page during compaction without invalidating index entries - and they are what a hot chain repoints. a tuple header is 23 bytes plus alignment: t_xmin, t_xmax (mvcc, q90), t_cid/t_ctid (the command id, and the pointer to the next version - the basis of hot chains), t_infomask bits caching whether xmin/xmax committed so visibility checks avoid consulting the commit log, and the null bitmap. two consequences worth stating: a row can never exceed a page, which is why wide values must be toasted (q129); and column order affects size because of alignment padding - putting eight-byte columns first and one-byte columns last can shrink a wide row measurably."}, {"n": 123, "category": 7, "difficulty": "D", "html": "The buffer pool / shared buffers: how pages are found, the eviction strategy, and why PostgreSQL relies on the OS page cache as well.", "answerTitle": "Shared buffers and the OS page cache", "answer": "<p><code>shared_buffers<\/code> is an array of 8 KB frames with a hash table mapping (relation, fork, block) to a frame. A backend looking for a page hashes it, and on a miss reads from the OS, evicting a victim chosen by a <strong>clock sweep<\/strong> with usage counts - a cheap approximation of LRU that also resists sequential scans flooding the cache (large sequential scans use a small ring buffer rather than evicting everything). Dirty pages are written by the background writer and the checkpointer, not usually by the backend that dirtied them.<\/p><p>PostgreSQL deliberately relies on the OS page cache as a second tier: it uses buffered IO rather than direct IO, so a page missing from <code>shared_buffers<\/code> is often still in RAM, and a &quot;read&quot; in <code>EXPLAIN (BUFFERS)<\/code> may be a memory copy rather than a disk IO. The design choice keeps PostgreSQL portable and lets the OS manage a large cache, at the cost of double-buffering the same page in both caches.<\/p>", "source": "answers.md", "search": "the buffer pool / shared buffers: how pages are found, the eviction strategy, and why postgresql relies on the os page cache as well. shared_buffers is an array of 8 kb frames with a hash table mapping (relation, fork, block) to a frame. a backend looking for a page hashes it, and on a miss reads from the os, evicting a victim chosen by a clock sweep with usage counts - a cheap approximation of lru that also resists sequential scans flooding the cache (large sequential scans use a small ring buffer rather than evicting everything). dirty pages are written by the background writer and the checkpointer, not usually by the backend that dirtied them. postgresql deliberately relies on the os page cache as a second tier: it uses buffered io rather than direct io, so a page missing from shared_buffers is often still in ram, and a \"read\" in explain (buffers) may be a memory copy rather than a disk io. the design choice keeps postgresql portable and lets the os manage a large cache, at the cost of double-buffering the same page in both caches."}, {"n": 124, "category": 7, "difficulty": "D", "html": "Sizing <code>shared_buffers<\/code>, <code>effective_cache_size<\/code> and the OS cache. Why is &quot;give the database 90 percent of RAM&quot; wrong for PostgreSQL and right for Oracle?", "answerTitle": "Sizing `shared_buffers`", "answer": "<p>Because of the double-buffering above, giving PostgreSQL nearly all of RAM is counterproductive: pages are cached twice, the clock sweep and checkpoint work grow with the buffer count, and the OS loses the memory it needs for the file cache, temp files, sorts (<code>work_mem<\/code>) and connection overhead. The conventional starting point is <strong>25 percent of RAM<\/strong> for <code>shared_buffers<\/code>, and <code>effective_cache_size<\/code> set to 60-75 percent to tell the planner how much is <em>probably<\/em> cached in total (it allocates nothing). Larger values can help on very large machines with a working set that fits, but it needs measuring, not assuming.<\/p><p>Oracle is the opposite because it uses <strong>direct IO<\/strong> and manages its own SGA buffer cache, bypassing the OS cache entirely - so there is no double-buffering and giving it the memory is exactly right. SQL Server behaves similarly.<\/p><p>The other reason not to over-allocate in PostgreSQL: a bigger buffer pool means more dirty pages at each checkpoint, which makes the checkpoint IO spike worse (Q128).<\/p>", "source": "answers.md", "search": "sizing shared_buffers, effective_cache_size and the os cache. why is \"give the database 90 percent of ram\" wrong for postgresql and right for oracle? because of the double-buffering above, giving postgresql nearly all of ram is counterproductive: pages are cached twice, the clock sweep and checkpoint work grow with the buffer count, and the os loses the memory it needs for the file cache, temp files, sorts (work_mem) and connection overhead. the conventional starting point is 25 percent of ram for shared_buffers, and effective_cache_size set to 60-75 percent to tell the planner how much is probably cached in total (it allocates nothing). larger values can help on very large machines with a working set that fits, but it needs measuring, not assuming. oracle is the opposite because it uses direct io and manages its own sga buffer cache, bypassing the os cache entirely - so there is no double-buffering and giving it the memory is exactly right. sql server behaves similarly. the other reason not to over-allocate in postgresql: a bigger buffer pool means more dirty pages at each checkpoint, which makes the checkpoint io spike worse (q128)."}, {"n": 125, "category": 7, "difficulty": "D", "html": "Write-ahead logging: the protocol, what <code>COMMIT<\/code> waits for, and what is actually durable when the client gets its acknowledgment.", "answerTitle": "Write-ahead logging", "answer": "<p>The protocol is: before any data page change reaches disk, the log record describing it must be durable. Each page carries the <strong>LSN<\/strong> of the last WAL record that modified it, and the checkpointer will not write a page until the WAL up to its LSN is flushed.<\/p><p>At <code>COMMIT<\/code>, the backend writes a commit record and waits for the WAL to be <code>fsync<\/code>ed up to that LSN (and, with synchronous replication, for the standby to confirm it - Q140). Only then does the client get its acknowledgement. The data pages themselves are still dirty in memory; recovery replays the WAL forward from the last checkpoint to reconstruct them.<\/p><p>So what is durable when the client is acknowledged is <strong>the log record, in the WAL files<\/strong>, not the table. That is the whole design: sequential, small writes at commit time; random, batched writes later. It is also why WAL storage latency, not table storage latency, determines commit throughput, and why putting WAL on faster storage is one of the highest-leverage hardware changes.<\/p>", "source": "answers.md", "search": "write-ahead logging: the protocol, what commit waits for, and what is actually durable when the client gets its acknowledgment. the protocol is: before any data page change reaches disk, the log record describing it must be durable. each page carries the lsn of the last wal record that modified it, and the checkpointer will not write a page until the wal up to its lsn is flushed. at commit, the backend writes a commit record and waits for the wal to be fsynced up to that lsn (and, with synchronous replication, for the standby to confirm it - q140). only then does the client get its acknowledgement. the data pages themselves are still dirty in memory; recovery replays the wal forward from the last checkpoint to reconstruct them. so what is durable when the client is acknowledged is the log record, in the wal files , not the table. that is the whole design: sequential, small writes at commit time; random, batched writes later. it is also why wal storage latency, not table storage latency, determines commit throughput, and why putting wal on faster storage is one of the highest-leverage hardware changes."}, {"n": 126, "category": 7, "difficulty": "D", "html": "<code>synchronous_commit = off<\/code>, <code>fsync = off<\/code> and <code>full_page_writes<\/code>. What exactly do you lose with each, and which is never acceptable?", "answerTitle": "`synchronous_commit`, `fsync`, `full_page_writes`", "answer": "<ul><li><strong><code>synchronous_commit = off<\/code><\/strong> - the commit record is written to the WAL buffer but the backend does not wait for the <code>fsync<\/code>. You lose up to <code>wal_writer_delay<\/code> x 3 (a few hundred milliseconds) of <strong>committed transactions<\/strong> on a crash, but the database stays <strong>consistent<\/strong> - it is a bounded data-loss window, not corruption. This is a legitimate, per-transaction setting for low-value high-volume writes (telemetry, click events), and it is a large throughput win.<\/li><li><strong><code>fsync = off<\/code><\/strong> - PostgreSQL never forces anything to stable storage. A crash can leave the database <strong>corrupt and unrecoverable<\/strong>, because pages and WAL can be reordered arbitrarily. Never acceptable in production; defensible for a throwaway CI database that is rebuilt from scratch.<\/li><li><strong><code>full_page_writes = off<\/code><\/strong> - PostgreSQL stops writing a full image of each page the first time it is modified after a checkpoint. Those images exist to survive <strong>torn pages<\/strong> (a partial 8 KB write when the storage&#x27;s atomic unit is 4 KB or 512 bytes). Turning it off is safe only on storage that guarantees atomic 8 KB writes - some SANs, ZFS with matching record size, Aurora&#x27;s log-structured storage - and corrupts on ordinary hardware.<\/li><\/ul><p>The ranking: <code>synchronous_commit = off<\/code> is a considered trade; <code>full_page_writes = off<\/code> requires a storage guarantee in writing; <code>fsync = off<\/code> is never a production option.<\/p>", "source": "answers.md", "search": "synchronous_commit = off, fsync = off and full_page_writes. what exactly do you lose with each, and which is never acceptable? - synchronous_commit = off - the commit record is written to the wal buffer but the backend does not wait for the fsync. you lose up to wal_writer_delay x 3 (a few hundred milliseconds) of committed transactions on a crash, but the database stays consistent - it is a bounded data-loss window, not corruption. this is a legitimate, per-transaction setting for low-value high-volume writes (telemetry, click events), and it is a large throughput win. - fsync = off - postgresql never forces anything to stable storage. a crash can leave the database corrupt and unrecoverable , because pages and wal can be reordered arbitrarily. never acceptable in production; defensible for a throwaway ci database that is rebuilt from scratch. - full_page_writes = off - postgresql stops writing a full image of each page the first time it is modified after a checkpoint. those images exist to survive torn pages (a partial 8 kb write when the storage's atomic unit is 4 kb or 512 bytes). turning it off is safe only on storage that guarantees atomic 8 kb writes - some sans, zfs with matching record size, aurora's log-structured storage - and corrupts on ordinary hardware. the ranking: synchronous_commit = off is a considered trade; full_page_writes = off requires a storage guarantee in writing; fsync = off is never a production option."}, {"n": 127, "category": 7, "difficulty": "T", "html": "A <code>COMMIT<\/code> returned successfully and the row is gone after a power loss. Give every layer at which this could have happened.", "answerTitle": "Committed, then gone after power loss", "answer": "<p>Layer by layer, any of these breaks the chain:<\/p><ol><li><strong><code>synchronous_commit = off<\/code><\/strong> or <code>commit_delay<\/code> in PostgreSQL - the acknowledgement came before the flush (Q126). Configuration, not a bug.<\/li><li><strong>The filesystem lied.<\/strong> <code>fsync<\/code> returned success while data sat in a write buffer; some filesystems and older kernels also <em>lost the error<\/em> on a failed writeback and returned success to the next <code>fsync<\/code> (the &quot;fsyncgate&quot; issue), so a failed write was never retried.<\/li><li><strong>A volatile disk cache.<\/strong> The drive acknowledged the write from its own DRAM cache with no power-loss protection, or a RAID controller had a write-back cache with a dead battery. Consumer SSDs are the classic case.<\/li><li><strong>A virtualization or network storage layer<\/strong> that buffers, or an NFS mount with the wrong options.<\/li><li><strong>Replication assumptions<\/strong>: the primary crashed permanently and you failed over to an <strong>asynchronous<\/strong> standby that had not received the commit. The write was durable - just not on the machine you now use (Q140).<\/li><li><strong>The application never committed<\/strong> - autocommit off and a connection reset, or a pooler returning a connection that rolled back.<\/li><\/ol><p>How I would investigate: check <code>synchronous_commit<\/code> first, then the storage stack&#x27;s cache settings (<code>hdparm<\/code>, controller battery state, cloud volume type), then whether a failover happened at that moment. And the preventive answer: test it. A power-cut test with a write-verifying tool, or at minimum a documented storage configuration, is the only way anyone actually knows.<\/p>", "source": "answers.md", "search": "a commit returned successfully and the row is gone after a power loss. give every layer at which this could have happened. layer by layer, any of these breaks the chain: 1. synchronous_commit = off or commit_delay in postgresql - the acknowledgement came before the flush (q126). configuration, not a bug. 2. the filesystem lied. fsync returned success while data sat in a write buffer; some filesystems and older kernels also lost the error on a failed writeback and returned success to the next fsync (the \"fsyncgate\" issue), so a failed write was never retried. 3. a volatile disk cache. the drive acknowledged the write from its own dram cache with no power-loss protection, or a raid controller had a write-back cache with a dead battery. consumer ssds are the classic case. 4. a virtualization or network storage layer that buffers, or an nfs mount with the wrong options. 5. replication assumptions : the primary crashed permanently and you failed over to an asynchronous standby that had not received the commit. the write was durable - just not on the machine you now use (q140). 6. the application never committed - autocommit off and a connection reset, or a pooler returning a connection that rolled back. how i would investigate: check synchronous_commit first, then the storage stack's cache settings (hdparm, controller battery state, cloud volume type), then whether a failover happened at that moment. and the preventive answer: test it. a power-cut test with a write-verifying tool, or at minimum a documented storage configuration, is the only way anyone actually knows."}, {"n": 128, "category": 7, "difficulty": "D", "html": "Checkpoints: what triggers them, what a checkpoint spike looks like in metrics, and how you smooth it.", "answerTitle": "Checkpoints", "answer": "<p>A checkpoint flushes all dirty shared buffers to disk and writes a checkpoint record, so that recovery need only replay WAL from that point. It is triggered by <code>checkpoint_timeout<\/code> (default 5 minutes), by WAL volume reaching <code>max_wal_size<\/code>, or explicitly by <code>CHECKPOINT<\/code>, a base backup or a shutdown.<\/p><p>A checkpoint spike looks like: a periodic burst of write IO and IO wait, a latency spike in write transactions every N minutes, a corresponding spike in WAL volume (because the first write to each page after a checkpoint carries a <strong>full page image<\/strong>, Q126), and in <code>pg_stat_bgwriter<\/code> a high <code>checkpoints_req<\/code> relative to <code>checkpoints_timed<\/code>.<\/p><p>Smoothing it: raise <code>max_wal_size<\/code> so checkpoints are time-driven rather than volume-driven (<code>checkpoints_req<\/code> should be near zero), raise <code>checkpoint_timeout<\/code> to 15-30 minutes to spread the work and reduce full-page-image volume, and keep <code>checkpoint_completion_target<\/code> at 0.9 so the flush is spread across most of the interval. The trade is recovery time: fewer checkpoints means more WAL to replay after a crash, so the setting is really a dial between steady-state latency and RTO.<\/p>", "source": "answers.md", "search": "checkpoints: what triggers them, what a checkpoint spike looks like in metrics, and how you smooth it. a checkpoint flushes all dirty shared buffers to disk and writes a checkpoint record, so that recovery need only replay wal from that point. it is triggered by checkpoint_timeout (default 5 minutes), by wal volume reaching max_wal_size, or explicitly by checkpoint, a base backup or a shutdown. a checkpoint spike looks like: a periodic burst of write io and io wait, a latency spike in write transactions every n minutes, a corresponding spike in wal volume (because the first write to each page after a checkpoint carries a full page image , q126), and in pg_stat_bgwriter a high checkpoints_req relative to checkpoints_timed. smoothing it: raise max_wal_size so checkpoints are time-driven rather than volume-driven (checkpoints_req should be near zero), raise checkpoint_timeout to 15-30 minutes to spread the work and reduce full-page-image volume, and keep checkpoint_completion_target at 0.9 so the flush is spread across most of the interval. the trade is recovery time: fewer checkpoints means more wal to replay after a crash, so the setting is really a dial between steady-state latency and rto."}, {"n": 129, "category": 7, "difficulty": "D", "html": "TOAST: when a value is toasted, the four storage strategies, and the performance surprise a large <code>text<\/code> column creates.", "answerTitle": "TOAST", "answer": "<p>A tuple cannot span a page, so when a row exceeds roughly 2 KB (<code>TOAST_TUPLE_THRESHOLD<\/code>), PostgreSQL compresses and/or moves the largest variable-length values out to a side table, leaving an 18-byte pointer in the row. The side table is chunked into ~2 KB pieces with its own index.<\/p><p>The four strategies, set per column:<\/p><ul><li><code>PLAIN<\/code> - no compression or out-of-line storage (fixed-width types only).<\/li><li><code>EXTENDED<\/code> - compress, then move out of line if still too big. The default for <code>text<\/code>, <code>jsonb<\/code>, <code>bytea<\/code>.<\/li><li><code>EXTERNAL<\/code> - move out of line without compressing. Faster substring and streaming access on large values, at the cost of space.<\/li><li><code>MAIN<\/code> - compress but avoid moving out of line if at all possible.<\/li><\/ul><p>The performance surprise: a large <code>text<\/code> or <code>jsonb<\/code> column is <em>cheap<\/em> to ignore - <code>SELECT id, status<\/code> never touches the TOAST table - but expensive to touch, because reading it means an index lookup plus several chunk reads plus decompression. So <code>SELECT *<\/code> on a table with a big document column is dramatically more expensive than selecting the columns you need, and an <code>UPDATE<\/code> that does not modify the TOASTed column does not rewrite it (the pointer is copied), which is why updating a small flag on a document row is cheaper than people expect.<\/p>", "source": "answers.md", "search": "toast: when a value is toasted, the four storage strategies, and the performance surprise a large text column creates. a tuple cannot span a page, so when a row exceeds roughly 2 kb (toast_tuple_threshold), postgresql compresses and/or moves the largest variable-length values out to a side table, leaving an 18-byte pointer in the row. the side table is chunked into ~2 kb pieces with its own index. the four strategies, set per column: - plain - no compression or out-of-line storage (fixed-width types only). - extended - compress, then move out of line if still too big. the default for text, jsonb, bytea. - external - move out of line without compressing. faster substring and streaming access on large values, at the cost of space. - main - compress but avoid moving out of line if at all possible. the performance surprise: a large text or jsonb column is cheap to ignore - select id, status never touches the toast table - but expensive to touch, because reading it means an index lookup plus several chunk reads plus decompression. so select on a table with a big document column is dramatically more expensive than selecting the columns you need, and an update that does not modify the toasted column does not rewrite it (the pointer is copied), which is why updating a small flag on a document row is cheaper than people expect."}, {"n": 130, "category": 7, "difficulty": "D", "html": "HOT updates and <code>fillfactor<\/code>. Which updates qualify as HOT, and how does an index on a frequently updated column destroy this?", "answerTitle": "HOT updates and `fillfactor`", "answer": "<p>A <strong>Heap-Only Tuple<\/strong> update places the new row version on the <strong>same page<\/strong> as the old one and links them with a <code>t_ctid<\/code> chain, updating no index at all - existing index entries continue to point at the original line pointer, which now redirects to the newest version. Index maintenance disappears, and the space from dead versions in the chain can be reclaimed by page pruning without a full vacuum.<\/p><p>Two conditions must both hold: <strong>no indexed column is modified<\/strong>, and <strong>the new version fits on the same page<\/strong>.<\/p><p><code>fillfactor<\/code> (default 100 for heaps) controls how full a page is packed on insert. Setting it to 80-90 on a frequently updated table reserves space so later versions fit, which is precisely what keeps HOT working.<\/p><p>The failure mode this explains: adding an index on a column that is updated on every write - a <code>last_seen_at<\/code>, a <code>status<\/code> that churns, a counter - takes the table from mostly-HOT to zero-HOT. Suddenly every update writes to all indexes, WAL volume multiplies, indexes bloat, and autovacuum cannot keep up. It is a genuinely non-obvious way that one index harms a table globally (Q61).<\/p>", "source": "answers.md", "search": "hot updates and fillfactor. which updates qualify as hot, and how does an index on a frequently updated column destroy this? a heap-only tuple update places the new row version on the same page as the old one and links them with a t_ctid chain, updating no index at all - existing index entries continue to point at the original line pointer, which now redirects to the newest version. index maintenance disappears, and the space from dead versions in the chain can be reclaimed by page pruning without a full vacuum. two conditions must both hold: no indexed column is modified , and the new version fits on the same page . fillfactor (default 100 for heaps) controls how full a page is packed on insert. setting it to 80-90 on a frequently updated table reserves space so later versions fit, which is precisely what keeps hot working. the failure mode this explains: adding an index on a column that is updated on every write - a last_seen_at, a status that churns, a counter - takes the table from mostly-hot to zero-hot. suddenly every update writes to all indexes, wal volume multiplies, indexes bloat, and autovacuum cannot keep up. it is a genuinely non-obvious way that one index harms a table globally (q61)."}, {"n": 131, "category": 7, "difficulty": "D", "html": "Table bloat versus index bloat: how each is created, measured and fixed, and why disk usage does not fall after a <code>DELETE<\/code>.", "answerTitle": "Table bloat versus index bloat", "answer": "<p><strong>Table bloat<\/strong> is dead tuples plus unusable free space in heap pages: created by updates and deletes under MVCC, reclaimed <em>for reuse<\/em> by vacuum but not returned to the OS. <strong>Index bloat<\/strong> is dead entries and half-empty pages from splits: B-trees do not merge underfull pages, so an index never shrinks on its own.<\/p><p>Why disk usage does not fall after a <code>DELETE<\/code>: the rows become dead tuples, vacuum marks their space reusable in the free space map, and PostgreSQL then reuses it for future inserts. The file only shrinks if the free space is at the <em>end<\/em> of the relation, which vacuum can truncate. Deleting 90 percent of a table scattered throughout leaves the file the same size.<\/p><p>Measure with <code>pgstattuple<\/code> (exact, but it scans) or the standard estimate queries (cheap, approximate), and watch the ratio of table size to <code>n_live_tup * avg_width<\/code>. Fix the heap with <code>pg_repack<\/code> or <code>VACUUM FULL<\/code> (Q95), the index with <code>REINDEX CONCURRENTLY<\/code> (Q57) - and then fix the cause, which is nearly always autovacuum being too slow for the table&#x27;s churn or a long transaction pinning the horizon.<\/p>", "source": "answers.md", "search": "table bloat versus index bloat: how each is created, measured and fixed, and why disk usage does not fall after a delete. table bloat is dead tuples plus unusable free space in heap pages: created by updates and deletes under mvcc, reclaimed for reuse by vacuum but not returned to the os. index bloat is dead entries and half-empty pages from splits: b-trees do not merge underfull pages, so an index never shrinks on its own. why disk usage does not fall after a delete: the rows become dead tuples, vacuum marks their space reusable in the free space map, and postgresql then reuses it for future inserts. the file only shrinks if the free space is at the end of the relation, which vacuum can truncate. deleting 90 percent of a table scattered throughout leaves the file the same size. measure with pgstattuple (exact, but it scans) or the standard estimate queries (cheap, approximate), and watch the ratio of table size to n_live_tup avg_width. fix the heap with pg_repack or vacuum full (q95), the index with reindex concurrently (q57) - and then fix the cause, which is nearly always autovacuum being too slow for the table's churn or a long transaction pinning the horizon."}, {"n": 132, "category": 7, "difficulty": "D", "html": "B-tree versus LSM tree. Compare write amplification, read amplification, space amplification and compaction behavior.", "answerTitle": "B-tree versus LSM", "answer": "<table><thead><tr><th><\/th><th>B-tree<\/th><th>LSM tree<\/th><\/tr><\/thead><tbody><tr><td>Write path<\/td><td>in-place (or new version) page write, random IO<\/td><td>append to memtable, flush sorted runs, sequential IO<\/td><\/tr><tr><td>Write amplification<\/td><td>~1 page per change plus WAL, but random<\/td><td>high over time - each level rewrites data during compaction (often 10-30x)<\/td><\/tr><tr><td>Read amplification<\/td><td>~tree depth, one path<\/td><td>must check memtable plus several SSTables per level; bloom filters cut this<\/td><\/tr><tr><td>Space amplification<\/td><td>bloat from splits, typically 1.2-1.5x<\/td><td>obsolete versions until compacted; leveled ~1.1x, tiered can be 2x+<\/td><\/tr><tr><td>Range scans<\/td><td>excellent, leaves are linked<\/td><td>good, but merges across runs<\/td><\/tr><tr><td>Latency profile<\/td><td>predictable<\/td><td>good median, <strong>compaction causes p99 spikes<\/strong><\/td><\/tr><\/tbody><\/table><p>LSM (RocksDB, Cassandra, HBase, ScyllaDB) wins on ingest-heavy workloads because it turns random writes into sequential ones and defers the reorganization. B-trees win on read-heavy and update-in-place workloads and give more predictable latency.<\/p>", "source": "answers.md", "search": "b-tree versus lsm tree. compare write amplification, read amplification, space amplification and compaction behavior. b-tree lsm tree --- --- --- write path in-place (or new version) page write, random io append to memtable, flush sorted runs, sequential io write amplification ~1 page per change plus wal, but random high over time - each level rewrites data during compaction (often 10-30x) read amplification ~tree depth, one path must check memtable plus several sstables per level; bloom filters cut this space amplification bloat from splits, typically 1.2-1.5x obsolete versions until compacted; leveled ~1.1x, tiered can be 2x+ range scans excellent, leaves are linked good, but merges across runs latency profile predictable good median, compaction causes p99 spikes lsm (rocksdb, cassandra, hbase, scylladb) wins on ingest-heavy workloads because it turns random writes into sequential ones and defers the reorganization. b-trees win on read-heavy and update-in-place workloads and give more predictable latency."}, {"n": 133, "category": 7, "difficulty": "T", "html": "&quot;LSM is faster for writes.&quot; Under what workload is that false, and what does compaction do to your p99?", "answerTitle": "\"LSM is faster for writes\"", "answer": "<p>It is false in three situations. First, an <strong>update-heavy workload on a small dataset that fits in cache<\/strong>: a B-tree updates a cached page and writes one WAL record, while the LSM writes the record, then rewrites it repeatedly through every compaction level - total bytes written to disk are far higher. Second, a <strong>read-modify-write workload<\/strong>, because the LSM must first do a (more expensive) read, and many LSM engines then need a read-before-write for correctness. Third, <strong>sustained<\/strong> write throughput near the disk&#x27;s limit: the LSM&#x27;s advertised speed is the memtable append, but compaction runs in the background consuming the same IO budget, so steady-state throughput is bounded by write amplification, not by the append rate.<\/p><p>What compaction does to p99: it competes for disk bandwidth and CPU (compression), evicts the page cache with data nobody asked for, and in the worst case triggers <strong>write stalls<\/strong> when the memtable cannot flush because L0 has too many files - at which point writes block entirely for hundreds of milliseconds. This is the Cassandra and RocksDB operational reality: the median is excellent, the tail is where you spend your time, and tuning is mostly about compaction strategy (leveled versus size-tiered versus time-window) and giving compaction enough headroom.<\/p>", "source": "answers.md", "search": "\"lsm is faster for writes.\" under what workload is that false, and what does compaction do to your p99? it is false in three situations. first, an update-heavy workload on a small dataset that fits in cache : a b-tree updates a cached page and writes one wal record, while the lsm writes the record, then rewrites it repeatedly through every compaction level - total bytes written to disk are far higher. second, a read-modify-write workload , because the lsm must first do a (more expensive) read, and many lsm engines then need a read-before-write for correctness. third, sustained write throughput near the disk's limit: the lsm's advertised speed is the memtable append, but compaction runs in the background consuming the same io budget, so steady-state throughput is bounded by write amplification, not by the append rate. what compaction does to p99: it competes for disk bandwidth and cpu (compression), evicts the page cache with data nobody asked for, and in the worst case triggers write stalls when the memtable cannot flush because l0 has too many files - at which point writes block entirely for hundreds of milliseconds. this is the cassandra and rocksdb operational reality: the median is excellent, the tail is where you spend your time, and tuning is mostly about compaction strategy (leveled versus size-tiered versus time-window) and giving compaction enough headroom."}, {"n": 134, "category": 7, "difficulty": "D", "html": "Row store versus column store: physical layout, compression ratios, and the query shapes each destroys.", "answerTitle": "Row store versus column store", "answer": "<p>A row store keeps a whole tuple contiguously, so reading one row is one page read and writing one row is one page write. A column store keeps each column&#x27;s values together in large blocks, so reading three columns of a billion-row table touches only those columns.<\/p><p>Compression is the multiplier: a column of values of the same type with low cardinality compresses 5-20x with dictionary and run-length encoding, versus perhaps 2-3x for mixed-type rows. Less data read means less IO, and vectorized execution over a packed array is far more CPU-efficient per row.<\/p><p>What each destroys: a column store is terrible at <code>SELECT *<\/code> for one row (it must assemble the row from N column blocks), at single-row <code>INSERT<\/code>/<code>UPDATE<\/code>/<code>DELETE<\/code> (blocks are large and often immutable, so updates become delete-markers plus rewrite), and at point lookups without a suitable index. A row store is terrible at scanning two columns of a 200-column table, because it reads all 200.<\/p><p>Hence the split: OLTP on row stores, analytics on column stores, and hybrid engines (Aurora, SQL Server columnstore indexes, Oracle In-Memory) that keep both representations of the same data.<\/p>", "source": "answers.md", "search": "row store versus column store: physical layout, compression ratios, and the query shapes each destroys. a row store keeps a whole tuple contiguously, so reading one row is one page read and writing one row is one page write. a column store keeps each column's values together in large blocks, so reading three columns of a billion-row table touches only those columns. compression is the multiplier: a column of values of the same type with low cardinality compresses 5-20x with dictionary and run-length encoding, versus perhaps 2-3x for mixed-type rows. less data read means less io, and vectorized execution over a packed array is far more cpu-efficient per row. what each destroys: a column store is terrible at select for one row (it must assemble the row from n column blocks), at single-row insert/update/delete (blocks are large and often immutable, so updates become delete-markers plus rewrite), and at point lookups without a suitable index. a row store is terrible at scanning two columns of a 200-column table, because it reads all 200. hence the split: oltp on row stores, analytics on column stores, and hybrid engines (aurora, sql server columnstore indexes, oracle in-memory) that keep both representations of the same data."}, {"n": 135, "category": 7, "difficulty": "D", "html": "Compression: page-level, column-level and dictionary encoding. What does it buy beyond disk, and what does it cost on CPU?", "answerTitle": "Compression", "answer": "<p><strong>Page-level<\/strong> compression (InnoDB page compression, ZFS) compresses whole pages transparently; it is simple but must decompress a whole page to read a row, and the compressed page still occupies a fixed slot. <strong>Column-level<\/strong> compression in a columnar format compresses runs of a single type, achieving much better ratios. <strong>Dictionary encoding<\/strong> replaces repeated values with small integer codes, which is what makes low-cardinality string columns nearly free and, crucially, lets some engines evaluate predicates <strong>directly on the encoded values<\/strong> without decompressing.<\/p><p>What it buys beyond disk: fewer bytes read means fewer IOs and better effective cache capacity - a 5x compression ratio means 5x more data fits in the buffer pool, which is usually a larger win than the disk saving. On network-attached or object storage, it also cuts transfer time and cost directly.<\/p><p>What it costs: CPU on read and write (mitigated by fast codecs such as LZ4 and Zstandard, which are chosen precisely because decompression is faster than the IO saved), higher latency on point lookups, and in some engines a loss of in-place update. The rule of thumb: use LZ4 or Zstd level 1 for hot data where CPU matters, higher Zstd levels for cold and archival data.<\/p>", "source": "answers.md", "search": "compression: page-level, column-level and dictionary encoding. what does it buy beyond disk, and what does it cost on cpu? page-level compression (innodb page compression, zfs) compresses whole pages transparently; it is simple but must decompress a whole page to read a row, and the compressed page still occupies a fixed slot. column-level compression in a columnar format compresses runs of a single type, achieving much better ratios. dictionary encoding replaces repeated values with small integer codes, which is what makes low-cardinality string columns nearly free and, crucially, lets some engines evaluate predicates directly on the encoded values without decompressing. what it buys beyond disk: fewer bytes read means fewer ios and better effective cache capacity - a 5x compression ratio means 5x more data fits in the buffer pool, which is usually a larger win than the disk saving. on network-attached or object storage, it also cuts transfer time and cost directly. what it costs: cpu on read and write (mitigated by fast codecs such as lz4 and zstandard, which are chosen precisely because decompression is faster than the io saved), higher latency on point lookups, and in some engines a loss of in-place update. the rule of thumb: use lz4 or zstd level 1 for hot data where cpu matters, higher zstd levels for cold and archival data."}, {"n": 136, "category": 7, "difficulty": "D", "html": "How is durability achieved on cloud storage? Explain Aurora&#x27;s log-structured approach and why it claims to avoid full page writes.", "answerTitle": "Durability on cloud storage, and Aurora", "answer": "<p>Ordinary cloud databases run the same WAL protocol over a network block device (EBS): every <code>fsync<\/code> is a network round trip, so commit latency is bounded by storage latency and the WAL device&#x27;s throughput.<\/p><p>Aurora changes the contract: the database instance <strong>does not write data pages at all<\/strong>. It ships only WAL records to a purpose-built distributed storage layer of six replicas across three availability zones, and a write is durable when <strong>four of six<\/strong> acknowledge (a write quorum with <code>W=4, R=3, N=6<\/code>, so it survives an entire AZ plus one more node). The storage nodes apply the log to materialize pages in the background, on demand.<\/p><p>That removes the two biggest write amplifiers: no checkpoint page flushes across the network, and <strong>no full-page writes<\/strong>, because the storage layer&#x27;s page materialization is atomic by construction rather than depending on 8 KB atomic sector writes (Q126). Aurora claims roughly an order-of-magnitude reduction in bytes written compared with mirrored PostgreSQL.<\/p><p>What it does not fix: single-writer architecture (one primary for writes, unless you use multi-master with its own conflict rules), commit latency still crossing AZs, per-IO pricing that can dominate the bill on write-heavy workloads, and none of your query-level problems.<\/p>", "source": "answers.md", "search": "how is durability achieved on cloud storage? explain aurora's log-structured approach and why it claims to avoid full page writes. ordinary cloud databases run the same wal protocol over a network block device (ebs): every fsync is a network round trip, so commit latency is bounded by storage latency and the wal device's throughput. aurora changes the contract: the database instance does not write data pages at all . it ships only wal records to a purpose-built distributed storage layer of six replicas across three availability zones, and a write is durable when four of six acknowledge (a write quorum with w=4, r=3, n=6, so it survives an entire az plus one more node). the storage nodes apply the log to materialize pages in the background, on demand. that removes the two biggest write amplifiers: no checkpoint page flushes across the network, and no full-page writes , because the storage layer's page materialization is atomic by construction rather than depending on 8 kb atomic sector writes (q126). aurora claims roughly an order-of-magnitude reduction in bytes written compared with mirrored postgresql. what it does not fix: single-writer architecture (one primary for writes, unless you use multi-master with its own conflict rules), commit latency still crossing azs, per-io pricing that can dominate the bill on write-heavy workloads, and none of your query-level problems."}, {"n": 137, "category": 7, "difficulty": "T", "html": "Your database is on network-attached storage with a 1ms round trip. Which specific operations become the bottleneck, and what do you tune?", "answerTitle": "Network-attached storage with 1 ms round trip", "answer": "<p>The operations that become the bottleneck are the <strong>synchronous, serial<\/strong> ones - anything where the database must wait for storage before continuing:<\/p><ol><li><strong>WAL <code>fsync<\/code> at commit.<\/strong> Every commit costs at least one round trip, so a single-threaded writer is capped near 1,000 commits per second regardless of CPU. This is the dominant effect.<\/li><li><strong>Random single-page reads<\/strong> on a buffer-pool miss - an index scan fetching 10,000 scattered heap pages now costs 10 seconds of pure latency, because they are issued one at a time.<\/li><li><strong>Checkpoint bursts<\/strong> and any operation that must flush many pages.<\/li><\/ol><p>What you tune: enable <strong><code>commit_delay<\/code>/group commit<\/strong> so concurrent commits share one flush, which converts N round trips into one and is the single biggest win; raise <code>effective_io_concurrency<\/code> so bitmap heap scans issue prefetches in parallel; raise <code>random_page_cost<\/code> relative to <code>seq_page_cost<\/code> to tell the planner that random access really is expensive here; increase <code>shared_buffers<\/code> and <code>effective_cache_size<\/code> so more reads never reach storage; batch application writes so fewer transactions each commit more work; and, where the workload allows, <code>synchronous_commit = off<\/code> for the low-value paths (Q126). If the platform allows it, putting WAL on a lower-latency volume than the data files is the structural fix.<\/p>", "source": "answers.md", "search": "your database is on network-attached storage with a 1ms round trip. which specific operations become the bottleneck, and what do you tune? the operations that become the bottleneck are the synchronous, serial ones - anything where the database must wait for storage before continuing: 1. wal fsync at commit. every commit costs at least one round trip, so a single-threaded writer is capped near 1,000 commits per second regardless of cpu. this is the dominant effect. 2. random single-page reads on a buffer-pool miss - an index scan fetching 10,000 scattered heap pages now costs 10 seconds of pure latency, because they are issued one at a time. 3. checkpoint bursts and any operation that must flush many pages. what you tune: enable commit_delay/group commit so concurrent commits share one flush, which converts n round trips into one and is the single biggest win; raise effective_io_concurrency so bitmap heap scans issue prefetches in parallel; raise random_page_cost relative to seq_page_cost to tell the planner that random access really is expensive here; increase shared_buffers and effective_cache_size so more reads never reach storage; batch application writes so fewer transactions each commit more work; and, where the workload allows, synchronous_commit = off for the low-value paths (q126). if the platform allows it, putting wal on a lower-latency volume than the data files is the structural fix."}, {"n": 138, "category": 7, "difficulty": "D", "html": "Temporary files and spilling to disk: which operations spill, how you detect it, and the two ways to stop it.", "answerTitle": "Temp files and spilling", "answer": "<p>Operations that spill: sorts (<code>ORDER BY<\/code>, merge joins, <code>CREATE INDEX<\/code>), hash joins and hash aggregates when the hash table exceeds <code>work_mem<\/code>, materialized CTEs and <code>Materialize<\/code> nodes, large bitmap scans (which degrade to lossy first, Q52), and window functions with big frames.<\/p><p>Detection: <code>log_temp_files = 0<\/code> logs every temp file with its size; <code>pg_stat_database.temp_files<\/code> and <code>temp_bytes<\/code> give the running totals; and in <code>EXPLAIN (ANALYZE)<\/code> look for <code>Sort Method: external merge Disk: NNNkB<\/code>, <code>Batches: 8<\/code> on a hash join (more than 1 means spilling), or <code>Disk: NNNkB<\/code> on a hash aggregate.<\/p><p>The two ways to stop it: <strong>give the operation more memory<\/strong> - <code>SET LOCAL work_mem<\/code> for that transaction, sized to the observed spill plus headroom, rather than globally (Q76); or <strong>make the operation smaller<\/strong> - an index that provides the required order so no sort is needed at all, a more selective predicate, aggregation pushed down before the join, or partitioning so only one partition is processed. The index route is strictly better when available, because it removes the work rather than funding it.<\/p><p><em>Hook: a spill you found with <code>log_temp_files<\/code> and what removing it did to p99.<\/em><\/p>", "source": "answers.md", "search": "temporary files and spilling to disk: which operations spill, how you detect it, and the two ways to stop it. operations that spill: sorts (order by, merge joins, create index), hash joins and hash aggregates when the hash table exceeds work_mem, materialized ctes and materialize nodes, large bitmap scans (which degrade to lossy first, q52), and window functions with big frames. detection: log_temp_files = 0 logs every temp file with its size; pg_stat_database.temp_files and temp_bytes give the running totals; and in explain (analyze) look for sort method: external merge disk: nnnkb, batches: 8 on a hash join (more than 1 means spilling), or disk: nnnkb on a hash aggregate. the two ways to stop it: give the operation more memory - set local work_mem for that transaction, sized to the observed spill plus headroom, rather than globally (q76); or make the operation smaller - an index that provides the required order so no sort is needed at all, a more selective predicate, aggregation pushed down before the join, or partitioning so only one partition is processed. the index route is strictly better when available, because it removes the work rather than funding it. hook: a spill you found with log_temp_files and what removing it did to p99."}, {"n": 139, "category": 8, "difficulty": "C", "html": "Physical (streaming) versus logical replication. What each replicates, what each cannot do, and the version-compatibility rules.", "answerTitle": "Physical versus logical replication", "answer": "<p><strong>Physical (streaming)<\/strong> replication ships the WAL byte stream and the standby replays it at the block level. It replicates <strong>everything<\/strong> - all databases, all tables, DDL, indexes, even physical layout - and produces a byte-identical copy. It cannot replicate a subset, cannot write to the standby, and requires the <strong>same major version and same architecture<\/strong> on both ends.<\/p><p><strong>Logical<\/strong> replication decodes the WAL into row-level change events (insert/update/delete with column values) and applies them as SQL on the subscriber. It replicates <strong>selected tables<\/strong> in selected databases, allows the subscriber to have extra tables, extra indexes and its own writes, and works <strong>across major versions<\/strong> - which is what makes it the standard tool for near-zero-downtime upgrades and for feeding CDC pipelines.<\/p><p>Logical&#x27;s limitations are the interview payload: <strong>DDL is not replicated<\/strong> (you must apply schema changes on both sides in the right order), the publisher needs <code>wal_level = logical<\/code> and a <strong>replication slot<\/strong> per subscription (Q148), tables need a replica identity - a primary key, or <code>REPLICA IDENTITY FULL<\/code> which is expensive - sequences are not replicated, and initial synchronization copies data table by table.<\/p>", "source": "answers.md", "search": "physical (streaming) versus logical replication. what each replicates, what each cannot do, and the version-compatibility rules. physical (streaming) replication ships the wal byte stream and the standby replays it at the block level. it replicates everything - all databases, all tables, ddl, indexes, even physical layout - and produces a byte-identical copy. it cannot replicate a subset, cannot write to the standby, and requires the same major version and same architecture on both ends. logical replication decodes the wal into row-level change events (insert/update/delete with column values) and applies them as sql on the subscriber. it replicates selected tables in selected databases, allows the subscriber to have extra tables, extra indexes and its own writes, and works across major versions - which is what makes it the standard tool for near-zero-downtime upgrades and for feeding cdc pipelines. logical's limitations are the interview payload: ddl is not replicated (you must apply schema changes on both sides in the right order), the publisher needs wal_level = logical and a replication slot per subscription (q148), tables need a replica identity - a primary key, or replica identity full which is expensive - sequences are not replicated, and initial synchronization copies data table by table."}, {"n": 140, "category": 8, "difficulty": "D", "html": "Asynchronous, synchronous and quorum-based synchronous commit. State the RPO of each and the latency cost.", "answerTitle": "Async, sync and quorum commit", "answer": "<table><thead><tr><th>Mode<\/th><th>Commit waits for<\/th><th>RPO<\/th><th>Latency cost<\/th><\/tr><\/thead><tbody><tr><td><code>off<\/code> / async<\/td><td>local WAL flush only<\/td><td>seconds of transactions (whatever is unshipped)<\/td><td>none<\/td><\/tr><tr><td><code>remote_write<\/code><\/td><td>standby has received and written to OS<\/td><td>zero unless the standby OS crashes too<\/td><td>one network round trip<\/td><\/tr><tr><td><code>on<\/code> (default sync)<\/td><td>standby has <strong>flushed<\/strong> to disk<\/td><td>zero for a primary-only failure<\/td><td>round trip plus standby fsync<\/td><\/tr><tr><td><code>remote_apply<\/code><\/td><td>standby has <strong>applied<\/strong> and made visible<\/td><td>zero, and reads on that standby are current<\/td><td>round trip plus fsync plus replay<\/td><\/tr><tr><td>quorum (<code>ANY k (...)<\/code>)<\/td><td>any k of the listed standbys<\/td><td>zero while k survive<\/td><td>round trip to the k-th fastest<\/td><\/tr><\/tbody><\/table><p>The point to make: synchronous replication protects <strong>durability<\/strong>, not availability, and the latency is added to <em>every<\/em> commit, so a cross-region synchronous standby means every write pays the inter-region RTT - typically 20-80 ms, which is a throughput collapse for chatty workloads. Quorum (<code>ANY 1 (s1, s2, s3)<\/code>) is the practical compromise: you wait for the fastest of several standbys, so one slow node does not stall commits, and you still have a durable copy elsewhere. <code>remote_apply<\/code> is the only mode that gives read-your-writes on the standby, and it is the slowest.<\/p>", "source": "answers.md", "search": "asynchronous, synchronous and quorum-based synchronous commit. state the rpo of each and the latency cost. mode commit waits for rpo latency cost --- --- --- --- off / async local wal flush only seconds of transactions (whatever is unshipped) none remote_write standby has received and written to os zero unless the standby os crashes too one network round trip on (default sync) standby has flushed to disk zero for a primary-only failure round trip plus standby fsync remote_apply standby has applied and made visible zero, and reads on that standby are current round trip plus fsync plus replay quorum (any k (...)) any k of the listed standbys zero while k survive round trip to the k-th fastest the point to make: synchronous replication protects durability , not availability, and the latency is added to every commit, so a cross-region synchronous standby means every write pays the inter-region rtt - typically 20-80 ms, which is a throughput collapse for chatty workloads. quorum (any 1 (s1, s2, s3)) is the practical compromise: you wait for the fastest of several standbys, so one slow node does not stall commits, and you still have a durable copy elsewhere. remote_apply is the only mode that gives read-your-writes on the standby, and it is the slowest."}, {"n": 141, "category": 8, "difficulty": "T", "html": "<code>synchronous_standby_names<\/code> with one standby, and that standby dies. What happens to your primary, and what does that teach you about synchronous replication?", "answerTitle": "The only synchronous standby dies", "answer": "<p>The primary <strong>stops committing<\/strong>. Every commit waits indefinitely for an acknowledgement that will never come; sessions hang in <code>SyncRep<\/code> wait state, connections accumulate, and the application sees writes hanging rather than failing. Reads continue to work, which makes the diagnosis confusing. The transactions are already durable locally and <em>will<\/em> be visible after a restart, but the client never gets an acknowledgement.<\/p><p>What it teaches: <strong>synchronous replication with a single standby converts a durability guarantee into an availability liability.<\/strong> You have chosen RPO=0 and paid for it with a system whose write availability is the <em>product<\/em> of two machines&#x27; availability - worse than the primary alone.<\/p><p>The correct configurations: at least <strong>two<\/strong> synchronous candidates with quorum (<code>synchronous_standby_names = &#x27;ANY 1 (s1, s2)&#x27;<\/code>), so any one can fail without stalling; monitoring that alerts on a missing sync standby immediately; and an explicit, documented <strong>operational decision<\/strong> about whether to degrade to async during an outage (<code>ALTER SYSTEM SET synchronous_standby_names = &#x27;&#x27;; SELECT pg_reload_conf();<\/code>). That decision is a business one - it trades RPO for availability - and it must be made before the incident, not during it.<\/p>", "source": "answers.md", "search": "synchronous_standby_names with one standby, and that standby dies. what happens to your primary, and what does that teach you about synchronous replication? the primary stops committing . every commit waits indefinitely for an acknowledgement that will never come; sessions hang in syncrep wait state, connections accumulate, and the application sees writes hanging rather than failing. reads continue to work, which makes the diagnosis confusing. the transactions are already durable locally and will be visible after a restart, but the client never gets an acknowledgement. what it teaches: synchronous replication with a single standby converts a durability guarantee into an availability liability. you have chosen rpo=0 and paid for it with a system whose write availability is the product of two machines' availability - worse than the primary alone. the correct configurations: at least two synchronous candidates with quorum (synchronous_standby_names = 'any 1 (s1, s2)'), so any one can fail without stalling; monitoring that alerts on a missing sync standby immediately; and an explicit, documented operational decision about whether to degrade to async during an outage (alter system set synchronous_standby_names = ''; select pg_reload_conf();). that decision is a business one - it trades rpo for availability - and it must be made before the incident, not during it."}, {"n": 142, "category": 8, "difficulty": "D", "html": "Replication lag: the three ways to measure it, what causes it, and why a lag of zero bytes can still mean stale reads.", "answerTitle": "Measuring replication lag", "answer": "<p>Three measurements, and they answer different questions:<\/p><ol><li><strong>Byte lag<\/strong> - <code>pg_current_wal_lsn() - replay_lsn<\/code> from <code>pg_stat_replication<\/code> on the primary. It tells you how much WAL is outstanding, which matters for slot growth and failover data loss, but it says nothing about time.<\/li><li><strong>Time lag<\/strong> - <code>write_lag<\/code>, <code>flush_lag<\/code>, <code>replay_lag<\/code> in <code>pg_stat_replication<\/code>, or on the standby <code>now() - pg_last_xact_replay_timestamp()<\/code>. This is what a user experiences.<\/li><li><strong>Application-level lag<\/strong> - a heartbeat row written on the primary every second and read on the standby; the difference is end-to-end staleness including any pooler or router.<\/li><\/ol><p>Causes: standby CPU or IO too slow to keep up (recovery replay is largely <strong>single-threaded<\/strong>, so a primary with 16 concurrent writers can outpace one replay process); a long-running query on the standby conflicting with replay and, with <code>max_standby_streaming_delay<\/code>, deliberately pausing it; network bandwidth; and a bulk operation generating WAL faster than it can be shipped (Q120).<\/p><p>Why zero byte lag can still mean stale reads: <code>pg_last_xact_replay_timestamp()<\/code> only advances when there are transactions to replay, so an <strong>idle<\/strong> primary shows growing &quot;time lag&quot; that is meaningless; and conversely, a standby that has <em>received<\/em> and <em>flushed<\/em> all WAL may not have <em>applied<\/em> it - <code>write_lag<\/code> zero, <code>replay_lag<\/code> not. Always compare <code>replay_lsn<\/code>, not <code>flush_lsn<\/code>, for read staleness.<\/p>", "source": "answ
