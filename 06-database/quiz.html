is prevents is the classic one: a nightly job that worked for two years and then ooms, because the table finally exceeded the heap."}, {"n": 235, "category": 13, "difficulty": "D", "html": "Connection pool sizing: give the arithmetic (Little&#x27;s Law and the core-count heuristic) and explain why 100 connections is usually worse than 20.", "answerTitle": "Connection pool sizing", "answer": "<p>The arithmetic, from Little&#x27;s Law: <code>concurrency = throughput x latency<\/code>. If the application does 2,000 database operations per second and each takes 2 ms of database time, the required concurrency is <code>2000 x 0.002 = 4<\/code> connections. Add headroom for variance and you land at 10, not 100.<\/p><p>The other bound is the server: a database can genuinely execute only as many queries at once as it has cores (plus a factor for IO wait). The PostgreSQL rule of thumb is <code>connections = ((core_count x 2) + effective_spindle_count)<\/code> - so around 20-30 on a 12-core machine, <strong>total across all clients<\/strong> (<code>03-microservices<\/code> Q193 - the sum of every service&#x27;s pool must fit).<\/p><p>Why 100 is worse than 20: connections beyond the server&#x27;s execution capacity do not run in parallel, they <strong>queue inside the database<\/strong>, where the queue is far more expensive than a queue in the application. Each backend has its own process and memory, each active query competes for <code>shared_buffers<\/code>, spinlocks and IO bandwidth, context switching rises, <code>work_mem<\/code> is allocated per node per connection (Q76), and lock contention grows superlinearly. The measured result is that throughput peaks at a modest pool size and then <em>declines<\/em>, while latency grows without bound - the classic knee curve. A smaller pool also acts as a <strong>bulkhead<\/strong>: excess load waits in the application where you can see it, time it out and shed it, instead of degrading everyone&#x27;s queries.<\/p><p>The practical procedure: start from the arithmetic, load-test to find the knee, and set the pool just below it.<\/p>", "source": "answers.md", "search": "connection pool sizing: give the arithmetic (little's law and the core-count heuristic) and explain why 100 connections is usually worse than 20. the arithmetic, from little's law: concurrency = throughput x latency. if the application does 2,000 database operations per second and each takes 2 ms of database time, the required concurrency is 2000 x 0.002 = 4 connections. add headroom for variance and you land at 10, not 100. the other bound is the server: a database can genuinely execute only as many queries at once as it has cores (plus a factor for io wait). the postgresql rule of thumb is connections = ((core_count x 2) + effective_spindle_count) - so around 20-30 on a 12-core machine, total across all clients (03-microservices q193 - the sum of every service's pool must fit). why 100 is worse than 20: connections beyond the server's execution capacity do not run in parallel, they queue inside the database , where the queue is far more expensive than a queue in the application. each backend has its own process and memory, each active query competes for shared_buffers, spinlocks and io bandwidth, context switching rises, work_mem is allocated per node per connection (q76), and lock contention grows superlinearly. the measured result is that throughput peaks at a modest pool size and then declines , while latency grows without bound - the classic knee curve. a smaller pool also acts as a bulkhead : excess load waits in the application where you can see it, time it out and shed it, instead of degrading everyone's queries. the practical procedure: start from the arithmetic, load-test to find the knee, and set the pool just below it."}, {"n": 236, "category": 13, "difficulty": "T", "html": "Under load the application reports connection timeouts while the database is 20 percent utilized. Walk through the diagnosis.", "answerTitle": "Connection timeouts at 20 percent database utilization", "answer": "<p>&quot;The pool is exhausted while the database is idle&quot; means connections are being <strong>held<\/strong> rather than <strong>used<\/strong>. The diagnosis path:<\/p><ol><li><strong>Confirm where the time goes.<\/strong> HikariCP exposes <code>hikaricp_connections_pending<\/code>, <code>acquire<\/code> timing and <code>usage<\/code> timing - the mean <em>usage<\/em> time is the key number. If usage is 800 ms while queries take 3 ms, the connection is held for something other than querying.<\/li><li><strong>Look for work inside the transaction that is not database work.<\/strong> An HTTP call, an S3 upload, a message publish, JSON serialization or a <code>Thread.sleep<\/code> inside a <code>@Transactional<\/code> method holds a connection for its whole duration (<code>02-spring<\/code> Q76, Q212). This is the most common cause by a wide margin.<\/li><li><strong>Check for connections acquired too early.<\/strong> Spring acquires a connection when the transaction starts, even if the first query comes 200 ms later - <code>LazyConnectionDataSourceProxy<\/code> fixes that (<code>02-spring<\/code> Q65). Read-only paths opening transactions they do not need have the same effect.<\/li><li><strong>Check for leaks.<\/strong> <code>leakDetectionThreshold<\/code> in Hikari logs stack traces for connections held beyond a limit; a manual <code>getConnection()<\/code> without a finally-block, or a <code>Stream<\/code> from a repository never closed, leaks permanently.<\/li><li><strong>Check for blocking at the database that is not visible as utilization<\/strong> - lock waits show as idle CPU but held connections. <code>pg_stat_activity<\/code> filtered on <code>wait_event_type = &#x27;Lock&#x27;<\/code> answers this in one query, as does a long <code>idle in transaction<\/code> list.<\/li><li><strong>Check the layers between<\/strong>: a PgBouncer pool smaller than the application&#x27;s, a proxy connection limit, or DNS/TLS handshake latency on connection creation (which makes <code>connectionTimeout<\/code> fire during a burst if <code>minimumIdle<\/code> is low).<\/li><\/ol><p>The shape of the answer matters: database utilization measures <em>work<\/em>, and pool exhaustion measures <em>occupancy<\/em>. They diverge whenever a connection is held without working, and that is nearly always the application&#x27;s fault.<\/p>", "source": "answers.md", "search": "under load the application reports connection timeouts while the database is 20 percent utilized. walk through the diagnosis. \"the pool is exhausted while the database is idle\" means connections are being held rather than used . the diagnosis path: 1. confirm where the time goes. hikaricp exposes hikaricp_connections_pending, acquire timing and usage timing - the mean usage time is the key number. if usage is 800 ms while queries take 3 ms, the connection is held for something other than querying. 2. look for work inside the transaction that is not database work. an http call, an s3 upload, a message publish, json serialization or a thread.sleep inside a @transactional method holds a connection for its whole duration (02-spring q76, q212). this is the most common cause by a wide margin. 3. check for connections acquired too early. spring acquires a connection when the transaction starts, even if the first query comes 200 ms later - lazyconnectiondatasourceproxy fixes that (02-spring q65). read-only paths opening transactions they do not need have the same effect. 4. check for leaks. leakdetectionthreshold in hikari logs stack traces for connections held beyond a limit; a manual getconnection() without a finally-block, or a stream from a repository never closed, leaks permanently. 5. check for blocking at the database that is not visible as utilization - lock waits show as idle cpu but held connections. pg_stat_activity filtered on wait_event_type = 'lock' answers this in one query, as does a long idle in transaction list. 6. check the layers between : a pgbouncer pool smaller than the application's, a proxy connection limit, or dns/tls handshake latency on connection creation (which makes connectiontimeout fire during a burst if minimumidle is low). the shape of the answer matters: database utilization measures work , and pool exhaustion measures occupancy . they diverge whenever a connection is held without working, and that is nearly always the application's fault."}, {"n": 237, "category": 13, "difficulty": "D", "html": "Pool timeouts that matter: <code>connectionTimeout<\/code>, <code>maxLifetime<\/code>, <code>idleTimeout<\/code>, <code>validationTimeout<\/code>, and how they must relate to the database and any proxy in between.", "answerTitle": "The pool timeouts that matter", "answer": "<ul><li><strong><code>connectionTimeout<\/code><\/strong> (default 30 s) - how long a caller waits for a connection from the pool before failing. It should be <strong>short<\/strong> (1-3 s) so a saturated pool fails fast and sheds load rather than queueing every request thread.<\/li><li><strong><code>maxLifetime<\/code><\/strong> (default 30 min) - how long a connection may live before being retired. It must be <strong>shorter than any timeout applied by the infrastructure below<\/strong> - the database&#x27;s <code>idle_session_timeout<\/code>, a load balancer&#x27;s idle TCP timeout (AWS NLB is 350 s), a firewall&#x27;s connection tracking table, or PgBouncer&#x27;s <code>server_lifetime<\/code>. If something else kills the connection first, the pool hands out a dead socket and the application sees random <code>Connection reset<\/code> errors. The standard advice is a few minutes less than the shortest upstream limit.<\/li><li><strong><code>idleTimeout<\/code><\/strong> (default 10 min) - how long an idle connection above <code>minimumIdle<\/code> survives. Only relevant if <code>minimumIdle &lt; maximumPoolSize<\/code>; I usually set them equal for a fixed-size pool, which gives predictable behavior and no reconnection storms.<\/li><li><strong><code>validationTimeout<\/code><\/strong> (default 5 s) - how long the aliveness check may take. Should be well below <code>connectionTimeout<\/code>.<\/li><\/ul><p>The relationship rule to state: <code>validationTimeout &lt; connectionTimeout<\/code>, and <code>maxLifetime &lt; (every idle/lifetime limit imposed by the database, the proxy and the network)<\/code>. Getting the second one wrong produces intermittent errors that look like a network fault and are actually a configuration mismatch.<\/p>", "source": "answers.md", "search": "pool timeouts that matter: connectiontimeout, maxlifetime, idletimeout, validationtimeout, and how they must relate to the database and any proxy in between. - connectiontimeout (default 30 s) - how long a caller waits for a connection from the pool before failing. it should be short (1-3 s) so a saturated pool fails fast and sheds load rather than queueing every request thread. - maxlifetime (default 30 min) - how long a connection may live before being retired. it must be shorter than any timeout applied by the infrastructure below - the database's idle_session_timeout, a load balancer's idle tcp timeout (aws nlb is 350 s), a firewall's connection tracking table, or pgbouncer's server_lifetime. if something else kills the connection first, the pool hands out a dead socket and the application sees random connection reset errors. the standard advice is a few minutes less than the shortest upstream limit. - idletimeout (default 10 min) - how long an idle connection above minimumidle survives. only relevant if minimumidle < maximumpoolsize; i usually set them equal for a fixed-size pool, which gives predictable behavior and no reconnection storms. - validationtimeout (default 5 s) - how long the aliveness check may take. should be well below connectiontimeout. the relationship rule to state: validationtimeout < connectiontimeout, and maxlifetime < (every idle/lifetime limit imposed by the database, the proxy and the network). getting the second one wrong produces intermittent errors that look like a network fault and are actually a configuration mismatch."}, {"n": 238, "category": 13, "difficulty": "D", "html": "Statement timeout, <code>lock_timeout<\/code>, <code>idle_in_transaction_session_timeout<\/code> and the JDBC socket timeout. Which one actually stops a runaway query, and where do you set each?", "answerTitle": "The timeouts that stop a runaway query", "answer": "<ul><li><strong><code>statement_timeout<\/code><\/strong> (server side, PostgreSQL) - <strong>this is the one that actually stops a runaway query.<\/strong> The server cancels the statement itself, freeing the backend and its locks. Set it as a default on the application role (<code>ALTER ROLE app SET statement_timeout = &#x27;10s&#x27;<\/code>), and per-transaction with <code>SET LOCAL<\/code> for the paths that legitimately need longer.<\/li><li><strong><code>lock_timeout<\/code><\/strong> (server side) - bounds only the time spent <em>waiting for a lock<\/em>, which is what you want around DDL and background jobs so they never head a lock queue (Q100). It does not bound execution.<\/li><li><strong><code>idle_in_transaction_session_timeout<\/code><\/strong> (server side) - kills a session that holds an open transaction without running anything. This is the guard against the Q93 damage, and it should be set aggressively (seconds) on OLTP roles.<\/li><li><strong>JDBC <code>Statement.setQueryTimeout<\/code> / Hibernate&#x27;s <code>javax.persistence.query.timeout<\/code><\/strong> - the driver issues a <code>CANCEL<\/code> request on a <em>separate connection<\/em> when the timeout fires. It works, but it depends on the client being alive and able to open a second connection, and it races with the query finishing.<\/li><li><strong>The JDBC socket timeout<\/strong> (<code>socketTimeout<\/code> connection property) - a network-level read timeout. It <strong>does not stop the query<\/strong>: it abandons the socket, and the server happily continues executing, holding locks, until it finishes. Setting only this is how you end up with a database full of queries nobody is waiting for.<\/li><\/ul><p>The layering to state: server-side timeouts are authoritative because they act on the process doing the work; client-side timeouts protect the client. You need both, and the client&#x27;s must be <em>longer<\/em> than the server&#x27;s so the server&#x27;s cancellation is what fires first and you get a clean error rather than an abandoned connection.<\/p>", "source": "answers.md", "search": "statement timeout, lock_timeout, idle_in_transaction_session_timeout and the jdbc socket timeout. which one actually stops a runaway query, and where do you set each? - statement_timeout (server side, postgresql) - this is the one that actually stops a runaway query. the server cancels the statement itself, freeing the backend and its locks. set it as a default on the application role (alter role app set statement_timeout = '10s'), and per-transaction with set local for the paths that legitimately need longer. - lock_timeout (server side) - bounds only the time spent waiting for a lock , which is what you want around ddl and background jobs so they never head a lock queue (q100). it does not bound execution. - idle_in_transaction_session_timeout (server side) - kills a session that holds an open transaction without running anything. this is the guard against the q93 damage, and it should be set aggressively (seconds) on oltp roles. - jdbc statement.setquerytimeout / hibernate's javax.persistence.query.timeout - the driver issues a cancel request on a separate connection when the timeout fires. it works, but it depends on the client being alive and able to open a second connection, and it races with the query finishing. - the jdbc socket timeout (sockettimeout connection property) - a network-level read timeout. it does not stop the query : it abandons the socket, and the server happily continues executing, holding locks, until it finishes. setting only this is how you end up with a database full of queries nobody is waiting for. the layering to state: server-side timeouts are authoritative because they act on the process doing the work; client-side timeouts protect the client. you need both, and the client's must be longer than the server's so the server's cancellation is what fires first and you get a clean error rather than an abandoned connection."}, {"n": 239, "category": 13, "difficulty": "D", "html": "Prepared statement caching in the driver, in the pool and in the server. Where does PgBouncer break this and what mode do you need?", "answerTitle": "Prepared statement caching and PgBouncer", "answer": "<p>Three caches. The <strong>driver<\/strong> caches the parse/describe of a statement per connection (<code>prepareThreshold<\/code>, default 5, then <code>preparedStatementCacheQueries<\/code>), so repeated executions skip parsing and use the extended protocol. The <strong>pool<\/strong> does not cache statements itself in Hikari (it deliberately delegates to the driver, since a pooled connection is the driver&#x27;s own). The <strong>server<\/strong> holds the named prepared statement and, after five executions, may switch to a generic plan (Q72).<\/p><p>PgBouncer in <strong>transaction pooling<\/strong> mode breaks this: a server connection is assigned to a client only for the duration of a transaction, so the next transaction may land on a different backend where the client&#x27;s named prepared statement (<code>S_1<\/code>) does not exist - producing <code>prepared statement &quot;S_1&quot; does not exist<\/code>, or worse, colliding with a <em>different<\/em> statement of the same name created by another client.<\/p><p>The modes: <strong>session<\/strong> pooling preserves everything but gives you almost no pooling benefit (one server connection per client connection). <strong>Transaction<\/strong> pooling is the useful one. <strong>Statement<\/strong> pooling forbids multi-statement transactions entirely.<\/p><p>The resolutions: PgBouncer 1.21+ supports <strong>prepared statements in transaction mode<\/strong> (<code>max_prepared_statements &gt; 0<\/code>), which tracks and replays them per server connection - this is the modern answer. Before that, you disabled server-side prepares in the driver (<code>prepareThreshold=0<\/code>), accepting the parse cost on every execution, which for simple OLTP statements is a few percent and for complex ones is significant. Either way, note the second-order effect: with prepares disabled, every execution is a custom plan, which <em>fixes<\/em> the Q72 generic-plan problem for skewed queries by accident.<\/p>", "source": "answers.md", "search": "prepared statement caching in the driver, in the pool and in the server. where does pgbouncer break this and what mode do you need? three caches. the driver caches the parse/describe of a statement per connection (preparethreshold, default 5, then preparedstatementcachequeries), so repeated executions skip parsing and use the extended protocol. the pool does not cache statements itself in hikari (it deliberately delegates to the driver, since a pooled connection is the driver's own). the server holds the named prepared statement and, after five executions, may switch to a generic plan (q72). pgbouncer in transaction pooling mode breaks this: a server connection is assigned to a client only for the duration of a transaction, so the next transaction may land on a different backend where the client's named prepared statement (s_1) does not exist - producing prepared statement \"s_1\" does not exist, or worse, colliding with a different statement of the same name created by another client. the modes: session pooling preserves everything but gives you almost no pooling benefit (one server connection per client connection). transaction pooling is the useful one. statement pooling forbids multi-statement transactions entirely. the resolutions: pgbouncer 1.21+ supports prepared statements in transaction mode (max_prepared_statements 0), which tracks and replays them per server connection - this is the modern answer. before that, you disabled server-side prepares in the driver (preparethreshold=0), accepting the parse cost on every execution, which for simple oltp statements is a few percent and for complex ones is significant. either way, note the second-order effect: with prepares disabled, every execution is a custom plan, which fixes the q72 generic-plan problem for skewed queries by accident."}, {"n": 240, "category": 13, "difficulty": "D", "html": "PgBouncer session, transaction and statement pooling. What does transaction pooling forbid in your application code?", "answerTitle": "PgBouncer pooling modes", "answer": "<ul><li><strong>Session<\/strong> - a server connection is held for the whole client connection. Everything works; you gain only connection <em>establishment<\/em> savings, which is still meaningful for short-lived clients (Lambda) but does nothing for the connection count.<\/li><li><strong>Transaction<\/strong> - a server connection is assigned per transaction. This is where the real benefit lies: 2,000 application connections can share 30 server connections, because most of them are idle between transactions.<\/li><li><strong>Statement<\/strong> - a server connection per statement; multi-statement transactions are rejected outright. Useful only for autocommit-only workloads.<\/li><\/ul><p>What <strong>transaction pooling forbids<\/strong> in application code, because these depend on session state that will not follow you to the next transaction:<\/p><ul><li>Session-level prepared statements (Q239, unless the modern support is enabled).<\/li><li><code>SET<\/code>/<code>RESET<\/code> outside a transaction - use <code>SET LOCAL<\/code> inside one instead.<\/li><li>Session-scoped <strong>advisory locks<\/strong> (<code>pg_advisory_lock<\/code>) - use the transaction-scoped variant (Q111).<\/li><li><code>LISTEN<\/code>/<code>NOTIFY<\/code> (Q117) - the listener&#x27;s connection is not stable.<\/li><li><code>WITH HOLD<\/code> cursors, temporary tables, and any reliance on <code>currval()<\/code> of a sequence.<\/li><li>Anything that assumes <code>pg_backend_pid()<\/code> or <code>application_name<\/code> is stable.<\/li><\/ul><p>The practical consequence for a Spring application: put the pooler behind a small Hikari pool per instance, keep everything session-scoped out of the code, and be aware that <code>statement_timeout<\/code> set per session must become a role default or a <code>SET LOCAL<\/code>.<\/p>", "source": "answers.md", "search": "pgbouncer session, transaction and statement pooling. what does transaction pooling forbid in your application code? - session - a server connection is held for the whole client connection. everything works; you gain only connection establishment savings, which is still meaningful for short-lived clients (lambda) but does nothing for the connection count. - transaction - a server connection is assigned per transaction. this is where the real benefit lies: 2,000 application connections can share 30 server connections, because most of them are idle between transactions. - statement - a server connection per statement; multi-statement transactions are rejected outright. useful only for autocommit-only workloads. what transaction pooling forbids in application code, because these depend on session state that will not follow you to the next transaction: - session-level prepared statements (q239, unless the modern support is enabled). - set/reset outside a transaction - use set local inside one instead. - session-scoped advisory locks (pg_advisory_lock) - use the transaction-scoped variant (q111). - listen/notify (q117) - the listener's connection is not stable. - with hold cursors, temporary tables, and any reliance on currval() of a sequence. - anything that assumes pg_backend_pid() or application_name is stable. the practical consequence for a spring application: put the pooler behind a small hikari pool per instance, keep everything session-scoped out of the code, and be aware that statement_timeout set per session must become a role default or a set local."}, {"n": 241, "category": 13, "difficulty": "T", "html": "A retry on a failed <code>INSERT<\/code> creates a duplicate. Which JDBC/driver errors are safe to retry and which are ambiguous?", "answerTitle": "Retrying a failed `INSERT`", "answer": "<p>The rule: an error is safe to retry only if you know the server <strong>did not<\/strong> process the statement. Which errors give you that knowledge:<\/p><p><strong>Safe<\/strong> - the server explicitly rejected it and the transaction is dead:<\/p><ul><li><code>40001<\/code> serialization failure and <code>40P01<\/code> deadlock detected - the transaction was rolled back by definition (Q103).<\/li><li><code>08001<\/code>/<code>08004<\/code> connection could not be established, and <code>57P03<\/code> cannot connect now - nothing was sent.<\/li><li>A constraint violation is <em>deterministic<\/em>, so retrying is pointless but not dangerous - it will fail again.<\/li><\/ul><p><strong>Ambiguous<\/strong> - the connection died at or after submission and you cannot tell whether the commit happened:<\/p><ul><li><code>08006<\/code> connection failure, <code>08003<\/code> connection does not exist, a socket read timeout, <code>57P01<\/code> admin shutdown, and any failure during the <strong>commit<\/strong> itself. The classic case is the network dropping between the server writing the commit record and the client receiving the acknowledgement - the write succeeded and the client believes it failed.<\/li><\/ul><p>This is the same &quot;you cannot tell slow from dead&quot; problem as a 504 in <code>03-microservices<\/code> Q34, and no error code will ever resolve it. The only real answer is to make the operation <strong>idempotent<\/strong> so the ambiguity stops mattering: a client-supplied idempotency key with a unique constraint (Q114), a natural business key with <code>ON CONFLICT DO NOTHING<\/code>, or a deterministic primary key derived from the request. Then the retry either inserts or collides harmlessly, and you read back the result.<\/p><p>The other half is <strong>detection<\/strong>: before retrying an ambiguous write with no idempotency key, query for the record. That is not free of races, but it converts a certain duplicate into an unlikely one - and if the data matters, build the key.<\/p>", "source": "answers.md", "search": "a retry on a failed insert creates a duplicate. which jdbc/driver errors are safe to retry and which are ambiguous? the rule: an error is safe to retry only if you know the server did not process the statement. which errors give you that knowledge: safe - the server explicitly rejected it and the transaction is dead: - 40001 serialization failure and 40p01 deadlock detected - the transaction was rolled back by definition (q103). - 08001/08004 connection could not be established, and 57p03 cannot connect now - nothing was sent. - a constraint violation is deterministic , so retrying is pointless but not dangerous - it will fail again. ambiguous - the connection died at or after submission and you cannot tell whether the commit happened: - 08006 connection failure, 08003 connection does not exist, a socket read timeout, 57p01 admin shutdown, and any failure during the commit itself. the classic case is the network dropping between the server writing the commit record and the client receiving the acknowledgement - the write succeeded and the client believes it failed. this is the same \"you cannot tell slow from dead\" problem as a 504 in 03-microservices q34, and no error code will ever resolve it. the only real answer is to make the operation idempotent so the ambiguity stops mattering: a client-supplied idempotency key with a unique constraint (q114), a natural business key with on conflict do nothing, or a deterministic primary key derived from the request. then the retry either inserts or collides harmlessly, and you read back the result. the other half is detection : before retrying an ambiguous write with no idempotency key, query for the record. that is not free of races, but it converts a certain duplicate into an unlikely one - and if the data matters, build the key."}, {"n": 242, "category": 13, "difficulty": "A", "html": "When would you drop JPA for jOOQ, Spring Data JDBC or plain SQL? Give the criteria you would apply to a real codebase.", "answerTitle": "Dropping JPA for jOOQ, Spring Data JDBC or SQL", "answer": "<p>The criteria I would apply to a real codebase:<\/p><p><strong>Keep JPA<\/strong> when the domain is genuinely graph-shaped and long-lived - entities with real invariants, aggregates loaded and mutated as objects, optimistic locking, cascading lifecycle - and when the team&#x27;s productivity on CRUD-heavy screens matters more than SQL control. Dirty checking, the persistence context and the second-level cache are real leverage when you are working with objects rather than result sets.<\/p><p><strong>Move to jOOQ<\/strong> when the application&#x27;s centre of gravity is <strong>queries<\/strong> rather than an object model: complex reporting, dynamic filters, window functions, CTEs, upserts, database-specific features. jOOQ gives type-safe SQL generated from the schema, so the compiler catches a renamed column, and the SQL you write is the SQL that runs - which removes the entire category of &quot;what did Hibernate do&quot; problems. The cost is no dirty checking, no lazy graphs, and a code-generation step in the build.<\/p><p><strong>Move to Spring Data JDBC<\/strong> when the model is aggregate-oriented but simple: no lazy loading, no dirty checking, everything explicit, an aggregate saved as a unit. It suits an event-sourced or DDD-strict service where the implicitness of JPA is a liability rather than a convenience (<code>02-spring<\/code> Q138).<\/p><p><strong>Plain SQL / <code>JdbcClient<\/code><\/strong> for batch jobs, bulk operations, migrations and anything performance-critical.<\/p><p><strong>The signals I look for in the existing code<\/strong> to trigger a change: a majority of repositories using <code>@Query<\/code> with native SQL (the ORM is already being bypassed); recurring N+1, <code>MultipleBagFetchException<\/code> and pagination incidents (Q228, Q229); entities with 40 fields and eight relationships that nobody loads together; performance work that consists of fighting the fetch strategy; and a team that cannot predict the SQL a method will issue.<\/p><p><strong>What I would actually do<\/strong>: not a rewrite. JPA and jOOQ coexist on the same <code>DataSource<\/code> and the same transaction manager, so the pragmatic path is to keep JPA for the aggregate write model and introduce jOOQ or <code>JdbcClient<\/code> for the read and reporting paths - which is where the pain is, and which gives the team a working comparison before any larger decision.<\/p><p><em>Hook: a read path you moved off the ORM, and what it did to latency and to the size of the code.<\/em><\/p>", "source": "answers.md", "search": "when would you drop jpa for jooq, spring data jdbc or plain sql? give the criteria you would apply to a real codebase. the criteria i would apply to a real codebase: keep jpa when the domain is genuinely graph-shaped and long-lived - entities with real invariants, aggregates loaded and mutated as objects, optimistic locking, cascading lifecycle - and when the team's productivity on crud-heavy screens matters more than sql control. dirty checking, the persistence context and the second-level cache are real leverage when you are working with objects rather than result sets. move to jooq when the application's centre of gravity is queries rather than an object model: complex reporting, dynamic filters, window functions, ctes, upserts, database-specific features. jooq gives type-safe sql generated from the schema, so the compiler catches a renamed column, and the sql you write is the sql that runs - which removes the entire category of \"what did hibernate do\" problems. the cost is no dirty checking, no lazy graphs, and a code-generation step in the build. move to spring data jdbc when the model is aggregate-oriented but simple: no lazy loading, no dirty checking, everything explicit, an aggregate saved as a unit. it suits an event-sourced or ddd-strict service where the implicitness of jpa is a liability rather than a convenience (02-spring q138). plain sql / jdbcclient for batch jobs, bulk operations, migrations and anything performance-critical. the signals i look for in the existing code to trigger a change: a majority of repositories using @query with native sql (the orm is already being bypassed); recurring n+1, multiplebagfetchexception and pagination incidents (q228, q229); entities with 40 fields and eight relationships that nobody loads together; performance work that consists of fighting the fetch strategy; and a team that cannot predict the sql a method will issue. what i would actually do : not a rewrite. jpa and jooq coexist on the same datasource and the same transaction manager, so the pragmatic path is to keep jpa for the aggregate write model and introduce jooq or jdbcclient for the read and reporting paths - which is where the pain is, and which gives the team a working comparison before any larger decision. hook: a read path you moved off the orm, and what it did to latency and to the size of the code."}, {"n": 243, "category": 14, "difficulty": "C", "html": "State the rule that makes rolling deployment safe with respect to schema, in one sentence, and derive the expand-contract steps from it.", "answerTitle": "The rule, and the sequence derived from it", "answer": "<p>The rule: <strong>during a rolling deployment, the old and new versions of the application run simultaneously against a single schema, so the schema must be compatible with both at every instant.<\/strong><\/p><p>Everything follows from it. Since you cannot change code and schema atomically, and since you may need to roll the code back, every change must be decomposed into steps that are each backward compatible:<\/p><ol><li><strong>Expand<\/strong> - add the new structure alongside the old: a nullable new column, a new table, a new index, a new enum value. Deploy this alone; the old code ignores it.<\/li><li><strong>Migrate<\/strong> - deploy code that <strong>writes both<\/strong> old and new (dual write), then backfill the historical rows (Q249). At the end of this step both representations are complete and equivalent.<\/li><li><strong>Transition reads<\/strong> - deploy code that <strong>reads the new<\/strong> and still writes both. This is the <strong>last safe rollback point<\/strong>: everything up to here can be reverted by redeploying the previous version, because the old structure is still current.<\/li><li><strong>Contract<\/strong> - deploy code that no longer references the old structure, then, in a <em>later<\/em> release, drop it.<\/li><\/ol><p>The two disciplines that make it work in practice: <strong>never combine a schema change and a code change that depends on it in the same deployment<\/strong>, and <strong>keep the drop at least one release behind<\/strong> the code that stopped using it, so a rollback never lands on a missing column.<\/p>", "source": "answers.md", "search": "state the rule that makes rolling deployment safe with respect to schema, in one sentence, and derive the expand-contract steps from it. the rule: during a rolling deployment, the old and new versions of the application run simultaneously against a single schema, so the schema must be compatible with both at every instant. everything follows from it. since you cannot change code and schema atomically, and since you may need to roll the code back, every change must be decomposed into steps that are each backward compatible: 1. expand - add the new structure alongside the old: a nullable new column, a new table, a new index, a new enum value. deploy this alone; the old code ignores it. 2. migrate - deploy code that writes both old and new (dual write), then backfill the historical rows (q249). at the end of this step both representations are complete and equivalent. 3. transition reads - deploy code that reads the new and still writes both. this is the last safe rollback point : everything up to here can be reverted by redeploying the previous version, because the old structure is still current. 4. contract - deploy code that no longer references the old structure, then, in a later release, drop it. the two disciplines that make it work in practice: never combine a schema change and a code change that depends on it in the same deployment , and keep the drop at least one release behind the code that stopped using it, so a rollback never lands on a missing column."}, {"n": 244, "category": 14, "difficulty": "D", "html": "Which PostgreSQL DDL statements take <code>ACCESS EXCLUSIVE<\/code>, and which of those are nonetheless instant? Give the modern fast paths.", "answerTitle": "PostgreSQL DDL locks, and the fast paths", "answer": "<p>Most <code>ALTER TABLE<\/code> forms take <code>ACCESS EXCLUSIVE<\/code> (Q96), which conflicts with everything including <code>SELECT<\/code>. But many of them are <strong>metadata-only<\/strong> and complete in microseconds, so with a short <code>lock_timeout<\/code> they are safe on any size of table:<\/p><p><strong><code>ACCESS EXCLUSIVE<\/code> but instant<\/strong> (catalog update only):<\/p><ul><li><code>ADD COLUMN<\/code> with no default, or with a <strong>non-volatile default<\/strong> (PostgreSQL 11+ stores it as <code>attmissingval<\/code>).<\/li><li><code>DROP COLUMN<\/code> (the column is only marked dropped; space is reclaimed by later rewrites).<\/li><li><code>RENAME COLUMN<\/code> / <code>RENAME TABLE<\/code>.<\/li><li><code>SET/DROP NOT NULL<\/code> where a valid <code>CHECK<\/code> constraint already proves it (PostgreSQL 12+).<\/li><li><code>ADD CONSTRAINT ... NOT VALID<\/code> (foreign key or check).<\/li><li><code>SET DEFAULT<\/code>, <code>DROP DEFAULT<\/code>, <code>SET STATISTICS<\/code>, comments.<\/li><li>Widening <code>varchar(n)<\/code> to <code>varchar(m&gt;n)<\/code> or to <code>text<\/code>, and <code>numeric<\/code> precision increases (PostgreSQL 9.2+).<\/li><\/ul><p><strong><code>ACCESS EXCLUSIVE<\/code> and a full table rewrite<\/strong> (the dangerous ones):<\/p><ul><li><code>ALTER COLUMN TYPE<\/code> for anything that changes the on-disk representation.<\/li><li><code>ADD COLUMN<\/code> with a <strong>volatile<\/strong> default.<\/li><li><code>SET NOT NULL<\/code> without a proving constraint (a full scan, not a rewrite, but still a long exclusive lock).<\/li><li><code>ADD PRIMARY KEY<\/code>, <code>ADD UNIQUE<\/code> (builds the index under the lock - build the index <code>CONCURRENTLY<\/code> first and then <code>ADD CONSTRAINT ... USING INDEX<\/code>).<\/li><li><code>CLUSTER<\/code>, <code>VACUUM FULL<\/code>, non-concurrent <code>REINDEX<\/code>.<\/li><\/ul><p><strong>Weaker locks<\/strong>: <code>CREATE INDEX CONCURRENTLY<\/code> and <code>REINDEX CONCURRENTLY<\/code> take <code>SHARE UPDATE EXCLUSIVE<\/code>; <code>VALIDATE CONSTRAINT<\/code> takes <code>SHARE UPDATE EXCLUSIVE<\/code> and scans without blocking writes; <code>DETACH PARTITION CONCURRENTLY<\/code> likewise.<\/p><p>The operating rule: any statement in the second list needs the shadow-column treatment (Q248), and every statement in the first list still needs <code>lock_timeout<\/code> because the <em>lock acquisition<\/em> is the risk, not the work (Q250).<\/p>", "source": "answers.md", "search": "which postgresql ddl statements take access exclusive, and which of those are nonetheless instant? give the modern fast paths. most alter table forms take access exclusive (q96), which conflicts with everything including select. but many of them are metadata-only and complete in microseconds, so with a short lock_timeout they are safe on any size of table: access exclusive but instant (catalog update only): - add column with no default, or with a non-volatile default (postgresql 11+ stores it as attmissingval). - drop column (the column is only marked dropped; space is reclaimed by later rewrites). - rename column / rename table. - set/drop not null where a valid check constraint already proves it (postgresql 12+). - add constraint ... not valid (foreign key or check). - set default, drop default, set statistics, comments. - widening varchar(n) to varchar(m n) or to text, and numeric precision increases (postgresql 9.2+). access exclusive and a full table rewrite (the dangerous ones): - alter column type for anything that changes the on-disk representation. - add column with a volatile default. - set not null without a proving constraint (a full scan, not a rewrite, but still a long exclusive lock). - add primary key, add unique (builds the index under the lock - build the index concurrently first and then add constraint ... using index). - cluster, vacuum full, non-concurrent reindex. weaker locks : create index concurrently and reindex concurrently take share update exclusive; validate constraint takes share update exclusive and scans without blocking writes; detach partition concurrently likewise. the operating rule: any statement in the second list needs the shadow-column treatment (q248), and every statement in the first list still needs lock_timeout because the lock acquisition is the risk, not the work (q250)."}, {"n": 245, "category": 14, "difficulty": "T", "html": "<code>ALTER TABLE ADD COLUMN ... DEFAULT ...<\/code> used to rewrite the whole table. What changed, and which variant still rewrites?", "answerTitle": "`ADD COLUMN ... DEFAULT`", "answer": "<p>Before PostgreSQL 11, adding a column with a default rewrote every row of the table, holding <code>ACCESS EXCLUSIVE<\/code> for the whole rewrite - the canonical migration that took a large table offline. The standard workaround was three steps: add the column nullable, backfill in batches, then <code>SET DEFAULT<\/code>.<\/p><p>From <strong>PostgreSQL 11<\/strong>, a <strong>non-volatile<\/strong> default is stored in the catalog as <code>attmissingval<\/code> and applied on read for rows that predate it, so the operation is a metadata change and completes instantly regardless of table size. Existing rows are materialized lazily as they are updated.<\/p><p>The variant that <strong>still rewrites<\/strong> is a <strong>volatile<\/strong> default - <code>DEFAULT random()<\/code>, <code>DEFAULT gen_random_uuid()<\/code>, <code>DEFAULT nextval(&#x27;seq&#x27;)<\/code>, or a call to any function declared <code>VOLATILE<\/code> - because each row must get a <em>different<\/em> value, so there is nothing to store as a single missing value. <code>DEFAULT now()<\/code> is a subtle case: <code>now()<\/code> is <code>STABLE<\/code>, so it qualifies for the fast path and every existing row gets the <em>same<\/em> timestamp, which is often not what the author intended.<\/p><p>So the rule to state: a constant or <code>STABLE<\/code> default is free; a per-row-varying default is a rewrite, and must be done as add-nullable, backfill in batches, then set the default for new rows.<\/p>", "source": "answers.md", "search": "alter table add column ... default ... used to rewrite the whole table. what changed, and which variant still rewrites? before postgresql 11, adding a column with a default rewrote every row of the table, holding access exclusive for the whole rewrite - the canonical migration that took a large table offline. the standard workaround was three steps: add the column nullable, backfill in batches, then set default. from postgresql 11 , a non-volatile default is stored in the catalog as attmissingval and applied on read for rows that predate it, so the operation is a metadata change and completes instantly regardless of table size. existing rows are materialized lazily as they are updated. the variant that still rewrites is a volatile default - default random(), default gen_random_uuid(), default nextval('seq'), or a call to any function declared volatile - because each row must get a different value, so there is nothing to store as a single missing value. default now() is a subtle case: now() is stable, so it qualifies for the fast path and every existing row gets the same timestamp, which is often not what the author intended. so the rule to state: a constant or stable default is free; a per-row-varying default is a rewrite, and must be done as add-nullable, backfill in batches, then set the default for new rows."}, {"n": 246, "category": 14, "difficulty": "D", "html": "Adding a <code>NOT NULL<\/code> constraint to a large table without a long lock. Give the full sequence including <code>NOT VALID<\/code> and <code>VALIDATE<\/code>.", "answerTitle": "Adding `NOT NULL` without a long lock", "answer": "<p><code>ALTER TABLE ... SET NOT NULL<\/code> must prove no null exists, and by itself it does a full table scan under <code>ACCESS EXCLUSIVE<\/code> - minutes of downtime on a large table.<\/p><p>The sequence that avoids it (PostgreSQL 12+):<\/p><pre><code class=\"lang-sql\">-- 1. Add the constraint without validating it: instant, catalog-only.\nALTER TABLE orders ADD CONSTRAINT orders_ref_not_null\n  CHECK (customer_ref IS NOT NULL) NOT VALID;\n\n-- 2. Make sure new rows comply (the NOT VALID constraint already enforces this\n--    for inserts and updates) and backfill the existing nulls in batches.\n\n-- 3. Validate: takes only SHARE UPDATE EXCLUSIVE, scans without blocking writes.\nALTER TABLE orders VALIDATE CONSTRAINT orders_ref_not_null;\n\n-- 4. Now the fast path applies - the planner uses the validated CHECK as proof,\n--    so this is metadata-only.\nALTER TABLE orders ALTER COLUMN customer_ref SET NOT NULL;\n\n-- 5. Optional: drop the now-redundant CHECK.\nALTER TABLE orders DROP CONSTRAINT orders_ref_not_null;<\/code><\/pre><p>The key insight is that <code>NOT VALID<\/code> splits the operation into &quot;enforce for new rows&quot; (instant) and &quot;prove for old rows&quot; (concurrent), which is the same decomposition as expand-contract applied to a constraint. The identical pattern works for foreign keys: <code>ADD CONSTRAINT ... REFERENCES ... NOT VALID<\/code>, then <code>VALIDATE CONSTRAINT<\/code>.<\/p>", "source": "answers.md", "search": "adding a not null constraint to a large table without a long lock. give the full sequence including not valid and validate. alter table ... set not null must prove no null exists, and by itself it does a full table scan under access exclusive - minutes of downtime on a large table. the sequence that avoids it (postgresql 12+): sql -- 1. add the constraint without validating it: instant, catalog-only. alter table orders add constraint orders_ref_not_null check (customer_ref is not null) not valid; -- 2. make sure new rows comply (the not valid constraint already enforces this -- for inserts and updates) and backfill the existing nulls in batches. -- 3. validate: takes only share update exclusive, scans without blocking writes. alter table orders validate constraint orders_ref_not_null; -- 4. now the fast path applies - the planner uses the validated check as proof, -- so this is metadata-only. alter table orders alter column customer_ref set not null; -- 5. optional: drop the now-redundant check. alter table orders drop constraint orders_ref_not_null; the key insight is that not valid splits the operation into \"enforce for new rows\" (instant) and \"prove for old rows\" (concurrent), which is the same decomposition as expand-contract applied to a constraint. the identical pattern works for foreign keys: add constraint ... references ... not valid, then validate constraint."}, {"n": 247, "category": 14, "difficulty": "D", "html": "Renaming a column across two deployed versions of an application. Write the full sequence and mark the rollback point.", "answerTitle": "Renaming a column across two versions", "answer": "<p>A rename is <strong>not<\/strong> a rename - it is an add, a dual write, a backfill, a read switch and a drop. The full sequence:<\/p><ol><li><strong>Release 1 (schema)<\/strong>: <code>ALTER TABLE t ADD COLUMN new_name &lt;type&gt;<\/code> - instant, nullable, no default (Q245). Nothing reads or writes it.<\/li><li><strong>Release 2 (code)<\/strong>: the application <strong>writes both<\/strong> <code>old_name<\/code> and <code>new_name<\/code> on every insert and update, and still <strong>reads <code>old_name<\/code><\/strong>. Both versions of the code can run: the old one writes only <code>old_name<\/code>, which is still the read source, so nothing breaks. (A <code>BEFORE INSERT OR UPDATE<\/code> trigger keeping the two in sync is an alternative that avoids needing this release at all, and is what I would use if the write paths are numerous or outside my control.)<\/li><li><strong>Backfill<\/strong>: batched <code>UPDATE t SET new_name = old_name WHERE new_name IS NULL AND id BETWEEN ...<\/code>, throttled against replication lag (Q249). At the end, verify with a count of mismatches.<\/li><li><strong>Release 3 (code)<\/strong>: <strong>read <code>new_name<\/code><\/strong>, still write both. <strong>This is the last safe rollback point<\/strong> - <code>old_name<\/code> is still fully populated and correct, so redeploying release 2 works with no data loss.<\/li><li><strong>Release 4 (code)<\/strong>: stop writing <code>old_name<\/code>. From here a rollback to release 3 would read <code>new_name<\/code> (fine) but release 2 would read a stale <code>old_name<\/code>, so rollback is now bounded to one release.<\/li><li><strong>Release 5 (schema)<\/strong>: <code>ALTER TABLE t DROP COLUMN old_name<\/code>, plus adding any constraints and indexes on <code>new_name<\/code>, at least one release after nothing writes it.<\/li><\/ol><p>The reason not to shortcut it with a plain <code>RENAME<\/code> (which is itself instant) is that during the rolling deploy the old pods would reference a column that no longer exists, and every request they serve fails until they are replaced - a partial outage lasting the length of the rollout, and an unrecoverable one if you then need to roll back.<\/p>", "source": "answers.md", "search": "renaming a column across two deployed versions of an application. write the full sequence and mark the rollback point. a rename is not a rename - it is an add, a dual write, a backfill, a read switch and a drop. the full sequence: 1. release 1 (schema) : alter table t add column new_name <type - instant, nullable, no default (q245). nothing reads or writes it. 2. release 2 (code) : the application writes both old_name and new_name on every insert and update, and still reads old_name . both versions of the code can run: the old one writes only old_name, which is still the read source, so nothing breaks. (a before insert or update trigger keeping the two in sync is an alternative that avoids needing this release at all, and is what i would use if the write paths are numerous or outside my control.) 3. backfill : batched update t set new_name = old_name where new_name is null and id between ..., throttled against replication lag (q249). at the end, verify with a count of mismatches. 4. release 3 (code) : read new_name , still write both. this is the last safe rollback point - old_name is still fully populated and correct, so redeploying release 2 works with no data loss. 5. release 4 (code) : stop writing old_name. from here a rollback to release 3 would read new_name (fine) but release 2 would read a stale old_name, so rollback is now bounded to one release. 6. release 5 (schema) : alter table t drop column old_name, plus adding any constraints and indexes on new_name, at least one release after nothing writes it. the reason not to shortcut it with a plain rename (which is itself instant) is that during the rolling deploy the old pods would reference a column that no longer exists, and every request they serve fails until they are replaced - a partial outage lasting the length of the rollout, and an unrecoverable one if you then need to roll back."}, {"n": 248, "category": 14, "difficulty": "D", "html": "Changing a column type on a 500-million-row table. Give the shadow-column approach with backfill, and the trigger you need.", "answerTitle": "Changing a column type on 500 million rows", "answer": "<p><code>ALTER COLUMN TYPE<\/code> rewrites the table under <code>ACCESS EXCLUSIVE<\/code>, so on this size it is not an option. The shadow-column approach:<\/p><ol><li><strong>Add the new column<\/strong> with the target type, nullable, no default (instant).<\/li><li><strong>Add a trigger<\/strong> to keep it in sync for all new writes:<\/li><\/ol><pre><code class=\"lang-sql\">CREATE FUNCTION sync_amount() RETURNS trigger AS $$\nBEGIN\n  NEW.amount_new := NEW.amount_old::numeric(18,4);\n  RETURN NEW;\nEND $$ LANGUAGE plpgsql;\n\nCREATE TRIGGER t_sync_amount BEFORE INSERT OR UPDATE ON payments\n  FOR EACH ROW EXECUTE FUNCTION sync_amount();<\/code><\/pre><p>The trigger is what makes this safe <strong>regardless of how many application write paths exist<\/strong>, including manual SQL and other services - which is why I prefer it to dual writes in the application for a type change.<\/p><ol><li><strong>Backfill<\/strong> in batches with throttling and restartability (Q249), verifying as you go that the converted value round-trips (a mismatch count query, and an explicit decision about rows that cannot convert).<\/li><li><strong>Add the constraints and indexes<\/strong> on the new column, using <code>CREATE INDEX CONCURRENTLY<\/code> and <code>NOT VALID<\/code> + <code>VALIDATE<\/code> (Q246), so nothing takes a long lock.<\/li><li><strong>Switch reads<\/strong>, then stop writing the old column, then drop the trigger and the old column - the same release cadence as Q247.<\/li><\/ol><p>The alternatives worth naming: for a whole-table restructure, <code>pg_repack<\/code> or a logical-replication-based tool (<code>pgroll<\/code>, or a self-managed logical replica with the new schema and a switchover) does the same job with one short cutover, at the cost of double the storage and a more complex operation. And for <code>varchar(n)<\/code> widening or <code>numeric<\/code> precision increases, check first - those are already metadata-only (Q244).<\/p>", "source": "answers.md", "search": "changing a column type on a 500-million-row table. give the shadow-column approach with backfill, and the trigger you need. alter column type rewrites the table under access exclusive, so on this size it is not an option. the shadow-column approach: 1. add the new column with the target type, nullable, no default (instant). 2. add a trigger to keep it in sync for all new writes: sql create function sync_amount() returns trigger as $$ begin new.amount_new := new.amount_old::numeric(18,4); return new; end $$ language plpgsql; create trigger t_sync_amount before insert or update on payments for each row execute function sync_amount(); the trigger is what makes this safe regardless of how many application write paths exist , including manual sql and other services - which is why i prefer it to dual writes in the application for a type change. 3. backfill in batches with throttling and restartability (q249), verifying as you go that the converted value round-trips (a mismatch count query, and an explicit decision about rows that cannot convert). 4. add the constraints and indexes on the new column, using create index concurrently and not valid + validate (q246), so nothing takes a long lock. 5. switch reads , then stop writing the old column, then drop the trigger and the old column - the same release cadence as q247. the alternatives worth naming: for a whole-table restructure, pg_repack or a logical-replication-based tool (pgroll, or a self-managed logical replica with the new schema and a switchover) does the same job with one short cutover, at the cost of double the storage and a more complex operation. and for varchar(n) widening or numeric precision increases, check first - those are already metadata-only (q244)."}, {"n": 249, "category": 14, "difficulty": "D", "html": "Backfilling: batching strategy, throttling against replication lag, restartability, and how you verify completion.", "answerTitle": "Backfilling", "answer": "<p>The properties a backfill job must have:<\/p><ul><li><strong>Batched by key range, not by <code>OFFSET<\/code>.<\/strong> <code>WHERE id &gt; :cursor ORDER BY id LIMIT 5000<\/code> uses the index and stays constant-cost; <code>OFFSET<\/code> degrades linearly and re-reads work (Q38).<\/li><li><strong>One transaction per batch<\/strong>, so locks are short and dead tuples become vacuumable immediately (Q120). Batch size chosen so a batch takes well under a second - typically 1,000-10,000 rows.<\/li><li><strong>Throttled against replication lag.<\/strong> Between batches, read <code>pg_stat_replication.replay_lag<\/code> (or the LSN difference) and sleep until it is below a threshold. This makes the job self-regulating and prevents it from breaking replica reads. I also throttle on primary load - if <code>statement_timeout<\/code> errors or lock waits rise, back off.<\/li><li><strong>Restartable.<\/strong> The cursor is persisted (a control table row updated in the same transaction as the batch), so a crash resumes rather than restarts. The batch update must be idempotent - <code>WHERE new_col IS NULL<\/code> makes re-running a batch harmless.<\/li><li><strong>Observable<\/strong>: rows processed, rows remaining, current rate, projected completion, and errors, emitted as metrics. A backfill with no ETA is a backfill nobody can plan around.<\/li><li><strong>Killable<\/strong>: a stop flag it checks each batch, and a low <code>statement_timeout<\/code> and <code>lock_timeout<\/code> so it can never become the head of a lock queue.<\/li><\/ul><p><strong>Verification of completion<\/strong> is a separate step, not an assumption: a count of rows still not converted (<code>WHERE new_col IS NULL<\/code>), a sample comparison of old versus new values, and - if the trigger approach was used - a check that no row has diverged (<code>WHERE new_col IS DISTINCT FROM f(old_col)<\/code>). Only when that returns zero, twice, do I proceed to the read switch.<\/p>", "source": "answers.md", "search": "backfilling: batching strategy, throttling against replication lag, restartability, and how you verify completion. the properties a backfill job must have: - batched by key range, not by offset. where id :cursor order by id limit 5000 uses the index and stays constant-cost; offset degrades linearly and re-reads work (q38). - one transaction per batch , so locks are short and dead tuples become vacuumable immediately (q120). batch size chosen so a batch takes well under a second - typically 1,000-10,000 rows. - throttled against replication lag. between batches, read pg_stat_replication.replay_lag (or the lsn difference) and sleep until it is below a threshold. this makes the job self-regulating and prevents it from breaking replica reads. i also throttle on primary load - if statement_timeout errors or lock waits rise, back off. - restartable. the cursor is persisted (a control table row updated in the same transaction as the batch), so a crash resumes rather than restarts. the batch update must be idempotent - where new_col is null makes re-running a batch harmless. - observable : rows processed, rows remaining, current rate, projected completion, and errors, emitted as metrics. a backfill with no eta is a backfill nobody can plan around. - killable : a stop flag it checks each batch, and a low statement_timeout and lock_timeout so it can never become the head of a lock queue. verification of completion is a separate step, not an assumption: a count of rows still not converted (where new_col is null), a sample comparison of old versus new values, and - if the trigger approach was used - a check that no row has diverged (where new_col is distinct from f(old_col)). only when that returns zero, twice, do i proceed to the read switch."}, {"n": 250, "category": 14, "difficulty": "T", "html": "A migration acquires a lock behind a long-running <code>SELECT<\/code> and everything stops. Explain the lock queue and the <code>lock_timeout<\/code> retry pattern that avoids it.", "answerTitle": "A migration behind a long `SELECT`", "answer": "<p>The mechanism is the fair lock queue from Q100: the <code>ALTER TABLE<\/code> requests <code>ACCESS EXCLUSIVE<\/code>, waits behind the running <code>SELECT<\/code>, and every subsequent statement - including trivial <code>SELECT<\/code>s that would not have conflicted with each other - queues behind the <code>ALTER<\/code>. Throughput on that table goes to zero, the connection pool exhausts within seconds, and the application is down while the &quot;migration&quot; has not executed a single byte of work.<\/p><p>The pattern that avoids it:<\/p><pre><code class=\"lang-sql\">SET lock_timeout = &#x27;2s&#x27;;\nALTER TABLE orders ADD COLUMN customer_ref text;<\/code><\/pre><p>If the lock cannot be acquired within two seconds, the statement fails with <code>55P03 lock_not_available<\/code>, the queue drains immediately, and the application is unaffected. The migration tool then <strong>retries with backoff<\/strong> - typically a loop of 10-20 attempts with a few seconds between - until it catches a moment with no long-running statement. In PostgreSQL a subtransaction or a retry loop in the migration script (or in the tool: Flyway callbacks, or a wrapper that executes the DDL with retries) implements this.<\/p><p>The complementary measures: before starting, query <code>pg_stat_activity<\/code> for statements older than a threshold on the target table and either wait or kill them deliberately; keep <code>statement_timeout<\/code> low on the application role so no query can block DDL for minutes (Q238); schedule DDL away from batch windows; and never wrap several DDL statements in one long transaction, because the locks accumulate and are all held until the end.<\/p>", "source": "answers.md", "search": "a migration acquires a lock behind a long-running select and everything stops. explain the lock queue and the lock_timeout retry pattern that avoids it. the mechanism is the fair lock queue from q100: the alter table requests access exclusive, waits behind the running select, and every subsequent statement - including trivial selects that would not have conflicted with each other - queues behind the alter. throughput on that table goes to zero, the connection pool exhausts within seconds, and the application is down while the \"migration\" has not executed a single byte of work. the pattern that avoids it: sql set lock_timeout = '2s'; alter table orders add column customer_ref text; if the lock cannot be acquired within two seconds, the statement fails with 55p03 lock_not_available, the queue drains immediately, and the application is unaffected. the migration tool then retries with backoff - typically a loop of 10-20 attempts with a few seconds between - until it catches a moment with no long-running statement. in postgresql a subtransaction or a retry loop in the migration script (or in the tool: flyway callbacks, or a wrapper that executes the ddl with retries) implements this. the complementary measures: before starting, query pg_stat_activity for statements older than a threshold on the target table and either wait or kill them deliberately; keep statement_timeout low on the application role so no query can block ddl for minutes (q238); schedule ddl away from batch windows; and never wrap several ddl statements in one long transaction, because the locks accumulate and are all held until the end."}, {"n": 251, "category": 14, "difficulty": "D", "html": "Migration tooling in CI/CD: who runs migrations, whether they run in the application startup or a separate job, and how you handle N instances starting at once.", "answerTitle": "Migrations in CI/CD", "answer": "<p><strong>Who runs them<\/strong>: a dedicated job in the pipeline, running <strong>before<\/strong> the application deployment, with a database role that has DDL privileges - not the application&#x27;s runtime role (Q267). Running them from the application&#x27;s startup (<code>spring.flyway.enabled=true<\/code>) is convenient for small systems and wrong at scale, for four reasons: the application role then needs DDL privileges permanently; the migration runs inside the pod&#x27;s startup budget, so a slow migration causes a liveness failure and a crash loop; a rollback of the application does not roll back the schema, but the coupling makes people think it does; and diagnosing a failed migration means reading pod logs rather than a pipeline step.<\/p><p><strong>N instances starting at once<\/strong>: Flyway and Liquibase both take a <strong>lock<\/strong> - Flyway uses <code>pg_advisory_lock<\/code> on PostgreSQL (a row lock on <code>flyway_schema_history<\/code> for other engines), Liquibase uses the <code>DATABASECHANGELOGLOCK<\/code> table. So concurrent starts are safe: one applies, the others wait and then find nothing to do. The failure mode to know is that Liquibase&#x27;s lock is a <strong>row<\/strong>, not a real lock, so a crashed instance leaves it set and every subsequent deployment hangs until someone runs <code>releaseLocks<\/code> - which is a memorable 2 a.m. discovery. Flyway&#x27;s advisory lock is released automatically when the session dies, which is one reason I prefer it on PostgreSQL.<\/p><p><strong>The rest of the pipeline discipline<\/strong>: migrations are versioned, immutable once merged (never edit an applied migration - the checksum will fail, and it <em>should<\/em>), reviewed like code with the lock implications called out (Q256), tested against a restored production-sized copy so a rewrite is discovered before production, and applied to every environment through the same job so staging is a genuine rehearsal.<\/p>", "source": "answers.md", "search": "migration tooling in ci/cd: who runs migrations, whether they run in the application startup or a separate job, and how you handle n instances starting at once. who runs them : a dedicated job in the pipeline, running before the application deployment, with a database role that has ddl privileges - not the application's runtime role (q267). running them from the application's startup (spring.flyway.enabled=true) is convenient for small systems and wrong at scale, for four reasons: the application role then needs ddl privileges permanently; the migration runs inside the pod's startup budget, so a slow migration causes a liveness failure and a crash loop; a rollback of the application does not roll back the schema, but the coupling makes people think it does; and diagnosing a failed migration means reading pod logs rather than a pipeline step. n instances starting at once : flyway and liquibase both take a lock - flyway uses pg_advisory_lock on postgresql (a row lock on flyway_schema_history for other engines), liquibase uses the databasechangeloglock table. so concurrent starts are safe: one applies, the others wait and then find nothing to do. the failure mode to know is that liquibase's lock is a row , not a real lock, so a crashed instance leaves it set and every subsequent deployment hangs until someone runs releaselocks - which is a memorable 2 a.m. discovery. flyway's advisory lock is released automatically when the session dies, which is one reason i prefer it on postgresql. the rest of the pipeline discipline : migrations are versioned, immutable once merged (never edit an applied migration - the checksum will fail, and it should ), reviewed like code with the lock implications called out (q256), tested against a restored production-sized copy so a rewrite is discovered before production, and applied to every environment through the same job so staging is a genuine rehearsal."}, {"n": 252, "category": 14, "difficulty": "D", "html": "Rollback: which migrations are reversible, why <code>down<\/code> scripts are a trap, and what you do instead.", "answerTitle": "Rollback", "answer": "<p>Which migrations are genuinely reversible: additive, non-destructive ones - <code>ADD COLUMN<\/code>, <code>CREATE TABLE<\/code>, <code>CREATE INDEX<\/code>, adding a nullable field. Their inverse loses nothing.<\/p><p>Which are not: anything that <strong>destroys information<\/strong>. <code>DROP COLUMN<\/code> cannot be undone by <code>ADD COLUMN<\/code> - the data is gone. A type narrowing that truncated values cannot be widened back. A <code>DELETE<\/code> or a merge of two rows is irreversible. And any migration that has been running in production for ten minutes has new data written under the new schema, which the &quot;down&quot; script does not account for.<\/p><p>Why <code>down<\/code> scripts are a trap: they are almost never tested (nobody runs them in CI against realistic data), they create the <em>illusion<\/em> of a safe rollback so people approve riskier changes, they cannot restore destroyed data, and they are usually wrong because they were written by imagining the inverse rather than by executing it. The one place they earn their keep is local development.<\/p><p><strong>What I do instead<\/strong>: make every migration <strong>forward-only and backward-compatible<\/strong> (Q243), so a rollback of the <em>application<\/em> never requires a rollback of the <em>schema<\/em>. If a schema change turns out to be wrong, the remedy is a new forward migration that corrects it, reviewed like any other. For the destructive step at the end of an expand-contract cycle, I add a deliberate safety margin: the drop happens one or more releases later, so by then the column has been provably unused, and before dropping anything large I take a targeted backup of the column (<code>CREATE TABLE t_old_col_backup AS SELECT id, old_col FROM t<\/code>) so the data is recoverable for a retention period. That is a cheap insurance policy and it has saved me more than once.<\/p>", "source": "answers.md", "search": "rollback: which migrations are reversible, why down scripts are a trap, and what you do instead. which migrations are genuinely reversible: additive, non-destructive ones - add column, create table, create index, adding a nullable field. their inverse loses nothing. which are not: anything that destroys information . drop column cannot be undone by add column - the data is gone. a type narrowing that truncated values cannot be widened back. a delete or a merge of two rows is irreversible. and any migration that has been running in production for ten minutes has new data written under the new schema, which the \"down\" script does not account for. why down scripts are a trap: they are almost never tested (nobody runs them in ci against realistic data), they create the illusion of a safe rollback so people approve riskier changes, they cannot restore destroyed data, and they are usually wrong because they were written by imagining the inverse rather than by executing it. the one place they earn their keep is local development. what i do instead : make every migration forward-only and backward-compatible (q243), so a rollback of the application never requires a rollback of the schema . if a schema change turns out to be wrong, the remedy is a new forward migration that corrects it, reviewed like any other. for the destructive step at the end of an expand-contract cycle, i add a deliberate safety margin: the drop happens one or more releases later, so by then the column has been provably unused, and before dropping anything large i take a targeted backup of the column (create table t_old_col_backup as select id, old_col from t) so the data is recoverable for a retention period. that is a cheap insurance policy and it has saved me more than once."}, {"n": 253, "category": 14, "difficulty": "D", "html": "<code>gh-ost<\/code> and <code>pt-online-schema-change<\/code> for MySQL. How do they work, and what is the PostgreSQL equivalent story?", "answerTitle": "`gh-ost`, `pt-online-schema-change`, and PostgreSQL", "answer": "<p>Both MySQL tools solve the same problem - MySQL&#x27;s <code>ALTER TABLE<\/code> historically locked or blocked - by building a shadow copy:<\/p><ul><li><strong><code>pt-online-schema-change<\/code><\/strong> creates a new table with the desired schema, adds <strong>triggers<\/strong> on the original to mirror every insert/update/delete into it, copies existing rows in chunks, then swaps the tables with an atomic <code>RENAME<\/code>. The triggers add write latency and can interact badly with existing triggers and foreign keys.<\/li><li><strong><code>gh-ost<\/code><\/strong> avoids triggers entirely: it copies rows in chunks and applies concurrent changes by <strong>tailing the binlog<\/strong> as if it were a replica. That decouples the migration from the write path, gives it a throttle it can control (it can pause based on replication lag or load), and makes it interruptible and resumable. It is the better tool for the same reason CDC beats dual writes (Q216).<\/li><\/ul><p><strong>The PostgreSQL story is different<\/strong> because most DDL is already cheap (Q244): adding and dropping columns, renames and constraint additions are metadata-only, and <code>CREATE INDEX CONCURRENTLY<\/code> handles indexes. What remains is table rewrites, and for those the options are <code>pg_repack<\/code> (for compaction and some rewrites, using triggers plus a short swap), the shadow-column pattern (Q248), or the newer generation of tools - <strong><code>pgroll<\/code><\/strong> and <strong>Reshape<\/strong> - which implement expand-contract by exposing <em>versioned views<\/em> to old and new application versions simultaneously, so the migration and the deployment are decoupled by construction. Logical replication to a new instance with the target schema, followed by a switchover, is the heavyweight option for a full restructure.<\/p>", "source": "answers.md", "search": "gh-ost and pt-online-schema-change for mysql. how do they work, and what is the postgresql equivalent story? both mysql tools solve the same problem - mysql's alter table historically locked or blocked - by building a shadow copy: - pt-online-schema-change creates a new table with the desired schema, adds triggers on the original to mirror every insert/update/delete into it, copies existing rows in chunks, then swaps the tables with an atomic rename. the triggers add write latency and can interact badly with existing triggers and foreign keys. - gh-ost avoids triggers entirely: it copies rows in chunks and applies concurrent changes by tailing the binlog as if it were a replica. that decouples the migration from the write path, gives it a throttle it can control (it can pause based on replication lag or load), and makes it interruptible and resumable. it is the better tool for the same reason cdc beats dual writes (q216). the postgresql story is different because most ddl is already cheap (q244): adding and dropping columns, renames and constraint additions are metadata-only, and create index concurrently handles indexes. what remains is table rewrites, and for those the options are pg_repack (for compaction and some rewrites, using triggers plus a short swap), the shadow-column pattern (q248), or the newer generation of tools - pgroll and reshape - which implement expand-contract by exposing versioned views to old and new application versions simultaneously, so the migration and the deployment are decoupled by construction. logical replication to a new instance with the target schema, followed by a switchover, is the heavyweight option for a full restructure."}, {"n": 254, "category": 14, "difficulty": "D", "html": "Multi-tenancy: shared schema with a tenant column, schema per tenant, database per tenant. Compare migration cost, blast radius and noisy neighbors.", "answerTitle": "Multi-tenancy models", "answer": "<table><thead><tr><th><\/th><th>Shared schema, tenant column<\/th><th>Schema per tenant<\/th><th>Database per tenant<\/th><\/tr><\/thead><tbody><tr><td>Migration cost<\/td><td>one migration, instant<\/td><td>N migrations per release (Q255)<\/td><td>N migrations, plus N instances to manage<\/td><\/tr><tr><td>Blast radius<\/td><td>worst - one bad query or migration affects everyone<\/td><td>medium - per-schema failures possible<\/td><td>best - fully isolated<\/td><\/tr><tr><td>Noisy neighbor<\/td><td>worst - shared buffers, locks, connections<\/td><td>shared instance, so still present<\/td><td>isolated (if separate instances)<\/td><\/tr><tr><td>Per-tenant restore<\/td><td>very hard - row-level extraction<\/td><td>possible - restore one schema<\/td><td>trivial<\/td><\/tr><tr><td>Cost at 5,000 tenants<\/td><td>lowest<\/td><td>moderate - catalog bloat, connection and vacuum overhead<\/td><td>prohibitive<\/td><\/tr><tr><td>Isolation guarantee<\/td><td>application/RLS enforced (Q270)<\/td><td>database-enforced by search path<\/td><td>physical<\/td><\/tr><\/tbody><\/table><p>The practical guidance: <strong>shared schema<\/strong> is the default for scale (thousands of tenants, self-serve SaaS), with RLS as defense in depth and a tenant column in every index. <strong>Database per tenant<\/strong> is right when tenants are few, large and contractually isolated (regulated enterprise deals), and it becomes the &quot;silo&quot; tier of a tiered model. <strong>Schema per tenant<\/strong> occupies an uncomfortable middle - it gives real isolation but PostgreSQL&#x27;s catalog does not love tens of thousands of schemas, connection pooling gets harder (<code>search_path<\/code> per request), and migrations scale linearly.<\/p><p>The pattern I would actually deploy is the <strong>tiered<\/strong> one from <code>03-microservices<\/code> Q216: shared schema as the pool, with the option to promote a specific tenant to their own database, and the code written so that placement is a routing lookup rather than a branch.<\/p>", "source": "answers.md", "search": "multi-tenancy: shared schema with a tenant column, schema per tenant, database per tenant. compare migration cost, blast radius and noisy neighbors. shared schema, tenant column schema per tenant database per tenant --- --- --- --- migration cost one migration, instant n migrations per release (q255) n migrations, plus n instances to manage blast radius worst - one bad query or migration affects everyone medium - per-schema failures possible best - fully isolated noisy neighbor worst - shared buffers, locks, connections shared instance, so still present isolated (if separate instances) per-tenant restore very hard - row-level extraction possible - restore one schema trivial cost at 5,000 tenants lowest moderate - catalog bloat, connection and vacuum overhead prohibitive isolation guarantee application/rls enforced (q270) database-enforced by search path physical the practical guidance: shared schema is the default for scale (thousands of tenants, self-serve saas), with rls as defense in depth and a tenant column in every index. database per tenant is right when tenants are few, large and contractually isolated (regulated enterprise deals), and it becomes the \"silo\" tier of a tiered model. schema per tenant occupies an uncomfortable middle - it gives real isolation but postgresql's catalog does not love tens of thousands of schemas, connection pooling gets harder (search_path per request), and migrations scale linearly. the pattern i would actually deploy is the tiered one from 03-microservices q216: shared schema as the pool, with the option to promote a specific tenant to their own database, and the code written so
