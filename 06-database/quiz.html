 where a logout on failover is acceptable, real-time leaderboards, presence, deduplication windows, and any derived data with a rebuild path from a durable source. the cases where i would refuse: money, orders, anything with a legal retention requirement, and anything whose loss cannot be detected. the question i ask the team is \"if this instance vanished right now, what would we do?\" - if the answer is \"rebuild it from postgres in ten minutes\", redis is a fine home; if the answer is a silence, it is not."}, {"n": 190, "category": 10, "difficulty": "T", "html": "Caching at four layers - client, CDN, application and database. What goes wrong when two of them have different TTLs?", "answerTitle": "Four caching layers with different TTLs", "answer": "<p>The layers - browser/client, CDN, application (Redis), database (result and buffer cache) - compose <strong>multiplicatively<\/strong>: worst-case staleness is the <em>sum<\/em> of the TTLs beneath the point of change, not the maximum. A 60-second application TTL under a 300-second CDN TTL under a 600-second browser cache means a user can see data up to 16 minutes old, and no single team&#x27;s configuration explains it.<\/p><p>What actually goes wrong:<\/p><ol><li><strong>Invalidation reaches only one layer.<\/strong> Your deploy purges Redis; the CDN keeps serving the old page for its full TTL, and the browser keeps its copy longer still. Users report a bug that no engineer can reproduce, because their own cache expired.<\/li><li><strong>Inconsistent views within one page.<\/strong> The HTML comes from the CDN (5 minutes old), an API call bypasses the CDN and returns fresh data, and the page renders contradictory numbers.<\/li><li><strong>Non-monotonic reads.<\/strong> A user refreshes and sees new, then old, then new, because two CDN edges or two application instances have entries of different ages.<\/li><li><strong>Debugging is layered<\/strong>, so an incident spends its first thirty minutes establishing which layer is serving the stale value.<\/li><\/ol><p>The disciplines: make the <strong>innermost TTL the shortest<\/strong>, so a lower layer never outlives the layer above it in a way that surprises you; use <strong>content-addressed or versioned URLs<\/strong> for anything immutable (fingerprinted assets can then have a one-year TTL and never need purging); reserve <strong>explicit purge<\/strong> for the CDN on publish events and accept that browser caches cannot be purged at all, so <code>Cache-Control: no-cache<\/code> with an <code>ETag<\/code> is the right default for HTML; and document the total staleness budget as a single number the product owner has agreed to, rather than four numbers nobody has added up.<\/p>", "source": "answers.md", "search": "caching at four layers - client, cdn, application and database. what goes wrong when two of them have different ttls? the layers - browser/client, cdn, application (redis), database (result and buffer cache) - compose multiplicatively : worst-case staleness is the sum of the ttls beneath the point of change, not the maximum. a 60-second application ttl under a 300-second cdn ttl under a 600-second browser cache means a user can see data up to 16 minutes old, and no single team's configuration explains it. what actually goes wrong: 1. invalidation reaches only one layer. your deploy purges redis; the cdn keeps serving the old page for its full ttl, and the browser keeps its copy longer still. users report a bug that no engineer can reproduce, because their own cache expired. 2. inconsistent views within one page. the html comes from the cdn (5 minutes old), an api call bypasses the cdn and returns fresh data, and the page renders contradictory numbers. 3. non-monotonic reads. a user refreshes and sees new, then old, then new, because two cdn edges or two application instances have entries of different ages. 4. debugging is layered , so an incident spends its first thirty minutes establishing which layer is serving the stale value. the disciplines: make the innermost ttl the shortest , so a lower layer never outlives the layer above it in a way that surprises you; use content-addressed or versioned urls for anything immutable (fingerprinted assets can then have a one-year ttl and never need purging); reserve explicit purge for the cdn on publish events and accept that browser caches cannot be purged at all, so cache-control: no-cache with an etag is the right default for html; and document the total staleness budget as a single number the product owner has agreed to, rather than four numbers nobody has added up."}, {"n": 191, "category": 10, "difficulty": "A", "html": "A team proposes caching everything for 60 seconds to fix a latency problem. What do you ask, and when is this actually the right answer?", "answerTitle": "Cache everything for 60 seconds", "answer": "<p><strong>What I ask.<\/strong> Which endpoints, and what is the read/write ratio on each? What is the actual latency problem - p50 or p99, and is it the database or something else (a downstream call, a serialization cost, GC)? What is the business tolerance for staleness on each screen, and are any of them <em>transactional<\/em> views where a user acts on the number they see? What happens when a user writes and immediately reads - do we get read-your-writes? Is the data per-user (in which case the hit rate may be near zero and the cache is pure overhead) or shared? And how do we invalidate on write, or are we relying on the TTL alone?<\/p><p><strong>When it is actually right.<\/strong> A blanket short TTL is a genuinely good answer when the data is <strong>shared, read-dominated and inherently stale-tolerant<\/strong> - a product catalogue, reference data, a pricing table, a public feed, a dashboard aggregate - and especially when the alternative is a complex invalidation scheme whose bugs would cause <em>worse<\/em> inconsistency than 60 seconds does. Sixty seconds also caps the damage: it is self-healing, it needs no invalidation plumbing, and it is trivially reversible. For a system under acute load pressure it is often the right <em>first<\/em> move precisely because it is cheap and can be undone.<\/p><p><strong>Where I would push back.<\/strong> On anything a user just wrote (read-your-writes breaks visibly and generates support tickets), on per-user data with low reuse (you pay memory and complexity for a 2 percent hit rate), on anything where a stale read drives a decision with money attached (inventory, balance, entitlement), and on the assumption that caching fixes a latency problem that is actually a query problem - if p99 is bad because of a missing index, the cache hides it until the cache misses, and then the incident is worse (Q178).<\/p><p><strong>The counter-proposal<\/strong> I would usually make: cache the top three endpoints by volume with explicit TTLs chosen per endpoint from the staleness budget, add invalidation on write for the ones that need it, add jitter and single-flight, and instrument hit rate and staleness. That is a week&#x27;s work rather than a day&#x27;s, and it does not produce a systemic bug that surfaces in six months as &quot;the data is sometimes wrong&quot;.<\/p><p><em>Hook: a blanket cache that fixed a launch, and the invalidation bug you found afterwards.<\/em><\/p>", "source": "answers.md", "search": "a team proposes caching everything for 60 seconds to fix a latency problem. what do you ask, and when is this actually the right answer? what i ask. which endpoints, and what is the read/write ratio on each? what is the actual latency problem - p50 or p99, and is it the database or something else (a downstream call, a serialization cost, gc)? what is the business tolerance for staleness on each screen, and are any of them transactional views where a user acts on the number they see? what happens when a user writes and immediately reads - do we get read-your-writes? is the data per-user (in which case the hit rate may be near zero and the cache is pure overhead) or shared? and how do we invalidate on write, or are we relying on the ttl alone? when it is actually right. a blanket short ttl is a genuinely good answer when the data is shared, read-dominated and inherently stale-tolerant - a product catalogue, reference data, a pricing table, a public feed, a dashboard aggregate - and especially when the alternative is a complex invalidation scheme whose bugs would cause worse inconsistency than 60 seconds does. sixty seconds also caps the damage: it is self-healing, it needs no invalidation plumbing, and it is trivially reversible. for a system under acute load pressure it is often the right first move precisely because it is cheap and can be undone. where i would push back. on anything a user just wrote (read-your-writes breaks visibly and generates support tickets), on per-user data with low reuse (you pay memory and complexity for a 2 percent hit rate), on anything where a stale read drives a decision with money attached (inventory, balance, entitlement), and on the assumption that caching fixes a latency problem that is actually a query problem - if p99 is bad because of a missing index, the cache hides it until the cache misses, and then the incident is worse (q178). the counter-proposal i would usually make: cache the top three endpoints by volume with explicit ttls chosen per endpoint from the staleness budget, add invalidation on write for the ones that need it, add jitter and single-flight, and instrument hit rate and staleness. that is a week's work rather than a day's, and it does not produce a systemic bug that surfaces in six months as \"the data is sometimes wrong\". hook: a blanket cache that fixed a launch, and the invalidation bug you found afterwards."}, {"n": 192, "category": 11, "difficulty": "C", "html": "Give the four NoSQL families - key-value, document, wide-column, graph - and the access pattern each is shaped for.", "answerTitle": "The four families", "answer": "<ul><li><strong>Key-value<\/strong> (Redis, DynamoDB in its simplest use, Memcached) - get and put by an opaque key. Shaped for point access at very high throughput, with no server-side query.<\/li><li><strong>Document<\/strong> (MongoDB, Couchbase, DocumentDB) - a key plus a structured, queryable value. Shaped for &quot;load the whole aggregate by id, and occasionally query inside it&quot;.<\/li><li><strong>Wide-column<\/strong> (Cassandra, HBase, ScyllaDB, Bigtable) - a partition key selecting a row, and within it many sorted columns. Shaped for &quot;give me a slice of a time-ordered series within one partition&quot;, at very high write rates.<\/li><li><strong>Graph<\/strong> (Neo4j, Neptune, JanusGraph) - nodes and edges with index-free adjacency. Shaped for traversals of unknown depth, where a relational recursive join would be quadratic.<\/li><\/ul><p>The point to add: each one is fast at exactly the access pattern its physical layout supports, and slow at everything else. That is the actual difference from a relational database, which is mediocre at everything and lets you change your mind - which is a feature until you know your access patterns and a cost afterwards.<\/p>", "source": "answers.md", "search": "give the four nosql families - key-value, document, wide-column, graph - and the access pattern each is shaped for. - key-value (redis, dynamodb in its simplest use, memcached) - get and put by an opaque key. shaped for point access at very high throughput, with no server-side query. - document (mongodb, couchbase, documentdb) - a key plus a structured, queryable value. shaped for \"load the whole aggregate by id, and occasionally query inside it\". - wide-column (cassandra, hbase, scylladb, bigtable) - a partition key selecting a row, and within it many sorted columns. shaped for \"give me a slice of a time-ordered series within one partition\", at very high write rates. - graph (neo4j, neptune, janusgraph) - nodes and edges with index-free adjacency. shaped for traversals of unknown depth, where a relational recursive join would be quadratic. the point to add: each one is fast at exactly the access pattern its physical layout supports, and slow at everything else. that is the actual difference from a relational database, which is mediocre at everything and lets you change your mind - which is a feature until you know your access patterns and a cost afterwards."}, {"n": 193, "category": 11, "difficulty": "T", "html": "&quot;NoSQL scales better than SQL.&quot; Take this apart precisely: what is actually being traded, and what does a modern PostgreSQL do that undermines the claim?", "answerTitle": "\"NoSQL scales better\"", "answer": "<p>What is actually traded is <strong>coordination<\/strong>. A system scales horizontally in proportion to how little cross-node agreement each operation needs. NoSQL stores achieve that by <em>removing features<\/em>: no cross-partition transactions, no joins, no global secondary constraints, no ad-hoc queries, often no strong consistency by default. Those removals are what allow linear scaling - not the data model, and not the absence of SQL.<\/p><p>Two things undermine the claim as usually stated. First, <strong>a relational database can make the same trade<\/strong>: shard it, forbid cross-shard queries and constraints, and you get the same scaling with the same restrictions (Q169) - which is exactly what Vitess and Citus do. Second, <strong>modern PostgreSQL absorbed most of the differentiators<\/strong>: JSONB with GIN indexing gives schema flexibility, logical replication and partitioning give operational scale, <code>SKIP LOCKED<\/code> gives queueing, and a single well-tuned instance handles workloads that in 2012 genuinely required a cluster - tens of thousands of writes per second on commodity hardware.<\/p><p>So the honest framing: choose NoSQL when the access pattern is known, narrow and enormous, or when the data model genuinely is not relational (documents, wide time-series, graphs). Do not choose it for &quot;scale&quot; without stating the write rate and the dataset size, because the numbers are usually well within one relational node.<\/p>", "source": "answers.md", "search": "\"nosql scales better than sql.\" take this apart precisely: what is actually being traded, and what does a modern postgresql do that undermines the claim? what is actually traded is coordination . a system scales horizontally in proportion to how little cross-node agreement each operation needs. nosql stores achieve that by removing features : no cross-partition transactions, no joins, no global secondary constraints, no ad-hoc queries, often no strong consistency by default. those removals are what allow linear scaling - not the data model, and not the absence of sql. two things undermine the claim as usually stated. first, a relational database can make the same trade : shard it, forbid cross-shard queries and constraints, and you get the same scaling with the same restrictions (q169) - which is exactly what vitess and citus do. second, modern postgresql absorbed most of the differentiators : jsonb with gin indexing gives schema flexibility, logical replication and partitioning give operational scale, skip locked gives queueing, and a single well-tuned instance handles workloads that in 2012 genuinely required a cluster - tens of thousands of writes per second on commodity hardware. so the honest framing: choose nosql when the access pattern is known, narrow and enormous, or when the data model genuinely is not relational (documents, wide time-series, graphs). do not choose it for \"scale\" without stating the write rate and the dataset size, because the numbers are usually well within one relational node."}, {"n": 194, "category": 11, "difficulty": "D", "html": "Schema-on-read versus schema-on-write. Where does the validation debt actually land, and how do you manage it?", "answerTitle": "Schema-on-read versus schema-on-write", "answer": "<p>Schema-on-write validates at insert: the database rejects bad data, and every reader can rely on the shape. Schema-on-read accepts anything and each reader interprets it.<\/p><p>The debt does not disappear - it <strong>lands on every reader, forever, and at runtime rather than at write time<\/strong>. In a schema-on-read store with three years of history, a single field may exist in five shapes: absent, string, integer, string-that-looks-like-an-integer, and an object added last year. Every consumer must handle all five, and a consumer written today silently breaks on documents written in 2023. Worse, the failure surfaces in production at read time, on the oldest and least-tested data.<\/p><p>How I manage it: <strong>validate at the boundary anyway<\/strong> - MongoDB&#x27;s JSON Schema validators, or the application&#x27;s own schema with a version field on every document; <strong>version documents explicitly<\/strong> (<code>schemaVersion: 3<\/code>) and migrate lazily on read <em>and<\/em> eagerly with a background job, so the tail of old shapes is finite; keep the number of supported versions small and enforce it with a &quot;no reads of version &lt; N&quot; alert; and treat a field&#x27;s type as part of a contract owned by the writing service (<code>03-microservices<\/code> Q24). Schema-on-read is a deployment convenience, not an absence of schema - the schema is in the code, and the question is only whether it is written down.<\/p>", "source": "answers.md", "search": "schema-on-read versus schema-on-write. where does the validation debt actually land, and how do you manage it? schema-on-write validates at insert: the database rejects bad data, and every reader can rely on the shape. schema-on-read accepts anything and each reader interprets it. the debt does not disappear - it lands on every reader, forever, and at runtime rather than at write time . in a schema-on-read store with three years of history, a single field may exist in five shapes: absent, string, integer, string-that-looks-like-an-integer, and an object added last year. every consumer must handle all five, and a consumer written today silently breaks on documents written in 2023. worse, the failure surfaces in production at read time, on the oldest and least-tested data. how i manage it: validate at the boundary anyway - mongodb's json schema validators, or the application's own schema with a version field on every document; version documents explicitly (schemaversion: 3) and migrate lazily on read and eagerly with a background job, so the tail of old shapes is finite; keep the number of supported versions small and enforce it with a \"no reads of version < n\" alert; and treat a field's type as part of a contract owned by the writing service (03-microservices q24). schema-on-read is a deployment convenience, not an absence of schema - the schema is in the code, and the question is only whether it is written down."}, {"n": 195, "category": 11, "difficulty": "D", "html": "MongoDB: embedding versus referencing. Give the three questions that decide it and the 16 MB constraint that ends the argument.", "answerTitle": "MongoDB: embed or reference", "answer": "<p>The three questions:<\/p><ol><li><strong>Is the child ever accessed independently of the parent?<\/strong> If yes (a comment that can be linked directly, a product line in a report across orders), reference. Embedded data cannot be queried as a first-class collection without an aggregation pipeline.<\/li><li><strong>What is the cardinality, and is it bounded?<\/strong> One-to-few embeds well; one-to-many with a known small bound (addresses, order lines) embeds; one-to-unbounded (events, comments on a viral post) must reference or bucket, because the document grows without limit.<\/li><li><strong>What is the read/write ratio and the update granularity?<\/strong> Embedding makes reads one round trip and atomic single-document writes; but every update rewrites - and may <strong>move<\/strong> - the whole document, so a hot small field inside a big document is expensive.<\/li><\/ol><p>The <strong>16 MB document limit<\/strong> ends the argument for the unbounded cases: once a document can grow without a hard ceiling, embedding is a time bomb that fails only after the system has been live long enough to matter. The standard resolution is the <strong>subset pattern<\/strong> (embed the most recent or most relevant N children, reference the rest) or <strong>bucketing<\/strong> (a document per parent per time window holding up to N children), which also keeps working-set size sane.<\/p>", "source": "answers.md", "search": "mongodb: embedding versus referencing. give the three questions that decide it and the 16 mb constraint that ends the argument. the three questions: 1. is the child ever accessed independently of the parent? if yes (a comment that can be linked directly, a product line in a report across orders), reference. embedded data cannot be queried as a first-class collection without an aggregation pipeline. 2. what is the cardinality, and is it bounded? one-to-few embeds well; one-to-many with a known small bound (addresses, order lines) embeds; one-to-unbounded (events, comments on a viral post) must reference or bucket, because the document grows without limit. 3. what is the read/write ratio and the update granularity? embedding makes reads one round trip and atomic single-document writes; but every update rewrites - and may move - the whole document, so a hot small field inside a big document is expensive. the 16 mb document limit ends the argument for the unbounded cases: once a document can grow without a hard ceiling, embedding is a time bomb that fails only after the system has been live long enough to matter. the standard resolution is the subset pattern (embed the most recent or most relevant n children, reference the rest) or bucketing (a document per parent per time window holding up to n children), which also keeps working-set size sane."}, {"n": 196, "category": 11, "difficulty": "D", "html": "MongoDB indexes - compound, multikey, partial, TTL, wildcard. What is the ESR rule and why does it exist?", "answerTitle": "MongoDB indexes and the ESR rule", "answer": "<p>Types: <strong>compound<\/strong> (multiple fields, with the same leftmost-prefix rule as a B-tree), <strong>multikey<\/strong> (automatically created when a field is an array - one index entry per element, and a compound index may contain at most one array field), <strong>partial<\/strong> (<code>partialFilterExpression<\/code>, the equivalent of a partial index), <strong>TTL<\/strong> (a background thread deletes documents once an indexed date is older than <code>expireAfterSeconds<\/code> - deletion runs about once a minute, so expiry is approximate), <strong>wildcard<\/strong> (<code>$**<\/code>, indexes unknown field names - useful for genuinely dynamic attributes, expensive and no substitute for knowing your queries), plus text, geospatial and hashed.<\/p><p><strong>ESR<\/strong> is the ordering rule for compound indexes: <strong>Equality<\/strong> fields first, then <strong>Sort<\/strong> fields, then <strong>Range<\/strong> fields. It exists because the index is a sorted structure: equality predicates narrow to a contiguous span; within that span the entries are already in the sort field&#x27;s order, so the sort is free; and a range must come last because after consuming it the remaining fields are no longer sorted usefully. Getting it wrong produces the two classic symptoms - an in-memory <code>SORT<\/code> stage (which fails outright above 32 MB unless it can spill) and a large <code>totalKeysExamined<\/code> relative to <code>nReturned<\/code> in <code>explain()<\/code>. It is the same reasoning as Q45, with a name.<\/p>", "source": "answers.md", "search": "mongodb indexes - compound, multikey, partial, ttl, wildcard. what is the esr rule and why does it exist? types: compound (multiple fields, with the same leftmost-prefix rule as a b-tree), multikey (automatically created when a field is an array - one index entry per element, and a compound index may contain at most one array field), partial (partialfilterexpression, the equivalent of a partial index), ttl (a background thread deletes documents once an indexed date is older than expireafterseconds - deletion runs about once a minute, so expiry is approximate), wildcard ($ , indexes unknown field names - useful for genuinely dynamic attributes, expensive and no substitute for knowing your queries), plus text, geospatial and hashed. esr is the ordering rule for compound indexes: equality fields first, then sort fields, then range fields. it exists because the index is a sorted structure: equality predicates narrow to a contiguous span; within that span the entries are already in the sort field's order, so the sort is free; and a range must come last because after consuming it the remaining fields are no longer sorted usefully. getting it wrong produces the two classic symptoms - an in-memory sort stage (which fails outright above 32 mb unless it can spill) and a large totalkeysexamined relative to nreturned in explain(). it is the same reasoning as q45, with a name."}, {"n": 197, "category": 11, "difficulty": "D", "html": "MongoDB write concern (<code>w<\/code>, <code>j<\/code>, <code>wtimeout<\/code>) and read concern (<code>local<\/code>, <code>majority<\/code>, <code>linearizable<\/code>). Which combination gives read-your-writes?", "answerTitle": "Write concern and read concern", "answer": "<p><strong>Write concern<\/strong> is durability: <code>w: 1<\/code> means the primary acknowledged; <code>w: &quot;majority&quot;<\/code> means a majority of the replica set has it, so it survives a failover; <code>j: true<\/code> adds a journal flush to disk; <code>wtimeout<\/code> bounds the wait (and note that a timeout does <strong>not<\/strong> roll the write back - it may still commit).<\/p><p><strong>Read concern<\/strong> is visibility: <code>local<\/code> returns the node&#x27;s most recent data, which may later be rolled back; <code>majority<\/code> returns only data acknowledged by a majority, so it can never be rolled back; <code>linearizable<\/code> additionally guarantees you see all writes that completed before the read began, at the cost of a round trip to confirm the node is still primary; <code>snapshot<\/code> gives a consistent point-in-time view for transactions.<\/p><p><strong>Read-your-writes<\/strong> comes from <code>w: &quot;majority&quot;<\/code> + <code>readConcern: &quot;majority&quot;<\/code> + reading in the same <strong>causally consistent session<\/strong> (the driver carries a cluster time and the server waits for it). Causal consistency in a session is the mechanism that makes it work even when the read goes to a secondary; without the session, a majority read from a lagging secondary can still miss your write. The pragmatic default for most applications is <code>w: &quot;majority&quot;<\/code> with primary reads.<\/p>", "source": "answers.md", "search": "mongodb write concern (w, j, wtimeout) and read concern (local, majority, linearizable). which combination gives read-your-writes? write concern is durability: w: 1 means the primary acknowledged; w: \"majority\" means a majority of the replica set has it, so it survives a failover; j: true adds a journal flush to disk; wtimeout bounds the wait (and note that a timeout does not roll the write back - it may still commit). read concern is visibility: local returns the node's most recent data, which may later be rolled back; majority returns only data acknowledged by a majority, so it can never be rolled back; linearizable additionally guarantees you see all writes that completed before the read began, at the cost of a round trip to confirm the node is still primary; snapshot gives a consistent point-in-time view for transactions. read-your-writes comes from w: \"majority\" + readconcern: \"majority\" + reading in the same causally consistent session (the driver carries a cluster time and the server waits for it). causal consistency in a session is the mechanism that makes it work even when the read goes to a secondary; without the session, a majority read from a lagging secondary can still miss your write. the pragmatic default for most applications is w: \"majority\" with primary reads."}, {"n": 198, "category": 11, "difficulty": "T", "html": "MongoDB multi-document transactions exist. Why is needing them usually a modeling smell, and what do they cost on a sharded cluster?", "answerTitle": "Multi-document transactions as a smell", "answer": "<p>MongoDB has had multi-document ACID transactions since 4.0 (replica set) and 4.2 (sharded), so the capability is real. But the document model&#x27;s premise is that <strong>the document is the transaction boundary<\/strong>: you embed what changes together, so a single-document update is already atomic. Reaching for a multi-document transaction usually means the aggregate was split across documents in a way the access pattern does not support - which is a modeling decision to revisit, not a feature to lean on.<\/p><p>The costs make that concrete. A transaction holds a snapshot, and MongoDB has a default 60-second limit; WiredTiger keeps the transaction&#x27;s history in cache, so long or large transactions cause cache pressure and can stall other operations; write conflicts abort the transaction and the application must retry (the drivers provide a retry helper, and it must be idempotent). On a <strong>sharded<\/strong> cluster it is far worse: a distributed transaction runs two-phase commit across shards with a coordinator, taking multiple network round trips, holding locks across them, and blocking chunk migrations for the affected ranges. Throughput drops by an order of magnitude compared with single-document writes.<\/p><p>So my rule: transactions are a correctness backstop for the rare cross-aggregate operation (a transfer, a cascading delete), not a routine pattern. If they appear in a hot path, the schema is wrong.<\/p>", "source": "answers.md", "search": "mongodb multi-document transactions exist. why is needing them usually a modeling smell, and what do they cost on a sharded cluster? mongodb has had multi-document acid transactions since 4.0 (replica set) and 4.2 (sharded), so the capability is real. but the document model's premise is that the document is the transaction boundary : you embed what changes together, so a single-document update is already atomic. reaching for a multi-document transaction usually means the aggregate was split across documents in a way the access pattern does not support - which is a modeling decision to revisit, not a feature to lean on. the costs make that concrete. a transaction holds a snapshot, and mongodb has a default 60-second limit; wiredtiger keeps the transaction's history in cache, so long or large transactions cause cache pressure and can stall other operations; write conflicts abort the transaction and the application must retry (the drivers provide a retry helper, and it must be idempotent). on a sharded cluster it is far worse: a distributed transaction runs two-phase commit across shards with a coordinator, taking multiple network round trips, holding locks across them, and blocking chunk migrations for the affected ranges. throughput drops by an order of magnitude compared with single-document writes. so my rule: transactions are a correctness backstop for the rare cross-aggregate operation (a transfer, a cascading delete), not a routine pattern. if they appear in a hot path, the schema is wrong."}, {"n": 199, "category": 11, "difficulty": "D", "html": "MongoDB replica sets: elections, the oplog, rollback of un-replicated writes, and why an arbiter is a trap.", "answerTitle": "Replica sets, oplog, rollback, arbiters", "answer": "<p>A replica set has one primary and N secondaries. The primary records every change in the <strong>oplog<\/strong> - a capped collection of idempotent operations - and secondaries tail it and apply it. Idempotency matters: an <code>$inc<\/code> is recorded as the resulting <code>$set<\/code>, so re-applying an oplog entry is safe.<\/p><p><strong>Elections<\/strong> use a Raft-like protocol: when the primary is unreachable for <code>electionTimeoutMillis<\/code> (default 10 s), the members vote, and a candidate needs a <strong>majority of all voting members<\/strong> to win. That majority requirement is what prevents split brain, and it is why the set must have an odd number of votes.<\/p><p><strong>Rollback<\/strong> is the consequence of asynchronous replication: if the primary accepts writes with <code>w: 1<\/code>, fails, and a secondary that never received those writes is elected, the old primary on rejoin must <strong>undo<\/strong> them - they are written to a rollback file and are effectively lost. <code>w: &quot;majority&quot;<\/code> prevents this by not acknowledging until the write cannot be rolled back.<\/p><p><strong>Why an arbiter is a trap<\/strong>: it votes but holds no data. With a primary, one secondary and an arbiter (P-S-A), losing the secondary leaves a majority of votes so the primary stays up - but there is now only <strong>one copy of the data<\/strong>, and <code>w: &quot;majority&quot;<\/code> (majority of <em>data-bearing<\/em> members = 2) can never be satisfied, so majority writes hang. You have preserved availability of the <em>election<\/em> while destroying durability and the write path. Three data-bearing members is the correct configuration; an arbiter is a cost saving that buys a worse failure mode.<\/p>", "source": "answers.md", "search": "mongodb replica sets: elections, the oplog, rollback of un-replicated writes, and why an arbiter is a trap. a replica set has one primary and n secondaries. the primary records every change in the oplog - a capped collection of idempotent operations - and secondaries tail it and apply it. idempotency matters: an $inc is recorded as the resulting $set, so re-applying an oplog entry is safe. elections use a raft-like protocol: when the primary is unreachable for electiontimeoutmillis (default 10 s), the members vote, and a candidate needs a majority of all voting members to win. that majority requirement is what prevents split brain, and it is why the set must have an odd number of votes. rollback is the consequence of asynchronous replication: if the primary accepts writes with w: 1, fails, and a secondary that never received those writes is elected, the old primary on rejoin must undo them - they are written to a rollback file and are effectively lost. w: \"majority\" prevents this by not acknowledging until the write cannot be rolled back. why an arbiter is a trap : it votes but holds no data. with a primary, one secondary and an arbiter (p-s-a), losing the secondary leaves a majority of votes so the primary stays up - but there is now only one copy of the data , and w: \"majority\" (majority of data-bearing members = 2) can never be satisfied, so majority writes hang. you have preserved availability of the election while destroying durability and the write path. three data-bearing members is the correct configuration; an arbiter is a cost saving that buys a worse failure mode."}, {"n": 200, "category": 11, "difficulty": "D", "html": "Cassandra data modeling: partition key versus clustering key, and why you design one table per query.", "answerTitle": "Cassandra data modeling", "answer": "<p>The primary key is <code>((partition key), clustering columns)<\/code>. The <strong>partition key<\/strong> determines which node(s) hold the data, via the token ring - it is the unit of locality and the only thing a query can efficiently target. <strong>Clustering columns<\/strong> determine the sort order <em>within<\/em> the partition, so they support range slices and ordered reads, but only within one partition.<\/p><p>You design <strong>one table per query<\/strong> because there is no join, no ad-hoc filtering, and no query planner worth appealing to. A query that does not specify the partition key must scan the whole cluster (<code>ALLOW FILTERING<\/code>, which is a warning label, not a feature). So the process is: enumerate the queries first, then design a table whose primary key exactly matches each one&#x27;s access path, then denormalize the data into all of them at write time. Writes are cheap in an LSM store (Q132), so duplicating data across five tables is the intended trade.<\/p><p>The consequence to state plainly: in Cassandra the <strong>query workload is the schema<\/strong>, and adding a new query pattern later means adding a new table and backfilling it. That is the real cost of choosing it, and the reason it belongs where the access patterns are known and stable.<\/p>", "source": "answers.md", "search": "cassandra data modeling: partition key versus clustering key, and why you design one table per query. the primary key is ((partition key), clustering columns). the partition key determines which node(s) hold the data, via the token ring - it is the unit of locality and the only thing a query can efficiently target. clustering columns determine the sort order within the partition, so they support range slices and ordered reads, but only within one partition. you design one table per query because there is no join, no ad-hoc filtering, and no query planner worth appealing to. a query that does not specify the partition key must scan the whole cluster (allow filtering, which is a warning label, not a feature). so the process is: enumerate the queries first, then design a table whose primary key exactly matches each one's access path, then denormalize the data into all of them at write time. writes are cheap in an lsm store (q132), so duplicating data across five tables is the intended trade. the consequence to state plainly: in cassandra the query workload is the schema , and adding a new query pattern later means adding a new table and backfilling it. that is the real cost of choosing it, and the reason it belongs where the access patterns are known and stable."}, {"n": 201, "category": 11, "difficulty": "T", "html": "A Cassandra partition grows unbounded. What breaks first, and what is the standard bucketing fix?", "answerTitle": "An unbounded partition", "answer": "<p>What breaks first: <strong>reads<\/strong>. A read must reconstruct the row from the memtable plus every SSTable containing part of the partition, and a huge partition means large scans, large results held in memory on the coordinator and the replica, and heap pressure that shows up as GC pauses. Then <strong>compaction<\/strong> struggles because a partition cannot be split across SSTables usefully, so compacting it rewrites enormous amounts of data. Then <strong>repair<\/strong> and streaming (bootstrapping a new node) slow to a crawl because the unit of transfer is large. Cassandra warns above 100 MB and the practical guidance is to keep partitions under about 100 MB and 100,000 rows.<\/p><p>The standard fix is <strong>bucketing<\/strong>: add a synthetic component to the partition key that bounds its size. For time-series, <code>((sensor_id, day), timestamp)<\/code> instead of <code>((sensor_id), timestamp)<\/code>, so each partition holds one day of readings. For an unbounded list, <code>((user_id, bucket), item_id)<\/code> with <code>bucket = floor(sequence / 10000)<\/code>.<\/p><p>The cost of bucketing is that a query spanning buckets becomes several queries (which the client issues in parallel and merges), and the client must know the bucket boundaries - so the bucket granularity is chosen from the read pattern: fine enough to bound size, coarse enough that a typical query touches one or two buckets.<\/p>", "source": "answers.md", "search": "a cassandra partition grows unbounded. what breaks first, and what is the standard bucketing fix? what breaks first: reads . a read must reconstruct the row from the memtable plus every sstable containing part of the partition, and a huge partition means large scans, large results held in memory on the coordinator and the replica, and heap pressure that shows up as gc pauses. then compaction struggles because a partition cannot be split across sstables usefully, so compacting it rewrites enormous amounts of data. then repair and streaming (bootstrapping a new node) slow to a crawl because the unit of transfer is large. cassandra warns above 100 mb and the practical guidance is to keep partitions under about 100 mb and 100,000 rows. the standard fix is bucketing : add a synthetic component to the partition key that bounds its size. for time-series, ((sensor_id, day), timestamp) instead of ((sensor_id), timestamp), so each partition holds one day of readings. for an unbounded list, ((user_id, bucket), item_id) with bucket = floor(sequence / 10000). the cost of bucketing is that a query spanning buckets becomes several queries (which the client issues in parallel and merges), and the client must know the bucket boundaries - so the bucket granularity is chosen from the read pattern: fine enough to bound size, coarse enough that a typical query touches one or two buckets."}, {"n": 202, "category": 11, "difficulty": "D", "html": "Cassandra tunable consistency: <code>ONE<\/code>, <code>QUORUM<\/code>, <code>LOCAL_QUORUM<\/code>, <code>ALL<\/code>, and how <code>R + W &gt; N<\/code> plays out across data centers.", "answerTitle": "Tunable consistency", "answer": "<p>Each read and write specifies how many replicas must respond: <code>ONE<\/code>, <code>QUORUM<\/code> (a majority of all replicas across all data centres), <code>LOCAL_QUORUM<\/code> (a majority within the local data centre), <code>ALL<\/code>, plus <code>LOCAL_ONE<\/code> and <code>EACH_QUORUM<\/code>.<\/p><p><code>R + W &gt; N<\/code> guarantees that the read set and the write set overlap in at least one replica, so a read sees the latest acknowledged write - strong consistency for a single key, with last-write-wins by timestamp resolving conflicts. With <code>N = 3<\/code>, <code>W = QUORUM (2)<\/code> and <code>R = QUORUM (2)<\/code>, <code>2 + 2 &gt; 3<\/code> holds, and you tolerate one replica being down on each side.<\/p><p>Across data centres the arithmetic gets interesting. With <code>N = 3<\/code> in each of two DCs (<code>N = 6<\/code> total), <code>QUORUM<\/code> is 4 - which means every operation waits for a cross-DC round trip, adding tens of milliseconds. <code>LOCAL_QUORUM<\/code> (2 of the local 3) keeps latency local and is what almost everyone uses, but <code>LOCAL_QUORUM<\/code> reads in DC2 do <strong>not<\/strong> overlap with <code>LOCAL_QUORUM<\/code> writes in DC1, so you get eventual consistency across DCs even though each DC is internally consistent. If you need cross-DC strong consistency you must use <code>EACH_QUORUM<\/code> writes or <code>QUORUM<\/code>, and pay the latency.<\/p><p>Two footnotes worth having: last-write-wins depends on clock synchronization, so clock skew silently loses writes (Q106); and read repair plus anti-entropy repair are what converge the replicas that were not part of the quorum.<\/p>", "source": "answers.md", "search": "cassandra tunable consistency: one, quorum, local_quorum, all, and how r + w n plays out across data centers. each read and write specifies how many replicas must respond: one, quorum (a majority of all replicas across all data centres), local_quorum (a majority within the local data centre), all, plus local_one and each_quorum. r + w n guarantees that the read set and the write set overlap in at least one replica, so a read sees the latest acknowledged write - strong consistency for a single key, with last-write-wins by timestamp resolving conflicts. with n = 3, w = quorum (2) and r = quorum (2), 2 + 2 3 holds, and you tolerate one replica being down on each side. across data centres the arithmetic gets interesting. with n = 3 in each of two dcs (n = 6 total), quorum is 4 - which means every operation waits for a cross-dc round trip, adding tens of milliseconds. local_quorum (2 of the local 3) keeps latency local and is what almost everyone uses, but local_quorum reads in dc2 do not overlap with local_quorum writes in dc1, so you get eventual consistency across dcs even though each dc is internally consistent. if you need cross-dc strong consistency you must use each_quorum writes or quorum, and pay the latency. two footnotes worth having: last-write-wins depends on clock synchronization, so clock skew silently loses writes (q106); and read repair plus anti-entropy repair are what converge the replicas that were not part of the quorum."}, {"n": 203, "category": 11, "difficulty": "D", "html": "Tombstones in Cassandra: why deletes are writes, what <code>gc_grace_seconds<\/code> protects, and how a tombstone storm kills reads.", "answerTitle": "Tombstones", "answer": "<p>A delete in an LSM store cannot modify the existing SSTables, so it writes a <strong>tombstone<\/strong> - a marker with a timestamp saying &quot;this is deleted&quot;. Reads must merge tombstones with the live data to know that a value is gone. The same applies to TTL expiry, to setting a column to null, and to inserting a null in a collection.<\/p><p><code>gc_grace_seconds<\/code> (default 10 days) is how long tombstones are retained before compaction may remove them. It exists to prevent <strong>zombie data<\/strong>: if a replica was down when the delete happened and the tombstone were purged before that replica came back and was repaired, the old live value would be resurrected during the next read repair. So the rule is that a full repair must complete within <code>gc_grace_seconds<\/code>, and lowering it without a reliable repair schedule reintroduces resurrection.<\/p><p>A <strong>tombstone storm<\/strong> kills reads because a read of a range must scan and merge every tombstone in that range. A queue-like table (insert, read, delete) accumulates millions of tombstones in the partitions being scanned; the read touches all of them to return zero live rows, blows past <code>tombstone_warn_threshold<\/code> (1,000) and then <code>tombstone_failure_threshold<\/code> (100,000), and the query is <strong>aborted<\/strong>. This is why &quot;use Cassandra as a queue&quot; is the canonical anti-pattern. The mitigations are to model deletes away (TTL with time-bucketed partitions that are dropped whole, rather than row deletes), to avoid inserting nulls, and to keep range scans away from deleted regions.<\/p>", "source": "answers.md", "search": "tombstones in cassandra: why deletes are writes, what gc_grace_seconds protects, and how a tombstone storm kills reads. a delete in an lsm store cannot modify the existing sstables, so it writes a tombstone - a marker with a timestamp saying \"this is deleted\". reads must merge tombstones with the live data to know that a value is gone. the same applies to ttl expiry, to setting a column to null, and to inserting a null in a collection. gc_grace_seconds (default 10 days) is how long tombstones are retained before compaction may remove them. it exists to prevent zombie data : if a replica was down when the delete happened and the tombstone were purged before that replica came back and was repaired, the old live value would be resurrected during the next read repair. so the rule is that a full repair must complete within gc_grace_seconds, and lowering it without a reliable repair schedule reintroduces resurrection. a tombstone storm kills reads because a read of a range must scan and merge every tombstone in that range. a queue-like table (insert, read, delete) accumulates millions of tombstones in the partitions being scanned; the read touches all of them to return zero live rows, blows past tombstone_warn_threshold (1,000) and then tombstone_failure_threshold (100,000), and the query is aborted . this is why \"use cassandra as a queue\" is the canonical anti-pattern. the mitigations are to model deletes away (ttl with time-bucketed partitions that are dropped whole, rather than row deletes), to avoid inserting nulls, and to keep range scans away from deleted regions."}, {"n": 204, "category": 11, "difficulty": "D", "html": "Cassandra lightweight transactions and Paxos. What do they cost, and what is the correct usage rate?", "answerTitle": "Lightweight transactions", "answer": "<p>An LWT (<code>INSERT ... IF NOT EXISTS<\/code>, <code>UPDATE ... IF column = value<\/code>) provides linearizable compare-and-set for a single partition, implemented with <strong>Paxos<\/strong>. The cost is four round trips among the replicas - prepare/promise, read, propose/accept, commit - instead of one, so an LWT is roughly <strong>4x the latency<\/strong> of a normal write and considerably more expensive in coordination; under contention on the same partition, competing proposals cause retries and can livelock.<\/p><p>They also do not compose: an LWT is linearizable only for that one partition, so two LWTs are not a transaction, and mixing LWT and non-LWT writes to the same partition breaks the guarantee entirely (a plain write can overwrite a Paxos-agreed value).<\/p><p>The correct usage rate is <strong>rare and deliberate<\/strong>: unique username registration, a state transition that must happen exactly once, claiming a resource. If LWTs are on the hot path - or if a significant fraction of writes use them - the workload wants a different store, because you are paying for consensus on a system chosen for avoiding it.<\/p>", "source": "answers.md", "search": "cassandra lightweight transactions and paxos. what do they cost, and what is the correct usage rate? an lwt (insert ... if not exists, update ... if column = value) provides linearizable compare-and-set for a single partition, implemented with paxos . the cost is four round trips among the replicas - prepare/promise, read, propose/accept, commit - instead of one, so an lwt is roughly 4x the latency of a normal write and considerably more expensive in coordination; under contention on the same partition, competing proposals cause retries and can livelock. they also do not compose: an lwt is linearizable only for that one partition, so two lwts are not a transaction, and mixing lwt and non-lwt writes to the same partition breaks the guarantee entirely (a plain write can overwrite a paxos-agreed value). the correct usage rate is rare and deliberate : unique username registration, a state transition that must happen exactly once, claiming a resource. if lwts are on the hot path - or if a significant fraction of writes use them - the workload wants a different store, because you are paying for consensus on a system chosen for avoiding it."}, {"n": 205, "category": 11, "difficulty": "D", "html": "DynamoDB single-table design: overloaded keys, item collections, and the access-pattern inventory you build first.", "answerTitle": "DynamoDB single-table design", "answer": "<p>The premise is that DynamoDB has no joins, and a query can only target one table and one index at a time - so if a screen needs an order plus its items plus the customer, they must live in the <strong>same partition<\/strong> to be fetched in one query. Single-table design puts multiple entity types in one table with <strong>generic key names<\/strong> (<code>PK<\/code>, <code>SK<\/code>) whose values are overloaded: <code>PK = CUSTOMER#123<\/code>, <code>SK = PROFILE<\/code> for the customer; <code>PK = CUSTOMER#123<\/code>, <code>SK = ORDER#2026-01-05#456<\/code> for their orders. A single <code>Query<\/code> on <code>PK = CUSTOMER#123<\/code> with <code>begins_with(SK, &#x27;ORDER#&#x27;)<\/code> returns exactly the item collection you need, sorted, in one request.<\/p><p>The <strong>item collection<\/strong> (all items sharing a partition key) is therefore the unit of co-location, and the sort key is designed as a hierarchical, sortable string so prefix queries slice it.<\/p><p>The process is inverted from relational design: you <strong>write down every access pattern first<\/strong> - the exact query, its filters, its sort order, its cardinality and its frequency - and only then design keys that serve them, adding GSIs for the patterns the base table cannot answer. That inventory is the deliverable; the schema falls out of it.<\/p><p>The honest caveat: this optimizes hard for known patterns and is genuinely painful when a new access pattern appears, since it may need a new GSI plus a backfill, or a table redesign. Which is precisely the Q212 argument.<\/p>", "source": "answers.md", "search": "dynamodb single-table design: overloaded keys, item collections, and the access-pattern inventory you build first. the premise is that dynamodb has no joins, and a query can only target one table and one index at a time - so if a screen needs an order plus its items plus the customer, they must live in the same partition to be fetched in one query. single-table design puts multiple entity types in one table with generic key names (pk, sk) whose values are overloaded: pk = customer 123, sk = profile for the customer; pk = customer 123, sk = order 2026-01-05 456 for their orders. a single query on pk = customer 123 with begins_with(sk, 'order ') returns exactly the item collection you need, sorted, in one request. the item collection (all items sharing a partition key) is therefore the unit of co-location, and the sort key is designed as a hierarchical, sortable string so prefix queries slice it. the process is inverted from relational design: you write down every access pattern first - the exact query, its filters, its sort order, its cardinality and its frequency - and only then design keys that serve them, adding gsis for the patterns the base table cannot answer. that inventory is the deliverable; the schema falls out of it. the honest caveat: this optimizes hard for known patterns and is genuinely painful when a new access pattern appears, since it may need a new gsi plus a backfill, or a table redesign. which is precisely the q212 argument."}, {"n": 206, "category": 11, "difficulty": "D", "html": "DynamoDB GSI versus LSI: consistency, capacity, key constraints, and the GSI back-pressure failure mode.", "answerTitle": "GSI versus LSI", "answer": "<table><thead><tr><th><\/th><th>LSI (local)<\/th><th>GSI (global)<\/th><\/tr><\/thead><tbody><tr><td>Partition key<\/td><td>same as the table<\/td><td>any attribute<\/td><\/tr><tr><td>When created<\/td><td><strong>only at table creation<\/strong><\/td><td>any time<\/td><\/tr><tr><td>Consistency<\/td><td>strongly consistent reads available<\/td><td><strong>eventually consistent only<\/strong><\/td><\/tr><tr><td>Capacity<\/td><td>shares the table&#x27;s<\/td><td>its own, separate<\/td><\/tr><tr><td>Constraint<\/td><td>item collection (all items with that PK, across table and LSIs) capped at <strong>10 GB<\/strong><\/td><td>no size limit<\/td><\/tr><tr><td>Uniqueness<\/td><td>inherits the table&#x27;s<\/td><td>none - keys need not be unique<\/td><\/tr><\/tbody><\/table><p>The GSI back-pressure failure mode is the one to know: a GSI is maintained <strong>asynchronously<\/strong> by DynamoDB, and it has its <strong>own<\/strong> provisioned capacity. If writes to the table produce index updates faster than the GSI&#x27;s capacity allows, the internal replication queue backs up; the GSI falls further behind (reads return stale data), and if it cannot catch up, <strong>DynamoDB throttles the writes to the base table itself<\/strong>. So an under-provisioned GSI takes down writes to a well-provisioned table - a coupling that surprises people, and the reason GSIs should be on-demand or generously provisioned, and the reason you do not create a GSI on a high-churn attribute with low selectivity.<\/p>", "source": "answers.md", "search": "dynamodb gsi versus lsi: consistency, capacity, key constraints, and the gsi back-pressure failure mode. lsi (local) gsi (global) --- --- --- partition key same as the table any attribute when created only at table creation any time consistency strongly consistent reads available eventually consistent only capacity shares the table's its own, separate constraint item collection (all items with that pk, across table and lsis) capped at 10 gb no size limit uniqueness inherits the table's none - keys need not be unique the gsi back-pressure failure mode is the one to know: a gsi is maintained asynchronously by dynamodb, and it has its own provisioned capacity. if writes to the table produce index updates faster than the gsi's capacity allows, the internal replication queue backs up; the gsi falls further behind (reads return stale data), and if it cannot catch up, dynamodb throttles the writes to the base table itself . so an under-provisioned gsi takes down writes to a well-provisioned table - a coupling that surprises people, and the reason gsis should be on-demand or generously provisioned, and the reason you do not create a gsi on a high-churn attribute with low selectivity."}, {"n": 207, "category": 11, "difficulty": "T", "html": "A DynamoDB partition is throttling while total consumed capacity is well below provisioned. Explain adaptive capacity and what you actually change.", "answerTitle": "Throttling below provisioned capacity", "answer": "<p>Capacity is provisioned for the table but consumed <strong>per partition<\/strong>. DynamoDB splits data across physical partitions by the hash of the partition key, and each partition has hard physical limits - 3,000 read units and 1,000 write units per second, regardless of what the table is provisioned for. A hot key or a hot key range therefore throttles while the table total looks fine.<\/p><p><strong>Adaptive capacity<\/strong> mitigates this automatically: DynamoDB continuously reallocates the table&#x27;s provisioned throughput toward the partitions receiving traffic (instantly, since 2019), and it will <strong>isolate a frequently accessed item<\/strong> by splitting the partition. But it cannot exceed the per-partition physical limits, and it cannot help a <strong>single item<\/strong> that is hotter than 3,000 RCU - the classic &quot;one popular product&quot; or &quot;one tenant&#x27;s counter&quot; case.<\/p><p>What you actually change: <strong>write dispersion<\/strong> in the key. Add a suffix or shard to the partition key (<code>PRODUCT#123#7<\/code> across 10 shards, reading all 10 in parallel and merging); use a <strong>write-sharded counter<\/strong> for aggregates (Q113); cache the single hot item in DAX or the application so most reads never reach DynamoDB; or, for a read-hot item, exploit that eventually consistent reads cost half. And if the hot key is a <strong>time-based key<\/strong> (<code>DATE#2026-09-01<\/code>), the fix is to remove the time from the partition key, because it will always concentrate today&#x27;s traffic on one partition.<\/p>", "source": "answers.md", "search": "a dynamodb partition is throttling while total consumed capacity is well below provisioned. explain adaptive capacity and what you actually change. capacity is provisioned for the table but consumed per partition . dynamodb splits data across physical partitions by the hash of the partition key, and each partition has hard physical limits - 3,000 read units and 1,000 write units per second, regardless of what the table is provisioned for. a hot key or a hot key range therefore throttles while the table total looks fine. adaptive capacity mitigates this automatically: dynamodb continuously reallocates the table's provisioned throughput toward the partitions receiving traffic (instantly, since 2019), and it will isolate a frequently accessed item by splitting the partition. but it cannot exceed the per-partition physical limits, and it cannot help a single item that is hotter than 3,000 rcu - the classic \"one popular product\" or \"one tenant's counter\" case. what you actually change: write dispersion in the key. add a suffix or shard to the partition key (product 123 7 across 10 shards, reading all 10 in parallel and merging); use a write-sharded counter for aggregates (q113); cache the single hot item in dax or the application so most reads never reach dynamodb; or, for a read-hot item, exploit that eventually consistent reads cost half. and if the hot key is a time-based key (date 2026-09-01), the fix is to remove the time from the partition key, because it will always concentrate today's traffic on one partition."}, {"n": 208, "category": 11, "difficulty": "D", "html": "DynamoDB capacity: on-demand versus provisioned with auto-scaling. Where is the cost cliff, and how do you choose?", "answerTitle": "On-demand versus provisioned", "answer": "<p><strong>Provisioned<\/strong> charges for capacity reserved per hour whether you use it or not; <strong>on-demand<\/strong> charges per request at roughly <strong>6-7x<\/strong> the per-unit price of provisioned.<\/p><p>The break-even therefore sits around <strong>15-20 percent sustained utilization<\/strong>: if your average consumption is above that fraction of the peak you would have to provision, provisioned with auto-scaling is cheaper; below it, on-demand is. The cliff is sharp because it is a straight multiple - a steady, predictable workload on on-demand can cost five times what it should, and a spiky workload on provisioned either throttles at the peaks or wastes most of its reservation.<\/p><p>How I choose: <strong>on-demand<\/strong> for a new workload with unknown traffic, for genuinely spiky or event-driven traffic, and for dev/test where the baseline is near zero; <strong>provisioned with auto-scaling plus reserved capacity<\/strong> for a mature, steady workload with a known profile. The other consideration is that auto-scaling reacts in minutes, so it does not protect against a sudden spike - a workload with sharp, unpredictable bursts belongs on on-demand even if the average would favour provisioned. I would also note that on-demand tables now scale to double their previous peak instantly and beyond that with warming, so the throttling risk during a launch is much lower than with auto-scaling.<\/p>", "source": "answers.md", "search": "dynamodb capacity: on-demand versus provisioned with auto-scaling. where is the cost cliff, and how do you choose? provisioned charges for capacity reserved per hour whether you use it or not; on-demand charges per request at roughly 6-7x the per-unit price of provisioned. the break-even therefore sits around 15-20 percent sustained utilization : if your average consumption is above that fraction of the peak you would have to provision, provisioned with auto-scaling is cheaper; below it, on-demand is. the cliff is sharp because it is a straight multiple - a steady, predictable workload on on-demand can cost five times what it should, and a spiky workload on provisioned either throttles at the peaks or wastes most of its reservation. how i choose: on-demand for a new workload with unknown traffic, for genuinely spiky or event-driven traffic, and for dev/test where the baseline is near zero; provisioned with auto-scaling plus reserved capacity for a mature, steady workload with a known profile. the other consideration is that auto-scaling reacts in minutes, so it does not protect against a sudden spike - a workload with sharp, unpredictable bursts belongs on on-demand even if the average would favour provisioned. i would also note that on-demand tables now scale to double their previous peak instantly and beyond that with warming, so the throttling risk during a launch is much lower than with auto-scaling."}, {"n": 209, "category": 11, "difficulty": "D", "html": "DynamoDB transactions, conditional writes and optimistic concurrency. What is the item and size limit, and what does <code>TransactWriteItems<\/code> cost?", "answerTitle": "Transactions, conditional writes, optimistic concurrency", "answer": "<p><strong>Conditional writes<\/strong> (<code>ConditionExpression<\/code>) are the primitive: <code>PutItem<\/code> with <code>attribute_not_exists(PK)<\/code> gives you insert-if-absent, and <code>UpdateItem ... SET version = :new WHERE version = :old<\/code> gives optimistic locking (Q105) with a single request and no locks held. This is the mechanism to reach for by default - it costs the same as a normal write and fails with <code>ConditionalCheckFailedException<\/code>.<\/p><p><strong><code>TransactWriteItems<\/code><\/strong> provides ACID across up to <strong>100 items<\/strong> (and up to 4 MB) in one or more tables in one region, using a two-phase protocol internally. Costs: <strong>twice<\/strong> the write capacity units of the same writes done individually (prepare plus commit), higher latency, and <code>TransactionCanceledException<\/code> when any condition fails or when items conflict with another transaction - which the application must handle and retry. <code>TransactGetItems<\/code> similarly gives a consistent snapshot read at double the read cost.<\/p><p>Limits worth quoting: item size 400 KB, transaction 100 items / 4 MB, no cross-region transactions, and a transaction may not include two operations on the same item.<\/p><p>The design guidance is the same as MongoDB&#x27;s (Q198): model so that the common case is a single-item conditional write, and reserve transactions for the genuine cross-item invariant - reserving inventory while creating an order, or enforcing uniqueness by writing a <code>UNIQUE#email<\/code> sentinel item alongside the entity in one transaction, which is the standard DynamoDB uniqueness pattern.<\/p>", "source": "answers.md", "search": "dynamodb transactions, conditional writes and optimistic concurrency. what is the item and size limit, and what does transactwriteitems cost? conditional writes (conditionexpression) are the primitive: putitem with attribute_not_exists(pk) gives you insert-if-absent, and updateitem ... set version = :new where version = :old gives optimistic locking (q105) with a single request and no locks held. this is the mechanism to reach for by default - it costs the same as a normal write and fails with conditionalcheckfailedexception. transactwriteitems provides acid across up to 100 items (and up to 4 mb) in one or more tables in one region, using a two-phase protocol internally. costs: twice the write capacity units of the same writes done individually (prepare plus commit), higher latency, and transactioncanceledexception when any condition fails or when items conflict with another transaction - which the application must handle and retry. transactgetitems similarly gives a consistent snapshot read at double the read cost. limits worth quoting: item size 400 kb, transaction 100 items / 4 mb, no cross-region transactions, and a transaction may not include two operations on the same item. the design guidance is the same as mongodb's (q198): model so that the common case is a single-item conditional write, and reserve transactions for the genuine cross-item invariant - reserving inventory while creating an order, or enforcing uniqueness by writing a unique email sentinel item alongside the entity in one transaction, which is the standard dynamodb uniqueness pattern."}, {"n": 210, "category": 11, "difficulty": "D", "html": "DynamoDB Streams and TTL: the delivery guarantees, the deletion delay, and the pattern for archiving to S3.", "answerTitle": "Streams and TTL", "answer": "<p><strong>DynamoDB Streams<\/strong> is an ordered, 24-hour log of item-level changes, sharded to mirror the table&#x27;s partitions. Ordering is guaranteed <strong>per partition key<\/strong>, not globally. Delivery to a consumer (Lambda, or KCL) is <strong>at-least-once<\/strong>, so consumers must be idempotent, and a Lambda failure retries the whole batch by default - which means one poison record can block that shard until it expires unless you configure bisect-on-error, a maximum retry count and an on-failure destination. Stream view types let you receive <code>KEYS_ONLY<\/code>, <code>NEW_IMAGE<\/code>, <code>OLD_IMAGE<\/code> or <code>NEW_AND_OLD_IMAGES<\/code>, and the old image is what makes CDC-style consumers possible.<\/p><p><strong>TTL<\/strong> deletes items whose designated epoch-seconds attribute is in the past. The important operational facts: deletion is <strong>asynchronous and best-effort, typically within 48 hours<\/strong> of expiry - so expired items remain readable and must be filtered out by the application; the deletes consume no write capacity; and they <strong>do<\/strong> appear in the stream, flagged with <code>userIdentity.principalId = &quot;dynamodb.amazonaws.com&quot;<\/code>, which is what distinguishes an expiry from a real delete.<\/p><p>That combination gives the standard archive pattern: set a TTL on hot items, subscribe a Lambda to the stream, and on a TTL-originated <code>REMOVE<\/code> event write the old image to S3 (in Parquet, partitioned by date) for analytics and long-term retention. The result is a hot table that stays small and a cheap, queryable archive - with the caveat that you must handle at-least-once delivery, so the S3 write should be keyed deterministically.<\/p>", "source": "answers.md", "search": "dynamodb streams and ttl: the delivery guarantees, the deletion delay, and the pattern for archiving to s3. dynamodb streams is an ordered, 24-hour log of item-level changes, sharded to mirror the table's partitions. ordering is guaranteed per partition key , not globally. delivery to a consumer (lambda, or kcl) is at-least-once , so consumers must be idempotent, and a lambda failure retries the whole batch by default - which means one poison record can block that shard until it expires unless you configure bisect-on-error, a maximum retry count and an on-failure destination. stream view types let you receive keys_only, new_image, old_image or new_and_old_images, and the old image is what makes cdc-style consumers possible. ttl deletes items whose designated epoch-seconds attribute is in the past. the important operational facts: deletion is asynchronous and best-effort, typically within 48 hours of expiry - so expired items remain readable and must be filtered out by the application; the deletes consume no write capacity; and they do appear in the stream, flagged with useridentity.principalid = \"dynamodb.amazonaws.com\", which is what distinguishes an expiry from a real delete. that combination gives the standard archive pattern: set a ttl on hot items, subscribe a lambda to the stream, and on a ttl-originated remove event write the old image to s3 (in parquet, partitioned by date) for analytics and long-term retention. the result is a hot table that stays small and a cheap, queryable archive - with the caveat that you must handle at-least-once delivery, so the s3 write should be keyed deterministically."}, {"n": 211, "category": 11, "difficulty": "T", "html": "You need an aggregate (&quot;total orders per customer this month&quot;) in DynamoDB. Give three approaches and the consistency of each.", "answerTitle": "An aggregate in DynamoDB", "answer": "<p>Three approaches:<\/p><ol><li><strong>Compute on read<\/strong> - <code>Query<\/code> the item collection and sum client-side. <strong>Strongly consistent<\/strong> if you use a consistent read, correct, and needs no extra machinery. Costs read units proportional to the number of items, so it is fine for tens of items and unacceptable for tens of thousands - and it scales with the busiest customer, not the average.<\/li><li><strong>Maintain a counter item<\/strong> in the same transaction as the write: <code>TransactWriteItems<\/code> containing the new order and an <code>ADD total :1<\/code> on the aggregate item. <strong>Strongly consistent<\/strong> and read-cheap, at double write cost, a 100-item transaction limit, and contention on the counter item if the write rate is high (Q207 - shard the counter if so).<\/li><li><strong>Update it asynchronously from the stream<\/strong> - a Lambda consumes the change and increments the aggregate. <strong>Eventually consistent<\/strong> (typically sub-second, but unbounded during a consumer backlog), no impact on write latency, and it must be idempotent because delivery is at-least-once - which for a counter means either keeping a processed-sequence-number set or making the update a set-to-computed-value rather than an increment.<\/li><\/ol><p>Which I would choose depends on the read/write ratio and the consistency requirement, and I would say so: option 1 for small collections, option 2 when the number must be exact at read time and write volume is moderate, option 3 for high volume where &quot;within a second&quot; is acceptable. The meta-point worth making is that DynamoDB has no <code>GROUP BY<\/code> by design - aggregation is a <strong>write-time<\/strong> decision, and discovering you need one later is exactly the Q212 problem.<\/p>", "source": "answers.md", "search": "you need an aggregate (\"total orders per customer this month\") in dynamodb. give three approaches and the consistency of each. three approaches: 1. compute on read - query the item collection and sum client-side. strongly consistent if you use a consistent read, correct, and needs no extra machinery. costs read units proportional to the number of items, so it is fine for tens of items and unacceptable for tens of thousands - and it scales with the busiest customer, not the average. 2. maintain a counter item in the same transaction as the write: transactwriteitems containing the new order and an add total :1 on the aggregate item. strongly consistent and read-cheap, at double write cost, a 100-item transaction limit, and contention on the counter item if the write rate is high (q207 - shard the counter if so). 3. update it asynchronously from the stream - a lambda consumes the change and increments the aggregate. eventually consistent (typically sub-second, but unbounded during a consumer backlog), no impact on write latency, and it must be idempotent because delivery is at-least-once - which for a counter means either keeping a processed-sequence-number set or making the update a set-to-computed-value rather than an increment. which i would choose depends on the read/write ratio and the consistency requirement, and i would say so: option 1 for small collections, option 2 when the number must be exact at read time and write volume is moderate, option 3 for high volume where \"within a second\" is acceptable. the meta-point worth making is that dynamodb has no group by by design - aggregation is a write-time decision, and discovering you need one later is exactly the q212 problem."}, {"n": 212, "category": 11, "difficulty": "A", "html": "A team wants to replace PostgreSQL with DynamoDB for a system with reporting requirements and a changing access pattern. Make the case both ways and give your recommendation.", "answerTitle": "PostgreSQL to DynamoDB with reporting needs", "answer": "<p><strong>The case for DynamoDB.<\/strong> Predictable single-digit-millisecond latency at any scale, no instance to size or patch, no vacuum, no connection limits (which matters enormously for Lambda-based architectures), automatic multi-AZ durability, seamless scaling for spiky traffic, per-request pricing that goes to near zero when idle, and global tables if multi-region ever arrives. If the access patterns are genuinely key-based and high-volume, it removes an entire category of operational work.<\/p><p><strong>The case against, for this system specifically.<\/strong> Two of the stated facts are disqualifying on their own. <strong>Reporting requirements<\/strong> mean ad-hoc aggregation, and DynamoDB has none - every aggregate is a write-time design decision (Q211) or an export to Athena/Redshift, which means building and operating a second pipeline. <strong>A changing access pattern<\/strong> is the exact thing single-table design trades away: each new pattern is a new GSI (with its own capacity, cost and back-pressure risk, Q206) or a full table redesign plus backfill, and there is no <code>WHERE<\/code> clause to fall back on. Add the loss of joins, transactions across more than 100 items, constraints, and the ability for an analyst to answer a question without an engineer.<\/p><p><strong>My recommendation.<\/strong> Stay on PostgreSQL, and address whatever motivated the proposal directly - if it is operational burden, use a managed service (Aurora Serverless v2); if it is a scaling limit, get the actual numbers first, because a single instance handles far more than most teams assume (Q172); if it is one specific hot access pattern (session store, event ingestion, a per-user feed), move <strong>that<\/strong> to DynamoDB and keep the relational core, which is a far better trade than a wholesale migration.<\/p><p><strong>What would change my mind<\/strong>: access patterns that are stable and demonstrably key-based, a write rate or dataset size beyond a comfortable single-node envelope, a hard requirement for multi-region active-active, and a separate analytics path that already exists - in which case DynamoDB plus a stream to S3 and Athena is a coherent architecture rather than a gap.<\/p><p><em>Hook: a store-selection decision you made or reversed, and the access pattern that decided it.<\/em><\/p>", "source": "answers.md", "search": "a team wants to replace postgresql with dynamodb for a system with reporting requirements and a changing access pattern. make the case both ways and give your recommendation. the case for dynamodb. predictable single-digit-millisecond latency at any scale, no instance to size or patch, no vacuum, no connection limits (which matters enormously for lambda-based architectures), automatic multi-az durability, seamless scaling for spiky traffic, per-request pricing that goes to near zero when idle, and global tables if multi-region ever arrives. if the access patterns are genuinely key-based and high-volume, it removes an entire category of operational work. the case against, for this system specifically. two of the stated facts are disqualifying on their own. reporting requirements mean ad-hoc aggregation, and dynamodb has none - every aggregate is a write-time design decision (q211) or an export to athena/redshift, which means building and operating a second pipeline. a changing access pattern is the exact thing single-table design trades away: each new pattern is a new gsi (with its own capacity, cost and back-pressure risk, q206) or a full table redesign plus backfill, and there is no where clause to fall back on. add the loss of joins, transactions across more than 100 items, constraints, and the ability for an analyst to answer a question without an engineer. my recommendation. stay on postgresql, and address whatever motivated the proposal directly - if it is operational burden, use a managed service (aurora serverless v2); if it is a scaling limit, get the actual numbers first, because a single instance handles far more than most teams assume (q172); if it is one specific hot access pattern (session store, event ingestion, a per-user feed), move that to dynamodb and keep the relational core, which is a far better trade than a wholesale migration. what would change my mind : access patterns that are stable and demonstrably key-based, a write rate or dataset size beyond a comfortable single-node envelope, a hard requirement for multi-region active-active, and a separate analytics path that already exists - in which case dynamodb plus a stream to s3 and athena is a coherent architecture rather than a gap. hook: a store-selection decision you made or reversed, and the access pattern that decided it."}, {"n": 213, "category": 12, "difficulty": "C", "html": "OLTP versus OLAP: contrast the workload, the schema, the storage layout and the isolation requirement.", "answerTitle": "OLTP versus OLAP", "answer": "<table><thead><tr><th><\/th><th>OLTP<\/th><th>OLAP<\/th><\/tr><\/thead><tbody><tr><td>Workload<\/td><td>many small r
