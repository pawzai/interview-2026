n = 0<\/code> over a full cycle), redundant prefixes, duplicate definitions, bloat above a threshold, and foreign keys with no index. Reported to the owning team, not to a central backlog.<\/li><li><strong>A budget, not a ban<\/strong>: a soft cap (say six indexes per OLTP table) that requires a written justification to exceed, which makes the write cost visible in the conversation.<\/li><li><strong>Always <code>CONCURRENTLY<\/code> in production<\/strong>, always with the drop script attached.<\/li><\/ol><p>The cultural point is that indexes are the cheapest performance intervention and the easiest to accumulate; the policy exists to keep the <em>removal<\/em> path as easy as the addition path.<\/p><p><em>Hook: an index review that removed a third of a schema&#x27;s indexes and improved write latency.<\/em><\/p>", "source": "answers.md", "search": "what is your standing index policy for a team - who approves them, what evidence is required, and how do you prevent index sprawl? what i would put in place, in the order it earns its keep: 1. evidence required with the change. any new index arrives with the query, the explain (analyze, buffers) before, the expected plan after, and the estimated size. no evidence, no index. this alone stops most sprawl, because half of proposed indexes turn out to duplicate an existing one. 2. owned by the team that owns the table , reviewed by whoever is on call for that database - not by a central architecture board, which becomes a queue. 3. automated hygiene : a weekly report of unused indexes (idx_scan = 0 over a full cycle), redundant prefixes, duplicate definitions, bloat above a threshold, and foreign keys with no index. reported to the owning team, not to a central backlog. 4. a budget, not a ban : a soft cap (say six indexes per oltp table) that requires a written justification to exceed, which makes the write cost visible in the conversation. 5. always concurrently in production , always with the drop script attached. the cultural point is that indexes are the cheapest performance intervention and the easiest to accumulate; the policy exists to keep the removal path as easy as the addition path. hook: an index review that removed a third of a schema's indexes and improved write latency."}, {"n": 63, "category": 4, "difficulty": "C", "html": "Walk through the stages a SQL statement passes: parse, rewrite, plan, execute. What is cached at each stage in PostgreSQL versus Oracle?", "answerTitle": "Parse, rewrite, plan, execute", "answer": "<p><strong>Parse<\/strong> produces a syntax tree and resolves names against the catalog. <strong>Rewrite<\/strong> applies rules - view expansion, row-level security predicates. <strong>Plan<\/strong> enumerates access paths and join orders and picks the cheapest by estimated cost. <strong>Execute<\/strong> runs the plan tree, pulling tuples through the nodes.<\/p><p>Caching differs sharply. PostgreSQL has <strong>no shared plan cache<\/strong>: plans are cached per session in prepared statements (and by PL/pgSQL for its statements), so every connection plans independently and a pooler that reuses sessions changes the behavior (Q239). It caches <em>data<\/em> pages in <code>shared_buffers<\/code> but never query results.<\/p><p>Oracle has a <strong>shared pool<\/strong> with a library cache keyed by exact SQL text, so all sessions share one plan, and it adds bind-variable peeking, adaptive cursor sharing and SQL plan baselines on top. SQL Server likewise caches plans server-wide, which is the origin of parameter sniffing (Q72). The consequence: hard-parse cost is a real concern in Oracle and drives bind-variable discipline; in PostgreSQL the same discipline is about avoiding plan-cache misses per session and about SQL injection, not about a shared pool.<\/p>", "source": "answers.md", "search": "walk through the stages a sql statement passes: parse, rewrite, plan, execute. what is cached at each stage in postgresql versus oracle? parse produces a syntax tree and resolves names against the catalog. rewrite applies rules - view expansion, row-level security predicates. plan enumerates access paths and join orders and picks the cheapest by estimated cost. execute runs the plan tree, pulling tuples through the nodes. caching differs sharply. postgresql has no shared plan cache : plans are cached per session in prepared statements (and by pl/pgsql for its statements), so every connection plans independently and a pooler that reuses sessions changes the behavior (q239). it caches data pages in shared_buffers but never query results. oracle has a shared pool with a library cache keyed by exact sql text, so all sessions share one plan, and it adds bind-variable peeking, adaptive cursor sharing and sql plan baselines on top. sql server likewise caches plans server-wide, which is the origin of parameter sniffing (q72). the consequence: hard-parse cost is a real concern in oracle and drives bind-variable discipline; in postgresql the same discipline is about avoiding plan-cache misses per session and about sql injection, not about a shared pool."}, {"n": 64, "category": 4, "difficulty": "D", "html": "How does a cost-based optimizer choose a plan? Explain cost units, <code>seq_page_cost<\/code>, <code>random_page_cost<\/code> and why the default ratio is wrong on SSD.", "answerTitle": "Cost-based planning and the cost constants", "answer": "<p>The planner assigns each candidate path an abstract cost and picks the minimum. The unit is arbitrary: <code>seq_page_cost = 1.0<\/code> by definition, and everything else is relative to it - <code>random_page_cost = 4.0<\/code>, <code>cpu_tuple_cost = 0.01<\/code>, <code>cpu_index_tuple_cost = 0.005<\/code>, <code>cpu_operator_cost = 0.0025<\/code>.<\/p><p>Total cost is estimated rows times per-row CPU cost plus estimated page reads times the relevant page cost, propagated up the tree. <code>effective_cache_size<\/code> is not a memory allocation; it tells the planner how much of the table is <em>likely<\/em> already cached, which reduces the effective cost of an index scan.<\/p><p>The default 4:1 ratio encodes a spinning disk, where a random seek genuinely costs several times a sequential read. On SSD or cloud block storage the real ratio is closer to 1.1-2.0, and leaving it at 4.0 systematically biases the planner toward sequential scans - one of the highest-value single settings to change. I set <code>random_page_cost = 1.1<\/code> on NVMe and around 1.5-2.0 on network storage, and I set <code>effective_cache_size<\/code> to roughly 60-75 percent of system RAM.<\/p>", "source": "answers.md", "search": "how does a cost-based optimizer choose a plan? explain cost units, seq_page_cost, random_page_cost and why the default ratio is wrong on ssd. the planner assigns each candidate path an abstract cost and picks the minimum. the unit is arbitrary: seq_page_cost = 1.0 by definition, and everything else is relative to it - random_page_cost = 4.0, cpu_tuple_cost = 0.01, cpu_index_tuple_cost = 0.005, cpu_operator_cost = 0.0025. total cost is estimated rows times per-row cpu cost plus estimated page reads times the relevant page cost, propagated up the tree. effective_cache_size is not a memory allocation; it tells the planner how much of the table is likely already cached, which reduces the effective cost of an index scan. the default 4:1 ratio encodes a spinning disk, where a random seek genuinely costs several times a sequential read. on ssd or cloud block storage the real ratio is closer to 1.1-2.0, and leaving it at 4.0 systematically biases the planner toward sequential scans - one of the highest-value single settings to change. i set random_page_cost = 1.1 on nvme and around 1.5-2.0 on network storage, and i set effective_cache_size to roughly 60-75 percent of system ram."}, {"n": 65, "category": 4, "difficulty": "D", "html": "Reading <code>EXPLAIN (ANALYZE, BUFFERS)<\/code>: what do <code>cost<\/code>, <code>rows<\/code>, <code>actual time<\/code>, <code>loops<\/code>, <code>shared hit<\/code> and <code>read<\/code> each tell you, and in what order do you read them?", "answerTitle": "Reading `EXPLAIN (ANALYZE, BUFFERS)`", "answer": "<p>Fields: <code>cost=start..total<\/code> is the planner&#x27;s estimate in cost units (start cost is the work before the first row, which is why a sort&#x27;s start cost is high); <code>rows<\/code> is the estimate <strong>per loop<\/strong>; <code>actual time=start..total<\/code> is measured milliseconds <strong>per loop<\/strong>; <code>loops<\/code> is how many times the node ran, so total time is <code>actual time * loops<\/code>; <code>shared hit<\/code> is pages found in <code>shared_buffers<\/code> and <code>read<\/code> is pages fetched from the OS or disk.<\/p><p>How I read it, in order:<\/p><ol><li>Find the node where <code>rows<\/code> and <code>actual rows<\/code> diverge most, going <strong>bottom-up<\/strong> - the first bad estimate causes every wrong decision above it (Q66).<\/li><li>Multiply <code>actual time<\/code> by <code>loops<\/code> to find where the wall clock actually went; a node showing 0.03 ms with 400,000 loops is the problem, not the 20 ms sort.<\/li><li>Look at <code>read<\/code> versus <code>hit<\/code> to distinguish an IO problem from a CPU/row-volume problem.<\/li><li>Look for <code>Rows Removed by Filter<\/code>, which means work done and thrown away - usually a missing or mis-ordered index.<\/li><li>Check for spills: <code>Sort Method: external merge Disk: 240MB<\/code>, or <code>lossy<\/code> bitmap blocks (Q52).<\/li><\/ol><p>The point to make out loud: I tune the <em>first wrong estimate<\/em>, not the slowest node.<\/p>", "source": "answers.md", "search": "reading explain (analyze, buffers): what do cost, rows, actual time, loops, shared hit and read each tell you, and in what order do you read them? fields: cost=start..total is the planner's estimate in cost units (start cost is the work before the first row, which is why a sort's start cost is high); rows is the estimate per loop ; actual time=start..total is measured milliseconds per loop ; loops is how many times the node ran, so total time is actual time loops; shared hit is pages found in shared_buffers and read is pages fetched from the os or disk. how i read it, in order: 1. find the node where rows and actual rows diverge most, going bottom-up - the first bad estimate causes every wrong decision above it (q66). 2. multiply actual time by loops to find where the wall clock actually went; a node showing 0.03 ms with 400,000 loops is the problem, not the 20 ms sort. 3. look at read versus hit to distinguish an io problem from a cpu/row-volume problem. 4. look for rows removed by filter, which means work done and thrown away - usually a missing or mis-ordered index. 5. check for spills: sort method: external merge disk: 240mb, or lossy bitmap blocks (q52). the point to make out loud: i tune the first wrong estimate , not the slowest node."}, {"n": 66, "category": 4, "difficulty": "T", "html": "The plan says <code>rows=1<\/code> and <code>actual rows=4,200,000<\/code>. What is the first thing you check, and what are the four most common causes of a row-estimate error that large?", "answerTitle": "`rows=1` versus 4.2 million actual", "answer": "<p>First thing I check: when did <code>ANALYZE<\/code> last run on that table - <code>pg_stat_user_tables.last_autoanalyze<\/code> - and how many rows have changed since.<\/p><p>The four common causes of an error of that magnitude:<\/p><ol><li><strong>Stale or missing statistics<\/strong> after a bulk load, a restore, or a table growing fast enough that the autoanalyze threshold lags. A restored database with no <code>ANALYZE<\/code> is the classic.<\/li><li><strong>Correlated predicates.<\/strong> The planner multiplies selectivities as if independent, so <code>WHERE city = &#x27;Bengaluru&#x27; AND state = &#x27;Karnataka&#x27;<\/code> gets estimated as the product of two fractions when the second is implied by the first. Fixed with extended statistics (Q70).<\/li><li><strong>An expression or function the planner cannot see through<\/strong> - <code>WHERE lower(email) = ?<\/code> or a <code>STABLE<\/code> function in the predicate falls back to a hard-coded default selectivity (0.5 percent for equality). Fixed with an expression index or <code>CREATE STATISTICS<\/code> on the expression.<\/li><li><strong>Skew the statistics do not capture<\/strong> - <code>n_distinct<\/code> estimated badly on a large table (it is sampled, and it is wrong on scale-with-table columns), or a value that is not in the MCV list but is enormously common.<\/li><\/ol><p>Non-statistical causes worth naming: a join on a column with a non-uniform distribution, and estimates through a <code>LIMIT<\/code> inside a subquery. The action is the same either way - <code>ANALYZE<\/code>, then extended statistics or a <code>n_distinct<\/code> override, then reshaping the query if the estimate is structurally unknowable.<\/p>", "source": "answers.md", "search": "the plan says rows=1 and actual rows=4,200,000. what is the first thing you check, and what are the four most common causes of a row-estimate error that large? first thing i check: when did analyze last run on that table - pg_stat_user_tables.last_autoanalyze - and how many rows have changed since. the four common causes of an error of that magnitude: 1. stale or missing statistics after a bulk load, a restore, or a table growing fast enough that the autoanalyze threshold lags. a restored database with no analyze is the classic. 2. correlated predicates. the planner multiplies selectivities as if independent, so where city = 'bengaluru' and state = 'karnataka' gets estimated as the product of two fractions when the second is implied by the first. fixed with extended statistics (q70). 3. an expression or function the planner cannot see through - where lower(email) = ? or a stable function in the predicate falls back to a hard-coded default selectivity (0.5 percent for equality). fixed with an expression index or create statistics on the expression. 4. skew the statistics do not capture - n_distinct estimated badly on a large table (it is sampled, and it is wrong on scale-with-table columns), or a value that is not in the mcv list but is enormously common. non-statistical causes worth naming: a join on a column with a non-uniform distribution, and estimates through a limit inside a subquery. the action is the same either way - analyze, then extended statistics or a n_distinct override, then reshaping the query if the estimate is structurally unknowable."}, {"n": 67, "category": 4, "difficulty": "D", "html": "Nested loop, hash join and merge join. State the cost model, the memory behavior and the condition under which each wins.", "answerTitle": "Nested loop, hash join, merge join", "answer": "<table><thead><tr><th><\/th><th>Nested loop<\/th><th>Hash join<\/th><th>Merge join<\/th><\/tr><\/thead><tbody><tr><td>Cost model<\/td><td>outer rows x inner lookup<\/td><td>build side rows + probe side rows<\/td><td>sort both + one pass<\/td><\/tr><tr><td>Memory<\/td><td>negligible<\/td><td>hash table of the build side, <code>work_mem<\/code><\/td><td>sort buffers, <code>work_mem<\/code><\/td><\/tr><tr><td>Needs<\/td><td>an index on the inner side to be viable<\/td><td>equality join condition<\/td><td>both inputs sorted on the key<\/td><\/tr><tr><td>Wins when<\/td><td>outer side is small and inner has an index<\/td><td>one side fits in memory, no useful ordering<\/td><td>inputs already sorted, or output must be sorted<\/td><\/tr><tr><td>Fails when<\/td><td>outer side is large - cost is multiplicative<\/td><td>build side exceeds <code>work_mem<\/code>, spilling to batches<\/td><td>sorting is expensive and nothing needs the order<\/td><\/tr><\/tbody><\/table><p>Nested loop is the only one that supports non-equality joins and <code>LATERAL<\/code>. Hash join is the workhorse for large unordered joins, and its degradation mode is graceful but expensive (multi-batch spill to disk). Merge join is often chosen when both sides come from index scans in key order, which is free ordering.<\/p><p>The failure everyone has seen: a nested loop chosen because the outer estimate said 5 rows, executed 5 million times.<\/p>", "source": "answers.md", "search": "nested loop, hash join and merge join. state the cost model, the memory behavior and the condition under which each wins. nested loop hash join merge join --- --- --- --- cost model outer rows x inner lookup build side rows + probe side rows sort both + one pass memory negligible hash table of the build side, work_mem sort buffers, work_mem needs an index on the inner side to be viable equality join condition both inputs sorted on the key wins when outer side is small and inner has an index one side fits in memory, no useful ordering inputs already sorted, or output must be sorted fails when outer side is large - cost is multiplicative build side exceeds work_mem, spilling to batches sorting is expensive and nothing needs the order nested loop is the only one that supports non-equality joins and lateral. hash join is the workhorse for large unordered joins, and its degradation mode is graceful but expensive (multi-batch spill to disk). merge join is often chosen when both sides come from index scans in key order, which is free ordering. the failure everyone has seen: a nested loop chosen because the outer estimate said 5 rows, executed 5 million times."}, {"n": 68, "category": 4, "difficulty": "T", "html": "A nested loop over 2 million rows appears in the plan. Is that always wrong? Explain when it is optimal.", "answerTitle": "A nested loop over 2 million rows", "answer": "<p>Not always wrong. It is optimal when the inner side is a <strong>unique index lookup on a cached table<\/strong> - two million lookups into a small, fully cached dimension table is a few hundred nanoseconds each and beats building a hash table over a large outer relation. It is also the only option for a <code>LATERAL<\/code> or a non-equality join, and it is the right choice under <code>LIMIT<\/code>, where it can produce the first rows immediately while a hash join must build first.<\/p><p>What makes it wrong is the combination of a large outer side, an inner side that is <em>not<\/em> an index lookup (a nested loop over a sequential scan is quadratic), or an inner side too large to stay in cache so every probe is a random read.<\/p><p>So the diagnostic question is not &quot;is there a nested loop&quot; but &quot;what is <code>loops<\/code> times the per-loop cost, and was the outer row estimate right&quot;. If the outer estimate is right and the inner is an index probe on cached pages, leave it alone.<\/p>", "source": "answers.md", "search": "a nested loop over 2 million rows appears in the plan. is that always wrong? explain when it is optimal. not always wrong. it is optimal when the inner side is a unique index lookup on a cached table - two million lookups into a small, fully cached dimension table is a few hundred nanoseconds each and beats building a hash table over a large outer relation. it is also the only option for a lateral or a non-equality join, and it is the right choice under limit, where it can produce the first rows immediately while a hash join must build first. what makes it wrong is the combination of a large outer side, an inner side that is not an index lookup (a nested loop over a sequential scan is quadratic), or an inner side too large to stay in cache so every probe is a random read. so the diagnostic question is not \"is there a nested loop\" but \"what is loops times the per-loop cost, and was the outer row estimate right\". if the outer estimate is right and the inner is an index probe on cached pages, leave it alone."}, {"n": 69, "category": 4, "difficulty": "D", "html": "What statistics does the planner keep, how does <code>ANALYZE<\/code> collect them, and what is <code>default_statistics_target<\/code> actually controlling?", "answerTitle": "Planner statistics and `ANALYZE`", "answer": "<p>Per column, in <code>pg_statistic<\/code> (readable via <code>pg_stats<\/code>): the fraction of nulls, average width, <code>n_distinct<\/code>, a <strong>most-common-values<\/strong> list with their frequencies, a <strong>histogram<\/strong> of the remaining values, and the physical/logical <strong>correlation<\/strong>. Per table, in <code>pg_class<\/code>: <code>reltuples<\/code> and <code>relpages<\/code>.<\/p><p><code>ANALYZE<\/code> takes a <strong>random sample<\/strong> - by default 300 x <code>default_statistics_target<\/code> rows, so 30,000 rows at the default of 100 - and computes those structures from the sample. It is not a full scan, which is why it is cheap and why <code>n_distinct<\/code> on a huge table is often badly wrong.<\/p><p><code>default_statistics_target<\/code> controls both the sample size and the number of MCV/histogram entries. Raising it (per column, with <code>ALTER TABLE ... ALTER COLUMN ... SET STATISTICS 1000<\/code>) gives a finer histogram and a longer MCV list, which is the fix for a skewed column where a few values dominate. The cost is a longer <code>ANALYZE<\/code> and slightly slower planning. I raise it selectively on the columns that drive bad plans rather than globally.<\/p>", "source": "answers.md", "search": "what statistics does the planner keep, how does analyze collect them, and what is default_statistics_target actually controlling? per column, in pg_statistic (readable via pg_stats): the fraction of nulls, average width, n_distinct, a most-common-values list with their frequencies, a histogram of the remaining values, and the physical/logical correlation . per table, in pg_class: reltuples and relpages. analyze takes a random sample - by default 300 x default_statistics_target rows, so 30,000 rows at the default of 100 - and computes those structures from the sample. it is not a full scan, which is why it is cheap and why n_distinct on a huge table is often badly wrong. default_statistics_target controls both the sample size and the number of mcv/histogram entries. raising it (per column, with alter table ... alter column ... set statistics 1000) gives a finer histogram and a longer mcv list, which is the fix for a skewed column where a few values dominate. the cost is a longer analyze and slightly slower planning. i raise it selectively on the columns that drive bad plans rather than globally."}, {"n": 70, "category": 4, "difficulty": "D", "html": "Extended statistics (<code>CREATE STATISTICS<\/code>) for correlated columns. Give the query shape that needs them and the error they fix.", "answerTitle": "Extended statistics", "answer": "<p><code>CREATE STATISTICS<\/code> declares that a set of columns should be analyzed <strong>together<\/strong>, fixing the planner&#x27;s independence assumption. Three kinds: <code>ndistinct<\/code> (the number of distinct combinations, which fixes <code>GROUP BY<\/code> and join estimates), <code>dependencies<\/code> (functional dependency, which fixes equality predicates where one column implies another), and <code>mcv<\/code> (a multivariate most-common-values list, which handles skewed combinations and inequality predicates).<\/p><p>The query shape that needs it: two or more predicates on correlated columns of the same table.<\/p><pre><code class=\"lang-sql\">CREATE STATISTICS city_state (dependencies, mcv) ON city, state FROM addresses;\nANALYZE addresses;<\/code><\/pre><p>Without it, <code>WHERE city = &#x27;Bengaluru&#x27; AND state = &#x27;Karnataka&#x27;<\/code> is estimated as 0.001 x 0.03 of the table when the true selectivity is 0.001 - a 30x underestimate that turns a hash join into a nested loop. PostgreSQL 14+ also supports statistics on expressions, which fixes the function-in-predicate case from Q66.<\/p>", "source": "answers.md", "search": "extended statistics (create statistics) for correlated columns. give the query shape that needs them and the error they fix. create statistics declares that a set of columns should be analyzed together , fixing the planner's independence assumption. three kinds: ndistinct (the number of distinct combinations, which fixes group by and join estimates), dependencies (functional dependency, which fixes equality predicates where one column implies another), and mcv (a multivariate most-common-values list, which handles skewed combinations and inequality predicates). the query shape that needs it: two or more predicates on correlated columns of the same table. sql create statistics city_state (dependencies, mcv) on city, state from addresses; analyze addresses; without it, where city = 'bengaluru' and state = 'karnataka' is estimated as 0.001 x 0.03 of the table when the true selectivity is 0.001 - a 30x underestimate that turns a hash join into a nested loop. postgresql 14+ also supports statistics on expressions, which fixes the function-in-predicate case from q66."}, {"n": 71, "category": 4, "difficulty": "D", "html": "Histogram, most-common-values list and <code>n_distinct<\/code>. Which one fails first on a skewed column, and how do you fix a bad <code>n_distinct<\/code>?", "answerTitle": "Histogram, MCV and `n_distinct`", "answer": "<p>The <strong>MCV list<\/strong> holds the most frequent values with exact frequencies; the <strong>histogram<\/strong> divides the remaining values into equal-frequency buckets; <code>n_distinct<\/code> is the estimated number of distinct values (negative values mean &quot;a fraction of the table&quot;, which is how it expresses scale-with-table columns).<\/p><p><code>n_distinct<\/code> fails first on a skewed or large column, because it is extrapolated from a small sample and sampling cannot see distinctness reliably - a column with 10 million distinct values in a 500-million-row table can be estimated at 200,000. Everything downstream is then wrong: <code>GROUP BY<\/code> cardinality, join size, hash table sizing.<\/p><p>The fix is an override, which is one of the few &quot;hints&quot; PostgreSQL does offer:<\/p><pre><code class=\"lang-sql\">ALTER TABLE events ALTER COLUMN session_id SET (n_distinct = -0.3);\nANALYZE events;<\/code><\/pre><p>For skew where a few values dominate, raise the statistics target instead so those values land in the MCV list and get exact frequencies. The two problems look similar and have different fixes, which is worth saying explicitly.<\/p>", "source": "answers.md", "search": "histogram, most-common-values list and n_distinct. which one fails first on a skewed column, and how do you fix a bad n_distinct? the mcv list holds the most frequent values with exact frequencies; the histogram divides the remaining values into equal-frequency buckets; n_distinct is the estimated number of distinct values (negative values mean \"a fraction of the table\", which is how it expresses scale-with-table columns). n_distinct fails first on a skewed or large column, because it is extrapolated from a small sample and sampling cannot see distinctness reliably - a column with 10 million distinct values in a 500-million-row table can be estimated at 200,000. everything downstream is then wrong: group by cardinality, join size, hash table sizing. the fix is an override, which is one of the few \"hints\" postgresql does offer: sql alter table events alter column session_id set (n_distinct = -0.3); analyze events; for skew where a few values dominate, raise the statistics target instead so those values land in the mcv list and get exact frequencies. the two problems look similar and have different fixes, which is worth saying explicitly."}, {"n": 72, "category": 4, "difficulty": "T", "html": "Parameter sniffing (SQL Server) and generic versus custom plans (PostgreSQL prepared statements). Describe the failure and every available fix.", "answerTitle": "Parameter sniffing and generic plans", "answer": "<p><strong>SQL Server / Oracle<\/strong>: the plan is compiled on first execution using the <em>actual<\/em> parameter values (&quot;sniffed&quot;) and cached server-wide. If the first call passes an atypical value - a customer with three orders when most have three million, or vice versa - every later execution gets a plan tuned for the wrong distribution. Fixes: <code>OPTIMIZE FOR<\/code> a representative value or <code>OPTIMIZE FOR UNKNOWN<\/code>, <code>RECOMPILE<\/code> per execution, plan guides/baselines, splitting into separate procedures per shape, or Oracle&#x27;s adaptive cursor sharing which detects the problem and keeps multiple plans.<\/p><p><strong>PostgreSQL<\/strong>: a prepared statement is planned with the actual values for the first five executions (a <strong>custom plan<\/strong> each time), then it compares the average custom-plan cost with a <strong>generic plan<\/strong> cost, and if the generic plan is not more expensive it switches permanently. The failure is the mirror image: a query over a skewed column gets locked into a generic plan that is good on average and terrible for the values that matter. Fixes: <code>plan_cache_mode = force_custom_plan<\/code> (session or per-transaction), avoiding server-side prepared statements for that query, or using a literal.<\/p><p>The commonality worth stating: both engines are trading plan-compilation cost against plan quality, and the failure always happens on skewed data.<\/p>", "source": "answers.md", "search": "parameter sniffing (sql server) and generic versus custom plans (postgresql prepared statements). describe the failure and every available fix. sql server / oracle : the plan is compiled on first execution using the actual parameter values (\"sniffed\") and cached server-wide. if the first call passes an atypical value - a customer with three orders when most have three million, or vice versa - every later execution gets a plan tuned for the wrong distribution. fixes: optimize for a representative value or optimize for unknown, recompile per execution, plan guides/baselines, splitting into separate procedures per shape, or oracle's adaptive cursor sharing which detects the problem and keeps multiple plans. postgresql : a prepared statement is planned with the actual values for the first five executions (a custom plan each time), then it compares the average custom-plan cost with a generic plan cost, and if the generic plan is not more expensive it switches permanently. the failure is the mirror image: a query over a skewed column gets locked into a generic plan that is good on average and terrible for the values that matter. fixes: plan_cache_mode = force_custom_plan (session or per-transaction), avoiding server-side prepared statements for that query, or using a literal. the commonality worth stating: both engines are trading plan-compilation cost against plan quality, and the failure always happens on skewed data."}, {"n": 73, "category": 4, "difficulty": "D", "html": "Predicate pushdown, join reordering, subquery flattening and view merging. Which optimization does a CTE or a <code>LIMIT<\/code> block?", "answerTitle": "Transformations, and what blocks them", "answer": "<p><strong>Predicate pushdown<\/strong> moves a filter as close to the scan as possible so fewer rows are produced. <strong>Join reordering<\/strong> searches permutations of join order (exhaustively below <code>join_collapse_limit<\/code>, then greedily, and via GEQO above <code>geqo_threshold<\/code>). <strong>Subquery flattening<\/strong> and <strong>view merging<\/strong> pull a subquery or view into the outer query so its tables participate in the global join ordering.<\/p><p>What blocks them: a <strong>materialized CTE<\/strong> is an optimization fence in both directions (Q31); a subquery with <code>LIMIT<\/code>, <code>OFFSET<\/code>, <code>DISTINCT ON<\/code> or a window function cannot be flattened because the row set would change; an aggregate or <code>GROUP BY<\/code> blocks pushdown of predicates that reference the aggregate; a volatile function anywhere prevents reordering and caching; and <code>OFFSET 0<\/code> is the traditional deliberate fence.<\/p><p><code>LIMIT<\/code> is the interesting one: it does not block pushdown but it changes the cost model, because the planner optimizes for the <em>first<\/em> N rows and will happily choose a plan with a terrible total cost but a low start cost - which is why &quot;add <code>LIMIT 10<\/code> and it got slower&quot; happens.<\/p>", "source": "answers.md", "search": "predicate pushdown, join reordering, subquery flattening and view merging. which optimization does a cte or a limit block? predicate pushdown moves a filter as close to the scan as possible so fewer rows are produced. join reordering searches permutations of join order (exhaustively below join_collapse_limit, then greedily, and via geqo above geqo_threshold). subquery flattening and view merging pull a subquery or view into the outer query so its tables participate in the global join ordering. what blocks them: a materialized cte is an optimization fence in both directions (q31); a subquery with limit, offset, distinct on or a window function cannot be flattened because the row set would change; an aggregate or group by blocks pushdown of predicates that reference the aggregate; a volatile function anywhere prevents reordering and caching; and offset 0 is the traditional deliberate fence. limit is the interesting one: it does not block pushdown but it changes the cost model, because the planner optimizes for the first n rows and will happily choose a plan with a terrible total cost but a low start cost - which is why \"add limit 10 and it got slower\" happens."}, {"n": 74, "category": 4, "difficulty": "D", "html": "Why does a function in a <code>WHERE<\/code> clause defeat an index, and what do <code>IMMUTABLE<\/code>, <code>STABLE<\/code> and <code>VOLATILE<\/code> change about planning?", "answerTitle": "Functions in `WHERE`, and volatility", "answer": "<p>An index stores <code>f(column)<\/code> only if you built an expression index on exactly that expression; otherwise the planner cannot invert an arbitrary function, so <code>WHERE f(col) = ?<\/code> must evaluate <code>f<\/code> for every row - a sequential scan with a filter.<\/p><p>Volatility classes:<\/p><ul><li><strong><code>IMMUTABLE<\/code><\/strong> - same inputs always give the same result, forever (<code>lower<\/code>, arithmetic). Can be constant-folded at plan time, usable in expression indexes and in partial index predicates.<\/li><li><strong><code>STABLE<\/code><\/strong> - constant within a single statement, but may vary between statements (<code>now()<\/code>, anything reading the database, <code>current_setting<\/code>). Can be evaluated once per statement and used with an index scan as a <em>parameter<\/em>, but cannot be indexed.<\/li><li><strong><code>VOLATILE<\/code><\/strong> - may change per row (<code>random()<\/code>, <code>nextval<\/code>, anything with side effects). Evaluated per row, blocks many optimizations, and cannot be pushed into a scan safely.<\/li><\/ul><p>Two practical consequences: declaring a function <code>VOLATILE<\/code> when it is really <code>STABLE<\/code> (the default for a new function is <code>VOLATILE<\/code>) is a common, invisible performance bug; and a <code>STABLE<\/code> function in a predicate has no statistics, so the planner uses a default selectivity - which is a frequent cause of the Q66 estimate error.<\/p>", "source": "answers.md", "search": "why does a function in a where clause defeat an index, and what do immutable, stable and volatile change about planning? an index stores f(column) only if you built an expression index on exactly that expression; otherwise the planner cannot invert an arbitrary function, so where f(col) = ? must evaluate f for every row - a sequential scan with a filter. volatility classes: - immutable - same inputs always give the same result, forever (lower, arithmetic). can be constant-folded at plan time, usable in expression indexes and in partial index predicates. - stable - constant within a single statement, but may vary between statements (now(), anything reading the database, current_setting). can be evaluated once per statement and used with an index scan as a parameter , but cannot be indexed. - volatile - may change per row (random(), nextval, anything with side effects). evaluated per row, blocks many optimizations, and cannot be pushed into a scan safely. two practical consequences: declaring a function volatile when it is really stable (the default for a new function is volatile) is a common, invisible performance bug; and a stable function in a predicate has no statistics, so the planner uses a default selectivity - which is a frequent cause of the q66 estimate error."}, {"n": 75, "category": 4, "difficulty": "T", "html": "A query is fast with a literal and slow with a bind parameter. Explain both directions of this problem.", "answerTitle": "Literal fast, bind parameter slow - and the reverse", "answer": "<p><strong>Literal fast, bind slow<\/strong>: with a literal the planner knows the value and can consult the MCV list and histogram, choosing an index scan for a rare value. With a bind parameter under a generic plan it must use average selectivity, so a rare value gets a plan built for the common case (Q72). Also, a partial index whose predicate matches the literal cannot be proven to match a parameter (Q48), and <code>LIKE &#x27;abc%&#x27;<\/code> with a literal can be rewritten into a range while <code>LIKE ?<\/code> cannot be, unless the driver plans per execution.<\/p><p><strong>Bind fast, literal slow<\/strong>: on Oracle and SQL Server, literals produce a distinct SQL text per value, so every execution hard-parses, floods the shared pool with single-use cursors and burns CPU on parsing - the reason <code>CURSOR_SHARING<\/code> and bind discipline exist. There is also the security direction: literals mean string building, which means SQL injection.<\/p><p>The synthesis: use bind parameters as the default for correctness and parse cost, and make the exception explicit for the small number of queries over skewed columns where you need per-value planning - via <code>force_custom_plan<\/code>, or by not using a server-side prepared statement for that one query.<\/p>", "source": "answers.md", "search": "a query is fast with a literal and slow with a bind parameter. explain both directions of this problem. literal fast, bind slow : with a literal the planner knows the value and can consult the mcv list and histogram, choosing an index scan for a rare value. with a bind parameter under a generic plan it must use average selectivity, so a rare value gets a plan built for the common case (q72). also, a partial index whose predicate matches the literal cannot be proven to match a parameter (q48), and like 'abc%' with a literal can be rewritten into a range while like ? cannot be, unless the driver plans per execution. bind fast, literal slow : on oracle and sql server, literals produce a distinct sql text per value, so every execution hard-parses, floods the shared pool with single-use cursors and burns cpu on parsing - the reason cursor_sharing and bind discipline exist. there is also the security direction: literals mean string building, which means sql injection. the synthesis: use bind parameters as the default for correctness and parse cost, and make the exception explicit for the small number of queries over skewed columns where you need per-value planning - via force_custom_plan, or by not using a server-side prepared statement for that one query."}, {"n": 76, "category": 4, "difficulty": "D", "html": "<code>work_mem<\/code>: what uses it, what happens when a sort or hash exceeds it, and why setting it globally high is dangerous.", "answerTitle": "`work_mem`", "answer": "<p><code>work_mem<\/code> is the memory limit for <strong>each sort, hash table, hash aggregate, bitmap and materialize node<\/strong>, per node, per parallel worker - not per query and not per connection. A single query with three sorts and two hash joins running with four parallel workers can use many multiples of it.<\/p><p>When a sort exceeds it, PostgreSQL switches to an external merge sort, writing runs to temporary files (<code>Sort Method: external merge Disk: 512MB<\/code> in the plan). A hash join spills into multiple batches, rereading both sides. A hash aggregate before PostgreSQL 13 could not spill at all and simply exceeded the limit; from 13 it spills to disk, which is safer and can be a surprise regression.<\/p><p>Setting it globally high is dangerous precisely because of the multiplication: 256 MB with 200 connections and several nodes each is far more than the machine has, and the failure is the OOM killer taking down the postmaster. My approach is a modest global value (16-64 MB depending on the workload), raised per session or per transaction for known heavy reporting queries, plus <code>SET LOCAL<\/code> inside the transaction so it cannot leak into a pooled connection.<\/p>", "source": "answers.md", "search": "work_mem: what uses it, what happens when a sort or hash exceeds it, and why setting it globally high is dangerous. work_mem is the memory limit for each sort, hash table, hash aggregate, bitmap and materialize node , per node, per parallel worker - not per query and not per connection. a single query with three sorts and two hash joins running with four parallel workers can use many multiples of it. when a sort exceeds it, postgresql switches to an external merge sort, writing runs to temporary files (sort method: external merge disk: 512mb in the plan). a hash join spills into multiple batches, rereading both sides. a hash aggregate before postgresql 13 could not spill at all and simply exceeded the limit; from 13 it spills to disk, which is safer and can be a surprise regression. setting it globally high is dangerous precisely because of the multiplication: 256 mb with 200 connections and several nodes each is far more than the machine has, and the failure is the oom killer taking down the postmaster. my approach is a modest global value (16-64 mb depending on the workload), raised per session or per transaction for known heavy reporting queries, plus set local inside the transaction so it cannot leak into a pooled connection."}, {"n": 77, "category": 4, "difficulty": "D", "html": "Parallel query: when the planner chooses it, what a Gather node does, and why the speedup is sublinear.", "answerTitle": "Parallel query", "answer": "<p>The planner considers a parallel plan when the table is larger than <code>min_parallel_table_scan_size<\/code>, the query is not parallel-unsafe (no volatile functions writing data, no cursors, no <code>FOR UPDATE<\/code>), and the estimated cost is high enough that <code>parallel_setup_cost<\/code> and <code>parallel_tuple_cost<\/code> are worth paying. Worker count comes from the relation size, <code>max_parallel_workers_per_gather<\/code> and the global worker pool.<\/p><p>A <strong>Gather<\/strong> node collects tuples from the workers into the leader in arbitrary order; <strong>Gather Merge<\/strong> preserves sort order from workers that each produced sorted output. The leader also participates in the scan unless it is busy consuming.<\/p><p>Speedup is sublinear because of the fixed startup cost of forking workers and setting up shared memory, the tuple-transfer cost through the shared queue, the parts of the plan that cannot be parallelized (the final aggregate combine, anything above the Gather), and contention for IO bandwidth and the buffer pool - Amdahl&#x27;s law applied to a query. It also competes with concurrency: on an OLTP system with 200 active sessions, parallelism steals capacity from other queries, which is why I frequently reduce it on OLTP nodes and raise it on the reporting replica.<\/p>", "source": "answers.md", "search": "parallel query: when the planner chooses it, what a gather node does, and why the speedup is sublinear. the planner considers a parallel plan when the table is larger than min_parallel_table_scan_size, the query is not parallel-unsafe (no volatile functions writing data, no cursors, no for update), and the estimated cost is high enough that parallel_setup_cost and parallel_tuple_cost are worth paying. worker count comes from the relation size, max_parallel_workers_per_gather and the global worker pool. a gather node collects tuples from the workers into the leader in arbitrary order; gather merge preserves sort order from workers that each produced sorted output. the leader also participates in the scan unless it is busy consuming. speedup is sublinear because of the fixed startup cost of forking workers and setting up shared memory, the tuple-transfer cost through the shared queue, the parts of the plan that cannot be parallelized (the final aggregate combine, anything above the gather), and contention for io bandwidth and the buffer pool - amdahl's law applied to a query. it also competes with concurrency: on an oltp system with 200 active sessions, parallelism steals capacity from other queries, which is why i frequently reduce it on oltp nodes and raise it on the reporting replica."}, {"n": 78, "category": 4, "difficulty": "D", "html": "Plan regression after a data load or a version upgrade. How do you detect it, and what are your options for stabilizing a plan in PostgreSQL versus Oracle?", "answerTitle": "Plan regression", "answer": "<p>Detection: I want per-query latency tracked over time, which means <code>pg_stat_statements<\/code> snapshots (mean and total time per <code>queryid<\/code>) compared release over release and after any bulk load or upgrade, plus <code>auto_explain<\/code> with <code>log_min_duration<\/code> set so the actual plan of a slow execution is captured rather than reconstructed later. A regression shows as one <code>queryid<\/code> whose mean time steps up while its call count is flat.<\/p><p>Stabilizing in <strong>PostgreSQL<\/strong>: there is no plan baseline mechanism. The tools are: refresh or strengthen statistics (<code>ANALYZE<\/code>, statistics target, extended statistics), fix the cost constants, restructure the query so the good plan is the only cheap one (this is what &quot;tuning&quot; mostly means here), <code>pg_hint_plan<\/code> if you must, and in extreme cases disabling an operator for a session (<code>SET enable_nestloop = off<\/code>) as a <em>diagnostic<\/em> rather than a fix.<\/p><p><strong>Oracle<\/strong> has SQL Plan Management: capture baselines, and the optimizer will only use a new plan after it has been verified as faster, which makes upgrades far safer. SQL Server has the Query Store with forced plans and automatic plan-regression correction. Naming this difference honestly - PostgreSQL trades plan stability for simplicity - is a strong signal in an interview.<\/p>", "source": "answers.md", "search": "plan regression after a data load or a version upgrade. how do you detect it, and what are your options for stabilizing a plan in postgresql versus oracle? detection: i want per-query latency tracked over time, which means pg_stat_statements snapshots (mean and total time per queryid) compared release over release and after any bulk load or upgrade, plus auto_explain with log_min_duration set so the actual plan of a slow execution is captured rather than reconstructed later. a regression shows as one queryid whose mean time steps up while its call count is flat. stabilizing in postgresql : there is no plan baseline mechanism. the tools are: refresh or strengthen statistics (analyze, statistics target, extended statistics), fix the cost constants, restructure the query so the good plan is the only cheap one (this is what \"tuning\" mostly means here), pg_hint_plan if you must, and in extreme cases disabling an operator for a session (set enable_nestloop = off) as a diagnostic rather than a fix. oracle has sql plan management: capture baselines, and the optimizer will only use a new plan after it has been verified as faster, which makes upgrades far safer. sql server has the query store with forced plans and automatic plan-regression correction. naming this difference honestly - postgresql trades plan stability for simplicity - is a strong signal in an interview."}, {"n": 79, "category": 4, "difficulty": "D", "html": "Query hints: PostgreSQL deliberately has none. What do you do instead, and what does <code>pg_hint_plan<\/code> cost you?", "answerTitle": "No hints in PostgreSQL", "answer": "<p>The project&#x27;s position is that hints encode a decision made with today&#x27;s data and today&#x27;s statistics, and they silently become wrong; the supportable path is to fix the information the planner has.<\/p><p>So what I do instead, in order: <code>ANALYZE<\/code> and statistics targets; extended statistics for correlation; expression indexes so the predicate is visible; cost constants that match the hardware; rewriting the query (turning a correlated subquery into a join, adding a <code>LATERAL<\/code>, splitting an <code>OR<\/code>, materializing a CTE deliberately); and, when a query genuinely cannot be planned well, materializing an intermediate result into a temporary table with its own <code>ANALYZE<\/code>.<\/p><p><code>pg_hint_plan<\/code> exists and works, but it costs you: it is an extension that must be installed and upgraded in lockstep, hints are attached to query text so they break when the ORM changes whitespace, and they freeze a decision that nobody revisits. I would use it as a temporary stabilizer with a ticket to remove it, in the same spirit as <code>@Lazy<\/code> on a circular dependency.<\/p>", "source": "answers.md", "search": "query hints: postgresql deliberately has none. what do you do instead, and what does pg_hint_plan cost you? the project's position is that hints encode a decision made with today's data and today's statistics, and they silently become wrong; the supportable path is to fix the information the planner has. so what i do instead, in order: analyze and statistics targets; extended statistics for correlation; expression indexes so the predicate is visible; cost constants that match the hardware; rewriting the query (turning a correlated subquery into a join, adding a lateral, splitting an or, materializing a cte deliberately); and, when a query genuinely cannot be planned well, materializing an intermediate result into a temporary table with its own analyze. pg_hint_plan exists and works, but it costs you: it is an extension that must be installed and upgraded in lockstep, hints are attached to query text so they break when the orm changes whitespace, and they freeze a decision that nobody revisits. i would use it as a temporary stabilizer with a ticket to remove it, in the same spirit as @lazy on a circular dependency."}, {"n": 80, "category": 4, "difficulty": "T", "html": "A query is slow only in production. List the causes you would check in order, given the same data volume in staging.", "answerTitle": "Slow only in production", "answer": "<p>With the same data volume in staging, I check in this order, because it is cheapest-first and each step eliminates a class:<\/p><ol><li><strong>Concurrency.<\/strong> Staging runs the query alone; production runs it with 300 other sessions. Lock waits, buffer contention, IO saturation and CPU steal all appear only under load. Check <code>pg_stat_activity<\/code> wait events during a slow execution.<\/li><li><strong>Cache state.<\/strong> Production&#x27;s working set may not fit in <code>shared_buffers<\/code> while staging&#x27;s smaller total footprint does. Compare <code>shared hit<\/code> versus <code>read<\/code> in the plan.<\/li><li><strong>Statistics and plan.<\/strong> Get the <em>actual production plan<\/em> with <code>auto_explain<\/code>, not the staging plan. Different statistics, different <code>n_distinct<\/code>, different parameter values under a generic plan (Q72).<\/li><li><strong>Data distribution.<\/strong> Same row count is not the same distribution: production has one customer with 40 percent of the rows, staging has a uniform generator. This is the single most common cause I have seen.<\/li><li><strong>Configuration and hardware.<\/strong> <code>work_mem<\/code>, <code>random_page_cost<\/code>, parallel settings, instance class, storage IOPS credits and burst balance.<\/li><li><strong>Bloat and vacuum state.<\/strong> Production has been running for two years; staging was restored last week.<\/li><li><strong>The environment around it<\/strong> - a pooler in transaction mode, a read replica with lag, an ORM issuing a different statement, or a different driver version.<\/li><\/ol>", "source": "answers.md", "search": "a query is slow only in production. list the causes you would check in order, given the same data volume in staging. with the same data volume in staging, i check in this order, because it is cheapest-first and each step eliminates a class: 1. concurrency. staging runs the query alone; production runs it with 300 other sessions. lock waits, buffer contention, io saturation and cpu steal all appear only under load. check pg_stat_activity wait events during a slow execution. 2. cache state. production's working set may not fit in shared_buffers while staging's smaller total footprint does. compare shared hit versus read in the plan. 3. statistics and plan. get the actual production plan with auto_explain, not the staging plan. different statistics, different n_distinct, different parameter values under a generic plan (q72). 4. data distribution. same row count is not the same distribution: production has one customer with 40 percent of the rows, staging has a uniform generator. this is the single most common cause i have seen. 5. configuration and hardware. work_mem, random_page_cost, parallel settings, instance class, storage iops credits and burst balance. 6. bloat and vacuum state. production has been running for two years; staging was restored last week. 7. the environment around it - a pooler in transaction mode, a read replica with lag, an orm issuing a different statement, or a different driver version."}, {"n": 81, "category": 4, "difficulty": "A", "html": "A 200-line reporting query is at 90 seconds and the business wants 5. Give your full method, in order, and the point at which you stop tuning and change the architecture.", "answerTitle": "90 seconds to 5 on a reporting query", "answer": "<p>My method, in order:<\/p><ol><li><strong>Establish the requirement.<\/strong> Is 5 seconds a hard SLA, is the result needed live, and how fresh must it be? Half of these problems dissolve into &quot;this can be a materialized view refreshed every 10 minutes&quot;.<\/li><li><strong>Get the plan<\/strong> with <code>EXPLAIN (ANALYZE, BUFFERS)<\/code> and find the first badly wrong estimate and the node with the real wall clock (Q65).<\/li><li><strong>Cheap structural wins<\/strong>: statistics, an index that turns a scan into a seek, removing a function from a predicate, replacing <code>OFFSET<\/code> with keyset, eliminating a redundant <code>DISTINCT<\/code> that hides a join fan-out.<\/li><li><strong>Rewrite<\/strong>: push aggregation down before joining, replace correlated subqueries, use <code>FILTER<\/code> aggregates instead of repeated scans, split into a CTE that materializes a small intermediate result and <code>ANALYZE<\/code> a temp table if needed.<\/li><li><strong>Resource tuning<\/strong>: <code>work_mem<\/code> for this query, parallel workers, running it on a replica.<\/li><li><strong>Change the shape of the data<\/strong>: a covering index, a partial index for the reported subset, partitioning so the report prunes to one month, a materialized view or a summary table maintained incrementally.<\/li><\/ol><p><strong>Where I stop tuning and change the architecture<\/strong>: when the query must read a substantial fraction of a large fact table to produce its answer, no index can help because there is no selective predicate, and each iteration is buying 10-20 percent rather than a factor. At that point I am optimizing the wrong layer - the answer is a pre-aggregated model, a columnar store, or moving the workload off OLTP entirely (Q226). I would also stop if the business freshness requirement turns out to be &quot;this morning&quot;, because then the whole problem is a scheduled job.<\/p><p><em>Hook: a report you took from minutes to seconds, and the point at which you stopped tuning and changed the model.<\/em><\/p>", "source": "answers.md", "search": "a 200-line reporting query is at 90 seconds and the business wants 5. give your full method, in order, and the point at which you stop tuning and change the architecture. my method, in order: 1. establish the requirement. is 5 seconds a hard sla, is the result needed live, and how fresh must it be? half of these problems dissolve into \"this can be a materialized view refreshed every 10 minutes\". 2. get the plan with explain (analyze, buffers) and find the first badly wrong estimate and the node with the real wall clock (q65). 3. cheap structural wins : statistics, an index that turns a scan into a seek, removing a function from a predicate, replacing offset with keyset, eliminating a redundant distinct that hides a join fan-out. 4. rewrite : push aggregation down before joining, replace correlated subqueries, use filter aggregates instead of repeated scans, split into a cte that materializes a small intermediate result and analyze a temp table if needed. 5. resource tuning : work_mem for this query, parallel workers, running it on a replica. 6. change the shape of the data : a covering index, a partial index for the reported subset, partitioning so the report prunes to one month, a materialized view or a summary table maintained incrementally. where i stop tuning and change the architecture : when the query must read a substantial fraction of a large fact table to produce its answer, no index can help because there is no selective predicate, and each iteration is buying 10-20 percent rather than a factor. at that point i am optimizing the wrong layer - the answer is a pre-aggregated model, a columnar store, or moving the workload off oltp entirely (q226). i would also stop if the business freshness requirement turns out to be \"this morning\", because then the whole problem is a scheduled job. hook: a report you took from minutes to seconds, and the point at which you stopped tuning and changed the model."}, {"n": 82, "category": 5, "difficulty": "C", "html": "ACID, precisely. For each letter, name the mechanism in the engine that provides it.", "answerTitle": "ACID and the mechanism behind each letter", "answer": "<ul><li><strong>Atomicity<\/strong> - the write-ahead log plus the commit record. Either the commit record is durable and the transaction happened, or recovery undoes it. In PostgreSQL, undo is implicit: uncommitted tuple versions simply never become visible. In InnoDB and Oracle it is an explicit undo log.<\/li><li><strong>Consistency<\/strong> - constraints, triggers and foreign keys. This is the letter the database contributes least to: it means &quot;the transaction moves the database from one valid state to another&quot;, and the validity rules are yours.<\/li><li><strong>Isolation<\/strong> - MVCC snapshots plus locking. This is the letter with a dial on it, which is the whole of Q83.<\/li><li><strong>Durability<\/strong> - <code>fsync<\/code> of the WAL before <code>COMMIT<\/code> returns, plus checkpoints and (in a replicated setup) synchronous standbys.<\/li><\/ul><p>The sentence worth having ready: atomicity and durability are provided by the log, isolation by MVCC and locks, and consistency by you.<\/p>", "source": "answers.md", "search": "acid, precisely. for each letter, name the mechanism in the engine that provides it. - atomicity - the write-ahead log plus the commit record. either the commit record is durable and the transaction happened, or recovery undoes it. in postgresql, undo is implicit: uncommitted tuple versions simply never become visible. in innodb and oracle it is an explicit undo log. - consistency - constraints, triggers and foreign keys. this is the letter the database contributes least to: it means \"the transaction moves the database from one valid state to another\", and the validity rules are yours. - isolation - mvcc snapshots plus locking. this is the letter with a dial on it, which is the whole of q83. - durability - fsync of the wal before commit returns, plus checkpoints and (in a replicated setup) synchronous standbys. the sentence worth having ready: atomicity and durability are provided by the log, isolation by mvcc and locks, and consistency by you."}, {"n": 83, "category": 5, "difficulty": "D", "html": "The ANSI isolation levels and the anomalies they permit. Then explain what the ANSI table gets wrong.", "answerTitle": "ANSI isolation levels, and what the standard gets wrong", "answer": "<table><thead><tr><th>Level<\/th><th>Dirty read<\/th><th>Non-repeatable read<\/th><th>Phantom read<\/th><\/tr><\/thead><tbody><tr><td>Read Uncommitted<\/td><td>possible<\/td><td>possible<\/td><td>possible<\/td><\/tr><tr><td>Read Committed<\/td><td>no<\/td><td>possible<\/td><td>possible<\/td><\/tr><tr><td>Repeatable Read<\/td><td>no<\/td><td>no<\/td><td>possible<\/td><\/tr><tr><td>Serializable<\/td><td>no<\/td><td>no<\/td><td>no<\/td><\/tr><\/tbody><\/table><p>What the standard gets wrong:<\/p><ol><li><strong>It defines levels by which of three anomalies they forbid, and those three are not an exhaustive list.<\/strong> The best-known omission is <strong>write skew<\/strong> (Q84), which snapshot isolation permits while forbidding all three listed anomalies - so a database can be &quot;Repeatable Read&quot; and still corrupt data. Lost update and read skew are similarly absent.<\/li><li><strong>The definitions are phenomenon-based and were written around lock-based implementations.<\/strong> MVCC engines satisfy the letter of the definitions by completely different means, so the same level name means different things in different engines (Q87).<\/li><li><strong>Real engines do not implement what they claim.<\/strong> PostgreSQL&#x27;s Read Uncommitted behaves as Read Committed; PostgreSQL&#x27;s Repeatable Read is snapshot isolation; Oracle&#x27;s &quot;Serializable&quot; is also snapshot isolation and permits write skew.<\/li><\/ol><p>The correct mental model is Berenson et al&#x27;s &quot;A Critique of ANSI SQL Isolation Levels&quot;: think in terms of snapshot isolation versus true serializability, and know which one your engine gives you under each name.<\/p>", "source": "answers.md", "search": "the ansi isolation levels and the anomalies they permit. then explain what the ansi table gets wrong. level dirty read non-repeatable read phantom read --- --- --- --- read uncommitted possible possible possible read committed no possible possible repeatable read no no possible serializable no no no what the standard gets wrong: 1. it defines levels by which of three anomalies they forbid, and those three are not an exhaustive list. the best-known omission is write skew (q84), which snapshot isolation permits while forbidding all three listed anomalies - so a database can be \"repeatable read\" and still corrupt data. lost update and read skew are similarly absent. 2. the definitions are phenomenon-based and were written around lock-based implementations. mvcc engines satisfy the letter of the definitions by completely different means, so the same level name means different things in different engines (q87). 3. real engines do not implement what they claim. postgresql's read uncommitted behaves as read committed; postgresql's repeatable read is snapshot isolation; oracle's \"serializable\" is also snapshot isolation and permits write skew. the correct mental model is berenson et al's \"a critique of ansi sql isolation levels\": think in terms of snapshot isolation versus true serializability, and know which one your engine gives you under each name."}, {"n": 84, "category": 5, "difficulty": "D", "html": "Snapshot isolation: how it differs from serializable, and what write skew is. Give a concrete correctness bug.", "answerTitle": "Snapshot isolation and write skew", "answer": "<p>Under snapshot isolation, every transaction reads from a consistent snapshot taken at its start, and two concurrent transactions conflict only if they <strong>write the same row<\/strong> (first-updater-wins). Serializability requires the outcome to be equivalent to <em>some<\/em> serial order, which is a stronger claim.<\/p><p><strong>Write skew<\/strong> is the gap: two transactions read an overlapping set of rows, each makes a decision based on what it read, and each writes a <em>different<\/em> row. No write-write conflict occurs, so both commit, and the combined result violates an invariant that each transaction individually preserved.<\/p><p>Concrete bug, from a system I would describe as a booking application: the rule is that a meeting room may not be double-booked. Each transaction runs <code>SELECT count(*) FROM booking WHERE room = 7 AND during &amp;&amp; &#x27;[10:00,11:00)&#x27;<\/code>, sees zero, and inserts its own row. Two different rows are inserted, no conflict is detected, and the room is booked twice. The same pattern covers overdraft checks across two accounts, &quot;at least one of X must remain&quot;, and inventory reservations.<\/p>", "source": "answers.md", "search": "snapshot isolation: how it differs from serializable, and what write skew is. give a concrete correctness bug. under snapshot isolation, every transaction reads from a consistent snapshot taken at its start, and two concurrent transactions conflict only if they write the same row (first-updater-wins). serializability requires the outcome to be equivalent to some serial order, which is a stronger claim. write skew is the gap: two transactions read an overlapping set of rows, each makes a decision based on what it read, and each writes a different row. no write-write conflict occurs, so both commit, and the combined result violates an invariant that each transaction individually preserved. concrete bug, from a system i would describe as a booking application: the rule is that a meeting room may not be double-booked. each transaction runs select count( ) from booking where room = 7 and during && '[10:00,11:00)', sees zero, and inserts its own row. two different rows are inserted, no conflict is detected, and the room is booked twice. the same pattern covers overdraft checks across two accounts, \"at least one of x must remain\", and inventory reservations."}, {"n": 85, "category": 5, "difficulty": "T", "html": "Two doctors are on call; each checks &quot;at least one other on call&quot; and drops themselves, concurrently. Which isolation levels allow both to succeed, and give three fixes.", "answerTitle": "The on-call doctors", "answer": "<p>Both succeed under <strong>Read Committed<\/strong> and under <strong>snapshot isolation / Repeatable Read<\/strong> (PostgreSQL RR, Oracle &quot;Serializable&quot;, MySQL RR). Each transaction reads a snapshot showing two doctors on call, concludes it is safe to drop itself, and updates a <em>different<\/em> row - no write-write conflict, both commit, nobody is on call.<\/p><p>Three fixes:<\/p><ol><li><strong>True serializable isolation<\/strong> (PostgreSQL <code>SERIALIZABLE<\/code>, which is SSI). One transaction is aborted with a serialization failure and must be retried; the retry sees one doctor and refuses.<\/li><li><strong>Materialize the conflict / take an explicit lock.<\/strong> <code>SELECT ... FROM doctor WHERE shift_id = ? FOR UPDATE<\/code> locks all the rows you read, converting the invisible read-write conflict into a real lock conflict. This is the fix that works at any isolation level and is what I usually reach for.<\/li><li><strong>Model the invariant as a single row.<\/strong> Keep a <code>shift(on_call_count)<\/code> row and update it in the same transaction, or use a constraint the database can enforce - a <code>CHECK<\/code> on a counter column, or an <code>EXCLUDE<\/code> constraint for the overlapping-booking variant (Q12). Then the conflict is a write-write conflict and the engine handles it.<\/li><\/ol><p>The general principle: write skew happens because the thing you read is not the thing you wrote, so either make the engine track reads (SSI), lock what you read, or write what you read.<\/p>", "source": "answers.md", "search": "two doctors are on call; each checks \"at least one other on call\" and drops themselves, concurrently. which isolation levels allow both to succeed, and give three fixes. both succeed under read committed and under snapshot isolation / repeatable read (postgresql rr, oracle \"serializable\", mysql rr). each transaction reads a snapshot showing two doctors on call, concludes it is safe to drop itself, and updates a different row - no write-write conflict, both commit, nobody is on call. three fixes: 1. true serializable isolation (postgresql serializable, which is ssi). one transaction is aborted with a serialization failure and must be retried; the retry sees one doctor and refuses. 2. materialize the conflict / take an explicit lock. select ... from doctor where shift_id = ? for update locks all the rows you read, converting the invisible read-write conflict into a real lock conflict. this is the fix that works at any isolation level and is what i usually reach for. 3. model the invariant as a single row. keep a shift(on_call_count) row and update it in the same transaction, or use a constraint the database can enforce - a check on a counter column, or an exclude constraint for the overlapping-booking variant (q12). then the conflict is a write-write conflict and the engine handles it. the general principle: write skew happens because the thing you read is not the thing you wrote, so either make the engine track reads (ssi), lock what you read, or write what you read."}, {"n": 86, "category": 5, "difficulty": "D", "html": "PostgreSQL&#x27;s Serializable Snapshot Isolation: what it detects, what it costs, and what your application must handle.", "answerTitle": "PostgreSQL Serializable Snapshot Isolation", "answer": "<p>SSI runs snapshot isolation and additionally tracks read-write <strong>dependencies<\/strong> between concurrent transactions using predicate locks (SIREAD locks) at tuple, page or relation granularity. Serializability is violated only if there is a cycle in the dependency graph, and every such cycle contains a transaction with a &quot;dangerous structure&quot; - an incoming and an outgoing rw-dependency. When PostgreSQL detects that pattern, it aborts one transaction with <code>40001 could not serialize access<\/code>.<\/p><p>Costs: memory for the predicate locks (which escalate from tuple to page to relation as they grow, increasing false positives), tracking overhead on reads, <strong>false aborts<\/strong> - it is conservative, so some serializable schedules are rejected - and a throughput ceiling under high conflict. It also requires that read-only transactions participate (<code>DEFERRABLE<\/code> read-only transactions get an optimization), and it does not work across replicas.<\/p><p>What your application must handle: <strong>every<\/strong> transaction, including read-only ones, can fail with <code>40001<\/code> at commit time, and the only correct response is to retry the whole transaction from the beginning (Q103). That means transaction bodies must be side-effect free apart from database writes - no email sent, no message published mid-transaction.<\/p>", "source": "answers.md", "search": "postgresql's serializable snapshot isolation: what it detects, what it costs, and what your application must handle. ssi runs snapshot isolation and additionally tracks read-write dependencies between concurrent transactions using predicate locks (siread locks) at tuple, page or relation granularity. serializability is violated only if there is a cycle in the dependency graph, and every such cycle contains a transaction with a \"dangerous structure\" - an incoming and an outgoing rw-dependency. when postgresql detects that pattern, it aborts one transaction with 40001 could not serialize access. costs: memory for the predicate locks (which escalate from tuple to page to relation as they grow, increasing false positives), tracking overhead on reads, false aborts - it is conservative, so some serializable schedules are rejected - and a throughput ceiling under high conflict. it also requires that read-only transactions participate (deferrable read-only transactions get an optimization), and it does not work across replicas. what your application must handle: every transaction, including read-only ones, can fail with 40001 at commit time, and the only correct response is to retry the whole transaction from the beginning (q103). that means transaction bodies must be side-effect free apart from database writes - no email sent, no message published mid-transaction."}, {"n": 87, "category": 5, "difficulty": "T", "html": "PostgreSQL Repeatable Read and MySQL Repeatable Read are not the same thing. Give two behaviors that differ.", "answerTitle": "PostgreSQL RR versus MySQL RR", "answer": "<p>Two behaviors that differ:<\/p><ol><li><strong>Write conflicts.<\/strong> In PostgreSQL Repeatable Read, if your transaction tries to update a row that was updated and committed by a concurrent transaction after your snapshot, you get <code>ERROR: could not serialize access due to concurrent update<\/code> and must retry. In InnoDB Repeatable Read, the update succeeds: reads use the snapshot but writes see the <em>latest<\/em> committed row and lock it. That means InnoDB RR permits <strong>lost updates<\/strong> in read-modify-write patterns that PostgreSQL rejects.<\/li><li><strong>Phantoms.<\/strong> InnoDB uses <strong>next-key locking<\/strong> (gap locks, Q118) for locking reads, which prevents phantoms in a way the standard does not require at RR - so <code>SELECT ... FOR UPDATE<\/code> in InnoDB blocks inserts into the scanned range, while PostgreSQL RR allows the insert and simply does not show it to you.<\/li><\/ol><p>A third, worth mentioning: PostgreSQL RR takes its snapshot at the <strong>first statement<\/strong>, not at <code>BEGIN<\/code>, and InnoDB does the same for consistent reads - but Oracle&#x27;s read-only transactions and MySQL&#x27;s <code>START TRANSACTION WITH CONSISTENT SNAPSHOT<\/code> differ again.<\/p><p>The takeaway: &quot;we run at Repeatable Read&quot; tells you almost nothing portable, and code that relies on RR semantics does not survive an engine migration.<\/p>", "source": "answers.md", "search": "postgresql repeatable read and mysql repeatable read are not the same thing. give two behaviors that differ. two behaviors that differ: 1. write conflicts. in postgresql repeatable read, if your transaction tries to update a row that was updated and committed by a concurrent transaction after your snapshot, you get error: could not serialize access due to concurrent update and must retry. in innodb repeatable read, the update succeeds: reads use the snapshot but writes see the latest committed row and lock it. that means innodb rr permits lost updates in read-modify-write patterns that postgresql rejects. 2. phantoms. innodb uses next-key locking (gap locks, q118) for locking reads, which prevents phantoms in a way the standard does not require at rr - so select ... for update in innodb blocks inserts into the scanned range, while postgresql rr allows the insert and simply does not show it to you. a third, worth mentioning: postgresql rr takes its snapshot at the first statement , not at begin, and innodb does the same for consistent reads - but oracle's read-only transactions and mysql's start transaction with consistent snapshot differ again. the takeaway: \"we run at repeatable read\" tells you almost nothing portable, and code that relies on rr semantics does not survive an engine migration."}, {"n": 88, "category": 5, "difficulty": "D", "html": "Read Committed in PostgreSQL: what happens to an <code>UPDATE<\/code> that finds a row modified by a concurrent uncommitted transaction?", "answerTitle": "Read Committed and a concurrently updated row", "answer": "<p>In Read Committed each <strong>statement<\/strong> takes a fresh snapshot. If an <code>UPDATE ... WHERE<\/code> finds a row that a concurrent uncommitted transaction has modified, it blocks on that row&#x27;s lock. When the other transaction commits, PostgreSQL does not simply fail - it <strong>re-evaluates the <code>WHERE<\/code> clause against the new version<\/strong> of the row (an EvalPlanQual re-check). If the row still matches, the update proceeds on the new version; if it no longer matches, the row is silently skipped. If the other transaction rolled back, the update proceeds on the original version.<\/p><p>Two consequences to state. First, an <code>UPDATE ... WHERE status = &#x27;PENDING&#x27;<\/code> that blocks and then finds the row is now <code>&#x27;PAID&#x27;<\/code> updates <strong>nothing<\/strong> and reports zero rows - the application must check the row count, and most do not. Second, the statement is now working with a mix of snapshot times: the rows it selected came from the statement snapshot, but a re-checked row came from after another commit, which is exactly the inconsistency Q89 exploits.<\/p>", "source": "answers.md", "search": "read committed in postgresql: what happens to an update that finds a row modified by a concurrent uncommitted transaction? in read committed each statement takes a fresh snapshot. if an update ... where finds a row that a concurrent uncommitted transaction has modified, it blocks on that row's lock. when the other transaction commits, postgresql does not simply fail - it re-evaluates the where clause against the new version of the row (an evalplanqual re-check). if the row still matches, the update proceeds on the new version; if it no longer matches, the row is silently skipped. if the other transaction rolled back, the update proceeds on the original version. two consequences to state. first, an update ... where status = 'pending' that blocks and then finds the row is now 'paid' updates nothing and reports zero rows - the application must check the row count, and most do not. second, the statement is now working with a mix of snapshot times: the rows it selected came from the statement snapshot, but a re-checked row came from after another commit, which is exactly the inconsistency q89 exploits."}, {"n": 89, "category": 5, "difficulty": "T", "html": "Under Read Committed, a <code>SELECT<\/code> inside an <code>UPDATE ... WHERE<\/code> sees a different snapshot than the outer statement. Explain the lost-update scenario this creates.", "answerTitle": "Lost update under Read Committed", "answer": "<p>The pattern is read-modify-write across two statements:<\/p><pre><code class=\"lang-sql\">BEGIN;                                  -- T1                 -- T2\nSELECT balance FROM account WHERE id=1; -- reads 100\n                                        --                    SELECT balance -&gt; 100\n                                        --                    UPDATE ... SET balance = 100 - 30; COMMIT;\nUPDATE account SET balance = 100 - 50 WHERE id=1;  -- writes 50\nCOMMIT;                                 -- T2&#x27;s withdrawal is gone<\/code><\/pre><p>The <code>SELECT<\/code> read a value from a snapshot; the <code>UPDATE<\/code> wrote a value computed from that stale read. No error is raised because the row lock was only held for the instant of the update. Read Committed permits this by design; <strong>Repeatable Read in PostgreSQL would abort T1<\/strong> with a serialization error, and InnoDB RR would not (Q87).<\/p
