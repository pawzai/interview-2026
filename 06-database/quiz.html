><p>The three fixes, in the order I would apply them: (1) do the arithmetic <strong>in the statement<\/strong> - <code>UPDATE account SET balance = balance - 50 WHERE id = 1 AND balance &gt;= 50<\/code> - which takes the row lock and reads the current value atomically, and lets you check the affected row count; (2) <code>SELECT ... FOR UPDATE<\/code> before the read if you genuinely need application-side logic; (3) an optimistic version column with a retry loop (Q105).<\/p>", "source": "answers.md", "search": "under read committed, a select inside an update ... where sees a different snapshot than the outer statement. explain the lost-update scenario this creates. the pattern is read-modify-write across two statements: sql begin; -- t1 -- t2 select balance from account where id=1; -- reads 100 -- select balance - 100 -- update ... set balance = 100 - 30; commit; update account set balance = 100 - 50 where id=1; -- writes 50 commit; -- t2's withdrawal is gone the select read a value from a snapshot; the update wrote a value computed from that stale read. no error is raised because the row lock was only held for the instant of the update. read committed permits this by design; repeatable read in postgresql would abort t1 with a serialization error, and innodb rr would not (q87). the three fixes, in the order i would apply them: (1) do the arithmetic in the statement - update account set balance = balance - 50 where id = 1 and balance = 50 - which takes the row lock and reads the current value atomically, and lets you check the affected row count; (2) select ... for update before the read if you genuinely need application-side logic; (3) an optimistic version column with a retry loop (q105)."}, {"n": 90, "category": 5, "difficulty": "D", "html": "MVCC in PostgreSQL: <code>xmin<\/code>, <code>xmax<\/code>, tuple visibility, and why <code>UPDATE<\/code> is a delete plus an insert.", "answerTitle": "MVCC in PostgreSQL", "answer": "<p>Every tuple carries <code>xmin<\/code> (the transaction that created it) and <code>xmax<\/code> (the transaction that deleted or superseded it), plus infomask bits recording whether those transactions committed. A tuple is visible to a snapshot if <code>xmin<\/code> is committed and within the snapshot, and <code>xmax<\/code> is unset, aborted, or outside the snapshot. The snapshot itself is the set of transaction IDs in progress at the time it was taken.<\/p><p>Therefore <code>UPDATE<\/code> cannot modify in place: it writes a <strong>new tuple version<\/strong> with a new <code>xmin<\/code> and sets <code>xmax<\/code> on the old one. Readers of older snapshots continue to see the old version. The physical consequences are large: the table grows on update, indexes may need new entries pointing at the new tuple (unless HOT applies, Q130), and dead tuples accumulate until vacuum reclaims them.<\/p><p>The three sentences that answer half of Category 7: <strong>readers never block writers and writers never block readers<\/strong>, because they read different versions; the cost of that is space and vacuum; and vacuum&#x27;s ability to reclaim space is bounded by the oldest snapshot still running.<\/p>", "source": "answers.md", "search": "mvcc in postgresql: xmin, xmax, tuple visibility, and why update is a delete plus an insert. every tuple carries xmin (the transaction that created it) and xmax (the transaction that deleted or superseded it), plus infomask bits recording whether those transactions committed. a tuple is visible to a snapshot if xmin is committed and within the snapshot, and xmax is unset, aborted, or outside the snapshot. the snapshot itself is the set of transaction ids in progress at the time it was taken. therefore update cannot modify in place: it writes a new tuple version with a new xmin and sets xmax on the old one. readers of older snapshots continue to see the old version. the physical consequences are large: the table grows on update, indexes may need new entries pointing at the new tuple (unless hot applies, q130), and dead tuples accumulate until vacuum reclaims them. the three sentences that answer half of category 7: readers never block writers and writers never block readers , because they read different versions; the cost of that is space and vacuum; and vacuum's ability to reclaim space is bounded by the oldest snapshot still running."}, {"n": 91, "category": 5, "difficulty": "D", "html": "Contrast PostgreSQL MVCC with Oracle&#x27;s undo segments and InnoDB&#x27;s undo log. Which one gets &quot;snapshot too old&quot; and which gets bloat?", "answerTitle": "PostgreSQL versus Oracle undo versus InnoDB undo", "answer": "<p><strong>PostgreSQL<\/strong> keeps old versions in the table itself. Reads of old versions are cheap (they are right there), but the table bloats and vacuum is mandatory. There is no &quot;snapshot too old&quot; for normal operation, but a long transaction pins the xmin horizon and prevents cleanup, so the failure mode is <strong>unbounded bloat<\/strong>.<\/p><p><strong>Oracle<\/strong> keeps only the current version in the data block and reconstructs old versions from <strong>undo segments<\/strong>, applying undo records backwards. Reads of old versions cost extra work, undo space is a finite tablespace, and when it is recycled before a long query finishes you get <strong>ORA-01555 snapshot too old<\/strong>. No bloat, but long queries fail.<\/p><p><strong>InnoDB<\/strong> does the same with rollback segments and undo logs; long transactions grow the <strong>history list<\/strong>, purge falls behind, and secondary index entries accumulate - so it has a bit of both failure modes.<\/p><p>The trade summarised: PostgreSQL chose &quot;readers never fail, but you must vacuum&quot;; Oracle chose &quot;no bloat, but readers can fail&quot;. The operational discipline differs accordingly - PostgreSQL DBAs hunt long transactions to protect vacuum, Oracle DBAs size undo to protect long reports.<\/p>", "source": "answers.md", "search": "contrast postgresql mvcc with oracle's undo segments and innodb's undo log. which one gets \"snapshot too old\" and which gets bloat? postgresql keeps old versions in the table itself. reads of old versions are cheap (they are right there), but the table bloats and vacuum is mandatory. there is no \"snapshot too old\" for normal operation, but a long transaction pins the xmin horizon and prevents cleanup, so the failure mode is unbounded bloat . oracle keeps only the current version in the data block and reconstructs old versions from undo segments , applying undo records backwards. reads of old versions cost extra work, undo space is a finite tablespace, and when it is recycled before a long query finishes you get ora-01555 snapshot too old . no bloat, but long queries fail. innodb does the same with rollback segments and undo logs; long transactions grow the history list , purge falls behind, and secondary index entries accumulate - so it has a bit of both failure modes. the trade summarised: postgresql chose \"readers never fail, but you must vacuum\"; oracle chose \"no bloat, but readers can fail\". the operational discipline differs accordingly - postgresql dbas hunt long transactions to protect vacuum, oracle dbas size undo to protect long reports."}, {"n": 92, "category": 5, "difficulty": "D", "html": "Autovacuum: what it actually does, the three thresholds that trigger it, and how to tell it is losing.", "answerTitle": "Autovacuum", "answer": "<p>Autovacuum runs <code>VACUUM<\/code> and <code>ANALYZE<\/code> in the background. <code>VACUUM<\/code> removes dead tuples, marks space reusable in the free space map, updates the <strong>visibility map<\/strong> (which enables index-only scans, Q46), freezes old tuples to prevent wraparound (Q94), and truncates trailing empty pages.<\/p><p>The thresholds: vacuum triggers when dead tuples exceed <code>autovacuum_vacuum_threshold + autovacuum_vacuum_scale_factor * reltuples<\/code> (default 50 + 20 percent); analyze triggers similarly with <code>autovacuum_analyze_scale_factor<\/code> (10 percent); and an anti-wraparound vacuum is forced when table age exceeds <code>autovacuum_freeze_max_age<\/code>, which cannot be skipped. Work is rate-limited by <code>autovacuum_vacuum_cost_delay<\/code> and <code>cost_limit<\/code>, and parallelism by <code>autovacuum_max_workers<\/code>.<\/p><p>How to tell it is losing: <code>pg_stat_user_tables.n_dead_tup<\/code> growing steadily, <code>last_autovacuum<\/code> old on a busy table, table size growing while row count is flat, vacuum runs appearing in <code>pg_stat_progress_vacuum<\/code> for hours, and eventually <code>pg_class.relfrozenxid<\/code> age climbing toward the wraparound warnings. The default 20 percent scale factor is wrong for large tables - 20 percent of 500 million rows is 100 million dead tuples before it even starts - so I set per-table scale factors near zero with a fixed threshold on big hot tables, and raise <code>cost_limit<\/code> so vacuum is allowed to keep up.<\/p>", "source": "answers.md", "search": "autovacuum: what it actually does, the three thresholds that trigger it, and how to tell it is losing. autovacuum runs vacuum and analyze in the background. vacuum removes dead tuples, marks space reusable in the free space map, updates the visibility map (which enables index-only scans, q46), freezes old tuples to prevent wraparound (q94), and truncates trailing empty pages. the thresholds: vacuum triggers when dead tuples exceed autovacuum_vacuum_threshold + autovacuum_vacuum_scale_factor reltuples (default 50 + 20 percent); analyze triggers similarly with autovacuum_analyze_scale_factor (10 percent); and an anti-wraparound vacuum is forced when table age exceeds autovacuum_freeze_max_age, which cannot be skipped. work is rate-limited by autovacuum_vacuum_cost_delay and cost_limit, and parallelism by autovacuum_max_workers. how to tell it is losing: pg_stat_user_tables.n_dead_tup growing steadily, last_autovacuum old on a busy table, table size growing while row count is flat, vacuum runs appearing in pg_stat_progress_vacuum for hours, and eventually pg_class.relfrozenxid age climbing toward the wraparound warnings. the default 20 percent scale factor is wrong for large tables - 20 percent of 500 million rows is 100 million dead tuples before it even starts - so i set per-table scale factors near zero with a fixed threshold on big hot tables, and raise cost_limit so vacuum is allowed to keep up."}, {"n": 93, "category": 5, "difficulty": "T", "html": "A single idle-in-transaction session for six hours. Explain the chain of damage in precise terms.", "answerTitle": "Six hours idle in transaction", "answer": "<p>The chain, in order:<\/p><ol><li>The session holds an open snapshot, so the <strong>xmin horizon<\/strong> cannot advance.<\/li><li><code>VACUUM<\/code> may not remove any tuple version that could still be visible to that snapshot, so dead tuples accumulate in every table it touches - <strong>including tables the idle session never read<\/strong>, because the horizon is global.<\/li><li>Tables and indexes bloat. Pages hold fewer live rows, so every query reads more pages and the cache hit ratio falls. Queries across the whole database get slower.<\/li><li>The visibility map is not updated, so <strong>index-only scans degrade<\/strong> into heap fetches.<\/li><li>If the session holds any lock - even one taken by a completed statement - every conflicting operation queues behind it, and <code>ALTER TABLE<\/code> behind it blocks all subsequent readers (Q100).<\/li><li>Transaction ID age keeps climbing toward wraparound; the anti-wraparound vacuum cannot freeze rows newer than the horizon, so in the extreme you approach a forced shutdown (Q94).<\/li><li>On a replica with <code>hot_standby_feedback = on<\/code>, the same effect propagates to the <strong>primary<\/strong>.<\/li><\/ol><p>The defenses: <code>idle_in_transaction_session_timeout<\/code> (I set it to seconds, not minutes, on OLTP), monitoring on <code>max(now() - xact_start)<\/code> for active and idle-in-transaction sessions, and never opening a transaction before a network call (<code>02-spring<\/code> Q76).<\/p>", "source": "answers.md", "search": "a single idle-in-transaction session for six hours. explain the chain of damage in precise terms. the chain, in order: 1. the session holds an open snapshot, so the xmin horizon cannot advance. 2. vacuum may not remove any tuple version that could still be visible to that snapshot, so dead tuples accumulate in every table it touches - including tables the idle session never read , because the horizon is global. 3. tables and indexes bloat. pages hold fewer live rows, so every query reads more pages and the cache hit ratio falls. queries across the whole database get slower. 4. the visibility map is not updated, so index-only scans degrade into heap fetches. 5. if the session holds any lock - even one taken by a completed statement - every conflicting operation queues behind it, and alter table behind it blocks all subsequent readers (q100). 6. transaction id age keeps climbing toward wraparound; the anti-wraparound vacuum cannot freeze rows newer than the horizon, so in the extreme you approach a forced shutdown (q94). 7. on a replica with hot_standby_feedback = on, the same effect propagates to the primary . the defenses: idle_in_transaction_session_timeout (i set it to seconds, not minutes, on oltp), monitoring on max(now() - xact_start) for active and idle-in-transaction sessions, and never opening a transaction before a network call (02-spring q76)."}, {"n": 94, "category": 5, "difficulty": "D", "html": "Transaction ID wraparound: the mechanism, the warnings, and what the emergency procedure is.", "answerTitle": "Transaction ID wraparound", "answer": "<p>Transaction IDs are 32-bit and compared modulo 2^31, so any given transaction can only &quot;see&quot; 2 billion transactions into the past. Tuples must therefore be <strong>frozen<\/strong> - marked as visible to everyone - before their age reaches that limit, which is what vacuum&#x27;s freeze phase does.<\/p><p>The escalation: at <code>autovacuum_freeze_max_age<\/code> (default 200 million) an anti-wraparound autovacuum is launched on the table and cannot be cancelled by the usual means; at 40 million remaining PostgreSQL logs warnings on every commit; at 3 million it refuses new write transactions and stops the database to protect the data, requiring a single-user-mode vacuum. Modern versions handle much of this better, and PostgreSQL 14+ made anti-wraparound vacuums far less likely to be blocked, but the failure still occurs in the field.<\/p><p>The emergency procedure: find the oldest tables with <code>SELECT relname, age(relfrozenxid) FROM pg_class ORDER BY age DESC<\/code>, kill whatever is blocking cleanup (long transactions, abandoned replication slots, prepared transactions - all three pin the horizon), raise vacuum&#x27;s cost limit so it can actually finish, and run <code>VACUUM (FREEZE)<\/code> on the worst tables. The permanent fix is monitoring <code>age(relfrozenxid)<\/code> as a first-class alert, well below the warning threshold.<\/p>", "source": "answers.md", "search": "transaction id wraparound: the mechanism, the warnings, and what the emergency procedure is. transaction ids are 32-bit and compared modulo 2^31, so any given transaction can only \"see\" 2 billion transactions into the past. tuples must therefore be frozen - marked as visible to everyone - before their age reaches that limit, which is what vacuum's freeze phase does. the escalation: at autovacuum_freeze_max_age (default 200 million) an anti-wraparound autovacuum is launched on the table and cannot be cancelled by the usual means; at 40 million remaining postgresql logs warnings on every commit; at 3 million it refuses new write transactions and stops the database to protect the data, requiring a single-user-mode vacuum. modern versions handle much of this better, and postgresql 14+ made anti-wraparound vacuums far less likely to be blocked, but the failure still occurs in the field. the emergency procedure: find the oldest tables with select relname, age(relfrozenxid) from pg_class order by age desc, kill whatever is blocking cleanup (long transactions, abandoned replication slots, prepared transactions - all three pin the horizon), raise vacuum's cost limit so it can actually finish, and run vacuum (freeze) on the worst tables. the permanent fix is monitoring age(relfrozenxid) as a first-class alert, well below the warning threshold."}, {"n": 95, "category": 5, "difficulty": "D", "html": "<code>VACUUM<\/code> versus <code>VACUUM FULL<\/code> versus <code>pg_repack<\/code>. What locks does each take and when do you use which?", "answerTitle": "`VACUUM` versus `VACUUM FULL` versus `pg_repack`", "answer": "<ul><li><strong><code>VACUUM<\/code><\/strong> takes a <code>SHARE UPDATE EXCLUSIVE<\/code> lock - concurrent with reads and writes, conflicting only with DDL and other vacuums. It marks dead space reusable <em>within<\/em> the table but does not return it to the OS (except trailing empty pages). This is the routine operation and should be automatic.<\/li><li><strong><code>VACUUM FULL<\/code><\/strong> rewrites the entire table into a new file, reclaiming all space and rebuilding indexes, under <strong><code>ACCESS EXCLUSIVE<\/code><\/strong> - no reads, no writes, for the whole duration, and it needs disk space for a second copy. Maintenance windows only.<\/li><li><strong><code>pg_repack<\/code><\/strong> achieves the same compaction online: it builds a copy with triggers capturing concurrent changes, then swaps under a brief exclusive lock. It needs double the disk space, a superuser-ish role, and the swap moment can still block briefly, but for a bloated 500 GB table on a 24/7 system it is the practical answer.<\/li><\/ul><p>The decision: routine vacuum always; <code>pg_repack<\/code> when bloat has already happened on a table you cannot take offline; <code>VACUUM FULL<\/code> only when you have a window and no extension. And the real fix is always upstream - find out why vacuum fell behind (Q92, Q93).<\/p>", "source": "answers.md", "search": "vacuum versus vacuum full versus pg_repack. what locks does each take and when do you use which? - vacuum takes a share update exclusive lock - concurrent with reads and writes, conflicting only with ddl and other vacuums. it marks dead space reusable within the table but does not return it to the os (except trailing empty pages). this is the routine operation and should be automatic. - vacuum full rewrites the entire table into a new file, reclaiming all space and rebuilding indexes, under access exclusive - no reads, no writes, for the whole duration, and it needs disk space for a second copy. maintenance windows only. - pg_repack achieves the same compaction online: it builds a copy with triggers capturing concurrent changes, then swaps under a brief exclusive lock. it needs double the disk space, a superuser-ish role, and the swap moment can still block briefly, but for a bloated 500 gb table on a 24/7 system it is the practical answer. the decision: routine vacuum always; pg_repack when bloat has already happened on a table you cannot take offline; vacuum full only when you have a window and no extension. and the real fix is always upstream - find out why vacuum fell behind (q92, q93)."}, {"n": 96, "category": 5, "difficulty": "C", "html": "PostgreSQL table-level lock modes and the conflict matrix. Which everyday statements take <code>ACCESS EXCLUSIVE<\/code>?", "answerTitle": "Table lock modes and the conflict matrix", "answer": "<p>Eight modes, weakest to strongest: <code>ACCESS SHARE<\/code>, <code>ROW SHARE<\/code>, <code>ROW EXCLUSIVE<\/code>, <code>SHARE UPDATE EXCLUSIVE<\/code>, <code>SHARE<\/code>, <code>SHARE ROW EXCLUSIVE<\/code>, <code>EXCLUSIVE<\/code>, <code>ACCESS EXCLUSIVE<\/code>.<\/p><p>What everyday statements take:<\/p><table><thead><tr><th>Statement<\/th><th>Lock<\/th><\/tr><\/thead><tbody><tr><td><code>SELECT<\/code><\/td><td><code>ACCESS SHARE<\/code><\/td><\/tr><tr><td><code>SELECT FOR UPDATE/SHARE<\/code><\/td><td><code>ROW SHARE<\/code><\/td><\/tr><tr><td><code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code>, <code>MERGE<\/code><\/td><td><code>ROW EXCLUSIVE<\/code><\/td><\/tr><tr><td><code>VACUUM<\/code> (non-full), <code>ANALYZE<\/code>, <code>CREATE INDEX CONCURRENTLY<\/code><\/td><td><code>SHARE UPDATE EXCLUSIVE<\/code><\/td><\/tr><tr><td><code>CREATE INDEX<\/code> (non-concurrent)<\/td><td><code>SHARE<\/code><\/td><\/tr><tr><td><code>ALTER TABLE<\/code> (most forms), <code>DROP TABLE<\/code>, <code>TRUNCATE<\/code>, <code>REINDEX<\/code>, <code>VACUUM FULL<\/code>, <code>CLUSTER<\/code>, <code>REFRESH MATERIALIZED VIEW<\/code> (non-concurrent)<\/td><td><strong><code>ACCESS EXCLUSIVE<\/code><\/strong><\/td><\/tr><\/tbody><\/table><p>The rule to memorize: <code>ACCESS EXCLUSIVE<\/code> conflicts with <strong>everything, including plain <code>SELECT<\/code><\/strong>, and <code>ROW EXCLUSIVE<\/code> (ordinary DML) conflicts with <code>SHARE<\/code> and above but not with itself. That is why concurrent writers do not block each other at the table level, and why one <code>ALTER TABLE<\/code> stops the world (Q100).<\/p>", "source": "answers.md", "search": "postgresql table-level lock modes and the conflict matrix. which everyday statements take access exclusive? eight modes, weakest to strongest: access share, row share, row exclusive, share update exclusive, share, share row exclusive, exclusive, access exclusive. what everyday statements take: statement lock --- --- select access share select for update/share row share insert, update, delete, merge row exclusive vacuum (non-full), analyze, create index concurrently share update exclusive create index (non-concurrent) share alter table (most forms), drop table, truncate, reindex, vacuum full, cluster, refresh materialized view (non-concurrent) access exclusive the rule to memorize: access exclusive conflicts with everything, including plain select , and row exclusive (ordinary dml) conflicts with share and above but not with itself. that is why concurrent writers do not block each other at the table level, and why one alter table stops the world (q100)."}, {"n": 97, "category": 5, "difficulty": "D", "html": "Row locks, <code>FOR UPDATE<\/code>, <code>FOR NO KEY UPDATE<\/code>, <code>FOR SHARE<\/code>, <code>FOR KEY SHARE<\/code>. Which one does a foreign-key check take, and why does that matter?", "answerTitle": "Row lock modes", "answer": "<p>Four strengths, weakest to strongest: <code>FOR KEY SHARE<\/code>, <code>FOR SHARE<\/code>, <code>FOR NO KEY UPDATE<\/code>, <code>FOR UPDATE<\/code>.<\/p><ul><li><code>FOR UPDATE<\/code> - the strongest; blocks all other row locks and any update or delete.<\/li><li><code>FOR NO KEY UPDATE<\/code> - what a plain <code>UPDATE<\/code> that does not change any unique-key column acquires. It permits concurrent <code>FOR KEY SHARE<\/code>.<\/li><li><code>FOR SHARE<\/code> - a read lock; several transactions may hold it, blocks updates.<\/li><li><code>FOR KEY SHARE<\/code> - the weakest; only blocks changes to key columns and deletes.<\/li><\/ul><p><strong>A foreign key check takes <code>FOR KEY SHARE<\/code> on the parent row.<\/strong> That matters because it means inserting a child row does <em>not<\/em> block a concurrent non-key update of the parent (since PostgreSQL 9.3), which removed a huge source of contention on reference tables. But it <em>does<\/em> block a delete of the parent and any change to the parent&#x27;s key, and it does conflict with <code>SELECT ... FOR UPDATE<\/code> on the parent - so application code that pessimistically locks a parent row before inserting children serializes every child insert, which is a common self-inflicted throughput ceiling.<\/p>", "source": "answers.md", "search": "row locks, for update, for no key update, for share, for key share. which one does a foreign-key check take, and why does that matter? four strengths, weakest to strongest: for key share, for share, for no key update, for update. - for update - the strongest; blocks all other row locks and any update or delete. - for no key update - what a plain update that does not change any unique-key column acquires. it permits concurrent for key share. - for share - a read lock; several transactions may hold it, blocks updates. - for key share - the weakest; only blocks changes to key columns and deletes. a foreign key check takes for key share on the parent row. that matters because it means inserting a child row does not block a concurrent non-key update of the parent (since postgresql 9.3), which removed a huge source of contention on reference tables. but it does block a delete of the parent and any change to the parent's key, and it does conflict with select ... for update on the parent - so application code that pessimistically locks a parent row before inserting children serializes every child insert, which is a common self-inflicted throughput ceiling."}, {"n": 98, "category": 5, "difficulty": "D", "html": "Deadlocks: how the engine detects them, which transaction is chosen as victim, and the two canonical prevention techniques.", "answerTitle": "Deadlock detection and prevention", "answer": "<p>Detection: after a lock wait exceeds <code>deadlock_timeout<\/code> (default 1 second), the waiting process runs a check of the wait-for graph; if it finds a cycle, the <strong>transaction that detected it<\/strong> - that is, the one whose wait triggered the check - is aborted with <code>40P01<\/code>, and the others proceed. It is a timeout-triggered graph search, not continuous detection, which is why the deadlock timeout also acts as a throttle on the cost of checking. InnoDB maintains a wait-for graph continuously and picks the transaction with the least work done as victim.<\/p><p>The two canonical preventions:<\/p><ol><li><strong>Consistent lock ordering.<\/strong> Always acquire rows in a deterministic order - sort the IDs before updating a batch, always debit the lower account ID first. This eliminates the cycle by construction and is the fix that scales.<\/li><li><strong>Shorten and narrow the transaction.<\/strong> Fewer rows locked, held for less time, no external calls inside, no user think-time. Deadlock probability rises roughly with the square of transaction duration.<\/li><\/ol><p>Supporting techniques: <code>SELECT ... FOR UPDATE<\/code> upfront on all rows you will touch (take the locks at the start, in order, rather than escalating late), <code>NOWAIT<\/code>/<code>lock_timeout<\/code> to fail fast, and a retry loop for <code>40P01<\/code> since a deadlock victim&#x27;s work is always safe to retry.<\/p>", "source": "answers.md", "search": "deadlocks: how the engine detects them, which transaction is chosen as victim, and the two canonical prevention techniques. detection: after a lock wait exceeds deadlock_timeout (default 1 second), the waiting process runs a check of the wait-for graph; if it finds a cycle, the transaction that detected it - that is, the one whose wait triggered the check - is aborted with 40p01, and the others proceed. it is a timeout-triggered graph search, not continuous detection, which is why the deadlock timeout also acts as a throttle on the cost of checking. innodb maintains a wait-for graph continuously and picks the transaction with the least work done as victim. the two canonical preventions: 1. consistent lock ordering. always acquire rows in a deterministic order - sort the ids before updating a batch, always debit the lower account id first. this eliminates the cycle by construction and is the fix that scales. 2. shorten and narrow the transaction. fewer rows locked, held for less time, no external calls inside, no user think-time. deadlock probability rises roughly with the square of transaction duration. supporting techniques: select ... for update upfront on all rows you will touch (take the locks at the start, in order, rather than escalating late), nowait/lock_timeout to fail fast, and a retry loop for 40p01 since a deadlock victim's work is always safe to retry."}, {"n": 99, "category": 5, "difficulty": "T", "html": "A deadlock between two transactions that update the same rows in the same order. How is that possible?", "answerTitle": "Deadlock despite the same order", "answer": "<p>Several genuine mechanisms:<\/p><ol><li><strong>The statement&#x27;s own row order is not your order.<\/strong> <code>UPDATE t SET ... WHERE id IN (1,2,3)<\/code> locks rows in whatever order the <em>plan<\/em> produces - index order, heap order, or parallel worker order - which can differ between two sessions if they use different plans or different predicates. Two batch updates with overlapping sets deadlock even though both &quot;went in ascending order&quot;.<\/li><li><strong>Indexes and foreign keys add locks you did not write.<\/strong> An update touching a unique-key column locks index entries; a child insert takes <code>FOR KEY SHARE<\/code> on a parent (Q97); a cascade delete locks child rows. The cycle is between locks nobody named.<\/li><li><strong>Lock escalation across modes.<\/strong> Both transactions take a shared lock on the same row and then both try to upgrade to exclusive - a classic upgrade deadlock, which no ordering discipline prevents.<\/li><li><strong>InnoDB gap locks<\/strong> (Q118) create conflicts on ranges rather than rows, so two inserts of <em>different<\/em> keys can deadlock.<\/li><\/ol><p>The fixes: <code>ORDER BY id FOR UPDATE<\/code> in an explicit locking <code>SELECT<\/code> before the update (which forces the order), avoiding shared-then-exclusive upgrades by taking <code>FOR UPDATE<\/code> immediately, and reading the <code>deadlock<\/code> log entry, which prints both statements and the locks - it names the answer far faster than reasoning about it.<\/p>", "source": "answers.md", "search": "a deadlock between two transactions that update the same rows in the same order. how is that possible? several genuine mechanisms: 1. the statement's own row order is not your order. update t set ... where id in (1,2,3) locks rows in whatever order the plan produces - index order, heap order, or parallel worker order - which can differ between two sessions if they use different plans or different predicates. two batch updates with overlapping sets deadlock even though both \"went in ascending order\". 2. indexes and foreign keys add locks you did not write. an update touching a unique-key column locks index entries; a child insert takes for key share on a parent (q97); a cascade delete locks child rows. the cycle is between locks nobody named. 3. lock escalation across modes. both transactions take a shared lock on the same row and then both try to upgrade to exclusive - a classic upgrade deadlock, which no ordering discipline prevents. 4. innodb gap locks (q118) create conflicts on ranges rather than rows, so two inserts of different keys can deadlock. the fixes: order by id for update in an explicit locking select before the update (which forces the order), avoiding shared-then-exclusive upgrades by taking for update immediately, and reading the deadlock log entry, which prints both statements and the locks - it names the answer far faster than reasoning about it."}, {"n": 100, "category": 5, "difficulty": "D", "html": "Lock queues: why one blocked <code>ALTER TABLE<\/code> can block every subsequent <code>SELECT<\/code> on that table.", "answerTitle": "One blocked `ALTER TABLE` blocks everything", "answer": "<p><code>ALTER TABLE<\/code> requests <code>ACCESS EXCLUSIVE<\/code>. If a long-running <code>SELECT<\/code> holds <code>ACCESS SHARE<\/code>, the <code>ALTER<\/code> waits. Crucially, PostgreSQL&#x27;s lock manager is <strong>fair<\/strong>: a new lock request that conflicts with any <em>queued<\/em> request also waits, rather than jumping ahead. So every subsequent <code>SELECT<\/code> - which would happily have coexisted with the running one - now queues behind the <code>ALTER<\/code>.<\/p><p>The result is a full outage on that table caused by a DDL statement that would have taken a millisecond. Connections pile up, the pool exhausts, and the symptom presented to you is &quot;the application is down&quot;, not &quot;a migration is waiting&quot;.<\/p><p>The mitigation is a standard part of every migration I write:<\/p><pre><code class=\"lang-sql\">SET lock_timeout = &#x27;3s&#x27;;\nALTER TABLE ... ;   -- retry the whole thing on failure, with backoff<\/code><\/pre><p>so the migration gives up quickly instead of holding the queue open, and you retry until you catch a quiet moment. Complementary measures: kill or wait out long transactions before running DDL, avoid DDL during batch windows, and prefer the lock-free DDL forms (Q244).<\/p>", "source": "answers.md", "search": "lock queues: why one blocked alter table can block every subsequent select on that table. alter table requests access exclusive. if a long-running select holds access share, the alter waits. crucially, postgresql's lock manager is fair : a new lock request that conflicts with any queued request also waits, rather than jumping ahead. so every subsequent select - which would happily have coexisted with the running one - now queues behind the alter. the result is a full outage on that table caused by a ddl statement that would have taken a millisecond. connections pile up, the pool exhausts, and the symptom presented to you is \"the application is down\", not \"a migration is waiting\". the mitigation is a standard part of every migration i write: sql set lock_timeout = '3s'; alter table ... ; -- retry the whole thing on failure, with backoff so the migration gives up quickly instead of holding the queue open, and you retry until you catch a quiet moment. complementary measures: kill or wait out long transactions before running ddl, avoid ddl during batch windows, and prefer the lock-free ddl forms (q244)."}, {"n": 101, "category": 5, "difficulty": "D", "html": "<code>NOWAIT<\/code>, <code>SKIP LOCKED<\/code> and <code>lock_timeout<\/code>. Give the correct use of each.", "answerTitle": "`NOWAIT`, `SKIP LOCKED`, `lock_timeout`", "answer": "<ul><li><strong><code>NOWAIT<\/code><\/strong> - fail immediately with an error if the row is locked. Use it when the caller has something better to do and a wait is meaningless: an interactive &quot;edit this record&quot; where you want to tell the user instantly that someone else has it.<\/li><li><strong><code>SKIP LOCKED<\/code><\/strong> - silently omit locked rows from the result. Use it for work queues, where any unclaimed row will do (Q109). Never use it where you need a complete result set, because it changes the answer.<\/li><li><strong><code>lock_timeout<\/code><\/strong> - a session or transaction setting that bounds <em>any<\/em> lock wait. Use it defensively around DDL (Q100) and in any background job that must not become the head of a lock queue. <code>statement_timeout<\/code> is its blunter cousin, bounding the whole statement.<\/li><\/ul><p>The distinction to make: <code>NOWAIT<\/code> and <code>SKIP LOCKED<\/code> are per-statement semantics chosen by the query author; <code>lock_timeout<\/code> is an operational guardrail applied to code that did not ask for it.<\/p>", "source": "answers.md", "search": "nowait, skip locked and lock_timeout. give the correct use of each. - nowait - fail immediately with an error if the row is locked. use it when the caller has something better to do and a wait is meaningless: an interactive \"edit this record\" where you want to tell the user instantly that someone else has it. - skip locked - silently omit locked rows from the result. use it for work queues, where any unclaimed row will do (q109). never use it where you need a complete result set, because it changes the answer. - lock_timeout - a session or transaction setting that bounds any lock wait. use it defensively around ddl (q100) and in any background job that must not become the head of a lock queue. statement_timeout is its blunter cousin, bounding the whole statement. the distinction to make: nowait and skip locked are per-statement semantics chosen by the query author; lock_timeout is an operational guardrail applied to code that did not ask for it."}, {"n": 102, "category": 5, "difficulty": "D", "html": "Two-phase commit and XA: the protocol, the in-doubt transaction problem, and why you should avoid it in a microservice estate.", "answerTitle": "Two-phase commit and XA", "answer": "<p>The protocol: a coordinator asks each resource manager to <code>PREPARE<\/code>; each writes its changes durably and replies &quot;ready&quot;, after which it <strong>must<\/strong> be able to commit; when all are ready the coordinator writes its own commit decision and tells everyone to <code>COMMIT<\/code>. In PostgreSQL this is <code>PREPARE TRANSACTION<\/code> / <code>COMMIT PREPARED<\/code>.<\/p><p>The in-doubt problem: between prepare and the coordinator&#x27;s decision, a participant holds all its locks and cannot decide by itself. If the coordinator dies, the transaction stays prepared <strong>forever<\/strong> - locks held, rows unvacuumable, the xmin horizon pinned (Q93) - until a human resolves it. <code>max_prepared_transactions<\/code> defaults to zero in PostgreSQL for exactly this reason.<\/p><p>Why avoid it in a microservice estate: it makes availability the <em>product<\/em> of all participants&#x27; availability, it is a blocking protocol so a coordinator failure is an outage rather than a degradation, it holds locks across a network round trip so throughput collapses under contention, and most modern participants (Kafka, DynamoDB, HTTP APIs) do not support it at all. The alternative is the saga plus the transactional outbox plus consumer idempotency (<code>03-microservices<\/code> Q83, Q90) - eventual consistency with compensations, which is weaker but composable and non-blocking.<\/p>", "source": "answers.md", "search": "two-phase commit and xa: the protocol, the in-doubt transaction problem, and why you should avoid it in a microservice estate. the protocol: a coordinator asks each resource manager to prepare; each writes its changes durably and replies \"ready\", after which it must be able to commit; when all are ready the coordinator writes its own commit decision and tells everyone to commit. in postgresql this is prepare transaction / commit prepared. the in-doubt problem: between prepare and the coordinator's decision, a participant holds all its locks and cannot decide by itself. if the coordinator dies, the transaction stays prepared forever - locks held, rows unvacuumable, the xmin horizon pinned (q93) - until a human resolves it. max_prepared_transactions defaults to zero in postgresql for exactly this reason. why avoid it in a microservice estate: it makes availability the product of all participants' availability, it is a blocking protocol so a coordinator failure is an outage rather than a degradation, it holds locks across a network round trip so throughput collapses under contention, and most modern participants (kafka, dynamodb, http apis) do not support it at all. the alternative is the saga plus the transactional outbox plus consumer idempotency (03-microservices q83, q90) - eventual consistency with compensations, which is weaker but composable and non-blocking."}, {"n": 103, "category": 5, "difficulty": "T", "html": "Your application catches a serialization failure. What is the <em>only<\/em> correct response, and what must be true of the transaction for that response to be safe?", "answerTitle": "Handling a serialization failure", "answer": "<p>The only correct response is to <strong>retry the entire transaction from the beginning<\/strong>, with a small randomized backoff and a bounded attempt count. You may not retry a single statement, and you may not &quot;fix up&quot; the result - the transaction&#x27;s snapshot is dead, and the whole point is that its reads were invalidated.<\/p><p>For the retry to be safe, the transaction body must be <strong>idempotent from the application&#x27;s point of view<\/strong>, which in practice means: all its side effects are database writes inside the same transaction; it publishes messages via the outbox rather than directly; it does not send email, call a payment gateway or mutate in-memory state mid-transaction; and it re-reads everything it needs rather than reusing values fetched before the failed attempt.<\/p><p>That is a design constraint on the whole codebase, not an exception handler. The other half of the answer is which codes to catch: <code>40001<\/code> (serialization failure) and <code>40P01<\/code> (deadlock detected) are both retryable by definition. A unique violation is <em>not<\/em> automatically retryable - retrying blindly turns a race into a loop - and needs the idempotency-key treatment instead (Q114).<\/p>", "source": "answers.md", "search": "your application catches a serialization failure. what is the only correct response, and what must be true of the transaction for that response to be safe? the only correct response is to retry the entire transaction from the beginning , with a small randomized backoff and a bounded attempt count. you may not retry a single statement, and you may not \"fix up\" the result - the transaction's snapshot is dead, and the whole point is that its reads were invalidated. for the retry to be safe, the transaction body must be idempotent from the application's point of view , which in practice means: all its side effects are database writes inside the same transaction; it publishes messages via the outbox rather than directly; it does not send email, call a payment gateway or mutate in-memory state mid-transaction; and it re-reads everything it needs rather than reusing values fetched before the failed attempt. that is a design constraint on the whole codebase, not an exception handler. the other half of the answer is which codes to catch: 40001 (serialization failure) and 40p01 (deadlock detected) are both retryable by definition. a unique violation is not automatically retryable - retrying blindly turns a race into a loop - and needs the idempotency-key treatment instead (q114)."}, {"n": 104, "category": 5, "difficulty": "A", "html": "What isolation level do you set as the application default, and how do you handle the operations that need more?", "answerTitle": "Default isolation level", "answer": "<p>I default to <strong>Read Committed<\/strong> - the PostgreSQL, Oracle and SQL Server default - because it never fails with a serialization error, so every application path does not need a retry loop, and because the vast majority of operations are single-statement or genuinely independent.<\/p><p>Then I handle the operations that need more, in this order of preference:<\/p><ol><li><strong>Write the invariant into a single statement.<\/strong> <code>UPDATE ... SET balance = balance - ? WHERE id = ? AND balance &gt;= ?<\/code> and check the row count. No isolation change required, and it is the fastest.<\/li><li><strong>Let the database enforce it.<\/strong> A unique constraint, <code>EXCLUDE<\/code>, or a <code>CHECK<\/code> on a maintained counter turns the race into a constraint violation (Q12).<\/li><li><strong>Explicit locking.<\/strong> <code>SELECT ... FOR UPDATE<\/code> on the rows the decision depends on, in a consistent order (Q85, Q98).<\/li><li><strong>Repeatable Read<\/strong> for multi-statement reads that must be internally consistent - a report, an export, a balance reconciliation - where a retry on a write conflict is acceptable.<\/li><li><strong>Serializable<\/strong> for the small set of operations with genuine write skew risk where the invariant cannot be expressed as a constraint, accepting that these paths need the retry loop from Q103.<\/li><\/ol><p>The thing I would not do is set Serializable globally and hope the framework retries: throughput falls, false aborts appear in paths nobody has tested, and the retry logic is exactly the code that has never been exercised.<\/p><p><em>Hook: a race condition you fixed by moving the invariant into the database rather than raising the isolation level.<\/em><\/p>", "source": "answers.md", "search": "what isolation level do you set as the application default, and how do you handle the operations that need more? i default to read committed - the postgresql, oracle and sql server default - because it never fails with a serialization error, so every application path does not need a retry loop, and because the vast majority of operations are single-statement or genuinely independent. then i handle the operations that need more, in this order of preference: 1. write the invariant into a single statement. update ... set balance = balance - ? where id = ? and balance = ? and check the row count. no isolation change required, and it is the fastest. 2. let the database enforce it. a unique constraint, exclude, or a check on a maintained counter turns the race into a constraint violation (q12). 3. explicit locking. select ... for update on the rows the decision depends on, in a consistent order (q85, q98). 4. repeatable read for multi-statement reads that must be internally consistent - a report, an export, a balance reconciliation - where a retry on a write conflict is acceptable. 5. serializable for the small set of operations with genuine write skew risk where the invariant cannot be expressed as a constraint, accepting that these paths need the retry loop from q103. the thing i would not do is set serializable globally and hope the framework retries: throughput falls, false aborts appear in paths nobody has tested, and the retry logic is exactly the code that has never been exercised. hook: a race condition you fixed by moving the invariant into the database rather than raising the isolation level."}, {"n": 105, "category": 6, "difficulty": "D", "html": "Optimistic locking with a version column: the exact SQL, what the retry loop must look like, and where the pattern breaks.", "answerTitle": "Optimistic locking with a version column", "answer": "<pre><code class=\"lang-sql\">UPDATE order SET status = ?, version = version + 1\nWHERE  id = ? AND version = ?;\n-- 0 rows affected =&gt; someone else won<\/code><\/pre><p>The whole mechanism is in the <code>WHERE<\/code> clause plus the affected-row count. No lock is held between read and write, so readers never block; the conflict is detected at write time.<\/p><p>The retry loop must <strong>re-read the current state and re-apply the business decision<\/strong>, not just re-issue the same update with a new version - otherwise you have implemented last-write-wins with extra steps. It also needs a bounded attempt count, a small randomized delay, and an idempotent body for the same reasons as Q103.<\/p><p>Where the pattern breaks: (1) when conflicts are frequent, retries dominate and throughput collapses - past roughly 10-20 percent conflict rate, pessimistic locking is faster (Q108); (2) when the decision depends on rows <em>other<\/em> than the one you version - that is write skew again, and the version column on one row does not see it; (3) with batch updates, where one conflicting row fails the whole batch; (4) when the &quot;same&quot; logical entity is spread across several rows or tables, so a single version number does not represent it.<\/p>", "source": "answers.md", "search": "optimistic locking with a version column: the exact sql, what the retry loop must look like, and where the pattern breaks. sql update order set status = ?, version = version + 1 where id = ? and version = ?; -- 0 rows affected = someone else won the whole mechanism is in the where clause plus the affected-row count. no lock is held between read and write, so readers never block; the conflict is detected at write time. the retry loop must re-read the current state and re-apply the business decision , not just re-issue the same update with a new version - otherwise you have implemented last-write-wins with extra steps. it also needs a bounded attempt count, a small randomized delay, and an idempotent body for the same reasons as q103. where the pattern breaks: (1) when conflicts are frequent, retries dominate and throughput collapses - past roughly 10-20 percent conflict rate, pessimistic locking is faster (q108); (2) when the decision depends on rows other than the one you version - that is write skew again, and the version column on one row does not see it; (3) with batch updates, where one conflicting row fails the whole batch; (4) when the \"same\" logical entity is spread across several rows or tables, so a single version number does not represent it."}, {"n": 106, "category": 6, "difficulty": "T", "html": "Optimistic locking with a <code>updated_at<\/code> timestamp instead of a version counter. Give two ways this silently loses updates.", "answerTitle": "Timestamp instead of a version counter", "answer": "<p>Two concrete ways it loses updates:<\/p><ol><li><strong>Clock resolution and equality.<\/strong> If two updates fall in the same clock tick - and <code>now()<\/code> in PostgreSQL is the <em>transaction<\/em> start time, identical for everything in one transaction - the <code>WHERE updated_at = ?<\/code> predicate matches for both, and the second silently overwrites the first with no conflict detected. On systems where the timestamp is truncated to milliseconds, this happens constantly under load.<\/li><li><strong>Clock skew and non-monotonicity.<\/strong> If the timestamp is generated by the <em>application<\/em> rather than the database, two application servers with 50 ms of skew produce out-of-order timestamps; a &quot;newer&quot; write carries an older timestamp and is either rejected or, in a last-write-wins merge, discarded. NTP corrections can move a clock backwards. This is the same failure <code>03-microservices<\/code> Q69 describes for cross-region conflict resolution.<\/li><\/ol><p>A third, less obvious: <code>updated_at<\/code> is usually maintained by a trigger for auditing, and someone eventually writes a data-fix script that updates rows without touching it, which breaks the invariant silently.<\/p><p>An integer version counter has none of these properties - it is monotonic by construction and requires no clock. Use the timestamp for humans and the counter for concurrency.<\/p>", "source": "answers.md", "search": "optimistic locking with a updated_at timestamp instead of a version counter. give two ways this silently loses updates. two concrete ways it loses updates: 1. clock resolution and equality. if two updates fall in the same clock tick - and now() in postgresql is the transaction start time, identical for everything in one transaction - the where updated_at = ? predicate matches for both, and the second silently overwrites the first with no conflict detected. on systems where the timestamp is truncated to milliseconds, this happens constantly under load. 2. clock skew and non-monotonicity. if the timestamp is generated by the application rather than the database, two application servers with 50 ms of skew produce out-of-order timestamps; a \"newer\" write carries an older timestamp and is either rejected or, in a last-write-wins merge, discarded. ntp corrections can move a clock backwards. this is the same failure 03-microservices q69 describes for cross-region conflict resolution. a third, less obvious: updated_at is usually maintained by a trigger for auditing, and someone eventually writes a data-fix script that updates rows without touching it, which breaks the invariant silently. an integer version counter has none of these properties - it is monotonic by construction and requires no clock. use the timestamp for humans and the counter for concurrency."}, {"n": 107, "category": 6, "difficulty": "D", "html": "Pessimistic locking with <code>SELECT ... FOR UPDATE<\/code>: lock duration, ordering discipline, and the throughput ceiling it creates.", "answerTitle": "Pessimistic locking with `FOR UPDATE`", "answer": "<p><code>SELECT ... FOR UPDATE<\/code> takes an exclusive row lock immediately and holds it until the transaction ends. Other transactions attempting to lock or update the same row block (or fail with <code>NOWAIT<\/code>, or skip with <code>SKIP LOCKED<\/code>).<\/p><p>Three disciplines make it safe: lock for the <strong>shortest possible transaction<\/strong> (never across a user interaction or an HTTP call), acquire locks in a <strong>deterministic order<\/strong> (Q98), and lock <strong>at the start<\/strong> rather than upgrading a shared lock later.<\/p><p>The throughput ceiling is arithmetic: if a locked section takes <code>t<\/code> milliseconds and all requests contend on the same row, maximum throughput is <code>1000/t<\/code> per second regardless of hardware. A 20 ms critical section on one hot row caps you at 50 transactions per second, and adding application instances makes the queue longer rather than the system faster. That number - not a preference - is what decides between this and the alternatives (sharded counters, queueing, or restructuring so the contention disappears).<\/p>", "source": "answers.md", "search": "pessimistic locking with select ... for update: lock duration, ordering discipline, and the throughput ceiling it creates. select ... for update takes an exclusive row lock immediately and holds it until the transaction ends. other transactions attempting to lock or update the same row block (or fail with nowait, or skip with skip locked). three disciplines make it safe: lock for the shortest possible transaction (never across a user interaction or an http call), acquire locks in a deterministic order (q98), and lock at the start rather than upgrading a shared lock later. the throughput ceiling is arithmetic: if a locked section takes t milliseconds and all requests contend on the same row, maximum throughput is 1000/t per second regardless of hardware. a 20 ms critical section on one hot row caps you at 50 transactions per second, and adding application instances makes the queue longer rather than the system faster. that number - not a preference - is what decides between this and the alternatives (sharded counters, queueing, or restructuring so the contention disappears)."}, {"n": 108, "category": 6, "difficulty": "D", "html": "When do you choose pessimistic over optimistic? Give the contention arithmetic that decides it.", "answerTitle": "Choosing pessimistic over optimistic", "answer": "<p>The arithmetic: with optimistic locking, expected work per successful transaction is roughly <code>t / (1 - p)<\/code> where <code>p<\/code> is the conflict probability, because a proportion <code>p<\/code> of attempts is wasted and must be redone. Conflict probability rises with the number of concurrent writers to the same row and with transaction duration. Below a few percent conflict, optimistic is clearly better - no locks, no blocking, no deadlocks. Around 10-20 percent, the wasted work and the retry latency start to dominate and pessimistic wins, because a queue is more efficient than a collision.<\/p><p>The other inputs: how expensive the transaction body is (an expensive body makes wasted retries costly, favouring pessimistic), whether the user experience can tolerate &quot;someone else changed this, please review&quot; (favouring optimistic - it is often the <em>correct<\/em> UX for a human editing a record), and whether the work is user-facing (a retry adds latency) or a background job (a retry is free).<\/p><p>My default: optimistic for user-edited entities and low-contention rows, pessimistic for hot rows with short critical sections such as inventory decrements and queue claims, and neither where the operation can be expressed as a single conditional <code>UPDATE<\/code> (Q104).<\/p>", "source": "answers.md", "search": "when do you choose pessimistic over optimistic? give the contention arithmetic that decides it. the arithmetic: with optimistic locking, expected work per successful transaction is roughly t / (1 - p) where p is the conflict probability, because a proportion p of attempts is wasted and must be redone. conflict probability rises with the number of concurrent writers to the same row and with transaction duration. below a few percent conflict, optimistic is clearly better - no locks, no blocking, no deadlocks. around 10-20 percent, the wasted work and the retry latency start to dominate and pessimistic wins, because a queue is more efficient than a collision. the other inputs: how expensive the transaction body is (an expensive body makes wasted retries costly, favouring pessimistic), whether the user experience can tolerate \"someone else changed this, please review\" (favouring optimistic - it is often the correct ux for a human editing a record), and whether the work is user-facing (a retry adds latency) or a background job (a retry is free). my default: optimistic for user-edited entities and low-contention rows, pessimistic for hot rows with short critical sections such as inventory decrements and queue claims, and neither where the operation can be expressed as a single conditional update (q104)."}, {"n": 109, "category": 6, "difficulty": "D", "html": "Write the SQL for a work queue using <code>FOR UPDATE SKIP LOCKED<\/code>, including claim, visibility timeout and retry.", "answerTitle": "A work queue with `SKIP LOCKED`", "answer": "<pre><code class=\"lang-sql\">-- claim\nWITH claimed AS (\n  SELECT id FROM job\n  WHERE  state = &#x27;READY&#x27; AND run_after &lt;= now()\n  ORDER  BY priority DESC, run_after\n  FOR UPDATE SKIP LOCKED\n  LIMIT  10\n)\nUPDATE job j\nSET    state = &#x27;RUNNING&#x27;, locked_by = $worker, locked_until = now() + interval &#x27;5 minutes&#x27;,\n       attempts = attempts + 1\nFROM   claimed c WHERE j.id = c.id\nRETURNING j.*;<\/code><\/pre><p><code>SKIP LOCKED<\/code> is what makes this scale: each worker takes different rows instead of queueing behind the same one, so throughput grows with worker count.<\/p><p>The rest of the design: an index on <code>(state, run_after)<\/code> or a partial index <code>WHERE state = &#x27;READY&#x27;<\/code> so the scan is small; <code>locked_until<\/code> as the <strong>visibility timeout<\/strong>, with a reaper that returns rows whose lease has expired to <code>READY<\/code> (this handles a worker that crashed mid-job); <code>attempts<\/code> with a maximum, moving exhausted jobs to a <code>FAILED<\/code>/dead-letter state instead of looping forever; and <code>run_after = now() + backoff<\/code> on a retryable failure. Completion is a <code>DELETE<\/code> (with an archive if you need history), because leaving completed rows in the table destroys the index over time.<\/p>", "source": "answers.md", "search": "write the sql for a work queue using for update skip locked, including claim, visibility timeout and retry. sql -- claim with claimed as ( select id from job where state = 'ready' and run_after <= now() order by priority desc, run_after for update skip locked limit 10 ) update job j set state = 'running', locked_by = $worker, locked_until = now() + interval '5 minutes', attempts = attempts + 1 from claimed c where j.id = c.id returning j. ; skip locked is what makes this scale: each worker takes different rows instead of queueing behind the same one, so throughput grows with worker count. the rest of the design: an index on (state, run_after) or a partial index where state = 'ready' so the scan is small; locked_until as the visibility timeout , with a reaper that returns rows whose lease has expired to ready (this handles a worker that crashed mid-job); attempts with a maximum, moving exhausted jobs to a failed/dead-letter state instead of looping forever; and run_after = now() + backoff on a retryable failure. completion is a delete (with an archive if you need history), because leaving completed rows in the table destroys the index over time."}, {"n": 110, "category": 6, "difficulty": "T", "html": "Why is a database-backed queue often the right answer, and at what point does it stop being one? Be specific about the failure mode.", "answerTitle": "When a database queue stops being right", "answer": "<p>It is the right answer far more often than people think: you get transactional enqueue for free (the outbox problem disappears - Q116), exactly the durability and backup story you already have, SQL for inspection and manual intervention during an incident, no new infrastructure to run and secure, and easy correctness because claims are rows.<\/p><p>It stops being right at three specific points:<\/p><ol><li><strong>Throughput.<\/strong> Every claim is an <code>UPDATE<\/code>, which under MVCC means a new row version plus index churn plus WAL plus vacuum. Somewhere in the low thousands of jobs per second on a normal instance, the queue table&#x27;s vacuum load starts affecting the rest of the database - and the failure mode is not &quot;the queue is slow&quot;, it is &quot;the whole database is slow&quot;, which is what makes it dangerous.<\/li><li><strong>Fan-out and retention.<\/strong> Multiple independent consumer groups, replay of history, or long retention are Kafka&#x27;s job, not a table&#x27;s.<\/li><li><strong>Polling cost.<\/strong> Low-latency work needs frequent polling from many workers, and that polling load exists even when the queue is empty (<code>LISTEN<\/code>/<code>NOTIFY<\/code> mitigates this, Q117).<\/li><\/ol><p>The specific failure to name: bloat. A high-churn queue table with default autovacuum settings grows until the &quot;get next job&quot; query is scanning tens of thousands of dead tuples, latency climbs, workers poll harder, and it spirals. Aggressive per-table autovacuum settings are mandatory from day one.<\/p>", "source": "answers.md", "search": "why is a database-backed queue often the right answer, and at what point does it stop being one? be specific about the failure mode. it is the right answer far more often than people think: you get transactional enqueue for free (the outbox problem disappears - q116), exactly the durability and backup story you already have, sql for inspection and manual intervention during an incident, no new infrastructure to run and secure, and easy correctness because claims are rows. it stops being right at three specific points: 1. throughput. every claim is an update, which under mvcc means a new row version plus index churn plus wal plus vacuum. somewhere in the low thousands of jobs per second on a normal instance, the queue table's vacuum load starts affecting the rest of the database - and the failure mode is not \"the queue is slow\", it is \"the whole database is slow\", which is what makes it dangerous. 2. fan-out and retention. multiple independent consumer groups, replay of history, or long retention are kafka's job, not a table's. 3. polling cost. low-latency work needs frequent polling from many workers, and that polling load exists even when the queue is empty (listen/notify mitigates this, q117). the specific failure to name: bloat. a high-churn queue table with default autovacuum settings grows until the \"get next job\" query is scanning tens of thousands of dead tuples, latency climbs, workers poll harder, and it spirals. aggressive per-table autovacuum settings are mandatory from day one."}, {"n": 111, "category": 6, "difficulty": "D", "html": "PostgreSQL advisory locks: session versus transaction scope, and a real use for each. How do they differ from a row lock?", "answerTitle": "Advisory locks", "answer": "<p>Advisory locks are named locks (a 64-bit key, or two 32-bit keys) that the database tracks but attaches no meaning to. Nothing is locked in the data; the application agrees on the convention.<\/p><ul><li><strong>Session-scoped<\/strong> (<code>pg_advisory_lock<\/code>) is held until explicitly released or the session ends. Use it for a long-running singleton process - one migration runner, one leader (Q112) - where the lock must outlive individual transactions. The danger is that a leaked session holds it until the connection dies, and with a pooler you may not get the same session back.<\/li><li><strong>Transaction-scoped<\/strong> (<code>pg_advisory_xact_lock<\/code>) is released automatically at commit or rollback. This is the safe default and the one I use: it cannot leak, and it works correctly through a transaction-pooling proxy.<\/li><\/ul><p>Against a row lock: an advisory lock needs no row to exist (so you can serialize on a <em>future<\/em> key, such as &quot;creating the account for email X&quot;), it does not bloat the table with a row version, and it can protect a critical section that spans several tables. What it does not give you is any protection against code that ignores the convention - it is cooperative, so it belongs to a small number of well-documented critical sections rather than as a general concurrency mechanism.<\/p>", "source": "answers.md", "search": "postgresql advisory locks: session versus transaction scope, and a real use for each. how do they differ from a row lock? advisory locks are named locks (a 64-bit key, or two 32-bit keys) that the database tracks but attaches no meaning to. nothing is locked in the data; the application agrees on the convention. - session-scoped (pg_advisory_lock) is held until explicitly released or the session ends. use it for a long-running singleton process - one migration runner, one leader (q112) - where the lock must outlive individual transactions. the danger is that a leaked session holds it until the connection dies, and with a pooler you may not get the same session back. - transaction-scoped (pg_advisory_xact_lock) is released automatically at commit or rollback. this is the safe default and the one i use: it cannot leak, and it works correctly through a transaction-pooling proxy. against a row lock: an advisory lock needs no row to exist (so you can serialize on a future key, such as \"creating the account for email x\"), it does not bloat the table with a row version, and it can protect a critical section that spans several tables. what it does not give you is any protection against code that ignores the convention - it is cooperative, so it belongs to a small number of well-documented critical sections rather than as a general concurrency mechanism."}, {"n": 112, "category": 6, "difficulty": "D", "html": "Implementing a distributed leader election or a singleton scheduled job with only the database. Compare against ShedLock and ZooKeeper.", "answerTitle": "Leader election and singleton jobs with the database", "answer": "<p>Two workable patterns. <strong>Advisory lock<\/strong>: each instance tries <code>pg_try_advisory_lock(job_key)<\/code> at schedule time; exactly one succeeds and runs. Transaction-scoped if the job is short, session-scoped with a heartbeat if it is long. <strong>Lease row<\/strong>: a <code>lock<\/code> table with <code>(name, holder, expires_at)<\/code>, claimed with a conditional <code>UPDATE ... WHERE expires_at &lt; now()<\/code> and renewed by a heartbeat - which is exactly what ShedLock does.<\/p><p>Compared with the alternatives:<\/p><table><thead><tr><th><\/th><th>Database lock<\/th><th>ShedLock<\/th><th>ZooKeeper/etcd<\/th><\/tr><\/thead><tbody><tr><td>New infrastructure<\/td><td>none<\/td><td>none<\/td><td>a cluster to run<\/td><\/tr><tr><td>Failure detection<\/td><td>lease expiry (seconds)<\/td><td>lease expiry<\/td><td>session/ephemeral node (sub-second)<\/td><\/tr><tr><td>Fencing token<\/td><td>you must add it<\/td><td>no<\/td><td>yes, the zxid/revision<\/td><\/tr><tr><td>Correctness under GC pause<\/td><td>weak - the old leader may still be running<\/td><td>weak<\/td><td>still needs fencing at the resource<\/td><\/tr><\/tbody><\/table><p>The honest caveat for all of them: a lease tells you the <em>previous<\/em> holder&#x27;s lease expired, not that it stopped working. If the job has external side effects, a paused leader can wake up and act after another leader has started. Where that matters, the resource itself must reject stale writers using a fencing token; where it does not - most idempotent batch jobs - ShedLock or an advisory lock is completely adequate and vastly cheaper than a coordination cluster.<\/p>", "source": "answers.md", "search": "implementing a distributed leader election or a singleton scheduled job with only the database. compare against shedlock and zookeeper. two workable patterns. advisory lock : each instance tries pg_try_advisory_lock(job_key) at schedule time; exactly one succeeds and runs. transaction-scoped if the job is short, session-scoped with a heartbeat if it is long. lease row : a lock table with (name, holder, expires_at), claimed with a conditional update ... where expires_at < now() and renewed by a heartbeat - which is exactly what shedlock does. compared with the alternatives: database lock shedlock zookeeper/etcd --- --- --- --- new infrastructure none none a cluster to run failure detection lease expiry (seconds) lease expiry session/ephemeral node (sub-second) fencing token you must add it no yes, the zxid/revision correctness under gc pause weak - the old leader may still be running weak still needs fencing at the resource the honest caveat for all of them: a lease tells you the previous holder's lease expired, not that it stopped working. if the job has external side effects, a paused leader can wake up and act after another leader has started. where that matters, the resource itself must reject stale writers using a fencing token; where it does not - most idempotent batch jobs - shedlock or an advisory lock is completely adequate and vastly cheaper than a coordination cluster."}, {"n": 113, "category": 6, "difficulty": "D", "html": "Counters at high contention: row lock, <code>UPDATE ... SET n = n + 1<\/code>, sharded counters, and an approximate counter. Compare throughput and correctness.", "answerTitle": "High-contention counters", "answer": "<table><thead><tr><th>Approach<\/th><th>Throughput<\/th><th>Correctness<\/th><\/tr><\/thead><tbody><tr><td><code>SELECT ... FOR UPDATE<\/code> then update<\/td><td>worst - two round trips inside the lock<\/td><td>exact<\/td><\/tr><tr><td><code>UPDATE t SET n = n + 1<\/code><\/td><td>better - lock held for the statement only<\/td><td>exact<\/td><\/tr><tr><td>Sharded counter: N rows, random shard, <code>SUM<\/code> to read<\/td><td>N times better<\/td><td>exact, reads cost a sum<\/td><\/tr><tr><td>Approximate: sample, or HyperLogLog in Redis<\/td><td>unbounded<\/td><td>approximate<\/td><\/tr><\/tbody><\/table><p>The mechanism behind the ceiling is that all writers serialize on one row&#x27;s lock, and each update also writes a new tuple version, so the row&#x27;s page becomes a bloat hotspot as well as a lock hotspot.<\/p><p>The sharded counter is the standard fix: insert into or update one of N rows chosen at random (<code>shard_id = hash(random()) % 64<\/code>), and read with <code>SELECT sum(n)<\/code>. Writes scale roughly linearly with N; reads cost an aggregate over N rows, which is trivial. A variant that suits high-write, low-read cases better is <strong>append-only<\/strong>: insert a row per event and roll up periodically into a summary row, which turns lock contention into pure appends at the cost of a maintenance job.<\/p><p>I would also ask whether the counter needs to be transactional at all. View counts, likes and rate limiters usually belong in Redis (Q188); order totals and account balances belong in the database with exact semantics.<\/p>", "source": "answers.md", "search": "counters at high contention: row lock, update ... set n = n + 1, sharded counters, and an approximate counter. compare throughput and correctness. approach throughput correctness --- --- --- select ... for update then update worst - two round trips inside the lock exact update t set n = n + 1 better - lock held for the statement only exact sharded counter: n rows, random shard, sum to read n times better exact, reads cost a sum approximate: sample, or hyperloglog in redis unbounded approximate the mechanism behind the ceiling is that all writers serialize on one row's lock, and each update also writes a new tuple version, so the row's page becomes a bloat hotspot as well as a lock hotspot. the sharded counter is the standard fix: insert into or update one of n rows chosen at random (shard_id = hash(random()) % 64), and read with select sum(n). writes scale roughly linearly with n; reads cost an aggregate over n rows, which is trivial. a variant that suits high-write, low-read cases better is append-only : insert a row per event and roll up periodically into a summary row, which turns lock contention into pure appends at the cost of a maintenance job. i would also ask whether the counter needs to be transactional at all. view counts, likes and rate limiters usually belong in redis (q188); order totals and account balances belong in the database with exact semantics."}, {"n": 114, "category": 6, "difficulty": "D", "html": "Idempotency at the storage layer: the idempotency-key table design, the unique constraint, and how you handle a retry that arrives while the first request is still in flight.", "answerTitle": "Idempotency keys at the storage layer", "answer": "<p>The table:<\/p><pre><code class=\"lang-sql\">CREATE TABLE idempotency (\n  key           text PRIMARY KEY,\n  request_hash  text NOT NULL,\n  state         text NOT NULL,           -- IN_PROGRESS | DONE\n  response      jsonb,\n  created_at    timestamptz NOT NULL DEFAULT now()\n);<\/code><\/pre><p>The flow: in the same transaction as the business write, <code>INSERT<\/code> the key. The <strong>primary key is the concurrency control<\/strong> - the unique index makes exactly one inserter win. On success, store the response and mark <code>DONE<\/code>. Return the stored response on any later request with the same key.<\/p><p>The in-flight retry is the interesting case. A second request arriving while the first is uncommitted <strong>blocks<\/strong> on the unique index entry until the first transaction ends - which is correct but ties up a connection. My preferred behavior is a short <code>lock_timeout<\/code> and then a <code>409 Conflict<\/code> with <code>Retry-After<\/code>, telling the client the original is still processing; the alternative, waiting, risks a thundering herd of blocked connections when a slow request is retried by an impatient client.<\/p><p>Two more details that matter: store a <strong>hash of the request body<\/strong> and reject a reused key with different content (<code>422<\/code>), because a client bug reusing keys is worse than no idempotency; and give the table a TTL with a partitioned or time-indexed cleanup, since it grows at the rate of your total request volume.<\/p>", "source": "answers.md", "search": "idempotency at the storage layer: the idempotency-key table design, the unique constraint, and how you handle a retry that arrives while the first request is still in flight. the table: sql create table idempotency ( key text primary key, request_hash text not null, state text not null, -- in_progress done response jsonb, created_at timestamptz not null default now() ); the flow: in the same transaction as the business write, insert the key. the primary key is the concurrency control - the unique index makes exactly one inserter win. on success, store the response and mark done. return the stored response on any later request with the same key. the in-flight retry is the interesting case. a second request arriving while the first is uncommitted blocks on the unique index entry until the first transaction ends - which is correct but ties up a connection. my preferred behavior is a short lock_timeout and then a 409 conflict with retry-after, telling the client the original is still processing; the alternative, waiting, risks a thundering herd of blocked connections when a slow request is retried by an impatient client. two more details that matter: store a hash of the request body and reject a reused key with different content (422), because a client bug reusing keys is worse than no idempotency; and give the table a ttl with a partitioned or time-indexed cleanup, since it grows at the rate of your total request volume."}, {"n": 115, "category": 6, "difficulty": "T", "html": "An <code>INSERT ... ON CONFLICT DO NOTHING<\/code> returns zero rows. What are the three possible states of the world, and how do you distinguish them?", "answerTitle": "`ON CONFLICT DO NOTHING` returns zero rows", "answer": "<p>Three possible states of the world:<\/p><ol><li><strong>A committed row with that key already exists.<\/strong> The normal case.<\/li><li><strong>A concurrent, still-uncommitted transaction inserted that key.<\/strong> <code>DO NOTHING<\/code> does <em>not<\/em> block - it skips - so you get zero rows while no visible row exists. If that transaction later rolls back, the key is free and you have neither inserted nor found anything.<\/li><li><strong>The conflict was on a different constraint<\/strong> than the one you expected, if you omitted the conflict target - <code>DO NOTHING<\/code> without a target swallows <em>any<\/em> unique or exclusion violation, so a genuine data error looks identical to a duplicate.<\/li><\/ol><p>Distinguishing them: follow the insert with a <code>SELECT<\/code> for the key in the same transaction. A row found means case 1. No row found means case 2 (or your snapshot predates the commit under Repeatable Read). Always specify the conflict target so case 3 cannot hide.<\/p><p>The robust pattern when you need the row back is <code>ON CONFLICT (key) DO UPDATE SET key = EXCLUDED.key RETURNING *<\/code> - a deliberate no-op update that takes the row lock, waits for the concurrent transaction, and always returns the row. The cost is a dead tuple per call, so use it where correctness matters more than churn.<\/p>", "source": "answers.md", "search": "an insert ... on conflict do nothing returns zero rows. what are the three possible states of the world, and how do you distinguish them? three possible states of the world: 1. a committed row with that key already exists. the normal case. 2. a concurrent, still-uncommitted transaction inserted that key. do nothing does not block - it skips - so you get zero rows while no visible row exists. if that transaction later rolls back, the key is free and you have neither inserted nor found anything. 3. the conflict was on a different constraint than the one you expected, if you omitted the conflict target - do nothing without a target swallows any unique or exclusion violation, so a genuine data error looks identical to a duplicate. distinguishing them: follow the insert with a select for the key in the same transaction. a row found means case 1. no row found means case 2 (or your snapshot predates the commit under repeatable read). always specify the conflict target so case 3 cannot hide. the robust pattern when you need the row back is on conflict (key) do update set key = excluded.key returning - a deliberate no-op update that takes the row lock, waits for the concurrent transaction, and always returns the row. the cost is a dead tuple per call, so use it where correctness matters more than churn."}, {"n": 116, "category": 6, "difficulty": "D", "html": "The transactional outbox at the SQL level: table design, index, the relay query, and cleanup. What ordering does it guarantee?", "answerTitle": "The outbox at SQL level", "answer": "<pre><code class=\"lang-sql\">CREATE TABLE outbox (\n  id            bigserial PRIMARY KEY,\n  aggregate_id  text NOT NULL,\n  type          text NOT NULL,\n  payload       jsonb NOT NULL,\n  created_at    timestamptz NOT NULL DEFA
