ers.md", "search": "replication lag: the three ways to measure it, what causes it, and why a lag of zero bytes can still mean stale reads. three measurements, and they answer different questions: 1. byte lag - pg_current_wal_lsn() - replay_lsn from pg_stat_replication on the primary. it tells you how much wal is outstanding, which matters for slot growth and failover data loss, but it says nothing about time. 2. time lag - write_lag, flush_lag, replay_lag in pg_stat_replication, or on the standby now() - pg_last_xact_replay_timestamp(). this is what a user experiences. 3. application-level lag - a heartbeat row written on the primary every second and read on the standby; the difference is end-to-end staleness including any pooler or router. causes: standby cpu or io too slow to keep up (recovery replay is largely single-threaded , so a primary with 16 concurrent writers can outpace one replay process); a long-running query on the standby conflicting with replay and, with max_standby_streaming_delay, deliberately pausing it; network bandwidth; and a bulk operation generating wal faster than it can be shipped (q120). why zero byte lag can still mean stale reads: pg_last_xact_replay_timestamp() only advances when there are transactions to replay, so an idle primary shows growing \"time lag\" that is meaningless; and conversely, a standby that has received and flushed all wal may not have applied it - write_lag zero, replay_lag not. always compare replay_lsn, not flush_lsn, for read staleness."}, {"n": 143, "category": 8, "difficulty": "T", "html": "A user updates their profile and immediately sees the old value. Explain the mechanism and give four fixes ranked by cost.", "answerTitle": "Updates their profile, sees the old value", "answer": "<p>The mechanism: the write went to the primary, the subsequent read was routed to a replica, and the replica had not yet applied that transaction. This is a <strong>read-your-writes<\/strong> violation, and it is the single most common bug introduced by adding read replicas.<\/p><p>Four fixes, cheapest first:<\/p><ol><li><strong>Route reads to the primary within a short window after a write<\/strong> - a &quot;sticky primary&quot; flag in the session or a cookie for N seconds. Trivial to implement, imprecise, and it puts some read load back on the primary. This is what most systems actually do.<\/li><li><strong>LSN-based routing.<\/strong> Capture <code>pg_current_wal_insert_lsn()<\/code> after the write, pass it with the request (a token in the session or the response), and have the router either wait for <code>pg_last_wal_replay_lsn() &gt;= token<\/code> on a replica or fall back to the primary. Precise, correct, and it needs plumbing through the application.<\/li><li><strong><code>synchronous_commit = remote_apply<\/code><\/strong> for the writes that need it, so the commit does not return until the designated standby has applied it. Correct and simple, but it adds the round trip plus replay to every such write and only covers the synchronous standby (Q140).<\/li><li><strong>Do not read after write at all<\/strong> - return the written state from the write response, and treat the subsequent read as a refresh. Often the best answer, because the correct value is already in hand.<\/li><\/ol><p>The general framing: read replicas break read-your-writes by construction, so the fix belongs in the routing layer as an explicit policy, not in individual features discovering it one by one.<\/p>", "source": "answers.md", "search": "a user updates their profile and immediately sees the old value. explain the mechanism and give four fixes ranked by cost. the mechanism: the write went to the primary, the subsequent read was routed to a replica, and the replica had not yet applied that transaction. this is a read-your-writes violation, and it is the single most common bug introduced by adding read replicas. four fixes, cheapest first: 1. route reads to the primary within a short window after a write - a \"sticky primary\" flag in the session or a cookie for n seconds. trivial to implement, imprecise, and it puts some read load back on the primary. this is what most systems actually do. 2. lsn-based routing. capture pg_current_wal_insert_lsn() after the write, pass it with the request (a token in the session or the response), and have the router either wait for pg_last_wal_replay_lsn() = token on a replica or fall back to the primary. precise, correct, and it needs plumbing through the application. 3. synchronous_commit = remote_apply for the writes that need it, so the commit does not return until the designated standby has applied it. correct and simple, but it adds the round trip plus replay to every such write and only covers the synchronous standby (q140). 4. do not read after write at all - return the written state from the write response, and treat the subsequent read as a refresh. often the best answer, because the correct value is already in hand. the general framing: read replicas break read-your-writes by construction, so the fix belongs in the routing layer as an explicit policy, not in individual features discovering it one by one."}, {"n": 144, "category": 8, "difficulty": "D", "html": "Read-your-writes, monotonic reads and consistent prefix at the level of a single database with replicas. How do you actually implement each?", "answerTitle": "Session guarantees with replicas", "answer": "<ul><li><strong>Read-your-writes<\/strong>: the LSN token or sticky-primary approach from Q143. The invariant is &quot;never read from a replica whose <code>replay_lsn<\/code> is behind the LSN of my last write&quot;.<\/li><li><strong>Monotonic reads<\/strong> (never see time go backwards): pin a session to <strong>one<\/strong> replica for its lifetime - consistent hashing on session id in the router - because the violation comes from bouncing between replicas at different lag. Alternatively carry the last-read LSN forward as a floor for the next read, which is the same token mechanism.<\/li><li><strong>Consistent prefix<\/strong> (never see effects before causes): comes free from physical replication, since WAL is applied in commit order. It is <em>not<\/em> free with logical replication across multiple publications or with per-table CDC pipelines, where two tables can arrive out of order - which is why a CDC-fed read model needs a single ordered stream per aggregate or a transaction-aware consumer.<\/li><\/ul><p>The implementation point: all three are properties of the <strong>routing layer<\/strong>, and it needs a place to store per-session state (LSN token, pinned replica) plus a staleness bound after which it falls back to the primary. Building that once, centrally, is far cheaper than every service rediscovering the problem.<\/p>", "source": "answers.md", "search": "read-your-writes, monotonic reads and consistent prefix at the level of a single database with replicas. how do you actually implement each? - read-your-writes : the lsn token or sticky-primary approach from q143. the invariant is \"never read from a replica whose replay_lsn is behind the lsn of my last write\". - monotonic reads (never see time go backwards): pin a session to one replica for its lifetime - consistent hashing on session id in the router - because the violation comes from bouncing between replicas at different lag. alternatively carry the last-read lsn forward as a floor for the next read, which is the same token mechanism. - consistent prefix (never see effects before causes): comes free from physical replication, since wal is applied in commit order. it is not free with logical replication across multiple publications or with per-table cdc pipelines, where two tables can arrive out of order - which is why a cdc-fed read model needs a single ordered stream per aggregate or a transaction-aware consumer. the implementation point: all three are properties of the routing layer , and it needs a place to store per-session state (lsn token, pinned replica) plus a staleness bound after which it falls back to the primary. building that once, centrally, is far cheaper than every service rediscovering the problem."}, {"n": 145, "category": 8, "difficulty": "D", "html": "Routing reads to replicas: where the decision belongs, how you handle staleness bounds, and what breaks in a transaction.", "answerTitle": "Routing reads to replicas", "answer": "<p>The decision belongs in <strong>one place<\/strong>, and I prefer it explicit at the call site rather than magic: an annotation or a routing hint that says &quot;this read tolerates staleness of up to N seconds&quot;, resolved by a routing component (a <code>DataSource<\/code> router, PgBouncer/pgpool, or a proxy such as RDS Proxy). Making it implicit - &quot;all <code>readOnly = true<\/code> goes to a replica&quot; - is how the Q143 bug ships, because <code>readOnly<\/code> was written to mean &quot;no writes&quot;, not &quot;stale data is acceptable&quot;.<\/p><p>Staleness handling: the router checks the replica&#x27;s replay lag against the request&#x27;s bound and falls back to the primary if it is exceeded, and it removes a replica from rotation entirely above a hard threshold. Publishing the lag as a metric with an alert is part of the deal.<\/p><p>What breaks inside a transaction: a transaction must be pinned to a single node, so the decision is made <strong>at transaction start<\/strong> and cannot change mid-way; a transaction that begins read-only and then writes must fail or restart (Spring&#x27;s <code>readOnly<\/code> hint is applied at the boundary for exactly this reason - <code>02-spring<\/code> Q64); and a read-write transaction that happens to contain only reads still occupies the primary. Also, replicas cannot take row locks, so <code>SELECT ... FOR UPDATE<\/code> and advisory locks must go to the primary, and temp tables and sequences do not exist on a standby.<\/p>", "source": "answers.md", "search": "routing reads to replicas: where the decision belongs, how you handle staleness bounds, and what breaks in a transaction. the decision belongs in one place , and i prefer it explicit at the call site rather than magic: an annotation or a routing hint that says \"this read tolerates staleness of up to n seconds\", resolved by a routing component (a datasource router, pgbouncer/pgpool, or a proxy such as rds proxy). making it implicit - \"all readonly = true goes to a replica\" - is how the q143 bug ships, because readonly was written to mean \"no writes\", not \"stale data is acceptable\". staleness handling: the router checks the replica's replay lag against the request's bound and falls back to the primary if it is exceeded, and it removes a replica from rotation entirely above a hard threshold. publishing the lag as a metric with an alert is part of the deal. what breaks inside a transaction: a transaction must be pinned to a single node, so the decision is made at transaction start and cannot change mid-way; a transaction that begins read-only and then writes must fail or restart (spring's readonly hint is applied at the boundary for exactly this reason - 02-spring q64); and a read-write transaction that happens to contain only reads still occupies the primary. also, replicas cannot take row locks, so select ... for update and advisory locks must go to the primary, and temp tables and sequences do not exist on a standby."}, {"n": 146, "category": 8, "difficulty": "D", "html": "Failover: automatic versus manual, the role of Patroni/etcd or RDS multi-AZ, and what fencing/STONITH prevents.", "answerTitle": "Failover", "answer": "<p><strong>Manual<\/strong> failover means a human decides; it is slower (minutes) but it never fires spuriously. <strong>Automatic<\/strong> failover means a coordinator with a consensus store decides; it is faster (seconds to tens of seconds) but a false positive - a network blip, a long GC pause, a saturated primary - promotes a standby unnecessarily, and every unnecessary promotion is an incident of its own.<\/p><p>Patroni is the standard PostgreSQL implementation: each node runs an agent that holds a <strong>leader key with a TTL<\/strong> in etcd/Consul/ZooKeeper. The leader renews it; if it fails to renew, the key expires, the remaining agents run an election, the best-positioned standby (most WAL received) is promoted, and the others are reconfigured to follow it. RDS/Aurora multi-AZ does the equivalent inside the managed service, moving a DNS name or an endpoint to the new writer.<\/p><p><strong>Fencing (STONITH)<\/strong> exists because the old primary may still be alive and reachable by <em>some<\/em> clients - a partitioned network, a paused VM that resumes. Without fencing you get two primaries accepting writes (Q147). Fencing forcibly removes the old primary from service: power it off, revoke its storage lease, drop its network route, or - the software equivalent Patroni uses - have the demoted node&#x27;s own agent shut PostgreSQL down when it loses the leader key, plus a <code>watchdog<\/code> device that reboots the node if the agent itself hangs. The other half is that <strong>clients must be fenced too<\/strong>, which is why the endpoint must move rather than clients keeping a list of hosts.<\/p>", "source": "answers.md", "search": "failover: automatic versus manual, the role of patroni/etcd or rds multi-az, and what fencing/stonith prevents. manual failover means a human decides; it is slower (minutes) but it never fires spuriously. automatic failover means a coordinator with a consensus store decides; it is faster (seconds to tens of seconds) but a false positive - a network blip, a long gc pause, a saturated primary - promotes a standby unnecessarily, and every unnecessary promotion is an incident of its own. patroni is the standard postgresql implementation: each node runs an agent that holds a leader key with a ttl in etcd/consul/zookeeper. the leader renews it; if it fails to renew, the key expires, the remaining agents run an election, the best-positioned standby (most wal received) is promoted, and the others are reconfigured to follow it. rds/aurora multi-az does the equivalent inside the managed service, moving a dns name or an endpoint to the new writer. fencing (stonith) exists because the old primary may still be alive and reachable by some clients - a partitioned network, a paused vm that resumes. without fencing you get two primaries accepting writes (q147). fencing forcibly removes the old primary from service: power it off, revoke its storage lease, drop its network route, or - the software equivalent patroni uses - have the demoted node's own agent shut postgresql down when it loses the leader key, plus a watchdog device that reboots the node if the agent itself hangs. the other half is that clients must be fenced too , which is why the endpoint must move rather than clients keeping a list of hosts."}, {"n": 147, "category": 8, "difficulty": "T", "html": "Split brain after a network partition between primary and standby. Describe how two primaries accept writes and how you recover.", "answerTitle": "Split brain", "answer": "<p>Sequence: the network partitions between the primary and the coordinator. The coordinator cannot see the primary, declares it dead, and promotes a standby. Meanwhile the old primary is perfectly healthy on its side of the partition and continues accepting writes from any application instance that can still reach it - a second application zone, a stale DNS cache, a client holding an established TCP connection. Now two nodes have diverged: both have accepted different transactions at the same WAL positions.<\/p><p>Recovery is genuinely painful because there is no automatic merge. The steps: stop writes to both immediately; decide which timeline is authoritative (normally the promoted one, because clients have already read from it); take a backup of both before touching anything; use <code>pg_waldump<\/code> and application-level queries to <strong>extract the transactions that exist only on the losing node<\/strong>; rebuild the loser as a standby of the winner - <code>pg_rewind<\/code> if the WAL is available, otherwise a full base backup; and then reconcile the extracted transactions by hand or by replaying them through the application, which is a business exercise, not a database one.<\/p><p>Prevention is the whole answer: quorum-based coordination (an odd number of coordinator nodes so a minority partition cannot elect), fencing/STONITH so the old primary is actively stopped, a single endpoint that clients cannot bypass, and - if the data is critical - synchronous replication, which prevents the <em>silent<\/em> acceptance of writes that will be lost.<\/p>", "source": "answers.md", "search": "split brain after a network partition between primary and standby. describe how two primaries accept writes and how you recover. sequence: the network partitions between the primary and the coordinator. the coordinator cannot see the primary, declares it dead, and promotes a standby. meanwhile the old primary is perfectly healthy on its side of the partition and continues accepting writes from any application instance that can still reach it - a second application zone, a stale dns cache, a client holding an established tcp connection. now two nodes have diverged: both have accepted different transactions at the same wal positions. recovery is genuinely painful because there is no automatic merge. the steps: stop writes to both immediately; decide which timeline is authoritative (normally the promoted one, because clients have already read from it); take a backup of both before touching anything; use pg_waldump and application-level queries to extract the transactions that exist only on the losing node ; rebuild the loser as a standby of the winner - pg_rewind if the wal is available, otherwise a full base backup; and then reconcile the extracted transactions by hand or by replaying them through the application, which is a business exercise, not a database one. prevention is the whole answer: quorum-based coordination (an odd number of coordinator nodes so a minority partition cannot elect), fencing/stonith so the old primary is actively stopped, a single endpoint that clients cannot bypass, and - if the data is critical - synchronous replication, which prevents the silent acceptance of writes that will be lost."}, {"n": 148, "category": 8, "difficulty": "D", "html": "Replication slots: what problem they solve, and the operational danger they create.", "answerTitle": "Replication slots", "answer": "<p>A slot is a named, persistent record on the primary of how far a consumer has consumed. Its purpose is to guarantee that the primary <strong>retains the WAL<\/strong> a standby or logical subscriber still needs, and (with <code>hot_standby_feedback<\/code>) that it does not vacuum away row versions the consumer might still need. Without a slot, a standby that disconnects for longer than <code>wal_keep_size<\/code> allows can no longer catch up and must be rebuilt.<\/p><p>The danger is the same property: a slot that stops being consumed - a decommissioned replica nobody dropped, a paused Debezium connector, a broken subscription - causes the primary to retain WAL <strong>forever<\/strong>. <code>pg_wal<\/code> grows until the disk fills, and a full WAL disk takes the primary down hard. Logical slots additionally hold back the xmin horizon, so vacuum stalls and bloat accumulates database-wide (Q93).<\/p><p>Operational rules: monitor <code>pg_replication_slots<\/code> for <code>active = false<\/code> and for <code>pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)<\/code> above a threshold - this is a mandatory alert, not a nice-to-have; set <code>max_slot_wal_keep_size<\/code> (PostgreSQL 13+) so the primary invalidates a runaway slot rather than dying; and make dropping the slot part of the runbook for decommissioning any replica or connector.<\/p>", "source": "answers.md", "search": "replication slots: what problem they solve, and the operational danger they create. a slot is a named, persistent record on the primary of how far a consumer has consumed. its purpose is to guarantee that the primary retains the wal a standby or logical subscriber still needs, and (with hot_standby_feedback) that it does not vacuum away row versions the consumer might still need. without a slot, a standby that disconnects for longer than wal_keep_size allows can no longer catch up and must be rebuilt. the danger is the same property: a slot that stops being consumed - a decommissioned replica nobody dropped, a paused debezium connector, a broken subscription - causes the primary to retain wal forever . pg_wal grows until the disk fills, and a full wal disk takes the primary down hard. logical slots additionally hold back the xmin horizon, so vacuum stalls and bloat accumulates database-wide (q93). operational rules: monitor pg_replication_slots for active = false and for pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) above a threshold - this is a mandatory alert, not a nice-to-have; set max_slot_wal_keep_size (postgresql 13+) so the primary invalidates a runaway slot rather than dying; and make dropping the slot part of the runbook for decommissioning any replica or connector."}, {"n": 149, "category": 8, "difficulty": "D", "html": "Cascading replication, delayed replicas and why a delayed replica is a genuinely useful backup.", "answerTitle": "Cascading replication and delayed replicas", "answer": "<p><strong>Cascading<\/strong> lets a standby serve WAL to further standbys instead of every replica streaming from the primary. It reduces network fan-out and CPU on the primary, which matters with many replicas or across regions - one cross-region link feeding a local tree. The cost is added lag for the downstream tier and a more complex failover topology.<\/p><p>A <strong>delayed replica<\/strong> (<code>recovery_min_apply_delay = &#x27;1h&#x27;<\/code>) receives WAL immediately but deliberately applies it an hour late. It is genuinely useful because it protects against the failure class that backups protect against <em>slowly<\/em> and replicas do not protect against at all: <strong>logical corruption<\/strong>. A <code>DELETE<\/code> without a <code>WHERE<\/code>, a bad migration, an application bug writing garbage - all replicate to a normal standby in milliseconds. With a delayed replica you have a window in which the pre-damage state is live and queryable, so you can extract the correct rows in minutes instead of restoring a multi-terabyte backup and replaying WAL for hours.<\/p><p>It is a complement to, not a replacement for, PITR: its window is fixed and short, it can be spoiled by an operator who lets it catch up, and it does not survive a storage failure. But as an RTO reduction for the most common human error, an hour-delayed replica is cheap insurance.<\/p>", "source": "answers.md", "search": "cascading replication, delayed replicas and why a delayed replica is a genuinely useful backup. cascading lets a standby serve wal to further standbys instead of every replica streaming from the primary. it reduces network fan-out and cpu on the primary, which matters with many replicas or across regions - one cross-region link feeding a local tree. the cost is added lag for the downstream tier and a more complex failover topology. a delayed replica (recovery_min_apply_delay = '1h') receives wal immediately but deliberately applies it an hour late. it is genuinely useful because it protects against the failure class that backups protect against slowly and replicas do not protect against at all: logical corruption . a delete without a where, a bad migration, an application bug writing garbage - all replicate to a normal standby in milliseconds. with a delayed replica you have a window in which the pre-damage state is live and queryable, so you can extract the correct rows in minutes instead of restoring a multi-terabyte backup and replaying wal for hours. it is a complement to, not a replacement for, pitr: its window is fixed and short, it can be spoiled by an operator who lets it catch up, and it does not survive a storage failure. but as an rto reduction for the most common human error, an hour-delayed replica is cheap insurance."}, {"n": 150, "category": 8, "difficulty": "D", "html": "Logical replication and CDC: how logical decoding works, what a publication/subscription is, and the DDL limitation.", "answerTitle": "Logical decoding and CDC", "answer": "<p>Logical decoding reads the WAL, reassembles it into transactions, and passes each change to an <strong>output plugin<\/strong> (<code>pgoutput<\/code> for native logical replication, <code>wal2json<\/code> or <code>decoderbufs<\/code> for Debezium) which formats it. A <strong>publication<\/strong> on the publisher names the tables and operations to expose; a <strong>subscription<\/strong> on the subscriber creates a slot and an apply worker. Changes are delivered <strong>in commit order<\/strong>, only for committed transactions (in PostgreSQL 14+ optionally streamed while in progress), and each change carries the new tuple plus, depending on <code>REPLICA IDENTITY<\/code>, the old key or the full old row.<\/p><p>For CDC, the important properties are: commit-ordered so causality is preserved; at-least-once on restart, because the consumer&#x27;s confirmed LSN is the checkpoint and anything after it is re-sent - so consumers must be idempotent; and an initial <strong>snapshot<\/strong> phase that reads the current table contents before switching to streaming.<\/p><p>The DDL limitation is the one to name: <strong>DDL is not decoded<\/strong>. Adding a column on the publisher does not create it on the subscriber, and the apply worker will error or silently ignore data depending on the direction of the mismatch. So schema changes need an explicit ordering discipline - additive changes on the subscriber first, on the publisher second; drops in the reverse order - which is the expand-contract pattern applied to replication (Q247).<\/p>", "source": "answers.md", "search": "logical replication and cdc: how logical decoding works, what a publication/subscription is, and the ddl limitation. logical decoding reads the wal, reassembles it into transactions, and passes each change to an output plugin (pgoutput for native logical replication, wal2json or decoderbufs for debezium) which formats it. a publication on the publisher names the tables and operations to expose; a subscription on the subscriber creates a slot and an apply worker. changes are delivered in commit order , only for committed transactions (in postgresql 14+ optionally streamed while in progress), and each change carries the new tuple plus, depending on replica identity, the old key or the full old row. for cdc, the important properties are: commit-ordered so causality is preserved; at-least-once on restart, because the consumer's confirmed lsn is the checkpoint and anything after it is re-sent - so consumers must be idempotent; and an initial snapshot phase that reads the current table contents before switching to streaming. the ddl limitation is the one to name: ddl is not decoded . adding a column on the publisher does not create it on the subscriber, and the apply worker will error or silently ignore data depending on the direction of the mismatch. so schema changes need an explicit ordering discipline - additive changes on the subscriber first, on the publisher second; drops in the reverse order - which is the expand-contract pattern applied to replication (q247)."}, {"n": 151, "category": 8, "difficulty": "D", "html": "Backups: full, incremental, <code>pg_dump<\/code> versus physical base backup, and why a <code>pg_dump<\/code> is not a backup strategy at scale.", "answerTitle": "Backups", "answer": "<p><strong><code>pg_dump<\/code><\/strong> is a logical backup: it produces SQL or an archive of the <em>contents<\/em> from a single consistent snapshot. It is portable across versions and architectures, restores selectively, and produces a compact file. But it is a <strong>full<\/strong> dump every time, it takes as long as reading the whole database, restoring means re-executing every insert and rebuilding every index (which on a terabyte can be many hours), and it gives no point-in-time capability - only the instant of the dump.<\/p><p><strong>A physical base backup<\/strong> (<code>pg_basebackup<\/code>, pgBackRest, Barman, or a storage snapshot) copies the data files plus the WAL generated during the copy. Combined with <strong>continuous WAL archiving<\/strong> it supports PITR to any second (Q152), supports <strong>incremental/differential<\/strong> backups (pgBackRest block-level, PostgreSQL 17 native incremental), restores by copying files rather than replaying SQL, and can be taken from a standby.<\/p><p>Why <code>pg_dump<\/code> is not a strategy at scale: the RTO is measured in hours-to-days for a large database, the RPO is the dump interval (typically 24 hours), and it takes a long-running transaction on the source, which pins the xmin horizon and bloats the database while it runs (Q93). It remains excellent for per-table exports, cross-version migration and small databases - just not as the disaster recovery plan.<\/p>", "source": "answers.md", "search": "backups: full, incremental, pg_dump versus physical base backup, and why a pg_dump is not a backup strategy at scale. pg_dump is a logical backup: it produces sql or an archive of the contents from a single consistent snapshot. it is portable across versions and architectures, restores selectively, and produces a compact file. but it is a full dump every time, it takes as long as reading the whole database, restoring means re-executing every insert and rebuilding every index (which on a terabyte can be many hours), and it gives no point-in-time capability - only the instant of the dump. a physical base backup (pg_basebackup, pgbackrest, barman, or a storage snapshot) copies the data files plus the wal generated during the copy. combined with continuous wal archiving it supports pitr to any second (q152), supports incremental/differential backups (pgbackrest block-level, postgresql 17 native incremental), restores by copying files rather than replaying sql, and can be taken from a standby. why pg_dump is not a strategy at scale: the rto is measured in hours-to-days for a large database, the rpo is the dump interval (typically 24 hours), and it takes a long-running transaction on the source, which pins the xmin horizon and bloats the database while it runs (q93). it remains excellent for per-table exports, cross-version migration and small databases - just not as the disaster recovery plan."}, {"n": 152, "category": 8, "difficulty": "D", "html": "Point-in-time recovery: the WAL archive, the recovery target, and the arithmetic that determines your real RTO.", "answerTitle": "Point-in-time recovery", "answer": "<p>Three ingredients: a <strong>base backup<\/strong> (a physical copy plus the WAL to make it consistent), a <strong>continuous WAL archive<\/strong> (every completed WAL segment shipped to durable storage via <code>archive_command<\/code> or <code>pg_receivewal<\/code>), and a <strong>recovery target<\/strong> - <code>recovery_target_time<\/code>, <code>_lsn<\/code>, <code>_xid<\/code> or <code>_name<\/code> - set at restore time. Recovery restores the base backup, then replays archived WAL forward until the target, then stops and promotes.<\/p><p>The RTO arithmetic is what people miss:<\/p><pre><code>RTO = fetch base backup from object storage\n    + restore/decompress it to local disk\n    + fetch and replay WAL from the backup to the target\n    + verification and application cutover<\/code><\/pre><p>Replay is largely <strong>single-threaded<\/strong>, so it proceeds at maybe 50-200 MB/s of WAL; a system producing 100 GB of WAL a day and a base backup taken weekly means up to 700 GB to replay - hours, before the restore itself. That is why base backup <strong>frequency<\/strong> is the main RTO lever, and why &quot;we have PITR&quot; without a measured restore is a claim, not a capability.<\/p><p>The RPO, separately, is the archive lag: with <code>archive_command<\/code> you can lose the current, unarchived segment (up to 16 MB of WAL), so <code>archive_timeout<\/code> or streaming with <code>pg_receivewal --synchronous<\/code> closes that gap.<\/p>", "source": "answers.md", "search": "point-in-time recovery: the wal archive, the recovery target, and the arithmetic that determines your real rto. three ingredients: a base backup (a physical copy plus the wal to make it consistent), a continuous wal archive (every completed wal segment shipped to durable storage via archive_command or pg_receivewal), and a recovery target - recovery_target_time, _lsn, _xid or _name - set at restore time. recovery restores the base backup, then replays archived wal forward until the target, then stops and promotes. the rto arithmetic is what people miss: rto = fetch base backup from object storage + restore/decompress it to local disk + fetch and replay wal from the backup to the target + verification and application cutover replay is largely single-threaded , so it proceeds at maybe 50-200 mb/s of wal; a system producing 100 gb of wal a day and a base backup taken weekly means up to 700 gb to replay - hours, before the restore itself. that is why base backup frequency is the main rto lever, and why \"we have pitr\" without a measured restore is a claim, not a capability. the rpo, separately, is the archive lag: with archive_command you can lose the current, unarchived segment (up to 16 mb of wal), so archive_timeout or streaming with pg_receivewal --synchronous closes that gap."}, {"n": 153, "category": 8, "difficulty": "T", "html": "Your backups have succeeded every night for two years. Give five reasons you may still be unable to restore.", "answerTitle": "Backups succeed but you cannot restore", "answer": "<p>Five realistic reasons:<\/p><ol><li><strong>Nobody has ever tested a restore.<\/strong> The backup job reports success on writing a file; nothing verifies the file is a valid, complete, restorable backup. This is by far the most common.<\/li><li><strong>The WAL archive is incomplete.<\/strong> The base backup is fine but <code>archive_command<\/code> has been failing silently (or the retention policy expired the WAL needed to make the base backup consistent), so the backup cannot even reach a consistent state, let alone your target time.<\/li><li><strong>The restore does not fit.<\/strong> No machine with enough disk, no capacity in the account, or a restore time far beyond the RTO nobody measured - technically restorable, operationally useless.<\/li><li><strong>Encryption or credentials.<\/strong> The backups are encrypted with a KMS key in the account that was lost, the key was rotated and old versions deleted, or the credentials to read the bucket live in the system that is down.<\/li><li><strong>Something outside the database is missing<\/strong> - the roles and grants (not included in <code>pg_dump<\/code> of a single database), tablespaces, extensions of the right version, large objects, the exact PostgreSQL minor version, or <code>postgresql.conf<\/code>. The data restores and the application still cannot start.<\/li><\/ol><p>Honourable mentions: backups stored in the same account/region that the disaster destroyed; a logical backup that has silently been dumping only one schema since a refactor; and ransomware encrypting the backup share because it was mounted writable.<\/p><p>The only answer that counts is a <strong>scheduled restore drill<\/strong> into a scratch environment, automated, with the RTO recorded and a smoke test that the application starts and a known row exists.<\/p>", "source": "answers.md", "search": "your backups have succeeded every night for two years. give five reasons you may still be unable to restore. five realistic reasons: 1. nobody has ever tested a restore. the backup job reports success on writing a file; nothing verifies the file is a valid, complete, restorable backup. this is by far the most common. 2. the wal archive is incomplete. the base backup is fine but archive_command has been failing silently (or the retention policy expired the wal needed to make the base backup consistent), so the backup cannot even reach a consistent state, let alone your target time. 3. the restore does not fit. no machine with enough disk, no capacity in the account, or a restore time far beyond the rto nobody measured - technically restorable, operationally useless. 4. encryption or credentials. the backups are encrypted with a kms key in the account that was lost, the key was rotated and old versions deleted, or the credentials to read the bucket live in the system that is down. 5. something outside the database is missing - the roles and grants (not included in pg_dump of a single database), tablespaces, extensions of the right version, large objects, the exact postgresql minor version, or postgresql.conf. the data restores and the application still cannot start. honourable mentions: backups stored in the same account/region that the disaster destroyed; a logical backup that has silently been dumping only one schema since a refactor; and ransomware encrypting the backup share because it was mounted writable. the only answer that counts is a scheduled restore drill into a scratch environment, automated, with the rto recorded and a smoke test that the application starts and a known row exists."}, {"n": 154, "category": 8, "difficulty": "D", "html": "RPO and RTO: define them, and show how the architecture changes as RPO goes from 24 hours to 5 minutes to zero.", "answerTitle": "RPO and RTO", "answer": "<p><strong>RPO<\/strong> (recovery point objective) is how much <em>data<\/em> you can afford to lose, measured in time: it is determined by your replication and archiving, not by your restore process. <strong>RTO<\/strong> (recovery time objective) is how long you can be <em>down<\/em>: it is determined by detection, decision, and the restore/failover mechanics.<\/p><p>How the architecture changes:<\/p><table><thead><tr><th>Target<\/th><th>RPO 24h<\/th><th>RPO 5 min<\/th><th>RPO ~0<\/th><\/tr><\/thead><tbody><tr><td>Mechanism<\/td><td>nightly backup<\/td><td>continuous WAL archiving with frequent segment closure<\/td><td>synchronous replication (Q140)<\/td><\/tr><tr><td>Cost<\/td><td>trivial<\/td><td>modest - archive storage and monitoring<\/td><td>every commit pays a network round trip<\/td><\/tr><tr><td>Failure mode<\/td><td>lose a day&#x27;s work<\/td><td>lose the unarchived segment<\/td><td>write availability tied to two nodes<\/td><\/tr><\/tbody><\/table><p>And on the RTO side: hours means &quot;restore from backup&quot;; 15 minutes means &quot;a warm standby, automated promotion, and a single endpoint clients follow&quot;; under a minute means &quot;automated failover with health checks tuned aggressively and clients that reconnect&quot;, accepting occasional false promotions. Below that you are talking about multi-writer or active-active, and the cost curve turns vertical (Q155).<\/p><p>The essential point: these are <strong>business<\/strong> numbers. My job is to price each level and make the business choose, and then to prove the chosen level with a drill rather than a diagram.<\/p>", "source": "answers.md", "search": "rpo and rto: define them, and show how the architecture changes as rpo goes from 24 hours to 5 minutes to zero. rpo (recovery point objective) is how much data you can afford to lose, measured in time: it is determined by your replication and archiving, not by your restore process. rto (recovery time objective) is how long you can be down : it is determined by detection, decision, and the restore/failover mechanics. how the architecture changes: target rpo 24h rpo 5 min rpo ~0 --- --- --- --- mechanism nightly backup continuous wal archiving with frequent segment closure synchronous replication (q140) cost trivial modest - archive storage and monitoring every commit pays a network round trip failure mode lose a day's work lose the unarchived segment write availability tied to two nodes and on the rto side: hours means \"restore from backup\"; 15 minutes means \"a warm standby, automated promotion, and a single endpoint clients follow\"; under a minute means \"automated failover with health checks tuned aggressively and clients that reconnect\", accepting occasional false promotions. below that you are talking about multi-writer or active-active, and the cost curve turns vertical (q155). the essential point: these are business numbers. my job is to price each level and make the business choose, and then to prove the chosen level with a drill rather than a diagram."}, {"n": 155, "category": 8, "difficulty": "D", "html": "Multi-region: active-passive, active-active, and the specific reason active-active relational writes are so hard.", "answerTitle": "Multi-region", "answer": "<p><strong>Active-passive<\/strong>: writes in one region, asynchronous replication to a standby region, failover promotes it. RPO is the cross-region lag (seconds), RTO is the promotion plus DNS/endpoint propagation. This covers regional disaster and is what most systems should do.<\/p><p><strong>Active-active<\/strong>: both regions accept writes. This is where relational databases struggle, and the reason is fundamental rather than a missing feature: a relational system&#x27;s guarantees - unique constraints, foreign keys, <code>SELECT ... FOR UPDATE<\/code>, serializable transactions - all require <strong>coordination among all writers<\/strong>. Coordinating synchronously across regions means every write pays 50-150 ms of speed-of-light latency, which destroys OLTP throughput. Coordinating asynchronously means two regions can allocate the same invoice number, both sell the last item, or update the same row concurrently - and then you need conflict resolution, which the relational model has no answer for (last-write-wins loses data, Q106 and <code>03-microservices<\/code> Q69).<\/p><p>The practical designs: <strong>partition writes by region<\/strong> so each row has a home region and no two regions write the same data (Spanner-style geo-partitioning, or simply routing customers to their region); accept <strong>eventual consistency with CRDTs or application-level merge<\/strong> for the data that can tolerate it; or use a distributed SQL engine that pays the coordination cost explicitly and honestly (Q167). What I would refuse is asynchronous multi-master on a conventional engine with &quot;we&#x27;ll resolve conflicts later&quot;, because &quot;later&quot; means a data-quality incident with no clean resolution.<\/p>", "source": "answers.md", "search": "multi-region: active-passive, active-active, and the specific reason active-active relational writes are so hard. active-passive : writes in one region, asynchronous replication to a standby region, failover promotes it. rpo is the cross-region lag (seconds), rto is the promotion plus dns/endpoint propagation. this covers regional disaster and is what most systems should do. active-active : both regions accept writes. this is where relational databases struggle, and the reason is fundamental rather than a missing feature: a relational system's guarantees - unique constraints, foreign keys, select ... for update, serializable transactions - all require coordination among all writers . coordinating synchronously across regions means every write pays 50-150 ms of speed-of-light latency, which destroys oltp throughput. coordinating asynchronously means two regions can allocate the same invoice number, both sell the last item, or update the same row concurrently - and then you need conflict resolution, which the relational model has no answer for (last-write-wins loses data, q106 and 03-microservices q69). the practical designs: partition writes by region so each row has a home region and no two regions write the same data (spanner-style geo-partitioning, or simply routing customers to their region); accept eventual consistency with crdts or application-level merge for the data that can tolerate it; or use a distributed sql engine that pays the coordination cost explicitly and honestly (q167). what i would refuse is asynchronous multi-master on a conventional engine with \"we'll resolve conflicts later\", because \"later\" means a data-quality incident with no clean resolution."}, {"n": 156, "category": 8, "difficulty": "A", "html": "Design the HA and DR posture for a system with a 15-minute RTO and near-zero RPO, and state what it costs.", "answerTitle": "HA and DR for 15-minute RTO, near-zero RPO", "answer": "<p><strong>Clarify first<\/strong>: is 15 minutes the RTO for a <em>regional<\/em> disaster or for an instance failure? Near-zero RPO means how many seconds, and for which data - all of it, or the financial subset? What is the acceptable write-latency increase? Those answers move the cost by an order of magnitude.<\/p><p>The design I would propose for a single-region-primary system:<\/p><ul><li><strong>Within the region<\/strong>: a synchronous standby in a second AZ with quorum commit (<code>ANY 1 (az2a, az2b)<\/code>) so a single standby failure cannot stall writes (Q141). This gives RPO=0 for an instance or AZ failure and, with automated promotion (Patroni or the managed equivalent), an RTO of well under a minute. Cost: one round trip per commit within the region, typically 1-2 ms.<\/li><li><strong>Cross-region<\/strong>: an <strong>asynchronous<\/strong> standby in a second region, plus continuous WAL archiving to object storage in that region. RPO here is the replication lag - seconds - and RTO is a promotion plus endpoint change. Synchronous cross-region is what I would <em>not<\/em> do, and I would say why: it makes every commit pay the inter-region RTT and makes the far region a liability for write availability.<\/li><li><strong>Logical corruption<\/strong>: a delayed replica at one hour (Q149) plus PITR from the archive, because neither replication nor failover protects against a bad <code>DELETE<\/code>.<\/li><li><strong>Client side<\/strong>: a single endpoint (DNS with a low TTL, or a proxy) that clients follow, connection retry with backoff in every service, and idempotent writes so a retry after failover does not double-charge.<\/li><li><strong>Proof<\/strong>: an automated monthly game day - kill the primary, measure the actual RTO; and a quarterly regional failover test and restore drill with the numbers published.<\/li><\/ul><p><strong>What it costs<\/strong>: roughly double the compute (standbys are idle capacity you pay for), cross-region data transfer on every WAL byte, object storage for the archive, and 1-2 ms added to every write within the region. The honest caveat I would give the business: the 15-minute RTO is achievable technically, and the thing that will actually make you miss it is <strong>detection and decision time<\/strong>, not the database - so the investment must include the alerting, the runbook and the authority to fail over without a meeting.<\/p><p><em>Hook: a failover you ran for real, and the difference between the measured RTO and the one in the document.<\/em><\/p>", "source": "answers.md", "search": "design the ha and dr posture for a system with a 15-minute rto and near-zero rpo, and state what it costs. clarify first : is 15 minutes the rto for a regional disaster or for an instance failure? near-zero rpo means how many seconds, and for which data - all of it, or the financial subset? what is the acceptable write-latency increase? those answers move the cost by an order of magnitude. the design i would propose for a single-region-primary system: - within the region : a synchronous standby in a second az with quorum commit (any 1 (az2a, az2b)) so a single standby failure cannot stall writes (q141). this gives rpo=0 for an instance or az failure and, with automated promotion (patroni or the managed equivalent), an rto of well under a minute. cost: one round trip per commit within the region, typically 1-2 ms. - cross-region : an asynchronous standby in a second region, plus continuous wal archiving to object storage in that region. rpo here is the replication lag - seconds - and rto is a promotion plus endpoint change. synchronous cross-region is what i would not do, and i would say why: it makes every commit pay the inter-region rtt and makes the far region a liability for write availability. - logical corruption : a delayed replica at one hour (q149) plus pitr from the archive, because neither replication nor failover protects against a bad delete. - client side : a single endpoint (dns with a low ttl, or a proxy) that clients follow, connection retry with backoff in every service, and idempotent writes so a retry after failover does not double-charge. - proof : an automated monthly game day - kill the primary, measure the actual rto; and a quarterly regional failover test and restore drill with the numbers published. what it costs : roughly double the compute (standbys are idle capacity you pay for), cross-region data transfer on every wal byte, object storage for the archive, and 1-2 ms added to every write within the region. the honest caveat i would give the business: the 15-minute rto is achievable technically, and the thing that will actually make you miss it is detection and decision time , not the database - so the investment must include the alerting, the runbook and the authority to fail over without a meeting. hook: a failover you ran for real, and the difference between the measured rto and the one in the document."}, {"n": 157, "category": 9, "difficulty": "C", "html": "Partitioning versus sharding versus replication. Define each and say which problem each actually solves.", "answerTitle": "Partitioning, sharding, replication", "answer": "<ul><li><strong>Replication<\/strong> copies the <em>same<\/em> data to more nodes. It solves read scaling, availability and disaster recovery. It does <strong>not<\/strong> solve write throughput or data volume - every node still holds everything and applies every write.<\/li><li><strong>Partitioning<\/strong> splits one table into pieces <strong>within one database<\/strong>. It solves manageability - vacuum, index size, retention by dropping a partition, and query pruning. It does <strong>not<\/strong> solve write throughput, because it is still one server.<\/li><li><strong>Sharding<\/strong> splits the data across <strong>independent databases<\/strong>. It is the only one of the three that scales writes and total dataset size. It costs you cross-shard queries, cross-shard transactions, global uniqueness and operational complexity.<\/li><\/ul><p>The sequence I would apply: replication first (cheap, solves the common case), then partitioning (contained, no application change if the key is already in the queries), then sharding last (expensive, invasive, irreversible in practice).<\/p>", "source": "answers.md", "search": "partitioning versus sharding versus replication. define each and say which problem each actually solves. - replication copies the same data to more nodes. it solves read scaling, availability and disaster recovery. it does not solve write throughput or data volume - every node still holds everything and applies every write. - partitioning splits one table into pieces within one database . it solves manageability - vacuum, index size, retention by dropping a partition, and query pruning. it does not solve write throughput, because it is still one server. - sharding splits the data across independent databases . it is the only one of the three that scales writes and total dataset size. it costs you cross-shard queries, cross-shard transactions, global uniqueness and operational complexity. the sequence i would apply: replication first (cheap, solves the common case), then partitioning (contained, no application change if the key is already in the queries), then sharding last (expensive, invasive, irreversible in practice)."}, {"n": 158, "category": 9, "difficulty": "D", "html": "Range, list and hash partitioning in PostgreSQL. Give the workload that suits each.", "answerTitle": "Range, list and hash partitioning", "answer": "<ul><li><strong>Range<\/strong> - by a continuous value, almost always time: <code>PARTITION BY RANGE (created_at)<\/code> with one partition per month. Suits time-series, event and audit tables where queries filter by a period and retention is &quot;drop anything older than N months&quot;. This is the majority of real use.<\/li><li><strong>List<\/strong> - by an enumerable discriminator: region, tenant tier, country. Suits a workload where queries always filter by that value and where you want to manage partitions differently (different tablespaces, different retention, per-tenant vacuum settings).<\/li><li><strong>Hash<\/strong> - by a hash of the key into N equal partitions. It does not help pruning for range queries, and it gives no retention story. Its purpose is <strong>spreading contention and size evenly<\/strong> when there is no natural range - a very hot table where you want the index and vacuum work split, or a preparatory step toward sharding by the same key.<\/li><\/ul><p>The default question I ask is &quot;what will you drop, and what do queries filter by&quot;. If those answers are the same column, range partitioning by that column is almost certainly right; if the answer is &quot;nothing, and everything&quot;, partitioning may be the wrong tool.<\/p>", "source": "answers.md", "search": "range, list and hash partitioning in postgresql. give the workload that suits each. - range - by a continuous value, almost always time: partition by range (created_at) with one partition per month. suits time-series, event and audit tables where queries filter by a period and retention is \"drop anything older than n months\". this is the majority of real use. - list - by an enumerable discriminator: region, tenant tier, country. suits a workload where queries always filter by that value and where you want to manage partitions differently (different tablespaces, different retention, per-tenant vacuum settings). - hash - by a hash of the key into n equal partitions. it does not help pruning for range queries, and it gives no retention story. its purpose is spreading contention and size evenly when there is no natural range - a very hot table where you want the index and vacuum work split, or a preparatory step toward sharding by the same key. the default question i ask is \"what will you drop, and what do queries filter by\". if those answers are the same column, range partitioning by that column is almost certainly right; if the answer is \"nothing, and everything\", partitioning may be the wrong tool."}, {"n": 159, "category": 9, "difficulty": "D", "html": "Partition pruning: when it happens at plan time versus execution time, and the query shapes that defeat it entirely.", "answerTitle": "Partition pruning", "answer": "<p><strong>Plan-time pruning<\/strong> happens when the planner can evaluate the partition key predicate against the boundaries using constants - <code>WHERE created_at &gt;= &#x27;2026-01-01&#x27;<\/code> - and it simply excludes those partitions from the plan. <strong>Execution-time pruning<\/strong> (PostgreSQL 11+, <code>enable_partition_pruning<\/code>) handles parameters and values only known at runtime: a generic prepared plan, a value from a subquery, or the inner side of a nested loop, shown in the plan as <code>Subplans Removed: N<\/code>.<\/p><p>Query shapes that defeat pruning entirely:<\/p><ul><li><strong>No predicate on the partition key at all<\/strong> - the most common. If you partition by <code>created_at<\/code> and every query filters by <code>customer_id<\/code>, you have all the maintenance cost and none of the benefit.<\/li><li><strong>The key wrapped in a function<\/strong> or a non-immutable expression: <code>WHERE date_trunc(&#x27;month&#x27;, created_at) = ?<\/code>.<\/li><li><strong>A type or collation mismatch<\/strong> forcing a cast on the column side.<\/li><li><strong><code>OR<\/code> across the partition key and something else<\/strong>, which can force scanning everything.<\/li><li><strong>A join on the partition key without a constant<\/strong> - partition-wise join helps only if <code>enable_partitionwise_join<\/code> is on and the partitioning schemes match exactly.<\/li><\/ul><p>The operational tell is a plan listing every partition, and a query time that grows as you add partitions instead of staying flat.<\/p>", "source": "answers.md", "search": "partition pruning: when it happens at plan time versus execution time, and the query shapes that defeat it entirely. plan-time pruning happens when the planner can evaluate the partition key predicate against the boundaries using constants - where created_at = '2026-01-01' - and it simply excludes those partitions from the plan. execution-time pruning (postgresql 11+, enable_partition_pruning) handles parameters and values only known at runtime: a generic prepared plan, a value from a subquery, or the inner side of a nested loop, shown in the plan as subplans removed: n. query shapes that defeat pruning entirely: - no predicate on the partition key at all - the most common. if you partition by created_at and every query filters by customer_id, you have all the maintenance cost and none of the benefit. - the key wrapped in a function or a non-immutable expression: where date_trunc('month', created_at) = ?. - a type or collation mismatch forcing a cast on the column side. - or across the partition key and something else , which can force scanning everything. - a join on the partition key without a constant - partition-wise join helps only if enable_partitionwise_join is on and the partitioning schemes match exactly. the operational tell is a plan listing every partition, and a query time that grows as you add partitions instead of staying flat."}, {"n": 160, "category": 9, "difficulty": "T", "html": "You partition a table by month and the queries get slower. Give three realistic reasons.", "answerTitle": "Monthly partitions made it slower", "answer": "<p>Three realistic causes:<\/p><ol><li><strong>Queries do not filter on the partition key<\/strong>, so every query now scans all partitions and the planner must lock, plan and open each one. With 60 monthly partitions, planning time alone can exceed the old execution time, and <code>max_locks_per_transaction<\/code> becomes a real constraint.<\/li><li><strong>Too many partitions for the access pattern.<\/strong> Each partition has its own indexes, so an index that was one B-tree of depth 4 is now 60 B-trees of depth 3 - and a query touching all of them does 60 index descents plus 60 sets of buffer lookups instead of one. Append/MergeAppend across many children also costs more than a single scan.<\/li><li><strong>Lost global ordering or global uniqueness.<\/strong> A <code>ORDER BY created_at LIMIT 10<\/code> that used to be an index scan stopping after 10 rows may now need a MergeAppend across partitions; and any unique constraint not containing the partition key had to be dropped, so the query that relied on it now does something worse (Q161).<\/li><\/ol><p>There is a fourth in the field: partitioning was added <em>and<\/em> the statistics were never regathered, so the planner has no per-partition statistics and estimates badly. Always <code>ANALYZE<\/code> after partitioning.<\/p>", "source": "answers.md", "search": "you partition a table by month and the queries get slower. give three realistic reasons. three realistic causes: 1. queries do not filter on the partition key , so every query now scans all partitions and the planner must lock, plan and open each one. with 60 monthly partitions, planning time alone can exceed the old execution time, and max_locks_per_transaction becomes a real constraint. 2. too many partitions for the access pattern. each partition has its own indexes, so an index that was one b-tree of depth 4 is now 60 b-trees of depth 3 - and a query touching all of them does 60 index descents plus 60 sets of buffer lookups instead of one. append/mergeappend across many children also costs more than a single scan. 3. lost global ordering or global uniqueness. a order by created_at limit 10 that used to be an index scan stopping after 10 rows may now need a mergeappend across partitions; and any unique constraint not containing the partition key had to be dropped, so the query that relied on it now does something worse (q161). there is a fourth in the field: partitioning was added and the statistics were never regathered, so the planner has no per-partition statistics and estimates badly. always analyze after partitioning."}, {"n": 161, "category": 9, "difficulty": "D", "html": "What must a partition key satisfy to be included in a primary key or unique index, and what does that do to your model?", "answerTitle": "Partition key in the primary key", "answer": "<p>A unique index in PostgreSQL is per-partition, not global, so the engine can only guarantee uniqueness across the whole table if <strong>every partition can decide locally<\/strong> - which requires the <strong>partition key to be part of every unique constraint and primary key<\/strong>.<\/p><p>The consequences for the model are real. If you partition <code>orders<\/code> by <code>created_at<\/code>, the primary key must become <code>(id, created_at)<\/code>. That is fine internally but it changes every foreign key referencing orders to a composite, changes your ORM mapping, and means an <code>id<\/code> alone is no longer a guaranteed unique lookup - a query by <code>id<\/code> without the date must scan all partitions, so external references need to carry the date (or you keep a small global lookup table mapping <code>id<\/code> to partition key, which is another thing to maintain).<\/p><p>The mitigations: choose a partition key that is already part of the natural identity (tenant id, account id) so the composite is honest; embed the partition key <strong>inside<\/strong> the identifier (a ULID whose timestamp prefix is the partition key, or <code>tenant:id<\/code>), so callers always carry it; or accept the scan for the rare by-id path. This constraint is the main reason partitioning is not transparent, and being able to state it precisely is the point of the question.<\/p>", "source": "answers.md", "search": "what must a partition key satisfy to be included in a primary key or unique index, and what does that do to your model? a unique index in postgresql is per-partition, not global, so the engine can only guarantee uniqueness across the whole table if every partition can decide locally - which requires the partition key to be part of every unique constraint and primary key . the consequences for the model are real. if you partition orders by created_at, the primary key must become (id, created_at). that is fine internally but it changes every foreign key referencing orders to a composite, changes your orm mapping, and means an id alone is no longer a guaranteed unique lookup - a query by id without the date must scan all partitions, so external references need to carry the date (or you keep a small global lookup table mapping id to partition key, which is another thing to maintain). the mitigations: choose a partition key that is already part of the natural identity (tenant id, account id) so the composite is honest; embed the partition key inside the identifier (a ulid whose timestamp prefix is the partition key, or tenant:id), so callers always carry it; or accept the scan for the rare by-id path. this constraint is the main reason partitioning is not transparent, and being able to state it precisely is the point of the question."}, {"n": 162, "category": 9, "difficulty": "D", "html": "Detaching, attaching and dropping partitions. How does this turn data retention from a <code>DELETE<\/code> problem into a metadata operation?", "answerTitle": "Detach, attach, drop", "answer": "<p><code>DROP TABLE partition_2024_01<\/code> removes a month of data in <strong>milliseconds<\/strong> as a catalog operation plus a file unlink - no row-by-row deletion, no dead tuples, no vacuum, no WAL proportional to the data, no bloat. Compare that with <code>DELETE FROM events WHERE created_at &lt; ...<\/code> on 200 million rows: hours of work, an enormous WAL burst, replication lag, 200 million dead tuples, and a table that does not shrink (Q131).<\/p><p><code>DETACH PARTITION<\/code> removes it from the parent while keeping the table, which is how you archive: detach, then <code>COPY<\/code> it to object storage or move it to cheaper storage, then drop. <code>DETACH ... CONCURRENTLY<\/code> (PostgreSQL 14+) avoids the <code>ACCESS EXCLUSIVE<\/code> lock on the parent that a plain detach requires.<\/p><p><code>ATTACH PARTITION<\/code> adds a pre-loaded table as a partition, which is how you bulk-load: create a standalone table, load and index it at full speed with no contention on the live table, add a <code>CHECK<\/code> constraint matching the partition bounds so the attach can skip its validation scan, then attach - a fast metadata operation.<\/p><p>The operational requirement this creates: <strong>partition maintenance must be automated<\/strong> (pg_partman or a scheduled job) to create future partitions ahead of time and drop expired ones. A partitioned table with no future partition and no default silently rejects inserts, which is a memorable 2 a.m. incident.<\/p>", "source": "answers.md", "search": "detaching, attaching and dropping partitions. how does this turn data retention from a delete problem into a metadata operation? drop table partition_2024_01 removes a month of data in milliseconds as a catalog operation plus a file unlink - no row-by-row deletion, no dead tuples, no vacuum, no wal proportional to the data, no bloat. compare that with delete from events where created_at < ... on 200 million rows: hours of work, an enormous wal burst, replication lag, 200 million dead tuples, and a table that does not shrink (q131). detach partition removes it from the parent while keeping the table, which is how you archive: detach, then copy it to object storage or move it to cheaper storage, then drop. detach ... concurrently (postgresql 14+) avoids the access exclusive lock on the parent that a plain detach requires. attach partition adds a pre-loaded table as a partition, which is how you bulk-load: create a standalone table, load and index it at full speed with no contention on the live table, add a check constraint matching the partition bounds so the attach can skip its validation scan, then attach - a fast metadata operation. the operational requirement this creates: partition maintenance must be automated (pg_partman or a scheduled job) to create future partitions ahead of time and drop expired ones. a partitioned table with no future partition and no default silently rejects inserts, which is a memorable 2 a.m. incident."}, {"n": 163, "category": 9, "difficulty": "D", "html": "Choosing a shard key: the four properties you evaluate, and the failure produced by getting each one wrong.", "answerTitle": "Choosing a shard key", "answer": "<p>The four properties, and the failure from getting each wrong:<\/p><ol><li><strong>High cardinality<\/strong> - enough distinct values to spread across all shards and to keep spreading as you grow. Get it wrong (sharding by country, status, or a boolean) and you cannot use more shards than you have values.<\/li><li><strong>Even distribution<\/strong> - the values must be roughly uniform in <em>volume<\/em>, not just in count. Get it wrong and one shard holds 30 percent of the data (Q164).<\/li><li><strong>Query alignment<\/strong> - the key must appear in the overwhelming majority of queries, so they can be routed to one shard. Get it wrong and every query is a scatter-gather across all shards, which is slower than the unsharded system and fails when any shard is slow.<\/li><li><strong>Transaction alignment<\/strong> - data that changes together should live together. Get it wrong and ordinary business operations need cross-shard transactions, which means sagas or 2PC (Q102, Q166).<\/li><\/ol><p>A fifth, practical one: <strong>stability<\/strong>. The key must never change for a row, because changing it means moving the row between shards.<\/p><p>In practice <code>tenant_id<\/code> or <code>customer_id<\/code> satisfies all of them for most B2B and consumer systems, which is why it is the usual answer - and why it fails exactly when one tenant is enormous.<\/p>", "source": "answers.md", "search": "choosing a shard key: the four properties you evaluate, and the failure produced by getting each one wrong. the four properties, and the failure from getting each wrong: 1. high cardinality - enough distinct values to spread across all shards and to keep spreading as you grow. get it wrong (sharding by country, status, or a boolean) and you cannot use more shards than you have values. 2. even distribution - the values must be roughly uniform in volume , not just in count. get it wrong and one shard holds 30 percent of the data (q164). 3. query alignment - the key must appear in the overwhelming majority of queries, so they can be routed to one shard. get it wrong and every query is a scatter-gather across all shards, which is slower than the unsharded system and fails when any shard is slow. 4. transaction alignment - data that changes together should live together. get it wrong and ordinary business operations need cross-shard transactions, which means sagas or 2pc (q102, q166). a fifth, practical one: stability . the key must never change for a row, because changing it means moving the row between shards. in practice tenant_id or customer_id satisfies all of them for most b2b and consumer systems, which is why it is the usual answer - and why it fails exactly when one tenant is enormous."}, {"n": 164, "category": 9, "difficulty": "T", "html": "You sharded by <code>customer_id<\/code> and one customer is 30 percent of the volume. What are your options, ranked?", "answerTitle": "One customer is 30 percent of volume", "answer": "<p>Ranked options:<\/p><ol><li><strong>Give them a dedicated shard.<\/strong> Route that customer&#x27;s key to a shard of their own (a routing exception in the lookup table, which is why a <strong>directory-based<\/strong> router beats pure hashing). Cheap, immediate, and it does not change the model. This is what I would do first, and it is the pattern that later becomes &quot;dedicated infrastructure for enterprise tenants&quot;.<\/li><li><strong>Add a second dimension to the key for that tenant<\/strong> - shard by <code>(tenant_id, sub_key)<\/code> where the sub-key is order id, region or a hash bucket, so the whale is spread over several shards while everyone else stays on one. Correct and scalable; the cost is that queries for that tenant become scatter-gather, so it works only if their queries are naturally scoped by the sub-key too.<\/li><li><strong>Split by entity rather than tenant<\/strong> for the biggest tables - shard <code>orders<\/code> by <code>order_id<\/code> while keeping <code>customer<\/code> by tenant. Solves volume, but breaks tenant-scoped queries and transactions.<\/li><li><strong>Vertical split<\/strong>: move that tenant&#x27;s heaviest feature (event history, documents) to a different store entirely.<\/li><li><strong>Rebalance more finely<\/strong> - many more virtual shards than physical nodes, so the whale&#x27;s shards can be spread across nodes (Q165). Helps with node-level load but not with a single logical shard being too big.<\/li><\/ol><p>The point to make: the moment you have one whale you will have three, so the answer must be a <em>mechanism<\/em> (a routing directory with per-tenant placement) rather than a one-off fix.<\/p>", "source": "answers.md", "search": "you sharded by customer_id and one customer is 30 percent of the volume. what are your options, ranked? ranked options: 1. give them a dedicated shard. route that customer's key to a shard of their own (a routing exception in the lookup table, which is why a directory-based router beats pure hashing). cheap, immediate, and it does not change the model. this is what i would do first, and it is the pattern that later becomes \"dedicated infrastructure for enterprise tenants\". 2. add a second dimension to the key for that tenant - shard by (tenant_id, sub_key) where the sub-key is order id, region or a hash bucket, so the whale is spread over several shards while everyone else stays on one. correct and scalable; the cost is that queries for that tenant become scatter-gather, so it works only if their queries are naturally scoped by the sub-key too. 3. split by entity rather than tenant for the biggest tables - shard orders by order_id while keeping customer by tenant. solves volume, but breaks tenant-scoped queries and transactions. 4. vertical split : move that tenant's heaviest feature (event history, documents) to a different store entirely. 5. rebalance more finely - many more virtual shards than physical nodes, so the whale's shards can be spread across nodes (q165). helps with node-level load but not with a single logical shard being too big. the point to make: the moment you have one whale you will have three, so the answer must be a mechanism (a routing directory with per-tenant placement) rather than a one-off fix."}, {"n": 165, "category": 9, "difficulty": "D", "html": "Resharding a live system: consistent hashing with virtual nodes, double-writing, and how you verify before cutover.", "answerTitle": "Resharding a live system", "answer": "<p>The mechanism that makes it tractable is <strong>consistent hashing with virtual nodes<\/strong>: hash keys onto a ring, place many virtual nodes per physical node, and moving one physical node moves only its virtual nodes&#x27; key ranges - roughly <code>1/N<\/code> of the data instead of rehashing everything. Equivalent in practice: define far more logical shards than physical nodes (say 1024) and map logical to physical in a directory, so rebalancing is a mapping change plus a data move.<\/p><p>The migration itself:<\/p><ol><li><strong>Dual-write<\/strong> the affected key ranges to both old and new placement, or enable CDC from old to new, while all reads still go to the old.<\/li><li><strong>Backfill<\/strong> the historical data for those ranges, in batches with throttling (Q249).<\/li><li><strong>Verify<\/strong>: row counts, checksums per key range, and a shadow-read comparison where a sample of reads is executed against both and diffed - with a metric for mismatches. Do not skip this; it is the only thing that catches an application path that writes to only one side.<\/li><li><strong>Cut over reads<\/strong> per key range, not globally, so blast radius is a fraction of the traffic and rollback is a routing change.<\/li><li><strong>Stop dual writes<\/strong>, then decommission after a retention period long enough to roll back.<\/li><\/ol><p>The properties that make it safe are that every step is reversible, the unit of change is a key range rather than the whole system, and verification runs before and during the cutover, not after.<\/p>", "source": "answers.md", "search": "resharding a live system: consistent hashing with virtual nodes, double-writing, and how you verify before cutover. the mechanism that makes it tractable is consistent hashing with virtual nodes : hash keys onto a ring, place many virtual nodes per physical node, and moving one physical node moves only its virtual nodes' key ranges - roughly 1/n of the data instead of rehashing everything. equivalent in practice: define far more logical shards than physical nodes (say 1024) and map logical to physical in a directory, so rebalancing is a mapping change plus a data move. the migration itself: 1. dual-write the affected key ranges to both old and new placement, or enable cdc from old to new, while all reads still go to the old. 2. backfill the historical data for those ranges, in batches with throttling (q249). 3. verify : row counts, checksums per key range, and a shadow-read comparison where a sample of reads is executed against both and diffed - with a metric for mismatches. do not skip this; it is the only thing that catches an application path that writes to only one side. 4. cut over reads per key range, not globally, so blast radius is a fraction of the traffic and rollback is a routing change. 5. stop dual writes , then decommission after a retention period long enough to roll back. the properties that make it safe are that every step is reversible, the unit of change is a key range rather than the whole system, and verification runs before and during the cutover, not after."}, {"n": 166, "category": 9, "difficulty": "D", "html": "Cross-shard queries, joins and transactions. What do you give up, and what patterns keep you out of that territory?", "answerTitle": "Cross-shard queries, joins and transactions", "answer": "<p>What you give up: a <strong>join<\/strong> across shards has to be executed by the application or a coordinator - fetch from both sides and join in memory, which is unbounded work and no optimizer help. A <strong>query without the shard key<\/strong> becomes scatter-gather: it is sent to all shards, so its latency is the <em>slowest<\/em> shard&#x27;s latency, its failure probability is <code>1-(1-p)^N<\/code>, and it consumes capacity everywhere. <strong>Aggregates and sorting<\/strong> need a merge step, and <code>LIMIT<\/code> becomes &quot;fetch <code>LIMIT<\/code> from each shard, then re-sort&quot;. <strong>Transactions<\/strong> across shards need 2PC (Q102) or a saga; <strong>global uniqueness<\/strong> and cross-shard foreign keys no longer exist.<\/p><p>The patterns that keep you out of that territory:<\/p><ul><li><strong>Choose the key so it is in every hot query<\/strong> (Q163), and treat any query without it as a design smell requiring review.<\/li><li><strong>Replicate small reference tables to every shard<\/strong>, so joins to them stay local.<\/li><li><strong>Denormalize deliberately<\/strong> - carry the few columns from the other aggregate that queries need, accepting the staleness.<\/li><li><strong>Serve cross-cutting queries from a different store<\/strong>: a search index or an analytics warehouse fed by CDC handles &quot;find all orders matching X across all tenants&quot; far better than a scatter-gather (Q216).<\/li><li><strong>Bound the fan-out<\/strong>: allow scatter-gather only for admin and background paths, with a timeout and partial-results semantics, never on a user-facing hot path.<\/li><\/ul>", "source": "answers.md", "search": "cross-shard queries, joins and transactions. what do you give up, and what patterns keep you out of that territory? what you give up: a join across shards has to be executed by the application or a coordinator - fetch from both sides and join in memory, which is unbounded work and no optimizer help. a query without the shard key becomes scatter-gather: it is sent to all shards, so its latency is the slowest shard's latency, its failure probability is 1-(1-p)^n, and it consumes capacity everywhere. aggregates and sorting need a merge step, and limit becomes \"fetch limit from each shard, then re-sort\". transactions across shards need 2pc (q102) or a saga; global uniqueness and cross-shard foreign keys no longer exist. the patterns that keep you out of that territory: - choose the key so it is in every hot query (q163), and treat any query without it as a design smell requiring review. - replicate small reference tables to every shard , so joins to them stay local. - denormalize deli
