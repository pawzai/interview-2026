<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Interview Preparation Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>

      <option value="">Any status</option>
      <option value="unseen">Not marked</option>
      <option value="review">Needs review</option>

<script id="data" type="application/json">{"categories": [{"index": 1, "title": "Data modeling, keys and constraints"}, {"index": 2, "title": "SQL beyond CRUD"}, {"index": 3, "title": "Indexing"}, {"index": 4, "title": "The optimizer and query tuning"}, {"index": 5, "title": "Transactions, isolation and MVCC"}, {"index": 6, "title": "Application-side concurrency and queueing"}, {"index": 7, "title": "Storage internals and durability"}, {"index": 8, "title": "Replication, high availability and recovery"}, {"index": 9, "title": "Partitioning, sharding and distributed SQL"}, {"index": 10, "title": "Caching and Redis"}, {"index": 11, "title": "Document and wide-column stores"}, {"index": 12, "title": "Search, analytics and data platform"}, {"index": 13, "title": "The Java data layer against a real database"}, {"index": 14, "title": "Schema evolution and zero-downtime migrations"}, {"index": 15, "title": "Observability, troubleshooting and capacity"}, {"index": 16, "title": "Security, compliance and cost"}, {"index": 17, "title": "Data architecture design exercises and leadership"}], "questions": [{"n": 1, "category": 1, "difficulty": "C", "html": "Walk up the normal forms to BCNF with one example per level, and state the anomaly each one removes.", "answerTitle": "Normal forms to BCNF", "answer": "<ul><li><strong>1NF<\/strong> - atomic column values, no repeating groups. Removes the &quot;three phone columns&quot; and the comma-separated list that no index can help.<\/li><li><strong>2NF<\/strong> - no partial dependency on part of a composite key. In <code>order_line(order_id, sku, qty, customer_name)<\/code>, <code>customer_name<\/code> depends on <code>order_id<\/code> alone; update it in one row and the rows disagree.<\/li><li><strong>3NF<\/strong> - no transitive dependency. <code>employee(id, dept_id, dept_name)<\/code>: renaming a department means updating every employee row, and a department with no employees cannot exist at all.<\/li><li><strong>BCNF<\/strong> - every determinant is a candidate key. It matters only for overlapping candidate keys, and it is the level teams reach without noticing.<\/li><\/ul><p>The point to make in an interview is that normalization is not aesthetic; each level removes a class of <em>anomaly<\/em> (insert, update, delete) that would otherwise have to be prevented by application discipline, and application discipline is not a constraint.<\/p>", "source": "answers.md", "search": "walk up the normal forms to bcnf with one example per level, and state the anomaly each one removes. - 1nf - atomic column values, no repeating groups. removes the \"three phone columns\" and the comma-separated list that no index can help. - 2nf - no partial dependency on part of a composite key. in order_line(order_id, sku, qty, customer_name), customer_name depends on order_id alone; update it in one row and the rows disagree. - 3nf - no transitive dependency. employee(id, dept_id, dept_name): renaming a department means updating every employee row, and a department with no employees cannot exist at all. - bcnf - every determinant is a candidate key. it matters only for overlapping candidate keys, and it is the level teams reach without noticing. the point to make in an interview is that normalization is not aesthetic; each level removes a class of anomaly (insert, update, delete) that would otherwise have to be prevented by application discipline, and application discipline is not a constraint."}, {"n": 2, "category": 1, "difficulty": "D", "html": "Denormalization: name four distinct techniques, and for each, the invariant you now have to maintain in application code.", "answerTitle": "Denormalization techniques", "answer": "<ol><li><strong>Duplicated column<\/strong> - copy <code>customer_name<\/code> onto <code>order<\/code>. Invariant: keep it in sync, or declare it a snapshot (which is often the truth - the name at the time of the order).<\/li><li><strong>Precomputed aggregate<\/strong> - <code>order.total<\/code>, <code>customer.order_count<\/code>. Invariant: every write path updates it, including deletes and admin scripts.<\/li><li><strong>Collapsed relation<\/strong> - store an address inline rather than in its own table. Invariant: the sub-entity has no independent identity, and you accept you cannot query it globally.<\/li><li><strong>Materialized read model<\/strong> - a whole table shaped for one query. Invariant: a defined staleness bound and a rebuild path.<\/li><\/ol><p>The trade-off is always the same: you convert a join at read time into a write-time obligation plus a correctness risk. Prefer techniques the <em>database<\/em> can enforce - a materialized view, a generated column, a trigger - over ones that live in application memory.<\/p>", "source": "answers.md", "search": "denormalization: name four distinct techniques, and for each, the invariant you now have to maintain in application code. 1. duplicated column - copy customer_name onto order. invariant: keep it in sync, or declare it a snapshot (which is often the truth - the name at the time of the order). 2. precomputed aggregate - order.total, customer.order_count. invariant: every write path updates it, including deletes and admin scripts. 3. collapsed relation - store an address inline rather than in its own table. invariant: the sub-entity has no independent identity, and you accept you cannot query it globally. 4. materialized read model - a whole table shaped for one query. invariant: a defined staleness bound and a rebuild path. the trade-off is always the same: you convert a join at read time into a write-time obligation plus a correctness risk. prefer techniques the database can enforce - a materialized view, a generated column, a trigger - over ones that live in application memory."}, {"n": 3, "category": 1, "difficulty": "T", "html": "&quot;We denormalized for performance&quot; - what evidence would you demand before accepting that, and what is the usual real cause of the slow query?", "answerTitle": "\"We denormalized for performance\"", "answer": "<p>I would ask for the plan before and after, and the actual latency percentiles. In my experience the join was almost never the cost. The usual real causes are a missing or mis-ordered index, N+1 access from an ORM, a row-estimate error producing a nested loop over millions of rows, or a query returning far more data than the screen shows.<\/p><p>The reason to push back is that denormalization is permanent and its cost is paid forever in correctness, while the actual fix is usually a one-line index. I accept denormalization when the join is across a service or storage boundary, when the aggregate is over a volume that cannot be scanned in the latency budget, or when the read shape is genuinely different from the write shape - and then I prefer an explicit read model over quietly duplicated columns.<\/p><p><em>Hook: a query blamed on normalization that turned out to be a row-estimate problem.<\/em><\/p>", "source": "answers.md", "search": "\"we denormalized for performance\" - what evidence would you demand before accepting that, and what is the usual real cause of the slow query? i would ask for the plan before and after, and the actual latency percentiles. in my experience the join was almost never the cost. the usual real causes are a missing or mis-ordered index, n+1 access from an orm, a row-estimate error producing a nested loop over millions of rows, or a query returning far more data than the screen shows. the reason to push back is that denormalization is permanent and its cost is paid forever in correctness, while the actual fix is usually a one-line index. i accept denormalization when the join is across a service or storage boundary, when the aggregate is over a volume that cannot be scanned in the latency budget, or when the read shape is genuinely different from the write shape - and then i prefer an explicit read model over quietly duplicated columns. hook: a query blamed on normalization that turned out to be a row-estimate problem."}, {"n": 4, "category": 1, "difficulty": "D", "html": "Natural versus surrogate primary keys. Give the case where a natural key is clearly right and the case where it is clearly fatal.", "answerTitle": "Natural versus surrogate keys", "answer": "<p>A <strong>surrogate<\/strong> key is my default: it is stable, narrow, meaningless and therefore cannot change when the business changes its mind.<\/p><p>A <strong>natural<\/strong> key is clearly right when the value is genuinely immutable and externally defined and you want the constraint for free - an ISO country code, a currency code, a composite of two surrogate keys in a join table. It is clearly fatal when the &quot;unique, unchanging&quot; business value turns out to be neither: national identifiers get reissued, email addresses change, SKUs get reused after a merger. Rewriting a natural key means rewriting every child row and every foreign key index.<\/p><p>The pragmatic answer is both: a surrogate primary key for referential plumbing, and a unique constraint on the natural key so the database still enforces the business rule.<\/p>", "source": "answers.md", "search": "natural versus surrogate primary keys. give the case where a natural key is clearly right and the case where it is clearly fatal. a surrogate key is my default: it is stable, narrow, meaningless and therefore cannot change when the business changes its mind. a natural key is clearly right when the value is genuinely immutable and externally defined and you want the constraint for free - an iso country code, a currency code, a composite of two surrogate keys in a join table. it is clearly fatal when the \"unique, unchanging\" business value turns out to be neither: national identifiers get reissued, email addresses change, skus get reused after a merger. rewriting a natural key means rewriting every child row and every foreign key index. the pragmatic answer is both: a surrogate primary key for referential plumbing, and a unique constraint on the natural key so the database still enforces the business rule."}, {"n": 5, "category": 1, "difficulty": "D", "html": "Auto-increment/sequence versus UUIDv4 versus UUIDv7/ULID as a primary key. Compare index locality, page splits, storage and replication behavior.", "answerTitle": "Sequence versus UUIDv4 versus UUIDv7", "answer": "<table><thead><tr><th><\/th><th>Sequence/identity<\/th><th>UUIDv4<\/th><th>UUIDv7 / ULID<\/th><\/tr><\/thead><tbody><tr><td>Width<\/td><td>8 bytes<\/td><td>16 bytes<\/td><td>16 bytes<\/td><\/tr><tr><td>Index locality<\/td><td>Perfect, right-hand insert<\/td><td>None - every insert lands on a random page<\/td><td>Near-perfect, time-ordered prefix<\/td><\/tr><tr><td>Page splits<\/td><td>Minimal<\/td><td>Constant, 50/50 splits and low fill<\/td><td>Minimal<\/td><\/tr><tr><td>Generatable client-side<\/td><td>No<\/td><td>Yes<\/td><td>Yes<\/td><\/tr><tr><td>Leaks information<\/td><td>Row count and rate<\/td><td>Nothing<\/td><td>Creation time<\/td><\/tr><\/tbody><\/table><p>Sequences also create a hot right-hand edge of the index, which matters only at extreme insert rates, and they need coordination in a multi-writer or offline-capable system. UUIDv4 buys you client-side generation and merge-ability at the cost of write amplification and a bigger index at every level. UUIDv7 is the modern default when you need client-side generation: you keep locality and lose only the fact that creation time is inferable.<\/p>", "source": "answers.md", "search": "auto-increment/sequence versus uuidv4 versus uuidv7/ulid as a primary key. compare index locality, page splits, storage and replication behavior. sequence/identity uuidv4 uuidv7 / ulid --- --- --- --- width 8 bytes 16 bytes 16 bytes index locality perfect, right-hand insert none - every insert lands on a random page near-perfect, time-ordered prefix page splits minimal constant, 50/50 splits and low fill minimal generatable client-side no yes yes leaks information row count and rate nothing creation time sequences also create a hot right-hand edge of the index, which matters only at extreme insert rates, and they need coordination in a multi-writer or offline-capable system. uuidv4 buys you client-side generation and merge-ability at the cost of write amplification and a bigger index at every level. uuidv7 is the modern default when you need client-side generation: you keep locality and lose only the fact that creation time is inferable."}, {"n": 6, "category": 1, "difficulty": "T", "html": "Why does a random UUID primary key hurt an InnoDB clustered index more than a PostgreSQL heap table, and what does it still cost in PostgreSQL?", "answerTitle": "Random UUID in InnoDB versus PostgreSQL", "answer": "<p>InnoDB stores the table <em>in<\/em> the primary key (a clustered index), and every secondary index stores the primary key as its row pointer. A random primary key therefore scatters the actual row data across the whole tablespace on insert, causing page splits in the data itself, and inflates every secondary index by the key width.<\/p><p>PostgreSQL has a heap: rows are appended wherever there is space regardless of key, so the <em>table<\/em> stays sequential. But the primary key index is still a B-tree receiving random keys, so you get the same index page splits, low fill factor, higher index size, and a working set that no longer fits in <code>shared_buffers<\/code>. Range queries over the key are also useless, and index bloat after churn is worse.<\/p><p>So the InnoDB penalty is larger, but &quot;PostgreSQL doesn&#x27;t care&quot; is wrong - the index and the buffer cache both care.<\/p>", "source": "answers.md", "search": "why does a random uuid primary key hurt an innodb clustered index more than a postgresql heap table, and what does it still cost in postgresql? innodb stores the table in the primary key (a clustered index), and every secondary index stores the primary key as its row pointer. a random primary key therefore scatters the actual row data across the whole tablespace on insert, causing page splits in the data itself, and inflates every secondary index by the key width. postgresql has a heap: rows are appended wherever there is space regardless of key, so the table stays sequential. but the primary key index is still a b-tree receiving random keys, so you get the same index page splits, low fill factor, higher index size, and a working set that no longer fits in shared_buffers. range queries over the key are also useless, and index bloat after churn is worse. so the innodb penalty is larger, but \"postgresql doesn't care\" is wrong - the index and the buffer cache both care."}, {"n": 7, "category": 1, "difficulty": "D", "html": "Composite primary keys versus a surrogate plus a unique constraint. What changes for foreign keys, indexes and ORMs?", "answerTitle": "Composite primary key versus surrogate plus unique constraint", "answer": "<p>A composite key is honest about identity and avoids a pointless column in pure join tables. The costs appear at the edges: every child table repeats all key columns, every foreign key index gets wider, ORMs need an <code>@IdClass<\/code>/<code>@EmbeddedId<\/code> with <code>equals<\/code>/<code>hashCode<\/code> written correctly, and a REST resource identifier becomes a compound value.<\/p><p>A surrogate plus a unique constraint gives narrow foreign keys, trivial ORM mapping and a single-column identifier for URLs, at the cost of an extra column and the possibility that someone forgets the unique constraint - at which point the model silently permits duplicates.<\/p><p>I use composite keys for pure association tables and partitioned tables where the partition key must be in the key, and surrogate keys elsewhere.<\/p>", "source": "answers.md", "search": "composite primary keys versus a surrogate plus a unique constraint. what changes for foreign keys, indexes and orms? a composite key is honest about identity and avoids a pointless column in pure join tables. the costs appear at the edges: every child table repeats all key columns, every foreign key index gets wider, orms need an @idclass/@embeddedid with equals/hashcode written correctly, and a rest resource identifier becomes a compound value. a surrogate plus a unique constraint gives narrow foreign keys, trivial orm mapping and a single-column identifier for urls, at the cost of an extra column and the possibility that someone forgets the unique constraint - at which point the model silently permits duplicates. i use composite keys for pure association tables and partitioned tables where the partition key must be in the key, and surrogate keys elsewhere."}, {"n": 8, "category": 1, "difficulty": "D", "html": "Where do you enforce an invariant - database constraint, application code, or both? Give your rule and the cases that break it.", "answerTitle": "Where to enforce an invariant", "answer": "<p>My rule: <strong>anything that must always be true goes in the database<\/strong>, because the database is the only component every writer passes through. Application code enforces the rules that need context the database does not have.<\/p><p>Concretely, in the database: nullability, uniqueness, referential integrity, value domains (<code>CHECK<\/code>, enums), and mutually exclusive ranges (<code>EXCLUDE<\/code>). In the application: multi-aggregate rules, anything requiring a network call, anything that varies by tenant or feature flag, and anything with a user-facing message that needs to be graceful.<\/p><p>The cases that break the rule are cross-row invariants under concurrency (an application check under Read Committed is not a constraint - see Q85), soft-deleted rows breaking unique constraints (Q13), and constraints so expensive at scale that they must become an asynchronous reconciliation with an alarm. When I remove a constraint for performance I add the reconciliation job in the same change, otherwise the invariant becomes a hope.<\/p>", "source": "answers.md", "search": "where do you enforce an invariant - database constraint, application code, or both? give your rule and the cases that break it. my rule: anything that must always be true goes in the database , because the database is the only component every writer passes through. application code enforces the rules that need context the database does not have. concretely, in the database: nullability, uniqueness, referential integrity, value domains (check, enums), and mutually exclusive ranges (exclude). in the application: multi-aggregate rules, anything requiring a network call, anything that varies by tenant or feature flag, and anything with a user-facing message that needs to be graceful. the cases that break the rule are cross-row invariants under concurrency (an application check under read committed is not a constraint - see q85), soft-deleted rows breaking unique constraints (q13), and constraints so expensive at scale that they must become an asynchronous reconciliation with an alarm. when i remove a constraint for performance i add the reconciliation job in the same change, otherwise the invariant becomes a hope."}, {"n": 9, "category": 1, "difficulty": "D", "html": "Foreign keys in production: the locking they take on writes, the indexes they require, and the argument some teams make for dropping them.", "answerTitle": "Foreign keys in production", "answer": "<p>A foreign key is implemented as two triggers: on child insert/update the parent row is locked with <code>FOR KEY SHARE<\/code>, and on parent delete/key-update the child table is searched. The costs are therefore a lock on the parent row for the duration of the child transaction, a required index on the child column for delete performance, and extra work on every write.<\/p><p>Teams drop them for three reasons: bulk load speed, sharding (a foreign key cannot cross a shard), and migration convenience. The argument is weaker than it sounds - the alternative is orphan rows that you discover during an incident. I keep foreign keys in OLTP, drop them deliberately in analytics and staging tables, and if a shard boundary forces it, I add a reconciliation check with an alert rather than pretending the relationship does not exist.<\/p>", "source": "answers.md", "search": "foreign keys in production: the locking they take on writes, the indexes they require, and the argument some teams make for dropping them. a foreign key is implemented as two triggers: on child insert/update the parent row is locked with for key share, and on parent delete/key-update the child table is searched. the costs are therefore a lock on the parent row for the duration of the child transaction, a required index on the child column for delete performance, and extra work on every write. teams drop them for three reasons: bulk load speed, sharding (a foreign key cannot cross a shard), and migration convenience. the argument is weaker than it sounds - the alternative is orphan rows that you discover during an incident. i keep foreign keys in oltp, drop them deliberately in analytics and staging tables, and if a shard boundary forces it, i add a reconciliation check with an alert rather than pretending the relationship does not exist."}, {"n": 10, "category": 1, "difficulty": "T", "html": "A foreign key with no index on the child column. What operation becomes catastrophically slow, and why does nothing warn you?", "answerTitle": "Missing index on the foreign key child column", "answer": "<p>Deleting or updating the key of a <strong>parent<\/strong> row becomes a full scan of the child table, once per parent row. Nothing warns you because the constraint itself is satisfied - it is only the check that is slow - and because most engines create an index automatically for the <em>primary<\/em> key side but not the <em>referencing<\/em> side.<\/p><p>The visible symptom is a delete of a few hundred parent rows that takes minutes and blocks, or a cascade delete that produces a lock storm across several tables. In PostgreSQL you can find these with a query joining <code>pg_constraint<\/code> against <code>pg_index<\/code> looking for <code>confrelid<\/code> columns with no leading index. I treat &quot;every foreign key column has an index&quot; as a schema lint rule, with an explicit exemption comment where the child table is tiny.<\/p>", "source": "answers.md", "search": "a foreign key with no index on the child column. what operation becomes catastrophically slow, and why does nothing warn you? deleting or updating the key of a parent row becomes a full scan of the child table, once per parent row. nothing warns you because the constraint itself is satisfied - it is only the check that is slow - and because most engines create an index automatically for the primary key side but not the referencing side. the visible symptom is a delete of a few hundred parent rows that takes minutes and blocks, or a cascade delete that produces a lock storm across several tables. in postgresql you can find these with a query joining pg_constraint against pg_index looking for confrelid columns with no leading index. i treat \"every foreign key column has an index\" as a schema lint rule, with an explicit exemption comment where the child table is tiny."}, {"n": 11, "category": 1, "difficulty": "D", "html": "Nullable columns: the three-valued logic consequences, the storage cost, and why &quot;NULL means unknown&quot; is not how most schemas use it.", "answerTitle": "Nullable columns", "answer": "<p>Three-valued logic is the real cost: <code>NULL = NULL<\/code> is unknown, <code>NOT IN<\/code> with a NULL in the list returns no rows (Q24), <code>COUNT(col)<\/code> skips nulls while <code>COUNT(*)<\/code> does not, and unique constraints permit multiple NULLs in standard SQL. Aggregates and joins quietly change meaning.<\/p><p>Storage-wise a null is cheap in PostgreSQL - a bit in the tuple&#x27;s null bitmap, and the column occupies no space - so &quot;nulls waste space&quot; is not the argument.<\/p><p>The real problem is semantic: NULL means &quot;unknown&quot;, but most schemas use it for &quot;not applicable&quot;, &quot;not yet supplied&quot; and &quot;the default&quot; simultaneously, so no query can distinguish them. My preference is to make columns <code>NOT NULL<\/code> with a default wherever the value is genuinely always present, and to split a group of mutually exclusive nullable columns into a separate table or a discriminated design rather than encoding the state in which columns happen to be null.<\/p>", "source": "answers.md", "search": "nullable columns: the three-valued logic consequences, the storage cost, and why \"null means unknown\" is not how most schemas use it. three-valued logic is the real cost: null = null is unknown, not in with a null in the list returns no rows (q24), count(col) skips nulls while count( ) does not, and unique constraints permit multiple nulls in standard sql. aggregates and joins quietly change meaning. storage-wise a null is cheap in postgresql - a bit in the tuple's null bitmap, and the column occupies no space - so \"nulls waste space\" is not the argument. the real problem is semantic: null means \"unknown\", but most schemas use it for \"not applicable\", \"not yet supplied\" and \"the default\" simultaneously, so no query can distinguish them. my preference is to make columns not null with a default wherever the value is genuinely always present, and to split a group of mutually exclusive nullable columns into a separate table or a discriminated design rather than encoding the state in which columns happen to be null."}, {"n": 12, "category": 1, "difficulty": "D", "html": "<code>CHECK<\/code> constraints, <code>EXCLUDE<\/code> constraints and unique partial indexes. Give a use case each that the others cannot express.", "answerTitle": "`CHECK`, `EXCLUDE` and unique partial indexes", "answer": "<ul><li><strong><code>CHECK<\/code><\/strong> constrains a single row: <code>CHECK (end_date &gt; start_date)<\/code>, <code>CHECK (status IN (...))<\/code>, <code>CHECK (amount &gt;= 0)<\/code>. It cannot see other rows.<\/li><li><strong>Unique partial index<\/strong> constrains a set of rows conditionally: &quot;only one active subscription per customer&quot; is <code>CREATE UNIQUE INDEX ON subscription (customer_id) WHERE status = &#x27;ACTIVE&#x27;<\/code>. A plain unique constraint cannot express the condition.<\/li><li><strong><code>EXCLUDE<\/code><\/strong> constrains rows against each other with an arbitrary operator, which uniqueness cannot: &quot;no two bookings for the same room may overlap in time&quot; is <code>EXCLUDE USING gist (room_id WITH =, during WITH &amp;&amp;)<\/code>. This is the only one of the three that solves the double-booking race correctly at the storage layer.<\/li><\/ul><p>The last point is the interview payload: an overlap check written as <code>SELECT<\/code> then <code>INSERT<\/code> in application code is a write-skew bug (Q84) and an <code>EXCLUDE<\/code> constraint is not.<\/p>", "source": "answers.md", "search": "check constraints, exclude constraints and unique partial indexes. give a use case each that the others cannot express. - check constrains a single row: check (end_date start_date), check (status in (...)), check (amount = 0). it cannot see other rows. - unique partial index constrains a set of rows conditionally: \"only one active subscription per customer\" is create unique index on subscription (customer_id) where status = 'active'. a plain unique constraint cannot express the condition. - exclude constrains rows against each other with an arbitrary operator, which uniqueness cannot: \"no two bookings for the same room may overlap in time\" is exclude using gist (room_id with =, during with &&). this is the only one of the three that solves the double-booking race correctly at the storage layer. the last point is the interview payload: an overlap check written as select then insert in application code is a write-skew bug (q84) and an exclude constraint is not."}, {"n": 13, "category": 1, "difficulty": "D", "html": "Soft delete: the four ways to implement it, and what each one does to unique constraints, foreign keys and query correctness.", "answerTitle": "Soft delete", "answer": "<p>The four implementations, with what each breaks:<\/p><ol><li><strong><code>deleted_at timestamptz NULL<\/code><\/strong> - the common one. Every query must add <code>WHERE deleted_at IS NULL<\/code>, and forgetting once is a data leak. Unique constraints now block reuse of a value held by a deleted row.<\/li><li><strong><code>is_deleted boolean<\/code><\/strong> - the same, with less information, and a low-cardinality column that misleads the planner.<\/li><li><strong>Move to an archive table<\/strong> - deletes are real deletes plus an insert. Constraints, indexes and query correctness stay clean; the cost is a second table and losing foreign keys into the archive.<\/li><li><strong>Temporal/versioned table<\/strong> (Q14) - the row is closed with an end timestamp. The most correct and the most work.<\/li><\/ol><p>Fixes for the classic problems: make uniqueness partial (<code>UNIQUE (email) WHERE deleted_at IS NULL<\/code>) or include the deletion marker in the key using a sentinel rather than NULL; expose only views that filter, and grant the application access to the views rather than the tables; and confirm with the business whether they want <em>undelete<\/em> or <em>audit history<\/em>, because they usually want the second, and an archive table gives it more honestly.<\/p>", "source": "answers.md", "search": "soft delete: the four ways to implement it, and what each one does to unique constraints, foreign keys and query correctness. the four implementations, with what each breaks: 1. deleted_at timestamptz null - the common one. every query must add where deleted_at is null, and forgetting once is a data leak. unique constraints now block reuse of a value held by a deleted row. 2. is_deleted boolean - the same, with less information, and a low-cardinality column that misleads the planner. 3. move to an archive table - deletes are real deletes plus an insert. constraints, indexes and query correctness stay clean; the cost is a second table and losing foreign keys into the archive. 4. temporal/versioned table (q14) - the row is closed with an end timestamp. the most correct and the most work. fixes for the classic problems: make uniqueness partial (unique (email) where deleted_at is null) or include the deletion marker in the key using a sentinel rather than null; expose only views that filter, and grant the application access to the views rather than the tables; and confirm with the business whether they want undelete or audit history , because they usually want the second, and an archive table gives it more honestly."}, {"n": 14, "category": 1, "difficulty": "D", "html": "Temporal data - valid time versus transaction time. How do you model a bitemporal table and what does querying &quot;as of&quot; cost?", "answerTitle": "Bitemporal modeling", "answer": "<p><strong>Valid time<\/strong> is when the fact was true in the world; <strong>transaction time<\/strong> is when the database believed it. Bitemporal tables keep both, as two ranges: <code>valid_from/valid_to<\/code> and <code>system_from/system_to<\/code> (PostgreSQL range types plus <code>EXCLUDE<\/code> constraints make this enforceable).<\/p><p>A correction to a past salary changes valid time; the record of when you learned about it is transaction time. That combination answers both &quot;what was their salary in March&quot; and &quot;what did we think their March salary was when we ran the March payroll&quot; - which is the question auditors and regulators actually ask.<\/p><p>The costs are real: every &quot;current&quot; query needs a predicate on both ranges (so index on the ranges, or maintain a current-row view), updates become close-and-insert, and row counts grow with churn. I would only pay for it where correction history has legal or financial consequences - payroll, pricing, insurance, billing - and use a plain audit table everywhere else.<\/p>", "source": "answers.md", "search": "temporal data - valid time versus transaction time. how do you model a bitemporal table and what does querying \"as of\" cost? valid time is when the fact was true in the world; transaction time is when the database believed it. bitemporal tables keep both, as two ranges: valid_from/valid_to and system_from/system_to (postgresql range types plus exclude constraints make this enforceable). a correction to a past salary changes valid time; the record of when you learned about it is transaction time. that combination answers both \"what was their salary in march\" and \"what did we think their march salary was when we ran the march payroll\" - which is the question auditors and regulators actually ask. the costs are real: every \"current\" query needs a predicate on both ranges (so index on the ranges, or maintain a current-row view), updates become close-and-insert, and row counts grow with churn. i would only pay for it where correction history has legal or financial consequences - payroll, pricing, insurance, billing - and use a plain audit table everywhere else."}, {"n": 15, "category": 1, "difficulty": "T", "html": "Storing money, timestamps and enumerations. Give the wrong choice most teams make for each and the concrete bug it produces.", "answerTitle": "Money, timestamps and enumerations", "answer": "<ul><li><strong>Money as <code>float<\/code>/<code>double<\/code><\/strong> - binary floating point cannot represent 0.10, so sums drift and reconciliations fail by pennies that nobody can explain. Use <code>numeric<\/code>/<code>DECIMAL<\/code> with an explicit scale, or an integer count of minor units, and always store the currency alongside the amount.<\/li><li><strong>Timestamps as <code>timestamp<\/code> without time zone<\/strong>, or as local time - the classic bug appears at a DST transition, where an hour repeats and ordering breaks, or when a second region comes online. Store <code>timestamptz<\/code> (an absolute instant) and convert at the edges.<\/li><li><strong>Enumerations as free <code>varchar<\/code><\/strong> - you get &#x27;ACTIVE&#x27;, &#x27;Active&#x27; and &#x27;active&#x27; within a year. The alternatives are a database enum type (fast, compact, but altering it is a schema migration and removing a value is very awkward) or a lookup table with a foreign key (flexible, joinable, attribute-carrying). I default to a lookup table for domain concepts, a <code>CHECK<\/code> constraint for small fixed technical sets.<\/li><\/ul>", "source": "answers.md", "search": "storing money, timestamps and enumerations. give the wrong choice most teams make for each and the concrete bug it produces. - money as float/double - binary floating point cannot represent 0.10, so sums drift and reconciliations fail by pennies that nobody can explain. use numeric/decimal with an explicit scale, or an integer count of minor units, and always store the currency alongside the amount. - timestamps as timestamp without time zone , or as local time - the classic bug appears at a dst transition, where an hour repeats and ordering breaks, or when a second region comes online. store timestamptz (an absolute instant) and convert at the edges. - enumerations as free varchar - you get 'active', 'active' and 'active' within a year. the alternatives are a database enum type (fast, compact, but altering it is a schema migration and removing a value is very awkward) or a lookup table with a foreign key (flexible, joinable, attribute-carrying). i default to a lookup table for domain concepts, a check constraint for small fixed technical sets."}, {"n": 16, "category": 1, "difficulty": "D", "html": "<code>TIMESTAMP WITH TIME ZONE<\/code> in PostgreSQL does not store a time zone. Explain what it does store and how to model a future appointment correctly.", "answerTitle": "`timestamptz` does not store a time zone", "answer": "<p><code>timestamptz<\/code> stores a UTC instant in eight bytes. On input it converts <em>from<\/em> the session <code>TimeZone<\/code>; on output it converts <em>to<\/em> it. The zone is never stored, so it is the correct type for anything that happened - events, audit rows, created/updated timestamps.<\/p><p>A future appointment is a different kind of value. &quot;9 a.m. on 14 March in Berlin&quot; must survive a change to the German time zone rules, and an instant will not: if the government moves the transition, the instant now points at 8 a.m. So you store the local wall-clock time (<code>timestamp<\/code> without zone) plus the IANA zone identifier (<code>Europe/Berlin<\/code>), and resolve to an instant when you need to schedule or compare. Storing the resolved instant as well, as a derived column you can rebuild from the tzdata release, is a reasonable optimization.<\/p>", "source": "answers.md", "search": "timestamp with time zone in postgresql does not store a time zone. explain what it does store and how to model a future appointment correctly. timestamptz stores a utc instant in eight bytes. on input it converts from the session timezone; on output it converts to it. the zone is never stored, so it is the correct type for anything that happened - events, audit rows, created/updated timestamps. a future appointment is a different kind of value. \"9 a.m. on 14 march in berlin\" must survive a change to the german time zone rules, and an instant will not: if the government moves the transition, the instant now points at 8 a.m. so you store the local wall-clock time (timestamp without zone) plus the iana zone identifier (europe/berlin), and resolve to an instant when you need to schedule or compare. storing the resolved instant as well, as a derived column you can rebuild from the tzdata release, is a reasonable optimization."}, {"n": 17, "category": 1, "difficulty": "D", "html": "The EAV pattern: when is it defensible, what does it cost in the optimizer, and what are the alternatives?", "answerTitle": "The EAV pattern", "answer": "<p>Entity-Attribute-Value stores <code>(entity_id, attribute, value)<\/code> rows instead of columns. It is defensible when attributes are genuinely user-defined at runtime and unbounded - a product catalogue where each category has its own specifications, a form builder, a lab-results system.<\/p><p>The optimizer cost is severe. Every attribute is a self-join, so a five-attribute filter is a five-way join; the value column is text so there are no useful statistics or type-correct comparisons; selectivity estimates are wrong everywhere; and no constraint can express &quot;price must be numeric and positive&quot;.<\/p><p>The alternatives, in the order I would try them: a JSONB column with a GIN index and a <code>CHECK<\/code> on the required keys (which keeps one row per entity and gives containment queries); a table per entity type where the set of types is bounded; a sparse wide table where types share most attributes; or a document store if this is the <em>whole<\/em> domain rather than a corner of it. Where EAV survives, I keep the hot, queryable attributes as real columns and let EAV hold the tail.<\/p>", "source": "answers.md", "search": "the eav pattern: when is it defensible, what does it cost in the optimizer, and what are the alternatives? entity-attribute-value stores (entity_id, attribute, value) rows instead of columns. it is defensible when attributes are genuinely user-defined at runtime and unbounded - a product catalogue where each category has its own specifications, a form builder, a lab-results system. the optimizer cost is severe. every attribute is a self-join, so a five-attribute filter is a five-way join; the value column is text so there are no useful statistics or type-correct comparisons; selectivity estimates are wrong everywhere; and no constraint can express \"price must be numeric and positive\". the alternatives, in the order i would try them: a jsonb column with a gin index and a check on the required keys (which keeps one row per entity and gives containment queries); a table per entity type where the set of types is bounded; a sparse wide table where types share most attributes; or a document store if this is the whole domain rather than a corner of it. where eav survives, i keep the hot, queryable attributes as real columns and let eav hold the tail."}, {"n": 18, "category": 1, "difficulty": "D", "html": "JSONB as a column type: what you gain, what you lose, how it is indexed, and the rule you use to decide between a column and a key in a document.", "answerTitle": "JSONB as a column type", "answer": "<p>You gain schema flexibility, one round trip for a whole aggregate, and containment/path queries with a GIN index (<code>WHERE doc @&gt; &#x27;{&quot;status&quot;:&quot;ACTIVE&quot;}&#x27;<\/code>). <code>jsonb<\/code> is parsed and stored in a binary form, so it is slower to write and faster to query than <code>json<\/code>, and it does not preserve key order or duplicates.<\/p><p>You lose per-field constraints and defaults, per-field statistics (so the planner guesses selectivity for a path predicate, which is the most common cause of a bad plan on a JSONB table), cheap type changes, and column-level grants. Values also get TOASTed once large (Q129), so touching one field can mean detoasting the whole document.<\/p><p>My rule: a field is a <strong>column<\/strong> if it is queried, filtered, sorted, constrained, or referenced by another table; it lives in the <strong>document<\/strong> if it is a payload read as a whole, sparse, caller-defined, or a schemaless third-party blob. Expression indexes on specific paths, or PostgreSQL 12+ generated columns extracting a path, are the middle ground when a document field becomes hot.<\/p>", "source": "answers.md", "search": "jsonb as a column type: what you gain, what you lose, how it is indexed, and the rule you use to decide between a column and a key in a document. you gain schema flexibility, one round trip for a whole aggregate, and containment/path queries with a gin index (where doc @ '{\"status\":\"active\"}'). jsonb is parsed and stored in a binary form, so it is slower to write and faster to query than json, and it does not preserve key order or duplicates. you lose per-field constraints and defaults, per-field statistics (so the planner guesses selectivity for a path predicate, which is the most common cause of a bad plan on a jsonb table), cheap type changes, and column-level grants. values also get toasted once large (q129), so touching one field can mean detoasting the whole document. my rule: a field is a column if it is queried, filtered, sorted, constrained, or referenced by another table; it lives in the document if it is a payload read as a whole, sparse, caller-defined, or a schemaless third-party blob. expression indexes on specific paths, or postgresql 12+ generated columns extracting a path, are the middle ground when a document field becomes hot."}, {"n": 19, "category": 1, "difficulty": "T", "html": "A table with 180 columns, most of them null. What is wrong beyond aesthetics, and what does it do to the storage layer?", "answerTitle": "180 columns, mostly null", "answer": "<p>Beyond aesthetics, the concrete problems are: the row exceeds what fits neatly in an 8 KB page once a few text fields are populated, so you get TOASTing and extra IO; every <code>SELECT *<\/code> reads the full tuple; the null bitmap grows; and <code>UPDATE<\/code> writes a whole new row version regardless of how few columns changed, so write amplification is proportional to the <em>table&#x27;s<\/em> width, not the change.<\/p><p>Structurally, the mostly-null groups are almost always a subtype relationship or an optional one-to-one that was flattened, so no constraint can say &quot;these six columns are all null or all present&quot;. The planner also has 180 columns of statistics to keep and correlation it cannot model.<\/p><p>The fix is to split by lifecycle and by subtype: hot narrow core table, one table per optional group, and JSONB for the genuinely sparse tail. Splitting also lets the hot table stay in cache, which is usually where the measurable win comes from.<\/p>", "source": "answers.md", "search": "a table with 180 columns, most of them null. what is wrong beyond aesthetics, and what does it do to the storage layer? beyond aesthetics, the concrete problems are: the row exceeds what fits neatly in an 8 kb page once a few text fields are populated, so you get toasting and extra io; every select reads the full tuple; the null bitmap grows; and update writes a whole new row version regardless of how few columns changed, so write amplification is proportional to the table's width, not the change. structurally, the mostly-null groups are almost always a subtype relationship or an optional one-to-one that was flattened, so no constraint can say \"these six columns are all null or all present\". the planner also has 180 columns of statistics to keep and correlation it cannot model. the fix is to split by lifecycle and by subtype: hot narrow core table, one table per optional group, and jsonb for the genuinely sparse tail. splitting also lets the hot table stay in cache, which is usually where the measurable win comes from."}, {"n": 20, "category": 1, "difficulty": "A", "html": "Single-table inheritance, class-table inheritance and concrete-table inheritance. Which do you default to and why?", "answerTitle": "Inheritance mapping strategies", "answer": "<ul><li><strong>Single table<\/strong> (one table, discriminator, all subtype columns nullable) - fastest, no joins, polymorphic queries are trivial. Cost: subtype columns cannot be <code>NOT NULL<\/code>, the table grows wide, and the schema does not express the model.<\/li><li><strong>Class table<\/strong> (a base table plus one table per subtype, joined on the shared key) - fully normalized, constraints work per subtype. Cost: every read is a join, polymorphic queries join everything, inserts touch two tables.<\/li><li><strong>Concrete table<\/strong> (one complete table per subtype, no base table) - no joins, constraints work. Cost: polymorphic queries are a <code>UNION ALL<\/code>, shared columns are duplicated, and a shared identity across subtypes needs an external sequence.<\/li><\/ul><p>I default to <strong>single table<\/strong> when the subtypes differ by a handful of columns and are queried polymorphically, and <strong>class table<\/strong> when subtypes have substantial independent state and are usually queried by concrete type. Concrete-table is a fit when the subtypes barely interact, which usually means they should not have shared a hierarchy at all.<\/p>", "source": "answers.md", "search": "single-table inheritance, class-table inheritance and concrete-table inheritance. which do you default to and why? - single table (one table, discriminator, all subtype columns nullable) - fastest, no joins, polymorphic queries are trivial. cost: subtype columns cannot be not null, the table grows wide, and the schema does not express the model. - class table (a base table plus one table per subtype, joined on the shared key) - fully normalized, constraints work per subtype. cost: every read is a join, polymorphic queries join everything, inserts touch two tables. - concrete table (one complete table per subtype, no base table) - no joins, constraints work. cost: polymorphic queries are a union all, shared columns are duplicated, and a shared identity across subtypes needs an external sequence. i default to single table when the subtypes differ by a handful of columns and are queried polymorphically, and class table when subtypes have substantial independent state and are usually queried by concrete type. concrete-table is a fit when the subtypes barely interact, which usually means they should not have shared a hierarchy at all."}, {"n": 21, "category": 1, "difficulty": "A", "html": "You inherit a schema with no foreign keys, no constraints and <code>varchar(255)<\/code> everywhere. What do you change first, and how do you sequence it without stopping feature work?", "answerTitle": "Inheriting a schema with no constraints", "answer": "<p>First I measure rather than reform. I would inventory the actual violations - orphan rows, duplicate &quot;unique&quot; values, out-of-domain statuses - because the number decides everything. Then, in order:<\/p><ol><li><strong>Stop the bleeding on new data<\/strong>: add constraints as <code>NOT VALID<\/code> (foreign keys and checks can be added without scanning), so all <em>new<\/em> rows are enforced while historical violations are tolerated. This is cheap, non-blocking and immediately useful.<\/li><li><strong>Add uniqueness and foreign keys on the tables that cause incidents<\/strong>, prioritized by the on-call log rather than by the model&#x27;s ugliness.<\/li><li><strong>Clean the historical violations<\/strong> with backfill jobs owned by the team that owns the data, then <code>VALIDATE CONSTRAINT<\/code> (a lighter lock than adding it validated).<\/li><li><strong>Type and width corrections<\/strong> last, since they need shadow columns and backfills (Q248), and <code>varchar(255)<\/code> is annoying rather than dangerous.<\/li><\/ol><p>The sequencing rule I would sell to the business is that every constraint is added on the back of a feature that touches that table, so remediation rides with delivery and never becomes a project that gets cancelled at 60 percent.<\/p><p><em>Hook: a legacy schema you tightened incrementally, and the first constraint that caught a real bug.<\/em><\/p>", "source": "answers.md", "search": "you inherit a schema with no foreign keys, no constraints and varchar(255) everywhere. what do you change first, and how do you sequence it without stopping feature work? first i measure rather than reform. i would inventory the actual violations - orphan rows, duplicate \"unique\" values, out-of-domain statuses - because the number decides everything. then, in order: 1. stop the bleeding on new data : add constraints as not valid (foreign keys and checks can be added without scanning), so all new rows are enforced while historical violations are tolerated. this is cheap, non-blocking and immediately useful. 2. add uniqueness and foreign keys on the tables that cause incidents , prioritized by the on-call log rather than by the model's ugliness. 3. clean the historical violations with backfill jobs owned by the team that owns the data, then validate constraint (a lighter lock than adding it validated). 4. type and width corrections last, since they need shadow columns and backfills (q248), and varchar(255) is annoying rather than dangerous. the sequencing rule i would sell to the business is that every constraint is added on the back of a feature that touches that table, so remediation rides with delivery and never becomes a project that gets cancelled at 60 percent. hook: a legacy schema you tightened incrementally, and the first constraint that caught a real bug."}, {"n": 22, "category": 2, "difficulty": "C", "html": "<code>INNER<\/code>, <code>LEFT<\/code>, <code>RIGHT<\/code>, <code>FULL<\/code> and <code>CROSS<\/code> joins, plus semi-join and anti-join. Which SQL constructs produce the last two?", "answerTitle": "Join types, semi-join and anti-join", "answer": "<p><code>INNER<\/code> keeps matching pairs; <code>LEFT<\/code>/<code>RIGHT<\/code> keep all rows of one side, padding with NULLs; <code>FULL<\/code> keeps both; <code>CROSS<\/code> is the Cartesian product.<\/p><p>A <strong>semi-join<\/strong> returns rows from the left side that have <em>at least one<\/em> match, without duplicating them and without exposing the right side&#x27;s columns - written as <code>EXISTS<\/code> or <code>IN<\/code>. An <strong>anti-join<\/strong> returns left rows with <em>no<\/em> match - written as <code>NOT EXISTS<\/code>, or <code>LEFT JOIN ... WHERE right.key IS NULL<\/code>.<\/p><p>The distinction matters because they are separate physical operators in the plan (<code>Hash Semi Join<\/code>, <code>Hash Anti Join<\/code>) and because an inner join used where a semi-join was meant silently multiplies rows when the right side has duplicates - the most common cause of inflated <code>SUM<\/code> values in reports.<\/p>", "source": "answers.md", "search": "inner, left, right, full and cross joins, plus semi-join and anti-join. which sql constructs produce the last two? inner keeps matching pairs; left/right keep all rows of one side, padding with nulls; full keeps both; cross is the cartesian product. a semi-join returns rows from the left side that have at least one match, without duplicating them and without exposing the right side's columns - written as exists or in. an anti-join returns left rows with no match - written as not exists, or left join ... where right.key is null. the distinction matters because they are separate physical operators in the plan (hash semi join, hash anti join) and because an inner join used where a semi-join was meant silently multiplies rows when the right side has duplicates - the most common cause of inflated sum values in reports."}, {"n": 23, "category": 2, "difficulty": "T", "html": "Moving a predicate from the <code>ON<\/code> clause to the <code>WHERE<\/code> clause of a <code>LEFT JOIN<\/code> changes the result. Explain exactly why.", "answerTitle": "Predicate in `ON` versus `WHERE` on a `LEFT JOIN`", "answer": "<p>The <code>ON<\/code> clause decides which right-hand rows are <em>eligible to match<\/em>; the outer join then adds NULL-extended rows for unmatched left rows. The <code>WHERE<\/code> clause runs <em>after<\/em> that, on the joined result.<\/p><p>So <code>LEFT JOIN payment p ON p.order_id = o.id AND p.status = &#x27;OK&#x27;<\/code> returns every order, with NULL payment columns where there is no successful payment. Moving <code>p.status = &#x27;OK&#x27;<\/code> to <code>WHERE<\/code> filters out the NULL-extended rows too - because <code>NULL = &#x27;OK&#x27;<\/code> is unknown - and silently converts the query into an inner join.<\/p><p>The rule: a predicate on the <em>nullable<\/em> side belongs in <code>ON<\/code>; a predicate on the preserved side belongs in <code>WHERE<\/code>. The exception is <code>WHERE p.id IS NULL<\/code>, which is the anti-join idiom and is deliberately applied afterwards.<\/p>", "source": "answers.md", "search": "moving a predicate from the on clause to the where clause of a left join changes the result. explain exactly why. the on clause decides which right-hand rows are eligible to match ; the outer join then adds null-extended rows for unmatched left rows. the where clause runs after that, on the joined result. so left join payment p on p.order_id = o.id and p.status = 'ok' returns every order, with null payment columns where there is no successful payment. moving p.status = 'ok' to where filters out the null-extended rows too - because null = 'ok' is unknown - and silently converts the query into an inner join. the rule: a predicate on the nullable side belongs in on; a predicate on the preserved side belongs in where. the exception is where p.id is null, which is the anti-join idiom and is deliberately applied afterwards."}, {"n": 24, "category": 2, "difficulty": "D", "html": "<code>NOT IN<\/code>, <code>NOT EXISTS<\/code> and <code>LEFT JOIN ... IS NULL<\/code> for an anti-join. Which is wrong in the presence of NULLs, and which does the optimizer handle best?", "answerTitle": "`NOT IN`, `NOT EXISTS`, `LEFT JOIN ... IS NULL`", "answer": "<p><code>NOT IN<\/code> is the wrong one. If the subquery returns a single NULL, the whole predicate evaluates to unknown for every row and the query returns <em>nothing<\/em> - <code>x NOT IN (1, NULL)<\/code> is <code>x &lt;&gt; 1 AND x &lt;&gt; NULL<\/code>, which can never be true. This bug survives testing because it only appears once a NULL arrives.<\/p><p><code>NOT EXISTS<\/code> has correct NULL semantics and is what I use. The planner turns it into a hash anti-join, which is the same physical operator as the <code>LEFT JOIN ... IS NULL<\/code> form, so their performance is usually identical in PostgreSQL; <code>NOT EXISTS<\/code> reads better and does not risk column-name ambiguity.<\/p><p>Caveat for other engines: older MySQL versions optimized these very differently, and Oracle needs the column declared <code>NOT NULL<\/code> (or an explicit filter) before it can use the anti-join transformation with <code>NOT IN<\/code>.<\/p>", "source": "answers.md", "search": "not in, not exists and left join ... is null for an anti-join. which is wrong in the presence of nulls, and which does the optimizer handle best? not in is the wrong one. if the subquery returns a single null, the whole predicate evaluates to unknown for every row and the query returns nothing - x not in (1, null) is x < 1 and x < null, which can never be true. this bug survives testing because it only appears once a null arrives. not exists has correct null semantics and is what i use. the planner turns it into a hash anti-join, which is the same physical operator as the left join ... is null form, so their performance is usually identical in postgresql; not exists reads better and does not risk column-name ambiguity. caveat for other engines: older mysql versions optimized these very differently, and oracle needs the column declared not null (or an explicit filter) before it can use the anti-join transformation with not in."}, {"n": 25, "category": 2, "difficulty": "D", "html": "<code>UNION<\/code> versus <code>UNION ALL<\/code> versus <code>OR<\/code> in a <code>WHERE<\/code> clause. When is rewriting an <code>OR<\/code> as a <code>UNION ALL<\/code> a real optimization?", "answerTitle": "`UNION`, `UNION ALL` and `OR`", "answer": "<p><code>UNION<\/code> deduplicates, which means a sort or hash over the whole result - so use <code>UNION ALL<\/code> unless you actually need distinct rows and cannot guarantee them structurally.<\/p><p>Rewriting an <code>OR<\/code> as <code>UNION ALL<\/code> is a real optimization when the two branches can each use a <em>different<\/em> index and the results are disjoint: <code>WHERE email = ? OR phone = ?<\/code> may produce a full scan, while two indexed lookups combined with <code>UNION<\/code> are two page reads. PostgreSQL often does this itself with a <strong>bitmap OR<\/strong> over two indexes, so check the plan first; MySQL&#x27;s index merge is less reliable, and this rewrite pays off more often there.<\/p><p>The rewrite hurts when the branches overlap heavily (you now need <code>UNION<\/code> and its dedup cost), when the query has <code>ORDER BY ... LIMIT<\/code> (each branch has to be sorted), or when the OR is over the same column and could just be an <code>IN<\/code> list.<\/p>", "source": "answers.md", "search": "union versus union all versus or in a where clause. when is rewriting an or as a union all a real optimization? union deduplicates, which means a sort or hash over the whole result - so use union all unless you actually need distinct rows and cannot guarantee them structurally. rewriting an or as union all is a real optimization when the two branches can each use a different index and the results are disjoint: where email = ? or phone = ? may produce a full scan, while two indexed lookups combined with union are two page reads. postgresql often does this itself with a bitmap or over two indexes, so check the plan first; mysql's index merge is less reliable, and this rewrite pays off more often there. the rewrite hurts when the branches overlap heavily (you now need union and its dedup cost), when the query has order by ... limit (each branch has to be sorted), or when the or is over the same column and could just be an in list."}, {"n": 26, "category": 2, "difficulty": "D", "html": "Logical query processing order (<code>FROM<\/code>, <code>WHERE<\/code>, <code>GROUP BY<\/code>, <code>HAVING<\/code>, <code>SELECT<\/code>, <code>ORDER BY<\/code>, <code>LIMIT<\/code>) and the practical consequences - why you cannot reference a <code>SELECT<\/code> alias in <code>WHERE<\/code>.", "answerTitle": "Logical processing order", "answer": "<p><code>FROM<\/code> and joins, then <code>WHERE<\/code>, then <code>GROUP BY<\/code>, then aggregate functions, then <code>HAVING<\/code>, then window functions, then <code>SELECT<\/code> (including aliases), then <code>DISTINCT<\/code>, then <code>ORDER BY<\/code>, then <code>LIMIT<\/code>/<code>OFFSET<\/code>.<\/p><p>The consequences: you cannot reference a <code>SELECT<\/code> alias in <code>WHERE<\/code> or <code>GROUP BY<\/code> (the alias does not exist yet) but you can in <code>ORDER BY<\/code>; you cannot filter on an aggregate in <code>WHERE<\/code>; and you cannot filter on a window function anywhere except a wrapping subquery, because windows are computed after <code>HAVING<\/code> (which is exactly why &quot;top N per group&quot; needs a subquery - Q30).<\/p><p>This is the <em>logical<\/em> order. The optimizer is free to execute in any order that yields the same result, which is why a <code>WHERE<\/code> predicate can be pushed below a join and a <code>LIMIT<\/code> can stop a sort early.<\/p>", "source": "answers.md", "search": "logical query processing order (from, where, group by, having, select, order by, limit) and the practical consequences - why you cannot reference a select alias in where. from and joins, then where, then group by, then aggregate functions, then having, then window functions, then select (including aliases), then distinct, then order by, then limit/offset. the consequences: you cannot reference a select alias in where or group by (the alias does not exist yet) but you can in order by; you cannot filter on an aggregate in where; and you cannot filter on a window function anywhere except a wrapping subquery, because windows are computed after having (which is exactly why \"top n per group\" needs a subquery - q30). this is the logical order. the optimizer is free to execute in any order that yields the same result, which is why a where predicate can be pushed below a join and a limit can stop a sort early."}, {"n": 27, "category": 2, "difficulty": "D", "html": "<code>HAVING<\/code> versus <code>WHERE<\/code> versus a filtered aggregate (<code>COUNT(*) FILTER (WHERE ...)<\/code>). Which do you reach for and why?", "answerTitle": "`HAVING` versus `WHERE` versus `FILTER`", "answer": "<p><code>WHERE<\/code> filters rows before grouping and can use indexes; <code>HAVING<\/code> filters groups after aggregation and cannot. Putting a non-aggregate predicate in <code>HAVING<\/code> is therefore both slower and misleading - PostgreSQL will often push it down anyway, but the intent is wrong.<\/p><p><code>COUNT(*) FILTER (WHERE status = &#x27;PAID&#x27;)<\/code> is the one I reach for most, because it lets a single pass compute several conditional aggregates side by side:<\/p><pre><code class=\"lang-sql\">SELECT customer_id,\n       count(*)                                   AS orders,\n       count(*) FILTER (WHERE status = &#x27;PAID&#x27;)    AS paid,\n       sum(total) FILTER (WHERE created_at &gt; now() - interval &#x27;30 days&#x27;) AS recent_value\nFROM   orders GROUP BY customer_id;<\/code><\/pre><p>The alternative - three self-joined subqueries, or <code>SUM(CASE WHEN ... THEN 1 ELSE 0 END)<\/code> - scans repeatedly or reads worse. <code>FILTER<\/code> is standard SQL and supported by PostgreSQL and SQLite; on MySQL and SQL Server you fall back to the <code>CASE<\/code> form.<\/p>", "source": "answers.md", "search": "having versus where versus a filtered aggregate (count( ) filter (where ...)). which do you reach for and why? where filters rows before grouping and can use indexes; having filters groups after aggregation and cannot. putting a non-aggregate predicate in having is therefore both slower and misleading - postgresql will often push it down anyway, but the intent is wrong. count( ) filter (where status = 'paid') is the one i reach for most, because it lets a single pass compute several conditional aggregates side by side: sql select customer_id, count( ) as orders, count( ) filter (where status = 'paid') as paid, sum(total) filter (where created_at now() - interval '30 days') as recent_value from orders group by customer_id; the alternative - three self-joined subqueries, or sum(case when ... then 1 else 0 end) - scans repeatedly or reads worse. filter is standard sql and supported by postgresql and sqlite; on mysql and sql server you fall back to the case form."}, {"n": 28, "category": 2, "difficulty": "D", "html": "Window functions: explain <code>PARTITION BY<\/code>, the frame clause, and the difference between <code>ROWS<\/code> and <code>RANGE<\/code> frames.", "answerTitle": "Window function anatomy", "answer": "<p>A window function computes a value over a <em>frame<\/em> of rows related to the current row, without collapsing rows the way <code>GROUP BY<\/code> does.<\/p><p><code>PARTITION BY<\/code> splits the rows into independent groups; <code>ORDER BY<\/code> inside the <code>OVER<\/code> clause defines the ordering within the partition, which also defines the default frame; the frame clause narrows it further.<\/p><p>The frame difference matters: <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW<\/code> counts <em>physical rows<\/em>, while <code>RANGE BETWEEN 2 PRECEDING AND CURRENT ROW<\/code> counts <em>values<\/em> in the ordering column and so includes all peers with the same value. The default frame when you supply <code>ORDER BY<\/code> is <code>RANGE UNBOUNDED PRECEDING TO CURRENT ROW<\/code>, which means a running <code>SUM<\/code> over a column with ties jumps at each tie rather than incrementing per row. Almost everyone who reports &quot;my running total is wrong&quot; has hit exactly this and needs <code>ROWS<\/code>.<\/p><p><code>GROUPS<\/code> frames (PostgreSQL 11+) count peer groups, which is occasionally the honest answer for time buckets.<\/p>", "source": "answers.md", "search": "window functions: explain partition by, the frame clause, and the difference between rows and range frames. a window function computes a value over a frame of rows related to the current row, without collapsing rows the way group by does. partition by splits the rows into independent groups; order by inside the over clause defines the ordering within the partition, which also defines the default frame; the frame clause narrows it further. the frame difference matters: rows between 2 preceding and current row counts physical rows , while range between 2 preceding and current row counts values in the ordering column and so includes all peers with the same value. the default frame when you supply order by is range unbounded preceding to current row, which means a running sum over a column with ties jumps at each tie rather than incrementing per row. almost everyone who reports \"my running total is wrong\" has hit exactly this and needs rows. groups frames (postgresql 11+) count peer groups, which is occasionally the honest answer for time buckets."}, {"n": 29, "category": 2, "difficulty": "D", "html": "<code>ROW_NUMBER<\/code>, <code>RANK<\/code>, <code>DENSE_RANK<\/code>, <code>LAG<\/code>, <code>LEAD<\/code>, <code>NTILE<\/code> - give a real reporting requirement that needs each.", "answerTitle": "The ranking and offset functions", "answer": "<ul><li><code>ROW_NUMBER<\/code> - deduplication (&quot;keep the newest row per key&quot;), and stable pagination cursors.<\/li><li><code>RANK<\/code> - leaderboards where ties share a position and the next position skips (1, 1, 3).<\/li><li><code>DENSE_RANK<\/code> - &quot;top three distinct prices&quot; where you want no gaps (1, 1, 2).<\/li><li><code>LAG<\/code>/<code>LEAD<\/code> - period-over-period deltas, detecting state transitions in an event log, and computing the gap between consecutive events for a session timeout.<\/li><li><code>NTILE<\/code> - bucketing customers into deciles for segmentation.<\/li><\/ul><p>The one worth demonstrating is <code>LAG<\/code> for state transitions: <code>CASE WHEN status &lt;&gt; lag(status) OVER (PARTITION BY order_id ORDER BY at) THEN 1 END<\/code> turns an event table into a transition table in one pass, which otherwise takes a self-join per row.<\/p>", "source": "answers.md", "search": "row_number, rank, dense_rank, lag, lead, ntile - give a real reporting requirement that needs each. - row_number - deduplication (\"keep the newest row per key\"), and stable pagination cursors. - rank - leaderboards where ties share a position and the next position skips (1, 1, 3). - dense_rank - \"top three distinct prices\" where you want no gaps (1, 1, 2). - lag/lead - period-over-period deltas, detecting state transitions in an event log, and computing the gap between consecutive events for a session timeout. - ntile - bucketing customers into deciles for segmentation. the one worth demonstrating is lag for state transitions: case when status < lag(status) over (partition by order_id order by at) then 1 end turns an event table into a transition table in one pass, which otherwise takes a self-join per row."}, {"n": 30, "category": 2, "difficulty": "T", "html": "Write the &quot;top N per group&quot; query two ways, and explain which one the planner handles better and why.", "answerTitle": "Top N per group", "answer": "<p>Two forms:<\/p><pre><code class=\"lang-sql\">-- window function\nSELECT * FROM (\n  SELECT o.*, row_number() OVER (PARTITION BY customer_id ORDER BY created_at DESC) rn\n  FROM orders o) t\nWHERE rn &lt;= 3;\n\n-- lateral\nSELECT c.id, o.*\nFROM customers c\nCROSS JOIN LATERAL (\n  SELECT * FROM orders o WHERE o.customer_id = c.id\n  ORDER BY created_at DESC LIMIT 3) o;<\/code><\/pre><p>The window version must read and sort <em>every<\/em> order before discarding all but three per customer. The <code>LATERAL<\/code> version does an index scan on <code>(customer_id, created_at DESC)<\/code> per customer and stops after three rows, so with a suitable index it is dramatically faster when N is small and the group count is much smaller than the row count. The window version wins when you are processing most of the table anyway, or when there is no index on the ordering column so a single sort beats thousands of small ones.<\/p><p>This is the question where saying &quot;it depends on the index and the group cardinality&quot; <em>and then saying which way each pushes<\/em> is the whole answer.<\/p>", "source": "answers.md", "search": "write the \"top n per group\" query two ways, and explain which one the planner handles better and why. two forms: sql -- window function select from ( select o. , row_number() over (partition by customer_id order by created_at desc) rn from orders o) t where rn <= 3; -- lateral select c.id, o. from customers c cross join lateral ( select from orders o where o.customer_id = c.id order by created_at desc limit 3) o; the window version must read and sort every order before discarding all but three per customer. the lateral version does an index scan on (customer_id, created_at desc) per customer and stops after three rows, so with a suitable index it is dramatically faster when n is small and the group count is much smaller than the row count. the window version wins when you are processing most of the table anyway, or when there is no index on the ordering column so a single sort beats thousands of small ones. this is the question where saying \"it depends on the index and the group cardinality\" and then saying which way each pushes is the whole answer."}, {"n": 31, "category": 2, "difficulty": "D", "html": "Common table expressions: when is a CTE an optimization fence, and how does that differ between PostgreSQL 11 and 12+, and versus MySQL?", "answerTitle":
