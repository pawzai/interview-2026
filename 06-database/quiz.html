eads and writes by key, high concurrency<\/td><td>few large scans and aggregates, low concurrency<\/td><\/tr><tr><td>Latency target<\/td><td>milliseconds per operation<\/td><td>seconds to minutes per query<\/td><\/tr><tr><td>Schema<\/td><td>normalized, constraint-heavy<\/td><td>dimensional or wide/flat, denormalized<\/td><\/tr><tr><td>Storage<\/td><td>row-oriented (Q134)<\/td><td>column-oriented, compressed<\/td><\/tr><tr><td>Indexing<\/td><td>many selective B-trees<\/td><td>zone maps, min/max statistics, partitioning; few or no indexes<\/td><\/tr><tr><td>Isolation<\/td><td>genuinely required - concurrent writers<\/td><td>mostly single-writer batch loads; snapshot reads<\/td><\/tr><tr><td>Sizing<\/td><td>working set in memory, IOPS-bound<\/td><td>scan throughput and parallelism, bandwidth-bound<\/td><\/tr><\/tbody><\/table><p>The reason they cannot share a system happily is that every choice is opposite: the row store that makes an OLTP update cheap makes a 200-column scan expensive, and the compression that makes a scan cheap makes a single-row update expensive. Running both on one instance means the analytics scans evict the OLTP working set from cache and saturate the IO the transactions need - which is the practical incident behind Q224 and Q226.<\/p>", "source": "answers.md", "search": "oltp versus olap: contrast the workload, the schema, the storage layout and the isolation requirement. oltp olap --- --- --- workload many small reads and writes by key, high concurrency few large scans and aggregates, low concurrency latency target milliseconds per operation seconds to minutes per query schema normalized, constraint-heavy dimensional or wide/flat, denormalized storage row-oriented (q134) column-oriented, compressed indexing many selective b-trees zone maps, min/max statistics, partitioning; few or no indexes isolation genuinely required - concurrent writers mostly single-writer batch loads; snapshot reads sizing working set in memory, iops-bound scan throughput and parallelism, bandwidth-bound the reason they cannot share a system happily is that every choice is opposite: the row store that makes an oltp update cheap makes a 200-column scan expensive, and the compression that makes a scan cheap makes a single-row update expensive. running both on one instance means the analytics scans evict the oltp working set from cache and saturate the io the transactions need - which is the practical incident behind q224 and q226."}, {"n": 214, "category": 12, "difficulty": "D", "html": "Elasticsearch/OpenSearch: the inverted index, analyzers, and what a shard actually is. How do you choose shard count?", "answerTitle": "Elasticsearch fundamentals", "answer": "<p>The <strong>inverted index<\/strong> maps each term to the sorted list of documents containing it (plus positions and frequencies), so a term query is a dictionary lookup and a list intersection rather than a scan. <strong>Analyzers<\/strong> decide what the terms are: a character filter, a tokenizer, and token filters (lowercasing, stop words, stemming, synonyms, n-grams). The analyzer applied at index time and at query time must be compatible, and changing an analyzer requires <strong>reindexing<\/strong>, because the stored terms were produced by the old one - the most common cause of &quot;search stopped matching after a config change&quot;.<\/p><p>A <strong>shard<\/strong> is a complete, independent Lucene index; the index is the union of its shards, and a query is executed on every shard and merged. That makes shard count the main scaling knob and the main mistake: too few and you cannot parallelize or grow; too many and every query pays coordination overhead across all of them, and the cluster state (held on the master) becomes large and slow.<\/p><p>How to choose: size shards by <strong>target size<\/strong> rather than count - 10-50 GB per shard for search workloads, and enough shards to spread across nodes but not more. For time-based data, use a <strong>rollover<\/strong> strategy (data streams / ILM) that creates a new index per period so shard count grows with retention rather than being fixed at creation, and delete whole indices instead of documents. Primary shard count is immutable after creation, so getting it wrong means a reindex - which is why the rollover pattern is the standard answer.<\/p>", "source": "answers.md", "search": "elasticsearch/opensearch: the inverted index, analyzers, and what a shard actually is. how do you choose shard count? the inverted index maps each term to the sorted list of documents containing it (plus positions and frequencies), so a term query is a dictionary lookup and a list intersection rather than a scan. analyzers decide what the terms are: a character filter, a tokenizer, and token filters (lowercasing, stop words, stemming, synonyms, n-grams). the analyzer applied at index time and at query time must be compatible, and changing an analyzer requires reindexing , because the stored terms were produced by the old one - the most common cause of \"search stopped matching after a config change\". a shard is a complete, independent lucene index; the index is the union of its shards, and a query is executed on every shard and merged. that makes shard count the main scaling knob and the main mistake: too few and you cannot parallelize or grow; too many and every query pays coordination overhead across all of them, and the cluster state (held on the master) becomes large and slow. how to choose: size shards by target size rather than count - 10-50 gb per shard for search workloads, and enough shards to spread across nodes but not more. for time-based data, use a rollover strategy (data streams / ilm) that creates a new index per period so shard count grows with retention rather than being fixed at creation, and delete whole indices instead of documents. primary shard count is immutable after creation, so getting it wrong means a reindex - which is why the rollover pattern is the standard answer."}, {"n": 215, "category": 12, "difficulty": "T", "html": "Elasticsearch is &quot;near real time&quot;. Explain refresh, flush and merge, and what your application must not assume after an indexing call returns.", "answerTitle": "\"Near real time\"", "answer": "<p>Three separate operations, often conflated:<\/p><ul><li><strong>Refresh<\/strong> makes recent writes <strong>visible to search<\/strong>. It creates a new Lucene segment from the in-memory buffer and reopens the searcher. Default interval is <strong>1 second<\/strong> (and, since 7.x, only when the index has been searched recently).<\/li><li><strong>Flush<\/strong> makes writes <strong>durable<\/strong> in the Lucene index: it commits the segments and clears the translog. Durability before that point comes from the <strong>translog<\/strong>, which is fsynced on every request by default (<code>index.translog.durability: request<\/code>).<\/li><li><strong>Merge<\/strong> consolidates many small segments into fewer large ones in the background, reclaiming space from deleted documents (deletes are tombstones, as in any LSM-shaped system) and keeping search fast.<\/li><\/ul><p>What the application must not assume after an index call returns: <strong>that the document is searchable<\/strong>. It is durable (with default translog settings) and it is retrievable by <code>GET<\/code> by id (which reads the translog), but a search issued immediately afterwards will typically not find it. The classic bug is &quot;create then redirect to the search results page&quot;, which shows the user a list without their new item.<\/p><p>The options: wait for the refresh interval; use <code>?refresh=wait_for<\/code> on the write (blocks until the next scheduled refresh - acceptable); use <code>?refresh=true<\/code> (forces an immediate refresh - do <strong>not<\/strong> do this per request, it destroys indexing throughput by creating tiny segments); or design the UI to read the item by id from the source of truth rather than from search.<\/p>", "source": "answers.md", "search": "elasticsearch is \"near real time\". explain refresh, flush and merge, and what your application must not assume after an indexing call returns. three separate operations, often conflated: - refresh makes recent writes visible to search . it creates a new lucene segment from the in-memory buffer and reopens the searcher. default interval is 1 second (and, since 7.x, only when the index has been searched recently). - flush makes writes durable in the lucene index: it commits the segments and clears the translog. durability before that point comes from the translog , which is fsynced on every request by default (index.translog.durability: request). - merge consolidates many small segments into fewer large ones in the background, reclaiming space from deleted documents (deletes are tombstones, as in any lsm-shaped system) and keeping search fast. what the application must not assume after an index call returns: that the document is searchable . it is durable (with default translog settings) and it is retrievable by get by id (which reads the translog), but a search issued immediately afterwards will typically not find it. the classic bug is \"create then redirect to the search results page\", which shows the user a list without their new item. the options: wait for the refresh interval; use ?refresh=wait_for on the write (blocks until the next scheduled refresh - acceptable); use ?refresh=true (forces an immediate refresh - do not do this per request, it destroys indexing throughput by creating tiny segments); or design the ui to read the item by id from the source of truth rather than from search."}, {"n": 216, "category": 12, "difficulty": "D", "html": "Keeping a search index in sync with the database: dual write, outbox, CDC and periodic reindex. Rank them and say how you reconcile drift.", "answerTitle": "Keeping a search index in sync", "answer": "<table><thead><tr><th>Approach<\/th><th>How<\/th><th>Rank<\/th><\/tr><\/thead><tbody><tr><td><strong>CDC from the database log<\/strong><\/td><td>Debezium or equivalent tails the WAL, so the index is driven by committed state<\/td><td>1 - no dual-write gap, ordered, survives application bugs, catches writes from any source (including manual SQL)<\/td><\/tr><tr><td><strong>Transactional outbox<\/strong><\/td><td>the application writes an event in the same transaction as the row; a relay indexes it<\/td><td>2 - correct, ordered per aggregate, requires the application to be the only writer (Q116)<\/td><\/tr><tr><td><strong>Periodic reindex<\/strong><\/td><td>scheduled full or incremental rebuild by <code>updated_at<\/code><\/td><td>3 - simple and self-healing, but stale by the interval and expensive at scale<\/td><\/tr><tr><td><strong>Dual write<\/strong><\/td><td>the application writes to the database and Elasticsearch in the same request<\/td><td>4 - broken by construction: no atomicity, so any failure between the two leaves permanent drift<\/td><\/tr><\/tbody><\/table><p>Whichever you choose, <strong>reconciliation is mandatory<\/strong>, because every approach is at-least-once and some are lossy: run a periodic comparison of counts and checksums per key range (or per updated-at window) between the source and the index, emit a drift metric, and repair by reindexing the affected range. I also keep the source row&#x27;s version or <code>updated_at<\/code> <strong>in the indexed document<\/strong> so the reconciler can detect staleness cheaply and so out-of-order updates can be rejected (index with an external version so an older event cannot overwrite a newer one).<\/p><p>And the operational requirement that people forget: a <strong>full reindex must be a routine, tested procedure<\/strong> - into a new index behind an alias, then an atomic alias swap - because analyzer or mapping changes force one, and a rebuild you have never rehearsed is not a recovery plan.<\/p>", "source": "answers.md", "search": "keeping a search index in sync with the database: dual write, outbox, cdc and periodic reindex. rank them and say how you reconcile drift. approach how rank --- --- --- cdc from the database log debezium or equivalent tails the wal, so the index is driven by committed state 1 - no dual-write gap, ordered, survives application bugs, catches writes from any source (including manual sql) transactional outbox the application writes an event in the same transaction as the row; a relay indexes it 2 - correct, ordered per aggregate, requires the application to be the only writer (q116) periodic reindex scheduled full or incremental rebuild by updated_at 3 - simple and self-healing, but stale by the interval and expensive at scale dual write the application writes to the database and elasticsearch in the same request 4 - broken by construction: no atomicity, so any failure between the two leaves permanent drift whichever you choose, reconciliation is mandatory , because every approach is at-least-once and some are lossy: run a periodic comparison of counts and checksums per key range (or per updated-at window) between the source and the index, emit a drift metric, and repair by reindexing the affected range. i also keep the source row's version or updated_at in the indexed document so the reconciler can detect staleness cheaply and so out-of-order updates can be rejected (index with an external version so an older event cannot overwrite a newer one). and the operational requirement that people forget: a full reindex must be a routine, tested procedure - into a new index behind an alias, then an atomic alias swap - because analyzer or mapping changes force one, and a rebuild you have never rehearsed is not a recovery plan."}, {"n": 217, "category": 12, "difficulty": "D", "html": "Relevance: TF-IDF versus BM25, boosting, and why &quot;the results are wrong&quot; is a product problem before it is a technical one.", "answerTitle": "Relevance", "answer": "<p><strong>TF-IDF<\/strong> scores a document by term frequency times inverse document frequency: rare terms count for more, and repeated terms count for more, with a length normalization. <strong>BM25<\/strong> (the Lucene default since 5.0) is the same intuition with two corrections that matter: term frequency <strong>saturates<\/strong> (the 20th occurrence of a word adds almost nothing, where TF-IDF keeps rewarding it), and length normalization is tunable via <code>b<\/code>, with <code>k1<\/code> controlling the saturation curve. In practice BM25 is more robust on documents of varying length and on keyword-stuffed content.<\/p><p>On top of that you have <strong>boosting<\/strong>: field boosts (title over body), query-time boosts per clause, <code>function_score<\/code> for recency or popularity decay, and <code>rank_feature<\/code> fields for signals such as click-through rate.<\/p><p>But the framing I would give: &quot;the results are wrong&quot; is a <strong>product<\/strong> problem first. There is no universal correct ranking - the right answer depends on what the user is trying to do, and the only way to know is to define it. So the first steps are to collect judgements (what <em>should<\/em> rank first for these queries), instrument the search (queries with no results, queries with no clicks, position of the clicked result), and establish an offline metric such as NDCG on a labelled set plus an online metric such as click-through at position 1. Only then does tuning boosts mean anything, because otherwise every change is a swap of one anecdote for another. At maturity this becomes learning-to-rank on behavioural data - but the discipline of measuring first is what separates a search that improves from one that is endlessly re-tuned.<\/p>", "source": "answers.md", "search": "relevance: tf-idf versus bm25, boosting, and why \"the results are wrong\" is a product problem before it is a technical one. tf-idf scores a document by term frequency times inverse document frequency: rare terms count for more, and repeated terms count for more, with a length normalization. bm25 (the lucene default since 5.0) is the same intuition with two corrections that matter: term frequency saturates (the 20th occurrence of a word adds almost nothing, where tf-idf keeps rewarding it), and length normalization is tunable via b, with k1 controlling the saturation curve. in practice bm25 is more robust on documents of varying length and on keyword-stuffed content. on top of that you have boosting : field boosts (title over body), query-time boosts per clause, function_score for recency or popularity decay, and rank_feature fields for signals such as click-through rate. but the framing i would give: \"the results are wrong\" is a product problem first. there is no universal correct ranking - the right answer depends on what the user is trying to do, and the only way to know is to define it. so the first steps are to collect judgements (what should rank first for these queries), instrument the search (queries with no results, queries with no clicks, position of the clicked result), and establish an offline metric such as ndcg on a labelled set plus an online metric such as click-through at position 1. only then does tuning boosts mean anything, because otherwise every change is a swap of one anecdote for another. at maturity this becomes learning-to-rank on behavioural data - but the discipline of measuring first is what separates a search that improves from one that is endlessly re-tuned."}, {"n": 218, "category": 12, "difficulty": "D", "html": "Star schema, snowflake schema and a wide flat table. When does dimensional modeling still pay for itself?", "answerTitle": "Star, snowflake, wide flat table", "answer": "<p><strong>Star<\/strong>: a central fact table of measurements with foreign keys to denormalized dimension tables. <strong>Snowflake<\/strong>: the same, with dimensions further normalized into sub-dimensions. <strong>Wide flat table<\/strong>: fact and all dimension attributes denormalized into one table, which is what columnar engines and BI extracts often prefer.<\/p><p>Snowflaking is rarely worth it now - it saves storage that compression already saves, and it adds joins - so the real choice is star versus flat.<\/p><p>Dimensional modeling still pays for itself when: <strong>history matters<\/strong> (slowly changing dimensions are the mechanism for &quot;what was the customer&#x27;s segment when the order was placed&quot;, Q219); <strong>dimensions are shared<\/strong> across many facts, so conforming them gives consistent definitions across the business - which is really a governance benefit, and the most valuable one; <strong>dimensions change independently<\/strong> of facts, so a customer rename should not require rewriting a billion fact rows; and when self-service BI tools need a comprehensible model to generate queries against.<\/p><p>The flat table wins when the consumer is a single dashboard or a machine-learning feature set, when the engine&#x27;s join performance is the bottleneck, or when the data is genuinely event-shaped with no reusable dimensions. My default is a star schema in the warehouse&#x27;s core layer and flat, purpose-built marts on top - dimensional where governance and history matter, denormalized where speed and simplicity do.<\/p>", "source": "answers.md", "search": "star schema, snowflake schema and a wide flat table. when does dimensional modeling still pay for itself? star : a central fact table of measurements with foreign keys to denormalized dimension tables. snowflake : the same, with dimensions further normalized into sub-dimensions. wide flat table : fact and all dimension attributes denormalized into one table, which is what columnar engines and bi extracts often prefer. snowflaking is rarely worth it now - it saves storage that compression already saves, and it adds joins - so the real choice is star versus flat. dimensional modeling still pays for itself when: history matters (slowly changing dimensions are the mechanism for \"what was the customer's segment when the order was placed\", q219); dimensions are shared across many facts, so conforming them gives consistent definitions across the business - which is really a governance benefit, and the most valuable one; dimensions change independently of facts, so a customer rename should not require rewriting a billion fact rows; and when self-service bi tools need a comprehensible model to generate queries against. the flat table wins when the consumer is a single dashboard or a machine-learning feature set, when the engine's join performance is the bottleneck, or when the data is genuinely event-shaped with no reusable dimensions. my default is a star schema in the warehouse's core layer and flat, purpose-built marts on top - dimensional where governance and history matter, denormalized where speed and simplicity do."}, {"n": 219, "category": 12, "difficulty": "D", "html": "Slowly changing dimensions types 1, 2 and 3. Show the type 2 row layout and the query it enables.", "answerTitle": "Slowly changing dimensions", "answer": "<ul><li><strong>Type 1<\/strong> - overwrite. History is lost; &quot;what did we think last year&quot; is unanswerable. Fine for corrections of genuine errors.<\/li><li><strong>Type 2<\/strong> - add a new row per change, with <code>valid_from<\/code>, <code>valid_to<\/code>, <code>is_current<\/code> and a <strong>surrogate key<\/strong> distinct from the business key. History is complete.<\/li><li><strong>Type 3<\/strong> - add a column for the previous value (<code>current_segment<\/code>, <code>previous_segment<\/code>). Cheap, but holds only one step of history.<\/li><\/ul><p>Type 2 layout:<\/p><table><thead><tr><th>customer_sk<\/th><th>customer_id<\/th><th>segment<\/th><th>valid_from<\/th><th>valid_to<\/th><th>is_current<\/th><\/tr><\/thead><tbody><tr><td>5001<\/td><td>C-123<\/td><td>SMB<\/td><td>2024-01-01<\/td><td>2025-06-30<\/td><td>false<\/td><\/tr><tr><td>7314<\/td><td>C-123<\/td><td>Enterprise<\/td><td>2025-07-01<\/td><td>9999-12-31<\/td><td>true<\/td><\/tr><\/tbody><\/table><p>The query it enables is the whole point: the fact table stores <code>customer_sk<\/code> - the surrogate key <strong>as of the time of the event<\/strong> - so joining fact to dimension on the surrogate key automatically gives the attributes that were true when the transaction happened. Revenue by segment for 2024 attributes those orders to SMB, and 2025 orders to Enterprise, with no as-of logic in the query. Joining on the business key instead (<code>customer_id<\/code> plus <code>is_current<\/code>) gives the <em>current<\/em> segment for all history, which is a different and often equally valid question - and being able to say which one the business is asking for is the actual skill.<\/p>", "source": "answers.md", "search": "slowly changing dimensions types 1, 2 and 3. show the type 2 row layout and the query it enables. - type 1 - overwrite. history is lost; \"what did we think last year\" is unanswerable. fine for corrections of genuine errors. - type 2 - add a new row per change, with valid_from, valid_to, is_current and a surrogate key distinct from the business key. history is complete. - type 3 - add a column for the previous value (current_segment, previous_segment). cheap, but holds only one step of history. type 2 layout: customer_sk customer_id segment valid_from valid_to is_current --- --- --- --- --- --- 5001 c-123 smb 2024-01-01 2025-06-30 false 7314 c-123 enterprise 2025-07-01 9999-12-31 true the query it enables is the whole point: the fact table stores customer_sk - the surrogate key as of the time of the event - so joining fact to dimension on the surrogate key automatically gives the attributes that were true when the transaction happened. revenue by segment for 2024 attributes those orders to smb, and 2025 orders to enterprise, with no as-of logic in the query. joining on the business key instead (customer_id plus is_current) gives the current segment for all history, which is a different and often equally valid question - and being able to say which one the business is asking for is the actual skill."}, {"n": 220, "category": 12, "difficulty": "D", "html": "Columnar formats - Parquet and ORC: row groups, column chunks, encodings, and predicate pushdown via statistics.", "answerTitle": "Parquet and ORC", "answer": "<p>A Parquet file is divided into <strong>row groups<\/strong> (typically 128 MB - a horizontal slice of rows), each row group into <strong>column chunks<\/strong> (all values of one column in that slice), and each chunk into <strong>pages<\/strong> (the unit of compression and encoding). Footers hold the schema and, per row group and per column chunk, <strong>statistics<\/strong>: min, max, null count, and optionally a Bloom filter and page-level indexes.<\/p><p>That layout gives three savings at once: <strong>column pruning<\/strong> (read only the chunks for the columns in the query), <strong>predicate pushdown<\/strong> via the statistics (skip an entire row group whose max is below the filter&#x27;s lower bound - which is why <em>sorting the data on the filter column at write time<\/em> can improve scan performance by an order of magnitude), and <strong>encoding<\/strong>: dictionary encoding for low-cardinality strings, run-length and bit-packing for repeated values, delta encoding for sorted integers, then a general codec (Snappy or Zstd) on top.<\/p><p>ORC is structurally equivalent - stripes instead of row groups, with indexes every 10,000 rows and optional Bloom filters - and grew up in the Hive ecosystem, while Parquet grew up in the Spark/Impala one. In practice both are fine and the choice follows the engine; what matters is the physical detail: <strong>row group size<\/strong> (too small kills the pruning benefit and multiplies metadata; too large wastes IO), <strong>file size<\/strong> (many small files is the classic performance killer in a lake), and <strong>sort order<\/strong> within the file.<\/p>", "source": "answers.md", "search": "columnar formats - parquet and orc: row groups, column chunks, encodings, and predicate pushdown via statistics. a parquet file is divided into row groups (typically 128 mb - a horizontal slice of rows), each row group into column chunks (all values of one column in that slice), and each chunk into pages (the unit of compression and encoding). footers hold the schema and, per row group and per column chunk, statistics : min, max, null count, and optionally a bloom filter and page-level indexes. that layout gives three savings at once: column pruning (read only the chunks for the columns in the query), predicate pushdown via the statistics (skip an entire row group whose max is below the filter's lower bound - which is why sorting the data on the filter column at write time can improve scan performance by an order of magnitude), and encoding : dictionary encoding for low-cardinality strings, run-length and bit-packing for repeated values, delta encoding for sorted integers, then a general codec (snappy or zstd) on top. orc is structurally equivalent - stripes instead of row groups, with indexes every 10,000 rows and optional bloom filters - and grew up in the hive ecosystem, while parquet grew up in the spark/impala one. in practice both are fine and the choice follows the engine; what matters is the physical detail: row group size (too small kills the pruning benefit and multiplies metadata; too large wastes io), file size (many small files is the classic performance killer in a lake), and sort order within the file."}, {"n": 221, "category": 12, "difficulty": "D", "html": "Warehouse versus lakehouse: what table formats like Iceberg or Delta add over files in object storage.", "answerTitle": "Warehouse versus lakehouse", "answer": "<p>A <strong>warehouse<\/strong> (Snowflake, BigQuery, Redshift) owns its storage format and metadata, which is what lets it offer transactions, constraints, fine-grained governance, a query optimizer with real statistics and predictable performance. A <strong>data lake<\/strong> is files in object storage - cheap, open, engine-agnostic, and with no transactions, no schema enforcement and no reliable listing at scale.<\/p><p><strong>Table formats<\/strong> - Iceberg, Delta Lake, Hudi - add the missing layer on top of the files: a <strong>metadata tree<\/strong> listing exactly which data files constitute the table at each snapshot. That single idea provides ACID commits (a commit is an atomic pointer swap to a new metadata file, so readers never see a partial write), <strong>snapshot isolation and time travel<\/strong> (query the table as of a timestamp or version), <strong>schema evolution<\/strong> by field id rather than by column position (so renaming a column does not rewrite data and does not break old files), <strong>hidden partitioning<\/strong> (the format tracks the partition transform, so queries prune without the user writing a partition predicate - which fixes the Q159 problem for lakes), row-level updates and deletes via delete files, and efficient planning without listing the object store.<\/p><p>The lakehouse claim is therefore: keep the lake&#x27;s open format and cheap storage, gain most of the warehouse&#x27;s semantics, and let several engines (Spark, Trino, Flink, Snowflake, Athena) read the same tables. What you still give up relative to a warehouse is peak query performance on small interactive queries, mature fine-grained access control, and operational simplicity - lakehouses need compaction, snapshot expiry and orphan-file cleanup as scheduled jobs, and teams routinely forget until listing costs and small files degrade everything.<\/p>", "source": "answers.md", "search": "warehouse versus lakehouse: what table formats like iceberg or delta add over files in object storage. a warehouse (snowflake, bigquery, redshift) owns its storage format and metadata, which is what lets it offer transactions, constraints, fine-grained governance, a query optimizer with real statistics and predictable performance. a data lake is files in object storage - cheap, open, engine-agnostic, and with no transactions, no schema enforcement and no reliable listing at scale. table formats - iceberg, delta lake, hudi - add the missing layer on top of the files: a metadata tree listing exactly which data files constitute the table at each snapshot. that single idea provides acid commits (a commit is an atomic pointer swap to a new metadata file, so readers never see a partial write), snapshot isolation and time travel (query the table as of a timestamp or version), schema evolution by field id rather than by column position (so renaming a column does not rewrite data and does not break old files), hidden partitioning (the format tracks the partition transform, so queries prune without the user writing a partition predicate - which fixes the q159 problem for lakes), row-level updates and deletes via delete files, and efficient planning without listing the object store. the lakehouse claim is therefore: keep the lake's open format and cheap storage, gain most of the warehouse's semantics, and let several engines (spark, trino, flink, snowflake, athena) read the same tables. what you still give up relative to a warehouse is peak query performance on small interactive queries, mature fine-grained access control, and operational simplicity - lakehouses need compaction, snapshot expiry and orphan-file cleanup as scheduled jobs, and teams routinely forget until listing costs and small files degrade everything."}, {"n": 222, "category": 12, "difficulty": "D", "html": "ETL versus ELT, and where transformation belongs when the warehouse is cheap and elastic.", "answerTitle": "ETL versus ELT", "answer": "<p><strong>ETL<\/strong> transforms before loading, so the warehouse only ever holds curated data: it was the right design when compute in the warehouse was scarce and expensive. <strong>ELT<\/strong> loads raw data first and transforms inside the warehouse with SQL: it is the right design when warehouse compute is elastic and cheap, which it now is.<\/p><p>The reasons ELT won: the raw data is preserved, so a transformation bug is fixable by re-running rather than by re-extracting from a source system that may no longer have the data; transformations become SQL in version control (dbt), reviewable and testable by analysts rather than pipeline engineers; the warehouse&#x27;s optimizer and parallelism beat a hand-rolled transformation tier; and the extraction layer gets much simpler, which is where most pipeline failures live.<\/p><p>Where transformation still belongs <strong>outside<\/strong> the warehouse: anything that must happen before the data may legally be stored (PII redaction, tokenization, residency filtering); heavy unstructured processing (parsing documents, images, embeddings); streaming transformations that must be applied with low latency; and cost control, where filtering an enormous source before loading is cheaper than loading and discarding.<\/p><p>My default is a layered ELT: a raw/bronze layer that is an immutable copy of the source, a cleansed/silver layer with types, deduplication and conformed keys, and a curated/gold layer of business models - each layer a set of tested SQL models, with the transformation logic owned by the team that owns the meaning of the data.<\/p>", "source": "answers.md", "search": "etl versus elt, and where transformation belongs when the warehouse is cheap and elastic. etl transforms before loading, so the warehouse only ever holds curated data: it was the right design when compute in the warehouse was scarce and expensive. elt loads raw data first and transforms inside the warehouse with sql: it is the right design when warehouse compute is elastic and cheap, which it now is. the reasons elt won: the raw data is preserved, so a transformation bug is fixable by re-running rather than by re-extracting from a source system that may no longer have the data; transformations become sql in version control (dbt), reviewable and testable by analysts rather than pipeline engineers; the warehouse's optimizer and parallelism beat a hand-rolled transformation tier; and the extraction layer gets much simpler, which is where most pipeline failures live. where transformation still belongs outside the warehouse: anything that must happen before the data may legally be stored (pii redaction, tokenization, residency filtering); heavy unstructured processing (parsing documents, images, embeddings); streaming transformations that must be applied with low latency; and cost control, where filtering an enormous source before loading is cheaper than loading and discarding. my default is a layered elt: a raw/bronze layer that is an immutable copy of the source, a cleansed/silver layer with types, deduplication and conformed keys, and a curated/gold layer of business models - each layer a set of tested sql models, with the transformation logic owned by the team that owns the meaning of the data."}, {"n": 223, "category": 12, "difficulty": "D", "html": "Materialized views: incremental versus full refresh, staleness, and the PostgreSQL limitation you have to work around.", "answerTitle": "Materialized views", "answer": "<p>A materialized view stores the computed result of a query. <strong>Full refresh<\/strong> recomputes it entirely; <strong>incremental refresh<\/strong> applies only the changes since the last refresh, which requires the engine to track them and restricts the SQL you may use (typically no outer joins, limited aggregates, and change-tracking enabled on the sources).<\/p><p>Staleness is the trade in every case: the view is correct as of its last refresh, so consumers need to know the refresh cadence, and a dashboard showing a materialized aggregate must display &quot;as of&quot; rather than implying it is live.<\/p><p>The <strong>PostgreSQL limitation<\/strong>: there is no incremental refresh at all. <code>REFRESH MATERIALIZED VIEW<\/code> recomputes the whole thing and takes an <code>ACCESS EXCLUSIVE<\/code> lock, blocking readers for the duration; <code>REFRESH ... CONCURRENTLY<\/code> avoids the lock but requires a unique index on the view, computes the full result <strong>and<\/strong> diffs it against the existing copy, so it is slower still and needs the space for both.<\/p><p>The ways around it: maintain a summary <strong>table<\/strong> yourself, updated incrementally by triggers or by a batch job keyed on <code>updated_at<\/code> (more code, far cheaper on large data); refresh into a new table and swap it in with a transactional <code>ALTER TABLE ... RENAME<\/code>, which gives an atomic cutover with no long lock; partition the materialized data by period and refresh only the current partition; or use an extension such as <code>pg_ivm<\/code>. Oracle, SQL Server (indexed views) and Snowflake (dynamic tables) all offer genuine incremental maintenance, and it is a legitimate reason to prefer them for that workload.<\/p>", "source": "answers.md", "search": "materialized views: incremental versus full refresh, staleness, and the postgresql limitation you have to work around. a materialized view stores the computed result of a query. full refresh recomputes it entirely; incremental refresh applies only the changes since the last refresh, which requires the engine to track them and restricts the sql you may use (typically no outer joins, limited aggregates, and change-tracking enabled on the sources). staleness is the trade in every case: the view is correct as of its last refresh, so consumers need to know the refresh cadence, and a dashboard showing a materialized aggregate must display \"as of\" rather than implying it is live. the postgresql limitation : there is no incremental refresh at all. refresh materialized view recomputes the whole thing and takes an access exclusive lock, blocking readers for the duration; refresh ... concurrently avoids the lock but requires a unique index on the view, computes the full result and diffs it against the existing copy, so it is slower still and needs the space for both. the ways around it: maintain a summary table yourself, updated incrementally by triggers or by a batch job keyed on updated_at (more code, far cheaper on large data); refresh into a new table and swap it in with a transactional alter table ... rename, which gives an atomic cutover with no long lock; partition the materialized data by period and refresh only the current partition; or use an extension such as pg_ivm. oracle, sql server (indexed views) and snowflake (dynamic tables) all offer genuine incremental maintenance, and it is a legitimate reason to prefer them for that workload."}, {"n": 224, "category": 12, "difficulty": "T", "html": "Reporting runs against a read replica and is now causing query cancellations on that replica. Explain the exact mechanism and both fixes.", "answerTitle": "Reporting on a replica cancels queries", "answer": "<p>The mechanism: WAL replay on a standby needs to remove row versions and truncate pages, but a long-running query on that standby may still need to see them. When replay is blocked by a conflicting query for longer than <code>max_standby_streaming_delay<\/code> (default 30 s), PostgreSQL <strong>cancels the query<\/strong> - <code>ERROR: canceling statement due to conflict with recovery<\/code>. The conflict can be caused by vacuum cleaning dead tuples on the primary, by a lock (an <code>ALTER TABLE<\/code> replicated from the primary), by a dropped tablespace or by buffer pins. In other words, the primary&#x27;s ordinary maintenance kills the replica&#x27;s reports, and the more aggressive vacuum is (because the primary is busy), the more often it happens.<\/p><p>The two fixes, and they are opposites:<\/p><ol><li><strong><code>hot_standby_feedback = on<\/code><\/strong> - the standby tells the primary the oldest snapshot it needs, and the primary&#x27;s vacuum refrains from removing those row versions. Reports stop being cancelled. The cost lands on the <strong>primary<\/strong>: dead tuples accumulate for as long as the longest replica query runs, so bloat grows and vacuum falls behind - a long report on the replica now damages the primary (Q93). Use with a <code>statement_timeout<\/code> on the replica so no query can pin the horizon indefinitely.<\/li><li><strong>Raise <code>max_standby_streaming_delay<\/code><\/strong> (or set it to -1 to wait indefinitely) - replay pauses instead of cancelling, so the query finishes. The cost lands on the <strong>replica<\/strong>: replication lag grows for the duration of the report, so any read-your-writes or freshness expectation on that replica breaks (Q143), and the WAL backlog must be retained.<\/li><\/ol><p>Which to choose depends on whether stale reads or primary bloat is the lesser harm - and the honest third answer is that a dedicated reporting path (a logical replica, a snapshot into a warehouse, or a materialized read model) avoids the trade entirely, which is the Q226 conversation.<\/p>", "source": "answers.md", "search": "reporting runs against a read replica and is now causing query cancellations on that replica. explain the exact mechanism and both fixes. the mechanism: wal replay on a standby needs to remove row versions and truncate pages, but a long-running query on that standby may still need to see them. when replay is blocked by a conflicting query for longer than max_standby_streaming_delay (default 30 s), postgresql cancels the query - error: canceling statement due to conflict with recovery. the conflict can be caused by vacuum cleaning dead tuples on the primary, by a lock (an alter table replicated from the primary), by a dropped tablespace or by buffer pins. in other words, the primary's ordinary maintenance kills the replica's reports, and the more aggressive vacuum is (because the primary is busy), the more often it happens. the two fixes, and they are opposites: 1. hot_standby_feedback = on - the standby tells the primary the oldest snapshot it needs, and the primary's vacuum refrains from removing those row versions. reports stop being cancelled. the cost lands on the primary : dead tuples accumulate for as long as the longest replica query runs, so bloat grows and vacuum falls behind - a long report on the replica now damages the primary (q93). use with a statement_timeout on the replica so no query can pin the horizon indefinitely. 2. raise max_standby_streaming_delay (or set it to -1 to wait indefinitely) - replay pauses instead of cancelling, so the query finishes. the cost lands on the replica : replication lag grows for the duration of the report, so any read-your-writes or freshness expectation on that replica breaks (q143), and the wal backlog must be retained. which to choose depends on whether stale reads or primary bloat is the lesser harm - and the honest third answer is that a dedicated reporting path (a logical replica, a snapshot into a warehouse, or a materialized read model) avoids the trade entirely, which is the q226 conversation."}, {"n": 225, "category": 12, "difficulty": "D", "html": "Streaming versus batch for analytics. What does exactly-once mean in a streaming aggregation, and what is a watermark?", "answerTitle": "Streaming versus batch", "answer": "<p>Batch processes a bounded dataset on a schedule: simple, easy to reason about, trivially re-runnable, and the latency is the interval. Streaming processes an unbounded dataset continuously: latency in seconds, at the cost of a much harder programming model - state must be kept and checkpointed, late data must be handled, and reprocessing history means replaying the stream.<\/p><p><strong>Exactly-once in a streaming aggregation<\/strong> does not mean each message is delivered once; it means the <strong>effect on the state and the output is applied once<\/strong>. Flink and Kafka Streams achieve it with a checkpoint/transaction protocol: the operator state and the input offsets are committed atomically (Flink&#x27;s distributed snapshots via Chandy-Lamport barriers; Kafka Streams via transactional writes covering the state-store changelog and the offset commit), and the sink must be either transactional or idempotent for the guarantee to extend end to end. The moment the sink is an ordinary REST call or a non-idempotent database insert, the guarantee stops at the framework boundary - which is exactly the point <code>03-microservices<\/code> Q44 makes.<\/p><p>A <strong>watermark<\/strong> is the framework&#x27;s assertion about event-time progress: &quot;I believe no event with a timestamp earlier than T will arrive from now on&quot;. It is what allows a windowed aggregate to be <em>closed<\/em> and emitted, because event time is unordered in reality. The watermark is a heuristic - usually the maximum observed event time minus an allowed lateness - so it embodies the trade between latency (emit early) and completeness (wait longer). Data arriving after the watermark is <strong>late<\/strong>, and you choose per pipeline whether to drop it, emit an updated result, or route it to a side output for reconciliation.<\/p><p>My default is batch unless a business decision genuinely depends on sub-minute freshness, because batch&#x27;s operational cost is a fraction of streaming&#x27;s - and micro-batching (a few minutes) covers most of what people call real time.<\/p>", "source": "answers.md", "search": "streaming versus batch for analytics. what does exactly-once mean in a streaming aggregation, and what is a watermark? batch processes a bounded dataset on a schedule: simple, easy to reason about, trivially re-runnable, and the latency is the interval. streaming processes an unbounded dataset continuously: latency in seconds, at the cost of a much harder programming model - state must be kept and checkpointed, late data must be handled, and reprocessing history means replaying the stream. exactly-once in a streaming aggregation does not mean each message is delivered once; it means the effect on the state and the output is applied once . flink and kafka streams achieve it with a checkpoint/transaction protocol: the operator state and the input offsets are committed atomically (flink's distributed snapshots via chandy-lamport barriers; kafka streams via transactional writes covering the state-store changelog and the offset commit), and the sink must be either transactional or idempotent for the guarantee to extend end to end. the moment the sink is an ordinary rest call or a non-idempotent database insert, the guarantee stops at the framework boundary - which is exactly the point 03-microservices q44 makes. a watermark is the framework's assertion about event-time progress: \"i believe no event with a timestamp earlier than t will arrive from now on\". it is what allows a windowed aggregate to be closed and emitted, because event time is unordered in reality. the watermark is a heuristic - usually the maximum observed event time minus an allowed lateness - so it embodies the trade between latency (emit early) and completeness (wait longer). data arriving after the watermark is late , and you choose per pipeline whether to drop it, emit an updated result, or route it to a side output for reconciliation. my default is batch unless a business decision genuinely depends on sub-minute freshness, because batch's operational cost is a fraction of streaming's - and micro-batching (a few minutes) covers most of what people call real time."}, {"n": 226, "category": 12, "difficulty": "A", "html": "The business wants &quot;real-time dashboards&quot; on OLTP data. Establish the actual requirement and design the path.", "answerTitle": "\"Real-time dashboards\" on OLTP data", "answer": "<p><strong>Establish the actual requirement first.<\/strong> What decision does the dashboard drive, and how quickly must it change behavior? &quot;Real time&quot; almost always means one of: <em>sub-second<\/em> (an operational monitor - an alert, a fraud signal, a fulfilment queue), <em>a minute or two<\/em> (a business monitor - orders today, error rate, campaign performance), or <em>this morning<\/em> (a management report someone looks at with coffee). The cost difference between those three is an order of magnitude each. I also ask: how many concurrent viewers, how much history does each panel span, how many distinct metrics, is any of it per-customer, and what is the consequence of a number being five minutes stale? And critically: does anyone <em>act<\/em> on it within the freshness window - because if the response takes a day, the freshness is decoration.<\/p><p><strong>The design, by answer.<\/strong><\/p><ul><li><strong>This morning<\/strong>: nightly or hourly batch into a small reporting store (or a materialized view refreshed on a schedule, Q223). Cheapest by far, and it is the honest answer more often than people expect.<\/li><li><strong>A minute or two<\/strong> - the common real case: <strong>CDC from the primary<\/strong> (logical decoding, Q150) into a store designed for the read shape. For modest volumes, a read replica plus incrementally maintained summary tables; for real volume, stream into a columnar or real-time analytics store (ClickHouse, Druid, Pinot, or the warehouse with a micro-batch) and have the dashboard query pre-aggregated rollups, never raw facts. The rollups are the thing that makes it cheap: a dashboard should read hundreds of rows, not millions.<\/li><li><strong>Sub-second<\/strong>: this is not a dashboard, it is an operational system. Compute the metric in the event stream (Flink or Kafka Streams) and push it to the client over websockets, with the store used only for backfill.<\/li><\/ul><p><strong>What I would rule out<\/strong>: pointing a BI tool at the OLTP primary. It puts unbounded, unpredictable scans on the system that takes orders (Q213), it will eventually cause an incident during a business peak, and every subsequent query optimization has to consider a workload nobody controls. Pointing it at a <strong>read replica<\/strong> is better and is a legitimate first step for a small system, but it brings the query-cancellation trade of Q224 and it still scales badly.<\/p><p><strong>How I would sequence it<\/strong>: start with the replica plus summary tables to prove the metrics are the right ones (most dashboards are rebuilt twice before anyone trusts them), and only build the CDC pipeline once the definitions are stable - because the expensive part is not the pipeline, it is agreeing what &quot;an active customer&quot; means.<\/p><p><em>Hook: a real-time dashboard request you converted into a five-minute one, and what it saved.<\/em><\/p>", "source": "answers.md", "search": "the business wants \"real-time dashboards\" on oltp data. establish the actual requirement and design the path. establish the actual requirement first. what decision does the dashboard drive, and how quickly must it change behavior? \"real time\" almost always means one of: sub-second (an operational monitor - an alert, a fraud signal, a fulfilment queue), a minute or two (a business monitor - orders today, error rate, campaign performance), or this morning (a management report someone looks at with coffee). the cost difference between those three is an order of magnitude each. i also ask: how many concurrent viewers, how much history does each panel span, how many distinct metrics, is any of it per-customer, and what is the consequence of a number being five minutes stale? and critically: does anyone act on it within the freshness window - because if the response takes a day, the freshness is decoration. the design, by answer. - this morning : nightly or hourly batch into a small reporting store (or a materialized view refreshed on a schedule, q223). cheapest by far, and it is the honest answer more often than people expect. - a minute or two - the common real case: cdc from the primary (logical decoding, q150) into a store designed for the read shape. for modest volumes, a read replica plus incrementally maintained summary tables; for real volume, stream into a columnar or real-time analytics store (clickhouse, druid, pinot, or the warehouse with a micro-batch) and have the dashboard query pre-aggregated rollups, never raw facts. the rollups are the thing that makes it cheap: a dashboard should read hundreds of rows, not millions. - sub-second : this is not a dashboard, it is an operational system. compute the metric in the event stream (flink or kafka streams) and push it to the client over websockets, with the store used only for backfill. what i would rule out : pointing a bi tool at the oltp primary. it puts unbounded, unpredictable scans on the system that takes orders (q213), it will eventually cause an incident during a business peak, and every subsequent query optimization has to consider a workload nobody controls. pointing it at a read replica is better and is a legitimate first step for a small system, but it brings the query-cancellation trade of q224 and it still scales badly. how i would sequence it : start with the replica plus summary tables to prove the metrics are the right ones (most dashboards are rebuilt twice before anyone trusts them), and only build the cdc pipeline once the definitions are stable - because the expensive part is not the pipeline, it is agreeing what \"an active customer\" means. hook: a real-time dashboard request you converted into a five-minute one, and what it saved."}, {"n": 227, "category": 13, "difficulty": "C", "html": "What SQL does Hibernate actually issue for a lazy <code>@ManyToOne<\/code>, an <code>@OneToMany<\/code> with <code>JOIN FETCH<\/code>, and a <code>@BatchSize<\/code> collection?", "answerTitle": "What Hibernate actually issues", "answer": "<ul><li><strong>Lazy <code>@ManyToOne<\/code><\/strong>: the owning entity&#x27;s <code>SELECT<\/code> fetches only the foreign key column; touching the association triggers a second <code>SELECT ... WHERE id = ?<\/code>. Note the trap - a lazy to-one on a <strong>nullable<\/strong> or non-owning side cannot be proxied without knowing whether the row exists, so Hibernate silently makes it eager unless you enable bytecode enhancement. And accessing <code>order.getCustomer().getId()<\/code> on a proxy does <em>not<\/em> hit the database, because the id is already known; accessing any other field does.<\/li><li><strong><code>@OneToMany<\/code> with <code>JOIN FETCH<\/code><\/strong>: one <code>SELECT<\/code> with a <code>LEFT OUTER JOIN<\/code>, returning the parent&#x27;s columns duplicated once per child row. Hibernate de-duplicates the parent entities in the persistence context, but the <em>rows<\/em> still cross the wire - a parent with 50 children and 30 columns transfers 50 copies of those columns, which is the hidden cost of fetch joins on wide entities.<\/li><li><strong><code>@BatchSize(size = 25)<\/code><\/strong>: the first access to any lazy collection triggers one <code>SELECT ... WHERE parent_id IN (?, ?, ... up to 25)<\/code> covering the un-initialized proxies in the persistence context. So N+1 becomes N/25+1 round trips, with no row duplication - which is why batch fetching is often better than a fetch join for collections.<\/li><\/ul><p>The point to make: these are three different physical strategies for the same object graph, and the right one depends on collection size and how many parents you load, not on a global preference.<\/p>", "source": "answers.md", "search": "what sql does hibernate actually issue for a lazy @manytoone, an @onetomany with join fetch, and a @batchsize collection? - lazy @manytoone : the owning entity's select fetches only the foreign key column; touching the association triggers a second select ... where id = ?. note the trap - a lazy to-one on a nullable or non-owning side cannot be proxied without knowing whether the row exists, so hibernate silently makes it eager unless you enable bytecode enhancement. and accessing order.getcustomer().getid() on a proxy does not hit the database, because the id is already known; accessing any other field does. - @onetomany with join fetch : one select with a left outer join, returning the parent's columns duplicated once per child row. hibernate de-duplicates the parent entities in the persistence context, but the rows still cross the wire - a parent with 50 children and 30 columns transfers 50 copies of those columns, which is the hidden cost of fetch joins on wide entities. - @batchsize(size = 25) : the first access to any lazy collection triggers one select ... where parent_id in (?, ?, ... up to 25) covering the un-initialized proxies in the persistence context. so n+1 becomes n/25+1 round trips, with no row duplication - which is why batch fetching is often better than a fetch join for collections. the point to make: these are three different physical strategies for the same object graph, and the right one depends on collection size and how many parents you load, not on a global preference."}, {"n": 228, "category": 13, "difficulty": "T", "html": "<code>JOIN FETCH<\/code> combined with pagination. What does Hibernate do, what warning does it log, and what is the correct two-query solution?", "answerTitle": "`JOIN FETCH` with pagination", "answer": "<p>Hibernate cannot apply <code>LIMIT<\/code>/<code>OFFSET<\/code> in SQL, because the join has multiplied rows - limiting to 20 SQL rows might yield three parents, or seven, depending on child counts. So it fetches <strong>the entire result set<\/strong> and paginates <strong>in memory<\/strong>, logging <code>HHH000104: firstResult/maxResults specified with collection fetch; applying in memory<\/code>.<\/p><p>On a large table that is a full scan, a full transfer and an OutOfMemoryError waiting for a busy day. It is one of the most damaging silent behaviors in the framework, because it works perfectly in a test with 50 rows.<\/p><p>The correct solution is <strong>two queries<\/strong>:<\/p><ol><li>Page over the <strong>root ids only<\/strong>, with <code>LIMIT<\/code>/<code>OFFSET<\/code> (or keyset, Q38) applied in SQL: <code>SELECT o.id FROM orders o WHERE ... ORDER BY o.created_at DESC LIMIT 20<\/code><\/li><li>Fetch the full graph for exactly those ids: <code>SELECT o FROM Order o LEFT JOIN FETCH o.items WHERE o.id IN :ids ORDER BY o.created_at DESC<\/code><\/li><\/ol><p>The <code>ORDER BY<\/code> must be repeated in the second query, because <code>IN<\/code> does not preserve order. Spring Data expresses this with a <code>@Query<\/code> returning ids plus an <code>@EntityGraph<\/code> method, and Hibernate 6 offers <code>@FetchProfile<\/code> and <code>Session.byMultipleIds<\/code>. The alternative, when the collection is small, is to drop the fetch join and use <code>@BatchSize<\/code>, which paginates correctly in SQL and issues one extra batched query.<\/p>", "source": "answers.md", "search": "join fetch combined with pagination. what does hibernate do, what warning does it log, and what is the correct two-query solution? hibernate cannot apply limit/offset in sql, because the join has multiplied rows - limiting to 20 sql rows might yield three parents, or seven, depending on child counts. so it fetches the entire result set and paginates in memory , logging hhh000104: firstresult/maxresults specified with collection fetch; applying in memory. on a large table that is a full scan, a full transfer and an outofmemoryerror waiting for a busy day. it is one of the most damaging silent behaviors in the framework, because it works perfectly in a test with 50 rows. the correct solution is two queries : 1. page over the root ids only , with limit/offset (or keyset, q38) applied in sql: select o.id from orders o where ... order by o.created_at desc limit 20 2. fetch the full graph for exactly those ids: select o from order o left join fetch o.items where o.id in :ids order by o.created_at desc the order by must be repeated in the second query, because in does not preserve order. spring data expresses this with a @query returning ids plus an @entitygraph method, and hibernate 6 offers @fetchprofile and session.bymultipleids. the alternative, when the collection is small, is to drop the fetch join and use @batchsize, which paginates correctly in sql and issues one extra batched query."}, {"n": 229, "category": 13, "difficulty": "D", "html": "The MultipleBagFetchException and why two <code>List<\/code> collections cannot be fetched in one query. What are the fixes?", "answerTitle": "`MultipleBagFetchException`", "answer": "<p>A <strong>bag<\/strong> is an unordered <code>List<\/code> with no <code>@OrderColumn<\/code> - Hibernate cannot know the index of each element. Fetching two bags in one query produces a Cartesian product between the two collections (10 items x 5 payments = 50 rows), and because neither list has an index, Hibernate cannot tell duplicates caused by the join from genuine duplicate elements. It refuses rather than silently corrupting the collections.<\/p><p>The fixes, in the order I prefer them:<\/p><ol><li><strong>Change the collection type to <code>Set<\/code>.<\/strong> A <code>Set<\/code> has no positional semantics, so the duplicates from the join collapse correctly. This is the usual answer, and it is nearly always what the model meant. The cost is that the entities need sensible <code>equals<\/code>/<code>hashCode<\/code> (use the business key or the id, never the whole object).<\/li><li><strong>Fetch one collection per query.<\/strong> Two queries, each fetching one collection for the same root; the persistence context assembles the graph. This also avoids the Cartesian product entirely, which matters as soon as both collections are non-trivial.<\/li><li><strong>Use <code>@BatchSize<\/code><\/strong> on both collections and no fetch join at all - three queries total, no row multiplication, and it paginates.<\/li><\/ol><p>Worth saying out loud: even when the exception is avoided, fetching two collections in one query is usually the wrong plan. 10 x 5 is fine; 200 x 50 is 10,000 rows to build a graph of 250 objects.<\/p>", "source": "answers.md", "search": "the multiplebagfetchexception and why two list collections cannot be fetched in one query. what are the fixes? a bag is an unordered list with no @ordercolumn - hibernate cannot know the index of each element. fetching two bags in one query produces a cartesian product between the two collections (10 items x 5 payments = 50 rows), and because neither list has an index, hibernate cannot tell duplicates caused by the join from genuine duplicate elements. it refuses rather than silently corrupting the collections. the fixes, in the order i prefer them: 1. change the collection type to set. a set has no positional semantics, so the duplicates from the join collapse correctly. this is the usual answer, and it is nearly always what the model meant. the cost is that the entities need sensible equals/hashcode (use the business key or the id, never the whole object). 2. fetch one collection per query. two queries, each fetching one collection for the same root; the persistence context assembles the graph. this also avoids the cartesian product entirely, which matters as soon as both collections are non-trivial. 3. use @batchsize on both collections and no fetch join at all - three queries total, no row multiplication, and it paginates. worth saying out loud: even when the exception is avoided, fetching two collections in one query is usually the wrong plan. 10 x 5 is fine; 200 x 50 is 10,000 rows to build a graph of 250 objects."}, {"n": 230, "category": 13, "difficulty": "D", "html": "Dirty checking and flush ordering. Why can a flush produce a constraint violation the code order suggests should not happen?", "answerTitle": "Dirty checking and flush ordering", "answer": "<p>At flush, Hibernate compares each managed entity against its loaded snapshot and generates the SQL. It does <strong>not<\/strong> execute statements in the order your code made the changes; it uses a fixed <strong>action order<\/strong>: all inserts (in the order the entities were persisted), then updates, then collection deletions, then collection updates/insertions, then entity deletions.<\/p><p>That is why a &quot;delete then insert&quot; on a unique key fails: you remove the row with <code>email = &#x27;a@b.com&#x27;<\/code> and add a new one with the same email, and Hibernate executes the <strong>insert first<\/strong>, hitting the unique constraint even though the sequence you wrote was legal. The same shape causes foreign-key violations when a child is deleted and a replacement inserted.<\/p><p>The remedies: <code>flush()<\/code> explicitly between the two operations to force the order (crude but effective); make the constraint <strong>deferrable<\/strong> so it is checked at commit (Q59); reuse the existing row (update instead of delete-and-insert), which is usually the better model anyway; or step outside the persistence context for that operation with a JPQL/native bulk statement, remembering that bulk statements bypass the persistence context and require care with stale managed entities.<\/p>", "source": "answers.md", "search": "dirty checking and flush ordering. why can a flush produce a constraint violation the code order suggests should not happen? at flush, hibernate compares each managed entity against its loaded snapshot and generates the sql. it does not execute statements in the order your code made the changes; it uses a fixed action order : all inserts (in the order the entities were persisted), then updates, then collection deletions, then collection updates/insertions, then entity deletions. that is why a \"delete then insert\" on a unique key fails: you remove the row with email = 'a@b.com' and add a new one with the same email, and hibernate executes the insert first , hitting the unique constraint even though the sequence you wrote was legal. the same shape causes foreign-key violations when a child is deleted and a replacement inserted. the remedies: flush() explicitly between the two operations to force the order (crude but effective); make the constraint deferrable so it is checked at commit (q59); reuse the existing row (update instead of delete-and-insert), which is usually the better model anyway; or step outside the persistence context for that operation with a jpql/native bulk statement, remembering that bulk statements bypass the persistence context and require care with stale managed entities."}, {"n": 231, "category": 13, "difficulty": "T", "html": "An <code>@Transactional(readOnly = true)<\/code> method still issues an <code>UPDATE<\/code>. Give the mechanisms by which this happens.", "answerTitle": "`readOnly = true` still issues an `UPDATE`", "answer": "<p><code>@Transactional(readOnly = true)<\/code> in Spring sets Hibernate&#x27;s flush mode to <code>MANUAL<\/code> and marks the JDBC connection read-only - it is a <strong>hint<\/strong>, not an enforcement (<code>02-spring<\/code> Q64). Mechanisms by which a write still happens:<\/p><ol><li><strong>A nested or subsequent transaction.<\/strong> <code>readOnly<\/code> applies at the boundary that <em>started<\/em> the transaction. A <code>REQUIRED<\/code> inner method marked read-write joins the outer read-only transaction and keeps its flush mode; conversely a read-only outer with a <code>REQUIRES_NEW<\/code> inner gets a genuinely writable transaction.<\/li><li><strong>An explicit <code>flush()<\/code><\/strong> or a JPQL/native <code>UPDATE<\/code>/<code>DELETE<\/code> executed directly - <code>MANUAL<\/code> flush mode stops <em>automatic<\/em> flushing, not deliberate statements.<\/li><li><strong>Hibernate&#x27;s own writes<\/strong>: sequence or identity generation, a version increment from an explicit lock, and second-level cache or <code>@Version<\/code> housekeeping. Also <code>@PostLoad<\/code>-style logic that mutates and then gets flushed by a later read-write transaction in the same persistence context.<\/li><li><strong>Entities detached from a read-only transaction and merged in a writable one<\/strong> later in the request - the change originated in the read-only method but is written elsewhere.<\/li><li><strong>The driver&#x27;s read-only flag is advisory<\/strong> in PostgreSQL only if the transaction is actually started as <code>READ ONLY<\/code>; with <code>LazyConnectionDataSourceProxy<\/code> or certain pool configurations the flag may not be applied at all, so nothing stops the write at the database level.<\/li><\/ol><p>The dependable enforcement is at the <strong>database<\/strong>: connect the read path with a role that has only <code>SELECT<\/code> privileges, or route it to a replica where writes are physically impossible. That converts a hint into a guarantee.<\/p>", "source": "answers.md", "search": "an @transactional(readonly = true) method still issues an update. give the mechanisms by which this happens. @transactional(readonly = true) in spring sets hibernate's flush mode to manual and marks the jdbc connection read-only - it is a hint , not an enforcement (02-spring q64). mechanisms by which a write still happens: 1. a nested or subsequent transaction. readonly applies at the boundary that started the transaction. a required inner method marked read-write joins the outer read-only transaction and keeps its flush mode; conversely a read-only outer with a requires_new inner gets a genuinely writable transaction. 2. an explicit flush() or a jpql/native update/delete executed directly - manual flush mode stops automatic flushing, not deliberate statements. 3. hibernate's own writes : sequence or identity generation, a version increment from an explicit lock, and second-level cache or @version housekeeping. also @postload-style logic that mutates and then gets flushed by a later read-write transaction in the same persistence context. 4. entities detached from a read-only transaction and merged in a writable one later in the request - the change originated in the read-only method but is written elsewhere. 5. the driver's read-only flag is advisory in postgresql only if the transaction is actually started as read only; with lazyconnectiondatasourceproxy or certain pool configurations the flag may not be applied at all, so nothing stops the write at the database level. the dependable enforcement is at the database : connect the read path with a role that has only select privileges, or route it to a replica where writes are physically impossible. that converts a hint into a guarantee."}, {"n": 232, "category": 13, "difficulty": "D", "html": "JDBC batching with Hibernate: <code>batch_size<\/code>, <code>order_inserts<\/code>, <code>order_updates<\/code>, and why <code>IDENTITY<\/code> generation disables it.", "answerTitle": "JDBC batching in Hibernate", "answer": "<p><code>hibernate.jdbc.batch_size = 50<\/code> tells Hibernate to accumulate <code>PreparedStatement<\/code> parameter sets and send them together. <code>order_inserts<\/code> and <code>order_updates<\/code> sort the pending statements by entity type so that consecutive statements share the same SQL - <strong>without them, batching silently does almost nothing<\/strong>, because a batch is broken every time the statement text changes, and an interleaved insert/update sequence across two entity types produces batches of one.<\/p><p><code>IDENTITY<\/code> generation disables insert batching entirely: the database assigns the key during the insert, and JDBC cannot return generated keys for a batch in a way Hibernate can attribute to entities, so it must execute each insert individually to learn the id. This is the single most common reason batching &quot;does not work&quot;, and it is a modeling decision made years earlier. Use a <code>SEQUENCE<\/code> with a pooled optimizer (<code>allocationSize = 50<\/code>, <code>pooled-lo<\/code>) instead: ids are allocated in blocks with one round trip per block, and inserts batch freely.<\/p><p>The other requirements: flush and clear the persistence context every batch-size entities in a long loop (otherwise dirty checking becomes quadratic and the heap fills), and remember that batching helps throughput, not latency - and that a batched statement still counts as N rows for locking, WAL and replication.<\/p>", "source": "answers.md", "search": "jdbc batching with hibernate: batch_size, order_inserts, order_updates, and why identity generation disables it. hibernate.jdbc.batch_size = 50 tells hibernate to accumulate preparedstatement parameter sets and send them together. order_inserts and order_updates sort the pending statements by entity type so that consecutive statements share the same sql - without them, batching silently does almost nothing , because a batch is broken every time the statement text changes, and an interleaved insert/update sequence across two entity types produces batches of one. identity generation disables insert batching entirely: the database assigns the key during the insert, and jdbc cannot return generated keys for a batch in a way hibernate can attribute to entities, so it must execute each insert individually to learn the id. this is the single most common reason batching \"does not work\", and it is a modeling decision made years earlier. use a sequence with a pooled optimizer (allocationsize = 50, pooled-lo) instead: ids are allocated in blocks with one round trip per block, and inserts batch freely. the other requirements: flush and clear the persistence context every batch-size entities in a long loop (otherwise dirty checking becomes quadratic and the heap fills), and remember that batching helps throughput, not latency - and that a batched statement still counts as n rows for locking, wal and replication."}, {"n": 233, "category": 13, "difficulty": "D", "html": "PostgreSQL <code>reWriteBatchedInserts<\/code> and why a JDBC batch is not one round trip without it. What speedup should you expect?", "answerTitle": "`reWriteBatchedInserts`", "answer": "<p>By default the PostgreSQL JDBC driver sends a batch as N separate protocol messages in one network flush. That saves the <em>round trips<\/em> but the server still parses and executes N statements, so the win is partial - typically 2-3x.<\/p><p>With <code>reWriteBatchedInserts=true<\/code>, the driver rewrites a batch of identical single-row inserts into <strong>one multi-values statement<\/strong>: <code>INSERT INTO t (a,b) VALUES (?,?),(?,?),...<\/code>. The server then parses and plans once and executes one statement, which removes per-statement overhead as well as round trips. Typical speedups are <strong>2-3x on top<\/strong> of ordinary batching, so 5-10x versus unbatched - I would quote it as &quot;a few times faster, measure it&quot; rather than a precise figure.<\/p><p>The caveats: it applies only to plain <code>INSERT<\/code> batches (not updates, and not inserts with <code>ON CONFLICT<\/code> in older driver versions), the rewritten statement is subject to the 65,535-parameter protocol limit so very wide rows cap the effective batch size, and generated-key retrieval interacts badly with it. It is a connection property, so it applies to everything on that pool - which is fine, because it is a no-op when it cannot apply.<\/p>", "source": "answers.md", "search": "postgresql rewritebatchedinserts and why a jdbc batch is not one round trip without it. what speedup should you expect? by default the postgresql jdbc driver sends a batch as n separate protocol messages in one network flush. that saves the round trips but the server still parses and executes n statements, so the win is partial - typically 2-3x. with rewritebatchedinserts=true, the driver rewrites a batch of identical single-row inserts into one multi-values statement : insert into t (a,b) values (?,?),(?,?),.... the server then parses and plans once and executes one statement, which removes per-statement overhead as well as round trips. typical speedups are 2-3x on top of ordinary batching, so 5-10x versus unbatched - i would quote it as \"a few times faster, measure it\" rather than a precise figure. the caveats: it applies only to plain insert batches (not updates, and not inserts with on conflict in older driver versions), the rewritten statement is subject to the 65,535-parameter protocol limit so very wide rows cap the effective batch size, and generated-key retrieval interacts badly with it. it is a connection property, so it applies to everything on that pool - which is fine, because it is a no-op when it cannot apply."}, {"n": 234, "category": 13, "difficulty": "D", "html": "Fetch size and streaming a large result: what <code>setFetchSize<\/code> does in the PostgreSQL driver, and the three conditions required for a real cursor.", "answerTitle": "Fetch size and streaming", "answer": "<p><code>setFetchSize(n)<\/code> asks the driver to return rows in chunks of <code>n<\/code> rather than materializing the whole result. In the PostgreSQL driver this switches from the simple query protocol - which buffers the <strong>entire<\/strong> result set in the client&#x27;s heap - to using a <strong>server-side cursor<\/strong> with <code>Execute<\/code> messages for <code>n<\/code> rows at a time.<\/p><p>Three conditions must all hold for a real cursor:<\/p><ol><li><strong>Autocommit must be off.<\/strong> With autocommit on, the driver cannot keep a cursor open across statements, so it silently ignores the fetch size and buffers everything. This is the one people miss.<\/li><li><strong>The statement must be a forward-only, read-only <code>ResultSet<\/code><\/strong> (<code>TYPE_FORWARD_ONLY<\/code>), because a scrollable result cannot be streamed.<\/li><li><strong><code>fetchSize &gt; 0<\/code><\/strong> must be set on the <code>Statement<\/code> before execution.<\/li><\/ol><p>In JPA/Hibernate that means a transaction (so autocommit is off), <code>hibernate.jdbc.fetch_size<\/code> or a query hint, <code>Query.stream()<\/code> or <code>ScrollableResults<\/code>, plus <code>entityManager.detach()<\/code>/<code>clear()<\/code> every N rows so the persistence context does not accumulate the whole table anyway (<code>02-spring<\/code> Q134). MySQL&#x27;s driver is different again - it streams only with <code>Integer.MIN_VALUE<\/code> as the fetch size, and holds the connection hostage until the result is fully consumed.<\/p><p>The failure this prevents is the classic one: a nightly job that worked for two years and then OOMs, because the table finally exceeded the heap.<\/p>", "source": "answers.md", "search": "fetch size and streaming a large result: what setfetchsize does in the postgresql driver, and the three conditions required for a real cursor. setfetchsize(n) asks the driver to return rows in chunks of n rather than materializing the whole result. in the postgresql driver this switches from the simple query protocol - which buffers the entire result set in the client's heap - to using a server-side cursor with execute messages for n rows at a time. three conditions must all hold for a real cursor: 1. autocommit must be off. with autocommit on, the driver cannot keep a cursor open across statements, so it silently ignores the fetch size and buffers everything. this is the one people miss. 2. the statement must be a forward-only, read-only resultset (type_forward_only), because a scrollable result cannot be streamed. 3. fetchsize 0 must be set on the statement before execution. in jpa/hibernate that means a transaction (so autocommit is off), hibernate.jdbc.fetch_size or a query hint, query.stream() or scrollableresults, plus entitymanager.detach()/clear() every n rows so the persistence context does not accumulate the whole table anyway (02-spring q134). mysql's driver is different again - it streams only with integer.min_value as the fetch size, and holds the connection hostage until the result is fully consumed. the failure th
