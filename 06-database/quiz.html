it trail, and the main database holds only a token. This shrinks the compliance scope dramatically, because the systems holding tokens are out of scope for the standard that governs the real values.<\/p><p><strong>The controls that keep it honest<\/strong>: no direct human access to production data by default (queries go through an audited tool that logs who ran what), export and <code>COPY<\/code> privileges restricted and alerted on, and a periodic scan for PII appearing in places it should not - logs, error messages, support tickets, the search index, and lower environments.<\/p>", "source": "answers.md", "search": "pii: classification, masking in lower environments, tokenization, and the pipeline that keeps production data out of a laptop. classification first : every column tagged (public, internal, personal, sensitive-personal, financial) in a catalog that lives with the schema - a comment on the column, a yaml file in the repo, or a data catalog tool. untagged is not \"safe\", it is \"unreviewed\", and a lint should fail a migration that adds a column with no classification. this sounds bureaucratic and it is the thing that makes every later control possible, because you cannot mask, retain or delete what you have not identified. lower environments : production data does not go to a laptop. the pipeline is a restore into a locked-down environment where an anonymization job runs before any developer access - deterministic pseudonymization for values that must stay join-able across tables (the same customer id maps to the same fake id everywhere), format-preserving fakes for names, emails and phone numbers so validation still passes, nulling or generalization for free-text fields (which are the worst offenders because pii hides in them), and deletion of the columns nobody needs. the alternative, and often the better one, is synthetic data generated to match the production distribution (q265), which has no residual risk at all. tokenization for the highest-sensitivity fields - card numbers, national identifiers: the real value lives in a separate vault with its own access control and audit trail, and the main database holds only a token. this shrinks the compliance scope dramatically, because the systems holding tokens are out of scope for the standard that governs the real values. the controls that keep it honest : no direct human access to production data by default (queries go through an audited tool that logs who ran what), export and copy privileges restricted and alerted on, and a periodic scan for pii appearing in places it should not - logs, error messages, support tickets, the search index, and lower environments."}, {"n": 274, "category": 16, "difficulty": "D", "html": "Auditing: database audit extensions, trigger-based audit tables, and log-based capture. Compare completeness, performance and tamper resistance.", "answerTitle": "Auditing", "answer": "<p>Three mechanisms:<\/p><table><thead><tr><th><\/th><th>Completeness<\/th><th>Performance<\/th><th>Tamper resistance<\/th><\/tr><\/thead><tbody><tr><td><strong>Extension / native audit<\/strong> (<code>pgaudit<\/code>, Oracle Unified Audit, SQL Server Audit)<\/td><td>high - can capture every statement including reads, DDL and privileged actions<\/td><td>moderate - log volume is the cost, and full statement logging on a hot path is expensive<\/td><td>good if shipped off-host immediately; local files are editable by anyone with host access<\/td><\/tr><tr><td><strong>Trigger-based audit tables<\/strong><\/td><td>only what the triggers cover - DML on audited tables, no reads, and bypassable by <code>TRUNCATE<\/code> or by disabling the trigger<\/td><td>worst - a write per write, inside the transaction, doubling write volume and lock duration<\/td><td>poor - the audit rows live in the same database the actor can access<\/td><\/tr><tr><td><strong>Log-based capture (CDC)<\/strong><\/td><td>complete for data changes (it reads the WAL, so nothing can bypass it) but no reads and no failed attempts<\/td><td>best - asynchronous, no impact on the transaction path<\/td><td>good - the sink is a separate system<\/td><\/tr><\/tbody><\/table><p>What I actually build depends on what the audit is <em>for<\/em>: <strong>regulatory access logging<\/strong> (&quot;who read this record&quot;) needs statement-level auditing, because CDC cannot see reads; <strong>data lineage and change history<\/strong> (&quot;what did this record look like last March&quot;) is better served by CDC into an append-only store, or by a temporal table design (Q14) which makes history a first-class part of the model; <strong>security forensics<\/strong> needs both, plus authentication logs.<\/p><p>The properties I insist on regardless of mechanism: the audit trail is written to a <strong>separate system<\/strong> with different credentials (so compromising the database does not let you edit the evidence), it is <strong>append-only<\/strong> with retention enforced by the storage rather than by policy, it captures the <strong>application user<\/strong> and not just the database role (which means propagating the end-user identity, typically via <code>SET LOCAL application_name<\/code> or a session variable), and it is <strong>monitored<\/strong> - an audit log nobody queries is a compliance artefact, not a control.<\/p>", "source": "answers.md", "search": "auditing: database audit extensions, trigger-based audit tables, and log-based capture. compare completeness, performance and tamper resistance. three mechanisms: completeness performance tamper resistance --- --- --- --- extension / native audit (pgaudit, oracle unified audit, sql server audit) high - can capture every statement including reads, ddl and privileged actions moderate - log volume is the cost, and full statement logging on a hot path is expensive good if shipped off-host immediately; local files are editable by anyone with host access trigger-based audit tables only what the triggers cover - dml on audited tables, no reads, and bypassable by truncate or by disabling the trigger worst - a write per write, inside the transaction, doubling write volume and lock duration poor - the audit rows live in the same database the actor can access log-based capture (cdc) complete for data changes (it reads the wal, so nothing can bypass it) but no reads and no failed attempts best - asynchronous, no impact on the transaction path good - the sink is a separate system what i actually build depends on what the audit is for : regulatory access logging (\"who read this record\") needs statement-level auditing, because cdc cannot see reads; data lineage and change history (\"what did this record look like last march\") is better served by cdc into an append-only store, or by a temporal table design (q14) which makes history a first-class part of the model; security forensics needs both, plus authentication logs. the properties i insist on regardless of mechanism: the audit trail is written to a separate system with different credentials (so compromising the database does not let you edit the evidence), it is append-only with retention enforced by the storage rather than by policy, it captures the application user and not just the database role (which means propagating the end-user identity, typically via set local application_name or a session variable), and it is monitored - an audit log nobody queries is a compliance artefact, not a control."}, {"n": 275, "category": 16, "difficulty": "T", "html": "GDPR right to erasure against an append-only event store, backups and a data warehouse. How is this actually satisfied?", "answerTitle": "GDPR erasure against append-only stores", "answer": "<p>The reconciliation is that the regulation requires the data to become <strong>inaccessible and unusable<\/strong>, not that every byte is physically overwritten everywhere, and it explicitly allows for technical feasibility and for retention required by other legal obligations (tax, anti-money-laundering). That gives four practical mechanisms:<\/p><ol><li><strong>Crypto-shredding.<\/strong> Encrypt each subject&#x27;s personal data with a per-subject key; erasure is deleting the key. The ciphertext remains in the event store, the backups and the warehouse, and is permanently unreadable. This is the standard answer for immutable stores and the one I would design for from the start, because retrofitting it is expensive.<\/li><li><strong>Tombstone plus compaction<\/strong> for log-based systems: publish a deletion event, and rely on the store&#x27;s compaction (Kafka log compaction with a null value for the key, or a rewrite of the affected partitions in an Iceberg/Delta table) to remove the historical payloads. Requires the personal data to be keyed by subject, which is a modeling decision made years earlier.<\/li><li><strong>Separate the personal data from the event.<\/strong> Events carry a subject <em>reference<\/em>; the personal attributes live in a mutable profile store that can genuinely be deleted. The event history then remains intact and analytically useful while containing no personal data - this is the cleanest design and the one I would push for.<\/li><li><strong>Retain what the law requires<\/strong>, minimized and access-restricted, with the retention basis documented. An invoice is not erasable; a marketing profile is.<\/li><\/ol><p><strong>Backups<\/strong> are handled by policy rather than by surgery: you do not restore a backup to delete one person. The accepted approach is a documented, bounded backup retention window (say 35 days) after which the data ages out naturally, plus a <strong>suppression list<\/strong> applied on any restore so the erased subject is re-erased before the restored system serves traffic. <strong>Warehouses and lakes<\/strong> are handled by propagating the deletion request through the same pipeline that loaded the data, which requires the subject key to be present and tracked - which comes back to classification (Q273).<\/p><p>The point I would make in an interview: this is a <strong>design-time<\/strong> problem. A system that stored personal data inline in immutable events, unkeyed and unencrypted, cannot satisfy an erasure request without rewriting history, and no clever runtime trick fixes it.<\/p>", "source": "answers.md", "search": "gdpr right to erasure against an append-only event store, backups and a data warehouse. how is this actually satisfied? the reconciliation is that the regulation requires the data to become inaccessible and unusable , not that every byte is physically overwritten everywhere, and it explicitly allows for technical feasibility and for retention required by other legal obligations (tax, anti-money-laundering). that gives four practical mechanisms: 1. crypto-shredding. encrypt each subject's personal data with a per-subject key; erasure is deleting the key. the ciphertext remains in the event store, the backups and the warehouse, and is permanently unreadable. this is the standard answer for immutable stores and the one i would design for from the start, because retrofitting it is expensive. 2. tombstone plus compaction for log-based systems: publish a deletion event, and rely on the store's compaction (kafka log compaction with a null value for the key, or a rewrite of the affected partitions in an iceberg/delta table) to remove the historical payloads. requires the personal data to be keyed by subject, which is a modeling decision made years earlier. 3. separate the personal data from the event. events carry a subject reference ; the personal attributes live in a mutable profile store that can genuinely be deleted. the event history then remains intact and analytically useful while containing no personal data - this is the cleanest design and the one i would push for. 4. retain what the law requires , minimized and access-restricted, with the retention basis documented. an invoice is not erasable; a marketing profile is. backups are handled by policy rather than by surgery: you do not restore a backup to delete one person. the accepted approach is a documented, bounded backup retention window (say 35 days) after which the data ages out naturally, plus a suppression list applied on any restore so the erased subject is re-erased before the restored system serves traffic. warehouses and lakes are handled by propagating the deletion request through the same pipeline that loaded the data, which requires the subject key to be present and tracked - which comes back to classification (q273). the point i would make in an interview: this is a design-time problem. a system that stored personal data inline in immutable events, unkeyed and unencrypted, cannot satisfy an erasure request without rewriting history, and no clever runtime trick fixes it."}, {"n": 276, "category": 16, "difficulty": "D", "html": "Managed database cost shape: instance, storage, IOPS, backup, data transfer and the ones that surprise people. Compare RDS, Aurora and DynamoDB.", "answerTitle": "Managed database cost shape", "answer": "<table><thead><tr><th><\/th><th>RDS PostgreSQL<\/th><th>Aurora PostgreSQL<\/th><th>DynamoDB<\/th><\/tr><\/thead><tbody><tr><td>Compute<\/td><td>per instance-hour, whether idle or not<\/td><td>per instance-hour (or ACU-hour for Serverless v2)<\/td><td>none - it is in the request price<\/td><\/tr><tr><td>Storage<\/td><td>provisioned volume, paid for what you allocate<\/td><td>pay for what you <em>use<\/em>, grows automatically<\/td><td>per GB stored<\/td><\/tr><tr><td>IO<\/td><td>included in gp3 up to a baseline; provisioned IOPS extra<\/td><td><strong>per million IO requests<\/strong> (unless on I/O-Optimized)<\/td><td>included in request units<\/td><\/tr><tr><td>Requests<\/td><td>none<\/td><td>none<\/td><td>per read/write unit (Q208)<\/td><\/tr><tr><td>Backup<\/td><td>free up to the size of the database, then per GB<\/td><td>same<\/td><td>per GB of continuous backup or on-demand<\/td><\/tr><tr><td>Transfer<\/td><td>cross-AZ and cross-region charged<\/td><td>same, plus cross-region replication<\/td><td>same<\/td><\/tr><\/tbody><\/table><p>The ones that surprise people: <strong>cross-AZ data transfer<\/strong> between the application and a database in another AZ, which is invisible in the database bill and can rival it; <strong>Aurora&#x27;s per-IO charge<\/strong>, which makes a badly indexed workload (lots of buffer misses) dramatically more expensive than the same workload on RDS with gp3 - and which is why the I/O-Optimized configuration exists once IO is more than about 25 percent of the bill; <strong>backup storage<\/strong> on a database with high churn, because incremental backups of a bloated, constantly rewritten table are much larger than the database; <strong>snapshot retention<\/strong> accumulating quietly; <strong>provisioned IOPS<\/strong> left at a level set during a one-off migration; and <strong>DynamoDB GSIs<\/strong>, each of which duplicates the write cost of every item it indexes.<\/p>", "source": "answers.md", "search": "managed database cost shape: instance, storage, iops, backup, data transfer and the ones that surprise people. compare rds, aurora and dynamodb. rds postgresql aurora postgresql dynamodb --- --- --- --- compute per instance-hour, whether idle or not per instance-hour (or acu-hour for serverless v2) none - it is in the request price storage provisioned volume, paid for what you allocate pay for what you use , grows automatically per gb stored io included in gp3 up to a baseline; provisioned iops extra per million io requests (unless on i/o-optimized) included in request units requests none none per read/write unit (q208) backup free up to the size of the database, then per gb same per gb of continuous backup or on-demand transfer cross-az and cross-region charged same, plus cross-region replication same the ones that surprise people: cross-az data transfer between the application and a database in another az, which is invisible in the database bill and can rival it; aurora's per-io charge , which makes a badly indexed workload (lots of buffer misses) dramatically more expensive than the same workload on rds with gp3 - and which is why the i/o-optimized configuration exists once io is more than about 25 percent of the bill; backup storage on a database with high churn, because incremental backups of a bloated, constantly rewritten table are much larger than the database; snapshot retention accumulating quietly; provisioned iops left at a level set during a one-off migration; and dynamodb gsis , each of which duplicates the write cost of every item it indexes."}, {"n": 277, "category": 16, "difficulty": "D", "html": "Right-sizing a database: the signals you use, the risk of scaling down, and the three cheapest wins before you change instance class.", "answerTitle": "Right-sizing", "answer": "<p><strong>Signals I use<\/strong>: sustained CPU utilization (below 20-30 percent at peak means over-provisioned, but only if memory is also comfortable), the <strong>cache hit ratio and IO pattern<\/strong> (the real constraint on a database is usually whether the working set fits in RAM, not CPU), connection count against the instance&#x27;s limit, IOPS consumed versus provisioned, and the storage allocated versus used. I look at the <strong>peak<\/strong> of a full business cycle, not the average, and I check whether the peak is driven by a batch job that could move.<\/p><p><strong>The risk of scaling down<\/strong> is the cliff: a database is fine at 40 GB of RAM and pathological at 32 GB, because the working set no longer fits and read IO jumps by an order of magnitude in a single step. So a downsize is not a linear bet - it needs the working-set estimate (<code>pg_buffercache<\/code> or simply the size of the hot tables and indexes), a change during a low-traffic window, and a fast rollback path. Instance-class changes also cost a failover, so they are not free even when they are correct.<\/p><p><strong>The three cheapest wins before changing instance class<\/strong>:<\/p><ol><li><strong>Delete data.<\/strong> Retention policies, dropped unused indexes (Q58), archived cold partitions (Q162), and TOASTed blobs moved to object storage. This reduces storage, backup, IO and memory pressure at once, and it is the only intervention that improves performance <em>and<\/em> cost.<\/li><li><strong>Fix the top queries.<\/strong> The top five by total time are usually 50-80 percent of the load (Q258); halving them is equivalent to halving the instance, and it also reduces the Aurora IO bill directly.<\/li><li><strong>Buy the commitment, not the capacity.<\/strong> Reserved instances or savings plans on the <em>current<\/em> size give 30-50 percent immediately with no technical risk - and they should be bought only after steps 1 and 2, so you do not reserve capacity you are about to stop needing.<\/li><\/ol><p>Honourable mentions: moving non-production instances to a schedule (stopped overnight and at weekends is typically a 60 percent saving on those), gp2 to gp3, and switching a spiky, low-average workload to Serverless v2.<\/p>", "source": "answers.md", "search": "right-sizing a database: the signals you use, the risk of scaling down, and the three cheapest wins before you change instance class. signals i use : sustained cpu utilization (below 20-30 percent at peak means over-provisioned, but only if memory is also comfortable), the cache hit ratio and io pattern (the real constraint on a database is usually whether the working set fits in ram, not cpu), connection count against the instance's limit, iops consumed versus provisioned, and the storage allocated versus used. i look at the peak of a full business cycle, not the average, and i check whether the peak is driven by a batch job that could move. the risk of scaling down is the cliff: a database is fine at 40 gb of ram and pathological at 32 gb, because the working set no longer fits and read io jumps by an order of magnitude in a single step. so a downsize is not a linear bet - it needs the working-set estimate (pg_buffercache or simply the size of the hot tables and indexes), a change during a low-traffic window, and a fast rollback path. instance-class changes also cost a failover, so they are not free even when they are correct. the three cheapest wins before changing instance class : 1. delete data. retention policies, dropped unused indexes (q58), archived cold partitions (q162), and toasted blobs moved to object storage. this reduces storage, backup, io and memory pressure at once, and it is the only intervention that improves performance and cost. 2. fix the top queries. the top five by total time are usually 50-80 percent of the load (q258); halving them is equivalent to halving the instance, and it also reduces the aurora io bill directly. 3. buy the commitment, not the capacity. reserved instances or savings plans on the current size give 30-50 percent immediately with no technical risk - and they should be bought only after steps 1 and 2, so you do not reserve capacity you are about to stop needing. honourable mentions: moving non-production instances to a schedule (stopped overnight and at weekends is typically a 60 percent saving on those), gp2 to gp3, and switching a spiky, low-average workload to serverless v2."}, {"n": 278, "category": 16, "difficulty": "A", "html": "Data retention and archival policy: who decides, how you enforce it technically, and how retention interacts with partitioning.", "answerTitle": "Retention and archival", "answer": "<p><strong>Who decides<\/strong>: not engineering. Retention is a business and legal decision with three inputs - the <strong>legal minimum<\/strong> (tax, financial and sector regulation), the <strong>legal maximum<\/strong> (data protection principles say personal data may not be kept longer than necessary, so an indefinite default is itself a violation), and the <strong>business value<\/strong> of old data. My job is to make the cost visible, propose a default, and get an accountable owner to sign it per data domain. In practice I would drive it as a table: data domain, owner, legal basis, retention period, deletion mechanism, and the date it was last reviewed.<\/p><p><strong>How to enforce it technically<\/strong> - policy without a mechanism is a document that ages badly:<\/p><ul><li><strong>Partition by time and drop partitions<\/strong> (Q162). This is the mechanism that makes retention nearly free: a drop is instant, generates no bloat, no WAL burst and no replication lag, where a <code>DELETE<\/code> of the same data is hours of work and a bloated table.<\/li><li><strong>A tiering path before deletion<\/strong>: hot partitions in the database, warm ones detached and exported to Parquet in object storage (queryable by Athena/Trino when someone occasionally needs them), cold ones in an archive storage class, then deleted. Most &quot;we must keep everything&quot; requirements are satisfied by the middle tier at a tenth of the cost.<\/li><li><strong>TTL where the store supports it<\/strong> (DynamoDB, MongoDB, Cassandra, Redis) - noting the caveats about deletion delay and tombstones (Q203, Q210).<\/li><li><strong>Automation with alerting<\/strong>: the job that creates future partitions and drops expired ones runs on a schedule and pages if it fails, because a missing future partition is an outage (Q162) and a missing drop is a silent cost increase.<\/li><li><strong>Backups and downstream copies<\/strong> carry their own retention, and the policy must name them explicitly - otherwise data is &quot;deleted&quot; from the primary and lives for years in snapshots and the warehouse (Q275).<\/li><\/ul><p><strong>How retention interacts with partitioning<\/strong>: they should be designed together. The partition key must be the column the retention rule is expressed in (usually the event or creation timestamp, sometimes a business close date), and the partition granularity should divide the retention period sensibly - monthly partitions for a 7-year retention is 84 partitions, which is manageable; daily partitions for the same period is 2,555, which is not. Where two data domains in one table have different retention periods, that is a signal to split them. And where the retention rule depends on something <em>mutable<\/em> (delete 90 days after the account closes), partitioning by creation time does not help and you need either a periodic archival job keyed on the real predicate or a redesign that makes the retention dimension immutable.<\/p><p><em>Hook: a retention policy you introduced, and what it did to storage cost and query performance.<\/em><\/p>", "source": "answers.md", "search": "data retention and archival policy: who decides, how you enforce it technically, and how retention interacts with partitioning. who decides : not engineering. retention is a business and legal decision with three inputs - the legal minimum (tax, financial and sector regulation), the legal maximum (data protection principles say personal data may not be kept longer than necessary, so an indefinite default is itself a violation), and the business value of old data. my job is to make the cost visible, propose a default, and get an accountable owner to sign it per data domain. in practice i would drive it as a table: data domain, owner, legal basis, retention period, deletion mechanism, and the date it was last reviewed. how to enforce it technically - policy without a mechanism is a document that ages badly: - partition by time and drop partitions (q162). this is the mechanism that makes retention nearly free: a drop is instant, generates no bloat, no wal burst and no replication lag, where a delete of the same data is hours of work and a bloated table. - a tiering path before deletion : hot partitions in the database, warm ones detached and exported to parquet in object storage (queryable by athena/trino when someone occasionally needs them), cold ones in an archive storage class, then deleted. most \"we must keep everything\" requirements are satisfied by the middle tier at a tenth of the cost. - ttl where the store supports it (dynamodb, mongodb, cassandra, redis) - noting the caveats about deletion delay and tombstones (q203, q210). - automation with alerting : the job that creates future partitions and drops expired ones runs on a schedule and pages if it fails, because a missing future partition is an outage (q162) and a missing drop is a silent cost increase. - backups and downstream copies carry their own retention, and the policy must name them explicitly - otherwise data is \"deleted\" from the primary and lives for years in snapshots and the warehouse (q275). how retention interacts with partitioning : they should be designed together. the partition key must be the column the retention rule is expressed in (usually the event or creation timestamp, sometimes a business close date), and the partition granularity should divide the retention period sensibly - monthly partitions for a 7-year retention is 84 partitions, which is manageable; daily partitions for the same period is 2,555, which is not. where two data domains in one table have different retention periods, that is a signal to split them. and where the retention rule depends on something mutable (delete 90 days after the account closes), partitioning by creation time does not help and you need either a periodic archival job keyed on the real predicate or a redesign that makes the retention dimension immutable. hook: a retention policy you introduced, and what it did to storage cost and query performance."}, {"n": 279, "category": 17, "difficulty": "A", "html": "Design the data layer for a multi-tenant SaaS platform reaching 5,000 tenants, including isolation, migration and noisy-neighbor control.", "answerTitle": "Multi-tenant SaaS data layer at 5,000 tenants", "answer": "<blockquote><p>Design the data layer for a B2B SaaS platform growing from 300 to 5,000 tenants. Tenants range from 5 users to 3,000. Some enterprise customers demand contractual data isolation. The team is 25 engineers across five services.<\/p><\/blockquote><p><strong>Clarify.<\/strong> What is the total data volume and the distribution across tenants - is the largest tenant 100x the median or 10,000x? What is the write rate, and is it steady or batch-driven? What do the enterprise isolation demands actually say - separate database, separate encryption key, separate region, or just an attestation? Is there any cross-tenant query requirement (internal analytics, benchmarking features)? What are the per-tenant backup and restore expectations? Can a tenant be migrated between placements with a maintenance window, or must it be online?<\/p><p><strong>Isolate.<\/strong> The core tension is that <strong>the model that scales to 5,000 tenants (shared schema) is not the model that satisfies contractual isolation (database per tenant)<\/strong>, and picking one for everybody makes either the long tail unaffordable or the enterprise deals unwinnable. The second-order requirement, which is the one that actually bites, is that <strong>migration between placements must be routine<\/strong>, because tenants grow and contracts change.<\/p><p><strong>Decide.<\/strong> A <strong>tiered placement model<\/strong> with a routing directory, following the pool/bridge/silo pattern:<\/p><ul><li><strong>Pool<\/strong> - shared schema with <code>tenant_id<\/code> on every table, for the long tail. This is the default and where 95 percent of tenants live.<\/li><li><strong>Silo<\/strong> - a dedicated database (and, if required, a dedicated encryption key and region) for enterprise tenants who pay for it. Same schema, same code, same migration pipeline.<\/li><li>No <strong>bridge<\/strong> (schema-per-tenant) tier: it gives the migration cost of silo with the isolation of pool, and at 5,000 tenants the catalog and migration overhead is unpleasant (Q254, Q255).<\/li><\/ul><p>The trade I would state: the tiered model costs a routing layer and a tenant-migration tool up front, and buys the ability to say yes to an enterprise deal without a re-architecture.<\/p><p><strong>Execute.<\/strong><\/p><ol><li><strong>Routing directory<\/strong> - a small, highly cached, highly available lookup from tenant to connection target, consulted at the start of every request. Placement is data, not configuration, so moving a tenant is a row change plus a data move.<\/li><li><strong>Tenant context established once<\/strong>, at authentication, from the verified principal - never from a request parameter (Q270). Propagated as a request-scoped value and applied as <code>SET LOCAL app.tenant_id<\/code> at transaction start.<\/li><li><strong>Row-level security<\/strong> on every table in the pool, with <code>FORCE ROW LEVEL SECURITY<\/code> and a non-owner application role (Q269). This is the control that makes a forgotten <code>WHERE<\/code> clause return zero rows instead of everyone&#x27;s data - and at 25 engineers, someone will forget.<\/li><li><strong><code>tenant_id<\/code> as the leading column<\/strong> of every index that matters, and in every cache key, message key and search document.<\/li><li><strong>Noisy-neighbour control<\/strong>: per-tenant rate limiting at the API, <code>statement_timeout<\/code> on the application role, and a per-tenant query-cost metric so one tenant&#x27;s report cannot consume the pool. Promotion to silo is the escalation path for a tenant that outgrows the pool - which is a commercial conversation as much as a technical one.<\/li><li><strong>Migrations<\/strong> run once per placement through the same pipeline, parallelized across silos, backward compatible always (Q243), with a per-placement version table so partial rollout is visible.<\/li><li><strong>Per-tenant restore<\/strong> for the pool is the hard case: solve it with a logical export path (extract one tenant&#x27;s rows into a staging schema from a PITR clone) and rehearse it, because it <em>will<\/em> be asked for after a tenant deletes their own data.<\/li><\/ol><p><strong>Reflect.<\/strong> What I would monitor: per-tenant data volume and query cost (to spot the tenant about to become a problem), placement distribution, migration duration per placement, and RLS policy coverage as a CI check. The decision I would revisit at 10,000 tenants is whether the pool needs to become several pools (shards), which the routing directory makes an incremental change rather than a rewrite - and that is the main reason the directory exists from day one rather than a config file.<\/p><blockquote><p><em>Hook: a multi-tenant model you designed or migrated, and the first enterprise deal that tested it.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S11)", "search": "design the data layer for a multi-tenant saas platform reaching 5,000 tenants, including isolation, migration and noisy-neighbor control. design the data layer for a b2b saas platform growing from 300 to 5,000 tenants. tenants range from 5 users to 3,000. some enterprise customers demand contractual data isolation. the team is 25 engineers across five services. clarify. what is the total data volume and the distribution across tenants - is the largest tenant 100x the median or 10,000x? what is the write rate, and is it steady or batch-driven? what do the enterprise isolation demands actually say - separate database, separate encryption key, separate region, or just an attestation? is there any cross-tenant query requirement (internal analytics, benchmarking features)? what are the per-tenant backup and restore expectations? can a tenant be migrated between placements with a maintenance window, or must it be online? isolate. the core tension is that the model that scales to 5,000 tenants (shared schema) is not the model that satisfies contractual isolation (database per tenant) , and picking one for everybody makes either the long tail unaffordable or the enterprise deals unwinnable. the second-order requirement, which is the one that actually bites, is that migration between placements must be routine , because tenants grow and contracts change. decide. a tiered placement model with a routing directory, following the pool/bridge/silo pattern: - pool - shared schema with tenant_id on every table, for the long tail. this is the default and where 95 percent of tenants live. - silo - a dedicated database (and, if required, a dedicated encryption key and region) for enterprise tenants who pay for it. same schema, same code, same migration pipeline. - no bridge (schema-per-tenant) tier: it gives the migration cost of silo with the isolation of pool, and at 5,000 tenants the catalog and migration overhead is unpleasant (q254, q255). the trade i would state: the tiered model costs a routing layer and a tenant-migration tool up front, and buys the ability to say yes to an enterprise deal without a re-architecture. execute. 1. routing directory - a small, highly cached, highly available lookup from tenant to connection target, consulted at the start of every request. placement is data, not configuration, so moving a tenant is a row change plus a data move. 2. tenant context established once , at authentication, from the verified principal - never from a request parameter (q270). propagated as a request-scoped value and applied as set local app.tenant_id at transaction start. 3. row-level security on every table in the pool, with force row level security and a non-owner application role (q269). this is the control that makes a forgotten where clause return zero rows instead of everyone's data - and at 25 engineers, someone will forget. 4. tenant_id as the leading column of every index that matters, and in every cache key, message key and search document. 5. noisy-neighbour control : per-tenant rate limiting at the api, statement_timeout on the application role, and a per-tenant query-cost metric so one tenant's report cannot consume the pool. promotion to silo is the escalation path for a tenant that outgrows the pool - which is a commercial conversation as much as a technical one. 6. migrations run once per placement through the same pipeline, parallelized across silos, backward compatible always (q243), with a per-placement version table so partial rollout is visible. 7. per-tenant restore for the pool is the hard case: solve it with a logical export path (extract one tenant's rows into a staging schema from a pitr clone) and rehearse it, because it will be asked for after a tenant deletes their own data. reflect. what i would monitor: per-tenant data volume and query cost (to spot the tenant about to become a problem), placement distribution, migration duration per placement, and rls policy coverage as a ci check. the decision i would revisit at 10,000 tenants is whether the pool needs to become several pools (shards), which the routing directory makes an incremental change rather than a rewrite - and that is the main reason the directory exists from day one rather than a config file. hook: a multi-tenant model you designed or migrated, and the first enterprise deal that tested it."}, {"n": 280, "category": 17, "difficulty": "A", "html": "Design an audit and event store taking 50,000 writes per second with a seven-year retention requirement and ad-hoc investigation queries.", "answerTitle": "An audit and event store at 50,000 writes per second", "answer": "<blockquote><p>Design an audit store taking 50,000 events per second, retained for seven years, with occasional ad-hoc investigation queries (&quot;everything user X did in March 2024&quot;) and a regulatory requirement that records are tamper-evident.<\/p><\/blockquote><p><strong>Clarify.<\/strong> What is the average event size - 500 bytes or 5 KB? That is the difference between 25 MB/s and 250 MB/s, and between 5 TB and 50 TB per year. Is 50k the peak or the average, and what is the peak-to-average ratio? What is the acceptable ingest latency, and may events be lost on a crash or is durability required per event? What are the query patterns - by subject, by time, by event type, full text? What is the acceptable query latency for an investigation: seconds, or &quot;we&#x27;ll get back to you tomorrow&quot;? Does tamper-evident mean append-only storage, cryptographic chaining, or a third-party attestation? And who can read it - because that changes the security design more than the storage does.<\/p><p><strong>Isolate.<\/strong> Three requirements pull in different directions: <strong>ingest<\/strong> wants an append-optimized, partitioned, cheap-per-byte path; <strong>seven-year retention<\/strong> wants object storage at pennies per GB; <strong>ad-hoc investigation<\/strong> wants an index, which is expensive at this volume. Trying to satisfy all three in one system is the failure mode - either you pay for a hot index over 50 TB of cold data, or investigations take a full scan.<\/p><p><strong>Decide.<\/strong> A <strong>tiered pipeline<\/strong> with one ingest path and three storage tiers, plus a narrow index that spans them:<\/p><ol><li><strong>Ingest<\/strong>: append to a log (Kafka or Kinesis), partitioned by subject id so per-subject ordering is preserved. The log absorbs bursts, decouples producers from storage, and gives replay for free. At 50k/s with 1 KB events this is unremarkable for Kafka.<\/li><li><strong>Hot tier<\/strong> (last 30-90 days): a columnar or time-series analytics store - ClickHouse, or the warehouse - partitioned by day and sorted by <code>(subject_id, timestamp)<\/code>. Investigations of recent activity are the common case and are answered in seconds.<\/li><li><strong>Cold tier<\/strong> (everything): Parquet in object storage, partitioned by <code>year/month/day<\/code>, sorted by subject within each file so predicate pushdown skips row groups (Q220), registered as an Iceberg table so it can be queried by Athena/Trino without a restore (Q221).<\/li><li><strong>A subject index<\/strong>: a small mapping from subject id to the (partition, file) locations containing their events, so &quot;everything user X did in March 2024&quot; is a bounded set of file reads rather than a scan of a month. This is the piece that makes the cold tier usable and the piece teams usually omit.<\/li><\/ol><p><strong>Tamper evidence<\/strong>: hash each event with the previous event&#x27;s hash to form a per-partition chain, and periodically publish the chain head to a separate system (an append-only ledger, or simply a signed digest to a different account with object-lock retention). That gives detectability without requiring exotic storage. Object Lock / WORM on the cold tier with a compliance retention period covers the &quot;cannot be deleted&quot; requirement, and it must be applied in an <strong>account with different credentials<\/strong> from the one that writes.<\/p><p><strong>Execute.<\/strong> Ingest with idempotency (a deterministic event id so replay does not duplicate), batch writes into the hot tier in micro-batches of a few seconds, run the Parquet conversion as a scheduled compaction job producing files of 128-512 MB (not thousands of small ones), expire hot-tier partitions on schedule, and verify the chain periodically as a job that alerts on a break.<\/p><p><strong>Reflect.<\/strong> What I would watch: ingest lag on the log, compaction backlog, small-file count in the lake (the classic silent degradation), query latency by tier, and cost per TB per tier. The thing I would push back on during design is the retention itself (Q278) - &quot;seven years of everything&quot; is often &quot;seven years of a legally defined subset, and 90 days of the rest&quot;, and establishing that distinction is worth more than any technical optimization here.<\/p><blockquote><p><em>Hook: an event or audit store you built, its volume, and what retention actually cost.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S12)", "search": "design an audit and event store taking 50,000 writes per second with a seven-year retention requirement and ad-hoc investigation queries. design an audit store taking 50,000 events per second, retained for seven years, with occasional ad-hoc investigation queries (\"everything user x did in march 2024\") and a regulatory requirement that records are tamper-evident. clarify. what is the average event size - 500 bytes or 5 kb? that is the difference between 25 mb/s and 250 mb/s, and between 5 tb and 50 tb per year. is 50k the peak or the average, and what is the peak-to-average ratio? what is the acceptable ingest latency, and may events be lost on a crash or is durability required per event? what are the query patterns - by subject, by time, by event type, full text? what is the acceptable query latency for an investigation: seconds, or \"we'll get back to you tomorrow\"? does tamper-evident mean append-only storage, cryptographic chaining, or a third-party attestation? and who can read it - because that changes the security design more than the storage does. isolate. three requirements pull in different directions: ingest wants an append-optimized, partitioned, cheap-per-byte path; seven-year retention wants object storage at pennies per gb; ad-hoc investigation wants an index, which is expensive at this volume. trying to satisfy all three in one system is the failure mode - either you pay for a hot index over 50 tb of cold data, or investigations take a full scan. decide. a tiered pipeline with one ingest path and three storage tiers, plus a narrow index that spans them: 1. ingest : append to a log (kafka or kinesis), partitioned by subject id so per-subject ordering is preserved. the log absorbs bursts, decouples producers from storage, and gives replay for free. at 50k/s with 1 kb events this is unremarkable for kafka. 2. hot tier (last 30-90 days): a columnar or time-series analytics store - clickhouse, or the warehouse - partitioned by day and sorted by (subject_id, timestamp). investigations of recent activity are the common case and are answered in seconds. 3. cold tier (everything): parquet in object storage, partitioned by year/month/day, sorted by subject within each file so predicate pushdown skips row groups (q220), registered as an iceberg table so it can be queried by athena/trino without a restore (q221). 4. a subject index : a small mapping from subject id to the (partition, file) locations containing their events, so \"everything user x did in march 2024\" is a bounded set of file reads rather than a scan of a month. this is the piece that makes the cold tier usable and the piece teams usually omit. tamper evidence : hash each event with the previous event's hash to form a per-partition chain, and periodically publish the chain head to a separate system (an append-only ledger, or simply a signed digest to a different account with object-lock retention). that gives detectability without requiring exotic storage. object lock / worm on the cold tier with a compliance retention period covers the \"cannot be deleted\" requirement, and it must be applied in an account with different credentials from the one that writes. execute. ingest with idempotency (a deterministic event id so replay does not duplicate), batch writes into the hot tier in micro-batches of a few seconds, run the parquet conversion as a scheduled compaction job producing files of 128-512 mb (not thousands of small ones), expire hot-tier partitions on schedule, and verify the chain periodically as a job that alerts on a break. reflect. what i would watch: ingest lag on the log, compaction backlog, small-file count in the lake (the classic silent degradation), query latency by tier, and cost per tb per tier. the thing i would push back on during design is the retention itself (q278) - \"seven years of everything\" is often \"seven years of a legally defined subset, and 90 days of the rest\", and establishing that distinction is worth more than any technical optimization here. hook: an event or audit store you built, its volume, and what retention actually cost."}, {"n": 281, "category": 17, "difficulty": "A", "html": "Design the storage for a global product catalogue: read-heavy, multi-region, tolerant of seconds of staleness, with an admin path that is not.", "answerTitle": "A global read-heavy product catalogue", "answer": "<blockquote><p>Design storage for a product catalogue serving users in Europe, North America and Asia. Reads are 10,000 per second globally and latency-sensitive; writes are a few hundred per day from an internal admin tool, and the admin must see their change immediately.<\/p><\/blockquote><p><strong>Clarify.<\/strong> How large is the catalogue - 10,000 products or 50 million? How much staleness is acceptable for shoppers: seconds, a minute, an hour? Are there per-region variations (price, availability, legal restrictions) or is it one global dataset? Is search part of this, or a separate system? Is any part of the read path personalized (which would defeat shared caching)? What is the consequence of showing a stale price - a display issue, or a legal one?<\/p><p><strong>Isolate.<\/strong> The workload is extremely asymmetric: reads exceed writes by roughly a million to one, and the two paths have opposite requirements. The shopper path wants <strong>low latency, high volume, tolerant of seconds of staleness<\/strong>; the admin path wants <strong>strong consistency, trivial volume<\/strong>. Designing one system that satisfies both means over-engineering the read path or under-serving the admin. The other constraint is geography: no amount of database tuning fixes 150 ms of speed-of-light latency between Singapore and Frankfurt, so the data must be <em>near<\/em> the reader.<\/p><p><strong>Decide.<\/strong> <strong>A single-writer primary with globally distributed read copies, and a separate admin read path that goes to the primary.<\/strong><\/p><ul><li><strong>Write path<\/strong>: one regional primary (PostgreSQL) as the source of truth, with the full relational model, constraints and admin workflow. A few hundred writes per day needs nothing more.<\/li><li><strong>Distribution<\/strong>: on commit, publish the changed product as a document via the outbox or CDC (Q216), into a per-region read store - a document store or a read replica per region, and behind it a CDN for the truly cacheable responses.<\/li><li><strong>Read path<\/strong>: shoppers read the local region&#x27;s copy. Staleness is the propagation delay, typically under a second, and bounded by monitoring.<\/li><li><strong>Admin path<\/strong>: the admin tool reads and writes the <strong>primary<\/strong> directly, so it always sees its own writes with no special mechanism. This is the move that removes the hardest requirement almost for free - and it is available because admin volume is negligible.<\/li><li><strong>CDN<\/strong> in front for anonymous catalogue pages, with cache keys that include region and locale, and <strong>explicit purge on publish<\/strong> so a price change propagates in seconds rather than at TTL expiry (Q190).<\/li><\/ul><p><strong>Execute.<\/strong> Version each product document so an out-of-order update cannot overwrite a newer one; make the publish idempotent; add a reconciliation job comparing the primary against each region&#x27;s copy by checksum, with a drift metric and a targeted repair path; give the admin tool a &quot;publish&quot; action with a visible propagation status so the human knows when shoppers can see it; and keep a per-region staleness metric (write timestamp to read-visible timestamp) as an SLI.<\/p><p><strong>Reflect.<\/strong> The trade I would state plainly is that I have chosen <strong>eventual consistency for shoppers and strong consistency for the admin<\/strong>, and that this is legitimate only because a shopper seeing a one-second-old description is harmless. If the business says a <em>price<\/em> change must be globally atomic - a legal requirement in some markets - the design changes: prices move to a separately versioned artefact with an effective-from timestamp, published ahead of time and activated by clock, which is how retail actually solves it. That is the question I would make sure to ask before drawing anything.<\/p><blockquote><p><em>Hook: a globally distributed read model you built, and the staleness you had to negotiate.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S13)", "search": "design the storage for a global product catalogue: read-heavy, multi-region, tolerant of seconds of staleness, with an admin path that is not. design storage for a product catalogue serving users in europe, north america and asia. reads are 10,000 per second globally and latency-sensitive; writes are a few hundred per day from an internal admin tool, and the admin must see their change immediately. clarify. how large is the catalogue - 10,000 products or 50 million? how much staleness is acceptable for shoppers: seconds, a minute, an hour? are there per-region variations (price, availability, legal restrictions) or is it one global dataset? is search part of this, or a separate system? is any part of the read path personalized (which would defeat shared caching)? what is the consequence of showing a stale price - a display issue, or a legal one? isolate. the workload is extremely asymmetric: reads exceed writes by roughly a million to one, and the two paths have opposite requirements. the shopper path wants low latency, high volume, tolerant of seconds of staleness ; the admin path wants strong consistency, trivial volume . designing one system that satisfies both means over-engineering the read path or under-serving the admin. the other constraint is geography: no amount of database tuning fixes 150 ms of speed-of-light latency between singapore and frankfurt, so the data must be near the reader. decide. a single-writer primary with globally distributed read copies, and a separate admin read path that goes to the primary. - write path : one regional primary (postgresql) as the source of truth, with the full relational model, constraints and admin workflow. a few hundred writes per day needs nothing more. - distribution : on commit, publish the changed product as a document via the outbox or cdc (q216), into a per-region read store - a document store or a read replica per region, and behind it a cdn for the truly cacheable responses. - read path : shoppers read the local region's copy. staleness is the propagation delay, typically under a second, and bounded by monitoring. - admin path : the admin tool reads and writes the primary directly, so it always sees its own writes with no special mechanism. this is the move that removes the hardest requirement almost for free - and it is available because admin volume is negligible. - cdn in front for anonymous catalogue pages, with cache keys that include region and locale, and explicit purge on publish so a price change propagates in seconds rather than at ttl expiry (q190). execute. version each product document so an out-of-order update cannot overwrite a newer one; make the publish idempotent; add a reconciliation job comparing the primary against each region's copy by checksum, with a drift metric and a targeted repair path; give the admin tool a \"publish\" action with a visible propagation status so the human knows when shoppers can see it; and keep a per-region staleness metric (write timestamp to read-visible timestamp) as an sli. reflect. the trade i would state plainly is that i have chosen eventual consistency for shoppers and strong consistency for the admin , and that this is legitimate only because a shopper seeing a one-second-old description is harmless. if the business says a price change must be globally atomic - a legal requirement in some markets - the design changes: prices move to a separately versioned artefact with an effective-from timestamp, published ahead of time and activated by clock, which is how retail actually solves it. that is the question i would make sure to ask before drawing anything. hook: a globally distributed read model you built, and the staleness you had to negotiate."}, {"n": 282, "category": 17, "difficulty": "A", "html": "Design the read path for an analytics dashboard that must not touch the OLTP primary and must be at most five minutes stale.", "answerTitle": "An analytics read path that must not touch the primary", "answer": "<blockquote><p>The business wants dashboards and ad-hoc analysis over operational data. The OLTP primary is already at 60 percent CPU at peak and has caused two incidents this year. Data may be up to five minutes stale.<\/p><\/blockquote><p><strong>Clarify.<\/strong> How many concurrent analysts and dashboards, and what is the query shape - a fixed set of aggregates, or genuinely ad-hoc SQL? What data volume is in scope - the whole database or a dozen tables? Do the analysts need row-level detail or aggregates? Who owns the metric definitions? Is five minutes a real requirement or an aspiration (Q226)? Is there an existing warehouse, and what is the appetite for another piece of infrastructure?<\/p><p><strong>Isolate.<\/strong> The requirement is really three: <strong>isolation<\/strong> (analytics must not consume OLTP capacity), <strong>query shape<\/strong> (scans and aggregates, which a row store serves badly), and <strong>freshness<\/strong> (five minutes, which rules out a nightly batch and does not require streaming). The trap is to solve only the first by pointing the BI tool at a read replica - which isolates CPU but brings the query-cancellation problem (Q224), still uses a row store for scan workloads, and puts an uncontrolled workload one <code>hot_standby_feedback<\/code> setting away from damaging the primary.<\/p><p><strong>Decide.<\/strong> <strong>CDC from the primary into a columnar analytics store, with a modelled semantic layer on top.<\/strong><\/p><ol><li><strong>Capture<\/strong>: logical decoding via Debezium on a dedicated replication slot (with <code>max_slot_wal_keep_size<\/code> set so a stalled connector cannot fill the primary&#x27;s disk - Q148). CDC rather than query-based extraction, because it does not scan the source and it captures deletes.<\/li><li><strong>Land<\/strong>: raw change events into the analytics store or object storage, then merge into current-state tables. At this scale the warehouse&#x27;s own merge (or an Iceberg table with upserts) is enough; micro-batch every one to two minutes to hit the five-minute target with margin.<\/li><li><strong>Model<\/strong>: a curated layer of tested SQL models (dbt or equivalent) producing conformed dimensions and fact tables, with slowly-changing dimensions where history matters (Q218, Q219). This is where metric definitions live, and it is the part that determines whether anyone trusts the numbers.<\/li><li><strong>Serve<\/strong>: dashboards read <strong>pre-aggregated rollups<\/strong>, never raw facts, so a dashboard load is hundreds of rows. Ad-hoc analysts get the curated layer with a query cost limit.<\/li><\/ol><p><strong>Execute.<\/strong> Start with the 10-15 tables the dashboards actually need rather than replicating everything; add freshness monitoring as a first-class SLI (a heartbeat row written to the source and measured at the destination); reconcile row counts and key checksums nightly with a drift alert; handle schema changes in the source explicitly, since logical decoding does not replicate DDL (Q150) and an unhandled column addition is the most common pipeline break; and give the analytics store its own budget and owner.<\/p><p><strong>Reflect.<\/strong> The organizational point matters as much as the technical one: the two incidents this year happened because analytics and operations shared a system with no boundary, and the fix is a boundary, not a tuning exercise. I would define who owns freshness, who owns metric definitions and who is allowed to run arbitrary SQL, and I would keep a deliberately unglamorous fallback - a read replica with a low <code>statement_timeout<\/code> - for the genuinely one-off investigation that does not justify a model. The sequencing I would propose is to run the replica-plus-summary-tables version first for a quarter, because most dashboards are rebuilt twice before the definitions stabilize, and building the pipeline before the definitions is how you get an expensive pipeline serving the wrong numbers.<\/p><blockquote><p><em>Hook: an analytics path you separated from OLTP, and what it did to the primary&#x27;s incident rate.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S14)", "search": "design the read path for an analytics dashboard that must not touch the oltp primary and must be at most five minutes stale. the business wants dashboards and ad-hoc analysis over operational data. the oltp primary is already at 60 percent cpu at peak and has caused two incidents this year. data may be up to five minutes stale. clarify. how many concurrent analysts and dashboards, and what is the query shape - a fixed set of aggregates, or genuinely ad-hoc sql? what data volume is in scope - the whole database or a dozen tables? do the analysts need row-level detail or aggregates? who owns the metric definitions? is five minutes a real requirement or an aspiration (q226)? is there an existing warehouse, and what is the appetite for another piece of infrastructure? isolate. the requirement is really three: isolation (analytics must not consume oltp capacity), query shape (scans and aggregates, which a row store serves badly), and freshness (five minutes, which rules out a nightly batch and does not require streaming). the trap is to solve only the first by pointing the bi tool at a read replica - which isolates cpu but brings the query-cancellation problem (q224), still uses a row store for scan workloads, and puts an uncontrolled workload one hot_standby_feedback setting away from damaging the primary. decide. cdc from the primary into a columnar analytics store, with a modelled semantic layer on top. 1. capture : logical decoding via debezium on a dedicated replication slot (with max_slot_wal_keep_size set so a stalled connector cannot fill the primary's disk - q148). cdc rather than query-based extraction, because it does not scan the source and it captures deletes. 2. land : raw change events into the analytics store or object storage, then merge into current-state tables. at this scale the warehouse's own merge (or an iceberg table with upserts) is enough; micro-batch every one to two minutes to hit the five-minute target with margin. 3. model : a curated layer of tested sql models (dbt or equivalent) producing conformed dimensions and fact tables, with slowly-changing dimensions where history matters (q218, q219). this is where metric definitions live, and it is the part that determines whether anyone trusts the numbers. 4. serve : dashboards read pre-aggregated rollups , never raw facts, so a dashboard load is hundreds of rows. ad-hoc analysts get the curated layer with a query cost limit. execute. start with the 10-15 tables the dashboards actually need rather than replicating everything; add freshness monitoring as a first-class sli (a heartbeat row written to the source and measured at the destination); reconcile row counts and key checksums nightly with a drift alert; handle schema changes in the source explicitly, since logical decoding does not replicate ddl (q150) and an unhandled column addition is the most common pipeline break; and give the analytics store its own budget and owner. reflect. the organizational point matters as much as the technical one: the two incidents this year happened because analytics and operations shared a system with no boundary, and the fix is a boundary, not a tuning exercise. i would define who owns freshness, who owns metric definitions and who is allowed to run arbitrary sql, and i would keep a deliberately unglamorous fallback - a read replica with a low statement_timeout - for the genuinely one-off investigation that does not justify a model. the sequencing i would propose is to run the replica-plus-summary-tables version first for a quarter, because most dashboards are rebuilt twice before the definitions stabilize, and building the pipeline before the definitions is how you get an expensive pipeline serving the wrong numbers. hook: an analytics path you separated from oltp, and what it did to the primary's incident rate."}, {"n": 283, "category": 17, "difficulty": "A", "html": "Design the data separation for pulling an orders service out of a monolith whose four modules all read the same tables.", "answerTitle": "Data separation for extracting an orders service", "answer": "<blockquote><p>A monolith has four modules - orders, inventory, billing and reporting - all reading and writing the same PostgreSQL schema, with foreign keys and joins across all of it. The orders module is to become its own service. 200 million order rows.<\/p><\/blockquote><p><strong>Clarify.<\/strong> Which tables does orders genuinely own, and which does it merely read? What are the actual cross-module joins in production, ranked by frequency - not what the model implies, but what <code>pg_stat_statements<\/code> shows? Are there cross-module transactions, and what invariants do they protect? What is the acceptable consistency between orders and the others afterwards - can inventory see an order one second late? What is the deadline, and is there an appetite for a period of dual running?<\/p><p><strong>Isolate.<\/strong> The hard part is not the code, it is that <strong>the foreign keys and joins encode invariants nobody has written down<\/strong>. Splitting the data converts compile-time and transactional coupling into runtime and temporal coupling (<code>03-microservices<\/code> Q61), and the question is which of those invariants must survive as strong consistency, which become eventually consistent, and which turn out not to be invariants at all.<\/p><p>The order of operations is also fixed by risk: <strong>code first, data last<\/strong> (<code>03-microservices<\/code> Q224). Splitting the tables before the code is isolated leaves you with a distributed system <em>and<\/em> a monolith.<\/p><p><strong>Decide.<\/strong> A strangler-style separation with the data move last and reversible at every step.<\/p><p><strong>Execute.<\/strong><\/p><ol><li><strong>Establish the boundary in code, inside the monolith.<\/strong> Orders becomes a module with an explicit interface; every cross-module access to orders&#x27; tables is routed through it. This is the step that discovers the real coupling, and it is entirely reversible. Enforce it with an architecture test that fails the build on a direct table reference.<\/li><li><strong>Break the read joins.<\/strong> For each cross-module join, decide: does the other module need a <em>copy<\/em> of the data (denormalize a few columns, kept in sync by events), an <em>API call<\/em> (acceptable if it is not in a hot loop), or was the join only serving a report (in which case it moves to the analytics path, S14)? Do this while everything is still in one database, so each change is independently verifiable.<\/li><li><strong>Break the write transactions.<\/strong> For each cross-module transaction, either keep both writes on one side of the boundary (often the right answer - the boundary was wrong), or convert it to a saga with compensations plus an outbox for the event (<code>03-microservices<\/code> Q83, Q90). Every conversion needs an explicit answer to &quot;what does the system look like between the two steps&quot;.<\/li><li><strong>Remove the cross-boundary foreign keys<\/strong>, replacing each with a documented reconciliation check that alerts on orphans. This is the moment the database stops enforcing the invariant, so the alert is not optional.<\/li><li><strong>Move the data.<\/strong> Logical replication of the orders tables to a new database, running until lag is negligible; the new service reads from the new database in shadow mode and its results are compared against the monolith&#x27;s; then writes cut over per traffic slice with the ability to route back.<\/li><li><strong>Decommission<\/strong> the old tables only after a retention period, with a backup of the dropped tables taken deliberately.<\/li><\/ol><p><strong>Reflect.<\/strong> The measures I would watch during the migration: orphan counts from the reconciliation checks, saga completion and compensation rates, p99 of the paths that became network calls, and replication lag during the move. The judgement call I would flag to stakeholders is step 3 - each transaction converted to a saga is a <em>business<\/em> decision about what the system may show a user in an intermediate state, and it needs a product owner, not an architect, to sign it off. And the honest possibility to keep open is that step 2 reveals the boundary is wrong: if orders and inventory change together in most releases, the correct outcome of this exercise is to keep them together and split something else (<code>03-microservices<\/code> Q5).<\/p><blockquote><p><em>Hook: a service extraction you led, the invariant the foreign key was hiding, and what you found in step 2.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S15)", "search": "design the data separation for pulling an orders service out of a monolith whose four modules all read the same tables. a monolith has four modules - orders, inventory, billing and reporting - all reading and writing the same postgresql schema, with foreign keys and joins across all of it. the orders module is to become its own service. 200 million order rows. clarify. which tables does orders genuinely own, and which does it merely read? what are the actual cross-module joins in production, ranked by frequency - not what the model implies, but what pg_stat_statements shows? are there cross-module transactions, and what invariants do they protect? what is the acceptable consistency between orders and the others afterwards - can inventory see an order one second late? what is the deadline, and is there an appetite for a period of dual running? isolate. the hard part is not the code, it is that the foreign keys and joins encode invariants nobody has written down . splitting the data converts compile-time and transactional coupling into runtime and temporal coupling (03-microservices q61), and the question is which of those invariants must survive as strong consistency, which become eventually consistent, and which turn out not to be invariants at all. the order of operations is also fixed by risk: code first, data last (03-microservices q224). splitting the tables before the code is isolated leaves you with a distributed system and a monolith. decide. a strangler-style separation with the data move last and reversible at every step. execute. 1. establish the boundary in code, inside the monolith. orders becomes a module with an explicit interface; every cross-module access to orders' tables is routed through it. this is the step that discovers the real coupling, and it is entirely reversible. enforce it with an architecture test that fails the build on a direct table reference. 2. break the read joins. for each cross-module join, decide: does the other module need a copy of the data (denormalize a few columns, kept in sync by events), an api call (acceptable if it is not in a hot loop), or was the join only serving a report (in which case it moves to the analytics path, s14)? do this while everything is still in one database, so each change is independently verifiable. 3. break the write transactions. for each cross-module transaction, either keep both writes on one side of the boundary (often the right answer - the boundary was wrong), or convert it to a saga with compensations plus an outbox for the event (03-microservices q83, q90). every conversion needs an vioural data. Both are user-facing, both are latency-sensitive.<\/p><\/blockquote><p><strong>Clarify.<\/strong> What is the booking volume versus the recommendation query volume - probably a 100:1 ratio, which matters enormously? How fresh must recommendations be with respect to availability: may we recommend something that just sold out, and what is the user experience if we do? How large is the inventory, and how large is the behavioural dataset? Is the recommendation model computed offline and served, or computed at request time? What is the latency budget for a recommendation response? Is there a legal or financial consequence to a double booking (yes, always) and to a bad recommendation (usually not)?<\/p><p><strong>Isolate.<\/strong> The two workloads have opposite characteristics and must not share a system: booking is <strong>write-contended, strongly consistent, low volume, and correctness-critical<\/strong>; recommendation is <strong>read-heavy, high volume, tolerant of staleness, and quality-critical rather than correctness-critical<\/strong>. The shared entity - inventory - is what tempts people to use one store, and the failure mode of doing so is that a recommendation scan competes with a booking transaction for the same rows and the same buffer pool.<\/p><p><strong>Decide.<\/strong> <strong>A transactional core plus a derived read model, with the availability check as the seam.<\/strong><\/p><ul><li><strong>Bookings<\/strong> on PostgreSQL. The double-booking invariant is enforced by the database, not the application: an <code>EXCLUDE USING gist (resource_id WITH =, during WITH &amp;&amp;)<\/code> constraint makes overlapping reservations impossible regardless of concurrency (Q12), which is far stronger than a check-then-insert under any isolation level (Q84). Payment consistency via the outbox and a saga with the payment provider; audit via a temporal or append-only design (Q14).<\/li><li><strong>Recommendations<\/strong> served from a derived read model - a document or key-value store keyed by user or by context, holding pre-scored candidate sets, refreshed by an offline scoring pipeline and updated incrementally from behavioural events. Serving is a key lookup, so latency is predictable and the load never touches the booking database.<\/li><li><strong>The seam<\/strong>: recommendations are allowed to be <em>stale about availability<\/em>, and the booking flow performs the <strong>authoritative availability check at the point of intent<\/strong> - when the user clicks through, and again transactionally at confirm. Showing a recommendation for something that just sold out is acceptable if the next screen handles it gracefully; the reverse, selling something twice, is not.<\/li><li><strong>Freshness<\/strong>: availability changes propagate to the read model via CDC or the outbox within seconds, so the window is small and bounded, and hot items can be filtered at serve time against a small, cheap availability cache.<\/li><\/ul><p><strong>Execute.<\/strong> Build the availability check as a single service-owned operation used by both paths so there is one definition; make the recommendation pipeline&#x27;s input the same event stream that feeds analytics (one pipeline, several consumers); measure the &quot;recommended but unavailable&quot; rate as a product metric, because it is the direct measure of whether the staleness budget is right; and load-test the booking path with the recommendation traffic present, since the whole point of the design is that they do not interact.<\/p><p><strong>Reflect.<\/strong> The reasoning I would want an interviewer to hear is the classification: <strong>one invariant is a hard constraint enforced by the database, everything else is a quality metric with a staleness budget<\/strong>. Once you say that out loud, the architecture follows - the hard constraint gets a small, boring, transactional store, and the quality metric gets a derived model optimized for reads. The failure mode I would call out is the opposite instinct, which is to make recommendations strongly consistent &quot;to be safe&quot;: it couples the two systems, puts scan traffic on the booking database, and buys nothing a user can perceive.<\/p><blockquote><p><em>Hook: a system where you separated a hard invariant from a soft one, and the constraint you pushed into the database.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S16)", "search": "design storage and access for a system handling both transactional bookings and a recommendation feature over the same entities. a travel platform needs transactional bookings (no double-booking, payment consistency, audit) and a recommendation feature that scores and ranks the same inventory using behavioural data. both are user-facing, both are latency-sensitive. clarify. what is the booking volume versus the recommendation query volume - probably a 100:1 ratio, which matters enormously? how fresh must recommendations be with respect to availability: may we recommend something that just sold out, and what is the user experience if we do? how large is the inventory, and how large is the behavioural dataset? is the recommendation model computed offline and served, or computed at request time? what is the latency budget for a recommendation response? is there a legal or financial consequence to a double booking (yes, always) and to a bad recommendation (usually not)? isolate. the two workloads have opposite characteristics and must not share a system: booking is write-contended, strongly consistent, low volume, and correctness-critical ; recommendation is read-heavy, high volume, tolerant of staleness, and quality-critical rather than correctness-critical . the shared entity - inventory - is what tempts people to use one store, and the failure mode of doing so is that a recommendation scan competes with a booking transaction for the same rows and the same buffer pool. decide. a transactional core plus a derived read model, with the availability check as the seam. - bookings on postgresql. the double-booking invariant is enforced by the database, not the application: an exclude using gist (resource_id with =, during with &&) constraint makes overlapping reservations impossible regardless of concurrency (q12), which is far stronger than a check-then-insert under any isolation level (q84). payment consistency via the outbox and a saga with the payment provider; audit via a temporal or append-only design (q14). - recommendations served from a derived read model - a document or key-value store keyed by user or by context, holding pre-scored candidate sets, refreshed by an offline scoring pipeline and updated incrementally from behavioural events. serving is a key lookup, so latency is predictable and the load never touches the booking database. - the seam : recommendations are allowed to be stale about availability , and the booking flow performs the authoritative availability check at the point of intent - when the user clicks through, and again transactionally at confirm. showing a recommendation for something that just sold out is acceptable if the next screen handles it gracefully; the reverse, selling something twice, is not. - freshness : availability changes propagate to the read model via cdc or the outbox within seconds, so the window is small and bounded, and hot items can be filtered at serve time against a small, cheap availability cache. execute. build the availability check as a single service-owned operation used by both paths so there is one definition; make the recommendation pipeline's input the same event stream that feeds analytics (one pipeline, several consumers); measure the \"recommended but unavailable\" rate as a product metric, because it is the direct measure of whether the staleness budget is right; and load-test the booking path with the recommendation traffic present, since the whole point of the design is that they do not interact. reflect. the reasoning i would want an interviewer to hear is the classification: one invariant is a hard constraint enforced by the database, everything else is a quality metric with a staleness budget . once you say that out loud, the architecture follows - the hard constraint gets a small, boring, transactional store, and the quality metric gets a derived model optimized for reads. the failure mode i would call out is the opposite instinct, which is to make recommendations strongly consistent \"to be safe\": it couples the two systems, puts scan traffic on the booking database, and buys nothing a user can perceive. hook: a system where you separated a hard invariant from a soft one, and the constraint you pushed into the database."}, {"n": 285, "category": 17, "difficulty": null, "html": "A time you chose the boring database and were proved right - or wrong.", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or three minutes, and always quantify the Result.<\/p><p>Worked examples of this style of question are in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part C, and the frameworks plus the stories to prepare are in <a href=\"../01-java/README.md\">the README<\/a>.<\/p>", "source": null, "search": "a time you chose the boring database and were proved right - or wrong. "}, {"n": 286, "category": 17, "difficulty": null, "html": "A data-layer decision you made that you would reverse today, and what it would take to reverse it.", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or three minutes, and always quantify the Result.<\/p><p>Worked examples of this style of question are in <a
