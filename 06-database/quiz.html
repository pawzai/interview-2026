berately - carry the few columns from the other aggregate that queries need, accepting the staleness. - serve cross-cutting queries from a different store : a search index or an analytics warehouse fed by cdc handles \"find all orders matching x across all tenants\" far better than a scatter-gather (q216). - bound the fan-out : allow scatter-gather only for admin and background paths, with a timeout and partial-results semantics, never on a user-facing hot path."}, {"n": 167, "category": 9, "difficulty": "D", "html": "Distributed SQL: how Spanner, CockroachDB and YugabyteDB achieve serializable transactions across nodes. What is TrueTime doing?", "answerTitle": "Distributed SQL and TrueTime", "answer": "<p>These systems provide serializable (or externally consistent) transactions across nodes by combining three things: <strong>data sharded into ranges<\/strong>, each range <strong>replicated by Raft<\/strong> so a write is committed by a majority of its replicas, and a <strong>distributed transaction protocol<\/strong> (two-phase commit across the ranges involved, coordinated through the same Raft groups so the coordinator itself is fault-tolerant - which removes the classic blocking-coordinator problem from Q102).<\/p><p>The remaining problem is ordering transactions globally without a single clock. <strong>Spanner&#x27;s TrueTime<\/strong> is an API that returns an <em>interval<\/em> <code>[earliest, latest]<\/code> guaranteed to contain the true time, backed by GPS receivers and atomic clocks in every data centre, with an uncertainty bound of a few milliseconds. Spanner assigns each transaction a commit timestamp and then <strong>waits out the uncertainty<\/strong> (&quot;commit wait&quot;) before making it visible, which guarantees that if T1 commits before T2 begins in real time, T1&#x27;s timestamp is smaller. That is external consistency (linearizability) for the whole database - and it costs a few milliseconds of added commit latency, which is Google buying a hardware guarantee to avoid a coordination round trip.<\/p><p><strong>CockroachDB<\/strong> has no atomic clocks, so it uses HLC timestamps with a configured <code>max_offset<\/code> (default 500 ms) and, instead of waiting, <strong>restarts<\/strong> transactions that read a value inside their uncertainty window. <strong>YugabyteDB<\/strong> offers both a hybrid-clock mode and a clock-bound mode. The trade is stated cleanly: Spanner pays latency on every commit for a hardware-backed bound; CockroachDB pays occasional retries and a weaker guarantee by default.<\/p>", "source": "answers.md", "search": "distributed sql: how spanner, cockroachdb and yugabytedb achieve serializable transactions across nodes. what is truetime doing? these systems provide serializable (or externally consistent) transactions across nodes by combining three things: data sharded into ranges , each range replicated by raft so a write is committed by a majority of its replicas, and a distributed transaction protocol (two-phase commit across the ranges involved, coordinated through the same raft groups so the coordinator itself is fault-tolerant - which removes the classic blocking-coordinator problem from q102). the remaining problem is ordering transactions globally without a single clock. spanner's truetime is an api that returns an interval [earliest, latest] guaranteed to contain the true time, backed by gps receivers and atomic clocks in every data centre, with an uncertainty bound of a few milliseconds. spanner assigns each transaction a commit timestamp and then waits out the uncertainty (\"commit wait\") before making it visible, which guarantees that if t1 commits before t2 begins in real time, t1's timestamp is smaller. that is external consistency (linearizability) for the whole database - and it costs a few milliseconds of added commit latency, which is google buying a hardware guarantee to avoid a coordination round trip. cockroachdb has no atomic clocks, so it uses hlc timestamps with a configured max_offset (default 500 ms) and, instead of waiting, restarts transactions that read a value inside their uncertainty window. yugabytedb offers both a hybrid-clock mode and a clock-bound mode. the trade is stated cleanly: spanner pays latency on every commit for a hardware-backed bound; cockroachdb pays occasional retries and a weaker guarantee by default."}, {"n": 168, "category": 9, "difficulty": "D", "html": "Aurora&#x27;s architecture: separated compute and storage, the quorum of six, and why failover is fast. What does it not fix?", "answerTitle": "Aurora's architecture", "answer": "<p>Compute and storage are separated. The database instance keeps the buffer pool and the query engine but <strong>writes only WAL records<\/strong> to a distributed storage service, which holds six copies of each 10 GB segment across three AZs. Writes are acknowledged on a <strong>quorum of four of six<\/strong>, reads need three of six, and the storage nodes materialize pages from the log independently and continuously. Replicas attach to the <em>same<\/em> storage rather than replaying a WAL stream, so replica lag is typically tens of milliseconds and adding a replica copies no data.<\/p><p>Why failover is fast: a replica already shares the storage, so promotion does not require replaying WAL or copying anything - it is largely a matter of the new writer establishing its position and invalidating cached pages, typically under 30 seconds (faster with the cluster endpoint and RDS Proxy holding client connections).<\/p><p>What it does not fix: it is still <strong>one writer<\/strong> for the cluster, so write throughput is bounded by a single instance; it does not change the SQL engine&#x27;s behavior, so all your query, index, lock and vacuum problems are identical; its IO pricing means a write-heavy or badly indexed workload can be dramatically more expensive than provisioned storage; the maximum volume is finite (128 TB); and cross-region is still asynchronous (Aurora Global Database, ~1 s RPO). The honest summary: Aurora fixes storage durability, replica lag and failover time, and fixes nothing above the storage layer.<\/p>", "source": "answers.md", "search": "aurora's architecture: separated compute and storage, the quorum of six, and why failover is fast. what does it not fix? compute and storage are separated. the database instance keeps the buffer pool and the query engine but writes only wal records to a distributed storage service, which holds six copies of each 10 gb segment across three azs. writes are acknowledged on a quorum of four of six , reads need three of six, and the storage nodes materialize pages from the log independently and continuously. replicas attach to the same storage rather than replaying a wal stream, so replica lag is typically tens of milliseconds and adding a replica copies no data. why failover is fast: a replica already shares the storage, so promotion does not require replaying wal or copying anything - it is largely a matter of the new writer establishing its position and invalidating cached pages, typically under 30 seconds (faster with the cluster endpoint and rds proxy holding client connections). what it does not fix: it is still one writer for the cluster, so write throughput is bounded by a single instance; it does not change the sql engine's behavior, so all your query, index, lock and vacuum problems are identical; its io pricing means a write-heavy or badly indexed workload can be dramatically more expensive than provisioned storage; the maximum volume is finite (128 tb); and cross-region is still asynchronous (aurora global database, ~1 s rpo). the honest summary: aurora fixes storage durability, replica lag and failover time, and fixes nothing above the storage layer."}, {"n": 169, "category": 9, "difficulty": "D", "html": "Vitess and Citus as sharding layers over MySQL and PostgreSQL. What do they add and what leaks through?", "answerTitle": "Vitess and Citus", "answer": "<p><strong>Vitess<\/strong> sits in front of MySQL: <code>vtgate<\/code> is a proxy speaking the MySQL protocol that parses queries, consults a <strong>VSchema<\/strong> describing how each table is sharded, and routes or scatters accordingly; <code>vttablet<\/code> manages each MySQL instance. It adds transparent sharding, online resharding with automatic cutover, connection pooling, query rewriting and guardrails against dangerous queries. It is what runs YouTube and Slack.<\/p><p><strong>Citus<\/strong> is a PostgreSQL extension: a coordinator holds the metadata and distributes tables by a hash of the distribution column across worker nodes, pushing down whole queries where possible, running parallel fragments and merging results otherwise. It also supports <strong>reference tables<\/strong> replicated to every node (which is how you keep joins local) and columnar storage for analytics.<\/p><p>What leaks through in both: queries <strong>without the distribution key<\/strong> become scatter-gather with all the properties of Q166; <strong>cross-shard transactions<\/strong> are supported but expensive (Citus uses 2PC, Vitess offers weaker modes by default); <strong>DDL<\/strong> must be applied everywhere and some forms are restricted; <strong>unique constraints and foreign keys<\/strong> must include the distribution column or be restricted to reference tables; sequences and <code>AUTO_INCREMENT<\/code> need special handling; and the optimizer&#x27;s estimates across shards are weaker than a single node&#x27;s. They remove most of the routing work and none of the modeling work - the shard key decision (Q163) is still yours and still the thing that determines success.<\/p>", "source": "answers.md", "search": "vitess and citus as sharding layers over mysql and postgresql. what do they add and what leaks through? vitess sits in front of mysql: vtgate is a proxy speaking the mysql protocol that parses queries, consults a vschema describing how each table is sharded, and routes or scatters accordingly; vttablet manages each mysql instance. it adds transparent sharding, online resharding with automatic cutover, connection pooling, query rewriting and guardrails against dangerous queries. it is what runs youtube and slack. citus is a postgresql extension: a coordinator holds the metadata and distributes tables by a hash of the distribution column across worker nodes, pushing down whole queries where possible, running parallel fragments and merging results otherwise. it also supports reference tables replicated to every node (which is how you keep joins local) and columnar storage for analytics. what leaks through in both: queries without the distribution key become scatter-gather with all the properties of q166; cross-shard transactions are supported but expensive (citus uses 2pc, vitess offers weaker modes by default); ddl must be applied everywhere and some forms are restricted; unique constraints and foreign keys must include the distribution column or be restricted to reference tables; sequences and auto_increment need special handling; and the optimizer's estimates across shards are weaker than a single node's. they remove most of the routing work and none of the modeling work - the shard key decision (q163) is still yours and still the thing that determines success."}, {"n": 170, "category": 9, "difficulty": "T", "html": "&quot;Just add a read replica&quot; is offered as the fix for a write-bound system. Explain why it makes things worse.", "answerTitle": "\"Just add a read replica\" for a write-bound system", "answer": "<p>Every replica applies <strong>every write<\/strong> that the primary does. Adding a replica therefore adds zero write capacity and actively subtracts from it:<\/p><ul><li>The primary must <strong>stream WAL<\/strong> to one more consumer - network and CPU on the primary.<\/li><li>If replicas use slots with <code>hot_standby_feedback = on<\/code>, they <strong>hold back the primary&#x27;s xmin horizon<\/strong>, so vacuum falls further behind exactly when write volume is high, which increases bloat and makes writes slower still (Q93, Q148).<\/li><li>Recovery replay on a standby is largely single-threaded, so a write-bound primary produces WAL faster than the replica can apply it: lag grows, and any read routed there returns stale data, generating support tickets that look like new bugs (Q143).<\/li><li>Operationally you now have more nodes to patch, monitor, fail over and pay for.<\/li><\/ul><p>So the intervention makes the symptom worse and adds a second symptom. The correct responses to a write-bound system are: reduce write volume (batching, eliminating redundant updates, removing unnecessary indexes so each write costs less - Q56), make writes cheaper (HOT updates, fillfactor, fewer indexes, <code>synchronous_commit<\/code> for low-value writes), move a write-heavy workload to a store designed for it (events to Kafka, counters to Redis), scale up the primary, or shard (Q172).<\/p><p>The diagnostic that settles the argument: look at whether the primary is saturated on WAL/IO/CPU during writes, and what proportion of time is spent on read queries. If reads are 20 percent of the load, no amount of read scaling matters.<\/p>", "source": "answers.md", "search": "\"just add a read replica\" is offered as the fix for a write-bound system. explain why it makes things worse. every replica applies every write that the primary does. adding a replica therefore adds zero write capacity and actively subtracts from it: - the primary must stream wal to one more consumer - network and cpu on the primary. - if replicas use slots with hot_standby_feedback = on, they hold back the primary's xmin horizon , so vacuum falls further behind exactly when write volume is high, which increases bloat and makes writes slower still (q93, q148). - recovery replay on a standby is largely single-threaded, so a write-bound primary produces wal faster than the replica can apply it: lag grows, and any read routed there returns stale data, generating support tickets that look like new bugs (q143). - operationally you now have more nodes to patch, monitor, fail over and pay for. so the intervention makes the symptom worse and adds a second symptom. the correct responses to a write-bound system are: reduce write volume (batching, eliminating redundant updates, removing unnecessary indexes so each write costs less - q56), make writes cheaper (hot updates, fillfactor, fewer indexes, synchronous_commit for low-value writes), move a write-heavy workload to a store designed for it (events to kafka, counters to redis), scale up the primary, or shard (q172). the diagnostic that settles the argument: look at whether the primary is saturated on wal/io/cpu during writes, and what proportion of time is spent on read queries. if reads are 20 percent of the load, no amount of read scaling matters."}, {"n": 171, "category": 9, "difficulty": "D", "html": "Scaling reads: replicas, caching, materialized views and denormalized read models. Give the decision order.", "answerTitle": "Scaling reads, in order", "answer": "<ol><li><strong>Fix the queries and indexes first.<\/strong> The cheapest read capacity is the work you stop doing. A single missing index or an N+1 loop routinely accounts for the majority of read load, and no amount of infrastructure fixes it.<\/li><li><strong>Cache<\/strong> the hot, repeated, tolerably stale reads (Q173). Highest leverage per rupee, and it removes load rather than distributing it - but it adds an invalidation problem.<\/li><li><strong>Read replicas<\/strong> for read volume that must be fresh-ish and diverse (not cacheable because every query differs). Adds staleness and routing complexity (Q145).<\/li><li><strong>Materialized views / summary tables<\/strong> for expensive aggregates that many readers share. Converts repeated expensive computation into a scheduled one.<\/li><li><strong>Denormalized read models<\/strong> (CQRS) fed by CDC or the outbox, when the read shape is fundamentally different from the write shape - a search index, a document per screen. The most powerful and the most expensive to operate, because it introduces a sync pipeline and drift.<\/li><\/ol><p>The decision order is deliberately cheapest-and-most-reversible first. The question I ask at each step is &quot;what fraction of the read load does this remove, and what does it cost me in staleness?&quot; - and I make the staleness explicit, because every layer after step 1 introduces some.<\/p>", "source": "answers.md", "search": "scaling reads: replicas, caching, materialized views and denormalized read models. give the decision order. 1. fix the queries and indexes first. the cheapest read capacity is the work you stop doing. a single missing index or an n+1 loop routinely accounts for the majority of read load, and no amount of infrastructure fixes it. 2. cache the hot, repeated, tolerably stale reads (q173). highest leverage per rupee, and it removes load rather than distributing it - but it adds an invalidation problem. 3. read replicas for read volume that must be fresh-ish and diverse (not cacheable because every query differs). adds staleness and routing complexity (q145). 4. materialized views / summary tables for expensive aggregates that many readers share. converts repeated expensive computation into a scheduled one. 5. denormalized read models (cqrs) fed by cdc or the outbox, when the read shape is fundamentally different from the write shape - a search index, a document per screen. the most powerful and the most expensive to operate, because it introduces a sync pipeline and drift. the decision order is deliberately cheapest-and-most-reversible first. the question i ask at each step is \"what fraction of the read load does this remove, and what does it cost me in staleness?\" - and i make the staleness explicit, because every layer after step 1 introduces some."}, {"n": 172, "category": 9, "difficulty": "A", "html": "At what point do you shard a PostgreSQL database, and what would you do for the two years before that point?", "answerTitle": "When to shard PostgreSQL", "answer": "<p><strong>When<\/strong>: I shard when one or more of these is true and cannot be resolved otherwise - the write throughput exceeds what the largest single instance can sustain; the dataset has grown to where routine operations (vacuum, index builds, backup, restore) no longer fit in any window, which usually bites well before query performance does; the RTO is unachievable because restoring the volume takes too long; or one tenant&#x27;s load must be isolated from another&#x27;s for contractual reasons. Note that &quot;the table is big&quot; is not on that list.<\/p><p><strong>What I would do for the two years before that point<\/strong>, roughly in order:<\/p><ol><li>Query and index hygiene, and killing N+1 (the largest single lever, every time).<\/li><li>Connection pooling done properly - PgBouncer in transaction mode with a sane pool size (Q235, Q240).<\/li><li>Caching for the read hot path, and read replicas for the rest (Q171).<\/li><li><strong>Partitioning<\/strong> the two or three tables that dominate volume, by time or tenant, so vacuum, retention and index size become manageable (Q158). This buys the most time per unit of effort and is fully reversible.<\/li><li>Moving non-relational workloads out: events to Kafka or a time-series store, blobs to object storage, counters and sessions to Redis, search to a search engine. Databases usually grow because they are being used as five things at once.<\/li><li>Vertical scaling - which is unfashionable but buys years; modern instances go to hundreds of cores and terabytes of RAM.<\/li><li><strong>Functional partitioning<\/strong> - splitting a bounded context onto its own database - before hash sharding, because it follows an existing boundary and needs no key.<\/li><\/ol><p>And the preparation that makes eventual sharding cheap: make sure the shard key (usually <code>tenant_id<\/code>) is present on every table and in every query from day one, keep cross-tenant queries out of the hot path, and avoid depending on global sequences and cross-aggregate transactions. If the model is shard-ready, sharding becomes a routing project rather than a rewrite.<\/p><p><em>Hook: a system where you deferred sharding for years with partitioning and caching, and what finally forced the decision.<\/em><\/p>", "source": "answers.md", "search": "at what point do you shard a postgresql database, and what would you do for the two years before that point? when : i shard when one or more of these is true and cannot be resolved otherwise - the write throughput exceeds what the largest single instance can sustain; the dataset has grown to where routine operations (vacuum, index builds, backup, restore) no longer fit in any window, which usually bites well before query performance does; the rto is unachievable because restoring the volume takes too long; or one tenant's load must be isolated from another's for contractual reasons. note that \"the table is big\" is not on that list. what i would do for the two years before that point , roughly in order: 1. query and index hygiene, and killing n+1 (the largest single lever, every time). 2. connection pooling done properly - pgbouncer in transaction mode with a sane pool size (q235, q240). 3. caching for the read hot path, and read replicas for the rest (q171). 4. partitioning the two or three tables that dominate volume, by time or tenant, so vacuum, retention and index size become manageable (q158). this buys the most time per unit of effort and is fully reversible. 5. moving non-relational workloads out: events to kafka or a time-series store, blobs to object storage, counters and sessions to redis, search to a search engine. databases usually grow because they are being used as five things at once. 6. vertical scaling - which is unfashionable but buys years; modern instances go to hundreds of cores and terabytes of ram. 7. functional partitioning - splitting a bounded context onto its own database - before hash sharding, because it follows an existing boundary and needs no key. and the preparation that makes eventual sharding cheap: make sure the shard key (usually tenant_id) is present on every table and in every query from day one, keep cross-tenant queries out of the hot path, and avoid depending on global sequences and cross-aggregate transactions. if the model is shard-ready, sharding becomes a routing project rather than a rewrite. hook: a system where you deferred sharding for years with partitioning and caching, and what finally forced the decision."}, {"n": 173, "category": 10, "difficulty": "C", "html": "Cache-aside, read-through, write-through, write-behind and refresh-ahead. State the consistency guarantee and the failure mode of each.", "answerTitle": "The caching patterns", "answer": "<table><thead><tr><th>Pattern<\/th><th>Read path<\/th><th>Write path<\/th><th>Consistency<\/th><th>Failure mode<\/th><\/tr><\/thead><tbody><tr><td><strong>Cache-aside<\/strong><\/td><td>miss -&gt; load from DB -&gt; populate<\/td><td>write DB, invalidate cache<\/td><td>eventual; races possible (Q174)<\/td><td>stale entry if invalidation is lost<\/td><\/tr><tr><td><strong>Read-through<\/strong><\/td><td>cache library loads on miss<\/td><td>as above, via the library<\/td><td>same, but centralized<\/td><td>a cache outage becomes a database outage unless bypassed<\/td><\/tr><tr><td><strong>Write-through<\/strong><\/td><td>always a hit after write<\/td><td>write cache and DB synchronously<\/td><td>strong between the two, if both succeed<\/td><td>write latency is the sum; partial failure needs care<\/td><\/tr><tr><td><strong>Write-behind<\/strong><\/td><td>as above<\/td><td>write cache, flush to DB asynchronously<\/td><td>DB lags the cache<\/td><td><strong>data loss<\/strong> if the cache dies before flushing<\/td><\/tr><tr><td><strong>Refresh-ahead<\/strong><\/td><td>hit; entry refreshed before expiry<\/td><td>unchanged<\/td><td>staleness bounded by refresh interval<\/td><td>wasted refreshes for cold keys<\/td><\/tr><\/tbody><\/table><p>Cache-aside is the default because it is simple, the cache is optional (a cache outage degrades rather than breaks), and it caches only what is actually read. Write-through suits read-heavy data that must never be stale after a write. Write-behind buys write throughput and is only acceptable for data you can lose - metrics, counters, last-seen timestamps.<\/p>", "source": "answers.md", "search": "cache-aside, read-through, write-through, write-behind and refresh-ahead. state the consistency guarantee and the failure mode of each. pattern read path write path consistency failure mode --- --- --- --- --- cache-aside miss - load from db - populate write db, invalidate cache eventual; races possible (q174) stale entry if invalidation is lost read-through cache library loads on miss as above, via the library same, but centralized a cache outage becomes a database outage unless bypassed write-through always a hit after write write cache and db synchronously strong between the two, if both succeed write latency is the sum; partial failure needs care write-behind as above write cache, flush to db asynchronously db lags the cache data loss if the cache dies before flushing refresh-ahead hit; entry refreshed before expiry unchanged staleness bounded by refresh interval wasted refreshes for cold keys cache-aside is the default because it is simple, the cache is optional (a cache outage degrades rather than breaks), and it caches only what is actually read. write-through suits read-heavy data that must never be stale after a write. write-behind buys write throughput and is only acceptable for data you can lose - metrics, counters, last-seen timestamps."}, {"n": 174, "category": 10, "difficulty": "T", "html": "With cache-aside, describe the exact interleaving that leaves a stale value in the cache permanently, and the two standard fixes.", "answerTitle": "The permanent stale entry", "answer": "<p>The interleaving, with a reader filling the cache and a writer invalidating it:<\/p><pre><code>Reader:  cache miss\nReader:  SELECT -&gt; reads value V1\n                                  Writer: UPDATE row to V2\n                                  Writer: DELETE cache key      (nothing there yet)\nReader:  SET cache key = V1       (writes the stale value, with a full TTL)<\/code><\/pre><p>The cache now holds V1 while the database holds V2, and nothing will correct it until the TTL expires - which is why &quot;forever&quot; is only bounded by the TTL, and why an infinite TTL turns this into a permanent bug.<\/p><p>The two standard fixes:<\/p><ol><li><strong>Delete twice (delayed double delete)<\/strong>: the writer invalidates, updates the database, and schedules a second invalidation a short interval later (longer than the maximum read-then-write gap). Simple, probabilistic, widely used.<\/li><li><strong>Set with a version or use an atomic conditional write<\/strong>: the reader writes to the cache only if the entry is still absent or older, using the row&#x27;s version/<code>xmin<\/code> as part of the value and <code>SET ... NX<\/code> or a Lua compare-and-set. Deterministic, slightly more code.<\/li><\/ol><p>Also effective in practice: <strong>always use a TTL<\/strong> so any inconsistency is self-healing; and prefer invalidating <strong>after<\/strong> the database commit, never before, so a rolled-back transaction cannot leave the cache showing a value that never existed.<\/p>", "source": "answers.md", "search": "with cache-aside, describe the exact interleaving that leaves a stale value in the cache permanently, and the two standard fixes. the interleaving, with a reader filling the cache and a writer invalidating it: reader: cache miss reader: select - reads value v1 writer: update row to v2 writer: delete cache key (nothing there yet) reader: set cache key = v1 (writes the stale value, with a full ttl) the cache now holds v1 while the database holds v2, and nothing will correct it until the ttl expires - which is why \"forever\" is only bounded by the ttl, and why an infinite ttl turns this into a permanent bug. the two standard fixes: 1. delete twice (delayed double delete) : the writer invalidates, updates the database, and schedules a second invalidation a short interval later (longer than the maximum read-then-write gap). simple, probabilistic, widely used. 2. set with a version or use an atomic conditional write : the reader writes to the cache only if the entry is still absent or older, using the row's version/xmin as part of the value and set ... nx or a lua compare-and-set. deterministic, slightly more code. also effective in practice: always use a ttl so any inconsistency is self-healing; and prefer invalidating after the database commit, never before, so a rolled-back transaction cannot leave the cache showing a value that never existed."}, {"n": 175, "category": 10, "difficulty": "D", "html": "Invalidate versus update on write. Why is &quot;delete the key&quot; almost always safer than &quot;write the new value&quot;?", "answerTitle": "Invalidate versus update on write", "answer": "<p>&quot;Delete the key&quot; is safer for three reasons:<\/p><ol><li><strong>Concurrency.<\/strong> Two writers updating the same row produce two cache writes whose arrival order at the cache is not guaranteed to match their commit order at the database, so the cache can end up holding the older value permanently. Deletion is idempotent and order-independent: whoever deletes last, the next reader repopulates from the source of truth.<\/li><li><strong>Correctness of the derived value.<\/strong> The cached entry is often not the row - it is a projection, an aggregate, a rendered document. The writer usually does not have all the inputs needed to compute the new cached value correctly, and computing it wrong is worse than a miss.<\/li><li><strong>Cost.<\/strong> Updating writes a value that may never be read; deleting costs nothing and repopulation happens only if someone actually needs it. On a large fan-out (one row appearing in 40 cached views), deleting is much cheaper than recomputing all 40.<\/li><\/ol><p>The exception is a very hot key where a miss would cause a stampede (Q177): there, updating in place - or refresh-ahead - avoids the thundering herd, and it is worth the extra care.<\/p>", "source": "answers.md", "search": "invalidate versus update on write. why is \"delete the key\" almost always safer than \"write the new value\"? \"delete the key\" is safer for three reasons: 1. concurrency. two writers updating the same row produce two cache writes whose arrival order at the cache is not guaranteed to match their commit order at the database, so the cache can end up holding the older value permanently. deletion is idempotent and order-independent: whoever deletes last, the next reader repopulates from the source of truth. 2. correctness of the derived value. the cached entry is often not the row - it is a projection, an aggregate, a rendered document. the writer usually does not have all the inputs needed to compute the new cached value correctly, and computing it wrong is worse than a miss. 3. cost. updating writes a value that may never be read; deleting costs nothing and repopulation happens only if someone actually needs it. on a large fan-out (one row appearing in 40 cached views), deleting is much cheaper than recomputing all 40. the exception is a very hot key where a miss would cause a stampede (q177): there, updating in place - or refresh-ahead - avoids the thundering herd, and it is worth the extra care."}, {"n": 176, "category": 10, "difficulty": "D", "html": "TTL strategy: how you choose one, why you add jitter, and the arithmetic for how much jitter.", "answerTitle": "TTL and jitter", "answer": "<p>Choosing a TTL is a business question first: how stale may this be before it is wrong? Then a technical one: how expensive is a miss, and how often does the underlying data change? A useful frame is that the TTL bounds your worst-case inconsistency when an invalidation is lost, so I set it as the <em>maximum tolerable staleness<\/em> rather than as a performance knob, and I rely on explicit invalidation for freshness.<\/p><p><strong>Jitter<\/strong> exists because identical TTLs synchronize. A thousand keys populated by the same deployment or the same batch job all expire in the same second, and the database receives a thousand simultaneous misses - an avalanche (Q179), repeating every TTL period.<\/p><p>The arithmetic: with base TTL <code>T<\/code> and jitter <code>±j<\/code>, expirations are spread over <code>2j<\/code>, so the peak miss rate falls from <code>N<\/code> per instant to roughly <code>N/(2j)<\/code> per second. For 100,000 keys with a 10-minute TTL and 10 percent jitter (±60 s), that is 100,000 misses spread over 120 seconds - about 830 per second instead of a single 100,000-request spike. I use 10-25 percent jitter as a default: <code>ttl = base * (0.9 + random() * 0.2)<\/code>.<\/p>", "source": "answers.md", "search": "ttl strategy: how you choose one, why you add jitter, and the arithmetic for how much jitter. choosing a ttl is a business question first: how stale may this be before it is wrong? then a technical one: how expensive is a miss, and how often does the underlying data change? a useful frame is that the ttl bounds your worst-case inconsistency when an invalidation is lost, so i set it as the maximum tolerable staleness rather than as a performance knob, and i rely on explicit invalidation for freshness. jitter exists because identical ttls synchronize. a thousand keys populated by the same deployment or the same batch job all expire in the same second, and the database receives a thousand simultaneous misses - an avalanche (q179), repeating every ttl period. the arithmetic: with base ttl t and jitter ±j, expirations are spread over 2j, so the peak miss rate falls from n per instant to roughly n/(2j) per second. for 100,000 keys with a 10-minute ttl and 10 percent jitter (±60 s), that is 100,000 misses spread over 120 seconds - about 830 per second instead of a single 100,000-request spike. i use 10-25 percent jitter as a default: ttl = base (0.9 + random() 0.2)."}, {"n": 177, "category": 10, "difficulty": "D", "html": "Cache stampede, dogpile and thundering herd. Compare locking, early recomputation and stale-while-revalidate.", "answerTitle": "Stampede, dogpile, thundering herd", "answer": "<p>All three name the same shape: a popular key expires (or the cache restarts) and N concurrent requests all miss and all recompute the same expensive value simultaneously.<\/p><table><thead><tr><th>Mitigation<\/th><th>How it works<\/th><th>Cost<\/th><\/tr><\/thead><tbody><tr><td><strong>Locking / single-flight<\/strong><\/td><td>the first miss takes a short-lived lock (<code>SET key:lock NX EX 5<\/code>); others wait briefly and re-read, or return stale<\/td><td>added latency for the waiters; the lock holder can die, so it needs a TTL and a fallback<\/td><\/tr><tr><td><strong>Early recomputation (probabilistic)<\/strong><\/td><td>each reader recomputes with probability rising as expiry approaches (XFetch: recompute if <code>now - delta*beta*ln(rand) &gt;= expiry<\/code>)<\/td><td>occasional redundant work, no coordination, elegant and stateless<\/td><\/tr><tr><td><strong>Stale-while-revalidate<\/strong><\/td><td>serve the expired value immediately and refresh in the background<\/td><td>requires storing the value past its logical expiry; readers get bounded staleness<\/td><\/tr><\/tbody><\/table><p>I default to <strong>stale-while-revalidate plus single-flight<\/strong>: the value is stored with a logical expiry inside it and a much longer physical TTL, so a reader that finds it logically stale returns it immediately and triggers exactly one background refresh. Nobody waits, the database sees one query, and the only cost is bounded staleness. Spring&#x27;s <code>@Cacheable(sync = true)<\/code> gives you the single-flight half within one JVM (<code>02-spring<\/code> Q52) - note it is per-instance, so with 20 pods you still get 20 concurrent loads, which is why the lock needs to be in Redis rather than in the process.<\/p>", "source": "answers.md", "search": "cache stampede, dogpile and thundering herd. compare locking, early recomputation and stale-while-revalidate. all three name the same shape: a popular key expires (or the cache restarts) and n concurrent requests all miss and all recompute the same expensive value simultaneously. mitigation how it works cost --- --- --- locking / single-flight the first miss takes a short-lived lock (set key:lock nx ex 5); others wait briefly and re-read, or return stale added latency for the waiters; the lock holder can die, so it needs a ttl and a fallback early recomputation (probabilistic) each reader recomputes with probability rising as expiry approaches (xfetch: recompute if now - delta beta ln(rand) = expiry) occasional redundant work, no coordination, elegant and stateless stale-while-revalidate serve the expired value immediately and refresh in the background requires storing the value past its logical expiry; readers get bounded staleness i default to stale-while-revalidate plus single-flight : the value is stored with a logical expiry inside it and a much longer physical ttl, so a reader that finds it logically stale returns it immediately and triggers exactly one background refresh. nobody waits, the database sees one query, and the only cost is bounded staleness. spring's @cacheable(sync = true) gives you the single-flight half within one jvm (02-spring q52) - note it is per-instance, so with 20 pods you still get 20 concurrent loads, which is why the lock needs to be in redis rather than in the process."}, {"n": 178, "category": 10, "difficulty": "T", "html": "Your cache hit rate is 99 percent and the database still falls over when the cache restarts. Compute why, and describe the warm-up strategy.", "answerTitle": "99 percent hit rate and the cache restarts", "answer": "<p>The arithmetic is the point. Suppose the application serves 20,000 reads per second with a 99 percent hit rate: the database currently sees 200 reads per second and is sized comfortably for that. When the cache restarts empty, the database receives <strong>20,000 reads per second<\/strong> - a 100x step change, instantly. Even if the database could theoretically serve 2,000, it is now 10x over capacity: queues build, latency rises, connection pools exhaust, the application times out and <em>retries<\/em>, which adds more load, and the system enters a metastable failure that does not recover even after the cache is warm, because the retry storm keeps it saturated.<\/p><p>The general form: your database is sized for the <strong>miss rate<\/strong>, and the cache hit rate is a multiplier on how far you are from the cliff. A 99 percent hit rate means you are 100x under-provisioned for a cold cache.<\/p><p>The warm-up strategy:<\/p><ol><li><strong>Never restart into full traffic.<\/strong> Warm the cache before the instance takes traffic - a preload job for the known-hot key set (the top N keys by access, exported periodically), or replay a sample of recent requests.<\/li><li><strong>Persistence and replicas<\/strong>: Redis with AOF/RDB restores its dataset on restart, and a replica promotion keeps the working set - so the cold-cache event should be rare and planned rather than a routine restart.<\/li><li><strong>Protect the database independently<\/strong>: a concurrency limiter or bulkhead on database access (a small connection pool is itself a limiter), single-flight so N misses for the same key become one query, and load shedding that returns a degraded response rather than queueing.<\/li><li><strong>Gradual ramp<\/strong>: bring the instance into the load balancer slowly (slow start), so misses arrive at a rate the database can absorb.<\/li><\/ol><p>The test that proves it: kill the cache in a game day and watch. Most teams discover this in production instead.<\/p>", "source": "answers.md", "search": "your cache hit rate is 99 percent and the database still falls over when the cache restarts. compute why, and describe the warm-up strategy. the arithmetic is the point. suppose the application serves 20,000 reads per second with a 99 percent hit rate: the database currently sees 200 reads per second and is sized comfortably for that. when the cache restarts empty, the database receives 20,000 reads per second - a 100x step change, instantly. even if the database could theoretically serve 2,000, it is now 10x over capacity: queues build, latency rises, connection pools exhaust, the application times out and retries , which adds more load, and the system enters a metastable failure that does not recover even after the cache is warm, because the retry storm keeps it saturated. the general form: your database is sized for the miss rate , and the cache hit rate is a multiplier on how far you are from the cliff. a 99 percent hit rate means you are 100x under-provisioned for a cold cache. the warm-up strategy: 1. never restart into full traffic. warm the cache before the instance takes traffic - a preload job for the known-hot key set (the top n keys by access, exported periodically), or replay a sample of recent requests. 2. persistence and replicas : redis with aof/rdb restores its dataset on restart, and a replica promotion keeps the working set - so the cold-cache event should be rare and planned rather than a routine restart. 3. protect the database independently : a concurrency limiter or bulkhead on database access (a small connection pool is itself a limiter), single-flight so n misses for the same key become one query, and load shedding that returns a degraded response rather than queueing. 4. gradual ramp : bring the instance into the load balancer slowly (slow start), so misses arrive at a rate the database can absorb. the test that proves it: kill the cache in a game day and watch. most teams discover this in production instead."}, {"n": 179, "category": 10, "difficulty": "D", "html": "Cache penetration (misses for keys that do not exist) and cache avalanche. Give the mitigation for each, including bloom filters.", "answerTitle": "Penetration and avalanche", "answer": "<p><strong>Cache penetration<\/strong> is repeated misses for keys that <strong>do not exist<\/strong> in the database either - typically an attacker enumerating ids, or a client bug requesting a deleted resource in a loop. The cache never helps because there is nothing to store, so every request reaches the database.<\/p><p>Mitigations: <strong>cache the negative result<\/strong> with a short TTL (<code>key -&gt; NOT_FOUND<\/code>, 30-60 s), which is the simplest and handles most real cases; <strong>validate the key shape<\/strong> before querying (a UUID that is not a UUID, an id outside the allocated range); and a <strong>Bloom filter<\/strong> of all existing keys in front of the cache - a probabilistic set with no false negatives, so &quot;not in the filter&quot; definitively means &quot;does not exist&quot; and the query is skipped. A Bloom filter for 100 million keys at a 1 percent false-positive rate is about 120 MB, which is why it is attractive at scale; the cost is that it must be kept in sync with deletions (which Bloom filters cannot do - you need a counting or cuckoo filter, or periodic rebuilds).<\/p><p><strong>Cache avalanche<\/strong> is mass simultaneous expiry or a cache-tier failure sending the whole load to the database at once. Mitigations: TTL jitter (Q176), cache clustering so one node&#x27;s failure loses only a fraction of the keys, persistence so a restart is not a cold start (Q178), a circuit breaker in front of the database, and a small in-process L1 cache that absorbs the first wave even when Redis is unreachable.<\/p>", "source": "answers.md", "search": "cache penetration (misses for keys that do not exist) and cache avalanche. give the mitigation for each, including bloom filters. cache penetration is repeated misses for keys that do not exist in the database either - typically an attacker enumerating ids, or a client bug requesting a deleted resource in a loop. the cache never helps because there is nothing to store, so every request reaches the database. mitigations: cache the negative result with a short ttl (key - not_found, 30-60 s), which is the simplest and handles most real cases; validate the key shape before querying (a uuid that is not a uuid, an id outside the allocated range); and a bloom filter of all existing keys in front of the cache - a probabilistic set with no false negatives, so \"not in the filter\" definitively means \"does not exist\" and the query is skipped. a bloom filter for 100 million keys at a 1 percent false-positive rate is about 120 mb, which is why it is attractive at scale; the cost is that it must be kept in sync with deletions (which bloom filters cannot do - you need a counting or cuckoo filter, or periodic rebuilds). cache avalanche is mass simultaneous expiry or a cache-tier failure sending the whole load to the database at once. mitigations: ttl jitter (q176), cache clustering so one node's failure loses only a fraction of the keys, persistence so a restart is not a cold start (q178), a circuit breaker in front of the database, and a small in-process l1 cache that absorbs the first wave even when redis is unreachable."}, {"n": 180, "category": 10, "difficulty": "D", "html": "Redis single-threaded event loop: what that buys, and which commands can therefore ruin your latency.", "answerTitle": "The single-threaded event loop", "answer": "<p>Redis executes commands one at a time in a single thread (IO is now multi-threaded in Redis 6+, but <strong>command execution is still serial<\/strong>). What that buys: every command is atomic with no locking, no context switching, no race conditions inside the data structures, and predictable microsecond latency; it is also why <code>INCR<\/code>, <code>SETNX<\/code> and Lua scripts are trustworthy primitives for distributed coordination.<\/p><p>The consequence is that <strong>any slow command blocks everything else<\/strong>. The ones to know:<\/p><ul><li><code>KEYS *<\/code> - O(N) over the entire keyspace. Use <code>SCAN<\/code>, which is cursor-based and incremental.<\/li><li><code>FLUSHALL<\/code>/<code>FLUSHDB<\/code> synchronously, or <code>DEL<\/code> of a huge collection - use <code>UNLINK<\/code> and the async variants, which free memory in a background thread.<\/li><li><code>SMEMBERS<\/code>, <code>HGETALL<\/code>, <code>LRANGE 0 -1<\/code> on a collection with a million elements - O(N) serialization into the reply buffer.<\/li><li><code>SORT<\/code>, <code>SUNION<\/code>/<code>SINTER<\/code> over large sets, <code>ZRANGEBYSCORE<\/code> returning huge ranges.<\/li><li>A <strong>Lua script<\/strong> that loops - it holds the thread for its whole duration, and cannot be interrupted safely once it has written.<\/li><li><code>SAVE<\/code> (as opposed to <code>BGSAVE<\/code>), and the fork for <code>BGSAVE<\/code> on a large dataset, which pauses the process for the fork&#x27;s page-table copy.<\/li><\/ul><p>The operational rules: use <code>SCAN<\/code> families, keep collections bounded, set <code>slowlog-log-slower-than<\/code> to a low value and actually read the slow log, and treat &quot;p99 latency spiked across every key&quot; as a signal that someone ran an O(N) command.<\/p>", "source": "answers.md", "search": "redis single-threaded event loop: what that buys, and which commands can therefore ruin your latency. redis executes commands one at a time in a single thread (io is now multi-threaded in redis 6+, but command execution is still serial ). what that buys: every command is atomic with no locking, no context switching, no race conditions inside the data structures, and predictable microsecond latency; it is also why incr, setnx and lua scripts are trustworthy primitives for distributed coordination. the consequence is that any slow command blocks everything else . the ones to know: - keys - o(n) over the entire keyspace. use scan, which is cursor-based and incremental. - flushall/flushdb synchronously, or del of a huge collection - use unlink and the async variants, which free memory in a background thread. - smembers, hgetall, lrange 0 -1 on a collection with a million elements - o(n) serialization into the reply buffer. - sort, sunion/sinter over large sets, zrangebyscore returning huge ranges. - a lua script that loops - it holds the thread for its whole duration, and cannot be interrupted safely once it has written. - save (as opposed to bgsave), and the fork for bgsave on a large dataset, which pauses the process for the fork's page-table copy. the operational rules: use scan families, keep collections bounded, set slowlog-log-slower-than to a low value and actually read the slow log, and treat \"p99 latency spiked across every key\" as a signal that someone ran an o(n) command."}, {"n": 181, "category": 10, "difficulty": "D", "html": "Redis data structures beyond strings - hashes, sorted sets, sets, lists, streams, HyperLogLog, bitmaps. Give a production use for five of them.", "answerTitle": "Redis data structures", "answer": "<p>Five with production uses:<\/p><ol><li><strong>Sorted sets (ZSET)<\/strong> - leaderboards, but far more usefully a <strong>priority queue or time-index<\/strong>: score by timestamp, then <code>ZRANGEBYSCORE<\/code> for &quot;everything due before now&quot; (delayed jobs), or <code>ZREMRANGEBYSCORE<\/code> to trim a sliding window (rate limiting, Q188).<\/li><li><strong>Hashes<\/strong> - a small object stored field-wise, so you can read or increment one field without deserializing the whole thing. Session objects and per-entity counters. Small hashes are stored in a memory-efficient listpack encoding, which makes them dramatically cheaper than N separate keys.<\/li><li><strong>Sets<\/strong> - membership and set algebra: unique visitors, tags, &quot;has this user seen this item&quot;, and <code>SINTER<\/code> for simple recommendations.<\/li><li><strong>Streams<\/strong> - an append-only log with consumer groups, acknowledgements and pending-entry tracking. A genuine lightweight queue when you want Kafka semantics without Kafka, with <code>XAUTOCLAIM<\/code> for recovering messages from a dead consumer.<\/li><li><strong>HyperLogLog<\/strong> - approximate distinct counts in 12 KB regardless of cardinality, with about 0.8 percent error. Unique visitors per day per page, at a scale where exact sets would be gigabytes.<\/li><\/ol><p><strong>Bitmaps<\/strong> deserve a mention for daily active users (one bit per user id per day, then <code>BITCOUNT<\/code>/<code>BITOP<\/code> for retention analysis), and <strong>lists<\/strong> for simple FIFO with <code>BLPOP<\/code>, though Streams are the better modern choice.<\/p>", "source": "answers.md", "search": "redis data structures beyond strings - hashes, sorted sets, sets, lists, streams, hyperloglog, bitmaps. give a production use for five of them. five with production uses: 1. sorted sets (zset) - leaderboards, but far more usefully a priority queue or time-index : score by timestamp, then zrangebyscore for \"everything due before now\" (delayed jobs), or zremrangebyscore to trim a sliding window (rate limiting, q188). 2. hashes - a small object stored field-wise, so you can read or increment one field without deserializing the whole thing. session objects and per-entity counters. small hashes are stored in a memory-efficient listpack encoding, which makes them dramatically cheaper than n separate keys. 3. sets - membership and set algebra: unique visitors, tags, \"has this user seen this item\", and sinter for simple recommendations. 4. streams - an append-only log with consumer groups, acknowledgements and pending-entry tracking. a genuine lightweight queue when you want kafka semantics without kafka, with xautoclaim for recovering messages from a dead consumer. 5. hyperloglog - approximate distinct counts in 12 kb regardless of cardinality, with about 0.8 percent error. unique visitors per day per page, at a scale where exact sets would be gigabytes. bitmaps deserve a mention for daily active users (one bit per user id per day, then bitcount/bitop for retention analysis), and lists for simple fifo with blpop, though streams are the better modern choice."}, {"n": 182, "category": 10, "difficulty": "D", "html": "Redis expiration: lazy versus active expiry, and the eviction policies. Which <code>maxmemory-policy<\/code> do you set for a pure cache and which for a store?", "answerTitle": "Expiration and eviction", "answer": "<p><strong>Expiration<\/strong> happens two ways: <strong>lazily<\/strong>, when a key is accessed and found expired, and <strong>actively<\/strong>, via a background cycle that samples 20 random keys with TTLs, deletes the expired ones, and repeats while more than 25 percent of the sample was expired. The consequence is that expired keys can occupy memory for some time after their TTL, so <code>used_memory<\/code> lags what you expect - and a huge number of keys expiring at once causes a CPU spike in the active cycle.<\/p><p><strong>Eviction<\/strong> happens when <code>maxmemory<\/code> is reached, governed by <code>maxmemory-policy<\/code>:<\/p><ul><li><code>noeviction<\/code> - writes fail with an error. Correct for a <strong>store of record<\/strong>, where silently losing data is worse than an error.<\/li><li><code>allkeys-lru<\/code> / <code>allkeys-lfu<\/code> - evict from all keys. Correct for a <strong>pure cache<\/strong>. LFU (Redis 4+) is usually better than LRU because it resists a scan of cold keys evicting the genuinely hot ones.<\/li><li><code>volatile-lru<\/code> / <code>volatile-lfu<\/code> / <code>volatile-ttl<\/code> / <code>volatile-random<\/code> - evict only keys with a TTL. Useful for a <strong>mixed<\/strong> instance holding both cache entries (with TTL) and persistent structures (without) - though I prefer separating those into different instances entirely.<\/li><\/ul><p>So: <code>allkeys-lfu<\/code> for a cache, <code>noeviction<\/code> for a store, and separate instances rather than a <code>volatile-*<\/code> policy where possible, because a mixed instance means a cache surge can start failing writes for the durable data.<\/p>", "source": "answers.md", "search": "redis expiration: lazy versus active expiry, and the eviction policies. which maxmemory-policy do you set for a pure cache and which for a store? expiration happens two ways: lazily , when a key is accessed and found expired, and actively , via a background cycle that samples 20 random keys with ttls, deletes the expired ones, and repeats while more than 25 percent of the sample was expired. the consequence is that expired keys can occupy memory for some time after their ttl, so used_memory lags what you expect - and a huge number of keys expiring at once causes a cpu spike in the active cycle. eviction happens when maxmemory is reached, governed by maxmemory-policy: - noeviction - writes fail with an error. correct for a store of record , where silently losing data is worse than an error. - allkeys-lru / allkeys-lfu - evict from all keys. correct for a pure cache . lfu (redis 4+) is usually better than lru because it resists a scan of cold keys evicting the genuinely hot ones. - volatile-lru / volatile-lfu / volatile-ttl / volatile-random - evict only keys with a ttl. useful for a mixed instance holding both cache entries (with ttl) and persistent structures (without) - though i prefer separating those into different instances entirely. so: allkeys-lfu for a cache, noeviction for a store, and separate instances rather than a volatile- policy where possible, because a mixed instance means a cache surge can start failing writes for the durable data."}, {"n": 183, "category": 10, "difficulty": "T", "html": "Redis reports 6 GB used with a 6 GB <code>maxmemory<\/code> and starts rejecting writes despite an LRU policy. Give the likely causes.", "answerTitle": "6 GB used, rejecting writes despite LRU", "answer": "<p>Likely causes:<\/p><ol><li><strong>The policy is <code>volatile-*<\/code> and no keys have a TTL.<\/strong> Redis can only evict keys with an expiry set, finds no candidates, and returns OOM errors. This is the most common cause and looks exactly like &quot;LRU is not working&quot;.<\/li><li><strong>Memory fragmentation.<\/strong> <code>used_memory<\/code> counts what Redis allocated logically, but the allocator holds much more from the OS (<code>used_memory_rss<\/code>); a <code>mem_fragmentation_ratio<\/code> well above 1.5 after churn means the real footprint is larger than the limit accounts for. Activedefrag helps.<\/li><li><strong>Non-evictable overhead counts toward <code>maxmemory<\/code><\/strong>: client output buffers (a slow consumer of a large <code>HGETALL<\/code>, or a replica buffer), the AOF rewrite buffer, and the replication backlog. A single slow client can consume gigabytes.<\/li><li><strong>A few enormous keys.<\/strong> Eviction removes <em>keys<\/em>; if one key is 3 GB, evicting a hundred small keys frees nothing meaningful, and LRU sampling may never pick the big one.<\/li><li><strong><code>maxmemory<\/code> is not set at all<\/strong> on a replica, or set lower than expected in a managed service that reserves overhead.<\/li><\/ol><p>Diagnosis: <code>INFO memory<\/code> for <code>used_memory<\/code>, <code>used_memory_rss<\/code>, <code>maxmemory_policy<\/code> and the fragmentation ratio; <code>MEMORY DOCTOR<\/code>; <code>--bigkeys<\/code> or <code>MEMORY USAGE<\/code> to find giants; <code>CLIENT LIST<\/code> for output buffer sizes; and <code>INFO stats<\/code> for <code>evicted_keys<\/code>, which being zero while OOM errors occur points straight at cause 1.<\/p>", "source": "answers.md", "search": "redis reports 6 gb used with a 6 gb maxmemory and starts rejecting writes despite an lru policy. give the likely causes. likely causes: 1. the policy is volatile- and no keys have a ttl. redis can only evict keys with an expiry set, finds no candidates, and returns oom errors. this is the most common cause and looks exactly like \"lru is not working\". 2. memory fragmentation. used_memory counts what redis allocated logically, but the allocator holds much more from the os (used_memory_rss); a mem_fragmentation_ratio well above 1.5 after churn means the real footprint is larger than the limit accounts for. activedefrag helps. 3. non-evictable overhead counts toward maxmemory : client output buffers (a slow consumer of a large hgetall, or a replica buffer), the aof rewrite buffer, and the replication backlog. a single slow client can consume gigabytes. 4. a few enormous keys. eviction removes keys ; if one key is 3 gb, evicting a hundred small keys frees nothing meaningful, and lru sampling may never pick the big one. 5. maxmemory is not set at all on a replica, or set lower than expected in a managed service that reserves overhead. diagnosis: info memory for used_memory, used_memory_rss, maxmemory_policy and the fragmentation ratio; memory doctor; --bigkeys or memory usage to find giants; client list for output buffer sizes; and info stats for evicted_keys, which being zero while oom errors occur points straight at cause 1."}, {"n": 184, "category": 10, "difficulty": "D", "html": "Redis persistence: RDB, AOF and the hybrid. What is your data loss window with each, and what does <code>fsync everysec<\/code> really mean?", "answerTitle": "Persistence", "answer": "<p><strong>RDB<\/strong> is a point-in-time fork-and-dump of the whole dataset, taken every N seconds/changes. Data loss window: everything since the last snapshot - typically minutes. Fast to load, compact, and the fork can double memory usage transiently and pause the process while page tables are copied.<\/p><p><strong>AOF<\/strong> appends every write command to a log, rewritten periodically to stay compact. With <code>appendfsync everysec<\/code> the loss window is <strong>up to one second<\/strong>; with <code>always<\/code> it is effectively zero but each write costs an fsync (Redis becomes disk-bound, typically an order of magnitude slower); with <code>no<\/code> it is whatever the OS buffers.<\/p><p><strong>Hybrid<\/strong> (<code>aof-use-rdb-preamble yes<\/code>, the modern default): the AOF rewrite writes an RDB snapshot as the preamble followed by subsequent commands, giving RDB&#x27;s fast load and AOF&#x27;s small loss window.<\/p><p>What <code>everysec<\/code> really means: the fsync happens in a background thread once a second, so you lose up to one second <strong>plus<\/strong> whatever is in flight - and if the disk stalls, Redis will either block the write path or accumulate unflushed data, so a slow disk turns into latency in the main thread. It is also worth saying that persistence protects against a <strong>process restart<\/strong>, not against a node loss unless the storage survives, and that in a replicated setup the durability story is really replication plus persistence together (<code>WAIT<\/code> gives you a weak acknowledgement of replica receipt, not a quorum commit).<\/p>", "source": "answers.md", "search": "redis persistence: rdb, aof and the hybrid. what is your data loss window with each, and what does fsync everysec really mean? rdb is a point-in-time fork-and-dump of the whole dataset, taken every n seconds/changes. data loss window: everything since the last snapshot - typically minutes. fast to load, compact, and the fork can double memory usage transiently and pause the process while page tables are copied. aof appends every write command to a log, rewritten periodically to stay compact. with appendfsync everysec the loss window is up to one second ; with always it is effectively zero but each write costs an fsync (redis becomes disk-bound, typically an order of magnitude slower); with no it is whatever the os buffers. hybrid (aof-use-rdb-preamble yes, the modern default): the aof rewrite writes an rdb snapshot as the preamble followed by subsequent commands, giving rdb's fast load and aof's small loss window. what everysec really means: the fsync happens in a background thread once a second, so you lose up to one second plus whatever is in flight - and if the disk stalls, redis will either block the write path or accumulate unflushed data, so a slow disk turns into latency in the main thread. it is also worth saying that persistence protects against a process restart , not against a node loss unless the storage survives, and that in a replicated setup the durability story is really replication plus persistence together (wait gives you a weak acknowledgement of replica receipt, not a quorum commit)."}, {"n": 185, "category": 10, "difficulty": "D", "html": "Redis Cluster: hash slots, resharding, <code>MOVED<\/code> and <code>ASK<\/code> redirects, and why multi-key operations are restricted.", "answerTitle": "Redis Cluster", "answer": "<p>The keyspace is divided into <strong>16,384 hash slots<\/strong>; each key maps to <code>CRC16(key) mod 16384<\/code>, and each master owns a range of slots. Clients cache the slot-to-node map and route directly, so there is no proxy in the data path.<\/p><p>Resharding moves slots between nodes one key at a time while both remain online, which is where the two redirects come from: <strong><code>MOVED<\/code><\/strong> means the slot has permanently moved - the client updates its map and retries at the new node; <strong><code>ASK<\/code><\/strong> means the slot is currently migrating and <em>this particular key<\/em> has already moved - the client retries once at the target with an <code>ASKING<\/code> prefix, without updating its map. A correct client library must handle both; a naive one breaks during resharding.<\/p><p>Multi-key operations are restricted to keys in the <strong>same slot<\/strong>, because a transaction or a <code>MGET<\/code> cannot span nodes. The escape hatch is <strong>hash tags<\/strong>: <code>user:{1234}:profile<\/code> and <code>user:{1234}:sessions<\/code> hash only the part inside the braces, so they land in the same slot and can be operated on together. That makes co-location a modeling decision - and an over-used hash tag creates a hot slot that cannot be split, which is the Redis version of a bad shard key (Q163).<\/p>", "source": "answers.md", "search": "redis cluster: hash slots, resharding, moved and ask redirects, and why multi-key operations are restricted. the keyspace is divided into 16,384 hash slots ; each key maps to crc16(key) mod 16384, and each master owns a range of slots. clients cache the slot-to-node map and route directly, so there is no proxy in the data path. resharding moves slots between nodes one key at a time while both remain online, which is where the two redirects come from: moved means the slot has permanently moved - the client updates its map and retries at the new node; ask means the slot is currently migrating and this particular key has already moved - the client retries once at the target with an asking prefix, without updating its map. a correct client library must handle both; a naive one breaks during resharding. multi-key operations are restricted to keys in the same slot , because a transaction or a mget cannot span nodes. the escape hatch is hash tags : user:{1234}:profile and user:{1234}:sessions hash only the part inside the braces, so they land in the same slot and can be operated on together. that makes co-location a modeling decision - and an over-used hash tag creates a hot slot that cannot be split, which is the redis version of a bad shard key (q163)."}, {"n": 186, "category": 10, "difficulty": "D", "html": "Redis Sentinel versus Cluster versus a managed service. When does replication give you consistency, and when does it not?", "answerTitle": "Sentinel versus Cluster versus managed", "answer": "<p><strong>Sentinel<\/strong> is HA without sharding: one master, N replicas, and a quorum of Sentinel processes that monitor and promote. Simple, keeps all multi-key operations working, but capacity is one node&#x27;s memory and one node&#x27;s throughput.<\/p><p><strong>Cluster<\/strong> is sharding plus HA: data split over slots, each master with its own replicas, automatic failover per shard. Scales memory and throughput horizontally, at the cost of the multi-key restrictions above and a smarter client.<\/p><p><strong>Managed<\/strong> (ElastiCache, MemoryDB, Redis Cloud) is one of those two with the operations outsourced. Worth naming the difference between ElastiCache Redis (asynchronous replication, so failover can lose writes) and <strong>MemoryDB<\/strong> (writes committed to a multi-AZ transaction log before acknowledgement, so it is durable and can be a store of record) - that distinction is exactly the Q189 question.<\/p><p>When replication gives you consistency: <strong>it does not<\/strong>, in ordinary Redis. Replication is <strong>asynchronous<\/strong> - the master acknowledges the client immediately and propagates afterwards - so a failover loses any writes not yet replicated, and a partitioned old master can accept writes that are discarded on rejoin. <code>WAIT n timeout<\/code> blocks until <code>n<\/code> replicas have acknowledged, which narrows the window but is not a quorum protocol and does not prevent the split-brain case. Consistency requires either a system built on a consensus log (MemoryDB, or Redis Raft) or an architecture where losing recent writes is acceptable - which for a cache it is.<\/p>", "source": "answers.md", "search": "redis sentinel versus cluster versus a managed service. when does replication give you consistency, and when does it not? sentinel is ha without sharding: one master, n replicas, and a quorum of sentinel processes that monitor and promote. simple, keeps all multi-key operations working, but capacity is one node's memory and one node's throughput. cluster is sharding plus ha: data split over slots, each master with its own replicas, automatic failover per shard. scales memory and throughput horizontally, at the cost of the multi-key restrictions above and a smarter client. managed (elasticache, memorydb, redis cloud) is one of those two with the operations outsourced. worth naming the difference between elasticache redis (asynchronous replication, so failover can lose writes) and memorydb (writes committed to a multi-az transaction log before acknowledgement, so it is durable and can be a store of record) - that distinction is exactly the q189 question. when replication gives you consistency: it does not , in ordinary redis. replication is asynchronous - the master acknowledges the client immediately and propagates afterwards - so a failover loses any writes not yet replicated, and a partitioned old master can accept writes that are discarded on rejoin. wait n timeout blocks until n replicas have acknowledged, which narrows the window but is not a quorum protocol and does not prevent the split-brain case. consistency requires either a system built on a consensus log (memorydb, or redis raft) or an architecture where losing recent writes is acceptable - which for a cache it is."}, {"n": 187, "category": 10, "difficulty": "T", "html": "A distributed lock in Redis: the correct <code>SET NX PX<\/code> implementation with a fencing token, and the precise argument against Redlock.", "answerTitle": "A distributed lock in Redis", "answer": "<p>The correct single-instance implementation:<\/p><pre><code>SET lock:resource &lt;random-token&gt; NX PX 30000        -- acquire, atomic, with expiry\n-- release, only if we still hold it (Lua, so it is atomic):\nif redis.call(&quot;get&quot;, KEYS[1]) == ARGV[1] then return redis.call(&quot;del&quot;, KEYS[1]) else return 0 end<\/code><\/pre><p>Three details matter: <code>NX<\/code> plus <code>PX<\/code> in <strong>one<\/strong> command (a separate <code>EXPIRE<\/code> can be lost if the client dies in between, leaving a permanent lock); a <strong>random token<\/strong> so you can only release your own lock (otherwise a client whose lock expired deletes the next holder&#x27;s); and the compare-and-delete in <strong>Lua<\/strong> so it is atomic.<\/p><p>The <strong>fencing token<\/strong> is the part people omit. Because the lock can expire while the holder is still working - a GC pause, a slow disk, a network stall - two clients can believe they hold it. No amount of lock-service cleverness prevents that; the <em>resource<\/em> must reject stale writers. So the lock hands out a monotonically increasing number (<code>INCR lock:resource:fence<\/code>), the client passes it with every write, and the storage rejects any write carrying a token lower than the highest it has seen.<\/p><p>The argument against <strong>Redlock<\/strong> (acquire on a majority of N independent masters): Martin Kleppmann&#x27;s critique is that its safety depends on bounded clock drift and bounded process pauses, and neither is guaranteed - a clock jump on one node or a long GC pause invalidates the mutual exclusion, and since the algorithm has no fencing token there is nothing downstream to catch it. Antirez&#x27;s response is that the timing assumptions are reasonable in practice and that Redlock targets efficiency, not correctness. My position for an interview: for <strong>efficiency<\/strong> (avoid duplicate work, and a rare double-run is harmless) a single-instance Redis lock is fine and Redlock is unnecessary complexity; for <strong>correctness<\/strong> (money, exactly-once side effects) neither is sufficient without fencing at the resource, and I would use a consensus system or make the operation idempotent instead.<\/p>", "source": "answers.md", "search": "a distributed lock in redis: the correct set nx px implementation with a fencing token, and the precise argument against redlock. the correct single-instance implementation: set lock:resource <random-token nx px 30000 -- acquire, atomic, with expiry -- release, only if we still hold it (lua, so it is atomic): if redis.call(\"get\", keys[1]) == argv[1] then return redis.call(\"del\", keys[1]) else return 0 end three details matter: nx plus px in one command (a separate expire can be lost if the client dies in between, leaving a permanent lock); a random token so you can only release your own lock (otherwise a client whose lock expired deletes the next holder's); and the compare-and-delete in lua so it is atomic. the fencing token is the part people omit. because the lock can expire while the holder is still working - a gc pause, a slow disk, a network stall - two clients can believe they hold it. no amount of lock-service cleverness prevents that; the resource must reject stale writers. so the lock hands out a monotonically increasing number (incr lock:resource:fence), the client passes it with every write, and the storage rejects any write carrying a token lower than the highest it has seen. the argument against redlock (acquire on a majority of n independent masters): martin kleppmann's critique is that its safety depends on bounded clock drift and bounded process pauses, and neither is guaranteed - a clock jump on one node or a long gc pause invalidates the mutual exclusion, and since the algorithm has no fencing token there is nothing downstream to catch it. antirez's response is that the timing assumptions are reasonable in practice and that redlock targets efficiency, not correctness. my position for an interview: for efficiency (avoid duplicate work, and a rare double-run is harmless) a single-instance redis lock is fine and redlock is unnecessary complexity; for correctness (money, exactly-once side effects) neither is sufficient without fencing at the resource, and i would use a consensus system or make the operation idempotent instead."}, {"n": 188, "category": 10, "difficulty": "D", "html": "Rate limiting in Redis: fixed window, sliding window log, sliding window counter and token bucket. Give the data structure and the cost of each.", "answerTitle": "Rate limiting in Redis", "answer": "<table><thead><tr><th>Algorithm<\/th><th>Structure<\/th><th>Cost<\/th><th>Behavior<\/th><\/tr><\/thead><tbody><tr><td><strong>Fixed window<\/strong><\/td><td><code>INCR key:{user}:{minute}<\/code> with <code>EXPIRE<\/code><\/td><td>O(1), one key per window<\/td><td>simplest; allows a 2x burst across the boundary<\/td><\/tr><tr><td><strong>Sliding window log<\/strong><\/td><td>ZSET of request timestamps; <code>ZREMRANGEBYSCORE<\/code> then <code>ZCARD<\/code> then <code>ZADD<\/code><\/td><td>O(log n), memory proportional to the limit per user<\/td><td>exact, but expensive at high limits<\/td><\/tr><tr><td><strong>Sliding window counter<\/strong><\/td><td>two fixed-window counters, weighted by position in the window<\/td><td>O(1), two keys<\/td><td>very close to exact, cheap - the usual production choice<\/td><\/tr><tr><td><strong>Token bucket<\/strong><\/td><td>hash with <code>tokens<\/code> and <code>last_refill<\/code>, refilled by elapsed time in a Lua script<\/td><td>O(1), one key<\/td><td>allows controlled bursts, expresses &quot;10/s with a burst of 50&quot; naturally<\/td><\/tr><\/tbody><\/table><p>All of them must be <strong>atomic<\/strong>, which in Redis means either a single command or a Lua script - a read-then-write from the application is a race that lets N clients each pass the check.<\/p><p>I default to the <strong>sliding window counter<\/strong> for API rate limiting (cheap, accurate enough, no burst at the boundary) and <strong>token bucket<\/strong> where bursts are legitimate and should be explicitly budgeted. The sliding window log is worth its cost only when the limit is small and exactness is contractual.<\/p>", "source": "answers.md", "search": "rate limiting in redis: fixed window, sliding window log, sliding window counter and token bucket. give the data structure and the cost of each. algorithm structure cost behavior --- --- --- --- fixed window incr key:{user}:{minute} with expire o(1), one key per window simplest; allows a 2x burst across the boundary sliding window log zset of request timestamps; zremrangebyscore then zcard then zadd o(log n), memory proportional to the limit per user exact, but expensive at high limits sliding window counter two fixed-window counters, weighted by position in the window o(1), two keys very close to exact, cheap - the usual production choice token bucket hash with tokens and last_refill, refilled by elapsed time in a lua script o(1), one key allows controlled bursts, expresses \"10/s with a burst of 50\" naturally all of them must be atomic , which in redis means either a single command or a lua script - a read-then-write from the application is a race that lets n clients each pass the check. i default to the sliding window counter for api rate limiting (cheap, accurate enough, no burst at the boundary) and token bucket where bursts are legitimate and should be explicitly budgeted. the sliding window log is worth its cost only when the limit is small and exactness is contractual."}, {"n": 189, "category": 10, "difficulty": "D", "html": "Redis as a store of record: what has to be true, and what you must accept about durability.", "answerTitle": "Redis as a store of record", "answer": "<p>What has to be true: the data must be <strong>reconstructible or genuinely losable<\/strong>, or you must run a variant with a durable replication log. With ordinary Redis, an acknowledged write can be lost in three ways - the fsync window (<code>everysec<\/code> = up to a second, Q184), asynchronous replication losing unpropagated writes at failover (Q186), and eviction silently removing keys if the policy is not <code>noeviction<\/code>.<\/p><p>So if I am using Redis as a store of record I set <code>appendfsync everysec<\/code> at minimum (<code>always<\/code> if the write rate allows), <code>maxmemory-policy noeviction<\/code> with alerting well before the limit, replication with automatic failover, and I accept and document the loss window. Better still, I use a variant with a consensus-backed log (<strong>MemoryDB<\/strong>) where writes are durable across AZs before acknowledgement.<\/p><p>The legitimate cases: rate limiter state, session state where a logout on failover is acceptable, real-time leaderboards, presence, deduplication windows, and any derived data with a rebuild path from a durable source. The cases where I would refuse: money, orders, anything with a legal retention requirement, and anything whose loss cannot be detected. The question I ask the team is &quot;if this instance vanished right now, what would we do?&quot; - if the answer is &quot;rebuild it from Postgres in ten minutes&quot;, Redis is a fine home; if the answer is a silence, it is not.<\/p>", "source": "answers.md", "search": "redis as a store of record: what has to be true, and what you must accept about durability. what has to be true: the data must be reconstructible or genuinely losable , or you must run a variant with a durable replication log. with ordinary redis, an acknowledged write can be lost in three ways - the fsync window (everysec = up to a second, q184), asynchronous replication losing unpropagated writes at failover (q186), and eviction silently removing keys if the policy is not noeviction. so if i am using redis as a store of record i set appendfsync everysec at minimum (always if the write rate allows), maxmemory-policy noeviction with alerting well before the limit, replication with automatic failover, and i accept and document the loss window. better still, i use a variant with a consensus-backed log ( memorydb ) where writes are durable across azs before acknowledgement. the legitimate cases: rate limiter state, session state
