 "CTEs and the optimization fence", "answer": "<p>Before PostgreSQL 12, every <code>WITH<\/code> was materialized: executed once, results stored, predicates never pushed in. That made a CTE a deliberate fence - useful to force a plan, harmful when it prevented an index from being used because the outer <code>WHERE<\/code> could not reach inside.<\/p><p>From 12, a CTE that is non-recursive, side-effect free and referenced once is inlined by default, and you control it explicitly with <code>MATERIALIZED<\/code> / <code>NOT MATERIALIZED<\/code>.<\/p><p>MySQL 8 inlines (merges) CTEs when it can, similar to a derived table. Oracle decides by cost and has <code>/*+ MATERIALIZE */<\/code> and <code>/*+ INLINE */<\/code> hints.<\/p><p>The practical consequence: on PostgreSQL 12+ a CTE is a readability construct, not a performance construct, and if you inherit a query written for the old behavior, adding <code>MATERIALIZED<\/code> restores it exactly. <code>MATERIALIZED<\/code> is still genuinely useful when a CTE is referenced several times and is expensive, or when it contains a data-modifying statement.<\/p>", "source": "answers.md", "search": "common table expressions: when is a cte an optimization fence, and how does that differ between postgresql 11 and 12+, and versus mysql? before postgresql 12, every with was materialized: executed once, results stored, predicates never pushed in. that made a cte a deliberate fence - useful to force a plan, harmful when it prevented an index from being used because the outer where could not reach inside. from 12, a cte that is non-recursive, side-effect free and referenced once is inlined by default, and you control it explicitly with materialized / not materialized. mysql 8 inlines (merges) ctes when it can, similar to a derived table. oracle decides by cost and has / + materialize / and / + inline / hints. the practical consequence: on postgresql 12+ a cte is a readability construct, not a performance construct, and if you inherit a query written for the old behavior, adding materialized restores it exactly. materialized is still genuinely useful when a cte is referenced several times and is expensive, or when it contains a data-modifying statement."}, {"n": 32, "category": 2, "difficulty": "D", "html": "Recursive CTEs - the anchor/recursive structure, cycle protection, and one graph problem you would solve this way.", "answerTitle": "Recursive CTEs", "answer": "<pre><code class=\"lang-sql\">WITH RECURSIVE tree AS (\n  SELECT id, parent_id, name, 1 AS depth, ARRAY[id] AS path\n  FROM   category WHERE parent_id IS NULL          -- anchor\n  UNION ALL\n  SELECT c.id, c.parent_id, c.name, t.depth + 1, t.path || c.id\n  FROM   category c JOIN tree t ON c.parent_id = t.id\n  WHERE  NOT c.id = ANY(t.path)                    -- cycle protection\n)\nSELECT * FROM tree;<\/code><\/pre><p>The anchor runs once; the recursive term runs repeatedly against only the <em>previous<\/em> iteration&#x27;s rows until it produces none. <code>UNION<\/code> (rather than <code>UNION ALL<\/code>) deduplicates each round, which handles simple cycles at a cost; carrying an explicit path array is the general protection and gives you the path for free. PostgreSQL 14+ supports <code>CYCLE<\/code> and <code>SEARCH<\/code> clauses that generate exactly this.<\/p><p>Real uses: bill-of-materials explosion, organizational hierarchy with depth, category trees, permission inheritance, and graph reachability with a depth cap. Beyond a few million edges or variable-length shortest-path queries, this is where I would look at a graph database or a materialized closure table instead - the recursive CTE has no index on the intermediate result and re-joins the base table every iteration.<\/p>", "source": "answers.md", "search": "recursive ctes - the anchor/recursive structure, cycle protection, and one graph problem you would solve this way. sql with recursive tree as ( select id, parent_id, name, 1 as depth, array[id] as path from category where parent_id is null -- anchor union all select c.id, c.parent_id, c.name, t.depth + 1, t.path c.id from category c join tree t on c.parent_id = t.id where not c.id = any(t.path) -- cycle protection ) select from tree; the anchor runs once; the recursive term runs repeatedly against only the previous iteration's rows until it produces none. union (rather than union all) deduplicates each round, which handles simple cycles at a cost; carrying an explicit path array is the general protection and gives you the path for free. postgresql 14+ supports cycle and search clauses that generate exactly this. real uses: bill-of-materials explosion, organizational hierarchy with depth, category trees, permission inheritance, and graph reachability with a depth cap. beyond a few million edges or variable-length shortest-path queries, this is where i would look at a graph database or a materialized closure table instead - the recursive cte has no index on the intermediate result and re-joins the base table every iteration."}, {"n": 33, "category": 2, "difficulty": "D", "html": "<code>LATERAL<\/code> joins (<code>CROSS APPLY<\/code> in SQL Server): what problem do they solve that a plain join cannot?", "answerTitle": "`LATERAL` joins", "answer": "<p><code>LATERAL<\/code> lets the right-hand subquery reference columns from the left-hand row - effectively a correlated subquery that can return multiple rows and multiple columns. A plain join cannot do that: its right side is evaluated independently.<\/p><p>The three cases where it is the natural answer: top-N-per-group (Q30); calling a set-returning function per row (<code>CROSS JOIN LATERAL jsonb_array_elements(doc-&gt;&#x27;items&#x27;)<\/code>); and computing several correlated aggregates for each row in one pass without repeating the subquery three times.<\/p><p><code>CROSS JOIN LATERAL<\/code> drops the left row when the subquery is empty; <code>LEFT JOIN LATERAL ... ON true<\/code> keeps it - the distinction people always get wrong first time. SQL Server spells these <code>CROSS APPLY<\/code> and <code>OUTER APPLY<\/code>; Oracle 12c+ supports both <code>LATERAL<\/code> and <code>CROSS APPLY<\/code>.<\/p>", "source": "answers.md", "search": "lateral joins (cross apply in sql server): what problem do they solve that a plain join cannot? lateral lets the right-hand subquery reference columns from the left-hand row - effectively a correlated subquery that can return multiple rows and multiple columns. a plain join cannot do that: its right side is evaluated independently. the three cases where it is the natural answer: top-n-per-group (q30); calling a set-returning function per row (cross join lateral jsonb_array_elements(doc- 'items')); and computing several correlated aggregates for each row in one pass without repeating the subquery three times. cross join lateral drops the left row when the subquery is empty; left join lateral ... on true keeps it - the distinction people always get wrong first time. sql server spells these cross apply and outer apply; oracle 12c+ supports both lateral and cross apply."}, {"n": 34, "category": 2, "difficulty": "D", "html": "<code>GROUPING SETS<\/code>, <code>ROLLUP<\/code> and <code>CUBE<\/code>. What do they save over <code>UNION ALL<\/code> of separate aggregates?", "answerTitle": "`GROUPING SETS`, `ROLLUP`, `CUBE`", "answer": "<p><code>GROUPING SETS ((a,b),(a),())<\/code> computes several groupings in <strong>one pass<\/strong> over the input. <code>ROLLUP(a,b)<\/code> is the hierarchical subset - <code>(a,b)<\/code>, <code>(a)<\/code>, <code>()<\/code> - for subtotals down a drill-down path. <code>CUBE(a,b)<\/code> is all 2^n combinations, for a pivot in every direction.<\/p><p>Against <code>UNION ALL<\/code> of separate aggregate queries you save (n-1) scans and sorts of the same data, which on a large fact table is the difference between one expensive pass and four. You also get a single consistent snapshot, whereas separate queries in Read Committed can each see different data.<\/p><p>The one gotcha is telling a subtotal row apart from a genuine NULL in the grouping column - <code>GROUPING(a)<\/code> returns 1 for the aggregated-away case, and you need it in the <code>SELECT<\/code> if the column is nullable.<\/p>", "source": "answers.md", "search": "grouping sets, rollup and cube. what do they save over union all of separate aggregates? grouping sets ((a,b),(a),()) computes several groupings in one pass over the input. rollup(a,b) is the hierarchical subset - (a,b), (a), () - for subtotals down a drill-down path. cube(a,b) is all 2^n combinations, for a pivot in every direction. against union all of separate aggregate queries you save (n-1) scans and sorts of the same data, which on a large fact table is the difference between one expensive pass and four. you also get a single consistent snapshot, whereas separate queries in read committed can each see different data. the one gotcha is telling a subtotal row apart from a genuine null in the grouping column - grouping(a) returns 1 for the aggregated-away case, and you need it in the select if the column is nullable."}, {"n": 35, "category": 2, "difficulty": "D", "html": "<code>INSERT ... ON CONFLICT<\/code> (upsert) in PostgreSQL versus <code>MERGE<\/code> versus <code>INSERT IGNORE<\/code>. Compare the concurrency behavior of each.", "answerTitle": "Upsert: `ON CONFLICT`, `MERGE`, `INSERT IGNORE`", "answer": "<p><code>INSERT ... ON CONFLICT (key) DO UPDATE<\/code> is atomic at the row level: PostgreSQL attempts the insert, and on a unique-violation from a <em>specified<\/em> arbiter index it takes the row lock and applies the update, with the new row visible as <code>excluded<\/code>. It is safe under concurrency and is what I use.<\/p><p><code>MERGE<\/code> (SQL standard, Oracle, SQL Server, PostgreSQL 15+) is more general - it can insert, update and delete from a source relation - but it is <em>not<\/em> atomic in the same sense: it decides the action from a snapshot, so two concurrent <code>MERGE<\/code>s can both take the INSERT branch and one fails with a unique violation, or under Read Committed you get lost updates. Oracle and SQL Server both require a unique index and careful locking to make it safe; SQL Server&#x27;s <code>MERGE<\/code> has a long history of concurrency bugs and most practitioners avoid it.<\/p><p><code>INSERT IGNORE<\/code> (MySQL) suppresses <em>all<\/em> errors, not just duplicate keys, which turns a data-type error into a silently skipped row. <code>INSERT ... ON DUPLICATE KEY UPDATE<\/code> is the MySQL equivalent worth using.<\/p>", "source": "answers.md", "search": "insert ... on conflict (upsert) in postgresql versus merge versus insert ignore. compare the concurrency behavior of each. insert ... on conflict (key) do update is atomic at the row level: postgresql attempts the insert, and on a unique-violation from a specified arbiter index it takes the row lock and applies the update, with the new row visible as excluded. it is safe under concurrency and is what i use. merge (sql standard, oracle, sql server, postgresql 15+) is more general - it can insert, update and delete from a source relation - but it is not atomic in the same sense: it decides the action from a snapshot, so two concurrent merges can both take the insert branch and one fails with a unique violation, or under read committed you get lost updates. oracle and sql server both require a unique index and careful locking to make it safe; sql server's merge has a long history of concurrency bugs and most practitioners avoid it. insert ignore (mysql) suppresses all errors, not just duplicate keys, which turns a data-type error into a silently skipped row. insert ... on duplicate key update is the mysql equivalent worth using."}, {"n": 36, "category": 2, "difficulty": "T", "html": "Two concurrent upserts on the same key. What actually happens under Read Committed, and how can you still get a unique-violation error?", "answerTitle": "Concurrent upserts", "answer": "<p>Under Read Committed, <code>ON CONFLICT DO UPDATE<\/code> handles the race internally: the second inserter blocks on the first&#x27;s row lock, and when the first commits, the second re-reads and applies its update. That is why it is the recommended pattern.<\/p><p>You can still get a unique violation in three situations. First, <code>ON CONFLICT<\/code> only handles the conflict on the <strong>arbiter index you named<\/strong> - a violation of a <em>different<\/em> unique constraint is raised normally. Second, <code>DO NOTHING<\/code> with a concurrent insert that later rolls back can leave you with neither an insert nor a row to read (Q115). Third, under <strong>Repeatable Read or Serializable<\/strong>, the second transaction cannot see the newly committed row without violating its snapshot, so instead of updating it aborts with a serialization failure - which your retry loop must handle.<\/p><p>The related trap: <code>ON CONFLICT DO UPDATE<\/code> acquires a row lock even when the update is a no-op, so a high-frequency &quot;upsert the same key&quot; pattern serializes on one row and can deadlock if two statements touch multiple keys in different orders.<\/p>", "source": "answers.md", "search": "two concurrent upserts on the same key. what actually happens under read committed, and how can you still get a unique-violation error? under read committed, on conflict do update handles the race internally: the second inserter blocks on the first's row lock, and when the first commits, the second re-reads and applies its update. that is why it is the recommended pattern. you can still get a unique violation in three situations. first, on conflict only handles the conflict on the arbiter index you named - a violation of a different unique constraint is raised normally. second, do nothing with a concurrent insert that later rolls back can leave you with neither an insert nor a row to read (q115). third, under repeatable read or serializable , the second transaction cannot see the newly committed row without violating its snapshot, so instead of updating it aborts with a serialization failure - which your retry loop must handle. the related trap: on conflict do update acquires a row lock even when the update is a no-op, so a high-frequency \"upsert the same key\" pattern serializes on one row and can deadlock if two statements touch multiple keys in different orders."}, {"n": 37, "category": 2, "difficulty": "D", "html": "<code>RETURNING<\/code> and data-modifying CTEs. Show how to move a row between tables atomically in one statement.", "answerTitle": "`RETURNING` and data-modifying CTEs", "answer": "<p><code>RETURNING<\/code> gives back rows affected by <code>INSERT<\/code>/<code>UPDATE<\/code>/<code>DELETE<\/code> in the same round trip - the generated key, the previous state, the computed default - with no second query and no race.<\/p><p>Combined with a CTE, it moves rows atomically:<\/p><pre><code class=\"lang-sql\">WITH moved AS (\n  DELETE FROM job_queue WHERE id = $1 RETURNING *\n)\nINSERT INTO job_archive SELECT *, now() FROM moved;<\/code><\/pre><p>Both statements run in the <strong>same snapshot<\/strong> and the same statement, so no other transaction can observe the row in neither table or in both. The rules to know: all sub-statements see the same snapshot (so a data-modifying CTE cannot see another one&#x27;s changes), execution order between them is not guaranteed except through data dependency, and trying to update the same row twice in one statement is undefined.<\/p>", "source": "answers.md", "search": "returning and data-modifying ctes. show how to move a row between tables atomically in one statement. returning gives back rows affected by insert/update/delete in the same round trip - the generated key, the previous state, the computed default - with no second query and no race. combined with a cte, it moves rows atomically: sql with moved as ( delete from job_queue where id = $1 returning ) insert into job_archive select , now() from moved; both statements run in the same snapshot and the same statement, so no other transaction can observe the row in neither table or in both. the rules to know: all sub-statements see the same snapshot (so a data-modifying cte cannot see another one's changes), execution order between them is not guaranteed except through data dependency, and trying to update the same row twice in one statement is undefined."}, {"n": 38, "category": 2, "difficulty": "D", "html": "Offset pagination versus keyset (seek) pagination. Give the exact query for keyset pagination over a non-unique sort column.", "answerTitle": "Keyset pagination", "answer": "<p>Offset pagination makes the database produce and discard <code>OFFSET<\/code> rows, so page 10,000 costs 10,000 pages of work, and a concurrent insert shifts every subsequent page (rows are duplicated or skipped).<\/p><p>Keyset pagination remembers the last row&#x27;s sort values and asks for what follows. For a non-unique sort column you must append a tiebreaker and compare as a row value:<\/p><pre><code class=\"lang-sql\">SELECT ... FROM orders\nWHERE  (created_at, id) &lt; ($last_created_at, $last_id)   -- descending\nORDER  BY created_at DESC, id DESC\nLIMIT  50;<\/code><\/pre><p>with an index on <code>(created_at DESC, id DESC)<\/code>. Row-value comparison is the important detail - the naive <code>created_at &lt; ? OR (created_at = ? AND id &lt; ?)<\/code> is correct but frequently plans worse.<\/p><p>The cost is that you lose random access to page N and &quot;jump to last page&quot;, so it fits infinite scroll and API cursors rather than a numbered pager over a small table, where <code>OFFSET<\/code> is perfectly fine.<\/p>", "source": "answers.md", "search": "offset pagination versus keyset (seek) pagination. give the exact query for keyset pagination over a non-unique sort column. offset pagination makes the database produce and discard offset rows, so page 10,000 costs 10,000 pages of work, and a concurrent insert shifts every subsequent page (rows are duplicated or skipped). keyset pagination remembers the last row's sort values and asks for what follows. for a non-unique sort column you must append a tiebreaker and compare as a row value: sql select ... from orders where (created_at, id) < ($last_created_at, $last_id) -- descending order by created_at desc, id desc limit 50; with an index on (created_at desc, id desc). row-value comparison is the important detail - the naive created_at < ? or (created_at = ? and id < ?) is correct but frequently plans worse. the cost is that you lose random access to page n and \"jump to last page\", so it fits infinite scroll and api cursors rather than a numbered pager over a small table, where offset is perfectly fine."}, {"n": 39, "category": 2, "difficulty": "T", "html": "<code>SELECT COUNT(*)<\/code> on a 200-million-row table takes 40 seconds. Explain why, in PostgreSQL specifically, and give three acceptable answers to &quot;how many rows are there&quot;.", "answerTitle": "`SELECT COUNT(*)` on 200 million rows", "answer": "<p>In PostgreSQL, an exact count must visit every row, because MVCC visibility lives in the tuples: the index cannot tell you whether a given row version is visible to your snapshot. An index-only scan can help when the visibility map is mostly all-visible, but it is still a full traversal. (InnoDB is in the same position; MyISAM and SQL Server keep a maintained row count and can answer instantly, which is where the expectation comes from.)<\/p><p>Three acceptable answers to &quot;how many rows&quot;:<\/p><ol><li><strong>An estimate<\/strong> from <code>pg_class.reltuples<\/code>, or the planner&#x27;s own estimate via <code>EXPLAIN<\/code> - accurate to a few percent right after <code>ANALYZE<\/code>, and free.<\/li><li><strong>A maintained counter<\/strong> - a summary table updated by trigger or by the application, or a periodic job. Correct, but adds write contention (mitigate with sharded counters, Q113).<\/li><li><strong>A bounded count<\/strong> - <code>SELECT count(*) FROM (SELECT 1 FROM t WHERE ... LIMIT 1000) x<\/code>, which powers &quot;1,000+ results&quot; in a UI and costs almost nothing.<\/li><\/ol><p>The best answer starts with a question: nobody needs an exact count of 200 million rows; they need pagination metadata or a business metric, and both have cheaper implementations.<\/p>", "source": "answers.md", "search": "select count( ) on a 200-million-row table takes 40 seconds. explain why, in postgresql specifically, and give three acceptable answers to \"how many rows are there\". in postgresql, an exact count must visit every row, because mvcc visibility lives in the tuples: the index cannot tell you whether a given row version is visible to your snapshot. an index-only scan can help when the visibility map is mostly all-visible, but it is still a full traversal. (innodb is in the same position; myisam and sql server keep a maintained row count and can answer instantly, which is where the expectation comes from.) three acceptable answers to \"how many rows\": 1. an estimate from pg_class.reltuples, or the planner's own estimate via explain - accurate to a few percent right after analyze, and free. 2. a maintained counter - a summary table updated by trigger or by the application, or a periodic job. correct, but adds write contention (mitigate with sharded counters, q113). 3. a bounded count - select count( ) from (select 1 from t where ... limit 1000) x, which powers \"1,000+ results\" in a ui and costs almost nothing. the best answer starts with a question: nobody needs an exact count of 200 million rows; they need pagination metadata or a business metric, and both have cheaper implementations."}, {"n": 40, "category": 2, "difficulty": "D", "html": "Set-based thinking versus row-by-row: rewrite a &quot;loop and update&quot; procedure as a single statement, and say when the loop is genuinely better.", "answerTitle": "Set-based versus row-by-row", "answer": "<p>A loop that issues one <code>UPDATE<\/code> per row pays parse, plan, network round trip, and a WAL record per row, and it holds the transaction open for the whole loop. The set-based form does one plan, one pass, one write batch:<\/p><pre><code class=\"lang-sql\">UPDATE orders o\nSET    status = &#x27;EXPIRED&#x27;\nFROM   payment p\nWHERE  p.order_id = o.id AND p.state = &#x27;FAILED&#x27; AND o.status = &#x27;PENDING&#x27;;<\/code><\/pre><p>Typical improvements are one to two orders of magnitude, mostly from eliminating round trips.<\/p><p>The loop is genuinely better when the single statement would (a) lock too much for too long - a 50-million-row update blocks, bloats and creates replication lag, so you batch by key range with a commit per batch (Q249); (b) need per-row branching that SQL cannot express, such as calling an external service; or (c) risk exceeding <code>work_mem<\/code> or the undo/WAL capacity. The rule I use is: set-based within a batch, batched across the table.<\/p>", "source": "answers.md", "search": "set-based thinking versus row-by-row: rewrite a \"loop and update\" procedure as a single statement, and say when the loop is genuinely better. a loop that issues one update per row pays parse, plan, network round trip, and a wal record per row, and it holds the transaction open for the whole loop. the set-based form does one plan, one pass, one write batch: sql update orders o set status = 'expired' from payment p where p.order_id = o.id and p.state = 'failed' and o.status = 'pending'; typical improvements are one to two orders of magnitude, mostly from eliminating round trips. the loop is genuinely better when the single statement would (a) lock too much for too long - a 50-million-row update blocks, bloats and creates replication lag, so you batch by key range with a commit per batch (q249); (b) need per-row branching that sql cannot express, such as calling an external service; or (c) risk exceeding work_mem or the undo/wal capacity. the rule i use is: set-based within a batch, batched across the table."}, {"n": 41, "category": 2, "difficulty": "A", "html": "Where does business logic in stored procedures and triggers belong in 2026? Give your position and the strongest argument against it.", "answerTitle": "Stored procedures and triggers in 2026", "answer": "<p>My position: <strong>constraints and integrity in the database, business logic in the application.<\/strong> Triggers are acceptable for mechanical, invisible concerns - audit rows, <code>updated_at<\/code>, maintaining a denormalized counter or a search vector - and stored procedures for data-intensive work where moving the data to the application is the actual cost, such as a batch reconciliation over tens of millions of rows.<\/p><p>The reasons are practical, not ideological: procedural SQL has poor tooling for testing, code review, dependency injection and refactoring; it is deployed by a different mechanism than the application, so a rollback becomes two rollbacks; it is invisible in a stack trace, so debugging a trigger cascade during an incident is much harder; and it makes the database a shared runtime that no team owns, which is the coupling problem <code>03-microservices<\/code> Q61 is about.<\/p><p>The strongest argument against me is latency and atomicity: a procedure that does five statements does them in one round trip inside one transaction, and at high volume that difference is real - it is precisely why the outbox relay and batch jobs sometimes belong there. The second-strongest is that when several applications and an ETL all write the same tables, the database is the only place a rule can be enforced. I would concede both cases and still require that the logic be version-controlled, migration-deployed and tested like any other code.<\/p><p><em>Hook: a trigger cascade that made an incident harder to diagnose, or a batch you deliberately pushed into the database.<\/em><\/p>", "source": "answers.md", "search": "where does business logic in stored procedures and triggers belong in 2026? give your position and the strongest argument against it. my position: constraints and integrity in the database, business logic in the application. triggers are acceptable for mechanical, invisible concerns - audit rows, updated_at, maintaining a denormalized counter or a search vector - and stored procedures for data-intensive work where moving the data to the application is the actual cost, such as a batch reconciliation over tens of millions of rows. the reasons are practical, not ideological: procedural sql has poor tooling for testing, code review, dependency injection and refactoring; it is deployed by a different mechanism than the application, so a rollback becomes two rollbacks; it is invisible in a stack trace, so debugging a trigger cascade during an incident is much harder; and it makes the database a shared runtime that no team owns, which is the coupling problem 03-microservices q61 is about. the strongest argument against me is latency and atomicity: a procedure that does five statements does them in one round trip inside one transaction, and at high volume that difference is real - it is precisely why the outbox relay and batch jobs sometimes belong there. the second-strongest is that when several applications and an etl all write the same tables, the database is the only place a rule can be enforced. i would concede both cases and still require that the logic be version-controlled, migration-deployed and tested like any other code. hook: a trigger cascade that made an incident harder to diagnose, or a batch you deliberately pushed into the database."}, {"n": 42, "category": 3, "difficulty": "C", "html": "Describe the structure of a B+tree index and why the depth stays small - give the arithmetic for a billion-row table.", "answerTitle": "B+tree structure and depth", "answer": "<p>A B+tree stores keys in internal pages that route the search, and <em>all<\/em> the data pointers in leaf pages, which are linked to each other so a range scan walks sideways without returning to the root. PostgreSQL&#x27;s implementation is a Lehman-Yao B-link tree, which allows concurrent reads during page splits without locking the whole tree.<\/p><p>The arithmetic: an 8 KB page holding, say, a 16-byte key plus pointer overhead fits roughly 300-400 entries. Three levels index about 400^3 = 64 million leaf entries, four levels about 25 billion. So a billion-row table is <strong>four levels deep<\/strong>, and a point lookup is at most four page reads - and the root and most of the second level are permanently in cache, so it is realistically one or two physical reads.<\/p><p>That is the number to quote when someone claims an index &quot;must be slow because the table is huge&quot;: B-tree cost grows logarithmically, and the log base is in the hundreds.<\/p>", "source": "answers.md", "search": "describe the structure of a b+tree index and why the depth stays small - give the arithmetic for a billion-row table. a b+tree stores keys in internal pages that route the search, and all the data pointers in leaf pages, which are linked to each other so a range scan walks sideways without returning to the root. postgresql's implementation is a lehman-yao b-link tree, which allows concurrent reads during page splits without locking the whole tree. the arithmetic: an 8 kb page holding, say, a 16-byte key plus pointer overhead fits roughly 300-400 entries. three levels index about 400^3 = 64 million leaf entries, four levels about 25 billion. so a billion-row table is four levels deep , and a point lookup is at most four page reads - and the root and most of the second level are permanently in cache, so it is realistically one or two physical reads. that is the number to quote when someone claims an index \"must be slow because the table is huge\": b-tree cost grows logarithmically, and the log base is in the hundreds."}, {"n": 43, "category": 3, "difficulty": "D", "html": "Clustered versus non-clustered index. How does an InnoDB secondary index lookup differ from a PostgreSQL index lookup?", "answerTitle": "Clustered versus non-clustered", "answer": "<p>In InnoDB the table <em>is<\/em> the primary key B-tree - the leaf pages contain the full rows (a clustered index). A secondary index leaf holds the indexed columns plus the <strong>primary key value<\/strong>, so a lookup by secondary index is two traversals: the secondary tree, then the primary tree. Consequences: a wide primary key inflates every secondary index; primary-key range scans are sequential; and a covering secondary index avoids the second traversal.<\/p><p>PostgreSQL has no clustered index. The heap is unordered and every index leaf holds a <strong>TID<\/strong> (physical page and offset), so every index is &quot;secondary&quot; and every match costs one extra heap page fetch unless the index-only path applies (Q46). <code>CLUSTER<\/code> physically reorders the table once, but nothing maintains that order afterwards.<\/p><p>The practical differences: PostgreSQL treats all indexes equally so there is no primary-key privilege to design around, but it pays a heap fetch that InnoDB avoids for primary-key access, and it needs the visibility map to make index-only scans possible.<\/p>", "source": "answers.md", "search": "clustered versus non-clustered index. how does an innodb secondary index lookup differ from a postgresql index lookup? in innodb the table is the primary key b-tree - the leaf pages contain the full rows (a clustered index). a secondary index leaf holds the indexed columns plus the primary key value , so a lookup by secondary index is two traversals: the secondary tree, then the primary tree. consequences: a wide primary key inflates every secondary index; primary-key range scans are sequential; and a covering secondary index avoids the second traversal. postgresql has no clustered index. the heap is unordered and every index leaf holds a tid (physical page and offset), so every index is \"secondary\" and every match costs one extra heap page fetch unless the index-only path applies (q46). cluster physically reorders the table once, but nothing maintains that order afterwards. the practical differences: postgresql treats all indexes equally so there is no primary-key privilege to design around, but it pays a heap fetch that innodb avoids for primary-key access, and it needs the visibility map to make index-only scans possible."}, {"n": 44, "category": 3, "difficulty": "D", "html": "The leftmost-prefix rule for composite indexes. Given <code>(a, b, c)<\/code>, list precisely which predicates can use the index and how far.", "answerTitle": "Leftmost prefix on `(a, b, c)`", "answer": "<p>The index is sorted by <code>a<\/code>, then <code>b<\/code> within equal <code>a<\/code>, then <code>c<\/code>. So a scan can use, in order, an equality or range on <code>a<\/code>; then <code>b<\/code> only if <code>a<\/code> was an equality; then <code>c<\/code> only if both <code>a<\/code> and <code>b<\/code> were equalities.<\/p><table><thead><tr><th>Predicate<\/th><th>Usable<\/th><\/tr><\/thead><tbody><tr><td><code>a = ?<\/code><\/td><td>Yes, full range on <code>a<\/code><\/td><\/tr><tr><td><code>a = ? AND b = ?<\/code><\/td><td>Yes, both as access predicates<\/td><\/tr><tr><td><code>a = ? AND b = ? AND c = ?<\/code><\/td><td>Yes, all three<\/td><\/tr><tr><td><code>a = ? AND c = ?<\/code><\/td><td><code>a<\/code> seeks; <code>c<\/code> is only a filter on the rows found<\/td><\/tr><tr><td><code>a &gt; ? AND b = ?<\/code><\/td><td><code>a<\/code> seeks; <code>b<\/code> is only a filter<\/td><\/tr><tr><td><code>b = ?<\/code> alone<\/td><td>Not as an access predicate<\/td><\/tr><\/tbody><\/table><p>The nuance PostgreSQL adds: it <em>can<\/em> still scan the whole index and filter on <code>b<\/code> alone (a full index scan), which is cheaper than a heap scan if the index is much narrower than the table - so &quot;the index is not used at all&quot; is not strictly true, but it is not the seek you wanted. The index also serves <code>ORDER BY a, b<\/code> for free.<\/p>", "source": "answers.md", "search": "the leftmost-prefix rule for composite indexes. given (a, b, c), list precisely which predicates can use the index and how far. the index is sorted by a, then b within equal a, then c. so a scan can use, in order, an equality or range on a; then b only if a was an equality; then c only if both a and b were equalities. predicate usable --- --- a = ? yes, full range on a a = ? and b = ? yes, both as access predicates a = ? and b = ? and c = ? yes, all three a = ? and c = ? a seeks; c is only a filter on the rows found a ? and b = ? a seeks; b is only a filter b = ? alone not as an access predicate the nuance postgresql adds: it can still scan the whole index and filter on b alone (a full index scan), which is cheaper than a heap scan if the index is much narrower than the table - so \"the index is not used at all\" is not strictly true, but it is not the seek you wanted. the index also serves order by a, b for free."}, {"n": 45, "category": 3, "difficulty": "T", "html": "For a query with <code>WHERE a = ? AND b &gt; ? AND c = ?<\/code>, what is the best column order for the index, and why is <code>c<\/code> nearly useless where it is?", "answerTitle": "Column order for `a = ?, b > ?, c = ?`", "answer": "<p><code>(a, c, b)<\/code>. Put <strong>all equality columns first<\/strong>, then the range column last.<\/p><p>The reason is that a B-tree seek can only maintain a contiguous range: once you consume a range predicate on <code>b<\/code>, everything after <code>b<\/code> in the key is no longer sorted within the scanned span, so <code>c<\/code> degenerates to a filter applied to every row the range returns. With <code>(a, b, c)<\/code> you seek on <code>a = ?<\/code> plus <code>b &gt; ?<\/code> and then check <code>c<\/code> on each of possibly millions of rows. With <code>(a, c, b)<\/code> you seek directly to the <code>(a, c)<\/code> pair and read only the qualifying <code>b<\/code> range.<\/p><p><code>c<\/code> still earns its place in the index even in the wrong position - it can be evaluated from the index rather than the heap - but as an <em>access<\/em> predicate it is worthless there. The general rule to state: equality columns first (most selective first among them matters less than people think), one range column last, and any purely-returned columns in <code>INCLUDE<\/code>.<\/p>", "source": "answers.md", "search": "for a query with where a = ? and b ? and c = ?, what is the best column order for the index, and why is c nearly useless where it is? (a, c, b). put all equality columns first , then the range column last. the reason is that a b-tree seek can only maintain a contiguous range: once you consume a range predicate on b, everything after b in the key is no longer sorted within the scanned span, so c degenerates to a filter applied to every row the range returns. with (a, b, c) you seek on a = ? plus b ? and then check c on each of possibly millions of rows. with (a, c, b) you seek directly to the (a, c) pair and read only the qualifying b range. c still earns its place in the index even in the wrong position - it can be evaluated from the index rather than the heap - but as an access predicate it is worthless there. the general rule to state: equality columns first (most selective first among them matters less than people think), one range column last, and any purely-returned columns in include."}, {"n": 46, "category": 3, "difficulty": "D", "html": "Index-only scans and PostgreSQL&#x27;s visibility map. Why does an index-only scan sometimes still hit the heap, and what makes it stop?", "answerTitle": "Index-only scans and the visibility map", "answer": "<p>PostgreSQL index entries do not carry MVCC information, so it normally has to visit the heap tuple to check visibility. The <strong>visibility map<\/strong> is a two-bit-per-page structure that marks pages where <em>all<\/em> tuples are visible to all transactions. During an index-only scan the executor checks the map: if the page is all-visible, it returns the values straight from the index; if not, it fetches the heap tuple after all.<\/p><p>So an index-only scan degrades toward an ordinary index scan when the table has recent writes, and the plan shows this as <code>Heap Fetches: N<\/code>. What makes it stop being index-only: a write-heavy table where autovacuum cannot keep up (vacuum is what sets the visibility bits), a long-running transaction holding back the xmin horizon so pages can never be marked all-visible, or simply querying a column that is not in the index.<\/p><p>The operational fix is aggressive autovacuum settings on that table, not more indexes.<\/p>", "source": "answers.md", "search": "index-only scans and postgresql's visibility map. why does an index-only scan sometimes still hit the heap, and what makes it stop? postgresql index entries do not carry mvcc information, so it normally has to visit the heap tuple to check visibility. the visibility map is a two-bit-per-page structure that marks pages where all tuples are visible to all transactions. during an index-only scan the executor checks the map: if the page is all-visible, it returns the values straight from the index; if not, it fetches the heap tuple after all. so an index-only scan degrades toward an ordinary index scan when the table has recent writes, and the plan shows this as heap fetches: n. what makes it stop being index-only: a write-heavy table where autovacuum cannot keep up (vacuum is what sets the visibility bits), a long-running transaction holding back the xmin horizon so pages can never be marked all-visible, or simply querying a column that is not in the index. the operational fix is aggressive autovacuum settings on that table, not more indexes."}, {"n": 47, "category": 3, "difficulty": "D", "html": "<code>INCLUDE<\/code> columns (covering indexes) versus adding the column to the key. What differs in size, ordering and uniqueness?", "answerTitle": "`INCLUDE` columns versus key columns", "answer": "<p><code>INCLUDE<\/code> columns are stored <strong>only in the leaf pages<\/strong> and are not part of the ordering. Compared with adding the column to the key:<\/p><ul><li><strong>Size<\/strong>: <code>INCLUDE<\/code> keeps internal pages narrow, so the tree stays shallower and the non-leaf levels stay in cache.<\/li><li><strong>Ordering<\/strong>: an included column cannot be used for seeking, range filtering as an access predicate, or <code>ORDER BY<\/code>.<\/li><li><strong>Uniqueness<\/strong>: with a unique index, <code>INCLUDE<\/code> columns are excluded from the uniqueness check - which is exactly what you want for <code>UNIQUE (email) INCLUDE (display_name)<\/code>.<\/li><li><strong>Types<\/strong>: <code>INCLUDE<\/code> accepts types with no B-tree operator class at all.<\/li><\/ul><p>I use <code>INCLUDE<\/code> when the column is only there to make a scan index-only, and a key column when I need it for filtering or ordering.<\/p>", "source": "answers.md", "search": "include columns (covering indexes) versus adding the column to the key. what differs in size, ordering and uniqueness? include columns are stored only in the leaf pages and are not part of the ordering. compared with adding the column to the key: - size : include keeps internal pages narrow, so the tree stays shallower and the non-leaf levels stay in cache. - ordering : an included column cannot be used for seeking, range filtering as an access predicate, or order by. - uniqueness : with a unique index, include columns are excluded from the uniqueness check - which is exactly what you want for unique (email) include (display_name). - types : include accepts types with no b-tree operator class at all. i use include when the column is only there to make a scan index-only, and a key column when i need it for filtering or ordering."}, {"n": 48, "category": 3, "difficulty": "D", "html": "Partial (filtered) indexes: give three high-value uses and the query-shape requirement that makes them usable.", "answerTitle": "Partial indexes", "answer": "<p>A partial index covers only rows matching a predicate, so it is smaller, cheaper to maintain, and often dramatically more selective.<\/p><p>Three high-value uses: (1) the active subset - <code>WHERE deleted_at IS NULL<\/code> or <code>WHERE status = &#x27;ACTIVE&#x27;<\/code> on a table where 99 percent of rows are historical; (2) enforcing conditional uniqueness, which no plain constraint can do (Q12); (3) indexing a rare value - <code>WHERE status = &#x27;FAILED&#x27;<\/code> on a queue table where failures are 0.1 percent, giving a tiny index for the query that matters at 3 a.m.<\/p><p>The requirement is that the planner must be able to <em>prove<\/em> the query predicate implies the index predicate, and its proof engine is deliberately simple. <code>WHERE status = &#x27;ACTIVE&#x27;<\/code> matches an index on <code>WHERE status = &#x27;ACTIVE&#x27;<\/code>, but <code>WHERE status = $1<\/code> does not, even when the parameter happens to be &#x27;ACTIVE&#x27;. That single fact catches most people: partial indexes and parameterized queries fight each other, and you often need the literal or a dedicated query path.<\/p>", "source": "answers.md", "search": "partial (filtered) indexes: give three high-value uses and the query-shape requirement that makes them usable. a partial index covers only rows matching a predicate, so it is smaller, cheaper to maintain, and often dramatically more selective. three high-value uses: (1) the active subset - where deleted_at is null or where status = 'active' on a table where 99 percent of rows are historical; (2) enforcing conditional uniqueness, which no plain constraint can do (q12); (3) indexing a rare value - where status = 'failed' on a queue table where failures are 0.1 percent, giving a tiny index for the query that matters at 3 a.m. the requirement is that the planner must be able to prove the query predicate implies the index predicate, and its proof engine is deliberately simple. where status = 'active' matches an index on where status = 'active', but where status = $1 does not, even when the parameter happens to be 'active'. that single fact catches most people: partial indexes and parameterized queries fight each other, and you often need the literal or a dedicated query path."}, {"n": 49, "category": 3, "difficulty": "D", "html": "Expression indexes and why <code>WHERE lower(email) = ?<\/code> needs one. What does this do to the planner&#x27;s statistics?", "answerTitle": "Expression indexes", "answer": "<p><code>WHERE lower(email) = ?<\/code> cannot use an index on <code>email<\/code>, because the index stores the raw values and the planner will not invert an arbitrary function. <code>CREATE INDEX ON users (lower(email))<\/code> stores the computed value and matches the expression textually.<\/p><p>The statistics consequence is the interesting part: PostgreSQL collects a <strong>separate statistics entry for the expression<\/strong>, so after <code>ANALYZE<\/code> the planner knows the distribution of <code>lower(email)<\/code> rather than guessing. That is often a bigger win than the index itself for a skewed expression, and it is why <code>CREATE STATISTICS<\/code> on an expression is sometimes worthwhile even without an index.<\/p><p>Requirements and costs: the function must be <code>IMMUTABLE<\/code> (so <code>lower()<\/code> in a fixed collation is fine, <code>now()<\/code> is not), and the expression is evaluated on every insert and on every update of the underlying column. For case-insensitive matching specifically, a <code>citext<\/code> column or a case-insensitive ICU collation is the cleaner long-term answer.<\/p>", "source": "answers.md", "search": "expression indexes and why where lower(email) = ? needs one. what does this do to the planner's statistics? where lower(email) = ? cannot use an index on email, because the index stores the raw values and the planner will not invert an arbitrary function. create index on users (lower(email)) stores the computed value and matches the expression textually. the statistics consequence is the interesting part: postgresql collects a separate statistics entry for the expression , so after analyze the planner knows the distribution of lower(email) rather than guessing. that is often a bigger win than the index itself for a skewed expression, and it is why create statistics on an expression is sometimes worthwhile even without an index. requirements and costs: the function must be immutable (so lower() in a fixed collation is fine, now() is not), and the expression is evaluated on every insert and on every update of the underlying column. for case-insensitive matching specifically, a citext column or a case-insensitive icu collation is the cleaner long-term answer."}, {"n": 50, "category": 3, "difficulty": "T", "html": "Name six ways to make an existing index unusable by a query, without dropping it.", "answerTitle": "Six ways to make an index unusable", "answer": "<ol><li><strong>Wrap the column in a function or a cast<\/strong> - <code>WHERE date(created_at) = ?<\/code>, or comparing a <code>varchar<\/code> column to an integer parameter, which forces an implicit cast on the <em>column<\/em>.<\/li><li><strong>Leading wildcard<\/strong> - <code>LIKE &#x27;%term&#x27;<\/code> cannot use a B-tree (use <code>pg_trgm<\/code>, Q55).<\/li><li><strong>Break the leftmost prefix<\/strong> - query only <code>b<\/code> from <code>(a, b)<\/code> (Q44).<\/li><li><strong>Type or collation mismatch<\/strong> - a <code>text<\/code> column indexed under one collation compared under another, or <code>varchar<\/code> vs <code>text<\/code> across a join in some engines.<\/li><li><strong><code>OR<\/code> across columns with no bitmap plan available<\/strong>, or a predicate the planner cannot prove matches a partial index (Q48).<\/li><li><strong>Low selectivity or bad statistics<\/strong> - the planner correctly concludes a sequential scan is cheaper, or incorrectly concludes it because <code>ANALYZE<\/code> has not run (Q69).<\/li><\/ol><p>Honourable mentions: <code>NOT<\/code>/<code>&lt;&gt;<\/code> predicates, <code>ORDER BY<\/code> with a direction the index cannot satisfy in a multi-column mix (<code>a ASC, b DESC<\/code> needs a matching index), and parallel/JIT settings changing the cost comparison.<\/p>", "source": "answers.md", "search": "name six ways to make an existing index unusable by a query, without dropping it. 1. wrap the column in a function or a cast - where date(created_at) = ?, or comparing a varchar column to an integer parameter, which forces an implicit cast on the column . 2. leading wildcard - like '%term' cannot use a b-tree (use pg_trgm, q55). 3. break the leftmost prefix - query only b from (a, b) (q44). 4. type or collation mismatch - a text column indexed under one collation compared under another, or varchar vs text across a join in some engines. 5. or across columns with no bitmap plan available , or a predicate the planner cannot prove matches a partial index (q48). 6. low selectivity or bad statistics - the planner correctly concludes a sequential scan is cheaper, or incorrectly concludes it because analyze has not run (q69). honourable mentions: not/< predicates, order by with a direction the index cannot satisfy in a multi-column mix (a asc, b desc needs a matching index), and parallel/jit settings changing the cost comparison."}, {"n": 51, "category": 3, "difficulty": "D", "html": "Selectivity and cardinality. At what selectivity does a sequential scan beat an index scan, and why is the answer not a fixed percentage?", "answerTitle": "Selectivity and the crossover point", "answer": "<p>Selectivity is the fraction of rows a predicate keeps. An index scan costs roughly one random page read per matching row (in the worst case, one heap page per row), while a sequential scan reads every page but sequentially and with readahead.<\/p><p>The crossover is therefore not a fixed percentage. It depends on: the ratio <code>random_page_cost / seq_page_cost<\/code> (default 4.0, realistic on SSD is 1.1-2.0); <strong>correlation<\/strong> between the index order and the physical row order, which PostgreSQL tracks per column - a perfectly correlated column means the &quot;random&quot; fetches are actually sequential, so an index can win at 50 percent selectivity; the row width, which determines rows per page; and whether the scan can be index-only.<\/p><p>The commonly quoted &quot;5 to 10 percent&quot; is a heuristic for an uncorrelated column on spinning disk. The right answer in an interview is the list of factors plus the observation that a <em>bitmap<\/em> index scan exists precisely to interpolate between the two extremes.<\/p>", "source": "answers.md", "search": "selectivity and cardinality. at what selectivity does a sequential scan beat an index scan, and why is the answer not a fixed percentage? selectivity is the fraction of rows a predicate keeps. an index scan costs roughly one random page read per matching row (in the worst case, one heap page per row), while a sequential scan reads every page but sequentially and with readahead. the crossover is therefore not a fixed percentage. it depends on: the ratio random_page_cost / seq_page_cost (default 4.0, realistic on ssd is 1.1-2.0); correlation between the index order and the physical row order, which postgresql tracks per column - a perfectly correlated column means the \"random\" fetches are actually sequential, so an index can win at 50 percent selectivity; the row width, which determines rows per page; and whether the scan can be index-only. the commonly quoted \"5 to 10 percent\" is a heuristic for an uncorrelated column on spinning disk. the right answer in an interview is the list of factors plus the observation that a bitmap index scan exists precisely to interpolate between the two extremes."}, {"n": 52, "category": 3, "difficulty": "D", "html": "Bitmap index scans in PostgreSQL - what problem they solve, what <code>lossy<\/code> means in the plan output, and how <code>work_mem<\/code> affects them.", "answerTitle": "Bitmap index scans", "answer": "<p>A bitmap index scan solves the &quot;too many rows for an index scan, too few for a sequential scan&quot; middle ground, and the &quot;combine two indexes&quot; problem. It runs the index scan first, builds an in-memory bitmap of matching heap <strong>pages<\/strong>, and then reads those pages in <em>physical order<\/em> - turning random IO into something close to sequential and visiting each page once even if it holds twenty matches.<\/p><p>Because it produces page-level results, the heap access is followed by a <strong>recheck<\/strong> of the original condition, which is why you see <code>Recheck Cond<\/code> in the plan.<\/p><p><code>lossy<\/code> means the bitmap ran out of <code>work_mem<\/code> and degraded from tracking individual tuples to tracking whole pages, so every tuple on those pages must be rechecked. <code>Heap Blocks: exact=1200 lossy=48000<\/code> in <code>EXPLAIN ANALYZE<\/code> is a direct signal that raising <code>work_mem<\/code> for that query will help. <code>BitmapAnd<\/code>/<code>BitmapOr<\/code> nodes combine bitmaps from several indexes, which is how PostgreSQL uses two single-column indexes for an <code>AND<\/code> - usefully, but never as well as one correct composite index.<\/p>", "source": "answers.md", "search": "bitmap index scans in postgresql - what problem they solve, what lossy means in the plan output, and how work_mem affects them. a bitmap index scan solves the \"too many rows for an index scan, too few for a sequential scan\" middle ground, and the \"combine two indexes\" problem. it runs the index scan first, builds an in-memory bitmap of matching heap pages , and then reads those pages in physical order - turning random io into something close to sequential and visiting each page once even if it holds twenty matches. because it produces page-level results, the heap access is followed by a recheck of the original condition, which is why you see recheck cond in the plan. lossy means the bitmap ran out of work_mem and degraded from tracking individual tuples to tracking whole pages, so every tuple on those pages must be rechecked. heap blocks: exact=1200 lossy=48000 in explain analyze is a direct signal that raising work_mem for that query will help. bitmapand/bitmapor nodes combine bitmaps from several indexes, which is how postgresql uses two single-column indexes for an and - usefully, but never as well as one correct composite index."}, {"n": 53, "category": 3, "difficulty": "D", "html": "GIN, GiST, SP-GiST, BRIN and hash indexes. Give the workload each one is the right answer for.", "answerTitle": "Index types by workload", "answer": "<table><thead><tr><th>Type<\/th><th>Workload<\/th><\/tr><\/thead><tbody><tr><td><strong>B-tree<\/strong><\/td><td>Everything ordered: equality, ranges, <code>ORDER BY<\/code>, uniqueness. The default and right answer 90 percent of the time.<\/td><\/tr><tr><td><strong>GIN<\/strong><\/td><td>One row contains many searchable values: full-text <code>tsvector<\/code>, JSONB containment, array membership, trigrams. Fast reads, slow and bulky writes, mitigated by the pending-list (<code>fastupdate<\/code>).<\/td><\/tr><tr><td><strong>GiST<\/strong><\/td><td>Overlap and nearest-neighbour on complex types: geometry (PostGIS), ranges and <code>EXCLUDE<\/code> constraints, k-NN ordering. Lossy, so it rechecks.<\/td><\/tr><tr><td><strong>SP-GiST<\/strong><\/td><td>Non-balanced partitioned structures: quadtrees, radix trees on text prefixes, IP addresses.<\/td><\/tr><tr><td><strong>BRIN<\/strong><\/td><td>Enormous, naturally ordered, append-only tables - time-series by timestamp. Stores min/max per block range, so the index is kilobytes for a terabyte table. Useless if physical order and value order diverge.<\/td><\/tr><tr><td><strong>Hash<\/strong><\/td><td>Equality only, on very wide keys where a B-tree would be large. WAL-logged and crash-safe since PostgreSQL 10, but the niche is narrow; B-tree is usually as good.<\/td><\/tr><\/tbody><\/table><p>BRIN is the one worth volunteering: for an append-only events table, a BRIN index on <code>created_at<\/code> gives most of the range-scan benefit for a fraction of a percent of the storage and near-zero write cost.<\/p>", "source": "answers.md", "search": "gin, gist, sp-gist, brin and hash indexes. give the workload each one is the right answer for. type workload --- --- b-tree everything ordered: equality, ranges, order by, uniqueness. the default and right answer 90 percent of the time. gin one row contains many searchable values: full-text tsvector, jsonb containment, array membership, trigrams. fast reads, slow and bulky writes, mitigated by the pending-list (fastupdate). gist overlap and nearest-neighbour on complex types: geometry (postgis), ranges and exclude constraints, k-nn ordering. lossy, so it rechecks. sp-gist non-balanced partitioned structures: quadtrees, radix trees on text prefixes, ip addresses. brin enormous, naturally ordered, append-only tables - time-series by timestamp. stores min/max per block range, so the index is kilobytes for a terabyte table. useless if physical order and value order diverge. hash equality only, on very wide keys where a b-tree would be large. wal-logged and crash-safe since postgresql 10, but the niche is narrow; b-tree is usually as good. brin is the one worth volunteering: for an append-only events table, a brin index on created_at gives most of the range-scan benefit for a fraction of a percent of the storage and near-zero write cost."}, {"n": 54, "category": 3, "difficulty": "D", "html": "Full-text search inside PostgreSQL: <code>tsvector<\/code>, <code>tsquery<\/code>, GIN indexing, and where you would move to a dedicated search engine instead.", "answerTitle": "Full-text search in PostgreSQL", "answer": "<p><code>to_tsvector(config, text)<\/code> normalizes text into lexemes with positions, applying the configuration&#x27;s parser, dictionaries and stemming; <code>to_tsquery<\/code>/<code>plainto_tsquery<\/code>/<code>websearch_to_tsquery<\/code> build the query side; the <code>@@<\/code> operator matches; <code>ts_rank<\/code>/<code>ts_rank_cd<\/code> scores. A GIN index over a stored generated <code>tsvector<\/code> column is the standard setup, with <code>setweight<\/code> used to weight title above body.<\/p><p>It is genuinely good enough for: search within a tenant&#x27;s data, admin search, &quot;find the document&quot;, and anything where the corpus is a table you already have and consistency with the transactional data matters (no sync pipeline, no dual write).<\/p><p>I move to Elasticsearch or OpenSearch when I need relevance tuning as a product feature (custom analyzers per language, synonyms, fuzzy matching, learning-to-rank), faceted aggregation over large result sets, sub-100ms search across tens of millions of documents, or a search team who need to iterate without a database migration. The cost of moving is the sync pipeline and its drift (Q216), which is exactly why I do not move earlier than necessary.<\/p>", "source": "answers.md", "search": "full-text search inside postgresql: tsvector, tsquery, gin indexing, and where you would move to a dedicated search engine instead. to_tsvector(config, text) normalizes text into lexemes with positions, applying the configuration's parser, dictionaries and stemming; to_tsquery/plainto_tsquery/websearch_to_tsquery build the query side; the @@ operator matches; ts_rank/ts_rank_cd scores. a gin index over a stored generated tsvector column is the standard setup, with setweight used to weight title above body. it is genuinely good enough for: search within a tenant's data, admin search, \"find the document\", and anything where the corpus is a table you already have and consistency with the transactional data matters (no sync pipeline, no dual write). i move to elasticsearch or opensearch when i need relevance tuning as a product feature (custom analyzers per language, synonyms, fuzzy matching, learning-to-rank), faceted aggregation over large result sets, sub-100ms search across tens of millions of documents, or a search team who need to iterate without a database migration. the cost of moving is the sync pipeline and its drift (q216), which is exactly why i do not move earlier than necessary."}, {"n": 55, "category": 3, "difficulty": "D", "html": "Trigram indexes (<code>pg_trgm<\/code>) for <code>LIKE &#x27;%foo%&#x27;<\/code>. How do they work and what do they cost on write?", "answerTitle": "Trigram indexes", "answer": "<p><code>pg_trgm<\/code> decomposes a string into overlapping three-character sequences (<code>hello<\/code> becomes <code>  h<\/code>, <code> he<\/code>, <code>hel<\/code>, <code>ell<\/code>, <code>llo<\/code>, <code>lo <\/code>). A GIN or GiST index over those trigrams lets <code>LIKE &#x27;%ell%&#x27;<\/code>, <code>ILIKE<\/code>, and similarity (<code>%<\/code> operator, <code>word_similarity<\/code>) find candidate rows by intersecting posting lists, then rechecking the actual pattern.<\/p><p>It is the answer to unanchored <code>LIKE<\/code>, to typo-tolerant name lookup, and to &quot;search box over a few columns&quot; without leaving the database.<\/p><p>Costs: the index is large (many trigrams per row), writes pay for extracting and inserting all of them, patterns shorter than three characters cannot be indexed at all, and the recheck means selectivity estimates are rough. GIN is faster to search and slower to update; GiST is smaller and supports distance ordering. On a write-heavy table I would measure the insert regression before shipping it.<\/p>", "source": "answers.md", "search": "trigram indexes (pg_trgm) for like '%foo%'. how do they work and what do they cost on write? pg_trgm decomposes a string into overlapping three-character sequences (hello becomes h, he, hel, ell, llo, lo ). a gin or gist index over those trigrams lets like '%ell%', ilike, and similarity (% operator, word_similarity) find candidate rows by intersecting posting lists, then rechecking the actual pattern. it is the answer to unanchored like, to typo-tolerant name lookup, and to \"search box over a few columns\" without leaving the database. costs: the index is large (many trigrams per row), writes pay for extracting and inserting all of them, patterns shorter than three characters cannot be indexed at all, and the recheck means selectivity estimates are rough. gin is faster to search and slower to update; gist is smaller and supports distance ordering. on a write-heavy table i would measure the insert regression before shipping it."}, {"n": 56, "category": 3, "difficulty": "D", "html": "The write cost of an index: what happens on <code>INSERT<\/code>, on <code>UPDATE<\/code> of an indexed column, and on <code>UPDATE<\/code> of a non-indexed column (HOT).", "answerTitle": "The write cost of an index", "answer": "<ul><li><strong><code>INSERT<\/code><\/strong>: one index entry per index, each potentially causing a page split. This is why bulk loads drop indexes and rebuild them.<\/li><li><strong><code>UPDATE<\/code> of an indexed column<\/strong>: because MVCC writes a new tuple version, the new tuple needs new entries in <strong>every<\/strong> index, not just the one on the changed column, and the old entries remain until vacuum.<\/li><li><strong><code>UPDATE<\/code> of a non-indexed column<\/strong>: eligible for a <strong>HOT update<\/strong> (Q130) - the new version is placed on the same page and chained from the old one, and <strong>no index is touched at all<\/strong>. This is the single most important write optimization in PostgreSQL.<\/li><\/ul><p>The consequences to state: adding an index to a frequently updated column can destroy HOT eligibility across the whole table and multiply write IO; leaving <code>fillfactor<\/code> at 100 on a hot table means no room on the page for the new version, which also breaks HOT; and every extra index is paid for on every write, every vacuum and every backup, not just on inserts.<\/p>", "source": "answers.md", "search": "the write cost of an index: what happens on insert, on update of an indexed column, and on update of a non-indexed column (hot). - insert : one index entry per index, each potentially causing a page split. this is why bulk loads drop indexes and rebuild them. - update of an indexed column : because mvcc writes a new tuple version, the new tuple needs new entries in every index, not just the one on the changed column, and the old entries remain until vacuum. - update of a non-indexed column : eligible for a hot update (q130) - the new version is placed on the same page and chained from the old one, and no index is touched at all . this is the single most important write optimization in postgresql. the consequences to state: adding an index to a frequently updated column can destroy hot eligibility across the whole table and multiply write io; leaving fillfactor at 100 on a hot table means no room on the page for the new version, which also breaks hot; and every extra index is paid for on every write, every vacuum and every backup, not just on inserts."}, {"n": 57, "category": 3, "difficulty": "D", "html": "Index bloat: how it happens, how you measure it, and <code>REINDEX CONCURRENTLY<\/code> versus rebuilding the table.", "answerTitle": "Index bloat", "answer": "<p>Bloat is dead space in index pages: deleted or updated entries are only removed by vacuum, page splits leave pages half full, and a random-key workload (Q6) or a table with heavy churn leaves indexes far larger than their live data. B-trees do not merge underfull pages back together, so an index that grew during a bulk delete never shrinks on its own.<\/p><p>Measure it with the <code>pgstattuple<\/code>/<code>pgstatindex<\/code> extensions for accuracy, or the common estimate queries against <code>pg_class<\/code> and <code>pg_stats<\/code> for a cheap approximation; the operational signal is index size growing while row count is flat, and cache hit ratio falling.<\/p><p><code>REINDEX CONCURRENTLY<\/code> (PostgreSQL 12+) rebuilds an index without an exclusive lock - it builds a new index, swaps, then drops the old - at the cost of double the disk space during the build and a failure mode that leaves an invalid index behind (<code>_ccnew<\/code>), which you must clean up. <code>pg_repack<\/code> rewrites the <em>table<\/em> and all its indexes online and is what I use when the heap is bloated too. <code>VACUUM FULL<\/code> does both but takes <code>ACCESS EXCLUSIVE<\/code> for the duration, so it is a maintenance-window tool only.<\/p>", "source": "answers.md", "search": "index bloat: how it happens, how you measure it, and reindex concurrently versus rebuilding the table. bloat is dead space in index pages: deleted or updated entries are only removed by vacuum, page splits leave pages half full, and a random-key workload (q6) or a table with heavy churn leaves indexes far larger than their live data. b-trees do not merge underfull pages back together, so an index that grew during a bulk delete never shrinks on its own. measure it with the pgstattuple/pgstatindex extensions for accuracy, or the common estimate queries against pg_class and pg_stats for a cheap approximation; the operational signal is index size growing while row count is flat, and cache hit ratio falling. reindex concurrently (postgresql 12+) rebuilds an index without an exclusive lock - it builds a new index, swaps, then drops the old - at the cost of double the disk space during the build and a failure mode that leaves an invalid index behind (_ccnew), which you must clean up. pg_repack rewrites the table and all its indexes online and is what i use when the heap is bloated too. vacuum full does both but takes access exclusive for the duration, so it is a maintenance-window tool only."}, {"n": 58, "category": 3, "difficulty": "T", "html": "A table has 14 indexes. What is the fastest defensible way to decide which to drop, and what must you check before dropping any?", "answerTitle": "Fourteen indexes, which to drop", "answer": "<p>Fastest defensible method: read <code>pg_stat_user_indexes<\/code> for <code>idx_scan<\/code> counts, reset the statistics at a known point, and let it run through a <strong>full business cycle<\/strong> - including month-end, quarterly reporting and the batch jobs. Anything with <code>idx_scan = 0<\/code> after that is a candidate. Cross-reference <code>pg_stat_statements<\/code> to see which queries actually run.<\/p><p>Before dropping any, check four things: (1) it is not enforcing a <strong>unique constraint<\/strong> or backing a <strong>primary key<\/strong> or <strong>foreign key<\/strong> - those are constraints, not just indexes; (2) it is not needed by a query on a <em>replica<\/em>, since index statistics are per-node and reporting often runs elsewhere; (3) it is not the index used only by an emergency runbook or the annual audit query; (4) whether a broader index makes it redundant - <code>(a)<\/code> is redundant if <code>(a, b)<\/code> exists, though not vice versa.<\/p><p>The safe procedure is to make it invisible first: PostgreSQL has no invisible-index feature (MySQL 8 and Oracle do), so the equivalent is dropping it inside a transaction in a maintenance window with the recreate script ready, or reindexing it as <code>INVALID<\/code>. In practice I drop with a <code>CREATE INDEX CONCURRENTLY<\/code> script prepared and the size noted, so restoring takes minutes.<\/p>", "source": "answers.md", "search": "a table has 14 indexes. what is the fastest defensible way to decide which to drop, and what must you check before dropping any? fastest defensible method: read pg_stat_user_indexes for idx_scan counts, reset the statistics at a known point, and let it run through a full business cycle - including month-end, quarterly reporting and the batch jobs. anything with idx_scan = 0 after that is a candidate. cross-reference pg_stat_statements to see which queries actually run. before dropping any, check four things: (1) it is not enforcing a unique constraint or backing a primary key or foreign key - those are constraints, not just indexes; (2) it is not needed by a query on a replica , since index statistics are per-node and reporting often runs elsewhere; (3) it is not the index used only by an emergency runbook or the annual audit query; (4) whether a broader index makes it redundant - (a) is redundant if (a, b) exists, though not vice versa. the safe procedure is to make it invisible first: postgresql has no invisible-index feature (mysql 8 and oracle do), so the equivalent is dropping it inside a transaction in a maintenance window with the recreate script ready, or reindexing it as invalid. in practice i drop with a create index concurrently script prepared and the size noted, so restoring takes minutes."}, {"n": 59, "category": 3, "difficulty": "D", "html": "Unique indexes and how a deferred unique constraint changes concurrency. When do you need deferrable?", "answerTitle": "Unique and deferrable constraints", "answer": "<p>A unique index enforces uniqueness at <strong>statement<\/strong> time: the inserting transaction takes a lock on the index entry and a concurrent duplicate blocks until the first commits or rolls back. That is why a unique constraint is a genuine concurrency control, not just a check.<\/p><p><code>DEFERRABLE INITIALLY DEFERRED<\/code> postpones the check to <code>COMMIT<\/code>. You need it when a legal intermediate state violates the constraint - renumbering positions in an ordered list (<code>UPDATE items SET pos = pos + 1<\/code>) is the classic, along with swapping two unique values, and circular foreign key references between two tables inserted in one transaction.<\/p><p>Costs: deferred checks accumulate in a per-transaction queue, so a large batch uses memory and reports all failures late, when the transaction is expensive to lose. PostgreSQL also cannot use a deferrable unique constraint as the arbiter for <code>ON CONFLICT<\/code>. So I make constraints deferrable only where an intermediate violation is genuinely required.<\/p>", "source": "answers.md", "search": "unique indexes and how a deferred unique constraint changes concurrency. when do you need deferrable? a unique index enforces uniqueness at statement time: the inserting transaction takes a lock on the index entry and a concurrent duplicate blocks until the first commits or rolls back. that is why a unique constraint is a genuine concurrency control, not just a check. deferrable initially deferred postpones the check to commit. you need it when a legal intermediate state violates the constraint - renumbering positions in an ordered list (update items set pos = pos + 1) is the classic, along with swapping two unique values, and circular foreign key references between two tables inserted in one transaction. costs: deferred checks accumulate in a per-transaction queue, so a large batch uses memory and reports all failures late, when the transaction is expensive to lose. postgresql also cannot use a deferrable unique constraint as the arbiter for on conflict. so i make constraints deferrable only where an intermediate violation is genuinely required."}, {"n": 60, "category": 3, "difficulty": "D", "html": "<code>CREATE INDEX CONCURRENTLY<\/code> - what it costs, why it can fail leaving an invalid index, and the operational procedure around it.", "answerTitle": "`CREATE INDEX CONCURRENTLY`", "answer": "<p>It avoids the <code>ACCESS EXCLUSIVE<\/code>-equivalent write lock of a normal index build by doing <strong>two passes<\/strong> over the table plus waits: build from a snapshot, then a second pass to catch rows changed during the first, waiting for all transactions older than each phase to finish. Reads and writes continue throughout.<\/p><p>The costs: it takes roughly twice as long and more IO; it cannot run inside a transaction block (so a migration tool must be told not to wrap it); it waits on <strong>any<\/strong> long-running transaction, including on a hot standby with <code>hot_standby_feedback<\/code>, so one idle-in-transaction session stalls it indefinitely; and if it fails it leaves an <strong>invalid index<\/strong> that consumes writes but is never used by queries.<\/p><p>The procedure I run: check for long transactions first, run it outside the deployment transaction with a generous timeout and monitoring, then verify <code>pg_index.indisvalid<\/code>; if invalid, <code>DROP INDEX CONCURRENTLY<\/code> and retry. On a partitioned table you build on each partition and then attach, because building on the parent takes a strong lock.<\/p>", "source": "answers.md", "search": "create index concurrently - what it costs, why it can fail leaving an invalid index, and the operational procedure around it. it avoids the access exclusive-equivalent write lock of a normal index build by doing two passes over the table plus waits: build from a snapshot, then a second pass to catch rows changed during the first, waiting for all transactions older than each phase to finish. reads and writes continue throughout. the costs: it takes roughly twice as long and more io; it cannot run inside a transaction block (so a migration tool must be told not to wrap it); it waits on any long-running transaction, including on a hot standby with hot_standby_feedback, so one idle-in-transaction session stalls it indefinitely; and if it fails it leaves an invalid index that consumes writes but is never used by queries. the procedure i run: check for long transactions first, run it outside the deployment transaction with a generous timeout and monitoring, then verify pg_index.indisvalid; if invalid, drop index concurrently and retry. on a partitioned table you build on each partition and then attach, because building on the parent takes a strong lock."}, {"n": 61, "category": 3, "difficulty": "T", "html": "You add the perfect index and the query gets <em>slower<\/em>. Give three genuine mechanisms by which this happens.", "answerTitle": "A new index makes the query slower", "answer": "<p>Three genuine mechanisms:<\/p><ol><li><strong>The planner switches to a worse plan.<\/strong> The new index changes the cost landscape; a bad row estimate that was harmless with a hash join now produces a nested loop driven by the new index, executed millions of times. This is the most common case, and the plan diff proves it.<\/li><li><strong>The index is correct but the access pattern is bad.<\/strong> The optimizer chose an index scan where a bitmap or sequential scan was better - typically low correlation, high row count, and a <code>random_page_cost<\/code> that does not reflect SSD. Random single-row heap fetches for 30 percent of a table is slower than reading the table.<\/li><li><strong>The write cost lands on the read path.<\/strong> The index broke HOT updates (Q56, Q130), so the table now bloats faster, pages hold fewer live rows, autovacuum runs constantly, and <em>every<\/em> query on that table reads more pages. This one is invisible if you only look at the query you were tuning.<\/li><\/ol><p>There is also a fourth, self-inflicted case: the index was created but never analyzed, or a partial/expression index shifted the statistics so a different query regressed. Always compare plans before and after, and look at the table&#x27;s overall throughput, not just the target query.<\/p>", "source": "answers.md", "search": "you add the perfect index and the query gets slower . give three genuine mechanisms by which this happens. three genuine mechanisms: 1. the planner switches to a worse plan. the new index changes the cost landscape; a bad row estimate that was harmless with a hash join now produces a nested loop driven by the new index, executed millions of times. this is the most common case, and the plan diff proves it. 2. the index is correct but the access pattern is bad. the optimizer chose an index scan where a bitmap or sequential scan was better - typically low correlation, high row count, and a random_page_cost that does not reflect ssd. random single-row heap fetches for 30 percent of a table is slower than reading the table. 3. the write cost lands on the read path. the index broke hot updates (q56, q130), so the table now bloats faster, pages hold fewer live rows, autovacuum runs constantly, and every query on that table reads more pages. this one is invisible if you only look at the query you were tuning. there is also a fourth, self-inflicted case: the index was created but never analyzed, or a partial/expression index shifted the statistics so a different query regressed. always compare plans before and after, and look at the table's overall throughput, not just the target query."}, {"n": 62, "category": 3, "difficulty": "A", "html": "What is your standing index policy for a team - who approves them, what evidence is required, and how do you prevent index sprawl?", "answerTitle": "Index policy for a team", "answer": "<p>What I would put in place, in the order it earns its keep:<\/p><ol><li><strong>Evidence required with the change.<\/strong> Any new index arrives with the query, the <code>EXPLAIN (ANALYZE, BUFFERS)<\/code> before, the expected plan after, and the estimated size. No evidence, no index. This alone stops most sprawl, because half of proposed indexes turn out to duplicate an existing one.<\/li><li><strong>Owned by the team that owns the table<\/strong>, reviewed by whoever is on call for that database - not by a central architecture board, which becomes a queue.<\/li><li><strong>Automated hygiene<\/strong>: a weekly report of unused indexes (<code>idx_sca
