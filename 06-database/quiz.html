that placement is a routing lookup rather than a branch."}, {"n": 255, "category": 14, "difficulty": "T", "html": "You have 4,000 tenants in schema-per-tenant and a migration takes 8 seconds each. What now?", "answerTitle": "4,000 tenants at 8 seconds each", "answer": "<p>Serially that is nearly nine hours, during which the fleet is running mixed schema versions - which is fine if the migration is backward compatible (Q243) and fatal if it is not. So the first move is to <strong>guarantee backward compatibility<\/strong>, because that converts a nine-hour outage into a nine-hour background job.<\/p><p>Then, in order:<\/p><ol><li><strong>Parallelize.<\/strong> Run K workers migrating different schemas concurrently, bounded by the database&#x27;s capacity (connections, IO, and lock contention on shared catalog objects). With 16 workers, nine hours becomes about 35 minutes. Catalog contention is the real limit, so ramp K up while watching lock waits.<\/li><li><strong>Make it resumable and idempotent.<\/strong> A control table recording each tenant&#x27;s applied version, so a failure at tenant 2,300 resumes rather than restarts, and so a partially applied migration is detectable per tenant.<\/li><li><strong>Attack the 8 seconds.<\/strong> Is it a table rewrite that could be a metadata change (Q244, Q245)? Is it an index build that could be <code>CONCURRENTLY<\/code> on a small table? Eight seconds per schema on a small tenant usually means the migration is doing something rewrite-shaped that a better formulation would avoid.<\/li><li><strong>Batch by tenant tier<\/strong> - migrate internal and small tenants first as a canary, then the rest in waves, so a bad migration is caught at tenant 5 rather than tenant 4,000.<\/li><li><strong>Decouple deployment from migration<\/strong>: the application must tolerate both schema versions, so deploying code and migrating tenants become independent activities with a feature flag deciding when the new path is used per tenant.<\/li><\/ol><p>And the strategic answer: 4,000 schemas is past the point where schema-per-tenant is comfortable (Q254). If migration time is a recurring operational problem, that is the model telling you it has outgrown its assumptions, and the conversation is whether the largest tenants move to their own databases and the long tail consolidates into a shared schema.<\/p>", "source": "answers.md", "search": "you have 4,000 tenants in schema-per-tenant and a migration takes 8 seconds each. what now? serially that is nearly nine hours, during which the fleet is running mixed schema versions - which is fine if the migration is backward compatible (q243) and fatal if it is not. so the first move is to guarantee backward compatibility , because that converts a nine-hour outage into a nine-hour background job. then, in order: 1. parallelize. run k workers migrating different schemas concurrently, bounded by the database's capacity (connections, io, and lock contention on shared catalog objects). with 16 workers, nine hours becomes about 35 minutes. catalog contention is the real limit, so ramp k up while watching lock waits. 2. make it resumable and idempotent. a control table recording each tenant's applied version, so a failure at tenant 2,300 resumes rather than restarts, and so a partially applied migration is detectable per tenant. 3. attack the 8 seconds. is it a table rewrite that could be a metadata change (q244, q245)? is it an index build that could be concurrently on a small table? eight seconds per schema on a small tenant usually means the migration is doing something rewrite-shaped that a better formulation would avoid. 4. batch by tenant tier - migrate internal and small tenants first as a canary, then the rest in waves, so a bad migration is caught at tenant 5 rather than tenant 4,000. 5. decouple deployment from migration : the application must tolerate both schema versions, so deploying code and migrating tenants become independent activities with a feature flag deciding when the new path is used per tenant. and the strategic answer: 4,000 schemas is past the point where schema-per-tenant is comfortable (q254). if migration time is a recurring operational problem, that is the model telling you it has outgrown its assumptions, and the conversation is whether the largest tenants move to their own databases and the long tail consolidates into a shared schema."}, {"n": 256, "category": 14, "difficulty": "A", "html": "Design the review and safety process for schema changes in an organization with 30 teams sharing five databases.", "answerTitle": "Schema change review across 30 teams", "answer": "<p><strong>Principles<\/strong>: the owning team decides <em>what<\/em> to change; the platform makes it <strong>impossible to do it dangerously by accident<\/strong>; review effort is spent only on the changes that can cause an outage. A central approval board for all schema changes becomes a queue, and a queue becomes a workaround.<\/p><p><strong>The mechanism I would build<\/strong>, in the order I would build it:<\/p><ol><li><strong>Automated lint in CI, blocking.<\/strong> A migration linter (Squawk, or a home-grown check) that fails the build on: DDL without <code>lock_timeout<\/code>; a rewrite-inducing <code>ALTER COLUMN TYPE<\/code> or volatile default; <code>SET NOT NULL<\/code> without the <code>NOT VALID<\/code> sequence; <code>CREATE INDEX<\/code> without <code>CONCURRENTLY<\/code>; a <code>DROP<\/code> of a column or table (which requires an explicit annotation and a reference to the release where it stopped being used); adding a <code>UNIQUE<\/code> or <code>PRIMARY KEY<\/code> directly; and a missing index on a new foreign key. This catches perhaps 80 percent of dangerous changes with no human involved, which is what makes the rest of the process affordable.<\/li><li><strong>A risk classification in the PR template<\/strong>, auto-suggested by the linter: <em>routine<\/em> (additive, metadata-only) merges with normal code review; <em>elevated<\/em> (backfill, index build on a large table, anything touching a table above a size threshold) requires a second reviewer from a rotating pool of database-literate engineers and a written execution plan; <em>high<\/em> (rewrite, drop, cross-team table, multi-tenant fan-out) requires the platform team and a scheduled window.<\/li><li><strong>A rehearsal environment<\/strong> with a restored production-sized copy, where every elevated and high migration is executed and <strong>timed<\/strong> before approval. &quot;It took 4 seconds on a copy of production&quot; is worth more than any review comment.<\/li><li><strong>Ownership metadata<\/strong>: every table has an owning team recorded in a catalog, and a migration touching a table you do not own automatically requests review from the owner. This is where the five-shared-databases problem actually bites, and making the coupling <strong>visible<\/strong> is half the fix - it creates the pressure to split shared tables that no policy will create.<\/li><li><strong>Runtime guardrails independent of review<\/strong>: <code>statement_timeout<\/code> and <code>lock_timeout<\/code> defaults on every role, alerting on lock waits and on long-running transactions, and a kill switch runbook. Review catches intent; guardrails catch mistakes.<\/li><li><strong>A feedback loop<\/strong>: every schema-related incident produces either a new lint rule or a change to the classification. The rule set should grow from real incidents, not from a document written up front.<\/li><\/ol><p><strong>What I would explicitly not do<\/strong>: require a DBA sign-off on every change (a bottleneck and a false sense of safety), maintain a central &quot;data model&quot; document that diverges within a quarter, or block teams from evolving their own tables. The goal is to make the safe path the easy path and the unsafe path loud.<\/p><p><em>Hook: a migration standard you introduced across teams, and the incident that prompted it.<\/em><\/p>", "source": "answers.md", "search": "design the review and safety process for schema changes in an organization with 30 teams sharing five databases. principles : the owning team decides what to change; the platform makes it impossible to do it dangerously by accident ; review effort is spent only on the changes that can cause an outage. a central approval board for all schema changes becomes a queue, and a queue becomes a workaround. the mechanism i would build , in the order i would build it: 1. automated lint in ci, blocking. a migration linter (squawk, or a home-grown check) that fails the build on: ddl without lock_timeout; a rewrite-inducing alter column type or volatile default; set not null without the not valid sequence; create index without concurrently; a drop of a column or table (which requires an explicit annotation and a reference to the release where it stopped being used); adding a unique or primary key directly; and a missing index on a new foreign key. this catches perhaps 80 percent of dangerous changes with no human involved, which is what makes the rest of the process affordable. 2. a risk classification in the pr template , auto-suggested by the linter: routine (additive, metadata-only) merges with normal code review; elevated (backfill, index build on a large table, anything touching a table above a size threshold) requires a second reviewer from a rotating pool of database-literate engineers and a written execution plan; high (rewrite, drop, cross-team table, multi-tenant fan-out) requires the platform team and a scheduled window. 3. a rehearsal environment with a restored production-sized copy, where every elevated and high migration is executed and timed before approval. \"it took 4 seconds on a copy of production\" is worth more than any review comment. 4. ownership metadata : every table has an owning team recorded in a catalog, and a migration touching a table you do not own automatically requests review from the owner. this is where the five-shared-databases problem actually bites, and making the coupling visible is half the fix - it creates the pressure to split shared tables that no policy will create. 5. runtime guardrails independent of review : statement_timeout and lock_timeout defaults on every role, alerting on lock waits and on long-running transactions, and a kill switch runbook. review catches intent; guardrails catch mistakes. 6. a feedback loop : every schema-related incident produces either a new lint rule or a change to the classification. the rule set should grow from real incidents, not from a document written up front. what i would explicitly not do : require a dba sign-off on every change (a bottleneck and a false sense of safety), maintain a central \"data model\" document that diverges within a quarter, or block teams from evolving their own tables. the goal is to make the safe path the easy path and the unsafe path loud. hook: a migration standard you introduced across teams, and the incident that prompted it."}, {"n": 257, "category": 15, "difficulty": "C", "html": "The database is slow. Give your first five minutes, in order, and the question each step answers.", "answerTitle": "The first five minutes", "answer": "<ol><li><strong>Is it the database or the application?<\/strong> Look at database CPU, IO and active session count next to application latency. If the database is idle and the application is timing out, it is the pool or the network (Q236), and the next four steps are the wrong tree.<\/li><li><strong>What is running right now?<\/strong> <code>pg_stat_activity<\/code> ordered by <code>now() - query_start<\/code>, filtered to <code>state &lt;&gt; &#x27;idle&#x27;<\/code>. This answers &quot;is one query eating the machine, or are ten thousand normal queries arriving&quot;.<\/li><li><strong>Is anything blocked?<\/strong> <code>pg_stat_activity<\/code> where <code>wait_event_type = &#x27;Lock&#x27;<\/code>, joined with <code>pg_blocking_pids()<\/code>. A blocking chain has one root, and killing it resolves the incident in seconds - this step has the highest payoff per second spent.<\/li><li><strong>Is anything idle in transaction?<\/strong> The same view filtered on that state, ordered by <code>xact_start<\/code>. It explains bloat, blocked DDL and vacuum stalling (Q93).<\/li><li><strong>What changed?<\/strong> A deployment, a migration, a batch job, a traffic spike, a failover, a statistics refresh. Correlate the start time of the incident with the change log before theorizing.<\/li><\/ol><p>Then, if none of that answers it, <code>pg_stat_statements<\/code> ordered by <code>total_exec_time<\/code> for the recent window, and the wait-event profile (Q259). The discipline is to establish <em>where the time is going<\/em> before forming a hypothesis, because a database incident has perhaps six root-cause families and this sequence eliminates them in order of frequency.<\/p>", "source": "answers.md", "search": "the database is slow. give your first five minutes, in order, and the question each step answers. 1. is it the database or the application? look at database cpu, io and active session count next to application latency. if the database is idle and the application is timing out, it is the pool or the network (q236), and the next four steps are the wrong tree. 2. what is running right now? pg_stat_activity ordered by now() - query_start, filtered to state < 'idle'. this answers \"is one query eating the machine, or are ten thousand normal queries arriving\". 3. is anything blocked? pg_stat_activity where wait_event_type = 'lock', joined with pg_blocking_pids(). a blocking chain has one root, and killing it resolves the incident in seconds - this step has the highest payoff per second spent. 4. is anything idle in transaction? the same view filtered on that state, ordered by xact_start. it explains bloat, blocked ddl and vacuum stalling (q93). 5. what changed? a deployment, a migration, a batch job, a traffic spike, a failover, a statistics refresh. correlate the start time of the incident with the change log before theorizing. then, if none of that answers it, pg_stat_statements ordered by total_exec_time for the recent window, and the wait-event profile (q259). the discipline is to establish where the time is going before forming a hypothesis, because a database incident has perhaps six root-cause families and this sequence eliminates them in order of frequency."}, {"n": 258, "category": 15, "difficulty": "D", "html": "<code>pg_stat_statements<\/code>: what it aggregates, the columns you actually read, and how you use it to rank work rather than queries.", "answerTitle": "`pg_stat_statements`", "answer": "<p>It aggregates execution statistics per <strong>normalized query<\/strong> (constants replaced by placeholders, so the same statement with different parameters shares a <code>queryid<\/code>), per user and per database. The columns I actually read: <code>calls<\/code>, <code>total_exec_time<\/code>, <code>mean_exec_time<\/code>, <code>stddev_exec_time<\/code>, <code>rows<\/code>, and the buffer counters (<code>shared_blks_hit<\/code>, <code>shared_blks_read<\/code>, <code>temp_blks_written<\/code>), plus <code>total_plan_time<\/code> on newer versions.<\/p><p>The important discipline is to <strong>rank by <code>total_exec_time<\/code>, not <code>mean_exec_time<\/code><\/strong> - to rank <em>work<\/em>, not queries. A query taking 2 ms called 4 million times an hour consumes far more of the database than a 30-second report run twice, and the 2 ms query is the one where a 30 percent improvement matters. Sorting by mean finds the slow queries; sorting by total finds the expensive workload, and they are usually different lists.<\/p><p>Two more habits: look at <code>stddev_exec_time<\/code> relative to the mean, because a high ratio means the query is sometimes fine and sometimes terrible - parameter-dependent plans (Q72) or lock waits; and take <strong>snapshots<\/strong> (a scheduled job storing the view with a timestamp, or <code>pg_stat_monitor<\/code>), because the cumulative counters since the last reset tell you nothing about what changed at 14:05. Comparing two snapshots is what turns it from a curiosity into an incident tool.<\/p>", "source": "answers.md", "search": "pg_stat_statements: what it aggregates, the columns you actually read, and how you use it to rank work rather than queries. it aggregates execution statistics per normalized query (constants replaced by placeholders, so the same statement with different parameters shares a queryid), per user and per database. the columns i actually read: calls, total_exec_time, mean_exec_time, stddev_exec_time, rows, and the buffer counters (shared_blks_hit, shared_blks_read, temp_blks_written), plus total_plan_time on newer versions. the important discipline is to rank by total_exec_time, not mean_exec_time - to rank work , not queries. a query taking 2 ms called 4 million times an hour consumes far more of the database than a 30-second report run twice, and the 2 ms query is the one where a 30 percent improvement matters. sorting by mean finds the slow queries; sorting by total finds the expensive workload, and they are usually different lists. two more habits: look at stddev_exec_time relative to the mean, because a high ratio means the query is sometimes fine and sometimes terrible - parameter-dependent plans (q72) or lock waits; and take snapshots (a scheduled job storing the view with a timestamp, or pg_stat_monitor), because the cumulative counters since the last reset tell you nothing about what changed at 14:05. comparing two snapshots is what turns it from a curiosity into an incident tool."}, {"n": 259, "category": 15, "difficulty": "D", "html": "Wait event analysis: the wait classes, what a lock wait versus an IO wait versus a buffer pin means, and how you sample them.", "answerTitle": "Wait event analysis", "answer": "<p>PostgreSQL classifies what a backend is waiting on into classes: <code>LWLock<\/code> (internal lightweight locks - buffer mapping, WAL insert), <code>Lock<\/code> (heavyweight relation and row locks), <code>BufferPin<\/code>, <code>IO<\/code> (data file reads and writes, WAL writes), <code>IPC<\/code> (waiting on another process - parallel workers, sync replication), <code>Timeout<\/code>, <code>Client<\/code> (waiting for the application - <code>ClientRead<\/code> means the client is thinking, not the database), and <code>Extension<\/code>.<\/p><p>What each means when it dominates: <strong><code>Lock<\/code><\/strong> is application-level contention - two transactions want the same row or table, so the fix is in the transaction design (Q98, Q107), not in the hardware. <strong><code>IO<\/code><\/strong> means the working set does not fit in memory or storage is too slow - more RAM, better indexes, or faster disks. <strong><code>LWLock<\/code><\/strong> points at internal contention - <code>WALWrite<\/code> under a write-heavy load, <code>BufferMapping<\/code> with a too-small buffer pool, or <code>LockManager<\/code> with very high connection counts. <strong><code>BufferPin<\/code><\/strong> is rare and usually means vacuum waiting on a long-running scan. <strong><code>ClientRead<\/code><\/strong> dominating means the database is waiting for you - an idle-in-transaction problem or a chatty application, and it is a common false alarm in dashboards.<\/p><p>How to sample: PostgreSQL has no built-in history, so you <strong>poll <code>pg_stat_activity<\/code><\/strong> every second (or use <code>pg_wait_sampling<\/code>, or a managed service&#x27;s equivalent - RDS Performance Insights is exactly this) and aggregate the counts. The output is an &quot;active session history&quot; profile: at any moment, N sessions were waiting on X. That profile, plotted over time, tells you what the database was doing during an incident far more directly than any single metric, which is why Oracle and SQL Server DBAs have used wait analysis as the primary method for twenty years.<\/p>", "source": "answers.md", "search": "wait event analysis: the wait classes, what a lock wait versus an io wait versus a buffer pin means, and how you sample them. postgresql classifies what a backend is waiting on into classes: lwlock (internal lightweight locks - buffer mapping, wal insert), lock (heavyweight relation and row locks), bufferpin, io (data file reads and writes, wal writes), ipc (waiting on another process - parallel workers, sync replication), timeout, client (waiting for the application - clientread means the client is thinking, not the database), and extension. what each means when it dominates: lock is application-level contention - two transactions want the same row or table, so the fix is in the transaction design (q98, q107), not in the hardware. io means the working set does not fit in memory or storage is too slow - more ram, better indexes, or faster disks. lwlock points at internal contention - walwrite under a write-heavy load, buffermapping with a too-small buffer pool, or lockmanager with very high connection counts. bufferpin is rare and usually means vacuum waiting on a long-running scan. clientread dominating means the database is waiting for you - an idle-in-transaction problem or a chatty application, and it is a common false alarm in dashboards. how to sample: postgresql has no built-in history, so you poll pg_stat_activity every second (or use pg_wait_sampling, or a managed service's equivalent - rds performance insights is exactly this) and aggregate the counts. the output is an \"active session history\" profile: at any moment, n sessions were waiting on x. that profile, plotted over time, tells you what the database was doing during an incident far more directly than any single metric, which is why oracle and sql server dbas have used wait analysis as the primary method for twenty years."}, {"n": 260, "category": 15, "difficulty": "D", "html": "<code>pg_stat_activity<\/code>: the states, what <code>idle in transaction<\/code> costs, and the queries you keep saved for an incident.", "answerTitle": "`pg_stat_activity`", "answer": "<p>The states: <code>active<\/code> (executing), <code>idle<\/code> (connected, no transaction), <strong><code>idle in transaction<\/code><\/strong> (a transaction is open and nothing is running), <code>idle in transaction (aborted)<\/code>, <code>fastpath function call<\/code>, and <code>disabled<\/code>.<\/p><p><code>idle in transaction<\/code> costs a held snapshot (blocking vacuum globally, Q93), any locks already acquired (blocking DDL and other writers, Q100), and a connection slot. It is the single most damaging state in the view, and <code>idle in transaction (aborted)<\/code> is worse in one respect - the transaction is dead and still holding everything until someone rolls it back.<\/p><p>The queries I keep saved for an incident:<\/p><pre><code class=\"lang-sql\">-- what is running, longest first\nSELECT pid, state, now()-xact_start AS xact_age, now()-query_start AS query_age,\n       wait_event_type, wait_event, left(query, 120)\nFROM   pg_stat_activity\nWHERE  state &lt;&gt; &#x27;idle&#x27; ORDER BY xact_start;\n\n-- who is blocking whom\nSELECT blocked.pid AS blocked_pid, blocked.query AS blocked_query,\n       blocking.pid AS blocking_pid, blocking.query AS blocking_query,\n       now() - blocked.query_start AS blocked_for\nFROM   pg_stat_activity blocked\nJOIN   LATERAL unnest(pg_blocking_pids(blocked.pid)) AS b(pid) ON true\nJOIN   pg_stat_activity blocking ON blocking.pid = b.pid\nWHERE  cardinality(pg_blocking_pids(blocked.pid)) &gt; 0;\n\n-- the oldest transaction in the system (the vacuum horizon)\nSELECT pid, state, now()-xact_start AS age, left(query,80)\nFROM   pg_stat_activity WHERE xact_start IS NOT NULL ORDER BY xact_start LIMIT 5;<\/code><\/pre><p>plus <code>pg_cancel_backend(pid)<\/code> (cancel the statement) and <code>pg_terminate_backend(pid)<\/code> (kill the session) - and the discipline to record what you killed before you kill it.<\/p>", "source": "answers.md", "search": "pg_stat_activity: the states, what idle in transaction costs, and the queries you keep saved for an incident. the states: active (executing), idle (connected, no transaction), idle in transaction (a transaction is open and nothing is running), idle in transaction (aborted), fastpath function call, and disabled. idle in transaction costs a held snapshot (blocking vacuum globally, q93), any locks already acquired (blocking ddl and other writers, q100), and a connection slot. it is the single most damaging state in the view, and idle in transaction (aborted) is worse in one respect - the transaction is dead and still holding everything until someone rolls it back. the queries i keep saved for an incident: sql -- what is running, longest first select pid, state, now()-xact_start as xact_age, now()-query_start as query_age, wait_event_type, wait_event, left(query, 120) from pg_stat_activity where state < 'idle' order by xact_start; -- who is blocking whom select blocked.pid as blocked_pid, blocked.query as blocked_query, blocking.pid as blocking_pid, blocking.query as blocking_query, now() - blocked.query_start as blocked_for from pg_stat_activity blocked join lateral unnest(pg_blocking_pids(blocked.pid)) as b(pid) on true join pg_stat_activity blocking on blocking.pid = b.pid where cardinality(pg_blocking_pids(blocked.pid)) 0; -- the oldest transaction in the system (the vacuum horizon) select pid, state, now()-xact_start as age, left(query,80) from pg_stat_activity where xact_start is not null order by xact_start limit 5; plus pg_cancel_backend(pid) (cancel the statement) and pg_terminate_backend(pid) (kill the session) - and the discipline to record what you killed before you kill it."}, {"n": 261, "category": 15, "difficulty": "D", "html": "The dashboard you would build for a production PostgreSQL: name ten metrics and the alert threshold for each.", "answerTitle": "Ten metrics and their thresholds", "answer": "<table><thead><tr><th>Metric<\/th><th>Alert when<\/th><\/tr><\/thead><tbody><tr><td>Connection utilization (<code>numbackends / max_connections<\/code>)<\/td><td>&gt; 80 percent sustained - the pool is misconfigured or leaking<\/td><\/tr><tr><td>Longest transaction age<\/td><td>&gt; 5 minutes on OLTP - protects vacuum and DDL (Q93)<\/td><\/tr><tr><td>Longest lock wait / count of blocked sessions<\/td><td>any session blocked &gt; 30 s<\/td><\/tr><tr><td>Replication lag (seconds, per replica)<\/td><td>&gt; 30 s warning, &gt; 5 min page - and any replica missing entirely<\/td><\/tr><tr><td>Replication slot retained WAL<\/td><td>&gt; 10 GB, or slot inactive &gt; 15 minutes (Q148)<\/td><\/tr><tr><td><code>age(relfrozenxid)<\/code> max across tables<\/td><td>&gt; 500 million - well before wraparound warnings (Q94)<\/td><\/tr><tr><td>Dead tuple ratio on the top tables, and time since last autovacuum<\/td><td>dead ratio &gt; 20 percent, or no autovacuum in 24 h on a churning table<\/td><\/tr><tr><td>Disk usage - data, WAL, and temp separately<\/td><td>&gt; 75 percent warning, &gt; 85 percent page; WAL growth is the early signal for a stuck slot<\/td><\/tr><tr><td>Cache hit ratio and IO wait<\/td><td>hit ratio dropping <em>trend<\/em>, rather than an absolute threshold<\/td><\/tr><tr><td>Query latency p95/p99 by statement class, plus error rate (deadlocks, serialization failures, timeouts)<\/td><td>any step change versus the previous week<\/td><\/tr><\/tbody><\/table><p>Two comments I would add. First, <strong>thresholds are less useful than change detection<\/strong> for most of these - a cache hit ratio of 92 percent may be perfectly healthy, while a drop from 99 to 96 is an incident starting. Second, the top three (connections, transaction age, blocked sessions) catch the overwhelming majority of real incidents, so if the team can only maintain three alerts, those are the three.<\/p>", "source": "answers.md", "search": "the dashboard you would build for a production postgresql: name ten metrics and the alert threshold for each. metric alert when --- --- connection utilization (numbackends / max_connections) 80 percent sustained - the pool is misconfigured or leaking longest transaction age 5 minutes on oltp - protects vacuum and ddl (q93) longest lock wait / count of blocked sessions any session blocked 30 s replication lag (seconds, per replica) 30 s warning, 5 min page - and any replica missing entirely replication slot retained wal 10 gb, or slot inactive 15 minutes (q148) age(relfrozenxid) max across tables 500 million - well before wraparound warnings (q94) dead tuple ratio on the top tables, and time since last autovacuum dead ratio 20 percent, or no autovacuum in 24 h on a churning table disk usage - data, wal, and temp separately 75 percent warning, 85 percent page; wal growth is the early signal for a stuck slot cache hit ratio and io wait hit ratio dropping trend , rather than an absolute threshold query latency p95/p99 by statement class, plus error rate (deadlocks, serialization failures, timeouts) any step change versus the previous week two comments i would add. first, thresholds are less useful than change detection for most of these - a cache hit ratio of 92 percent may be perfectly healthy, while a drop from 99 to 96 is an incident starting. second, the top three (connections, transaction age, blocked sessions) catch the overwhelming majority of real incidents, so if the team can only maintain three alerts, those are the three."}, {"n": 262, "category": 15, "difficulty": "T", "html": "Mean query time is flat and users are complaining. What are you missing, and what do you measure instead?", "answerTitle": "Mean is flat, users are complaining", "answer": "<p>The mean hides the distribution. What you are missing:<\/p><ol><li><strong>The tail.<\/strong> p99 and p99.9 can rise by an order of magnitude while the mean moves a few percent, because the mean is dominated by the millions of fast queries. Users experience the tail - and a page making 20 database calls experiences the p99 with roughly 18 percent probability, so the <em>page&#x27;s<\/em> p50 is close to the <em>query&#x27;s<\/em> p99.<\/li><li><strong>Aggregation across dissimilar things.<\/strong> One mean across all queries, all tenants and all endpoints averages a health check with a report. Break it down by statement class, endpoint and tenant; a single large customer having a terrible experience is invisible in the global mean.<\/li><li><strong>Averaging over the wrong window.<\/strong> A five-minute mean smooths away a 20-second stall that timed out every request in flight. Look at maxima and at the per-second view.<\/li><li><strong>Errors, not latency.<\/strong> Timeouts, deadlocks and serialization failures <strong>complete quickly<\/strong> - a query that fails after 100 ms <em>improves<\/em> your mean while breaking the user. Always plot error rate next to latency.<\/li><li><strong>Queueing outside the database.<\/strong> The database&#x27;s own view starts when it receives the query; time spent waiting for a connection (Q236) is invisible to it entirely.<\/li><\/ol><p>What I measure instead: <strong>percentiles by endpoint and by tenant<\/strong> (p50, p95, p99, max), <strong>error rate by class<\/strong>, <strong>the end-to-end latency from the application&#x27;s perspective<\/strong> including connection acquisition, and <strong>saturation signals<\/strong> (active sessions, lock waits) which lead latency rather than following it. And for the specific question &quot;who is unhappy&quot;, nothing beats a per-tenant p99 table sorted descending.<\/p>", "source": "answers.md", "search": "mean query time is flat and users are complaining. what are you missing, and what do you measure instead? the mean hides the distribution. what you are missing: 1. the tail. p99 and p99.9 can rise by an order of magnitude while the mean moves a few percent, because the mean is dominated by the millions of fast queries. users experience the tail - and a page making 20 database calls experiences the p99 with roughly 18 percent probability, so the page's p50 is close to the query's p99. 2. aggregation across dissimilar things. one mean across all queries, all tenants and all endpoints averages a health check with a report. break it down by statement class, endpoint and tenant; a single large customer having a terrible experience is invisible in the global mean. 3. averaging over the wrong window. a five-minute mean smooths away a 20-second stall that timed out every request in flight. look at maxima and at the per-second view. 4. errors, not latency. timeouts, deadlocks and serialization failures complete quickly - a query that fails after 100 ms improves your mean while breaking the user. always plot error rate next to latency. 5. queueing outside the database. the database's own view starts when it receives the query; time spent waiting for a connection (q236) is invisible to it entirely. what i measure instead: percentiles by endpoint and by tenant (p50, p95, p99, max), error rate by class , the end-to-end latency from the application's perspective including connection acquisition, and saturation signals (active sessions, lock waits) which lead latency rather than following it. and for the specific question \"who is unhappy\", nothing beats a per-tenant p99 table sorted descending."}, {"n": 263, "category": 15, "difficulty": "D", "html": "Cache hit ratio, checkpoint frequency, dead tuple counts, transaction age, replication lag - which of these are leading indicators and which are lagging?", "answerTitle": "Leading and lagging indicators", "answer": "<p><strong>Leading<\/strong> - these change before users notice, and are what you alert on:<\/p><ul><li><strong>Longest transaction age<\/strong> and count of <code>idle in transaction<\/code> - predicts bloat, blocked DDL and vacuum stalls hours in advance.<\/li><li><strong>Dead tuple counts and time since last autovacuum<\/strong> - predicts the slow-motion degradation of table scans.<\/li><li><strong>Transaction age (<code>relfrozenxid<\/code>)<\/strong> - predicts wraparound weeks in advance, and there is no faster remediation, so early warning is everything.<\/li><li><strong>Replication slot retained WAL<\/strong> and <strong>disk free trend<\/strong> - predicts a hard outage with a computable time-to-impact.<\/li><li><strong>Connection utilization<\/strong> and <strong>lock wait counts<\/strong> - predict pool exhaustion.<\/li><\/ul><p><strong>Lagging<\/strong> - these tell you something already went wrong:<\/p><ul><li><strong>Cache hit ratio<\/strong> - it falls <em>because<\/em> the working set grew or bloat spread the data out; by the time it moves, latency has already moved.<\/li><li><strong>Replication lag<\/strong> - by the time it is seconds, stale reads are already being served.<\/li><li><strong>Checkpoint frequency<\/strong> - a symptom of write volume that has already changed.<\/li><li><strong>Query latency itself.<\/strong><\/li><\/ul><p>The distinction matters for how you use them: leading indicators get <strong>thresholds and pages<\/strong>, because you can act before impact; lagging indicators get <strong>dashboards and trend review<\/strong>, because paging on them means you are always responding to something that already hurt someone. The classic mistake is a monitoring setup made entirely of lagging indicators, which produces alerts that are simultaneously too late and too noisy.<\/p>", "source": "answers.md", "search": "cache hit ratio, checkpoint frequency, dead tuple counts, transaction age, replication lag - which of these are leading indicators and which are lagging? leading - these change before users notice, and are what you alert on: - longest transaction age and count of idle in transaction - predicts bloat, blocked ddl and vacuum stalls hours in advance. - dead tuple counts and time since last autovacuum - predicts the slow-motion degradation of table scans. - transaction age (relfrozenxid) - predicts wraparound weeks in advance, and there is no faster remediation, so early warning is everything. - replication slot retained wal and disk free trend - predicts a hard outage with a computable time-to-impact. - connection utilization and lock wait counts - predict pool exhaustion. lagging - these tell you something already went wrong: - cache hit ratio - it falls because the working set grew or bloat spread the data out; by the time it moves, latency has already moved. - replication lag - by the time it is seconds, stale reads are already being served. - checkpoint frequency - a symptom of write volume that has already changed. - query latency itself. the distinction matters for how you use them: leading indicators get thresholds and pages , because you can act before impact; lagging indicators get dashboards and trend review , because paging on them means you are always responding to something that already hurt someone. the classic mistake is a monitoring setup made entirely of lagging indicators, which produces alerts that are simultaneously too late and too noisy."}, {"n": 264, "category": 15, "difficulty": "D", "html": "Capacity planning: how do you forecast storage, IOPS and connections a year out, and what growth pattern breaks the forecast?", "answerTitle": "Capacity planning", "answer": "<p>The method: take 12-18 months of history for each dimension, fit the growth, and project with an explicit confidence band - then plan the <em>action<\/em> trigger, not the failure point.<\/p><ul><li><strong>Storage<\/strong>: table and index sizes from <code>pg_total_relation_size<\/code> sampled weekly, decomposed into growth from new rows versus growth from bloat (they need different responses). Project to the point where you hit 70 percent, and note that WAL and backup storage grow with <em>write<\/em> volume, not data volume, so they need their own curve.<\/li><li><strong>IOPS and throughput<\/strong>: from the storage layer&#x27;s metrics, correlated with transaction rate. The useful derived number is <strong>IO per transaction<\/strong>, because it stays roughly constant while volume grows - so a forecast of transactions gives a forecast of IOPS, and a change in IO per transaction is a signal that the working set has stopped fitting in memory.<\/li><li><strong>Connections<\/strong>: driven by the number of application instances times pool size, so it is a <em>deployment<\/em> forecast, not a traffic forecast (Q235). It steps rather than curving.<\/li><li><strong>CPU<\/strong>: transactions per second times CPU per transaction, again with the second factor tracked as its own trend.<\/li><\/ul><p><strong>What breaks the forecast<\/strong>: any non-linearity. The working set exceeding RAM (a cliff, not a slope - IO jumps by an order of magnitude in days); a new feature or a new large customer changing the mix; a retention policy nobody implemented, so growth is unbounded by design; <strong>bloat<\/strong>, which makes storage grow faster than data; and business events - a launch, a migration of another system onto this one, a seasonal peak. Linear extrapolation of a queue-driven metric is also wrong in principle: latency follows a hockey stick as utilization approaches 1, so &quot;we are at 60 percent CPU, we have room for 60 percent more traffic&quot; is false.<\/p><p>So I forecast the resource, but I plan against the <strong>utilization at which behavior changes<\/strong>, and I re-forecast quarterly rather than treating it as an annual artefact.<\/p>", "source": "answers.md", "search": "capacity planning: how do you forecast storage, iops and connections a year out, and what growth pattern breaks the forecast? the method: take 12-18 months of history for each dimension, fit the growth, and project with an explicit confidence band - then plan the action trigger, not the failure point. - storage : table and index sizes from pg_total_relation_size sampled weekly, decomposed into growth from new rows versus growth from bloat (they need different responses). project to the point where you hit 70 percent, and note that wal and backup storage grow with write volume, not data volume, so they need their own curve. - iops and throughput : from the storage layer's metrics, correlated with transaction rate. the useful derived number is io per transaction , because it stays roughly constant while volume grows - so a forecast of transactions gives a forecast of iops, and a change in io per transaction is a signal that the working set has stopped fitting in memory. - connections : driven by the number of application instances times pool size, so it is a deployment forecast, not a traffic forecast (q235). it steps rather than curving. - cpu : transactions per second times cpu per transaction, again with the second factor tracked as its own trend. what breaks the forecast : any non-linearity. the working set exceeding ram (a cliff, not a slope - io jumps by an order of magnitude in days); a new feature or a new large customer changing the mix; a retention policy nobody implemented, so growth is unbounded by design; bloat , which makes storage grow faster than data; and business events - a launch, a migration of another system onto this one, a seasonal peak. linear extrapolation of a queue-driven metric is also wrong in principle: latency follows a hockey stick as utilization approaches 1, so \"we are at 60 percent cpu, we have room for 60 percent more traffic\" is false. so i forecast the resource, but i plan against the utilization at which behavior changes , and i re-forecast quarterly rather than treating it as an annual artefact."}, {"n": 265, "category": 15, "difficulty": "D", "html": "Load testing a database realistically: data volume, cardinality, cache state and concurrency. What do most load tests get wrong?", "answerTitle": "Load testing a database realistically", "answer": "<p>What most load tests get wrong, in order of impact:<\/p><ol><li><strong>Data volume and cardinality.<\/strong> A test database with 100,000 rows has every index in cache and every plan trivially fast. You must test at production scale, or at least at a scale where the working set exceeds RAM, because that is where the behavior changes.<\/li><li><strong>Distribution, not just volume.<\/strong> Generated data is uniform; real data is Zipfian. One customer with 40 percent of the orders, one product in half the carts, a status column that is 99 percent &#x27;COMPLETE&#x27;. Uniform data produces good plans and no hot rows, so the test misses both the bad plan (Q66) and the lock contention (Q107).<\/li><li><strong>Cache state.<\/strong> Running the same 50 queries repeatedly warms everything into <code>shared_buffers<\/code> and reports latencies you will never see. The test must have a realistic key distribution and a realistic miss rate, and should include a <strong>cold-start<\/strong> scenario (Q178).<\/li><li><strong>Concurrency shape.<\/strong> Testing with 10 threads when production has 500 misses lock contention, connection queueing and the throughput knee entirely (Q235). And a constant rate misses the burst behavior that actually breaks things - use open-model load generation (fixed arrival rate) rather than closed-model (fixed thread count), because the closed model self-throttles and hides the failure.<\/li><li><strong>Write mix and its aftermath.<\/strong> Read-only tests are common because they are easy, and they miss vacuum, bloat, WAL volume, replication lag and checkpoint spikes. A realistic test must run <strong>long enough for autovacuum to matter<\/strong> - hours, not minutes.<\/li><li><strong>The surrounding system<\/strong>: the connection pooler, the replica routing, the backup job that runs at 2 a.m., the batch job that competes for IO.<\/li><\/ol><p>My checklist: a restored copy of production (anonymized, Q273), production-shaped key distributions, an open-model generator at the real read/write mix, a several-hour duration, and measurement of percentiles plus the database&#x27;s own saturation signals - not just throughput.<\/p>", "source": "answers.md", "search": "load testing a database realistically: data volume, cardinality, cache state and concurrency. what do most load tests get wrong? what most load tests get wrong, in order of impact: 1. data volume and cardinality. a test database with 100,000 rows has every index in cache and every plan trivially fast. you must test at production scale, or at least at a scale where the working set exceeds ram, because that is where the behavior changes. 2. distribution, not just volume. generated data is uniform; real data is zipfian. one customer with 40 percent of the orders, one product in half the carts, a status column that is 99 percent 'complete'. uniform data produces good plans and no hot rows, so the test misses both the bad plan (q66) and the lock contention (q107). 3. cache state. running the same 50 queries repeatedly warms everything into shared_buffers and reports latencies you will never see. the test must have a realistic key distribution and a realistic miss rate, and should include a cold-start scenario (q178). 4. concurrency shape. testing with 10 threads when production has 500 misses lock contention, connection queueing and the throughput knee entirely (q235). and a constant rate misses the burst behavior that actually breaks things - use open-model load generation (fixed arrival rate) rather than closed-model (fixed thread count), because the closed model self-throttles and hides the failure. 5. write mix and its aftermath. read-only tests are common because they are easy, and they miss vacuum, bloat, wal volume, replication lag and checkpoint spikes. a realistic test must run long enough for autovacuum to matter - hours, not minutes. 6. the surrounding system : the connection pooler, the replica routing, the backup job that runs at 2 a.m., the batch job that competes for io. my checklist: a restored copy of production (anonymized, q273), production-shaped key distributions, an open-model generator at the real read/write mix, a several-hour duration, and measurement of percentiles plus the database's own saturation signals - not just throughput."}, {"n": 266, "category": 15, "difficulty": "A", "html": "Set the SLOs for a shared database platform used by 30 services, and say how you enforce them without becoming a bottleneck.", "answerTitle": "SLOs for a shared database platform", "answer": "<p><strong>What I would set SLOs on<\/strong>, from the consumer&#x27;s point of view rather than the platform&#x27;s:<\/p><ul><li><strong>Availability<\/strong>: successful connection and query execution, measured by a synthetic probe per database plus the real error rate. 99.95 percent monthly is a reasonable starting point for a single-region managed platform, and I would state explicitly what a planned failover counts as.<\/li><li><strong>Latency<\/strong>: p99 of a <em>representative<\/em> trivial query (a primary-key lookup) - this measures the platform&#x27;s health rather than the tenants&#x27; query quality, which is the crucial distinction. I would <strong>not<\/strong> SLO the latency of arbitrary tenant queries, because I do not control them.<\/li><li><strong>Durability and recoverability<\/strong>: RPO and RTO as explicit commitments, verified by a monthly restore drill whose measured time is published (Q153).<\/li><li><strong>Change safety<\/strong>: percentage of schema migrations completing without a lock-wait incident.<\/li><\/ul><p><strong>How I keep it from becoming a bottleneck<\/strong> - the platform enforces <em>guardrails<\/em>, not approvals:<\/p><ol><li><strong>Quotas per service<\/strong>: connection limits per role, <code>statement_timeout<\/code>, <code>idle_in_transaction_session_timeout<\/code>, and a storage quota with alerting. These are the contract; within them a team can do what it likes.<\/li><li><strong>Self-service with automated gates<\/strong>: migration linting (Q256), an automated performance report on merge, and a dashboard per service showing its own top queries by total time. Teams get the data to fix their own problems without asking anyone.<\/li><li><strong>A clear split of responsibility, written down<\/strong>: the platform owns availability, backups, patching, capacity and the guardrails; the <em>service team<\/em> owns its schema, its queries, its indexes and its query latency. Most disputes are about this line, so it must be explicit - including that a service exceeding its quota is throttled rather than allowed to consume the shared budget.<\/li><li><strong>An error budget with teeth<\/strong>: when the platform&#x27;s budget is spent, the platform team stops feature work; when a <em>tenant<\/em> consistently causes incidents, they get the choice of remediation or their own instance. That escalation path is what makes a shared platform sustainable, because the alternative - the platform team absorbing everyone&#x27;s bad queries - does not scale past about five teams.<\/li><li><strong>Noisy-neighbor isolation<\/strong> where the technology allows it: separate instances per tier, resource groups, or at minimum per-role connection caps, so one team&#x27;s incident is not thirty teams&#x27; incident.<\/li><\/ol><p><em>Hook: an SLO you set for a shared platform, and the first time you had to enforce the error budget.<\/em><\/p>", "source": "answers.md", "search": "set the slos for a shared database platform used by 30 services, and say how you enforce them without becoming a bottleneck. what i would set slos on , from the consumer's point of view rather than the platform's: - availability : successful connection and query execution, measured by a synthetic probe per database plus the real error rate. 99.95 percent monthly is a reasonable starting point for a single-region managed platform, and i would state explicitly what a planned failover counts as. - latency : p99 of a representative trivial query (a primary-key lookup) - this measures the platform's health rather than the tenants' query quality, which is the crucial distinction. i would not slo the latency of arbitrary tenant queries, because i do not control them. - durability and recoverability : rpo and rto as explicit commitments, verified by a monthly restore drill whose measured time is published (q153). - change safety : percentage of schema migrations completing without a lock-wait incident. how i keep it from becoming a bottleneck - the platform enforces guardrails , not approvals: 1. quotas per service : connection limits per role, statement_timeout, idle_in_transaction_session_timeout, and a storage quota with alerting. these are the contract; within them a team can do what it likes. 2. self-service with automated gates : migration linting (q256), an automated performance report on merge, and a dashboard per service showing its own top queries by total time. teams get the data to fix their own problems without asking anyone. 3. a clear split of responsibility, written down : the platform owns availability, backups, patching, capacity and the guardrails; the service team owns its schema, its queries, its indexes and its query latency. most disputes are about this line, so it must be explicit - including that a service exceeding its quota is throttled rather than allowed to consume the shared budget. 4. an error budget with teeth : when the platform's budget is spent, the platform team stops feature work; when a tenant consistently causes incidents, they get the choice of remediation or their own instance. that escalation path is what makes a shared platform sustainable, because the alternative - the platform team absorbing everyone's bad queries - does not scale past about five teams. 5. noisy-neighbor isolation where the technology allows it: separate instances per tier, resource groups, or at minimum per-role connection caps, so one team's incident is not thirty teams' incident. hook: an slo you set for a shared platform, and the first time you had to enforce the error budget."}, {"n": 267, "category": 16, "difficulty": "C", "html": "Least privilege for a database: the roles you create, what the application user must not have, and how migrations get their privileges.", "answerTitle": "Least privilege", "answer": "<p>The roles I create, and what each may do:<\/p><ul><li><strong>Owner / migration role<\/strong> - owns the schema objects and holds DDL rights. Used only by the migration job in CI/CD (Q251), never by the running application.<\/li><li><strong>Application role<\/strong> - <code>SELECT<\/code>, <code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code> on the specific tables it needs, <code>USAGE<\/code> on sequences, <code>EXECUTE<\/code> on the functions it calls. <strong>No DDL<\/strong>, no <code>TRUNCATE<\/code>, no superuser, not the owner of anything.<\/li><li><strong>Read-only role<\/strong> - <code>SELECT<\/code> only, for reporting, dashboards and the read path where you want the guarantee rather than the hint (Q231).<\/li><li><strong>Human roles<\/strong> - individual accounts (or federated logins via IAM authentication) with read-only by default and a separate, audited break-glass role for write access.<\/li><\/ul><p>The mechanics that make it hold: <code>REVOKE ALL ON SCHEMA public FROM PUBLIC<\/code> and <code>REVOKE CREATE ON SCHEMA public FROM PUBLIC<\/code> (PostgreSQL 15 fixed the default, older versions let any user create objects); <code>ALTER DEFAULT PRIVILEGES FOR ROLE owner IN SCHEMA app GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_role<\/code> so new tables created by a migration are automatically usable without a manual grant - which is the step teams forget, leading to &quot;the migration worked and the app 500s&quot;; grants issued to <strong>group roles<\/strong> and users granted membership, so access is managed by role rather than by user; and rotation, ideally by using IAM/AD authentication so there is no long-lived password at all.<\/p><p>The reason the application must not have DDL: it turns an SQL injection or a compromised pod into a <code>DROP TABLE<\/code>, and it means a runaway ORM setting (<code>hibernate.hbm2ddl.auto<\/code>) can rewrite production. Both have happened to people I know.<\/p>", "source": "answers.md", "search": "least privilege for a database: the roles you create, what the application user must not have, and how migrations get their privileges. the roles i create, and what each may do: - owner / migration role - owns the schema objects and holds ddl rights. used only by the migration job in ci/cd (q251), never by the running application. - application role - select, insert, update, delete on the specific tables it needs, usage on sequences, execute on the functions it calls. no ddl , no truncate, no superuser, not the owner of anything. - read-only role - select only, for reporting, dashboards and the read path where you want the guarantee rather than the hint (q231). - human roles - individual accounts (or federated logins via iam authentication) with read-only by default and a separate, audited break-glass role for write access. the mechanics that make it hold: revoke all on schema public from public and revoke create on schema public from public (postgresql 15 fixed the default, older versions let any user create objects); alter default privileges for role owner in schema app grant select, insert, update, delete on tables to app_role so new tables created by a migration are automatically usable without a manual grant - which is the step teams forget, leading to \"the migration worked and the app 500s\"; grants issued to group roles and users granted membership, so access is managed by role rather than by user; and rotation, ideally by using iam/ad authentication so there is no long-lived password at all. the reason the application must not have ddl: it turns an sql injection or a compromised pod into a drop table, and it means a runaway orm setting (hibernate.hbm2ddl.auto) can rewrite production. both have happened to people i know."}, {"n": 268, "category": 16, "difficulty": "D", "html": "SQL injection beyond string concatenation: dynamic ORDER BY, <code>LIKE<\/code> patterns, IN-lists, JPQL and native queries. Give the safe pattern for each.", "answerTitle": "SQL injection beyond concatenation", "answer": "<p>Parameters cannot be used for <strong>identifiers<\/strong> or <strong>syntax<\/strong>, which is where injection survives in an ORM codebase:<\/p><ul><li><strong>Dynamic <code>ORDER BY<\/code> / column names<\/strong>: <code>ORDER BY ?<\/code> is not a thing. The safe pattern is an <strong>allow-list map<\/strong> from an API-facing token to a validated column name and direction, never string interpolation of user input - even &quot;sanitized&quot; input.<\/li><li><strong>Dynamic table or schema names<\/strong> (multi-tenant <code>search_path<\/code> switching): same allow-list rule, plus <code>quote_ident()<\/code> for anything genuinely dynamic.<\/li><li><strong><code>LIKE<\/code> patterns<\/strong>: the parameter is safe from injection, but <code>%<\/code> and <code>_<\/code> supplied by the user change the query&#x27;s meaning and can produce a full scan - escape them (<code>ESCAPE &#x27;\\&#x27;<\/code>) and consider length limits.<\/li><li><strong>IN-lists<\/strong>: building <code>IN (1,2,3)<\/code> by string concatenation is the classic. Use an array parameter - <code>WHERE id = ANY(?)<\/code> with a JDBC array - which is also better for plan caching.<\/li><li><strong>JPQL/HQL<\/strong>: <code>entityManager.createQuery(&quot;... WHERE name = &#x27;&quot; + name + &quot;&#x27;&quot;)<\/code> is injectable exactly like SQL, and HQL injection can reach beyond the intended entity. Always <code>setParameter<\/code>.<\/li><li><strong>Native queries and <code>@Query(nativeQuery = true)<\/code><\/strong>: same rules; Spring&#x27;s SpEL in <code>@Query<\/code> is another injection surface if user input reaches it.<\/li><li><strong>JSON path expressions<\/strong> and full-text <code>to_tsquery<\/code> input, which have their own syntax that user input can break out of - use <code>plainto_tsquery<\/code>/<code>websearch_to_tsquery<\/code> rather than <code>to_tsquery<\/code>.<\/li><\/ul><p>The defenses that catch what review misses: a static analysis rule banning string concatenation in query construction, a code-review checklist item for any dynamic SQL, the least-privileged role from Q267 so injection cannot escalate, and RLS (Q269) so it cannot cross tenants.<\/p>", "source": "answers.md", "search": "sql injection beyond string concatenation: dynamic order by, like patterns, in-lists, jpql and native queries. give the safe pattern for each. parameters cannot be used for identifiers or syntax , which is where injection survives in an orm codebase: - dynamic order by / column names : order by ? is not a thing. the safe pattern is an allow-list map from an api-facing token to a validated column name and direction, never string interpolation of user input - even \"sanitized\" input. - dynamic table or schema names (multi-tenant search_path switching): same allow-list rule, plus quote_ident() for anything genuinely dynamic. - like patterns : the parameter is safe from injection, but % and _ supplied by the user change the query's meaning and can produce a full scan - escape them (escape '\\') and consider length limits. - in-lists : building in (1,2,3) by string concatenation is the classic. use an array parameter - where id = any(?) with a jdbc array - which is also better for plan caching. - jpql/hql : entitymanager.createquery(\"... where name = '\" + name + \"'\") is injectable exactly like sql, and hql injection can reach beyond the intended entity. always setparameter. - native queries and @query(nativequery = true) : same rules; spring's spel in @query is another injection surface if user input reaches it. - json path expressions and full-text to_tsquery input, which have their own syntax that user input can break out of - use plainto_tsquery/websearch_to_tsquery rather than to_tsquery. the defenses that catch what review misses: a static analysis rule banning string concatenation in query construction, a code-review checklist item for any dynamic sql, the least-privileged role from q267 so injection cannot escalate, and rls (q269) so it cannot cross tenants."}, {"n": 269, "category": 16, "difficulty": "D", "html": "PostgreSQL row-level security: how policies are evaluated, the <code>BYPASSRLS<\/code> risk, and the performance implication.", "answerTitle": "Row-level security", "answer": "<p>RLS attaches <strong>policies<\/strong> to a table; once <code>ALTER TABLE t ENABLE ROW LEVEL SECURITY<\/code> is set, every query by a non-exempt role has the policy&#x27;s <code>USING<\/code> expression ANDed into its <code>WHERE<\/code> clause (for reads and for the rows visible to updates and deletes) and the <code>WITH CHECK<\/code> expression applied to rows being written. The typical multi-tenant policy reads a session variable:<\/p><pre><code class=\"lang-sql\">CREATE POLICY tenant_isolation ON orders\n  USING (tenant_id = current_setting(&#x27;app.tenant_id&#x27;)::uuid)\n  WITH CHECK (tenant_id = current_setting(&#x27;app.tenant_id&#x27;)::uuid);<\/code><\/pre><p>with the application executing <code>SET LOCAL app.tenant_id = ...<\/code> at the start of each transaction (<code>SET LOCAL<\/code>, so it cannot leak through a pooled connection - Q240).<\/p><p><strong>The <code>BYPASSRLS<\/code> risk<\/strong>: the table <strong>owner<\/strong> bypasses RLS by default unless you set <code>FORCE ROW LEVEL SECURITY<\/code>, and any role with the <code>BYPASSRLS<\/code> attribute (including superusers) ignores policies entirely. So an application connecting as the schema owner gets <em>no protection at all<\/em> while appearing to be protected - which is the single most common RLS misconfiguration, and an argument for the role separation in Q267.<\/p><p><strong>Performance<\/strong>: the policy expression is a predicate on every query, so the tenant column must be indexed and should be the <strong>leading column<\/strong> of the relevant indexes (Q44). A policy containing a subquery or a function call is evaluated per row unless the planner can hoist it, so keep policies simple and mark helper functions <code>STABLE<\/code>. Policies also constrain the planner - a predicate it cannot push down can turn an index scan into a filter - so measure the important queries with RLS enabled rather than assuming it is free.<\/p>", "source": "answers.md", "search": "postgresql row-level security: how policies are evaluated, the bypassrls risk, and the performance implication. rls attaches policies to a table; once alter table t enable row level security is set, every query by a non-exempt role has the policy's using expression anded into its where clause (for reads and for the rows visible to updates and deletes) and the with check expression applied to rows being written. the typical multi-tenant policy reads a session variable: sql create policy tenant_isolation on orders using (tenant_id = current_setting('app.tenant_id')::uuid) with check (tenant_id = current_setting('app.tenant_id')::uuid); with the application executing set local app.tenant_id = ... at the start of each transaction (set local, so it cannot leak through a pooled connection - q240). the bypassrls risk : the table owner bypasses rls by default unless you set force row level security, and any role with the bypassrls attribute (including superusers) ignores policies entirely. so an application connecting as the schema owner gets no protection at all while appearing to be protected - which is the single most common rls misconfiguration, and an argument for the role separation in q267. performance : the policy expression is a predicate on every query, so the tenant column must be indexed and should be the leading column of the relevant indexes (q44). a policy containing a subquery or a function call is evaluated per row unless the planner can hoist it, so keep policies simple and mark helper functions stable. policies also constrain the planner - a predicate it cannot push down can turn an index scan into a filter - so measure the important queries with rls enabled rather than assuming it is free."}, {"n": 270, "category": 16, "difficulty": "T", "html": "Multi-tenant isolation enforced only by <code>WHERE tenant_id = ?<\/code> in application code. Give three realistic ways that fails and the defense in depth.", "answerTitle": "`WHERE tenant_id = ?` in application code", "answer": "<p>Three realistic failures:<\/p><ol><li><strong>One query forgets it.<\/strong> A new endpoint, a background job, a report, a data-fix script, an admin screen, a <code>JOIN<\/code> that filters the parent but not the child. It only takes one, and the failure is silent - the query returns <em>more<\/em> rows, not an error - so it surfaces as a customer seeing another customer&#x27;s data.<\/li><li><strong>The tenant identifier is derived from something the caller controls.<\/strong> A <code>tenantId<\/code> taken from a request parameter, a JWT claim that is not validated against the authenticated principal, or a header trusted from an internal caller. The query is perfectly written and filters by the <em>attacker&#x27;s<\/em> chosen tenant.<\/li><li><strong>A path that bypasses the application&#x27;s query layer entirely<\/strong>: a native query, an ORM <code>findAll()<\/code>, a raw JDBC report, a CDC pipeline feeding a shared search index with no tenant filter at query time, a cache key that omits the tenant (so tenant B gets tenant A&#x27;s cached response), or a database restore/export used for debugging.<\/li><\/ol><p>Defense in depth, in layers:<\/p><ul><li><strong>Database-enforced RLS<\/strong> (Q269) with <code>FORCE ROW LEVEL SECURITY<\/code> and a non-owner application role, so a forgotten predicate returns zero rows rather than everyone&#x27;s rows. This is the layer that actually saves you.<\/li><li><strong>The tenant established once, at the authentication boundary<\/strong>, from the verified principal, and propagated implicitly (a request-scoped context, plus <code>SET LOCAL<\/code>) so no query author can choose it.<\/li><li><strong>A repository base layer<\/strong> that adds the predicate automatically (Hibernate <code>@Filter<\/code>, a Spring Data specification), so the common path cannot forget.<\/li><li><strong>Tenant in every cache key, every index&#x27;s leading column, every search document, and every message key.<\/strong><\/li><li><strong>Tests that assert isolation<\/strong>: an automated test that authenticates as tenant A and attempts every endpoint against tenant B&#x27;s identifiers, and a lint that flags any repository method without a tenant predicate.<\/li><\/ul><p>The framing to state: application-level filtering is a <em>correctness<\/em> mechanism, and cross-tenant leakage is a <em>security<\/em> event - so it needs a control that fails closed, which only the database can provide.<\/p>", "source": "answers.md", "search": "multi-tenant isolation enforced only by where tenant_id = ? in application code. give three realistic ways that fails and the defense in depth. three realistic failures: 1. one query forgets it. a new endpoint, a background job, a report, a data-fix script, an admin screen, a join that filters the parent but not the child. it only takes one, and the failure is silent - the query returns more rows, not an error - so it surfaces as a customer seeing another customer's data. 2. the tenant identifier is derived from something the caller controls. a tenantid taken from a request parameter, a jwt claim that is not validated against the authenticated principal, or a header trusted from an internal caller. the query is perfectly written and filters by the attacker's chosen tenant. 3. a path that bypasses the application's query layer entirely : a native query, an orm findall(), a raw jdbc report, a cdc pipeline feeding a shared search index with no tenant filter at query time, a cache key that omits the tenant (so tenant b gets tenant a's cached response), or a database restore/export used for debugging. defense in depth, in layers: - database-enforced rls (q269) with force row level security and a non-owner application role, so a forgotten predicate returns zero rows rather than everyone's rows. this is the layer that actually saves you. - the tenant established once, at the authentication boundary , from the verified principal, and propagated implicitly (a request-scoped context, plus set local) so no query author can choose it. - a repository base layer that adds the predicate automatically (hibernate @filter, a spring data specification), so the common path cannot forget. - tenant in every cache key, every index's leading column, every search document, and every message key. - tests that assert isolation : an automated test that authenticates as tenant a and attempts every endpoint against tenant b's identifiers, and a lint that flags any repository method without a tenant predicate. the framing to state: application-level filtering is a correctness mechanism, and cross-tenant leakage is a security event - so it needs a control that fails closed, which only the database can provide."}, {"n": 271, "category": 16, "difficulty": "D", "html": "Encryption at rest, in transit and at the column level. What does each actually protect against, and what does TDE not protect against?", "answerTitle": "Encryption at rest, in transit, at the column level", "answer": "<ul><li><strong>In transit (TLS)<\/strong> protects against network interception and man-in-the-middle. It is table stakes, and the detail that matters is <code>sslmode<\/code>: <code>require<\/code> encrypts but does <strong>not<\/strong> verify the server, so it does not stop MITM; <code>verify-full<\/code> checks the certificate and hostname and is the only setting that provides the guarantee people assume they have.<\/li><li><strong>At rest (disk/volume encryption, TDE)<\/strong> protects against <strong>physical media<\/strong> compromise - a stolen disk, a decommissioned drive, a snapshot copied out of the account without the key. It is transparent to queries, costs a few percent CPU, and is usually mandatory for compliance.<\/li><li><strong>Column-level encryption<\/strong> protects the value from anyone with database access - a DBA, a support engineer with a read-only role, an SQL injection, a leaked backup with its key.<\/li><\/ul><p><strong>What TDE does not protect against<\/strong> is the important part, and it is a good interview answer: it protects the <em>file<\/em>, not the <em>connection or the query<\/em>. Anyone who can authenticate to the database - or exploit an injection, or read a memory dump, or obtain a logical <code>pg_dump<\/code> - gets plaintext, because the engine decrypts transparently for every authorized reader. It also does nothing against a compromised application, an over-privileged role, or an insider with legitimate access. So TDE satisfies a compliance control about media, and column encryption is what satisfies a threat model about people.<\/p><p>The layering I would apply: TLS <code>verify-full<\/code> everywhere, volume encryption always (it is nearly free with managed services), and column encryption reserved for the small set of fields where the threat model justifies the cost - card data, government identifiers, health data, credentials.<\/p>", "source": "answers.md", "search": "encryption at rest, in transit and at the column level. what does each actually protect against, and what does tde not protect against? - in transit (tls) protects against network interception and man-in-the-middle. it is table stakes, and the detail that matters is sslmode: require encrypts but does not verify the server, so it does not stop mitm; verify-full checks the certificate and hostname and is the only setting that provides the guarantee people assume they have. - at rest (disk/volume encryption, tde) protects against physical media compromise - a stolen disk, a decommissioned drive, a snapshot copied out of the account without the key. it is transparent to queries, costs a few percent cpu, and is usually mandatory for compliance. - column-level encryption protects the value from anyone with database access - a dba, a support engineer with a read-only role, an sql injection, a leaked backup with its key. what tde does not protect against is the important part, and it is a good interview answer: it protects the file , not the connection or the query . anyone who can authenticate to the database - or exploit an injection, or read a memory dump, or obtain a logical pg_dump - gets plaintext, because the engine decrypts transparently for every authorized reader. it also does nothing against a compromised application, an over-privileged role, or an insider with legitimate access. so tde satisfies a compliance control about media, and column encryption is what satisfies a threat model about people. the layering i would apply: tls verify-full everywhere, volume encryption always (it is nearly free with managed services), and column encryption reserved for the small set of fields where the threat model justifies the cost - card data, government identifiers, health data, credentials."}, {"n": 272, "category": 16, "difficulty": "D", "html": "Key management for column-level encryption, and what searchable encryption or deterministic encryption costs you.", "answerTitle": "Key management and searchable encryption", "answer": "<p>Keys must not live where the ciphertext lives. The standard structure is <strong>envelope encryption<\/strong>: a data encryption key (DEK) encrypts the column values, and the DEK is itself encrypted by a key encryption key (KEK) held in a KMS or HSM. The application fetches and caches the decrypted DEK in memory; the KMS enforces access policy and logs every use; <strong>rotation<\/strong> of the KEK is cheap (re-encrypt the DEK only), while rotation of the DEK requires re-encrypting the data, so you version the DEK and store the version alongside each value so old and new can coexist.<\/p><p>Then the hard part: <strong>encrypted columns are not searchable<\/strong>, because a good cipher is randomized, so the same plaintext yields different ciphertext each time. Equality search, uniqueness, range queries, sorting and joins all stop working.<\/p><p>The options and their costs:<\/p><ul><li><strong>Deterministic encryption<\/strong> - the same plaintext always yields the same ciphertext, so equality lookups and uniqueness work. The cost is that it <strong>leaks the equality pattern<\/strong>: an attacker with the ciphertext sees which rows share a value, and frequency analysis on a low-cardinality column (gender, city, disease code) recovers the plaintext without any key.<\/li><li><strong>Blind indexing<\/strong> - store a keyed HMAC of the normalized plaintext in a separate indexed column for equality lookups, with the actual value randomly encrypted. Same equality leakage in principle, but you control the granularity (truncate the HMAC to create deliberate collisions and reduce leakage), and the encryption itself stays randomized.<\/li><li><strong>Order-preserving / order-revealing encryption<\/strong> enables range queries and leaks the ordering, which is usually enough to reconstruct the data. I would not use it.<\/li><li><strong>Client-side field level encryption<\/strong> (MongoDB CSFLE, AWS DB Encryption SDK) packages the above with proper key handling.<\/li><\/ul><p>So the honest position: encrypt what needs it, accept that those columns lose query capability, keep a separate searchable projection only where the leakage is acceptable, and push back on &quot;encrypt everything&quot; because it converts a database into a key-value store with extra steps.<\/p>", "source": "answers.md", "search": "key management for column-level encryption, and what searchable encryption or deterministic encryption costs you. keys must not live where the ciphertext lives. the standard structure is envelope encryption : a data encryption key (dek) encrypts the column values, and the dek is itself encrypted by a key encryption key (kek) held in a kms or hsm. the application fetches and caches the decrypted dek in memory; the kms enforces access policy and logs every use; rotation of the kek is cheap (re-encrypt the dek only), while rotation of the dek requires re-encrypting the data, so you version the dek and store the version alongside each value so old and new can coexist. then the hard part: encrypted columns are not searchable , because a good cipher is randomized, so the same plaintext yields different ciphertext each time. equality search, uniqueness, range queries, sorting and joins all stop working. the options and their costs: - deterministic encryption - the same plaintext always yields the same ciphertext, so equality lookups and uniqueness work. the cost is that it leaks the equality pattern : an attacker with the ciphertext sees which rows share a value, and frequency analysis on a low-cardinality column (gender, city, disease code) recovers the plaintext without any key. - blind indexing - store a keyed hmac of the normalized plaintext in a separate indexed column for equality lookups, with the actual value randomly encrypted. same equality leakage in principle, but you control the granularity (truncate the hmac to create deliberate collisions and reduce leakage), and the encryption itself stays randomized. - order-preserving / order-revealing encryption enables range queries and leaks the ordering, which is usually enough to reconstruct the data. i would not use it. - client-side field level encryption (mongodb csfle, aws db encryption sdk) packages the above with proper key handling. so the honest position: encrypt what needs it, accept that those columns lose query capability, keep a separate searchable projection only where the leakage is acceptable, and push back on \"encrypt everything\" because it converts a database into a key-value store with extra steps."}, {"n": 273, "category": 16, "difficulty": "D", "html": "PII: classification, masking in lower environments, tokenization, and the pipeline that keeps production data out of a laptop.", "answerTitle": "PII handling", "answer": "<p><strong>Classification first<\/strong>: every column tagged (public, internal, personal, sensitive-personal, financial) in a catalog that lives with the schema - a comment on the column, a YAML file in the repo, or a data catalog tool. Untagged is not &quot;safe&quot;, it is &quot;unreviewed&quot;, and a lint should fail a migration that adds a column with no classification. This sounds bureaucratic and it is the thing that makes every later control possible, because you cannot mask, retain or delete what you have not identified.<\/p><p><strong>Lower environments<\/strong>: production data does not go to a laptop. The pipeline is a restore into a locked-down environment where an <strong>anonymization job<\/strong> runs before any developer access - deterministic pseudonymization for values that must stay join-able across tables (the same customer id maps to the same fake id everywhere), format-preserving fakes for names, emails and phone numbers so validation still passes, nulling or generalization for free-text fields (which are the worst offenders because PII hides in them), and <em>deletion<\/em> of the columns nobody needs. The alternative, and often the better one, is <strong>synthetic data<\/strong> generated to match the production distribution (Q265), which has no residual risk at all.<\/p><p><strong>Tokenization<\/strong> for the highest-sensitivity fields - card numbers, national identifiers: the real value lives in a separate vault with its own access control and aud
