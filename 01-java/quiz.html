model provider deprecates a version. Alongside that I propose an alternative that reaches the same outcome - frequently a deterministic rule, a search improvement, or a much smaller model scoped to a narrower task.<\/p><p>If it is still contested, I propose a <strong>time-boxed spike with agreed success criteria<\/strong> on real data. That converts an opinion contest into evidence, and it is honest: I have been wrong about what models can do, and a two-week evaluation costs far less than a year of maintaining something that does not work. I also insist on defining the failure mode up front - what the user sees when the model is wrong - because a feature that cannot degrade acceptably should not ship regardless of its average quality.<\/p><p>And if the decision goes against me after that, I commit to it and instrument it heavily so we find out quickly. Disagreeing and committing, with measurement attached, is more useful than being right in a retrospective.<\/p>", "source": "answers.md", "search": "a stakeholder wants an ai feature that you believe is a poor fit. how do you handle it? i do not open with \"no\". i try to understand the outcome they actually want, because the request is usually a proposed solution to a real problem, and the problem is often legitimate even when the solution is not. then i make the trade-off visible rather than argue from authority: what accuracy is achievable and what happens on the failure cases; what the cost per interaction is at expected volume; the latency the user will experience; the compliance and data exposure implications; and what the maintenance burden looks like when the model provider deprecates a version. alongside that i propose an alternative that reaches the same outcome - frequently a deterministic rule, a search improvement, or a much smaller model scoped to a narrower task. if it is still contested, i propose a time-boxed spike with agreed success criteria on real data. that converts an opinion contest into evidence, and it is honest: i have been wrong about what models can do, and a two-week evaluation costs far less than a year of maintaining something that does not work. i also insist on defining the failure mode up front - what the user sees when the model is wrong - because a feature that cannot degrade acceptably should not ship regardless of its average quality. and if the decision goes against me after that, i commit to it and instrument it heavily so we find out quickly. disagreeing and committing, with measurement attached, is more useful than being right in a retrospective."}, {"n": 232, "category": 14, "difficulty": "A", "html": "Design a URL shortener handling 100 million redirects per day.", "answerTitle": "URL shortener at 100 million redirects per day", "answer": "<p><strong>Clarify.<\/strong> Read/write ratio? Custom aliases? Expiry? Analytics required, and how real-time? Do URLs need to be unguessable? Global users, or one region?<\/p><p><strong>Estimate.<\/strong> 100M redirects/day ≈ 1,160 QPS average, so assume 3-5k QPS peak. Writes are perhaps 1 percent of that - roughly 12 writes/second. So this is an overwhelmingly read-heavy system, and that single ratio drives the whole design. Storage: 1M new URLs/day × 500 bytes ≈ 500 MB/day, under 200 GB/year - small.<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>ID generation.<\/strong> A counter encoded in base62 gives short, sequential, guessable keys; a random 7-character key (62^7 ≈ 3.5 trillion) is unguessable but needs a collision check. I would use a pre-allocated range per instance (a &quot;ticket server&quot; or Snowflake-style ID) encoded to base62 - no coordination per request, no collision check. If unguessability is required, add random bits rather than switching to pure random.<\/li><li><strong>Storage.<\/strong> The access pattern is a single key lookup, so this is the rare genuine fit for a key-value store - DynamoDB or Redis-backed. Postgres also handles it comfortably at this volume; I would not introduce a new store for 200 GB unless the team already runs one.<\/li><li><strong>Cache.<\/strong> With a Zipfian access distribution, a Redis cache of the hot 1-5 percent absorbs most traffic. Cache-aside with a long TTL, since mappings are immutable once created - which makes invalidation a non-problem, and that immutability is worth stating.<\/li><li><strong>Redirect.<\/strong> 301 is cacheable by the browser (fewer requests, but you lose analytics and cannot change the target); 302 keeps control. I would use 302 with a short cache header, because analytics is usually a requirement.<\/li><li><strong>Analytics.<\/strong> Do not write to the database on the redirect path. Emit an event to Kinesis or Kafka and aggregate asynchronously.<\/li><\/ul><p><strong>Scale and failure.<\/strong> Read path is cache plus CDN, so it scales horizontally trivially. The failure mode that matters: Redis down means every read hits the database at once - so I would use a local Caffeine cache in front of Redis as a second tier, and rate-limit database access on miss. Bad-actor concerns are real here: malicious URLs need a safe-browsing check, and rate limiting per creator prevents abuse.<\/p><p><strong>What I would deliberately not do.<\/strong> No sharding at this volume, no multi-region write path unless latency requirements demand it. Stating what you are <em>not<\/em> building, and why, is a principal-level signal.<\/p>", "source": "scenario-questions.md (S11)", "search": "design a url shortener handling 100 million redirects per day. clarify. read/write ratio? custom aliases? expiry? analytics required, and how real-time? do urls need to be unguessable? global users, or one region? estimate. 100m redirects/day ≈ 1,160 qps average, so assume 3-5k qps peak. writes are perhaps 1 percent of that - roughly 12 writes/second. so this is an overwhelmingly read-heavy system, and that single ratio drives the whole design. storage: 1m new urls/day × 500 bytes ≈ 500 mb/day, under 200 gb/year - small. key decisions. - id generation. a counter encoded in base62 gives short, sequential, guessable keys; a random 7-character key (62^7 ≈ 3.5 trillion) is unguessable but needs a collision check. i would use a pre-allocated range per instance (a \"ticket server\" or snowflake-style id) encoded to base62 - no coordination per request, no collision check. if unguessability is required, add random bits rather than switching to pure random. - storage. the access pattern is a single key lookup, so this is the rare genuine fit for a key-value store - dynamodb or redis-backed. postgres also handles it comfortably at this volume; i would not introduce a new store for 200 gb unless the team already runs one. - cache. with a zipfian access distribution, a redis cache of the hot 1-5 percent absorbs most traffic. cache-aside with a long ttl, since mappings are immutable once created - which makes invalidation a non-problem, and that immutability is worth stating. - redirect. 301 is cacheable by the browser (fewer requests, but you lose analytics and cannot change the target); 302 keeps control. i would use 302 with a short cache header, because analytics is usually a requirement. - analytics. do not write to the database on the redirect path. emit an event to kinesis or kafka and aggregate asynchronously. scale and failure. read path is cache plus cdn, so it scales horizontally trivially. the failure mode that matters: redis down means every read hits the database at once - so i would use a local caffeine cache in front of redis as a second tier, and rate-limit database access on miss. bad-actor concerns are real here: malicious urls need a safe-browsing check, and rate limiting per creator prevents abuse. what i would deliberately not do. no sharding at this volume, no multi-region write path unless latency requirements demand it. stating what you are not building, and why, is a principal-level signal."}, {"n": 233, "category": 14, "difficulty": "A", "html": "Design a payment processing system with strict consistency and auditability.", "answerTitle": "Payment processing with strict consistency", "answer": "<p><strong>Clarify.<\/strong> Are we the processor or integrating with one? Which currencies and regions, and therefore which regulations? What is the expected volume and the acceptable failure rate? What are the auditability and retention requirements? Do we hold balances (which means a ledger) or just move money?<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Double-entry ledger, append-only.<\/strong> Every movement is two balanced entries; balances are derived, never updated in place. This is non-negotiable for auditability, and saying it immediately signals domain knowledge. Corrections are compensating entries, never updates or deletes.<\/li><li><strong>Strong consistency inside the boundary.<\/strong> The ledger lives in a single relational database with ACID transactions - this is where I explicitly refuse eventual consistency. Scale it vertically and by partitioning on account, not by relaxing consistency.<\/li><li><strong>Explicit state machine<\/strong> for the payment: <code>INITIATED → AUTHORIZED → CAPTURED → SETTLED<\/code>, plus <code>FAILED<\/code> and <code>REFUNDED<\/code>, with transitions enforced in the database (a check constraint or a transitions table) so an invalid transition is impossible rather than merely unlikely.<\/li><li><strong>Idempotency everywhere<\/strong> - client to us, us to the processor - per Q184.<\/li><li><strong>Outbox<\/strong> for every event we publish, so notifications and downstream projections can never diverge from the ledger.<\/li><li><strong>Reconciliation<\/strong> as a first-class component: a scheduled job comparing our ledger against the processor&#x27;s settlement file, alerting on any divergence. Every real payment system has this, and candidates who omit it have not operated one.<\/li><li><strong>Saga with orchestration<\/strong> where multiple services are involved, with compensations that are semantic (a refund, not a rollback).<\/li><\/ul><p><strong>Security and compliance.<\/strong> PCI DSS scope minimization - never store card data, use the processor&#x27;s tokenization or a hosted field, so card numbers never touch our infrastructure. Encryption at rest and in transit, KMS-managed keys, field-level encryption for anything sensitive that we do hold, immutable audit log of every state change with actor and timestamp, and strict least-privilege access with break-glass procedures.<\/p><p><strong>Failure modes.<\/strong> The one to talk about is the ambiguous outcome: we called the processor and did not get a response. We do not know whether the charge happened. The answer is a <code>PENDING_UNKNOWN<\/code> state, a query-by-idempotency-key against the processor to resolve it, a bounded retry with backoff, and a manual review queue for anything unresolved - plus never surfacing an ambiguous state as either success or failure to the user.<\/p>", "source": "scenario-questions.md (S12)", "search": "design a payment processing system with strict consistency and auditability. clarify. are we the processor or integrating with one? which currencies and regions, and therefore which regulations? what is the expected volume and the acceptable failure rate? what are the auditability and retention requirements? do we hold balances (which means a ledger) or just move money? key decisions. - double-entry ledger, append-only. every movement is two balanced entries; balances are derived, never updated in place. this is non-negotiable for auditability, and saying it immediately signals domain knowledge. corrections are compensating entries, never updates or deletes. - strong consistency inside the boundary. the ledger lives in a single relational database with acid transactions - this is where i explicitly refuse eventual consistency. scale it vertically and by partitioning on account, not by relaxing consistency. - explicit state machine for the payment: initiated → authorized → captured → settled, plus failed and refunded, with transitions enforced in the database (a check constraint or a transitions table) so an invalid transition is impossible rather than merely unlikely. - idempotency everywhere - client to us, us to the processor - per q184. - outbox for every event we publish, so notifications and downstream projections can never diverge from the ledger. - reconciliation as a first-class component: a scheduled job comparing our ledger against the processor's settlement file, alerting on any divergence. every real payment system has this, and candidates who omit it have not operated one. - saga with orchestration where multiple services are involved, with compensations that are semantic (a refund, not a rollback). security and compliance. pci dss scope minimization - never store card data, use the processor's tokenization or a hosted field, so card numbers never touch our infrastructure. encryption at rest and in transit, kms-managed keys, field-level encryption for anything sensitive that we do hold, immutable audit log of every state change with actor and timestamp, and strict least-privilege access with break-glass procedures. failure modes. the one to talk about is the ambiguous outcome: we called the processor and did not get a response. we do not know whether the charge happened. the answer is a pending_unknown state, a query-by-idempotency-key against the processor to resolve it, a bounded retry with backoff, and a manual review queue for anything unresolved - plus never surfacing an ambiguous state as either success or failure to the user."}, {"n": 234, "category": 14, "difficulty": "A", "html": "Design a notification service supporting email, SMS and push with retries and rate limits.", "answerTitle": "Multi-channel notification service", "answer": "<p><strong>Clarify.<\/strong> What volume, and what burst shape - is there a &quot;send to 10 million users&quot; broadcast case? Per-user preferences and quiet hours? Delivery guarantees - at-least-once with duplicates acceptable, or strict? Do we need delivery status tracking? Templating and localization? Regulatory constraints (opt-out, GDPR)?<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>API accepts and returns immediately<\/strong> with a notification ID; delivery is asynchronous. Never make the caller wait on an SMS gateway.<\/li><li><strong>Queue per channel<\/strong>, because email, SMS and push have wildly different throughput, cost and failure characteristics, and one slow provider must not block the others - bulkheading at the infrastructure level.<\/li><li><strong>Provider abstraction with fallback<\/strong>: an interface per channel with a primary and secondary provider, so a SendGrid outage fails over to SES. This is a common real requirement and a differentiator in the answer.<\/li><li><strong>Preference and suppression service<\/strong> consulted before dispatch - opt-outs, channel preference, quiet hours, and a hard suppression list for bounces and complaints, which is a deliverability requirement for email, not just a nicety.<\/li><li><strong>Rate limiting per provider<\/strong> (they impose quotas) and <strong>per user<\/strong> (a dedup/frequency cap so a bug cannot send someone 500 emails - this is the failure that actually happens, and designing against it unprompted scores well).<\/li><li><strong>Templating<\/strong> versioned and stored centrally, rendered at send time with localization.<\/li><li><strong>Idempotency<\/strong> on the inbound request, and a dedup key on the dispatch so a redelivered message does not send twice.<\/li><li><strong>Status tracking<\/strong> via provider webhooks into a delivery-status store, with the notification lifecycle (<code>QUEUED → SENT → DELIVERED → OPENED / BOUNCED / FAILED<\/code>) queryable.<\/li><\/ul><p><strong>Retries.<\/strong> Exponential backoff with jitter, a bounded attempt count, and a DLQ per channel. Distinguish retryable (5xx, timeout, throttle) from permanent (invalid address, unsubscribed) - retrying a hard bounce damages sender reputation.<\/p><p><strong>Scale.<\/strong> For a 10M broadcast, fan out through a batch job that writes to the queue in chunks rather than one giant transaction, and spread the send over a window to respect provider rate limits and to avoid a thundering herd on your own systems when everyone clicks the link at once.<\/p>", "source": "scenario-questions.md (S13)", "search": "design a notification service supporting email, sms and push with retries and rate limits. clarify. what volume, and what burst shape - is there a \"send to 10 million users\" broadcast case? per-user preferences and quiet hours? delivery guarantees - at-least-once with duplicates acceptable, or strict? do we need delivery status tracking? templating and localization? regulatory constraints (opt-out, gdpr)? key decisions. - api accepts and returns immediately with a notification id; delivery is asynchronous. never make the caller wait on an sms gateway. - queue per channel , because email, sms and push have wildly different throughput, cost and failure characteristics, and one slow provider must not block the others - bulkheading at the infrastructure level. - provider abstraction with fallback : an interface per channel with a primary and secondary provider, so a sendgrid outage fails over to ses. this is a common real requirement and a differentiator in the answer. - preference and suppression service consulted before dispatch - opt-outs, channel preference, quiet hours, and a hard suppression list for bounces and complaints, which is a deliverability requirement for email, not just a nicety. - rate limiting per provider (they impose quotas) and per user (a dedup/frequency cap so a bug cannot send someone 500 emails - this is the failure that actually happens, and designing against it unprompted scores well). - templating versioned and stored centrally, rendered at send time with localization. - idempotency on the inbound request, and a dedup key on the dispatch so a redelivered message does not send twice. - status tracking via provider webhooks into a delivery-status store, with the notification lifecycle (queued → sent → delivered → opened / bounced / failed) queryable. retries. exponential backoff with jitter, a bounded attempt count, and a dlq per channel. distinguish retryable (5xx, timeout, throttle) from permanent (invalid address, unsubscribed) - retrying a hard bounce damages sender reputation. scale. for a 10m broadcast, fan out through a batch job that writes to the queue in chunks rather than one giant transaction, and spread the send over a window to respect provider rate limits and to avoid a thundering herd on your own systems when everyone clicks the link at once."}, {"n": 235, "category": 14, "difficulty": "A", "html": "Design a rate limiter usable across 200 service instances.", "answerTitle": "Distributed rate limiter across 200 instances", "answer": "<p><strong>Clarify.<\/strong> What is being limited - per API key, per user, per IP, per endpoint? What limits and windows? Is it a hard limit (billing/quota) or a protective one? What is the acceptable error - can we allow 10 percent over? What happens if the coordination store is unavailable?<\/p><p><strong>That last question is the design fork<\/strong>, and asking it is the point of the exercise.<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Algorithm<\/strong>: token bucket, for burst tolerance with a sustained rate.<\/li><li><strong>Coordination<\/strong>: Redis with an atomic Lua script implementing the bucket - a single round trip, no race between check and decrement. <code>INCR<\/code> with <code>EXPIRE<\/code> is the naive version and has a race plus the fixed-window boundary burst; the Lua script or Redis Cell module avoids both.<\/li><li><strong>Latency<\/strong>: a Redis call per request adds ~1ms, which is acceptable at the edge but not for every internal hop. For very high volume, use <strong>local token buckets with periodic global reconciliation<\/strong>: each instance holds a share of the quota, and rebalances every second or two. Approximate, much faster, and adequate for protective limits - not for billing.<\/li><li><strong>Failure mode, stated explicitly<\/strong>: fail <em>open<\/em> for protective limits (availability matters more than perfect enforcement) and fail <em>closed<\/em> for quota or billing limits. Decide it deliberately and document it.<\/li><li><strong>Hot keys<\/strong>: one very large customer concentrated on one Redis key is a hotspot; shard the key or move that tenant to dedicated capacity.<\/li><\/ul><p><strong>Response contract.<\/strong> 429 with <code>Retry-After<\/code>, plus <code>X-RateLimit-Limit<\/code>, <code>-Remaining<\/code> and <code>-Reset<\/code> so well-behaved clients self-throttle rather than hammering. Rate limiting that clients cannot observe just produces retry storms.<\/p><p><strong>Where to enforce.<\/strong> At the edge for coarse protection (API Gateway or ingress, keeping abusive traffic off your compute entirely) and in the application for anything needing business context. Both, not either.<\/p>", "source": "scenario-questions.md (S14)", "search": "design a rate limiter usable across 200 service instances. clarify. what is being limited - per api key, per user, per ip, per endpoint? what limits and windows? is it a hard limit (billing/quota) or a protective one? what is the acceptable error - can we allow 10 percent over? what happens if the coordination store is unavailable? that last question is the design fork , and asking it is the point of the exercise. key decisions. - algorithm : token bucket, for burst tolerance with a sustained rate. - coordination : redis with an atomic lua script implementing the bucket - a single round trip, no race between check and decrement. incr with expire is the naive version and has a race plus the fixed-window boundary burst; the lua script or redis cell module avoids both. - latency : a redis call per request adds ~1ms, which is acceptable at the edge but not for every internal hop. for very high volume, use local token buckets with periodic global reconciliation : each instance holds a share of the quota, and rebalances every second or two. approximate, much faster, and adequate for protective limits - not for billing. - failure mode, stated explicitly : fail open for protective limits (availability matters more than perfect enforcement) and fail closed for quota or billing limits. decide it deliberately and document it. - hot keys : one very large customer concentrated on one redis key is a hotspot; shard the key or move that tenant to dedicated capacity. response contract. 429 with retry-after, plus x-ratelimit-limit, -remaining and -reset so well-behaved clients self-throttle rather than hammering. rate limiting that clients cannot observe just produces retry storms. where to enforce. at the edge for coarse protection (api gateway or ingress, keeping abusive traffic off your compute entirely) and in the application for anything needing business context. both, not either."}, {"n": 236, "category": 14, "difficulty": "A", "html": "Design an audit log that is tamper-evident and queryable over five years of data.", "answerTitle": "Tamper-evident audit log over five years", "answer": "<p><strong>Clarify.<\/strong> What must be auditable - all data changes, or specific regulated events? Who queries it, how often, and by what dimensions? What is the retention and legal hold requirement? Does tamper-evidence need to be cryptographic and externally verifiable, or is restricted access sufficient? Volume per day?<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Append-only, no update or delete path<\/strong> - enforced at the database level with permissions, not just by convention. The application&#x27;s credentials have <code>INSERT<\/code> and <code>SELECT<\/code> only.<\/li><li><strong>Hash chaining<\/strong> for tamper evidence: each record includes the hash of the previous record, so any modification breaks the chain from that point. Periodically publish the chain head somewhere independent (a separate account, a WORM bucket, or a signed external notarization) so an attacker with full database access still cannot rewrite history undetected. This is the core of the answer - restricted access alone is not tamper evidence, it is tamper <em>hope<\/em>.<\/li><li><strong>Write path decoupled<\/strong> from the business transaction only if loss is acceptable - which for audit it usually is not, so the audit write goes in the same transaction (or via the outbox) and the business operation fails if the audit write fails. Say that trade-off out loud: correctness over availability, deliberately.<\/li><li><strong>Storage tiering<\/strong> for five years: hot data (90 days) in Postgres or OpenSearch for interactive query; warm and cold in S3 as partitioned Parquet with Athena or Glue over it, with lifecycle transitions to Glacier. <strong>S3 Object Lock in compliance mode<\/strong> gives genuine WORM guarantees that even a root user cannot override, which is what regulators actually ask for.<\/li><li><strong>Partitioning by time<\/strong> so retention is a partition drop rather than a mass delete, and queries prune efficiently.<\/li><li><strong>What is recorded<\/strong>: who (authenticated principal, not a service account), what (entity, before and after, or a diff), when (server time, with the trace ID), where (source IP, client), and why (business operation), plus the schema version so five-year-old records remain interpretable.<\/li><\/ul><p><strong>The tension to name.<\/strong> GDPR erasure versus immutable audit. Resolution: store PII by reference (a pseudonymous subject ID) so erasure can remove the mapping while leaving the audit chain intact, or use crypto-shredding - encrypt per-subject and destroy the key. Raising this unprompted is a strong signal.<\/p>", "source": "scenario-questions.md (S15)", "search": "design an audit log that is tamper-evident and queryable over five years of data. clarify. what must be auditable - all data changes, or specific regulated events? who queries it, how often, and by what dimensions? what is the retention and legal hold requirement? does tamper-evidence need to be cryptographic and externally verifiable, or is restricted access sufficient? volume per day? key decisions. - append-only, no update or delete path - enforced at the database level with permissions, not just by convention. the application's credentials have insert and select only. - hash chaining for tamper evidence: each record includes the hash of the previous record, so any modification breaks the chain from that point. periodically publish the chain head somewhere independent (a separate account, a worm bucket, or a signed external notarization) so an attacker with full database access still cannot rewrite history undetected. this is the core of the answer - restricted access alone is not tamper evidence, it is tamper hope . - write path decoupled from the business transaction only if loss is acceptable - which for audit it usually is not, so the audit write goes in the same transaction (or via the outbox) and the business operation fails if the audit write fails. say that trade-off out loud: correctness over availability, deliberately. - storage tiering for five years: hot data (90 days) in postgres or opensearch for interactive query; warm and cold in s3 as partitioned parquet with athena or glue over it, with lifecycle transitions to glacier. s3 object lock in compliance mode gives genuine worm guarantees that even a root user cannot override, which is what regulators actually ask for. - partitioning by time so retention is a partition drop rather than a mass delete, and queries prune efficiently. - what is recorded : who (authenticated principal, not a service account), what (entity, before and after, or a diff), when (server time, with the trace id), where (source ip, client), and why (business operation), plus the schema version so five-year-old records remain interpretable. the tension to name. gdpr erasure versus immutable audit. resolution: store pii by reference (a pseudonymous subject id) so erasure can remove the mapping while leaving the audit chain intact, or use crypto-shredding - encrypt per-subject and destroy the key. raising this unprompted is a strong signal."}, {"n": 237, "category": 14, "difficulty": "A", "html": "Design a real-time dashboard consuming a 100k events/second stream.", "answerTitle": "Real-time dashboard over 100k events/second", "answer": "<p><strong>Clarify.<\/strong> What latency does &quot;real-time&quot; mean - one second, or one minute? How many concurrent dashboard viewers? What aggregations, over what time windows? Is exact accuracy required, or are approximations acceptable? How long must the raw data be retained?<\/p><p><strong>Estimate.<\/strong> 100k events/second at ~1 KB is 100 MB/s, 8.6 TB/day raw. That number alone tells you raw storage is a cost problem and that you cannot query raw data interactively.<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Ingest<\/strong> through Kafka or Kinesis, partitioned by a high-cardinality key. At 100k/s, partition count and producer batching are the throughput levers.<\/li><li><strong>Pre-aggregate in a stream processor<\/strong> (Flink, Kafka Streams) into tumbling and sliding windows - this is the central decision. You cannot aggregate 8.6 TB/day at query time for a dashboard, so the dashboard reads pre-computed rollups at one-second, one-minute and one-hour granularity. Handle late-arriving events with watermarks and a defined allowed lateness, and state what happens to data arriving after that.<\/li><li><strong>Serving store<\/strong>: a time-series or OLAP store built for this - ClickHouse, Druid or Pinot for sub-second queries over rollups; Timestream or Prometheus for simpler metric shapes. A relational database is the wrong tool here and saying so with a reason is the point.<\/li><li><strong>Approximations where they buy orders of magnitude<\/strong>: HyperLogLog for distinct counts, t-digest for quantiles. Exact distinct counts over a billion events are enormously more expensive, and the dashboard user cannot tell the difference - but ask first, because for billing they can.<\/li><li><strong>Push to the browser<\/strong> via SSE or WebSocket from a fan-out layer, with server-side throttling - a dashboard updating 100 times a second is useless to a human, so coalesce to once or twice a second. With many viewers, one subscription per query result fanned out to all viewers, not one query per viewer.<\/li><li><strong>Raw retention<\/strong> to S3 in Parquet for replay and ad-hoc analysis, with lifecycle expiry.<\/li><\/ul><p><strong>Failure modes.<\/strong> Backpressure when the processor cannot keep up - the stream buffers, so lag is your primary alert, and you need a documented behavior for a large backlog (catch up, or skip to head and backfill separately). A stream processor restart must resume from checkpointed state, so checkpoint configuration and state store sizing are operational essentials, not details.<\/p>", "source": "scenario-questions.md (S16)", "search": "design a real-time dashboard consuming a 100k events/second stream. clarify. what latency does \"real-time\" mean - one second, or one minute? how many concurrent dashboard viewers? what aggregations, over what time windows? is exact accuracy required, or are approximations acceptable? how long must the raw data be retained? estimate. 100k events/second at ~1 kb is 100 mb/s, 8.6 tb/day raw. that number alone tells you raw storage is a cost problem and that you cannot query raw data interactively. key decisions. - ingest through kafka or kinesis, partitioned by a high-cardinality key. at 100k/s, partition count and producer batching are the throughput levers. - pre-aggregate in a stream processor (flink, kafka streams) into tumbling and sliding windows - this is the central decision. you cannot aggregate 8.6 tb/day at query time for a dashboard, so the dashboard reads pre-computed rollups at one-second, one-minute and one-hour granularity. handle late-arriving events with watermarks and a defined allowed lateness, and state what happens to data arriving after that. - serving store : a time-series or olap store built for this - clickhouse, druid or pinot for sub-second queries over rollups; timestream or prometheus for simpler metric shapes. a relational database is the wrong tool here and saying so with a reason is the point. - approximations where they buy orders of magnitude : hyperloglog for distinct counts, t-digest for quantiles. exact distinct counts over a billion events are enormously more expensive, and the dashboard user cannot tell the difference - but ask first, because for billing they can. - push to the browser via sse or websocket from a fan-out layer, with server-side throttling - a dashboard updating 100 times a second is useless to a human, so coalesce to once or twice a second. with many viewers, one subscription per query result fanned out to all viewers, not one query per viewer. - raw retention to s3 in parquet for replay and ad-hoc analysis, with lifecycle expiry. failure modes. backpressure when the processor cannot keep up - the stream buffers, so lag is your primary alert, and you need a documented behavior for a large backlog (catch up, or skip to head and backfill separately). a stream processor restart must resume from checkpointed state, so checkpoint configuration and state store sizing are operational essentials, not details."}, {"n": 238, "category": 14, "difficulty": "A", "html": "Design the migration of a 10-year-old monolith to services without a big bang.", "answerTitle": "Monolith to services without a big bang", "answer": "<p><strong>Clarify.<\/strong> What is actually driving this - deployment velocity, scaling, team autonomy, or reliability? (If nobody can answer, the correct recommendation may be <em>do not do this<\/em>, and saying so is a principal-level answer.) How large is the codebase and the team? What is the release cadence today, and what is the constraint on it? Is the database shared, and how entangled is it?<\/p><p><strong>Approach.<\/strong><\/p><ol><li><strong>Establish the why and the success metric<\/strong> first - &quot;deploy independently, from monthly to daily&quot; or &quot;scale the pricing engine separately&quot; - so extraction stops when the goal is met rather than continuing until everything is a service.<\/li><li><strong>Modularize in place before extracting.<\/strong> Enforce module boundaries inside the monolith with package structure, ArchUnit tests and internal APIs. This is cheap, reversible, and delivers much of the benefit; it also reveals which seams are real. Many organizations should stop here.<\/li><li><strong>Strangler fig<\/strong> for extraction: put a facade or gateway in front, route one capability at a time to the new service, and retire the old code path once traffic is fully shifted. Never a parallel rewrite.<\/li><li><strong>Choose the first service deliberately<\/strong>: something with a clear boundary, meaningful business value, and low coupling - not the hardest and not the most trivial. It is a learning vehicle for the platform work (CI/CD, observability, on-call) as much as a technical change.<\/li><li><strong>Split the data last and explicitly.<\/strong> The database is the hard part. Sequence: stop cross-module joins in code, move to an API call, then separate the schema, then the instance. Where both sides need the data, use change data capture or events to maintain a read model rather than a shared table.<\/li><li><strong>Keep both paths live<\/strong> behind a feature flag with dual-run and comparison (shadow traffic to the new service, compare outputs, do not serve them) until confidence is high. This is what makes it genuinely non-big-bang.<\/li><li><strong>Invest in the platform in parallel<\/strong> - pipelines, tracing, service templates - because extraction without it produces a distributed monolith that is worse than what you started with.<\/li><\/ol><p><strong>Reflect.<\/strong> The failure mode I would call out: extracting services while the shared database remains, producing services that must deploy together and cannot fail independently. That is all of the cost and none of the benefit, and it is the most common outcome of these programmes. I would define a checkpoint after the second service to honestly reassess whether the metric is moving.<\/p><blockquote><p><em>Your hook: a migration you led - the driver, the sequencing, the metric that improved, and what you would sequence differently.<\/em><\/p><\/blockquote>", "source": "scenario-questions.md (S17)", "search": "design the migration of a 10-year-old monolith to services without a big bang. clarify. what is actually driving this - deployment velocity, scaling, team autonomy, or reliability? (if nobody can answer, the correct recommendation may be do not do this , and saying so is a principal-level answer.) how large is the codebase and the team? what is the release cadence today, and what is the constraint on it? is the database shared, and how entangled is it? approach. 1. establish the why and the success metric first - \"deploy independently, from monthly to daily\" or \"scale the pricing engine separately\" - so extraction stops when the goal is met rather than continuing until everything is a service. 2. modularize in place before extracting. enforce module boundaries inside the monolith with package structure, archunit tests and internal apis. this is cheap, reversible, and delivers much of the benefit; it also reveals which seams are real. many organizations should stop here. 3. strangler fig for extraction: put a facade or gateway in front, route one capability at a time to the new service, and retire the old code path once traffic is fully shifted. never a parallel rewrite. 4. choose the first service deliberately : something with a clear boundary, meaningful business value, and low coupling - not the hardest and not the most trivial. it is a learning vehicle for the platform work (ci/cd, observability, on-call) as much as a technical change. 5. split the data last and explicitly. the database is the hard part. sequence: stop cross-module joins in code, move to an api call, then separate the schema, then the instance. where both sides need the data, use change data capture or events to maintain a read model rather than a shared table. 6. keep both paths live behind a feature flag with dual-run and comparison (shadow traffic to the new service, compare outputs, do not serve them) until confidence is high. this is what makes it genuinely non-big-bang. 7. invest in the platform in parallel - pipelines, tracing, service templates - because extraction without it produces a distributed monolith that is worse than what you started with. reflect. the failure mode i would call out: extracting services while the shared database remains, producing services that must deploy together and cannot fail independently. that is all of the cost and none of the benefit, and it is the most common outcome of these programmes. i would define a checkpoint after the second service to honestly reassess whether the metric is moving. your hook: a migration you led - the driver, the sequencing, the metric that improved, and what you would sequence differently."}, {"n": 239, "category": 14, "difficulty": "A", "html": "Design a document search feature combining keyword and semantic search.", "answerTitle": "Hybrid keyword and semantic document search", "answer": "<p><strong>Clarify.<\/strong> Corpus size and growth? Document types and structure? Query latency requirement? Are results access-controlled per user, and is the control per document or per section? How fresh must the index be after a document changes? Is this a search box, or the retrieval half of a RAG feature?<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Hybrid retrieval, not either alone.<\/strong> BM25 catches exact terms, product codes, names and negation, which dense vectors handle poorly; embeddings catch paraphrase and intent, which BM25 misses. Run both and fuse with reciprocal rank fusion. This is the answer, and knowing <em>why<\/em> each fails alone is the substance.<\/li><li><strong>Rerank<\/strong> the fused top ~50 with a cross-encoder down to the top 5-10. This is usually the single largest quality gain per unit of effort, at the cost of latency - so it is applied to a small candidate set, never the whole corpus.<\/li><li><strong>Chunking<\/strong> per Q224: structure-aware, 200-500 tokens with overlap, metadata attached, small-to-big retrieval where the matched chunk brings its parent section along.<\/li><li><strong>Access control at query time<\/strong>, as a pre-filter on the vector and lexical queries - never post-filtering, which both leaks (via result counts and latency) and breaks top-k. In a multi-tenant system this is a security control, not a feature.<\/li><li><strong>Store<\/strong>: OpenSearch handles both lexical and vector in one system, which avoids operating two stores and keeps fusion simple; pgvector plus Postgres full-text is a good choice when the corpus is moderate and Postgres is already there. A dedicated vector database earns its place at large scale or with demanding filtering.<\/li><li><strong>Indexing pipeline<\/strong>: change detection, extraction (PDF, HTML, Office), chunking, embedding, and upsert - idempotent and resumable, with the embedding model version stored per vector so a model change triggers a controlled re-index rather than a silently mixed index.<\/li><\/ul><p><strong>Evaluation.<\/strong> A labelled query set with recall@k and NDCG, run in CI on any change to chunking, model or fusion weights. Without it, tuning search is guesswork - and search quality regressions are invisible until users complain.<\/p>", "source": "scenario-questions.md (S18)", "search": "design a document search feature combining keyword and semantic search. clarify. corpus size and growth? document types and structure? query latency requirement? are results access-controlled per user, and is the control per document or per section? how fresh must the index be after a document changes? is this a search box, or the retrieval half of a rag feature? key decisions. - hybrid retrieval, not either alone. bm25 catches exact terms, product codes, names and negation, which dense vectors handle poorly; embeddings catch paraphrase and intent, which bm25 misses. run both and fuse with reciprocal rank fusion. this is the answer, and knowing why each fails alone is the substance. - rerank the fused top ~50 with a cross-encoder down to the top 5-10. this is usually the single largest quality gain per unit of effort, at the cost of latency - so it is applied to a small candidate set, never the whole corpus. - chunking per q224: structure-aware, 200-500 tokens with overlap, metadata attached, small-to-big retrieval where the matched chunk brings its parent section along. - access control at query time , as a pre-filter on the vector and lexical queries - never post-filtering, which both leaks (via result counts and latency) and breaks top-k. in a multi-tenant system this is a security control, not a feature. - store : opensearch handles both lexical and vector in one system, which avoids operating two stores and keeps fusion simple; pgvector plus postgres full-text is a good choice when the corpus is moderate and postgres is already there. a dedicated vector database earns its place at large scale or with demanding filtering. - indexing pipeline : change detection, extraction (pdf, html, office), chunking, embedding, and upsert - idempotent and resumable, with the embedding model version stored per vector so a model change triggers a controlled re-index rather than a silently mixed index. evaluation. a labelled query set with recall@k and ndcg, run in ci on any change to chunking, model or fusion weights. without it, tuning search is guesswork - and search quality regressions are invisible until users complain."}, {"n": 240, "category": 14, "difficulty": "A", "html": "Design a multi-tenant SaaS platform, covering data isolation and noisy neighbours.", "answerTitle": "Multi-tenant SaaS with isolation and noisy neighbours", "answer": "<p><strong>Clarify.<\/strong> How many tenants, and what is the size distribution - a long tail of small tenants plus a few enormous ones changes everything. What are the compliance and data residency requirements? Is per-tenant customization required? What is the pricing model, since it determines whether per-tenant cost attribution is needed?<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Isolation model<\/strong>, the central choice: shared database with a tenant column (cheapest, densest, highest blast radius from a bug); schema per tenant (better isolation, migration complexity grows with tenant count); database per tenant (strongest isolation and easiest per-tenant restore and residency, most expensive and operationally heaviest). My usual recommendation is a <strong>tiered<\/strong> model - pooled for the long tail, dedicated for enterprise and regulated tenants - which matches cost to willingness to pay and is what most mature SaaS converges on.<\/li><li><strong>Enforce isolation at the lowest layer possible<\/strong> per Q155: Postgres row-level security or a global Hibernate filter, so a developer who forgets the predicate still cannot leak. Tenant identity comes from the token, never from a request parameter.<\/li><li><strong>Tenant in everything<\/strong>: cache keys, queue messages, log lines, metrics labels, trace attributes, S3 prefixes, and file names. Every one of these has been a real leak in some product.<\/li><li><strong>Noisy neighbours<\/strong>: per-tenant rate limits and quotas; bounded concurrency per tenant so one cannot consume the whole pool; separate queues or priority lanes for large tenants; connection pool partitioning; and query cost limits (statement timeouts) so one tenant&#x27;s expensive query cannot saturate the database. Detect it with per-tenant metrics - without per-tenant instrumentation, noisy-neighbour incidents are undiagnosable.<\/li><li><strong>Onboarding and offboarding as automated flows<\/strong>, including provisioning, migration and complete deletion, because manual tenant management does not survive growth and GDPR erasure has a deadline.<\/li><li><strong>Migrations across thousands of tenants<\/strong>: a controlled rollout with per-tenant progress tracking and the ability to pause, not a single script.<\/li><\/ul><p><strong>Cost.<\/strong> Per-tenant cost attribution through tagging and metrics, because at some point someone will ask which customers are unprofitable, and being able to answer changes the business conversation.<\/p>", "source": "scenario-questions.md (S19)", "search": "design a multi-tenant saas platform, covering data isolation and noisy neighbours. clarify. how many tenants, and what is the size distribution - a long tail of small tenants plus a few enormous ones changes everything. what are the compliance and data residency requirements? is per-tenant customization required? what is the pricing model, since it determines whether per-tenant cost attribution is needed? key decisions. - isolation model , the central choice: shared database with a tenant column (cheapest, densest, highest blast radius from a bug); schema per tenant (better isolation, migration complexity grows with tenant count); database per tenant (strongest isolation and easiest per-tenant restore and residency, most expensive and operationally heaviest). my usual recommendation is a tiered model - pooled for the long tail, dedicated for enterprise and regulated tenants - which matches cost to willingness to pay and is what most mature saas converges on. - enforce isolation at the lowest layer possible per q155: postgres row-level security or a global hibernate filter, so a developer who forgets the predicate still cannot leak. tenant identity comes from the token, never from a request parameter. - tenant in everything : cache keys, queue messages, log lines, metrics labels, trace attributes, s3 prefixes, and file names. every one of these has been a real leak in some product. - noisy neighbours : per-tenant rate limits and quotas; bounded concurrency per tenant so one cannot consume the whole pool; separate queues or priority lanes for large tenants; connection pool partitioning; and query cost limits (statement timeouts) so one tenant's expensive query cannot saturate the database. detect it with per-tenant metrics - without per-tenant instrumentation, noisy-neighbour incidents are undiagnosable. - onboarding and offboarding as automated flows , including provisioning, migration and complete deletion, because manual tenant management does not survive growth and gdpr erasure has a deadline. - migrations across thousands of tenants : a controlled rollout with per-tenant progress tracking and the ability to pause, not a single script. cost. per-tenant cost attribution through tagging and metrics, because at some point someone will ask which customers are unprofitable, and being able to answer changes the business conversation."}, {"n": 241, "category": 14, "difficulty": "A", "html": "Design a feature flag and experimentation platform.", "answerTitle": "Feature flag and experimentation platform", "answer": "<p><strong>Clarify.<\/strong> Is this flags only, or A/B experiments with statistical analysis? How many flags and evaluations per second? Is evaluation server-side, client-side, or both? Do we need targeting rules by user attribute? Who changes flags - engineers only, or product managers? Is buy-versus-build on the table (it usually should be)?<\/p><p><strong>A principal-level answer starts by questioning the build.<\/strong> LaunchDarkly, Unleash and similar are mature and cheap relative to engineering time, so I would want a specific reason to build - data residency, extreme scale, or deep integration. Saying that first, then designing anyway, is the right order.<\/p><p><strong>Key decisions.<\/strong><\/p><ul><li><strong>Evaluation happens locally, in-process.<\/strong> The SDK holds the full ruleset in memory and evaluates with zero network calls, so a flag check is nanoseconds and the platform being down cannot break the application. Rules are pushed via SSE or streaming, with polling as a fallback and a bundled default so a cold start with no connectivity still works. This is the single most important design property, and candidates who put a network call in the evaluation path have designed an outage.<\/li><li><strong>Deterministic bucketing<\/strong>: <code>hash(flagKey + userId) % 100<\/code> so the same user always gets the same variant across services and sessions, without coordination. Including the flag key means a user is not correlated across experiments.<\/li><li><strong>Targeting rules<\/strong>: percentage rollout, attribute-based segments, individual overrides, and a kill switch that bypasses everything.<\/li><li><strong>Events for analysis<\/strong>: emit an exposure event on evaluation (sampled, because at high volume this is the expensive part) joined against outcome metrics for experiment analysis.<\/li><li><strong>Statistics done properly<\/strong> if experiments are in scope: pre-registered metrics and minimum detectable effect, sample size calculation, sequential testing or a fixed horizon to avoid peeking, guardrail metrics that stop a harmful experiment automatically, and a stated approach to multiple comparisons. Getting this wrong produces confident wrong decisions, which is worse than no experimentation.<\/li><li><strong>Governance<\/strong>: audit log of every flag change with actor and reason, approval for production-critical flags, an owner and expiry date per flag, and automated nagging for stale flags. Flag debt is the real long-term cost - a codebase with 400 permanent flags has 2^400 configurations and no one can reason about it.<\/li><\/ul><p><strong>Failure modes.<\/strong> Default values must be safe (the flag off, the old behavior); a corrupt ruleset must not be applied; and flag evaluation must never throw. The platform is in the critical path of every service, so it needs a higher availability target than its consumers - or, better, an architecture where its unavailability is invisible, which is what local evaluation buys.<\/p>", "source": "scenario-questions.md (S20)", "search": "design a feature flag and experimentation platform. clarify. is this flags only, or a/b experiments with statistical analysis? how many flags and evaluations per second? is evaluation server-side, client-side, or both? do we need targeting rules by user attribute? who changes flags - engineers only, or product managers? is buy-versus-build on the table (it usually should be)? a principal-level answer starts by questioning the build. launchdarkly, unleash and similar are mature and cheap relative to engineering time, so i would want a specific reason to build - data residency, extreme scale, or deep integration. saying that first, then designing anyway, is the right order. key decisions. - evaluation happens locally, in-process. the sdk holds the full ruleset in memory and evaluates with zero network calls, so a flag check is nanoseconds and the platform being down cannot break the application. rules are pushed via sse or streaming, with polling as a fallback and a bundled default so a cold start with no connectivity still works. this is the single most important design property, and candidates who put a network call in the evaluation path have designed an outage. - deterministic bucketing : hash(flagkey + userid) % 100 so the same user always gets the same variant across services and sessions, without coordination. including the flag key means a user is not correlated across experiments. - targeting rules : percentage rollout, attribute-based segments, individual overrides, and a kill switch that bypasses everything. - events for analysis : emit an exposure event on evaluation (sampled, because at high volume this is the expensive part) joined against outcome metrics for experiment analysis. - statistics done properly if experiments are in scope: pre-registered metrics and minimum detectable effect, sample size calculation, sequential testing or a fixed horizon to avoid peeking, guardrail metrics that stop a harmful experiment automatically, and a stated approach to multiple comparisons. getting this wrong produces confident wrong decisions, which is worse than no experimentation. - governance : audit log of every flag change with actor and reason, approval for production-critical flags, an owner and expiry date per flag, and automated nagging for stale flags. flag debt is the real long-term cost - a codebase with 400 permanent flags has 2^400 configurations and no one can reason about it. failure modes. default values must be safe (the flag off, the old behavior); a corrupt ruleset must not be applied; and flag evaluation must never throw. the platform is in the critical path of every service, so it needs a higher availability target than its consumers - or, better, an architecture where its unavailability is invisible, which is what local evaluation buys."}, {"n": 242, "category": 15, "difficulty": null, "html": "Walk me through your 19-year career in four minutes.", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or <script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STORE = "java-interview-progress-v1";
  var THEME_KEY = "interview-quiz-theme";
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { progress = {}; }

  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var searchBox = document.getElementById("search");
  var categoryBox = document.getElementById("category");
  var statusBox = document.getElementById("status");
  var activeDifficulty = new Set();

  var catTitle = {};
  DATA.categories.forEach(function (c) {
    catTitle[c.index] = c.index + ". " + c.title;
    var opt = document.createElement("option");
    opt.value = c.index;
    opt.textContent = catTitle[c.index];
    categoryBox.appendChild(opt);
  });

  var legend = document.getElementById("legend");
  var diffFilters = document.getElementById("diffFilters");
  Object.keys(DATA.difficulty).forEach(function (key) {
    var span = document.createElement("span");
    span.className = "pill " + key;
    span.textContent = DATA.difficulty[key];
    span.title = DATA.difficultyHint[key];
    legend.appendChild(span);

    var btn = document.createElement("button");
    btn.textContent = DATA.difficulty[key];
    btn.dataset.diff = key;
    btn.addEventListener("click", function () {
      if (activeDifficulty.has(key)) { activeDifficulty.delete(key); btn.classList.remove("on"); }
      else { activeDifficulty.add(key); btn.classList.add("on"); }
      render();
    });
    diffFilters.appendChild(btn);
  });

  var KEYWORDS = /\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|record|return|sealed|short|static|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while|yield|true|false|null)\b/g;

  function highlight(root) {
    root.querySelectorAll("pre code").forEach(function (block) {
      var text = block.textContent;
      var slots = [];
      function keep(cls) {
        return function (m) { slots.push('<span class="' + cls + '">' + esc(m) + "</span>"); return "\u0000" + (slots.length - 1) + "\u0000"; };
      }
      text = text.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, keep("tok-com"));
      text = text.replace(/"(?:\\.|[^"\\])*"/g, keep("tok-str"));
      text = text.replace(/@\w+/g, keep("tok-ann"));
      text = esc(text).replace(KEYWORDS, '<span class="tok-kw">$&</span>');
      block.innerHTML = text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return slots[+i]; });
    });
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function markHits(root, term) {
    if (!term) return;
    var rx = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.trim() && rx.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
      rx.lastIndex = 0;
    }
    nodes.forEach(function (node) {
      var span = document.createElement("span");
      span.innerHTML = esc(node.nodeValue).replace(rx, "<mark>$1</mark>");
      node.parentNode.replaceChild(span, node);
    });
  }

  function statusOf(n) { return progress[n] || "unseen"; }

  function setStatus(n, value) {
    if (statusOf(n) === value) delete progress[n]; else progress[n] = value;
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    render();
  }

  function card(q, term) {
    var el = document.createElement("article");
    el.className = "q";
    el.id = "q" + q.n;
    el.dataset.status = statusOf(q.n);

    var head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML =
      '<a class="q-num" href="#q' + q.n + '">Q' + q.n + "</a>" +
      (q.difficulty ? '<span class="pill ' + q.difficulty + '" title="' + DATA.difficultyHint[q.difficulty] + '">' + DATA.difficulty[q.difficulty] + "</span>" : "") +
      '<h3 class="q-text">' + q.html + "</h3>";
    el.appendChild(head);

    var actions = document.createElement("div");
    actions.className = "q-actions";
    [["known", "Known"], ["review", "Review"]].forEach(function (pair) {
      var b = document.createElement("button");
      b.textContent = pair[1];
      if (statusOf(q.n) === pair[0]) b.classList.add("on");
      b.addEventListener("click", function () { setStatus(q.n, pair[0]); });
      actions.appendChild(b);
    });
    if (q.source) {
      var src = document.createElement("span");
      src.className = "src";
      src.textContent = q.source;
      actions.appendChild(src);
    }
    el.appendChild(actions);

    var details = document.createElement("details");
    details.className = "ans";
    var summary = document.createElement("summary");
    summary.textContent = q.source ? "Show answer" : "How to answer this";
    details.appendChild(summary);

    var body = document.createElement("div");
    body.className = "ans-body";
    body.innerHTML = '<p class="ans-title">' + esc(q.answerTitle) + '</p><div class="md">' + q.answer + "</div>";
    details.appendChild(body);
    el.appendChild(details);

    var rendered = false;
    details.addEventListener("toggle", function () {
      if (details.open && !rendered) { rendered = true; highlight(body); markHits(body, term); }
    });

    return el;
  }

  function render() {
    var term = searchBox.value.trim().toLowerCase();
    var cat = categoryBox.value;
    var status = statusBox.value;

    var matches = DATA.questions.filter(function (q) {
      if (term && q.search.indexOf(term) === -1) return false;
      if (cat && String(q.category) !== cat) return false;
      if (activeDifficulty.size && !activeDifficulty.has(q.difficulty)) return false;
      if (status && statusOf(q.n) !== status) return false;
      return true;
    });

    list.textContent = "";
    var lastCategory = null;
    matches.forEach(function (q) {
      if (q.category !== lastCategory) {
        lastCategory = q.category;
        var h = document.createElement("h2");
        h.className = "cat";
        h.textContent = catTitle[q.category];
        list.appendChild(h);
      }
      list.appendChild(card(q, term));
    });

    empty.hidden = matches.length > 0;

    var total = DATA.questions.length;
    var known = 0, review = 0;
    DATA.questions.forEach(function (q) {
      if (statusOf(q.n) === "known") known++;
      else if (statusOf(q.n) === "review") review++;
    });
    document.getElementById("barKnown").style.width = (known / total * 100) + "%";
    document.getElementById("barReview").style.width = (review / total * 100) + "%";
    document.getElementById("stats").innerHTML =
      "<b>" + matches.length + "</b> shown of " + total + " &nbsp;·&nbsp; " +
      "<b>" + known + "</b> known &nbsp;·&nbsp; <b>" + review + "</b> to review &nbsp;·&nbsp; " +
      "<b>" + (total - known - review) + "</b> not marked";
  }

  searchBox.addEventListener("input", render);
  categoryBox.addEventListener("change", render);
  statusBox.addEventListener("change", render);

  document.getElementById("expandAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = true; });
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = false; });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all Known / Review marks?")) return;
    progress = {};
    try { localStorage.removeItem(STORE); } catch (e) {}
    render();
  });

  var themeBtn = document.getElementById("theme");
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  applyTheme(savedTheme || "dark");
  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
    if (e.key === "Escape" && document.activeElement === searchBox) { searchBox.value = ""; render(); searchBox.blur(); }
  });

  render();

  if (location.hash) {
    var target = document.querySelector(location.hash);
    if (target) { target.scrollIntoView(); var d = target.querySelector("details.ans"); if (d) d.open = true; }
  }
})();
</script>
</body>
