riable you get a data race, and even with an atomicinteger the order of invocation is unspecified, so an index-assigning lambda produces different results per run. restructure to carry state in the element, or collect to an ordered result and post-process."}, {"n": 56, "category": 3, "difficulty": "D", "html": "<code>Collectors.groupingBy<\/code> with a downstream collector - write one for counting and one for averaging.", "answerTitle": "`groupingBy` with downstream", "answer": "<pre><code class=\"lang-java\">Map&lt;Dept, Long&gt; counts =\n    emps.stream().collect(groupingBy(Employee::dept, counting()));\n\nMap&lt;Dept, Double&gt; avgSalary =\n    emps.stream().collect(groupingBy(Employee::dept, averagingDouble(Employee::salary)));<\/code><\/pre><p>Worth knowing the other downstreams: <code>mapping<\/code>, <code>filtering<\/code>, <code>reducing<\/code>, <code>teeing<\/code>, and the three-argument form that lets you choose <code>TreeMap::new<\/code> for a sorted result.<\/p>", "source": "answers.md", "search": "collectors.groupingby with a downstream collector - write one for counting and one for averaging. java map<dept, long counts = emps.stream().collect(groupingby(employee::dept, counting())); map<dept, double avgsalary = emps.stream().collect(groupingby(employee::dept, averagingdouble(employee::salary))); worth knowing the other downstreams: mapping, filtering, reducing, teeing, and the three-argument form that lets you choose treemap::new for a sorted result."}, {"n": 57, "category": 3, "difficulty": "C", "html": "What is a functional interface? Name the core ones in <code>java.util.function<\/code>.", "answerTitle": "Functional interfaces", "answer": "<p>An interface with exactly one abstract method; <code>@FunctionalInterface<\/code> makes the compiler enforce it. <code>default<\/code> and <code>static<\/code> methods do not count, nor do public <code>Object<\/code> methods like <code>equals<\/code>.<\/p><p>Core set: <code>Function&lt;T,R&gt;<\/code>, <code>BiFunction<\/code>, <code>Supplier&lt;T&gt;<\/code>, <code>Consumer&lt;T&gt;<\/code>, <code>BiConsumer<\/code>, <code>Predicate&lt;T&gt;<\/code>, <code>BiPredicate<\/code>, <code>UnaryOperator&lt;T&gt;<\/code>, <code>BinaryOperator&lt;T&gt;<\/code>, plus the primitive specializations (<code>IntFunction<\/code>, <code>ToIntFunction<\/code>, <code>IntPredicate<\/code>) that exist purely to avoid boxing.<\/p>", "source": "answers.md", "search": "what is a functional interface? name the core ones in java.util.function. an interface with exactly one abstract method; @functionalinterface makes the compiler enforce it. default and static methods do not count, nor do public object methods like equals. core set: function<t,r , bifunction, supplier<t , consumer<t , biconsumer, predicate<t , bipredicate, unaryoperator<t , binaryoperator<t , plus the primitive specializations (intfunction, tointfunction, intpredicate) that exist purely to avoid boxing."}, {"n": 58, "category": 3, "difficulty": "D", "html": "Method references: four kinds. Give an example of each.", "answerTitle": "Method references", "answer": "<ol><li>Static: <code>Integer::parseInt<\/code><\/li><li>Bound instance: <code>System.out::println<\/code><\/li><li>Unbound instance of an arbitrary object: <code>String::toLowerCase<\/code><\/li><li>Constructor: <code>ArrayList::new<\/code><\/li><\/ol><p>The subtle one is 3 - the receiver becomes the first parameter, so <code>String::compareTo<\/code> is a <code>BiFunction&lt;String,String,Integer&gt;<\/code>.<\/p>", "source": "answers.md", "search": "method references: four kinds. give an example of each. 1. static: integer::parseint 2. bound instance: system.out::println 3. unbound instance of an arbitrary object: string::tolowercase 4. constructor: arraylist::new the subtle one is 3 - the receiver becomes the first parameter, so string::compareto is a bifunction<string,string,integer ."}, {"n": 59, "category": 3, "difficulty": "T", "html": "Effectively final - why must lambdas capture effectively final variables, and what is the underlying reason?", "answerTitle": "Effectively final", "answer": "<p>A lambda captures the <em>value<\/em> of a local variable, not the variable itself, because locals live on the stack of a frame that may have exited by the time the lambda runs. Allowing mutation would create two divergent copies with no defined semantics - and would be a data race if the lambda runs on another thread.<\/p><p>Instance and static fields are captured by reference (via <code>this<\/code>), so they <em>can<\/em> be mutated - which is exactly why an inner-class lambda can accidentally leak or race on enclosing state. Workaround when you truly need a mutable counter: an <code>AtomicInteger<\/code> or a one-element array, though usually that means you should be using <code>reduce<\/code> or <code>collect<\/code>.<\/p>", "source": "answers.md", "search": "effectively final - why must lambdas capture effectively final variables, and what is the underlying reason? a lambda captures the value of a local variable, not the variable itself, because locals live on the stack of a frame that may have exited by the time the lambda runs. allowing mutation would create two divergent copies with no defined semantics - and would be a data race if the lambda runs on another thread. instance and static fields are captured by reference (via this), so they can be mutated - which is exactly why an inner-class lambda can accidentally leak or race on enclosing state. workaround when you truly need a mutable counter: an atomicinteger or a one-element array, though usually that means you should be using reduce or collect."}, {"n": 60, "category": 3, "difficulty": "D", "html": "How do you handle checked exceptions inside lambdas cleanly?", "answerTitle": "Checked exceptions in lambdas", "answer": "<p>Standard functional interfaces do not declare checked exceptions, so you must either handle inline (which is noisy), or define your own throwing interface and a wrapper:<\/p><pre><code class=\"lang-java\">@FunctionalInterface interface ThrowingFunction&lt;T,R,E extends Exception&gt; { R apply(T t) throws E; }\n\nstatic &lt;T,R&gt; Function&lt;T,R&gt; unchecked(ThrowingFunction&lt;T,R,Exception&gt; f) {\n    return t -&gt; { try { return f.apply(t); } catch (Exception e) { throw new UncheckedException(e); } };\n}<\/code><\/pre><p>Practical stance: at the boundary, wrap into a domain <code>RuntimeException<\/code> with the cause preserved. Never <code>catch (Exception e) { return null; }<\/code> inside a <code>map<\/code>.<\/p>", "source": "answers.md", "search": "how do you handle checked exceptions inside lambdas cleanly? standard functional interfaces do not declare checked exceptions, so you must either handle inline (which is noisy), or define your own throwing interface and a wrapper: java @functionalinterface interface throwingfunction<t,r,e extends exception { r apply(t t) throws e; } static <t,r function<t,r unchecked(throwingfunction<t,r,exception f) { return t - { try { return f.apply(t); } catch (exception e) { throw new uncheckedexception(e); } }; } practical stance: at the boundary, wrap into a domain runtimeexception with the cause preserved. never catch (exception e) { return null; } inside a map."}, {"n": 61, "category": 4, "difficulty": "C", "html": "Thread lifecycle states in Java. What is the difference between <code>WAITING<\/code> and <code>TIMED_WAITING<\/code>?", "answerTitle": "Thread states", "answer": "<p><code>NEW<\/code>, <code>RUNNABLE<\/code> (includes running and ready, and confusingly also blocked on IO), <code>BLOCKED<\/code> (waiting for a monitor lock), <code>WAITING<\/code> (<code>wait()<\/code>, <code>join()<\/code>, <code>park()<\/code> with no timeout), <code>TIMED_WAITING<\/code> (same with a timeout, plus <code>sleep<\/code>), <code>TERMINATED<\/code>.<\/p><p>In a thread dump: many <code>BLOCKED<\/code> threads point at lock contention; many <code>WAITING<\/code> on a pool queue is normal idling; many <code>RUNNABLE<\/code> inside socket reads means a slow downstream, not CPU load.<\/p>", "source": "answers.md", "search": "thread lifecycle states in java. what is the difference between waiting and timed_waiting? new, runnable (includes running and ready, and confusingly also blocked on io), blocked (waiting for a monitor lock), waiting (wait(), join(), park() with no timeout), timed_waiting (same with a timeout, plus sleep), terminated. in a thread dump: many blocked threads point at lock contention; many waiting on a pool queue is normal idling; many runnable inside socket reads means a slow downstream, not cpu load."}, {"n": 62, "category": 4, "difficulty": "D", "html": "Explain the Java Memory Model: happens-before, visibility, reordering.", "answerTitle": "Java Memory Model", "answer": "<p>The JMM defines when a write by one thread becomes visible to another. Without synchronization, the compiler, JIT and CPU may reorder and cache freely, so there is no visibility guarantee at all.<\/p><p><code>happens-before<\/code> is the ordering relation: program order within a thread; monitor unlock happens-before subsequent lock of the same monitor; a <code>volatile<\/code> write happens-before every subsequent read of that field; <code>Thread.start()<\/code> happens-before anything in that thread; anything in a thread happens-before another thread&#x27;s successful <code>join()<\/code>; <code>final<\/code> field initialization happens-before publication of a properly constructed object.<\/p>", "source": "answers.md", "search": "explain the java memory model: happens-before, visibility, reordering. the jmm defines when a write by one thread becomes visible to another. without synchronization, the compiler, jit and cpu may reorder and cache freely, so there is no visibility guarantee at all. happens-before is the ordering relation: program order within a thread; monitor unlock happens-before subsequent lock of the same monitor; a volatile write happens-before every subsequent read of that field; thread.start() happens-before anything in that thread; anything in a thread happens-before another thread's successful join(); final field initialization happens-before publication of a properly constructed object."}, {"n": 63, "category": 4, "difficulty": "C", "html": "<code>volatile<\/code> - what it guarantees and what it does not.", "answerTitle": "`volatile`", "answer": "<p>Guarantees: visibility (reads always see the latest write, no caching in registers) and ordering (a memory barrier prevents reordering across the access, so writes made <em>before<\/em> the volatile write are visible to a thread that reads it).<\/p><p>Does not guarantee: atomicity of compound operations. It is right for a <code>stop<\/code> flag or a safely-published immutable reference; it is wrong for counters.<\/p>", "source": "answers.md", "search": "volatile - what it guarantees and what it does not. guarantees: visibility (reads always see the latest write, no caching in registers) and ordering (a memory barrier prevents reordering across the access, so writes made before the volatile write are visible to a thread that reads it). does not guarantee: atomicity of compound operations. it is right for a stop flag or a safely-published immutable reference; it is wrong for counters."}, {"n": 64, "category": 4, "difficulty": "T", "html": "Is <code>volatile int count; count++<\/code> thread-safe? Explain precisely why not.", "answerTitle": "`volatile` increment", "answer": "<p>Not thread-safe. <code>count++<\/code> is read-modify-write: three separate bytecode steps. Two threads can both read 5, both write 6, and one increment is lost. <code>volatile<\/code> fixes visibility of each individual read and write but cannot make the triple atomic.<\/p><p>Fixes: <code>AtomicInteger.incrementAndGet()<\/code> (CAS), <code>LongAdder<\/code> under high contention, or a lock.<\/p>", "source": "answers.md", "search": "is volatile int count; count++ thread-safe? explain precisely why not. not thread-safe. count++ is read-modify-write: three separate bytecode steps. two threads can both read 5, both write 6, and one increment is lost. volatile fixes visibility of each individual read and write but cannot make the triple atomic. fixes: atomicinteger.incrementandget() (cas), longadder under high contention, or a lock."}, {"n": 65, "category": 4, "difficulty": "D", "html": "<code>synchronized<\/code> versus <code>ReentrantLock<\/code>. What does <code>ReentrantLock<\/code> give you that <code>synchronized<\/code> cannot?", "answerTitle": "`synchronized` versus `ReentrantLock`", "answer": "<p>Both are reentrant and mutually exclusive. <code>synchronized<\/code> is simpler, JVM-managed, releases automatically on exception, and benefits from biased/thin lock optimizations.<\/p><p><code>ReentrantLock<\/code> adds: <code>tryLock()<\/code> with and without timeout (essential for deadlock avoidance), interruptible acquisition, an optional fair ordering policy, multiple <code>Condition<\/code> objects on one lock, and the ability to lock and unlock in different scopes. Cost is that you must <code>unlock()<\/code> in a <code>finally<\/code>. And on virtual threads, <code>ReentrantLock<\/code> does not pin the carrier thread while <code>synchronized<\/code> does.<\/p>", "source": "answers.md", "search": "synchronized versus reentrantlock. what does reentrantlock give you that synchronized cannot? both are reentrant and mutually exclusive. synchronized is simpler, jvm-managed, releases automatically on exception, and benefits from biased/thin lock optimizations. reentrantlock adds: trylock() with and without timeout (essential for deadlock avoidance), interruptible acquisition, an optional fair ordering policy, multiple condition objects on one lock, and the ability to lock and unlock in different scopes. cost is that you must unlock() in a finally. and on virtual threads, reentrantlock does not pin the carrier thread while synchronized does."}, {"n": 66, "category": 4, "difficulty": "D", "html": "Explain <code>ReadWriteLock<\/code> and <code>StampedLock<\/code>, and when optimistic reads pay off.", "answerTitle": "`ReadWriteLock` and `StampedLock`", "answer": "<p><code>ReentrantReadWriteLock<\/code> lets concurrent readers share, while writers are exclusive. It only pays off when reads greatly outnumber writes and critical sections are long enough to amortize the higher bookkeeping cost; under write pressure it can be slower than a plain lock, and readers can starve writers without the fair policy.<\/p><p><code>StampedLock<\/code> adds an optimistic read: take a stamp, read fields, then <code>validate(stamp)<\/code> - if a writer intervened, fall back to a real read lock. It is faster but not reentrant and not directly usable with <code>Condition<\/code>, so it is easy to misuse.<\/p>", "source": "answers.md", "search": "explain readwritelock and stampedlock, and when optimistic reads pay off. reentrantreadwritelock lets concurrent readers share, while writers are exclusive. it only pays off when reads greatly outnumber writes and critical sections are long enough to amortize the higher bookkeeping cost; under write pressure it can be slower than a plain lock, and readers can starve writers without the fair policy. stampedlock adds an optimistic read: take a stamp, read fields, then validate(stamp) - if a writer intervened, fall back to a real read lock. it is faster but not reentrant and not directly usable with condition, so it is easy to misuse."}, {"n": 67, "category": 4, "difficulty": "C", "html": "<code>wait()<\/code>, <code>notify()<\/code>, <code>notifyAll()<\/code> - why must they be called inside a synchronized block?", "answerTitle": "`wait`/`notify` inside `synchronized`", "answer": "<p>Because they operate on the object&#x27;s monitor, and the JVM throws <code>IllegalMonitorStateException<\/code> otherwise. Deeper reason: without holding the lock there is a lost-wakeup race - the condition could change and <code>notify<\/code> could fire between your condition check and your <code>wait()<\/code>, and you would sleep forever. Holding the monitor makes check-and-wait atomic.<\/p><p>Prefer <code>notifyAll()<\/code> unless you can prove all waiters are interchangeable, because <code>notify()<\/code> may wake a thread waiting on a different condition and lose the signal.<\/p>", "source": "answers.md", "search": "wait(), notify(), notifyall() - why must they be called inside a synchronized block? because they operate on the object's monitor, and the jvm throws illegalmonitorstateexception otherwise. deeper reason: without holding the lock there is a lost-wakeup race - the condition could change and notify could fire between your condition check and your wait(), and you would sleep forever. holding the monitor makes check-and-wait atomic. prefer notifyall() unless you can prove all waiters are interchangeable, because notify() may wake a thread waiting on a different condition and lose the signal."}, {"n": 68, "category": 4, "difficulty": "T", "html": "Why must <code>wait()<\/code> always be called in a loop rather than an <code>if<\/code>?", "answerTitle": "`wait()` in a loop", "answer": "<p>Three reasons: spurious wakeups are permitted by the specification; <code>notifyAll<\/code> wakes every waiter, but only one may proceed; and another thread may consume the condition between your wakeup and your reacquiring the lock. So the condition must be rechecked:<\/p><pre><code class=\"lang-java\">synchronized (lock) {\n    while (!condition) { lock.wait(); }\n    // proceed\n}<\/code><\/pre>", "source": "answers.md", "search": "why must wait() always be called in a loop rather than an if? three reasons: spurious wakeups are permitted by the specification; notifyall wakes every waiter, but only one may proceed; and another thread may consume the condition between your wakeup and your reacquiring the lock. so the condition must be rechecked: java synchronized (lock) { while (!condition) { lock.wait(); } // proceed }"}, {"n": 69, "category": 4, "difficulty": "D", "html": "Explain the executor framework: core pool size, max pool size, queue, rejection policy, and how they interact.", "answerTitle": "Executor framework", "answer": "<p>Submission logic in order: if fewer than <code>corePoolSize<\/code> threads exist, create a new thread even if others are idle; else try to enqueue; if the queue is full, create threads up to <code>maxPoolSize<\/code>; if that fails too, apply the <code>RejectedExecutionHandler<\/code> (<code>AbortPolicy<\/code> default, plus <code>CallerRunsPolicy<\/code>, <code>DiscardPolicy<\/code>, <code>DiscardOldestPolicy<\/code>).<\/p><p><code>CallerRunsPolicy<\/code> is the underrated one: it applies backpressure by making the submitting thread do the work, which throttles the producer instead of dropping requests.<\/p>", "source": "answers.md", "search": "explain the executor framework: core pool size, max pool size, queue, rejection policy, and how they interact. submission logic in order: if fewer than corepoolsize threads exist, create a new thread even if others are idle; else try to enqueue; if the queue is full, create threads up to maxpoolsize; if that fails too, apply the rejectedexecutionhandler (abortpolicy default, plus callerrunspolicy, discardpolicy, discardoldestpolicy). callerrunspolicy is the underrated one: it applies backpressure by making the submitting thread do the work, which throttles the producer instead of dropping requests."}, {"n": 70, "category": 4, "difficulty": "T", "html": "You configure a <code>ThreadPoolExecutor<\/code> with core 10, max 100 and an unbounded <code>LinkedBlockingQueue<\/code>. Why will the pool never grow beyond 10?", "answerTitle": "Pool never grows past core", "answer": "<p>An unbounded queue never becomes full, and <code>maxPoolSize<\/code> is only consulted when enqueueing fails. So <code>maxPoolSize<\/code> is dead configuration, and the queue grows until you run out of heap - a latency problem that turns into an <code>OutOfMemoryError<\/code>.<\/p><p>Fix: use a bounded queue sized deliberately, plus a rejection policy. This is exactly why <code>Executors.newFixedThreadPool<\/code> is discouraged and you should construct <code>ThreadPoolExecutor<\/code> directly.<\/p>", "source": "answers.md", "search": "you configure a threadpoolexecutor with core 10, max 100 and an unbounded linkedblockingqueue. why will the pool never grow beyond 10? an unbounded queue never becomes full, and maxpoolsize is only consulted when enqueueing fails. so maxpoolsize is dead configuration, and the queue grows until you run out of heap - a latency problem that turns into an outofmemoryerror. fix: use a bounded queue sized deliberately, plus a rejection policy. this is exactly why executors.newfixedthreadpool is discouraged and you should construct threadpoolexecutor directly."}, {"n": 71, "category": 4, "difficulty": "D", "html": "How do you size a thread pool for CPU-bound versus IO-bound work?", "answerTitle": "Pool sizing", "answer": "<p>CPU-bound: threads ≈ number of cores (plus one to cover occasional page faults). More threads just add context switching.<\/p><p>IO-bound: <code>threads = cores × targetUtilization × (1 + waitTime / serviceTime)<\/code>. So a task waiting 90ms and computing 10ms can justify roughly 10 threads per core.<\/p><p>In practice I derive the number from Little&#x27;s Law against the target throughput and observed latency, then bound it by what the downstream can absorb - the thread pool is also a concurrency limit protecting the database or the upstream API. With virtual threads the sizing question moves from &quot;how many threads&quot; to &quot;how many concurrent calls will the downstream tolerate&quot;, enforced by a semaphore.<\/p>", "source": "answers.md", "search": "how do you size a thread pool for cpu-bound versus io-bound work? cpu-bound: threads ≈ number of cores (plus one to cover occasional page faults). more threads just add context switching. io-bound: threads = cores × targetutilization × (1 + waittime / servicetime). so a task waiting 90ms and computing 10ms can justify roughly 10 threads per core. in practice i derive the number from little's law against the target throughput and observed latency, then bound it by what the downstream can absorb - the thread pool is also a concurrency limit protecting the database or the upstream api. with virtual threads the sizing question moves from \"how many threads\" to \"how many concurrent calls will the downstream tolerate\", enforced by a semaphore."}, {"n": 72, "category": 4, "difficulty": "D", "html": "<code>CompletableFuture<\/code>: composition, exception handling, and which executor the callbacks run on.", "answerTitle": "`CompletableFuture`", "answer": "<p>Composition: <code>thenApply<\/code> (transform), <code>thenCompose<\/code> (flatMap, avoids nesting), <code>thenCombine<\/code> (join two independent futures), <code>allOf<\/code>/<code>anyOf<\/code> (fan-in).<\/p><p>Exceptions: <code>exceptionally<\/code> (recover), <code>handle<\/code> (see both result and error), <code>whenComplete<\/code> (observe without changing). An exception inside a stage skips subsequent <code>thenApply<\/code> stages and propagates to the first handler, and <code>join()<\/code> wraps it in <code>CompletionException<\/code> while <code>get()<\/code> wraps it in <code>ExecutionException<\/code>.<\/p><p>Executor: without an explicit executor, async stages run on the common <code>ForkJoinPool<\/code>, and non-async stages run on whichever thread completed the previous stage - which may be a Netty IO thread or the caller. Always pass an explicit executor for anything blocking.<\/p>", "source": "answers.md", "search": "completablefuture: composition, exception handling, and which executor the callbacks run on. composition: thenapply (transform), thencompose (flatmap, avoids nesting), thencombine (join two independent futures), allof/anyof (fan-in). exceptions: exceptionally (recover), handle (see both result and error), whencomplete (observe without changing). an exception inside a stage skips subsequent thenapply stages and propagates to the first handler, and join() wraps it in completionexception while get() wraps it in executionexception. executor: without an explicit executor, async stages run on the common forkjoinpool, and non-async stages run on whichever thread completed the previous stage - which may be a netty io thread or the caller. always pass an explicit executor for anything blocking."}, {"n": 73, "category": 4, "difficulty": "T", "html": "Difference between <code>thenApply<\/code> and <code>thenApplyAsync<\/code>, and why it matters for thread starvation.", "answerTitle": "`thenApply` versus `thenApplyAsync`", "answer": "<p><code>thenApply<\/code> runs on the thread that completed the previous stage (or the calling thread if it was already complete). <code>thenApplyAsync<\/code> submits to the common pool or an executor you supply.<\/p><p>It matters because a heavy <code>thenApply<\/code> hijacks the completing thread. If that thread belongs to your HTTP client&#x27;s IO pool, you stall all other connections on that pool - a classic cause of &quot;everything got slow when one endpoint got slow&quot;.<\/p>", "source": "answers.md", "search": "difference between thenapply and thenapplyasync, and why it matters for thread starvation. thenapply runs on the thread that completed the previous stage (or the calling thread if it was already complete). thenapplyasync submits to the common pool or an executor you supply. it matters because a heavy thenapply hijacks the completing thread. if that thread belongs to your http client's io pool, you stall all other connections on that pool - a classic cause of \"everything got slow when one endpoint got slow\"."}, {"n": 74, "category": 4, "difficulty": "D", "html": "Explain deadlock, livelock, starvation. How do you detect deadlock in production?", "answerTitle": "Deadlock, livelock, starvation", "answer": "<p>Deadlock: two threads each hold a lock the other needs, and nobody moves. Requires mutual exclusion, hold-and-wait, no preemption, circular wait - break any one. My standard prevention is global lock ordering plus <code>tryLock<\/code> with timeout.<\/p><p>Livelock: threads keep changing state in response to each other and make no progress (two retry loops backing off in lockstep). Fix with randomized backoff.<\/p><p>Starvation: a thread never gets scheduled or never wins the lock - fix with fair locks or priority separation.<\/p><p>Detection in production: take a thread dump (<code>jstack<\/code>, <code>jcmd &lt;pid&gt; Thread.print<\/code>); the JVM explicitly prints &quot;Found one Java-level deadlock&quot; with the cycle. <code>ThreadMXBean.findDeadlockedThreads()<\/code> can also be exposed as a health check.<\/p>", "source": "answers.md", "search": "explain deadlock, livelock, starvation. how do you detect deadlock in production? deadlock: two threads each hold a lock the other needs, and nobody moves. requires mutual exclusion, hold-and-wait, no preemption, circular wait - break any one. my standard prevention is global lock ordering plus trylock with timeout. livelock: threads keep changing state in response to each other and make no progress (two retry loops backing off in lockstep). fix with randomized backoff. starvation: a thread never gets scheduled or never wins the lock - fix with fair locks or priority separation. detection in production: take a thread dump (jstack, jcmd <pid thread.print); the jvm explicitly prints \"found one java-level deadlock\" with the cycle. threadmxbean.finddeadlockedthreads() can also be exposed as a health check."}, {"n": 75, "category": 4, "difficulty": "D", "html": "<code>CountDownLatch<\/code> versus <code>CyclicBarrier<\/code> versus <code>Semaphore<\/code> versus <code>Phaser<\/code>.", "answerTitle": "Synchronizers", "answer": "<p><code>CountDownLatch<\/code>: one-shot gate, wait for N events; cannot be reset. <code>CyclicBarrier<\/code>: N threads wait for each other, reusable, supports a barrier action. <code>Semaphore<\/code>: permits limiting concurrency - my usual tool for capping calls to a fragile downstream. <code>Phaser<\/code>: dynamic party registration across multiple phases, for when the participant count changes at runtime.<\/p>", "source": "answers.md", "search": "countdownlatch versus cyclicbarrier versus semaphore versus phaser. countdownlatch: one-shot gate, wait for n events; cannot be reset. cyclicbarrier: n threads wait for each other, reusable, supports a barrier action. semaphore: permits limiting concurrency - my usual tool for capping calls to a fragile downstream. phaser: dynamic party registration across multiple phases, for when the participant count changes at runtime."}, {"n": 76, "category": 4, "difficulty": "D", "html": "What are atomic classes and how does CAS work? What is the ABA problem?", "answerTitle": "Atomics, CAS and ABA", "answer": "<p>Atomic classes wrap a <code>volatile<\/code> value and use <code>compareAndSet<\/code>, which maps to a single CPU instruction (<code>lock cmpxchg<\/code>). The pattern is a retry loop: read, compute, CAS, repeat if it failed. Lock-free, so no context switching, but it burns CPU under heavy contention.<\/p><p>ABA: a thread reads A, another changes it to B and back to A, and the CAS succeeds although the state changed meaningfully - dangerous in lock-free stacks where the node was recycled. Solved with <code>AtomicStampedReference<\/code> (value plus version counter).<\/p>", "source": "answers.md", "search": "what are atomic classes and how does cas work? what is the aba problem? atomic classes wrap a volatile value and use compareandset, which maps to a single cpu instruction (lock cmpxchg). the pattern is a retry loop: read, compute, cas, repeat if it failed. lock-free, so no context switching, but it burns cpu under heavy contention. aba: a thread reads a, another changes it to b and back to a, and the cas succeeds although the state changed meaningfully - dangerous in lock-free stacks where the node was recycled. solved with atomicstampedreference (value plus version counter)."}, {"n": 77, "category": 4, "difficulty": "T", "html": "Why does <code>LongAdder<\/code> outperform <code>AtomicLong<\/code> under high contention?", "answerTitle": "`LongAdder` versus `AtomicLong`", "answer": "<p><code>AtomicLong<\/code> has all threads CAS-ing the same cache line, so under contention you get cache-line ping-pong and repeated CAS failures. <code>LongAdder<\/code> keeps an array of cells, one per contending thread (padded to avoid false sharing), so each thread updates its own cell without conflict; <code>sum()<\/code> adds the cells.<\/p><p>Trade-off: <code>sum()<\/code> is not atomic and is more expensive, so <code>LongAdder<\/code> is right for write-heavy counters read occasionally - metrics - and wrong when you need an exact <code>getAndIncrement<\/code> value, such as ID generation.<\/p>", "source": "answers.md", "search": "why does longadder outperform atomiclong under high contention? atomiclong has all threads cas-ing the same cache line, so under contention you get cache-line ping-pong and repeated cas failures. longadder keeps an array of cells, one per contending thread (padded to avoid false sharing), so each thread updates its own cell without conflict; sum() adds the cells. trade-off: sum() is not atomic and is more expensive, so longadder is right for write-heavy counters read occasionally - metrics - and wrong when you need an exact getandincrement value, such as id generation."}, {"n": 78, "category": 4, "difficulty": "D", "html": "<code>ThreadLocal<\/code> - use cases, and the memory leak risk in application servers and thread pools.", "answerTitle": "`ThreadLocal`", "answer": "<p>Per-thread storage, implemented as a map <em>on the Thread object<\/em> keyed by weak references to the <code>ThreadLocal<\/code>. Uses: <code>SecurityContextHolder<\/code>, transaction/EntityManager binding, MDC for correlation IDs, non-thread-safe formatters.<\/p><p>Leak risk: in a thread pool, threads live forever, so a value never removed stays reachable through the thread and can pin an entire classloader in an application server. The key is weakly referenced but the <em>value<\/em> is not. Always <code>remove()<\/code> in a <code>finally<\/code>, and be aware that with virtual threads the per-thread copy is cheap in creation but expensive in aggregate - <code>ScopedValue<\/code> is the modern replacement.<\/p>", "source": "answers.md", "search": "threadlocal - use cases, and the memory leak risk in application servers and thread pools. per-thread storage, implemented as a map on the thread object keyed by weak references to the threadlocal. uses: securitycontextholder, transaction/entitymanager binding, mdc for correlation ids, non-thread-safe formatters. leak risk: in a thread pool, threads live forever, so a value never removed stays reachable through the thread and can pin an entire classloader in an application server. the key is weakly referenced but the value is not. always remove() in a finally, and be aware that with virtual threads the per-thread copy is cheap in creation but expensive in aggregate - scopedvalue is the modern replacement."}, {"n": 79, "category": 4, "difficulty": "A", "html": "Virtual threads (Project Loom): what changes, what does not, and which of your existing patterns become anti-patterns?", "answerTitle": "Virtual threads", "answer": "<p>Lightweight threads scheduled by the JVM onto a small pool of carrier threads. A blocking call unmounts the virtual thread instead of blocking an OS thread, so thread-per-request becomes viable at hundreds of thousands of concurrent requests.<\/p><p>What changes: pooling virtual threads is pointless - create one per task (<code>Executors.newVirtualThreadPerTaskExecutor()<\/code>); reactive code written <em>purely<\/em> to avoid blocking loses much of its justification; <code>ThreadLocal<\/code> becomes expensive at scale.<\/p><p>What does not change: you still need to limit concurrency against downstreams (use a <code>Semaphore<\/code>, since the pool no longer does it for you), CPU-bound work still needs a bounded pool, and none of this makes shared mutable state safe.<\/p>", "source": "answers.md", "search": "virtual threads (project loom): what changes, what does not, and which of your existing patterns become anti-patterns? lightweight threads scheduled by the jvm onto a small pool of carrier threads. a blocking call unmounts the virtual thread instead of blocking an os thread, so thread-per-request becomes viable at hundreds of thousands of concurrent requests. what changes: pooling virtual threads is pointless - create one per task (executors.newvirtualthreadpertaskexecutor()); reactive code written purely to avoid blocking loses much of its justification; threadlocal becomes expensive at scale. what does not change: you still need to limit concurrency against downstreams (use a semaphore, since the pool no longer does it for you), cpu-bound work still needs a bounded pool, and none of this makes shared mutable state safe."}, {"n": 80, "category": 4, "difficulty": "T", "html": "Why does <code>synchronized<\/code> pin a virtual thread, and what should you use instead?", "answerTitle": "Pinning", "answer": "<p>Inside a <code>synchronized<\/code> block the JVM cannot unmount the virtual thread because the monitor is tied to the OS thread&#x27;s stack frame, so it pins the carrier thread. Enough pinned carriers and throughput collapses back to platform-thread limits. (JDK 24 removed most pinning under <code>synchronized<\/code>, but library code you do not control may still be on an older baseline.)<\/p><p>Guidance: replace <code>synchronized<\/code> around blocking calls with <code>ReentrantLock<\/code>, which parks correctly. Diagnose with <code>-Djdk.tracePinnedThreads=full<\/code>.<\/p>", "source": "answers.md", "search": "why does synchronized pin a virtual thread, and what should you use instead? inside a synchronized block the jvm cannot unmount the virtual thread because the monitor is tied to the os thread's stack frame, so it pins the carrier thread. enough pinned carriers and throughput collapses back to platform-thread limits. (jdk 24 removed most pinning under synchronized, but library code you do not control may still be on an older baseline.) guidance: replace synchronized around blocking calls with reentrantlock, which parks correctly. diagnose with -djdk.tracepinnedthreads=full."}, {"n": 81, "category": 4, "difficulty": "D", "html": "Explain the double-checked locking idiom and why it requires <code>volatile<\/code>.", "answerTitle": "Double-checked locking", "answer": "<pre><code class=\"lang-java\">private volatile Singleton instance;\npublic Singleton get() {\n    if (instance == null) {\n        synchronized (this) {\n            if (instance == null) instance = new Singleton();\n        }\n    }\n    return instance;\n}<\/code><\/pre><p><code>volatile<\/code> is mandatory. Without it, the JIT may reorder allocation and constructor execution so another thread sees a non-null reference to a partially constructed object. <code>volatile<\/code> inserts the barrier that forbids that reordering.<\/p>", "source": "answers.md", "search": "explain the double-checked locking idiom and why it requires volatile. java private volatile singleton instance; public singleton get() { if (instance == null) { synchronized (this) { if (instance == null) instance = new singleton(); } } return instance; } volatile is mandatory. without it, the jit may reorder allocation and constructor execution so another thread sees a non-null reference to a partially constructed object. volatile inserts the barrier that forbids that reordering."}, {"n": 82, "category": 4, "difficulty": "D", "html": "How do you implement a thread-safe singleton? Compare four approaches.", "answerTitle": "Thread-safe singleton", "answer": "<ol><li>Eager static field - simplest, thread-safe by class initialization, but no laziness.<\/li><li>Holder idiom - <code>private static class Holder { static final Singleton INSTANCE = new Singleton(); }<\/code>; lazy and lock-free, relying on JVM class-initialization guarantees. My default.<\/li><li>Double-checked locking with <code>volatile<\/code> - only when you need a parameterized or resettable instance.<\/li><li>Enum singleton - serialization and reflection safe, Joshua Bloch&#x27;s recommendation, though awkward if it needs dependencies.<\/li><\/ol><p>In Spring the honest answer is: use a singleton-scoped bean and let the container manage it, so it stays testable.<\/p>", "source": "answers.md", "search": "how do you implement a thread-safe singleton? compare four approaches. 1. eager static field - simplest, thread-safe by class initialization, but no laziness. 2. holder idiom - private static class holder { static final singleton instance = new singleton(); }; lazy and lock-free, relying on jvm class-initialization guarantees. my default. 3. double-checked locking with volatile - only when you need a parameterized or resettable instance. 4. enum singleton - serialization and reflection safe, joshua bloch's recommendation, though awkward if it needs dependencies. in spring the honest answer is: use a singleton-scoped bean and let the container manage it, so it stays testable."}, {"n": 83, "category": 4, "difficulty": "A", "html": "How do you make a legacy non-thread-safe class safe without rewriting it?", "answerTitle": "Making a legacy class thread-safe", "answer": "<p>Options in the order I would consider them: confine it to one thread (<code>ThreadLocal<\/code> or a single-threaded executor owning the instance); make each use create its own instance if construction is cheap; wrap it in a thread-safe facade that holds a private lock around every method (client-side locking); or copy-on-write the state if reads dominate.<\/p><p>The wrapper is usually the right first move because it is provable and reversible - and I would add a concurrency test with <code>jcstress<\/code> or a hammer test before declaring it safe.<\/p>", "source": "answers.md", "search": "how do you make a legacy non-thread-safe class safe without rewriting it? options in the order i would consider them: confine it to one thread (threadlocal or a single-threaded executor owning the instance); make each use create its own instance if construction is cheap; wrap it in a thread-safe facade that holds a private lock around every method (client-side locking); or copy-on-write the state if reads dominate. the wrapper is usually the right first move because it is provable and reversible - and i would add a concurrency test with jcstress or a hammer test before declaring it safe."}, {"n": 84, "category": 4, "difficulty": "A", "html": "Structured concurrency with <code>StructuredTaskScope<\/code> - what does it fix that <code>CompletableFuture<\/code> fan-out does not?", "answerTitle": "Structured concurrency", "answer": "<p><code>CompletableFuture.allOf<\/code> gives you composition but no <em>lifetime<\/em>. If one of five parallel calls fails, the other four keep running, consuming connections and downstream capacity for a result nobody will read; if the caller times out, the tasks are orphaned entirely; and the stack trace of a failure has no relationship to the code that launched it.<\/p><p><code>StructuredTaskScope<\/code> ties task lifetime to a lexical block. The scope is opened in a try-with-resources, subtasks are forked into it, <code>join()<\/code> waits, and <em>nothing escapes the block<\/em> - when it closes, every subtask is finished or cancelled.<\/p><pre><code class=\"lang-java\">try (var scope = StructuredTaskScope.open(Joiner.&lt;Response&gt;allSuccessfulOrThrow())) {\n    var profile = scope.fork(() -&gt; profileClient.fetch(id));\n    var orders  = scope.fork(() -&gt; orderClient.fetch(id));\n    scope.join();\n    return merge(profile.get(), orders.get());\n}<\/code><\/pre><p>The two ready-made policies cover most real use: fail-fast (the first failure cancels the siblings, which is what a fan-out read should do) and first-success (the first result cancels the rest, for hedged requests against replicas). Cancellation propagates by interrupt, so it only works if your tasks are interruptible - a blocking call on a socket with no timeout still hangs.<\/p><p>It also restores the debugging property that concurrency usually destroys: the subtask&#x27;s stack trace includes the forking frame, and thread dumps render the scope as a tree rather than as unrelated pool threads.<\/p><p>The trade-off: it is scoped to a request, so it replaces fan-out inside a call, not long-lived background work. It finalized in JDK 25 (previews from 21, with an API change in 25 - <code>open(Joiner)<\/code> replaced the subclassing style), so on 21 it needs <code>--enable-preview<\/code>.<\/p><blockquote><p><em>Hook: a fan-out endpoint where a failing dependency used to leave four in-flight calls burning connection-pool slots.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "structured concurrency with structuredtaskscope - what does it fix that completablefuture fan-out does not? completablefuture.allof gives you composition but no lifetime . if one of five parallel calls fails, the other four keep running, consuming connections and downstream capacity for a result nobody will read; if the caller times out, the tasks are orphaned entirely; and the stack trace of a failure has no relationship to the code that launched it. structuredtaskscope ties task lifetime to a lexical block. the scope is opened in a try-with-resources, subtasks are forked into it, join() waits, and nothing escapes the block - when it closes, every subtask is finished or cancelled. java try (var scope = structuredtaskscope.open(joiner.<response allsuccessfulorthrow())) { var profile = scope.fork(() - profileclient.fetch(id)); var orders = scope.fork(() - orderclient.fetch(id)); scope.join(); return merge(profile.get(), orders.get()); } the two ready-made policies cover most real use: fail-fast (the first failure cancels the siblings, which is what a fan-out read should do) and first-success (the first result cancels the rest, for hedged requests against replicas). cancellation propagates by interrupt, so it only works if your tasks are interruptible - a blocking call on a socket with no timeout still hangs. it also restores the debugging property that concurrency usually destroys: the subtask's stack trace includes the forking frame, and thread dumps render the scope as a tree rather than as unrelated pool threads. the trade-off: it is scoped to a request, so it replaces fan-out inside a call, not long-lived background work. it finalized in jdk 25 (previews from 21, with an api change in 25 - open(joiner) replaced the subclassing style), so on 21 it needs --enable-preview. hook: a fan-out endpoint where a failing dependency used to leave four in-flight calls burning connection-pool slots."}, {"n": 85, "category": 4, "difficulty": "A", "html": "You switch a Spring Boot service to virtual threads. Where does the bottleneck move, and what do you have to bound?", "answerTitle": "Virtual threads in production", "answer": "<p>Virtual threads remove the <em>thread<\/em> as the scarce resource. They do not remove scarcity - they relocate it, and usually to somewhere with worse failure behavior.<\/p><p>Before: 200 Tomcat workers were an implicit, self-enforcing concurrency limit. A traffic spike queued at the connector, which is a survivable failure. After: 10,000 concurrent requests all reach the business logic at once, and the first shared resource they touch collapses.<\/p><p>What to bound explicitly, in the order it bites:<\/p><ol><li><strong>The connection pool.<\/strong> Hikari at 20 connections with 10,000 virtual threads means 9,980 threads blocked in <code>getConnection()<\/code>. Nothing breaks, but every request now pays queue time and the <code>connectionTimeout<\/code> becomes the effective SLA. Pool size is still bounded by the <em>database&#x27;s<\/em> capacity, so raising it is rarely the fix.<\/li><li><strong>Each downstream.<\/strong> A <code>Semaphore<\/code> per dependency is now the bulkhead - the pool used to be one implicitly. Without it you convert your own scaling problem into an outage for the service you call.<\/li><li><strong>Memory.<\/strong> Each virtual thread&#x27;s stack lives on the heap. Cheap individually, but 50,000 of them holding request buffers is real heap, and unlike an OOM from a leak this one appears only under load.<\/li><\/ol><p>What also changes: <code>synchronized<\/code> pins a carrier thread, so a blocking call inside a <code>synchronized<\/code> block can deadlock a pool of carriers - JDK 24 (JEP 491) removed most pinning, but on 21 you migrate hot paths to <code>ReentrantLock<\/code>. Thread pools become an anti-pattern (<code>newVirtualThreadPerTaskExecutor<\/code>, never a fixed pool). <code>ThreadLocal<\/code> still works but is no longer cheap in aggregate; <code>ScopedValue<\/code> is the replacement. And pooling-based metrics stop meaning anything - &quot;active threads&quot; is no longer a saturation signal, so you measure queue time at each bounded resource instead.<\/p><p>What does not change: CPU-bound work gets no faster, and any blocking native or file-IO call still blocks a carrier.<\/p><p>My migration order: turn it on for the request path only, keep every timeout, add the per-dependency semaphores <em>first<\/em>, and load-test for the new failure mode rather than for throughput.<\/p>", "source": "answers.md", "search": "you switch a spring boot service to virtual threads. where does the bottleneck move, and what do you have to bound? virtual threads remove the thread as the scarce resource. they do not remove scarcity - they relocate it, and usually to somewhere with worse failure behavior. before: 200 tomcat workers were an implicit, self-enforcing concurrency limit. a traffic spike queued at the connector, which is a survivable failure. after: 10,000 concurrent requests all reach the business logic at once, and the first shared resource they touch collapses. what to bound explicitly, in the order it bites: 1. the connection pool. hikari at 20 connections with 10,000 virtual threads means 9,980 threads blocked in getconnection(). nothing breaks, but every request now pays queue time and the connectiontimeout becomes the effective sla. pool size is still bounded by the database's capacity, so raising it is rarely the fix. 2. each downstream. a semaphore per dependency is now the bulkhead - the pool used to be one implicitly. without it you convert your own scaling problem into an outage for the service you call. 3. memory. each virtual thread's stack lives on the heap. cheap individually, but 50,000 of them holding request buffers is real heap, and unlike an oom from a leak this one appears only under load. what also changes: synchronized pins a carrier thread, so a blocking call inside a synchronized block can deadlock a pool of carriers - jdk 24 (jep 491) removed most pinning, but on 21 you migrate hot paths to reentrantlock. thread pools become an anti-pattern (newvirtualthreadpertaskexecutor, never a fixed pool). threadlocal still works but is no longer cheap in aggregate; scopedvalue is the replacement. and pooling-based metrics stop meaning anything - \"active threads\" is no longer a saturation signal, so you measure queue time at each bounded resource instead. what does not change: cpu-bound work gets no faster, and any blocking native or file-io call still blocks a carrier. my migration order: turn it on for the request path only, keep every timeout, add the per-dependency semaphores first , and load-test for the new failure mode rather than for throughput."}, {"n": 86, "category": 4, "difficulty": "D", "html": "How do you propagate MDC, <code>SecurityContext<\/code> and tenant identity across an executor boundary, and what changes with virtual threads?", "answerTitle": "Context propagation across executors", "answer": "<p>Anything held in a <code>ThreadLocal<\/code> - MDC correlation ID, <code>SecurityContextHolder<\/code>, tenant, tracing span - is invisible to the thread that actually runs the task. The symptom is logs from async work with no trace ID and an <code>AuthenticationCredentialsNotFoundException<\/code> in a <code>@Async<\/code> method.<\/p><p>The fix is to capture the context on the submitting thread and install it on the executing one, in a <code>finally<\/code>-guarded clear so a pooled thread never leaks it to the next task. Spring&#x27;s <code>TaskDecorator<\/code> is the hook:<\/p><pre><code class=\"lang-java\">public class ContextDecorator implements TaskDecorator {\n    @Override public Runnable decorate(Runnable task) {\n        var mdc = MDC.getCopyOfContextMap();\n        var auth = SecurityContextHolder.getContext().getAuthentication();\n        return () -&gt; {\n            try {\n                if (mdc != null) MDC.setContextMap(mdc);\n                SecurityContextHolder.getContext().setAuthentication(auth);\n                task.run();\n            } finally {\n                MDC.clear();\n                SecurityContextHolder.clearContext();\n            }\n        };\n    }\n}<\/code><\/pre><p>Ready-made equivalents: <code>DelegatingSecurityContextExecutor<\/code> for security only, Micrometer&#x27;s <code>ContextSnapshot<\/code>/<code>ContextExecutorService<\/code> for the general case (it also carries the observation and trace context), and for WebFlux the Reactor <code>Context<\/code> instead, since there is no thread affinity at all.<\/p><p>Two traps. First, propagating a <code>SecurityContext<\/code> into a long-lived background task means it outlives the request, so the authorization decision is made against a stale principal - for genuinely detached work, re-authenticate rather than inherit. Second, the <code>finally<\/code> clear is not optional: without it, a pooled thread carries one user&#x27;s identity into the next user&#x27;s task, which is an authorization bug, not a logging bug.<\/p><p>With virtual threads, <code>ThreadLocal<\/code> still propagates nothing across the boundary, but <code>ScopedValue<\/code> changes the shape: the value is bound for the dynamic extent of a call and is automatically visible to structured-concurrency subtasks, immutable, and reclaimed at the end of the block - so there is nothing to clear and nothing to leak.<\/p>", "source": "answers.md", "search": "how do you propagate mdc, securitycontext and tenant identity across an executor boundary, and what changes with virtual threads? anything held in a threadlocal - mdc correlation id, securitycontextholder, tenant, tracing span - is invisible to the thread that actually runs the task. the symptom is logs from async work with no trace id and an authenticationcredentialsnotfoundexception in a @async method. the fix is to capture the context on the submitting thread and install it on the executing one, in a finally-guarded clear so a pooled thread never leaks it to the next task. spring's taskdecorator is the hook: java public class contextdecorator implements taskdecorator { @override public runnable decorate(runnable task) { var mdc = mdc.getcopyofcontextmap(); var auth = securitycontextholder.getcontext().getauthentication(); return () - { try { if (mdc != null) mdc.setcontextmap(mdc); securitycontextholder.getcontext().setauthentication(auth); task.run(); } finally { mdc.clear(); securitycontextholder.clearcontext(); } }; } } ready-made equivalents: delegatingsecuritycontextexecutor for security only, micrometer's contextsnapshot/contextexecutorservice for the general case (it also carries the observation and trace context), and for webflux the reactor context instead, since there is no thread affinity at all. two traps. first, propagating a securitycontext into a long-lived background task means it outlives the request, so the authorization decision is made against a stale principal - for genuinely detached work, re-authenticate rather than inherit. second, the finally clear is not optional: without it, a pooled thread carries one user's identity into the next user's task, which is an authorization bug, not a logging bug. with virtual threads, threadlocal still propagates nothing across the boundary, but scopedvalue changes the shape: the value is bound for the dynamic extent of a call and is automatically visible to structured-concurrency subtasks, immutable, and reclaimed at the end of the block - so there is nothing to clear and nothing to leak."}, {"n": 87, "category": 4, "difficulty": "D", "html": "What is false sharing, and when is <code>@Contended<\/code> the right answer?", "answerTitle": "False sharing and `@Contended`", "answer": "<p>The unit of coherence between cores is the cache line, typically 64 bytes, not the variable. Two independent counters that land in the same line cause every write on one core to invalidate the other core&#x27;s copy, so threads that share no data still ping-pong the line between caches. Throughput drops by an order of magnitude and the code looks perfectly correct.<\/p><p>Classic shapes: adjacent fields in a hot object written by different threads; adjacent slots in an array of counters, one per shard; a ring buffer&#x27;s producer and consumer indices in the same line.<\/p><p><code>@jdk.internal.vm.annotation.Contended<\/code> pads a field so it occupies its own line, and requires <code>-XX:-RestrictContended<\/code> to use outside the JDK. That is deliberate friction: padding costs memory and cache footprint, and applied casually it makes things slower.<\/p><p>When it is right: a small, fixed number of very hot, independently-written fields, with a measurement showing the improvement. When it is not: almost everywhere else - the better answers are usually to stop sharing (per-thread accumulation merged at the end, which is exactly what <code>LongAdder<\/code> does with its padded cells) or to make the field read-mostly.<\/p><p>Detect it rather than guess: <code>perf c2c<\/code> on Linux identifies contended lines directly, and the softer signal is a hot method with a high cache-miss rate and no obvious lock.<\/p>", "source": "answers.md", "search": "what is false sharing, and when is @contended the right answer? the unit of coherence between cores is the cache line, typically 64 bytes, not the variable. two independent counters that land in the same line cause every write on one core to invalidate the other core's copy, so threads that share no data still ping-pong the line between caches. throughput drops by an order of magnitude and the code looks perfectly correct. classic shapes: adjacent fields in a hot object written by different threads; adjacent slots in an array of counters, one per shard; a ring buffer's producer and consumer indices in the same line. @jdk.internal.vm.annotation.contended pads a field so it occupies its own line, and requires -xx:-restrictcontended to use outside the jdk. that is deliberate friction: padding costs memory and cache footprint, and applied casually it makes things slower. when it is right: a small, fixed number of very hot, independently-written fields, with a measurement showing the improvement. when it is not: almost everywhere else - the better answers are usually to stop sharing (per-thread accumulation merged at the end, which is exactly what longadder does with its padded cells) or to make the field read-mostly. detect it rather than guess: perf c2c on linux identifies contended lines directly, and the softer signal is a hot method with a high cache-miss rate and no obvious lock."}, {"n": 88, "category": 4, "difficulty": "D", "html": "How do you find lock contention in a running production JVM, as opposed to guessing from the code?", "answerTitle": "Finding lock contention in production", "answer": "<p>Contention is invisible in a profiler that only samples CPU - a blocked thread burns no CPU, so the flame graph looks healthy while latency is terrible. You need wall-clock or lock-specific evidence.<\/p><p>My order:<\/p><ol><li><strong>Thread dumps first<\/strong>, because they cost nothing: <code>jcmd &lt;pid&gt; Thread.print<\/code>, three of them ten seconds apart. Many threads <code>BLOCKED<\/code> on the same <code>&lt;0x...&gt;<\/code> monitor with one owner is contention; the same stack in all three dumps is a stuck thread, not a busy one.<\/li><li><strong>JFR for the quantified view.<\/strong> <code>jcmd &lt;pid&gt; JFR.start settings=profile<\/code> then look at the <code>jdk.JavaMonitorEnter<\/code> and <code>jdk.ThreadPark<\/code> events - they carry the monitor class, the blocking duration and the stack, so you get <em>which lock, for how long, from where<\/em> rather than an impression. <code>jdk.VirtualThreadPinned<\/code> is the equivalent for carrier pinning. The default 20ms threshold hides high-frequency short waits, so lower it when the picture looks too clean.<\/li><li><strong>async-profiler in lock mode<\/strong>: <code>-e lock<\/code> produces a flame graph weighted by time spent blocking rather than by CPU, which is the fastest way to see the offending call path. <code>-e wall<\/code> when you are not yet sure it is a lock at all.<\/li><li><strong><code>ReentrantLock<\/code> instrumentation<\/strong> when it is your own lock: <code>getQueueLength()<\/code> exported as a metric turns the next occurrence into a dashboard instead of an investigation.<\/li><\/ol><p>Fixes, in the order that usually pays: shrink the critical section (do IO and serialization outside it), replace coarse locking with a striped or per-key lock, switch read-dominated state to <code>ReadWriteLock<\/code>, <code>StampedLock<\/code> optimistic reads or a copy-on-write structure, or remove the shared state entirely with per-thread accumulation.<\/p><blockquote><p><em>Hook: a synchronized cache-refresh method that serialized every request until the load was moved outside the lock.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you find lock contention in a running production jvm, as opposed to guessing from the code? contention is invisible in a profiler that only samples cpu - a blocked thread burns no cpu, so the flame graph looks healthy while latency is terrible. you need wall-clock or lock-specific evidence. my order: 1. thread dumps first , because they cost nothing: jcmd <pid thread.print, three of them ten seconds apart. many threads blocked on the same <0x... monitor with one owner is contention; the same stack in all three dumps is a stuck thread, not a busy one. 2. jfr for the quantified view. jcmd <pid jfr.start settings=profile then look at the jdk.javamonitorenter and jdk.threadpark events - they carry the monitor class, the blocking duration and the stack, so you get which lock, for how long, from where rather than an impression. jdk.virtualthreadpinned is the equivalent for carrier pinning. the default 20ms threshold hides high-frequency short waits, so lower it when the picture looks too clean. 3. async-profiler in lock mode : -e lock produces a flame graph weighted by time spent blocking rather than by cpu, which is the fastest way to see the offending call path. -e wall when you are not yet sure it is a lock at all. 4. reentrantlock instrumentation when it is your own lock: getqueuelength() exported as a metric turns the next occurrence into a dashboard instead of an investigation. fixes, in the order that usually pays: shrink the critical section (do io and serialization outside it), replace coarse locking with a striped or per-key lock, switch read-dominated state to readwritelock, stampedlock optimistic reads or a copy-on-write structure, or remove the shared state entirely with per-thread accumulation. hook: a synchronized cache-refresh method that serialized every request until the load was moved outside the lock."}, {"n": 89, "category": 5, "difficulty": "C", "html": "Describe the JVM memory areas: heap, metaspace, stack, code cache, direct buffers.", "answerTitle": "Memory areas", "answer": "<p>Heap (shared, GC-managed, holds objects, split into young and old). Metaspace (native memory, class metadata; replaced PermGen in Java 8 and grows until <code>MaxMetaspaceSize<\/code>). Per-thread stacks (frames, locals, ~1MB default - <code>StackOverflowError<\/code> lives here). Code cache (JIT-compiled native code; if it fills, the JVM reverts to interpretation and performance quietly halves). Direct/native memory for NIO buffers, outside the heap and invisible to <code>-Xmx<\/code>.<\/p>", "source": "answers.md", "search": "describe the jvm memory areas: heap, metaspace, stack, code cache, direct buffers. heap (shared, gc-managed, holds objects, split into young and old). metaspace (native memory, class metadata; replaced permgen in java 8 and grows until maxmetaspacesize). per-thread stacks (frames, locals, ~1mb default - stackoverflowerror lives here). code cache (jit-compiled native code; if it fills, the jvm reverts to interpretation and performance quietly halves). direct/native memory for nio buffers, outside the heap and invisible to -xmx."}, {"n": 90, "category": 5, "difficulty": "D", "html": "Young generation, old generation, and how objects are promoted.", "answerTitle": "Generational collection", "answer": "<p>Objects are allocated in Eden. A minor GC copies survivors to a survivor space; each surviving collection increments the object&#x27;s age; at the tenuring threshold it is promoted to the old generation. Objects too large for Eden are allocated directly in old (humongous allocations in G1). The weak generational hypothesis - most objects die young - is why this is fast: collection cost is proportional to <em>live<\/em> data, not garbage.<\/p><p>Premature promotion (survivor space too small) is a common cause of frequent full GCs.<\/p>", "source": "answers.md", "search": "young generation, old generation, and how objects are promoted. objects are allocated in eden. a minor gc copies survivors to a survivor space; each surviving collection increments the object's age; at the tenuring threshold it is promoted to the old generation. objects too large for eden are allocated directly in old (humongous allocations in g1). the weak generational hypothesis - most objects die young - is why this is fast: collection cost is proportional to live data, not garbage. premature promotion (survivor space too small) is a common cause of frequent full gcs."}, {"n": 91, "category": 5, "difficulty": "D", "html": "Compare Serial, Parallel, G1, ZGC and Shenandoah. How do you choose?", "answerTitle": "Choosing a collector", "answer": "<ul><li><strong>Serial<\/strong>: single-threaded, tiny heaps, containers with one core.<\/li><li><strong>Parallel<\/strong>: throughput-optimized, long pauses acceptable - batch jobs.<\/li><li><strong>G1<\/strong> (default since Java 9): region-based, pause-target driven (<code>-XX:MaxGCPauseMillis<\/code>), good default for heaps from a few GB up to tens of GB.<\/li><li><strong>ZGC<\/strong>: sub-millisecond pauses, concurrent, scales to terabytes; costs some throughput and more memory. Generational ZGC (JDK 21+) removed most of that throughput penalty.<\/li><li><strong>Shenandoah<\/strong>: similar low-pause goal, concurrent compaction, common on OpenJDK/RedHat builds.<\/li><\/ul><p>My decision rule: start with G1; move to ZGC when p99 latency is dominated by GC pauses and the heap is large; use Parallel when throughput matters more than tail latency.<\/p>", "source": "answers.md", "search": "compare serial, parallel, g1, zgc and shenandoah. how do you choose? - serial : single-threaded, tiny heaps, containers with one core. - parallel : throughput-optimized, long pauses acceptable - batch jobs. - g1 (default since java 9): region-based, pause-target driven (-xx:maxgcpausemillis), good default for heaps from a few gb up to tens of gb. - zgc : sub-millisecond pauses, concurrent, scales to terabytes; costs some throughput and more memory. generational zgc (jdk 21+) removed most of that throughput penalty. - shenandoah : similar low-pause goal, concurrent compaction, common on openjdk/redhat builds. my decision rule: start with g1; move to zgc when p99 latency is dominated by gc pauses and the heap is large; use parallel when throughput matters more than tail latency."}, {"n": 92, "category": 5, "difficulty": "D", "html": "What is a stop-the-world pause and what causes long ones in G1?", "answerTitle": "Stop-the-world in G1", "answer": "<p>Long pauses usually come from: humongous allocations (objects over half a region) fragmenting old space; a mixed-collection set that is too large; reference processing (many weak/soft references or finalizers); or an evacuation failure (&quot;to-space exhausted&quot;) where G1 cannot find space for survivors and degrades to a full GC.<\/p><p>Fixes: increase heap or region size, reduce allocation rate, raise <code>InitiatingHeapOccupancyPercent<\/code> headroom, and eliminate the allocation hot spot found in the allocation profile.<\/p>", "source": "answers.md", "search": "what is a stop-the-world pause and what causes long ones in g1? long pauses usually come from: humongous allocations (objects over half a region) fragmenting old space; a mixed-collection set that is too large; reference processing (many weak/soft references or finalizers); or an evacuation failure (\"to-space exhausted\") where g1 cannot find space for survivors and degrades to a full gc. fixes: increase heap or region size, reduce allocation rate, raise initiatingheapoccupancypercent headroom, and eliminate the allocation hot spot found in the allocation profile."}, {"n": 93, "category": 5, "difficulty": "T", "html": "Your heap usage is fine but the container keeps getting OOM-killed. Where is the memory going?", "answerTitle": "Container OOM-kill with healthy heap", "answer": "<p>The container limit covers <em>all<\/em> JVM memory, and heap is only part of it. The rest: metaspace, code cache, thread stacks (1MB × thread count - 500 threads is 500MB), direct byte buffers used by Netty and NIO, GC structures, JIT and compiler arenas, and native allocations from libraries such as compression or crypto.<\/p><p>Diagnosis: enable Native Memory Tracking (<code>-XX:NativeMemoryTracking=summary<\/code> then <code>jcmd &lt;pid&gt; VM.native_memory summary<\/code>). Fixes: set <code>-XX:MaxDirectMemorySize<\/code>, cap thread counts, set <code>MaxMetaspaceSize<\/code>, and size the heap as roughly 50-70 percent of the container limit rather than 90 percent (or use <code>-XX:MaxRAMPercentage<\/code>).<\/p><blockquote><p><em>Hook: a Kubernetes service being killed every few hours until direct buffers were capped.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "your heap usage is fine but the container keeps getting oom-killed. where is the memory going? the container limit covers all jvm memory, and heap is only part of it. the rest: metaspace, code cache, thread stacks (1mb × thread count - 500 threads is 500mb), direct byte buffers used by netty and nio, gc structures, jit and compiler arenas, and native allocations from libraries such as compression or crypto. diagnosis: enable native memory tracking (-xx:nativememorytracking=summary then jcmd <pid vm.native_memory summary). fixes: set -xx:maxdirectmemorysize, cap thread counts, set maxmetaspacesize, and size the heap as roughly 50-70 percent of the container limit rather than 90 percent (or use -xx:maxrampercentage). hook: a kubernetes service being killed every few hours until direct buffers were capped."}, {"n": 94, "category": 5, "difficulty": "D", "html": "<code>OutOfMemoryError<\/code> variants: heap space, GC overhead limit, metaspace, direct buffer, unable to create native thread. Cause of each.", "answerTitle": "`OutOfMemoryError` variants", "answer": "<ul><li><strong>Java heap space<\/strong>: genuine leak or under-sized heap. Take a heap dump.<\/li><li><strong>GC overhead limit exceeded<\/strong>: over 98 percent of time in GC recovering under 2 percent of heap - a leak in its late stage.<\/li><li><strong>Metaspace<\/strong>: classloader leak, typically repeated redeployment or dynamic proxy/CGLIB class generation.<\/li><li><strong>Direct buffer memory<\/strong>: unreleased NIO buffers, usually a Netty or file-channel path.<\/li><li><strong>Unable to create new native thread<\/strong>: thread leak or an OS/cgroup thread limit, not a heap problem at all.<\/li><li><strong>Requested array size exceeds VM limit<\/strong>: an array over ~2^31 elements, usually an unbounded query result.<\/li><\/ul>", "source": "answers.md", "search": "outofmemoryerror variants: heap space, gc overhead limit, metaspace, direct buffer, unable to create native thread. cause of each. - java heap space : genuine leak or under-sized heap. take a heap dump. - gc overhead limit exceeded : over 98 percent of time in gc recovering under 2 percent of heap - a leak in its late stage. - metaspace : classloader leak, typically repeated redeployment or dynamic proxy/cglib class generation. - direct buffer memory : unreleased nio buffers, usually a netty or file-channel path. - unable to create new native thread : thread leak or an os/cgroup thread limit, not a heap problem at all. - requested array size exceeds vm limit : an array over ~2^31 elements, usually an unbounded query result."}, {"n": 95, "category": 5, "difficulty": "D", "html": "How do you find a memory leak in production? Walk through your exact tooling.", "answerTitle": "Finding a leak in production", "answer": "<ol><li>Confirm from metrics: old-gen occupancy after full GC trending upward over days.<\/li><li>Capture a heap dump at low traffic (<code>jcmd &lt;pid&gt; GC.heap_dump<\/code>) - accept the pause, or take it from a canary instance.<\/li><li>Analyze with Eclipse MAT: Leak Suspects report, then dominator tree, then the shortest path to GC root of the biggest retained set.<\/li><li>Correlate to code: the usual culprits are unbounded caches, <code>ThreadLocal<\/code> in pooled threads, static collections, listeners never deregistered, and <code>ClassLoader<\/code> retention.<\/li><li>Reproduce in a load test, fix, and add a guard - a bounded cache with eviction plus an alert on old-gen growth.<\/li><\/ol><p>For continuous visibility I keep Java Flight Recorder running with a low-overhead profile and use async-profiler for allocation flame graphs.<\/p>", "source": "answers.md", "search": "how do you find a memory leak in production? walk through your exact tooling. 1. confirm from metrics: old-gen occupancy after full gc trending upward over days. 2. capture a heap dump at low traffic (jcmd <pid gc.heap_dump) - accept the pause, or take it from a canary instance. 3. analyze with eclipse mat: leak suspects report, then dominator tree, then the shortest path to gc root of the biggest retained set. 4. correlate to code: the usual culprits are unbounded caches, threadlocal in pooled threads, static collections, listeners never deregistered, and classloader retention. 5. reproduce in a load test, fix, and add a guard - a bounded cache with eviction plus an alert on old-gen growth. for continuous visibility i keep java flight recorder running with a low-overhead profile and use async-profiler for allocation flame graphs."}, {"n": 96, "category": 5, "difficulty": "D", "html": "Strong, soft, weak and phantom references. Give a real use case for each.", "answerTitle": "Reference types", "answer": "<p>Strong: normal; never collected while reachable. Soft: collected only under memory pressure - suitable for a memory-sensitive cache, though in practice a bounded Caffeine cache is more predictable. Weak: collected at the next GC once weakly reachable - used for canonicalizing maps and <code>WeakHashMap<\/code> keys, and by <code>ThreadLocal<\/code> for its keys. Phantom: never returns the referent, enqueued after finalization - used with <code>Cleaner<\/code> for deterministic native-resource cleanup, e.g. freeing direct buffers.<\/p>", "source": "answers.md", "search": "strong, soft, weak and phantom references. give a real use case for each. strong: normal; never collected while reachable. soft: collected only under memory pressure - suitable for a memory-sensitive cache, though in practice a bounded caffeine cache is more predictable. weak: collected at the next gc once weakly reachable - used for canonicalizing maps and weakhashmap keys, and by threadlocal for its keys. phantom: never returns the referent, enqueued after finalization - used with cleaner for deterministic native-resource cleanup, e.g. freeing direct buffers."}, {"n": 97, "category": 5, "difficulty": "D", "html": "What does the JIT compiler do? Explain tiered compilation, inlining and deoptimization.", "answerTitle": "JIT", "answer": "<p>The JVM interprets first, profiles hot paths, then compiles. Tiered compilation goes through C1 (fast compilation, light optimization, gathers profile data) into C2 (aggressive optimization) for the hottest methods.<\/p><p>Optimizations that matter: inlining (the enabler for everything else - and why very large methods are never optimized well), loop unrolling, escape analysis, dead code elimination, and speculative optimization based on the observed profile, e.g. monomorphic call sites turned into direct calls.<\/p><p>Deoptimization happens when a speculation is invalidated - a new subclass is loaded, or an &quot;impossible&quot; branch is taken - and the method falls back to the interpreter and is recompiled. This is why performance can change after hours of uptime, and why the first minutes after deployment are slow.<\/p>", "source": "answers.md", "search": "what does the jit compiler do? explain tiered compilation, inlining and deoptimization. the jvm interprets first, profiles hot paths, then compiles. tiered compilation goes through c1 (fast compilation, light optimization, gathers profile data) into c2 (aggressive optimization) for the hottest methods. optimizations that matter: inlining (the enabler for everything else - and why very large methods are never optimized well), loop unrolling, escape analysis, dead code elimination, and speculative optimization based on the observed profile, e.g. monomorphic call sites turned into direct calls. deoptimization happens when a speculation is invalidated - a new subclass is loaded, or an \"impossible\" branch is taken - and the method falls back to the interpreter and is recompiled. this is why performance can change after hours of uptime, and why the first minutes after deployment are slow."}, {"n": 98, "category": 5, "difficulty": "T", "html": "Why do microbenchmarks written with <code>System.currentTimeMillis()<\/code> give misleading results, and what do you use instead?", "answerTitle": "Naive microbenchmarks", "answer": "<p>They measure the wrong thing: no JIT warm-up so you time the interpreter, dead code elimination removes the computation whose result you ignore, constant folding precomputes it, GC and other JVM activity add noise, and <code>currentTimeMillis<\/code> has coarse resolution.<\/p><p>Use JMH: it handles warm-up iterations, forks a fresh JVM per run, provides <code>Blackhole<\/code> to consume results, and reports distributions rather than a single number. And treat any microbenchmark as suggestive only - the real judge is a production-shaped load test.<\/p>", "source": "answers.md", "search": "why do microbenchmarks written with system.currenttimemillis() give misleading results, and what do you use instead? they measure the wrong thing: no jit warm-up so you time the interpreter, dead code elimination removes the computation whose result you ignore, constant folding precomputes it, gc and other jvm activity add noise, and currenttimemillis has coarse resolution. use jmh: it handles warm-up iterations, forks a fresh jvm per run, provides blackhole to consume results, and reports distributions rather than a single number. and treat any microbenchmark as suggestive only - the real judge is a production-shaped load test."}, {"n": 99, "category": 5, "difficulty": "D", "html": "What is escape analysis and scalar replacement?", "answerTitle": "Escape analysis", "answer": "<p>The JIT proves an object never escapes the method (never stored to a field, never returned, never passed to an unanalyzable call). It can then apply scalar replacement - split the object into its fields held in registers, so no allocation at all - and lock elision, removing synchronization on a thread-confined object.<\/p><p>This is why &quot;avoid allocation&quot; advice is often wrong for short-lived local objects, and why a small wrapper or <code>Optional<\/code> in a hot loop frequently costs nothing after warm-up.<\/p>", "source": "answers.md", "search": "what is escape analysis and scalar replacement? the jit proves an object never escapes the method (never stored to a field, never returned, never passed to an unanalyzable call). it can then apply scalar replacement - split the object into its fields held in registers, so no allocation at all - and lock elision, removing synchronization on a thread-confined object. this is why \"avoid allocation\" advice is often wrong for short-lived local objects, and why a small wrapper or optional in a hot loop frequently costs nothing after warm-up."}, {"n": 100, "category": 5, "difficulty": "D", "html": "How do you read a thread dump? What are you looking for first?", "answerTitle": "Reading a thread dump", "answer": "<p>Take three dumps, ten seconds apart, so you can distinguish a stuck thread from a busy one.<\/p><p>Look for, in order: the JVM&#x27;s own deadlock report at the bottom; threads in <code>BLOCKED<\/co
