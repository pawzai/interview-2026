rced by SCP or Config rule, cost visibility surfaced to the owning teams, and a right-sizing review cadence. Commit to Savings Plans only for the baseline you are confident in.<\/li><\/ol><p>The framing I use with leadership is cost per unit of business value - cost per request or per tenant - because absolute spend rising alongside traffic is not a problem, and that distinction is what turns the conversation from panic into engineering.<\/p>", "source": "answers.md", "search": "your aws bill jumped 40 percent this month. walk through your investigation. 1. scope it. cost explorer grouped by service, then by usage type, comparing month over month and daily - a step change points at a deployment or a configuration change; a ramp points at growth or a leak. aws cost anomaly detection usually flags it first if configured. 2. localize it. group by linked account, then by tag (which requires the tagging discipline to already exist - if it does not, that is the first remediation). correlate the start date against the deployment and infrastructure change log. 3. check the usual suspects. data transfer, especially cross-az and nat gateway processing; a change from gateway to public routing; cloudwatch logs ingestion after someone enabled debug logging; untagged or orphaned resources - unattached ebs volumes, old snapshots, idle load balancers, forgotten dev environments; a savings plan or reserved instance term expiring; an autoscaling floor raised; s3 versioning without lifecycle rules; a runaway lambda retry loop or a recursive trigger. 4. fix and prevent. remediate the specific cause, then add guardrails: budgets with alerts per account and per team, anomaly detection, a tagging policy enforced by scp or config rule, cost visibility surfaced to the owning teams, and a right-sizing review cadence. commit to savings plans only for the baseline you are confident in. the framing i use with leadership is cost per unit of business value - cost per request or per tenant - because absolute spend rising alongside traffic is not a problem, and that distinction is what turns the conversation from panic into engineering."}, {"n": 208, "category": 11, "difficulty": "D", "html": "Well-Architected Framework pillars - how do you apply them in a real review?", "answerTitle": "Well-Architected in practice", "answer": "<p>The six pillars are operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability.<\/p><p>How I actually use it: not as a checklist recited to a customer, but as a structured review at design time and then annually, with the questions turned into concrete findings that get an owner, a severity and a date. The value is that it forces the conversations teams avoid - what is the RTO and RPO and have we tested them; who can access production data and how is it audited; what happens when this AZ fails; what does this cost per transaction and is that acceptable.<\/p><p>I run it as a workshop with the team rather than an audit done to them, prioritize the findings against risk rather than fixing everything, and track them in the normal backlog so they compete honestly with feature work. The output people remember is usually the reliability gap nobody had written down.<\/p>", "source": "answers.md", "search": "well-architected framework pillars - how do you apply them in a real review? the six pillars are operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability. how i actually use it: not as a checklist recited to a customer, but as a structured review at design time and then annually, with the questions turned into concrete findings that get an owner, a severity and a date. the value is that it forces the conversations teams avoid - what is the rto and rpo and have we tested them; who can access production data and how is it audited; what happens when this az fails; what does this cost per transaction and is that acceptable. i run it as a workshop with the team rather than an audit done to them, prioritize the findings against risk rather than fixing everything, and track them in the normal backlog so they compete honestly with feature work. the output people remember is usually the reliability gap nobody had written down."}, {"n": 209, "category": 12, "difficulty": "D", "html": "Describe your ideal CI/CD pipeline for a Java microservice, stage by stage.", "answerTitle": "Pipeline for a Java microservice", "answer": "<p>Stages, with the guiding principle that anything that can fail should fail as early and as cheaply as possible:<\/p><ol><li><strong>Commit stage<\/strong> (target: under 10 minutes) - compile, unit tests, static analysis (SpotBugs, Checkstyle/Spotless, SonarQube quality gate on new code), and a fast fail on formatting so review never discusses it.<\/li><li><strong>Security stage<\/strong> - dependency vulnerability scan (OWASP Dependency-Check, Snyk or Trivy), secret scanning, SBOM generation, and container image scanning after build. Fail on new critical findings, warn on pre-existing, so the gate does not become noise everyone bypasses.<\/li><li><strong>Integration stage<\/strong> - Testcontainers-backed tests against a real Postgres, Kafka and LocalStack; contract tests verifying both consumer and provider sides.<\/li><li><strong>Package<\/strong> - a reproducible, multi-stage Docker build with layered JARs, signed (cosign) and pushed to ECR with an immutable tag derived from the commit SHA. Never <code>latest<\/code>.<\/li><li><strong>Deploy to staging<\/strong> - via GitOps (Argo CD) or the pipeline, then smoke tests and a short performance check against a baseline so a regression is caught before production.<\/li><li><strong>Deploy to production<\/strong> - progressive delivery: canary to a small traffic slice with automated analysis of error rate and latency, then a staged rollout, with automatic rollback on SLO violation.<\/li><li><strong>Post-deploy<\/strong> - deployment markers on dashboards, automated verification, and a change record.<\/li><\/ol><p>Cross-cutting: trunk-based development with short-lived branches, the same artifact promoted through every environment (build once), environment differences only in configuration, database migrations as a separate backward-compatible step, and everything in version control including the pipeline itself.<\/p>", "source": "answers.md", "search": "describe your ideal ci/cd pipeline for a java microservice, stage by stage. stages, with the guiding principle that anything that can fail should fail as early and as cheaply as possible: 1. commit stage (target: under 10 minutes) - compile, unit tests, static analysis (spotbugs, checkstyle/spotless, sonarqube quality gate on new code), and a fast fail on formatting so review never discusses it. 2. security stage - dependency vulnerability scan (owasp dependency-check, snyk or trivy), secret scanning, sbom generation, and container image scanning after build. fail on new critical findings, warn on pre-existing, so the gate does not become noise everyone bypasses. 3. integration stage - testcontainers-backed tests against a real postgres, kafka and localstack; contract tests verifying both consumer and provider sides. 4. package - a reproducible, multi-stage docker build with layered jars, signed (cosign) and pushed to ecr with an immutable tag derived from the commit sha. never latest. 5. deploy to staging - via gitops (argo cd) or the pipeline, then smoke tests and a short performance check against a baseline so a regression is caught before production. 6. deploy to production - progressive delivery: canary to a small traffic slice with automated analysis of error rate and latency, then a staged rollout, with automatic rollback on slo violation. 7. post-deploy - deployment markers on dashboards, automated verification, and a change record. cross-cutting: trunk-based development with short-lived branches, the same artifact promoted through every environment (build once), environment differences only in configuration, database migrations as a separate backward-compatible step, and everything in version control including the pipeline itself."}, {"n": 210, "category": 12, "difficulty": "D", "html": "Blue-green versus canary versus rolling deployment. What does each require from the application?", "answerTitle": "Deployment strategies", "answer": "<p><strong>Rolling<\/strong>: replace instances in batches. Cheap, no extra infrastructure, and the default in Kubernetes. Requires that two versions coexist safely - both in the API contract and in the database schema.<\/p><p><strong>Blue-green<\/strong>: stand up a full parallel environment and switch traffic at the load balancer. Instant cut-over and instant rollback; costs double infrastructure during the window, and the switch is all-or-nothing, so a bad release hits 100 percent of users at once. Also needs a plan for in-flight sessions and for shared state such as the database, which is the part that makes blue-green much less clean in practice than in diagrams.<\/p><p><strong>Canary<\/strong>: route a small percentage to the new version, watch metrics, and progress or roll back. The best risk/cost profile and my default for anything user-facing. Requires per-version metrics, a defined analysis window and automated promotion (Argo Rollouts, Flagger) - a manual canary that nobody watches is just a slow rolling deploy.<\/p><p>What each requires from the application, which is the real answer: backward and forward compatible APIs and events, backward compatible schema changes, statelessness or externalized session state, graceful shutdown honouring SIGTERM with connection draining, idempotent startup, and readiness probes that are honest about when the instance can serve.<\/p>", "source": "answers.md", "search": "blue-green versus canary versus rolling deployment. what does each require from the application? rolling : replace instances in batches. cheap, no extra infrastructure, and the default in kubernetes. requires that two versions coexist safely - both in the api contract and in the database schema. blue-green : stand up a full parallel environment and switch traffic at the load balancer. instant cut-over and instant rollback; costs double infrastructure during the window, and the switch is all-or-nothing, so a bad release hits 100 percent of users at once. also needs a plan for in-flight sessions and for shared state such as the database, which is the part that makes blue-green much less clean in practice than in diagrams. canary : route a small percentage to the new version, watch metrics, and progress or roll back. the best risk/cost profile and my default for anything user-facing. requires per-version metrics, a defined analysis window and automated promotion (argo rollouts, flagger) - a manual canary that nobody watches is just a slow rolling deploy. what each requires from the application, which is the real answer: backward and forward compatible apis and events, backward compatible schema changes, statelessness or externalized session state, graceful shutdown honouring sigterm with connection draining, idempotent startup, and readiness probes that are honest about when the instance can serve."}, {"n": 211, "category": 12, "difficulty": "T", "html": "What must be true about your database schema for a rolling deployment to be safe?", "answerTitle": "Rolling deployments and the schema", "answer": "<p>Old and new code run against the <strong>same database at the same time<\/strong>, so the schema must be compatible with both versions simultaneously. That single fact generates all the rules:<\/p><ul><li>Only additive changes in a deploy: new columns must be nullable or have a default, because the old code&#x27;s <code>INSERT<\/code> does not mention them.<\/li><li>Never rename or drop a column in the same release that stops using it - old instances still reference it. Drop it one release later.<\/li><li>No changes that alter the meaning of an existing column.<\/li><li>New tables and columns first, code that uses them second.<\/li><li>Migrations must be backward compatible with the previous version, because rollback must remain possible without a data restore - and rollback is the whole point of the strategy.<\/li><li>Avoid long-lived locks; use <code>CREATE INDEX CONCURRENTLY<\/code> and <code>NOT VALID<\/code> constraints so the migration does not block traffic.<\/li><\/ul><p>The same reasoning applies to message schemas - a consumer running old code must tolerate events produced by new code, which is why I require schema-registry compatibility checks in CI.<\/p>", "source": "answers.md", "search": "what must be true about your database schema for a rolling deployment to be safe? old and new code run against the same database at the same time , so the schema must be compatible with both versions simultaneously. that single fact generates all the rules: - only additive changes in a deploy: new columns must be nullable or have a default, because the old code's insert does not mention them. - never rename or drop a column in the same release that stops using it - old instances still reference it. drop it one release later. - no changes that alter the meaning of an existing column. - new tables and columns first, code that uses them second. - migrations must be backward compatible with the previous version, because rollback must remain possible without a data restore - and rollback is the whole point of the strategy. - avoid long-lived locks; use create index concurrently and not valid constraints so the migration does not block traffic. the same reasoning applies to message schemas - a consumer running old code must tolerate events produced by new code, which is why i require schema-registry compatibility checks in ci."}, {"n": 212, "category": 12, "difficulty": "D", "html": "Trunk-based development versus GitFlow. What do you recommend for a 30-engineer team?", "answerTitle": "Branching for a 30-engineer team", "answer": "<p>I recommend <strong>trunk-based development<\/strong>: short-lived branches merged to main within a day or two, everything behind feature flags, main always releasable, and continuous integration in the literal sense.<\/p><p>Why not GitFlow at that size: long-lived <code>develop<\/code> and <code>release<\/code> branches produce large, painful merges; the divergence between branches means integration problems are discovered late; and the release train adds latency without adding safety. GitFlow made sense for versioned, shipped software with multiple supported versions - which is a real case, and I would use it for a distributed library or an on-premises product.<\/p><p>What makes trunk-based work in practice, and what I would put in place first: a fast and trustworthy pipeline (if CI takes 40 minutes or is flaky, people batch changes and the model collapses), feature flags with a discipline for removing them, pull requests small enough to review in 20 minutes, branch protection with required checks, and pair or ensemble programming for the riskiest changes. The branching model is downstream of test quality, so I would fix the pipeline before arguing about branches.<\/p>", "source": "answers.md", "search": "trunk-based development versus gitflow. what do you recommend for a 30-engineer team? i recommend trunk-based development : short-lived branches merged to main within a day or two, everything behind feature flags, main always releasable, and continuous integration in the literal sense. why not gitflow at that size: long-lived develop and release branches produce large, painful merges; the divergence between branches means integration problems are discovered late; and the release train adds latency without adding safety. gitflow made sense for versioned, shipped software with multiple supported versions - which is a real case, and i would use it for a distributed library or an on-premises product. what makes trunk-based work in practice, and what i would put in place first: a fast and trustworthy pipeline (if ci takes 40 minutes or is flaky, people batch changes and the model collapses), feature flags with a discipline for removing them, pull requests small enough to review in 20 minutes, branch protection with required checks, and pair or ensemble programming for the riskiest changes. the branching model is downstream of test quality, so i would fix the pipeline before arguing about branches."}, {"n": 213, "category": 12, "difficulty": "D", "html": "Docker image optimization for Java: layers, JLink, distroless, multi-stage builds.", "answerTitle": "Docker image optimization for Java", "answer": "<ul><li><strong>Multi-stage build<\/strong>: compile with the JDK, run on a JRE or a <code>jlink<\/code>-trimmed runtime, so build tooling and source never ship.<\/li><li><strong>Layered JARs<\/strong>: Spring Boot&#x27;s layered mode splits dependencies, spring-boot-loader, snapshot dependencies and application classes into separate layers, so a code change re-pushes a few hundred kilobytes instead of the whole fat JAR. Use <code>bootBuildImage<\/code>/buildpacks or an explicit <code>layertools extract<\/code>.<\/li><li><strong>Small base image<\/strong>: <code>eclipse-temurin:21-jre-alpine<\/code> or, better, a <strong>distroless<\/strong> base - no shell, no package manager, minimal CVE surface. Debugging becomes harder, which is the trade-off; an ephemeral debug container solves it on Kubernetes.<\/li><li><strong><code>jlink<\/code><\/strong> a custom runtime containing only the modules you use, typically halving the JRE size.<\/li><li>Order Dockerfile instructions from least to most frequently changing so the layer cache is effective, and use a <code>.dockerignore<\/code>.<\/li><li>Run as a <strong>non-root user<\/strong>, set a read-only root filesystem, and pin base images by digest.<\/li><li>Consider <strong>CDS/AppCDS<\/strong> (or a GraalVM native image where startup dominates) to cut startup time, which matters more than image size for scaling responsiveness.<\/li><\/ul><p>Worth saying explicitly: image size mostly affects pull time on a cold node, so I optimize layer <em>churn<\/em> first and absolute size second.<\/p>", "source": "answers.md", "search": "docker image optimization for java: layers, jlink, distroless, multi-stage builds. - multi-stage build : compile with the jdk, run on a jre or a jlink-trimmed runtime, so build tooling and source never ship. - layered jars : spring boot's layered mode splits dependencies, spring-boot-loader, snapshot dependencies and application classes into separate layers, so a code change re-pushes a few hundred kilobytes instead of the whole fat jar. use bootbuildimage/buildpacks or an explicit layertools extract. - small base image : eclipse-temurin:21-jre-alpine or, better, a distroless base - no shell, no package manager, minimal cve surface. debugging becomes harder, which is the trade-off; an ephemeral debug container solves it on kubernetes. - jlink a custom runtime containing only the modules you use, typically halving the jre size. - order dockerfile instructions from least to most frequently changing so the layer cache is effective, and use a .dockerignore. - run as a non-root user , set a read-only root filesystem, and pin base images by digest. - consider cds/appcds (or a graalvm native image where startup dominates) to cut startup time, which matters more than image size for scaling responsiveness. worth saying explicitly: image size mostly affects pull time on a cold node, so i optimize layer churn first and absolute size second."}, {"n": 214, "category": 12, "difficulty": "T", "html": "Why did your Java container use far more memory than <code>-Xmx<\/code>, and how do you fix it?", "answerTitle": "Container memory exceeding `-Xmx`", "answer": "<p>Because <code>-Xmx<\/code> bounds only the Java heap, and the process needs much more: metaspace, the JIT code cache and compiler arenas, per-thread stacks at ~1 MB each, direct byte buffers (Netty, NIO), GC internal structures, and native allocations from libraries. Total RSS can easily be heap plus 400 MB to 1 GB.<\/p><p>A second cause on older JVMs: the container was not detected, so the JVM sized the heap and GC threads from the <em>host&#x27;s<\/em> memory and CPU count. Java 10+ is container-aware by default (<code>UseContainerSupport<\/code>), but ancient base images still get this wrong.<\/p><p>Fixes: size the heap as a percentage of the limit (<code>-XX:MaxRAMPercentage=70<\/code>) rather than a fixed value; cap the other regions explicitly (<code>-XX:MaxMetaspaceSize<\/code>, <code>-XX:MaxDirectMemorySize<\/code>, <code>-XX:ReservedCodeCacheSize<\/code>); bound thread counts, since a thread leak shows up as native memory, not heap; measure real usage with Native Memory Tracking rather than guessing; and set <code>-XX:+ExitOnOutOfMemoryError<\/code> so a poisoned process is restarted rather than limping.<\/p><p>Then set the Kubernetes memory <em>request equal to the limit<\/em> for a Guaranteed QoS class, so the pod is not evicted under node pressure, and alert on RSS approaching the limit rather than waiting for the OOM kill.<\/p>", "source": "answers.md", "search": "why did your java container use far more memory than -xmx, and how do you fix it? because -xmx bounds only the java heap, and the process needs much more: metaspace, the jit code cache and compiler arenas, per-thread stacks at ~1 mb each, direct byte buffers (netty, nio), gc internal structures, and native allocations from libraries. total rss can easily be heap plus 400 mb to 1 gb. a second cause on older jvms: the container was not detected, so the jvm sized the heap and gc threads from the host's memory and cpu count. java 10+ is container-aware by default (usecontainersupport), but ancient base images still get this wrong. fixes: size the heap as a percentage of the limit (-xx:maxrampercentage=70) rather than a fixed value; cap the other regions explicitly (-xx:maxmetaspacesize, -xx:maxdirectmemorysize, -xx:reservedcodecachesize); bound thread counts, since a thread leak shows up as native memory, not heap; measure real usage with native memory tracking rather than guessing; and set -xx:+exitonoutofmemoryerror so a poisoned process is restarted rather than limping. then set the kubernetes memory request equal to the limit for a guaranteed qos class, so the pod is not evicted under node pressure, and alert on rss approaching the limit rather than waiting for the oom kill."}, {"n": 215, "category": 12, "difficulty": "D", "html": "Kubernetes: readiness versus liveness versus startup probes. What breaks if you conflate them?", "answerTitle": "Probes", "answer": "<p><strong>Liveness<\/strong>: is the process irrecoverably broken? Failure restarts the container. Keep it dumb and dependency-free - a check that the process responds. <strong>Readiness<\/strong>: can this instance serve traffic right now? Failure removes it from the Service endpoints without restarting it, so it is the right place for &quot;dependencies are warming up&quot; or &quot;I am shedding load&quot;. <strong>Startup<\/strong>: gates the other two during a slow boot, which is exactly the Java case - a JVM taking 60 seconds to start would otherwise be killed by liveness before it ever became ready.<\/p><p>What breaks when you conflate them: putting a database check in <em>liveness<\/em> means a database blip restarts every pod in the fleet simultaneously, turning a recoverable dependency outage into a full outage with a thundering-herd reconnect. Using liveness without a startup probe means slow-starting JVMs restart forever in a crash loop. Making readiness depend on a non-critical downstream removes all instances from service when that downstream degrades, when the correct behavior was to degrade gracefully.<\/p><p>Spring Boot maps this well: <code>/actuator/health/liveness<\/code> and <code>/actuator/health/readiness<\/code> with <code>management.endpoint.health.probes.enabled=true<\/code>, and readiness automatically flips to <code>OUT_OF_SERVICE<\/code> during graceful shutdown so in-flight requests drain.<\/p>", "source": "answers.md", "search": "kubernetes: readiness versus liveness versus startup probes. what breaks if you conflate them? liveness : is the process irrecoverably broken? failure restarts the container. keep it dumb and dependency-free - a check that the process responds. readiness : can this instance serve traffic right now? failure removes it from the service endpoints without restarting it, so it is the right place for \"dependencies are warming up\" or \"i am shedding load\". startup : gates the other two during a slow boot, which is exactly the java case - a jvm taking 60 seconds to start would otherwise be killed by liveness before it ever became ready. what breaks when you conflate them: putting a database check in liveness means a database blip restarts every pod in the fleet simultaneously, turning a recoverable dependency outage into a full outage with a thundering-herd reconnect. using liveness without a startup probe means slow-starting jvms restart forever in a crash loop. making readiness depend on a non-critical downstream removes all instances from service when that downstream degrades, when the correct behavior was to degrade gracefully. spring boot maps this well: /actuator/health/liveness and /actuator/health/readiness with management.endpoint.health.probes.enabled=true, and readiness automatically flips to out_of_service during graceful shutdown so in-flight requests drain."}, {"n": 216, "category": 12, "difficulty": "D", "html": "Requests versus limits, and what happens to a JVM when it hits a CPU limit.", "answerTitle": "Requests, limits and the JVM", "answer": "<p><strong>Requests<\/strong> drive scheduling and guarantee a share; <strong>limits<\/strong> cap usage. For memory the limit is a hard kill - exceed it and the kernel OOM-kills the container, with no grace. For CPU the limit is enforced by CFS quota: the process is <em>throttled<\/em>, not killed, meaning it is descheduled until the next 100 ms period.<\/p><p>That throttling is what hurts a JVM. GC threads, JIT compiler threads and application threads all compete inside the quota, so a limit of 1 CPU on a JVM that sized its GC parallelism from the node&#x27;s 64 cores produces severe throttling and latency spikes with the CPU graph sitting well below the limit - which is why <code>container_cpu_cfs_throttled_seconds<\/code> is the metric I check before <code>container_cpu_usage<\/code>. Startup suffers most, because JIT compilation is CPU-hungry precisely when the quota is tightest.<\/p><p>My defaults: set memory request equal to limit (Guaranteed QoS, no eviction surprise); set a CPU request that reflects steady-state need and consider omitting the CPU limit for latency-sensitive services (a widely used practice, since requests already provide fair sharing), or set it generously if policy requires one; and pin <code>-XX:ActiveProcessorCount<\/code> when the JVM&#x27;s detection does not match the quota.<\/p>", "source": "answers.md", "search": "requests versus limits, and what happens to a jvm when it hits a cpu limit. requests drive scheduling and guarantee a share; limits cap usage. for memory the limit is a hard kill - exceed it and the kernel oom-kills the container, with no grace. for cpu the limit is enforced by cfs quota: the process is throttled , not killed, meaning it is descheduled until the next 100 ms period. that throttling is what hurts a jvm. gc threads, jit compiler threads and application threads all compete inside the quota, so a limit of 1 cpu on a jvm that sized its gc parallelism from the node's 64 cores produces severe throttling and latency spikes with the cpu graph sitting well below the limit - which is why container_cpu_cfs_throttled_seconds is the metric i check before container_cpu_usage. startup suffers most, because jit compilation is cpu-hungry precisely when the quota is tightest. my defaults: set memory request equal to limit (guaranteed qos, no eviction surprise); set a cpu request that reflects steady-state need and consider omitting the cpu limit for latency-sensitive services (a widely used practice, since requests already provide fair sharing), or set it generously if policy requires one; and pin -xx:activeprocessorcount when the jvm's detection does not match the quota."}, {"n": 217, "category": 12, "difficulty": "D", "html": "Terraform versus CloudFormation versus CDK. State management and drift.", "answerTitle": "Terraform, CloudFormation, CDK", "answer": "<p><strong>Terraform<\/strong>: multi-cloud, mature module ecosystem, HCL is declarative and readable, and the plan output is the best change-preview of the three. State is the operational burden - remote backend with locking (S3 plus DynamoDB), and state is sensitive because it contains secrets in plaintext.<\/p><p><strong>CloudFormation<\/strong>: AWS-native, no state file to manage (AWS tracks it), automatic rollback on failure, and StackSets for multi-account. Slower to support new services than it once was, and YAML at scale becomes unwieldy.<\/p><p><strong>CDK<\/strong>: real programming languages compiling to CloudFormation, so you get loops, types, abstraction and unit tests, plus high-level constructs that encode good defaults. The risk is that the generated resources are hidden behind constructs, and an upgrade can produce a surprising diff - <code>cdk diff<\/code> discipline is essential.<\/p><p>My choice depends on context: AWS-only with a strong developer culture, CDK; multi-cloud or a platform team standardizing across providers, Terraform. Either way the practices matter more than the tool - modules with versioned releases, no manual console changes, drift detection running on a schedule (<code>terraform plan<\/code> in CI, or CloudFormation drift detection), policy as code (OPA/Sentinel, cfn-guard) in the pipeline, and separate state per environment. <strong>Drift<\/strong> is the failure I plan for explicitly: someone will click in the console during an incident, so detection plus a documented reconciliation path is part of the design, not an afterthought.<\/p>", "source": "answers.md", "search": "terraform versus cloudformation versus cdk. state management and drift. terraform : multi-cloud, mature module ecosystem, hcl is declarative and readable, and the plan output is the best change-preview of the three. state is the operational burden - remote backend with locking (s3 plus dynamodb), and state is sensitive because it contains secrets in plaintext. cloudformation : aws-native, no state file to manage (aws tracks it), automatic rollback on failure, and stacksets for multi-account. slower to support new services than it once was, and yaml at scale becomes unwieldy. cdk : real programming languages compiling to cloudformation, so you get loops, types, abstraction and unit tests, plus high-level constructs that encode good defaults. the risk is that the generated resources are hidden behind constructs, and an upgrade can produce a surprising diff - cdk diff discipline is essential. my choice depends on context: aws-only with a strong developer culture, cdk; multi-cloud or a platform team standardizing across providers, terraform. either way the practices matter more than the tool - modules with versioned releases, no manual console changes, drift detection running on a schedule (terraform plan in ci, or cloudformation drift detection), policy as code (opa/sentinel, cfn-guard) in the pipeline, and separate state per environment. drift is the failure i plan for explicitly: someone will click in the console during an incident, so detection plus a documented reconciliation path is part of the design, not an afterthought."}, {"n": 218, "category": 12, "difficulty": "D", "html": "Observability: metrics, logs, traces. What do you instrument by default in every service?", "answerTitle": "Default instrumentation", "answer": "<p>Every service gets, without anyone asking:<\/p><ul><li><strong>Metrics<\/strong> via Micrometer to Prometheus: the RED signals per endpoint (rate, errors, duration as a histogram so quantiles are computable, never a pre-aggregated average), plus JVM metrics (heap, GC pause and frequency, thread counts, class loading), connection pool metrics (Hikari active/idle/pending), HTTP client metrics per downstream, cache hit ratio, and queue depth and consumer lag for anything asynchronous. Business metrics too - orders placed, payments failed - because those detect problems the technical metrics miss.<\/li><li><strong>Logs<\/strong>: structured JSON, one event per line, with the trace ID, span ID, tenant and user ID in the MDC, at a sane level (INFO for business events, DEBUG off in production), and never containing secrets, tokens or PII. Sampled or rate-limited for high-volume paths, because log ingestion is often the largest observability cost line.<\/li><li><strong>Traces<\/strong>: OpenTelemetry auto-instrumentation with a Java agent, with manual spans around meaningful business operations and significant attributes (tenant, entity ID, result). Tail-based sampling so all errors and slow requests are kept while routine traffic is sampled down.<\/li><li><strong>Correlation<\/strong>: the same trace ID flows through logs, traces and error reports, and is returned to the client in a response header so a support ticket leads straight to the evidence.<\/li><\/ul><p>Then the outputs: a standard dashboard template per service (RED plus saturation), alerts derived from SLOs rather than from thresholds someone guessed, and a runbook link on every alert.<\/p>", "source": "answers.md", "search": "observability: metrics, logs, traces. what do you instrument by default in every service? every service gets, without anyone asking: - metrics via micrometer to prometheus: the red signals per endpoint (rate, errors, duration as a histogram so quantiles are computable, never a pre-aggregated average), plus jvm metrics (heap, gc pause and frequency, thread counts, class loading), connection pool metrics (hikari active/idle/pending), http client metrics per downstream, cache hit ratio, and queue depth and consumer lag for anything asynchronous. business metrics too - orders placed, payments failed - because those detect problems the technical metrics miss. - logs : structured json, one event per line, with the trace id, span id, tenant and user id in the mdc, at a sane level (info for business events, debug off in production), and never containing secrets, tokens or pii. sampled or rate-limited for high-volume paths, because log ingestion is often the largest observability cost line. - traces : opentelemetry auto-instrumentation with a java agent, with manual spans around meaningful business operations and significant attributes (tenant, entity id, result). tail-based sampling so all errors and slow requests are kept while routine traffic is sampled down. - correlation : the same trace id flows through logs, traces and error reports, and is returned to the client in a response header so a support ticket leads straight to the evidence. then the outputs: a standard dashboard template per service (red plus saturation), alerts derived from slos rather than from thresholds someone guessed, and a runbook link on every alert."}, {"n": 219, "category": 12, "difficulty": "D", "html": "SLI, SLO, error budget - how do you actually use an error budget to make decisions?", "answerTitle": "SLI, SLO and error budgets", "answer": "<p>An <strong>SLI<\/strong> is a measured ratio of good events to valid events - request success rate, or the fraction of requests served under 300 ms. An <strong>SLO<\/strong> is the target for that SLI over a window, for example 99.9 percent over 28 rolling days. The <strong>error budget<\/strong> is the remaining allowance: 99.9 percent over 28 days permits about 40 minutes of failure.<\/p><p>How I actually use the budget, which is the part interviewers are testing: it converts reliability from an argument into a number both engineering and product accept in advance. Budget healthy means we can ship faster, take more deployment risk, and run chaos experiments. Budget more than half consumed means we tighten canary criteria and prioritize reliability work. Budget exhausted means a feature freeze on that service until it is back within target, and the remediation work goes to the top of the backlog - agreed with the product owner <em>before<\/em> the incident, not negotiated during it.<\/p><p>Practical requirements: alert on <strong>burn rate<\/strong>, not on individual failures - a fast burn (2 percent of budget in an hour) pages, a slow burn opens a ticket - which is what eliminates most alert noise. Choose SLIs from the user&#x27;s perspective, measured at the edge where the user experiences them. Keep the number of SLOs small; three meaningful ones beat twenty nobody trusts. And set the target from what the business actually needs, because every additional nine multiplies cost - most internal services do not need four.<\/p>", "source": "answers.md", "search": "sli, slo, error budget - how do you actually use an error budget to make decisions? an sli is a measured ratio of good events to valid events - request success rate, or the fraction of requests served under 300 ms. an slo is the target for that sli over a window, for example 99.9 percent over 28 rolling days. the error budget is the remaining allowance: 99.9 percent over 28 days permits about 40 minutes of failure. how i actually use the budget, which is the part interviewers are testing: it converts reliability from an argument into a number both engineering and product accept in advance. budget healthy means we can ship faster, take more deployment risk, and run chaos experiments. budget more than half consumed means we tighten canary criteria and prioritize reliability work. budget exhausted means a feature freeze on that service until it is back within target, and the remediation work goes to the top of the backlog - agreed with the product owner before the incident, not negotiated during it. practical requirements: alert on burn rate , not on individual failures - a fast burn (2 percent of budget in an hour) pages, a slow burn opens a ticket - which is what eliminates most alert noise. choose slis from the user's perspective, measured at the edge where the user experiences them. keep the number of slos small; three meaningful ones beat twenty nobody trusts. and set the target from what the business actually needs, because every additional nine multiplies cost - most internal services do not need four."}, {"n": 220, "category": 12, "difficulty": "D", "html": "What does a good alert look like? How do you eliminate alert fatigue?", "answerTitle": "Good alerts", "answer": "<p>A good alert is <strong>symptom-based, actionable, urgent and attributable<\/strong>: it fires on something a user is experiencing, a human must do something about it now, and there is a documented action. If the answer to &quot;what do I do when this fires?&quot; is &quot;look at it and probably nothing&quot;, it should not page.<\/p><p>Concretely, every alert I approve has: a clear title naming the affected service and user impact, a link to a runbook with diagnosis steps, a dashboard link, the right severity (page versus ticket versus dashboard-only), and an owner.<\/p><p>How I eliminate fatigue: alert on SLO burn rate rather than on causes, so one alert covers many failure modes instead of ten cause-based alerts firing together; delete alerts that have never led to action, which is usually a large fraction; group and deduplicate related alerts into a single incident; use <code>for<\/code> durations so transient blips self-resolve; suppress downstream alerts when an upstream dependency is already alerting; and review every page in the weekly operational review, asking whether it was actionable - anything that was not gets fixed or removed that week.<\/p><p>The cultural point I make: alert fatigue is not an inconvenience, it is a reliability risk, because the page that matters gets ignored alongside the ones that do not. Tracking pages per on-call shift as a metric, with a target, is what actually drives it down.<\/p>", "source": "answers.md", "search": "what does a good alert look like? how do you eliminate alert fatigue? a good alert is symptom-based, actionable, urgent and attributable : it fires on something a user is experiencing, a human must do something about it now, and there is a documented action. if the answer to \"what do i do when this fires?\" is \"look at it and probably nothing\", it should not page. concretely, every alert i approve has: a clear title naming the affected service and user impact, a link to a runbook with diagnosis steps, a dashboard link, the right severity (page versus ticket versus dashboard-only), and an owner. how i eliminate fatigue: alert on slo burn rate rather than on causes, so one alert covers many failure modes instead of ten cause-based alerts firing together; delete alerts that have never led to action, which is usually a large fraction; group and deduplicate related alerts into a single incident; use for durations so transient blips self-resolve; suppress downstream alerts when an upstream dependency is already alerting; and review every page in the weekly operational review, asking whether it was actionable - anything that was not gets fixed or removed that week. the cultural point i make: alert fatigue is not an inconvenience, it is a reliability risk, because the page that matters gets ignored alongside the ones that do not. tracking pages per on-call shift as a metric, with a target, is what actually drives it down."}, {"n": 221, "category": 12, "difficulty": "A", "html": "How do you run a blameless postmortem, and what makes one useful six months later?", "answerTitle": "Blameless postmortems", "answer": "<p>The premise is that people act rationally given the information and incentives available to them at the time, so &quot;human error&quot; is the <em>start<\/em> of the investigation, not its conclusion. If an engineer could take down production with one command, the system permitted it - that is the finding.<\/p><p>How I run one: within a few days while memory is fresh; a facilitator who was not the responder; a timeline built from evidence (logs, traces, chat, deploy records) rather than recollection; and a structure covering impact in user terms, detection (how long, and did monitoring or a customer find it), response, resolution, and contributing factors - plural, because single root causes are usually a simplification. I explicitly include what went <em>well<\/em>, and I ask counterfactual-free questions (&quot;what information did you have?&quot;) rather than &quot;why didn&#x27;t you...&quot;.<\/p><p>What makes it still useful in six months: quantified impact, so the cost is comparable across incidents; a clear narrative someone outside the team can follow; and a small number of specific, owned, dated action items entered in the normal backlog - two real fixes that ship beat fifteen that do not. I also track the aggregate: recurring themes across postmortems are what justify platform investment, and a postmortem action-item completion rate is a metric I report to leadership.<\/p><p>The failure mode to name: a postmortem process that produces documents nobody reads and actions nobody completes is theatre, and it burns the team&#x27;s willingness to be honest the next time.<\/p>", "source": "answers.md", "search": "how do you run a blameless postmortem, and what makes one useful six months later? the premise is that people act rationally given the information and incentives available to them at the time, so \"human error\" is the start of the investigation, not its conclusion. if an engineer could take down production with one command, the system permitted it - that is the finding. how i run one: within a few days while memory is fresh; a facilitator who was not the responder; a timeline built from evidence (logs, traces, chat, deploy records) rather than recollection; and a structure covering impact in user terms, detection (how long, and did monitoring or a customer find it), response, resolution, and contributing factors - plural, because single root causes are usually a simplification. i explicitly include what went well , and i ask counterfactual-free questions (\"what information did you have?\") rather than \"why didn't you...\". what makes it still useful in six months: quantified impact, so the cost is comparable across incidents; a clear narrative someone outside the team can follow; and a small number of specific, owned, dated action items entered in the normal backlog - two real fixes that ship beat fifteen that do not. i also track the aggregate: recurring themes across postmortems are what justify platform investment, and a postmortem action-item completion rate is a metric i report to leadership. the failure mode to name: a postmortem process that produces documents nobody reads and actions nobody completes is theatre, and it burns the team's willingness to be honest the next time."}, {"n": 222, "category": 13, "difficulty": "D", "html": "How do you integrate an LLM into a Spring Boot service? Describe the architecture.", "answerTitle": "LLM integration architecture", "answer": "<p>I treat the model as an unreliable, expensive, non-deterministic external dependency, and the architecture follows from that.<\/p><p>Shape: a dedicated module behind a domain interface (<code>AnswerGenerator<\/code>, not <code>OpenAiClient<\/code>) so the provider is swappable and testable; a gateway layer handling authentication, retries with backoff, timeouts, circuit breaking and provider fallback; prompt templates versioned in source control and rendered server-side, never assembled from raw user input; structured output enforced via JSON schema / tool-calling and validated against a DTO before anything downstream sees it; streaming to the client over SSE for perceived latency; a semantic or exact-match cache for repeated queries; and full observability - token counts, cost, latency, model version and prompt version on every call, with the prompt and response sampled for evaluation.<\/p><p>Around it: rate limits per tenant, a budget cap that degrades rather than fails, and a kill switch feature flag. Spring AI or LangChain4j gives the client abstraction, chat memory and tool calling so I do not write that plumbing myself.<\/p><p>The point I would make: the model call is 10 percent of the work; the other 90 percent is the retrieval, validation, cost control and evaluation around it.<\/p>", "source": "answers.md", "search": "how do you integrate an llm into a spring boot service? describe the architecture. i treat the model as an unreliable, expensive, non-deterministic external dependency, and the architecture follows from that. shape: a dedicated module behind a domain interface (answergenerator, not openaiclient) so the provider is swappable and testable; a gateway layer handling authentication, retries with backoff, timeouts, circuit breaking and provider fallback; prompt templates versioned in source control and rendered server-side, never assembled from raw user input; structured output enforced via json schema / tool-calling and validated against a dto before anything downstream sees it; streaming to the client over sse for perceived latency; a semantic or exact-match cache for repeated queries; and full observability - token counts, cost, latency, model version and prompt version on every call, with the prompt and response sampled for evaluation. around it: rate limits per tenant, a budget cap that degrades rather than fails, and a kill switch feature flag. spring ai or langchain4j gives the client abstraction, chat memory and tool calling so i do not write that plumbing myself. the point i would make: the model call is 10 percent of the work; the other 90 percent is the retrieval, validation, cost control and evaluation around it."}, {"n": 223, "category": 13, "difficulty": "D", "html": "What is RAG, and what are the failure modes of a naive implementation?", "answerTitle": "RAG and its failure modes", "answer": "<p>RAG retrieves relevant documents from a knowledge base and puts them in the prompt as grounding, so the model answers from your data rather than from its parameters - which fixes staleness, enables citations, and avoids fine-tuning for factual updates.<\/p><p>The failure modes of a naive implementation, which is what the question is really asking:<\/p><ul><li><strong>Retrieval misses.<\/strong> Pure vector similarity fails on exact terms, product codes, acronyms and negation. Fix with hybrid search (BM25 plus vectors, fused with reciprocal rank fusion) and a reranker.<\/li><li><strong>Bad chunking.<\/strong> Fixed-size splits cut tables and sentences in half and strip context. Fix with structure-aware chunking, overlap, and attaching document and section metadata to each chunk - or contextual retrieval, where each chunk is prefixed with a short summary of its place in the document.<\/li><li><strong>Retrieved-but-not-used, or worse, wrong-and-used.<\/strong> Relevant context ranked low is ignored, and irrelevant context actively misleads. Fix by reranking, limiting to the top few chunks, and prompting the model to say it does not know.<\/li><li><strong>No grounding enforcement.<\/strong> The model blends retrieved facts with its own priors. Require citations to chunk IDs and verify them programmatically; reject answers whose claims are not supported.<\/li><li><strong>Stale or unpermissioned index.<\/strong> Documents change and access control does not carry into the vector store - a genuine data-leak risk in a multi-tenant system. Filter by tenant and ACL <em>at query time<\/em>, not after retrieval.<\/li><li><strong>No evaluation.<\/strong> Without a measured retrieval hit rate and answer-faithfulness score, every prompt change is a guess.<\/li><\/ul>", "source": "answers.md", "search": "what is rag, and what are the failure modes of a naive implementation? rag retrieves relevant documents from a knowledge base and puts them in the prompt as grounding, so the model answers from your data rather than from its parameters - which fixes staleness, enables citations, and avoids fine-tuning for factual updates. the failure modes of a naive implementation, which is what the question is really asking: - retrieval misses. pure vector similarity fails on exact terms, product codes, acronyms and negation. fix with hybrid search (bm25 plus vectors, fused with reciprocal rank fusion) and a reranker. - bad chunking. fixed-size splits cut tables and sentences in half and strip context. fix with structure-aware chunking, overlap, and attaching document and section metadata to each chunk - or contextual retrieval, where each chunk is prefixed with a short summary of its place in the document. - retrieved-but-not-used, or worse, wrong-and-used. relevant context ranked low is ignored, and irrelevant context actively misleads. fix by reranking, limiting to the top few chunks, and prompting the model to say it does not know. - no grounding enforcement. the model blends retrieved facts with its own priors. require citations to chunk ids and verify them programmatically; reject answers whose claims are not supported. - stale or unpermissioned index. documents change and access control does not carry into the vector store - a genuine data-leak risk in a multi-tenant system. filter by tenant and acl at query time , not after retrieval. - no evaluation. without a measured retrieval hit rate and answer-faithfulness score, every prompt change is a guess."}, {"n": 224, "category": 13, "difficulty": "D", "html": "Embeddings and vector databases: chunking strategy, similarity metrics, and hybrid search.", "answerTitle": "Embeddings and vector search", "answer": "<p>An embedding maps text to a dense vector where semantic similarity is geometric proximity. Similarity is almost always <strong>cosine<\/strong> (magnitude-invariant, and equivalent to dot product on normalized vectors); Euclidean is used occasionally, and the choice must match how the model was trained.<\/p><p><strong>Chunking<\/strong> is the decision that most affects quality: 200-500 tokens with 10-20 percent overlap as a starting point, split on semantic boundaries (headings, paragraphs) rather than character counts, keeping tables and code blocks intact, and storing rich metadata (source, section, date, tenant, ACL) for filtering. Small chunks retrieve precisely but lack context - the small-to-big pattern retrieves small chunks and passes their larger parent to the model.<\/p><p><strong>Hybrid search<\/strong> matters because dense vectors alone lose exact-match capability: run BM25 and vector search in parallel and fuse the rankings (RRF), then rerank the top 50 down to the top 5 with a cross-encoder. That combination consistently outperforms either alone.<\/p><p><strong>Store choice<\/strong>: pgvector when Postgres is already there and the corpus is moderate - one system to operate, and metadata filtering with real SQL, which is a bigger advantage than people expect; OpenSearch when you also need lexical search and already run it; a dedicated store (Pinecone, Qdrant, Weaviate) at large scale or when you need advanced filtering and sharding. Index type is an ANN accuracy/latency trade-off: HNSW for low latency at higher memory, IVFFlat for lower memory at some recall cost.<\/p><p>Operational details worth naming: embeddings must be regenerated when you change the model, so plan for a re-index; normalize vectors once at write time; and store the embedding model version alongside the vector so a mixed index is detectable.<\/p>", "source": "answers.md", "search": "embeddings and vector databases: chunking strategy, similarity metrics, and hybrid search. an embedding maps text to a dense vector where semantic similarity is geometric proximity. similarity is almost always cosine (magnitude-invariant, and equivalent to dot product on normalized vectors); euclidean is used occasionally, and the choice must match how the model was trained. chunking is the decision that most affects quality: 200-500 tokens with 10-20 percent overlap as a starting point, split on semantic boundaries (headings, paragraphs) rather than character counts, keeping tables and code blocks intact, and storing rich metadata (source, section, date, tenant, acl) for filtering. small chunks retrieve precisely but lack context - the small-to-big pattern retrieves small chunks and passes their larger parent to the model. hybrid search matters because dense vectors alone lose exact-match capability: run bm25 and vector search in parallel and fuse the rankings (rrf), then rerank the top 50 down to the top 5 with a cross-encoder. that combination consistently outperforms either alone. store choice : pgvector when postgres is already there and the corpus is moderate - one system to operate, and metadata filtering with real sql, which is a bigger advantage than people expect; opensearch when you also need lexical search and already run it; a dedicated store (pinecone, qdrant, weaviate) at large scale or when you need advanced filtering and sharding. index type is an ann accuracy/latency trade-off: hnsw for low latency at higher memory, ivfflat for lower memory at some recall cost. operational details worth naming: embeddings must be regenerated when you change the model, so plan for a re-index; normalize vectors once at write time; and store the embedding model version alongside the vector so a mixed index is detectable."}, {"n": 225, "category": 13, "difficulty": "D", "html": "How do you control LLM cost and latency in production?", "answerTitle": "Controlling LLM cost and latency", "answer": "<p>Cost first, because it is the one that surprises finance:<\/p><ul><li><strong>Right-size the model per task.<\/strong> Routing simple classification and extraction to a small model and reserving the frontier model for genuinely hard generation typically cuts spend by most of the bill.<\/li><li><strong>Cache aggressively.<\/strong> Exact-match caching for repeated queries, semantic caching for near-duplicates, and provider-side prompt caching for long stable system prompts and retrieved context.<\/li><li><strong>Control tokens.<\/strong> Trim retrieved context to what is needed, cap conversation history with summarization rather than unbounded accumulation, and constrain <code>max_tokens<\/code>.<\/li><li><strong>Batch<\/strong> offline work through batch APIs at a large discount.<\/li><li><strong>Budget guardrails.<\/strong> Per-tenant and per-feature quotas, a hard monthly cap, and a documented degradation path when it is hit.<\/li><\/ul><p>Latency:<\/p><ul><li><strong>Stream<\/strong> the response so time-to-first-token is what the user perceives.<\/li><li><strong>Parallelize<\/strong> retrieval and any independent calls; overlap embedding with other work.<\/li><li><strong>Shorten the critical path<\/strong> - fewer chained model calls; an agent that makes six sequential calls is six times the latency and the failure surface.<\/li><li><strong>Set aggressive timeouts<\/strong> with a fallback to a smaller model or a cached answer, rather than letting the user wait 30 seconds.<\/li><\/ul><p>Measurement underpins all of it: tokens in, tokens out, cost and latency tagged by feature, tenant, model and prompt version, on a dashboard the team sees weekly. You cannot control what you have not attributed.<\/p>", "source": "answers.md", "search": "how do you control llm cost and latency in production? cost first, because it is the one that surprises finance: - right-size the model per task. routing simple classification and extraction to a small model and reserving the frontier model for genuinely hard generation typically cuts spend by most of the bill. - cache aggressively. exact-match caching for repeated queries, semantic caching for near-duplicates, and provider-side prompt caching for long stable system prompts and retrieved context. - control tokens. trim retrieved context to what is needed, cap conversation history with summarization rather than unbounded accumulation, and constrain max_tokens. - batch offline work through batch apis at a large discount. - budget guardrails. per-tenant and per-feature quotas, a hard monthly cap, and a documented degradation path when it is hit. latency: - stream the response so time-to-first-token is what the user perceives. - parallelize retrieval and any independent calls; overlap embedding with other work. - shorten the critical path - fewer chained model calls; an agent that makes six sequential calls is six times the latency and the failure surface. - set aggressive timeouts with a fallback to a smaller model or a cached answer, rather than letting the user wait 30 seconds. measurement underpins all of it: tokens in, tokens out, cost and latency tagged by feature, tenant, model and prompt version, on a dashboard the team sees weekly. you cannot control what you have not attributed."}, {"n": 226, "category": 13, "difficulty": "D", "html": "Prompt injection: how does it work against a tool-using agent, and how do you defend?", "answerTitle": "Prompt injection", "answer": "<p>Instructions and data share one channel, so any text the model reads can attempt to redirect it - and unlike SQL injection there is no parameterization that reliably separates them. <strong>Direct<\/strong> injection is a user typing &quot;ignore your instructions&quot;; <strong>indirect<\/strong> is the dangerous one, where the payload is planted in a document, web page, email or code comment that your retrieval or browsing tool later ingests.<\/p><p>Against a tool-using agent the impact is not a rude reply, it is action: exfiltrating data through a tool call, sending an email, modifying a record, or chaining to another system with the agent&#x27;s credentials.<\/p><p>Defense is layered, because no single control holds:<\/p><ul><li><strong>Treat all model output as untrusted input.<\/strong> Never pass it to <code>eval<\/code>, a shell, or an unparameterized query.<\/li><li><strong>Constrain the tools, not the prompt.<\/strong> Least privilege per tool, allowlisted operations, parameter validation and schema enforcement, and no tool that can do irreversible or high-value damage without a human approval step.<\/li><li><strong>Isolate untrusted content<\/strong> in a clearly delimited section with instructions that content there is data, never instructions - helpful, not sufficient.<\/li><li><strong>Separate privilege levels<\/strong>: a planner model that sees only trusted input decides actions, while a second model handles untrusted content and cannot invoke tools (the dual-LLM pattern).<\/li><li><strong>Egress control<\/strong>: block the agent from making arbitrary outbound requests, since rendering an image URL is a classic exfiltration channel.<\/li><li><strong>Detection and limits<\/strong>: input/output filtering, anomaly detection on tool usage, rate limits, and full audit logging of every tool invocation.<\/li><\/ul><p>The honest framing for an interview: prompt injection is not solved, so I design assuming it will succeed occasionally and limit the blast radius accordingly.<\/p>", "source": "answers.md", "search": "prompt injection: how does it work against a tool-using agent, and how do you defend? instructions and data share one channel, so any text the model reads can attempt to redirect it - and unlike sql injection there is no parameterization that reliably separates them. direct injection is a user typing \"ignore your instructions\"; indirect is the dangerous one, where the payload is planted in a document, web page, email or code comment that your retrieval or browsing tool later ingests. against a tool-using agent the impact is not a rude reply, it is action: exfiltrating data through a tool call, sending an email, modifying a record, or chaining to another system with the agent's credentials. defense is layered, because no single control holds: - treat all model output as untrusted input. never pass it to eval, a shell, or an unparameterized query. - constrain the tools, not the prompt. least privilege per tool, allowlisted operations, parameter validation and schema enforcement, and no tool that can do irreversible or high-value damage without a human approval step. - isolate untrusted content in a clearly delimited section with instructions that content there is data, never instructions - helpful, not sufficient. - separate privilege levels : a planner model that sees only trusted input decides actions, while a second model handles untrusted content and cannot invoke tools (the dual-llm pattern). - egress control : block the agent from making arbitrary outbound requests, since rendering an image url is a classic exfiltration channel. - detection and limits : input/output filtering, anomaly detection on tool usage, rate limits, and full audit logging of every tool invocation. the honest framing for an interview: prompt injection is not solved, so i design assuming it will succeed occasionally and limit the blast radius accordingly."}, {"n": 227, "category": 13, "difficulty": "D", "html": "How do you evaluate an AI feature? What does your regression suite look like when outputs are non-deterministic?", "answerTitle": "Evaluating an AI feature", "answer": "<p>Non-determinism means the usual assert-equals test does not apply, so I build a layered evaluation instead of pretending the problem away.<\/p><ul><li><strong>A golden dataset<\/strong> of a few hundred realistic cases with expected outcomes, drawn from real usage and from known failure cases, version-controlled and grown every time production surfaces a new failure.<\/li><li><strong>Deterministic assertions wherever possible<\/strong>: schema validity, required fields present, citations resolving to real chunks, no PII in output, latency and cost within bounds, refusal on out-of-scope input. A surprising share of real regressions are caught here.<\/li><li><strong>Component metrics<\/strong> rather than only end-to-end: for RAG, retrieval recall@k and precision, then answer faithfulness (is every claim supported by the retrieved context) and answer relevance. Isolating retrieval from generation is what makes failures diagnosable.<\/li><li><strong>LLM-as-judge<\/strong> for subjective quality, with a rubric, a stronger model than the one under test, pairwise comparison rather than absolute scoring, and periodic calibration against human labels so I know the judge&#x27;s agreement rate. I treat it as a noisy signal, not truth.<\/li><li><strong>Human review<\/strong> on a sampled slice, especially for anything customer-facing or regulated.<\/li><li><strong>In production<\/strong>: online metrics - thumbs up/down, task completion, escalation to a human, edit distance on accepted suggestions - plus A/B tests for meaningful changes, and shadow evaluation of a candidate model against live traffic.<\/li><\/ul><p>Then the discipline: run the suite in CI on every prompt, model or retrieval change (prompts are code and belong in version control), pin model versions and treat a provider&#x27;s model update as a change requiring re-evaluation, and define release criteria as thresholds rather than vibes. Report a distribution and a confidence interval, not a single score.<\/p>", "source": "answers.md", "search": "how do you evaluate an ai feature? what does your regression suite look like when outputs are non-deterministic? non-determinism means the usual assert-equals test does not apply, so i build a layered evaluation instead of pretending the problem away. - a golden dataset of a few hundred realistic cases with expected outcomes, drawn from real usage and from known failure cases, version-controlled and grown every time production surfaces a new failure. - deterministic assertions wherever possible : schema validity, required fields present, citations resolving to real chunks, no pii in output, latency and cost within bounds, refusal on out-of-scope input. a surprising share of real regressions are caught here. - component metrics rather than only end-to-end: for rag, retrieval recall@k and precision, then answer faithfulness (is every claim supported by the retrieved context) and answer relevance. isolating retrieval from generation is what makes failures diagnosable. - llm-as-judge for subjective quality, with a rubric, a stronger model than the one under test, pairwise comparison rather than absolute scoring, and periodic calibration against human labels so i know the judge's agreement rate. i treat it as a noisy signal, not truth. - human review on a sampled slice, especially for anything customer-facing or regulated. - in production : online metrics - thumbs up/down, task completion, escalation to a human, edit distance on accepted suggestions - plus a/b tests for meaningful changes, and shadow evaluation of a candidate model against live traffic. then the discipline: run the suite in ci on every prompt, model or retrieval change (prompts are code and belong in version control), pin model versions and treat a provider's model update as a change requiring re-evaluation, and define release criteria as thresholds rather than vibes. report a distribution and a confidence interval, not a single score."}, {"n": 228, "category": 13, "difficulty": "D", "html": "Streaming responses in Spring: SSE versus WebSocket versus WebFlux. What are the operational concerns?", "answerTitle": "Streaming responses", "answer": "<p><strong>SSE<\/strong> is the right default for LLM output: one-directional server-to-client, plain HTTP so it traverses proxies and load balancers, automatic browser reconnection with <code>Last-Event-ID<\/code>, and trivial in Spring (<code>SseEmitter<\/code> in MVC, or <code>Flux&lt;ServerSentEvent&gt;<\/code> in WebFlux). <strong>WebSocket<\/strong> only when you genuinely need bidirectional low-latency messaging - interrupting generation mid-stream, collaborative sessions, voice. <strong>WebFlux<\/strong> is an implementation choice underneath either, valuable because a long-held stream ties up a thread in MVC - though with virtual threads that objection largely disappears, so I would not adopt WebFlux for this reason alone in 2026.<\/p><p>The operational concerns are where experience shows:<\/p><ul><li><strong>Timeouts and buffering<\/strong> in every intermediary - ALB idle timeout, Nginx <code>proxy_buffering off<\/code> and <code>X-Accel-Buffering: no<\/code>, CloudFront - or the client sees nothing until the response completes, which is the single most common streaming bug.<\/li><li><strong>Connection budget<\/strong>: each stream holds a connection for its lifetime, so capacity planning is by concurrent streams, not requests per second.<\/li><li><strong>Cancellation<\/strong>: detect client disconnect and abort the upstream model call, or you keep paying for tokens nobody will read.<\/li><li><strong>Errors mid-stream<\/strong>: the HTTP status was already sent as 200, so failures must be delivered as an error event the client understands, and partial output must be handled.<\/li><li><strong>Heartbeats<\/strong> to keep idle connections alive, graceful shutdown that drains streams, and sticky-free design so any instance can serve.<\/li><li>Content moderation and validation become harder because you are emitting before you have the whole answer - buffer a window, or accept the risk and be able to retract.<\/li><\/ul>", "source": "answers.md", "search": "streaming responses in spring: sse versus websocket versus webflux. what are the operational concerns? sse is the right default for llm output: one-directional server-to-client, plain http so it traverses proxies and load balancers, automatic browser reconnection with last-event-id, and trivial in spring (sseemitter in mvc, or flux<serversentevent in webflux). websocket only when you genuinely need bidirectional low-latency messaging - interrupting generation mid-stream, collaborative sessions, voice. webflux is an implementation choice underneath either, valuable because a long-held stream ties up a thread in mvc - though with virtual threads that objection largely disappears, so i would not adopt webflux for this reason alone in 2026. the operational concerns are where experience shows: - timeouts and buffering in every intermediary - alb idle timeout, nginx proxy_buffering off and x-accel-buffering: no, cloudfront - or the client sees nothing until the response completes, which is the single most common streaming bug. - connection budget : each stream holds a connection for its lifetime, so capacity planning is by concurrent streams, not requests per second. - cancellation : detect client disconnect and abort the upstream model call, or you keep paying for tokens nobody will read. - errors mid-stream : the http status was already sent as 200, so failures must be delivered as an error event the client understands, and partial output must be handled. - heartbeats to keep idle connections alive, graceful shutdown that drains streams, and sticky-free design so any instance can serve. - content moderation and validation become harder because you are emitting before you have the whole answer - buffer a window, or accept the risk and be able to retract."}, {"n": 229, "category": 13, "difficulty": "D", "html": "Spring AI or LangChain4j - what do they give you and what would you build yourself?", "answerTitle": "Spring AI versus LangChain4j versus building it", "answer": "<p>Both give the same core value: a provider-agnostic chat and embedding client, structured output binding to Java types, tool/function calling, chat memory, document loaders and splitters, vector store abstractions over pgvector/OpenSearch/Qdrant, and RAG plumbing. Spring AI fits naturally into Boot&#x27;s auto-configuration, observability and testing story, which is decisive when the rest of the stack is Spring; LangChain4j is framework-agnostic and has moved faster on some agent features.<\/p><p>What I would take from them: the client abstraction, retry and observability wiring, structured output, and the document/embedding pipeline - reimplementing those is undifferentiated work.<\/p><p>What I would build myself regardless: prompt management and versioning (they are business logic and deserve first-class treatment, review and evaluation), the evaluation harness, cost attribution and budget enforcement, the retrieval strategy including hybrid search and reranking tuned to my corpus, guardrails and tenant isolation, and caching policy. Those are where the quality of the product actually lives.<\/p><p>The caveat I would state: these libraries move quickly and their abstractions are still settling, so I keep them behind my own domain interface rather than letting their types spread through the codebase - the same discipline I would apply to any fast-moving dependency.<\/p>", "source": "answers.md", "search": "spring ai or langchain4j - what do they give you and what would you build yourself? both give the same core value: a provider-agnostic chat and embedding client, structured output binding to java types, tool/function calling, chat memory, document loaders and splitters, vector store abstractions over pgvector/opensearch/qdrant, and rag plumbing. spring ai fits naturally into boot's auto-configuration, observability and testing story, which is decisive when the rest of the stack is spring; langchain4j is framework-agnostic and has moved faster on some agent features. what i would take from them: the client abstraction, retry and observability wiring, structured output, and the document/embedding pipeline - reimplementing those is undifferentiated work. what i would build myself regardless: prompt management and versioning (they are business logic and deserve first-class treatment, review and evaluation), the evaluation harness, cost attribution and budget enforcement, the retrieval strategy including hybrid search and reranking tuned to my corpus, guardrails and tenant isolation, and caching policy. those are where the quality of the product actually lives. the caveat i would state: these libraries move quickly and their abstractions are still settling, so i keep them behind my own domain interface rather than letting their types spread through the codebase - the same discipline i would apply to any fast-moving dependency."}, {"n": 230, "category": 13, "difficulty": "A", "html": "How do you handle PII and compliance when sending data to a third-party model provider?", "answerTitle": "PII and compliance with third-party models", "answer": "<p>I start from the data, not the model: classify what is being sent, and establish the legal basis and residency requirements before choosing a provider.<\/p><p>Controls I would put in place:<\/p><ul><li><strong>Minimize.<\/strong> Send only the fields the task requires; strip identifiers that add nothing. Most prompts contain far more context than the task needs.<\/li><li><strong>Redact or tokenize<\/strong> PII before it leaves the boundary, substituting stable placeholders and re-hydrating the response on the way back, so the provider never sees the real values. Automated detection (Comprehend PII, Presidio) plus deterministic rules, with the residual-risk caveat that detection is imperfect.<\/li><li><strong>Contract and configuration<\/strong>: a DPA with the provider, zero-retention / no-training-on-our-data settings enabled and verified, an enterprise tier where that is contractual rather than a checkbox, and regional endpoints or a self-hosted/Bedrock deployment inside our own account when residency demands it.<\/li><li><strong>Keep regulated data in-boundary.<\/strong> For health, payment or similarly regulated data, a model running in our VPC (Bedrock with a VPC endpoint, or a self-hosted open-weight model) is often the only defensible answer, and the quality gap in 2026 is small enough that this is a real option rather than a concession.<\/li><li><strong>Audit and governance<\/strong>: log what categories of data were sent, by whom, for what purpose; retention and deletion policies covering prompts and outputs (which are themselves personal data if they contain PII); DPIA where required; and consent or notice to users that AI processing occurs.<\/li><li><strong>Guard the output too<\/strong>: PII can leak <em>out<\/em> of a model, and a response echoing another tenant&#x27;s retrieved content is a breach - so tenant-scoped retrieval and output scanning both matter.<\/li><\/ul><p>The framing I would give leadership: this is a data-governance decision with a technical implementation, so legal, security and engineering agree the boundary once, and I encode it as a policy the platform enforces rather than a rule each team remembers.<\/p>", "source": "answers.md", "search": "how do you handle pii and compliance when sending data to a third-party model provider? i start from the data, not the model: classify what is being sent, and establish the legal basis and residency requirements before choosing a provider. controls i would put in place: - minimize. send only the fields the task requires; strip identifiers that add nothing. most prompts contain far more context than the task needs. - redact or tokenize pii before it leaves the boundary, substituting stable placeholders and re-hydrating the response on the way back, so the provider never sees the real values. automated detection (comprehend pii, presidio) plus deterministic rules, with the residual-risk caveat that detection is imperfect. - contract and configuration : a dpa with the provider, zero-retention / no-training-on-our-data settings enabled and verified, an enterprise tier where that is contractual rather than a checkbox, and regional endpoints or a self-hosted/bedrock deployment inside our own account when residency demands it. - keep regulated data in-boundary. for health, payment or similarly regulated data, a model running in our vpc (bedrock with a vpc endpoint, or a self-hosted open-weight model) is often the only defensible answer, and the quality gap in 2026 is small enough that this is a real option rather than a concession. - audit and governance : log what categories of data were sent, by whom, for what purpose; retention and deletion policies covering prompts and outputs (which are themselves personal data if they contain pii); dpia where required; and consent or notice to users that ai processing occurs. - guard the output too : pii can leak out of a model, and a response echoing another tenant's retrieved content is a breach - so tenant-scoped retrieval and output scanning both matter. the framing i would give leadership: this is a data-governance decision with a technical implementation, so legal, security and engineering agree the boundary once, and i encode it as a policy the platform enforces rather than a rule each team remembers."}, {"n": 231, "category": 13, "difficulty": "A", "html": "A stakeholder wants an AI feature that you believe is a poor fit. How do you handle it?", "answerTitle": "Pushing back on a poor-fit AI feature", "answer": "<p>I do not open with &quot;no&quot;. I try to understand the outcome they actually want, because the request is usually a proposed <em>solution<\/em> to a real problem, and the problem is often legitimate even when the solution is not.<\/p><p>Then I make the trade-off visible rather than argue from authority: what accuracy is achievable and what happens on the failure cases; what the cost per interaction is at expected volume; the latency the user will experience; the compliance and data exposure implications; and what the maintenance burden looks like when the
