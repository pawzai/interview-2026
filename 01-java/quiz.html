ng the premium up front.<\/p>", "source": "answers.md", "search": "monolith versus microservices in 2026 - when do you recommend staying monolithic? i recommend staying monolithic when the team is under roughly 20-30 engineers, the domain is not yet stable, deployment frequency is not the bottleneck, and the organization lacks the platform maturity - ci/cd, observability, on-call, infrastructure as code - to operate a distributed system. the costs people underestimate: every in-process call becomes a network call that can fail, be slow, or be duplicated; local transactions become sagas; debugging requires distributed tracing; testing requires contract tests; and the operational surface multiplies. you trade a code-complexity problem for an operations-complexity problem, and only the second one wakes you at 3am. what i actually advocate is a modular monolith with clean internal boundaries and an independent deployment path, extracting services where there is a measured need. that preserves the option value without paying the premium up front."}, {"n": 178, "category": 10, "difficulty": "D", "html": "REST maturity levels, idempotency, and correct status code usage for each operation.", "answerTitle": "REST, idempotency and status codes", "answer": "<p>Richardson maturity: level 0 (single endpoint, RPC over HTTP), 1 (resources), 2 (HTTP verbs and status codes - where most real APIs sit and where I stop unless there is a reason), 3 (HATEOAS, rarely worth it for internal APIs).<\/p><p>Idempotency by method: <code>GET<\/code>, <code>PUT<\/code>, <code>DELETE<\/code> and <code>HEAD<\/code> are idempotent by specification; <code>POST<\/code> is not, which is why creation endpoints need an <code>Idempotency-Key<\/code> header. <code>PUT<\/code> replaces the whole resource; <code>PATCH<\/code> is a partial update and is not idempotent unless you define it to be (JSON Merge Patch usually is; JSON Patch with <code>add<\/code> to an array is not).<\/p><p>Status codes: 200 with a body, 201 with a <code>Location<\/code> header for creation, 202 for accepted-but-async, 204 for a successful delete or empty response, 400 for malformed syntax, 401 unauthenticated versus 403 unauthorized, 404 for missing (and deliberately for &quot;exists but you may not see it&quot;, to avoid leaking existence), 409 for conflict such as an optimistic-lock failure, 412 for a failed precondition, 422 for semantically invalid input, 429 with <code>Retry-After<\/code>, 503 with <code>Retry-After<\/code> for shedding load. Errors should follow RFC 9457 <code>application/problem+json<\/code> so clients can parse them uniformly.<\/p>", "source": "answers.md", "search": "rest maturity levels, idempotency, and correct status code usage for each operation. richardson maturity: level 0 (single endpoint, rpc over http), 1 (resources), 2 (http verbs and status codes - where most real apis sit and where i stop unless there is a reason), 3 (hateoas, rarely worth it for internal apis). idempotency by method: get, put, delete and head are idempotent by specification; post is not, which is why creation endpoints need an idempotency-key header. put replaces the whole resource; patch is a partial update and is not idempotent unless you define it to be (json merge patch usually is; json patch with add to an array is not). status codes: 200 with a body, 201 with a location header for creation, 202 for accepted-but-async, 204 for a successful delete or empty response, 400 for malformed syntax, 401 unauthenticated versus 403 unauthorized, 404 for missing (and deliberately for \"exists but you may not see it\", to avoid leaking existence), 409 for conflict such as an optimistic-lock failure, 412 for a failed precondition, 422 for semantically invalid input, 429 with retry-after, 503 with retry-after for shedding load. errors should follow rfc 9457 application/problem+json so clients can parse them uniformly."}, {"n": 179, "category": 10, "difficulty": "D", "html": "API versioning strategies. Which do you use and how do you deprecate?", "answerTitle": "Versioning", "answer": "<p>Options: URI path (<code>/v1/orders<\/code>) - visible, cacheable, trivially routable, and my default for public APIs despite purist objections; custom header or <code>Accept<\/code> media type versioning - cleaner URLs but harder to test and to route at the edge; query parameter - avoid.<\/p><p>The more important half is the policy: version only on <em>breaking<\/em> changes, and make additive changes non-breaking by having clients tolerate unknown fields (Postel&#x27;s law, enforced in the client library). Publish a deprecation policy with a fixed support window, emit <code>Deprecation<\/code> and <code>Sunset<\/code> headers (RFC 8594), instrument per-version usage so you know exactly who is left, contact those consumers directly, and only then retire. Never run more than two major versions - the maintenance cost is what actually kills you, so the discipline is aggressive retirement, not clever versioning.<\/p>", "source": "answers.md", "search": "api versioning strategies. which do you use and how do you deprecate? options: uri path (/v1/orders) - visible, cacheable, trivially routable, and my default for public apis despite purist objections; custom header or accept media type versioning - cleaner urls but harder to test and to route at the edge; query parameter - avoid. the more important half is the policy: version only on breaking changes, and make additive changes non-breaking by having clients tolerate unknown fields (postel's law, enforced in the client library). publish a deprecation policy with a fixed support window, emit deprecation and sunset headers (rfc 8594), instrument per-version usage so you know exactly who is left, contact those consumers directly, and only then retire. never run more than two major versions - the maintenance cost is what actually kills you, so the discipline is aggressive retirement, not clever versioning."}, {"n": 180, "category": 10, "difficulty": "D", "html": "Explain the CAP theorem accurately, and then explain why PACELC is more useful.", "answerTitle": "CAP and PACELC", "answer": "<p>CAP: during a network <strong>partition<\/strong>, you must choose between consistency and availability. The common misstatement is &quot;pick two of three&quot; - partition tolerance is not optional in a distributed system, so the real choice is CP or AP, and only while partitioned.<\/p><p>PACELC is more useful because it describes the other 99.9 percent of the time: <strong>if Partitioned, choose Availability or Consistency; Else, choose Latency or Consistency.<\/strong> Synchronous replication across regions costs latency on every write even when the network is healthy; that is the trade-off you actually live with daily. DynamoDB with eventually consistent reads is PA/EL; a single-leader RDBMS with synchronous replicas is PC/EC; Cassandra is tunable per query.<\/p><p>Framing it this way in an interview signals you have operated these systems rather than read about them.<\/p>", "source": "answers.md", "search": "explain the cap theorem accurately, and then explain why pacelc is more useful. cap: during a network partition , you must choose between consistency and availability. the common misstatement is \"pick two of three\" - partition tolerance is not optional in a distributed system, so the real choice is cp or ap, and only while partitioned. pacelc is more useful because it describes the other 99.9 percent of the time: if partitioned, choose availability or consistency; else, choose latency or consistency. synchronous replication across regions costs latency on every write even when the network is healthy; that is the trade-off you actually live with daily. dynamodb with eventually consistent reads is pa/el; a single-leader rdbms with synchronous replicas is pc/ec; cassandra is tunable per query. framing it this way in an interview signals you have operated these systems rather than read about them."}, {"n": 181, "category": 10, "difficulty": "D", "html": "Eventual consistency: how do you explain it to a product owner, and how do you make it acceptable to users?", "answerTitle": "Explaining eventual consistency", "answer": "<p>To a product owner I do not use the term. I say: &quot;When you change this, the update is guaranteed, but it may take up to a few seconds to appear on that other screen. What should the user see during that window?&quot; That converts an architecture property into a product decision they can actually make.<\/p><p>Making it acceptable in the UI: read-your-own-writes for the acting user (route their reads to the leader, or optimistically render their own change), explicit pending states rather than silently stale data, and a bounded, monitored staleness window with an SLO (&quot;99.9 percent of updates visible within 2 seconds&quot;). Where the business genuinely cannot tolerate it - money movement, inventory at the point of sale - I keep that specific operation strongly consistent rather than arguing.<\/p>", "source": "answers.md", "search": "eventual consistency: how do you explain it to a product owner, and how do you make it acceptable to users? to a product owner i do not use the term. i say: \"when you change this, the update is guaranteed, but it may take up to a few seconds to appear on that other screen. what should the user see during that window?\" that converts an architecture property into a product decision they can actually make. making it acceptable in the ui: read-your-own-writes for the acting user (route their reads to the leader, or optimistically render their own change), explicit pending states rather than silently stale data, and a bounded, monitored staleness window with an slo (\"99.9 percent of updates visible within 2 seconds\"). where the business genuinely cannot tolerate it - money movement, inventory at the point of sale - i keep that specific operation strongly consistent rather than arguing."}, {"n": 182, "category": 10, "difficulty": "D", "html": "Saga pattern: choreography versus orchestration, and how compensation works.", "answerTitle": "Sagas", "answer": "<p>A long-lived business transaction split into local transactions, each with a compensating action, because a distributed two-phase commit is not viable across services.<\/p><p><strong>Choreography<\/strong>: each service reacts to events. No central coordinator, loose coupling, good for 2-3 steps. Beyond that nobody can tell you what the flow is or where it is stuck, and cyclic event dependencies creep in.<\/p><p><strong>Orchestration<\/strong>: a coordinator (a state machine, Temporal, Step Functions, or a Camunda-style engine) drives the steps. Explicit, observable, testable, easy to add timeouts and retries; cost is a component that must itself be highly available and can accrete business logic.<\/p><p>I use orchestration for anything with more than three steps or with money involved, because operability matters more than coupling purity. Either way the hard parts are the same: compensations are semantic, not rollbacks (you refund, you do not un-charge), steps must be idempotent because retries are certain, and you need to handle the semantic lock problem - data is visible in an intermediate state, so model it explicitly (<code>PENDING<\/code>, <code>RESERVED<\/code>) rather than pretending it is atomic.<\/p>", "source": "answers.md", "search": "saga pattern: choreography versus orchestration, and how compensation works. a long-lived business transaction split into local transactions, each with a compensating action, because a distributed two-phase commit is not viable across services. choreography : each service reacts to events. no central coordinator, loose coupling, good for 2-3 steps. beyond that nobody can tell you what the flow is or where it is stuck, and cyclic event dependencies creep in. orchestration : a coordinator (a state machine, temporal, step functions, or a camunda-style engine) drives the steps. explicit, observable, testable, easy to add timeouts and retries; cost is a component that must itself be highly available and can accrete business logic. i use orchestration for anything with more than three steps or with money involved, because operability matters more than coupling purity. either way the hard parts are the same: compensations are semantic, not rollbacks (you refund, you do not un-charge), steps must be idempotent because retries are certain, and you need to handle the semantic lock problem - data is visible in an intermediate state, so model it explicitly (pending, reserved) rather than pretending it is atomic."}, {"n": 183, "category": 10, "difficulty": "T", "html": "Why is the transactional outbox pattern needed, and what exactly does it fix that a &quot;save then publish&quot; cannot?", "answerTitle": "Transactional outbox", "answer": "<p>The problem is the dual-write: you cannot atomically commit to your database <em>and<\/em> publish to a broker. If you save then publish and the process dies in between, the state changed but nobody was told. If you publish then save and the save fails, you have announced something that never happened. Wrapping both in a distributed transaction (XA) is slow, poorly supported, and puts a broker outage in your write path.<\/p><p>The outbox writes the event <strong>into a table in the same local transaction<\/strong> as the state change - one atomic commit. A separate process then relays rows to the broker: either polling the table, or tailing the write-ahead log with change data capture (Debezium), which is lower latency and does not load the database with polling.<\/p><p>This gives at-least-once delivery, never zero, so consumers must be idempotent. The inverse pattern on the consumer side is the inbox: record processed message IDs in the same transaction as the effect, so redelivery is a no-op.<\/p>", "source": "answers.md", "search": "why is the transactional outbox pattern needed, and what exactly does it fix that a \"save then publish\" cannot? the problem is the dual-write: you cannot atomically commit to your database and publish to a broker. if you save then publish and the process dies in between, the state changed but nobody was told. if you publish then save and the save fails, you have announced something that never happened. wrapping both in a distributed transaction (xa) is slow, poorly supported, and puts a broker outage in your write path. the outbox writes the event into a table in the same local transaction as the state change - one atomic commit. a separate process then relays rows to the broker: either polling the table, or tailing the write-ahead log with change data capture (debezium), which is lower latency and does not load the database with polling. this gives at-least-once delivery, never zero, so consumers must be idempotent. the inverse pattern on the consumer side is the inbox: record processed message ids in the same transaction as the effect, so redelivery is a no-op."}, {"n": 184, "category": 10, "difficulty": "D", "html": "How do you guarantee idempotency for a payment API consumed with retries?", "answerTitle": "Idempotent payment API", "answer": "<p>The client generates an <code>Idempotency-Key<\/code> (a UUID) per logical operation and resends the same key on every retry.<\/p><p>Server side: insert the key into a table with a unique constraint <strong>inside the same transaction<\/strong> as the payment. If the insert succeeds, process and store the response body and status against the key. If it violates the constraint, the request is a retry - return the stored response. If the stored record is still in-flight, return 409 or block briefly, so two concurrent retries cannot both proceed. Scope the key to the client and validate that the request payload hash matches the original, otherwise a client reusing a key with different content gets a 422 rather than a silently wrong result.<\/p><p>Also: give keys a defined retention (24 hours is typical) documented to clients, make downstream calls to the payment processor carry their own idempotency key, and use a state machine on the payment record (<code>INITIATED → AUTHORIZED → CAPTURED<\/code>) with transitions guarded so a duplicate cannot double-capture.<\/p><blockquote><p><em>Hook: a payments or ordering flow where duplicate submissions were eliminated.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you guarantee idempotency for a payment api consumed with retries? the client generates an idempotency-key (a uuid) per logical operation and resends the same key on every retry. server side: insert the key into a table with a unique constraint inside the same transaction as the payment. if the insert succeeds, process and store the response body and status against the key. if it violates the constraint, the request is a retry - return the stored response. if the stored record is still in-flight, return 409 or block briefly, so two concurrent retries cannot both proceed. scope the key to the client and validate that the request payload hash matches the original, otherwise a client reusing a key with different content gets a 422 rather than a silently wrong result. also: give keys a defined retention (24 hours is typical) documented to clients, make downstream calls to the payment processor carry their own idempotency key, and use a state machine on the payment record (initiated → authorized → captured) with transitions guarded so a duplicate cannot double-capture. hook: a payments or ordering flow where duplicate submissions were eliminated."}, {"n": 185, "category": 10, "difficulty": "D", "html": "Exactly-once delivery - is it possible? Explain what Kafka actually gives you.", "answerTitle": "Exactly-once", "answer": "<p>End-to-end exactly-once <em>delivery<\/em> is impossible in an asynchronous system with failures - the classic two-generals result. What is achievable is exactly-once <strong>processing<\/strong>, by combining at-least-once delivery with idempotent or transactional effects.<\/p><p>What Kafka actually gives you: an idempotent producer (a producer ID and sequence number let the broker deduplicate retries within a session, so no duplicates on the log), and transactions that atomically write to multiple partitions <em>and<\/em> commit consumer offsets, giving exactly-once semantics for the read-process-write pattern <strong>within Kafka<\/strong> (<code>processing.guarantee=exactly_once_v2<\/code>). The moment your side effect leaves Kafka - an HTTP call, a database write in another system - you are back to needing idempotency on your side.<\/p><p>So my answer is always: design consumers to be idempotent, use a dedup key or an inbox table, and treat Kafka transactions as an optimization for Kafka-to-Kafka pipelines rather than a general guarantee.<\/p>", "source": "answers.md", "search": "exactly-once delivery - is it possible? explain what kafka actually gives you. end-to-end exactly-once delivery is impossible in an asynchronous system with failures - the classic two-generals result. what is achievable is exactly-once processing , by combining at-least-once delivery with idempotent or transactional effects. what kafka actually gives you: an idempotent producer (a producer id and sequence number let the broker deduplicate retries within a session, so no duplicates on the log), and transactions that atomically write to multiple partitions and commit consumer offsets, giving exactly-once semantics for the read-process-write pattern within kafka (processing.guarantee=exactly_once_v2). the moment your side effect leaves kafka - an http call, a database write in another system - you are back to needing idempotency on your side. so my answer is always: design consumers to be idempotent, use a dedup key or an inbox table, and treat kafka transactions as an optimization for kafka-to-kafka pipelines rather than a general guarantee."}, {"n": 186, "category": 10, "difficulty": "D", "html": "Kafka: partitions, consumer groups, rebalancing, offset management, ordering guarantees.", "answerTitle": "Kafka fundamentals", "answer": "<p>A topic is split into <strong>partitions<\/strong>, which are the unit of parallelism and of ordering - ordering is guaranteed <em>within<\/em> a partition only, and the partition is chosen by <code>hash(key) % partitions<\/code>, so keying by entity ID gives per-entity ordering.<\/p><p>A <strong>consumer group<\/strong> distributes partitions among members; one partition is consumed by at most one member of a group, so consumer parallelism is capped by partition count. <strong>Rebalancing<\/strong> happens on membership change and, with the eager protocol, stops the world for the group; cooperative incremental rebalancing (the default now) only moves the affected partitions. Static group membership plus a tuned <code>session.timeout.ms<\/code> avoids rebalances caused by long processing pauses; <code>max.poll.interval.ms<\/code> exceeded is the classic cause of a consumer being kicked out mid-batch.<\/p><p><strong>Offsets<\/strong> are consumer-controlled. Auto-commit gives at-most-once or at-least-once depending on timing, both accidentally; I disable it and commit after processing, accepting at-least-once and making the handler idempotent. Durability comes from <code>acks=all<\/code> plus <code>min.insync.replicas=2<\/code> on a replication factor of 3 - <code>acks=1<\/code> will lose data on a leader failure.<\/p>", "source": "answers.md", "search": "kafka: partitions, consumer groups, rebalancing, offset management, ordering guarantees. a topic is split into partitions , which are the unit of parallelism and of ordering - ordering is guaranteed within a partition only, and the partition is chosen by hash(key) % partitions, so keying by entity id gives per-entity ordering. a consumer group distributes partitions among members; one partition is consumed by at most one member of a group, so consumer parallelism is capped by partition count. rebalancing happens on membership change and, with the eager protocol, stops the world for the group; cooperative incremental rebalancing (the default now) only moves the affected partitions. static group membership plus a tuned session.timeout.ms avoids rebalances caused by long processing pauses; max.poll.interval.ms exceeded is the classic cause of a consumer being kicked out mid-batch. offsets are consumer-controlled. auto-commit gives at-most-once or at-least-once depending on timing, both accidentally; i disable it and commit after processing, accepting at-least-once and making the handler idempotent. durability comes from acks=all plus min.insync.replicas=2 on a replication factor of 3 - acks=1 will lose data on a leader failure."}, {"n": 187, "category": 10, "difficulty": "T", "html": "What happens to ordering when you increase Kafka partitions on an existing topic?", "answerTitle": "Increasing partitions", "answer": "<p>Ordering breaks for existing keys. The partition is <code>hash(key) % partitionCount<\/code>, so changing the count remaps keys: messages for key K written before the change sit in partition 3, and new ones go to partition 7. Two consumers now process that key&#x27;s history and its future concurrently, with no ordering relationship between them.<\/p><p>Also: partitions can only be increased, never decreased, and log-compacted topics can end up with two live records for the same key in different partitions.<\/p><p>Mitigations: over-provision partitions at topic creation (they are cheap up to a point); or create a new topic with the new partition count and migrate consumers with a controlled cut-over; or use a custom partitioner with consistent hashing if you must scale live. In practice, plan capacity up front - this is one of the few Kafka decisions that is genuinely hard to undo.<\/p>", "source": "answers.md", "search": "what happens to ordering when you increase kafka partitions on an existing topic? ordering breaks for existing keys. the partition is hash(key) % partitioncount, so changing the count remaps keys: messages for key k written before the change sit in partition 3, and new ones go to partition 7. two consumers now process that key's history and its future concurrently, with no ordering relationship between them. also: partitions can only be increased, never decreased, and log-compacted topics can end up with two live records for the same key in different partitions. mitigations: over-provision partitions at topic creation (they are cheap up to a point); or create a new topic with the new partition count and migrate consumers with a controlled cut-over; or use a custom partitioner with consistent hashing if you must scale live. in practice, plan capacity up front - this is one of the few kafka decisions that is genuinely hard to undo."}, {"n": 188, "category": 10, "difficulty": "D", "html": "Distributed tracing: how does context propagate across async boundaries?", "answerTitle": "Trace context propagation", "answer": "<p>W3C Trace Context (<code>traceparent<\/code> / <code>tracestate<\/code> headers) carries the trace ID, span ID and sampling flag. On synchronous HTTP calls, instrumentation copies it automatically.<\/p><p>Async boundaries are where it breaks, because the context lives in a <code>ThreadLocal<\/code> that the new thread does not inherit. Handling: for executors, wrap with a context-propagating decorator (Micrometer&#x27;s <code>ContextSnapshot<\/code>, Spring&#x27;s <code>TaskDecorator<\/code>, or OpenTelemetry&#x27;s <code>Context.taskWrapping<\/code>) - a plain <code>ThreadPoolTaskExecutor<\/code> will lose it. For messaging, inject the context into the message headers on publish and extract it on consume, linking the consumer span to the producer span as a <em>link<\/em> rather than a parent when the work is batched. For reactive code, propagate through Reactor&#x27;s <code>Context<\/code> rather than <code>ThreadLocal<\/code>. For scheduled and batch jobs, start a fresh root trace with a meaningful attribute.<\/p><p>Then make it useful: put the trace ID in the MDC so every log line carries it, return it in an error response header so support can jump from a customer complaint straight to the trace, and sample tail-based on errors and latency so you keep the traces that matter.<\/p>", "source": "answers.md", "search": "distributed tracing: how does context propagate across async boundaries? w3c trace context (traceparent / tracestate headers) carries the trace id, span id and sampling flag. on synchronous http calls, instrumentation copies it automatically. async boundaries are where it breaks, because the context lives in a threadlocal that the new thread does not inherit. handling: for executors, wrap with a context-propagating decorator (micrometer's contextsnapshot, spring's taskdecorator, or opentelemetry's context.taskwrapping) - a plain threadpooltaskexecutor will lose it. for messaging, inject the context into the message headers on publish and extract it on consume, linking the consumer span to the producer span as a link rather than a parent when the work is batched. for reactive code, propagate through reactor's context rather than threadlocal. for scheduled and batch jobs, start a fresh root trace with a meaningful attribute. then make it useful: put the trace id in the mdc so every log line carries it, return it in an error response header so support can jump from a customer complaint straight to the trace, and sample tail-based on errors and latency so you keep the traces that matter."}, {"n": 189, "category": 10, "difficulty": "D", "html": "Service discovery, client-side versus server-side load balancing, and where a service mesh fits.", "answerTitle": "Discovery, load balancing and mesh", "answer": "<p><strong>Server-side<\/strong>: clients call a stable endpoint (ALB, Kubernetes Service) that distributes traffic. Simple, language-agnostic, one more network hop, and the balancer has no view of application-level health beyond a probe.<\/p><p><strong>Client-side<\/strong>: the client fetches the instance list from a registry (Eureka, Consul) and chooses itself, so it can do zone-aware routing, least-outstanding-requests balancing, and immediate ejection of a failing host. Cost is a smart client per language and a registry to operate.<\/p><p><strong>Service mesh<\/strong> (Istio, Linkerd): moves that logic into a sidecar or ambient proxy, so it is language-agnostic again, and adds mTLS, retries, timeouts, circuit breaking, traffic shifting and consistent telemetry as configuration rather than code. Cost is real: a control plane to run, per-request latency and memory overhead, and a new failure domain that your on-call must understand.<\/p><p>My position: on Kubernetes, start with Services plus client-side resilience libraries; adopt a mesh when you need mTLS everywhere, uniform traffic policy across polyglot services, or progressive delivery - not because it is fashionable.<\/p>", "source": "answers.md", "search": "service discovery, client-side versus server-side load balancing, and where a service mesh fits. server-side : clients call a stable endpoint (alb, kubernetes service) that distributes traffic. simple, language-agnostic, one more network hop, and the balancer has no view of application-level health beyond a probe. client-side : the client fetches the instance list from a registry (eureka, consul) and chooses itself, so it can do zone-aware routing, least-outstanding-requests balancing, and immediate ejection of a failing host. cost is a smart client per language and a registry to operate. service mesh (istio, linkerd): moves that logic into a sidecar or ambient proxy, so it is language-agnostic again, and adds mtls, retries, timeouts, circuit breaking, traffic shifting and consistent telemetry as configuration rather than code. cost is real: a control plane to run, per-request latency and memory overhead, and a new failure domain that your on-call must understand. my position: on kubernetes, start with services plus client-side resilience libraries; adopt a mesh when you need mtls everywhere, uniform traffic policy across polyglot services, or progressive delivery - not because it is fashionable."}, {"n": 190, "category": 10, "difficulty": "D", "html": "Rate limiting algorithms: token bucket, leaky bucket, sliding window. Where do you enforce them?", "answerTitle": "Rate limiting", "answer": "<p><strong>Token bucket<\/strong>: tokens refill at a fixed rate up to a capacity; allows bursts up to the bucket size. My default, and what most cloud gateways implement. <strong>Leaky bucket<\/strong>: outflow is strictly constant, smoothing traffic entirely - good for protecting a downstream with a hard throughput limit. <strong>Fixed window<\/strong>: trivial but allows a 2x burst across the window boundary. <strong>Sliding window log<\/strong> is exact but stores every timestamp; <strong>sliding window counter<\/strong> interpolates between two fixed windows and is the usual compromise.<\/p><p>Where to enforce: at the edge (API Gateway, WAF, ingress) for coarse per-client protection and to keep abusive traffic off your compute; in the application for per-tenant or per-endpoint business rules that need identity context; and at the client with a concurrency limiter or semaphore to protect the downstream. Distributed enforcement needs shared state - Redis with an atomic Lua script, or a token-bucket library like Bucket4j - and you must decide the failure mode: fail-open (availability) or fail-closed (protection) when Redis is unreachable.<\/p><p>Always return <code>429<\/code> with <code>Retry-After<\/code> and <code>X-RateLimit-*<\/code> headers, and rate limit by authenticated identity rather than IP where possible, since NAT makes IP a poor key.<\/p>", "source": "answers.md", "search": "rate limiting algorithms: token bucket, leaky bucket, sliding window. where do you enforce them? token bucket : tokens refill at a fixed rate up to a capacity; allows bursts up to the bucket size. my default, and what most cloud gateways implement. leaky bucket : outflow is strictly constant, smoothing traffic entirely - good for protecting a downstream with a hard throughput limit. fixed window : trivial but allows a 2x burst across the window boundary. sliding window log is exact but stores every timestamp; sliding window counter interpolates between two fixed windows and is the usual compromise. where to enforce: at the edge (api gateway, waf, ingress) for coarse per-client protection and to keep abusive traffic off your compute; in the application for per-tenant or per-endpoint business rules that need identity context; and at the client with a concurrency limiter or semaphore to protect the downstream. distributed enforcement needs shared state - redis with an atomic lua script, or a token-bucket library like bucket4j - and you must decide the failure mode: fail-open (availability) or fail-closed (protection) when redis is unreachable. always return 429 with retry-after and x-ratelimit- headers, and rate limit by authenticated identity rather than ip where possible, since nat makes ip a poor key."}, {"n": 191, "category": 10, "difficulty": "D", "html": "Caching strategies: cache-aside, read-through, write-through, write-behind. How do you handle invalidation and stampede?", "answerTitle": "Caching strategies", "answer": "<p><strong>Cache-aside<\/strong> (lazy loading): the application checks the cache, loads from the source on a miss, and populates. Most common, resilient to cache failure, but the first request per key is slow and it is easy to get inconsistent under concurrent writes. <strong>Read-through<\/strong>: the cache itself loads on miss, so the loading logic lives in one place. <strong>Write-through<\/strong>: write to cache and store synchronously - consistent, higher write latency. <strong>Write-behind<\/strong>: write to cache and flush asynchronously - fastest writes, risk of data loss and much harder recovery; I use it only for tolerable data such as counters.<\/p><p>Invalidation: prefer a short TTL plus explicit invalidation on write; version the cache key (include an entity version or a schema version in the key) so a deploy or a schema change does not serve stale shapes; and for multi-instance local caches, publish invalidation events rather than hoping TTLs align.<\/p><p><strong>Stampede<\/strong> (many concurrent misses on the same hot key hitting the database at once) is the failure I actually plan for: use a per-key lock or single-flight so one loader populates while others wait, add jitter to TTLs so keys do not expire in lockstep, and consider probabilistic early refresh so a hot key is refreshed just before it expires. Caffeine&#x27;s <code>AsyncLoadingCache<\/code> gives you single-flight for free locally; Redis needs an explicit lock.<\/p>", "source": "answers.md", "search": "caching strategies: cache-aside, read-through, write-through, write-behind. how do you handle invalidation and stampede? cache-aside (lazy loading): the application checks the cache, loads from the source on a miss, and populates. most common, resilient to cache failure, but the first request per key is slow and it is easy to get inconsistent under concurrent writes. read-through : the cache itself loads on miss, so the loading logic lives in one place. write-through : write to cache and store synchronously - consistent, higher write latency. write-behind : write to cache and flush asynchronously - fastest writes, risk of data loss and much harder recovery; i use it only for tolerable data such as counters. invalidation: prefer a short ttl plus explicit invalidation on write; version the cache key (include an entity version or a schema version in the key) so a deploy or a schema change does not serve stale shapes; and for multi-instance local caches, publish invalidation events rather than hoping ttls align. stampede (many concurrent misses on the same hot key hitting the database at once) is the failure i actually plan for: use a per-key lock or single-flight so one loader populates while others wait, add jitter to ttls so keys do not expire in lockstep, and consider probabilistic early refresh so a hot key is refreshed just before it expires. caffeine's asyncloadingcache gives you single-flight for free locally; redis needs an explicit lock."}, {"n": 192, "category": 10, "difficulty": "A", "html": "How do you design for graceful degradation when a downstream dependency is down?", "answerTitle": "Graceful degradation", "answer": "<p>The principle is that a partial outage should cause a partial loss of function, not a total one. So I classify every dependency as critical or non-critical up front - if the recommendations service is down, the product page must still render.<\/p><p>Mechanisms: a circuit breaker with an explicit fallback (cached value, default, empty section, or a queued write for a deferrable action); timeouts everywhere, always shorter than the caller&#x27;s own deadline, with a deadline budget propagated through the call chain; bulkheads so a slow dependency cannot exhaust shared threads or connections; feature flags to disable an expensive or failing feature without a deploy; load shedding at the edge, dropping the lowest-priority traffic first; and serving stale-but-usable cached data with an explicit indication rather than an error.<\/p><p>Then I verify it: chaos experiments and failure injection in staging, plus a game day where we actually turn a dependency off and confirm the degraded behavior is what the product owner agreed to. Untested fallbacks are the ones that fail, usually because the fallback path itself calls the same dead dependency.<\/p>", "source": "answers.md", "search": "how do you design for graceful degradation when a downstream dependency is down? the principle is that a partial outage should cause a partial loss of function, not a total one. so i classify every dependency as critical or non-critical up front - if the recommendations service is down, the product page must still render. mechanisms: a circuit breaker with an explicit fallback (cached value, default, empty section, or a queued write for a deferrable action); timeouts everywhere, always shorter than the caller's own deadline, with a deadline budget propagated through the call chain; bulkheads so a slow dependency cannot exhaust shared threads or connections; feature flags to disable an expensive or failing feature without a deploy; load shedding at the edge, dropping the lowest-priority traffic first; and serving stale-but-usable cached data with an explicit indication rather than an error. then i verify it: chaos experiments and failure injection in staging, plus a game day where we actually turn a dependency off and confirm the degraded behavior is what the product owner agreed to. untested fallbacks are the ones that fail, usually because the fallback path itself calls the same dead dependency."}, {"n": 193, "category": 11, "difficulty": "D", "html": "ECS Fargate versus EKS versus Lambda versus EC2 - your decision framework.", "answerTitle": "Compute decision framework", "answer": "<p>My sequence of questions: what is the traffic shape, what is the required startup latency, how long does a unit of work run, what does the team already operate well, and what is the cost at expected scale?<\/p><ul><li><strong>Lambda<\/strong> for event-driven, spiky or low-volume workloads, and for glue. Under 15 minutes, stateless, tolerant of cold starts (or worth paying for provisioned or SnapStart). Cheapest at low and bursty volume, expensive at sustained high throughput.<\/li><li><strong>ECS on Fargate<\/strong> for standard long-running services. No cluster to manage, per-task isolation, straightforward IAM and networking. My default for a team that wants containers without Kubernetes.<\/li><li><strong>EKS<\/strong> when you need the Kubernetes ecosystem: complex multi-service topology, a service mesh, operators, portability across clouds, or an existing platform team. The cost is that you now run a platform.<\/li><li><strong>EC2<\/strong> for specialized needs: licensing, GPUs, very high sustained throughput where reserved instances win, or software that cannot be containerized.<\/li><\/ul><p>I also state the reversibility: containerized services can move between Fargate and EKS with limited effort, while a deeply Lambda-native design is harder to unwind - so for an uncertain workload I bias toward containers.<\/p>", "source": "answers.md", "search": "ecs fargate versus eks versus lambda versus ec2 - your decision framework. my sequence of questions: what is the traffic shape, what is the required startup latency, how long does a unit of work run, what does the team already operate well, and what is the cost at expected scale? - lambda for event-driven, spiky or low-volume workloads, and for glue. under 15 minutes, stateless, tolerant of cold starts (or worth paying for provisioned or snapstart). cheapest at low and bursty volume, expensive at sustained high throughput. - ecs on fargate for standard long-running services. no cluster to manage, per-task isolation, straightforward iam and networking. my default for a team that wants containers without kubernetes. - eks when you need the kubernetes ecosystem: complex multi-service topology, a service mesh, operators, portability across clouds, or an existing platform team. the cost is that you now run a platform. - ec2 for specialized needs: licensing, gpus, very high sustained throughput where reserved instances win, or software that cannot be containerized. i also state the reversibility: containerized services can move between fargate and eks with limited effort, while a deeply lambda-native design is harder to unwind - so for an uncertain workload i bias toward containers."}, {"n": 194, "category": 11, "difficulty": "T", "html": "Lambda cold starts in Java: what causes them and which four techniques actually reduce them?", "answerTitle": "Lambda cold starts in Java", "answer": "<p>Causes, in order of impact: JVM startup, classpath scanning and reflection in Spring or Jakarta EE frameworks, static initialization, and the JIT running interpreted until warm. A Spring Boot Lambda can take 5-10 seconds cold; the same logic in plain Java takes a few hundred milliseconds.<\/p><p>Four things that actually work:<\/p><ol><li><strong>SnapStart<\/strong> - Lambda snapshots the initialized JVM after <code>init<\/code> and restores from it, cutting cold starts by an order of magnitude. Requires care with anything captured in the snapshot: random seeds, cached credentials, open connections, and unique IDs - use the runtime hooks (<code>Resource::beforeCheckpoint<\/code> / <code>afterRestore<\/code>) to re-initialize them.<\/li><li><strong>Reduce the framework<\/strong>. Use a plain handler, or Micronaut/Quarkus with build-time dependency injection, or Spring Cloud Function with AOT and a GraalVM native image. Removing reflection is where the win is.<\/li><li><strong>Do work in the init phase<\/strong> - the 10-second init window is billed differently and is already outside the request path, so construct clients (<code>DynamoDbClient<\/code>, connection pools) as static fields and prime one call.<\/li><li><strong>Provisioned concurrency<\/strong> for predictable latency-sensitive endpoints - it works, it costs money, and it means you are paying for idle, which is often the signal that this workload belonged on Fargate.<\/li><\/ol><p>Also: trim the deployment package, use tiered compilation stop-at-level-1 (<code>-XX:TieredStopAtLevel=1 -XX:+TieredCompilation<\/code>) for short-lived invocations, and avoid VPC-attached Lambdas unless needed (Hyperplane ENIs removed most of that penalty, but the dependency remains).<\/p>", "source": "answers.md", "search": "lambda cold starts in java: what causes them and which four techniques actually reduce them? causes, in order of impact: jvm startup, classpath scanning and reflection in spring or jakarta ee frameworks, static initialization, and the jit running interpreted until warm. a spring boot lambda can take 5-10 seconds cold; the same logic in plain java takes a few hundred milliseconds. four things that actually work: 1. snapstart - lambda snapshots the initialized jvm after init and restores from it, cutting cold starts by an order of magnitude. requires care with anything captured in the snapshot: random seeds, cached credentials, open connections, and unique ids - use the runtime hooks (resource::beforecheckpoint / afterrestore) to re-initialize them. 2. reduce the framework . use a plain handler, or micronaut/quarkus with build-time dependency injection, or spring cloud function with aot and a graalvm native image. removing reflection is where the win is. 3. do work in the init phase - the 10-second init window is billed differently and is already outside the request path, so construct clients (dynamodbclient, connection pools) as static fields and prime one call. 4. provisioned concurrency for predictable latency-sensitive endpoints - it works, it costs money, and it means you are paying for idle, which is often the signal that this workload belonged on fargate. also: trim the deployment package, use tiered compilation stop-at-level-1 (-xx:tieredstopatlevel=1 -xx:+tieredcompilation) for short-lived invocations, and avoid vpc-attached lambdas unless needed (hyperplane enis removed most of that penalty, but the dependency remains)."}, {"n": 195, "category": 11, "difficulty": "D", "html": "SQS versus SNS versus EventBridge versus Kinesis - pick one per use case and justify.", "answerTitle": "Messaging service selection", "answer": "<ul><li><strong>SQS<\/strong> - point-to-point work queue, one consumer group, durable, with retries, visibility timeout and DLQ. Default for decoupling a producer from a worker.<\/li><li><strong>SNS<\/strong> - pub/sub fan-out to multiple subscribers, push-based, with message filtering by attribute. Typically SNS to several SQS queues, which gives fan-out plus per-consumer buffering and retry - the &quot;fan-out pattern&quot;.<\/li><li><strong>EventBridge<\/strong> - an event bus with content-based routing rules, schema registry, SaaS and AWS-service sources, archive and replay, and scheduling. My choice for domain events across many services because the routing is declarative and consumers can be added without touching the producer. Higher latency and lower throughput ceiling than SNS.<\/li><li><strong>Kinesis / MSK<\/strong> - ordered, replayable streams with multiple independent consumers reading at their own position, and per-shard ordering. For analytics pipelines, change streams, and anything needing replay of a large window or strict ordering by key.<\/li><\/ul><p>The distinguishing question I ask is: does the consumer need to <em>replay<\/em> history, and does order matter? Yes to either points at Kinesis or Kafka; otherwise SQS or EventBridge.<\/p>", "source": "answers.md", "search": "sqs versus sns versus eventbridge versus kinesis - pick one per use case and justify. - sqs - point-to-point work queue, one consumer group, durable, with retries, visibility timeout and dlq. default for decoupling a producer from a worker. - sns - pub/sub fan-out to multiple subscribers, push-based, with message filtering by attribute. typically sns to several sqs queues, which gives fan-out plus per-consumer buffering and retry - the \"fan-out pattern\". - eventbridge - an event bus with content-based routing rules, schema registry, saas and aws-service sources, archive and replay, and scheduling. my choice for domain events across many services because the routing is declarative and consumers can be added without touching the producer. higher latency and lower throughput ceiling than sns. - kinesis / msk - ordered, replayable streams with multiple independent consumers reading at their own position, and per-shard ordering. for analytics pipelines, change streams, and anything needing replay of a large window or strict ordering by key. the distinguishing question i ask is: does the consumer need to replay history, and does order matter? yes to either points at kinesis or kafka; otherwise sqs or eventbridge."}, {"n": 196, "category": 11, "difficulty": "D", "html": "SQS standard versus FIFO: throughput, ordering, deduplication, and visibility timeout traps.", "answerTitle": "SQS standard versus FIFO", "answer": "<p><strong>Standard<\/strong>: nearly unlimited throughput, at-least-once delivery, best-effort ordering. <strong>FIFO<\/strong>: strict ordering within a message group ID, exactly-once <em>processing<\/em> via a 5-minute deduplication window, and throughput limited to 300 messages/second per group (3,000 with batching, and much higher with high-throughput mode enabled, which relaxes the deduplication scope).<\/p><p>Traps worth naming: the message group ID is the parallelism unit, so using a constant group ID serializes your entire queue; a single poisoned message blocks its whole group until it is moved to the DLQ; and <strong>visibility timeout<\/strong> must exceed your maximum processing time, or the message reappears and is processed twice while the first attempt is still running - the most common SQS bug there is. Extend it with a heartbeat (<code>ChangeMessageVisibility<\/code>) for long tasks, and always make the consumer idempotent even on FIFO, because &quot;exactly once&quot; only holds within the dedup window.<\/p>", "source": "answers.md", "search": "sqs standard versus fifo: throughput, ordering, deduplication, and visibility timeout traps. standard : nearly unlimited throughput, at-least-once delivery, best-effort ordering. fifo : strict ordering within a message group id, exactly-once processing via a 5-minute deduplication window, and throughput limited to 300 messages/second per group (3,000 with batching, and much higher with high-throughput mode enabled, which relaxes the deduplication scope). traps worth naming: the message group id is the parallelism unit, so using a constant group id serializes your entire queue; a single poisoned message blocks its whole group until it is moved to the dlq; and visibility timeout must exceed your maximum processing time, or the message reappears and is processed twice while the first attempt is still running - the most common sqs bug there is. extend it with a heartbeat (changemessagevisibility) for long tasks, and always make the consumer idempotent even on fifo, because \"exactly once\" only holds within the dedup window."}, {"n": 197, "category": 11, "difficulty": "D", "html": "Dead letter queues: when does a message land there and how do you reprocess safely?", "answerTitle": "Dead letter queues", "answer": "<p>A message lands in the DLQ after <code>maxReceiveCount<\/code> failed receives - which includes crashes and visibility-timeout expiries, not just explicit failures. That is the point: it stops a poison message from blocking the queue forever and from being retried infinitely at cost.<\/p><p>Operationally I treat a DLQ as an alertable condition, never a dumping ground: a CloudWatch alarm on <code>ApproximateNumberOfMessagesVisible &gt; 0<\/code>, with the message retention set long enough (14 days) to investigate. Before replaying I want to know <em>why<\/em> it failed, because replaying a poison message just refills the DLQ.<\/p><p>Safe reprocessing: fix the cause first, then use the SQS DLQ redrive feature (or a controlled consumer) to move messages back at a throttled rate, ensure the handler is idempotent because some messages may have partially succeeded, and keep a record of what was redriven and when. For messages that can never succeed, archive them to S3 with the failure reason rather than deleting silently.<\/p>", "source": "answers.md", "search": "dead letter queues: when does a message land there and how do you reprocess safely? a message lands in the dlq after maxreceivecount failed receives - which includes crashes and visibility-timeout expiries, not just explicit failures. that is the point: it stops a poison message from blocking the queue forever and from being retried infinitely at cost. operationally i treat a dlq as an alertable condition, never a dumping ground: a cloudwatch alarm on approximatenumberofmessagesvisible 0, with the message retention set long enough (14 days) to investigate. before replaying i want to know why it failed, because replaying a poison message just refills the dlq. safe reprocessing: fix the cause first, then use the sqs dlq redrive feature (or a controlled consumer) to move messages back at a throttled rate, ensure the handler is idempotent because some messages may have partially succeeded, and keep a record of what was redriven and when. for messages that can never succeed, archive them to s3 with the failure reason rather than deleting silently."}, {"n": 198, "category": 11, "difficulty": "D", "html": "RDS versus Aurora versus DynamoDB. When is DynamoDB the wrong choice?", "answerTitle": "RDS, Aurora, DynamoDB", "answer": "<p><strong>RDS<\/strong>: managed conventional engines. Predictable, familiar, cheapest for modest workloads; failover to a standby takes 60-120 seconds; read scaling via read replicas with replication lag.<\/p><p><strong>Aurora<\/strong>: a distributed storage layer under Postgres/MySQL compatibility - six copies across three AZs, faster failover (typically under 30 seconds), up to 15 low-lag read replicas, and storage that grows automatically. Aurora Serverless v2 scales capacity in fine-grained increments, which is genuinely useful for variable load. Costs more per hour, plus IO charges on the standard configuration.<\/p><p><strong>DynamoDB<\/strong>: single-digit-millisecond key-value and document access at any scale, no capacity planning with on-demand mode, and no operational database to tune.<\/p><p>DynamoDB is the wrong choice when access patterns are unknown or will change, when you need ad-hoc queries, joins, aggregations or reporting, when items are large or transactions span many entities, or when the team lacks single-table-design experience - the schema is a function of your queries, so getting the queries wrong means a migration, not an index. I have seen more failures from choosing DynamoDB for a relational domain than from any other AWS decision.<\/p>", "source": "answers.md", "search": "rds versus aurora versus dynamodb. when is dynamodb the wrong choice? rds : managed conventional engines. predictable, familiar, cheapest for modest workloads; failover to a standby takes 60-120 seconds; read scaling via read replicas with replication lag. aurora : a distributed storage layer under postgres/mysql compatibility - six copies across three azs, faster failover (typically under 30 seconds), up to 15 low-lag read replicas, and storage that grows automatically. aurora serverless v2 scales capacity in fine-grained increments, which is genuinely useful for variable load. costs more per hour, plus io charges on the standard configuration. dynamodb : single-digit-millisecond key-value and document access at any scale, no capacity planning with on-demand mode, and no operational database to tune. dynamodb is the wrong choice when access patterns are unknown or will change, when you need ad-hoc queries, joins, aggregations or reporting, when items are large or transactions span many entities, or when the team lacks single-table-design experience - the schema is a function of your queries, so getting the queries wrong means a migration, not an index. i have seen more failures from choosing dynamodb for a relational domain than from any other aws decision."}, {"n": 199, "category": 11, "difficulty": "D", "html": "DynamoDB partition key design, hot partitions, GSI versus LSI.", "answerTitle": "DynamoDB key design", "answer": "<p>The partition key determines physical distribution: its hash selects a partition, each of which sustains roughly 3,000 read and 1,000 write units per second. A <strong>hot partition<\/strong> comes from low-cardinality or skewed keys - a status field, a date, a single popular tenant. Fixes: choose a high-cardinality key, add a write-sharding suffix (<code>key#0..N<\/code>) and scatter-gather on read, or split the hot entity out. Adaptive capacity absorbs mild skew automatically but not a sustained hotspot.<\/p><p>The sort key enables range queries and the composite-key patterns behind single-table design, where several entity types share a table using generic <code>PK<\/code>/<code>SK<\/code> attributes and overloaded GSIs.<\/p><p><strong>GSI<\/strong>: different partition and sort key, its own provisioned capacity, eventually consistent only, and unlimited size - throttling on a GSI throttles writes to the base table, which surprises people. <strong>LSI<\/strong>: same partition key with an alternate sort key, must be created with the table, supports strongly consistent reads, and constrains the item collection to 10 GB. I use GSIs almost exclusively, and project only the attributes needed to keep them small.<\/p>", "source": "answers.md", "search": "dynamodb partition key design, hot partitions, gsi versus lsi. the partition key determines physical distribution: its hash selects a partition, each of which sustains roughly 3,000 read and 1,000 write units per second. a hot partition comes from low-cardinality or skewed keys - a status field, a date, a single popular tenant. fixes: choose a high-cardinality key, add a write-sharding suffix (key 0..n) and scatter-gather on read, or split the hot entity out. adaptive capacity absorbs mild skew automatically but not a sustained hotspot. the sort key enables range queries and the composite-key patterns behind single-table design, where several entity types share a table using generic pk/sk attributes and overloaded gsis. gsi : different partition and sort key, its own provisioned capacity, eventually consistent only, and unlimited size - throttling on a gsi throttles writes to the base table, which surprises people. lsi : same partition key with an alternate sort key, must be created with the table, supports strongly consistent reads, and constrains the item collection to 10 gb. i use gsis almost exclusively, and project only the attributes needed to keep them small."}, {"n": 200, "category": 11, "difficulty": "D", "html": "IAM roles versus users versus policies. How does an EKS pod or ECS task get credentials?", "answerTitle": "IAM and workload credentials", "answer": "<p><strong>Users<\/strong> hold long-lived credentials and should exist only for genuine break-glass or legacy cases - human access belongs in IAM Identity Center with federated, short-lived sessions. <strong>Roles<\/strong> are assumed and produce temporary credentials, which is what every workload should use. <strong>Policies<\/strong> are the permission documents attached to either.<\/p><p>How workloads get credentials: an <strong>EC2 instance<\/strong> uses the instance profile via IMDSv2. An <strong>ECS task<\/strong> uses a task role, retrieved from a link-local credential endpoint - distinct from the <em>execution<\/em> role, which only lets the agent pull images and write logs; conflating the two is a common misconfiguration. An <strong>EKS pod<\/strong> uses IRSA - the pod&#x27;s service account is annotated with a role ARN, the projected service account token is exchanged with STS via OIDC federation, and the SDK picks it up through the web-identity provider chain. EKS Pod Identity is the newer, simpler alternative that avoids per-cluster OIDC trust configuration. A <strong>Lambda<\/strong> uses its execution role.<\/p><p>The point I make in interviews: no static access keys anywhere in the estate, permissions scoped per workload rather than per environment, and <code>aws:SourceArn<\/code>/<code>aws:PrincipalOrgID<\/code> conditions on trust policies to prevent the confused-deputy problem.<\/p>", "source": "answers.md", "search": "iam roles versus users versus policies. how does an eks pod or ecs task get credentials? users hold long-lived credentials and should exist only for genuine break-glass or legacy cases - human access belongs in iam identity center with federated, short-lived sessions. roles are assumed and produce temporary credentials, which is what every workload should use. policies are the permission documents attached to either. how workloads get credentials: an ec2 instance uses the instance profile via imdsv2. an ecs task uses a task role, retrieved from a link-local credential endpoint - distinct from the execution role, which only lets the agent pull images and write logs; conflating the two is a common misconfiguration. an eks pod uses irsa - the pod's service account is annotated with a role arn, the projected service account token is exchanged with sts via oidc federation, and the sdk picks it up through the web-identity provider chain. eks pod identity is the newer, simpler alternative that avoids per-cluster oidc trust configuration. a lambda uses its execution role. the point i make in interviews: no static access keys anywhere in the estate, permissions scoped per workload rather than per environment, and aws:sourcearn/aws:principalorgid conditions on trust policies to prevent the confused-deputy problem."}, {"n": 201, "category": 11, "difficulty": "T", "html": "What is the difference between an IAM resource policy and an identity policy when both apply to an S3 request?", "answerTitle": "Identity versus resource policies", "answer": "<p>Both are evaluated. Within a single account, access is granted if <strong>either<\/strong> an identity policy or the resource policy allows it, and there is no explicit deny - they are additive. <strong>Across accounts, both must allow<\/strong>: the caller&#x27;s identity policy in account A, and the bucket policy in account B. That asymmetry is the answer most candidates miss.<\/p><p>Full evaluation order: an explicit <code>Deny<\/code> anywhere wins; then organization SCPs must allow (they only restrict, never grant); then permission boundaries and session policies cap the maximum; then the union of identity and resource policies must contain an <code>Allow<\/code>.<\/p><p>Practical use: resource policies are how you grant cross-account access without the other account creating a role, how you enforce <code>aws:SecureTransport<\/code> and encryption conditions on a bucket regardless of who calls, and how you restrict a KMS key. Identity policies are how you manage per-workload least privilege at scale.<\/p>", "source": "answers.md", "search": "what is the difference between an iam resource policy and an identity policy when both apply to an s3 request? both are evaluated. within a single account, access is granted if either an identity policy or the resource policy allows it, and there is no explicit deny - they are additive. across accounts, both must allow : the caller's identity policy in account a, and the bucket policy in account b. that asymmetry is the answer most candidates miss. full evaluation order: an explicit deny anywhere wins; then organization scps must allow (they only restrict, never grant); then permission boundaries and session policies cap the maximum; then the union of identity and resource policies must contain an allow. practical use: resource policies are how you grant cross-account access without the other account creating a role, how you enforce aws:securetransport and encryption conditions on a bucket regardless of who calls, and how you restrict a kms key. identity policies are how you manage per-workload least privilege at scale."}, {"n": 202, "category": 11, "difficulty": "D", "html": "VPC design: public/private subnets, NAT gateway cost, VPC endpoints, security groups versus NACLs.", "answerTitle": "VPC design", "answer": "<p>Standard shape: a VPC per environment, spread over at least three availability zones, with public subnets holding only load balancers and NAT gateways, private subnets for application compute, and isolated subnets with no outbound route for databases.<\/p><p>Cost note worth raising unprompted: NAT gateways are billed hourly <em>and<\/em> per gigabyte processed, and they are a frequent surprise line item. <strong>VPC endpoints<\/strong> remove that for AWS service traffic - gateway endpoints for S3 and DynamoDB are free and should always be present; interface endpoints (PrivateLink) for ECR, Secrets Manager, KMS, CloudWatch and so on cost per hour but usually less than the NAT data charges they replace, and they keep traffic off the public internet.<\/p><p><strong>Security groups<\/strong> are stateful, instance-level, allow-only, and can reference other security groups - which is how I express &quot;the app tier may reach the database tier&quot; without hardcoding CIDRs. <strong>NACLs<\/strong> are stateless, subnet-level, ordered, and support explicit deny - I use them only for coarse subnet-level blocks, because stateless rules require matching ephemeral port ranges and are easy to get wrong.<\/p>", "source": "answers.md", "search": "vpc design: public/private subnets, nat gateway cost, vpc endpoints, security groups versus nacls. standard shape: a vpc per environment, spread over at least three availability zones, with public subnets holding only load balancers and nat gateways, private subnets for application compute, and isolated subnets with no outbound route for databases. cost note worth raising unprompted: nat gateways are billed hourly and per gigabyte processed, and they are a frequent surprise line item. vpc endpoints remove that for aws service traffic - gateway endpoints for s3 and dynamodb are free and should always be present; interface endpoints (privatelink) for ecr, secrets manager, kms, cloudwatch and so on cost per hour but usually less than the nat data charges they replace, and they keep traffic off the public internet. security groups are stateful, instance-level, allow-only, and can reference other security groups - which is how i express \"the app tier may reach the database tier\" without hardcoding cidrs. nacls are stateless, subnet-level, ordered, and support explicit deny - i use them only for coarse subnet-level blocks, because stateless rules require matching ephemeral port ranges and are easy to get wrong."}, {"n": 203, "category": 11, "difficulty": "D", "html": "How do you manage secrets: Secrets Manager versus Parameter Store versus environment variables?", "answerTitle": "Secrets management", "answer": "<p><strong>Secrets Manager<\/strong> for anything requiring rotation or cross-account sharing: native rotation with Lambda for RDS credentials, resource policies, and KMS encryption. Roughly $0.40 per secret per month plus API calls, which matters only if you have thousands.<\/p><p><strong>Parameter Store SecureString<\/strong> for configuration and lower-sensitivity secrets: free at standard tier, integrates with the same SDK patterns, no built-in rotation.<\/p><p><strong>Environment variables<\/strong> are acceptable only as the delivery mechanism when injected at runtime from one of the above (ECS <code>secrets<\/code> block, EKS External Secrets Operator) - never as the storage. They still leak into task definitions, <code>docker inspect<\/code>, crash dumps and logs, so for the highest-sensitivity values I fetch at runtime with caching instead.<\/p><p>Around all of it: least-privilege IAM per secret, CloudTrail auditing of <code>GetSecretValue<\/code>, automatic rotation with a tested rollback, secret scanning in CI and pre-commit, and IAM database authentication where available so there is no password to manage at all.<\/p>", "source": "answers.md", "search": "how do you manage secrets: secrets manager versus parameter store versus environment variables? secrets manager for anything requiring rotation or cross-account sharing: native rotation with lambda for rds credentials, resource policies, and kms encryption. roughly $0.40 per secret per month plus api calls, which matters only if you have thousands. parameter store securestring for configuration and lower-sensitivity secrets: free at standard tier, integrates with the same sdk patterns, no built-in rotation. environment variables are acceptable only as the delivery mechanism when injected at runtime from one of the above (ecs secrets block, eks external secrets operator) - never as the storage. they still leak into task definitions, docker inspect, crash dumps and logs, so for the highest-sensitivity values i fetch at runtime with caching instead. around all of it: least-privilege iam per secret, cloudtrail auditing of getsecretvalue, automatic rotation with a tested rollback, secret scanning in ci and pre-commit, and iam database authentication where available so there is no password to manage at all."}, {"n": 204, "category": 11, "difficulty": "D", "html": "S3 storage classes, lifecycle policies, and how you would cut storage cost by half.", "answerTitle": "S3 cost reduction", "answer": "<p>First, measure: S3 Storage Lens and an inventory report tell you what you actually have - I have never seen this analysis fail to find something surprising.<\/p><p>Levers, roughly in order of return: enable <strong>Intelligent-Tiering<\/strong> as the default for unpredictable access, which automates the standard-to-infrequent transitions for a small monitoring fee; add <strong>lifecycle policies<\/strong> to move known-cold data to Glacier Instant Retrieval, Flexible Retrieval or Deep Archive, and to expire genuinely temporary data; enable a rule to <strong>abort incomplete multipart uploads<\/strong> after 7 days, which is invisible storage almost everyone is paying for; expire <strong>noncurrent versions<\/strong> on versioned buckets, another common silent cost; compress and consolidate small objects, since per-request costs and minimum billable sizes dominate for tiny files; and check <strong>cross-region replication and data transfer<\/strong> charges, which are often larger than the storage line itself.<\/p><p>Then verify with Cost Explorer that the change landed, and put a budget alarm on the bucket&#x27;s cost allocation tag so it does not drift back.<\/p>", "source": "answers.md", "search": "s3 storage classes, lifecycle policies, and how you would cut storage cost by half. first, measure: s3 storage lens and an inventory report tell you what you actually have - i have never seen this analysis fail to find something surprising. levers, roughly in order of return: enable intelligent-tiering as the default for unpredictable access, which automates the standard-to-infrequent transitions for a small monitoring fee; add lifecycle policies to move known-cold data to glacier instant retrieval, flexible retrieval or deep archive, and to expire genuinely temporary data; enable a rule to abort incomplete multipart uploads after 7 days, which is invisible storage almost everyone is paying for; expire noncurrent versions on versioned buckets, another common silent cost; compress and consolidate small objects, since per-request costs and minimum billable sizes dominate for tiny files; and check cross-region replication and data transfer charges, which are often larger than the storage line itself. then verify with cost explorer that the change landed, and put a budget alarm on the bucket's cost allocation tag so it does not drift back."}, {"n": 205, "category": 11, "difficulty": "D", "html": "Auto-scaling: target tracking versus step scaling, and why scaling on CPU is often wrong.", "answerTitle": "Auto-scaling", "answer": "<p><strong>Target tracking<\/strong> keeps a metric at a set point and manages the scaling policy for you - simple, and my default. <strong>Step scaling<\/strong> applies different adjustments per alarm threshold, useful when you need a large jump under severe load. <strong>Scheduled scaling<\/strong> for known patterns such as a business-hours workload or a batch window. <strong>Predictive scaling<\/strong> where the pattern is regular and warm-up time is long.<\/p><p>Scaling on CPU is often wrong because CPU is rarely the constraint for a Java service - the queue is. A service waiting on a database or an external API sits at 20 percent CPU while latency climbs, so CPU-based scaling never fires. Better signals: request concurrency or <code>ALBRequestCountPerTarget<\/code>, queue depth or age of the oldest message for workers (with target tracking on <code>ApproximateAgeOfOldestMessage<\/code>, which directly maps to the user-visible SLO), and p99 latency as a guard.<\/p><p>The other half is getting the dynamics right: scale out fast and in slowly, set the health-check grace period longer than JVM warm-up or you will kill instances mid-start, keep a floor of instances for AZ resilience, and confirm the downstream can absorb the scaled-out fleet - auto-scaling into a fixed-size connection pool just moves the failure.<\/p>", "source": "answers.md", "search": "auto-scaling: target tracking versus step scaling, and why scaling on cpu is often wrong. target tracking keeps a metric at a set point and manages the scaling policy for you - simple, and my default. step scaling applies different adjustments per alarm threshold, useful when you need a large jump under severe load. scheduled scaling for known patterns such as a business-hours workload or a batch window. predictive scaling where the pattern is regular and warm-up time is long. scaling on cpu is often wrong because cpu is rarely the constraint for a java service - the queue is. a service waiting on a database or an external api sits at 20 percent cpu while latency climbs, so cpu-based scaling never fires. better signals: request concurrency or albrequestcountpertarget, queue depth or age of the oldest message for workers (with target tracking on approximateageofoldestmessage, which directly maps to the user-visible slo), and p99 latency as a guard. the other half is getting the dynamics right: scale out fast and in slowly, set the health-check grace period longer than jvm warm-up or you will kill instances mid-start, keep a floor of instances for az resilience, and confirm the downstream can absorb the scaled-out fleet - auto-scaling into a fixed-size connection pool just moves the failure."}, {"n": 206, "category": 11, "difficulty": "A", "html": "Design a multi-region active-active deployment. What are the three hardest problems?", "answerTitle": "Multi-region active-active", "answer": "<p>Shape: Route 53 latency or geolocation routing (with health checks and failover records) into regional stacks, each self-sufficient - ALB, compute, cache and data - with global data replication underneath and CloudFront in front for static and cacheable content.<\/p><p>The three hardest problems:<\/p><ol><li><strong>Data consistency and write conflicts.<\/strong> Two regions accepting writes for the same entity will conflict. Options: partition ownership so each entity has a home region and writes are routed there (my preference - it keeps reasoning simple); or accept a last-writer-wins / CRDT model with DynamoDB Global Tables and design the domain so conflicts are commutative; or keep a single write region with regional read replicas, which is really active-passive for writes and is what most &quot;active-active&quot; systems actually are. Be honest about which one you are proposing.<\/li><li><strong>Failover correctness.<\/strong> Health checks must detect partial failure, not just a dead endpoint; DNS TTLs and client-side caching delay cut-over; and the surviving region must have capacity headroom for the full load, which means paying for roughly 2x capacity or accepting degraded service. Split-brain during a partition needs a defined resolution.<\/li><li><strong>Operational reality.<\/strong> Deploying two regions with schema changes in flight, keeping configuration and secrets in sync, replicating identity and session state, regional service and feature parity, data residency and compliance constraints, and the cost of cross-region transfer. Plus testing: an untested failover is not a failover, so regular region-evacuation game days are non-negotiable.<\/li><\/ol><p>I would also ask what the requirement actually is. If it is disaster recovery with a 15-minute RTO, warm standby is far cheaper and simpler than active-active; active-active earns its cost when you need low latency for globally distributed users or a genuinely zero-RTO regulatory commitment.<\/p>", "source": "answers.md", "search": "design a multi-region active-active deployment. what are the three hardest problems? shape: route 53 latency or geolocation routing (with health checks and failover records) into regional stacks, each self-sufficient - alb, compute, cache and data - with global data replication underneath and cloudfront in front for static and cacheable content. the three hardest problems: 1. data consistency and write conflicts. two regions accepting writes for the same entity will conflict. options: partition ownership so each entity has a home region and writes are routed there (my preference - it keeps reasoning simple); or accept a last-writer-wins / crdt model with dynamodb global tables and design the domain so conflicts are commutative; or keep a single write region with regional read replicas, which is really active-passive for writes and is what most \"active-active\" systems actually are. be honest about which one you are proposing. 2. failover correctness. health checks must detect partial failure, not just a dead endpoint; dns ttls and client-side caching delay cut-over; and the surviving region must have capacity headroom for the full load, which means paying for roughly 2x capacity or accepting degraded service. split-brain during a partition needs a defined resolution. 3. operational reality. deploying two regions with schema changes in flight, keeping configuration and secrets in sync, replicating identity and session state, regional service and feature parity, data residency and compliance constraints, and the cost of cross-region transfer. plus testing: an untested failover is not a failover, so regular region-evacuation game days are non-negotiable. i would also ask what the requirement actually is. if it is disaster recovery with a 15-minute rto, warm standby is far cheaper and simpler than active-active; active-active earns its cost when you need low latency for globally distributed users or a genuinely zero-rto regulatory commitment."}, {"n": 207, "category": 11, "difficulty": "A", "html": "Your AWS bill jumped 40 percent this month. Walk through your investigation.", "answerTitle": "A 40 percent bill increase", "answer": "<ol><li><strong>Scope it.<\/strong> Cost Explorer grouped by service, then by usage type, comparing month over month and daily - a step change points at a deployment or a configuration change; a ramp points at growth or a leak. AWS Cost Anomaly Detection usually flags it first if configured.<\/li><li><strong>Localize it.<\/strong> Group by linked account, then by tag (which requires the tagging discipline to already exist - if it does not, that is the first remediation). Correlate the start date against the deployment and infrastructure change log.<\/li><li><strong>Check the usual suspects.<\/strong> Data transfer, especially cross-AZ and NAT gateway processing; a change from gateway to public routing; CloudWatch Logs ingestion after someone enabled debug logging; untagged or orphaned resources - unattached EBS volumes, old snapshots, idle load balancers, forgotten dev environments; a Savings Plan or Reserved Instance term expiring; an autoscaling floor raised; S3 versioning without lifecycle rules; a runaway Lambda retry loop or a recursive trigger.<\/li><li><strong>Fix and prevent.<\/strong> Remediate the specific cause, then add guardrails: budgets with alerts per account and per team, anomaly detection, a tagging policy enfo
