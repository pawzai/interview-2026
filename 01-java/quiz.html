ich turns a partial outage into a total one.<\/p>", "source": "answers.md", "search": "spring boot actuator: which endpoints do you expose in production and how do you secure them? expose /health (with liveness and readiness groups for kubernetes), /info, /metrics and /prometheus. guard /env, /configprops, /heapdump, /threaddump, /loggers and /mappings behind authentication, because they leak configuration and secrets. my production setup: put actuator on a separate management port not exposed by the ingress, require an authenticated role for anything beyond health, set management.endpoint.health.show-details=when-authorized, and write custom healthindicators only for dependencies whose failure should actually take the instance out of rotation - a common mistake is failing readiness because a non-critical downstream is down, which turns a partial outage into a total one."}, {"n": 139, "category": 7, "difficulty": "D", "html": "How do you write tests in Spring Boot: <code>@SpringBootTest<\/code> versus slice tests versus plain unit tests. What is your pyramid?", "answerTitle": "Testing strategy", "answer": "<p>Pyramid: a large base of plain JUnit + Mockito unit tests with no Spring context (milliseconds); a middle tier of slice tests (<code>@WebMvcTest<\/code>, <code>@DataJpaTest<\/code>, <code>@JsonTest<\/code>, <code>@RestClientTest<\/code>) that load only the relevant part; a thin top of <code>@SpringBootTest<\/code> integration tests against Testcontainers for real Postgres/Kafka/LocalStack; and contract tests (Spring Cloud Contract or Pact) at service boundaries so consumer expectations are verified without a full end-to-end environment.<\/p><p>I also insist on <code>@DirtiesContext<\/code> being rare, on deterministic time via an injected <code>Clock<\/code>, and on no <code>Thread.sleep<\/code> in tests - use Awaitility.<\/p>", "source": "answers.md", "search": "how do you write tests in spring boot: @springboottest versus slice tests versus plain unit tests. what is your pyramid? pyramid: a large base of plain junit + mockito unit tests with no spring context (milliseconds); a middle tier of slice tests (@webmvctest, @datajpatest, @jsontest, @restclienttest) that load only the relevant part; a thin top of @springboottest integration tests against testcontainers for real postgres/kafka/localstack; and contract tests (spring cloud contract or pact) at service boundaries so consumer expectations are verified without a full end-to-end environment. i also insist on @dirtiescontext being rare, on deterministic time via an injected clock, and on no thread.sleep in tests - use awaitility."}, {"n": 140, "category": 7, "difficulty": "T", "html": "Why does <code>@MockBean<\/code> slow down your test suite, and how do you avoid context reloading?", "answerTitle": "`@MockBean` and context caching", "answer": "<p>Spring caches application contexts across test classes keyed by their configuration. <code>@MockBean<\/code> changes that key, so every distinct combination of mocks creates and starts a <em>new<\/em> context - which for a large app can be several seconds each and dominates suite runtime.<\/p><p>Mitigations: group mocks into a shared test configuration so the key is reused, prefer constructor injection with plain Mockito in unit tests, use slice tests, and inspect <code>spring.test.context.cache.maxSize<\/code> and the context-cache statistics logging to see how many contexts you are creating. Spring Framework 6.2 <code>@MockitoBean<\/code> behaves the same way regarding the cache key.<\/p>", "source": "answers.md", "search": "why does @mockbean slow down your test suite, and how do you avoid context reloading? spring caches application contexts across test classes keyed by their configuration. @mockbean changes that key, so every distinct combination of mocks creates and starts a new context - which for a large app can be several seconds each and dominates suite runtime. mitigations: group mocks into a shared test configuration so the key is reused, prefer constructor injection with plain mockito in unit tests, use slice tests, and inspect spring.test.context.cache.maxsize and the context-cache statistics logging to see how many contexts you are creating. spring framework 6.2 @mockitobean behaves the same way regarding the cache key."}, {"n": 141, "category": 7, "difficulty": "A", "html": "Spring MVC versus WebFlux. When would you actually choose reactive, and what is the cost?", "answerTitle": "MVC versus WebFlux", "answer": "<p>WebFlux earns its place when you have very high concurrency with mostly IO-bound work and a fully reactive downstream stack (R2DBC, reactive Mongo, reactive HTTP client), or when you need streaming/backpressure semantics such as SSE fan-out to many clients.<\/p><p>Costs are real: a steep learning curve, painful debugging (no meaningful stack traces), <code>ThreadLocal<\/code> no longer works so security context and MDC need <code>Context<\/code> propagation, one blocking call anywhere poisons the event loop, and a much smaller pool of engineers who can maintain it.<\/p><p>In 2026 my default answer is: with virtual threads, Spring MVC gives you most of WebFlux&#x27;s concurrency benefit with none of the cognitive cost, so I choose MVC + virtual threads unless I specifically need streaming or backpressure.<\/p>", "source": "answers.md", "search": "spring mvc versus webflux. when would you actually choose reactive, and what is the cost? webflux earns its place when you have very high concurrency with mostly io-bound work and a fully reactive downstream stack (r2dbc, reactive mongo, reactive http client), or when you need streaming/backpressure semantics such as sse fan-out to many clients. costs are real: a steep learning curve, painful debugging (no meaningful stack traces), threadlocal no longer works so security context and mdc need context propagation, one blocking call anywhere poisons the event loop, and a much smaller pool of engineers who can maintain it. in 2026 my default answer is: with virtual threads, spring mvc gives you most of webflux's concurrency benefit with none of the cognitive cost, so i choose mvc + virtual threads unless i specifically need streaming or backpressure."}, {"n": 142, "category": 7, "difficulty": "D", "html": "How does <code>RestTemplate<\/code> differ from <code>WebClient<\/code> and from the Java 11 <code>HttpClient<\/code>? What are you using in 2026?", "answerTitle": "HTTP clients", "answer": "<p><code>RestTemplate<\/code> is in maintenance mode - synchronous, still supported, still everywhere in legacy code. <code>WebClient<\/code> is the reactive, non-blocking client and works fine in a blocking app via <code>.block()<\/code>, though that wastes its advantage. The JDK <code>HttpClient<\/code> (Java 11+) is a solid dependency-free option with HTTP/2 support.<\/p><p>In 2026 I use Spring&#x27;s <code>RestClient<\/code> for synchronous calls - it has WebClient&#x27;s fluent API with blocking semantics - and declarative HTTP interfaces (<code>@HttpExchange<\/code>) for typed clients. Whatever the choice, the things that actually matter are: explicit connect and read timeouts, a bounded connection pool, retry with backoff, a circuit breaker, and request/response logging with correlation IDs.<\/p>", "source": "answers.md", "search": "how does resttemplate differ from webclient and from the java 11 httpclient? what are you using in 2026? resttemplate is in maintenance mode - synchronous, still supported, still everywhere in legacy code. webclient is the reactive, non-blocking client and works fine in a blocking app via .block(), though that wastes its advantage. the jdk httpclient (java 11+) is a solid dependency-free option with http/2 support. in 2026 i use spring's restclient for synchronous calls - it has webclient's fluent api with blocking semantics - and declarative http interfaces (@httpexchange) for typed clients. whatever the choice, the things that actually matter are: explicit connect and read timeouts, a bounded connection pool, retry with backoff, a circuit breaker, and request/response logging with correlation ids."}, {"n": 143, "category": 8, "difficulty": "C", "html": "Walk through the Spring Security filter chain in order. Where does authentication actually happen?", "answerTitle": "The filter chain", "answer": "<p>A single <code>DelegatingFilterProxy<\/code> registered in the servlet container delegates to <code>FilterChainProxy<\/code>, which selects the first matching <code>SecurityFilterChain<\/code>. Typical order:<\/p><ol><li><code>DisableEncodeUrlFilter<\/code>, <code>WebAsyncManagerIntegrationFilter<\/code><\/li><li><code>SecurityContextHolderFilter<\/code> - loads the <code>SecurityContext<\/code> for the request and clears it afterwards<\/li><li><code>HeaderWriterFilter<\/code> - security headers<\/li><li><code>CorsFilter<\/code><\/li><li><code>CsrfFilter<\/code><\/li><li><code>LogoutFilter<\/code><\/li><li><strong>Authentication filters<\/strong> - <code>UsernamePasswordAuthenticationFilter<\/code>, <code>BearerTokenAuthenticationFilter<\/code>, OAuth2 filters, and your custom JWT filter<\/li><li><code>RequestCacheAwareFilter<\/code>, <code>SecurityContextHolderAwareRequestFilter<\/code><\/li><li><code>AnonymousAuthenticationFilter<\/code> - assigns an anonymous token so downstream never sees null<\/li><li><code>SessionManagementFilter<\/code><\/li><li><code>ExceptionTranslationFilter<\/code> - converts <code>AuthenticationException<\/code> to a 401 entry point and <code>AccessDeniedException<\/code> to 403<\/li><li><code>AuthorizationFilter<\/code> - the final authorization decision<\/li><\/ol><p>Authentication happens in step 7; authorization in step 12. <code>ExceptionTranslationFilter<\/code> sits <em>above<\/em> the authorization filter precisely so it can catch its exceptions.<\/p>", "source": "answers.md", "search": "walk through the spring security filter chain in order. where does authentication actually happen? a single delegatingfilterproxy registered in the servlet container delegates to filterchainproxy, which selects the first matching securityfilterchain. typical order: 1. disableencodeurlfilter, webasyncmanagerintegrationfilter 2. securitycontextholderfilter - loads the securitycontext for the request and clears it afterwards 3. headerwriterfilter - security headers 4. corsfilter 5. csrffilter 6. logoutfilter 7. authentication filters - usernamepasswordauthenticationfilter, bearertokenauthenticationfilter, oauth2 filters, and your custom jwt filter 8. requestcacheawarefilter, securitycontextholderawarerequestfilter 9. anonymousauthenticationfilter - assigns an anonymous token so downstream never sees null 10. sessionmanagementfilter 11. exceptiontranslationfilter - converts authenticationexception to a 401 entry point and accessdeniedexception to 403 12. authorizationfilter - the final authorization decision authentication happens in step 7; authorization in step 12. exceptiontranslationfilter sits above the authorization filter precisely so it can catch its exceptions."}, {"n": 144, "category": 8, "difficulty": "D", "html": "<code>AuthenticationManager<\/code>, <code>AuthenticationProvider<\/code>, <code>UserDetailsService<\/code>, <code>SecurityContextHolder<\/code> - how do they connect?", "answerTitle": "Authentication components", "answer": "<p>The filter builds an unauthenticated <code>Authentication<\/code> token and passes it to <code>AuthenticationManager<\/code> (usually <code>ProviderManager<\/code>), which walks a list of <code>AuthenticationProvider<\/code>s asking <code>supports(tokenType)<\/code>. <code>DaoAuthenticationProvider<\/code> loads the user through <code>UserDetailsService<\/code>, verifies the password with <code>PasswordEncoder<\/code>, and returns a fully populated <code>Authentication<\/code> with authorities. The filter stores it in <code>SecurityContextHolder<\/code>, which is <code>ThreadLocal<\/code>-backed (hence the propagation problem on async threads), and the <code>SecurityContextRepository<\/code> persists it for session-based flows.<\/p>", "source": "answers.md", "search": "authenticationmanager, authenticationprovider, userdetailsservice, securitycontextholder - how do they connect? the filter builds an unauthenticated authentication token and passes it to authenticationmanager (usually providermanager), which walks a list of authenticationproviders asking supports(tokentype). daoauthenticationprovider loads the user through userdetailsservice, verifies the password with passwordencoder, and returns a fully populated authentication with authorities. the filter stores it in securitycontextholder, which is threadlocal-backed (hence the propagation problem on async threads), and the securitycontextrepository persists it for session-based flows."}, {"n": 145, "category": 8, "difficulty": "D", "html": "Session-based authentication versus JWT. What are the real trade-offs, including revocation?", "answerTitle": "Sessions versus JWT", "answer": "<p>Sessions: server-side state, instantly revocable, opaque to the client, small cookie; cost is sticky sessions or a shared store (Redis via Spring Session), which is a scaling and availability concern but a solved one.<\/p><p>JWT: self-contained, stateless, verifiable without a lookup, good for cross-service and cross-domain; cost is that you cannot revoke before expiry, the payload is readable by anyone holding it, claims go stale (a role revoked at 10:00 still works until the token expires), and tokens grow with claims.<\/p><p>My default for a first-party web app is sessions with Redis - the &quot;stateless is simpler&quot; argument usually evaporates once you add a revocation list. JWTs I use for service-to-service and for genuinely federated scenarios, with short lifetimes.<\/p>", "source": "answers.md", "search": "session-based authentication versus jwt. what are the real trade-offs, including revocation? sessions: server-side state, instantly revocable, opaque to the client, small cookie; cost is sticky sessions or a shared store (redis via spring session), which is a scaling and availability concern but a solved one. jwt: self-contained, stateless, verifiable without a lookup, good for cross-service and cross-domain; cost is that you cannot revoke before expiry, the payload is readable by anyone holding it, claims go stale (a role revoked at 10:00 still works until the token expires), and tokens grow with claims. my default for a first-party web app is sessions with redis - the \"stateless is simpler\" argument usually evaporates once you add a revocation list. jwts i use for service-to-service and for genuinely federated scenarios, with short lifetimes."}, {"n": 146, "category": 8, "difficulty": "T", "html": "How do you invalidate a stateless JWT before it expires? Discuss all realistic options.", "answerTitle": "Revoking a JWT", "answer": "<p>You cannot un-issue it, so every option is a compromise:<\/p><ol><li><strong>Short access-token lifetime<\/strong> (5-15 minutes) plus refresh tokens - revoke at the refresh step. This is the standard answer and usually sufficient; you accept a bounded window of stale authorization.<\/li><li><strong>Denylist<\/strong> of revoked JTIs in Redis, checked per request - correct, but reintroduces the state you removed, though the store is far smaller than a session store and can expire entries at token expiry.<\/li><li><strong>Token version claim<\/strong> compared against a per-user counter - one cheap lookup, invalidates all of a user&#x27;s tokens at once, good for &quot;log out everywhere&quot; and password change.<\/li><li><strong>Key rotation<\/strong> to revoke everything at once - a blunt emergency instrument.<\/li><\/ol><p>The honest interview answer is to name the trade-off explicitly: stateless authentication and immediate revocation are fundamentally in tension; pick which one the requirement actually needs.<\/p>", "source": "answers.md", "search": "how do you invalidate a stateless jwt before it expires? discuss all realistic options. you cannot un-issue it, so every option is a compromise: 1. short access-token lifetime (5-15 minutes) plus refresh tokens - revoke at the refresh step. this is the standard answer and usually sufficient; you accept a bounded window of stale authorization. 2. denylist of revoked jtis in redis, checked per request - correct, but reintroduces the state you removed, though the store is far smaller than a session store and can expire entries at token expiry. 3. token version claim compared against a per-user counter - one cheap lookup, invalidates all of a user's tokens at once, good for \"log out everywhere\" and password change. 4. key rotation to revoke everything at once - a blunt emergency instrument. the honest interview answer is to name the trade-off explicitly: stateless authentication and immediate revocation are fundamentally in tension; pick which one the requirement actually needs."}, {"n": 147, "category": 8, "difficulty": "D", "html": "Access token versus refresh token: lifetimes, storage, rotation, and reuse detection.", "answerTitle": "Access and refresh tokens", "answer": "<p>Access token: short-lived (5-15 min), sent on every request, carries claims. Refresh token: long-lived (days to weeks), used only against the token endpoint, stored server-side or at minimum tracked.<\/p><p>Storage: for browsers, a refresh token in an <code>HttpOnly<\/code>, <code>Secure<\/code>, <code>SameSite=Strict<\/code> cookie scoped to the token endpoint; access token in memory. For mobile, the platform keystore.<\/p><p>Rotation: issue a new refresh token on every use and invalidate the previous one. Reuse detection - if an already-used refresh token is presented, the token family has leaked, so revoke the whole family and force re-authentication. That is what turns rotation from cosmetic into a real defense.<\/p>", "source": "answers.md", "search": "access token versus refresh token: lifetimes, storage, rotation, and reuse detection. access token: short-lived (5-15 min), sent on every request, carries claims. refresh token: long-lived (days to weeks), used only against the token endpoint, stored server-side or at minimum tracked. storage: for browsers, a refresh token in an httponly, secure, samesite=strict cookie scoped to the token endpoint; access token in memory. for mobile, the platform keystore. rotation: issue a new refresh token on every use and invalidate the previous one. reuse detection - if an already-used refresh token is presented, the token family has leaked, so revoke the whole family and force re-authentication. that is what turns rotation from cosmetic into a real defense."}, {"n": 148, "category": 8, "difficulty": "D", "html": "OAuth2 grant types in 2026: which are still recommended and which are deprecated, and why?", "answerTitle": "Grant types in 2026", "answer": "<p>Recommended: <strong>Authorization Code + PKCE<\/strong> for all interactive clients including SPAs and mobile, and <strong>Client Credentials<\/strong> for machine-to-machine. <strong>Device Code<\/strong> for input-constrained devices.<\/p><p>Deprecated by the OAuth 2.1 / Security BCP direction: <strong>Implicit<\/strong> (tokens in the URL fragment, no refresh, leaks through history and referrers) and <strong>Resource Owner Password Credentials<\/strong> (the client handles the user&#x27;s password, defeats federation and MFA). Both should be treated as unavailable in a new design.<\/p>", "source": "answers.md", "search": "oauth2 grant types in 2026: which are still recommended and which are deprecated, and why? recommended: authorization code + pkce for all interactive clients including spas and mobile, and client credentials for machine-to-machine. device code for input-constrained devices. deprecated by the oauth 2.1 / security bcp direction: implicit (tokens in the url fragment, no refresh, leaks through history and referrers) and resource owner password credentials (the client handles the user's password, defeats federation and mfa). both should be treated as unavailable in a new design."}, {"n": 149, "category": 8, "difficulty": "D", "html": "OAuth2 versus OIDC. What exactly does OIDC add?", "answerTitle": "OAuth2 versus OIDC", "answer": "<p>OAuth2 is an <em>authorization<\/em> framework: it gets a client a token to access a resource. It says nothing about who the user is - using an access token to infer identity is the classic mistake.<\/p><p>OIDC is an identity layer on top: it adds the <code>id_token<\/code> (a signed JWT with standard claims: <code>sub<\/code>, <code>iss<\/code>, <code>aud<\/code>, <code>exp<\/code>, <code>nonce<\/code>), the <code>/userinfo<\/code> endpoint, standard scopes (<code>openid<\/code>, <code>profile<\/code>, <code>email<\/code>), and discovery via <code>/.well-known/openid-configuration<\/code> with a JWKS endpoint for key rotation. If you need to know <em>who<\/em> the user is, you need OIDC.<\/p>", "source": "answers.md", "search": "oauth2 versus oidc. what exactly does oidc add? oauth2 is an authorization framework: it gets a client a token to access a resource. it says nothing about who the user is - using an access token to infer identity is the classic mistake. oidc is an identity layer on top: it adds the id_token (a signed jwt with standard claims: sub, iss, aud, exp, nonce), the /userinfo endpoint, standard scopes (openid, profile, email), and discovery via /.well-known/openid-configuration with a jwks endpoint for key rotation. if you need to know who the user is, you need oidc."}, {"n": 150, "category": 8, "difficulty": "D", "html": "Explain PKCE and the attack it prevents.", "answerTitle": "PKCE", "answer": "<p>Proof Key for Code Exchange. The client generates a random <code>code_verifier<\/code>, sends <code>code_challenge = SHA256(verifier)<\/code> with the authorization request, and must present the original verifier when exchanging the code for tokens.<\/p><p>It prevents authorization code interception: on mobile, a malicious app registering the same custom URL scheme could steal the code; in a browser, the code can leak through logs, referrers or history. Without PKCE, whoever holds the code can redeem it (public clients have no secret). With PKCE, the code is useless without the verifier. It is now recommended for confidential clients too.<\/p>", "source": "answers.md", "search": "explain pkce and the attack it prevents. proof key for code exchange. the client generates a random code_verifier, sends code_challenge = sha256(verifier) with the authorization request, and must present the original verifier when exchanging the code for tokens. it prevents authorization code interception: on mobile, a malicious app registering the same custom url scheme could steal the code; in a browser, the code can leak through logs, referrers or history. without pkce, whoever holds the code can redeem it (public clients have no secret). with pkce, the code is useless without the verifier. it is now recommended for confidential clients too."}, {"n": 151, "category": 8, "difficulty": "T", "html": "Why is storing a JWT in <code>localStorage<\/code> risky, and what is the recommended alternative?", "answerTitle": "JWT in `localStorage`", "answer": "<p><code>localStorage<\/code> is readable by any JavaScript on the origin, so a single XSS - including one in a third-party dependency - exfiltrates the token, and the attacker then holds a valid credential until it expires, off your machine and beyond your reach.<\/p><p>Alternative: an <code>HttpOnly<\/code>, <code>Secure<\/code>, <code>SameSite<\/code> cookie, which JavaScript cannot read. That reintroduces CSRF exposure, so pair it with <code>SameSite=Lax/Strict<\/code> and a CSRF token for state-changing requests. The pragmatic pattern is: refresh token in an <code>HttpOnly<\/code> cookie, access token held in a JavaScript closure in memory only (lost on refresh, re-obtained silently). And none of this substitutes for eliminating the XSS: a strict Content Security Policy and output encoding are the primary control.<\/p>", "source": "answers.md", "search": "why is storing a jwt in localstorage risky, and what is the recommended alternative? localstorage is readable by any javascript on the origin, so a single xss - including one in a third-party dependency - exfiltrates the token, and the attacker then holds a valid credential until it expires, off your machine and beyond your reach. alternative: an httponly, secure, samesite cookie, which javascript cannot read. that reintroduces csrf exposure, so pair it with samesite=lax/strict and a csrf token for state-changing requests. the pragmatic pattern is: refresh token in an httponly cookie, access token held in a javascript closure in memory only (lost on refresh, re-obtained silently). and none of this substitutes for eliminating the xss: a strict content security policy and output encoding are the primary control."}, {"n": 152, "category": 8, "difficulty": "D", "html": "CSRF: what it is, why it does not apply to a stateless bearer-token API, and when you must still enable it.", "answerTitle": "CSRF", "answer": "<p>The attacker makes the victim&#x27;s browser send an authenticated request to your site using credentials the browser attaches <em>automatically<\/em>. That is the key condition - it applies to cookies and HTTP Basic, not to an <code>Authorization: Bearer<\/code> header that JavaScript must add deliberately.<\/p><p>So a purely token-based API can disable CSRF. You must keep it on when: any authentication relies on cookies, you serve server-rendered forms, or you use a hybrid (cookie-stored JWT) - that last case is a very common oversight, where teams disable CSRF &quot;because we use JWT&quot; while storing the JWT in a cookie.<\/p><p>Defenses: synchronizer token or double-submit cookie (Spring&#x27;s <code>CookieCsrfTokenRepository<\/code>), plus <code>SameSite<\/code> cookies as defense in depth.<\/p>", "source": "answers.md", "search": "csrf: what it is, why it does not apply to a stateless bearer-token api, and when you must still enable it. the attacker makes the victim's browser send an authenticated request to your site using credentials the browser attaches automatically . that is the key condition - it applies to cookies and http basic, not to an authorization: bearer header that javascript must add deliberately. so a purely token-based api can disable csrf. you must keep it on when: any authentication relies on cookies, you serve server-rendered forms, or you use a hybrid (cookie-stored jwt) - that last case is a very common oversight, where teams disable csrf \"because we use jwt\" while storing the jwt in a cookie. defenses: synchronizer token or double-submit cookie (spring's cookiecsrftokenrepository), plus samesite cookies as defense in depth."}, {"n": 153, "category": 8, "difficulty": "D", "html": "CORS: preflight requests, why disabling it is not a security fix, and where to configure it correctly.", "answerTitle": "CORS", "answer": "<p>CORS is a <em>browser<\/em> enforcement mechanism that relaxes the same-origin policy. A non-simple request triggers a preflight <code>OPTIONS<\/code> carrying <code>Origin<\/code>, <code>Access-Control-Request-Method<\/code> and headers, and the server replies with the allowed set.<\/p><p>Two things to say in an interview: CORS is not authorization - it does not protect your API, since curl and server-side clients ignore it entirely; and <code>allowedOrigins(&quot;*&quot;)<\/code> combined with <code>allowCredentials(true)<\/code> is rejected by the spec and by Spring, which is a signal that wildcarding credentials is unsafe.<\/p><p>Configure it once, in Spring Security&#x27;s <code>cors()<\/code> backed by a <code>CorsConfigurationSource<\/code>, not with scattered <code>@CrossOrigin<\/code> annotations - and note the CORS filter must run before authentication so preflights are not rejected with a 401.<\/p>", "source": "answers.md", "search": "cors: preflight requests, why disabling it is not a security fix, and where to configure it correctly. cors is a browser enforcement mechanism that relaxes the same-origin policy. a non-simple request triggers a preflight options carrying origin, access-control-request-method and headers, and the server replies with the allowed set. two things to say in an interview: cors is not authorization - it does not protect your api, since curl and server-side clients ignore it entirely; and allowedorigins(\" \") combined with allowcredentials(true) is rejected by the spec and by spring, which is a signal that wildcarding credentials is unsafe. configure it once, in spring security's cors() backed by a corsconfigurationsource, not with scattered @crossorigin annotations - and note the cors filter must run before authentication so preflights are not rejected with a 401."}, {"n": 154, "category": 8, "difficulty": "D", "html": "Method-level security: <code>@PreAuthorize<\/code>, <code>@PostAuthorize<\/code>, <code>@Secured<\/code>, and SpEL expressions.", "answerTitle": "Method security", "answer": "<p>Enable with <code>@EnableMethodSecurity<\/code>. <code>@PreAuthorize<\/code> evaluates before invocation and takes SpEL: <code>@PreAuthorize(&quot;hasRole(&#x27;ADMIN&#x27;) or #userId == authentication.principal.id&quot;)<\/code>. <code>@PostAuthorize<\/code> runs after and can inspect the return value (<code>returnObject.ownerId == authentication.name<\/code>) - useful, but the method has already executed, so any side effect has happened. <code>@Secured<\/code> and JSR-250 <code>@RolesAllowed<\/code> are role-only and less expressive. <code>@PreFilter<\/code>/<code>@PostFilter<\/code> filter collections, which is elegant but do not use <code>@PostFilter<\/code> on a large result set - filter in the query instead.<\/p><p>Note it is AOP-based, so the same self-invocation limitation applies, and remember <code>hasRole(&#x27;ADMIN&#x27;)<\/code> implicitly prepends <code>ROLE_<\/code> while <code>hasAuthority(&#x27;ADMIN&#x27;)<\/code> does not - a frequent source of &quot;why is my rule not matching&quot;.<\/p>", "source": "answers.md", "search": "method-level security: @preauthorize, @postauthorize, @secured, and spel expressions. enable with @enablemethodsecurity. @preauthorize evaluates before invocation and takes spel: @preauthorize(\"hasrole('admin') or userid == authentication.principal.id\"). @postauthorize runs after and can inspect the return value (returnobject.ownerid == authentication.name) - useful, but the method has already executed, so any side effect has happened. @secured and jsr-250 @rolesallowed are role-only and less expressive. @prefilter/@postfilter filter collections, which is elegant but do not use @postfilter on a large result set - filter in the query instead. note it is aop-based, so the same self-invocation limitation applies, and remember hasrole('admin') implicitly prepends role_ while hasauthority('admin') does not - a frequent source of \"why is my rule not matching\"."}, {"n": 155, "category": 8, "difficulty": "D", "html": "How do you implement multi-tenant authorization without leaking data between tenants?", "answerTitle": "Multi-tenant authorization", "answer": "<p>Layered, because a single control will eventually be bypassed:<\/p><ol><li>Tenant identity comes from the <em>authenticated token<\/em>, never from a request parameter or header the client controls.<\/li><li>Resolve it once in a filter into a request-scoped context, and propagate it explicitly (not via a raw <code>ThreadLocal<\/code> on async paths).<\/li><li>Enforce at the data layer, not in each service method: a Hibernate <code>@Filter<\/code> or a <code>@Where<\/code> clause applied globally, or Postgres row-level security keyed on a session variable - so a developer who forgets the <code>WHERE tenant_id = ?<\/code> still cannot leak.<\/li><li>Include the tenant in every cache key, every queue message and every log line.<\/li><li>Test it: an automated test suite that authenticates as tenant A and asserts 404 (not 403 - do not confirm existence) on every tenant B resource.<\/li><\/ol><p>The strongest isolation is separate schemas or databases per tenant; it costs migration complexity and connection pool pressure, but for regulated data it is often the only defensible answer.<\/p>", "source": "answers.md", "search": "how do you implement multi-tenant authorization without leaking data between tenants? layered, because a single control will eventually be bypassed: 1. tenant identity comes from the authenticated token , never from a request parameter or header the client controls. 2. resolve it once in a filter into a request-scoped context, and propagate it explicitly (not via a raw threadlocal on async paths). 3. enforce at the data layer, not in each service method: a hibernate @filter or a @where clause applied globally, or postgres row-level security keyed on a session variable - so a developer who forgets the where tenant_id = ? still cannot leak. 4. include the tenant in every cache key, every queue message and every log line. 5. test it: an automated test suite that authenticates as tenant a and asserts 404 (not 403 - do not confirm existence) on every tenant b resource. the strongest isolation is separate schemas or databases per tenant; it costs migration complexity and connection pool pressure, but for regulated data it is often the only defensible answer."}, {"n": 156, "category": 8, "difficulty": "D", "html": "Password storage: BCrypt versus Argon2 versus PBKDF2. What work factor do you choose and why?", "answerTitle": "Password hashing", "answer": "<p>Use a memory-hard, deliberately slow algorithm with a per-password salt. <strong>Argon2id<\/strong> is the current recommendation (OWASP: 19 MiB memory, 2 iterations, 1 degree of parallelism as a baseline). <strong>BCrypt<\/strong> remains acceptable with a work factor of 10-12 and is what Spring&#x27;s <code>DelegatingPasswordEncoder<\/code> defaults to; note its 72-byte input truncation. <strong>PBKDF2<\/strong> when FIPS compliance forces it, at 600k+ iterations for SHA-256.<\/p><p>Choose the cost by measuring: tune so hashing takes roughly 250-500ms on production hardware, then re-evaluate annually. Use <code>DelegatingPasswordEncoder<\/code> so the stored hash carries its algorithm prefix (<code>{bcrypt}<\/code>, <code>{argon2}<\/code>) and you can upgrade in place on successful login.<\/p>", "source": "answers.md", "search": "password storage: bcrypt versus argon2 versus pbkdf2. what work factor do you choose and why? use a memory-hard, deliberately slow algorithm with a per-password salt. argon2id is the current recommendation (owasp: 19 mib memory, 2 iterations, 1 degree of parallelism as a baseline). bcrypt remains acceptable with a work factor of 10-12 and is what spring's delegatingpasswordencoder defaults to; note its 72-byte input truncation. pbkdf2 when fips compliance forces it, at 600k+ iterations for sha-256. choose the cost by measuring: tune so hashing takes roughly 250-500ms on production hardware, then re-evaluate annually. use delegatingpasswordencoder so the stored hash carries its algorithm prefix ({bcrypt}, {argon2}) and you can upgrade in place on successful login."}, {"n": 157, "category": 8, "difficulty": "D", "html": "OWASP Top 10 - name them and give a Java-specific mitigation for each.", "answerTitle": "OWASP Top 10 with Java mitigations", "answer": "<ol><li><strong>Broken Access Control<\/strong> - deny by default, enforce server-side per resource, never trust client-supplied IDs; test for IDOR.<\/li><li><strong>Cryptographic Failures<\/strong> - TLS everywhere, AES-GCM, no MD5/SHA-1 for passwords, no hardcoded keys, use KMS.<\/li><li><strong>Injection<\/strong> - parameterized queries and JPA parameter binding; validate and allowlist; encode output to stop XSS.<\/li><li><strong>Insecure Design<\/strong> - threat modelling, abuse cases, rate limits designed in rather than bolted on.<\/li><li><strong>Security Misconfiguration<\/strong> - actuator endpoints locked down, stack traces off, default credentials removed, security headers set.<\/li><li><strong>Vulnerable Components<\/strong> - OWASP Dependency-Check or Snyk in CI, an SBOM, and a policy for patching (Log4Shell is the reference lesson).<\/li><li><strong>Identification and Authentication Failures<\/strong> - MFA, no credential stuffing tolerance, secure session handling, account lockout with backoff.<\/li><li><strong>Software and Data Integrity Failures<\/strong> - signed artifacts, verified base images, no unsafe Java deserialization of untrusted input (use JSON with type restrictions).<\/li><li><strong>Logging and Monitoring Failures<\/strong> - log authentication events and authorization denials, never log secrets or tokens, alert on anomalies.<\/li><li><strong>SSRF<\/strong> - allowlist outbound destinations, block link-local <code>169.254.169.254<\/code>, use IMDSv2, resolve and validate the IP after redirects.<\/li><\/ol>", "source": "answers.md", "search": "owasp top 10 - name them and give a java-specific mitigation for each. 1. broken access control - deny by default, enforce server-side per resource, never trust client-supplied ids; test for idor. 2. cryptographic failures - tls everywhere, aes-gcm, no md5/sha-1 for passwords, no hardcoded keys, use kms. 3. injection - parameterized queries and jpa parameter binding; validate and allowlist; encode output to stop xss. 4. insecure design - threat modelling, abuse cases, rate limits designed in rather than bolted on. 5. security misconfiguration - actuator endpoints locked down, stack traces off, default credentials removed, security headers set. 6. vulnerable components - owasp dependency-check or snyk in ci, an sbom, and a policy for patching (log4shell is the reference lesson). 7. identification and authentication failures - mfa, no credential stuffing tolerance, secure session handling, account lockout with backoff. 8. software and data integrity failures - signed artifacts, verified base images, no unsafe java deserialization of untrusted input (use json with type restrictions). 9. logging and monitoring failures - log authentication events and authorization denials, never log secrets or tokens, alert on anomalies. 10. ssrf - allowlist outbound destinations, block link-local 169.254.169.254, use imdsv2, resolve and validate the ip after redirects."}, {"n": 158, "category": 8, "difficulty": "T", "html": "How does SQL injection still happen in a JPA application, despite prepared statements?", "answerTitle": "SQL injection in JPA", "answer": "<p>Prepared statements protect <em>parameter values<\/em>, not query structure. Injection still occurs through:<\/p><ul><li>Concatenated JPQL or native queries: <code>em.createQuery(&quot;... WHERE name = &#x27;&quot; + name + &quot;&#x27;&quot;)<\/code>.<\/li><li>Dynamic <code>ORDER BY<\/code> or column names built from user input - these cannot be bound as parameters, so they must be validated against an allowlist.<\/li><li><code>LIKE<\/code> patterns concatenated without escaping wildcard characters.<\/li><li>Spring Data <code>@Query<\/code> with SpEL that interpolates user input, or <code>nativeQuery = true<\/code> with string building.<\/li><li>Dynamic table names in multi-tenant schema switching.<\/li><\/ul><p>Rule: every user-controlled value is a bound parameter; every user-controlled <em>identifier<\/em> is checked against a fixed allowlist. Add static analysis to catch concatenation into query strings.<\/p>", "source": "answers.md", "search": "how does sql injection still happen in a jpa application, despite prepared statements? prepared statements protect parameter values , not query structure. injection still occurs through: - concatenated jpql or native queries: em.createquery(\"... where name = '\" + name + \"'\"). - dynamic order by or column names built from user input - these cannot be bound as parameters, so they must be validated against an allowlist. - like patterns concatenated without escaping wildcard characters. - spring data @query with spel that interpolates user input, or nativequery = true with string building. - dynamic table names in multi-tenant schema switching. rule: every user-controlled value is a bound parameter; every user-controlled identifier is checked against a fixed allowlist. add static analysis to catch concatenation into query strings."}, {"n": 159, "category": 8, "difficulty": "D", "html": "How do you secure secrets in a Spring Boot application deployed on AWS?", "answerTitle": "Secrets in Spring Boot on AWS", "answer": "<p>No secrets in <code>application.yml<\/code>, environment variables in a manifest, or the container image. Use AWS Secrets Manager (supports rotation, encrypted with KMS) or Parameter Store SecureString for lower-cost cases, loaded via <code>spring.config.import=aws-secretsmanager:<\/code> from Spring Cloud AWS, with the task or pod assuming an IAM role (IRSA on EKS, task role on ECS) so there are no static credentials anywhere.<\/p><p>For databases, prefer IAM authentication or Secrets Manager-managed rotation with a short-lived credential. Add: least-privilege IAM per service, secret scanning in CI (gitleaks) and a pre-commit hook, audit access via CloudTrail, and a documented rotation runbook. If a secret ever reaches git history, treat it as compromised and rotate - removing the commit is not remediation.<\/p>", "source": "answers.md", "search": "how do you secure secrets in a spring boot application deployed on aws? no secrets in application.yml, environment variables in a manifest, or the container image. use aws secrets manager (supports rotation, encrypted with kms) or parameter store securestring for lower-cost cases, loaded via spring.config.import=aws-secretsmanager: from spring cloud aws, with the task or pod assuming an iam role (irsa on eks, task role on ecs) so there are no static credentials anywhere. for databases, prefer iam authentication or secrets manager-managed rotation with a short-lived credential. add: least-privilege iam per service, secret scanning in ci (gitleaks) and a pre-commit hook, audit access via cloudtrail, and a documented rotation runbook. if a secret ever reaches git history, treat it as compromised and rotate - removing the commit is not remediation."}, {"n": 160, "category": 8, "difficulty": "A", "html": "How do you implement zero-trust service-to-service authentication in a microservice estate?", "answerTitle": "Zero-trust service-to-service", "answer": "<p>Assume the network is hostile; every call is authenticated and authorized regardless of origin.<\/p><p>Mechanism: mutual TLS with short-lived, automatically rotated certificates (SPIFFE/SPIRE identities, or a service mesh like Istio/Linkerd issuing them), so each workload has a cryptographic identity rather than an IP-based trust assumption. Layer authorization on top: mesh authorization policies for coarse &quot;who may call whom&quot;, plus token-based (OAuth2 client credentials with audience-restricted, short-lived tokens) for fine-grained scopes at the application layer. Propagate the <em>end user<\/em> identity separately from the service identity - a token exchange so the downstream can enforce user-level rules without re-authenticating.<\/p><p>Supporting practices: no long-lived credentials, deny-by-default policies as code and reviewed, full audit of allow/deny decisions, and continuous verification rather than a one-time perimeter check. The cost is real operational complexity, so I introduce it where the blast radius justifies it - starting with the services holding regulated data.<\/p>", "source": "answers.md", "search": "how do you implement zero-trust service-to-service authentication in a microservice estate? assume the network is hostile; every call is authenticated and authorized regardless of origin. mechanism: mutual tls with short-lived, automatically rotated certificates (spiffe/spire identities, or a service mesh like istio/linkerd issuing them), so each workload has a cryptographic identity rather than an ip-based trust assumption. layer authorization on top: mesh authorization policies for coarse \"who may call whom\", plus token-based (oauth2 client credentials with audience-restricted, short-lived tokens) for fine-grained scopes at the application layer. propagate the end user identity separately from the service identity - a token exchange so the downstream can enforce user-level rules without re-authenticating. supporting practices: no long-lived credentials, deny-by-default policies as code and reviewed, full audit of allow/deny decisions, and continuous verification rather than a one-time perimeter check. the cost is real operational complexity, so i introduce it where the blast radius justifies it - starting with the services holding regulated data."}, {"n": 161, "category": 9, "difficulty": "C", "html": "JPA entity lifecycle states: transient, managed, detached, removed.", "answerTitle": "Entity lifecycle", "answer": "<p><strong>Transient<\/strong>: new, no identity, not tracked. <strong>Managed<\/strong>: attached to a persistence context; changes are auto-flushed at commit through dirty checking (which is why calling a setter without any <code>save()<\/code> still writes). <strong>Detached<\/strong>: has identity but the context is closed; lazy loads fail; <code>merge()<\/code> reattaches a copy. <strong>Removed<\/strong>: scheduled for deletion at flush.<\/p><p>The dirty-checking behavior is the one that catches people: modifying a managed entity inside a transaction persists whether or not you intended it.<\/p>", "source": "answers.md", "search": "jpa entity lifecycle states: transient, managed, detached, removed. transient : new, no identity, not tracked. managed : attached to a persistence context; changes are auto-flushed at commit through dirty checking (which is why calling a setter without any save() still writes). detached : has identity but the context is closed; lazy loads fail; merge() reattaches a copy. removed : scheduled for deletion at flush. the dirty-checking behavior is the one that catches people: modifying a managed entity inside a transaction persists whether or not you intended it."}, {"n": 162, "category": 9, "difficulty": "T", "html": "Explain the N+1 select problem. Show three different fixes and the drawback of each.", "answerTitle": "N+1 selects", "answer": "<p>One query fetches N parents, then accessing a lazy association fires one query per parent - N+1 round trips. It is invisible in a small dev dataset and lethal in production.<\/p><p>Fixes and their drawbacks:<\/p><ol><li><strong><code>JOIN FETCH<\/code><\/strong> in JPQL - one query, but it multiplies rows for collections (a cartesian product with two collections), and <strong>pagination with <code>JOIN FETCH<\/code> on a collection makes Hibernate fetch everything into memory and paginate in Java<\/strong> - it warns <code>HHH000104<\/code>.<\/li><li><strong><code>@EntityGraph<\/code><\/strong> - declarative and reusable on Spring Data repository methods, same cartesian caveat.<\/li><li><strong><code>@BatchSize(size = 25)<\/code><\/strong> or <code>hibernate.default_batch_fetch_size<\/code> - turns N+1 into N/25+1 queries with an <code>IN<\/code> clause; no cartesian product, works with pagination. My usual default.<\/li><li><strong>Two-query approach<\/strong>: fetch IDs with pagination, then fetch entities with a fetch join on those IDs.<\/li><li><strong>DTO projection<\/strong> with a constructor expression or Spring Data interface projection - fetch exactly what you need and skip the entity graph entirely; my preference for read-heavy endpoints.<\/li><\/ol><p>Detection: enable <code>hibernate.generate_statistics<\/code>, assert query counts in integration tests, and use datasource-proxy or Hypersistence Utils to fail a test when the count exceeds a threshold. That is how you keep it from coming back.<\/p>", "source": "answers.md", "search": "explain the n+1 select problem. show three different fixes and the drawback of each. one query fetches n parents, then accessing a lazy association fires one query per parent - n+1 round trips. it is invisible in a small dev dataset and lethal in production. fixes and their drawbacks: 1. join fetch in jpql - one query, but it multiplies rows for collections (a cartesian product with two collections), and pagination with join fetch on a collection makes hibernate fetch everything into memory and paginate in java - it warns hhh000104. 2. @entitygraph - declarative and reusable on spring data repository methods, same cartesian caveat. 3. @batchsize(size = 25) or hibernate.default_batch_fetch_size - turns n+1 into n/25+1 queries with an in clause; no cartesian product, works with pagination. my usual default. 4. two-query approach : fetch ids with pagination, then fetch entities with a fetch join on those ids. 5. dto projection with a constructor expression or spring data interface projection - fetch exactly what you need and skip the entity graph entirely; my preference for read-heavy endpoints. detection: enable hibernate.generate_statistics, assert query counts in integration tests, and use datasource-proxy or hypersistence utils to fail a test when the count exceeds a threshold. that is how you keep it from coming back."}, {"n": 163, "category": 9, "difficulty": "T", "html": "<code>FetchType.EAGER<\/code> versus <code>LAZY<\/code> - why does <code>LAZY<\/code> throw <code>LazyInitializationException<\/code> and what are the correct fixes (not <code>open-in-view<\/code>)?", "answerTitle": "`LazyInitializationException`", "answer": "<p>Lazy associations are proxies that need an open session. Once the transaction ends and the session closes, touching the proxy throws.<\/p><p>The wrong fixes: switching to <code>EAGER<\/code> (now you over-fetch on every query, everywhere), or enabling <code>spring.jpa.open-in-view<\/code> (Boot&#x27;s default, and it keeps a database connection held for the full request including view rendering, so it hides N+1 problems in the serialization layer and exhausts the pool under load - I turn it off explicitly and fix what breaks).<\/p><p>The right fixes: fetch what you need inside the transaction using a fetch join or entity graph; or map to a DTO inside the transactional boundary so nothing lazy escapes; or use <code>Hibernate.initialize()<\/code> deliberately where a conditional load is genuinely needed.<\/p>", "source": "answers.md", "search": "fetchtype.eager versus lazy - why does lazy throw lazyinitializationexception and what are the correct fixes (not open-in-view)? lazy associations are proxies that need an open session. once the transaction ends and the session closes, touching the proxy throws. the wrong fixes: switching to eager (now you over-fetch on every query, everywhere), or enabling spring.jpa.open-in-view (boot's default, and it keeps a database connection held for the full request including view rendering, so it hides n+1 problems in the serialization layer and exhausts the pool under load - i turn it off explicitly and fix what breaks). the right fixes: fetch what you need inside the transaction using a fetch join or entity graph; or map to a dto inside the transactional boundary so nothing lazy escapes; or use hibernate.initialize() deliberately where a conditional load is genuinely needed."}, {"n": 164, "category": 9, "difficulty": "D", "html": "First-level versus second-level cache. When is the second-level cache dangerous?", "answerTitle": "Caching levels", "answer": "<p>First-level cache is the persistence context - per transaction, mandatory, gives you identity guarantees within a session. Second-level is shared across sessions per <code>SessionFactory<\/code> (Ehcache, Hazelcast, Infinispan), plus an optional query cache.<\/p><p>Dangers: stale data when anything writes to the database outside Hibernate (bulk updates, another service, a DBA script); cache invalidation across a cluster requiring distributed invalidation; the query cache being notoriously easy to make slower than no cache because any write to a table invalidates all its cached queries.<\/p><p>I enable the second-level cache only for genuinely read-mostly reference data, and I prefer an explicit application cache (Caffeine or Redis) over the entity cache, because the invalidation rules are then visible rather than implicit.<\/p>", "source": "answers.md", "search": "first-level versus second-level cache. when is the second-level cache dangerous? first-level cache is the persistence context - per transaction, mandatory, gives you identity guarantees within a session. second-level is shared across sessions per sessionfactory (ehcache, hazelcast, infinispan), plus an optional query cache. dangers: stale data when anything writes to the database outside hibernate (bulk updates, another service, a dba script); cache invalidation across a cluster requiring distributed invalidation; the query cache being notoriously easy to make slower than no cache because any write to a table invalidates all its cached queries. i enable the second-level cache only for genuinely read-mostly reference data, and i prefer an explicit application cache (caffeine or redis) over the entity cache, because the invalidation rules are then visible rather than implicit."}, {"n": 165, "category": 9, "difficulty": "D", "html": "Optimistic versus pessimistic locking. How do you implement each in JPA?", "answerTitle": "Locking", "answer": "<p><strong>Optimistic<\/strong>: a <code>@Version<\/code> column; on update Hibernate adds <code>WHERE version = ?<\/code> and throws <code>OptimisticLockException<\/code> if zero rows changed. No locks held, so it scales; the caller must handle the conflict, usually by reloading and retrying. Default choice for user-facing edits.<\/p><p><strong>Pessimistic<\/strong>: <code>SELECT ... FOR UPDATE<\/code> via <code>@Lock(LockModeType.PESSIMISTIC_WRITE)<\/code> or <code>PESSIMISTIC_READ<\/code>. Holds a row lock for the transaction&#x27;s duration, so it serializes contenders and risks deadlocks and lock-wait timeouts. Justified for short critical sections with high contention where retrying is expensive - inventory decrement, seat reservation.<\/p><p>Always set a lock timeout (<code>jakarta.persistence.lock.timeout<\/code>) with pessimistic locks so a stuck transaction does not cascade.<\/p>", "source": "answers.md", "search": "optimistic versus pessimistic locking. how do you implement each in jpa? optimistic : a @version column; on update hibernate adds where version = ? and throws optimisticlockexception if zero rows changed. no locks held, so it scales; the caller must handle the conflict, usually by reloading and retrying. default choice for user-facing edits. pessimistic : select ... for update via @lock(lockmodetype.pessimistic_write) or pessimistic_read. holds a row lock for the transaction's duration, so it serializes contenders and risks deadlocks and lock-wait timeouts. justified for short critical sections with high contention where retrying is expensive - inventory decrement, seat reservation. always set a lock timeout (jakarta.persistence.lock.timeout) with pessimistic locks so a stuck transaction does not cascade."}, {"n": 166, "category": 9, "difficulty": "D", "html": "<code>@OneToMany<\/code> bidirectional mapping - who owns the relationship and what happens if you set only one side?", "answerTitle": "Bidirectional `@OneToMany`", "answer": "<p>The <strong><code>@ManyToOne<\/code> side owns the relationship<\/strong> because it holds the foreign key. <code>mappedBy<\/code> on the <code>@OneToMany<\/code> side declares it as the inverse, non-owning side.<\/p><p>If you add a child to the parent&#x27;s collection but never set <code>child.setParent(parent)<\/code>, nothing is persisted - the owning side was never modified. Always write helper methods:<\/p><pre><code class=\"lang-java\">public void addItem(Item item) { items.add(item); item.setOrder(this); }\npublic void removeItem(Item item) { items.remove(item); item.setOrder(null); }<\/code><\/pre><p>Also: use <code>Set<\/code> with a stable <code>equals<\/code>/<code>hashCode<\/code> (based on a business key, not the generated ID, which is null before persist), and avoid <code>@OneToMany<\/code> without <code>mappedBy<\/code>, which creates a surprise join table.<\/p>", "source": "answers.md", "search": "@onetomany bidirectional mapping - who owns the relationship and what happens if you set only one side? the @manytoone side owns the relationship because it holds the foreign key. mappedby on the @onetomany side declares it as the inverse, non-owning side. if you add a child to the parent's collection but never set child.setparent(parent), nothing is persisted - the owning side was never modified. always write helper methods: java public void additem(item item) { items.add(item); item.setorder(this); } public void removeitem(item item) { items.remove(item); item.setorder(null); } also: use set with a stable equals/hashcode (based on a business key, not the generated id, which is null before persist), and avoid @onetomany without mappedby, which creates a surprise join table."}, {"n": 167, "category": 9, "difficulty": "T", "html": "Why should you not use <code>CascadeType.REMOVE<\/code> with a large collection?", "answerTitle": "`CascadeType.REMOVE` on a large collection", "answer": "<p>Hibernate must load every child entity to apply lifecycle callbacks and fire an individual <code>DELETE<\/code> per row - so deleting a parent with 100,000 children loads 100,000 objects into the persistence context and issues 100,000 statements. Memory and transaction duration both explode, and it silently gets worse as data grows.<\/p><p>Alternatives: a bulk <code>DELETE FROM child WHERE parent_id = ?<\/code> (then clear the persistence context, because bulk operations bypass it), a database-level <code>ON DELETE CASCADE<\/code> foreign key, or soft delete plus an asynchronous purge job. Also note <code>orphanRemoval = true<\/code> has the same characteristics.<\/p>", "source": "answers.md", "search": "why should you not use cascadetype.remove with a large collection? hibernate must load every child entity to apply lifecycle callbacks and fire an individual delete per row - so deleting a parent with 100,000 children loads 100,000 objects into the persistence context and issues 100,000 statements. memory and transaction duration both explode, and it silently gets worse as data grows. alternatives: a bulk delete from child where parent_id = ? (then clear the persistence context, because bulk operations bypass it), a database-level on delete cascade foreign key, or soft delete plus an asynchronous purge job. also note orphanremoval = true has the same characteristics."}, {"n": 168, "category": 9, "difficulty": "D", "html": "<code>save()<\/code> versus <code>saveAndFlush()<\/code> versus <code>persist()<\/code> versus <code>merge()<\/code>.", "answerTitle": "`save`, `saveAndFlush`, `persist`, `merge`", "answer": "<p><code>persist<\/code> makes a <em>new<\/em> entity managed and throws if it already has an identifier that exists. <code>merge<\/code> copies the state of a detached instance into a managed copy and <strong>returns that copy<\/strong> - the instance you passed in remains detached, which is the classic &quot;my changes disappeared&quot; bug.<\/p><p>Spring Data&#x27;s <code>save<\/code> delegates to <code>persist<\/code> when <code>isNew()<\/code> is true and <code>merge<\/code> otherwise. <code>saveAndFlush<\/code> additionally forces the SQL to be issued immediately rather than at commit - useful when you need a generated value or want a constraint violation to surface at a known point, but it forfeits batching.<\/p>", "source": "answers.md", "search": "save() versus saveandflush() versus persist() versus merge(). persist makes a new entity managed and throws if it already has an identifier that exists. merge copies the state of a detached instance into a managed copy and returns that copy - the instance you passed in remains detached, which is the classic \"my changes disappeared\" bug. spring data's save delegates to persist when isnew() is true and merge otherwise. saveandflush additionally forces the sql to be issued immediately rather than at commit - useful when you need a generated value or want a constraint violation to surface at a known point, but it forfeits batching."}, {"n": 169, "category": 9, "difficulty": "D", "html": "How do you paginate efficiently over millions of rows? Why does <code>OFFSET<\/code> degrade?", "answerTitle": "Efficient pagination", "answer": "<p><code>OFFSET n<\/code> makes the database scan and discard n rows, so page 10,000 is slow and cost grows linearly with depth. Worse, with concurrent inserts, rows shift between pages so users see duplicates or gaps.<\/p><p>Use <strong>keyset (seek) pagination<\/strong>: <code>WHERE (created_at, id) &lt; (:lastCreatedAt, :lastId) ORDER BY created_at DESC, id DESC LIMIT 20<\/code>, with a matching composite index. Constant cost at any depth and stable under concurrent writes. The trade-off is no random access to &quot;page 500&quot;, which is almost never a real requirement - infinite scroll and &quot;next&quot; links fit naturally.<\/p><p>Also avoid <code>COUNT(*)<\/code> on every page request; use an estimated count or <code>Slice<\/code> instead of <code>Page<\/code> in Spring Data.<\/p>", "source": "answers.md", "search": "how do you paginate efficiently over millions of rows? why does offset degrade? offset n makes the database scan and discard n rows, so page 10,000 is slow and cost grows linearly with depth. worse, with concurrent inserts, rows shift between pages so users see duplicates or gaps. use keyset (seek) pagination : where (created_at, id) < (:lastcreatedat, :lastid) order by created_at desc, id desc limit 20, with a matching composite index. constant cost at any depth and stable under concurrent writes. the trade-off is no random access to \"page 500\", which is almost never a real requirement - infinite scroll and \"next\" links fit naturally. also avoid count( ) on every page request; use an estimated count or slice instead of page in spring data."}, {"n": 170, "category": 9, "difficulty": "D", "html": "Database indexing: composite index column order, covering indexes, and why an index can be ignored.", "answerTitle": "Indexing", "answer": "<p>Composite index column order follows the <strong>leftmost prefix rule<\/strong>: an index on <code>(a, b, c)<\/code> serves predicates on <code>a<\/code>, <code>a,b<\/code>, and <code>a,b,c<\/code> - not on <code>b<\/code> alone. Order by equality predicates first, then range, then the sort column. A <strong>covering index<\/strong> includes every column the query touches (via <code>INCLUDE<\/code> in Postgres) so the plan is index-only, skipping the heap fetch.<\/p><p>Reasons an index is ignored: a function or implicit cast on the indexed column (<code>WHERE lower(email) = ?<\/code> needs a functional index), leading wildcard <code>LIKE &#x27;%x&#x27;<\/code>, low selectivity where a sequential scan is genuinely cheaper, stale statistics, or type mismatch between parameter and column. Also remember every index slows writes and consumes memory, so unused indexes should be dropped - <code>pg_stat_user_indexes<\/code> tells you which.<\/p>", "source": "answers.md", "search": "database indexing: composite index column order, covering indexes, and why an index can be ignored. composite index column order follows the leftmost prefix rule : an index on (a, b, c) serves predicates on a, a,b, and a,b,c - not on b alone. order by equality predicates first, then range, then the sort column. a covering index includes every column the query touches (via include in postgres) so the plan is index-only, skipping the heap fetch. reasons an index is ignored: a function or implicit cast on the indexed column (where lower(email) = ? needs a functional index), leading wildcard like '%x', low selectivity where a sequential scan is genuinely cheaper, stale statistics, or type mismatch between parameter and column. also remember every index slows writes and consumes memory, so unused indexes should be dropped - pg_stat_user_indexes tells you which."}, {"n": 171, "category": 9, "difficulty": "D", "html": "How do you read an execution plan and act on it?", "answerTitle": "Execution plans", "answer": "<p><code>EXPLAIN (ANALYZE, BUFFERS)<\/code> in Postgres gives estimated <em>and<\/em> actual rows plus IO. What I look at: a large divergence between estimated and actual rows (stale statistics or a correlation the planner cannot see), sequential scans on large tables in a selective query, nested loops with a high inner row count, sorts spilling to disk (<code>external merge Disk:<\/code>), and high <code>shared read<\/code> versus <code>shared hit<\/code> indicating cache misses.<\/p><p>Actions in order: fix the query shape, add or reorder an index, <code>ANALYZE<\/code> to refresh statistics, increase <code>work_mem<\/code> for a sort, or restructure into a materialized view if the aggregate is genuinely expensive and slightly stale data is acceptable.<\/p>", "source": "answers.md", "search": "how do you read an execution plan and act on it? explain (analyze, buffers) in postgres gives estimated and actual rows plus io. what i look at: a large divergence between estimated and actual rows (stale statistics or a correlation the planner cannot see), sequential scans on large tables in a selective query, nested loops with a high inner row count, sorts spilling to disk (external merge disk:), and high shared read versus shared hit indicating cache misses. actions in order: fix the query shape, add or reorder an index, analyze to refresh statistics, increase work_mem for a sort, or restructure into a materialized view if the aggregate is genuinely expensive and slightly stale data is acceptable."}, {"n": 172, "category": 9, "difficulty": "D", "html": "Connection pooling with HikariCP: how do you size the pool, and why is bigger not better?", "answerTitle": "HikariCP sizing", "answer": "<p>The pool is a concurrency limit, not a performance dial. A larger pool means more concurrent queries competing for the same finite CPUs and disks, and past the saturation point throughput flattens while latency rises - plus you risk exhausting the database&#x27;s own <code>max_connections<\/code> across all instances.<\/p><p>HikariCP&#x27;s own guidance: <code>connections = ((core_count × 2) + effective_spindle_count)<\/code> as a starting point, which for a typical cloud database lands around 10-20 per instance. Then multiply by instance count and check it against the database limit, reserving headroom for admin connections and using a proxy such as RDS Proxy or PgBouncer when you have many instances or Lambda.<\/p><p>Set <code>connectionTimeout<\/code> (fail fast rather than pile up), <code>maxLifetime<\/code> shorter than any database or load-balancer idle timeout, <code>leakDetectionThreshold<\/code> in non-production, and alert on <code>hikaricp_connections_pending<\/code> - queueing there is the single best early warning of database trouble.<\/p>", "source": "answers.md", "search": "connection pooling with hikaricp: how do you size the pool, and why is bigger not better? the pool is a concurrency limit, not a performance dial. a larger pool means more concurrent queries competing for the same finite cpus and disks, and past the saturation point throughput flattens while latency rises - plus you risk exhausting the database's own max_connections across all instances. hikaricp's own guidance: connections = ((core_count × 2) + effective_spindle_count) as a starting point, which for a typical cloud database lands around 10-20 per instance. then multiply by instance count and check it against the database limit, reserving headroom for admin connections and using a proxy such as rds proxy or pgbouncer when you have many instances or lambda. set connectiontimeout (fail fast rather than pile up), maxlifetime shorter than any database or load-balancer idle timeout, leakdetectionthreshold in non-production, and alert on hikaricp_connections_pending - queueing there is the single best early warning of database trouble."}, {"n": 173, "category": 9, "difficulty": "A", "html": "SQL versus NoSQL for a given workload - walk through your decision process.", "answerTitle": "SQL versus NoSQL", "answer": "<p>I start from access patterns, not from the data. Questions: what are the top five queries by volume; do we need multi-entity transactions; is the schema stable or genuinely heterogeneous; what is the read/write ratio and the growth curve; what consistency does the business actually require?<\/p><p>Relational is my default because ACID transactions, joins, ad-hoc querying and mature tooling cover most business systems, and Postgres handles JSON, full text and even vectors well enough to defer a second store. I reach for NoSQL when there is a specific, dominant pattern: key-value lookups at extreme scale and predictable single-digit-millisecond latency (DynamoDB), document storage where the aggregate is always read whole, time-series or append-only event data, or a graph traversal that is genuinely recursive.<\/p><p>The failure mode I have seen most often is choosing a document store for relational data and then reimplementing joins in application code - so I ask &quot;what query becomes impossible if we choose this?&quot; before committing.<\/p>", "source": "answers.md", "search": "sql versus nosql for a given workload - walk through your decision process. i start from access patterns, not from the data. questions: what are the top five queries by volume; do we need multi-entity transactions; is the schema stable or genuinely heterogeneous; what is the read/write ratio and the growth curve; what consistency does the business actually require? relational is my default because acid transactions, joins, ad-hoc querying and mature tooling cover most business systems, and postgres handles json, full text and even vectors well enough to defer a second store. i reach for nosql when there is a specific, dominant pattern: key-value lookups at extreme scale and predictable single-digit-millisecond latency (dynamodb), document storage where the aggregate is always read whole, time-series or append-only event data, or a graph traversal that is genuinely recursive. the failure mode i have seen most often is choosing a document store for relational data and then reimplementing joins in application code - so i ask \"what query becomes impossible if we choose this?\" before committing."}, {"n": 174, "category": 9, "difficulty": "D", "html": "Database migrations with Flyway or Liquibase in a zero-downtime deployment. What are the rules?", "answerTitle": "Zero-downtime migrations", "answer": "<p>Rules, all following from the fact that old and new code run simultaneously during a rollout:<\/p><ol><li><strong>Expand and contract.<\/strong> Add the new column nullable, backfill in batches, dual-write from the application, switch reads, then drop the old column in a later release.<\/li><li><strong>Never<\/strong> rename or drop in the same deployment that changes the code.<\/li><li>Additive only within a deployment; destructive changes only after the previous version is fully retired.<\/li><li>Migrations must be backward compatible with the previous application version, because rollback must remain possible.<\/li><li>Avoid long-running locks: create indexes <code>CONCURRENTLY<\/code>, add constraints as <code>NOT VALID<\/code> then validate separately, batch backfills with a bounded transaction size and a sleep between batches.<\/li><li>Set a <code>lock_timeout<\/code> on migrations so a blocked DDL fails instead of queuing every query behind it.<\/li><\/ol><p>Flyway with versioned, immutable, checksum-verified scripts run as a separate pipeline step or init container - not on application startup in a multi-instance deployment, where several instances race (or use Flyway&#x27;s lock and accept the startup delay).<\/p>", "source": "answers.md", "search": "database migrations with flyway or liquibase in a zero-downtime deployment. what are the rules? rules, all following from the fact that old and new code run simultaneously during a rollout: 1. expand and contract. add the new column nullable, backfill in batches, dual-write from the application, switch reads, then drop the old column in a later release. 2. never rename or drop in the same deployment that changes the code. 3. additive only within a deployment; destructive changes only after the previous version is fully retired. 4. migrations must be backward compatible with the previous application version, because rollback must remain possible. 5. avoid long-running locks: create indexes concurrently, add constraints as not valid then validate separately, batch backfills with a bounded transaction size and a sleep between batches. 6. set a lock_timeout on migrations so a blocked ddl fails instead of queuing every query behind it. flyway with versioned, immutable, checksum-verified scripts run as a separate pipeline step or init container - not on application startup in a multi-instance deployment, where several instances race (or use flyway's lock and accept the startup delay)."}, {"n": 175, "category": 9, "difficulty": "A", "html": "How do you change a column type on a 500 million row table with no downtime?", "answerTitle": "Changing a column type on 500M rows", "answer": "<p>Never <code>ALTER TABLE ... ALTER COLUMN TYPE<\/code> directly - it rewrites the whole table under an exclusive lock.<\/p><p>The expand-contract shadow-column approach:<\/p><ol><li>Add <code>amount_new<\/code> of the target type, nullable, with a low-lock <code>ALTER<\/code> (adding a nullable column without a default is metadata-only in modern Postgres).<\/li><li>Deploy application code that <strong>dual-writes<\/strong> both columns, reading from the old one.<\/li><li>Backfill in batches - 10,000 rows per transaction, keyed on the primary key, throttled and monitored for replication lag, resumable via a progress table.<\/li><li>Add a constraint or trigger to guarantee consistency, and run a verification query comparing the two columns.<\/li><li>Deploy code that reads from <code>amount_new<\/code> while still writing both. Bake for a release.<\/li><li>Stop writing the old column; drop it in a later release, then rename if cosmetics matter (a rename is also a separate expand-contract cycle, or just live with the name).<\/li><\/ol><p>Throughout: feature-flag the read switch so rollback is instant, run the backfill off-peak, and rehearse the entire sequence on a production-sized copy first. If a rewrite is unavoidable, consider a logical-replication cut-over to a new table instead.<\/p><blockquote><p><em>Hook: a large-table type migration executed with zero downtime, quoting the row count and the backfill duration.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you change a column type on a 500 million row table with no downtime? never alter table ... alter column type directly - it rewrites the whole table under an exclusive lock. the expand-contract shadow-column approach: 1. add amount_new of the target type, nullable, with a low-lock alter (adding a nullable column without a default is metadata-only in modern postgres). 2. deploy application code that dual-writes both columns, reading from the old one. 3. backfill in batches - 10,000 rows per transaction, keyed on the primary key, throttled and monitored for replication lag, resumable via a progress table. 4. add a constraint or trigger to guarantee consistency, and run a verification query comparing the two columns. 5. deploy code that reads from amount_new while still writing both. bake for a release. 6. stop writing the old column; drop it in a later release, then rename if cosmetics matter (a rename is also a separate expand-contract cycle, or just live with the name). throughout: feature-flag the read switch so rollback is instant, run the backfill off-peak, and rehearse the entire sequence on a production-sized copy first. if a rewrite is unavoidable, consider a logical-replication cut-over to a new table instead. hook: a large-table type migration executed with zero downtime, quoting the row count and the backfill duration."}, {"n": 176, "category": 10, "difficulty": "A", "html": "How do you decide microservice boundaries? What signals tell you a boundary is wrong?", "answerTitle": "Service boundaries", "answer": "<p>I derive boundaries from bounded contexts and from the <em>rate and reason of change<\/em>, not from nouns or from team structure alone (though Conway&#x27;s Law means team structure will win if I ignore it, so I align them deliberately).<\/p><p>Signals a boundary is wrong: two services always deploy together; a change to one feature touches three repositories; services share a database or a table; chatty synchronous call chains where one request fans out through four hops; a service that is only ever called by one other service; distributed transactions appearing in the design; and a shared &quot;common&quot; library that every service must upgrade in lockstep.<\/p><p>My practical approach is to start with a modular monolith with enforced module boundaries (ArchUnit, package-private APIs), let the seams prove themselves under real change, and extract a service only when there is a concrete driver: independent scaling, independent deployment cadence, different reliability requirement, or team autonomy.<\/p>", "source": "answers.md", "search": "how do you decide microservice boundaries? what signals tell you a boundary is wrong? i derive boundaries from bounded contexts and from the rate and reason of change , not from nouns or from team structure alone (though conway's law means team structure will win if i ignore it, so i align them deliberately). signals a boundary is wrong: two services always deploy together; a change to one feature touches three repositories; services share a database or a table; chatty synchronous call chains where one request fans out through four hops; a service that is only ever called by one other service; distributed transactions appearing in the design; and a shared \"common\" library that every service must upgrade in lockstep. my practical approach is to start with a modular monolith with enforced module boundaries (archunit, package-private apis), let the seams prove themselves under real change, and extract a service only when there is a concrete driver: independent scaling, independent deployment cadence, different reliability requirement, or team autonomy."}, {"n": 177, "category": 10, "difficulty": "A", "html": "Monolith versus microservices in 2026 - when do you recommend staying monolithic?", "answerTitle": "Monolith versus microservices in 2026", "answer": "<p>I recommend staying monolithic when the team is under roughly 20-30 engineers, the domain is not yet stable, deployment frequency is not the bottleneck, and the organization lacks the platform maturity - CI/CD, observability, on-call, infrastructure as code - to operate a distributed system.<\/p><p>The costs people underestimate: every in-process call becomes a network call that can fail, be slow, or be duplicated; local transactions become sagas; debugging requires distributed tracing; testing requires contract tests; and the operational surface multiplies. You trade a code-complexity problem for an operations-complexity problem, and only the second one wakes you at 3am.<\/p><p>What I actually advocate is a modular monolith with clean internal boundaries and an independent deployment path, extracting services where there is a measured need. That preserves the option value without payi
