de> state and the lock address they wait on, then find the owner (&quot;locked &lt;0x...&gt;&quot;); repeated identical stacks across dumps (stuck); many threads in the same downstream call (a slow dependency); the pool queue depth implied by idle versus busy worker counts; and GC threads or the finalizer thread being busy.<\/p><p>Correlate with CPU: <code>top -H -p &lt;pid&gt;<\/code>, convert the offending thread ID to hex, and find it in the dump by <code>nid=<\/code>.<\/p>", "source": "answers.md", "search": "how do you read a thread dump? what are you looking for first? take three dumps, ten seconds apart, so you can distinguish a stuck thread from a busy one. look for, in order: the jvm's own deadlock report at the bottom; threads in blocked state and the lock address they wait on, then find the owner (\"locked <0x... \"); repeated identical stacks across dumps (stuck); many threads in the same downstream call (a slow dependency); the pool queue depth implied by idle versus busy worker counts; and gc threads or the finalizer thread being busy. correlate with cpu: top -h -p <pid , convert the offending thread id to hex, and find it in the dump by nid=."}, {"n": 101, "category": 5, "difficulty": "D", "html": "Key JVM flags you actually set in production and why.", "answerTitle": "Production JVM flags", "answer": "<p><code>-XX:MaxRAMPercentage=70<\/code> (container-aware sizing instead of a fixed <code>-Xmx<\/code>), <code>-XX:+UseG1GC<\/code> or <code>-XX:+UseZGC -XX:+ZGenerational<\/code>, <code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps<\/code>, <code>-XX:+ExitOnOutOfMemoryError<\/code> for containers so the orchestrator restarts a poisoned process, GC logging with rotation (<code>-Xlog:gc*:file=...:time,uptime:filecount=5,filesize=20M<\/code>), <code>-XX:NativeMemoryTracking=summary<\/code>, JFR enabled with a low-overhead profile, and <code>-XX:+UseStringDeduplication<\/code> when string-heavy.<\/p><p>Equally important: setting <code>-Xms<\/code> equal to <code>-Xmx<\/code> in containers to avoid heap resizing pauses.<\/p>", "source": "answers.md", "search": "key jvm flags you actually set in production and why. -xx:maxrampercentage=70 (container-aware sizing instead of a fixed -xmx), -xx:+useg1gc or -xx:+usezgc -xx:+zgenerational, -xx:+heapdumponoutofmemoryerror -xx:heapdumppath=/dumps, -xx:+exitonoutofmemoryerror for containers so the orchestrator restarts a poisoned process, gc logging with rotation (-xlog:gc :file=...:time,uptime:filecount=5,filesize=20m), -xx:nativememorytracking=summary, jfr enabled with a low-overhead profile, and -xx:+usestringdeduplication when string-heavy. equally important: setting -xms equal to -xmx in containers to avoid heap resizing pauses."}, {"n": 102, "category": 5, "difficulty": "A", "html": "A service has p50 of 20ms and p99 of 3s. How do you find the cause?", "answerTitle": "p50 20ms, p99 3s", "answer": "<p>The gap means something intermittent, not something slow. My checklist:<\/p><ol><li><strong>GC pauses<\/strong> - correlate p99 spikes with GC logs. A 3s pause suggests full GC or evacuation failure.<\/li><li><strong>Lock contention or pool queueing<\/strong> - queueing time is the classic bimodal signature; measure time-in-queue separately from time-in-service.<\/li><li><strong>Connection pool exhaustion<\/strong> - HikariPool wait time, HTTP client pool saturation.<\/li><li><strong>A slow dependency&#x27;s own tail<\/strong>, amplified because one request fans out to N calls (tail amplification: with N=10, p99 of a dependency becomes roughly p90 of your request).<\/li><li><strong>Cold paths<\/strong> - cache misses, JIT deoptimization, DNS lookups, TLS handshakes, lazy initialization.<\/li><li><strong>Noisy neighbours / CPU throttling<\/strong> - in Kubernetes, <code>container_cpu_cfs_throttled_seconds<\/code> is the first metric I check.<\/li><\/ol><p>I would attach distributed tracing filtered to slow traces, and compare the span breakdown of a p99 trace against a p50 trace. That usually answers it in one look.<\/p>", "source": "answers.md", "search": "a service has p50 of 20ms and p99 of 3s. how do you find the cause? the gap means something intermittent, not something slow. my checklist: 1. gc pauses - correlate p99 spikes with gc logs. a 3s pause suggests full gc or evacuation failure. 2. lock contention or pool queueing - queueing time is the classic bimodal signature; measure time-in-queue separately from time-in-service. 3. connection pool exhaustion - hikaripool wait time, http client pool saturation. 4. a slow dependency's own tail , amplified because one request fans out to n calls (tail amplification: with n=10, p99 of a dependency becomes roughly p90 of your request). 5. cold paths - cache misses, jit deoptimization, dns lookups, tls handshakes, lazy initialization. 6. noisy neighbours / cpu throttling - in kubernetes, container_cpu_cfs_throttled_seconds is the first metric i check. i would attach distributed tracing filtered to slow traces, and compare the span breakdown of a p99 trace against a p50 trace. that usually answers it in one look."}, {"n": 103, "category": 5, "difficulty": "D", "html": "Walk through a <code>-Xlog:gc*<\/code> log. What do you read off it, and what do &quot;to-space exhausted&quot; and &quot;Humongous&quot; lines tell you?", "answerTitle": "Reading a GC log", "answer": "<p>With <code>-Xlog:gc*:file=gc.log:time,uptime,level,tags<\/code> a G1 young collection prints roughly:<\/p><pre><code class=\"lang-text\">[2026-08-14T10:22:31.104+0000][412.882s] GC(918) Pause Young (Normal) (G1 Evacuation Pause)\n[2026-08-14T10:22:31.104+0000][412.882s] GC(918)   Eden regions: 512-&gt;0(498)\n[2026-08-14T10:22:31.104+0000][412.882s] GC(918)   Survivor regions: 14-&gt;28(66)\n[2026-08-14T10:22:31.104+0000][412.882s] GC(918)   Old regions: 1204-&gt;1211\n[2026-08-14T10:22:31.104+0000][412.882s] GC(918)   Humongous regions: 6-&gt;6\n[2026-08-14T10:22:31.104+0000][412.882s] GC(918) 10944M-&gt;9772M(16384M) 38.412ms<\/code><\/pre><p>The four numbers I actually derive, none of which are printed directly:<\/p><ul><li><strong>Allocation rate<\/strong>: Eden emptied (512 regions × region size) divided by the gap to the previous GC. This is the single best predictor of GC cost, because collection frequency is allocation rate divided by Eden size.<\/li><li><strong>Promotion rate<\/strong>: the growth in old regions per collection. High promotion means objects are surviving that should have died - usually an under-sized survivor space causing premature promotion, or genuinely long-lived request state.<\/li><li><strong>The post-GC floor<\/strong>: old occupancy immediately <em>after<\/em> a full or concurrent cycle. A rising floor across days is a leak. A flat floor with rising frequency is an allocation-rate problem, and the fix is completely different.<\/li><li><strong>Pause distribution<\/strong>, not the mean. <code>Pause Young (Normal)<\/code> at tens of milliseconds is healthy; the tail is what shows in p99.<\/li><\/ul><p>Lines that are diagnoses in themselves:<\/p><ul><li><strong><code>to-space exhausted<\/code><\/strong> - G1 had nowhere to evacuate survivors and degraded to a full GC, typically a multi-second pause. Cause is a sudden allocation spike or too little headroom; fix by lowering <code>InitiatingHeapOccupancyPercent<\/code> so concurrent marking starts earlier, raising <code>G1ReservePercent<\/code>, or adding heap.<\/li><li><strong><code>Humongous<\/code><\/strong> regions growing - allocations larger than half a region, which bypass Eden and go straight to old, fragmenting it. Usually a large byte array or a big collection resized in one go. Raise <code>G1HeapRegionSize<\/code> or, better, stop allocating the object.<\/li><li><strong><code>Pause Full (G1 Compaction Pause)<\/code><\/strong> - in G1 this is a failure mode, not routine. Every one of them deserves an explanation.<\/li><li><strong><code>Pause Young (Concurrent Start)<\/code><\/strong> followed much later by <code>Pause Remark<\/code> - a marking cycle; if these run back to back the JVM is barely keeping up.<\/li><\/ul><p>For anything beyond a glance I load the log into GCeasy or GCViewer rather than reading it by eye, because the useful views are the derived rates over time, not individual lines.<\/p>", "source": "answers.md", "search": "walk through a -xlog:gc log. what do you read off it, and what do \"to-space exhausted\" and \"humongous\" lines tell you? with -xlog:gc :file=gc.log:time,uptime,level,tags a g1 young collection prints roughly: text [2026-08-14t10:22:31.104+0000][412.882s] gc(918) pause young (normal) (g1 evacuation pause) [2026-08-14t10:22:31.104+0000][412.882s] gc(918) eden regions: 512- 0(498) [2026-08-14t10:22:31.104+0000][412.882s] gc(918) survivor regions: 14- 28(66) [2026-08-14t10:22:31.104+0000][412.882s] gc(918) old regions: 1204- 1211 [2026-08-14t10:22:31.104+0000][412.882s] gc(918) humongous regions: 6- 6 [2026-08-14t10:22:31.104+0000][412.882s] gc(918) 10944m- 9772m(16384m) 38.412ms the four numbers i actually derive, none of which are printed directly: - allocation rate : eden emptied (512 regions × region size) divided by the gap to the previous gc. this is the single best predictor of gc cost, because collection frequency is allocation rate divided by eden size. - promotion rate : the growth in old regions per collection. high promotion means objects are surviving that should have died - usually an under-sized survivor space causing premature promotion, or genuinely long-lived request state. - the post-gc floor : old occupancy immediately after a full or concurrent cycle. a rising floor across days is a leak. a flat floor with rising frequency is an allocation-rate problem, and the fix is completely different. - pause distribution , not the mean. pause young (normal) at tens of milliseconds is healthy; the tail is what shows in p99. lines that are diagnoses in themselves: - to-space exhausted - g1 had nowhere to evacuate survivors and degraded to a full gc, typically a multi-second pause. cause is a sudden allocation spike or too little headroom; fix by lowering initiatingheapoccupancypercent so concurrent marking starts earlier, raising g1reservepercent, or adding heap. - humongous regions growing - allocations larger than half a region, which bypass eden and go straight to old, fragmenting it. usually a large byte array or a big collection resized in one go. raise g1heapregionsize or, better, stop allocating the object. - pause full (g1 compaction pause) - in g1 this is a failure mode, not routine. every one of them deserves an explanation. - pause young (concurrent start) followed much later by pause remark - a marking cycle; if these run back to back the jvm is barely keeping up. for anything beyond a glance i load the log into gceasy or gcviewer rather than reading it by eye, because the useful views are the derived rates over time, not individual lines."}, {"n": 104, "category": 5, "difficulty": "T", "html": "Why can a 32GB heap hold <em>less<\/em> live data than a 31GB heap?", "answerTitle": "The 32GB compressed oops cliff", "answer": "<p>On 64-bit JVMs, references are stored as 32-bit offsets scaled by the 8-byte object alignment, giving a 32GB addressable range - &quot;compressed ordinary object pointers&quot;. Every reference field, and every array-of-object slot, costs 4 bytes instead of 8, and object headers are smaller.<\/p><p>Cross 32GB and the JVM silently disables the optimization. References double in width, so a reference-dense heap loses roughly 20 percent of its capacity to pointer overhead, plus cache lines now hold half as many references, which costs throughput too. A 32GB heap therefore holds <em>less<\/em> live data than a 31GB one - the extra gigabyte buys nothing and the encoding change takes several away.<\/p><p>The rule: stay at or below about 31GB (<code>-Xmx31g<\/code>), or jump well past 40-48GB where the raw capacity finally exceeds what compressed oops gave you. Verify with <code>java -Xmx32g -XX:+PrintFlagsFinal -version | grep UseCompressedOops<\/code> rather than trusting the threshold, because the exact cliff depends on <code>ObjectAlignmentInBytes<\/code> and where the heap base lands.<\/p><p>Two footnotes worth having: raising <code>ObjectAlignmentInBytes<\/code> to 16 extends the range to 64GB but wastes alignment padding on every object, so it rarely pays; and this only applies to collectors that use compressed oops at all - ZGC uses colored pointers and never compresses, so the cliff does not exist there.<\/p><p>In practice the better answer at that size is usually several smaller JVMs rather than one large one, which also caps GC pause cost.<\/p>", "source": "answers.md", "search": "why can a 32gb heap hold less live data than a 31gb heap? on 64-bit jvms, references are stored as 32-bit offsets scaled by the 8-byte object alignment, giving a 32gb addressable range - \"compressed ordinary object pointers\". every reference field, and every array-of-object slot, costs 4 bytes instead of 8, and object headers are smaller. cross 32gb and the jvm silently disables the optimization. references double in width, so a reference-dense heap loses roughly 20 percent of its capacity to pointer overhead, plus cache lines now hold half as many references, which costs throughput too. a 32gb heap therefore holds less live data than a 31gb one - the extra gigabyte buys nothing and the encoding change takes several away. the rule: stay at or below about 31gb (-xmx31g), or jump well past 40-48gb where the raw capacity finally exceeds what compressed oops gave you. verify with java -xmx32g -xx:+printflagsfinal -version grep usecompressedoops rather than trusting the threshold, because the exact cliff depends on objectalignmentinbytes and where the heap base lands. two footnotes worth having: raising objectalignmentinbytes to 16 extends the range to 64gb but wastes alignment padding on every object, so it rarely pays; and this only applies to collectors that use compressed oops at all - zgc uses colored pointers and never compresses, so the cliff does not exist there. in practice the better answer at that size is usually several smaller jvms rather than one large one, which also caps gc pause cost."}, {"n": 105, "category": 5, "difficulty": "D", "html": "How does a direct byte buffer leak happen, and how do you find one in a Netty-based service?", "answerTitle": "Direct buffer leaks", "answer": "<p>A <code>ByteBuffer.allocateDirect<\/code> allocation lives outside the heap; the on-heap <code>DirectByteBuffer<\/code> object is only a handle, and the native memory is released when <em>that handle<\/em> is collected and its <code>Cleaner<\/code> runs. So the failure mode is: the heap is nowhere near full, nothing triggers a GC, the handles stay alive, and native memory grows until the container is killed or you get <code>OutOfMemoryError: Direct buffer memory<\/code>.<\/p><p>Three distinct causes, with different fixes:<\/p><ol><li><strong>No GC pressure.<\/strong> Handles are cheap, so nothing forces the collection that would free the native memory. Setting <code>-XX:MaxDirectMemorySize<\/code> explicitly is what makes this survivable - it caps the pool and forces a <code>System.gc()<\/code> attempt plus a clean <code>OutOfMemoryError<\/code> instead of an OOM-kill.<\/li><li><strong>Genuine retention.<\/strong> Buffers held in a cache, a queue that never drains, or a connection object that is never closed. This is an ordinary heap-reachability problem and MAT finds it by retained size on <code>DirectByteBuffer<\/code>.<\/li><li><strong>Netty reference counting.<\/strong> Netty&#x27;s pooled <code>ByteBuf<\/code> is not GC-managed at all - it is refcounted, and a handler that returns early without <code>release()<\/code>, or that fails to call <code>ReferenceCountUtil.release<\/code> on a message it does not pass along, leaks pooled arenas.<\/li><\/ol><p>For the Netty case the tooling is specific: run with <code>-Dio.netty.leakDetection.level=paranoid<\/code> in a load test (it samples every buffer and prints the stack of the <em>last access<\/em> to a leaked one, which names the handler directly), watch <code>PooledByteBufAllocator.metric()<\/code> arena counters, and remember <code>SimpleChannelInboundHandler<\/code> releases for you while a raw <code>ChannelInboundHandlerAdapter<\/code> does not - that asymmetry is the most common source.<\/p><p>Confirming it is direct memory at all: <code>-XX:NativeMemoryTracking=detail<\/code> plus <code>jcmd &lt;pid&gt; VM.native_memory summary.diff<\/code> shows the Internal/Other category growing while heap is flat; <code>BufferPoolMXBean<\/code> (exposed by Micrometer as <code>jvm.buffer.memory.used<\/code>) gives the same number as a metric, which is what I would alert on.<\/p>", "source": "answers.md", "search": "how does a direct byte buffer leak happen, and how do you find one in a netty-based service? a bytebuffer.allocatedirect allocation lives outside the heap; the on-heap directbytebuffer object is only a handle, and the native memory is released when that handle is collected and its cleaner runs. so the failure mode is: the heap is nowhere near full, nothing triggers a gc, the handles stay alive, and native memory grows until the container is killed or you get outofmemoryerror: direct buffer memory. three distinct causes, with different fixes: 1. no gc pressure. handles are cheap, so nothing forces the collection that would free the native memory. setting -xx:maxdirectmemorysize explicitly is what makes this survivable - it caps the pool and forces a system.gc() attempt plus a clean outofmemoryerror instead of an oom-kill. 2. genuine retention. buffers held in a cache, a queue that never drains, or a connection object that is never closed. this is an ordinary heap-reachability problem and mat finds it by retained size on directbytebuffer. 3. netty reference counting. netty's pooled bytebuf is not gc-managed at all - it is refcounted, and a handler that returns early without release(), or that fails to call referencecountutil.release on a message it does not pass along, leaks pooled arenas. for the netty case the tooling is specific: run with -dio.netty.leakdetection.level=paranoid in a load test (it samples every buffer and prints the stack of the last access to a leaked one, which names the handler directly), watch pooledbytebufallocator.metric() arena counters, and remember simplechannelinboundhandler releases for you while a raw channelinboundhandleradapter does not - that asymmetry is the most common source. confirming it is direct memory at all: -xx:nativememorytracking=detail plus jcmd <pid vm.native_memory summary.diff shows the internal/other category growing while heap is flat; bufferpoolmxbean (exposed by micrometer as jvm.buffer.memory.used) gives the same number as a metric, which is what i would alert on."}, {"n": 106, "category": 5, "difficulty": "D", "html": "How do you prove a metaspace problem is a classloader leak rather than an under-sized metaspace?", "answerTitle": "Proving a classloader leak", "answer": "<p><code>OutOfMemoryError: Metaspace<\/code> has two very different causes, and raising <code>MaxMetaspaceSize<\/code> fixes one and delays the other by a day.<\/p><p>The distinguishing question is whether the <em>class count<\/em> is stable. An application that legitimately loads 40,000 classes needs more metaspace once. An application that leaks loads the same classes repeatedly under new classloaders that can never be unloaded, so the count climbs forever.<\/p><p>How I prove it:<\/p><ol><li><code>jcmd &lt;pid&gt; VM.metaspace summary<\/code> for the total, then take the class count from <code>jcmd &lt;pid&gt; GC.class_stats<\/code> or the <code>jvm.classes.loaded<\/code> metric over hours. Loaded climbing while unloaded stays flat is the signature.<\/li><li><code>jcmd &lt;pid&gt; VM.classloader_stats<\/code> (or <code>VM.classloaders<\/code>) lists every loader with its class count. Many instances of the <em>same<\/em> loader class is the leak, visible in one command.<\/li><li>Heap dump into MAT, then the &quot;Duplicate Classes&quot; view, and for the retention path: find the <code>ClassLoader<\/code> instances, take the shortest path to a GC root. A classloader is kept alive by any single reference to any class it loaded, which is why the usual culprits are so indirect - a <code>ThreadLocal<\/code> on a pooled thread whose value&#x27;s class came from the old loader, a JDBC driver registered in <code>DriverManager<\/code>, a shutdown hook, a <code>java.util.logging<\/code> logger, a static cache keyed by <code>Class<\/code>, or an MBean never deregistered.<\/li><\/ol><p>The common generators: repeated hot redeploy in an application server, dynamic proxy or CGLIB generation per request or per tenant rather than per type, scripting engines and expression compilers, and repeatedly building a Spring context in tests without closing it.<\/p><p>Fixes are cause-specific - cache the generated proxy, deregister on shutdown, <code>remove()<\/code> the <code>ThreadLocal<\/code> - but the standing guard is an alert on <code>jvm.classes.loaded<\/code> trending up over a 24-hour window, which catches the next one before it pages anyone.<\/p>", "source": "answers.md", "search": "how do you prove a metaspace problem is a classloader leak rather than an under-sized metaspace? outofmemoryerror: metaspace has two very different causes, and raising maxmetaspacesize fixes one and delays the other by a day. the distinguishing question is whether the class count is stable. an application that legitimately loads 40,000 classes needs more metaspace once. an application that leaks loads the same classes repeatedly under new classloaders that can never be unloaded, so the count climbs forever. how i prove it: 1. jcmd <pid vm.metaspace summary for the total, then take the class count from jcmd <pid gc.class_stats or the jvm.classes.loaded metric over hours. loaded climbing while unloaded stays flat is the signature. 2. jcmd <pid vm.classloader_stats (or vm.classloaders) lists every loader with its class count. many instances of the same loader class is the leak, visible in one command. 3. heap dump into mat, then the \"duplicate classes\" view, and for the retention path: find the classloader instances, take the shortest path to a gc root. a classloader is kept alive by any single reference to any class it loaded, which is why the usual culprits are so indirect - a threadlocal on a pooled thread whose value's class came from the old loader, a jdbc driver registered in drivermanager, a shutdown hook, a java.util.logging logger, a static cache keyed by class, or an mbean never deregistered. the common generators: repeated hot redeploy in an application server, dynamic proxy or cglib generation per request or per tenant rather than per type, scripting engines and expression compilers, and repeatedly building a spring context in tests without closing it. fixes are cause-specific - cache the generated proxy, deregister on shutdown, remove() the threadlocal - but the standing guard is an alert on jvm.classes.loaded trending up over a 24-hour window, which catches the next one before it pages anyone."}, {"n": 107, "category": 5, "difficulty": "A", "html": "A container was OOMKilled. How do you get a heap dump out of a process the kernel already killed?", "answerTitle": "Getting a dump out of an OOMKilled container", "answer": "<p>The hard constraint: an OOM-kill is <code>SIGKILL<\/code> from the kernel. The JVM gets no chance to run anything, so <code>-XX:+HeapDumpOnOutOfMemoryError<\/code> produces nothing - that flag only fires on a <em>Java<\/em> <code>OutOfMemoryError<\/code>, which is a different event. Anyone who says &quot;we have HeapDumpOnOutOfMemoryError set&quot; has not distinguished the two.<\/p><p>So the work is done in advance:<\/p><ol><li><strong>Write dumps to a volume that outlives the container.<\/strong> <code>-XX:HeapDumpPath=/dumps<\/code> on an <code>emptyDir<\/code> is still lost when the pod is deleted; a PVC, or a sidecar that uploads to S3 when a file appears, is what actually survives. Filenames must include the pod name and timestamp, or a crash loop overwrites the useful one.<\/li><li><strong>Add <code>-XX:+ExitOnOutOfMemoryError<\/code><\/strong> so a Java OOM kills the process immediately rather than limping along - a JVM thrashing in GC after an OOM produces misleading dumps and stays &quot;ready&quot; to the load balancer.<\/li><li><strong>Give the JVM room to lose.<\/strong> Set <code>-XX:MaxRAMPercentage<\/code> around 70 so a heap OOM (recoverable, dumpable) happens before the container limit (not recoverable). This is the single change that converts most OOM-kills into diagnosable events.<\/li><\/ol><p>To get evidence from the kill that already happened:<\/p><ul><li><code>kubectl describe pod<\/code> for <code>Last State: Terminated, Reason: OOMKilled, Exit Code: 137<\/code> and, on the node, <code>dmesg<\/code> for the kernel&#x27;s OOM report with the actual RSS at kill time.<\/li><li><code>kubectl logs --previous<\/code> for the dead container&#x27;s output.<\/li><li><code>container_memory_working_set_bytes<\/code> against the limit in the minutes before the kill, plotted alongside JVM heap used - the gap between them <em>is<\/em> the answer, and it points at native memory rather than the heap.<\/li><\/ul><p>To get a dump before the <em>next<\/em> one: <code>jcmd &lt;pid&gt; GC.heap_dump /dumps/heap.hprof<\/code> from an ephemeral debug container (<code>kubectl debug -it &lt;pod&gt; --target=&lt;container&gt;<\/code>, which shares the process namespace), or scripted from a sidecar when working-set memory crosses a threshold. If the pod is still alive but wedged, <code>kubectl cp<\/code> the file out before anything restarts it - and be aware a dump of a 12GB heap is a 12GB file, so it needs the disk space and it will pause the JVM while it is written.<\/p><p>Standing prevention: NMT enabled, JFR always-on with a rolling buffer written to the same volume, and a memory-based alert that fires at 85 percent of the limit so a human or an automation captures the dump <em>before<\/em> the kernel makes it impossible.<\/p><blockquote><p><em>Hook: the service that crash-looped nightly until the gap between working-set and heap made it obvious the memory was in direct buffers.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "a container was oomkilled. how do you get a heap dump out of a process the kernel already killed? the hard constraint: an oom-kill is sigkill from the kernel. the jvm gets no chance to run anything, so -xx:+heapdumponoutofmemoryerror produces nothing - that flag only fires on a java outofmemoryerror, which is a different event. anyone who says \"we have heapdumponoutofmemoryerror set\" has not distinguished the two. so the work is done in advance: 1. write dumps to a volume that outlives the container. -xx:heapdumppath=/dumps on an emptydir is still lost when the pod is deleted; a pvc, or a sidecar that uploads to s3 when a file appears, is what actually survives. filenames must include the pod name and timestamp, or a crash loop overwrites the useful one. 2. add -xx:+exitonoutofmemoryerror so a java oom kills the process immediately rather than limping along - a jvm thrashing in gc after an oom produces misleading dumps and stays \"ready\" to the load balancer. 3. give the jvm room to lose. set -xx:maxrampercentage around 70 so a heap oom (recoverable, dumpable) happens before the container limit (not recoverable). this is the single change that converts most oom-kills into diagnosable events. to get evidence from the kill that already happened: - kubectl describe pod for last state: terminated, reason: oomkilled, exit code: 137 and, on the node, dmesg for the kernel's oom report with the actual rss at kill time. - kubectl logs --previous for the dead container's output. - container_memory_working_set_bytes against the limit in the minutes before the kill, plotted alongside jvm heap used - the gap between them is the answer, and it points at native memory rather than the heap. to get a dump before the next one: jcmd <pid gc.heap_dump /dumps/heap.hprof from an ephemeral debug container (kubectl debug -it <pod --target=<container , which shares the process namespace), or scripted from a sidecar when working-set memory crosses a threshold. if the pod is still alive but wedged, kubectl cp the file out before anything restarts it - and be aware a dump of a 12gb heap is a 12gb file, so it needs the disk space and it will pause the jvm while it is written. standing prevention: nmt enabled, jfr always-on with a rolling buffer written to the same volume, and a memory-based alert that fires at 85 percent of the limit so a human or an automation captures the dump before the kernel makes it impossible. hook: the service that crash-looped nightly until the gap between working-set and heap made it obvious the memory was in direct buffers."}, {"n": 108, "category": 5, "difficulty": "T", "html": "Memory climbs and GC runs constantly, but every full GC returns to the same floor. Is this a leak, and what do you fix?", "answerTitle": "Allocation rate versus a leak", "answer": "<p>Not a leak. The defining test is the post-GC floor: if old-generation occupancy immediately after a full or concurrent cycle returns to the same level every time, all that memory is being reclaimed and nothing is retained. A leak has a <em>rising<\/em> floor.<\/p><p>What this pattern actually shows is a high allocation rate: the application produces garbage faster than it produces work, so GC runs constantly, and the cost appears as CPU spent in GC threads and as p99 latency, not as memory growth.<\/p><p>Why the distinction matters for the fix: adding heap genuinely helps here - a bigger Eden means fewer, larger collections and less total overhead - whereas adding heap to a real leak just moves the OOM to next week and makes the eventual full GC longer. Getting this backwards is the most common wasted quarter in performance work.<\/p><p>Finding the source: an allocation flame graph, <code>async-profiler -e alloc<\/code> or the JFR <code>jdk.ObjectAllocationSample<\/code> event, which attributes bytes to a stack. The usual answers are unsurprising once you see them - logging that builds strings at a level that is disabled, a DTO mapped three times on the way through, a query returning 50,000 rows to filter five in Java, boxing in a hot loop, <code>String.format<\/code> on a per-request path, or an oversized JSON payload deserialized in full.<\/p><p>The cheap knobs before touching code: raise the heap so Eden grows, and check survivor sizing, because premature promotion turns a young-generation problem into an old-generation one. But the real fix is nearly always allocating less, and the flame graph usually shows one call path responsible for most of it.<\/p>", "source": "answers.md", "search": "memory climbs and gc runs constantly, but every full gc returns to the same floor. is this a leak, and what do you fix? not a leak. the defining test is the post-gc floor: if old-generation occupancy immediately after a full or concurrent cycle returns to the same level every time, all that memory is being reclaimed and nothing is retained. a leak has a rising floor. what this pattern actually shows is a high allocation rate: the application produces garbage faster than it produces work, so gc runs constantly, and the cost appears as cpu spent in gc threads and as p99 latency, not as memory growth. why the distinction matters for the fix: adding heap genuinely helps here - a bigger eden means fewer, larger collections and less total overhead - whereas adding heap to a real leak just moves the oom to next week and makes the eventual full gc longer. getting this backwards is the most common wasted quarter in performance work. finding the source: an allocation flame graph, async-profiler -e alloc or the jfr jdk.objectallocationsample event, which attributes bytes to a stack. the usual answers are unsurprising once you see them - logging that builds strings at a level that is disabled, a dto mapped three times on the way through, a query returning 50,000 rows to filter five in java, boxing in a hot loop, string.format on a per-request path, or an oversized json payload deserialized in full. the cheap knobs before touching code: raise the heap so eden grows, and check survivor sizing, because premature promotion turns a young-generation problem into an old-generation one. but the real fix is nearly always allocating less, and the flame graph usually shows one call path responsible for most of it."}, {"n": 109, "category": 6, "difficulty": "C", "html": "Explain SOLID with a concrete Java example of a violation and its fix for each principle.", "answerTitle": "SOLID in practice", "answer": "<ul><li><strong>SRP<\/strong>: an <code>OrderService<\/code> that also formats emails and writes CSV changes for three unrelated reasons. Split by <em>reason to change<\/em>, not by &quot;one method per class&quot;.<\/li><li><strong>OCP<\/strong>: a <code>switch<\/code> over payment types recompiled for every new type; replace with a <code>PaymentHandler<\/code> interface and let Spring inject <code>List&lt;PaymentHandler&gt;<\/code>, selecting by <code>supports(type)<\/code>.<\/li><li><strong>LSP<\/strong>: <code>Square extends Rectangle<\/code> breaks callers that set width and height independently. The test is behavioral: can I substitute the subtype without the caller knowing?<\/li><li><strong>ISP<\/strong>: a fat <code>UserService<\/code> interface forcing test doubles to stub ten unused methods; split into role interfaces.<\/li><li><strong>DIP<\/strong>: the service layer importing <code>JdbcTemplate<\/code> directly; depend on a repository interface owned by the domain, implemented in the infrastructure layer.<\/li><\/ul>", "source": "answers.md", "search": "explain solid with a concrete java example of a violation and its fix for each principle. - srp : an orderservice that also formats emails and writes csv changes for three unrelated reasons. split by reason to change , not by \"one method per class\". - ocp : a switch over payment types recompiled for every new type; replace with a paymenthandler interface and let spring inject list<paymenthandler , selecting by supports(type). - lsp : square extends rectangle breaks callers that set width and height independently. the test is behavioral: can i substitute the subtype without the caller knowing? - isp : a fat userservice interface forcing test doubles to stub ten unused methods; split into role interfaces. - dip : the service layer importing jdbctemplate directly; depend on a repository interface owned by the domain, implemented in the infrastructure layer."}, {"n": 110, "category": 6, "difficulty": "D", "html": "Strategy versus Template Method versus State - how do you choose?", "answerTitle": "Strategy versus Template Method versus State", "answer": "<p>Strategy: interchangeable algorithms selected by the client, composed at runtime. Template Method: fixed algorithm skeleton in a base class with subclass hooks - inheritance-based, so more rigid. State: the object&#x27;s behavior changes because <em>its own<\/em> state changed, and states know about transitions.<\/p><p>I prefer Strategy by default because composition beats inheritance for testing; Template Method is fine when the skeleton is genuinely invariant (Spring&#x27;s <code>JdbcTemplate<\/code> is the canonical example).<\/p>", "source": "answers.md", "search": "strategy versus template method versus state - how do you choose? strategy: interchangeable algorithms selected by the client, composed at runtime. template method: fixed algorithm skeleton in a base class with subclass hooks - inheritance-based, so more rigid. state: the object's behavior changes because its own state changed, and states know about transitions. i prefer strategy by default because composition beats inheritance for testing; template method is fine when the skeleton is genuinely invariant (spring's jdbctemplate is the canonical example)."}, {"n": 111, "category": 6, "difficulty": "D", "html": "Builder pattern - when do you need it beyond many constructor parameters?", "answerTitle": "Builder", "answer": "<p>Beyond the telescoping-constructor problem, the real value is: enforcing invariants in <code>build()<\/code> so no invalid object ever exists, supporting optional parameters without a combinatorial constructor explosion, producing immutable objects, and giving readable call sites where boolean or same-typed parameters would otherwise be positionally ambiguous. With records, a compact constructor plus a generated builder (Lombok <code>@Builder<\/code>) covers most cases.<\/p>", "source": "answers.md", "search": "builder pattern - when do you need it beyond many constructor parameters? beyond the telescoping-constructor problem, the real value is: enforcing invariants in build() so no invalid object ever exists, supporting optional parameters without a combinatorial constructor explosion, producing immutable objects, and giving readable call sites where boolean or same-typed parameters would otherwise be positionally ambiguous. with records, a compact constructor plus a generated builder (lombok @builder) covers most cases."}, {"n": 112, "category": 6, "difficulty": "D", "html": "Factory versus Abstract Factory versus dependency injection. Has DI made factories obsolete?", "answerTitle": "Factory versus DI", "answer": "<p>A DI container is a factory, so constructor-arg factories have largely been absorbed. Factories still earn their place when the choice is <em>data-driven at runtime<\/em> (create a handler based on a message type), when construction is genuinely complex, or when you must decouple from a third-party API. In Spring the idiomatic form is injecting a <code>Map&lt;String, Handler&gt;<\/code> (bean name to bean) or a <code>List&lt;Handler&gt;<\/code> with a <code>supports()<\/code> predicate.<\/p>", "source": "answers.md", "search": "factory versus abstract factory versus dependency injection. has di made factories obsolete? a di container is a factory, so constructor-arg factories have largely been absorbed. factories still earn their place when the choice is data-driven at runtime (create a handler based on a message type), when construction is genuinely complex, or when you must decouple from a third-party api. in spring the idiomatic form is injecting a map<string, handler (bean name to bean) or a list<handler with a supports() predicate."}, {"n": 113, "category": 6, "difficulty": "D", "html": "Decorator versus Proxy - both wrap. What is the intent difference?", "answerTitle": "Decorator versus Proxy", "answer": "<p>Structurally identical - both implement the same interface and wrap an instance. The difference is intent and lifecycle: a Decorator <em>adds behavior<\/em> and is stacked by the client, who chooses the composition; a Proxy <em>controls access<\/em> to a subject it usually creates or manages, adding lazy loading, remoting, caching or security without the client knowing.<\/p><p>Spring AOP is proxy-based; a <code>BufferedInputStream<\/code> wrapping a <code>FileInputStream<\/code> is a decorator.<\/p>", "source": "answers.md", "search": "decorator versus proxy - both wrap. what is the intent difference? structurally identical - both implement the same interface and wrap an instance. the difference is intent and lifecycle: a decorator adds behavior and is stacked by the client, who chooses the composition; a proxy controls access to a subject it usually creates or manages, adding lazy loading, remoting, caching or security without the client knowing. spring aop is proxy-based; a bufferedinputstream wrapping a fileinputstream is a decorator."}, {"n": 114, "category": 6, "difficulty": "D", "html": "Observer pattern versus an event bus versus a message broker. Where is the boundary?", "answerTitle": "Observer versus event bus versus broker", "answer": "<p>In-process <code>Observer<\/code> / Spring <code>ApplicationEvent<\/code>: synchronous by default, same transaction and same JVM, no durability - good for decoupling within a module. An in-process event bus adds async dispatch but still dies with the process. A message broker (Kafka, SQS) adds durability, cross-process delivery, replay and backpressure, at the cost of eventual consistency and operational complexity.<\/p><p>The boundary rule: if losing the event on a crash is unacceptable, it must cross a broker with an outbox, not an in-memory listener.<\/p>", "source": "answers.md", "search": "observer pattern versus an event bus versus a message broker. where is the boundary? in-process observer / spring applicationevent: synchronous by default, same transaction and same jvm, no durability - good for decoupling within a module. an in-process event bus adds async dispatch but still dies with the process. a message broker (kafka, sqs) adds durability, cross-process delivery, replay and backpressure, at the cost of eventual consistency and operational complexity. the boundary rule: if losing the event on a crash is unacceptable, it must cross a broker with an outbox, not an in-memory listener."}, {"n": 115, "category": 6, "difficulty": "T", "html": "Why is the Singleton pattern often called an anti-pattern in modern Spring applications?", "answerTitle": "Singleton as anti-pattern", "answer": "<p>The classic static-holder Singleton hides its dependency (callers reach for it globally rather than declaring it), makes testing hard because you cannot substitute it, introduces global mutable state, and can leak across classloaders.<\/p><p>Spring&#x27;s singleton scope is a different thing: one instance per container, but injected explicitly, so it stays substitutable and testable. The pattern is fine; the <code>static getInstance()<\/code> implementation is what causes the pain.<\/p>", "source": "answers.md", "search": "why is the singleton pattern often called an anti-pattern in modern spring applications? the classic static-holder singleton hides its dependency (callers reach for it globally rather than declaring it), makes testing hard because you cannot substitute it, introduces global mutable state, and can leak across classloaders. spring's singleton scope is a different thing: one instance per container, but injected explicitly, so it stays substitutable and testable. the pattern is fine; the static getinstance() implementation is what causes the pain."}, {"n": 116, "category": 6, "difficulty": "D", "html": "Explain the Circuit Breaker, Bulkhead and Retry patterns, and how they compose.", "answerTitle": "Resilience patterns", "answer": "<p><strong>Retry<\/strong> handles transient faults - must be paired with exponential backoff plus jitter, a bounded attempt count, and idempotency, or it becomes a self-inflicted denial of service. <strong>Circuit breaker<\/strong> stops calling a failing dependency (closed → open after a failure threshold → half-open trial), converting slow failures into fast ones. <strong>Bulkhead<\/strong> isolates resources per dependency, so one slow downstream cannot consume the whole thread or connection pool.<\/p><p>Composition order in Resilience4j matters: <code>Retry(CircuitBreaker(RateLimiter(TimeLimiter(Bulkhead(call)))))<\/code> - retry outermost so it observes the breaker, timeout inside so each attempt is bounded. And always define a fallback: cached data, degraded response, or a queued write.<\/p>", "source": "answers.md", "search": "explain the circuit breaker, bulkhead and retry patterns, and how they compose. retry handles transient faults - must be paired with exponential backoff plus jitter, a bounded attempt count, and idempotency, or it becomes a self-inflicted denial of service. circuit breaker stops calling a failing dependency (closed → open after a failure threshold → half-open trial), converting slow failures into fast ones. bulkhead isolates resources per dependency, so one slow downstream cannot consume the whole thread or connection pool. composition order in resilience4j matters: retry(circuitbreaker(ratelimiter(timelimiter(bulkhead(call))))) - retry outermost so it observes the breaker, timeout inside so each attempt is bounded. and always define a fallback: cached data, degraded response, or a queued write."}, {"n": 117, "category": 6, "difficulty": "A", "html": "How do you decide between inheritance and composition in a real design review?", "answerTitle": "Inheritance versus composition", "answer": "<p>I ask: is this a true &quot;is-a&quot; that satisfies Liskov for every current <em>and future<\/em> caller, or am I reusing code? If it is reuse, compose. Inheritance couples you to the parent&#x27;s implementation details, breaks encapsulation (the fragile base class problem), and consumes your one superclass slot.<\/p><p>I permit inheritance for stable, shallow hierarchies designed for extension and documented as such, and for sealed hierarchies modelling a closed set of variants.<\/p>", "source": "answers.md", "search": "how do you decide between inheritance and composition in a real design review? i ask: is this a true \"is-a\" that satisfies liskov for every current and future caller, or am i reusing code? if it is reuse, compose. inheritance couples you to the parent's implementation details, breaks encapsulation (the fragile base class problem), and consumes your one superclass slot. i permit inheritance for stable, shallow hierarchies designed for extension and documented as such, and for sealed hierarchies modelling a closed set of variants."}, {"n": 118, "category": 6, "difficulty": "A", "html": "What is your definition of clean code at a team level, and how do you enforce it without becoming a bottleneck?", "answerTitle": "Clean code at team scale", "answer": "<p>Definition: code a competent engineer unfamiliar with it can change safely in an afternoon. That means clear naming, small units with one reason to change, explicit boundaries, and tests that document intent.<\/p><p>Enforcement without being a bottleneck: automate everything mechanical (Spotless/Checkstyle, SonarQube quality gate on new code only, mutation testing on core modules, architecture tests with ArchUnit so layering violations fail the build), write a short set of team conventions with the <em>rationale<\/em>, and reserve human review for design and risk. I also rotate who runs design review so the standard is not attached to me personally.<\/p>", "source": "answers.md", "search": "what is your definition of clean code at a team level, and how do you enforce it without becoming a bottleneck? definition: code a competent engineer unfamiliar with it can change safely in an afternoon. that means clear naming, small units with one reason to change, explicit boundaries, and tests that document intent. enforcement without being a bottleneck: automate everything mechanical (spotless/checkstyle, sonarqube quality gate on new code only, mutation testing on core modules, architecture tests with archunit so layering violations fail the build), write a short set of team conventions with the rationale , and reserve human review for design and risk. i also rotate who runs design review so the standard is not attached to me personally."}, {"n": 119, "category": 6, "difficulty": "D", "html": "Explain hexagonal / ports-and-adapters architecture and what it buys you in testing.", "answerTitle": "Hexagonal architecture", "answer": "<p>The domain sits in the centre and defines <em>ports<\/em> (interfaces) for what it needs; adapters implement them for HTTP, JPA, Kafka, S3. Dependencies point inward only.<\/p><p>Testing payoff: domain logic is testable with plain JUnit and in-memory adapters, no Spring context, so the fast test tier covers the important logic in milliseconds; integration tests (Testcontainers) then verify only the adapters. The cost is more interfaces and indirection, so I apply it to the core domain modules, not to a CRUD service.<\/p>", "source": "answers.md", "search": "explain hexagonal / ports-and-adapters architecture and what it buys you in testing. the domain sits in the centre and defines ports (interfaces) for what it needs; adapters implement them for http, jpa, kafka, s3. dependencies point inward only. testing payoff: domain logic is testable with plain junit and in-memory adapters, no spring context, so the fast test tier covers the important logic in milliseconds; integration tests (testcontainers) then verify only the adapters. the cost is more interfaces and indirection, so i apply it to the core domain modules, not to a crud service."}, {"n": 120, "category": 6, "difficulty": "D", "html": "Domain-Driven Design: aggregates, bounded contexts, and how they map to microservice boundaries.", "answerTitle": "DDD and service boundaries", "answer": "<p>An <strong>aggregate<\/strong> is a consistency boundary - one transaction, one aggregate, referenced from outside only by identity. A <strong>bounded context<\/strong> is a linguistic and model boundary; the same word means different things in two contexts (&quot;customer&quot; in billing versus in support), and forcing one shared model is the root of most distributed monoliths.<\/p><p>Mapping to microservices: a service should own one or a few bounded contexts and their data exclusively. If two services need the same table, the boundary is wrong. Context maps (shared kernel, customer-supplier, anti-corruption layer) are how I document and negotiate the integration - and the anti-corruption layer is what I insist on when integrating a legacy system.<\/p>", "source": "answers.md", "search": "domain-driven design: aggregates, bounded contexts, and how they map to microservice boundaries. an aggregate is a consistency boundary - one transaction, one aggregate, referenced from outside only by identity. a bounded context is a linguistic and model boundary; the same word means different things in two contexts (\"customer\" in billing versus in support), and forcing one shared model is the root of most distributed monoliths. mapping to microservices: a service should own one or a few bounded contexts and their data exclusively. if two services need the same table, the boundary is wrong. context maps (shared kernel, customer-supplier, anti-corruption layer) are how i document and negotiate the integration - and the anti-corruption layer is what i insist on when integrating a legacy system."}, {"n": 121, "category": 7, "difficulty": "C", "html": "What problem does dependency injection solve? Constructor versus field versus setter injection.", "answerTitle": "Dependency injection", "answer": "<p>DI inverts control of dependency construction so a class declares what it needs and the container supplies it, enabling substitution in tests and decoupling from concrete implementations.<\/p><p>Constructor injection is my default: dependencies are explicit, the object is fully initialized and can be <code>final<\/code>, it works without Spring in a unit test, and an over-long constructor is a visible SRP warning. Setter injection only for genuinely optional dependencies. Field injection I do not allow.<\/p>", "source": "answers.md", "search": "what problem does dependency injection solve? constructor versus field versus setter injection. di inverts control of dependency construction so a class declares what it needs and the container supplies it, enabling substitution in tests and decoupling from concrete implementations. constructor injection is my default: dependencies are explicit, the object is fully initialized and can be final, it works without spring in a unit test, and an over-long constructor is a visible srp warning. setter injection only for genuinely optional dependencies. field injection i do not allow."}, {"n": 122, "category": 7, "difficulty": "T", "html": "Why is field injection discouraged even though it is the most concise?", "answerTitle": "Why field injection is discouraged", "answer": "<p>The field cannot be <code>final<\/code>, so the object is mutable and not thread-safe by construction; you cannot instantiate the class in a plain unit test without reflection; the dependency list is hidden, so a class with twelve dependencies looks fine; and circular dependencies get silently resolved instead of failing fast.<\/p><p>Since Spring 4.3, a single-constructor class does not even need <code>@Autowired<\/code>, so constructor injection is no more verbose.<\/p>", "source": "answers.md", "search": "why is field injection discouraged even though it is the most concise? the field cannot be final, so the object is mutable and not thread-safe by construction; you cannot instantiate the class in a plain unit test without reflection; the dependency list is hidden, so a class with twelve dependencies looks fine; and circular dependencies get silently resolved instead of failing fast. since spring 4.3, a single-constructor class does not even need @autowired, so constructor injection is no more verbose."}, {"n": 123, "category": 7, "difficulty": "D", "html": "Explain the Spring bean lifecycle, including <code>BeanPostProcessor<\/code> and <code>@PostConstruct<\/code>.", "answerTitle": "Bean lifecycle", "answer": "<p>Instantiate → populate dependencies → <code>BeanNameAware<\/code>/<code>BeanFactoryAware<\/code>/<code>ApplicationContextAware<\/code> → <code>BeanPostProcessor.postProcessBeforeInitialization<\/code> → <code>@PostConstruct<\/code> → <code>InitializingBean.afterPropertiesSet<\/code> → custom <code>init-method<\/code> → <code>BeanPostProcessor.postProcessAfterInitialization<\/code> (this is where AOP proxies are created) → bean in use → <code>@PreDestroy<\/code> → <code>DisposableBean.destroy<\/code> → custom destroy method.<\/p><p>The key insight for interviews: proxies are created in the <em>after-initialization<\/em> post-processor, which is why <code>@PostConstruct<\/code> code runs on the raw target and self-invocation there is never proxied.<\/p>", "source": "answers.md", "search": "explain the spring bean lifecycle, including beanpostprocessor and @postconstruct. instantiate → populate dependencies → beannameaware/beanfactoryaware/applicationcontextaware → beanpostprocessor.postprocessbeforeinitialization → @postconstruct → initializingbean.afterpropertiesset → custom init-method → beanpostprocessor.postprocessafterinitialization (this is where aop proxies are created) → bean in use → @predestroy → disposablebean.destroy → custom destroy method. the key insight for interviews: proxies are created in the after-initialization post-processor, which is why @postconstruct code runs on the raw target and self-invocation there is never proxied."}, {"n": 124, "category": 7, "difficulty": "D", "html": "Bean scopes: singleton, prototype, request, session. What happens when a singleton depends on a prototype?", "answerTitle": "Bean scopes", "answer": "<p><code>singleton<\/code> (one per container, default), <code>prototype<\/code> (new instance per lookup; Spring does <em>not<\/em> manage its destruction, so <code>@PreDestroy<\/code> never runs), plus web scopes <code>request<\/code>, <code>session<\/code>, <code>application<\/code>, <code>websocket<\/code>.<\/p><p>Singletons must be stateless, or thread-safe, because one instance serves all concurrent requests. The most common production bug I see is an instance field on a <code>@Service<\/code> used as per-request state.<\/p>", "source": "answers.md", "search": "bean scopes: singleton, prototype, request, session. what happens when a singleton depends on a prototype? singleton (one per container, default), prototype (new instance per lookup; spring does not manage its destruction, so @predestroy never runs), plus web scopes request, session, application, websocket. singletons must be stateless, or thread-safe, because one instance serves all concurrent requests. the most common production bug i see is an instance field on a @service used as per-request state."}, {"n": 125, "category": 7, "difficulty": "T", "html": "A singleton bean injects a prototype bean. Why does it get the same instance every time, and what are the two fixes?", "answerTitle": "Singleton depending on prototype", "answer": "<p>The dependency is injected once, at singleton creation, so the same prototype instance is reused forever - the prototype scope is effectively lost.<\/p><p>Two fixes: inject an <code>ObjectProvider&lt;T&gt;<\/code> (or <code>Provider&lt;T&gt;<\/code>) and call <code>getObject()<\/code> per use - my preference, since it is explicit and testable; or use <code>@Lookup<\/code> method injection / <code>@Scope(proxyMode = TARGET_CLASS)<\/code>, which puts a proxy in place that resolves a new instance per call.<\/p>", "source": "answers.md", "search": "a singleton bean injects a prototype bean. why does it get the same instance every time, and what are the two fixes? the dependency is injected once, at singleton creation, so the same prototype instance is reused forever - the prototype scope is effectively lost. two fixes: inject an objectprovider<t (or provider<t ) and call getobject() per use - my preference, since it is explicit and testable; or use @lookup method injection / @scope(proxymode = target_class), which puts a proxy in place that resolves a new instance per call."}, {"n": 126, "category": 7, "difficulty": "D", "html": "How does Spring Boot auto-configuration work end to end?", "answerTitle": "Auto-configuration", "answer": "<p><code>@SpringBootApplication<\/code> includes <code>@EnableAutoConfiguration<\/code>, which imports <code>AutoConfigurationImportSelector<\/code>. That reads candidate configuration class names from <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports<\/code> (the <code>spring.factories<\/code> mechanism before Boot 2.7) on every jar in the classpath, filters them by <code>@Conditional<\/code> annotations, orders them with <code>@AutoConfigureBefore<\/code>/<code>After<\/code>, and registers the survivors.<\/p><p>The conditions are why it feels magical: <code>@ConditionalOnClass(DataSource.class)<\/code> plus <code>@ConditionalOnMissingBean(DataSource.class)<\/code> means &quot;configure a DataSource only if the driver is present and the user has not defined one&quot;. Run with <code>--debug<\/code> to get the auto-configuration report showing matched and unmatched conditions - that is the answer to &quot;why is this bean not being created&quot;.<\/p>", "source": "answers.md", "search": "how does spring boot auto-configuration work end to end? @springbootapplication includes @enableautoconfiguration, which imports autoconfigurationimportselector. that reads candidate configuration class names from meta-inf/spring/org.springframework.boot.autoconfigure.autoconfiguration.imports (the spring.factories mechanism before boot 2.7) on every jar in the classpath, filters them by @conditional annotations, orders them with @autoconfigurebefore/after, and registers the survivors. the conditions are why it feels magical: @conditionalonclass(datasource.class) plus @conditionalonmissingbean(datasource.class) means \"configure a datasource only if the driver is present and the user has not defined one\". run with --debug to get the auto-configuration report showing matched and unmatched conditions - that is the answer to \"why is this bean not being created\"."}, {"n": 127, "category": 7, "difficulty": "D", "html": "<code>@Conditional<\/code> family: <code>@ConditionalOnMissingBean<\/code>, <code>@ConditionalOnProperty<\/code>, ordering. How do you override an auto-configuration?", "answerTitle": "`@Conditional` and overriding", "answer": "<p><code>@ConditionalOnMissingBean<\/code> is the back-off hook: define your own bean of that type and the auto-configured one steps aside. Ordering matters, so user configuration must be processed first - which it is, because auto-configuration is always registered last.<\/p><p>Others I use: <code>@ConditionalOnProperty<\/code> (feature flags at wiring level), <code>@ConditionalOnClass<\/code>/<code>OnMissingClass<\/code>, <code>@ConditionalOnWebApplication<\/code>, <code>@Profile<\/code>, and custom <code>Condition<\/code> implementations. To disable one outright: <code>@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)<\/code> or <code>spring.autoconfigure.exclude<\/code>.<\/p>", "source": "answers.md", "search": "@conditional family: @conditionalonmissingbean, @conditionalonproperty, ordering. how do you override an auto-configuration? @conditionalonmissingbean is the back-off hook: define your own bean of that type and the auto-configured one steps aside. ordering matters, so user configuration must be processed first - which it is, because auto-configuration is always registered last. others i use: @conditionalonproperty (feature flags at wiring level), @conditionalonclass/onmissingclass, @conditionalonwebapplication, @profile, and custom condition implementations. to disable one outright: @springbootapplication(exclude = datasourceautoconfiguration.class) or spring.autoconfigure.exclude."}, {"n": 128, "category": 7, "difficulty": "C", "html": "<code>@Component<\/code> versus <code>@Service<\/code> versus <code>@Repository<\/code> versus <code>@Controller<\/code> - is there any functional difference?", "answerTitle": "Stereotype annotations", "answer": "<p>All are <code>@Component<\/code> meta-annotated, so scanning treats them identically. The functional differences are: <code>@Repository<\/code> adds exception translation (<code>PersistenceExceptionTranslationPostProcessor<\/code> converts vendor <code>SQLException<\/code>s into Spring&#x27;s <code>DataAccessException<\/code> hierarchy), and <code>@Controller<\/code>/<code>@RestController<\/code> are detected by Spring MVC&#x27;s handler mapping; <code>@RestController<\/code> also implies <code>@ResponseBody<\/code>.<\/p><p><code>@Service<\/code> carries no behavior at all - it is documentation of intent, and useful for AOP pointcuts by annotation.<\/p>", "source": "answers.md", "search": "@component versus @service versus @repository versus @controller - is there any functional difference? all are @component meta-annotated, so scanning treats them identically. the functional differences are: @repository adds exception translation (persistenceexceptiontranslationpostprocessor converts vendor sqlexceptions into spring's dataaccessexception hierarchy), and @controller/@restcontroller are detected by spring mvc's handler mapping; @restcontroller also implies @responsebody. @service carries no behavior at all - it is documentation of intent, and useful for aop pointcuts by annotation."}, {"n": 129, "category": 7, "difficulty": "D", "html": "How does Spring AOP work? JDK dynamic proxies versus CGLIB, and when each is used.", "answerTitle": "Spring AOP proxies", "answer": "<p>Spring AOP is proxy-based and method-level only (not field access, not constructors). If the bean implements at least one interface, Spring uses JDK dynamic proxies by default; otherwise it uses CGLIB subclassing. Boot sets <code>spring.aop.proxy-target-class=true<\/code> by default, so CGLIB is generally used.<\/p><p>Consequences worth naming: CGLIB cannot proxy <code>final<\/code> classes or <code>final<\/code> methods, and it needs a usable constructor; JDK proxies only expose interface methods, so injecting by concrete class fails. For call-level interception (private methods, self-calls, constructors) you need AspectJ weaving instead.<\/p>", "source": "answers.md", "search": "how does spring aop work? jdk dynamic proxies versus cglib, and when each is used. spring aop is proxy-based and method-level only (not field access, not constructors). if the bean implements at least one interface, spring uses jdk dynamic proxies by default; otherwise it uses cglib subclassing. boot sets spring.aop.proxy-target-class=true by default, so cglib is generally used. consequences worth naming: cglib cannot proxy final classes or final methods, and it needs a usable constructor; jdk proxies only expose interface methods, so injecting by concrete class fails. for call-level interception (private methods, self-calls, constructors) you need aspectj weaving instead."}, {"n": 130, "category": 7, "difficulty": "T", "html": "<code>@Transactional<\/code> on a private method, or called from within the same class, does nothing. Explain why and give two fixes.", "answerTitle": "`@Transactional` self-invocation", "answer": "<p>The annotation is implemented by a proxy that starts a transaction before delegating to the target. A self-call (<code>this.doWork()<\/code>) goes straight to the target instance and never touches the proxy, so no transaction. Same for <code>private<\/code>, <code>final<\/code> and <code>static<\/code> methods - the proxy cannot intercept them. And <code>@Transactional<\/code> on a method called from <code>@PostConstruct<\/code> runs before the proxy exists.<\/p><p>Two fixes: move the transactional method into a separate bean and inject it (my preference - it makes the boundary explicit); or self-inject / use <code>AopContext.currentProxy()<\/code> with <code>@EnableAspectJAutoProxy(exposeProxy = true)<\/code>, which works but hides the mechanism. Third option for the determined: AspectJ load-time weaving.<\/p><blockquote><p><em>Hook: partial writes in a batch retry path caused exactly by this.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "@transactional on a private method, or called from within the same class, does nothing. explain why and give two fixes. the annotation is implemented by a proxy that starts a transaction before delegating to the target. a self-call (this.dowork()) goes straight to the target instance and never touches the proxy, so no transaction. same for private, final and static methods - the proxy cannot intercept them. and @transactional on a method called from @postconstruct runs before the proxy exists. two fixes: move the transactional method into a separate bean and inject it (my preference - it makes the boundary explicit); or self-inject / use aopcontext.currentproxy() with @enableaspectjautoproxy(exposeproxy = true), which works but hides the mechanism. third option for the determined: aspectj load-time weaving. hook: partial writes in a batch retry path caused exactly by this."}, {"n": 131, "category": 7, "difficulty": "D", "html": "Transaction propagation levels: <code>REQUIRED<\/code>, <code>REQUIRES_NEW<\/code>, <code>NESTED<\/code>, <code>SUPPORTS<\/code>, <code>MANDATORY<\/code>. Give a real use case for <code>REQUIRES_NEW<\/code>.", "answerTitle": "Propagation", "answer": "<p><code>REQUIRED<\/code> (default) joins an existing transaction or starts one. <code>REQUIRES_NEW<\/code> suspends the current one and runs independently - the right choice for audit logging or a failure record that must survive the caller&#x27;s rollback. <code>NESTED<\/code> uses a JDBC savepoint, so an inner rollback does not kill the outer transaction (JDBC only, not JTA). <code>SUPPORTS<\/code> joins if present, otherwise runs non-transactionally. <code>MANDATORY<\/code> throws if there is no transaction - a good guard on internal helpers. <code>NEVER<\/code> and <code>NOT_SUPPORTED<\/code> are the inverses.<\/p><p>The trap with <code>REQUIRES_NEW<\/code>: it holds two connections simultaneously, so under load it can exhaust the pool and even self-deadlock if the inner transaction waits on a row the outer one locked.<\/p>", "source": "answers.md", "search": "transaction propagation levels: required, requires_new, nested, supports, mandatory. give a real use case for requires_new. required (default) joins an existing transaction or starts one. requires_new suspends the current one and runs independently - the right choice for audit logging or a failure record that must survive the caller's rollback. nested uses a jdbc savepoint, so an inner rollback does not kill the outer transaction (jdbc only, not jta). supports joins if present, otherwise runs non-transactionally. mandatory throws if there is no transaction - a good guard on internal helpers. never and not_supported are the inverses. the trap with requires_new: it holds two connections simultaneously, so under load it can exhaust the pool and even self-deadlock if the inner transaction waits on a row the outer one locked."}, {"n": 132, "category": 7, "difficulty": "T", "html": "<code>@Transactional(rollbackFor = ...)<\/code> - by default which exceptions roll back a transaction and which silently commit?", "answerTitle": "Rollback rules", "answer": "<p>By default Spring rolls back only on unchecked exceptions (<code>RuntimeException<\/code>) and <code>Error<\/code>. A <strong>checked exception commits the transaction<\/strong>, which surprises everyone - a <code>throw new IOException()<\/code> from your service leaves the partial write committed.<\/p><p>Fix with <code>@Transactional(rollbackFor = Exception.class)<\/code>, or standardize on unchecked domain exceptions. Second trap: catching an exception inside the transactional method means Spring never sees it and the transaction commits; and if a nested transaction already marked the transaction rollback-only, you get <code>UnexpectedRollbackException<\/code> at commit time.<\/p>", "source": "answers.md", "search": "@transactional(rollbackfor = ...) - by default which exceptions roll back a transaction and which silently commit? by default spring rolls back only on unchecked exceptions (runtimeexception) and error. a checked exception commits the transaction , which surprises everyone - a throw new ioexception() from your service leaves the partial write committed. fix with @transactional(rollbackfor = exception.class), or standardize on unchecked domain exceptions. second trap: catching an exception inside the transactional method means spring never sees it and the transaction commits; and if a nested transaction already marked the transaction rollback-only, you get unexpectedrollbackexception at commit time."}, {"n": 133, "category": 7, "difficulty": "D", "html": "Isolation levels and the anomalies they prevent: dirty read, non-repeatable read, phantom read.", "answerTitle": "Isolation levels", "answer": "<p><code>READ_UNCOMMITTED<\/code> allows dirty reads. <code>READ_COMMITTED<\/code> prevents dirty reads (PostgreSQL and Oracle default). <code>REPEATABLE_READ<\/code> also prevents non-repeatable reads (MySQL InnoDB default; and InnoDB&#x27;s gap locks prevent most phantoms too). <code>SERIALIZABLE<\/code> prevents phantoms, at the cost of heavy locking or serialization failures you must retry.<\/p><p>Practical stance: keep <code>READ_COMMITTED<\/code> and solve the specific anomaly with optimistic locking (<code>@Version<\/code>) or an explicit <code>SELECT ... FOR UPDATE<\/code>, rather than raising the isolation level globally and paying for it everywhere.<\/p>", "source": "answers.md", "search": "isolation levels and the anomalies they prevent: dirty read, non-repeatable read, phantom read. read_uncommitted allows dirty reads. read_committed prevents dirty reads (postgresql and oracle default). repeatable_read also prevents non-repeatable reads (mysql innodb default; and innodb's gap locks prevent most phantoms too). serializable prevents phantoms, at the cost of heavy locking or serialization failures you must retry. practical stance: keep read_committed and solve the specific anomaly with optimistic locking (@version) or an explicit select ... for update, rather than raising the isolation level globally and paying for it everywhere."}, {"n": 134, "category": 7, "difficulty": "D", "html": "<code>@Async<\/code> - how it works, why the caller must not be in the same class, and how you configure the executor.", "answerTitle": "`@Async`", "answer": "<p>Backed by the same proxy mechanism, so the same self-invocation rule applies: an internal call runs synchronously. The method must return <code>void<\/code>, <code>Future<\/code>, or <code>CompletableFuture<\/code> - anything else and the return value is meaningless.<\/p><p>Configure your own executor; the default <code>SimpleAsyncTaskExecutor<\/code> (pre-Boot 3.2 behavior) creates a new thread per call and does not pool, which is unusable in production. Also note that exceptions from <code>void<\/code> async methods vanish unless you register an <code>AsyncUncaughtExceptionHandler<\/code>, and that <code>SecurityContext<\/code> and MDC do not propagate unless you configure a <code>TaskDecorator<\/code> (or set <code>DelegatingSecurityContextAsyncTaskExecutor<\/code>).<\/p>", "source": "answers.md", "search": "@async - how it works, why the caller must not be in the same class, and how you configure the executor. backed by the same proxy mechanism, so the same self-invocation rule applies: an internal call runs synchronously. the method must return void, future, or completablefuture - anything else and the return value is meaningless. configure your own executor; the default simpleasynctaskexecutor (pre-boot 3.2 behavior) creates a new thread per call and does not pool, which is unusable in production. also note that exceptions from void async methods vanish unless you register an asyncuncaughtexceptionhandler, and that securitycontext and mdc do not propagate unless you configure a taskdecorator (or set delegatingsecuritycontextasynctaskexecutor)."}, {"n": 135, "category": 7, "difficulty": "T", "html": "Why does <code>@Async<\/code> combined with <code>@Transactional<\/code> on the same method behave unexpectedly?", "answerTitle": "`@Async` plus `@Transactional`", "answer": "<p>Two proxies stack, and the transaction is bound to a thread via <code>ThreadLocal<\/code>. The async method runs on a different thread, so it does not inherit the caller&#x27;s transaction - it starts its own, or none. Consequences: entities passed as arguments are detached in the new thread (<code>LazyInitializationException<\/code>), the caller&#x27;s transaction may commit or roll back independently, and the async work can read pre-commit state.<\/p><p>Correct pattern: commit first, then trigger async work - ideally via <code>@TransactionalEventListener(phase = AFTER_COMMIT)<\/code> - and pass IDs rather than entities so the async method reloads within its own transaction.<\/p>", "source": "answers.md", "search": "why does @async combined with @transactional on the same method behave unexpectedly? two proxies stack, and the transaction is bound to a thread via threadlocal. the async method runs on a different thread, so it does not inherit the caller's transaction - it starts its own, or none. consequences: entities passed as arguments are detached in the new thread (lazyinitializationexception), the caller's transaction may commit or roll back independently, and the async work can read pre-commit state. correct pattern: commit first, then trigger async work - ideally via @transactionaleventlistener(phase = after_commit) - and pass ids rather than entities so the async method reloads within its own transaction."}, {"n": 136, "category": 7, "difficulty": "D", "html": "Circular dependencies in Spring: how they are resolved, why constructor injection fails, and why you should fix the design instead.", "answerTitle": "Circular dependencies", "answer": "<p>With field or setter injection Spring resolves cycles using the early-reference cache in <code>DefaultSingletonBeanRegistry<\/code> (the three-level cache), exposing a partially constructed bean. With constructor injection it cannot - neither bean can be created first - so it throws <code>BeanCurrentlyInCreationException<\/code>. Since Boot 2.6 circular references are disallowed by default.<\/p><p><code>@Lazy<\/code> on one side works by injecting a proxy, and it is a legitimate escape hatch, but a cycle almost always signals a missing third component or a misplaced responsibility. I treat it as a design bug and extract the shared behavior.<\/p>", "source": "answers.md", "search": "circular dependencies in spring: how they are resolved, why constructor injection fails, and why you should fix the design instead. with field or setter injection spring resolves cycles using the early-reference cache in defaultsingletonbeanregistry (the three-level cache), exposing a partially constructed bean. with constructor injection it cannot - neither bean can be created first - so it throws beancurrentlyincreationexception. since boot 2.6 circular references are disallowed by default. @lazy on one side works by injecting a proxy, and it is a legitimate escape hatch, but a cycle almost always signals a missing third component or a misplaced responsibility. i treat it as a design bug and extract the shared behavior."}, {"n": 137, "category": 7, "difficulty": "D", "html": "Spring profiles, externalized configuration precedence, and <code>@ConfigurationProperties<\/code> versus <code>@Value<\/code>.", "answerTitle": "Configuration", "answer": "<p>Precedence, highest first: command-line args, <code>SPRING_APPLICATION_JSON<\/code>, OS environment variables, <code>application-{profile}.yml<\/code> outside the jar, then inside, <code>application.yml<\/code> outside then inside, <code>@PropertySource<\/code>, defaults. Config Data imports (<code>spring.config.import<\/code>) let you pull in AWS Parameter Store or Vault.<\/p><p><code>@ConfigurationProperties<\/code> over <code>@Value<\/code> for anything non-trivial: type-safe binding, relaxed naming, JSR-303 validation with <code>@Validated<\/code>, nested objects, list and map binding, and IDE metadata. <code>@Value<\/code> is fine for a single value and required for SpEL.<\/p><p>Profiles: keep them for environment shape (<code>dev<\/code>, <code>prod<\/code>), not for business logic, and avoid profile-conditional beans that change behavior in ways tests never exercise.<\/p>", "source": "answers.md", "search": "spring profiles, externalized configuration precedence, and @configurationproperties versus @value. precedence, highest first: command-line args, spring_application_json, os environment variables, application-{profile}.yml outside the jar, then inside, application.yml outside then inside, @propertysource, defaults. config data imports (spring.config.import) let you pull in aws parameter store or vault. @configurationproperties over @value for anything non-trivial: type-safe binding, relaxed naming, jsr-303 validation with @validated, nested objects, list and map binding, and ide metadata. @value is fine for a single value and required for spel. profiles: keep them for environment shape (dev, prod), not for business logic, and avoid profile-conditional beans that change behavior in ways tests never exercise."}, {"n": 138, "category": 7, "difficulty": "D", "html": "Spring Boot Actuator: which endpoints do you expose in production and how do you secure them?", "answerTitle": "Actuator", "answer": "<p>Expose <code>/health<\/code> (with <code>liveness<\/code> and <code>readiness<\/code> groups for Kubernetes), <code>/info<\/code>, <code>/metrics<\/code> and <code>/prometheus<\/code>. Guard <code>/env<\/code>, <code>/configprops<\/code>, <code>/heapdump<\/code>, <code>/threaddump<\/code>, <code>/loggers<\/code> and <code>/mappings<\/code> behind authentication, because they leak configuration and secrets.<\/p><p>My production setup: put actuator on a separate management port not exposed by the ingress, require an authenticated role for anything beyond health, set <code>management.endpoint.health.show-details=when-authorized<\/code>, and write custom <code>HealthIndicator<\/code>s only for dependencies whose failure should actually take the instance out of rotation - a common mistake is failing readiness because a non-critical downstream is down, wh
