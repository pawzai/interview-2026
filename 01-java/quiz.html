<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Interview Preparation Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>

<div class="wrap">

<header class="top">
  <h1>Java Interview Preparation Pack</h1>
  <p>Principal / Lead / Solution Architect preparation. Answer out loud before expanding.</p>
  <div class="legend" id="legend"></div>
</header>

<div class="toolbar">
  <div class="row">
    <input type="search" id="search" placeholder="Search questions and answers    ( / to focus )" autocomplete="off">
    <select id="category"><option value="">All categories</option></select>
    <select id="status">
      <option value="">Any status</option>
      <option value="unseen">Not marked</option>
      <option value="review">Needs review</option>
      <option value="known">Known</option>
    </select>
  </div>
  <div class="row">
    <span id="diffFilters"></span>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
    <button id="theme">Light</button>
    <button id="reset">Reset progress</button>
  </div>
  <div class="row progress">
    <div class="bar" style="flex:1"><i class="known" id="barKnown"></i><i class="review" id="barReview"></i></div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<main id="list"></main>

</div>

<script id="data" type="application/json">{"categories": [{"index": 1, "title": "Java language fundamentals"}, {"index": 2, "title": "Collections and data structures"}, {"index": 3, "title": "Streams, lambdas and functional Java"}, {"index": 4, "title": "Concurrency and multithreading"}, {"index": 5, "title": "JVM internals, memory and performance"}, {"index": 6, "title": "Design patterns and clean code"}, {"index": 7, "title": "Spring Framework and Spring Boot"}, {"index": 8, "title": "Spring Security, authentication and authorization"}, {"index": 9, "title": "Databases, JPA and persistence"}, {"index": 10, "title": "Microservices, APIs and distributed systems"}, {"index": 11, "title": "AWS and cloud architecture"}, {"index": 12, "title": "DevOps, CI/CD and observability"}, {"index": 13, "title": "AI engineering with Java"}, {"index": 14, "title": "System design"}, {"index": 15, "title": "Leadership, behavioral and .NET-to-Java positioning"}], "questions": [{"n": 1, "category": 1, "difficulty": "C", "html": "Explain the contract between <code>equals()<\/code> and <code>hashCode()<\/code>. What breaks if you violate it?", "answerTitle": "`equals()` and `hashCode()` contract", "answer": "<p>Equal objects must produce equal hash codes. Unequal objects <em>may<\/em> share a hash code (that is a collision, not a bug). <code>hashCode()<\/code> must be consistent across calls as long as the fields used in <code>equals()<\/code> do not change.<\/p><p>Violating it breaks every hash-based collection: <code>map.put(key, v)<\/code> lands in bucket A, and if <code>hashCode()<\/code> later returns a different value, <code>map.get(key)<\/code> looks in bucket B and returns <code>null<\/code> even though the entry exists.<\/p><p>Rules I enforce in review: base both methods on the same immutable subset of fields, prefer <code>Objects.equals<\/code> / <code>Objects.hash<\/code>, and never include mutable or derived fields.<\/p><blockquote><p><em>Hook: a caching bug caused by an entity whose <code>hashCode<\/code> included a lazily-loaded association.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "explain the contract between equals() and hashcode(). what breaks if you violate it? equal objects must produce equal hash codes. unequal objects may share a hash code (that is a collision, not a bug). hashcode() must be consistent across calls as long as the fields used in equals() do not change. violating it breaks every hash-based collection: map.put(key, v) lands in bucket a, and if hashcode() later returns a different value, map.get(key) looks in bucket b and returns null even though the entry exists. rules i enforce in review: base both methods on the same immutable subset of fields, prefer objects.equals / objects.hash, and never include mutable or derived fields. hook: a caching bug caused by an entity whose hashcode included a lazily-loaded association."}, {"n": 2, "category": 1, "difficulty": "T", "html": "A mutable object is used as a <code>HashMap<\/code> key and then mutated. What happens on lookup, and why is the entry still counted in <code>size()<\/code>?", "answerTitle": "Mutating a `HashMap` key", "answer": "<p>The entry becomes unreachable but is not removed. The key was placed in the bucket derived from its hash at insertion time. After mutation, <code>get(key)<\/code> computes a new hash, goes to a different bucket, and finds nothing. <code>containsKey<\/code> returns <code>false<\/code>, <code>remove<\/code> fails, yet <code>size()<\/code> still counts the entry and iteration still returns it.<\/p><p>This is a genuine memory leak in long-lived maps. The fix is immutable keys, or keys whose <code>equals<\/code>/<code>hashCode<\/code> use only immutable fields.<\/p>", "source": "answers.md", "search": "a mutable object is used as a hashmap key and then mutated. what happens on lookup, and why is the entry still counted in size()? the entry becomes unreachable but is not removed. the key was placed in the bucket derived from its hash at insertion time. after mutation, get(key) computes a new hash, goes to a different bucket, and finds nothing. containskey returns false, remove fails, yet size() still counts the entry and iteration still returns it. this is a genuine memory leak in long-lived maps. the fix is immutable keys, or keys whose equals/hashcode use only immutable fields."}, {"n": 3, "category": 1, "difficulty": "C", "html": "<code>==<\/code> versus <code>equals()<\/code> for wrapper types. Why does <code>Integer a = 127, b = 127; a == b<\/code> return <code>true<\/code> but the same code with <code>128<\/code> returns <code>false<\/code>?", "answerTitle": "Integer caching", "answer": "<p><code>Integer.valueOf<\/code> caches boxed values in the range -128 to 127 (upper bound tunable via <code>-XX:AutoBoxCacheMax<\/code>). Autoboxing calls <code>valueOf<\/code>, so <code>127<\/code> yields the same cached instance and <code>==<\/code> is <code>true<\/code>. <code>128<\/code> allocates two objects, so <code>==<\/code> compares references and is <code>false<\/code>.<\/p><p>The real lesson: never compare boxed types with <code>==<\/code>. This is the single most common source of intermittent bugs when developers move from <code>int<\/code> to <code>Integer<\/code> in DTOs.<\/p>", "source": "answers.md", "search": "== versus equals() for wrapper types. why does integer a = 127, b = 127; a == b return true but the same code with 128 returns false? integer.valueof caches boxed values in the range -128 to 127 (upper bound tunable via -xx:autoboxcachemax). autoboxing calls valueof, so 127 yields the same cached instance and == is true. 128 allocates two objects, so == compares references and is false. the real lesson: never compare boxed types with ==. this is the single most common source of intermittent bugs when developers move from int to integer in dtos."}, {"n": 4, "category": 1, "difficulty": "T", "html": "What does <code>System.out.println(0.1 + 0.2 == 0.3)<\/code> print, and how do you compare doubles safely?", "answerTitle": "`0.1 + 0.2 == 0.3`", "answer": "<p>Prints <code>false<\/code>. IEEE-754 binary floating point cannot represent 0.1 or 0.2 exactly, so the sum is <code>0.30000000000000004<\/code>.<\/p><p>Safe comparison uses a tolerance: <code>Math.abs(a - b) &lt; 1e-9<\/code>. For anything involving money, use <code>BigDecimal<\/code> constructed from a <code>String<\/code> (<code>new BigDecimal(&quot;0.1&quot;)<\/code>, never <code>new BigDecimal(0.1)<\/code>) and always specify scale and <code>RoundingMode<\/code>.<\/p><blockquote><p><em>Hook: a billing reconciliation defect where <code>double<\/code> accumulation drifted over millions of rows.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "what does system.out.println(0.1 + 0.2 == 0.3) print, and how do you compare doubles safely? prints false. ieee-754 binary floating point cannot represent 0.1 or 0.2 exactly, so the sum is 0.30000000000000004. safe comparison uses a tolerance: math.abs(a - b) < 1e-9. for anything involving money, use bigdecimal constructed from a string (new bigdecimal(\"0.1\"), never new bigdecimal(0.1)) and always specify scale and roundingmode. hook: a billing reconciliation defect where double accumulation drifted over millions of rows."}, {"n": 5, "category": 1, "difficulty": "C", "html": "Difference between <code>String<\/code>, <code>StringBuilder<\/code> and <code>StringBuffer<\/code>. When does the compiler already optimize concatenation for you?", "answerTitle": "`String` versus `StringBuilder` versus `StringBuffer`", "answer": "<p><code>String<\/code> is immutable, <code>StringBuilder<\/code> is mutable and unsynchronized, <code>StringBuffer<\/code> is mutable and synchronized (effectively legacy - the lock is almost never useful because the builder is usually thread-confined).<\/p><p>The compiler already converts simple concatenation into <code>StringBuilder<\/code> (or <code>invokedynamic<\/code> with <code>StringConcatFactory<\/code> since Java 9). What it cannot optimize is concatenation inside a loop, which creates a new builder per iteration and turns O(n) into O(n²).<\/p>", "source": "answers.md", "search": "difference between string, stringbuilder and stringbuffer. when does the compiler already optimize concatenation for you? string is immutable, stringbuilder is mutable and unsynchronized, stringbuffer is mutable and synchronized (effectively legacy - the lock is almost never useful because the builder is usually thread-confined). the compiler already converts simple concatenation into stringbuilder (or invokedynamic with stringconcatfactory since java 9). what it cannot optimize is concatenation inside a loop, which creates a new builder per iteration and turns o(n) into o(n²)."}, {"n": 6, "category": 1, "difficulty": "T", "html": "Explain string interning. Why is <code>new String(&quot;a&quot;) == &quot;a&quot;<\/code> false but <code>new String(&quot;a&quot;).intern() == &quot;a&quot;<\/code> true?", "answerTitle": "String interning", "answer": "<p>String literals live in the string pool, so <code>&quot;a&quot; == &quot;a&quot;<\/code> is <code>true<\/code>. <code>new String(&quot;a&quot;)<\/code> forces a fresh heap object, so <code>==<\/code> against the literal is <code>false<\/code>. <code>intern()<\/code> returns the pooled instance, restoring reference equality.<\/p><p>Do not call <code>intern()<\/code> as an optimization in modern code. It moves pressure to a native hash table, and on old JVMs the pool lived in PermGen. Just use <code>equals()<\/code>.<\/p>", "source": "answers.md", "search": "explain string interning. why is new string(\"a\") == \"a\" false but new string(\"a\").intern() == \"a\" true? string literals live in the string pool, so \"a\" == \"a\" is true. new string(\"a\") forces a fresh heap object, so == against the literal is false. intern() returns the pooled instance, restoring reference equality. do not call intern() as an optimization in modern code. it moves pressure to a native hash table, and on old jvms the pool lived in permgen. just use equals()."}, {"n": 7, "category": 1, "difficulty": "C", "html": "What makes a class immutable? List all the requirements, including the one most people forget.", "answerTitle": "Making a class immutable", "answer": "<ol><li>Declare the class <code>final<\/code> (or all constructors private) so behavior cannot be overridden.<\/li><li>All fields <code>private final<\/code>.<\/li><li>No setters, no mutating methods.<\/li><li><strong>Defensive-copy mutable inputs in the constructor.<\/strong><\/li><li><strong>Defensive-copy mutable fields on the way out of getters.<\/strong> This is the one people forget.<\/li><\/ol><p>Records handle 1 through 3 automatically but <em>not<\/em> 4 and 5 - a record holding a <code>List<\/code> is still mutable through that list.<\/p>", "source": "answers.md", "search": "what makes a class immutable? list all the requirements, including the one most people forget. 1. declare the class final (or all constructors private) so behavior cannot be overridden. 2. all fields private final. 3. no setters, no mutating methods. 4. defensive-copy mutable inputs in the constructor. 5. defensive-copy mutable fields on the way out of getters. this is the one people forget. records handle 1 through 3 automatically but not 4 and 5 - a record holding a list is still mutable through that list."}, {"n": 8, "category": 1, "difficulty": "T", "html": "A <code>final<\/code> field holding a <code>List<\/code> - is the object immutable? How do you actually make it safe?", "answerTitle": "`final` field holding a `List`", "answer": "<p><code>final<\/code> means the reference cannot be reassigned; it says nothing about the object&#x27;s contents. <code>list.add(x)<\/code> still works.<\/p><p>To make it safe: copy on the way in (<code>List.copyOf(input)<\/code>), and return an unmodifiable view or a copy from the getter. <code>List.copyOf<\/code> and <code>Collections.unmodifiableList<\/code> differ - the latter is a <em>view<\/em>, so mutating the original still shows through.<\/p>", "source": "answers.md", "search": "a final field holding a list - is the object immutable? how do you actually make it safe? final means the reference cannot be reassigned; it says nothing about the object's contents. list.add(x) still works. to make it safe: copy on the way in (list.copyof(input)), and return an unmodifiable view or a copy from the getter. list.copyof and collections.unmodifiablelist differ - the latter is a view , so mutating the original still shows through."}, {"n": 9, "category": 1, "difficulty": "C", "html": "Pass by value or pass by reference in Java? Justify with an example that surprises people.", "answerTitle": "Pass by value", "answer": "<p>Java is always pass by value. For objects, the <em>reference<\/em> is copied by value. So a method can mutate the object your reference points at, but reassigning the parameter inside the method has no effect on the caller.<\/p><pre><code class=\"lang-java\">void f(List&lt;String&gt; l) { l.add(&quot;x&quot;);        }  // caller sees &quot;x&quot;\nvoid g(List&lt;String&gt; l) { l = new ArrayList&lt;&gt;(); } // caller sees nothing<\/code><\/pre>", "source": "answers.md", "search": "pass by value or pass by reference in java? justify with an example that surprises people. java is always pass by value. for objects, the reference is copied by value. so a method can mutate the object your reference points at, but reassigning the parameter inside the method has no effect on the caller. java void f(list<string l) { l.add(\"x\"); } // caller sees \"x\" void g(list<string l) { l = new arraylist< (); } // caller sees nothing"}, {"n": 10, "category": 1, "difficulty": "D", "html": "Explain the <code>static<\/code> initialization order: static fields, static blocks, instance fields, instance blocks, constructors, and where inheritance fits.", "answerTitle": "Initialization order", "answer": "<p>Static fields and static blocks run once, in source order, on class initialization - superclass first. Then per instance: superclass instance initializers and constructor, then subclass instance fields and instance blocks in source order, then the subclass constructor body.<\/p>", "source": "answers.md", "search": "explain the static initialization order: static fields, static blocks, instance fields, instance blocks, constructors, and where inheritance fits. static fields and static blocks run once, in source order, on class initialization - superclass first. then per instance: superclass instance initializers and constructor, then subclass instance fields and instance blocks in source order, then the subclass constructor body."}, {"n": 11, "category": 1, "difficulty": "T", "html": "What is printed if a subclass constructor calls an overridable method that uses a subclass field? Why?", "answerTitle": "Overridable method called from a constructor", "answer": "<p>The subclass override runs <em>before<\/em> the subclass fields are initialized, so it sees default values (<code>null<\/code>, <code>0<\/code>, <code>false<\/code>).<\/p><pre><code class=\"lang-java\">class Base { Base() { print(); } void print() {} }\nclass Child extends Base {\n    private String name = &quot;child&quot;;\n    @Override void print() { System.out.println(name); } // prints null\n}<\/code><\/pre><p>Rule: never call an overridable method from a constructor. Make such methods <code>final<\/code> or <code>private<\/code>, or use a builder/factory that fully constructs before invoking behavior.<\/p>", "source": "answers.md", "search": "what is printed if a subclass constructor calls an overridable method that uses a subclass field? why? the subclass override runs before the subclass fields are initialized, so it sees default values (null, 0, false). java class base { base() { print(); } void print() {} } class child extends base { private string name = \"child\"; @override void print() { system.out.println(name); } // prints null } rule: never call an overridable method from a constructor. make such methods final or private, or use a builder/factory that fully constructs before invoking behavior."}, {"n": 12, "category": 1, "difficulty": "C", "html": "Difference between abstract classes and interfaces after Java 8 default methods. When do you still need an abstract class?", "answerTitle": "Abstract class versus interface", "answer": "<p>Interfaces give you multiple inheritance of <em>type<\/em> and, since Java 8, of <em>behavior<\/em> via <code>default<\/code> methods. You still need an abstract class when you need state (instance fields), non-public members, or constructor logic shared by subclasses.<\/p><p>My rule: interface for the contract at the boundary, abstract class only when there is genuinely shared mutable state - otherwise prefer composition.<\/p>", "source": "answers.md", "search": "difference between abstract classes and interfaces after java 8 default methods. when do you still need an abstract class? interfaces give you multiple inheritance of type and, since java 8, of behavior via default methods. you still need an abstract class when you need state (instance fields), non-public members, or constructor logic shared by subclasses. my rule: interface for the contract at the boundary, abstract class only when there is genuinely shared mutable state - otherwise prefer composition."}, {"n": 13, "category": 1, "difficulty": "T", "html": "A class implements two interfaces with the same <code>default<\/code> method signature. What happens, and how do you resolve it?", "answerTitle": "Diamond of default methods", "answer": "<p>The class does not compile. Java forces you to disambiguate explicitly:<\/p><pre><code class=\"lang-java\">class C implements A, B {\n    @Override public void hello() { A.super.hello(); }\n}<\/code><\/pre><p>Also worth knowing: a class method always beats an interface default, and a more specific interface beats a less specific one (&quot;class wins, then most specific interface, then explicit disambiguation&quot;).<\/p>", "source": "answers.md", "search": "a class implements two interfaces with the same default method signature. what happens, and how do you resolve it? the class does not compile. java forces you to disambiguate explicitly: java class c implements a, b { @override public void hello() { a.super.hello(); } } also worth knowing: a class method always beats an interface default, and a more specific interface beats a less specific one (\"class wins, then most specific interface, then explicit disambiguation\")."}, {"n": 14, "category": 1, "difficulty": "D", "html": "Explain method overloading resolution: widening versus boxing versus varargs. Which wins?", "answerTitle": "Overload resolution", "answer": "<p>Three phases, and the compiler stops at the first that finds a match:<\/p><ol><li>Without boxing or varargs (widening primitives allowed).<\/li><li>With boxing/unboxing allowed.<\/li><li>With varargs allowed.<\/li><\/ol><p>So <code>f(int)<\/code> beats <code>f(Integer)<\/code> beats <code>f(int...)<\/code> for an <code>int<\/code> argument. Widening wins over boxing - a common surprise.<\/p>", "source": "answers.md", "search": "explain method overloading resolution: widening versus boxing versus varargs. which wins? three phases, and the compiler stops at the first that finds a match: 1. without boxing or varargs (widening primitives allowed). 2. with boxing/unboxing allowed. 3. with varargs allowed. so f(int) beats f(integer) beats f(int...) for an int argument. widening wins over boxing - a common surprise."}, {"n": 15, "category": 1, "difficulty": "T", "html": "What happens when you overload a method with <code>Object<\/code> and <code>String<\/code> parameters and call it with <code>null<\/code>?", "answerTitle": "Overload with `null`", "answer": "<p><code>f(null)<\/code> picks the <strong>most specific<\/strong> applicable overload. With <code>f(Object)<\/code> and <code>f(String)<\/code>, <code>String<\/code> is more specific, so <code>f(String)<\/code> is chosen. If you add <code>f(Integer)<\/code>, <code>String<\/code> and <code>Integer<\/code> are unrelated, the call becomes ambiguous and compilation fails. Fix by casting: <code>f((String) null)<\/code>.<\/p>", "source": "answers.md", "search": "what happens when you overload a method with object and string parameters and call it with null? f(null) picks the most specific applicable overload. with f(object) and f(string), string is more specific, so f(string) is chosen. if you add f(integer), string and integer are unrelated, the call becomes ambiguous and compilation fails. fix by casting: f((string) null)."}, {"n": 16, "category": 1, "difficulty": "C", "html": "Checked versus unchecked exceptions. What is your team-level policy and why?", "answerTitle": "Checked versus unchecked", "answer": "<p>Checked exceptions must be declared or handled; unchecked (subclasses of <code>RuntimeException<\/code>) need not be.<\/p><p>My team policy: use unchecked exceptions for programming errors and for anything the caller cannot meaningfully recover from, which in a Spring service is nearly everything. Wrap checked exceptions from libraries into domain exceptions at the boundary. Checked exceptions are justified when the caller has a realistic alternative action. Never swallow, never <code>catch (Exception e) {}<\/code>, always preserve the cause.<\/p>", "source": "answers.md", "search": "checked versus unchecked exceptions. what is your team-level policy and why? checked exceptions must be declared or handled; unchecked (subclasses of runtimeexception) need not be. my team policy: use unchecked exceptions for programming errors and for anything the caller cannot meaningfully recover from, which in a spring service is nearly everything. wrap checked exceptions from libraries into domain exceptions at the boundary. checked exceptions are justified when the caller has a realistic alternative action. never swallow, never catch (exception e) {}, always preserve the cause."}, {"n": 17, "category": 1, "difficulty": "T", "html": "What is returned when a <code>finally<\/code> block contains a <code>return<\/code> statement and the <code>try<\/code> block also returns?", "answerTitle": "`return` in `finally`", "answer": "<p>The <code>finally<\/code> return wins and <strong>silently discards<\/strong> the <code>try<\/code> block&#x27;s return value, and worse, discards any in-flight exception.<\/p><pre><code class=\"lang-java\">int f() { try { return 1; } finally { return 2; } } // returns 2<\/code><\/pre><p>Also note that <code>try { return x; } finally { x = 99; }<\/code> returns the <em>original<\/em> value, because the return value is evaluated and stashed before <code>finally<\/code> runs. Static analysis should flag any <code>return<\/code> or <code>throw<\/code> inside <code>finally<\/code>.<\/p>", "source": "answers.md", "search": "what is returned when a finally block contains a return statement and the try block also returns? the finally return wins and silently discards the try block's return value, and worse, discards any in-flight exception. java int f() { try { return 1; } finally { return 2; } } // returns 2 also note that try { return x; } finally { x = 99; } returns the original value, because the return value is evaluated and stashed before finally runs. static analysis should flag any return or throw inside finally."}, {"n": 18, "category": 1, "difficulty": "T", "html": "Can a <code>finally<\/code> block prevent an exception from propagating? Show how, and why it is dangerous.", "answerTitle": "`finally` swallowing exceptions", "answer": "<p>Yes. If <code>finally<\/code> completes abruptly - by <code>return<\/code>, <code>break<\/code>, <code>continue<\/code> or throwing - the original exception is discarded entirely. This is how &quot;the error disappeared&quot; bugs happen. It is also why <code>try-with-resources<\/code> records close-time failures as <em>suppressed<\/em> exceptions rather than replacing the primary one.<\/p>", "source": "answers.md", "search": "can a finally block prevent an exception from propagating? show how, and why it is dangerous. yes. if finally completes abruptly - by return, break, continue or throwing - the original exception is discarded entirely. this is how \"the error disappeared\" bugs happen. it is also why try-with-resources records close-time failures as suppressed exceptions rather than replacing the primary one."}, {"n": 19, "category": 1, "difficulty": "D", "html": "Explain <code>try-with-resources<\/code>, suppressed exceptions, and the order of resource closing.", "answerTitle": "`try-with-resources`", "answer": "<p>Resources are closed in reverse declaration order, before <code>catch<\/code> and <code>finally<\/code> run. If both the body and <code>close()<\/code> throw, the body&#x27;s exception is primary and the close exception is attached via <code>addSuppressed()<\/code>, retrievable through <code>getSuppressed()<\/code>. The resource must implement <code>AutoCloseable<\/code>, and since Java 9 you may reference an existing effectively-final variable in the header.<\/p>", "source": "answers.md", "search": "explain try-with-resources, suppressed exceptions, and the order of resource closing. resources are closed in reverse declaration order, before catch and finally run. if both the body and close() throw, the body's exception is primary and the close exception is attached via addsuppressed(), retrievable through getsuppressed(). the resource must implement autocloseable, and since java 9 you may reference an existing effectively-final variable in the header."}, {"n": 20, "category": 1, "difficulty": "C", "html": "What is the difference between <code>throw<\/code> and <code>throws<\/code>, and between <code>Error<\/code>, <code>Exception<\/code> and <code>RuntimeException<\/code>?", "answerTitle": "`throw`, `throws`, `Error`, `Exception`", "answer": "<p><code>throw<\/code> raises an instance; <code>throws<\/code> declares what a method may propagate. <code>Error<\/code> signals JVM-level conditions you should not catch (<code>OutOfMemoryError<\/code>, <code>StackOverflowError<\/code>); <code>Exception<\/code> is recoverable application-level; <code>RuntimeException<\/code> is the unchecked subset.<\/p><p>Catching <code>Throwable<\/code> is nearly always wrong - it swallows <code>Error<\/code> and, in some frameworks, thread-interruption signalling.<\/p>", "source": "answers.md", "search": "what is the difference between throw and throws, and between error, exception and runtimeexception? throw raises an instance; throws declares what a method may propagate. error signals jvm-level conditions you should not catch (outofmemoryerror, stackoverflowerror); exception is recoverable application-level; runtimeexception is the unchecked subset. catching throwable is nearly always wrong - it swallows error and, in some frameworks, thread-interruption signalling."}, {"n": 21, "category": 1, "difficulty": "D", "html": "Explain generics type erasure. What information survives to runtime, and what does not?", "answerTitle": "Type erasure", "answer": "<p>Generics are compile-time only. After erasure, <code>List&lt;String&gt;<\/code> and <code>List&lt;Integer&gt;<\/code> are both <code>List<\/code>; the compiler inserts casts and bridge methods. What survives: generic signatures in class metadata (readable reflectively via <code>getGenericSuperclass<\/code>, which is how Jackson <code>TypeReference<\/code> and Spring&#x27;s <code>ParameterizedTypeReference<\/code> work). What does not survive: the runtime type of a <em>value<\/em>, so no <code>instanceof List&lt;String&gt;<\/code>, no <code>new T[]<\/code>, no overloads differing only by type parameter.<\/p>", "source": "answers.md", "search": "explain generics type erasure. what information survives to runtime, and what does not? generics are compile-time only. after erasure, list<string and list<integer are both list; the compiler inserts casts and bridge methods. what survives: generic signatures in class metadata (readable reflectively via getgenericsuperclass, which is how jackson typereference and spring's parameterizedtypereference work). what does not survive: the runtime type of a value , so no instanceof list<string , no new t[], no overloads differing only by type parameter."}, {"n": 22, "category": 1, "difficulty": "T", "html": "Why can you not create <code>new T[10]<\/code> in a generic class, and what is the standard workaround?", "answerTitle": "`new T[10]`", "answer": "<p>At runtime <code>T<\/code> is erased to <code>Object<\/code>, so the array would be an <code>Object[]<\/code> masquerading as <code>T[]<\/code>, and any store would need a check the JVM cannot perform. The standard workaround:<\/p><pre><code class=\"lang-java\">@SuppressWarnings(&quot;unchecked&quot;)\nT[] arr = (T[]) new Object[10];         // internal use only\nT[] arr = (T[]) Array.newInstance(clazz, 10); // when caller supplies Class&lt;T&gt;<\/code><\/pre><p>Best answer: use <code>List&lt;T&gt;<\/code> and avoid generic arrays entirely.<\/p>", "source": "answers.md", "search": "why can you not create new t[10] in a generic class, and what is the standard workaround? at runtime t is erased to object, so the array would be an object[] masquerading as t[], and any store would need a check the jvm cannot perform. the standard workaround: java @suppresswarnings(\"unchecked\") t[] arr = (t[]) new object[10]; // internal use only t[] arr = (t[]) array.newinstance(clazz, 10); // when caller supplies class<t best answer: use list<t and avoid generic arrays entirely."}, {"n": 23, "category": 1, "difficulty": "D", "html": "Explain PECS. When do you use <code>? extends T<\/code> versus <code>? super T<\/code>?", "answerTitle": "PECS", "answer": "<p>Producer Extends, Consumer Super. <code>? extends T<\/code> when you only read (<code>List&lt;? extends Number&gt;<\/code> - you can get <code>Number<\/code>, you cannot add). <code>? super T<\/code> when you only write (<code>List&lt;? super Integer&gt;<\/code> - you can add <code>Integer<\/code>, reads give <code>Object<\/code>). Use an exact <code>T<\/code> when you do both.<\/p><p>Signature that shows you understand it: <code>void copy(List&lt;? super T&gt; dst, List&lt;? extends T&gt; src)<\/code>.<\/p>", "source": "answers.md", "search": "explain pecs. when do you use ? extends t versus ? super t? producer extends, consumer super. ? extends t when you only read (list<? extends number - you can get number, you cannot add). ? super t when you only write (list<? super integer - you can add integer, reads give object). use an exact t when you do both. signature that shows you understand it: void copy(list<? super t dst, list<? extends t src)."}, {"n": 24, "category": 1, "difficulty": "T", "html": "<code>List&lt;String&gt;<\/code> cannot be assigned to <code>List&lt;Object&gt;<\/code>, but <code>String[]<\/code> can be assigned to <code>Object[]<\/code>. Explain both, and what runtime exception array covariance causes.", "answerTitle": "Array covariance versus generic invariance", "answer": "<p>Arrays are covariant: <code>String[]<\/code> <em>is a<\/em> <code>Object[]<\/code>. That is unsound and the JVM patches it at runtime with <code>ArrayStoreException<\/code>:<\/p><pre><code class=\"lang-java\">Object[] a = new String[1];\na[0] = 42; // compiles, throws ArrayStoreException<\/code><\/pre><p>Generics are invariant precisely to move that error to compile time. <code>List&lt;String&gt;<\/code> is not a <code>List&lt;Object&gt;<\/code>, because if it were you could insert an <code>Integer<\/code> and the erased runtime could not stop you.<\/p>", "source": "answers.md", "search": "list<string cannot be assigned to list<object , but string[] can be assigned to object[]. explain both, and what runtime exception array covariance causes. arrays are covariant: string[] is a object[]. that is unsound and the jvm patches it at runtime with arraystoreexception: java object[] a = new string[1]; a[0] = 42; // compiles, throws arraystoreexception generics are invariant precisely to move that error to compile time. list<string is not a list<object , because if it were you could insert an integer and the erased runtime could not stop you."}, {"n": 25, "category": 1, "difficulty": "C", "html": "What are records, and what do they give you for free? What are their limits?", "answerTitle": "Records", "answer": "<p>A record generates a canonical constructor, private final fields, accessors (<code>name()<\/code> not <code>getName()<\/code>), and <code>equals<\/code>/<code>hashCode<\/code>/<code>toString<\/code> from all components. They are implicitly final and cannot extend a class.<\/p><p>Limits: shallow immutability only, no JavaBean naming (so some older frameworks need config), and no easy partial-update - though a compact constructor lets you validate and normalize. Ideal for DTOs, value objects, and as sealed-interface implementations.<\/p>", "source": "answers.md", "search": "what are records, and what do they give you for free? what are their limits? a record generates a canonical constructor, private final fields, accessors (name() not getname()), and equals/hashcode/tostring from all components. they are implicitly final and cannot extend a class. limits: shallow immutability only, no javabean naming (so some older frameworks need config), and no easy partial-update - though a compact constructor lets you validate and normalize. ideal for dtos, value objects, and as sealed-interface implementations."}, {"n": 26, "category": 1, "difficulty": "D", "html": "Sealed classes and interfaces - what problem do they solve, and how do they interact with pattern matching?", "answerTitle": "Sealed types", "answer": "<p><code>sealed interface Shape permits Circle, Square<\/code> restricts who may implement it. This gives the compiler a closed set, which makes <code>switch<\/code> pattern matching <em>exhaustive<\/em> - no <code>default<\/code> branch needed, and adding a new subtype breaks compilation everywhere it must be handled. That is exactly what you want for domain modelling: algebraic data types in Java, with the compiler enforcing completeness.<\/p>", "source": "answers.md", "search": "sealed classes and interfaces - what problem do they solve, and how do they interact with pattern matching? sealed interface shape permits circle, square restricts who may implement it. this gives the compiler a closed set, which makes switch pattern matching exhaustive - no default branch needed, and adding a new subtype breaks compilation everywhere it must be handled. that is exactly what you want for domain modelling: algebraic data types in java, with the compiler enforcing completeness."}, {"n": 27, "category": 1, "difficulty": "D", "html": "Explain <code>var<\/code>. Where is it useful and where does it hurt readability?", "answerTitle": "`var`", "answer": "<p>Local variable type inference, compile-time only, still statically typed. Good when the right-hand side already names the type (<code>var repo = new CustomerRepository()<\/code>) or when the type is unpronounceable (nested generics, stream intermediates). Bad when it hides the type from the reader (<code>var result = service.process()<\/code>), and unusable for fields, parameters, or <code>null<\/code> initializers.<\/p>", "source": "answers.md", "search": "explain var. where is it useful and where does it hurt readability? local variable type inference, compile-time only, still statically typed. good when the right-hand side already names the type (var repo = new customerrepository()) or when the type is unpronounceable (nested generics, stream intermediates). bad when it hides the type from the reader (var result = service.process()), and unusable for fields, parameters, or null initializers."}, {"n": 28, "category": 1, "difficulty": "T", "html": "What does <code>Optional.of(null)<\/code> do? When should <code>Optional<\/code> never be used?", "answerTitle": "`Optional.of(null)`", "answer": "<p>Throws <code>NullPointerException<\/code> immediately. Use <code>Optional.ofNullable<\/code> when the value may be null.<\/p><p><code>Optional<\/code> is designed as a <em>return type<\/em> for &quot;no result is normal&quot;. Do not use it for fields (not serializable, adds an allocation per instance), parameters (the caller then has to build one), or collection elements (an empty collection already expresses absence). And never call <code>get()<\/code> without <code>isPresent()<\/code> - use <code>orElseThrow<\/code>, <code>orElseGet<\/code> or <code>map<\/code>.<\/p>", "source": "answers.md", "search": "what does optional.of(null) do? when should optional never be used? throws nullpointerexception immediately. use optional.ofnullable when the value may be null. optional is designed as a return type for \"no result is normal\". do not use it for fields (not serializable, adds an allocation per instance), parameters (the caller then has to build one), or collection elements (an empty collection already expresses absence). and never call get() without ispresent() - use orelsethrow, orelseget or map."}, {"n": 29, "category": 1, "difficulty": "D", "html": "Explain the difference between shallow copy, deep copy, and why <code>Cloneable<\/code> is considered a broken design.", "answerTitle": "Cloning", "answer": "<p><code>Object.clone()<\/code> is a shallow field-by-field copy, so nested mutable objects are shared. <code>Cloneable<\/code> is a marker interface that does not even declare <code>clone()<\/code>, the contract is documented rather than enforced, and it interacts badly with <code>final<\/code> fields and inheritance.<\/p><p>Preferred alternatives: a copy constructor, a static factory, a builder <code>toBuilder()<\/code>, or - best - make the object immutable so copying is unnecessary.<\/p>", "source": "answers.md", "search": "explain the difference between shallow copy, deep copy, and why cloneable is considered a broken design. object.clone() is a shallow field-by-field copy, so nested mutable objects are shared. cloneable is a marker interface that does not even declare clone(), the contract is documented rather than enforced, and it interacts badly with final fields and inheritance. preferred alternatives: a copy constructor, a static factory, a builder tobuilder(), or - best - make the object immutable so copying is unnecessary."}, {"n": 30, "category": 1, "difficulty": "D", "html": "What is the purpose of <code>finalize()<\/code>, why is it deprecated, and what replaced it?", "answerTitle": "`finalize()`", "answer": "<p>Deprecated for removal because it is non-deterministic (may never run), can resurrect objects, delays collection by an extra GC cycle, and exceptions in it are ignored. Replaced by <code>try-with-resources<\/code>/<code>AutoCloseable<\/code> for deterministic cleanup, and <code>java.lang.ref.Cleaner<\/code> for a safety-net that runs on a dedicated thread without resurrection risk.<\/p>", "source": "answers.md", "search": "what is the purpose of finalize(), why is it deprecated, and what replaced it? deprecated for removal because it is non-deterministic (may never run), can resurrect objects, delays collection by an extra gc cycle, and exceptions in it are ignored. replaced by try-with-resources/autocloseable for deterministic cleanup, and java.lang.ref.cleaner for a safety-net that runs on a dedicated thread without resurrection risk."}, {"n": 31, "category": 2, "difficulty": "C", "html": "Internal working of <code>HashMap<\/code>: buckets, hashing, collision handling, resize threshold.", "answerTitle": "`HashMap` internals", "answer": "<p>An array of buckets, sized to a power of two. <code>hash(key)<\/code> spreads the key&#x27;s <code>hashCode<\/code> by XOR-ing its high 16 bits into the low bits (because the index is <code>hash &amp; (n-1)<\/code>, which otherwise ignores high bits). Collisions form a linked list, converting to a red-black tree at 8 entries in a bucket when the table is at least 64 slots, and back to a list at 6. Default capacity 16, load factor 0.75, resize doubles capacity and rehashes. Java 8+ splits a bucket&#x27;s entries into &quot;stay&quot; and &quot;move by oldCapacity&quot; without recomputing hashes.<\/p><p>Pre-size when you know the count: <code>new HashMap&lt;&gt;(expected / 0.75f + 1)<\/code>.<\/p>", "source": "answers.md", "search": "internal working of hashmap: buckets, hashing, collision handling, resize threshold. an array of buckets, sized to a power of two. hash(key) spreads the key's hashcode by xor-ing its high 16 bits into the low bits (because the index is hash & (n-1), which otherwise ignores high bits). collisions form a linked list, converting to a red-black tree at 8 entries in a bucket when the table is at least 64 slots, and back to a list at 6. default capacity 16, load factor 0.75, resize doubles capacity and rehashes. java 8+ splits a bucket's entries into \"stay\" and \"move by oldcapacity\" without recomputing hashes. pre-size when you know the count: new hashmap< (expected / 0.75f + 1)."}, {"n": 32, "category": 2, "difficulty": "D", "html": "When and why does <code>HashMap<\/code> treeify a bucket, and what requirement does treeification place on the key?", "answerTitle": "Treeification", "answer": "<p>Once a bucket exceeds <code>TREEIFY_THRESHOLD<\/code> (8) and the table has at least 64 buckets, the list becomes a red-black tree, turning worst-case lookup from O(n) to O(log n). This was a hardening measure against hash-collision denial-of-service attacks.<\/p><p>It requires ordering: the tree compares by hash, then by <code>Comparable<\/code> if the key implements it, and otherwise falls back to a tie-break on class name and <code>System.identityHashCode<\/code>. So keys that are <code>Comparable<\/code> degrade more gracefully.<\/p>", "source": "answers.md", "search": "when and why does hashmap treeify a bucket, and what requirement does treeification place on the key? once a bucket exceeds treeify_threshold (8) and the table has at least 64 buckets, the list becomes a red-black tree, turning worst-case lookup from o(n) to o(log n). this was a hardening measure against hash-collision denial-of-service attacks. it requires ordering: the tree compares by hash, then by comparable if the key implements it, and otherwise falls back to a tie-break on class name and system.identityhashcode. so keys that are comparable degrade more gracefully."}, {"n": 33, "category": 2, "difficulty": "T", "html": "What happens if you use <code>HashMap<\/code> concurrently from multiple threads? What was the classic infinite-loop bug and is it still present?", "answerTitle": "Concurrent `HashMap` misuse", "answer": "<p>Undefined behavior: lost updates, entries visible to one thread and not another, corrupted size. The classic Java 7 bug was an infinite loop in <code>get()<\/code> because concurrent resize reversed a bucket&#x27;s linked list and created a cycle, pinning a CPU core at 100 percent.<\/p><p>Java 8 changed resize to preserve order, so the infinite loop is gone - but the map is still not thread-safe: lost updates and infinite loops during treeification remain possible. Use <code>ConcurrentHashMap<\/code>.<\/p><blockquote><p><em>Hook: a production CPU spike traced to a shared non-concurrent map in a cache layer.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "what happens if you use hashmap concurrently from multiple threads? what was the classic infinite-loop bug and is it still present? undefined behavior: lost updates, entries visible to one thread and not another, corrupted size. the classic java 7 bug was an infinite loop in get() because concurrent resize reversed a bucket's linked list and created a cycle, pinning a cpu core at 100 percent. java 8 changed resize to preserve order, so the infinite loop is gone - but the map is still not thread-safe: lost updates and infinite loops during treeification remain possible. use concurrenthashmap. hook: a production cpu spike traced to a shared non-concurrent map in a cache layer."}, {"n": 34, "category": 2, "difficulty": "D", "html": "<code>ConcurrentHashMap<\/code> internals: how does it achieve concurrency without a global lock, and how does <code>size()<\/code> behave?", "answerTitle": "`ConcurrentHashMap`", "answer": "<p>Java 8 dropped segment locking. Now it locks the <em>first node of a bucket<\/em> with <code>synchronized<\/code> and uses CAS for empty-bucket insertion, so contention only occurs between threads touching the same bucket. Reads are lock-free (<code>volatile<\/code> node fields). Resize is cooperative: writing threads help transfer buckets.<\/p><p><code>size()<\/code> is an approximation derived from a striped counter (<code>LongAdder<\/code>-style) and is not a consistent snapshot; iterators are weakly consistent - they never throw <code>ConcurrentModificationException<\/code> but may or may not reflect concurrent writes. Null keys and values are forbidden, precisely so <code>get()<\/code> returning <code>null<\/code> unambiguously means &quot;absent&quot;.<\/p><p>Also: <code>computeIfAbsent<\/code> holds the bucket lock, so the mapping function must not update the same map - that deadlocks.<\/p>", "source": "answers.md", "search": "concurrenthashmap internals: how does it achieve concurrency without a global lock, and how does size() behave? java 8 dropped segment locking. now it locks the first node of a bucket with synchronized and uses cas for empty-bucket insertion, so contention only occurs between threads touching the same bucket. reads are lock-free (volatile node fields). resize is cooperative: writing threads help transfer buckets. size() is an approximation derived from a striped counter (longadder-style) and is not a consistent snapshot; iterators are weakly consistent - they never throw concurrentmodificationexception but may or may not reflect concurrent writes. null keys and values are forbidden, precisely so get() returning null unambiguously means \"absent\". also: computeifabsent holds the bucket lock, so the mapping function must not update the same map - that deadlocks."}, {"n": 35, "category": 2, "difficulty": "C", "html": "<code>ArrayList<\/code> versus <code>LinkedList<\/code> - and why is <code>LinkedList<\/code> almost always the wrong choice in practice?", "answerTitle": "`ArrayList` versus `LinkedList`", "answer": "<p><code>ArrayList<\/code> is a contiguous array: O(1) indexed access, amortized O(1) append, O(n) middle insert due to <code>System.arraycopy<\/code> - which is extremely fast, being a vectorized memory move.<\/p><p><code>LinkedList<\/code> gives O(1) insertion <em>only if you already hold the node<\/em>, which via the <code>List<\/code> API you never do, since reaching position n costs O(n) traversal. Add poor cache locality and 40 bytes of overhead per element, and <code>ArrayList<\/code> wins in practice almost always. <code>LinkedList<\/code> is defensible only as a <code>Deque<\/code>, and <code>ArrayDeque<\/code> beats it there too.<\/p>", "source": "answers.md", "search": "arraylist versus linkedlist - and why is linkedlist almost always the wrong choice in practice? arraylist is a contiguous array: o(1) indexed access, amortized o(1) append, o(n) middle insert due to system.arraycopy - which is extremely fast, being a vectorized memory move. linkedlist gives o(1) insertion only if you already hold the node , which via the list api you never do, since reaching position n costs o(n) traversal. add poor cache locality and 40 bytes of overhead per element, and arraylist wins in practice almost always. linkedlist is defensible only as a deque, and arraydeque beats it there too."}, {"n": 36, "category": 2, "difficulty": "D", "html": "Explain fail-fast versus fail-safe iterators and <code>ConcurrentModificationException<\/code>.", "answerTitle": "Fail-fast versus fail-safe", "answer": "<p>Fail-fast iterators (<code>ArrayList<\/code>, <code>HashMap<\/code>) track a <code>modCount<\/code>; structural modification during iteration makes the next <code>next()<\/code> throw <code>ConcurrentModificationException<\/code>. It is a bug-detection heuristic, explicitly not a guarantee.<\/p><p>Fail-safe (<code>CopyOnWriteArrayList<\/code>, <code>ConcurrentHashMap<\/code>) iterate a snapshot or are weakly consistent, so no exception but possibly stale data.<\/p><p>Safe removal during iteration: <code>iterator.remove()<\/code>, or <code>removeIf()<\/code>.<\/p>", "source": "answers.md", "search": "explain fail-fast versus fail-safe iterators and concurrentmodificationexception. fail-fast iterators (arraylist, hashmap) track a modcount; structural modification during iteration makes the next next() throw concurrentmodificationexception. it is a bug-detection heuristic, explicitly not a guarantee. fail-safe (copyonwritearraylist, concurrenthashmap) iterate a snapshot or are weakly consistent, so no exception but possibly stale data. safe removal during iteration: iterator.remove(), or removeif()."}, {"n": 37, "category": 2, "difficulty": "T", "html": "You remove an element from a list inside an enhanced for loop and no exception is thrown. Explain when that is possible.", "answerTitle": "Removing in a for-each without an exception", "answer": "<p>The check happens in <code>next()<\/code>, not <code>remove()<\/code>. If you remove the <strong>second-to-last<\/strong> element, <code>hasNext()<\/code> compares <code>cursor != size<\/code>, which now accidentally matches, the loop exits early and <code>next()<\/code> is never called again - so no exception and one element silently skipped. That is worse than the exception.<\/p><p>Same trap applies when iterating a concurrent collection, or when the modification happens on a different structure than the one being iterated.<\/p>", "source": "answers.md", "search": "you remove an element from a list inside an enhanced for loop and no exception is thrown. explain when that is possible. the check happens in next(), not remove(). if you remove the second-to-last element, hasnext() compares cursor != size, which now accidentally matches, the loop exits early and next() is never called again - so no exception and one element silently skipped. that is worse than the exception. same trap applies when iterating a concurrent collection, or when the modification happens on a different structure than the one being iterated."}, {"n": 38, "category": 2, "difficulty": "C", "html": "<code>HashSet<\/code> versus <code>TreeSet<\/code> versus <code>LinkedHashSet<\/code> - complexity and ordering guarantees.", "answerTitle": "Set implementations", "answer": "<p><code>HashSet<\/code>: O(1) average, no order, backed by <code>HashMap<\/code>. <code>LinkedHashSet<\/code>: O(1), insertion order preserved via a doubly-linked list. <code>TreeSet<\/code>: O(log n), sorted by <code>Comparable<\/code>/<code>Comparator<\/code>, backed by a red-black tree, and gives you navigation (<code>floor<\/code>, <code>ceiling<\/code>, <code>subSet<\/code>).<\/p>", "source": "answers.md", "search": "hashset versus treeset versus linkedhashset - complexity and ordering guarantees. hashset: o(1) average, no order, backed by hashmap. linkedhashset: o(1), insertion order preserved via a doubly-linked list. treeset: o(log n), sorted by comparable/comparator, backed by a red-black tree, and gives you navigation (floor, ceiling, subset)."}, {"n": 39, "category": 2, "difficulty": "D", "html": "<code>Comparable<\/code> versus <code>Comparator<\/code>. What is the contract, and what breaks if the comparison is inconsistent with equals?", "answerTitle": "`Comparable` versus `Comparator`", "answer": "<p><code>Comparable<\/code> is the natural ordering defined on the type; <code>Comparator<\/code> is an external, swappable ordering. The contract requires antisymmetry, transitivity, and consistency - and <code>TimSort<\/code> will actively throw <code>IllegalArgumentException: Comparison method violates its general contract!<\/code> if you break transitivity.<\/p><p>Inconsistency with <code>equals<\/code> is legal but surprising: a <code>TreeSet<\/code> deduplicates using <code>compareTo<\/code>, so two objects that are unequal but compare as 0 will silently collapse into one element.<\/p>", "source": "answers.md", "search": "comparable versus comparator. what is the contract, and what breaks if the comparison is inconsistent with equals? comparable is the natural ordering defined on the type; comparator is an external, swappable ordering. the contract requires antisymmetry, transitivity, and consistency - and timsort will actively throw illegalargumentexception: comparison method violates its general contract! if you break transitivity. inconsistency with equals is legal but surprising: a treeset deduplicates using compareto, so two objects that are unequal but compare as 0 will silently collapse into one element."}, {"n": 40, "category": 2, "difficulty": "T", "html": "A <code>Comparator<\/code> returns <code>a.value - b.value<\/code> for ints. What is the bug?", "answerTitle": "`a.value - b.value`", "answer": "<p>Integer overflow. If <code>a.value = Integer.MAX_VALUE<\/code> and <code>b.value = -1<\/code>, the subtraction wraps to a negative number and the comparator reports the wrong order, which then corrupts sorting and <code>TreeMap<\/code> structure.<\/p><p>Use <code>Integer.compare(a.value, b.value)<\/code> or <code>Comparator.comparingInt(X::getValue)<\/code>.<\/p>", "source": "answers.md", "search": "a comparator returns a.value - b.value for ints. what is the bug? integer overflow. if a.value = integer.max_value and b.value = -1, the subtraction wraps to a negative number and the comparator reports the wrong order, which then corrupts sorting and treemap structure. use integer.compare(a.value, b.value) or comparator.comparingint(x::getvalue)."}, {"n": 41, "category": 2, "difficulty": "D", "html": "How do you choose between <code>ConcurrentHashMap<\/code>, <code>Collections.synchronizedMap<\/code> and <code>Hashtable<\/code>?", "answerTitle": "Choosing a concurrent map", "answer": "<p><code>ConcurrentHashMap<\/code> for essentially all new code: fine-grained locking, lock-free reads, atomic <code>compute<\/code>/<code>merge<\/code>/<code>putIfAbsent<\/code>. <code>Collections.synchronizedMap<\/code> wraps every method in one lock, so it serializes all access and still requires manual synchronization around iteration. <code>Hashtable<\/code> is legacy - same global lock plus no-null semantics.<\/p><p>Caveat: <code>ConcurrentHashMap<\/code> makes individual operations atomic, not sequences of them. Check-then-act still needs <code>compute<\/code> or an explicit lock.<\/p>", "source": "answers.md", "search": "how do you choose between concurrenthashmap, collections.synchronizedmap and hashtable? concurrenthashmap for essentially all new code: fine-grained locking, lock-free reads, atomic compute/merge/putifabsent. collections.synchronizedmap wraps every method in one lock, so it serializes all access and still requires manual synchronization around iteration. hashtable is legacy - same global lock plus no-null semantics. caveat: concurrenthashmap makes individual operations atomic, not sequences of them. check-then-act still needs compute or an explicit lock."}, {"n": 42, "category": 2, "difficulty": "D", "html": "Explain <code>BlockingQueue<\/code> implementations and where each fits in a producer-consumer design.", "answerTitle": "`BlockingQueue`", "answer": "<p><code>ArrayBlockingQueue<\/code> is bounded and array-backed with a single lock - predictable memory, natural backpressure. <code>LinkedBlockingQueue<\/code> has separate put/take locks so higher throughput, but is unbounded by default which is how you get an <code>OutOfMemoryError<\/code> instead of backpressure - always pass a capacity. <code>SynchronousQueue<\/code> has zero capacity and hands off directly (what <code>newCachedThreadPool<\/code> uses). <code>PriorityBlockingQueue<\/code> is unbounded and ordered. <code>DelayQueue<\/code> releases elements only after their delay expires - useful for scheduled retries.<\/p>", "source": "answers.md", "search": "explain blockingqueue implementations and where each fits in a producer-consumer design. arrayblockingqueue is bounded and array-backed with a single lock - predictable memory, natural backpressure. linkedblockingqueue has separate put/take locks so higher throughput, but is unbounded by default which is how you get an outofmemoryerror instead of backpressure - always pass a capacity. synchronousqueue has zero capacity and hands off directly (what newcachedthreadpool uses). priorityblockingqueue is unbounded and ordered. delayqueue releases elements only after their delay expires - useful for scheduled retries."}, {"n": 43, "category": 2, "difficulty": "D", "html": "<code>CopyOnWriteArrayList<\/code> - how it works and the exact workload where it wins.", "answerTitle": "`CopyOnWriteArrayList`", "answer": "<p>Every mutation copies the whole backing array under a lock; reads are completely lock-free and iterate an immutable snapshot. Cost is O(n) per write plus garbage.<\/p><p>Wins only when reads massively outnumber writes and the collection is small: listener/observer registries, cached configuration, security filter chains. It is a disaster for anything write-heavy.<\/p>", "source": "answers.md", "search": "copyonwritearraylist - how it works and the exact workload where it wins. every mutation copies the whole backing array under a lock; reads are completely lock-free and iterate an immutable snapshot. cost is o(n) per write plus garbage. wins only when reads massively outnumber writes and the collection is small: listener/observer registries, cached configuration, security filter chains. it is a disaster for anything write-heavy."}, {"n": 44, "category": 2, "difficulty": "C", "html": "What is the time complexity of <code>contains()<\/code> on <code>ArrayList<\/code>, <code>HashSet<\/code> and <code>TreeSet<\/code>?", "answerTitle": "`contains()` complexity", "answer": "<p><code>ArrayList<\/code> O(n), <code>HashSet<\/code> O(1) average and O(log n) worst case after treeification, <code>TreeSet<\/code> O(log n). The classic performance fix in code review is a <code>List.contains<\/code> inside a loop, turning O(n²) into O(n) by switching to a <code>HashSet<\/code>.<\/p>", "source": "answers.md", "search": "what is the time complexity of contains() on arraylist, hashset and treeset? arraylist o(n), hashset o(1) average and o(log n) worst case after treeification, treeset o(log n). the classic performance fix in code review is a list.contains inside a loop, turning o(n²) into o(n) by switching to a hashset."}, {"n": 45, "category": 2, "difficulty": "T", "html": "Why does <code>Arrays.asList()<\/code> throw <code>UnsupportedOperationException<\/code> on <code>add()<\/code> but allow <code>set()<\/code>?", "answerTitle": "`Arrays.asList()`", "answer": "<p>It returns a fixed-size <em>view backed by the original array<\/em>, not an <code>ArrayList<\/code> (it is the private <code>Arrays$ArrayList<\/code>). <code>set()<\/code> writes through to the array so it is supported; <code>add<\/code>/<code>remove<\/code> would change the length, which an array cannot do, hence <code>UnsupportedOperationException<\/code>.<\/p><p>Extra trap: <code>Arrays.asList(intArray)<\/code> with a primitive array gives you a single-element <code>List&lt;int[]&gt;<\/code>.<\/p>", "source": "answers.md", "search": "why does arrays.aslist() throw unsupportedoperationexception on add() but allow set()? it returns a fixed-size view backed by the original array , not an arraylist (it is the private arrays$arraylist). set() writes through to the array so it is supported; add/remove would change the length, which an array cannot do, hence unsupportedoperationexception. extra trap: arrays.aslist(intarray) with a primitive array gives you a single-element list<int[] ."}, {"n": 46, "category": 2, "difficulty": "T", "html": "<code>List.of(...)<\/code> versus <code>Arrays.asList(...)<\/code> versus <code>new ArrayList&lt;&gt;()<\/code> - three different null and mutability behaviors. Name them.", "answerTitle": "Three list factories", "answer": "<ul><li><code>new ArrayList&lt;&gt;()<\/code> - fully mutable, allows nulls and duplicates.<\/li><li><code>Arrays.asList(...)<\/code> - fixed size, <code>set<\/code> allowed, allows nulls, writes through to the array.<\/li><li><code>List.of(...)<\/code> - fully immutable, <strong>throws <code>NullPointerException<\/code> on null elements<\/strong>, and its iteration order is stable but <code>Set.of<\/code>/<code>Map.of<\/code> deliberately randomize iteration order per JVM run to stop you depending on it.<\/li><\/ul>", "source": "answers.md", "search": "list.of(...) versus arrays.aslist(...) versus new arraylist< () - three different null and mutability behaviors. name them. - new arraylist< () - fully mutable, allows nulls and duplicates. - arrays.aslist(...) - fixed size, set allowed, allows nulls, writes through to the array. - list.of(...) - fully immutable, throws nullpointerexception on null elements , and its iteration order is stable but set.of/map.of deliberately randomize iteration order per jvm run to stop you depending on it."}, {"n": 47, "category": 3, "difficulty": "C", "html": "Intermediate versus terminal operations. Why is a stream without a terminal operation a no-op?", "answerTitle": "Intermediate versus terminal", "answer": "<p>Intermediate operations (<code>map<\/code>, <code>filter<\/code>, <code>sorted<\/code>) return a stream and are lazy - they only build a pipeline. Nothing executes until a terminal operation (<code>collect<\/code>, <code>forEach<\/code>, <code>reduce<\/code>, <code>findFirst<\/code>) pulls elements through. So a pipeline with no terminal operation does literally nothing, which is a real bug when someone calls <code>list.stream().map(this::save)<\/code> and expects side effects.<\/p>", "source": "answers.md", "search": "intermediate versus terminal operations. why is a stream without a terminal operation a no-op? intermediate operations (map, filter, sorted) return a stream and are lazy - they only build a pipeline. nothing executes until a terminal operation (collect, foreach, reduce, findfirst) pulls elements through. so a pipeline with no terminal operation does literally nothing, which is a real bug when someone calls list.stream().map(this::save) and expects side effects."}, {"n": 48, "category": 3, "difficulty": "D", "html": "Explain lazy evaluation and short-circuiting in streams with an example.", "answerTitle": "Laziness and short-circuiting", "answer": "<p>Elements are pushed through the whole pipeline one at a time, not stage by stage. <code>list.stream().filter(...).map(...).findFirst()<\/code> stops at the first match instead of mapping everything. Short-circuiting operations: <code>findFirst<\/code>, <code>findAny<\/code>, <code>anyMatch<\/code>, <code>allMatch<\/code>, <code>noneMatch<\/code>, <code>limit<\/code>. This is what makes infinite streams (<code>Stream.iterate(...).limit(n)<\/code>) usable.<\/p>", "source": "answers.md", "search": "explain lazy evaluation and short-circuiting in streams with an example. elements are pushed through the whole pipeline one at a time, not stage by stage. list.stream().filter(...).map(...).findfirst() stops at the first match instead of mapping everything. short-circuiting operations: findfirst, findany, anymatch, allmatch, nonematch, limit. this is what makes infinite streams (stream.iterate(...).limit(n)) usable."}, {"n": 49, "category": 3, "difficulty": "T", "html": "What happens if you reuse a stream after a terminal operation?", "answerTitle": "Reusing a stream", "answer": "<p><code>IllegalStateException: stream has already been operated upon or closed<\/code>. A stream is single-use. If you need two passes, either re-create it from the source, or use a <code>Supplier&lt;Stream&lt;T&gt;&gt;<\/code>, or collect once and iterate the collection.<\/p>", "source": "answers.md", "search": "what happens if you reuse a stream after a terminal operation? illegalstateexception: stream has already been operated upon or closed. a stream is single-use. if you need two passes, either re-create it from the source, or use a supplier<stream<t , or collect once and iterate the collection."}, {"n": 50, "category": 3, "difficulty": "D", "html": "<code>map<\/code> versus <code>flatMap<\/code>. Give a real use case for <code>flatMap<\/code> beyond flattening lists.", "answerTitle": "`map` versus `flatMap`", "answer": "<p><code>map<\/code> is 1-to-1, <code>flatMap<\/code> is 1-to-many and flattens one level. Beyond flattening nested collections, the important use is unwrapping containers: <code>Optional.flatMap<\/code> to chain lookups that each may be empty, and <code>CompletableFuture.thenCompose<\/code> (the same concept) to avoid <code>Future&lt;Future&lt;T&gt;&gt;<\/code>. Also <code>stream.flatMap(line -&gt; Arrays.stream(line.split(&quot; &quot;)))<\/code> for tokenizing.<\/p>", "source": "answers.md", "search": "map versus flatmap. give a real use case for flatmap beyond flattening lists. map is 1-to-1, flatmap is 1-to-many and flattens one level. beyond flattening nested collections, the important use is unwrapping containers: optional.flatmap to chain lookups that each may be empty, and completablefuture.thencompose (the same concept) to avoid future<future<t . also stream.flatmap(line - arrays.stream(line.split(\" \"))) for tokenizing."}, {"n": 51, "category": 3, "difficulty": "T", "html": "<code>Collectors.toMap<\/code> with duplicate keys - what happens, and how do you fix it?", "answerTitle": "`Collectors.toMap` duplicate keys", "answer": "<p>Throws <code>IllegalStateException: Duplicate key<\/code>. Supply a merge function:<\/p><pre><code class=\"lang-java\">.collect(Collectors.toMap(User::getId, u -&gt; u, (a, b) -&gt; b));<\/code><\/pre><p>Second trap: the two-argument <code>toMap<\/code> throws <code>NullPointerException<\/code> if a <em>value<\/em> is null (unlike <code>HashMap<\/code>), because it uses <code>map.merge<\/code> internally. If values may be null, use <code>groupingBy<\/code> or collect manually.<\/p>", "source": "answers.md", "search": "collectors.tomap with duplicate keys - what happens, and how do you fix it? throws illegalstateexception: duplicate key. supply a merge function: java .collect(collectors.tomap(user::getid, u - u, (a, b) - b)); second trap: the two-argument tomap throws nullpointerexception if a value is null (unlike hashmap), because it uses map.merge internally. if values may be null, use groupingby or collect manually."}, {"n": 52, "category": 3, "difficulty": "D", "html": "When do parallel streams actually help, and what are the three conditions that must hold?", "answerTitle": "When parallel streams help", "answer": "<p>Three conditions, all required: the data set is large enough that per-element work dominates fork/join overhead (rule of thumb, N × cost &gt; ~100 microseconds), the source splits cheaply and evenly (arrays, <code>ArrayList<\/code>, <code>IntStream.range<\/code> - not <code>LinkedList<\/code>, <code>Iterator<\/code>-based sources, or <code>BufferedReader.lines<\/code>), and the operations are stateless, associative and side-effect free.<\/p><p>Also, the terminal operation must not be a cheap merge that gets swamped by combining cost - <code>collect(toList())<\/code> on a parallel stream is often slower than sequential.<\/p>", "source": "answers.md", "search": "when do parallel streams actually help, and what are the three conditions that must hold? three conditions, all required: the data set is large enough that per-element work dominates fork/join overhead (rule of thumb, n × cost ~100 microseconds), the source splits cheaply and evenly (arrays, arraylist, intstream.range - not linkedlist, iterator-based sources, or bufferedreader.lines), and the operations are stateless, associative and side-effect free. also, the terminal operation must not be a cheap merge that gets swamped by combining cost - collect(tolist()) on a parallel stream is often slower than sequential."}, {"n": 53, "category": 3, "difficulty": "T", "html": "Why is using a parallel stream inside a servlet request handler often a bad idea? Which pool does it use?", "answerTitle": "Parallel streams in a request handler", "answer": "<p>They use the shared <code>ForkJoinPool.commonPool<\/code>, sized to <code>availableProcessors - 1<\/code> for the entire JVM. One slow parallel stream - especially one doing blocking IO - starves every other parallel stream in the process, and in a container the processor count may be misdetected.<\/p><p>If you must, submit the stream inside your own <code>ForkJoinPool<\/code> (<code>pool.submit(() -&gt; stream.parallel()...).get()<\/code>), or better, use an <code>ExecutorService<\/code> or virtual threads for IO-bound fan-out. Parallel streams are for CPU-bound work, never for IO.<\/p>", "source": "answers.md", "search": "why is using a parallel stream inside a servlet request handler often a bad idea? which pool does it use? they use the shared forkjoinpool.commonpool, sized to availableprocessors - 1 for the entire jvm. one slow parallel stream - especially one doing blocking io - starves every other parallel stream in the process, and in a container the processor count may be misdetected. if you must, submit the stream inside your own forkjoinpool (pool.submit(() - stream.parallel()...).get()), or better, use an executorservice or virtual threads for io-bound fan-out. parallel streams are for cpu-bound work, never for io."}, {"n": 54, "category": 3, "difficulty": "D", "html": "Explain <code>reduce<\/code> versus <code>collect<\/code>. Why is <code>collect<\/code> preferred for mutable accumulation?", "answerTitle": "`reduce` versus `collect`", "answer": "<p><code>reduce<\/code> is for immutable accumulation with an associative function returning a new value each time; <code>collect<\/code> is a mutable reduction with a supplier, accumulator and combiner, so it reuses containers.<\/p><p>Doing string concatenation with <code>reduce<\/code> is O(n²) because each step allocates a new <code>String<\/code>; <code>Collectors.joining()<\/code> uses one <code>StringBuilder<\/code>. The general rule: if the accumulator is a container, use <code>collect<\/code>.<\/p>", "source": "answers.md", "search": "explain reduce versus collect. why is collect preferred for mutable accumulation? reduce is for immutable accumulation with an associative function returning a new value each time; collect is a mutable reduction with a supplier, accumulator and combiner, so it reuses containers. doing string concatenation with reduce is o(n²) because each step allocates a new string; collectors.joining() uses one stringbuilder. the general rule: if the accumulator is a container, use collect."}, {"n": 55, "category": 3, "difficulty": "T", "html": "What is wrong with using a stateful lambda in <code>map()<\/code> on a parallel stream?", "answerTitle": "Stateful lambda in a parallel stream", "answer": "<p>Results become non-deterministic and possibly corrupt. The stream contract requires the mapper to be stateless; with a shared mutable variable you get a data race, and even with an <code>AtomicInteger<\/code> the <em>order<\/em> of invocation is unspecified, so an index-assigning lambda produces different results per run. Restructure to carry state in the element, or collect to an ordered result and post-process.<\/p>", "source": "answers.md", "search": "what is wrong with using a stateful lambda in map() on a parallel stream? results become non-deterministic and possibly corrupt. the stream contract requires the mapper to be stateless; with a shared mutable va
