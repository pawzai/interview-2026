tion, and it is the mechanism for deprecating a property gracefully (@deprecatedconfigurationproperty with a replacement) so forty consuming teams see a warning in their ide rather than discovering the change at runtime. i treat missing metadata in a platform starter as a defect."}, {"n": 38, "category": 2, "difficulty": "D", "html": "<code>@RefreshScope<\/code> - the mechanism, and what it does <em>not<\/em> refresh.", "answerTitle": "`@RefreshScope`", "answer": "<p>A <code>@RefreshScope<\/code> bean is a scoped proxy over a bean stored in a refreshable scope. On <code>/actuator/refresh<\/code> or a Config Server bus event, the cached instance is discarded; the next method call recreates it with the new <code>Environment<\/code> values.<\/p><p>Its limits are what matter: it only affects beans in that scope, so a value injected into a <em>singleton<\/em> is not refreshed; <code>@ConfigurationProperties<\/code> beans are rebound but objects constructed <em>from<\/em> them at startup are not; and infrastructure already built with the old value - a connection pool, a <code>WebClient<\/code> with a base URL, a Kafka consumer - keeps the old configuration. Recreating a <code>DataSource<\/code> at runtime is also genuinely risky.<\/p><p>So it works for simple behavioral flags and thresholds. For anything structural I prefer a restart or a rolling deployment, because a partially refreshed application is harder to reason about than a restarted one.<\/p>", "source": "answers.md", "search": "@refreshscope - the mechanism, and what it does not refresh. a @refreshscope bean is a scoped proxy over a bean stored in a refreshable scope. on /actuator/refresh or a config server bus event, the cached instance is discarded; the next method call recreates it with the new environment values. its limits are what matter: it only affects beans in that scope, so a value injected into a singleton is not refreshed; @configurationproperties beans are rebound but objects constructed from them at startup are not; and infrastructure already built with the old value - a connection pool, a webclient with a base url, a kafka consumer - keeps the old configuration. recreating a datasource at runtime is also genuinely risky. so it works for simple behavioral flags and thresholds. for anything structural i prefer a restart or a rolling deployment, because a partially refreshed application is harder to reason about than a restarted one."}, {"n": 39, "category": 2, "difficulty": "D", "html": "SpEL - where is it evaluated, what can it reach, and what is the injection risk if user input reaches an expression?", "answerTitle": "SpEL", "answer": "<p>SpEL is evaluated by the container at bean creation for <code>@Value(&quot;#{...}&quot;)<\/code>, and at invocation time for <code>@PreAuthorize<\/code>, <code>@Cacheable(key)<\/code>, <code>@EventListener(condition)<\/code> and similar. It can read bean properties, call methods, index collections, and reference other beans by name (<code>@beanName<\/code>), which makes it powerful and dangerous.<\/p><p>The injection risk is real: SpEL can invoke arbitrary methods including <code>T(java.lang.Runtime).getRuntime().exec(...)<\/code>. <strong>Never build a SpEL expression from user input<\/strong> - that is remote code execution, and it has been the mechanism behind several high-profile Spring CVEs. Expressions must be static strings in code; user data may only arrive as <em>parameters<\/em> referenced by the expression (<code>#userId<\/code>), never as expression text.<\/p>", "source": "answers.md", "search": "spel - where is it evaluated, what can it reach, and what is the injection risk if user input reaches an expression? spel is evaluated by the container at bean creation for @value(\" {...}\"), and at invocation time for @preauthorize, @cacheable(key), @eventlistener(condition) and similar. it can read bean properties, call methods, index collections, and reference other beans by name (@beanname), which makes it powerful and dangerous. the injection risk is real: spel can invoke arbitrary methods including t(java.lang.runtime).getruntime().exec(...). never build a spel expression from user input - that is remote code execution, and it has been the mechanism behind several high-profile spring cves. expressions must be static strings in code; user data may only arrive as parameters referenced by the expression ( userid), never as expression text."}, {"n": 40, "category": 2, "difficulty": "T", "html": "<code>${...}<\/code> versus <code>#{...}<\/code> - when is each resolved, and can they be nested?", "answerTitle": "`${}` versus `#{}`", "answer": "<p><code>${...}<\/code> is a property placeholder, resolved by <code>PropertySourcesPlaceholderConfigurer<\/code> against the <code>Environment<\/code>. <code>#{...}<\/code> is SpEL, evaluated by the expression parser against the bean factory.<\/p><p>Placeholders are resolved <strong>first<\/strong>, so nesting works in one direction only: <code>#{&#x27;${app.list}&#x27;.split(&#x27;,&#x27;)}<\/code> is valid because the placeholder is substituted into the expression before parsing. The reverse - a SpEL result used as a property key - does not work.<\/p><p>Practical guidance: use <code>${}<\/code> for configuration, and reach for <code>#{}<\/code> only when you need computation. Most <code>#{}<\/code> usage in application code is better expressed as a <code>@ConfigurationProperties<\/code> field with a typed converter.<\/p>", "source": "answers.md", "search": "${...} versus {...} - when is each resolved, and can they be nested? ${...} is a property placeholder, resolved by propertysourcesplaceholderconfigurer against the environment. {...} is spel, evaluated by the expression parser against the bean factory. placeholders are resolved first , so nesting works in one direction only: {'${app.list}'.split(',')} is valid because the placeholder is substituted into the expression before parsing. the reverse - a spel result used as a property key - does not work. practical guidance: use ${} for configuration, and reach for {} only when you need computation. most {} usage in application code is better expressed as a @configurationproperties field with a typed converter."}, {"n": 41, "category": 2, "difficulty": "D", "html": "How do you externalize secrets so they never appear in <code>/actuator/env<\/code>, a heap dump, or a log line?", "answerTitle": "Keeping secrets out of the process", "answer": "<p>Layered, because any single control leaks eventually:<\/p><ul><li>Load from Secrets Manager or Parameter Store via <code>spring.config.import<\/code>, with the workload assuming an IAM role - no static credentials anywhere.<\/li><li>Never put secrets in <code>@ConfigurationProperties<\/code> objects that Actuator can serialize; Boot sanitizes keys matching <code>password<\/code>, <code>secret<\/code>, <code>key<\/code>, <code>token<\/code> and URIs with credentials, but it sanitizes by <strong>key name<\/strong>, so a field called <code>connectionString<\/code> or <code>dsn<\/code> containing a password is printed in full.<\/li><li>Set <code>management.endpoint.env.show-values=never<\/code> and <code>management.endpoint.configprops.show-values=never<\/code> (Boot 3), and keep <code>/env<\/code>, <code>/configprops<\/code> and <code>/heapdump<\/code> off the exposed set entirely.<\/li><li>Wrap secret values in a holder type whose <code>toString()<\/code> returns <code>****<\/code>, so an accidental log statement or exception message cannot leak them.<\/li><li>For the highest sensitivity, fetch at use time with a short cache rather than binding at startup, so the value is not resident for the process lifetime and rotation takes effect without a restart.<\/li><\/ul><p>Plus the basics: secret scanning in CI and pre-commit, and treating any secret that reaches git history as compromised.<\/p>", "source": "answers.md", "search": "how do you externalize secrets so they never appear in /actuator/env, a heap dump, or a log line? layered, because any single control leaks eventually: - load from secrets manager or parameter store via spring.config.import, with the workload assuming an iam role - no static credentials anywhere. - never put secrets in @configurationproperties objects that actuator can serialize; boot sanitizes keys matching password, secret, key, token and uris with credentials, but it sanitizes by key name , so a field called connectionstring or dsn containing a password is printed in full. - set management.endpoint.env.show-values=never and management.endpoint.configprops.show-values=never (boot 3), and keep /env, /configprops and /heapdump off the exposed set entirely. - wrap secret values in a holder type whose tostring() returns , so an accidental log statement or exception message cannot leak them. - for the highest sensitivity, fetch at use time with a short cache rather than binding at startup, so the value is not resident for the process lifetime and rotation takes effect without a restart. plus the basics: secret scanning in ci and pre-commit, and treating any secret that reaches git history as compromised."}, {"n": 42, "category": 2, "difficulty": "A", "html": "How do you manage configuration across 40 services without copy-paste drift?", "answerTitle": "Configuration across 40 services", "answer": "<p>I separate three kinds of configuration, because conflating them is what creates drift:<\/p><ol><li><strong>Platform defaults<\/strong> - timeouts, connection pool sizing, logging format, metrics tags, security headers. These belong in a shared starter with sensible defaults and <code>@ConditionalOnMissingBean<\/code> back-off, so a team gets them by adding one dependency and can override any of them. Versioned and released like any library.<\/li><li><strong>Environment configuration<\/strong> - endpoints, credentials, capacity. These come from the deployment mechanism: Parameter Store or Secrets Manager per environment, injected via <code>spring.config.import<\/code>, defined in the same Terraform that creates the resource being pointed at. That way the URL and the thing it points to cannot drift apart.<\/li><li><strong>Service-specific configuration<\/strong> - genuinely local, lives in the repository as <code>@ConfigurationProperties<\/code> with validation.<\/li><\/ol><p>Then enforcement: a startup check that fails if a required platform property is missing, metadata so overrides are discoverable, and a periodic report of which services are on which starter version. What I explicitly avoid is a central Config Server as the runtime source of truth on Kubernetes - it adds a hard startup dependency and a new outage mode for a problem the platform already solves.<\/p><blockquote><p><em>Hook: the shared starter you built or adopted, and the drift it eliminated.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you manage configuration across 40 services without copy-paste drift? i separate three kinds of configuration, because conflating them is what creates drift: 1. platform defaults - timeouts, connection pool sizing, logging format, metrics tags, security headers. these belong in a shared starter with sensible defaults and @conditionalonmissingbean back-off, so a team gets them by adding one dependency and can override any of them. versioned and released like any library. 2. environment configuration - endpoints, credentials, capacity. these come from the deployment mechanism: parameter store or secrets manager per environment, injected via spring.config.import, defined in the same terraform that creates the resource being pointed at. that way the url and the thing it points to cannot drift apart. 3. service-specific configuration - genuinely local, lives in the repository as @configurationproperties with validation. then enforcement: a startup check that fails if a required platform property is missing, metadata so overrides are discoverable, and a periodic report of which services are on which starter version. what i explicitly avoid is a central config server as the runtime source of truth on kubernetes - it adds a hard startup dependency and a new outage mode for a problem the platform already solves. hook: the shared starter you built or adopted, and the drift it eliminated."}, {"n": 43, "category": 3, "difficulty": "D", "html": "Which post-processor creates AOP proxies, how does it find advisors, and at what point in <code>refresh()<\/code> does it run?", "answerTitle": "Proxy creation", "answer": "<p><code>AnnotationAwareAspectJAutoProxyCreator<\/code> is a <code>SmartInstantiationAwareBeanPostProcessor<\/code> registered by <code>@EnableAspectJAutoProxy<\/code> (or by Boot&#x27;s AOP auto-configuration). During <code>postProcessAfterInitialization<\/code> - step 11 of refresh - it collects all <code>Advisor<\/code> beans plus <code>@Aspect<\/code> classes, asks each whether its pointcut matches the bean&#x27;s class, and if any match it wraps the bean in a proxy built by <code>ProxyFactory<\/code>.<\/p><p>Everything else follows from that single fact: proxies are per-bean, created after initialization, and the container hands the <em>proxy<\/em> to whoever injects the bean, while the target&#x27;s own <code>this<\/code> reference still points at the raw object.<\/p>", "source": "answers.md", "search": "which post-processor creates aop proxies, how does it find advisors, and at what point in refresh() does it run? annotationawareaspectjautoproxycreator is a smartinstantiationawarebeanpostprocessor registered by @enableaspectjautoproxy (or by boot's aop auto-configuration). during postprocessafterinitialization - step 11 of refresh - it collects all advisor beans plus @aspect classes, asks each whether its pointcut matches the bean's class, and if any match it wraps the bean in a proxy built by proxyfactory. everything else follows from that single fact: proxies are per-bean, created after initialization, and the container hands the proxy to whoever injects the bean, while the target's own this reference still points at the raw object."}, {"n": 44, "category": 3, "difficulty": "D", "html": "Pointcut designators: <code>execution<\/code>, <code>within<\/code>, <code>@annotation<\/code>, <code>bean<\/code>, <code>args<\/code>, <code>this<\/code>, <code>target<\/code>. Give a realistic expression.", "answerTitle": "Pointcut designators", "answer": "<ul><li><code>execution(* com.acme.service.*Service.*(..))<\/code> - the general-purpose one, matching method signatures.<\/li><li><code>within(com.acme.service..*)<\/code> - all joinpoints inside a type or package. Cheaper to evaluate.<\/li><li><code>@annotation(com.acme.Audited)<\/code> - methods carrying an annotation. My most-used designator, because it makes the aspect opt-in and visible at the call site.<\/li><li><code>@within<\/code> / <code>@target<\/code> - types carrying an annotation.<\/li><li><code>bean(*Repository)<\/code> - Spring-specific, matches by bean name.<\/li><li><code>args(String, ..)<\/code> - argument runtime types; <code>this()<\/code> and <code>target()<\/code> match the proxy and target types.<\/li><\/ul><p>A realistic combination: <code>@annotation(audited) &amp;&amp; within(com.acme..*)<\/code> with the annotation bound as a parameter so the advice can read its attributes.<\/p>", "source": "answers.md", "search": "pointcut designators: execution, within, @annotation, bean, args, this, target. give a realistic expression. - execution( com.acme.service. service. (..)) - the general-purpose one, matching method signatures. - within(com.acme.service.. ) - all joinpoints inside a type or package. cheaper to evaluate. - @annotation(com.acme.audited) - methods carrying an annotation. my most-used designator, because it makes the aspect opt-in and visible at the call site. - @within / @target - types carrying an annotation. - bean( repository) - spring-specific, matches by bean name. - args(string, ..) - argument runtime types; this() and target() match the proxy and target types. a realistic combination: @annotation(audited) && within(com.acme.. ) with the annotation bound as a parameter so the advice can read its attributes."}, {"n": 45, "category": 3, "difficulty": "T", "html": "<code>this()<\/code> versus <code>target()<\/code> in a pointcut - why do they behave differently under a JDK proxy?", "answerTitle": "`this()` versus `target()`", "answer": "<p><code>this()<\/code> matches when the <strong>proxy<\/strong> is an instance of the given type; <code>target()<\/code> matches when the <strong>target object<\/strong> is.<\/p><p>Under CGLIB the proxy is a subclass of the target, so both match. Under a JDK dynamic proxy the object implements only the interfaces - it is <em>not<\/em> an instance of the implementation class - so <code>this(OrderServiceImpl)<\/code> fails to match while <code>target(OrderServiceImpl)<\/code> succeeds.<\/p><p>Practical rule: use <code>target()<\/code> when you mean the implementation type, and be aware that a pointcut which works under Boot&#x27;s CGLIB default can break if something forces JDK proxying.<\/p>", "source": "answers.md", "search": "this() versus target() in a pointcut - why do they behave differently under a jdk proxy? this() matches when the proxy is an instance of the given type; target() matches when the target object is. under cglib the proxy is a subclass of the target, so both match. under a jdk dynamic proxy the object implements only the interfaces - it is not an instance of the implementation class - so this(orderserviceimpl) fails to match while target(orderserviceimpl) succeeds. practical rule: use target() when you mean the implementation type, and be aware that a pointcut which works under boot's cglib default can break if something forces jdk proxying."}, {"n": 46, "category": 3, "difficulty": "C", "html": "Advice types and the exact order in which they execute around a join point.", "answerTitle": "Advice order", "answer": "<p>Around a single join point, for one aspect: <code>@Around<\/code> (before the proceed) → <code>@Before<\/code> → <strong>method<\/strong> → <code>@AfterReturning<\/code> or <code>@AfterThrowing<\/code> → <code>@After<\/code> → <code>@Around<\/code> (after the proceed).<\/p><p><code>@After<\/code> is a finally block - it runs on both paths. <code>@Around<\/code> must call <code>proceed()<\/code> and return its result; forgetting to return it silently makes methods return <code>null<\/code>, which is a memorable production bug.<\/p><p>With multiple aspects the highest-precedence aspect wraps the others entirely, so its <code>@Before<\/code> runs first and its <code>@After<\/code> runs last - the standard nesting model.<\/p>", "source": "answers.md", "search": "advice types and the exact order in which they execute around a join point. around a single join point, for one aspect: @around (before the proceed) → @before → method → @afterreturning or @afterthrowing → @after → @around (after the proceed). @after is a finally block - it runs on both paths. @around must call proceed() and return its result; forgetting to return it silently makes methods return null, which is a memorable production bug. with multiple aspects the highest-precedence aspect wraps the others entirely, so its @before runs first and its @after runs last - the standard nesting model."}, {"n": 47, "category": 3, "difficulty": "T", "html": "Two aspects match the same method. What determines which wraps which, and what is the default if you say nothing?", "answerTitle": "Multiple aspects", "answer": "<p>Precedence comes from <code>@Order<\/code> or <code>Ordered<\/code> on the <strong>aspect class<\/strong> (lower value = higher precedence = outermost). Two advice methods <em>within the same aspect<\/em> on the same join point have <strong>undefined<\/strong> relative order - the specification does not guarantee it, and it has changed between versions. If you need a defined order, put them in separate aspects.<\/p><p>Without <code>@Order<\/code>, ordering is undefined and depends on bean registration. That is fine until an aspect that logs and an aspect that opens a transaction produce log lines outside the transaction, or a security aspect runs after an auditing aspect that has already recorded the action as permitted. Always order aspects that interact.<\/p>", "source": "answers.md", "search": "two aspects match the same method. what determines which wraps which, and what is the default if you say nothing? precedence comes from @order or ordered on the aspect class (lower value = higher precedence = outermost). two advice methods within the same aspect on the same join point have undefined relative order - the specification does not guarantee it, and it has changed between versions. if you need a defined order, put them in separate aspects. without @order, ordering is undefined and depends on bean registration. that is fine until an aspect that logs and an aspect that opens a transaction produce log lines outside the transaction, or a security aspect runs after an auditing aspect that has already recorded the action as permitted. always order aspects that interact."}, {"n": 48, "category": 3, "difficulty": "T", "html": "A method annotated with <code>@Transactional<\/code>, <code>@Async<\/code> and <code>@Cacheable<\/code> - what is the actual invocation order, and what goes wrong?", "answerTitle": "`@Transactional` + `@Async` + `@Cacheable`", "answer": "<p>Each is implemented by its own advisor with a defined order: <code>@Async<\/code> is <code>Ordered.LOWEST_PRECEDENCE<\/code>, <code>@Transactional<\/code> and <code>@Cacheable<\/code> are also <code>LOWEST_PRECEDENCE<\/code> by default but the async advisor is registered such that async typically wraps the others.<\/p><p>The practical answer is that <strong>you should never stack all three<\/strong>, because the semantics are incoherent:<\/p><ul><li><code>@Async<\/code> returns immediately, so <code>@Cacheable<\/code> caches a <code>CompletableFuture<\/code>, not a value (before Spring 6.1 it cached the future object itself, which meant subsequent callers shared one in-flight computation - sometimes desirable, usually surprising).<\/li><li>The transaction begins on the async thread, not the caller&#x27;s, so the caller&#x27;s transaction neither includes nor waits for it.<\/li><li>If the async method fails, the caller has already returned success.<\/li><\/ul><p>The clean design is one annotation per method and explicit composition: a cached, transactional method, called by a thin <code>@Async<\/code> wrapper in a different bean - which also solves the self-invocation problem.<\/p>", "source": "answers.md", "search": "a method annotated with @transactional, @async and @cacheable - what is the actual invocation order, and what goes wrong? each is implemented by its own advisor with a defined order: @async is ordered.lowest_precedence, @transactional and @cacheable are also lowest_precedence by default but the async advisor is registered such that async typically wraps the others. the practical answer is that you should never stack all three , because the semantics are incoherent: - @async returns immediately, so @cacheable caches a completablefuture, not a value (before spring 6.1 it cached the future object itself, which meant subsequent callers shared one in-flight computation - sometimes desirable, usually surprising). - the transaction begins on the async thread, not the caller's, so the caller's transaction neither includes nor waits for it. - if the async method fails, the caller has already returned success. the clean design is one annotation per method and explicit composition: a cached, transactional method, called by a thin @async wrapper in a different bean - which also solves the self-invocation problem."}, {"n": 49, "category": 3, "difficulty": "D", "html": "Where does <code>@Transactional<\/code> sit in the advisor order by default, and when would you change it?", "answerTitle": "`@Transactional` advisor order", "answer": "<p><code>AbstractTransactionManagementConfiguration<\/code> registers the transaction advisor at <code>Ordered.LOWEST_PRECEDENCE<\/code>, so it is the <strong>innermost<\/strong> advice by default - closest to your method, with other aspects wrapping it.<\/p><p>You change it when an aspect must run <em>inside<\/em> the transaction (an auditing aspect that writes a row must be inside, or its write is not part of the commit) or <em>outside<\/em> it (a retry aspect must be outside, or it retries within an already rollback-marked transaction and every attempt fails). Set <code>@EnableTransactionManagement(order = ...)<\/code> or order the other aspects explicitly. Getting retry and transaction ordering backwards is a classic, and it produces <code>UnexpectedRollbackException<\/code> under load.<\/p>", "source": "answers.md", "search": "where does @transactional sit in the advisor order by default, and when would you change it? abstracttransactionmanagementconfiguration registers the transaction advisor at ordered.lowest_precedence, so it is the innermost advice by default - closest to your method, with other aspects wrapping it. you change it when an aspect must run inside the transaction (an auditing aspect that writes a row must be inside, or its write is not part of the commit) or outside it (a retry aspect must be outside, or it retries within an already rollback-marked transaction and every attempt fails). set @enabletransactionmanagement(order = ...) or order the other aspects explicitly. getting retry and transaction ordering backwards is a classic, and it produces unexpectedrollbackexception under load."}, {"n": 50, "category": 3, "difficulty": "C", "html": "Self-invocation defeats the proxy. List every Spring annotation this silently disables.", "answerTitle": "Everything self-invocation breaks", "answer": "<p>Any annotation implemented by a Spring AOP proxy stops working on an internal call: <code>@Transactional<\/code>, <code>@Async<\/code>, <code>@Cacheable<\/code> / <code>@CachePut<\/code> / <code>@CacheEvict<\/code>, <code>@PreAuthorize<\/code> / <code>@PostAuthorize<\/code> / <code>@Secured<\/code>, <code>@Retryable<\/code> / <code>@Recover<\/code>, <code>@Validated<\/code> method validation, <code>@Timed<\/code> and <code>@Observed<\/code>, <code>@CircuitBreaker<\/code> / <code>@RateLimiter<\/code> / <code>@Bulkhead<\/code>, and any custom aspect you write.<\/p><p>It also fails for <code>private<\/code>, <code>final<\/code> and <code>static<\/code> methods, and for calls made before the proxy exists (<code>@PostConstruct<\/code>).<\/p><p>Detection: an ArchUnit rule or a Sonar rule flagging internal calls to annotated methods, because this is not something code review reliably catches. The fix is almost always to extract the annotated method into a collaborating bean, which usually improves the design anyway.<\/p>", "source": "answers.md", "search": "self-invocation defeats the proxy. list every spring annotation this silently disables. any annotation implemented by a spring aop proxy stops working on an internal call: @transactional, @async, @cacheable / @cacheput / @cacheevict, @preauthorize / @postauthorize / @secured, @retryable / @recover, @validated method validation, @timed and @observed, @circuitbreaker / @ratelimiter / @bulkhead, and any custom aspect you write. it also fails for private, final and static methods, and for calls made before the proxy exists (@postconstruct). detection: an archunit rule or a sonar rule flagging internal calls to annotated methods, because this is not something code review reliably catches. the fix is almost always to extract the annotated method into a collaborating bean, which usually improves the design anyway."}, {"n": 51, "category": 3, "difficulty": "D", "html": "AspectJ compile-time and load-time weaving - what do they enable that Spring AOP cannot, and what do they cost?", "answerTitle": "AspectJ weaving", "answer": "<p>Spring AOP is proxy-based: method execution join points only, on Spring beans only, and never on self-invocation. AspectJ weaves bytecode - at compile time (CTW) or class load time (LTW, <code>-javaagent:aspectjweaver.jar<\/code> plus <code>@EnableLoadTimeWeaving<\/code>) - and can therefore advise private methods, constructors, field access, static methods, self-invocation, and objects Spring does not manage.<\/p><p>The cost is significant: a build or launch dependency, harder debugging because the code you read is not the code that runs, slower builds, and behavior that surprises anyone who has not been told weaving is enabled. Native image and AOT support is also weaker.<\/p><p>I have used LTW exactly where proxying could not work - domain objects instantiated with <code>new<\/code> needing injection (<code>@Configurable<\/code>). For everything else the proxy limitation is a design signal, not an obstacle to route around.<\/p>", "source": "answers.md", "search": "aspectj compile-time and load-time weaving - what do they enable that spring aop cannot, and what do they cost? spring aop is proxy-based: method execution join points only, on spring beans only, and never on self-invocation. aspectj weaves bytecode - at compile time (ctw) or class load time (ltw, -javaagent:aspectjweaver.jar plus @enableloadtimeweaving) - and can therefore advise private methods, constructors, field access, static methods, self-invocation, and objects spring does not manage. the cost is significant: a build or launch dependency, harder debugging because the code you read is not the code that runs, slower builds, and behavior that surprises anyone who has not been told weaving is enabled. native image and aot support is also weaker. i have used ltw exactly where proxying could not work - domain objects instantiated with new needing injection (@configurable). for everything else the proxy limitation is a design signal, not an obstacle to route around."}, {"n": 52, "category": 3, "difficulty": "D", "html": "<code>@Cacheable<\/code>, <code>@CachePut<\/code>, <code>@CacheEvict<\/code> - key generation, <code>condition<\/code> versus <code>unless<\/code>, and <code>sync = true<\/code>.", "answerTitle": "The cache annotations", "answer": "<p><code>@Cacheable<\/code> checks then stores; <code>@CachePut<\/code> always executes and stores; <code>@CacheEvict<\/code> removes (with <code>allEntries<\/code> and <code>beforeInvocation<\/code> options).<\/p><p>Keys come from <code>SimpleKeyGenerator<\/code> (all parameters combined) unless you supply <code>key<\/code> as SpEL - and you nearly always should, because the default silently changes when someone adds a parameter. <code>condition<\/code> is evaluated <strong>before<\/strong> invocation on the arguments; <code>unless<\/code> is evaluated <strong>after<\/strong>, so it can reference <code>#result<\/code>.<\/p><p><code>sync = true<\/code> makes concurrent callers for the same key wait for one computation instead of all recomputing. It only works on <code>@Cacheable<\/code>, cannot be combined with <code>unless<\/code> or multiple caches, and is supported only by cache implementations that provide atomic get-with-loader - Caffeine yes, plain Redis no.<\/p>", "source": "answers.md", "search": "@cacheable, @cacheput, @cacheevict - key generation, condition versus unless, and sync = true. @cacheable checks then stores; @cacheput always executes and stores; @cacheevict removes (with allentries and beforeinvocation options). keys come from simplekeygenerator (all parameters combined) unless you supply key as spel - and you nearly always should, because the default silently changes when someone adds a parameter. condition is evaluated before invocation on the arguments; unless is evaluated after , so it can reference result. sync = true makes concurrent callers for the same key wait for one computation instead of all recomputing. it only works on @cacheable, cannot be combined with unless or multiple caches, and is supported only by cache implementations that provide atomic get-with-loader - caffeine yes, plain redis no."}, {"n": 53, "category": 3, "difficulty": "T", "html": "<code>@Cacheable<\/code> on a method returning <code>Optional<\/code> or <code>CompletableFuture<\/code> - what is actually stored in the cache?", "answerTitle": "Caching `Optional` and `CompletableFuture`", "answer": "<p>Spring unwraps <code>Optional<\/code> and stores the <strong>contained value<\/strong>, returning a fresh <code>Optional<\/code> on a hit. So the cache holds <code>Customer<\/code>, not <code>Optional&lt;Customer&gt;<\/code> - which is what you want, and it means an empty <code>Optional<\/code> is cached as <code>null<\/code>.<\/p><p><code>CompletableFuture<\/code> was historically cached <strong>as the future object<\/strong>, meaning every hit returned the same completed future - usually harmless, occasionally a leak, and definitely surprising if the future was still pending. Spring Framework 6.1 added first-class support for <code>CompletableFuture<\/code> and reactive return types, unwrapping the value on completion. If you are on an older baseline, do not put <code>@Cacheable<\/code> on an async method - cache the synchronous method it delegates to.<\/p>", "source": "answers.md", "search": "@cacheable on a method returning optional or completablefuture - what is actually stored in the cache? spring unwraps optional and stores the contained value , returning a fresh optional on a hit. so the cache holds customer, not optional<customer - which is what you want, and it means an empty optional is cached as null. completablefuture was historically cached as the future object , meaning every hit returned the same completed future - usually harmless, occasionally a leak, and definitely surprising if the future was still pending. spring framework 6.1 added first-class support for completablefuture and reactive return types, unwrapping the value on completion. if you are on an older baseline, do not put @cacheable on an async method - cache the synchronous method it delegates to."}, {"n": 54, "category": 3, "difficulty": "T", "html": "Does <code>@Cacheable<\/code> cache a <code>null<\/code> return? Does it cache when the method throws?", "answerTitle": "Nulls and exceptions in `@Cacheable`", "answer": "<p><code>null<\/code> <strong>is<\/strong> cached by default, and that is deliberate - it prevents repeated lookups for missing keys (a cheap defense against cache-penetration). Suppress it with <code>unless = &quot;#result == null&quot;<\/code>. Redis is the exception: <code>RedisCacheConfiguration.disableCachingNullValues()<\/code> makes a null throw instead, so behavior differs by cache provider - worth knowing when a service behaves differently after moving from Caffeine to Redis.<\/p><p>An exception caches <strong>nothing<\/strong> and propagates. So a method failing intermittently produces no negative caching, and every caller hits the failing downstream - which is why <code>@Cacheable<\/code> is not a substitute for a circuit breaker.<\/p>", "source": "answers.md", "search": "does @cacheable cache a null return? does it cache when the method throws? null is cached by default, and that is deliberate - it prevents repeated lookups for missing keys (a cheap defense against cache-penetration). suppress it with unless = \" result == null\". redis is the exception: rediscacheconfiguration.disablecachingnullvalues() makes a null throw instead, so behavior differs by cache provider - worth knowing when a service behaves differently after moving from caffeine to redis. an exception caches nothing and propagates. so a method failing intermittently produces no negative caching, and every caller hits the failing downstream - which is why @cacheable is not a substitute for a circuit breaker."}, {"n": 55, "category": 3, "difficulty": "D", "html": "Backing the cache abstraction with Redis - serialization, per-cache TTL, and handling a cache stampede.", "answerTitle": "Redis-backed caching", "answer": "<p>Three things to get right:<\/p><ul><li><strong>Serialization.<\/strong> The default JDK serialization is unreadable, fragile across class changes, and a deserialization risk. Configure <code>GenericJackson2JsonRedisSerializer<\/code> or a typed serializer, and version the cached payload so a deployment that changes the DTO shape does not read garbage - I include a schema version in the cache name.<\/li><li><strong>TTL per cache.<\/strong> <code>RedisCacheManagerBuilder.withCacheConfiguration(name, config.entryTtl(...))<\/code>. A single global TTL is always wrong for some cache.<\/li><li><strong>Stampede.<\/strong> Redis has no atomic loader, so <code>sync = true<\/code> does not protect you; N instances all miss and all hit the database. Mitigate with jittered TTLs, a short local Caffeine tier in front of Redis (which also cuts network calls dramatically), and a distributed lock or probabilistic early refresh for genuinely hot keys.<\/li><\/ul><p>Also decide the failure mode explicitly: if Redis is down, <code>@Cacheable<\/code> throws by default and takes your service with it. Register a <code>CacheErrorHandler<\/code> that logs and falls through to the method, so a cache outage degrades performance rather than availability.<\/p>", "source": "answers.md", "search": "backing the cache abstraction with redis - serialization, per-cache ttl, and handling a cache stampede. three things to get right: - serialization. the default jdk serialization is unreadable, fragile across class changes, and a deserialization risk. configure genericjackson2jsonredisserializer or a typed serializer, and version the cached payload so a deployment that changes the dto shape does not read garbage - i include a schema version in the cache name. - ttl per cache. rediscachemanagerbuilder.withcacheconfiguration(name, config.entryttl(...)). a single global ttl is always wrong for some cache. - stampede. redis has no atomic loader, so sync = true does not protect you; n instances all miss and all hit the database. mitigate with jittered ttls, a short local caffeine tier in front of redis (which also cuts network calls dramatically), and a distributed lock or probabilistic early refresh for genuinely hot keys. also decide the failure mode explicitly: if redis is down, @cacheable throws by default and takes your service with it. register a cacheerrorhandler that logs and falls through to the method, so a cache outage degrades performance rather than availability."}, {"n": 56, "category": 3, "difficulty": "D", "html": "Spring Retry - <code>@Retryable<\/code> and its interaction with transactions and idempotency.", "answerTitle": "Spring Retry", "answer": "<p><code>@Retryable(retryFor = ..., maxAttempts = 3, backoff = @Backoff(delay = 200, multiplier = 2, random = true))<\/code> with <code>@Recover<\/code> for the fallback, enabled by <code>@EnableRetry<\/code>. It is proxy-based, so the usual self-invocation rule applies.<\/p><p>Two interactions matter. <strong>Transactions<\/strong>: if retry is <em>inside<\/em> the transaction advisor, every attempt runs in the same already-marked-rollback-only transaction and all fail - retry must be the outer advice, which means retrying at a boundary that starts a fresh transaction per attempt. <strong>Idempotency<\/strong>: retrying a non-idempotent operation duplicates work; if the first attempt partially succeeded before failing, the retry compounds it.<\/p><p>So my rule is: retry only idempotent operations, only at a boundary that resets state, only on transient exception types (never on validation failures), and always with jittered backoff and a bounded attempt count. For anything cross-service I prefer Resilience4j so the retry composes with a circuit breaker.<\/p>", "source": "answers.md", "search": "spring retry - @retryable and its interaction with transactions and idempotency. @retryable(retryfor = ..., maxattempts = 3, backoff = @backoff(delay = 200, multiplier = 2, random = true)) with @recover for the fallback, enabled by @enableretry. it is proxy-based, so the usual self-invocation rule applies. two interactions matter. transactions : if retry is inside the transaction advisor, every attempt runs in the same already-marked-rollback-only transaction and all fail - retry must be the outer advice, which means retrying at a boundary that starts a fresh transaction per attempt. idempotency : retrying a non-idempotent operation duplicates work; if the first attempt partially succeeded before failing, the retry compounds it. so my rule is: retry only idempotent operations, only at a boundary that resets state, only on transient exception types (never on validation failures), and always with jittered backoff and a bounded attempt count. for anything cross-service i prefer resilience4j so the retry composes with a circuit breaker."}, {"n": 57, "category": 3, "difficulty": "D", "html": "<code>@Validated<\/code> on a class versus <code>@Valid<\/code> on a parameter - which one is AOP, and which exception does each produce?", "answerTitle": "`@Validated` versus `@Valid`", "answer": "<p><code>@Valid<\/code> on a controller parameter is handled by Spring MVC&#x27;s argument resolver during binding, and a failure produces <code>MethodArgumentNotValidException<\/code>, which <code>ResponseEntityExceptionHandler<\/code> maps to a 400.<\/p><p><code>@Validated<\/code> on a <strong>class<\/strong> activates <code>MethodValidationPostProcessor<\/code>, an AOP proxy that validates method parameters and return values on any Spring bean - services, not just controllers. A failure produces <code>ConstraintViolationException<\/code>, which nothing handles by default, so it surfaces as a 500 unless you add an <code>@ExceptionHandler<\/code>. That mismatch is the trap.<\/p><p><code>@Validated<\/code> also carries validation <strong>groups<\/strong>, which <code>@Valid<\/code> cannot: <code>@Validated(OnCreate.class)<\/code>. Spring 6.1 improved method validation so that constraints on controller method parameters produce <code>HandlerMethodValidationException<\/code> instead, which is handled properly - worth knowing on a modern baseline.<\/p>", "source": "answers.md", "search": "@validated on a class versus @valid on a parameter - which one is aop, and which exception does each produce? @valid on a controller parameter is handled by spring mvc's argument resolver during binding, and a failure produces methodargumentnotvalidexception, which responseentityexceptionhandler maps to a 400. @validated on a class activates methodvalidationpostprocessor, an aop proxy that validates method parameters and return values on any spring bean - services, not just controllers. a failure produces constraintviolationexception, which nothing handles by default, so it surfaces as a 500 unless you add an @exceptionhandler. that mismatch is the trap. @validated also carries validation groups , which @valid cannot: @validated(oncreate.class). spring 6.1 improved method validation so that constraints on controller method parameters produce handlermethodvalidationexception instead, which is handled properly - worth knowing on a modern baseline."}, {"n": 58, "category": 3, "difficulty": "A", "html": "When do you write an aspect rather than a decorator or an explicit call?", "answerTitle": "Aspect versus decorator", "answer": "<p>I use an aspect when the concern is genuinely cross-cutting - it applies to many types, is not part of their contract, and the alternative is the same three lines repeated everywhere. Auditing, metrics, tracing and security fit.<\/p><p>I use a decorator or an explicit call when the behavior is part of the domain, when it applies to one or two types, or when the reader needs to see it at the call site. A caching decorator around one repository is clearer than an aspect matching a pointcut declared in a different package.<\/p><p>The deciding question is debuggability: an aspect makes behavior invisible in the code you are reading, and a team unfamiliar with it will lose hours. So I require any aspect to be opt-in via an annotation rather than matched by package or naming convention - <code>@Audited<\/code> on the method tells the next reader something happens here, while <code>execution(* com.acme.service..*(..))<\/code> does not.<\/p>", "source": "answers.md", "search": "when do you write an aspect rather than a decorator or an explicit call? i use an aspect when the concern is genuinely cross-cutting - it applies to many types, is not part of their contract, and the alternative is the same three lines repeated everywhere. auditing, metrics, tracing and security fit. i use a decorator or an explicit call when the behavior is part of the domain, when it applies to one or two types, or when the reader needs to see it at the call site. a caching decorator around one repository is clearer than an aspect matching a pointcut declared in a different package. the deciding question is debuggability: an aspect makes behavior invisible in the code you are reading, and a team unfamiliar with it will lose hours. so i require any aspect to be opt-in via an annotation rather than matched by package or naming convention - @audited on the method tells the next reader something happens here, while execution( com.acme.service.. (..)) does not."}, {"n": 59, "category": 4, "difficulty": "C", "html": "What does <code>PlatformTransactionManager.getTransaction()<\/code> actually do, and how does <code>TransactionStatus<\/code> carry state?", "answerTitle": "`PlatformTransactionManager`", "answer": "<p><code>getTransaction(definition)<\/code> asks the manager whether a transaction is already bound to the thread; if so it applies the propagation rule (join, suspend, nest, or throw), otherwise it starts a new one - acquiring a <code>Connection<\/code>, setting auto-commit false and applying isolation and timeout - and binds the resource to <code>TransactionSynchronizationManager<\/code>.<\/p><p>It returns a <code>TransactionStatus<\/code> carrying whether the transaction is new, whether a savepoint exists, the suspended resources of an outer transaction, and the rollback-only flag. <code>commit(status)<\/code> either really commits (if new) or, for a participating transaction, does nothing except propagate the rollback-only flag upward. <code>rollback(status)<\/code> either rolls back or marks the outer transaction rollback-only.<\/p><p>That &quot;participating transactions do not really commit&quot; behavior is the mechanism behind <code>UnexpectedRollbackException<\/code>.<\/p>", "source": "answers.md", "search": "what does platformtransactionmanager.gettransaction() actually do, and how does transactionstatus carry state? gettransaction(definition) asks the manager whether a transaction is already bound to the thread; if so it applies the propagation rule (join, suspend, nest, or throw), otherwise it starts a new one - acquiring a connection, setting auto-commit false and applying isolation and timeout - and binds the resource to transactionsynchronizationmanager. it returns a transactionstatus carrying whether the transaction is new, whether a savepoint exists, the suspended resources of an outer transaction, and the rollback-only flag. commit(status) either really commits (if new) or, for a participating transaction, does nothing except propagate the rollback-only flag upward. rollback(status) either rolls back or marks the outer transaction rollback-only. that \"participating transactions do not really commit\" behavior is the mechanism behind unexpectedrollbackexception."}, {"n": 60, "category": 4, "difficulty": "D", "html": "<code>TransactionSynchronizationManager<\/code> - what is bound to the thread, and how does the <code>EntityManager<\/code> or <code>Connection<\/code> find it?", "answerTitle": "`TransactionSynchronizationManager`", "answer": "<p>It is a set of <code>ThreadLocal<\/code>s holding: a <strong>resource map<\/strong> (keyed by <code>DataSource<\/code> or <code>EntityManagerFactory<\/code>, valued with the bound <code>ConnectionHolder<\/code> or <code>EntityManagerHolder<\/code>), a list of <strong>synchronizations<\/strong>, and flags for the current transaction name, isolation, read-only status and active state.<\/p><p><code>DataSourceUtils.getConnection(dataSource)<\/code> and <code>EntityManagerFactoryUtils.doGetTransactionalEntityManager(...)<\/code> consult that map, which is precisely how <code>JdbcTemplate<\/code> and a JPA repository end up on the <em>same<\/em> connection inside one <code>@Transactional<\/code> method without either knowing about the other.<\/p><p>It is also why everything transaction-related is thread-bound, and therefore why <code>@Async<\/code>, reactive chains and manually spawned threads do not inherit a transaction.<\/p>", "source": "answers.md", "search": "transactionsynchronizationmanager - what is bound to the thread, and how does the entitymanager or connection find it? it is a set of threadlocals holding: a resource map (keyed by datasource or entitymanagerfactory, valued with the bound connectionholder or entitymanagerholder), a list of synchronizations , and flags for the current transaction name, isolation, read-only status and active state. datasourceutils.getconnection(datasource) and entitymanagerfactoryutils.dogettransactionalentitymanager(...) consult that map, which is precisely how jdbctemplate and a jpa repository end up on the same connection inside one @transactional method without either knowing about the other. it is also why everything transaction-related is thread-bound, and therefore why @async, reactive chains and manually spawned threads do not inherit a transaction."}, {"n": 61, "category": 4, "difficulty": "D", "html": "<code>TransactionSynchronization<\/code> callbacks - <code>beforeCommit<\/code>, <code>afterCommit<\/code>, <code>afterCompletion<\/code>. Give a real use for each.", "answerTitle": "`TransactionSynchronization`", "answer": "<p>Register one with <code>TransactionSynchronizationManager.registerSynchronization(...)<\/code>. Callbacks:<\/p><ul><li><code>beforeCommit(readOnly)<\/code> - still inside the transaction; a write here joins the commit. Used for last-moment validation or writing an outbox row.<\/li><li><code>beforeCompletion()<\/code> - before commit or rollback; resource cleanup.<\/li><li><code>afterCommit()<\/code> - the data is durable; publish events, send notifications, invalidate caches.<\/li><li><code>afterCompletion(status)<\/code> - always runs; unbind and clean up thread state such as MDC or a tenant context.<\/li><\/ul><p><code>@TransactionalEventListener<\/code> is a thin, declarative wrapper over exactly this, and knowing that is a good signal in an interview.<\/p>", "source": "answers.md", "search": "transactionsynchronization callbacks - beforecommit, aftercommit, aftercompletion. give a real use for each. register one with transactionsynchronizationmanager.registersynchronization(...). callbacks: - beforecommit(readonly) - still inside the transaction; a write here joins the commit. used for last-moment validation or writing an outbox row. - beforecompletion() - before commit or rollback; resource cleanup. - aftercommit() - the data is durable; publish events, send notifications, invalidate caches. - aftercompletion(status) - always runs; unbind and clean up thread state such as mdc or a tenant context. @transactionaleventlistener is a thin, declarative wrapper over exactly this, and knowing that is a good signal in an interview."}, {"n": 62, "category": 4, "difficulty": "T", "html": "Why can you not reliably write to the database inside <code>afterCommit<\/code>, and what happens if you try?", "answerTitle": "Writing in `afterCommit`", "answer": "<p>By the time <code>afterCommit<\/code> runs the transaction has committed but the synchronization is still active and the resources are still bound. A repository call there joins that completed transaction: it executes against the bound connection but <strong>nothing will commit it<\/strong>, so the write is silently lost (or throws, depending on the resource state).<\/p><p>It also happens outside any rollback protection - if the code throws, the original transaction is already durable, so you get a partially applied operation with an exception surfacing to nobody useful.<\/p><p>Correct approach: annotate the listener <code>@Transactional(propagation = REQUIRES_NEW)<\/code> so it runs in a genuinely new transaction, and accept that this is a second, independent commit which may fail on its own - meaning the operation is now eventually consistent and needs retry or reconciliation. If you need atomicity, the write belongs in <code>BEFORE_COMMIT<\/code> instead.<\/p>", "source": "answers.md", "search": "why can you not reliably write to the database inside aftercommit, and what happens if you try? by the time aftercommit runs the transaction has committed but the synchronization is still active and the resources are still bound. a repository call there joins that completed transaction: it executes against the bound connection but nothing will commit it , so the write is silently lost (or throws, depending on the resource state). it also happens outside any rollback protection - if the code throws, the original transaction is already durable, so you get a partially applied operation with an exception surfacing to nobody useful. correct approach: annotate the listener @transactional(propagation = requires_new) so it runs in a genuinely new transaction, and accept that this is a second, independent commit which may fail on its own - meaning the operation is now eventually consistent and needs retry or reconciliation. if you need atomicity, the write belongs in before_commit instead."}, {"n": 63, "category": 4, "difficulty": "D", "html": "<code>TransactionTemplate<\/code> - when is programmatic transaction management genuinely better than declarative?", "answerTitle": "`TransactionTemplate`", "answer": "<p>Programmatic transactions are better when the boundary is not a whole method: a long method where only a small section must be transactional, a loop that commits per batch, a boundary that depends on runtime conditions, or code inside a lambda or callback where an annotation cannot reach.<\/p><pre><code class=\"lang-java\">transactionTemplate.execute(status -&gt; {\n    repository.saveAll(batch);\n    return null;\n});<\/code><\/pre><p>It also makes the transaction boundary <em>visible<\/em>, which for tricky code is a genuine readability win over an annotation whose semantics depend on the proxy. And it sidesteps self-invocation entirely, which occasionally makes it the pragmatic fix in legacy code.<\/p><p>The cost is verbosity and the ease of accidentally holding the transaction open around non-database work - the same sin as a fat <code>@Transactional<\/code>, just harder to spot with a linter.<\/p>", "source": "answers.md", "search": "transactiontemplate - when is programmatic transaction management genuinely better than declarative? programmatic transactions are better when the boundary is not a whole method: a long method where only a small section must be transactional, a loop that commits per batch, a boundary that depends on runtime conditions, or code inside a lambda or callback where an annotation cannot reach. java transactiontemplate.execute(status - { repository.saveall(batch); return null; }); it also makes the transaction boundary visible , which for tricky code is a genuine readability win over an annotation whose semantics depend on the proxy. and it sidesteps self-invocation entirely, which occasionally makes it the pragmatic fix in legacy code. the cost is verbosity and the ease of accidentally holding the transaction open around non-database work - the same sin as a fat @transactional, just harder to spot with a linter."}, {"n": 64, "category": 4, "difficulty": "T", "html": "<code>@Transactional(readOnly = true)<\/code> - what does it do at the JDBC driver, Hibernate and read-replica routing levels? What does it <em>not<\/em> prevent?", "answerTitle": "`readOnly = true`", "answer": "<p>It does three different things at three levels, and the answer people miss is that it is a <em>hint<\/em>, not an enforcement:<\/p><ol><li><strong>JDBC<\/strong>: <code>Connection.setReadOnly(true)<\/code>, which some drivers pass to the server (PostgreSQL sets the transaction read-only and will actually reject writes; MySQL may ignore it).<\/li><li><strong>Hibernate<\/strong>: sets <code>FlushMode.MANUAL<\/code> and skips taking dirty-checking snapshots of loaded entities. This is the real performance win - on a query loading thousands of entities it meaningfully cuts memory and CPU, because no snapshot copy is retained.<\/li><li><strong>Routing<\/strong>: an <code>AbstractRoutingDataSource<\/code> can read <code>TransactionSynchronizationManager.isCurrentTransactionReadOnly()<\/code> to send the transaction to a read replica. This is the most common production use.<\/li><\/ol><p>What it does <strong>not<\/strong> do: guarantee a write fails. On a driver that ignores the flag, a manual <code>flush()<\/code> or a native query will happily write. So treat it as an optimization and a routing signal, not as a safety control.<\/p>", "source": "answers.md", "search": "@transactional(readonly = true) - what does it do at the jdbc driver, hibernate and read-replica routing levels? what does it not prevent? it does three different things at three levels, and the answer people miss is that it is a hint , not an enforcement: 1. jdbc : connection.setreadonly(true), which some drivers pass to the server (postgresql sets the transaction read-only and will actually reject writes; mysql may ignore it). 2. hibernate : sets flushmode.manual and skips taking dirty-checking snapshots of loaded entities. this is the real performance win - on a query loading thousands of entities it meaningfully cuts memory and cpu, because no snapshot copy is retained. 3. routing : an abstractroutingdatasource can read transactionsynchronizationmanager.iscurrenttransactionreadonly() to send the transaction to a read replica. this is the most common production use. what it does not do: guarantee a write fails. on a driver that ignores the flag, a manual flush() or a native query will happily write. so treat it as an optimization and a routing signal, not as a safety control."}, {"n": 65, "category": 4, "difficulty": "T", "html": "A transaction is opened but no query runs. What did that cost, and what does <code>LazyConnectionDataSourceProxy<\/code> fix?", "answerTitle": "Transactions without queries", "answer": "<p>Opening a transaction acquires a connection from Hikari immediately and holds it until commit - even if the method never executes a statement, and even if it then spends 400ms calling an HTTP API. With a pool of 20 and a hundred concurrent requests, you exhaust the pool with connections doing nothing.<\/p><p><code>LazyConnectionDataSourceProxy<\/code> wraps the real <code>DataSource<\/code> and returns a proxy <code>Connection<\/code> that defers acquisition until the first <em>statement<\/em>. The transaction still starts logically; the physical connection is only taken when needed. It also makes read-write routing work correctly, since the routing decision can be deferred until the read-only flag is known.<\/p><p>The caveat: it hides the problem rather than fixing it. A <code>@Transactional<\/code> method making network calls is still wrong. I use the proxy as a safety net and still enforce the boundary rule.<\/p><blockquote><p><em>Hook: a connection pool exhaustion incident where transactions spanned an external call.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "a transaction is opened but no query runs. what did that cost, and what does lazyconnectiondatasourceproxy fix? opening a transaction acquires a connection from hikari immediately and holds it until commit - even if the method never executes a statement, and even if it then spends 400ms calling an http api. with a pool of 20 and a hundred concurrent requests, you exhaust the pool with connections doing nothing. lazyconnectiondatasourceproxy wraps the real datasource and returns a proxy connection that defers acquisition until the first statement . the transaction still starts logically; the physical connection is only taken when needed. it also makes read-write routing work correctly, since the routing decision can be deferred until the read-only flag is known. the caveat: it hides the problem rather than fixing it. a @transactional method making network calls is still wrong. i use the proxy as a safety net and still enforce the boundary rule. hook: a connection pool exhaustion incident where transactions spanned an external call."}, {"n": 66, "category": 4, "difficulty": "D", "html": "With two <code>DataSource<\/code>s, how does Spring choose the transaction manager, and what fails silently if you get it wrong?", "answerTitle": "Multiple data sources", "answer": "<p>With more than one <code>DataSource<\/code>, Boot&#x27;s auto-configuration backs off and you must declare everything explicitly: two <code>DataSource<\/code> beans (one <code>@Primary<\/code>), two <code>LocalContainerEntityManagerFactoryBean<\/code>s with distinct <code>persistenceUnit<\/code> names and entity packages, two <code>PlatformTransactionManager<\/code>s, and <code>@EnableJpaRepositories(basePackages, entityManagerFactoryRef, transactionManagerRef)<\/code> per package.<\/p><p>Spring picks the transaction manager by the <code>transactionManager<\/code> attribute on <code>@Transactional<\/code>, falling back to the <code>@Primary<\/code> one. <strong>That fallback is the silent failure<\/strong>: a method touching the secondary database with a plain <code>@Transactional<\/code> runs under the primary manager, so it gets a transaction on the wrong data source - the secondary operations run in auto-commit, with no rollback and no atomicity, and nothing warns you.<\/p><p>Mitigations: name the qualifier on every <code>@Transactional<\/code> in a multi-data-source application, keep repositories for each data source in strictly separate packages, and add an ArchUnit rule enforcing it. And say the important thing: two data sources in one transaction is not atomic without XA, so design for idempotency and reconciliation instead.<\/p>", "source": "answers.md", "search": "with two datasources, how does spring choose the transaction manager, and what fails silently if you get it wrong? with more than one datasource, boot's auto-configuration backs off and you must declare everything explicitly: two datasource beans (one @primary), two localcontainerentitymanagerfactorybeans with distinct persistenceunit names and entity packages, two platformtransactionmanagers, and @enablejparepositories(basepackages, entitymanagerfactoryref, transactionmanagerref) per package. spring picks the transaction manager by the transactionmanager attribute on @transactional, falling back to the @primary one. that fallback is the silent failure : a method touching the secondary database with a plain @transactional runs under the primary manager, so it gets a transaction on the wrong data source - the secondary operations run in auto-commit, with no rollback and no atomicity, and nothing warns you. mitigations: name the qualifier on every @transactional in a multi-data-source application, keep repositories for each data source in strictly separate packages, and add an archunit rule enforcing it. and say the important thing: two data sources in one transaction is not atomic without xa, so design for idempotency and reconciliation instead."}, {"n": 67, "category": 4, "difficulty": "T", "html": "<code>ChainedTransactionManager<\/code> is deprecated. Why was it dangerous, and what do you do instead?", "answerTitle": "`ChainedTransactionManager`", "answer": "<p>It was deprecated (and removed) because it promises something it cannot deliver. It commits the managers in sequence: if manager A commits and manager B then fails, A is already durable and cannot be undone. It is best-effort one-phase commit dressed up as a distributed transaction, so it fails exactly when you need it - under partial failure - and leaves inconsistent state with no record of it.<\/p><p>What to do instead: pick a <strong>single<\/strong> transactional resource as the source of truth and make everything else eventually consistent from it. The transactional outbox is the canonical pattern - write the state change and the event in one local transaction, relay the event afterwards, and make consumers idempotent. If two databases genuinely must agree atomically, that is either a JTA case or, more often, a signal that the boundary is drawn in the wrong place.<\/p>", "source": "answers.md", "search": "chainedtransactionmanager is deprecated. why was it dangerous, and what do you do instead? it was deprecated (and removed) because it promises something it cannot deliver. it commits the managers in sequence: if manager a commits and manager b then fails, a is already durable and cannot be undone. it is best-effort one-phase commit dressed up as a distributed transaction, so it fails exactly when you need it - under partial failure - and leaves inconsistent state with no record of it. what to do instead: pick a single transactional resource as the source of truth and make everything else eventually consistent from it. the transactional outbox is the canonical pattern - write the state change and the event in one local transaction, relay the event afterwards, and make consumers idempotent. if two databases genuinely must agree atomically, that is either a jta case or, more often, a signal that the boundary is drawn in the wrong place."}, {"n": 68, "category": 4, "difficulty": "D", "html": "JTA and XA - when is it justified in 2026, and what does it cost?", "answerTitle": "JTA and XA", "answer": "<p>XA gives real two-phase commit across resources via a transaction manager (Atomikos, Narayana, or a Jakarta EE server). It is justified almost nowhere in 2026: it requires XA-capable resources, adds latency for the prepare phase, introduces in-doubt transactions that need manual resolution after a coordinator crash, and the coordinator itself becomes a stateful single point of failure that must be highly available and have durable storage.<\/p><p>I would consider it only for a legacy integration where the alternative is genuinely unacceptable and the resources are both XA-capable and co-located. Otherwise: outbox, idempotency, sagas and reconciliation - which are more code but fail in ways you can observe and recover from.<\/p>", "source": "answers.md", "search": "jta and xa - when is it justified in 2026, and what does it cost? xa gives real two-phase commit across resources via a transaction manager (atomikos, narayana, or a jakarta ee server). it is justified almost nowhere in 2026: it requires xa-capable resources, adds latency for the prepare phase, introduces in-doubt transactions that need manual resolution after a coordinator crash, and the coordinator itself becomes a stateful single point of failure that must be highly available and have durable storage. i would consider it only for a legacy integration where the alternative is genuinely unacceptable and the resources are both xa-capable and co-located. otherwise: outbox, idempotency, sagas and reconciliation - which are more code but fail in ways you can observe and recover from."}, {"n": 69, "category": 4, "difficulty": "D", "html": "Transaction timeout - who enforces it, and which operations does it fail to interrupt?", "answerTitle": "Transaction timeout", "answer": "<p><code>@Transactional(timeout = 5)<\/code> sets a deadline on the <code>TransactionStatus<\/code>. Enforcement is cooperative: Spring passes the remaining time to each statement as a JDBC query timeout where the resource supports it, and checks the deadline when a new statement is issued. Hibernate applies it per query.<\/p><p>What it does <strong>not<\/strong> interrupt: an already-running statement in a driver that ignores query timeout, a network call inside the method, <code>Thread.sleep<\/code>, or in-memory computation. So a method that hangs on an HTTP call will blow through its transaction timeout entirely - the connection stays held and the timeout fires only when the next statement runs.<\/p><p>For that reason I set database-side guards too (PostgreSQL <code>statement_timeout<\/code> and <code>idle_in_transaction_session_timeout<\/code>), because those are enforced by the server regardless of what the application does.<\/p>", "source": "answers.md", "search": "transaction timeout - who enforces it, and which operations does it fail to interrupt? @transactional(timeout = 5) sets a deadline on the transactionstatus. enforcement is cooperative: spring passes the remaining time to each statement as a jdbc query timeout where the resource supports it, and checks the deadline when a new statement is issued. hibernate applies it per query. what it does not interrupt: an already-running statement in a driver that ignores query timeout, a network call inside the method, thread.sleep, or in-memory computation. so a method that hangs on an http call will blow through its transaction timeout entirely - the connection stays held and the timeout fires only when the next statement runs. for that reason i set database-side guards too (postgresql statement_timeout and idle_in_transaction_session_timeout), because those are enforced by the server regardless of what the application does."}, {"n": 70, "category": 4, "difficulty": "T", "html": "<code>UnexpectedRollbackException<\/code> - describe the exact sequence of calls that produces it.", "answerTitle": "`UnexpectedRollbackException`", "answer": "<p>The exact sequence:<\/p><ol><li>Outer method <code>@Transactional<\/code> starts a real transaction.<\/li><li>Inner method <code>@Transactional<\/code> (default <code>REQUIRED<\/code>) <strong>participates<\/strong> - no new transaction.<\/li><li>The inner method throws a runtime exception. Its transaction advisor calls <code>rollback<\/code>, which - because it is only participating - cannot roll back; it sets <code>rollbackOnly = true<\/code> on the shared transaction.<\/li><li>The outer method <strong>catches<\/strong> the exception and continues normally, believing it handled the failure.<\/li><li>The outer advisor calls <code>commit<\/code>, the manager sees <code>rollbackOnly<\/code>, rolls back and throws <code>UnexpectedRollbackException: Transaction rolled back because it has been marked as rollback-only<\/code>.<\/li><\/ol><p>The lesson is that catching an exception does not undo the rollback marking. Fixes: do not catch and swallow across a transactional boundary; or make the inner method <code>REQUIRES_NEW<\/code> so its failure is genuinely isolated; or check <code>TransactionAspectSupport.currentTransactionStatus().isRollbackOnly()<\/code> before proceeding. The first is usually the right design.<\/p>", "source": "answers.md", "search": "unexpectedrollbackexception - describe the exact sequence of calls that produces it. the exact sequence: 1. outer method @transactional starts a real transaction. 2. inner method @transactional (default required) participates - no new transaction. 3. the inner method throws a runtime exception. its transaction advisor calls rollback, which - because it is only participating - cannot roll back; it sets rollbackonly = true on the shared transaction. 4. the outer method catches the exception and continues normally, believing it handled the failure. 5. the outer advisor calls commit, the manager sees rollbackonly, rolls back and throws unexpectedrollbackexception: transaction rolled back because it has been marked as rollback-only. the lesson is that catching an exception does not undo the rollback marking. fixes: do not catch and swallow across a transactional boundary; or make the inner method requires_new so its failure is genuinely isolated; or check transactionaspectsupport.currenttransactionstatus().isrollbackonly() before proceeding. the first is usually the right design."}, {"n": 71, "category": 4, "difficulty": "T", "html": "<code>REQUIRES_NEW<\/code> invoked inside a transaction holding a row lock - explain the self-deadlock and how to avoid it.", "answerTitle": "`REQUIRES_NEW` self-deadlock", "answer": "<p>The outer transaction updates row X and holds a write lock. It then calls a <code>REQUIRES_NEW<\/code> method, which <strong>suspends<\/strong> the outer transaction (the lock is still held - suspension does not release locks) and takes a <em>second<\/em> connection from the pool. If that inner transaction touches row X, it waits for a lock held by a transaction that cannot proceed until the inner one finishes. Deadlock, resolved only by the lock timeout.<\/p><p>The second failure mode is pool exhaustion: every <code>REQUIRES_NEW<\/code> nesting level holds an extra connection simultaneously, so under load a pool of 20 supports only 10 concurrent requests.<\/p><p>Avoidance: never touch the same rows across the nesting; keep <code>REQUIRES_NEW<\/code> for genuinely independent writes such as audit records; always configure a lock timeout so a deadlock fails fast; and size the pool for the maximum nesting depth.<\/p>", "source": "answers.md", "search": "requires_new invoked inside a transaction holding a row lock - explain the self-deadlock and how to avoid it. the outer transaction updates row x and holds a write lock. it then calls a requires_new method, which suspends the outer transaction (the lock is still held - suspension does not release locks) and takes a second connection from the pool. if that inner transaction touches row x, it waits for a lock held by a transaction that cannot proceed until the inner one finishes. deadlock, resolved only by the lock timeout. the second failure mode is pool exhaustion: every requires_new nesting level holds an extra connection simultaneously, so under load a pool of 20 supports only 10 concurrent requests. avoidance: never touch the same rows across the nesting; keep requires_new for genuinely independent writes such as audit records; always configure a lock timeout so a deadlock fails fast; and size the pool for the maximum nesting depth."}, {"n": 72, "category": 4, "difficulty": "D", "html": "<code>NESTED<\/code> propagation and savepoints - which transaction managers support it, and when is it the right answer?", "answerTitle": "`NESTED` propagation", "answer": "<p><code>NESTED<\/code> uses a JDBC <strong>savepoint<\/strong> inside the existing transaction. An inner failure rolls back to the savepoint, leaving the outer transaction alive and able to commit the rest. There is one physical transaction and one connection, unlike <code>REQUIRES_NEW<\/code>.<\/p><p>Supported by <code>DataSourceTransactionManager<\/code> (and <code>JpaTransactionManager<\/code> with a JDBC-based dialect and <code>nestedTransactionAllowed = true<\/code>); <strong>not<\/strong> supported by JTA.<\/p><p>It fits &quot;process a batch, skip the items that fail&quot; where you want the successful items committed together and do not want the connection cost of <code>REQUIRES_NEW<\/code>. In practice I use it rarely, because savepoint behavior with a JPA persistence context is subtle - the entity state is not rolled back with the savepoint, so you must clear the persistence context yourself or you continue with entities that no longer reflect the database.<\/p>", "source": "answers.md", "search": "nested propagation and savepoints - which transaction managers support it, and when is it the right answer? nested uses a jdbc savepoint inside the existing transaction. an inner failure rolls back to the savepoint, leaving the outer transaction alive and able to commit the rest. there is one physical transaction and one connection, unlike requires_new. supported by datasourcetransactionmanager (and jpatransactionmanager with a jdbc-based dialect and nestedtransactionallowed = true); not supported by jta. it fits \"process a batch, skip the items that fail\" where you want the successful items committed together and do not want the connection cost of requires_new. in practice i use it rarely, because savepoint behavior with a jpa persistence context is subtle - the entity state is not rolled back with the savepoint, so you must clear the persistence context yourself or you continue with entities that no longer reflect the database."}, {"n": 73, "category": 4, "difficulty": "C", "html": "Rollback rules with a custom exception hierarchy, and when <code>noRollbackFor<\/code> is legitimate.", "answerTitle": "Rollback rules", "answer": "<p>Default: rollback on <code>RuntimeException<\/code> and <code>Error<\/code>, commit on checked exceptions. With a custom hierarchy, the cleanest approach is a single unchecked base (<code>DomainException extends RuntimeException<\/code>) so everything rolls back by default, and then <code>noRollbackFor<\/code> for the specific cases where it should not.<\/p><p><code>noRollbackFor<\/code> is legitimate when the exception is a <em>business outcome<\/em> rather than a failure - <code>InsufficientFundsException<\/code> where you still want to persist the attempted-transaction audit row, or a validation exception thrown after you have deliberately recorded the rejection. Say clearly that this is a deliberate design choice, because the reviewer&#x27;s default assumption is that it is a mistake.<\/p><p>Rules are matched by the <em>deepest<\/em> (most specific) match on the exception class hierarchy, and <code>rollbackFor<\/code> on a nested method does not affect the outer transaction&#x27;s own rules.<\/p>", "source": "answers.md", "search": "rollback rules with a custom exception hierarchy, and when norollbackfor is legitimate. default: rollback on runtimeexception and error, commit on checked exceptions. with a custom hierarchy, the cleanest approach is a single unchecked base (domainexception extends runtimeexception) so everything rolls back by default, and then norollbackfor for the specific cases where it should not. norollbackfor is legitimate when the exception is a business outcome rather than a failure - insufficientfundsexception where you still want to persist the attempted-transaction audit row, or a validation exception thrown after you have deliberately recorded the rejection. say clearly that this is a deliberate design choice, because the reviewer's default assumption is that it is a mistake. rules are matched by the deepest (most specific) match on the exception class hierarchy, and rollbackfor on a nested method does not affect the outer transaction's own rules."}, {"n": 74, "category": 4, "difficulty": "T", "html": "You catch an exception inside a transactional method and return normally. When does the transaction still roll back?", "answerTitle": "Catching inside a transactional method", "answer": "<p>If you catch the exception, the <em>transaction advisor never sees it<\/em>, so it does not mark rollback. The transaction commits with whatever was written before the exception - a partial write, which is usually the bug.<\/p><p>It still rolls back in two cases: if the exception escaped a <strong>nested<\/strong> <code>@Transactional<\/code> call that already set <code>rollbackOnly<\/code> (giving <code>UnexpectedRollbackException<\/code> at commit as in Q70), or if the underlying resource itself invalidated the transaction (a constraint violation in PostgreSQL aborts the transaction, and every subsequent statement fails with &quot;current transaction is aborted&quot;).<\/p><p>That last one is worth naming because it surprises people: on PostgreSQL you cannot catch a constraint violation and continue using the same transaction. You need a savepoint, or a separate transaction, or you must check before writing.<
