t? Which and when?", "answerTitle": "Testing message consumers", "answer": "<ul><li><strong>Testcontainers with a real broker<\/strong> - highest fidelity, and my default for the consumer&#x27;s own integration test. It exercises real serialization, partitioning, offset commits and error handling. Slower, but with container reuse the cost is acceptable.<\/li><li><strong><code>@EmbeddedKafka<\/code><\/strong> - an in-JVM broker, faster to start than a container but less faithful (different version, different configuration surface) and historically a source of flakiness. I now prefer Testcontainers.<\/li><li><strong>Contract tests<\/strong> (Q219) - verify the <em>message schema<\/em> between producer and consumer without either running the other. This is the right tool for compatibility, not for behavior.<\/li><li><strong>Unit tests on the handler<\/strong> - the listener method should delegate to a plain service, and that service gets ordinary unit tests. Most of the logic should be testable this way.<\/li><\/ul><p>The layering I recommend: handler logic in unit tests, one Testcontainers test per consumer covering deserialization, retry and DLQ behavior (the parts that only break in integration), and contract tests at the team boundary.<\/p>", "source": "answers.md", "search": "testing kafka or sqs consumers - embedded broker, testcontainers, or a contract? which and when? - testcontainers with a real broker - highest fidelity, and my default for the consumer's own integration test. it exercises real serialization, partitioning, offset commits and error handling. slower, but with container reuse the cost is acceptable. - @embeddedkafka - an in-jvm broker, faster to start than a container but less faithful (different version, different configuration surface) and historically a source of flakiness. i now prefer testcontainers. - contract tests (q219) - verify the message schema between producer and consumer without either running the other. this is the right tool for compatibility, not for behavior. - unit tests on the handler - the listener method should delegate to a plain service, and that service gets ordinary unit tests. most of the logic should be testable this way. the layering i recommend: handler logic in unit tests, one testcontainers test per consumer covering deserialization, retry and dlq behavior (the parts that only break in integration), and contract tests at the team boundary."}, {"n": 233, "category": 12, "difficulty": "D", "html": "ArchUnit for enforcing layering, package boundaries and Spring conventions.", "answerTitle": "ArchUnit", "answer": "<pre><code class=\"lang-java\">@ArchTest static final ArchRule domainIsFrameworkFree =\n    noClasses().that().resideInAPackage(&quot;..domain..&quot;)\n        .should().dependOnClassesThat().resideInAnyPackage(&quot;org.springframework..&quot;);\n\n@ArchTest static final ArchRule noHttpInTransaction =\n    noMethods().that().areAnnotatedWith(Transactional.class)\n        .should().callMethodWhere(target(owner(assignableTo(RestClient.class))));<\/code><\/pre><p>Rules I put in place on most Spring codebases: layering (controllers must not touch repositories directly), the domain package must not depend on Spring or JPA (Q249), no field injection, no <code>@Transactional<\/code> on private or non-public methods (Q50), no HTTP calls inside transactions (Q80), no <code>System.out<\/code>, and naming conventions.<\/p><p>The value is that it enforces the decisions that code review keeps re-litigating, with a message explaining <em>why<\/em>. Introduce rules in report-only mode against an existing codebase, fix, then enforce - a build-breaking rule with 200 pre-existing violations gets disabled rather than obeyed (Q80).<\/p>", "source": "answers.md", "search": "archunit for enforcing layering, package boundaries and spring conventions. java @archtest static final archrule domainisframeworkfree = noclasses().that().resideinapackage(\"..domain..\") .should().dependonclassesthat().resideinanypackage(\"org.springframework..\"); @archtest static final archrule nohttpintransaction = nomethods().that().areannotatedwith(transactional.class) .should().callmethodwhere(target(owner(assignableto(restclient.class)))); rules i put in place on most spring codebases: layering (controllers must not touch repositories directly), the domain package must not depend on spring or jpa (q249), no field injection, no @transactional on private or non-public methods (q50), no http calls inside transactions (q80), no system.out, and naming conventions. the value is that it enforces the decisions that code review keeps re-litigating, with a message explaining why . introduce rules in report-only mode against an existing codebase, fix, then enforce - a build-breaking rule with 200 pre-existing violations gets disabled rather than obeyed (q80)."}, {"n": 234, "category": 12, "difficulty": "D", "html": "Causes of flaky tests specific to Spring, and how you eliminate each.", "answerTitle": "Spring-specific flakiness", "answer": "<p>Causes I look for, roughly in order of frequency:<\/p><ul><li><strong>Shared mutable state across tests<\/strong> - a singleton bean holding state, a static cache, a <code>@MockBean<\/code> whose stubbing leaks because reset behavior was assumed. Contexts are cached and <em>shared<\/em>, so a test that mutates a bean affects later tests in a non-deterministic order.<\/li><li><strong>Test ordering dependence<\/strong> - tests passing individually and failing in a suite. Random ordering in CI surfaces this deliberately.<\/li><li><strong>Time<\/strong> - <code>Instant.now()<\/code>, timezone differences between the developer machine and CI, and daylight-saving boundaries. Inject a <code>Clock<\/code>.<\/li><li><strong>Async without Awaitility<\/strong> - a sleep that is long enough locally and not on a loaded CI agent.<\/li><li><strong>Random ports and container startup races<\/strong>, and tests assuming a container is ready when the port is open.<\/li><li><strong>Database state<\/strong> - tests relying on data from another test, or an identity sequence that is not reset.<\/li><li><strong><code>@DirtiesContext<\/code> interacting with parallel execution<\/strong>.<\/li><\/ul><p>The systemic fixes: randomize order, run tests in parallel deliberately to expose shared state, ban <code>Thread.sleep<\/code> with a lint rule, inject <code>Clock<\/code>, and treat a flaky test as a build-blocking defect rather than something to re-run. A quarantine with an expiry date works better than a permanent <code>@Disabled<\/code>.<\/p>", "source": "answers.md", "search": "causes of flaky tests specific to spring, and how you eliminate each. causes i look for, roughly in order of frequency: - shared mutable state across tests - a singleton bean holding state, a static cache, a @mockbean whose stubbing leaks because reset behavior was assumed. contexts are cached and shared , so a test that mutates a bean affects later tests in a non-deterministic order. - test ordering dependence - tests passing individually and failing in a suite. random ordering in ci surfaces this deliberately. - time - instant.now(), timezone differences between the developer machine and ci, and daylight-saving boundaries. inject a clock. - async without awaitility - a sleep that is long enough locally and not on a loaded ci agent. - random ports and container startup races , and tests assuming a container is ready when the port is open. - database state - tests relying on data from another test, or an identity sequence that is not reset. - @dirtiescontext interacting with parallel execution . the systemic fixes: randomize order, run tests in parallel deliberately to expose shared state, ban thread.sleep with a lint rule, inject clock, and treat a flaky test as a build-blocking defect rather than something to re-run. a quarantine with an expiry date works better than a permanent @disabled."}, {"n": 235, "category": 12, "difficulty": "D", "html": "A <code>@SpringBootTest<\/code> suite takes 25 minutes. Walk through how you get it under ten.", "answerTitle": "From 25 minutes to under ten", "answer": "<p>Measure first - which tests, and where the time goes between context startup and test execution.<\/p><ol><li><strong>Count the contexts<\/strong> (Q221). This is usually the single largest win: consolidating <code>@MockBean<\/code> combinations and standardizing on a few configurations can remove tens of context startups.<\/li><li><strong>Move tests down the pyramid.<\/strong> Most <code>@SpringBootTest<\/code> classes are testing logic that needs no context. Converting them to plain Mockito tests turns seconds into milliseconds each.<\/li><li><strong>Container reuse and shared containers<\/strong> (Q227) - a static container per class, or a singleton container pattern shared across the whole suite, rather than one per class.<\/li><li><strong>Parallel execution<\/strong> - JUnit 5 <code>junit.jupiter.execution.parallel.enabled<\/code>, which requires the isolation work from Q234 and is therefore also a quality improvement.<\/li><li><strong>Remove <code>@DirtiesContext<\/code><\/strong> wherever the underlying state issue can be fixed properly.<\/li><li><strong>Split the suite<\/strong> - fast tests on every commit, slower integration tests on merge, so developer feedback is minutes even if total runtime is not.<\/li><li><strong>Build-level wins<\/strong> - Gradle build cache and test result caching so unchanged modules do not re-run.<\/li><\/ol><p>And a point worth making: a 25-minute suite changes team behavior - people batch changes and stop running tests locally - so this is a delivery problem, not just a cost one.<\/p>", "source": "answers.md", "search": "a @springboottest suite takes 25 minutes. walk through how you get it under ten. measure first - which tests, and where the time goes between context startup and test execution. 1. count the contexts (q221). this is usually the single largest win: consolidating @mockbean combinations and standardizing on a few configurations can remove tens of context startups. 2. move tests down the pyramid. most @springboottest classes are testing logic that needs no context. converting them to plain mockito tests turns seconds into milliseconds each. 3. container reuse and shared containers (q227) - a static container per class, or a singleton container pattern shared across the whole suite, rather than one per class. 4. parallel execution - junit 5 junit.jupiter.execution.parallel.enabled, which requires the isolation work from q234 and is therefore also a quality improvement. 5. remove @dirtiescontext wherever the underlying state issue can be fixed properly. 6. split the suite - fast tests on every commit, slower integration tests on merge, so developer feedback is minutes even if total runtime is not. 7. build-level wins - gradle build cache and test result caching so unchanged modules do not re-run. and a point worth making: a 25-minute suite changes team behavior - people batch changes and stop running tests locally - so this is a delivery problem, not just a cost one."}, {"n": 236, "category": 12, "difficulty": "A", "html": "Define the test strategy you would mandate for a new Spring service.", "answerTitle": "Test strategy for a new service", "answer": "<p>What I would mandate, with the reasoning attached because a strategy nobody believes in is not followed:<\/p><ul><li><strong>A pyramid, weighted heavily to unit tests<\/strong> on domain logic with no Spring context. Constructor injection makes this possible, which is why it is a standard.<\/li><li><strong>Slice tests<\/strong> for the web and persistence layers, with explicit <code>@Import<\/code> of the real configuration so they test what production runs (Q164).<\/li><li><strong>A small number of integration tests<\/strong> with Testcontainers covering the paths that only break in integration: transactions across a boundary, serialization, security, messaging retry and DLQ.<\/li><li><strong>Contract tests<\/strong> at every team boundary (Q219).<\/li><li><strong>ArchUnit rules<\/strong> encoding the architectural decisions (Q233).<\/li><li><strong>No <code>@Transactional<\/code> on tests asserting cross-boundary behavior<\/strong> (Q228).<\/li><li><strong>An injected <code>Clock<\/code>, Awaitility instead of sleeps, and randomized test order<\/strong> as non-negotiables.<\/li><li><strong>A target on the fast suite<\/strong> - under five minutes for the commit stage, treated as a real requirement with a named owner.<\/li><\/ul><p>What I would deliberately <em>not<\/em> mandate: a coverage percentage. It produces assertion-free tests and measures the wrong thing. I would measure <strong>change failure rate<\/strong> and <strong>mutation score<\/strong> on core modules instead, and review test quality in code review the same way as production code.<\/p>", "source": "answers.md", "search": "define the test strategy you would mandate for a new spring service. what i would mandate, with the reasoning attached because a strategy nobody believes in is not followed: - a pyramid, weighted heavily to unit tests on domain logic with no spring context. constructor injection makes this possible, which is why it is a standard. - slice tests for the web and persistence layers, with explicit @import of the real configuration so they test what production runs (q164). - a small number of integration tests with testcontainers covering the paths that only break in integration: transactions across a boundary, serialization, security, messaging retry and dlq. - contract tests at every team boundary (q219). - archunit rules encoding the architectural decisions (q233). - no @transactional on tests asserting cross-boundary behavior (q228). - an injected clock, awaitility instead of sleeps, and randomized test order as non-negotiables. - a target on the fast suite - under five minutes for the commit stage, treated as a real requirement with a named owner. what i would deliberately not mandate: a coverage percentage. it produces assertion-free tests and measures the wrong thing. i would measure change failure rate and mutation score on core modules instead, and review test quality in code review the same way as production code."}, {"n": 237, "category": 13, "difficulty": "C", "html": "The <code>ChatClient<\/code> fluent API - system and user messages, options, and where prompts should actually live.", "answerTitle": "`ChatClient`", "answer": "<pre><code class=\"lang-java\">String answer = chatClient.prompt()\n    .system(&quot;You are a support assistant. Answer only from the provided context.&quot;)\n    .user(u -&gt; u.text(&quot;Summarize order {id}&quot;).param(&quot;id&quot;, orderId))\n    .options(ChatOptions.builder().temperature(0.2).build())\n    .call().content();<\/code><\/pre><p>It is a fluent facade over the provider-specific <code>ChatModel<\/code>, with <code>call()<\/code> for blocking and <code>stream()<\/code> for a <code>Flux&lt;String&gt;<\/code>. Default system prompts and advisors can be set on the builder so every call in a service shares them.<\/p><p><strong>Where prompts should live<\/strong> is the more interesting half of the question. Not inline string literals scattered through services: prompts are business logic that changes independently of code, needs review, versioning and evaluation. I keep them as versioned resources (<code>PromptTemplate<\/code> loaded from <code>classpath:/prompts/order-summary.st<\/code>), reference the version in telemetry so a quality change can be attributed to a prompt change, and run them through the evaluation suite in CI (Q245).<\/p>", "source": "answers.md", "search": "the chatclient fluent api - system and user messages, options, and where prompts should actually live. java string answer = chatclient.prompt() .system(\"you are a support assistant. answer only from the provided context.\") .user(u - u.text(\"summarize order {id}\").param(\"id\", orderid)) .options(chatoptions.builder().temperature(0.2).build()) .call().content(); it is a fluent facade over the provider-specific chatmodel, with call() for blocking and stream() for a flux<string . default system prompts and advisors can be set on the builder so every call in a service shares them. where prompts should live is the more interesting half of the question. not inline string literals scattered through services: prompts are business logic that changes independently of code, needs review, versioning and evaluation. i keep them as versioned resources (prompttemplate loaded from classpath:/prompts/order-summary.st), reference the version in telemetry so a quality change can be attributed to a prompt change, and run them through the evaluation suite in ci (q245)."}, {"n": 238, "category": 13, "difficulty": "D", "html": "Advisors - what problem do they solve, and which are built in?", "answerTitle": "Advisors", "answer": "<p>Advisors are the interceptor chain for a chat call - the same idea as a <code>HandlerInterceptor<\/code> or a servlet filter, applied to prompts and responses. They let you inject retrieved context, manage memory, log, or post-process without every call site repeating the logic.<\/p><p>Built-in ones worth naming: <code>QuestionAnswerAdvisor<\/code> (RAG - retrieves from a <code>VectorStore<\/code> and injects into the prompt), <code>MessageChatMemoryAdvisor<\/code> and <code>PromptChatMemoryAdvisor<\/code> (conversation history), <code>SimpleLoggerAdvisor<\/code>, and <code>SafeGuardAdvisor<\/code> for basic content filtering.<\/p><p>Custom advisors are where the production concerns go: PII redaction before the call and after the response, token budget enforcement, tenant-scoped retrieval filters, cost attribution, and caching. That is the right layer for them - centralized, testable, and applied consistently rather than depending on each developer remembering.<\/p>", "source": "answers.md", "search": "advisors - what problem do they solve, and which are built in? advisors are the interceptor chain for a chat call - the same idea as a handlerinterceptor or a servlet filter, applied to prompts and responses. they let you inject retrieved context, manage memory, log, or post-process without every call site repeating the logic. built-in ones worth naming: questionansweradvisor (rag - retrieves from a vectorstore and injects into the prompt), messagechatmemoryadvisor and promptchatmemoryadvisor (conversation history), simpleloggeradvisor, and safeguardadvisor for basic content filtering. custom advisors are where the production concerns go: pii redaction before the call and after the response, token budget enforcement, tenant-scoped retrieval filters, cost attribution, and caching. that is the right layer for them - centralized, testable, and applied consistently rather than depending on each developer remembering."}, {"n": 239, "category": 13, "difficulty": "D", "html": "Structured output with <code>entity()<\/code> - how does it work, and what happens when the model returns invalid JSON?", "answerTitle": "Structured output", "answer": "<pre><code class=\"lang-java\">record OrderSummary(String status, BigDecimal total, List&lt;String&gt; issues) {}\n\nOrderSummary summary = chatClient.prompt()\n    .user(&quot;Summarize this order: &quot; + json)\n    .call().entity(OrderSummary.class);<\/code><\/pre><p><code>entity()<\/code> uses a <code>StructuredOutputConverter<\/code> that generates a JSON schema from the target type, appends format instructions to the prompt, and parses the response. With providers supporting native structured output or tool calling, the schema is enforced by the model rather than requested in prose, which is considerably more reliable.<\/p><p><strong>When the model returns invalid JSON<\/strong>, the converter throws a parse exception. The defensive design that matters:<\/p><ul><li>Prefer providers and modes with <strong>native<\/strong> JSON schema enforcement over prompt-based instructions.<\/li><li><strong>Retry once<\/strong> with the parse error fed back, which recovers most cases.<\/li><li><strong>Validate the parsed object<\/strong> with JSR-303 - schema-valid does not mean semantically valid, and a hallucinated enum value or a negative total will parse fine.<\/li><li><strong>Have a defined fallback<\/strong> - degrade to unstructured text, or fail the feature cleanly, rather than propagating a partially-parsed object.<\/li><\/ul><p>Treat the model as an untrusted input source, because that is exactly what it is.<\/p>", "source": "answers.md", "search": "structured output with entity() - how does it work, and what happens when the model returns invalid json? java record ordersummary(string status, bigdecimal total, list<string issues) {} ordersummary summary = chatclient.prompt() .user(\"summarize this order: \" + json) .call().entity(ordersummary.class); entity() uses a structuredoutputconverter that generates a json schema from the target type, appends format instructions to the prompt, and parses the response. with providers supporting native structured output or tool calling, the schema is enforced by the model rather than requested in prose, which is considerably more reliable. when the model returns invalid json , the converter throws a parse exception. the defensive design that matters: - prefer providers and modes with native json schema enforcement over prompt-based instructions. - retry once with the parse error fed back, which recovers most cases. - validate the parsed object with jsr-303 - schema-valid does not mean semantically valid, and a hallucinated enum value or a negative total will parse fine. - have a defined fallback - degrade to unstructured text, or fail the feature cleanly, rather than propagating a partially-parsed object. treat the model as an untrusted input source, because that is exactly what it is."}, {"n": 240, "category": 13, "difficulty": "D", "html": "Tool calling in Spring AI - registration, execution and the security boundary you must enforce.", "answerTitle": "Tool calling", "answer": "<pre><code class=\"lang-java\">@Bean\n@Description(&quot;Look up the current status of an order by its ID&quot;)\nFunction&lt;OrderRequest, OrderStatus&gt; orderStatus(OrderService service) {\n    return req -&gt; service.status(req.orderId());\n}<\/code><\/pre><p>or <code>@Tool<\/code>-annotated methods registered with <code>.tools(myToolBean)<\/code>. Spring AI generates the JSON schema from the types, sends the tool definitions with the prompt, and when the model requests a call, executes it and feeds the result back for the next turn.<\/p><p><strong>The security boundary is the critical part<\/strong>, and it is the whole of Q215 in the Java pack made concrete. The model decides which tool to call and with what arguments, and that decision can be influenced by injected content in a retrieved document. Therefore:<\/p><ul><li>Tools run with the <strong>application&#x27;s<\/strong> authority, not the model&#x27;s judgement - authorize every tool invocation against the <em>end user&#x27;s<\/em> permissions, exactly as you would an API call.<\/li><li>Validate arguments as untrusted input; never interpolate them into SQL, shell commands or URLs.<\/li><li>Scope tools narrowly and read-only by default; anything irreversible or high-value requires explicit human confirmation.<\/li><li>Bound the number of tool-calling turns, or a loop will happily consume your budget.<\/li><li>Audit every invocation with arguments and results.<\/li><\/ul><p>A tool that takes a raw query string and executes it is the AI-era equivalent of SQL injection.<\/p>", "source": "answers.md", "search": "tool calling in spring ai - registration, execution and the security boundary you must enforce. java @bean @description(\"look up the current status of an order by its id\") function<orderrequest, orderstatus orderstatus(orderservice service) { return req - service.status(req.orderid()); } or @tool-annotated methods registered with .tools(mytoolbean). spring ai generates the json schema from the types, sends the tool definitions with the prompt, and when the model requests a call, executes it and feeds the result back for the next turn. the security boundary is the critical part , and it is the whole of q215 in the java pack made concrete. the model decides which tool to call and with what arguments, and that decision can be influenced by injected content in a retrieved document. therefore: - tools run with the application's authority, not the model's judgement - authorize every tool invocation against the end user's permissions, exactly as you would an api call. - validate arguments as untrusted input; never interpolate them into sql, shell commands or urls. - scope tools narrowly and read-only by default; anything irreversible or high-value requires explicit human confirmation. - bound the number of tool-calling turns, or a loop will happily consume your budget. - audit every invocation with arguments and results. a tool that takes a raw query string and executes it is the ai-era equivalent of sql injection."}, {"n": 241, "category": 13, "difficulty": "D", "html": "The <code>VectorStore<\/code> abstraction, document readers, splitters and metadata filters.", "answerTitle": "Vector stores and ingestion", "answer": "<p><code>VectorStore<\/code> abstracts pgvector, Redis, OpenSearch, Qdrant, Pinecone, Chroma and others behind <code>add(List&lt;Document&gt;)<\/code> and <code>similaritySearch(SearchRequest)<\/code>. The ETL pipeline is <code>DocumentReader<\/code> (PDF, HTML, JSON, Tika) → <code>DocumentTransformer<\/code> (<code>TokenTextSplitter<\/code>, metadata enrichers) → <code>DocumentWriter<\/code>.<\/p><p><strong>Metadata filters<\/strong> are the feature that matters most in production:<\/p><pre><code class=\"lang-java\">vectorStore.similaritySearch(SearchRequest.query(question)\n    .withTopK(5).withSimilarityThreshold(0.7)\n    .withFilterExpression(&quot;tenant == &#x27;&quot; + tenantId + &quot;&#x27; &amp;&amp; status == &#x27;published&#x27;&quot;));<\/code><\/pre><p>That filter is a <strong>security control<\/strong> in a multi-tenant system, not a relevance tweak - it must be applied as a pre-filter derived from the authenticated principal, never from user input, and never applied after retrieval (<code>01-java<\/code> Q212). I would test it the same way I test tenant isolation in the database: authenticate as tenant A and assert nothing from tenant B is ever retrievable.<\/p><p>Also store the <strong>embedding model version<\/strong> with each vector, so a model change is detectable and triggers a controlled re-index rather than a silently mixed index.<\/p>", "source": "answers.md", "search": "the vectorstore abstraction, document readers, splitters and metadata filters. vectorstore abstracts pgvector, redis, opensearch, qdrant, pinecone, chroma and others behind add(list<document ) and similaritysearch(searchrequest). the etl pipeline is documentreader (pdf, html, json, tika) → documenttransformer (tokentextsplitter, metadata enrichers) → documentwriter. metadata filters are the feature that matters most in production: java vectorstore.similaritysearch(searchrequest.query(question) .withtopk(5).withsimilaritythreshold(0.7) .withfilterexpression(\"tenant == '\" + tenantid + \"' && status == 'published'\")); that filter is a security control in a multi-tenant system, not a relevance tweak - it must be applied as a pre-filter derived from the authenticated principal, never from user input, and never applied after retrieval (01-java q212). i would test it the same way i test tenant isolation in the database: authenticate as tenant a and assert nothing from tenant b is ever retrievable. also store the embedding model version with each vector, so a model change is detectable and triggers a controlled re-index rather than a silently mixed index."}, {"n": 242, "category": 13, "difficulty": "D", "html": "<code>QuestionAnswerAdvisor<\/code> and RAG wiring - what does it give you, and what must you still build yourself?", "answerTitle": "`QuestionAnswerAdvisor` and RAG", "answer": "<pre><code class=\"lang-java\">chatClient.prompt().user(question)\n    .advisors(new QuestionAnswerAdvisor(vectorStore, SearchRequest.defaults().withTopK(5)))\n    .call().content();<\/code><\/pre><p>It embeds the question, searches the store, injects the results into the prompt with a default template, and returns the retrieved documents in the response context for citation.<\/p><p>What it gives you is the <em>plumbing<\/em>. What you still have to build is everything that determines quality (<code>01-java<\/code> Q212):<\/p><ul><li><strong>Hybrid retrieval<\/strong> - lexical plus vector with rank fusion. Pure vector search fails on exact terms, codes and negation.<\/li><li><strong>Reranking<\/strong> with a cross-encoder over the fused candidates, usually the largest single quality gain.<\/li><li><strong>Chunking strategy<\/strong> tuned to your corpus, with structure awareness and metadata.<\/li><li><strong>Grounding enforcement<\/strong> - requiring citations and verifying they resolve, rather than trusting the model not to blend in its own priors.<\/li><li><strong>Tenant and ACL filtering<\/strong> at query time.<\/li><li><strong>Evaluation<\/strong> (Q245) - without measured retrieval hit rate and faithfulness, every change is a guess.<\/li><\/ul><p>So the honest framing: the advisor is 10 percent of a production RAG system, and the remaining 90 percent is retrieval quality, safety and measurement.<\/p>", "source": "answers.md", "search": "questionansweradvisor and rag wiring - what does it give you, and what must you still build yourself? java chatclient.prompt().user(question) .advisors(new questionansweradvisor(vectorstore, searchrequest.defaults().withtopk(5))) .call().content(); it embeds the question, searches the store, injects the results into the prompt with a default template, and returns the retrieved documents in the response context for citation. what it gives you is the plumbing . what you still have to build is everything that determines quality (01-java q212): - hybrid retrieval - lexical plus vector with rank fusion. pure vector search fails on exact terms, codes and negation. - reranking with a cross-encoder over the fused candidates, usually the largest single quality gain. - chunking strategy tuned to your corpus, with structure awareness and metadata. - grounding enforcement - requiring citations and verifying they resolve, rather than trusting the model not to blend in its own priors. - tenant and acl filtering at query time. - evaluation (q245) - without measured retrieval hit rate and faithfulness, every change is a guess. so the honest framing: the advisor is 10 percent of a production rag system, and the remaining 90 percent is retrieval quality, safety and measurement."}, {"n": 243, "category": 13, "difficulty": "D", "html": "Chat memory options - and why unbounded conversation history is a cost defect, not a feature.", "answerTitle": "Chat memory", "answer": "<p>Spring AI provides <code>ChatMemory<\/code> implementations - in-memory, JDBC, Cassandra, Neo4j - wired through <code>MessageChatMemoryAdvisor<\/code> (sends prior messages) or <code>PromptChatMemoryAdvisor<\/code> (summarizes into the system prompt), with <code>MessageWindowChatMemory<\/code> bounding by message count.<\/p><p>Unbounded history is a <strong>cost defect<\/strong> with a compounding shape, and being able to explain that is the point: every turn resends the entire conversation, so token usage grows quadratically with conversation length. A 50-turn conversation does not cost 50 units, it costs roughly 1,275. It also eventually exceeds the context window and fails outright, and long contexts degrade answer quality as relevant detail is diluted.<\/p><p>Controls: a hard window (last N turns), summarization of older turns into a compact form, a per-conversation token budget with a defined behavior when exceeded, provider-side prompt caching for the stable prefix, and a retention policy - conversation history is user data with privacy and deletion obligations, and storing it forever is both a cost and a compliance decision.<\/p>", "source": "answers.md", "search": "chat memory options - and why unbounded conversation history is a cost defect, not a feature. spring ai provides chatmemory implementations - in-memory, jdbc, cassandra, neo4j - wired through messagechatmemoryadvisor (sends prior messages) or promptchatmemoryadvisor (summarizes into the system prompt), with messagewindowchatmemory bounding by message count. unbounded history is a cost defect with a compounding shape, and being able to explain that is the point: every turn resends the entire conversation, so token usage grows quadratically with conversation length. a 50-turn conversation does not cost 50 units, it costs roughly 1,275. it also eventually exceeds the context window and fails outright, and long contexts degrade answer quality as relevant detail is diluted. controls: a hard window (last n turns), summarization of older turns into a compact form, a per-conversation token budget with a defined behavior when exceeded, provider-side prompt caching for the stable prefix, and a retention policy - conversation history is user data with privacy and deletion obligations, and storing it forever is both a cost and a compliance decision."}, {"n": 244, "category": 13, "difficulty": "D", "html": "Observability and cost attribution for AI calls in a Spring service.", "answerTitle": "Observability and cost", "answer": "<p>Spring AI integrates with Micrometer Observations, producing spans and metrics for model calls, embeddings, vector store operations and tool invocations, including token counts.<\/p><p>What I record on every call: prompt tokens, completion tokens, total cost derived from the model&#x27;s pricing, latency and time-to-first-token for streaming, model name and version, prompt version, tenant, feature, and outcome including whether a retry or fallback occurred.<\/p><p>Then the dimensions matter more than the totals - cost must be attributable <strong>per feature and per tenant<\/strong>, or you cannot answer &quot;which feature is expensive&quot; or &quot;is this customer profitable&quot;, and those are the questions that arrive within a month of launch. I put it on a dashboard the team sees weekly and set a budget alert per feature, because AI cost grows quietly with usage rather than announcing itself.<\/p><p>Also: sample prompts and responses into a store for evaluation and debugging, with PII handling applied, since you cannot improve what you cannot inspect - but sample rather than log everything, because prompts and responses are both large and sensitive.<\/p>", "source": "answers.md", "search": "observability and cost attribution for ai calls in a spring service. spring ai integrates with micrometer observations, producing spans and metrics for model calls, embeddings, vector store operations and tool invocations, including token counts. what i record on every call: prompt tokens, completion tokens, total cost derived from the model's pricing, latency and time-to-first-token for streaming, model name and version, prompt version, tenant, feature, and outcome including whether a retry or fallback occurred. then the dimensions matter more than the totals - cost must be attributable per feature and per tenant , or you cannot answer \"which feature is expensive\" or \"is this customer profitable\", and those are the questions that arrive within a month of launch. i put it on a dashboard the team sees weekly and set a budget alert per feature, because ai cost grows quietly with usage rather than announcing itself. also: sample prompts and responses into a store for evaluation and debugging, with pii handling applied, since you cannot improve what you cannot inspect - but sample rather than log everything, because prompts and responses are both large and sensitive."}, {"n": 245, "category": 13, "difficulty": "T", "html": "How do you test and evaluate a Spring AI feature when the output is non-deterministic?", "answerTitle": "Testing and evaluating", "answer": "<p>Deterministic assertions are unit tests; quality is an evaluation suite. Both are needed.<\/p><p><strong>In the test suite<\/strong> (deterministic, runs in CI): mock the <code>ChatModel<\/code> and assert your own logic - that the prompt was assembled correctly, that retrieval filters included the tenant, that a malformed response is handled, that the token budget is enforced, that tool arguments are validated. Most of the code around the model is ordinary logic and should be tested as such.<\/p><p><strong>In the evaluation suite<\/strong> (non-deterministic, also runs in CI on prompt or model changes):<\/p><ul><li>A <strong>golden dataset<\/strong> of realistic cases, grown from real failures.<\/li><li><strong>Deterministic checks first<\/strong> - schema validity, citations resolving to real chunks, no PII in output, cost and latency within bounds, correct refusal on out-of-scope input. A surprising share of regressions are caught here.<\/li><li><strong>Component metrics<\/strong> - retrieval recall@k separately from answer faithfulness and relevance, because isolating them is what makes failures diagnosable.<\/li><li><strong>LLM-as-judge<\/strong> with a rubric, a stronger judge model, pairwise comparison rather than absolute scoring, and periodic calibration against human labels.<\/li><li><strong>Thresholds as release criteria<\/strong>, reported with a confidence interval rather than a single number.<\/li><\/ul><p>Spring AI provides <code>RelevancyEvaluator<\/code> and <code>FactCheckingEvaluator<\/code> as starting points. The discipline that matters is treating prompts as versioned code and re-running evaluation on every prompt, model or retrieval change - including when the provider silently updates a model, which is why model versions should be pinned.<\/p>", "source": "answers.md", "search": "how do you test and evaluate a spring ai feature when the output is non-deterministic? deterministic assertions are unit tests; quality is an evaluation suite. both are needed. in the test suite (deterministic, runs in ci): mock the chatmodel and assert your own logic - that the prompt was assembled correctly, that retrieval filters included the tenant, that a malformed response is handled, that the token budget is enforced, that tool arguments are validated. most of the code around the model is ordinary logic and should be tested as such. in the evaluation suite (non-deterministic, also runs in ci on prompt or model changes): - a golden dataset of realistic cases, grown from real failures. - deterministic checks first - schema validity, citations resolving to real chunks, no pii in output, cost and latency within bounds, correct refusal on out-of-scope input. a surprising share of regressions are caught here. - component metrics - retrieval recall@k separately from answer faithfulness and relevance, because isolating them is what makes failures diagnosable. - llm-as-judge with a rubric, a stronger judge model, pairwise comparison rather than absolute scoring, and periodic calibration against human labels. - thresholds as release criteria , reported with a confidence interval rather than a single number. spring ai provides relevancyevaluator and factcheckingevaluator as starting points. the discipline that matters is treating prompts as versioned code and re-running evaluation on every prompt, model or retrieval change - including when the provider silently updates a model, which is why model versions should be pinned."}, {"n": 246, "category": 13, "difficulty": "A", "html": "Would you adopt Spring AI or wrap the provider SDK behind your own interface? Justify it.", "answerTitle": "Spring AI or the raw SDK", "answer": "<p>I would use Spring AI, but keep it behind my own domain interface.<\/p><p>What it genuinely gives me: a provider-agnostic client so switching or A/B-testing models is a configuration change; structured output binding to Java types; tool calling with schema generation; the document ETL and <code>VectorStore<\/code> abstraction; and - the underrated one - native integration with Boot&#x27;s auto-configuration, Micrometer observability and testing support, which is otherwise a meaningful amount of plumbing per project.<\/p><p>What I would still own: prompt management and versioning, the evaluation harness, cost attribution and budget enforcement, retrieval strategy including hybrid search and reranking, guardrails and tenant isolation. Those determine product quality and are not commodity infrastructure.<\/p><p>The reason for the wrapper interface is that Spring AI is young and its abstractions are still settling - the advisor and memory APIs have changed across recent versions. Letting its types spread through the codebase means a library upgrade becomes a refactor of every service. A thin <code>AnswerGenerator<\/code> interface in the domain, implemented in the infrastructure layer, costs almost nothing and contains that risk - the same discipline I would apply to any fast-moving dependency.<\/p><p>I would not write directly against a provider SDK, because that guarantees a rewrite the first time you change or add a model provider, which in this space is a matter of months.<\/p>", "source": "answers.md", "search": "would you adopt spring ai or wrap the provider sdk behind your own interface? justify it. i would use spring ai, but keep it behind my own domain interface. what it genuinely gives me: a provider-agnostic client so switching or a/b-testing models is a configuration change; structured output binding to java types; tool calling with schema generation; the document etl and vectorstore abstraction; and - the underrated one - native integration with boot's auto-configuration, micrometer observability and testing support, which is otherwise a meaningful amount of plumbing per project. what i would still own: prompt management and versioning, the evaluation harness, cost attribution and budget enforcement, retrieval strategy including hybrid search and reranking, guardrails and tenant isolation. those determine product quality and are not commodity infrastructure. the reason for the wrapper interface is that spring ai is young and its abstractions are still settling - the advisor and memory apis have changed across recent versions. letting its types spread through the codebase means a library upgrade becomes a refactor of every service. a thin answergenerator interface in the domain, implemented in the infrastructure layer, costs almost nothing and contains that risk - the same discipline i would apply to any fast-moving dependency. i would not write directly against a provider sdk, because that guarantees a rewrite the first time you change or add a model provider, which in this space is a matter of months."}, {"n": 247, "category": 14, "difficulty": "D", "html": "Spring Modulith - what does it enforce, and how does it verify module boundaries at build time?", "answerTitle": "Spring Modulith", "answer": "<p>Modulith treats each top-level package under the application root as a <strong>module<\/strong>, with its direct package being the public API and sub-packages internal by default. It verifies at build time:<\/p><pre><code class=\"lang-java\">@Test void verifyModularity() {\n    ApplicationModules.of(Application.class).verify();\n}<\/code><\/pre><p>This fails if a module reaches into another module&#x27;s internal package, if there are cyclic dependencies between modules, or if a module accesses an undeclared dependency. <code>@ApplicationModule(allowedDependencies = &quot;order&quot;)<\/code> makes the permitted edges explicit.<\/p><p>It also generates documentation - PlantUML component diagrams and module canvases - from the code, which is the only architecture documentation that stays current. And <code>@ApplicationModuleTest<\/code> bootstraps a single module in isolation, which is a genuinely useful middle tier between unit and full integration tests.<\/p><p>The value over ArchUnit is that the rules are derived from package structure rather than written out, so they are harder to get wrong and cheaper to adopt.<\/p>", "source": "answers.md", "search": "spring modulith - what does it enforce, and how does it verify module boundaries at build time? modulith treats each top-level package under the application root as a module , with its direct package being the public api and sub-packages internal by default. it verifies at build time: java @test void verifymodularity() { applicationmodules.of(application.class).verify(); } this fails if a module reaches into another module's internal package, if there are cyclic dependencies between modules, or if a module accesses an undeclared dependency. @applicationmodule(alloweddependencies = \"order\") makes the permitted edges explicit. it also generates documentation - plantuml component diagrams and module canvases - from the code, which is the only architecture documentation that stays current. and @applicationmoduletest bootstraps a single module in isolation, which is a genuinely useful middle tier between unit and full integration tests. the value over archunit is that the rules are derived from package structure rather than written out, so they are harder to get wrong and cheaper to adopt."}, {"n": 248, "category": 14, "difficulty": "D", "html": "Modulith application events and the event publication registry - how does this relate to the transactional outbox?", "answerTitle": "Modulith events and the outbox", "answer": "<p>Modules communicate through application events rather than direct calls, which is what keeps the dependency graph acyclic. The problem is that a plain in-memory event is lost if the process dies after commit (Q79).<\/p><p>The <strong>event publication registry<\/strong> solves this: Modulith persists an <code>event_publication<\/code> row for each <code>@ApplicationModuleListener<\/code> in the <em>same transaction<\/em> as the business change, and marks it complete when the listener succeeds. Incomplete publications are republished on restart (<code>spring.modulith.republish-outstanding-events-on-restart<\/code>), and are queryable and resubmittable at runtime.<\/p><p>So it is an <strong>outbox for in-process events<\/strong>, giving at-least-once delivery within the application - which means listeners must still be idempotent. <code>@ApplicationModuleListener<\/code> is a composed annotation combining <code>@Async<\/code>, <code>@Transactional(propagation = REQUIRES_NEW)<\/code> and <code>@TransactionalEventListener(AFTER_COMMIT)<\/code>, which is exactly the correct combination from Q19 and Q62 packaged so people stop getting it wrong.<\/p><p>The strategic point: this makes a modular monolith&#x27;s internal communication semantically similar to messaging, so extracting a module into a service later means changing the transport rather than the design (Q259).<\/p>", "source": "answers.md", "search": "modulith application events and the event publication registry - how does this relate to the transactional outbox? modules communicate through application events rather than direct calls, which is what keeps the dependency graph acyclic. the problem is that a plain in-memory event is lost if the process dies after commit (q79). the event publication registry solves this: modulith persists an event_publication row for each @applicationmodulelistener in the same transaction as the business change, and marks it complete when the listener succeeds. incomplete publications are republished on restart (spring.modulith.republish-outstanding-events-on-restart), and are queryable and resubmittable at runtime. so it is an outbox for in-process events , giving at-least-once delivery within the application - which means listeners must still be idempotent. @applicationmodulelistener is a composed annotation combining @async, @transactional(propagation = requires_new) and @transactionaleventlistener(after_commit), which is exactly the correct combination from q19 and q62 packaged so people stop getting it wrong. the strategic point: this makes a modular monolith's internal communication semantically similar to messaging, so extracting a module into a service later means changing the transport rather than the design (q259)."}, {"n": 249, "category": 14, "difficulty": "D", "html": "Hexagonal architecture with Spring - where do annotations belong, and how do you keep the domain framework-free?", "answerTitle": "Hexagonal with Spring", "answer": "<p>The domain package contains entities, value objects, domain services and <strong>port interfaces<\/strong>, with no Spring, JPA or Jackson annotations. Adapters in the infrastructure layer implement the ports and carry all the framework annotations - <code>@Repository<\/code> on a JPA adapter, <code>@RestController<\/code> on a web adapter.<\/p><p>Keeping the domain clean in practice:<\/p><ul><li><strong>Separate persistence models from domain models<\/strong>, with explicit mappers. This is the part teams resist because it is more code, and it is what actually delivers the independence - a shared entity annotated with both JPA and Jackson couples your database schema to your API contract permanently.<\/li><li><strong>Enforce it with a test<\/strong> (Q233) rather than a guideline: <code>noClasses().that().resideInAPackage(&quot;..domain..&quot;).should().dependOnClassesThat().resideInAnyPackage(&quot;org.springframework..&quot;, &quot;jakarta.persistence..&quot;)<\/code>.<\/li><li>Wire ports to adapters in an infrastructure <code>@Configuration<\/code> class, so the domain never sees the container.<\/li><\/ul><p>The honest trade-off: this is worth it for a genuinely complex domain with long-lived business rules, and it is over-engineering for a CRUD service. I apply it to core domain modules and let peripheral modules be straightforward Spring applications - and I would say that explicitly rather than presenting it as universally correct.<\/p>", "source": "answers.md", "search": "hexagonal architecture with spring - where do annotations belong, and how do you keep the domain framework-free? the domain package contains entities, value objects, domain services and port interfaces , with no spring, jpa or jackson annotations. adapters in the infrastructure layer implement the ports and carry all the framework annotations - @repository on a jpa adapter, @restcontroller on a web adapter. keeping the domain clean in practice: - separate persistence models from domain models , with explicit mappers. this is the part teams resist because it is more code, and it is what actually delivers the independence - a shared entity annotated with both jpa and jackson couples your database schema to your api contract permanently. - enforce it with a test (q233) rather than a guideline: noclasses().that().resideinapackage(\"..domain..\").should().dependonclassesthat().resideinanypackage(\"org.springframework..\", \"jakarta.persistence..\"). - wire ports to adapters in an infrastructure @configuration class, so the domain never sees the container. the honest trade-off: this is worth it for a genuinely complex domain with long-lived business rules, and it is over-engineering for a crud service. i apply it to core domain modules and let peripheral modules be straightforward spring applications - and i would say that explicitly rather than presenting it as universally correct."}, {"n": 250, "category": 14, "difficulty": "D", "html": "A multi-module Maven or Gradle layout for a Spring service - what belongs in each module?", "answerTitle": "Multi-module layout", "answer": "<pre><code>order-service/\n  order-domain/           # pure Java: entities, value objects, ports. No Spring.\n  order-application/      # use cases, orchestration, transaction boundaries\n  order-infrastructure/   # JPA adapters, HTTP clients, messaging, config\n  order-api/              # DTOs and contracts shared with clients (published)\n  order-bootstrap/        # @SpringBootApplication, wiring, application.yml<\/code><\/pre><p>The value is that the <strong>build enforces the dependency direction<\/strong> - <code>order-domain<\/code> has no Spring dependency on its classpath, so a violation is a compile error rather than an architecture test failure. That is stronger enforcement than any rule.<\/p><p>The costs are real and worth naming: more build configuration, slower IDE indexing, more friction for a small change, and a temptation to create modules that mirror layers rather than meaningful boundaries. For a small service, packages plus ArchUnit give most of the benefit at a fraction of the cost.<\/p><p>I would use this layout when the domain is complex, when the API module is genuinely published to other teams, or when I need to guarantee the domain stays framework-free over years.<\/p>", "source": "answers.md", "search": "a multi-module maven or gradle layout for a spring service - what belongs in each module? order-service/ order-domain/ pure java: entities, value objects, ports. no spring. order-application/ use cases, orchestration, transaction boundaries order-infrastructure/ jpa adapters, http clients, messaging, config order-api/ dtos and contracts shared with clients (published) order-bootstrap/ @springbootapplication, wiring, application.yml the value is that the build enforces the dependency direction - order-domain has no spring dependency on its classpath, so a violation is a compile error rather than an architecture test failure. that is stronger enforcement than any rule. the costs are real and worth naming: more build configuration, slower ide indexing, more friction for a small change, and a temptation to create modules that mirror layers rather than meaningful boundaries. for a small service, packages plus archunit give most of the benefit at a fraction of the cost. i would use this layout when the domain is complex, when the api module is genuinely published to other teams, or when i need to guarantee the domain stays framework-free over years."}, {"n": 251, "category": 14, "difficulty": "C", "html": "Boot 2 to Boot 3 migration - give the full checklist in order.", "answerTitle": "Boot 2 to Boot 3 checklist", "answer": "<p>In order:<\/p><ol><li><strong>Get to Boot 2.7 and Java 17 first<\/strong>, on the latest 2.7.x patch. Never do two migrations at once.<\/li><li><strong>Fix all deprecation warnings on 2.7<\/strong> - most Boot 3 breakages are things 2.7 already warned about.<\/li><li><strong>Jakarta EE namespace<\/strong> - <code>javax.*<\/code> to <code>jakarta.*<\/code> for persistence, servlet, validation, annotation. Mostly mechanical, but third-party libraries must have Jakarta-compatible versions (Q252).<\/li><li><strong>Upgrade third-party dependencies<\/strong> to Jakarta-compatible releases <em>before<\/em> the Boot upgrade where possible.<\/li><li><strong>Spring Security 5 to 6<\/strong> - the largest behavioral change (Q253).<\/li><li><strong>Configuration property changes<\/strong> - many renames and removals (Q254).<\/li><li><strong>Auto-configuration registration<\/strong> - <code>spring.factories<\/code> to <code>AutoConfiguration.imports<\/code> for any internal starters (Q185).<\/li><li><strong>Observability<\/strong> - Sleuth is gone; migrate to Micrometer Tracing, including the B3 to W3C propagation change (Q193).<\/li><li><strong>Hibernate 5 to 6<\/strong> - changed defaults for identifier generation and naming strategies, and some HQL behavior changes. This causes subtle data-layer issues and deserves its own test pass.<\/li><li><strong>Trailing slash matching removed<\/strong> in Spring 6 - <code>/orders<\/code> and <code>/orders/<\/code> are no longer equivalent, which silently breaks clients.<\/li><li>Run the <strong>OpenRewrite<\/strong> Boot 3 recipe to automate the mechanical parts, then review the diff carefully.<\/li><li>Test, deploy to a canary, and watch authentication and error rates specifically.<\/li><\/ol><p>The sequencing point matters: each step should be independently deployable, so a problem is attributable.<\/p>", "source": "answers.md", "search": "boot 2 to boot 3 migration - give the full checklist in order. in order: 1. get to boot 2.7 and java 17 first , on the latest 2.7.x patch. never do two migrations at once. 2. fix all deprecation warnings on 2.7 - most boot 3 breakages are things 2.7 already warned about. 3. jakarta ee namespace - javax. to jakarta. for persistence, servlet, validation, annotation. mostly mechanical, but third-party libraries must have jakarta-compatible versions (q252). 4. upgrade third-party dependencies to jakarta-compatible releases before the boot upgrade where possible. 5. spring security 5 to 6 - the largest behavioral change (q253). 6. configuration property changes - many renames and removals (q254). 7. auto-configuration registration - spring.factories to autoconfiguration.imports for any internal starters (q185). 8. observability - sleuth is gone; migrate to micrometer tracing, including the b3 to w3c propagation change (q193). 9. hibernate 5 to 6 - changed defaults for identifier generation and naming strategies, and some hql behavior changes. this causes subtle data-layer issues and deserves its own test pass. 10. trailing slash matching removed in spring 6 - /orders and /orders/ are no longer equivalent, which silently breaks clients. 11. run the openrewrite boot 3 recipe to automate the mechanical parts, then review the diff carefully. 12. test, deploy to a canary, and watch authentication and error rates specifically. the sequencing point matters: each step should be independently deployable, so a problem is attributable."}, {"n": 252, "category": 14, "difficulty": "T", "html": "The Jakarta namespace migration - which third-party libraries break, and how do you find them before runtime?", "answerTitle": "Finding Jakarta breakages", "answer": "<p>The failure is at <strong>runtime<\/strong>, as <code>NoClassDefFoundError<\/code> or <code>ClassNotFoundException<\/code> for a <code>javax.*<\/code> class, often from a code path that only executes occasionally - which is why it escapes a green build.<\/p><p>Libraries commonly affected: older Hibernate Validator, JAXB and SOAP clients, Quartz, older Jackson modules for JAXB, PDF and reporting libraries, servlet-based third-party filters, older Testcontainers and WireMock, and any internal shared library not yet republished.<\/p><p>How to find them systematically rather than by discovery in production:<\/p><ul><li>Use the <strong>OpenRewrite<\/strong> <code>UpgradeSpringBoot_3_0<\/code> recipe, which handles the mechanical rename and flags what it cannot.<\/li><li><strong>Scan the dependency tree for <code>javax.*<\/code> imports<\/strong> in compiled artifacts - a build-time check that fails if any dependency still references the removed namespace. This is the highest-value control.<\/li><li>Check the <code>jdeps<\/code>-style analysis or use the Spring Boot migrator tooling.<\/li><li>Raise a <strong>runtime canary<\/strong>: deploy to a canary with a synthetic test hitting the less-travelled code paths, especially file export, reporting, scheduled jobs and SOAP integrations - the areas that unit tests cover least.<\/li><\/ul><p>The general lesson to state: a compile-clean Jakarta migration is not a working one, because the failures live in transitive dependencies and rarely-executed paths.<\/p>", "source": "answers.md", "search": "the jakarta namespace migration - which third-party libraries break, and how do you find them before runtime? the failure is at runtime , as noclassdeffounderror or classnotfoundexception for a javax. class, often from a code path that only executes occasionally - which is why it escapes a green build. libraries commonly affected: older hibernate validator, jaxb and soap clients, quartz, older jackson modules for jaxb, pdf and reporting libraries, servlet-based third-party filters, older testcontainers and wiremock, and any internal shared library not yet republished. how to find them systematically rather than by discovery in production: - use the openrewrite upgradespringboot_3_0 recipe, which handles the mechanical rename and flags what it cannot. - scan the dependency tree for javax. imports in compiled artifacts - a build-time check that fails if any dependency still references the removed namespace. this is the highest-value control. - check the jdeps-style analysis or use the spring boot migrator tooling. - raise a runtime canary : deploy to a canary with a synthetic test hitting the less-travelled code paths, especially file export, reporting, scheduled jobs and soap integrations - the areas that unit tests cover least. the general lesson to state: a compile-clean jakarta migration is not a working one, because the failures live in transitive dependencies and rarely-executed paths."}, {"n": 253, "category": 14, "difficulty": "T", "html": "Spring Security 5 to 6 - which breaking changes fail at runtime rather than at compile time?", "answerTitle": "Security 5 to 6 runtime breakages", "answer": "<p>The compile-time changes are the easy half - <code>WebSecurityConfigurerAdapter<\/code> removed in favour of <code>SecurityFilterChain<\/code> beans, <code>authorizeRequests<\/code> to <code>authorizeHttpRequests<\/code>, <code>antMatchers<\/code> to <code>requestMatchers<\/code>, and the lambda DSL becoming mandatory. Those fail the build, which is the good case.<\/p><p>The ones that fail at <strong>runtime<\/strong> are the dangerous ones:<\/p><ul><li><strong>Explicit <code>SecurityContextRepository<\/code> saving<\/strong> (Q148-149) - custom authentication filters silently stop persisting authentication.<\/li><li><strong><code>AuthorizationFilter<\/code> applies to all dispatcher types<\/strong>, including <code>ERROR<\/code> and <code>FORWARD<\/code> (Q146), so error pages start returning 403 or looping.<\/li><li><strong>CSRF deferred tokens and BREACH protection<\/strong> (Q160) - SPA clients break.<\/li><li><strong><code>requestMatchers<\/code> uses MVC-aware matching<\/strong> when MVC is present, so a rule that previously matched on a raw path may now match differently - this can either open or close access unexpectedly.<\/li><li><strong>Path matching changes in Spring 6<\/strong> - trailing slash matching removed, <code>PathPatternParser<\/code> as the default - which affects security rules that relied on the old behavior.<\/li><li><strong>Default <code>RequestCache<\/code> behavior<\/strong> and redirect handling changes affecting post-login navigation.<\/li><\/ul><p>Given several of these can <em>widen<\/em> access rather than break visibly, my migration includes an automated authorization test matrix - every representative endpoint × every role × expected status - executed before and after, with the results diffed. Reading the configuration is not sufficient assurance for a security change.<\/p>", "source": "answers.md", "search": "spring security 5 to 6 - which breaking changes fail at runtime rather than at compile time? the compile-time changes are the easy half - websecurityconfigureradapter removed in favour of securityfilterchain beans, authorizerequests to authorizehttprequests, antmatchers to requestmatchers, and the lambda dsl becoming mandatory. those fail the build, which is the good case. the ones that fail at runtime are the dangerous ones: - explicit securitycontextrepository saving (q148-149) - custom authentication filters silently stop persisting authentication. - authorizationfilter applies to all dispatcher types , including error and forward (q146), so error pages start returning 403 or looping. - csrf deferred tokens and breach protection (q160) - spa clients break. - requestmatchers uses mvc-aware matching when mvc is present, so a rule that previously matched on a raw path may now match differently - this can either open or close access unexpectedly. - path matching changes in spring 6 - trailing slash matching removed, pathpatternparser as the default - which affects security rules that relied on the old behavior. - default requestcache behavior and redirect handling changes affecting post-login navigation. given several of these can widen access rather than break visibly, my migration includes an automated authorization test matrix - every representative endpoint × every role × expected status - executed before and after, with the results diffed. reading the configuration is not sufficient assurance for a security change."}, {"n": 254, "category": 14, "difficulty": "D", "html": "Property renames and removed configuration between Boot 2 and 3 - how do you catch them automatically?", "answerTitle": "Finding configuration changes", "answer": "<p>Add <code>spring-boot-properties-migrator<\/code> as a runtime dependency for one release:<\/p><pre><code class=\"lang-xml\">&lt;dependency&gt;\n  &lt;groupId&gt;org.springframework.boot&lt;/groupId&gt;\n  &lt;artifactId&gt;spring-boot-properties-migrator&lt;/artifactId&gt;\n  &lt;scope&gt;runtime&lt;/scope&gt;\n&lt;/dependency&gt;<\/code><\/pre><p>At startup it reports renamed properties (and temporarily maps them) and errors on removed ones, using the metadata Boot ships. That converts a silent behavior change into a startup log you can act on - and it is the single most useful upgrade tool most teams do not know about. <strong>Remove it after migrating<\/strong>, since it is a startup cost and a crutch.<\/p><p>Beyond that: strict configuration validation so unknown properties are noticed (a mistyped or obsolete property is silently ignored by default, which is how a security setting quietly stops applying), a test asserting the effective values of the properties that matter, and a diff of <code>/actuator/configprops<\/code> between the old and new versions in a non-production environment - which catches defaults that changed even when your property did not.<\/p>", "source": "answers.md", "search": "property renames and removed configuration between boot 2 and 3 - how do you catch them automatically? add spring-boot-properties-migrator as a runtime dependency for one release: xml <dependency <groupid org.springframework.boot<\/groupid <artifactid spring-boot-properties-migrator<\/artifactid <scope runtime<\/scope <\/dependency at startup it reports renamed properties (and temporarily maps them) and errors on removed ones, using the metadata boot ships. that converts a silent behavior change into a startup log you can act on - and it is the single most useful upgrade tool most teams do not know about. remove it after migrating , since it is a startup cost and a crutch. beyond that: strict configuration validation so unknown properties are noticed (a mistyped or obsolete property is silently ignored by default, which is how a security setting quietly stops applying), a test asserting the effective values of the properties that matter, and a diff of /actuator/configprops between the old and new versions in a non-production environment - which catches defaults that changed even when your property did not."}, {"n": 255, "category": 14, "difficulty": "D", "html": "Dependency management - the Boot BOM, and how to override a managed version safely.", "answerTitle": "Dependency management", "answer": "<p><code>spring-boot-dependencies<\/code> is a BOM pinning consistent versions for hundreds of libraries; the parent POM or Gradle plugin applies it. That consistency is most of the value Boot provides - the versions are tested together.<\/p><p>To override safely:<\/p><pre><code class=\"lang-xml\">&lt;properties&gt;\n  &lt;postgresql.version&gt;42.7.3&lt;/postgresql.version&gt;\n&lt;/properties&gt;<\/code><\/pre><p>Use the <strong>property the BOM defines<\/strong> rather than declaring an explicit <code>&lt;version&gt;<\/code> on the dependency, so all related artifacts move together. Overriding one artifact of a multi-module library while the BOM pins the rest produces a mixed-version classpath and <code>NoSuchMethodError<\/code> at runtime.<\/p><p>Rules I apply: override only with a documented reason (a CVE fix or a required feature), record it with a comment and an expiry, revisit at every Boot upgrade to remove overrides the BOM has caught up with, and never override Spring Framework or Security versions independently of Boot - those are tested as a set and mismatching them is how you get subtle, hard-to-diagnose failures.<\/p>", "source": "answers.md", "search": "dependency management - the boot bom, and how to override a managed version safely. spring-boot-dependencies is a bom pinning consistent versions for hundreds of libraries; the parent pom or gradle plugin applies it. that consistency is most of the value boot provides - the versions are tested together. to override safely: xml <properties <postgresql.version 42.7.3<\/postgresql.version <\/properties use the property the bom defines rather than declaring an explicit <version on the dependency, so all related artifacts move together. overriding one artifact of a multi-module library while the bom pins the rest produces a mixed-version classpath and nosuchmethoderror at runtime. rules i apply: override only with a documented reason (a cve fix or a required feature), record it with a comment and an expiry, revisit at every boot upgrade to remove overrides the bom has caught up with, and never override spring framework or security versions independently of boot - those are tested as a set and mismatching them is how you get subtle, hard-to-diagnose failures."}, {"n": 256, "category": 14, "difficulty": "D", "html": "Upgrade cadence and support windows - how do you plan Spring upgrades as ongoing work rather than a project?", "answerTitle": "Upgrade cadence", "answer": "<p>Spring Boot minor releases arrive roughly every six months with about 12 months of OSS support (13 months for the last minor of a major), and Java LTS every two years. Falling behind is not a neutral choice: it compounds, and it eventually forces a large, risky, unbudgeted migration under CVE pressure - which is the situation most teams are actually in when they ask this question.<\/p><p>What I put in place:<\/p><ul><li><strong>Patch versions automatically<\/strong> - Renovate or Dependabot raising pull requests, merged by CI without human debate. This is where most CVE fixes are.<\/li><li><strong>Minor versions on a schedule<\/strong> - a planned upgrade within one quarter of release, treated as normal work with an owner, not a project needing a business case.<\/li><li><strong>A supported-version policy<\/strong> with a stated floor, so &quot;we are on an unsupported version&quot; is a visible, escalating compliance issue rather than an engineering preference.<\/li><li><strong>Capacity reserved<\/strong> - a standing allocation for maintenance, because upgrades that compete with features always lose.<\/li><li><strong>Automation to reduce cost<\/strong> - a platform BOM so 40 services change one version property, OpenRewrite recipes for mechanical changes, and a canary service that upgrades first and documents the surprises for everyone else.<\/li><\/ul><p>The argument I make to leadership is in their terms: staying current is a series of small, predictable costs; falling behind converts that into one large, unpredictable one, usually triggered by a vulnerability with a deadline attached.<\/p>", "source": "answers.md", "search": "upgrade cadence and support windows - how do you plan spring upgrades as ongoing work rather than a project? spring boot minor releases arrive roughly every six months with about 12 months of oss support (13 months for the last minor of a major), and java lts every two years. falling behind is not a neutral choice: it compounds, and it eventually forces a large, risky, unbudgeted migration under cve pressure - which is the situation most teams are actually in when they ask this question. what i put in place: - patch versions automatically - renovate or dependabot raising pull requests, merged by ci without human debate. this is where most cve fixes are. - minor versions on a schedule - a planned upgrade within one quarter of release, treated as normal work with an owner, not a project needing a business case. - a supported-version policy with a stated floor, so \"we are on an unsupported version\" is a visible, escalating compliance issue rather than an engineering preference. - capacity reserved - a standing allocation for maintenance, because upgrades that compete with features always lose. - automation to reduce cost - a platform bom so 40 services change one version property, openrewrite recipes for mechanical changes, and a canary service that upgrades first and documents the surprises for everyone else. the argument i make to leadership is in their terms: staying current is a series of small, predictable costs; falling behind converts that into one large, unpredictable one, usually triggered by a vulnerability with a deadline attached."}, {"n": 257, "category": 14, "difficulty": "D", "html": "Versioning and deprecating a shared starter used by many teams.", "answerTitle": "Versioning a shared starter", "answer": "<ul><li><strong>Semantic versioning<\/strong>, honestly applied - a changed default is a breaking change even if it compiles, because behavior is the contract.<\/li><li><strong>A support window<\/strong> for the previous major, published up front, so teams can plan.<\/li><li><strong>Deprecate before removing<\/strong> - keep the old property working, mark it with <code>@DeprecatedConfigurationProperty<\/code> and a replacement so the warning appears in the IDE (Q37), and log a warning at startup. Remove only in the next major, after the window.<\/li><li><strong>Migration notes with every release<\/strong>, and an OpenRewrite recipe for anything mechanical.<\/li><li><strong>Feature flags for behavior changes<\/strong> - ship the new behavior disabled, let teams opt in, make it the default in the next major, remove the flag after that. That is three releases for one change, and it is what makes a 40-team upgrade non-events rather than incidents.<\/li><li><strong>A canary consumer<\/strong> - one service (ideally owned by the platform team) always on the latest version, so problems surface before wide adoption.<\/li><li><strong>Automated upgrade pull requests<\/strong> to every consumer with CI proving them, so upgrading is a review rather than a task.<\/li><\/ul><p>The judgement point: the cost of a breaking change is not the code change, it is 40 teams × coordination × their release schedules. That reframing usually reveals that the change is not worth making, or that it should be additive - and being willing to carry a deprecated path for a year is what makes a platform trustworthy.<\/p>", "source": "answers.md", "search": "versioning and deprecating a shared starter used by many teams. - semantic versioning , honestly applied - a changed default is a breaking change even if it compiles, because behavior is the contract. - a support window for the previous major, published up front, so teams can plan. - deprecate before removing - keep the old property working, mark it with @deprecatedconfigurationproperty and a replacement so the warning appears in the ide (q37), and log a warning at startup. remove only in the next major, after the window. - migration notes with every release , and an openrewrite recipe for anything mechanical. - feature flags for behavior changes - ship the new behavior disabled, let teams opt in, make it the default in the next major, remove the flag after that. that is three releases for one change, and it is what makes a 40-team upgrade non-events rather than incidents. - a canary consumer - one service (ideally owned by the platform team) always on the latest version, so problems surface before wide adoption. - automated upgrade pull requests to every consumer with ci proving them, so upgrading is a review rather than a task. the judgement point: the cost of a breaking change is not the code change, it is 40 teams × coordination × their release schedules. that reframing usually reveals that the change is not worth making, or that it should be additive - and being willing to carry a deprecated path for a year is what makes a platform trustworthy."}, {"n": 258, "category": 14, "difficulty": "A", "html": "Design the module structure and shared platform for a new 30-engineer Spring estate.", "answerTitle": "Module structure and shared platform for a 30-engineer estate", "answer": "<p><strong>Clarify.<\/strong> How many services exist today and how are they deployed? Is there a platform team, or would this be a shared responsibility? What is the current pain - inconsistency, slow onboarding, upgrade paralysis, incident response? Are teams aligned to domains or to layers? What is the deployment platform?<\/p><p>That last question matters because it determines what the platform <em>should not<\/em> build (Q220).<\/p><p><strong>The shape I would propose.<\/strong><\/p><p><strong>Service internals<\/strong> - a standard, documented layout so any engineer can navigate any service:<\/p><pre><code>com.acme.orders\n  ├─ api          # controllers, DTOs, exception handling\n  ├─ domain       # entities, value objects, domain services, ports\n  ├─ application  # use cases, transaction boundaries\n  ├─ infrastructure # JPA adapters, clients, messaging\n  └─ config       # Spring configuration<\/code><\/pre><p>Packages rather than Maven modules for most services, enforced with ArchUnit (Q233); multi-module (Q250) only where the domain is complex enough to justify it.<\/p><p><strong>Shared platform<\/strong> as several thin, independently versioned starters rather than one monolith (Q204):<\/p><ul><li><code>acme-observability-starter<\/code> - Micrometer configuration, standard tags, tracing, structured logging, correlation IDs.<\/li><li><code>acme-security-starter<\/code> - resource server configuration, authority mapping, standard filter chains, security headers.<\/li><li><code>acme-web-starter<\/code> - <code>ProblemDetail<\/code> error handling, Jackson configuration, standard filters.<\/li><li><code>acme-resilience-starter<\/code> - Resilience4j defaults, client timeouts, connection pool sizing.<\/li><li><code>acme-testing-starter<\/code> - Testcontainers configuration, ArchUnit rule sets, test fixtures.<\/li><\/ul><p>Every bean <code>@ConditionalOnMissingBean<\/code>, every feature <code>@ConditionalOnProperty<\/code> with a default, full configuration metadata, and a canary consumer always on the latest version.<\/p><p><strong>What I deliberately would not build<\/strong>: a service discovery layer, a config server, or anything Kubernetes already provides.<\/p><p><strong>Governance.<\/strong> A lightweight architecture forum with rotating membership rather than an architecture board; ADRs in each repository for local decisions and a central one for cross-cutting; inner-source contribution to the starters with a review SLA; and a service template (a <code>cookiecutter<\/code> or Backstage scaffold) that produces a deployable, observable, secured service in minutes - which is how standards actually spread, because the standard path is the easy path.<\/p><p><strong>Trade-offs to state.<\/strong> This is a real investment - roughly one to two engineers&#x27; ongoing capacity for the starters and the template. At 30 engineers that is defensible if it saves each team the same work; below about 15 engineers it is not, and copy-paste with good documentation is genuinely the right answer. I would also set a measure - time from repository creation to production deployment, and incident count attributable to missing platform concerns - so the investment is accountable.<\/p>", "source": "scenario-questions.md (S11)", "search": "d
