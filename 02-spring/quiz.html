<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Interview Preparation Pack</title>
<style>
:root {
  --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a3040;
  --text: #e6e9f0; --muted: #99a1b3; --accent: #6ea8fe; --accent-soft: #1b2740;
  --code-bg: #11141c; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --c: #4ade80; --d: #6ea8fe; --t: #fbbf24; --a: #c084fc;
}
[data-theme="light"] {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --border: #dde1e8;
  --text: #1a1d24; --muted: #5c6577; --accent: #1f5fd0; --accent-soft: #e6eefc;
  --code-bg: #f0f2f6; --shadow: 0 1px 3px rgba(16,24,40,.08);
  --c: #15803d; --d: #1f5fd0; --t: #b45309; --a: #7e22ce;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

header.top { padding: 40px 0 24px; }
header.top h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
header.top p { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }
input[type="search"], select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px;
}
input[type="search"] { flex: 1 1 260px; }
input[type="search"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.C { color: var(--c); } .pill.D { color: var(--d); }
.pill.T { color: var(--t); } .pill.A { color: var(--a); }

.progress { margin: 4px 0 0; }
.bar { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .known { background: var(--c); } .bar .review { background: var(--t); }
.stats { color: var(--muted); font-size: 13px; margin-top: 8px; }
.stats b { color: var(--text); font-weight: 600; }

h2.cat {
  margin: 36px 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px;
}

article.q {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); scroll-margin-top: 130px;
}
article.q[data-status="known"] { border-left: 3px solid var(--c); }
article.q[data-status="review"] { border-left: 3px solid var(--t); }
.q-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q-num {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--muted); text-decoration: none;
}
.q-num:hover { color: var(--accent); }
.q-text { margin: 8px 0 0; font-size: 15.5px; font-weight: 500; width: 100%; }
.q-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.q-actions .src { margin-left: auto; color: var(--muted); font-size: 12px; }

details.ans { margin-top: 12px; }
details.ans > summary {
  cursor: pointer; list-style: none; user-select: none;
  color: var(--accent); font-size: 13px; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); display: inline-flex; align-items: center; gap: 8px;
}
details.ans > summary::-webkit-details-marker { display: none; }
details.ans > summary::before { content: "▸"; font-size: 11px; }
details.ans[open] > summary::before { content: "▾"; }
details.ans[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.ans-body {
  border: 1px solid var(--border); border-top: none; border-radius: 0 8px 8px 8px;
  padding: 4px 18px 16px; background: var(--panel-2);
}
.ans-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 0; }

.md p { margin: 12px 0; }
.md ul, .md ol { margin: 12px 0; padding-left: 22px; }
.md li { margin: 6px 0; }
.md h3, .md h4, .md h5 { margin: 18px 0 8px; font-size: 15px; }
.md code {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 12.5px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.md pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; margin: 14px 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
.md blockquote {
  margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--t);
  background: color-mix(in srgb, var(--t) 8%, transparent); border-radius: 0 8px 8px 0;
}
.md blockquote p { margin: 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
.md th { background: var(--panel); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.md a { color: var(--accent); }
.tok-kw { color: var(--a); } .tok-str { color: var(--c); }
.tok-com { color: var(--muted); font-style: italic; } .tok-ann { color: var(--t); }

.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
mark { background: color-mix(in srgb, var(--t) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

@media print {
  .toolbar, .q-actions, .legend { display: none; }
  details.ans[open] > summary { display: none; }
  body { background: #fff; color: #000; }
}
@media (max-width: 640px) {
  .q-actions .src { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Spring Interview Preparation Pack</h1>
  <p>Container internals, transactions, security and production engineering. Answer out loud before expanding.</p>
  <div class="legend" id="legend"></div>
</header>

<div class="toolbar">
  <div class="row">
    <input type="search" id="search" placeholder="Search questions and answers    ( / to focus )" autocomplete="off">
    <select id="category"><option value="">All categories</option></select>
    <select id="status">
      <option value="">Any status</option>
      <option value="unseen">Not marked</option>
      <option value="review">Needs review</option>
      <option value="known">Known</option>
    </select>
  </div>
  <div class="row">
    <span id="diffFilters"></span>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
    <button id="theme">Light</button>
    <button id="reset">Reset progress</button>
  </div>
  <div class="row progress">
    <div class="bar" style="flex:1"><i class="known" id="barKnown"></i><i class="review" id="barReview"></i></div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<main id="list"></main>
<div class="empty" id="empty" hidden>No questions match those filters.</div>

</div>

<script id="data" type="application/json">{"categories": [{"index": 1, "title": "Container internals"}, {"index": 2, "title": "Configuration, properties and profiles"}, {"index": 3, "title": "AOP and proxies"}, {"index": 4, "title": "Transactions in depth"}, {"index": 5, "title": "Spring MVC internals"}, {"index": 6, "title": "Reactive Spring and WebFlux"}, {"index": 7, "title": "Spring Data in depth"}, {"index": 8, "title": "Spring Security architecture"}, {"index": 9, "title": "OAuth2, OIDC and Authorization Server"}, {"index": 10, "title": "Spring Boot production engineering"}, {"index": 11, "title": "Spring Cloud and microservices"}, {"index": 12, "title": "Testing Spring applications"}, {"index": 13, "title": "Spring AI"}, {"index": 14, "title": "Architecture, modularity and migration"}, {"index": 15, "title": "Web protocols beyond REST"}, {"index": 16, "title": "Messaging endpoints in Spring"}, {"index": 17, "title": "Spring Batch"}, {"index": 18, "title": "Non-relational Spring Data and multi-store"}, {"index": 19, "title": "Spring Cloud Kubernetes and the development loop"}, {"index": 20, "title": "Spring AI platform surface and MCP"}, {"index": 21, "title": "Leadership and platform ownership"}], "questions": [{"n": 1, "category": 1, "difficulty": "C", "html": "Walk through <code>AbstractApplicationContext.refresh()<\/code> phase by phase. In which phase are AOP proxies created?", "answerTitle": "The `refresh()` sequence", "answer": "<p><code>AbstractApplicationContext.refresh()<\/code> runs a fixed template of twelve steps:<\/p><ol><li><code>prepareRefresh<\/code> - start time, active flag, validate required properties.<\/li><li><code>obtainFreshBeanFactory<\/code> - create the <code>BeanFactory<\/code> and load <code>BeanDefinition<\/code>s (component scanning happens here for annotation contexts).<\/li><li><code>prepareBeanFactory<\/code> - register the expression resolver, <code>ApplicationContextAwareProcessor<\/code>, resolvable dependencies such as <code>ApplicationContext<\/code> itself.<\/li><li><code>postProcessBeanFactory<\/code> - subclass hook (this is where the web contexts register scopes).<\/li><li><strong><code>invokeBeanFactoryPostProcessors<\/code><\/strong> - <code>BeanDefinitionRegistryPostProcessor<\/code>s run first, and this is where <code>ConfigurationClassPostProcessor<\/code> parses <code>@Configuration<\/code>, <code>@Import<\/code>, <code>@ComponentScan<\/code> and auto-configuration, then <code>BeanFactoryPostProcessor<\/code>s such as property placeholder resolution.<\/li><li><code>registerBeanPostProcessors<\/code> - instantiate and register all <code>BeanPostProcessor<\/code>s, including <code>AnnotationAwareAspectJAutoProxyCreator<\/code>.<\/li><li><code>initMessageSource<\/code>, 8. <code>initApplicationEventMulticaster<\/code>, 9. <code>onRefresh<\/code> (the embedded web server is created here), 10. <code>registerListeners<\/code>.<\/li><li><strong><code>finishBeanFactoryInitialization<\/code><\/strong> - instantiate all remaining non-lazy singletons. <strong>AOP proxies are created here<\/strong>, in <code>postProcessAfterInitialization<\/code> of the auto-proxy creator.<\/li><li><code>finishRefresh<\/code> - <code>LifecycleProcessor<\/code> start, publish <code>ContextRefreshedEvent<\/code>.<\/li><\/ol><p>The takeaway that answers a dozen other questions: bean <em>definitions<\/em> are all known before any bean is <em>instantiated<\/em>, and proxying happens after initialization, which is why <code>@PostConstruct<\/code> runs on the raw target.<\/p>", "source": "answers.md", "search": "walk through abstractapplicationcontext.refresh() phase by phase. in which phase are aop proxies created? abstractapplicationcontext.refresh() runs a fixed template of twelve steps: 1. preparerefresh - start time, active flag, validate required properties. 2. obtainfreshbeanfactory - create the beanfactory and load beandefinitions (component scanning happens here for annotation contexts). 3. preparebeanfactory - register the expression resolver, applicationcontextawareprocessor, resolvable dependencies such as applicationcontext itself. 4. postprocessbeanfactory - subclass hook (this is where the web contexts register scopes). 5. invokebeanfactorypostprocessors - beandefinitionregistrypostprocessors run first, and this is where configurationclasspostprocessor parses @configuration, @import, @componentscan and auto-configuration, then beanfactorypostprocessors such as property placeholder resolution. 6. registerbeanpostprocessors - instantiate and register all beanpostprocessors, including annotationawareaspectjautoproxycreator. 7. initmessagesource, 8. initapplicationeventmulticaster, 9. onrefresh (the embedded web server is created here), 10. registerlisteners. 11. finishbeanfactoryinitialization - instantiate all remaining non-lazy singletons. aop proxies are created here , in postprocessafterinitialization of the auto-proxy creator. 12. finishrefresh - lifecycleprocessor start, publish contextrefreshedevent. the takeaway that answers a dozen other questions: bean definitions are all known before any bean is instantiated , and proxying happens after initialization, which is why @postconstruct runs on the raw target."}, {"n": 2, "category": 1, "difficulty": "D", "html": "What is a <code>BeanDefinition<\/code> and how does it differ from a bean instance? Who is allowed to modify one?", "answerTitle": "`BeanDefinition`", "answer": "<p>A <code>BeanDefinition<\/code> is the metadata describing how to create a bean - class name, scope, lazy flag, constructor arguments, property values, factory method, init and destroy methods, autowire mode, primary and role flags. It is not an instance; instances are created later from the definition.<\/p><p><code>BeanDefinitionRegistryPostProcessor<\/code> can add or remove definitions; <code>BeanFactoryPostProcessor<\/code> can modify existing ones. After step 5 the registry is effectively frozen. This is the extension point behind auto-configuration, Spring Data repositories and mapper scanning - all of them register definitions programmatically rather than being component-scanned.<\/p>", "source": "answers.md", "search": "what is a beandefinition and how does it differ from a bean instance? who is allowed to modify one? a beandefinition is the metadata describing how to create a bean - class name, scope, lazy flag, constructor arguments, property values, factory method, init and destroy methods, autowire mode, primary and role flags. it is not an instance; instances are created later from the definition. beandefinitionregistrypostprocessor can add or remove definitions; beanfactorypostprocessor can modify existing ones. after step 5 the registry is effectively frozen. this is the extension point behind auto-configuration, spring data repositories and mapper scanning - all of them register definitions programmatically rather than being component-scanned."}, {"n": 3, "category": 1, "difficulty": "T", "html": "<code>BeanFactoryPostProcessor<\/code> versus <code>BeanPostProcessor<\/code> - when does each run, and why does injecting a normal dependency into a <code>BeanFactoryPostProcessor<\/code> produce the &quot;is not eligible for getting processed by all BeanPostProcessors&quot; warning?", "answerTitle": "`BeanFactoryPostProcessor` versus `BeanPostProcessor`", "answer": "<p><code>BeanFactoryPostProcessor<\/code> operates on <em>definitions<\/em> before any singleton is created (step 5). <code>BeanPostProcessor<\/code> operates on <em>instances<\/em>, wrapping each bean before and after initialization (step 11).<\/p><p>The warning appears because a <code>BeanFactoryPostProcessor<\/code> must itself be instantiated in step 5 - before <code>registerBeanPostProcessors<\/code> in step 6. If it injects a normal bean, that bean is force-created early, missing every <code>BeanPostProcessor<\/code> that has not been registered yet. Practically, the bean never gets its AOP proxy, so <code>@Transactional<\/code> on it silently does nothing.<\/p><p>Fix: make the post-processor <code>static<\/code> when declared as a <code>@Bean<\/code> method, depend only on <code>Environment<\/code> or <code>BeanFactory<\/code>, and look dependencies up lazily rather than injecting them.<\/p>", "source": "answers.md", "search": "beanfactorypostprocessor versus beanpostprocessor - when does each run, and why does injecting a normal dependency into a beanfactorypostprocessor produce the \"is not eligible for getting processed by all beanpostprocessors\" warning? beanfactorypostprocessor operates on definitions before any singleton is created (step 5). beanpostprocessor operates on instances , wrapping each bean before and after initialization (step 11). the warning appears because a beanfactorypostprocessor must itself be instantiated in step 5 - before registerbeanpostprocessors in step 6. if it injects a normal bean, that bean is force-created early, missing every beanpostprocessor that has not been registered yet. practically, the bean never gets its aop proxy, so @transactional on it silently does nothing. fix: make the post-processor static when declared as a @bean method, depend only on environment or beanfactory, and look dependencies up lazily rather than injecting them."}, {"n": 4, "category": 1, "difficulty": "T", "html": "<code>@Configuration<\/code> full mode versus lite mode. What does <code>proxyBeanMethods = false<\/code> actually change, and when is it unsafe?", "answerTitle": "Full versus lite `@Configuration`", "answer": "<p>In <strong>full mode<\/strong> (<code>proxyBeanMethods = true<\/code>, the default), <code>ConfigurationClassPostProcessor<\/code> enhances the class with a CGLIB subclass whose <code>BeanMethodInterceptor<\/code> routes every <code>@Bean<\/code> method call through the container. In <strong>lite mode<\/strong> (<code>proxyBeanMethods = false<\/code>, or <code>@Bean<\/code> methods on a plain <code>@Component<\/code>), no subclass is created and <code>@Bean<\/code> methods are ordinary Java methods.<\/p><p><code>proxyBeanMethods = false<\/code> saves a CGLIB class and some startup time, which is why every Boot auto-configuration class uses it. It is <strong>unsafe when one <code>@Bean<\/code> method calls another<\/strong> - you get a new, unmanaged instance each time, with no proxying, no lifecycle callbacks and no singleton guarantee. The safe pattern in lite mode is to take the dependency as a method parameter instead:<\/p><pre><code class=\"lang-java\">@Bean OrderService orderService(OrderRepository repo) { return new OrderService(repo); }<\/code><\/pre>", "source": "answers.md", "search": "@configuration full mode versus lite mode. what does proxybeanmethods = false actually change, and when is it unsafe? in full mode (proxybeanmethods = true, the default), configurationclasspostprocessor enhances the class with a cglib subclass whose beanmethodinterceptor routes every @bean method call through the container. in lite mode (proxybeanmethods = false, or @bean methods on a plain @component), no subclass is created and @bean methods are ordinary java methods. proxybeanmethods = false saves a cglib class and some startup time, which is why every boot auto-configuration class uses it. it is unsafe when one @bean method calls another - you get a new, unmanaged instance each time, with no proxying, no lifecycle callbacks and no singleton guarantee. the safe pattern in lite mode is to take the dependency as a method parameter instead: java @bean orderservice orderservice(orderrepository repo) { return new orderservice(repo); }"}, {"n": 5, "category": 1, "difficulty": "D", "html": "How does calling one <code>@Bean<\/code> method from another return the same singleton instead of a new object?", "answerTitle": "Inter-bean method calls", "answer": "<p>In full mode the CGLIB interceptor checks whether the container is currently creating that bean. If not, it delegates to <code>beanFactory.getBean(name)<\/code> and returns the existing singleton rather than executing the method body. That is why <code>@Bean<\/code> methods look like plain calls but respect scope.<\/p><p>It also means a <code>@Configuration<\/code> class cannot be <code>final<\/code> and its <code>@Bean<\/code> methods cannot be <code>private<\/code> or <code>final<\/code> - the same CGLIB constraints as any Spring proxy.<\/p>", "source": "answers.md", "search": "how does calling one @bean method from another return the same singleton instead of a new object? in full mode the cglib interceptor checks whether the container is currently creating that bean. if not, it delegates to beanfactory.getbean(name) and returns the existing singleton rather than executing the method body. that is why @bean methods look like plain calls but respect scope. it also means a @configuration class cannot be final and its @bean methods cannot be private or final - the same cglib constraints as any spring proxy."}, {"n": 6, "category": 1, "difficulty": "D", "html": "<code>FactoryBean&lt;T&gt;<\/code> - how does it differ from a <code>@Bean<\/code> factory method, and how do you retrieve the <code>FactoryBean<\/code> itself rather than its product?", "answerTitle": "`FactoryBean<T>`", "answer": "<p>A <code>FactoryBean&lt;T&gt;<\/code> is a bean whose job is to produce another object; the container publishes <code>getObject()<\/code> as the bean, not the factory. It exists for complex or conditional construction, and for integration points where the target type is only known at runtime - <code>SqlSessionFactoryBean<\/code>, <code>LocalContainerEntityManagerFactoryBean<\/code> and <code>ProxyFactoryBean<\/code> are all examples.<\/p><p>Prefix the name with <code>&amp;<\/code> to get the factory itself: <code>context.getBean(&quot;&amp;entityManagerFactory&quot;)<\/code>.<\/p><p>A <code>@Bean<\/code> method is simpler and type-safe, so in application code prefer it. <code>FactoryBean<\/code> earns its place when you need the container to know the produced type before creating it (via <code>getObjectType()<\/code>), which matters for autowiring by type during early resolution.<\/p>", "source": "answers.md", "search": "factorybean<t - how does it differ from a @bean factory method, and how do you retrieve the factorybean itself rather than its product? a factorybean<t is a bean whose job is to produce another object; the container publishes getobject() as the bean, not the factory. it exists for complex or conditional construction, and for integration points where the target type is only known at runtime - sqlsessionfactorybean, localcontainerentitymanagerfactorybean and proxyfactorybean are all examples. prefix the name with & to get the factory itself: context.getbean(\"&entitymanagerfactory\"). a @bean method is simpler and type-safe, so in application code prefer it. factorybean earns its place when you need the container to know the produced type before creating it (via getobjecttype()), which matters for autowiring by type during early resolution."}, {"n": 7, "category": 1, "difficulty": "T", "html": "<code>ObjectProvider<\/code> versus <code>@Lazy<\/code> versus <code>ApplicationContext.getBean()<\/code> for deferred lookup. Which do you use and why?", "answerTitle": "Deferred lookup", "answer": "<p><code>ObjectProvider&lt;T&gt;<\/code> is the right answer in almost all cases: it is type-safe, supports optional (<code>getIfAvailable<\/code>), unique (<code>getIfUnique<\/code>), streaming and ordered access, and defers resolution to call time without a proxy. It is the modern replacement for both <code>@Lazy<\/code> tricks and container lookups.<\/p><p><code>@Lazy<\/code> injects a proxy that resolves on first method call - useful to break a cycle, but the indirection is invisible at the call site. <code>ApplicationContext.getBean()<\/code> couples your code to the container and is untestable without Spring; it is acceptable only in infrastructure code.<\/p>", "source": "answers.md", "search": "objectprovider versus @lazy versus applicationcontext.getbean() for deferred lookup. which do you use and why? objectprovider<t is the right answer in almost all cases: it is type-safe, supports optional (getifavailable), unique (getifunique), streaming and ordered access, and defers resolution to call time without a proxy. it is the modern replacement for both @lazy tricks and container lookups. @lazy injects a proxy that resolves on first method call - useful to break a cycle, but the indirection is invisible at the call site. applicationcontext.getbean() couples your code to the container and is untestable without spring; it is acceptable only in infrastructure code."}, {"n": 8, "category": 1, "difficulty": "D", "html": "Explain the three-level singleton cache and how it resolves a circular reference.", "answerTitle": "The three-level singleton cache", "answer": "<p><code>DefaultSingletonBeanRegistry<\/code> holds three maps: <code>singletonObjects<\/code> (fully initialized), <code>earlySingletonObjects<\/code> (instantiated but not fully populated) and <code>singletonFactories<\/code> (<code>ObjectFactory<\/code> references able to produce an early reference).<\/p><p>Creating A: an entry goes into <code>singletonFactories<\/code> immediately after instantiation but before population. A populates and needs B; B is created, needs A, finds the factory, obtains the early reference, completes, and A then finishes. The third level exists specifically so that if A must be proxied, the factory returns the <em>proxy<\/em> rather than the raw instance, keeping references consistent.<\/p>", "source": "answers.md", "search": "explain the three-level singleton cache and how it resolves a circular reference. defaultsingletonbeanregistry holds three maps: singletonobjects (fully initialized), earlysingletonobjects (instantiated but not fully populated) and singletonfactories (objectfactory references able to produce an early reference). creating a: an entry goes into singletonfactories immediately after instantiation but before population. a populates and needs b; b is created, needs a, finds the factory, obtains the early reference, completes, and a then finishes. the third level exists specifically so that if a must be proxied, the factory returns the proxy rather than the raw instance, keeping references consistent."}, {"n": 9, "category": 1, "difficulty": "T", "html": "<code>@Lazy<\/code> breaks a constructor injection cycle - what is actually injected, and what are the consequences?", "answerTitle": "`@Lazy` on a cycle", "answer": "<p>The injected object is a proxy, not the bean. Nothing is resolved until the first method call, which breaks the construction cycle.<\/p><p>Consequences: the real bean&#x27;s creation failure surfaces at first use rather than at startup, losing fail-fast; the proxy adds a level of indirection to every call; and if the target is <code>final<\/code> or has no interface, CGLIB constraints apply. It works, but a cycle is nearly always a missing third collaborator, so I treat <code>@Lazy<\/code> as a temporary stabilizer rather than the fix.<\/p>", "source": "answers.md", "search": "@lazy breaks a constructor injection cycle - what is actually injected, and what are the consequences? the injected object is a proxy, not the bean. nothing is resolved until the first method call, which breaks the construction cycle. consequences: the real bean's creation failure surfaces at first use rather than at startup, losing fail-fast; the proxy adds a level of indirection to every call; and if the target is final or has no interface, cglib constraints apply. it works, but a cycle is nearly always a missing third collaborator, so i treat @lazy as a temporary stabilizer rather than the fix."}, {"n": 10, "category": 1, "difficulty": "D", "html": "<code>@Order<\/code>, <code>Ordered<\/code>, <code>@Priority<\/code> and <code>@DependsOn<\/code> - what does each one actually control?", "answerTitle": "Ordering annotations", "answer": "<ul><li><code>@Order<\/code> / <code>Ordered<\/code> - orders beans <em>in a collection<\/em> (injected <code>List<\/code>, aspect precedence, filter order, <code>ApplicationListener<\/code> order). Lower value wins.<\/li><li><code>@Priority<\/code> - JSR-250 equivalent, and unlike <code>@Order<\/code> it also participates in single-bean autowire candidate selection when several match.<\/li><li><code>@DependsOn<\/code> - forces <em>creation order<\/em>, not collection order. Used when a bean has an initialization side effect another bean relies on.<\/li><\/ul><p>None of them affects the order in which <code>@Bean<\/code> methods are declared, which the container treats as an implementation detail.<\/p>", "source": "answers.md", "search": "@order, ordered, @priority and @dependson - what does each one actually control? - @order / ordered - orders beans in a collection (injected list, aspect precedence, filter order, applicationlistener order). lower value wins. - @priority - jsr-250 equivalent, and unlike @order it also participates in single-bean autowire candidate selection when several match. - @dependson - forces creation order , not collection order. used when a bean has an initialization side effect another bean relies on. none of them affects the order in which @bean methods are declared, which the container treats as an implementation detail."}, {"n": 11, "category": 1, "difficulty": "T", "html": "You inject <code>List&lt;PaymentHandler&gt;<\/code>. In what order do the beans arrive, and how do you make that deterministic?", "answerTitle": "Injected `List` ordering", "answer": "<p>You get them in <code>@Order<\/code> order if annotated; otherwise in an order derived from registration - component scanning order, which depends on classpath and filesystem traversal. It is stable enough to be relied on accidentally and unstable enough to break when you change build tooling or JAR ordering.<\/p><p>Make it explicit: annotate each handler with <code>@Order<\/code>, or inject a <code>Map&lt;String, Handler&gt;<\/code> and select by key, or sort at the injection point with <code>Comparator.comparingInt(Handler::priority)<\/code> so ordering is a property of your domain rather than of the container.<\/p>", "source": "answers.md", "search": "you inject list<paymenthandler . in what order do the beans arrive, and how do you make that deterministic? you get them in @order order if annotated; otherwise in an order derived from registration - component scanning order, which depends on classpath and filesystem traversal. it is stable enough to be relied on accidentally and unstable enough to break when you change build tooling or jar ordering. make it explicit: annotate each handler with @order, or inject a map<string, handler and select by key, or sort at the injection point with comparator.comparingint(handler::priority) so ordering is a property of your domain rather than of the container."}, {"n": 12, "category": 1, "difficulty": "C", "html": "<code>@Primary<\/code> versus <code>@Qualifier<\/code> versus bean-name matching - what is the resolution order when several candidates exist?", "answerTitle": "Autowire resolution order", "answer": "<ol><li>Match by type. If exactly one candidate, done.<\/li><li>If several, a <code>@Primary<\/code> candidate wins.<\/li><li>Otherwise <code>@Priority<\/code> (lowest value) wins.<\/li><li>Otherwise a <code>@Qualifier<\/code> on the injection point is matched against qualifiers or bean names.<\/li><li>Otherwise the field or parameter <em>name<\/em> is matched against bean names.<\/li><li>Otherwise <code>NoUniqueBeanDefinitionException<\/code>.<\/li><\/ol><p>Step 5 is the one that surprises people: renaming a constructor parameter can change which bean is injected. That is a strong argument for explicit <code>@Qualifier<\/code> on any type with multiple implementations.<\/p>", "source": "answers.md", "search": "@primary versus @qualifier versus bean-name matching - what is the resolution order when several candidates exist? 1. match by type. if exactly one candidate, done. 2. if several, a @primary candidate wins. 3. otherwise @priority (lowest value) wins. 4. otherwise a @qualifier on the injection point is matched against qualifiers or bean names. 5. otherwise the field or parameter name is matched against bean names. 6. otherwise nouniquebeandefinitionexception. step 5 is the one that surprises people: renaming a constructor parameter can change which bean is injected. that is a strong argument for explicit @qualifier on any type with multiple implementations."}, {"n": 13, "category": 1, "difficulty": "D", "html": "How does injection by generic type (<code>Repository&lt;Order&gt;<\/code>) work despite type erasure?", "answerTitle": "Generic type injection", "answer": "<p>Erasure removes the type argument from <em>values<\/em>, but not from the declaration site. Spring reads generic information from the class metadata via <code>ResolvableType<\/code>, which walks the declared supertypes and field or parameter signatures, so <code>OrderRepository implements Repository&lt;Order&gt;<\/code> is matchable against <code>Repository&lt;Order&gt;<\/code>.<\/p><p>This is what makes <code>List&lt;Handler&lt;OrderEvent&gt;&gt;<\/code> injection resolve to only the handlers for that event type - genuinely useful for typed dispatch, and it is the same mechanism behind <code>ParameterizedTypeReference<\/code>.<\/p>", "source": "answers.md", "search": "how does injection by generic type (repository<order ) work despite type erasure? erasure removes the type argument from values , but not from the declaration site. spring reads generic information from the class metadata via resolvabletype, which walks the declared supertypes and field or parameter signatures, so orderrepository implements repository<order is matchable against repository<order . this is what makes list<handler<orderevent injection resolve to only the handlers for that event type - genuinely useful for typed dispatch, and it is the same mechanism behind parameterizedtypereference."}, {"n": 14, "category": 1, "difficulty": "D", "html": "<code>ImportSelector<\/code> versus <code>DeferredImportSelector<\/code> versus <code>ImportBeanDefinitionRegistrar<\/code> - give a use case for each.", "answerTitle": "Import mechanisms", "answer": "<ul><li><code>ImportSelector<\/code> - returns configuration class names to register, evaluated during configuration parsing. Use for &quot;include these configurations based on an annotation attribute&quot;.<\/li><li><code>DeferredImportSelector<\/code> - the same but deferred until all other configuration classes are processed, so user beans exist and <code>@ConditionalOnMissingBean<\/code> can back off correctly. <strong>This is what auto-configuration uses<\/strong>, which is precisely why your beans always win over Boot&#x27;s.<\/li><li><code>ImportBeanDefinitionRegistrar<\/code> - registers <code>BeanDefinition<\/code>s programmatically. Use when the beans are derived from scanning or from metadata rather than being statically declared - Spring Data repositories, Feign clients and MyBatis mappers all use it.<\/li><\/ul>", "source": "answers.md", "search": "importselector versus deferredimportselector versus importbeandefinitionregistrar - give a use case for each. - importselector - returns configuration class names to register, evaluated during configuration parsing. use for \"include these configurations based on an annotation attribute\". - deferredimportselector - the same but deferred until all other configuration classes are processed, so user beans exist and @conditionalonmissingbean can back off correctly. this is what auto-configuration uses , which is precisely why your beans always win over boot's. - importbeandefinitionregistrar - registers beandefinitions programmatically. use when the beans are derived from scanning or from metadata rather than being statically declared - spring data repositories, feign clients and mybatis mappers all use it."}, {"n": 15, "category": 1, "difficulty": "D", "html": "How does the <code>@Enable*<\/code> annotation pattern work under the hood?", "answerTitle": "The `@Enable*` pattern", "answer": "<p><code>@Enable*<\/code> is a meta-annotation carrying an <code>@Import<\/code> of either a <code>@Configuration<\/code> class, an <code>ImportSelector<\/code> or an <code>ImportBeanDefinitionRegistrar<\/code>, plus attributes that the imported component reads from the annotation metadata.<\/p><p><code>@EnableTransactionManagement<\/code> imports a selector that chooses proxy-based or AspectJ-based configuration from the <code>mode<\/code> attribute, and registers the advisor and auto-proxy creator. Understanding this makes the whole &quot;how does the annotation do anything&quot; question trivial: the annotation is just metadata, the imported class does the work.<\/p>", "source": "answers.md", "search": "how does the @enable annotation pattern work under the hood? @enable is a meta-annotation carrying an @import of either a @configuration class, an importselector or an importbeandefinitionregistrar, plus attributes that the imported component reads from the annotation metadata. @enabletransactionmanagement imports a selector that chooses proxy-based or aspectj-based configuration from the mode attribute, and registers the advisor and auto-proxy creator. understanding this makes the whole \"how does the annotation do anything\" question trivial: the annotation is just metadata, the imported class does the work."}, {"n": 16, "category": 1, "difficulty": "C", "html": "<code>InitializingBean<\/code>, <code>@PostConstruct<\/code>, <code>SmartInitializingSingleton<\/code> and <code>SmartLifecycle<\/code> - when do you need each?", "answerTitle": "Initialization callbacks", "answer": "<ul><li><code>@PostConstruct<\/code> - per-bean, after dependency injection. The default choice.<\/li><li><code>InitializingBean.afterPropertiesSet<\/code> - identical timing, but couples you to Spring. Avoid in application code.<\/li><li><code>SmartInitializingSingleton.afterSingletonsInstantiated<\/code> - runs once after <em>all<\/em> singletons exist. Use when you must inspect or wire up other beans.<\/li><li><code>SmartLifecycle<\/code> - <code>start<\/code>/<code>stop<\/code> with a phase, tied to context lifecycle rather than bean creation. Use for anything that opens a resource or consumes traffic: message listeners, schedulers, background pollers. It gives you ordered startup and, importantly, ordered <em>shutdown<\/em> with <code>stop(Runnable)<\/code> for graceful draining.<\/li><\/ul><p>The rule I apply: bean setup goes in <code>@PostConstruct<\/code>, but anything that starts consuming work goes in <code>SmartLifecycle<\/code> so it can be stopped cleanly.<\/p>", "source": "answers.md", "search": "initializingbean, @postconstruct, smartinitializingsingleton and smartlifecycle - when do you need each? - @postconstruct - per-bean, after dependency injection. the default choice. - initializingbean.afterpropertiesset - identical timing, but couples you to spring. avoid in application code. - smartinitializingsingleton.aftersingletonsinstantiated - runs once after all singletons exist. use when you must inspect or wire up other beans. - smartlifecycle - start/stop with a phase, tied to context lifecycle rather than bean creation. use for anything that opens a resource or consumes traffic: message listeners, schedulers, background pollers. it gives you ordered startup and, importantly, ordered shutdown with stop(runnable) for graceful draining. the rule i apply: bean setup goes in @postconstruct, but anything that starts consuming work goes in smartlifecycle so it can be stopped cleanly."}, {"n": 17, "category": 1, "difficulty": "T", "html": "Why does a <code>@PostConstruct<\/code> method that calls a <code>@Transactional<\/code> or <code>@Async<\/code> method on itself silently do nothing?", "answerTitle": "`@PostConstruct` self-invocation", "answer": "<p>Two separate reasons, and naming both is the strong answer. First, <code>@PostConstruct<\/code> runs during initialization, <em>before<\/em> <code>postProcessAfterInitialization<\/code> creates the proxy - so at that moment the proxy does not yet exist. Second, even after startup, calling <code>this.method()<\/code> never crosses the proxy.<\/p><p>So a <code>@PostConstruct<\/code> that calls a <code>@Transactional<\/code> method runs without a transaction, and one that calls <code>@Async<\/code> runs synchronously on the startup thread - which can also deadlock startup if it waits on something the context has not started yet.<\/p><p>Fix: move the work to an <code>ApplicationRunner<\/code>, an <code>@EventListener(ApplicationReadyEvent.class)<\/code>, or <code>SmartLifecycle<\/code>, all of which run after the context is fully initialized and go through the proxy.<\/p>", "source": "answers.md", "search": "why does a @postconstruct method that calls a @transactional or @async method on itself silently do nothing? two separate reasons, and naming both is the strong answer. first, @postconstruct runs during initialization, before postprocessafterinitialization creates the proxy - so at that moment the proxy does not yet exist. second, even after startup, calling this.method() never crosses the proxy. so a @postconstruct that calls a @transactional method runs without a transaction, and one that calls @async runs synchronously on the startup thread - which can also deadlock startup if it waits on something the context has not started yet. fix: move the work to an applicationrunner, an @eventlistener(applicationreadyevent.class), or smartlifecycle, all of which run after the context is fully initialized and go through the proxy."}, {"n": 18, "category": 1, "difficulty": "D", "html": "<code>ApplicationListener<\/code> versus <code>@EventListener<\/code> - ordering, exception behavior, and the built-in context events.", "answerTitle": "`ApplicationListener` versus `@EventListener`", "answer": "<p><code>@EventListener<\/code> is the annotation-driven form, resolved by <code>EventListenerMethodProcessor<\/code>; it supports a SpEL <code>condition<\/code>, multiple event types, and returning a value that is published as a further event. <code>ApplicationListener&lt;T&gt;<\/code> is the interface form, and is the only one that works for events published <em>before<\/em> the annotation processor runs - which is why Boot&#x27;s own early listeners implement the interface.<\/p><p>Both are synchronous by default and share the publishing thread, so a listener throwing an exception propagates to the publisher and, inside a transaction, rolls it back. Order with <code>@Order<\/code>.<\/p><p>Built-in events worth naming: <code>ApplicationStartingEvent<\/code>, <code>ApplicationEnvironmentPreparedEvent<\/code>, <code>ContextRefreshedEvent<\/code>, <code>ApplicationReadyEvent<\/code> (the correct hook for &quot;start doing work&quot;), <code>ContextClosedEvent<\/code>.<\/p>", "source": "answers.md", "search": "applicationlistener versus @eventlistener - ordering, exception behavior, and the built-in context events. @eventlistener is the annotation-driven form, resolved by eventlistenermethodprocessor; it supports a spel condition, multiple event types, and returning a value that is published as a further event. applicationlistener<t is the interface form, and is the only one that works for events published before the annotation processor runs - which is why boot's own early listeners implement the interface. both are synchronous by default and share the publishing thread, so a listener throwing an exception propagates to the publisher and, inside a transaction, rolls it back. order with @order. built-in events worth naming: applicationstartingevent, applicationenvironmentpreparedevent, contextrefreshedevent, applicationreadyevent (the correct hook for \"start doing work\"), contextclosedevent."}, {"n": 19, "category": 1, "difficulty": "D", "html": "<code>@TransactionalEventListener<\/code> phases: <code>BEFORE_COMMIT<\/code>, <code>AFTER_COMMIT<\/code>, <code>AFTER_ROLLBACK<\/code>, <code>AFTER_COMPLETION<\/code>. Which would you use to publish to Kafka?", "answerTitle": "`@TransactionalEventListener` phases", "answer": "<p>The listener is bound to a transaction synchronization rather than firing immediately.<\/p><ul><li><code>BEFORE_COMMIT<\/code> - still inside the transaction; a write here is part of the same commit. This is where an outbox row can be written.<\/li><li><code>AFTER_COMMIT<\/code> (default) - the data is durable. <strong>This is where you publish to Kafka or send an email<\/strong>, because you must not tell the world about something that might roll back.<\/li><li><code>AFTER_ROLLBACK<\/code> and <code>AFTER_COMPLETION<\/code> - compensation and cleanup.<\/li><\/ul><p>The important caveat: if no transaction is active, the listener does not fire at all unless you set <code>fallbackExecution = true<\/code>. That silently breaks tests and non-transactional call paths.<\/p>", "source": "answers.md", "search": "@transactionaleventlistener phases: before_commit, after_commit, after_rollback, after_completion. which would you use to publish to kafka? the listener is bound to a transaction synchronization rather than firing immediately. - before_commit - still inside the transaction; a write here is part of the same commit. this is where an outbox row can be written. - after_commit (default) - the data is durable. this is where you publish to kafka or send an email , because you must not tell the world about something that might roll back. - after_rollback and after_completion - compensation and cleanup. the important caveat: if no transaction is active, the listener does not fire at all unless you set fallbackexecution = true. that silently breaks tests and non-transactional call paths."}, {"n": 20, "category": 1, "difficulty": "T", "html": "Application events are synchronous by default. What breaks when you make them asynchronous, and what must you propagate?", "answerTitle": "Async application events", "answer": "<p>Making the multicaster async (set a <code>TaskExecutor<\/code> on <code>SimpleApplicationEventMulticaster<\/code>, or annotate listeners <code>@Async<\/code>) changes four things: the publisher no longer sees listener exceptions, so failures vanish unless you register an error handler; the listener no longer participates in the publisher&#x27;s transaction, so <code>@TransactionalEventListener<\/code> semantics change; <code>ThreadLocal<\/code> state - security context, MDC, tenant, tracing - is not propagated; and ordering guarantees are gone.<\/p><p>Propagate context with a <code>TaskDecorator<\/code> on the executor that copies the <code>SecurityContext<\/code>, MDC and Micrometer observation scope. And be honest about what you have built: an async in-memory listener with no durability is not a message queue, so if the work must survive a crash it belongs in an outbox.<\/p>", "source": "answers.md", "search": "application events are synchronous by default. what breaks when you make them asynchronous, and what must you propagate? making the multicaster async (set a taskexecutor on simpleapplicationeventmulticaster, or annotate listeners @async) changes four things: the publisher no longer sees listener exceptions, so failures vanish unless you register an error handler; the listener no longer participates in the publisher's transaction, so @transactionaleventlistener semantics change; threadlocal state - security context, mdc, tenant, tracing - is not propagated; and ordering guarantees are gone. propagate context with a taskdecorator on the executor that copies the securitycontext, mdc and micrometer observation scope. and be honest about what you have built: an async in-memory listener with no durability is not a message queue, so if the work must survive a crash it belongs in an outbox."}, {"n": 21, "category": 1, "difficulty": "D", "html": "The <code>Aware<\/code> interfaces - which exist, and when is using one legitimate rather than a smell?", "answerTitle": "`Aware` interfaces", "answer": "<p><code>BeanNameAware<\/code>, <code>BeanFactoryAware<\/code>, <code>ApplicationContextAware<\/code>, <code>EnvironmentAware<\/code>, <code>ResourceLoaderAware<\/code>, <code>ApplicationEventPublisherAware<\/code>, <code>MessageSourceAware<\/code>. They are callbacks that hand a bean a piece of container infrastructure during initialization.<\/p><p>In application code they are a smell - they couple your class to Spring and make it untestable without a context. They are legitimate in <em>infrastructure<\/em> code: a custom <code>BeanPostProcessor<\/code> or <code>Scope<\/code> implementation genuinely needs the <code>BeanFactory<\/code>, and <code>ApplicationEventPublisherAware<\/code> is occasionally cleaner than injecting the publisher. For everything else, inject what you need.<\/p>", "source": "answers.md", "search": "the aware interfaces - which exist, and when is using one legitimate rather than a smell? beannameaware, beanfactoryaware, applicationcontextaware, environmentaware, resourceloaderaware, applicationeventpublisheraware, messagesourceaware. they are callbacks that hand a bean a piece of container infrastructure during initialization. in application code they are a smell - they couple your class to spring and make it untestable without a context. they are legitimate in infrastructure code: a custom beanpostprocessor or scope implementation genuinely needs the beanfactory, and applicationeventpublisheraware is occasionally cleaner than injecting the publisher. for everything else, inject what you need."}, {"n": 22, "category": 1, "difficulty": "D", "html": "<code>Environment<\/code>, <code>PropertySource<\/code> and <code>PropertySourcesPlaceholderConfigurer<\/code> - how does <code>${}<\/code> resolution actually happen?", "answerTitle": "Placeholder resolution", "answer": "<p><code>Environment<\/code> holds an ordered <code>MutablePropertySources<\/code> list; resolution walks it and the first source containing the key wins - that ordering <em>is<\/em> the configuration precedence rule.<\/p><p><code>PropertySourcesPlaceholderConfigurer<\/code> is a <code>BeanFactoryPostProcessor<\/code> that visits every bean definition and resolves <code>${...}<\/code> in its property values and constructor arguments <em>before instantiation<\/em>. Because it is a <code>BeanFactoryPostProcessor<\/code>, it must be declared <code>static<\/code> when defined as a <code>@Bean<\/code> method, or it will be created too early and pull other beans with it.<\/p><p><code>@Value<\/code> on a field is resolved later, by <code>AutowiredAnnotationBeanPostProcessor<\/code> at injection time, using the same <code>Environment<\/code>.<\/p>", "source": "answers.md", "search": "environment, propertysource and propertysourcesplaceholderconfigurer - how does ${} resolution actually happen? environment holds an ordered mutablepropertysources list; resolution walks it and the first source containing the key wins - that ordering is the configuration precedence rule. propertysourcesplaceholderconfigurer is a beanfactorypostprocessor that visits every bean definition and resolves ${...} in its property values and constructor arguments before instantiation . because it is a beanfactorypostprocessor, it must be declared static when defined as a @bean method, or it will be created too early and pull other beans with it. @value on a field is resolved later, by autowiredannotationbeanpostprocessor at injection time, using the same environment."}, {"n": 23, "category": 1, "difficulty": "D", "html": "Custom scopes - how do you register one, and what does <code>SimpleThreadScope<\/code> not do that you might expect?", "answerTitle": "Custom scopes", "answer": "<p>Implement <code>org.springframework.beans.factory.config.Scope<\/code> (<code>get<\/code>, <code>remove<\/code>, <code>registerDestructionCallback<\/code>) and register it with <code>beanFactory.registerScope(&quot;tenant&quot;, new TenantScope())<\/code> from a <code>BeanFactoryPostProcessor<\/code>, then use <code>@Scope(&quot;tenant&quot;)<\/code>.<\/p><p><code>SimpleThreadScope<\/code> is the built-in thread scope, and the trap is that <strong>it does not call destruction callbacks<\/strong> - it has no way to know a thread is finished, so <code>@PreDestroy<\/code> never runs and anything holding a resource leaks in a pooled thread. Real thread-bound state should use <code>RequestScope<\/code> in a web app, or an explicit context object you manage.<\/p>", "source": "answers.md", "search": "custom scopes - how do you register one, and what does simplethreadscope not do that you might expect? implement org.springframework.beans.factory.config.scope (get, remove, registerdestructioncallback) and register it with beanfactory.registerscope(\"tenant\", new tenantscope()) from a beanfactorypostprocessor, then use @scope(\"tenant\"). simplethreadscope is the built-in thread scope, and the trap is that it does not call destruction callbacks - it has no way to know a thread is finished, so @predestroy never runs and anything holding a resource leaks in a pooled thread. real thread-bound state should use requestscope in a web app, or an explicit context object you manage."}, {"n": 24, "category": 1, "difficulty": "T", "html": "What does a scoped proxy actually inject into a singleton, and what happens if you call it outside its scope?", "answerTitle": "Scoped proxies", "answer": "<p><code>@Scope(value = &quot;request&quot;, proxyMode = TARGET_CLASS)<\/code> injects a CGLIB proxy into the singleton. Every method call on it resolves the <em>current<\/em> request&#x27;s instance from the scope and delegates. Without the proxy, the singleton would capture one request&#x27;s bean forever.<\/p><p>Called outside its scope, you get <code>BeanCreationException: Scope &#x27;request&#x27; is not active for the current thread<\/code> - which is exactly what happens on an <code>@Async<\/code> thread, in a <code>@Scheduled<\/code> job, or in a Kafka listener, since none of those has a bound request. That is one of the most common &quot;works in the controller, fails in the background job&quot; bugs.<\/p>", "source": "answers.md", "search": "what does a scoped proxy actually inject into a singleton, and what happens if you call it outside its scope? @scope(value = \"request\", proxymode = target_class) injects a cglib proxy into the singleton. every method call on it resolves the current request's instance from the scope and delegates. without the proxy, the singleton would capture one request's bean forever. called outside its scope, you get beancreationexception: scope 'request' is not active for the current thread - which is exactly what happens on an @async thread, in a @scheduled job, or in a kafka listener, since none of those has a bound request. that is one of the most common \"works in the controller, fails in the background job\" bugs."}, {"n": 25, "category": 1, "difficulty": "D", "html": "<code>BeanFactory<\/code> versus <code>ApplicationContext<\/code> - is the distinction still meaningful in 2026?", "answerTitle": "`BeanFactory` versus `ApplicationContext`", "answer": "<p><code>BeanFactory<\/code> is the bare DI container. <code>ApplicationContext<\/code> extends it with event publication, message source and internationalization, resource loading, <code>Environment<\/code>, automatic registration of <code>BeanPostProcessor<\/code>s and <code>BeanFactoryPostProcessor<\/code>s, and eager singleton instantiation.<\/p><p>In 2026 the distinction is mostly historical - you always use an <code>ApplicationContext<\/code>. It remains worth knowing because it explains the layering (<code>ApplicationContext<\/code> <em>has a<\/em> <code>BeanFactory<\/code>, obtained in step 2 of refresh) and because <code>BeanFactory<\/code> is still the type you interact with in infrastructure extension points.<\/p>", "source": "answers.md", "search": "beanfactory versus applicationcontext - is the distinction still meaningful in 2026? beanfactory is the bare di container. applicationcontext extends it with event publication, message source and internationalization, resource loading, environment, automatic registration of beanpostprocessors and beanfactorypostprocessors, and eager singleton instantiation. in 2026 the distinction is mostly historical - you always use an applicationcontext. it remains worth knowing because it explains the layering (applicationcontext has a beanfactory, obtained in step 2 of refresh) and because beanfactory is still the type you interact with in infrastructure extension points."}, {"n": 26, "category": 1, "difficulty": "A", "html": "How would you diagnose &quot;bean X is not eligible for auto-proxying&quot; warnings, and why do they matter?", "answerTitle": "Auto-proxying warnings", "answer": "<p>The warning &quot;is not eligible for getting processed by all BeanPostProcessors&quot; means a bean was instantiated during step 5 or 6, before the post-processor registry was complete. The consequence is silent: that bean never receives its AOP proxy, so <code>@Transactional<\/code>, <code>@Async<\/code>, <code>@Cacheable<\/code>, metrics and security on it do nothing at all.<\/p><p>Diagnosis: read the warning carefully - it names the bean and often the post-processor that caused early instantiation. The usual culprits are a non-static <code>@Bean<\/code> <code>BeanFactoryPostProcessor<\/code>, a <code>BeanPostProcessor<\/code> that injects application beans, and <code>@Autowired<\/code> on infrastructure configuration such as a <code>DataSource<\/code> used by a post-processor.<\/p><p>Fixes: declare post-processors <code>static<\/code>, inject <code>ObjectProvider<\/code> and resolve lazily, or take <code>BeanFactory<\/code> and look up on demand. I treat these warnings as build-failing, because a silently non-transactional service is far worse than a startup error.<\/p><blockquote><p><em>Hook: a service where metrics and transactions were silently absent because of an eagerly created post-processor.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how would you diagnose \"bean x is not eligible for auto-proxying\" warnings, and why do they matter? the warning \"is not eligible for getting processed by all beanpostprocessors\" means a bean was instantiated during step 5 or 6, before the post-processor registry was complete. the consequence is silent: that bean never receives its aop proxy, so @transactional, @async, @cacheable, metrics and security on it do nothing at all. diagnosis: read the warning carefully - it names the bean and often the post-processor that caused early instantiation. the usual culprits are a non-static @bean beanfactorypostprocessor, a beanpostprocessor that injects application beans, and @autowired on infrastructure configuration such as a datasource used by a post-processor. fixes: declare post-processors static, inject objectprovider and resolve lazily, or take beanfactory and look up on demand. i treat these warnings as build-failing, because a silently non-transactional service is far worse than a startup error. hook: a service where metrics and transactions were silently absent because of an eagerly created post-processor."}, {"n": 27, "category": 2, "difficulty": "D", "html": "The <code>ConfigData<\/code> API introduced in Boot 2.4 replaced <code>ConfigFileApplicationListener<\/code>. What changed about how profile-specific documents are loaded?", "answerTitle": "The `ConfigData` API", "answer": "<p>Boot 2.4 replaced <code>ConfigFileApplicationListener<\/code> with a <code>ConfigDataLocationResolver<\/code> / <code>ConfigDataLoader<\/code> SPI. The visible change is that configuration is now loaded in a <strong>strict, document-order<\/strong> model: files are processed in the order they are declared, and later documents override earlier ones, including profile-specific documents.<\/p><p>Under the old model profile-specific files were layered on afterwards regardless of position. Under the new one, <code>application-prod.yml<\/code> overrides <code>application.yml<\/code> because it is processed later, but a profile document <em>within<\/em> a file only overrides documents above it. The SPI is also the extension point that lets <code>spring.config.import<\/code> pull configuration from Vault, Consul or AWS.<\/p>", "source": "answers.md", "search": "the configdata api introduced in boot 2.4 replaced configfileapplicationlistener. what changed about how profile-specific documents are loaded? boot 2.4 replaced configfileapplicationlistener with a configdatalocationresolver / configdataloader spi. the visible change is that configuration is now loaded in a strict, document-order model: files are processed in the order they are declared, and later documents override earlier ones, including profile-specific documents. under the old model profile-specific files were layered on afterwards regardless of position. under the new one, application-prod.yml overrides application.yml because it is processed later, but a profile document within a file only overrides documents above it. the spi is also the extension point that lets spring.config.import pull configuration from vault, consul or aws."}, {"n": 28, "category": 2, "difficulty": "T", "html": "Boot 2.4 forbade <code>spring.profiles.active<\/code> inside a profile-specific document and changed override ordering. What breaks on upgrade and how do you fix it?", "answerTitle": "Boot 2.4 configuration upgrade", "answer": "<p>Three specific breakages:<\/p><ol><li><code>spring.profiles.active<\/code> is <strong>not allowed<\/strong> inside a profile-specific document or a document that itself is profile-activated - it throws <code>InactiveConfigDataAccessException<\/code>. Profile activation must happen in the top-level document, or use profile <em>groups<\/em>.<\/li><li><code>spring.profiles<\/code> was replaced by <code>spring.config.activate.on-profile<\/code>.<\/li><li>Override ordering changed, so a value you expected to win may now lose depending on document order.<\/li><\/ol><p>The escape hatch is <code>spring.config.use-legacy-processing=true<\/code>, which was removed in Boot 2.6 - so it buys you one release to migrate, no more. My approach is to write a test that asserts the effective value of the twenty properties that actually matter per profile, then upgrade; guessing from documentation does not survive contact with a real configuration tree.<\/p>", "source": "answers.md", "search": "boot 2.4 forbade spring.profiles.active inside a profile-specific document and changed override ordering. what breaks on upgrade and how do you fix it? three specific breakages: 1. spring.profiles.active is not allowed inside a profile-specific document or a document that itself is profile-activated - it throws inactiveconfigdataaccessexception. profile activation must happen in the top-level document, or use profile groups . 2. spring.profiles was replaced by spring.config.activate.on-profile. 3. override ordering changed, so a value you expected to win may now lose depending on document order. the escape hatch is spring.config.use-legacy-processing=true, which was removed in boot 2.6 - so it buys you one release to migrate, no more. my approach is to write a test that asserts the effective value of the twenty properties that actually matter per profile, then upgrade; guessing from documentation does not survive contact with a real configuration tree."}, {"n": 29, "category": 2, "difficulty": "D", "html": "<code>spring.config.import<\/code> - how do you load configuration from AWS Parameter Store, Secrets Manager or Vault, and how do you make an import mandatory?", "answerTitle": "`spring.config.import`", "answer": "<p>It declaratively imports additional configuration sources at the right point in the precedence chain, rather than bolting them on in a listener:<\/p><pre><code class=\"lang-yaml\">spring:\n  config:\n    import:\n      - &quot;aws-parameterstore:/prod/orders/&quot;\n      - &quot;aws-secretsmanager:/prod/orders/db&quot;\n      - &quot;optional:file:/etc/orders/override.yml&quot;<\/code><\/pre><p>Without the <code>optional:<\/code> prefix a missing source <strong>fails startup<\/strong>, which is exactly what you want for a mandatory secret store - the alternative is a service that starts with empty credentials and fails at first request. Imports are processed after the importing document, so the imported values override it.<\/p>", "source": "answers.md", "search": "spring.config.import - how do you load configuration from aws parameter store, secrets manager or vault, and how do you make an import mandatory? it declaratively imports additional configuration sources at the right point in the precedence chain, rather than bolting them on in a listener: yaml spring: config: import: - \"aws-parameterstore:/prod/orders/\" - \"aws-secretsmanager:/prod/orders/db\" - \"optional:file:/etc/orders/override.yml\" without the optional: prefix a missing source fails startup , which is exactly what you want for a mandatory secret store - the alternative is a service that starts with empty credentials and fails at first request. imports are processed after the importing document, so the imported values override it."}, {"n": 30, "category": 2, "difficulty": "D", "html": "Relaxed binding - which property forms all bind to <code>myApp.connectionTimeout<\/code>, and which does the environment variable use?", "answerTitle": "Relaxed binding", "answer": "<p>For <code>myApp.connectionTimeout<\/code>, all of these bind: <code>myApp.connectionTimeout<\/code>, <code>my-app.connection-timeout<\/code>, <code>my_app.connection_timeout<\/code>, <code>MYAPP_CONNECTIONTIMEOUT<\/code>.<\/p><p>Environment variables must use the <strong>upper-case underscore<\/strong> form (<code>MYAPP_CONNECTIONTIMEOUT<\/code>), because that is the only form many shells and orchestrators permit. Kebab-case is the recommended canonical form in properties files, and it is what you should write in documentation.<\/p><p>Relaxed binding applies to <code>@ConfigurationProperties<\/code> only - <strong><code>@Value<\/code> does exact matching<\/strong>, which is one more reason to prefer type-safe binding.<\/p>", "source": "answers.md", "search": "relaxed binding - which property forms all bind to myapp.connectiontimeout, and which does the environment variable use? for myapp.connectiontimeout, all of these bind: myapp.connectiontimeout, my-app.connection-timeout, my_app.connection_timeout, myapp_connectiontimeout. environment variables must use the upper-case underscore form (myapp_connectiontimeout), because that is the only form many shells and orchestrators permit. kebab-case is the recommended canonical form in properties files, and it is what you should write in documentation. relaxed binding applies to @configurationproperties only - @value does exact matching , which is one more reason to prefer type-safe binding."}, {"n": 31, "category": 2, "difficulty": "C", "html": "<code>@ConfigurationProperties<\/code> versus <code>@Value<\/code> - binding, validation, immutability with constructor binding and records.", "answerTitle": "`@ConfigurationProperties` versus `@Value`", "answer": "<p><code>@ConfigurationProperties<\/code> gives you relaxed binding, nested objects, <code>List<\/code> and <code>Map<\/code> binding, JSR-303 validation with <code>@Validated<\/code>, IDE metadata, and constructor binding for immutability:<\/p><pre><code class=\"lang-java\">@ConfigurationProperties(&quot;orders.http&quot;)\n@Validated\nrecord OrdersHttpProperties(@NotNull URI baseUrl, @DurationUnit(SECONDS) Duration timeout) {}<\/code><\/pre><p>Records and constructor binding mean the object is immutable and cannot be half-configured. Register with <code>@EnableConfigurationProperties<\/code> or <code>@ConfigurationPropertiesScan<\/code>.<\/p><p><code>@Value<\/code> is appropriate only for a single scalar, or when you genuinely need SpEL. It offers no validation, no relaxed binding and no metadata.<\/p>", "source": "answers.md", "search": "@configurationproperties versus @value - binding, validation, immutability with constructor binding and records. @configurationproperties gives you relaxed binding, nested objects, list and map binding, jsr-303 validation with @validated, ide metadata, and constructor binding for immutability: java @configurationproperties(\"orders.http\") @validated record ordershttpproperties(@notnull uri baseurl, @durationunit(seconds) duration timeout) {} records and constructor binding mean the object is immutable and cannot be half-configured. register with @enableconfigurationproperties or @configurationpropertiesscan. @value is appropriate only for a single scalar, or when you genuinely need spel. it offers no validation, no relaxed binding and no metadata."}, {"n": 32, "category": 2, "difficulty": "T", "html": "Why does <code>@Value<\/code> fail to bind a YAML list without SpEL, and why does <code>@Value<\/code> inside a <code>@ConfigurationProperties<\/code> class not behave as people expect?", "answerTitle": "`@Value` limitations", "answer": "<p><code>@Value(&quot;${my.list}&quot;)<\/code> on a <code>List&lt;String&gt;<\/code> fails because <code>@Value<\/code> performs simple placeholder substitution followed by a conversion - a YAML list is stored as indexed keys (<code>my.list[0]<\/code>, <code>my.list[1]<\/code>), not as a single comma-joined value. You must either use a comma-separated property with <code>@Value(&quot;${my.list}&quot;) List&lt;String&gt;<\/code> (which works only because of the <code>String<\/code> to collection converter), or use SpEL <code>#{&#x27;${my.list}&#x27;.split(&#x27;,&#x27;)}<\/code>, or - correctly - use <code>@ConfigurationProperties<\/code>, which binds indexed keys natively.<\/p><p>Mixing <code>@Value<\/code> into a <code>@ConfigurationProperties<\/code> class is worse: with constructor binding the <code>@Value<\/code> is ignored entirely, and with setter binding it creates two competing binding mechanisms on one object, so the value depends on which ran last. Keep the two mechanisms in separate classes.<\/p>", "source": "answers.md", "search": "why does @value fail to bind a yaml list without spel, and why does @value inside a @configurationproperties class not behave as people expect? @value(\"${my.list}\") on a list<string fails because @value performs simple placeholder substitution followed by a conversion - a yaml list is stored as indexed keys (my.list[0], my.list[1]), not as a single comma-joined value. you must either use a comma-separated property with @value(\"${my.list}\") list<string (which works only because of the string to collection converter), or use spel {'${my.list}'.split(',')}, or - correctly - use @configurationproperties, which binds indexed keys natively. mixing @value into a @configurationproperties class is worse: with constructor binding the @value is ignored entirely, and with setter binding it creates two competing binding mechanisms on one object, so the value depends on which ran last. keep the two mechanisms in separate classes."}, {"n": 33, "category": 2, "difficulty": "D", "html": "How do you validate configuration at startup so a misconfigured service fails immediately rather than at first request?", "answerTitle": "Fail-fast configuration validation", "answer": "<p>Annotate the properties class <code>@Validated<\/code> and put JSR-303 constraints on the fields. Binding failures then throw at context startup with a precise report naming the property, the invalid value and the constraint.<\/p><p>For rules that constraints cannot express, add a <code>@PostConstruct<\/code> validation method, or implement <code>Validator<\/code> and register it as <code>configurationPropertiesValidator<\/code>. For cross-cutting checks - &quot;if <code>feature.x<\/code> is enabled then <code>feature.x.endpoint<\/code> must be set&quot; - I prefer an <code>ApplicationRunner<\/code> that throws, because the message can be domain-specific.<\/p><p>The principle is worth stating: a service should refuse to start rather than start misconfigured. A crash loop is visible in thirty seconds; a service silently pointing at the wrong queue is discovered by a customer.<\/p>", "source": "answers.md", "search": "how do you validate configuration at startup so a misconfigured service fails immediately rather than at first request? annotate the properties class @validated and put jsr-303 constraints on the fields. binding failures then throw at context startup with a precise report naming the property, the invalid value and the constraint. for rules that constraints cannot express, add a @postconstruct validation method, or implement validator and register it as configurationpropertiesvalidator. for cross-cutting checks - \"if feature.x is enabled then feature.x.endpoint must be set\" - i prefer an applicationrunner that throws, because the message can be domain-specific. the principle is worth stating: a service should refuse to start rather than start misconfigured. a crash loop is visible in thirty seconds; a service silently pointing at the wrong queue is discovered by a customer."}, {"n": 34, "category": 2, "difficulty": "D", "html": "<code>@ConfigurationPropertiesBinding<\/code> and custom converters - when do you need one?", "answerTitle": "Custom converters", "answer": "<p>Binding uses a <code>Converter<\/code> registry. To bind a custom type - a <code>Money<\/code>, a <code>Duration<\/code> in a non-standard format, a comma-separated set of enums - register a <code>Converter&lt;String, T&gt;<\/code> annotated <code>@ConfigurationPropertiesBinding<\/code>:<\/p><pre><code class=\"lang-java\">@Component\n@ConfigurationPropertiesBinding\nclass StringToMoneyConverter implements Converter&lt;String, Money&gt; { ... }<\/code><\/pre><p>The annotation is required; without it the converter is registered for MVC binding but not for configuration binding, which is a confusing failure because the same converter works elsewhere.<\/p>", "source": "answers.md", "search": "@configurationpropertiesbinding and custom converters - when do you need one? binding uses a converter registry. to bind a custom type - a money, a duration in a non-standard format, a comma-separated set of enums - register a converter<string, t annotated @configurationpropertiesbinding: java @component @configurationpropertiesbinding class stringtomoneyconverter implements converter<string, money { ... } the annotation is required; without it the converter is registered for mvc binding but not for configuration binding, which is a confusing failure because the same converter works elsewhere."}, {"n": 35, "category": 2, "difficulty": "D", "html": "Profile groups and <code>@Profile<\/code> expressions. Why are profile-conditional <em>beans<\/em> risky?", "answerTitle": "Profiles", "answer": "<p><code>@Profile<\/code> supports expressions: <code>@Profile(&quot;prod &amp; !legacy&quot;)<\/code>. Profile <em>groups<\/em> let one profile activate several: <code>spring.profiles.group.prod=prod,metrics,secure<\/code>.<\/p><p>Profile-conditional <strong>beans<\/strong> are risky because they create code paths that no test exercises. If <code>prod<\/code> has a different implementation than <code>dev<\/code>, then your test suite verifies the <code>dev<\/code> behavior and production runs code that was never integration-tested - and the divergence is invisible in code review.<\/p><p>My rule: profiles select <em>configuration values<\/em> and infrastructure adapters (a real S3 client versus LocalStack), never business logic. Where behavior must differ, use a feature flag that can be toggled in any environment, so both branches are testable.<\/p>", "source": "answers.md", "search": "profile groups and @profile expressions. why are profile-conditional beans risky? @profile supports expressions: @profile(\"prod & !legacy\"). profile groups let one profile activate several: spring.profiles.group.prod=prod,metrics,secure. profile-conditional beans are risky because they create code paths that no test exercises. if prod has a different implementation than dev, then your test suite verifies the dev behavior and production runs code that was never integration-tested - and the divergence is invisible in code review. my rule: profiles select configuration values and infrastructure adapters (a real s3 client versus localstack), never business logic. where behavior must differ, use a feature flag that can be toggled in any environment, so both branches are testable."}, {"n": 36, "category": 2, "difficulty": "T", "html": "<code>spring.profiles.active<\/code> versus <code>spring.profiles.include<\/code> versus profile groups - what is the precedence, and which is additive?", "answerTitle": "Profile activation precedence", "answer": "<p><code>spring.profiles.active<\/code> <strong>replaces<\/strong> the active set - the highest-precedence property source that defines it wins outright, so setting it on the command line discards what is in <code>application.yml<\/code>. <code>spring.profiles.include<\/code> is <strong>additive<\/strong> and unconditionally adds profiles regardless of what is active. Profile groups expand a profile into several when it is activated.<\/p><p>The trap is combining them: <code>include<\/code> cannot be used to conditionally add, and defining <code>active<\/code> in multiple sources does not merge - people expect union semantics and get replacement. Since Boot 2.4, <code>include<\/code> in a profile-specific document is also restricted. When it gets complicated, groups are the maintainable answer.<\/p>", "source": "answers.md", "search": "spring.profiles.active versus spring.profiles.include versus profile groups - what is the precedence, and which is additive? spring.profiles.active replaces the active set - the highest-precedence property source that defines it wins outright, so setting it on the command line discards what is in application.yml. spring.profiles.include is additive and unconditionally adds profiles regardless of what is active. profile groups expand a profile into several when it is activated. the trap is combining them: include cannot be used to conditionally add, and defining active in multiple sources does not merge - people expect union semantics and get replacement. since boot 2.4, include in a profile-specific document is also restricted. when it gets complicated, groups are the maintainable answer."}, {"n": 37, "category": 2, "difficulty": "D", "html": "What is <code>spring-configuration-metadata.json<\/code> and why must a shared starter generate it?", "answerTitle": "Configuration metadata", "answer": "<p><code>spring-configuration-metadata.json<\/code> describes your properties - name, type, description, default, deprecation - and is what gives IDE auto-completion and validation. It is generated at build time by adding <code>spring-boot-configuration-processor<\/code> as an annotation processor.<\/p><p>For a shared starter it is not cosmetic: it is the documentation, and it is the mechanism for deprecating a property gracefully (<code>@DeprecatedConfigurationProperty<\/code> with a replacement) so forty consuming teams see a warning in their IDE rather than discovering the change at runtime. I treat missing metadata in a platform starter as a defect.<\/p>", "source": "answers.md", "search": "what is spring-configuration-metadata.json and why must a shared starter generate it? spring-configuration-metadata.json describes your properties - name, type, description, default, deprecation - and is what gives ide auto-completion and validation. it is generated at build time by adding spring-boot-configuration-processor as an annotation processor. for a shared starter it is not cosmetic: it is the documenta
