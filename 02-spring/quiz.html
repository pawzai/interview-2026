\/p>", "source": "answers.md", "search": "you catch an exception inside a transactional method and return normally. when does the transaction still roll back? if you catch the exception, the transaction advisor never sees it , so it does not mark rollback. the transaction commits with whatever was written before the exception - a partial write, which is usually the bug. it still rolls back in two cases: if the exception escaped a nested @transactional call that already set rollbackonly (giving unexpectedrollbackexception at commit as in q70), or if the underlying resource itself invalidated the transaction (a constraint violation in postgresql aborts the transaction, and every subsequent statement fails with \"current transaction is aborted\"). that last one is worth naming because it surprises people: on postgresql you cannot catch a constraint violation and continue using the same transaction. you need a savepoint, or a separate transaction, or you must check before writing."}, {"n": 75, "category": 4, "difficulty": "D", "html": "Flush timing and <code>FlushMode<\/code> - why does a query sometimes trigger a flush you did not ask for?", "answerTitle": "Flush timing", "answer": "<p>Hibernate&#x27;s default <code>FlushMode.AUTO<\/code> flushes before a query whose result could be affected by pending changes, and at commit. This means a <code>findBy...<\/code> call can trigger inserts and updates you did not expect at that point - and therefore constraint violations surface at a surprising line, inside a query rather than at the save.<\/p><p><code>saveAndFlush<\/code> forces it immediately, which you want when you need a generated ID for subsequent work, when you want a constraint violation at a controlled point, or before a native query that bypasses the persistence context and would otherwise not see your pending changes.<\/p><p>Manual flush costs you batching - Hibernate batches statements until flush, so flushing per entity in a loop turns one batch into N round trips. That trade-off is the answer to &quot;why is my bulk insert slow&quot;.<\/p>", "source": "answers.md", "search": "flush timing and flushmode - why does a query sometimes trigger a flush you did not ask for? hibernate's default flushmode.auto flushes before a query whose result could be affected by pending changes, and at commit. this means a findby... call can trigger inserts and updates you did not expect at that point - and therefore constraint violations surface at a surprising line, inside a query rather than at the save. saveandflush forces it immediately, which you want when you need a generated id for subsequent work, when you want a constraint violation at a controlled point, or before a native query that bypasses the persistence context and would otherwise not see your pending changes. manual flush costs you batching - hibernate batches statements until flush, so flushing per entity in a loop turns one batch into n round trips. that trade-off is the answer to \"why is my bulk insert slow\"."}, {"n": 76, "category": 4, "difficulty": "T", "html": "A <code>@Transactional<\/code> method makes an HTTP call. Why is this a design smell, and what exactly does it cost?", "answerTitle": "HTTP calls inside a transaction", "answer": "<p>The cost is concrete: the database connection is held for the entire duration of the network call. A 500ms API call inside a transaction means each request occupies a pooled connection for 500ms doing nothing, so a 20-connection pool caps you at 40 requests per second regardless of database capacity. When the remote service slows to 5 seconds, the pool is exhausted and <em>every<\/em> endpoint fails - a total outage caused by one slow third party.<\/p><p>It is also semantically wrong: the HTTP call cannot be rolled back, so if the transaction later fails you have performed an irreversible external action with no record of it.<\/p><p>The correct shape: do the external call outside the transaction, then open a short transaction to persist the result; or write an outbox row transactionally and perform the call asynchronously afterwards with retry and idempotency. Enforce it with an ArchUnit rule (Q80) - review will not catch it reliably.<\/p>", "source": "answers.md", "search": "a @transactional method makes an http call. why is this a design smell, and what exactly does it cost? the cost is concrete: the database connection is held for the entire duration of the network call. a 500ms api call inside a transaction means each request occupies a pooled connection for 500ms doing nothing, so a 20-connection pool caps you at 40 requests per second regardless of database capacity. when the remote service slows to 5 seconds, the pool is exhausted and every endpoint fails - a total outage caused by one slow third party. it is also semantically wrong: the http call cannot be rolled back, so if the transaction later fails you have performed an irreversible external action with no record of it. the correct shape: do the external call outside the transaction, then open a short transaction to persist the result; or write an outbox row transactionally and perform the call asynchronously afterwards with retry and idempotency. enforce it with an archunit rule (q80) - review will not catch it reliably."}, {"n": 77, "category": 4, "difficulty": "D", "html": "What does an <code>@Async<\/code> method inherit from the caller&#x27;s transaction, and what must you do instead?", "answerTitle": "`@Async` and transactions", "answer": "<p>The <code>@Async<\/code> method runs on a different thread, and the transaction is thread-bound, so it inherits <strong>nothing<\/strong>: no transaction, no persistence context, no <code>EntityManager<\/code>, and by default no security context or MDC.<\/p><p>Consequences: entities passed as arguments are detached, so touching a lazy association throws <code>LazyInitializationException<\/code>; the async work can start before the caller commits and therefore read stale or non-existent data; and if the caller rolls back, the async work has already happened.<\/p><p>The correct pattern: pass <strong>identifiers, not entities<\/strong>; trigger the async work from <code>@TransactionalEventListener(phase = AFTER_COMMIT)<\/code> so it cannot run for a rolled-back transaction; and annotate the async method itself <code>@Transactional<\/code> so it opens its own transaction and reloads what it needs.<\/p>", "source": "answers.md", "search": "what does an @async method inherit from the caller's transaction, and what must you do instead? the @async method runs on a different thread, and the transaction is thread-bound, so it inherits nothing : no transaction, no persistence context, no entitymanager, and by default no security context or mdc. consequences: entities passed as arguments are detached, so touching a lazy association throws lazyinitializationexception; the async work can start before the caller commits and therefore read stale or non-existent data; and if the caller rolls back, the async work has already happened. the correct pattern: pass identifiers, not entities ; trigger the async work from @transactionaleventlistener(phase = after_commit) so it cannot run for a rolled-back transaction; and annotate the async method itself @transactional so it opens its own transaction and reloads what it needs."}, {"n": 78, "category": 4, "difficulty": "D", "html": "Reactive transactions - <code>ReactiveTransactionManager<\/code> and <code>TransactionalOperator<\/code>. Why can the context not be thread-bound here?", "answerTitle": "Reactive transactions", "answer": "<p><code>ReactiveTransactionManager<\/code> (with R2DBC) binds the transactional resource to the <strong>Reactor <code>Context<\/code><\/strong> rather than to a <code>ThreadLocal<\/code>, because a reactive chain hops threads freely and no thread owns the request.<\/p><p><code>@Transactional<\/code> does work on reactive return types - Spring subscribes with the transactional context attached - but only if the whole chain is reactive; any blocking call or thread handoff outside Reactor&#x27;s control breaks the association. <code>TransactionalOperator<\/code> gives explicit control:<\/p><pre><code class=\"lang-java\">return orderRepository.save(order)\n    .then(auditRepository.save(entry))\n    .as(transactionalOperator::transactional);<\/code><\/pre><p>The mental model to state: in the servlet world the transaction follows the <em>thread<\/em>; in the reactive world it follows the <em>subscription<\/em>. Every difference follows from that.<\/p>", "source": "answers.md", "search": "reactive transactions - reactivetransactionmanager and transactionaloperator. why can the context not be thread-bound here? reactivetransactionmanager (with r2dbc) binds the transactional resource to the reactor context rather than to a threadlocal, because a reactive chain hops threads freely and no thread owns the request. @transactional does work on reactive return types - spring subscribes with the transactional context attached - but only if the whole chain is reactive; any blocking call or thread handoff outside reactor's control breaks the association. transactionaloperator gives explicit control: java return orderrepository.save(order) .then(auditrepository.save(entry)) .as(transactionaloperator::transactional); the mental model to state: in the servlet world the transaction follows the thread ; in the reactive world it follows the subscription . every difference follows from that."}, {"n": 79, "category": 4, "difficulty": "D", "html": "Implementing the transactional outbox in Spring - an events table versus <code>@TransactionalEventListener<\/code>. Which is safe?", "answerTitle": "Outbox in Spring", "answer": "<p>Two implementations, and only one is safe by default.<\/p><p><strong>Events table<\/strong>: write the domain change and an <code>outbox<\/code> row in the same <code>@Transactional<\/code> method. One local commit, fully atomic. A separate relay - a poller, or Debezium tailing the WAL - publishes and marks rows sent. This is the correct default.<\/p><p><strong><code>@TransactionalEventListener<\/code><\/strong>: <code>AFTER_COMMIT<\/code> publishing to Kafka is <em>not<\/em> an outbox - if the process dies between commit and publish, the event is lost forever. It is acceptable only when losing the event is tolerable. <code>BEFORE_COMMIT<\/code> writing an outbox row <em>is<\/em> safe, because it is inside the transaction.<\/p><p>Spring Modulith&#x27;s event publication registry is a supported middle ground: it persists incomplete event publications in the same transaction and republishes them on restart, giving at-least-once delivery without you writing the relay (Q248).<\/p><p>Whichever you choose, consumers must be idempotent, because all of these are at-least-once.<\/p>", "source": "answers.md", "search": "implementing the transactional outbox in spring - an events table versus @transactionaleventlistener. which is safe? two implementations, and only one is safe by default. events table : write the domain change and an outbox row in the same @transactional method. one local commit, fully atomic. a separate relay - a poller, or debezium tailing the wal - publishes and marks rows sent. this is the correct default. @transactionaleventlistener : after_commit publishing to kafka is not an outbox - if the process dies between commit and publish, the event is lost forever. it is acceptable only when losing the event is tolerable. before_commit writing an outbox row is safe, because it is inside the transaction. spring modulith's event publication registry is a supported middle ground: it persists incomplete event publications in the same transaction and republishes them on restart, giving at-least-once delivery without you writing the relay (q248). whichever you choose, consumers must be idempotent, because all of these are at-least-once."}, {"n": 80, "category": 4, "difficulty": "A", "html": "How would you enforce, across a large codebase, that no HTTP call happens inside a transaction?", "answerTitle": "Enforcing no HTTP in transactions", "answer": "<p>Layered, because one control is never enough across a large codebase:<\/p><ol><li><strong>ArchUnit rule in CI<\/strong> - the primary control. Assert that no method annotated <code>@Transactional<\/code> calls a type in your HTTP client packages, transitively where practical. It fails the build with a precise message and a link to the rationale.<\/li><li><strong>A runtime guard<\/strong> - a custom <code>Interceptor<\/code> on the <code>RestClient<\/code>/<code>WebClient<\/code> that checks <code>TransactionSynchronizationManager.isActualTransactionActive()<\/code> and, in non-production, throws; in production, records a metric and logs at WARN with the stack trace. This catches the dynamic paths static analysis misses.<\/li><li><strong><code>LazyConnectionDataSourceProxy<\/code><\/strong> as a safety net so the damage is bounded while violations are being cleaned up.<\/li><li><strong>Alerting<\/strong> on transaction duration percentiles and on Hikari <code>connections_pending<\/code>, so a new violation is visible operationally.<\/li><\/ol><p>Then the rollout matters as much as the rule: turn the ArchUnit rule on in report-only mode, fix the existing violations with the owning teams, and only then fail the build. Introducing a build-breaking rule against a codebase with 200 existing violations is how platform teams lose credibility.<\/p>", "source": "answers.md", "search": "how would you enforce, across a large codebase, that no http call happens inside a transaction? layered, because one control is never enough across a large codebase: 1. archunit rule in ci - the primary control. assert that no method annotated @transactional calls a type in your http client packages, transitively where practical. it fails the build with a precise message and a link to the rationale. 2. a runtime guard - a custom interceptor on the restclient/webclient that checks transactionsynchronizationmanager.isactualtransactionactive() and, in non-production, throws; in production, records a metric and logs at warn with the stack trace. this catches the dynamic paths static analysis misses. 3. lazyconnectiondatasourceproxy as a safety net so the damage is bounded while violations are being cleaned up. 4. alerting on transaction duration percentiles and on hikari connections_pending, so a new violation is visible operationally. then the rollout matters as much as the rule: turn the archunit rule on in report-only mode, fix the existing violations with the owning teams, and only then fail the build. introducing a build-breaking rule against a codebase with 200 existing violations is how platform teams lose credibility."}, {"n": 81, "category": 5, "difficulty": "C", "html": "Trace a request through <code>DispatcherServlet<\/code>. Which components run, in which order?", "answerTitle": "The `DispatcherServlet` flow", "answer": "<ol><li>Servlet filters run (including the Spring Security filter chain).<\/li><li><code>DispatcherServlet.doDispatch<\/code> begins. Multipart resolution if applicable.<\/li><li><code>getHandler()<\/code> walks the <code>HandlerMapping<\/code> list, returning a <code>HandlerExecutionChain<\/code> (handler plus matching interceptors).<\/li><li><code>getHandlerAdapter()<\/code> finds an adapter that supports the handler.<\/li><li>Interceptor <code>preHandle<\/code> methods run in order; returning false stops the chain.<\/li><li><code>handle()<\/code> - the adapter resolves arguments, invokes the method, and handles the return value.<\/li><li>Interceptor <code>postHandle<\/code> (skipped if an exception was thrown).<\/li><li><code>processDispatchResult<\/code> - render the view, or for <code>@ResponseBody<\/code> the return value was already written by the return-value handler.<\/li><li>On exception, the <code>HandlerExceptionResolver<\/code> chain runs - this is where <code>@ExceptionHandler<\/code> methods are found.<\/li><li>Interceptor <code>afterCompletion<\/code> always runs.<\/li><\/ol><p>The detail that matters: everything from step 2 onward is inside the servlet, so an exception thrown in a <em>filter<\/em> never reaches step 9.<\/p>", "source": "answers.md", "search": "trace a request through dispatcherservlet. which components run, in which order? 1. servlet filters run (including the spring security filter chain). 2. dispatcherservlet.dodispatch begins. multipart resolution if applicable. 3. gethandler() walks the handlermapping list, returning a handlerexecutionchain (handler plus matching interceptors). 4. gethandleradapter() finds an adapter that supports the handler. 5. interceptor prehandle methods run in order; returning false stops the chain. 6. handle() - the adapter resolves arguments, invokes the method, and handles the return value. 7. interceptor posthandle (skipped if an exception was thrown). 8. processdispatchresult - render the view, or for @responsebody the return value was already written by the return-value handler. 9. on exception, the handlerexceptionresolver chain runs - this is where @exceptionhandler methods are found. 10. interceptor aftercompletion always runs. the detail that matters: everything from step 2 onward is inside the servlet, so an exception thrown in a filter never reaches step 9."}, {"n": 82, "category": 5, "difficulty": "D", "html": "<code>HandlerMapping<\/code> and <code>HandlerAdapter<\/code> - how is a <code>@RequestMapping<\/code> method matched and then invoked?", "answerTitle": "`HandlerMapping` and `HandlerAdapter`", "answer": "<p><code>RequestMappingHandlerMapping<\/code> builds a map of <code>RequestMappingInfo<\/code> (path patterns, methods, params, headers, consumes, produces) to <code>HandlerMethod<\/code> at startup by scanning <code>@Controller<\/code> beans. At request time it matches and, when several patterns match, sorts them by specificity - exact over <code>{var}<\/code> over <code>**<\/code>.<\/p><p><code>RequestMappingHandlerAdapter<\/code> then does the real work: resolves each argument through the <code>HandlerMethodArgumentResolver<\/code> chain, invokes the method reflectively, and passes the return value through the <code>HandlerMethodReturnValueHandler<\/code> chain (which is where <code>@ResponseBody<\/code> triggers message conversion).<\/p><p>Separating the two is what allows different handler kinds - <code>@RequestMapping<\/code> methods, <code>HttpRequestHandler<\/code>, functional routes - to coexist behind one dispatcher.<\/p>", "source": "answers.md", "search": "handlermapping and handleradapter - how is a @requestmapping method matched and then invoked? requestmappinghandlermapping builds a map of requestmappinginfo (path patterns, methods, params, headers, consumes, produces) to handlermethod at startup by scanning @controller beans. at request time it matches and, when several patterns match, sorts them by specificity - exact over {var} over . requestmappinghandleradapter then does the real work: resolves each argument through the handlermethodargumentresolver chain, invokes the method reflectively, and passes the return value through the handlermethodreturnvaluehandler chain (which is where @responsebody triggers message conversion). separating the two is what allows different handler kinds - @requestmapping methods, httprequesthandler, functional routes - to coexist behind one dispatcher."}, {"n": 83, "category": 5, "difficulty": "D", "html": "<code>HandlerMethodArgumentResolver<\/code> - name three built-ins and describe when you would write your own.", "answerTitle": "Argument resolvers", "answer": "<p>Built-ins include <code>RequestParamMethodArgumentResolver<\/code>, <code>PathVariableMethodArgumentResolver<\/code>, <code>RequestResponseBodyMethodProcessor<\/code> (<code>@RequestBody<\/code>), <code>ModelAttributeMethodProcessor<\/code>, <code>ServletRequestMethodArgumentResolver<\/code>, and <code>AuthenticationPrincipalArgumentResolver<\/code> from Spring Security.<\/p><p>Write your own when a value is derived from the request in a way every controller would otherwise repeat - a resolved tenant, a parsed pagination or filter object, a decoded cursor. It removes a line from fifty controllers and makes the concept a type.<\/p><pre><code class=\"lang-java\">class TenantArgumentResolver implements HandlerMethodArgumentResolver {\n    public boolean supportsParameter(MethodParameter p) { return p.getParameterType() == TenantId.class; }\n    public Object resolveArgument(...) { return TenantId.of(webRequest.getHeader(&quot;X-Tenant&quot;)); }\n}<\/code><\/pre><p>Register through <code>WebMvcConfigurer.addArgumentResolvers<\/code>. Important caveat: resolve identity from the authenticated principal, not a header, or you have built an authorization bypass.<\/p>", "source": "answers.md", "search": "handlermethodargumentresolver - name three built-ins and describe when you would write your own. built-ins include requestparammethodargumentresolver, pathvariablemethodargumentresolver, requestresponsebodymethodprocessor (@requestbody), modelattributemethodprocessor, servletrequestmethodargumentresolver, and authenticationprincipalargumentresolver from spring security. write your own when a value is derived from the request in a way every controller would otherwise repeat - a resolved tenant, a parsed pagination or filter object, a decoded cursor. it removes a line from fifty controllers and makes the concept a type. java class tenantargumentresolver implements handlermethodargumentresolver { public boolean supportsparameter(methodparameter p) { return p.getparametertype() == tenantid.class; } public object resolveargument(...) { return tenantid.of(webrequest.getheader(\"x-tenant\")); } } register through webmvcconfigurer.addargumentresolvers. important caveat: resolve identity from the authenticated principal, not a header, or you have built an authorization bypass."}, {"n": 84, "category": 5, "difficulty": "D", "html": "How is an <code>HttpMessageConverter<\/code> selected, and what is the correct way to customize Jackson in Boot?", "answerTitle": "Message converters", "answer": "<p>Selection is by requested media type and parameter or return type: for a response, the return value handler matches the <code>Accept<\/code> header against each converter&#x27;s supported media types and <code>canWrite(type, mediaType)<\/code>, taking the first match. Order matters, and the first compatible converter wins.<\/p><p>Customizing Jackson <strong>correctly<\/strong> in Boot means using <code>Jackson2ObjectMapperBuilderCustomizer<\/code> or the <code>spring.jackson.*<\/code> properties, so Boot&#x27;s carefully assembled <code>ObjectMapper<\/code> - with its modules for JSR-310, <code>Optional<\/code>, parameter names and Kotlin - is preserved:<\/p><pre><code class=\"lang-java\">@Bean Jackson2ObjectMapperBuilderCustomizer json() {\n    return b -&gt; b.failOnUnknownProperties(false).serializationInclusion(NON_NULL);\n}<\/code><\/pre><p>Defining your own <code>ObjectMapper<\/code> bean replaces Boot&#x27;s entirely and quietly loses those modules - which typically shows up as <code>LocalDateTime<\/code> serializing as an object of fields instead of ISO-8601. Overriding <code>configureMessageConverters<\/code> (rather than <code>extendMessageConverters<\/code>) has the same effect on the converter list.<\/p>", "source": "answers.md", "search": "how is an httpmessageconverter selected, and what is the correct way to customize jackson in boot? selection is by requested media type and parameter or return type: for a response, the return value handler matches the accept header against each converter's supported media types and canwrite(type, mediatype), taking the first match. order matters, and the first compatible converter wins. customizing jackson correctly in boot means using jackson2objectmapperbuildercustomizer or the spring.jackson. properties, so boot's carefully assembled objectmapper - with its modules for jsr-310, optional, parameter names and kotlin - is preserved: java @bean jackson2objectmapperbuildercustomizer json() { return b - b.failonunknownproperties(false).serializationinclusion(non_null); } defining your own objectmapper bean replaces boot's entirely and quietly loses those modules - which typically shows up as localdatetime serializing as an object of fields instead of iso-8601. overriding configuremessageconverters (rather than extendmessageconverters) has the same effect on the converter list."}, {"n": 85, "category": 5, "difficulty": "T", "html": "Why does <code>@RequestBody<\/code> binding to an abstract type or interface fail, and how do you handle polymorphic JSON without opening a deserialization hole?", "answerTitle": "Polymorphic `@RequestBody`", "answer": "<p>Jackson cannot instantiate an abstract type or interface without being told which concrete class to use, so it throws <code>InvalidDefinitionException: cannot construct instance<\/code>.<\/p><p>The dangerous fix is <code>@JsonTypeInfo(use = Id.CLASS)<\/code>, which lets the <em>payload<\/em> name any class on the classpath - that is a deserialization gadget vulnerability, the same class of bug behind many Java RCEs. <code>enableDefaultTyping<\/code> is the same mistake with a different name.<\/p><p>The safe fix is an explicit, closed registry of permitted subtypes:<\/p><pre><code class=\"lang-java\">@JsonTypeInfo(use = Id.NAME, property = &quot;type&quot;)\n@JsonSubTypes({ @Type(value = CardPayment.class, name = &quot;card&quot;),\n                @Type(value = BankPayment.class, name = &quot;bank&quot;) })\nsealed interface PaymentRequest permits CardPayment, BankPayment {}<\/code><\/pre><p>Pairing it with a <code>sealed<\/code> interface means the compiler enforces exhaustive handling too. And a validation rule to state: never accept type information the client fully controls.<\/p>", "source": "answers.md", "search": "why does @requestbody binding to an abstract type or interface fail, and how do you handle polymorphic json without opening a deserialization hole? jackson cannot instantiate an abstract type or interface without being told which concrete class to use, so it throws invaliddefinitionexception: cannot construct instance. the dangerous fix is @jsontypeinfo(use = id.class), which lets the payload name any class on the classpath - that is a deserialization gadget vulnerability, the same class of bug behind many java rces. enabledefaulttyping is the same mistake with a different name. the safe fix is an explicit, closed registry of permitted subtypes: java @jsontypeinfo(use = id.name, property = \"type\") @jsonsubtypes({ @type(value = cardpayment.class, name = \"card\"), @type(value = bankpayment.class, name = \"bank\") }) sealed interface paymentrequest permits cardpayment, bankpayment {} pairing it with a sealed interface means the compiler enforces exhaustive handling too. and a validation rule to state: never accept type information the client fully controls."}, {"n": 86, "category": 5, "difficulty": "D", "html": "Content negotiation - <code>Accept<\/code> header, path extension and request parameter. What changed in recent Boot versions and why?", "answerTitle": "Content negotiation", "answer": "<p><code>ContentNegotiationManager<\/code> resolves the requested media type from, in order: a request parameter (<code>format=json<\/code>, disabled by default), then the <code>Accept<\/code> header. <strong>Path extension matching (<code>/orders.json<\/code>) was deprecated in Boot 2.6 and removed in Spring 6<\/strong> - along with suffix pattern matching for request mappings.<\/p><p>That removal matters because it was a security problem as much as a design one: extension-based negotiation made it possible to bypass path-based security rules (<code>/admin<\/code> protected, <code>/admin.json<\/code> not), and it made every path with a dot ambiguous.<\/p><p>The modern position: negotiate on <code>Accept<\/code> only, register additional converters for other formats, and version through headers or the path rather than the extension.<\/p>", "source": "answers.md", "search": "content negotiation - accept header, path extension and request parameter. what changed in recent boot versions and why? contentnegotiationmanager resolves the requested media type from, in order: a request parameter (format=json, disabled by default), then the accept header. path extension matching (/orders.json) was deprecated in boot 2.6 and removed in spring 6 - along with suffix pattern matching for request mappings. that removal matters because it was a security problem as much as a design one: extension-based negotiation made it possible to bypass path-based security rules (/admin protected, /admin.json not), and it made every path with a dot ambiguous. the modern position: negotiate on accept only, register additional converters for other formats, and version through headers or the path rather than the extension."}, {"n": 87, "category": 5, "difficulty": "C", "html": "<code>Filter<\/code> versus <code>HandlerInterceptor<\/code> versus <code>@ControllerAdvice<\/code> versus AOP - order of execution and what each can see.", "answerTitle": "Filters, interceptors, advice and AOP", "answer": "<p>Execution order for a request:<\/p><ol><li><strong>Servlet <code>Filter<\/code><\/strong> - outermost, sees the raw <code>HttpServletRequest<\/code>, can wrap request and response, runs for <em>every<\/em> request including static resources and errors. Spring Security lives here.<\/li><li><strong><code>HandlerInterceptor<\/code><\/strong> - inside <code>DispatcherServlet<\/code>, knows the resolved <code>HandlerMethod<\/code> (so it can read annotations on it), runs only for mapped requests.<\/li><li><strong><code>@ControllerAdvice<\/code><\/strong> - <code>@InitBinder<\/code> and <code>@ModelAttribute<\/code> before the method, <code>@ExceptionHandler<\/code> after a failure.<\/li><li><strong>AOP advice<\/strong> on the controller or service - innermost, sees method arguments as objects.<\/li><\/ol><p>Choose by what you need: raw bytes or unconditional coverage means a filter; handler metadata means an interceptor; domain objects and reusable behavior mean AOP.<\/p>", "source": "answers.md", "search": "filter versus handlerinterceptor versus @controlleradvice versus aop - order of execution and what each can see. execution order for a request: 1. servlet filter - outermost, sees the raw httpservletrequest, can wrap request and response, runs for every request including static resources and errors. spring security lives here. 2. handlerinterceptor - inside dispatcherservlet, knows the resolved handlermethod (so it can read annotations on it), runs only for mapped requests. 3. @controlleradvice - @initbinder and @modelattribute before the method, @exceptionhandler after a failure. 4. aop advice on the controller or service - innermost, sees method arguments as objects. choose by what you need: raw bytes or unconditional coverage means a filter; handler metadata means an interceptor; domain objects and reusable behavior mean aop."}, {"n": 88, "category": 5, "difficulty": "T", "html": "Why can a servlet <code>Filter<\/code> not know which handler method will run, and what runs before Spring Security in the chain?", "answerTitle": "What a filter cannot see", "answer": "<p>A filter runs before <code>DispatcherServlet<\/code>, and handler mapping happens <em>inside<\/em> the dispatcher - so at filter time no handler has been resolved and the filter cannot know which controller method will run or read its annotations. It can only match on the URL, which is fragile because URL patterns and handler mappings can disagree (path variables, matrix parameters, encoding).<\/p><p>What runs before Spring Security: anything with a lower filter order registered in the servlet container. Boot registers <code>OrderedCharacterEncodingFilter<\/code> (order -2147483648), <code>OrderedFormContentFilter<\/code>, and the tracing/metrics filters; Spring Security&#x27;s <code>springSecurityFilterChain<\/code> sits at <code>-100<\/code> by default (<code>SecurityProperties.DEFAULT_FILTER_ORDER<\/code>). Anything you register with a lower order sees unauthenticated requests - which is fine for request logging and a serious bug for anything that trusts the principal.<\/p>", "source": "answers.md", "search": "why can a servlet filter not know which handler method will run, and what runs before spring security in the chain? a filter runs before dispatcherservlet, and handler mapping happens inside the dispatcher - so at filter time no handler has been resolved and the filter cannot know which controller method will run or read its annotations. it can only match on the url, which is fragile because url patterns and handler mappings can disagree (path variables, matrix parameters, encoding). what runs before spring security: anything with a lower filter order registered in the servlet container. boot registers orderedcharacterencodingfilter (order -2147483648), orderedformcontentfilter, and the tracing/metrics filters; spring security's springsecurityfilterchain sits at -100 by default (securityproperties.default_filter_order). anything you register with a lower order sees unauthenticated requests - which is fine for request logging and a serious bug for anything that trusts the principal."}, {"n": 89, "category": 5, "difficulty": "D", "html": "<code>@ControllerAdvice<\/code> - how are <code>@ExceptionHandler<\/code> methods resolved when several match, and what does <code>ResponseEntityExceptionHandler<\/code> give you?", "answerTitle": "`@ControllerAdvice` resolution", "answer": "<p><code>ExceptionHandlerExceptionResolver<\/code> looks first for an <code>@ExceptionHandler<\/code> in the <strong>controller itself<\/strong>, then in applicable <code>@ControllerAdvice<\/code> beans. Within a set of candidates, the handler whose declared exception type is the <strong>closest match in the class hierarchy<\/strong> wins - not declaration order.<\/p><p>Multiple advice classes are ordered by <code>@Order<\/code>, and <code>@ControllerAdvice<\/code> can be scoped by <code>basePackages<\/code>, <code>assignableTypes<\/code> or <code>annotations<\/code>, which is how you give a subset of controllers different error handling.<\/p><p><code>ResponseEntityExceptionHandler<\/code> is a base class handling the standard Spring MVC exceptions (<code>MethodArgumentNotValidException<\/code>, <code>HttpMessageNotReadableException<\/code>, <code>NoHandlerFoundException<\/code> and about twenty others) and, since Spring 6, mapping them to <code>ProblemDetail<\/code>. Extend it rather than reimplementing that list, and override <code>handleExceptionInternal<\/code> to add correlation IDs uniformly.<\/p>", "source": "answers.md", "search": "@controlleradvice - how are @exceptionhandler methods resolved when several match, and what does responseentityexceptionhandler give you? exceptionhandlerexceptionresolver looks first for an @exceptionhandler in the controller itself , then in applicable @controlleradvice beans. within a set of candidates, the handler whose declared exception type is the closest match in the class hierarchy wins - not declaration order. multiple advice classes are ordered by @order, and @controlleradvice can be scoped by basepackages, assignabletypes or annotations, which is how you give a subset of controllers different error handling. responseentityexceptionhandler is a base class handling the standard spring mvc exceptions (methodargumentnotvalidexception, httpmessagenotreadableexception, nohandlerfoundexception and about twenty others) and, since spring 6, mapping them to problemdetail. extend it rather than reimplementing that list, and override handleexceptioninternal to add correlation ids uniformly."}, {"n": 90, "category": 5, "difficulty": "D", "html": "<code>ProblemDetail<\/code> and RFC 9457 support in Spring 6 - how do you adopt it consistently across a service?", "answerTitle": "`ProblemDetail` and RFC 9457", "answer": "<p>Spring 6 added <code>ProblemDetail<\/code> (<code>type<\/code>, <code>title<\/code>, <code>status<\/code>, <code>detail<\/code>, <code>instance<\/code>, plus extensions) and <code>ErrorResponse<\/code>, producing <code>application/problem+json<\/code>. Enable Spring&#x27;s built-in mapping with <code>spring.mvc.problemdetails.enabled=true<\/code>.<\/p><p>Adopting it consistently means more than turning it on:<\/p><ul><li>Extend <code>ResponseEntityExceptionHandler<\/code> so framework exceptions and your domain exceptions produce the same shape.<\/li><li>Define a stable <code>type<\/code> URI per error class - this is the machine-readable contract, so it must be documented and versioned, not a random URL.<\/li><li>Add extensions for what clients actually need: a correlation ID, field-level violations, and a retry hint.<\/li><li><strong>Never<\/strong> put internal details in <code>detail<\/code> - it goes to the client. Log the stack trace with the correlation ID and return only what is safe.<\/li><\/ul><p>The value is that every service and every client handles errors identically, which matters far more in a 40-service estate than in one application.<\/p>", "source": "answers.md", "search": "problemdetail and rfc 9457 support in spring 6 - how do you adopt it consistently across a service? spring 6 added problemdetail (type, title, status, detail, instance, plus extensions) and errorresponse, producing application/problem+json. enable spring's built-in mapping with spring.mvc.problemdetails.enabled=true. adopting it consistently means more than turning it on: - extend responseentityexceptionhandler so framework exceptions and your domain exceptions produce the same shape. - define a stable type uri per error class - this is the machine-readable contract, so it must be documented and versioned, not a random url. - add extensions for what clients actually need: a correlation id, field-level violations, and a retry hint. - never put internal details in detail - it goes to the client. log the stack trace with the correlation id and return only what is safe. the value is that every service and every client handles errors identically, which matters far more in a 40-service estate than in one application."}, {"n": 91, "category": 5, "difficulty": "T", "html": "Why does an exception thrown inside a <code>Filter<\/code> bypass <code>@ControllerAdvice<\/code>, and how do you handle it?", "answerTitle": "Exceptions in filters", "answer": "<p><code>@ControllerAdvice<\/code> is invoked by <code>ExceptionHandlerExceptionResolver<\/code> <strong>inside<\/strong> <code>DispatcherServlet<\/code>. A filter that throws does so before or after the dispatcher, so the exception propagates to the servlet container, which performs an error dispatch to the configured error page - in Boot, <code>/error<\/code>, handled by <code>BasicErrorController<\/code>. The result is Boot&#x27;s generic error body rather than your <code>ProblemDetail<\/code>, which is why &quot;our error format is consistent&quot; quietly stops being true for authentication failures.<\/p><p>Handling it: catch inside the filter and write the response yourself using the same <code>ProblemDetail<\/code> serialization; or, for Spring Security specifically, configure <code>authenticationEntryPoint<\/code> and <code>accessDeniedHandler<\/code> in the DSL, which is the supported hook for 401 and 403 bodies. For a truly uniform format I also customize <code>ErrorAttributes<\/code> or replace <code>BasicErrorController<\/code>, so even container-level errors match.<\/p>", "source": "answers.md", "search": "why does an exception thrown inside a filter bypass @controlleradvice, and how do you handle it? @controlleradvice is invoked by exceptionhandlerexceptionresolver inside dispatcherservlet. a filter that throws does so before or after the dispatcher, so the exception propagates to the servlet container, which performs an error dispatch to the configured error page - in boot, /error, handled by basicerrorcontroller. the result is boot's generic error body rather than your problemdetail, which is why \"our error format is consistent\" quietly stops being true for authentication failures. handling it: catch inside the filter and write the response yourself using the same problemdetail serialization; or, for spring security specifically, configure authenticationentrypoint and accessdeniedhandler in the dsl, which is the supported hook for 401 and 403 bodies. for a truly uniform format i also customize errorattributes or replace basicerrorcontroller, so even container-level errors match."}, {"n": 92, "category": 5, "difficulty": "D", "html": "<code>@Valid<\/code> versus <code>@Validated<\/code>, validation groups, and the difference between <code>MethodArgumentNotValidException<\/code> and <code>ConstraintViolationException<\/code>.", "answerTitle": "Validation exceptions", "answer": "<ul><li><code>@Valid<\/code> / <code>@Validated<\/code> on an <code>@RequestBody<\/code> parameter → <code>MethodArgumentNotValidException<\/code> (a <code>BindException<\/code> subclass) → handled by <code>ResponseEntityExceptionHandler<\/code> → 400.<\/li><li>Constraints directly on controller method parameters (<code>@RequestParam @Min(1) int page<\/code>) with <code>@Validated<\/code> on the class → <code>ConstraintViolationException<\/code> pre-6.1, or <code>HandlerMethodValidationException<\/code> in Spring 6.1+ → the older form is <strong>unhandled by default<\/strong>, giving a 500.<\/li><li><code>@Validated<\/code> on a service class → <code>ConstraintViolationException<\/code> → unhandled → 500.<\/li><\/ul><p>Groups let one object be validated differently per operation: <code>@Validated(OnCreate.class)<\/code> on the controller method, with <code>@Null(groups = OnCreate.class) @NotNull(groups = OnUpdate.class) Long id<\/code> on the DTO.<\/p><p>The practical takeaway is to add an explicit handler for <code>ConstraintViolationException<\/code> mapping it to 400 with field details, because the default behavior misrepresents a client error as a server error - which also skews your error-rate SLO.<\/p>", "source": "answers.md", "search": "@valid versus @validated, validation groups, and the difference between methodargumentnotvalidexception and constraintviolationexception. - @valid / @validated on an @requestbody parameter → methodargumentnotvalidexception (a bindexception subclass) → handled by responseentityexceptionhandler → 400. - constraints directly on controller method parameters (@requestparam @min(1) int page) with @validated on the class → constraintviolationexception pre-6.1, or handlermethodvalidationexception in spring 6.1+ → the older form is unhandled by default , giving a 500. - @validated on a service class → constraintviolationexception → unhandled → 500. groups let one object be validated differently per operation: @validated(oncreate.class) on the controller method, with @null(groups = oncreate.class) @notnull(groups = onupdate.class) long id on the dto. the practical takeaway is to add an explicit handler for constraintviolationexception mapping it to 400 with field details, because the default behavior misrepresents a client error as a server error - which also skews your error-rate slo."}, {"n": 93, "category": 5, "difficulty": "D", "html": "<code>WebMvcConfigurer<\/code> versus <code>@EnableWebMvc<\/code> - why does the latter disable Boot&#x27;s MVC auto-configuration?", "answerTitle": "`WebMvcConfigurer` versus `@EnableWebMvc`", "answer": "<p><code>WebMvcAutoConfiguration<\/code> is annotated <code>@ConditionalOnMissingBean(WebMvcConfigurationSupport.class)<\/code>. <code>@EnableWebMvc<\/code> imports <code>DelegatingWebMvcConfiguration<\/code>, which <strong>is<\/strong> a <code>WebMvcConfigurationSupport<\/code> - so adding it makes Boot&#x27;s entire MVC auto-configuration back off.<\/p><p>You lose: the configured message converters and Jackson setup, static resource handling, the error page mapping, content negotiation defaults, <code>WebMvcProperties<\/code> binding, and locale/formatter configuration. The symptom is usually &quot;my JSON dates changed&quot; or &quot;static resources 404&quot; immediately after someone added the annotation to enable one interceptor.<\/p><p>The correct approach in Boot is to implement <code>WebMvcConfigurer<\/code> <strong>without<\/strong> <code>@EnableWebMvc<\/code> - your callbacks are added to the auto-configured setup. Use <code>@EnableWebMvc<\/code> only when you deliberately want full manual control.<\/p>", "source": "answers.md", "search": "webmvcconfigurer versus @enablewebmvc - why does the latter disable boot's mvc auto-configuration? webmvcautoconfiguration is annotated @conditionalonmissingbean(webmvcconfigurationsupport.class). @enablewebmvc imports delegatingwebmvcconfiguration, which is a webmvcconfigurationsupport - so adding it makes boot's entire mvc auto-configuration back off. you lose: the configured message converters and jackson setup, static resource handling, the error page mapping, content negotiation defaults, webmvcproperties binding, and locale/formatter configuration. the symptom is usually \"my json dates changed\" or \"static resources 404\" immediately after someone added the annotation to enable one interceptor. the correct approach in boot is to implement webmvcconfigurer without @enablewebmvc - your callbacks are added to the auto-configured setup. use @enablewebmvc only when you deliberately want full manual control."}, {"n": 94, "category": 5, "difficulty": "D", "html": "Async MVC - <code>Callable<\/code>, <code>DeferredResult<\/code>, <code>WebAsyncTask<\/code> and <code>StreamingResponseBody<\/code>. Which thread serves which phase?", "answerTitle": "Async MVC", "answer": "<ul><li><strong><code>Callable&lt;T&gt;<\/code><\/strong> - the container thread returns immediately; the <code>Callable<\/code> runs on the configured <code>AsyncTaskExecutor<\/code>; the result triggers an async dispatch back onto a container thread to complete the response.<\/li><li><strong><code>DeferredResult&lt;T&gt;<\/code><\/strong> - no executor involved. You hold the object and complete it from any thread later (a message arrival, a callback, another service&#x27;s response). This is the right tool for long-polling and for bridging a callback API.<\/li><li><strong><code>WebAsyncTask&lt;T&gt;<\/code><\/strong> - a <code>Callable<\/code> plus a per-request timeout and executor.<\/li><li><strong><code>StreamingResponseBody<\/code><\/strong> - write directly to the <code>OutputStream<\/code> on an async thread; for large downloads without buffering.<\/li><li><strong><code>SseEmitter<\/code><\/strong> - a specialized long-lived response for server-sent events.<\/li><\/ul><p>The key insight is that the servlet container thread is released during the async phase and a <em>different<\/em> container thread performs the final dispatch. That is what makes context propagation (Q95) an issue.<\/p>", "source": "answers.md", "search": "async mvc - callable, deferredresult, webasynctask and streamingresponsebody. which thread serves which phase? - callable<t - the container thread returns immediately; the callable runs on the configured asynctaskexecutor; the result triggers an async dispatch back onto a container thread to complete the response. - deferredresult<t - no executor involved. you hold the object and complete it from any thread later (a message arrival, a callback, another service's response). this is the right tool for long-polling and for bridging a callback api. - webasynctask<t - a callable plus a per-request timeout and executor. - streamingresponsebody - write directly to the outputstream on an async thread; for large downloads without buffering. - sseemitter - a specialized long-lived response for server-sent events. the key insight is that the servlet container thread is released during the async phase and a different container thread performs the final dispatch. that is what makes context propagation (q95) an issue."}, {"n": 95, "category": 5, "difficulty": "T", "html": "During async MVC dispatch, what happens to the <code>SecurityContext<\/code>, the MDC and request-scoped beans?", "answerTitle": "Context during async dispatch", "answer": "<ul><li><strong><code>SecurityContext<\/code><\/strong> - propagated, because <code>WebAsyncManagerIntegrationFilter<\/code> registers a <code>SecurityContextCallableProcessingInterceptor<\/code>. This works for <code>Callable<\/code> and <code>WebAsyncTask<\/code>; for a thread <em>you<\/em> spawn or a <code>DeferredResult<\/code> completed from your own executor, it is not.<\/li><li><strong>MDC<\/strong> - <strong>not<\/strong> propagated. Logging on the async thread loses the correlation ID unless you copy the MDC yourself, typically with a <code>TaskDecorator<\/code> on the async executor.<\/li><li><strong>Request-scoped beans<\/strong> - the request stays open through the async phase, so they remain available on the dispatch thread, but on an arbitrary executor thread there is no bound request and access throws (Q24) unless <code>RequestContextHolder<\/code> is propagated.<\/li><li><strong>Micrometer observation / trace context<\/strong> - needs the context-propagation library and a decorator.<\/li><\/ul><p>So my standard setup is a single <code>TaskDecorator<\/code> that copies security context, MDC and the observation scope, applied to every executor in the application - and a test that asserts a correlation ID appears in a log line written from an async path.<\/p>", "source": "answers.md", "search": "during async mvc dispatch, what happens to the securitycontext, the mdc and request-scoped beans? - securitycontext - propagated, because webasyncmanagerintegrationfilter registers a securitycontextcallableprocessinginterceptor. this works for callable and webasynctask; for a thread you spawn or a deferredresult completed from your own executor, it is not. - mdc - not propagated. logging on the async thread loses the correlation id unless you copy the mdc yourself, typically with a taskdecorator on the async executor. - request-scoped beans - the request stays open through the async phase, so they remain available on the dispatch thread, but on an arbitrary executor thread there is no bound request and access throws (q24) unless requestcontextholder is propagated. - micrometer observation / trace context - needs the context-propagation library and a decorator. so my standard setup is a single taskdecorator that copies security context, mdc and the observation scope, applied to every executor in the application - and a test that asserts a correlation id appears in a log line written from an async path."}, {"n": 96, "category": 5, "difficulty": "D", "html": "<code>SseEmitter<\/code> - timeouts, error handling, and how you capacity-plan for open connections.", "answerTitle": "`SseEmitter`", "answer": "<p>Construct with an explicit timeout (<code>new SseEmitter(TIMEOUT)<\/code>) rather than relying on <code>spring.mvc.async.request-timeout<\/code>; on timeout the emitter completes and <code>onTimeout<\/code> fires. Always register <code>onCompletion<\/code>, <code>onTimeout<\/code> and <code>onError<\/code> callbacks to remove the emitter from whatever registry holds it, or you leak emitters for disconnected clients - the most common SSE bug.<\/p><p>Sending to a dead client throws on the <em>next<\/em> send, which is how you detect disconnection; there is no push notification of it.<\/p><p>Capacity planning is by <strong>concurrent open connections<\/strong>, not requests per second: each emitter holds a socket, and with a servlet container each also holds an async context. Virtual threads help, but the socket and the per-connection memory remain. Also disable response buffering in every intermediary or the client sees nothing until completion (Nginx <code>proxy_buffering off<\/code>, <code>X-Accel-Buffering: no<\/code>, and an ALB idle timeout longer than the emitter timeout).<\/p>", "source": "answers.md", "search": "sseemitter - timeouts, error handling, and how you capacity-plan for open connections. construct with an explicit timeout (new sseemitter(timeout)) rather than relying on spring.mvc.async.request-timeout; on timeout the emitter completes and ontimeout fires. always register oncompletion, ontimeout and onerror callbacks to remove the emitter from whatever registry holds it, or you leak emitters for disconnected clients - the most common sse bug. sending to a dead client throws on the next send, which is how you detect disconnection; there is no push notification of it. capacity planning is by concurrent open connections , not requests per second: each emitter holds a socket, and with a servlet container each also holds an async context. virtual threads help, but the socket and the per-connection memory remain. also disable response buffering in every intermediary or the client sees nothing until completion (nginx proxy_buffering off, x-accel-buffering: no, and an alb idle timeout longer than the emitter timeout)."}, {"n": 97, "category": 5, "difficulty": "D", "html": "<code>RestClient<\/code> versus <code>WebClient<\/code> versus <code>RestTemplate<\/code> in Spring 6.1, and declarative <code>@HttpExchange<\/code> clients.", "answerTitle": "HTTP clients in Spring 6.1+", "answer": "<ul><li><strong><code>RestClient<\/code><\/strong> (Spring 6.1) - the modern synchronous client with WebClient&#x27;s fluent API. My default for blocking code.<\/li><li><strong><code>WebClient<\/code><\/strong> - reactive and non-blocking; still the right choice in WebFlux or for streaming.<\/li><li><strong><code>RestTemplate<\/code><\/strong> - maintenance mode; still supported, still everywhere in legacy code, no new features.<\/li><li><strong><code>@HttpExchange<\/code><\/strong> declarative interfaces - define the contract as an interface and let Spring generate the implementation over any of the above:<\/li><\/ul><pre><code class=\"lang-java\">@HttpExchange(&quot;/customers&quot;)\ninterface CustomerClient {\n    @GetExchange(&quot;/{id}&quot;) Customer byId(@PathVariable String id);\n}<\/code><\/pre><p>This is my preferred shape: the contract is a type, it is trivially mockable in tests, and the transport is configured once.<\/p><p>Whatever the choice, the things that actually matter are the same: explicit connect and read timeouts, a bounded connection pool, retry with backoff and jitter, a circuit breaker, and propagation of the trace context.<\/p>", "source": "answers.md", "search": "restclient versus webclient versus resttemplate in spring 6.1, and declarative @httpexchange clients. - restclient (spring 6.1) - the modern synchronous client with webclient's fluent api. my default for blocking code. - webclient - reactive and non-blocking; still the right choice in webflux or for streaming. - resttemplate - maintenance mode; still supported, still everywhere in legacy code, no new features. - @httpexchange declarative interfaces - define the contract as an interface and let spring generate the implementation over any of the above: java @httpexchange(\"/customers\") interface customerclient { @getexchange(\"/{id}\") customer byid(@pathvariable string id); } this is my preferred shape: the contract is a type, it is trivially mockable in tests, and the transport is configured once. whatever the choice, the things that actually matter are the same: explicit connect and read timeouts, a bounded connection pool, retry with backoff and jitter, a circuit breaker, and propagation of the trace context."}, {"n": 98, "category": 5, "difficulty": "D", "html": "HTTP caching - <code>ETag<\/code>, <code>ShallowEtagHeaderFilter<\/code> and <code>Cache-Control<\/code>. What does the shallow filter save and what does it not?", "answerTitle": "HTTP caching", "answer": "<p><code>ETag<\/code> lets a client revalidate with <code>If-None-Match<\/code> and receive a 304 with no body. <code>ShallowEtagHeaderFilter<\/code> computes an MD5 over the <strong>already-rendered<\/strong> response, so it saves <em>bandwidth<\/em> but not server work - the controller ran, the database was queried, the JSON was serialized. It also buffers the whole response in memory, which is harmful for large or streaming responses.<\/p><p>Real savings need a &quot;deep&quot; ETag: derive a version from data you can obtain cheaply - an entity <code>@Version<\/code>, a <code>last_modified<\/code> column, or a content hash stored alongside - and use <code>ServletWebRequest.checkNotModified(version)<\/code> early in the controller, returning before doing the expensive work.<\/p><p>For <code>Cache-Control<\/code>, the useful defaults are <code>no-store<\/code> for anything user-specific, <code>max-age<\/code> plus <code>private<\/code> for personalized-but-cacheable data, and <code>public, max-age, stale-while-revalidate<\/code> for shared reference data at the CDN.<\/p>", "source": "answers.md", "search": "http caching - etag, shallowetagheaderfilter and cache-control. what does the shallow filter save and what does it not? etag lets a client revalidate with if-none-match and receive a 304 with no body. shallowetagheaderfilter computes an md5 over the already-rendered response, so it saves bandwidth but not server work - the controller ran, the database was queried, the json was serialized. it also buffers the whole response in memory, which is harmful for large or streaming responses. real savings need a \"deep\" etag: derive a version from data you can obtain cheaply - an entity @version, a last_modified column, or a content hash stored alongside - and use servletwebrequest.checknotmodified(version) early in the controller, returning before doing the expensive work. for cache-control, the useful defaults are no-store for anything user-specific, max-age plus private for personalized-but-cacheable data, and public, max-age, stale-while-revalidate for shared reference data at the cdn."}, {"n": 99, "category": 5, "difficulty": "D", "html": "Multipart handling, size limits, and streaming a large upload without buffering it in memory.", "answerTitle": "Multipart and large uploads", "answer": "<p>Limits are <code>spring.servlet.multipart.max-file-size<\/code> and <code>max-request-size<\/code>; exceeding them throws <code>MaxUploadSizeExceededException<\/code>, which you should handle explicitly to return a 413 rather than a 500. Set <code>file-size-threshold<\/code> so files above it spill to disk instead of the heap.<\/p><p>For genuinely large uploads, do not accept a <code>MultipartFile<\/code> at all - it materializes the file (memory or temp disk) before your method runs. Instead consume the raw stream (<code>request.getInputStream()<\/code>, or a <code>Part<\/code> obtained via the Servlet API) and pipe it straight to its destination, so memory stays constant regardless of file size.<\/p><p>The pattern I prefer for cloud deployments is to bypass the application entirely: issue a <strong>pre-signed S3 URL<\/strong> so the client uploads directly to storage and only notifies your service afterwards. It removes the bandwidth, the memory pressure, the timeout risk and the request-duration problem in one move.<\/p>", "source": "answers.md", "search": "multipart handling, size limits, and streaming a large upload without buffering it in memory. limits are spring.servlet.multipart.max-file-size and max-request-size; exceeding them throws maxuploadsizeexceededexception, which you should handle explicitly to return a 413 rather than a 500. set file-size-threshold so files above it spill to disk instead of the heap. for genuinely large uploads, do not accept a multipartfile at all - it materializes the file (memory or temp disk) before your method runs. instead consume the raw stream (request.getinputstream(), or a part obtained via the servlet api) and pipe it straight to its destination, so memory stays constant regardless of file size. the pattern i prefer for cloud deployments is to bypass the application entirely: issue a pre-signed s3 url so the client uploads directly to storage and only notifies your service afterwards. it removes the bandwidth, the memory pressure, the timeout risk and the request-duration problem in one move."}, {"n": 100, "category": 5, "difficulty": "D", "html": "How does a 404 for an unmapped URL differ from an exception thrown inside a handler, and how do you handle both consistently?", "answerTitle": "404 versus handler exceptions", "answer": "<p>An unmapped URL does not produce an exception by default - <code>DispatcherServlet<\/code> simply sends a 404 through the container, which error-dispatches to <code>/error<\/code> and <code>BasicErrorController<\/code>. Setting <code>spring.mvc.throw-exception-if-no-handler-found=true<\/code> (and, before Boot 3, disabling static resource mapping) makes it throw <code>NoHandlerFoundException<\/code> instead, which <code>@ControllerAdvice<\/code> can handle. In Boot 3 this is the default behavior for the API case.<\/p><p>An exception inside a handler goes through the <code>HandlerExceptionResolver<\/code> chain and reaches your <code>@ExceptionHandler<\/code>.<\/p><p>To make both consistent I do two things: enable the throw-on-no-handler behavior so 404s reach my advice, and customize <code>ErrorAttributes<\/code> (or replace <code>BasicErrorController<\/code>) so anything that still reaches <code>/error<\/code> - filter exceptions, container errors - is rendered as the same <code>ProblemDetail<\/code>. Otherwise a client sees three different error shapes from one service.<\/p>", "source": "answers.md", "search": "how does a 404 for an unmapped url differ from an exception thrown inside a handler, and how do you handle both consistently? an unmapped url does not produce an exception by default - dispatcherservlet simply sends a 404 through the container, which error-dispatches to /error and basicerrorcontroller. setting spring.mvc.throw-exception-if-no-handler-found=true (and, before boot 3, disabling static resource mapping) makes it throw nohandlerfoundexception instead, which @controlleradvice can handle. in boot 3 this is the default behavior for the api case. an exception inside a handler goes through the handlerexceptionresolver chain and reaches your @exceptionhandler. to make both consistent i do two things: enable the throw-on-no-handler behavior so 404s reach my advice, and customize errorattributes (or replace basicerrorcontroller) so anything that still reaches /error - filter exceptions, container errors - is rendered as the same problemdetail. otherwise a client sees three different error shapes from one service."}, {"n": 101, "category": 5, "difficulty": "T", "html": "Tomcat thread pool sizing versus virtual threads in Boot 3.2+ - what actually changes, and what stays exactly the same?", "answerTitle": "Tomcat threads versus virtual threads", "answer": "<p>With <code>spring.threads.virtual.enabled=true<\/code> on Boot 3.2+ and Java 21, Tomcat uses a virtual thread executor: each request gets its own virtual thread, blocking unmounts rather than occupying a platform thread, and <code>server.tomcat.threads.max<\/code> stops being the concurrency ceiling.<\/p><p>What <strong>changes<\/strong>: you can serve far more concurrent blocking requests with the same hardware; thread-pool tuning largely disappears; thread dumps look different and existing pool-saturation alerts stop firing.<\/p><p>What <strong>does not change<\/strong> - and this is the part interviewers are testing:<\/p><ul><li>The <strong>downstream<\/strong> is still finite. Removing your own bottleneck just moves the load to the database or the third-party API, so you now need an explicit <code>Semaphore<\/code>, bulkhead or connection-pool limit where the thread pool used to provide accidental backpressure.<\/li><li>Connection pools are still sized as before; more concurrent requests means more contention for the same 20 connections.<\/li><li>CPU-bound work still needs a bounded pool.<\/li><li><code>synchronized<\/code> blocks around blocking calls pin the carrier thread on older JDK baselines - use <code>ReentrantLock<\/code>.<\/li><li><code>ThreadLocal<\/code> still works but per-thread copies multiply at high concurrency.<\/li><\/ul><p>So the honest summary: virtual threads remove a limit, they do not add capacity, and the first thing to do after enabling them is to add the limit back where it belongs.<\/p>", "source": "answers.md", "search": "tomcat thread pool sizing versus virtual threads in boot 3.2+ - what actually changes, and what stays exactly the same? with spring.threads.virtual.enabled=true on boot 3.2+ and java 21, tomcat uses a virtual thread executor: each request gets its own virtual thread, blocking unmounts rather than occupying a platform thread, and server.tomcat.threads.max stops being the concurrency ceiling. what changes : you can serve far more concurrent blocking requests with the same hardware; thread-pool tuning largely disappears; thread dumps look different and existing pool-saturation alerts stop firing. what does not change - and this is the part interviewers are testing: - the downstream is still finite. removing your own bottleneck just moves the load to the database or the third-party api, so you now need an explicit semaphore, bulkhead or connection-pool limit where the thread pool used to provide accidental backpressure. - connection pools are still sized as before; more concurrent requests means more contention for the same 20 connections. - cpu-bound work still needs a bounded pool. - synchronized blocks around blocking calls pin the carrier thread on older jdk baselines - use reentrantlock. - threadlocal still works but per-thread copies multiply at high concurrency. so the honest summary: virtual threads remove a limit, they do not add capacity, and the first thing to do after enabling them is to add the limit back where it belongs."}, {"n": 102, "category": 5, "difficulty": "A", "html": "How do you version and evolve a REST API in Spring without forking controllers for every version?", "answerTitle": "API versioning in Spring", "answer": "<p>The mechanism is the easy part - URI path versioning (<code>/v1/orders<\/code>) is what I default to for public APIs because it is visible, cacheable and routable at the edge; header or media-type versioning is cleaner in theory and harder to test and route.<\/p><p>What actually keeps it maintainable is refusing to fork controllers. Concretely:<\/p><ul><li>Version only on <strong>breaking<\/strong> changes; make everything else additive and require clients to ignore unknown fields.<\/li><li>Keep <strong>one<\/strong> controller and one service; version the <strong>DTOs<\/strong> and map between them. A <code>V1OrderResponse<\/code> mapper over the current domain model is far cheaper to maintain than two controller trees that drift.<\/li><li>Where behavior genuinely differs, isolate it in a strategy selected by version, not duplicated through the stack.<\/li><li>Never let a version reach the domain layer - versions are a transport concern.<\/li><\/ul><p>Then the lifecycle: publish a deprecation policy, emit <code>Deprecation<\/code> and <code>Sunset<\/code> headers, instrument usage <strong>per version and per consumer<\/strong> so you know exactly who remains, contact them directly, and retire aggressively. Running more than two versions is what actually kills you, so the discipline is retirement, not clever routing.<\/p>", "source": "answers.md", "search": "how do you version and evolve a rest api in spring without forking controllers for every version? the mechanism is the easy part - uri path versioning (/v1/orders) is what i default to for public apis because it is visible, cacheable and routable at the edge; header or media-type versioning is cleaner in theory and harder to test and route. what actually keeps it maintainable is refusing to fork controllers. concretely: - version only on breaking changes; make everything else additive and require clients to ignore unknown fields. - keep one controller and one service; version the dtos and map between them. a v1orderresponse mapper over the current domain model is far cheaper to maintain than two controller trees that drift. - where behavior genuinely differs, isolate it in a strategy selected by version, not duplicated through the stack. - never let a version reach the domain layer - versions are a transport concern. then the lifecycle: publish a deprecation policy, emit deprecation and sunset headers, instrument usage per version and per consumer so you know exactly who remains, contact them directly, and retire aggressively. running more than two versions is what actually kills you, so the discipline is retirement, not clever routing."}, {"n": 103, "category": 6, "difficulty": "C", "html": "<code>Mono<\/code> and <code>Flux<\/code> - cold versus hot publishers, and what &quot;nothing happens until you subscribe&quot; means in practice.", "answerTitle": "Cold versus hot", "answer": "<p>A <strong>cold<\/strong> publisher generates its data per subscriber - each subscription to a <code>WebClient<\/code> <code>Mono<\/code> issues its own HTTP request. A <strong>hot<\/strong> publisher emits regardless of subscribers, and late subscribers miss earlier values (<code>Sinks.many().multicast()<\/code>, <code>share()<\/code>).<\/p><p>&quot;Nothing happens until you subscribe&quot; means the operator chain is only an assembly-time description; no work occurs until <code>subscribe()<\/code> walks it. Practically: returning the <code>Mono<\/code> from a controller means Spring subscribes; calling an operator chain and ignoring the result does nothing at all; and the same <code>Mono<\/code> subscribed twice performs the work twice, which is why <code>cache()<\/code> exists.<\/p>", "source": "answers.md", "search": "mono and flux - cold versus hot publishers, and what \"nothing happens until you subscribe\" means in practice. a cold publisher generates its data per subscriber - each subscription to a webclient mono issues its own http request. a hot publisher emits regardless of subscribers, and late subscribers miss earlier values (sinks.many().multicast(), share()). \"nothing happens until you subscribe\" means the operator chain is only an assembly-time description; no work occurs until subscribe() walks it. practically: returning the mono from a controller means spring subscribes; calling an operator chain and ignoring the result does nothing at all; and the same mono subscribed twice performs the work twice, which is why cache() exists."}, {"n": 104, "category": 6, "difficulty": "T", "html": "You call a <code>WebClient<\/code> method and never subscribe. What happens, and how do you catch this in review?", "answerTitle": "Forgetting to subscribe", "answer": "<p>Nothing happens. No request is sent, no exception is thrown, and no log line appears - the method returns and the chain is garbage collected. This is the single most common WebFlux bug, and it is silent, which is what makes it dangerous: a fire-and-forget audit call that was never made.<\/p><p>Catching it: the IDE and SpotBugs flag ignored return values of <code>@CheckReturnValue<\/code>-style types; a code review rule that every <code>Mono<\/code>/<code>Flux<\/code> must be returned, subscribed or explicitly <code>.subscribe()<\/code>d with a comment; and BlockHound-style enforcement will not help here, so it must be static analysis. In practice, requiring that reactive types are always <em>returned<\/em> up to the framework - never terminated inside a service - removes most of the risk.<\/p>", "source": "answers.md", "search": "you call a webclient method and never subscribe. what happens, and how do you catch this in review? nothing happens. no request is sent, no exception is thrown, and no log line appears - the method returns and the chain is garbage collected. this is the single most common webflux bug, and it is silent, which is what makes it dangerous: a fire-and-forget audit call that was never made. catching it: the ide and spotbugs flag ignored return values of @checkreturnvalue-style types; a code review rule that every mono/flux must be returned, subscribed or explicitly .subscribe()d with a comment; and blockhound-style enforcement will not help here, so it must be static analysis. in practice, requiring that reactive types are always returned up to the framework - never terminated inside a service - removes most of the risk."}, {"n": 105, "category": 6, "difficulty": "D", "html": "Backpressure - what <code>request(n)<\/code> means, and what <code>onBackpressureBuffer<\/code>, <code>Drop<\/code> and <code>Latest<\/code> each do.", "answerTitle": "Backpressure", "answer": "<p>The <code>Subscription<\/code> carries <code>request(n)<\/code>: the subscriber tells the publisher how many elements it can accept, so a fast producer cannot overwhelm a slow consumer. Operators propagate this upstream, which is why an unbounded source such as a network stream can be consumed safely.<\/p><p>When the source cannot be slowed - a hot sensor stream, a WebSocket - the strategies are: <code>onBackpressureBuffer<\/code> (buffer, with a bound and an overflow strategy, or you have moved the failure to an <code>OutOfMemoryError<\/code>), <code>onBackpressureDrop<\/code> (discard new items - right for live telemetry), <code>onBackpressureLatest<\/code> (keep only the newest - right for a UI showing current state), and <code>onBackpressureError<\/code> (fail fast).<\/p><p>The choice is a product decision, not a technical one: which data are you allowed to lose? That framing is what interviewers want.<\/p>", "source": "answers.md", "search": "backpressure - what request(n) means, and what onbackpressurebuffer, drop and latest each do. the subscription carries request(n): the subscriber tells the publisher how many elements it can accept, so a fast producer cannot overwhelm a slow consumer. operators propagate this upstream, which is why an unbounded source such as a network stream can be consumed safely. when the source cannot be slowed - a hot sensor stream, a websocket - the strategies are: onbackpressurebuffer (buffer, with a bound and an overflow strategy, or you have moved the failure to an outofmemoryerror), onbackpressuredrop (discard new items - right for live telemetry), onbackpressurelatest (keep only the newest - right for a ui showing current state), and onbackpressureerror (fail fast). the choice is a product decision, not a technical one: which data are you allowed to lose? that framing is what interviewers want."}, {"n": 106, "category": 6, "difficulty": "D", "html": "Schedulers - <code>parallel<\/code>, <code>boundedElastic<\/code>, <code>single<\/code>, <code>immediate<\/code>. What belongs on each?", "answerTitle": "Schedulers", "answer": "<ul><li><code>Schedulers.parallel()<\/code> - a fixed pool sized to CPU count, for <strong>CPU-bound<\/strong> work. Never block here.<\/li><li><code>Schedulers.boundedElastic()<\/code> - an elastic pool with a cap (10× CPUs by default) and a queue, explicitly intended for <strong>wrapping blocking calls<\/strong> you cannot avoid, such as JDBC or a legacy library.<\/li><li><code>Schedulers.single()<\/code> - one reusable thread, for work that must be serialized.<\/li><li><code>Schedulers.immediate()<\/code> - runs on the calling thread; a no-op scheduler used to opt out.<\/li><\/ul><p>The event loop threads (<code>reactor-http-nio-*<\/code>) belong to Netty and must never block. <code>boundedElastic<\/code> exists so that a necessary blocking call degrades throughput rather than deadlocking the loop - but it is a bridge, not a strategy: if most of your work is blocking, you have written a thread-per-request application with much worse ergonomics, and MVC on virtual threads is the better answer.<\/p>", "source": "answers.md", "search": "schedulers - parallel, boundedelastic, single, immediate. what belongs on each? - schedulers.parallel() - a fixed pool sized to cpu count, for cpu-bound work. never block here. - schedulers.boundedelastic() - an elastic pool with a cap (10× cpus by default) and a queue, explicitly intended for wrapping blocking calls you cannot avoid, such as jdbc or a legacy library. - schedulers.single() - one reusable thread, for work that must be serialized. - schedulers.immediate() - runs on the calling thread; a no-op scheduler used to opt out. the event loop threads (reactor-http-nio- ) belong to netty and must never block. boundedelastic exists so that a necessary blocking call degrades throughput rather than deadlocking the loop - but it is a bridge, not a strategy: if most of your work is blocking, you have written a thread-per-request application with much worse ergonomics, and mvc on virtual threads is the better answer."}, {"n": 107, "category": 6, "difficulty": "T", "html": "<code>publishOn<\/code> versus <code>subscribeOn<\/code> - where in the chain does each take effect?", "answerTitle": "`publishOn` versus `subscribeOn`", "answer": "<p><code>subscribeOn<\/code> affects the <strong>subscription and the source<\/strong>, and its position in the chain is irrelevant - the first one wins, and it determines where the data-producing work starts.<\/p><p><code>publishOn<\/code> affects everything <strong>downstream of it<\/strong>, switching the thread for subsequent operators. Multiple <code>publishOn<\/code> calls each take effect from their position.<\/p><pre><code class=\"lang-java\">Mono.fromCallable(this::blockingCall)   // runs on boundedElastic\n    .subscribeOn(Schedulers.boundedElastic())\n    .map(this::transform)               // still boundedElastic\n    .publishOn(Schedulers.parallel())\n    .map(this::cpuWork)                 // now parallel<\/code><\/pre><p>The rule I state: <code>subscribeOn<\/code> for where the work <em>starts<\/em>, <code>publishOn<\/code> for where the work <em>continues<\/em>. Most confusion comes from expecting <code>subscribeOn<\/code> to behave positionally.<\/p>", "source": "answers.md", "search": "publishon versus subscribeon - where in the chain does each take effect? subscribeon affects the subscription and the source , and its position in the chain is irrelevant - the first one wins, and it determines where the data-producing work starts. publishon affects everything downstream of it , switching the thread for subsequent operators. multiple publishon calls each take effect from their position. java mono.fromcallable(this::blockingcall) // runs on boundedelastic .subscribeon(schedulers.boundedelastic()) .map(this::transform) // still boundedelastic .publishon(schedulers.parallel()) .map(this::cpuwork) // now parallel the rule i state: subscribeon for where the work starts , publishon for where the work continues . most confusion comes from expecting subscribeon to behave positionally."}, {"n": 108, "category": 6, "difficulty": "T", "html": "One blocking call inside a WebFlux handler - describe exactly what happens and how you detect it in CI.", "answerTitle": "One blocking call in WebFlux", "answer": "<p>The Netty event loop has one thread per core (typically 2-8 for the whole application). A blocking call occupies one of them for its duration, so with four loop threads, four concurrent slow calls stall <strong>every request in the application<\/strong>, including health checks and requests that never touch that code. Throughput collapses to a level far worse than a thread-per-request server, because there is no pool to absorb it.<\/p><p>Detection in CI is the actionable part: <strong>BlockHound<\/strong> instruments the JVM to throw when a blocking call happens on a non-blocking thread. Add it as a test dependency and install it in the test bootstrap, and a blocking JDBC call in a reactive path fai
