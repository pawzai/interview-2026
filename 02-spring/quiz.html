. - oauth2resourceserver - my api validates incoming tokens. this is what a backend service almost always needs. - oauth2login - my application authenticates users via an external idp, receiving an id token and establishing a session. this is a server-rendered web application acting as an oidc relying party. - oauth2client - my application obtains tokens to call other apis , either on a user's behalf (authorization code) or as itself (client credentials). they are independent and often combined: a bff uses oauth2login for the user session and oauth2client to call downstream apis; a pure api uses only oauth2resourceserver. candidates frequently conflate oauth2login and oauth2resourceserver and try to configure both for a stateless api, which produces confusing redirect-to-login behavior on a json endpoint. naming the three roles cleanly is a quick credibility signal."}, {"n": 174, "category": 9, "difficulty": "D", "html": "Spring Authorization Server - when do you run your own rather than using Keycloak, Cognito or Okta?", "answerTitle": "Running Spring Authorization Server", "answer": "<p>Use a managed IdP (Keycloak, Cognito, Okta, Entra) by default. They provide user management, MFA, federation, social login, admin UIs, password policies, account recovery, compliance certifications and a security team - all of which you would otherwise build and maintain.<\/p><p>I would run Spring Authorization Server when: the authorization server must be deeply embedded in the product&#x27;s domain model (issuing tokens with complex, application-specific claims computed from your data); there is a hard data-residency or air-gap requirement; the licensing cost of a commercial IdP at your user count is prohibitive; or you need a lightweight, purpose-built issuer for internal service-to-service tokens only, with no human users.<\/p><p>The point to make explicitly: it is a <strong>framework for building an authorization server<\/strong>, not a product. It has no user store, no admin console, no MFA and no account recovery - you build those. That is a multi-year ownership commitment for a security-critical component, and it should be a deliberate decision, not a default.<\/p>", "source": "answers.md", "search": "spring authorization server - when do you run your own rather than using keycloak, cognito or okta? use a managed idp (keycloak, cognito, okta, entra) by default. they provide user management, mfa, federation, social login, admin uis, password policies, account recovery, compliance certifications and a security team - all of which you would otherwise build and maintain. i would run spring authorization server when: the authorization server must be deeply embedded in the product's domain model (issuing tokens with complex, application-specific claims computed from your data); there is a hard data-residency or air-gap requirement; the licensing cost of a commercial idp at your user count is prohibitive; or you need a lightweight, purpose-built issuer for internal service-to-service tokens only, with no human users. the point to make explicitly: it is a framework for building an authorization server , not a product. it has no user store, no admin console, no mfa and no account recovery - you build those. that is a multi-year ownership commitment for a security-critical component, and it should be a deliberate decision, not a default."}, {"n": 175, "category": 9, "difficulty": "D", "html": "JWKS and key rotation - what is cached, for how long, and what happens during a rotation?", "answerTitle": "JWKS and key rotation", "answer": "<p><code>NimbusJwtDecoder<\/code> fetches the JWKS from <code>jwk-set-uri<\/code> and caches it (5 minutes by default, with the cache keyed by key ID). When a token arrives with an unknown <code>kid<\/code>, the decoder refreshes the JWKS, which is what makes rotation transparent.<\/p><p>A correct rotation publishes the new key <strong>before<\/strong> signing with it, so validators can fetch it in advance, and keeps the old key published until every token signed with it has expired. If an IdP rotates and removes in one step, every in-flight token fails validation - a brief total outage.<\/p><p>Operational concerns: the JWKS endpoint becomes a runtime dependency, so cache it and make failure graceful rather than fatal; a JWKS refresh storm across many instances after a rotation can rate-limit you at the IdP; and clock skew between issuer and validator causes spurious <code>exp<\/code>/<code>nbf<\/code> failures, so allow a small skew and keep NTP working.<\/p>", "source": "answers.md", "search": "jwks and key rotation - what is cached, for how long, and what happens during a rotation? nimbusjwtdecoder fetches the jwks from jwk-set-uri and caches it (5 minutes by default, with the cache keyed by key id). when a token arrives with an unknown kid, the decoder refreshes the jwks, which is what makes rotation transparent. a correct rotation publishes the new key before signing with it, so validators can fetch it in advance, and keeps the old key published until every token signed with it has expired. if an idp rotates and removes in one step, every in-flight token fails validation - a brief total outage. operational concerns: the jwks endpoint becomes a runtime dependency, so cache it and make failure graceful rather than fatal; a jwks refresh storm across many instances after a rotation can rate-limit you at the idp; and clock skew between issuer and validator causes spurious exp/nbf failures, so allow a small skew and keep ntp working."}, {"n": 176, "category": 9, "difficulty": "D", "html": "Customizing token claims in Spring Authorization Server, and why you keep tokens small.", "answerTitle": "Customizing tokens", "answer": "<pre><code class=\"lang-java\">@Bean OAuth2TokenCustomizer&lt;JwtEncodingContext&gt; tokenCustomizer() {\n    return context -&gt; {\n        if (context.getTokenType() == OAuth2TokenType.ACCESS_TOKEN) {\n            context.getClaims().claim(&quot;tenant&quot;, lookupTenant(context.getPrincipal()));\n        }\n    };\n}<\/code><\/pre><p>Keep tokens <strong>small<\/strong>, and be able to say why: they are sent on every request, so size is latency and bandwidth on the hot path; they often live in headers with proxy size limits (8KB is a common ceiling, and exceeding it produces a confusing 431 or a silently dropped header); and every claim is readable by anyone holding the token, so a claim is a disclosure decision.<\/p><p>The specific anti-pattern is putting a user&#x27;s full permission list in the token. It grows unboundedly, it goes stale the moment permissions change, and it leaks your authorization model to the client. Put a stable identity and a tenant in the token, and resolve fine-grained permissions server-side where they can be current.<\/p>", "source": "answers.md", "search": "customizing token claims in spring authorization server, and why you keep tokens small. java @bean oauth2tokencustomizer<jwtencodingcontext tokencustomizer() { return context - { if (context.gettokentype() == oauth2tokentype.access_token) { context.getclaims().claim(\"tenant\", lookuptenant(context.getprincipal())); } }; } keep tokens small , and be able to say why: they are sent on every request, so size is latency and bandwidth on the hot path; they often live in headers with proxy size limits (8kb is a common ceiling, and exceeding it produces a confusing 431 or a silently dropped header); and every claim is readable by anyone holding the token, so a claim is a disclosure decision. the specific anti-pattern is putting a user's full permission list in the token. it grows unboundedly, it goes stale the moment permissions change, and it leaks your authorization model to the client. put a stable identity and a tenant in the token, and resolve fine-grained permissions server-side where they can be current."}, {"n": 177, "category": 9, "difficulty": "T", "html": "Refresh token rotation and reuse detection - what does the framework give you, and what must you implement?", "answerTitle": "Refresh token rotation", "answer": "<p>Spring Authorization Server rotates refresh tokens by default - each use issues a new refresh token and invalidates the previous one (configurable with <code>reuseRefreshTokens(false)<\/code>).<\/p><p>What it does <strong>not<\/strong> give you is <strong>reuse detection with family revocation<\/strong>, which is the part that actually provides security. Rotation alone means a stolen token works until the legitimate client next refreshes; detection means that when an <em>already-used<\/em> token is presented, you conclude the family has leaked and revoke the entire chain, forcing re-authentication.<\/p><p>Implementing it requires tracking a token family identifier and the used-token history, and deciding the response: revoke the family, log a security event, and ideally notify the user. You also have to handle the benign false positive - a client that retried a refresh after a network timeout legitimately presents the same token twice - usually with a short grace window where the immediately-previous token is accepted once.<\/p><p>Naming both the gap and the false-positive handling is what separates a real implementation from a documentation summary.<\/p>", "source": "answers.md", "search": "refresh token rotation and reuse detection - what does the framework give you, and what must you implement? spring authorization server rotates refresh tokens by default - each use issues a new refresh token and invalidates the previous one (configurable with reuserefreshtokens(false)). what it does not give you is reuse detection with family revocation , which is the part that actually provides security. rotation alone means a stolen token works until the legitimate client next refreshes; detection means that when an already-used token is presented, you conclude the family has leaked and revoke the entire chain, forcing re-authentication. implementing it requires tracking a token family identifier and the used-token history, and deciding the response: revoke the family, log a security event, and ideally notify the user. you also have to handle the benign false positive - a client that retried a refresh after a network timeout legitimately presents the same token twice - usually with a short grace window where the immediately-previous token is accepted once. naming both the gap and the false-positive handling is what separates a real implementation from a documentation summary."}, {"n": 178, "category": 9, "difficulty": "D", "html": "A multi-tenant resource server accepting tokens from several issuers - <code>JwtIssuerAuthenticationManagerResolver<\/code>.", "answerTitle": "Multi-issuer resource server", "answer": "<pre><code class=\"lang-java\">@Bean JwtIssuerAuthenticationManagerResolver resolver() {\n    return JwtIssuerAuthenticationManagerResolver.fromTrustedIssuers(\n        &quot;https://idp.example.com/realms/tenant-a&quot;,\n        &quot;https://idp.example.com/realms/tenant-b&quot;);\n}\nhttp.oauth2ResourceServer(o -&gt; o.authenticationManagerResolver(resolver));<\/code><\/pre><p>It reads the <code>iss<\/code> claim (without validating the signature yet), selects or lazily builds the <code>AuthenticationManager<\/code> for that issuer, and delegates. Each issuer gets its own decoder and JWKS cache.<\/p><p>The critical constraint is the <strong>trusted issuer list<\/strong>. A resolver that accepts any issuer from the token and fetches its JWKS is a complete authentication bypass - an attacker stands up their own IdP, signs a token claiming to be an admin, and your service dutifully fetches their public key and validates it. The trusted list must be explicit and configured, never derived from the token.<\/p><p>For tenant-per-issuer setups, also map the issuer to a tenant identity in the authentication and enforce it in the data layer, so a valid token for tenant A cannot read tenant B&#x27;s data.<\/p>", "source": "answers.md", "search": "a multi-tenant resource server accepting tokens from several issuers - jwtissuerauthenticationmanagerresolver. java @bean jwtissuerauthenticationmanagerresolver resolver() { return jwtissuerauthenticationmanagerresolver.fromtrustedissuers( \"https://idp.example.com/realms/tenant-a\", \"https://idp.example.com/realms/tenant-b\"); } http.oauth2resourceserver(o - o.authenticationmanagerresolver(resolver)); it reads the iss claim (without validating the signature yet), selects or lazily builds the authenticationmanager for that issuer, and delegates. each issuer gets its own decoder and jwks cache. the critical constraint is the trusted issuer list . a resolver that accepts any issuer from the token and fetches its jwks is a complete authentication bypass - an attacker stands up their own idp, signs a token claiming to be an admin, and your service dutifully fetches their public key and validates it. the trusted list must be explicit and configured, never derived from the token. for tenant-per-issuer setups, also map the issuer to a tenant identity in the authentication and enforce it in the data layer, so a valid token for tenant a cannot read tenant b's data."}, {"n": 179, "category": 9, "difficulty": "D", "html": "OIDC logout - <code>OidcClientInitiatedLogoutSuccessHandler<\/code>, and what back-channel logout solves.", "answerTitle": "OIDC logout", "answer": "<p>Local logout clears your session; it does <strong>not<\/strong> end the session at the IdP, so the next login silently succeeds without prompting and the user believes they logged out when they did not. That is the gap.<\/p><p><code>OidcClientInitiatedLogoutSuccessHandler<\/code> redirects to the IdP&#x27;s <code>end_session_endpoint<\/code> with the <code>id_token_hint<\/code> and a <code>post_logout_redirect_uri<\/code>, ending both sessions:<\/p><pre><code class=\"lang-java\">var handler = new OidcClientInitiatedLogoutSuccessHandler(clientRegistrationRepository);\nhandler.setPostLogoutRedirectUri(&quot;{baseUrl}/logged-out&quot;);\nhttp.logout(l -&gt; l.logoutSuccessHandler(handler));<\/code><\/pre><p><strong>Back-channel logout<\/strong> solves the other direction: the user logs out at the IdP (or an admin terminates the session) and the IdP calls each relying party&#x27;s logout endpoint directly, so applications can invalidate their sessions without the user&#x27;s browser being involved. Spring Security supports it via <code>oidcLogout()<\/code> with a session registry. It matters in an SSO estate where &quot;log out everywhere&quot; is a real requirement - and it needs a shared session store to work across instances.<\/p>", "source": "answers.md", "search": "oidc logout - oidcclientinitiatedlogoutsuccesshandler, and what back-channel logout solves. local logout clears your session; it does not end the session at the idp, so the next login silently succeeds without prompting and the user believes they logged out when they did not. that is the gap. oidcclientinitiatedlogoutsuccesshandler redirects to the idp's end_session_endpoint with the id_token_hint and a post_logout_redirect_uri, ending both sessions: java var handler = new oidcclientinitiatedlogoutsuccesshandler(clientregistrationrepository); handler.setpostlogoutredirecturi(\"{baseurl}/logged-out\"); http.logout(l - l.logoutsuccesshandler(handler)); back-channel logout solves the other direction: the user logs out at the idp (or an admin terminates the session) and the idp calls each relying party's logout endpoint directly, so applications can invalidate their sessions without the user's browser being involved. spring security supports it via oidclogout() with a session registry. it matters in an sso estate where \"log out everywhere\" is a real requirement - and it needs a shared session store to work across instances."}, {"n": 180, "category": 9, "difficulty": "D", "html": "Propagating the authenticated principal across async, reactive and messaging boundaries.", "answerTitle": "Propagating the principal", "answer": "<ul><li><strong>Synchronous HTTP<\/strong> - the exchange filter function attaches the token automatically (Q171), or you propagate the incoming one for relay.<\/li><li><strong><code>@Async<\/code> / executors<\/strong> - a <code>TaskDecorator<\/code> copying the <code>SecurityContext<\/code> (Q152).<\/li><li><strong>Reactive<\/strong> - the Reactor <code>Context<\/code> via <code>ReactiveSecurityContextHolder<\/code> (Q118).<\/li><li><strong>Messaging<\/strong> - there is no ambient context, so the identity must be carried <strong>in the message<\/strong>. Put a signed token or a verifiable claim in a header, or - better for durability - record the acting principal as part of the message payload, because a token will have expired by the time a delayed or replayed message is processed.<\/li><\/ul><p>That last point is the one worth emphasizing: propagating a <em>token<\/em> into a queue is a common mistake, because tokens are short-lived and messages are not. For asynchronous work, record <strong>who requested it<\/strong> as data and re-derive authority at processing time, or execute as an explicit system principal with the original requester recorded for audit.<\/p>", "source": "answers.md", "search": "propagating the authenticated principal across async, reactive and messaging boundaries. - synchronous http - the exchange filter function attaches the token automatically (q171), or you propagate the incoming one for relay. - @async / executors - a taskdecorator copying the securitycontext (q152). - reactive - the reactor context via reactivesecuritycontextholder (q118). - messaging - there is no ambient context, so the identity must be carried in the message . put a signed token or a verifiable claim in a header, or - better for durability - record the acting principal as part of the message payload, because a token will have expired by the time a delayed or replayed message is processed. that last point is the one worth emphasizing: propagating a token into a queue is a common mistake, because tokens are short-lived and messages are not. for asynchronous work, record who requested it as data and re-derive authority at processing time, or execute as an explicit system principal with the original requester recorded for audit."}, {"n": 181, "category": 9, "difficulty": "T", "html": "A token works in Postman but the service returns 401 with no useful detail. How do you diagnose it?", "answerTitle": "Token works in Postman, fails in the service", "answer": "<p>Diagnose in this order, because the causes are ranked by frequency:<\/p><ol><li><strong>Audience.<\/strong> Postman does not validate <code>aud<\/code>; your service does (if configured). Decode the token at jwt.io and compare <code>aud<\/code> with what the service expects.<\/li><li><strong>Issuer mismatch.<\/strong> A trailing slash difference between the <code>iss<\/code> claim and <code>issuer-uri<\/code> fails an exact string comparison. This one wastes hours.<\/li><li><strong>Authority mapping<\/strong> (Q169). Authentication succeeded and <em>authorization<\/em> failed - a 403, not a 401, though a misconfigured entry point can render it as 401.<\/li><li><strong>Clock skew.<\/strong> The service&#x27;s clock is ahead, so a fresh token is <code>nbf<\/code>-invalid.<\/li><li><strong>The token is not reaching the service<\/strong> - a gateway stripping the <code>Authorization<\/code> header, or a proxy dropping it on redirect.<\/li><li><strong>Scope or resource<\/strong> - the token was issued for a different resource server.<\/li><\/ol><p>To stop it being guesswork, log the specific failure: <code>OAuth2AuthenticationException<\/code> carries an <code>OAuth2Error<\/code> with a description, and returning it in the <code>WWW-Authenticate<\/code> header (as the spec intends) tells the caller <em>why<\/em> without leaking anything sensitive. Set <code>logging.level.org.springframework.security=DEBUG<\/code> in a non-production environment and the decoder tells you exactly which validator rejected it.<\/p>", "source": "answers.md", "search": "a token works in postman but the service returns 401 with no useful detail. how do you diagnose it? diagnose in this order, because the causes are ranked by frequency: 1. audience. postman does not validate aud; your service does (if configured). decode the token at jwt.io and compare aud with what the service expects. 2. issuer mismatch. a trailing slash difference between the iss claim and issuer-uri fails an exact string comparison. this one wastes hours. 3. authority mapping (q169). authentication succeeded and authorization failed - a 403, not a 401, though a misconfigured entry point can render it as 401. 4. clock skew. the service's clock is ahead, so a fresh token is nbf-invalid. 5. the token is not reaching the service - a gateway stripping the authorization header, or a proxy dropping it on redirect. 6. scope or resource - the token was issued for a different resource server. to stop it being guesswork, log the specific failure: oauth2authenticationexception carries an oauth2error with a description, and returning it in the www-authenticate header (as the spec intends) tells the caller why without leaking anything sensitive. set logging.level.org.springframework.security=debug in a non-production environment and the decoder tells you exactly which validator rejected it."}, {"n": 182, "category": 9, "difficulty": "A", "html": "Design authentication for a system with a web SPA, a mobile app, partner APIs and internal service-to-service calls.", "answerTitle": "Authentication for a mixed estate", "answer": "<p><strong>Clarify first<\/strong>: who are the users (employees, consumers, partners), is there an existing IdP, what regulatory constraints apply, what is the mobile release cadence, and do partners need per-tenant isolation?<\/p><p>The shape I would propose:<\/p><ul><li><strong>One IdP<\/strong> as the single identity authority, with the user store, MFA and federation. Not one per channel.<\/li><li><strong>Web SPA<\/strong> - authorization code with PKCE, and I would push for the <strong>BFF pattern<\/strong>: tokens held server-side, the browser gets only an <code>HttpOnly<\/code> session cookie. That removes token-in-browser storage entirely, which is the highest-value decision here (<code>01-java<\/code> Q140). If a pure SPA is mandated, then PKCE with the access token in memory and the refresh token in an <code>HttpOnly<\/code>, <code>SameSite<\/code> cookie scoped to the token endpoint.<\/li><li><strong>Mobile<\/strong> - authorization code with PKCE, refresh token in the platform keystore, rotation with reuse detection. Mobile&#x27;s slow release cycle means the token contract must be versioned and backward compatible for a long window.<\/li><li><strong>Partner APIs<\/strong> - client credentials with per-partner clients, audience-restricted short-lived tokens, per-partner rate limits, and mTLS where the partner supports it. Certificate-bound tokens (RFC 8705) if the data justifies it.<\/li><li><strong>Service-to-service<\/strong> - workload identity (SPIFFE, IRSA) plus mTLS in the mesh for <em>service<\/em> identity, and audience-scoped client credentials for <em>application<\/em> authorization. Propagate the end-user identity separately via token exchange (Q172) so downstream services can enforce user-level rules.<\/li><\/ul><p>Cross-cutting: short access token lifetimes, a documented revocation story per channel, one authorization model expressed the same way everywhere, and a central audit of authentication and authorization decisions. I would also state what I am deliberately not doing - no ROPC, no implicit, no long-lived API keys - and the migration path for anything that exists today.<\/p>", "source": "answers.md", "search": "design authentication for a system with a web spa, a mobile app, partner apis and internal service-to-service calls. clarify first : who are the users (employees, consumers, partners), is there an existing idp, what regulatory constraints apply, what is the mobile release cadence, and do partners need per-tenant isolation? the shape i would propose: - one idp as the single identity authority, with the user store, mfa and federation. not one per channel. - web spa - authorization code with pkce, and i would push for the bff pattern : tokens held server-side, the browser gets only an httponly session cookie. that removes token-in-browser storage entirely, which is the highest-value decision here (01-java q140). if a pure spa is mandated, then pkce with the access token in memory and the refresh token in an httponly, samesite cookie scoped to the token endpoint. - mobile - authorization code with pkce, refresh token in the platform keystore, rotation with reuse detection. mobile's slow release cycle means the token contract must be versioned and backward compatible for a long window. - partner apis - client credentials with per-partner clients, audience-restricted short-lived tokens, per-partner rate limits, and mtls where the partner supports it. certificate-bound tokens (rfc 8705) if the data justifies it. - service-to-service - workload identity (spiffe, irsa) plus mtls in the mesh for service identity, and audience-scoped client credentials for application authorization. propagate the end-user identity separately via token exchange (q172) so downstream services can enforce user-level rules. cross-cutting: short access token lifetimes, a documented revocation story per channel, one authorization model expressed the same way everywhere, and a central audit of authentication and authorization decisions. i would also state what i am deliberately not doing - no ropc, no implicit, no long-lived api keys - and the migration path for anything that exists today."}, {"n": 183, "category": 10, "difficulty": "C", "html": "Write an auto-configuration and a starter - which files, which conditions, what ordering, and what metadata?", "answerTitle": "Writing a starter", "answer": "<p>Two modules by convention: <code>acme-spring-boot-autoconfigure<\/code> (the code and conditions) and <code>acme-spring-boot-starter<\/code> (a dependency aggregator with no code).<\/p><pre><code class=\"lang-java\">@AutoConfiguration(after = DataSourceAutoConfiguration.class)\n@ConditionalOnClass(AcmeClient.class)\n@EnableConfigurationProperties(AcmeProperties.class)\npublic class AcmeAutoConfiguration {\n    @Bean @ConditionalOnMissingBean\n    AcmeClient acmeClient(AcmeProperties props) { return new AcmeClient(props.url()); }\n}<\/code><\/pre><p>Registered in <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports<\/code> (one class name per line).<\/p><p>The things that make it good rather than merely working: <code>@ConditionalOnMissingBean<\/code> on every bean so consumers can override; <code>@ConditionalOnProperty<\/code> with <code>matchIfMissing<\/code> for opt-in features; explicit <code>after<\/code>/<code>before<\/code> ordering; the configuration processor for metadata (Q37); documented and validated properties; and a test using <code>ApplicationContextRunner<\/code> that asserts both the configured and backed-off cases:<\/p><pre><code class=\"lang-java\">new ApplicationContextRunner()\n    .withConfiguration(AutoConfigurations.of(AcmeAutoConfiguration.class))\n    .withUserConfiguration(CustomClientConfig.class)\n    .run(ctx -&gt; assertThat(ctx).getBean(AcmeClient.class).isSameAs(ctx.getBean(&quot;myClient&quot;)));<\/code><\/pre><p>Never put <code>@ComponentScan<\/code> in a starter - it scans the <em>consumer&#x27;s<\/em> packages and causes bewildering conflicts.<\/p>", "source": "answers.md", "search": "write an auto-configuration and a starter - which files, which conditions, what ordering, and what metadata? two modules by convention: acme-spring-boot-autoconfigure (the code and conditions) and acme-spring-boot-starter (a dependency aggregator with no code). java @autoconfiguration(after = datasourceautoconfiguration.class) @conditionalonclass(acmeclient.class) @enableconfigurationproperties(acmeproperties.class) public class acmeautoconfiguration { @bean @conditionalonmissingbean acmeclient acmeclient(acmeproperties props) { return new acmeclient(props.url()); } } registered in meta-inf/spring/org.springframework.boot.autoconfigure.autoconfiguration.imports (one class name per line). the things that make it good rather than merely working: @conditionalonmissingbean on every bean so consumers can override; @conditionalonproperty with matchifmissing for opt-in features; explicit after/before ordering; the configuration processor for metadata (q37); documented and validated properties; and a test using applicationcontextrunner that asserts both the configured and backed-off cases: java new applicationcontextrunner() .withconfiguration(autoconfigurations.of(acmeautoconfiguration.class)) .withuserconfiguration(customclientconfig.class) .run(ctx - assertthat(ctx).getbean(acmeclient.class).issameas(ctx.getbean(\"myclient\"))); never put @componentscan in a starter - it scans the consumer's packages and causes bewildering conflicts."}, {"n": 184, "category": 10, "difficulty": "T", "html": "Why must your auto-configuration back off with <code>@ConditionalOnMissingBean<\/code>, and why does evaluation order matter so much?", "answerTitle": "Back-off and ordering", "answer": "<p><code>@ConditionalOnMissingBean<\/code> only sees beans that are <strong>already registered<\/strong> when the condition is evaluated. Auto-configurations are processed by a <code>DeferredImportSelector<\/code>, so they run <strong>after<\/strong> all user configuration - which is exactly why a user bean always wins.<\/p><p>But <em>between<\/em> auto-configurations, order matters entirely. If configuration A defines a <code>DataSource<\/code> conditionally on none existing, and configuration B does the same, whichever is evaluated first wins and the other backs off. Without explicit <code>@AutoConfiguration(after = ...)<\/code> or <code>@AutoConfigureOrder<\/code>, the order is derived from the imports file and is not something to rely on.<\/p><p>The failure is silent and environment-dependent: it works locally and a different classpath ordering in the deployed artifact produces a different bean. Diagnosis is the <code>--debug<\/code> auto-configuration report, which lists positive and negative matches with the reason - that report is the single most useful tool for &quot;why is this bean not what I expect&quot;.<\/p>", "source": "answers.md", "search": "why must your auto-configuration back off with @conditionalonmissingbean, and why does evaluation order matter so much? @conditionalonmissingbean only sees beans that are already registered when the condition is evaluated. auto-configurations are processed by a deferredimportselector, so they run after all user configuration - which is exactly why a user bean always wins. but between auto-configurations, order matters entirely. if configuration a defines a datasource conditionally on none existing, and configuration b does the same, whichever is evaluated first wins and the other backs off. without explicit @autoconfiguration(after = ...) or @autoconfigureorder, the order is derived from the imports file and is not something to rely on. the failure is silent and environment-dependent: it works locally and a different classpath ordering in the deployed artifact produces a different bean. diagnosis is the --debug auto-configuration report, which lists positive and negative matches with the reason - that report is the single most useful tool for \"why is this bean not what i expect\"."}, {"n": 185, "category": 10, "difficulty": "D", "html": "<code>AutoConfiguration.imports<\/code> versus <code>spring.factories<\/code> - what changed in Boot 2.7 and 3, and why?", "answerTitle": "`AutoConfiguration.imports`", "answer": "<p>Before Boot 2.7, auto-configurations were listed under the <code>EnableAutoConfiguration<\/code> key in <code>META-INF/spring.factories<\/code>. Boot 2.7 introduced <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports<\/code> - a plain newline-delimited list - and Boot 3 <strong>removed<\/strong> the <code>spring.factories<\/code> support for this key entirely.<\/p><p>Reasons for the change: <code>spring.factories<\/code> was a single overloaded file serving many unrelated purposes, it was slow to parse (every JAR, every key), and it gave no structure for ordering. The new file is purpose-specific, cheaper to read, and works better with AOT processing, which needs to resolve the auto-configuration set at build time.<\/p><p>The practical consequence is that a library published for Boot 2.6 silently contributes <strong>nothing<\/strong> on Boot 3 - no error, the beans just do not appear. That is one of the more confusing Boot 3 migration failures (Q252), and the fix is to ship both files during the transition.<\/p>", "source": "answers.md", "search": "autoconfiguration.imports versus spring.factories - what changed in boot 2.7 and 3, and why? before boot 2.7, auto-configurations were listed under the enableautoconfiguration key in meta-inf/spring.factories. boot 2.7 introduced meta-inf/spring/org.springframework.boot.autoconfigure.autoconfiguration.imports - a plain newline-delimited list - and boot 3 removed the spring.factories support for this key entirely. reasons for the change: spring.factories was a single overloaded file serving many unrelated purposes, it was slow to parse (every jar, every key), and it gave no structure for ordering. the new file is purpose-specific, cheaper to read, and works better with aot processing, which needs to resolve the auto-configuration set at build time. the practical consequence is that a library published for boot 2.6 silently contributes nothing on boot 3 - no error, the beans just do not appear. that is one of the more confusing boot 3 migration failures (q252), and the fix is to ship both files during the transition."}, {"n": 186, "category": 10, "difficulty": "D", "html": "A custom Actuator endpoint - <code>@Endpoint<\/code>, <code>@ReadOperation<\/code>, exposure and securing it.", "answerTitle": "Custom Actuator endpoint", "answer": "<pre><code class=\"lang-java\">@Component\n@Endpoint(id = &quot;cache-stats&quot;)\nclass CacheStatsEndpoint {\n    @ReadOperation Map&lt;String, CacheStats&gt; all() { ... }\n    @ReadOperation CacheStats one(@Selector String name) { ... }\n    @WriteOperation void evict(@Selector String name) { ... }\n    @DeleteOperation void clear() { ... }\n}<\/code><\/pre><p><code>@Endpoint<\/code> is technology-agnostic; <code>@WebEndpoint<\/code> and <code>@JmxEndpoint<\/code> restrict exposure. <code>@Selector<\/code> binds a path segment.<\/p><p>Two things to get right: it must be added to <code>management.endpoints.web.exposure.include<\/code> to be reachable at all, and any <code>@WriteOperation<\/code> or <code>@DeleteOperation<\/code> is a <strong>mutating production operation<\/strong>, so it needs authorization (Q162) and audit logging. An endpoint that clears a cache or changes a log level is an attack surface, and I have seen <code>/actuator/loggers<\/code> used to enable DEBUG logging on a production service by someone who should not have had access.<\/p>", "source": "answers.md", "search": "a custom actuator endpoint - @endpoint, @readoperation, exposure and securing it. java @component @endpoint(id = \"cache-stats\") class cachestatsendpoint { @readoperation map<string, cachestats all() { ... } @readoperation cachestats one(@selector string name) { ... } @writeoperation void evict(@selector string name) { ... } @deleteoperation void clear() { ... } } @endpoint is technology-agnostic; @webendpoint and @jmxendpoint restrict exposure. @selector binds a path segment. two things to get right: it must be added to management.endpoints.web.exposure.include to be reachable at all, and any @writeoperation or @deleteoperation is a mutating production operation , so it needs authorization (q162) and audit logging. an endpoint that clears a cache or changes a log level is an attack surface, and i have seen /actuator/loggers used to enable debug logging on a production service by someone who should not have had access."}, {"n": 187, "category": 10, "difficulty": "D", "html": "Custom <code>HealthIndicator<\/code> and health groups for Kubernetes liveness and readiness probes.", "answerTitle": "Health indicators and groups", "answer": "<pre><code class=\"lang-java\">@Component\nclass PaymentGatewayHealthIndicator implements HealthIndicator {\n    public Health health() {\n        return gateway.ping() ? Health.up().build()\n                              : Health.down().withDetail(&quot;endpoint&quot;, url).build();\n    }\n}<\/code><\/pre><pre><code class=\"lang-yaml\">management.endpoint.health.group.readiness.include: readinessState,db\nmanagement.endpoint.health.group.liveness.include: livenessState\nmanagement.endpoint.health.probes.enabled: true<\/code><\/pre><p>Boot exposes <code>/actuator/health/liveness<\/code> and <code>/actuator/health/readiness<\/code>, and integrates with <code>ApplicationAvailability<\/code> so readiness automatically reports <code>OUT_OF_SERVICE<\/code> during startup and graceful shutdown - which is what makes zero-downtime rolling deployments work without custom code.<\/p><p>The design rule: a custom indicator is only worth writing if its failure should change how the platform treats the instance. Otherwise it is a metric, not a health check.<\/p>", "source": "answers.md", "search": "custom healthindicator and health groups for kubernetes liveness and readiness probes. java @component class paymentgatewayhealthindicator implements healthindicator { public health health() { return gateway.ping() ? health.up().build() : health.down().withdetail(\"endpoint\", url).build(); } } yaml management.endpoint.health.group.readiness.include: readinessstate,db management.endpoint.health.group.liveness.include: livenessstate management.endpoint.health.probes.enabled: true boot exposes /actuator/health/liveness and /actuator/health/readiness, and integrates with applicationavailability so readiness automatically reports out_of_service during startup and graceful shutdown - which is what makes zero-downtime rolling deployments work without custom code. the design rule: a custom indicator is only worth writing if its failure should change how the platform treats the instance. otherwise it is a metric, not a health check."}, {"n": 188, "category": 10, "difficulty": "T", "html": "Which dependency failures belong in readiness and which do not? Describe the outage caused by getting this wrong.", "answerTitle": "What belongs in readiness", "answer": "<p><strong>Readiness<\/strong> should contain only dependencies without which this instance cannot serve <em>any<\/em> useful traffic - typically its own database. <strong>Liveness<\/strong> should contain almost nothing: it answers &quot;is this process broken beyond recovery&quot;, and its failure causes a restart.<\/p><p>The outage pattern: someone adds a downstream API or a third-party service to readiness (or worse, to liveness). That dependency has a blip. <strong>Every instance simultaneously<\/strong> reports not-ready, Kubernetes removes them all from the Service endpoints, and a partial degradation - where most endpoints would still have worked - becomes a total outage. If it was in liveness, the whole fleet restarts at once, and the cold-start stampede then overwhelms the dependency as it recovers, turning a two-minute blip into a twenty-minute incident.<\/p><p>So: liveness must be dependency-free; readiness contains only hard dependencies; everything else is a metric with an alert, and the application degrades gracefully (<code>01-java<\/code> Q181). Boot makes this easy to get wrong because <code>@ConditionalOnEnabledHealthIndicator<\/code> auto-registers indicators for anything on the classpath - Redis, Kafka, Mongo, every downstream with a starter - and they all land in the default health group. Curating that list explicitly is a required production step.<\/p>", "source": "answers.md", "search": "which dependency failures belong in readiness and which do not? describe the outage caused by getting this wrong. readiness should contain only dependencies without which this instance cannot serve any useful traffic - typically its own database. liveness should contain almost nothing: it answers \"is this process broken beyond recovery\", and its failure causes a restart. the outage pattern: someone adds a downstream api or a third-party service to readiness (or worse, to liveness). that dependency has a blip. every instance simultaneously reports not-ready, kubernetes removes them all from the service endpoints, and a partial degradation - where most endpoints would still have worked - becomes a total outage. if it was in liveness, the whole fleet restarts at once, and the cold-start stampede then overwhelms the dependency as it recovers, turning a two-minute blip into a twenty-minute incident. so: liveness must be dependency-free; readiness contains only hard dependencies; everything else is a metric with an alert, and the application degrades gracefully (01-java q181). boot makes this easy to get wrong because @conditionalonenabledhealthindicator auto-registers indicators for anything on the classpath - redis, kafka, mongo, every downstream with a starter - and they all land in the default health group. curating that list explicitly is a required production step."}, {"n": 189, "category": 10, "difficulty": "D", "html": "Graceful shutdown - what <code>server.shutdown=graceful<\/code> covers, the lifecycle timeout, and what else must drain.", "answerTitle": "Graceful shutdown", "answer": "<p><code>server.shutdown=graceful<\/code> plus <code>spring.lifecycle.timeout-per-shutdown-phase=30s<\/code>. On <code>SIGTERM<\/code>, the web server stops accepting new connections and waits for in-flight requests to complete before the context closes.<\/p><p>What it does <strong>not<\/strong> cover, and must be handled separately:<\/p><ul><li><strong>Message consumers<\/strong> - Kafka listener containers, SQS pollers, and <code>@Scheduled<\/code> tasks. These are <code>SmartLifecycle<\/code> beans; make sure they stop in the right phase, finish the in-flight message and commit the offset.<\/li><li><strong>Async executors<\/strong> - set <code>setWaitForTasksToCompleteOnShutdown(true)<\/code> and an await timeout, or queued tasks are dropped.<\/li><li><strong>Load balancer deregistration<\/strong> - the crucial one. Kubernetes sends <code>SIGTERM<\/code> and removes the endpoint <em>concurrently<\/em>, and endpoint propagation to every kube-proxy takes time. So the pod must keep serving for a few seconds after <code>SIGTERM<\/code> or it will reject requests that were already routed to it. A <code>preStop<\/code> sleep of 5-10 seconds is the standard fix, and it must be shorter than <code>terminationGracePeriodSeconds<\/code>.<\/li><\/ul><p>The full sequence to state: <code>preStop<\/code> sleep → readiness fails → traffic drains → <code>SIGTERM<\/code> → graceful shutdown of listeners and requests → context close → exit.<\/p>", "source": "answers.md", "search": "graceful shutdown - what server.shutdown=graceful covers, the lifecycle timeout, and what else must drain. server.shutdown=graceful plus spring.lifecycle.timeout-per-shutdown-phase=30s. on sigterm, the web server stops accepting new connections and waits for in-flight requests to complete before the context closes. what it does not cover, and must be handled separately: - message consumers - kafka listener containers, sqs pollers, and @scheduled tasks. these are smartlifecycle beans; make sure they stop in the right phase, finish the in-flight message and commit the offset. - async executors - set setwaitfortaskstocompleteonshutdown(true) and an await timeout, or queued tasks are dropped. - load balancer deregistration - the crucial one. kubernetes sends sigterm and removes the endpoint concurrently , and endpoint propagation to every kube-proxy takes time. so the pod must keep serving for a few seconds after sigterm or it will reject requests that were already routed to it. a prestop sleep of 5-10 seconds is the standard fix, and it must be shorter than terminationgraceperiodseconds. the full sequence to state: prestop sleep → readiness fails → traffic drains → sigterm → graceful shutdown of listeners and requests → context close → exit."}, {"n": 190, "category": 10, "difficulty": "C", "html": "Micrometer meter types - <code>Counter<\/code>, <code>Timer<\/code>, <code>Gauge<\/code>, <code>DistributionSummary<\/code>. When do you need percentiles versus a histogram?", "answerTitle": "Micrometer meter types", "answer": "<ul><li><strong><code>Counter<\/code><\/strong> - monotonically increasing. Rate is computed at query time; never expose a &quot;rate&quot; yourself.<\/li><li><strong><code>Timer<\/code><\/strong> - duration plus count. Records latency distributions.<\/li><li><strong><code>Gauge<\/code><\/strong> - a sampled instantaneous value (queue depth, pool size). Micrometer holds a <strong>weak reference<\/strong> to the source object, so a gauge on a local variable is garbage collected and reports NaN - a classic bug.<\/li><li><strong><code>DistributionSummary<\/code><\/strong> - distributions of non-time values (payload size, batch size).<\/li><li><strong><code>LongTaskTimer<\/code><\/strong> - for in-progress long-running work, which a normal <code>Timer<\/code> cannot show until it finishes.<\/li><\/ul><p><strong>Percentiles versus histograms<\/strong> is the question that separates people who have run these systems: <code>publishPercentiles<\/code> computes quantiles <em>in the application<\/em>, so they <strong>cannot be aggregated<\/strong> across instances - averaging p99s from ten pods is statistically meaningless. <code>publishPercentileHistogram<\/code> exports bucket counts, which Prometheus aggregates correctly with <code>histogram_quantile<\/code>. For any multi-instance service, use histograms, and accept the higher series count.<\/p>", "source": "answers.md", "search": "micrometer meter types - counter, timer, gauge, distributionsummary. when do you need percentiles versus a histogram? - counter - monotonically increasing. rate is computed at query time; never expose a \"rate\" yourself. - timer - duration plus count. records latency distributions. - gauge - a sampled instantaneous value (queue depth, pool size). micrometer holds a weak reference to the source object, so a gauge on a local variable is garbage collected and reports nan - a classic bug. - distributionsummary - distributions of non-time values (payload size, batch size). - longtasktimer - for in-progress long-running work, which a normal timer cannot show until it finishes. percentiles versus histograms is the question that separates people who have run these systems: publishpercentiles computes quantiles in the application , so they cannot be aggregated across instances - averaging p99s from ten pods is statistically meaningless. publishpercentilehistogram exports bucket counts, which prometheus aggregates correctly with histogram_quantile. for any multi-instance service, use histograms, and accept the higher series count."}, {"n": 191, "category": 10, "difficulty": "T", "html": "Why does tagging a metric with a user ID, order ID or raw URL path take down your metrics backend?", "answerTitle": "High-cardinality tags", "answer": "<p>Every unique combination of tag values creates a <strong>separate time series<\/strong>, stored and indexed independently. Tagging with a user ID gives you one series per user; with a raw URL path containing IDs, one per resource. A million users means a million series per metric, which exhausts memory in Prometheus, blows past the cardinality limits of a managed backend, and costs a fortune in a per-series-priced service. It typically takes the metrics system down for <em>everyone<\/em>, not just your service - so it is a shared-platform incident.<\/p><p>The specific Spring trap: <code>http.server.requests<\/code> is tagged with <code>uri<\/code>, and if you use a path <em>without<\/em> a template - or write a custom tag from <code>request.getRequestURI()<\/code> - you get one series per ID. Spring uses the <strong>matched pattern<\/strong> (<code>/orders/{id}<\/code>) precisely to avoid this, which is why <code>uri<\/code> is <code>UNKNOWN<\/code> for unmatched requests rather than the raw path.<\/p><p>Guardrails: keep tag values to bounded, low-cardinality sets (status, method, outcome, endpoint template); put high-cardinality identifiers in <strong>traces and logs<\/strong>, which are designed for it; set <code>management.metrics.web.server.max-uri-tags<\/code>; and review new metrics for cardinality the same way you review a database index.<\/p>", "source": "answers.md", "search": "why does tagging a metric with a user id, order id or raw url path take down your metrics backend? every unique combination of tag values creates a separate time series , stored and indexed independently. tagging with a user id gives you one series per user; with a raw url path containing ids, one per resource. a million users means a million series per metric, which exhausts memory in prometheus, blows past the cardinality limits of a managed backend, and costs a fortune in a per-series-priced service. it typically takes the metrics system down for everyone , not just your service - so it is a shared-platform incident. the specific spring trap: http.server.requests is tagged with uri, and if you use a path without a template - or write a custom tag from request.getrequesturi() - you get one series per id. spring uses the matched pattern (/orders/{id}) precisely to avoid this, which is why uri is unknown for unmatched requests rather than the raw path. guardrails: keep tag values to bounded, low-cardinality sets (status, method, outcome, endpoint template); put high-cardinality identifiers in traces and logs , which are designed for it; set management.metrics.web.server.max-uri-tags; and review new metrics for cardinality the same way you review a database index."}, {"n": 192, "category": 10, "difficulty": "D", "html": "The Micrometer Observation API and <code>@Observed<\/code> - what does it unify?", "answerTitle": "The Observation API", "answer": "<p><code>@Observed<\/code> and the <code>ObservationRegistry<\/code> unify what used to be three separate instrumentations: you record an observation <strong>once<\/strong>, and registered handlers produce a metric (a <code>Timer<\/code>), a trace span, and optionally a log entry from the same event.<\/p><pre><code class=\"lang-java\">@Observed(name = &quot;order.process&quot;, contextualName = &quot;process-order&quot;,\n          lowCardinalityKeyValues = {&quot;channel&quot;, &quot;web&quot;})\npublic Order process(OrderRequest request) { ... }<\/code><\/pre><p>The key/value distinction maps exactly onto Q191: <strong>low cardinality<\/strong> values become metric tags <em>and<\/em> span attributes; <strong>high cardinality<\/strong> values become span attributes only. That single design decision encodes the right practice into the API.<\/p><p>The practical benefit is consistency - metric names and span names agree, so a latency spike on a dashboard leads directly to the matching traces. It is proxy-based, so the usual self-invocation rule applies (Q50).<\/p>", "source": "answers.md", "search": "the micrometer observation api and @observed - what does it unify? @observed and the observationregistry unify what used to be three separate instrumentations: you record an observation once , and registered handlers produce a metric (a timer), a trace span, and optionally a log entry from the same event. java @observed(name = \"order.process\", contextualname = \"process-order\", lowcardinalitykeyvalues = {\"channel\", \"web\"}) public order process(orderrequest request) { ... } the key/value distinction maps exactly onto q191: low cardinality values become metric tags and span attributes; high cardinality values become span attributes only. that single design decision encodes the right practice into the api. the practical benefit is consistency - metric names and span names agree, so a latency spike on a dashboard leads directly to the matching traces. it is proxy-based, so the usual self-invocation rule applies (q50)."}, {"n": 193, "category": 10, "difficulty": "D", "html": "Micrometer Tracing - propagation, sampling and baggage. What replaced Spring Cloud Sleuth?", "answerTitle": "Micrometer Tracing", "answer": "<p>Micrometer Tracing replaced <strong>Spring Cloud Sleuth<\/strong> in Boot 3; Sleuth is not available for Boot 3, which is a real migration item. It is a facade over a tracer - OpenTelemetry or Brave - with bridges chosen by dependency.<\/p><ul><li><strong>Propagation<\/strong>: W3C <code>traceparent<\/code> by default (Sleuth used B3), which is a wire-format change to coordinate across services during migration.<\/li><li><strong>Sampling<\/strong>: <code>management.tracing.sampling.probability<\/code>. Head-based by default; tail-based sampling (keeping all errors and slow traces) happens in the collector, not the application, and is what you actually want in production.<\/li><li><strong>Baggage<\/strong>: key-value data propagated across the whole trace (<code>management.tracing.baggage.remote-fields<\/code>), optionally copied into MDC so it appears in logs. Useful for tenant or request-type, but every baggage field is on every hop&#x27;s wire format, so keep it minimal.<\/li><\/ul><p>Instrumentation is automatic for MVC, WebFlux, <code>RestClient<\/code>/<code>WebClient<\/code>, JDBC, Kafka and scheduled tasks; the gap is always custom async boundaries, which need context propagation configured (Q95).<\/p>", "source": "answers.md", "search": "micrometer tracing - propagation, sampling and baggage. what replaced spring cloud sleuth? micrometer tracing replaced spring cloud sleuth in boot 3; sleuth is not available for boot 3, which is a real migration item. it is a facade over a tracer - opentelemetry or brave - with bridges chosen by dependency. - propagation : w3c traceparent by default (sleuth used b3), which is a wire-format change to coordinate across services during migration. - sampling : management.tracing.sampling.probability. head-based by default; tail-based sampling (keeping all errors and slow traces) happens in the collector, not the application, and is what you actually want in production. - baggage : key-value data propagated across the whole trace (management.tracing.baggage.remote-fields), optionally copied into mdc so it appears in logs. useful for tenant or request-type, but every baggage field is on every hop's wire format, so keep it minimal. instrumentation is automatic for mvc, webflux, restclient/webclient, jdbc, kafka and scheduled tasks; the gap is always custom async boundaries, which need context propagation configured (q95)."}, {"n": 194, "category": 10, "difficulty": "D", "html": "<code>BufferingApplicationStartup<\/code> - how do you find what makes startup slow?", "answerTitle": "Diagnosing slow startup", "answer": "<pre><code class=\"lang-java\">public static void main(String[] args) {\n    SpringApplication app = new SpringApplication(Application.class);\n    app.setApplicationStartup(new BufferingApplicationStartup(4096));\n    app.run(args);\n}<\/code><\/pre><p>Then <code>/actuator/startup<\/code> returns the recorded step timings - bean instantiation, auto-configuration evaluation, post-processing - which turns &quot;startup is slow&quot; into a ranked list.<\/p><p>Common findings and their fixes: heavy classpath scanning (narrow <code>@ComponentScan<\/code>, or use explicit imports); auto-configurations evaluating conditions against a huge classpath (exclude what you do not use); eager connection pool initialization and Flyway migrations at startup (move migrations to a separate step); JPA <code>EntityManagerFactory<\/code> building for hundreds of entities; a blocking network call in <code>@PostConstruct<\/code> - often the real culprit, and one that turns an IdP or config-server blip into a failed deployment.<\/p><p>Startup time matters more than it used to: it dictates how fast you can scale out, how quickly a rolling deployment completes, and how long a crash loop takes to recover.<\/p>", "source": "answers.md", "search": "bufferingapplicationstartup - how do you find what makes startup slow? java public static void main(string[] args) { springapplication app = new springapplication(application.class); app.setapplicationstartup(new bufferingapplicationstartup(4096)); app.run(args); } then /actuator/startup returns the recorded step timings - bean instantiation, auto-configuration evaluation, post-processing - which turns \"startup is slow\" into a ranked list. common findings and their fixes: heavy classpath scanning (narrow @componentscan, or use explicit imports); auto-configurations evaluating conditions against a huge classpath (exclude what you do not use); eager connection pool initialization and flyway migrations at startup (move migrations to a separate step); jpa entitymanagerfactory building for hundreds of entities; a blocking network call in @postconstruct - often the real culprit, and one that turns an idp or config-server blip into a failed deployment. startup time matters more than it used to: it dictates how fast you can scale out, how quickly a rolling deployment completes, and how long a crash loop takes to recover."}, {"n": 195, "category": 10, "difficulty": "D", "html": "<code>spring.main.lazy-initialization<\/code> - what it buys you and what it hides.", "answerTitle": "Lazy initialization", "answer": "<p><code>spring.main.lazy-initialization=true<\/code> defers bean creation until first use. Startup gets dramatically faster, which is genuinely useful for <strong>local development<\/strong> and for tests.<\/p><p>What it hides is the problem: configuration errors, missing beans and bad wiring no longer fail at startup - they fail on the first request that touches them, in production, at 3am. It converts a deployment-time failure into a runtime failure, which is exactly the wrong direction. It also shifts the cost to the first request of each path, so latency is unpredictable after every deployment and the &quot;warm&quot; state is only reached gradually.<\/p><p>So: yes for development and tests, no for production. If production startup is slow, fix the cause found in Q194 rather than deferring it. <code>@Lazy<\/code> on specific expensive beans is a reasonable targeted compromise.<\/p>", "source": "answers.md", "search": "spring.main.lazy-initialization - what it buys you and what it hides. spring.main.lazy-initialization=true defers bean creation until first use. startup gets dramatically faster, which is genuinely useful for local development and for tests. what it hides is the problem: configuration errors, missing beans and bad wiring no longer fail at startup - they fail on the first request that touches them, in production, at 3am. it converts a deployment-time failure into a runtime failure, which is exactly the wrong direction. it also shifts the cost to the first request of each path, so latency is unpredictable after every deployment and the \"warm\" state is only reached gradually. so: yes for development and tests, no for production. if production startup is slow, fix the cause found in q194 rather than deferring it. @lazy on specific expensive beans is a reasonable targeted compromise."}, {"n": 196, "category": 10, "difficulty": "D", "html": "Spring AOT processing - what happens at build time, and what dynamic behavior can no longer work?", "answerTitle": "Spring AOT", "answer": "<p>AOT processing runs at <strong>build time<\/strong> and generates Java source: bean definitions as explicit registration code, proxy classes, and reflection/resource/serialization hints. At runtime the application skips configuration class parsing, condition evaluation and most reflection, which cuts startup time and memory even on the JVM - and it is a prerequisite for native images.<\/p><p>What can no longer work, because the bean set is fixed at build time:<\/p><ul><li><strong>Conditions are evaluated at build time<\/strong>, so <code>@Profile<\/code> and <code>@ConditionalOnProperty<\/code> are resolved with the <em>build-time<\/em> environment. A profile that changes which beans exist must be active during the build, and a property-conditional bean cannot be toggled at deploy time.<\/li><li>Beans registered dynamically at runtime, and <code>BeanFactoryPostProcessor<\/code>s that alter definitions based on runtime state.<\/li><li>Unregistered reflection, dynamic proxies, and classpath scanning for classes not known at build time.<\/li><\/ul><p>The practical consequence to name: <strong>profile-conditional beans and AOT are fundamentally in tension<\/strong>, which is another argument for profiles selecting values rather than beans (Q35).<\/p>", "source": "answers.md", "search": "spring aot processing - what happens at build time, and what dynamic behavior can no longer work? aot processing runs at build time and generates java source: bean definitions as explicit registration code, proxy classes, and reflection/resource/serialization hints. at runtime the application skips configuration class parsing, condition evaluation and most reflection, which cuts startup time and memory even on the jvm - and it is a prerequisite for native images. what can no longer work, because the bean set is fixed at build time: - conditions are evaluated at build time , so @profile and @conditionalonproperty are resolved with the build-time environment. a profile that changes which beans exist must be active during the build, and a property-conditional bean cannot be toggled at deploy time. - beans registered dynamically at runtime, and beanfactorypostprocessors that alter definitions based on runtime state. - unregistered reflection, dynamic proxies, and classpath scanning for classes not known at build time. the practical consequence to name: profile-conditional beans and aot are fundamentally in tension , which is another argument for profiles selecting values rather than beans (q35)."}, {"n": 197, "category": 10, "difficulty": "T", "html": "GraalVM native image - which Spring features break, and how do you register reflection hints?", "answerTitle": "Native image constraints", "answer": "<p>GraalVM&#x27;s closed-world assumption means everything reachable must be known at build time. What breaks: unregistered reflection, dynamic proxies, JNI, dynamic class loading, resource loading by pattern, serialization, and some bytecode-generating libraries. CGLIB proxies are replaced at build time, which is why <code>@Configuration(proxyBeanMethods = false)<\/code> matters more here.<\/p><p>Spring&#x27;s AOT engine generates most hints automatically for framework usage. Yours are declared explicitly:<\/p><pre><code class=\"lang-java\">@Configuration\n@ImportRuntimeHints(AcmeHints.class)\nclass AcmeConfig {}\n\nclass AcmeHints implements RuntimeHintsRegistrar {\n    public void registerHints(RuntimeHints hints, ClassLoader cl) {\n        hints.reflection().registerType(LegacyDto.class, MemberCategory.INVOKE_DECLARED_CONSTRUCTORS,\n                                        MemberCategory.DECLARED_FIELDS);\n        hints.resources().registerPattern(&quot;templates/*.ftl&quot;);\n    }\n}<\/code><\/pre><p>Or <code>@RegisterReflectionForBinding(LegacyDto.class)<\/code> for the common serialization case.<\/p><p>The honest operational assessment: build times of five to ten minutes, a debugging experience unlike the JVM, less mature profiling, and failures that appear only in the native binary. It is worth it for genuinely short-lived or scale-to-zero workloads (Lambda, CLI tools). For a long-running service, CDS or CRaC (Q198) usually gives enough of the startup benefit at a fraction of the complexity - and saying that is a stronger answer than enthusiasm for native.<\/p>", "source": "answers.md", "search": "graalvm native image - which spring features break, and how do you register reflection hints? graalvm's closed-world assumption means everything reachable must be known at build time. what breaks: unregistered reflection, dynamic proxies, jni, dynamic class loading, resource loading by pattern, serialization, and some bytecode-generating libraries. cglib proxies are replaced at build time, which is why @configuration(proxybeanmethods = false) matters more here. spring's aot engine generates most hints automatically for framework usage. yours are declared explicitly: java @configuration @importruntimehints(acmehints.class) class acmeconfig {} class acmehints implements runtimehintsregistrar { public void registerhints(runtimehints hints, classloader cl) { hints.reflection().registertype(legacydto.class, membercategory.invoke_declared_constructors, membercategory.declared_fields); hints.resources().registerpattern(\"templates/ .ftl\"); } } or @registerreflectionforbinding(legacydto.class) for the common serialization case. the honest operational assessment: build times of five to ten minutes, a debugging experience unlike the jvm, less mature profiling, and failures that appear only in the native binary. it is worth it for genuinely short-lived or scale-to-zero workloads (lambda, cli tools). for a long-running service, cds or crac (q198) usually gives enough of the startup benefit at a fraction of the complexity - and saying that is a stronger answer than enthusiasm for native."}, {"n": 198, "category": 10, "difficulty": "D", "html": "Class Data Sharing and Project CRaC - startup improvements short of a native image.", "answerTitle": "CDS and CRaC", "answer": "<p><strong>Class Data Sharing<\/strong> (first-class support in Boot 3.3) dumps the loaded class metadata to an archive that subsequent JVMs memory-map instead of re-parsing. A training run produces the archive, which ships in the image. Typical improvement is 30-40 percent off startup, with no code changes, no framework restrictions and full JVM behavior retained. This is the highest value-to-effort option and my default recommendation.<\/p><p><strong>Project CRaC<\/strong> (Coordinated Restore at Checkpoint) snapshots a <strong>running, warmed-up<\/strong> JVM and restores from it in tens of milliseconds - so you skip class loading, context refresh <em>and<\/em> JIT warm-up. Spring supports the lifecycle callbacks (<code>spring.context.checkpoint=onRefresh<\/code>, or a full checkpoint after warm-up).<\/p><p>The catch with CRaC is the same as with Lambda SnapStart: anything captured in the snapshot must be re-established on restore - open connections, cached credentials, random seeds, timers, and anything that assumed a unique process identity. Beans implement <code>org.crac.Resource<\/code> with <code>beforeCheckpoint<\/code>/<code>afterRestore<\/code> hooks.<\/p><p>The decision framework: CDS first (free), CRaC when startup latency is genuinely business-critical, native image only when you need both instant start and minimal memory and can accept the build and debugging cost.<\/p>", "source": "answers.md", "search": "class data sharing and project crac - startup improvements short of a native image. class data sharing (first-class support in boot 3.3) dumps the loaded class metadata to an archive that subsequent jvms memory-map instead of re-parsing. a training run produces the archive, which ships in the image. typical improvement is 30-40 percent off startup, with no code changes, no framework restrictions and full jvm behavior retained. this is the highest value-to-effort option and my default recommendation. project crac (coordinated restore at checkpoint) snapshots a running, warmed-up jvm and restores from it in tens of milliseconds - so you skip class loading, context refresh and jit warm-up. spring supports the lifecycle callbacks (spring.context.checkpoint=onrefresh, or a full checkpoint after warm-up). the catch with crac is the same as with lambda snapstart: anything captured in the snapshot must be re-established on restore - open connections, cached credentials, random seeds, timers, and anything that assumed a unique process identity. beans implement org.crac.resource with beforecheckpoint/afterrestore hooks. the decision framework: cds first (free), crac when startup latency is genuinely business-critical, native image only when you need both instant start and minimal memory and can accept the build and debugging cost."}, {"n": 199, "category": 10, "difficulty": "D", "html": "Layered jars, buildpacks and <code>bootBuildImage<\/code> - how do you optimize a Spring image?", "answerTitle": "Images and layers", "answer": "<ul><li><strong>Layered jars<\/strong> (<code>spring-boot-maven-plugin<\/code> layered mode) separate dependencies, spring-boot-loader, snapshot dependencies and application classes. Since dependencies change rarely and application code changes every build, only a small layer is rebuilt and re-pushed - the practical win is push and pull time, not image size.<\/li><li><strong>Buildpacks<\/strong> via <code>bootBuildImage<\/code> produce an optimized image with no Dockerfile: correct layering, a suitable JRE, memory calculation for the container, and an SBOM. It also handles CDS and native builds through configuration. My default for teams that do not want to own a Dockerfile.<\/li><li><strong>A hand-written multi-stage Dockerfile<\/strong> when you need control: a specific base image, distroless, extra tooling, or corporate scanning requirements.<\/li><\/ul><p>Regardless of approach: run as non-root, pin the base image by digest, use <code>.dockerignore<\/code>, order instructions least-to-most volatile, and set <code>-XX:MaxRAMPercentage<\/code> rather than a fixed heap (<code>01-java<\/code> Q203).<\/p>", "source": "answers.md", "search": "layered jars, buildpacks and bootbuildimage - how do you optimize a spring image? - layered jars (spring-boot-maven-plugin layered mode) separate dependencies, spring-boot-loader, snapshot dependencies and application classes. since dependencies change rarely and application code changes every build, only a small layer is rebuilt and re-pushed - the practical win is push and pull time, not image size. - buildpacks via bootbuildimage produce an optimized image with no dockerfile: correct layering, a suitable jre, memory calculation for the container, and an sbom. it also handles cds and native builds through configuration. my default for teams that do not want to own a dockerfile. - a hand-written multi-stage dockerfile when you need control: a specific base image, distroless, extra tooling, or corporate scanning requirements. regardless of approach: run as non-root, pin the base image by digest, use .dockerignore, order instructions least-to-most volatile, and set -xx:maxrampercentage rather than a fixed heap (01-java q203)."}, {"n": 200, "category": 10, "difficulty": "D", "html": "Boot&#x27;s <code>TaskExecutor<\/code> auto-configuration - what changed in 3.2 with virtual threads, and how should <code>@Async<\/code> be configured now?", "answerTitle": "`TaskExecutor` and virtual threads", "answer": "<p>Historically, <code>@Async<\/code> with no configured executor fell back to <code>SimpleAsyncTaskExecutor<\/code>, which creates a <strong>new platform thread per call<\/strong> with no pooling and no bound - unusable in production and the cause of many thread-exhaustion incidents.<\/p><p>Boot auto-configures an <code>applicationTaskExecutor<\/code> (a <code>ThreadPoolTaskExecutor<\/code>) which <code>@Async<\/code> uses, configurable via <code>spring.task.execution.*<\/code>. <strong>In Boot 3.2+ with <code>spring.threads.virtual.enabled=true<\/code><\/strong>, that becomes a <code>SimpleAsyncTaskExecutor<\/code> backed by <strong>virtual<\/strong> threads - where unbounded thread creation is the intended model rather than a bug.<\/p><p>What I configure explicitly either way:<\/p><pre><code class=\"lang-yaml\">spring.task.execution.pool.core-size: 8\nspring.task.execution.pool.max-size: 32\nspring.task.execution.pool.queue-capacity: 100\nspring.task.execution.shutdown.await-termination: true\nspring.task.execution.shutdown.await-termination-period: 30s<\/code><\/pre><p>Plus a <code>TaskDecorator<\/code> for context propagation (Q95), and a separate named executor per workload so one slow task type cannot starve another - the bulkhead principle applied inside the process. With virtual threads, the pool bound disappears and must be replaced by an explicit <code>Semaphore<\/code> where the downstream needs protection (Q101).<\/p>", "source": "answers.md", "search": "boot's taskexecutor auto-configuration - what changed in 3.2 with virtual threads, and how should @async be configured now? historically, @async with no configured executor fell back to simpleasynctaskexecutor, which creates a new platform thread per call with no pooling and no bound - unusable in production and the cause of many thread-exhaustion incidents. boot auto-configures an applicationtaskexecutor (a threadpooltaskexecutor) which @async uses, configurable via spring.task.execution. . in boot 3.2+ with spring.threads.virtual.enabled=true , that becomes a simpleasynctaskexecutor backed by virtual threads - where unbounded thread creation is the intended model rather than a bug. what i configure explicitly either way: yaml spring.task.execution.pool.core-size: 8 spring.task.execution.pool.max-size: 32 spring.task.execution.pool.queue-capacity: 100 spring.task.execution.shutdown.await-termination: true spring.task.execution.shutdown.await-termination-period: 30s plus a taskdecorator for context propagation (q95), and a separate named executor per workload so one slow task type cannot starve another - the bulkhead principle applied inside the process. with virtual threads, the pool bound disappears and must be replaced by an explicit semaphore where the downstream needs protection (q101)."}, {"n": 201, "category": 10, "difficulty": "D", "html": "Structured JSON logging in Boot 3.4, externalized logging configuration, and correlation IDs.", "answerTitle": "Structured logging", "answer": "<p>Boot 3.4 added built-in structured logging: <code>logging.structured.format.console=ecs<\/code> (or <code>logstash<\/code>, <code>gelf<\/code>) emits JSON directly, removing the Logback encoder dependency and XML that every team previously copied between projects.<\/p><p>What makes logs actually useful in production:<\/p><ul><li><strong>JSON, one event per line<\/strong>, so the collector does not need multiline stitching - which is what breaks stack traces in most log pipelines.<\/li><li><strong>Correlation<\/strong> - trace and span IDs in the MDC, populated automatically by Micrometer Tracing, plus tenant and user identifiers. Add them with <code>logging.structured.ecs.service.*<\/code> and MDC.<\/li><li><strong>Discipline about volume<\/strong> - log ingestion is frequently the largest observability cost line. INFO for business events, DEBUG off, sampling or rate limiting on hot paths.<\/li><li><strong>Never log secrets, tokens or PII<\/strong>, enforced with a Logback converter or a scanner in CI, because a token in a log is a credential in a system with different access controls.<\/li><\/ul><p>I also return the trace ID in an error response header, so a support ticket leads directly to the logs and traces.<\/p>", "source": "answers.md", "search": "structured json logging in boot 3.4, externalized logging configuration, and correlation ids. boot 3.4 added built-in structured logging: logging.structured.format.console=ecs (or logstash, gelf) emits json directly, removing the logback encoder dependency and xml that every team previously copied between projects. what makes logs actually useful in production: - json, one event per line , so the collector does not need multiline stitching - which is what breaks stack traces in most log pipelines. - correlation - trace and span ids in the mdc, populated automatically by micrometer tracing, plus tenant and user identifiers. add them with logging.structured.ecs.service. and mdc. - discipline about volume - log ingestion is frequently the largest observability cost line. info for business events, debug off, sampling or rate limiting on hot paths. - never log secrets, tokens or pii , enforced with a logback converter or a scanner in ci, because a token in a log is a credential in a system with different access controls. i also return the trace id in an error response header, so a support ticket leads directly to the logs and traces."}, {"n": 202, "category": 10, "difficulty": "T", "html": "Why can <code>/actuator/env<\/code> and <code>/actuator/configprops<\/code> still leak secrets despite sanitization, and what do you do about it?", "answerTitle": "Actuator secret leakage", "answer": "<p>Boot sanitizes values whose <strong>key<\/strong> matches patterns like <code>password<\/code>, <code>secret<\/code>, <code>key<\/code>, <code>token<\/code>, <code>credentials<\/code>, and URIs containing credentials. Sanitization is therefore <strong>name-based<\/strong>, and the leaks come from everything it cannot recognize:<\/p><ul><li>A property named <code>connectionString<\/code>, <code>dsn<\/code>, <code>sasl.jaas.config<\/code> or <code>webhookUrl<\/code> containing an embedded password.<\/li><li>A nested object in <code>@ConfigurationProperties<\/code> whose fields have innocuous names.<\/li><li>The value appearing under a <em>different<\/em> endpoint - <code>/heapdump<\/code> contains every string in memory, and <code>/threaddump<\/code> can contain arguments.<\/li><li><code>/configprops<\/code> showing bound objects, and <code>/env<\/code> showing every property source.<\/li><\/ul><p>Handling: set <code>management.endpoint.env.show-values=never<\/code> and <code>management.endpoint.configprops.show-values=never<\/code> (Boot 3 defaults to <code>NEVER<\/code>, but verify on your version); do not expose those endpoints at all in production; register a <code>SanitizingFunction<\/code> for your own naming conventions; and treat <code>/heapdump<\/code> as equivalent to production shell access.<\/p><p>The structural fix is to keep secrets out of the <code>Environment<\/code> in the first place (Q41) - fetch at use time, wrap in a redacting holder type, and never bind a raw secret into a properties object.<\/p>", "source": "answers.md", "search": "why can /actuator/env and /actuator/configprops still leak secrets despite sanitization, and what do you do about it? boot sanitizes values whose key matches patterns like password, secret, key, token, credentials, and uris containing credentials. sanitization is therefore name-based , and the leaks come from everything it cannot recognize: - a property named connectionstring, dsn, sasl.jaas.config or webhookurl containing an embedded password. - a nested object in @configurationproperties whose fields have innocuous names. - the value appearing under a different endpoint - /heapdump contains every string in memory, and /threaddump can contain arguments. - /configprops showing bound objects, and /env showing every property source. handling: set management.endpoint.env.show-values=never and management.endpoint.configprops.show-values=never (boot 3 defaults to never, but verify on your version); do not expose those endpoints at all in production; register a sanitizingfunction for your own naming conventions; and treat /heapdump as equivalent to production shell access. the structural fix is to keep secrets out of the environment in the first place (q41) - fetch at use time, wrap in a redacting holder type, and never
