s-discovery<\/code> implements <code>DiscoveryClient<\/code> against the Kubernetes API, listing <code>Services<\/code> and <code>Endpoints<\/code> so <code>@LoadBalanced RestTemplate<\/code>, WebClient and OpenFeign can resolve <code>http://order-service/...<\/code> client-side and Spring Cloud LoadBalancer can pick an instance.<\/p><p>Plain Service DNS gives you the same name resolution with no library: <code>http://order-service.namespace.svc.cluster.local<\/code>. kube-proxy load-balances at layer 4 and the platform manages endpoint health.<\/p><p>What the API-based client gains you: individual pod IPs rather than one virtual IP, so client-side algorithms such as zone affinity, least-connections or weighted routing become possible; access to service and pod metadata for routing decisions; and for HTTP/2 or gRPC, avoiding the well-known problem that layer-4 balancing pins a long-lived connection to one pod and never rebalances.<\/p><p>What it costs: RBAC to list services and endpoints across namespaces (a meaningful widening of what a compromised pod can see), a hard runtime dependency on the API server from every application pod, API server load that scales with your fleet, and a second source of truth for health that can disagree with the platform&#x27;s.<\/p><p>My default is <strong>Service DNS<\/strong>, consistent with Q220: on Kubernetes the platform already does discovery, and re-implementing it in the application is the classic Spring Cloud over-adoption. I make an exception for gRPC or long-lived HTTP/2 connections, or where zone-aware routing has a measurable cost benefit - and then I would look hard at whether a service mesh solves it outside the application first.<\/p>", "source": "answers.md", "search": "discoveryclient backed by the kubernetes api versus plain service dns - what do you gain, and what does it cost you in permissions and coupling? spring-cloud-kubernetes-discovery implements discoveryclient against the kubernetes api, listing services and endpoints so @loadbalanced resttemplate, webclient and openfeign can resolve http://order-service/... client-side and spring cloud loadbalancer can pick an instance. plain service dns gives you the same name resolution with no library: http://order-service.namespace.svc.cluster.local. kube-proxy load-balances at layer 4 and the platform manages endpoint health. what the api-based client gains you: individual pod ips rather than one virtual ip, so client-side algorithms such as zone affinity, least-connections or weighted routing become possible; access to service and pod metadata for routing decisions; and for http/2 or grpc, avoiding the well-known problem that layer-4 balancing pins a long-lived connection to one pod and never rebalances. what it costs: rbac to list services and endpoints across namespaces (a meaningful widening of what a compromised pod can see), a hard runtime dependency on the api server from every application pod, api server load that scales with your fleet, and a second source of truth for health that can disagree with the platform's. my default is service dns , consistent with q220: on kubernetes the platform already does discovery, and re-implementing it in the application is the classic spring cloud over-adoption. i make an exception for grpc or long-lived http/2 connections, or where zone-aware routing has a measurable cost benefit - and then i would look hard at whether a service mesh solves it outside the application first."}, {"n": 301, "category": 19, "difficulty": "D", "html": "Leader election with Spring Cloud Kubernetes versus ShedLock for <code>@Scheduled<\/code> work. Which failure modes differ?", "answerTitle": "Leader election versus ShedLock", "answer": "<p>They solve overlapping problems with different failure modes.<\/p><p><strong>ShedLock<\/strong> is a mutual-exclusion lock on a <em>job execution<\/em>, stored in a database, Redis or Mongo. Every instance still runs its scheduler; the first to acquire the lock executes and the rest skip. <code>lockAtMostFor<\/code> must exceed the worst-case runtime, because that is the safety valve if the holder dies without releasing. Failure modes: if the job runs longer than <code>lockAtMostFor<\/code>, a second instance starts while the first is still working - concurrent execution, which is exactly what you were preventing. Clock skew across instances affects the window. And the lock store becomes a dependency of your scheduling.<\/p><p><strong>Leader election<\/strong> (Spring Cloud Kubernetes, or Integration&#x27;s <code>LockRegistryLeaderInitiator<\/code>) elects one instance as leader for a <em>period<\/em>, via a <code>ConfigMap<\/code> or <code>Lease<\/code> object; the leader runs all leader-scoped work and others stay idle. Failure modes: a leader partitioned from the API server may still believe it is leader while a new one is elected - two leaders briefly, unless the work is fenced by a token. Failover takes as long as the lease duration, so a scheduled job can be missed entirely during a handover, not merely delayed. And leadership is coarse-grained: one leader takes <em>all<\/em> the leader work, which concentrates load.<\/p><p>How I choose: <strong>ShedLock for periodic jobs<\/strong>, because the granularity is per job and a missed run is simply the next tick; <strong>leader election for continuous singleton work<\/strong> such as an outbox relay or a queue poller that must run somewhere at all times. And the strongest answer for a Kubernetes estate is often neither - a <code>CronJob<\/code> (Q290) moves the concern to the platform, which already solves it.<\/p><p>Whichever you choose, the job itself must tolerate double execution. Every one of these mechanisms has a split-brain window; the lock reduces the probability, and idempotency is what makes it safe.<\/p>", "source": "answers.md", "search": "leader election with spring cloud kubernetes versus shedlock for @scheduled work. which failure modes differ? they solve overlapping problems with different failure modes. shedlock is a mutual-exclusion lock on a job execution , stored in a database, redis or mongo. every instance still runs its scheduler; the first to acquire the lock executes and the rest skip. lockatmostfor must exceed the worst-case runtime, because that is the safety valve if the holder dies without releasing. failure modes: if the job runs longer than lockatmostfor, a second instance starts while the first is still working - concurrent execution, which is exactly what you were preventing. clock skew across instances affects the window. and the lock store becomes a dependency of your scheduling. leader election (spring cloud kubernetes, or integration's lockregistryleaderinitiator) elects one instance as leader for a period , via a configmap or lease object; the leader runs all leader-scoped work and others stay idle. failure modes: a leader partitioned from the api server may still believe it is leader while a new one is elected - two leaders briefly, unless the work is fenced by a token. failover takes as long as the lease duration, so a scheduled job can be missed entirely during a handover, not merely delayed. and leadership is coarse-grained: one leader takes all the leader work, which concentrates load. how i choose: shedlock for periodic jobs , because the granularity is per job and a missed run is simply the next tick; leader election for continuous singleton work such as an outbox relay or a queue poller that must run somewhere at all times. and the strongest answer for a kubernetes estate is often neither - a cronjob (q290) moves the concern to the platform, which already solves it. whichever you choose, the job itself must tolerate double execution. every one of these mechanisms has a split-brain window; the lock reduces the probability, and idempotency is what makes it safe."}, {"n": 302, "category": 19, "difficulty": "T", "html": "Spring Boot DevTools - what does the restart classloader actually do, why must it never reach production, and what replaced it as the better dev loop in Boot 3.1+?", "answerTitle": "DevTools", "answer": "<p><code>spring-boot-devtools<\/code> runs the application under <strong>two classloaders<\/strong>: a base loader holding unchanging jars from third-party dependencies, and a restart loader holding your classes. When the file watcher sees a recompiled class it throws away only the restart loader and re-creates the context, so restart is far faster than a JVM start because the dependency jars are never re-read. It also disables template and static-resource caching, enables <code>LiveReload<\/code>, and sets a batch of &quot;development-time&quot; properties including verbose condition evaluation.<\/p><p>It must never reach production for three separate reasons, and the first two are security issues, not conveniences:<\/p><ol><li><strong>The remote debug tunnel<\/strong> (<code>spring.devtools.remote.secret<\/code>) exposes an endpoint that accepts class bytes and loads them. That is remote code execution with a shared-secret gate.<\/li><li><strong>Development defaults are unsafe defaults<\/strong> - caching disabled, more verbose error output, condition reports and configuration on the wire.<\/li><li><strong>Restart is not a deployment model.<\/strong> Two classloaders means <code>instanceof<\/code> and identity comparisons can fail across the boundary, static caches behave oddly, and memory grows over restarts.<\/li><\/ol><p>Boot defends against this: DevTools is disabled automatically when the application is started from a fully packaged jar, and the Maven and Gradle plugins mark it <code>optional<\/code>/<code>developmentOnly<\/code> so it does not propagate transitively. Those defaults are easy to defeat by declaring the dependency in <code>compile<\/code> scope, so I also fail the build if it appears in the production dependency tree.<\/p><p>What replaced it as the better loop in Boot 3.1+: <strong>Docker Compose support<\/strong> (<code>spring-boot-docker-compose<\/code>) starts the <code>compose.yaml<\/code> next to your project when the app starts and wires the connection details in automatically, and <strong><code>@ServiceConnection<\/code> with Testcontainers at development time<\/strong> does the same from a <code>TestApplication<\/code> main class launched via <code>bootTestRun<\/code>. Both remove the real friction, which was never restart speed - it was standing up a database, Kafka and Redis that match production. Combined with a modern JVM&#x27;s class-data sharing and a fast context, plain restart is usually good enough, and IDE-driven hot swap covers method-body edits without any of DevTools&#x27; risk.<\/p>", "source": "answers.md", "search": "spring boot devtools - what does the restart classloader actually do, why must it never reach production, and what replaced it as the better dev loop in boot 3.1+? spring-boot-devtools runs the application under two classloaders : a base loader holding unchanging jars from third-party dependencies, and a restart loader holding your classes. when the file watcher sees a recompiled class it throws away only the restart loader and re-creates the context, so restart is far faster than a jvm start because the dependency jars are never re-read. it also disables template and static-resource caching, enables livereload, and sets a batch of \"development-time\" properties including verbose condition evaluation. it must never reach production for three separate reasons, and the first two are security issues, not conveniences: 1. the remote debug tunnel (spring.devtools.remote.secret) exposes an endpoint that accepts class bytes and loads them. that is remote code execution with a shared-secret gate. 2. development defaults are unsafe defaults - caching disabled, more verbose error output, condition reports and configuration on the wire. 3. restart is not a deployment model. two classloaders means instanceof and identity comparisons can fail across the boundary, static caches behave oddly, and memory grows over restarts. boot defends against this: devtools is disabled automatically when the application is started from a fully packaged jar, and the maven and gradle plugins mark it optional/developmentonly so it does not propagate transitively. those defaults are easy to defeat by declaring the dependency in compile scope, so i also fail the build if it appears in the production dependency tree. what replaced it as the better loop in boot 3.1+: docker compose support (spring-boot-docker-compose) starts the compose.yaml next to your project when the app starts and wires the connection details in automatically, and @serviceconnection with testcontainers at development time does the same from a testapplication main class launched via boottestrun. both remove the real friction, which was never restart speed - it was standing up a database, kafka and redis that match production. combined with a modern jvm's class-data sharing and a fast context, plain restart is usually good enough, and ide-driven hot swap covers method-body edits without any of devtools' risk."}, {"n": 303, "category": 20, "difficulty": "C", "html": "<code>ChatModel<\/code>, <code>EmbeddingModel<\/code> and <code>ImageModel<\/code> underneath <code>ChatClient<\/code> - what belongs at each layer, and when do you call the model directly?", "answerTitle": "`ChatModel`, `EmbeddingModel` and `ImageModel`", "answer": "<p>The layering is deliberate. <code>ChatModel<\/code> is the <strong>portable, low-level port<\/strong>: <code>call(Prompt) -&gt; ChatResponse<\/code>, plus <code>stream(Prompt) -&gt; Flux&lt;ChatResponse&gt;<\/code>. It knows about messages, options, token usage and finish reasons, and each provider ships one implementation. <code>EmbeddingModel<\/code> is the same idea for vectors (<code>embed(Document)<\/code>, batching, dimensions), and <code>ImageModel<\/code>, <code>TranscriptionModel<\/code> and <code>ModerationModel<\/code> fill out the other modalities.<\/p><p><code>ChatClient<\/code> is the <strong>fluent application-facing API built on top of <code>ChatModel<\/code><\/strong>, and it is where advisors, prompt templates, structured output conversion, tool callbacks and chat memory live (Q237-243). Most application code should use it.<\/p><p>When I go direct to the model:<\/p><ul><li>Building infrastructure rather than a feature - a custom advisor, an evaluator, or a batch pipeline where the advisor chain is overhead.<\/li><li>Bulk embedding, where I want explicit batch control and to observe token usage per batch. <code>VectorStore<\/code> calls <code>EmbeddingModel<\/code> for me, but a backfill of a million documents needs rate limiting and checkpointing that belongs in my code.<\/li><li>Testing, where a stub <code>ChatModel<\/code> is the cleanest seam - it is a one-method interface, so no mocking framework is needed.<\/li><\/ul><p>The rule I apply in code review: features depend on <code>ChatClient<\/code>, platform code depends on <code>ChatModel<\/code>, and nothing outside a configuration class depends on a provider type.<\/p>", "source": "answers.md", "search": "chatmodel, embeddingmodel and imagemodel underneath chatclient - what belongs at each layer, and when do you call the model directly? the layering is deliberate. chatmodel is the portable, low-level port : call(prompt) - chatresponse, plus stream(prompt) - flux<chatresponse . it knows about messages, options, token usage and finish reasons, and each provider ships one implementation. embeddingmodel is the same idea for vectors (embed(document), batching, dimensions), and imagemodel, transcriptionmodel and moderationmodel fill out the other modalities. chatclient is the fluent application-facing api built on top of chatmodel , and it is where advisors, prompt templates, structured output conversion, tool callbacks and chat memory live (q237-243). most application code should use it. when i go direct to the model: - building infrastructure rather than a feature - a custom advisor, an evaluator, or a batch pipeline where the advisor chain is overhead. - bulk embedding, where i want explicit batch control and to observe token usage per batch. vectorstore calls embeddingmodel for me, but a backfill of a million documents needs rate limiting and checkpointing that belongs in my code. - testing, where a stub chatmodel is the cleanest seam - it is a one-method interface, so no mocking framework is needed. the rule i apply in code review: features depend on chatclient, platform code depends on chatmodel, and nothing outside a configuration class depends on a provider type."}, {"n": 304, "category": 20, "difficulty": "T", "html": "Spring AI claims portability across providers. Where does that break, and what does provider-specific <code>ChatOptions<\/code> do to your abstraction?", "answerTitle": "Where portability breaks", "answer": "<p>The interface is portable; the behavior is not. Swapping the starter compiles and then behaves differently, which is worse than failing.<\/p><p>Where it breaks:<\/p><ul><li><strong><code>ChatOptions<\/code> is the leak.<\/strong> The common interface covers temperature, max tokens, top-p and stop sequences. Everything that differentiates a provider is in the provider-specific subtype - <code>OpenAiChatOptions<\/code> for response format, seed, logit bias, reasoning effort and parallel tool calls; <code>AnthropicChatOptions<\/code> for thinking budget and top-k; Bedrock and Vertex for their own guardrail and safety-filter settings. The moment you set one, your configuration is provider-specific even though your code still says <code>ChatClient<\/code>.<\/li><li><strong>Prompts are not portable.<\/strong> System-message handling differs (Anthropic treats it as a distinct parameter, some models want instructions in the user turn), and a prompt tuned on one model regresses on another. This is the largest practical cost and it never shows up in a compile.<\/li><li><strong>Tool calling differs<\/strong> in schema strictness, parallel call support and how a refusal is signalled.<\/li><li><strong>Structured output<\/strong> - some providers offer a native JSON or schema mode, and Spring AI&#x27;s converter falls back to instructing the model and parsing, which has a materially different failure rate.<\/li><li><strong>Multimodal, token accounting, rate-limit semantics, error taxonomies and finish reasons<\/strong> all vary, and retry and cost logic depend on all of them.<\/li><\/ul><p>So my position is that Spring AI&#x27;s portability is real at the <strong>structural<\/strong> layer - one programming model, one observability story, one set of abstractions for tools, memory and vector stores - and mostly illusory at the behavioral layer. That is still worth a great deal: switching providers becomes a re-evaluation exercise rather than a rewrite. But I plan for it explicitly - provider-specific options isolated in configuration classes, an evaluation suite that is run against any candidate model before a switch, and a documented primary and fallback rather than a vague claim that we can change any time.<\/p>", "source": "answers.md", "search": "spring ai claims portability across providers. where does that break, and what does provider-specific chatoptions do to your abstraction? the interface is portable; the behavior is not. swapping the starter compiles and then behaves differently, which is worse than failing. where it breaks: - chatoptions is the leak. the common interface covers temperature, max tokens, top-p and stop sequences. everything that differentiates a provider is in the provider-specific subtype - openaichatoptions for response format, seed, logit bias, reasoning effort and parallel tool calls; anthropicchatoptions for thinking budget and top-k; bedrock and vertex for their own guardrail and safety-filter settings. the moment you set one, your configuration is provider-specific even though your code still says chatclient. - prompts are not portable. system-message handling differs (anthropic treats it as a distinct parameter, some models want instructions in the user turn), and a prompt tuned on one model regresses on another. this is the largest practical cost and it never shows up in a compile. - tool calling differs in schema strictness, parallel call support and how a refusal is signalled. - structured output - some providers offer a native json or schema mode, and spring ai's converter falls back to instructing the model and parsing, which has a materially different failure rate. - multimodal, token accounting, rate-limit semantics, error taxonomies and finish reasons all vary, and retry and cost logic depend on all of them. so my position is that spring ai's portability is real at the structural layer - one programming model, one observability story, one set of abstractions for tools, memory and vector stores - and mostly illusory at the behavioral layer. that is still worth a great deal: switching providers becomes a re-evaluation exercise rather than a rewrite. but i plan for it explicitly - provider-specific options isolated in configuration classes, an evaluation suite that is run against any candidate model before a switch, and a documented primary and fallback rather than a vague claim that we can change any time."}, {"n": 305, "category": 20, "difficulty": "D", "html": "The document ETL pipeline - readers, transformers and writers into a <code>VectorStore<\/code>. How do you reindex without a gap in retrieval?", "answerTitle": "The document ETL pipeline and reindexing", "answer": "<p>The pipeline is three roles. <strong>Readers<\/strong> produce <code>Document<\/code>s (<code>PagePdfDocumentReader<\/code>, <code>TikaDocumentReader<\/code>, <code>JsonReader<\/code>, <code>MarkdownDocumentReader<\/code>). <strong>Transformers<\/strong> reshape them - <code>TokenTextSplitter<\/code> for chunking, <code>KeywordMetadataEnricher<\/code> and <code>SummaryMetadataEnricher<\/code> for adding retrievable metadata, plus your own for cleaning. <strong>Writers<\/strong> persist - <code>VectorStore.add()<\/code> embeds and stores, or <code>FileDocumentWriter<\/code> for inspection.<\/p><pre><code class=\"lang-java\">var docs = new TikaDocumentReader(resource).read();\nvar chunks = new TokenTextSplitter(800, 350, 5, 10000, true).apply(docs);\nchunks.forEach(d -&gt; d.getMetadata().putAll(Map.of(&quot;source&quot;, name, &quot;version&quot;, &quot;v3&quot;)));\nvectorStore.add(chunks);<\/code><\/pre><p>Two things determine retrieval quality far more than the model does: <strong>chunk size and overlap<\/strong>, and <strong>the metadata you attach<\/strong>, because metadata filters are what make multi-tenant or permission-scoped retrieval possible at all.<\/p><p>Reindexing without a gap uses the same alias reasoning as Q294, but vector stores rarely have aliases, so the version lives in metadata or in the collection name:<\/p><ol><li>Write new chunks with <code>version: v3<\/code> in their metadata alongside the existing <code>v2<\/code>.<\/li><li>Keep the retrieval filter pinned to <code>v2<\/code> while the backfill runs, so users never see a half-populated corpus.<\/li><li>Evaluate <code>v3<\/code> against a fixed question set - the same retrieval quality metrics you would use for any change.<\/li><li>Flip the filter to <code>v3<\/code> in configuration, which is instant and reversible.<\/li><li>Delete <code>v2<\/code> after a soak period.<\/li><\/ol><p>Alternatively, index into a second collection and switch the <code>VectorStore<\/code> bean&#x27;s target. Either way the principles are the same: <strong>the vector store is a derived index, never the source of record<\/strong> (same as Q295), the source documents and their checksums live somewhere you can re-run from, and a re-embedding must be assumed whenever the embedding model or its version changes - vectors from different models are not comparable, so a model upgrade is always a full reindex.<\/p>", "source": "answers.md", "search": "the document etl pipeline - readers, transformers and writers into a vectorstore. how do you reindex without a gap in retrieval? the pipeline is three roles. readers produce documents (pagepdfdocumentreader, tikadocumentreader, jsonreader, markdowndocumentreader). transformers reshape them - tokentextsplitter for chunking, keywordmetadataenricher and summarymetadataenricher for adding retrievable metadata, plus your own for cleaning. writers persist - vectorstore.add() embeds and stores, or filedocumentwriter for inspection. java var docs = new tikadocumentreader(resource).read(); var chunks = new tokentextsplitter(800, 350, 5, 10000, true).apply(docs); chunks.foreach(d - d.getmetadata().putall(map.of(\"source\", name, \"version\", \"v3\"))); vectorstore.add(chunks); two things determine retrieval quality far more than the model does: chunk size and overlap , and the metadata you attach , because metadata filters are what make multi-tenant or permission-scoped retrieval possible at all. reindexing without a gap uses the same alias reasoning as q294, but vector stores rarely have aliases, so the version lives in metadata or in the collection name: 1. write new chunks with version: v3 in their metadata alongside the existing v2. 2. keep the retrieval filter pinned to v2 while the backfill runs, so users never see a half-populated corpus. 3. evaluate v3 against a fixed question set - the same retrieval quality metrics you would use for any change. 4. flip the filter to v3 in configuration, which is instant and reversible. 5. delete v2 after a soak period. alternatively, index into a second collection and switch the vectorstore bean's target. either way the principles are the same: the vector store is a derived index, never the source of record (same as q295), the source documents and their checksums live somewhere you can re-run from, and a re-embedding must be assumed whenever the embedding model or its version changes - vectors from different models are not comparable, so a model upgrade is always a full reindex."}, {"n": 306, "category": 20, "difficulty": "D", "html": "Model Context Protocol in Spring AI - client and server starters, the transports, and how tools get discovered at runtime.", "answerTitle": "MCP in Spring AI", "answer": "<p>Model Context Protocol standardizes how a model-facing application discovers and calls external capabilities. It has three primitives - <strong>tools<\/strong> (callable functions), <strong>resources<\/strong> (readable context) and <strong>prompts<\/strong> (reusable templates) - carried over JSON-RPC.<\/p><p>Spring AI ships both sides. <code>spring-ai-starter-mcp-client<\/code> auto-configures clients from properties and exposes their tools through <code>ToolCallbackProvider<\/code>, so they enter the same tool-calling path as in-process tools (Q240):<\/p><pre><code class=\"lang-java\">ChatClient.builder(chatModel)\n    .defaultToolCallbacks(mcpToolCallbackProvider)\n    .build();<\/code><\/pre><p><code>spring-ai-starter-mcp-server-webmvc<\/code> (or the WebFlux variant) turns your own <code>@Tool<\/code>-annotated beans into an MCP server other applications can consume.<\/p><p>Transports: <strong>stdio<\/strong>, where the client launches the server as a child process and speaks over its pipes - suitable for local, desktop and CLI use, and a poor fit for a multi-instance Kubernetes deployment; and <strong>HTTP with Server-Sent Events<\/strong> (with the newer streamable-HTTP transport superseding the original SSE pairing), which is what you use for a networked server. In a Spring service I use HTTP transports exclusively - stdio means every pod spawns and supervises child processes, with no independent scaling, health checking or authentication story.<\/p><p>Discovery is at runtime: on connect the client calls <code>tools/list<\/code> and receives names, descriptions and JSON schemas, which are converted into <code>ToolCallback<\/code>s and advertised to the model. That is the power and the risk - <strong>the tool surface is defined by a remote party and can change without your release<\/strong>. Clients cache the listing and support change notifications, so a server can add tools to a running client.<\/p>", "source": "answers.md", "search": "model context protocol in spring ai - client and server starters, the transports, and how tools get discovered at runtime. model context protocol standardizes how a model-facing application discovers and calls external capabilities. it has three primitives - tools (callable functions), resources (readable context) and prompts (reusable templates) - carried over json-rpc. spring ai ships both sides. spring-ai-starter-mcp-client auto-configures clients from properties and exposes their tools through toolcallbackprovider, so they enter the same tool-calling path as in-process tools (q240): java chatclient.builder(chatmodel) .defaulttoolcallbacks(mcptoolcallbackprovider) .build(); spring-ai-starter-mcp-server-webmvc (or the webflux variant) turns your own @tool-annotated beans into an mcp server other applications can consume. transports: stdio , where the client launches the server as a child process and speaks over its pipes - suitable for local, desktop and cli use, and a poor fit for a multi-instance kubernetes deployment; and http with server-sent events (with the newer streamable-http transport superseding the original sse pairing), which is what you use for a networked server. in a spring service i use http transports exclusively - stdio means every pod spawns and supervises child processes, with no independent scaling, health checking or authentication story. discovery is at runtime: on connect the client calls tools/list and receives names, descriptions and json schemas, which are converted into toolcallbacks and advertised to the model. that is the power and the risk - the tool surface is defined by a remote party and can change without your release . clients cache the listing and support change notifications, so a server can add tools to a running client."}, {"n": 307, "category": 20, "difficulty": "A", "html": "MCP servers versus in-process tool calling - which do you choose for which capability, and what is the security boundary you must enforce for each?", "answerTitle": "MCP servers versus in-process tools", "answer": "<p>I decide on ownership and blast radius, not on novelty.<\/p><p><strong>In-process <code>@Tool<\/code> methods<\/strong> for anything that is core to this service: reading its own database, calling its own domain logic, invoking a service it already depends on. The call is a method call, the security context is right there, the latency is microseconds, it is trivially testable, and there is no new deployable. This covers most of what a typical enterprise AI feature needs, and it is where I start.<\/p><p><strong>An MCP server<\/strong> when at least one of these holds: the capability is owned by another team and should evolve on their release cycle; it is reused by several AI applications and duplicating the tool definitions would guarantee drift; it is a third-party integration where somebody already publishes a server; or it needs a different runtime, language or scaling profile. The value is a versioned, discoverable capability boundary - the same argument as extracting a service, and it deserves the same scepticism.<\/p><p>The security boundary differs sharply, and this is the part interviewers are actually testing:<\/p><ul><li><strong>In-process<\/strong>, the tool runs with the application&#x27;s full authority. The discipline is that the tool method enforces authorization itself - <code>@PreAuthorize<\/code> on the tool, the tenant taken from the <code>SecurityContext<\/code> and never from a model-supplied argument, and every parameter validated. <strong>Treat tool arguments as untrusted user input<\/strong>, because a prompt-injected document can choose them.<\/li><li><strong>With MCP<\/strong>, you additionally have a network boundary and a third party. Every model-facing risk above still applies, plus: the server must authenticate the caller (OAuth2 client credentials, not a shared token in a config file) and enforce its own authorization rather than trusting the client; the client must pin which servers it will connect to, with no dynamic registration from model output; tool descriptions arriving from a remote server are <strong>text that reaches the model&#x27;s context<\/strong>, so a malicious or compromised server can inject instructions - a genuinely new attack surface with no in-process equivalent; and a changed tool schema can silently alter behavior between deployments, so I pin versions and diff the tool listing in CI.<\/li><\/ul><p>My default: build in-process, extract to MCP when a second consumer appears, and never connect to a third-party MCP server that has not been reviewed - with human confirmation required for any tool that writes, spends or sends.<\/p>", "source": "answers.md", "search": "mcp servers versus in-process tool calling - which do you choose for which capability, and what is the security boundary you must enforce for each? i decide on ownership and blast radius, not on novelty. in-process @tool methods for anything that is core to this service: reading its own database, calling its own domain logic, invoking a service it already depends on. the call is a method call, the security context is right there, the latency is microseconds, it is trivially testable, and there is no new deployable. this covers most of what a typical enterprise ai feature needs, and it is where i start. an mcp server when at least one of these holds: the capability is owned by another team and should evolve on their release cycle; it is reused by several ai applications and duplicating the tool definitions would guarantee drift; it is a third-party integration where somebody already publishes a server; or it needs a different runtime, language or scaling profile. the value is a versioned, discoverable capability boundary - the same argument as extracting a service, and it deserves the same scepticism. the security boundary differs sharply, and this is the part interviewers are actually testing: - in-process , the tool runs with the application's full authority. the discipline is that the tool method enforces authorization itself - @preauthorize on the tool, the tenant taken from the securitycontext and never from a model-supplied argument, and every parameter validated. treat tool arguments as untrusted user input , because a prompt-injected document can choose them. - with mcp , you additionally have a network boundary and a third party. every model-facing risk above still applies, plus: the server must authenticate the caller (oauth2 client credentials, not a shared token in a config file) and enforce its own authorization rather than trusting the client; the client must pin which servers it will connect to, with no dynamic registration from model output; tool descriptions arriving from a remote server are text that reaches the model's context , so a malicious or compromised server can inject instructions - a genuinely new attack surface with no in-process equivalent; and a changed tool schema can silently alter behavior between deployments, so i pin versions and diff the tool listing in ci. my default: build in-process, extract to mcp when a second consumer appears, and never connect to a third-party mcp server that has not been reviewed - with human confirmation required for any tool that writes, spends or sends."}, {"n": 308, "category": 21, "difficulty": null, "html": "Tell me about a Spring platform decision you made that other teams had to live with.", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or three minutes, and always quantify the Result.<\/p><p>Worked examples of this style of question are in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part C, and the frameworks plus the stories to prepare are in <a href=\"../01-java/README.md\">the README<\/a>.<\/p>", "source": null, "search": "tell me about a spring platform decision you made that other teams had to live with. "}, {"n": 309, "category": 21, "difficulty": null, "html": "Describe a production incident whose root cause turned out to be a Spring mechanism.", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or three minutes, and always quantify the Result.<\/p><p>Worked examples of this style of question are in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part C, and the frameworks plus the stories to prepare are in <a href=\"../01-java/README.md\">the README<\/a>.<\/p>", "source": null, "search": "describe a production incident whose root cause turned out to be a spring mechanism. "}, {"n": 310, "category": 21, "difficulty": null, "html": "How do you keep 40 services on a consistent Spring and Java version?", "answerTitle": "Your own story", "answer": "<p>No model answer is scripted for this one on purpose - it must be your own story. Use the <strong>STAR-L<\/strong> structure (Situation, Task, Action, Result, <strong>Learning<\/strong>), keep it to two or three minutes, and always quantify the Result.<\/p><p>Worked examples of this style of question are in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part C, and the frameworks plus the stories to prepare are in <a href=\"../01-java/README.md\">the README<\/a>.<\/p>", "source": null, "search": "how do you keep 40 services on a consistent spring and java version? "}, {"n": 311, "category": 21, "difficulty": les of this style of question are in <a href=\"scenario-questions.md\">scenario-questions.md<\/a>, Part C, and the frameworks plus the stories to prepare are in <a href=\"../01-java/README.md\">the README<\/a>.<\/p>", "source": null, "search": "which widely used spring practice do you consider harmful, and how do you argue against it? "}], "difficulty": {"C": "Core", "D": "Deep", "T": "Tricky", "A": "Architect"}, "difficultyHint": {"C": "You must answer this instantly and correctly.", "D": "Requires mechanism-level detail.", "T": "The obvious answer is usually wrong.", "A": "Judged on trade-off reasoning."}}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STORE = "interview-progress-02-spring-v1";
  var THEME_KEY = "interview-quiz-theme";
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { progress = {}; }

  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var searchBox = document.getElementById("search");
  var categoryBox = document.getElementById("category");
  var statusBox = document.getElementById("status");
  var activeDifficulty = new Set();

  var catTitle = {};
  DATA.categories.forEach(function (c) {
    catTitle[c.index] = c.index + ". " + c.title;
    var opt = document.createElement("option");
    opt.value = c.index;
    opt.textContent = catTitle[c.index];
    categoryBox.appendChild(opt);
  });

  var legend = document.getElementById("legend");
  var diffFilters = document.getElementById("diffFilters");
  Object.keys(DATA.difficulty).forEach(function (key) {
    var span = document.createElement("span");
    span.className = "pill " + key;
    span.textContent = DATA.difficulty[key];
    span.title = DATA.difficultyHint[key];
    legend.appendChild(span);

    var btn = document.createElement("button");
    btn.textContent = DATA.difficulty[key];
    btn.dataset.diff = key;
    btn.addEventListener("click", function () {
      if (activeDifficulty.has(key)) { activeDifficulty.delete(key); btn.classList.remove("on"); }
      else { activeDifficulty.add(key); btn.classList.add("on"); }
      render();
    });
    diffFilters.appendChild(btn);
  });

  var KEYWORDS = /\b(abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|record|return|sealed|short|static|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while|yield|true|false|null)\b/g;

  function highlight(root) {
    root.querySelectorAll("pre code").forEach(function (block) {
      var text = block.textContent;
      var slots = [];
      function keep(cls) {
        return function (m) { slots.push('<span class="' + cls + '">' + esc(m) + "</span>"); return "\u0000" + (slots.length - 1) + "\u0000"; };
      }
      text = text.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, keep("tok-com"));
      text = text.replace(/"(?:\\.|[^"\\])*"/g, keep("tok-str"));
      text = text.replace(/@\w+/g, keep("tok-ann"));
      text = esc(text).replace(KEYWORDS, '<span class="tok-kw">$&</span>');
      block.innerHTML = text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return slots[+i]; });
    });
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function markHits(root, term) {
    if (!term) return;
    var rx = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.trim() && rx.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
      rx.lastIndex = 0;
    }
    nodes.forEach(function (node) {
      var span = document.createElement("span");
      span.innerHTML = esc(node.nodeValue).replace(rx, "<mark>$1</mark>");
      node.parentNode.replaceChild(span, node);
    });
  }

  function statusOf(n) { return progress[n] || "unseen"; }

  function setStatus(n, value) {
    if (statusOf(n) === value) delete progress[n]; else progress[n] = value;
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    render();
  }

  function card(q, term) {
    var el = document.createElement("article");
    el.className = "q";
    el.id = "q" + q.n;
    el.dataset.status = statusOf(q.n);

    var head = document.createElement("div");
    head.className = "q-head";
    head.innerHTML =
      '<a class="q-num" href="#q' + q.n + '">Q' + q.n + "</a>" +
      (q.difficulty ? '<span class="pill ' + q.difficulty + '" title="' + DATA.difficultyHint[q.difficulty] + '">' + DATA.difficulty[q.difficulty] + "</span>" : "") +
      '<h3 class="q-text">' + q.html + "</h3>";
    el.appendChild(head);

    var actions = document.createElement("div");
    actions.className = "q-actions";
    [["known", "Known"], ["review", "Review"]].forEach(function (pair) {
      var b = document.createElement("button");
      b.textContent = pair[1];
      if (statusOf(q.n) === pair[0]) b.classList.add("on");
      b.addEventListener("click", function () { setStatus(q.n, pair[0]); });
      actions.appendChild(b);
    });
    if (q.source) {
      var src = document.createElement("span");
      src.className = "src";
      src.textContent = q.source;
      actions.appendChild(src);
    }
    el.appendChild(actions);

    var details = document.createElement("details");
    details.className = "ans";
    var summary = document.createElement("summary");
    summary.textContent = q.source ? "Show answer" : "How to answer this";
    details.appendChild(summary);

    var body = document.createElement("div");
    body.className = "ans-body";
    body.innerHTML = '<p class="ans-title">' + esc(q.answerTitle) + '</p><div class="md">' + q.answer + "</div>";
    details.appendChild(body);
    el.appendChild(details);

    var rendered = false;
    details.addEventListener("toggle", function () {
      if (details.open && !rendered) { rendered = true; highlight(body); markHits(body, term); }
    });

    return el;
  }

  function render() {
    var term = searchBox.value.trim().toLowerCase();
    var cat = categoryBox.value;
    var status = statusBox.value;

    var matches = DATA.questions.filter(function (q) {
      if (term && q.search.indexOf(term) === -1) return false;
      if (cat && String(q.category) !== cat) return false;
      if (activeDifficulty.size && !activeDifficulty.has(q.difficulty)) return false;
      if (status && statusOf(q.n) !== status) return false;
      return true;
    });

    list.textContent = "";
    var lastCategory = null;
    matches.forEach(function (q) {
      if (q.category !== lastCategory) {
        lastCategory = q.category;
        var h = document.createElement("h2");
        h.className = "cat";
        h.textContent = catTitle[q.category];
        list.appendChild(h);
      }
      list.appendChild(card(q, term));
    });

    empty.hidden = matches.length > 0;

    var total = DATA.questions.length;
    var known = 0, review = 0;
    DATA.questions.forEach(function (q) {
      if (statusOf(q.n) === "known") known++;
      else if (statusOf(q.n) === "review") review++;
    });
    document.getElementById("barKnown").style.width = (known / total * 100) + "%";
    document.getElementById("barReview").style.width = (review / total * 100) + "%";
    document.getElementById("stats").innerHTML =
      "<b>" + matches.length + "</b> shown of " + total + " &nbsp;·&nbsp; " +
      "<b>" + known + "</b> known &nbsp;·&nbsp; <b>" + review + "</b> to review &nbsp;·&nbsp; " +
      "<b>" + (total - known - review) + "</b> not marked";
  }

  searchBox.addEventListener("input", render);
  categoryBox.addEventListener("change", render);
  statusBox.addEventListener("change", render);

  document.getElementById("expandAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = true; });
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    list.querySelectorAll("details.ans").forEach(function (d) { d.open = false; });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear all Known / Review marks?")) return;
    progress = {};
    try { localStorage.removeItem(STORE); } catch (e) {}
    render();
  });

  var themeBtn = document.getElementById("theme");
  var savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  applyTheme(savedTheme || "dark");
  themeBtn.addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
    if (e.key === "Escape" && document.activeElement === searchBox) { searchBox.value = ""; render(); searchBox.blur(); }
  });

  render();

  if (location.hash) {
    var target = document.querySelector(location.hash);
    if (target) { target.scrollIntoView(); var d = target.querySelector("details.ans"); if (d) d.open = true; }
  }
})();
</script>
</body>
</html>
