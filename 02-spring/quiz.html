esign the module structure and shared platform for a new 30-engineer spring estate. clarify. how many services exist today and how are they deployed? is there a platform team, or would this be a shared responsibility? what is the current pain - inconsistency, slow onboarding, upgrade paralysis, incident response? are teams aligned to domains or to layers? what is the deployment platform? that last question matters because it determines what the platform should not build (q220). the shape i would propose. service internals - a standard, documented layout so any engineer can navigate any service: com.acme.orders ├─ api controllers, dtos, exception handling ├─ domain entities, value objects, domain services, ports ├─ application use cases, transaction boundaries ├─ infrastructure jpa adapters, clients, messaging └─ config spring configuration packages rather than maven modules for most services, enforced with archunit (q233); multi-module (q250) only where the domain is complex enough to justify it. shared platform as several thin, independently versioned starters rather than one monolith (q204): - acme-observability-starter - micrometer configuration, standard tags, tracing, structured logging, correlation ids. - acme-security-starter - resource server configuration, authority mapping, standard filter chains, security headers. - acme-web-starter - problemdetail error handling, jackson configuration, standard filters. - acme-resilience-starter - resilience4j defaults, client timeouts, connection pool sizing. - acme-testing-starter - testcontainers configuration, archunit rule sets, test fixtures. every bean @conditionalonmissingbean, every feature @conditionalonproperty with a default, full configuration metadata, and a canary consumer always on the latest version. what i deliberately would not build : a service discovery layer, a config server, or anything kubernetes already provides. governance. a lightweight architecture forum with rotating membership rather than an architecture board; adrs in each repository for local decisions and a central one for cross-cutting; inner-source contribution to the starters with a review sla; and a service template (a cookiecutter or backstage scaffold) that produces a deployable, observable, secured service in minutes - which is how standards actually spread, because the standard path is the easy path. trade-offs to state. this is a real investment - roughly one to two engineers' ongoing capacity for the starters and the template. at 30 engineers that is defensible if it saves each team the same work; below about 15 engineers it is not, and copy-paste with good documentation is genuinely the right answer. i would also set a measure - time from repository creation to production deployment, and incident count attributable to missing platform concerns - so the investment is accountable."}, {"n": 259, "category": 14, "difficulty": "A", "html": "Design a modular monolith in Spring that can be split into services later without a rewrite.", "answerTitle": "A modular monolith that can be split later", "answer": "<p><strong>Clarify.<\/strong> What is driving the eventual split - scaling, team autonomy, deployment cadence, or a belief that microservices are the destination? (If nobody can answer, the right recommendation may be to stay monolithic permanently, and saying so is the senior answer.) How many teams? Is the domain understood, or still being discovered?<\/p><p><strong>The design.<\/strong> The goal is that extracting a module later is a <strong>transport change, not a redesign<\/strong>.<\/p><p><strong>Module boundaries from bounded contexts<\/strong>, one top-level package each, verified by Spring Modulith (Q247):<\/p><pre><code class=\"lang-java\">@Test void modulesAreValid() { ApplicationModules.of(Application.class).verify(); }<\/code><\/pre><p><strong>Four rules that make extraction cheap:<\/strong><\/p><ol><li><strong>No cross-module calls except through a published API.<\/strong> Each module exposes an interface in its root package; everything else is internal and Modulith enforces it. When the module becomes a service, that interface becomes the client.<\/li><li><strong>Communicate by events, not by calls, wherever the interaction is not a query.<\/strong> <code>@ApplicationModuleListener<\/code> with the event publication registry (Q248) gives at-least-once delivery inside the process, so listeners are already idempotent and already asynchronous - exactly what they must be across a network. Switching to Kafka later changes the publisher, not the logic.<\/li><li><strong>No shared database tables between modules.<\/strong> Each module owns its tables, prefixed by module name, and never joins across a boundary - it asks the other module&#x27;s API. This is the constraint teams most want to break and the one that actually determines whether extraction is possible, because a shared table cannot be split without a migration.<\/li><li><strong>No shared entities.<\/strong> Modules exchange DTOs, not JPA entities, so a schema change in one does not ripple.<\/li><\/ol><p><strong>What stays monolithic deliberately<\/strong>: one deployment, one database instance (with schema separation), one transaction manager. That is the benefit - local transactions, no distributed tracing required to debug, and refactoring boundaries is a compile-time operation while the domain is still being learned.<\/p><p><strong>The extraction path<\/strong> when a driver appears: move the module to its own deployment behind the same interface, switch the internal event publication to a broker, split the schema (which is safe because nothing joined across it), and cut traffic over with the two coexisting.<\/p><p><strong>Trade-offs.<\/strong> The rules feel like unnecessary ceremony while everything is in one process, and teams will push back - the shared-table rule especially. The honest framing is that this is <strong>option value<\/strong>: a modest, ongoing discipline that keeps a decision open. If we are certain we will never split, we should drop the rules and admit it rather than paying for an option we will not exercise.<\/p>", "source": "scenario-questions.md (S12)", "search": "design a modular monolith in spring that can be split into services later without a rewrite. clarify. what is driving the eventual split - scaling, team autonomy, deployment cadence, or a belief that microservices are the destination? (if nobody can answer, the right recommendation may be to stay monolithic permanently, and saying so is the senior answer.) how many teams? is the domain understood, or still being discovered? the design. the goal is that extracting a module later is a transport change, not a redesign . module boundaries from bounded contexts , one top-level package each, verified by spring modulith (q247): java @test void modulesarevalid() { applicationmodules.of(application.class).verify(); } four rules that make extraction cheap: 1. no cross-module calls except through a published api. each module exposes an interface in its root package; everything else is internal and modulith enforces it. when the module becomes a service, that interface becomes the client. 2. communicate by events, not by calls, wherever the interaction is not a query. @applicationmodulelistener with the event publication registry (q248) gives at-least-once delivery inside the process, so listeners are already idempotent and already asynchronous - exactly what they must be across a network. switching to kafka later changes the publisher, not the logic. 3. no shared database tables between modules. each module owns its tables, prefixed by module name, and never joins across a boundary - it asks the other module's api. this is the constraint teams most want to break and the one that actually determines whether extraction is possible, because a shared table cannot be split without a migration. 4. no shared entities. modules exchange dtos, not jpa entities, so a schema change in one does not ripple. what stays monolithic deliberately : one deployment, one database instance (with schema separation), one transaction manager. that is the benefit - local transactions, no distributed tracing required to debug, and refactoring boundaries is a compile-time operation while the domain is still being learned. the extraction path when a driver appears: move the module to its own deployment behind the same interface, switch the internal event publication to a broker, split the schema (which is safe because nothing joined across it), and cut traffic over with the two coexisting. trade-offs. the rules feel like unnecessary ceremony while everything is in one process, and teams will push back - the shared-table rule especially. the honest framing is that this is option value : a modest, ongoing discipline that keeps a decision open. if we are certain we will never split, we should drop the rules and admit it rather than paying for an option we will not exercise."}, {"n": 260, "category": 14, "difficulty": "A", "html": "Design multi-tenancy in a Spring Boot application end to end.", "answerTitle": "Multi-tenancy end to end", "answer": "<p><strong>Clarify.<\/strong> How many tenants and what is the size distribution - a long tail plus a few enterprise customers changes the answer entirely. What are the compliance and data residency requirements? Does any tenant need dedicated infrastructure contractually? Is per-tenant customization required? What is the pricing model, since it determines whether per-tenant cost attribution matters?<\/p><p><strong>Isolation model.<\/strong> I would propose a <strong>tiered<\/strong> approach, which is where most mature SaaS converges: a shared database with a tenant discriminator for the long tail, and a dedicated database for enterprise and regulated tenants. That matches cost to willingness to pay and gives an answer to &quot;we need our own database&quot; that does not require re-architecture.<\/p><p><strong>The Spring implementation, layer by layer:<\/strong><\/p><p><strong>Tenant resolution<\/strong> - from the authenticated token only, never a header or parameter the client controls:<\/p><pre><code class=\"lang-java\">String tenant = jwt.getClaimAsString(&quot;tenant&quot;);   // authoritative<\/code><\/pre><p>Resolved once in a filter into a request-scoped holder, and propagated explicitly to async and messaging paths with a <code>TaskDecorator<\/code> (Q95) - ambient state that silently disappears on a background thread is how cross-tenant leaks happen.<\/p><p><strong>Data isolation, enforced at the lowest layer<\/strong> so a developer who forgets a predicate cannot leak:<\/p><ul><li>Shared schema: PostgreSQL <strong>row-level security<\/strong> with the tenant set as a session variable on connection checkout, or a Hibernate <code>@Filter<\/code> enabled globally. RLS is stronger because it is enforced by the database regardless of the code path, including ad-hoc queries.<\/li><li>Dedicated database: an <code>AbstractRoutingDataSource<\/code> keyed on the tenant, with a connection pool per tenant - which is the operational constraint, since pools multiply.<\/li><\/ul><p><strong>Everything else must carry the tenant<\/strong>: cache keys (a tenant-prefixed key generator, or a leak on first cache hit), queue messages, log lines, metrics tags (as a <em>low-cardinality<\/em> tag only if tenant count is bounded - see Q191), S3 prefixes, and vector store filters if there is an AI feature (Q241).<\/p><p><strong>Noisy neighbours<\/strong>: per-tenant rate limits, bounded concurrency per tenant so one cannot consume the pool, statement timeouts so an expensive query cannot saturate the database, and separate queues or priority lanes for large tenants.<\/p><p><strong>Operations<\/strong>: automated onboarding and offboarding including complete deletion (GDPR has a deadline), per-tenant metrics without which noisy-neighbour incidents are undiagnosable, and a migration strategy across thousands of tenants with per-tenant progress tracking rather than one script.<\/p><p><strong>Verification.<\/strong> This is a security control, so it gets tested like one: an automated suite authenticating as tenant A and asserting <strong>404<\/strong> (not 403 - do not confirm existence) on every tenant B resource, run in CI. And a periodic scan for queries lacking a tenant predicate.<\/p><p><strong>Trade-offs to state.<\/strong> Shared schema is cheapest and densest with the highest blast radius from a single bug; database-per-tenant is the strongest isolation, easiest per-tenant restore and residency story, and the heaviest operationally. The tiered model costs the complexity of supporting both, and I would be explicit that this is a deliberate purchase rather than an accident.<\/p>", "source": "scenario-questions.md (S13)", "search": "design multi-tenancy in a spring boot application end to end. clarify. how many tenants and what is the size distribution - a long tail plus a few enterprise customers changes the answer entirely. what are the compliance and data residency requirements? does any tenant need dedicated infrastructure contractually? is per-tenant customization required? what is the pricing model, since it determines whether per-tenant cost attribution matters? isolation model. i would propose a tiered approach, which is where most mature saas converges: a shared database with a tenant discriminator for the long tail, and a dedicated database for enterprise and regulated tenants. that matches cost to willingness to pay and gives an answer to \"we need our own database\" that does not require re-architecture. the spring implementation, layer by layer: tenant resolution - from the authenticated token only, never a header or parameter the client controls: java string tenant = jwt.getclaimasstring(\"tenant\"); // authoritative resolved once in a filter into a request-scoped holder, and propagated explicitly to async and messaging paths with a taskdecorator (q95) - ambient state that silently disappears on a background thread is how cross-tenant leaks happen. data isolation, enforced at the lowest layer so a developer who forgets a predicate cannot leak: - shared schema: postgresql row-level security with the tenant set as a session variable on connection checkout, or a hibernate @filter enabled globally. rls is stronger because it is enforced by the database regardless of the code path, including ad-hoc queries. - dedicated database: an abstractroutingdatasource keyed on the tenant, with a connection pool per tenant - which is the operational constraint, since pools multiply. everything else must carry the tenant : cache keys (a tenant-prefixed key generator, or a leak on first cache hit), queue messages, log lines, metrics tags (as a low-cardinality tag only if tenant count is bounded - see q191), s3 prefixes, and vector store filters if there is an ai feature (q241). noisy neighbours : per-tenant rate limits, bounded concurrency per tenant so one cannot consume the pool, statement timeouts so an expensive query cannot saturate the database, and separate queues or priority lanes for large tenants. operations : automated onboarding and offboarding including complete deletion (gdpr has a deadline), per-tenant metrics without which noisy-neighbour incidents are undiagnosable, and a migration strategy across thousands of tenants with per-tenant progress tracking rather than one script. verification. this is a security control, so it gets tested like one: an automated suite authenticating as tenant a and asserting 404 (not 403 - do not confirm existence) on every tenant b resource, run in ci. and a periodic scan for queries lacking a tenant predicate. trade-offs to state. shared schema is cheapest and densest with the highest blast radius from a single bug; database-per-tenant is the strongest isolation, easiest per-tenant restore and residency story, and the heaviest operationally. the tiered model costs the complexity of supporting both, and i would be explicit that this is a deliberate purchase rather than an accident."}, {"n": 261, "category": 14, "difficulty": "A", "html": "Design an idempotent, fully observable Kafka consumer service in Spring.", "answerTitle": "An idempotent, observable Kafka consumer", "answer": "<p><strong>Clarify.<\/strong> What is the message volume and the ordering requirement - global, per key, or none? What is the effect of processing - a database write, an external call, or both? What is the acceptable end-to-end latency? What should happen to a message that can never succeed? Is replay of history a requirement?<\/p><p><strong>The design.<\/strong><\/p><p><strong>Consumption.<\/strong> <code>@KafkaListener<\/code> with <code>concurrency<\/code> set to the partition count for this instance count, auto-commit <strong>disabled<\/strong>, and manual acknowledgment after successful processing (Q215). <code>ErrorHandlingDeserializer<\/code> wrapping the value deserializer, so a poison message becomes a handled failure rather than an infinite crash loop.<\/p><p><strong>Idempotency<\/strong> - the core requirement, because delivery is at-least-once and no configuration changes that (Q216):<\/p><pre><code class=\"lang-java\">@Transactional\npublic void handle(OrderEvent event) {\n    if (!inbox.recordIfNew(event.messageId())) return;   // unique constraint\n    orderService.apply(event);\n}<\/code><\/pre><p>The inbox insert and the business effect commit in <strong>one local transaction<\/strong>, so a redelivery is a no-op enforced by the database rather than by a check-then-act race. The inbox table gets a retention policy, since it grows forever otherwise.<\/p><p><strong>Ordering.<\/strong> Key by aggregate ID so all events for one entity land on one partition and are processed in order. If throughput requires more parallelism than partitions allow, dispatch within the consumer to a bounded worker pool <strong>keyed by the message key<\/strong>, preserving per-entity order while scaling.<\/p><p><strong>Error handling, by class of failure:<\/strong><\/p><ul><li><strong>Transient<\/strong> (downstream timeout) - <code>DefaultErrorHandler<\/code> with exponential backoff, or better <code>@RetryableTopic<\/code> so retries move to delay topics and do not block the partition.<\/li><li><strong>Permanent<\/strong> (validation failure, unknown schema) - <code>addNotRetryableExceptions<\/code> so it goes straight to the DLT rather than retrying ten times.<\/li><li><strong>DLT<\/strong> - alerted on, never silently accumulating, with the failure reason in headers and a documented, throttled replay path (<code>01-java<\/code> Q186).<\/li><\/ul><p><strong>External calls.<\/strong> Outside the database transaction, with a circuit breaker, and an idempotency key propagated so the downstream can deduplicate too.<\/p><p><strong>Observability<\/strong> - the &quot;fully observable&quot; half of the question:<\/p><ul><li><strong>Consumer lag and lag growth rate<\/strong> as the primary alert - lag alone tells you there is a problem, the rate tells you before it is one.<\/li><li>Per-message processing time as a <code>Timer<\/code>, so the bottleneck is visible without an incident.<\/li><li>Trace context extracted from message headers and continued, so a trace spans producer and consumer (<code>01-java<\/code> Q177).<\/li><li>Counters for processed, deduplicated, retried and dead-lettered - the deduplication counter is the one that proves idempotency is actually working.<\/li><li>DLT depth alert, rebalance rate, and structured logs carrying message ID, key, partition, offset and trace ID.<\/li><\/ul><p><strong>Lifecycle.<\/strong> Graceful shutdown that finishes the in-flight message and commits the offset before exit (Q189), so a deployment does not manufacture redeliveries.<\/p><p><strong>Trade-offs.<\/strong> The inbox adds a write per message and a table to maintain; at very high volume a bounded deduplication cache in Redis with a TTL is a cheaper approximation, trading a small correctness window for throughput. I would name that as the scaling path rather than building it up front.<\/p>", "source": "scenario-questions.md (S14)", "search": "design an idempotent, fully observable kafka consumer service in spring. clarify. what is the message volume and the ordering requirement - global, per key, or none? what is the effect of processing - a database write, an external call, or both? what is the acceptable end-to-end latency? what should happen to a message that can never succeed? is replay of history a requirement? the design. consumption. @kafkalistener with concurrency set to the partition count for this instance count, auto-commit disabled , and manual acknowledgment after successful processing (q215). errorhandlingdeserializer wrapping the value deserializer, so a poison message becomes a handled failure rather than an infinite crash loop. idempotency - the core requirement, because delivery is at-least-once and no configuration changes that (q216): java @transactional public void handle(orderevent event) { if (!inbox.recordifnew(event.messageid())) return; // unique constraint orderservice.apply(event); } the inbox insert and the business effect commit in one local transaction , so a redelivery is a no-op enforced by the database rather than by a check-then-act race. the inbox table gets a retention policy, since it grows forever otherwise. ordering. key by aggregate id so all events for one entity land on one partition and are processed in order. if throughput requires more parallelism than partitions allow, dispatch within the consumer to a bounded worker pool keyed by the message key , preserving per-entity order while scaling. error handling, by class of failure: - transient (downstream timeout) - defaulterrorhandler with exponential backoff, or better @retryabletopic so retries move to delay topics and do not block the partition. - permanent (validation failure, unknown schema) - addnotretryableexceptions so it goes straight to the dlt rather than retrying ten times. - dlt - alerted on, never silently accumulating, with the failure reason in headers and a documented, throttled replay path (01-java q186). external calls. outside the database transaction, with a circuit breaker, and an idempotency key propagated so the downstream can deduplicate too. observability - the \"fully observable\" half of the question: - consumer lag and lag growth rate as the primary alert - lag alone tells you there is a problem, the rate tells you before it is one. - per-message processing time as a timer, so the bottleneck is visible without an incident. - trace context extracted from message headers and continued, so a trace spans producer and consumer (01-java q177). - counters for processed, deduplicated, retried and dead-lettered - the deduplication counter is the one that proves idempotency is actually working. - dlt depth alert, rebalance rate, and structured logs carrying message id, key, partition, offset and trace id. lifecycle. graceful shutdown that finishes the in-flight message and commits the offset before exit (q189), so a deployment does not manufacture redeliveries. trade-offs. the inbox adds a write per message and a table to maintain; at very high volume a bounded deduplication cache in redis with a ttl is a cheaper approximation, trading a small correctness window for throughput. i would name that as the scaling path rather than building it up front."}, {"n": 262, "category": 14, "difficulty": "A", "html": "Plan a Boot 2.7 to Boot 3 migration across 40 services.", "answerTitle": "Boot 2.7 to Boot 3 across 40 services", "answer": "<p><strong>Clarify.<\/strong> What is the current spread - all on 2.7, or a range back to 2.3? Are all on Java 17 already? Is there a shared BOM or platform starter? How many teams, and what is their capacity? Is anything forcing the timeline - a CVE, an end-of-support date, a dependency requiring Boot 3? What third-party and internal libraries are shared?<\/p><p><strong>Decide the approach.<\/strong> Not 40 parallel migrations, and not one big-bang. A <strong>pathfinder then wave<\/strong> model, because the first migration discovers the problems and every subsequent one should be cheaper.<\/p><p><strong>Execute.<\/strong><\/p><p><strong>Phase 0 - Prepare (2-3 weeks).<\/strong><\/p><ul><li>Get every service to <strong>Java 17 and Boot 2.7.x latest<\/strong> first. Two migrations at once makes failures unattributable.<\/li><li>Fix all deprecation warnings on 2.7 - most Boot 3 breakages are things 2.7 already warned about.<\/li><li><strong>Inventory the dependencies<\/strong> across all 40 services and identify which lack Jakarta-compatible versions (Q252). This is the long pole and it is external to you, so it must start first. Anything with no upgrade path needs a decision - replace, fork, or isolate.<\/li><li>Upgrade the internal shared libraries to publish Jakarta-compatible artifacts, and to ship both <code>spring.factories<\/code> and <code>AutoConfiguration.imports<\/code> during the transition (Q185).<\/li><\/ul><p><strong>Phase 1 - Pathfinder (2-3 weeks).<\/strong> One real but non-critical service, migrated by the platform team <em>with<\/em> the owning team. Produce:<\/p><ul><li>A migration runbook with the actual issues encountered, not the generic guide.<\/li><li>An OpenRewrite recipe covering the mechanical changes.<\/li><li>A documented Security 5 to 6 change list for the estate&#x27;s common patterns (Q253).<\/li><li>A realistic effort estimate per service, sized by category.<\/li><\/ul><p><strong>Phase 2 - Waves.<\/strong> Group services by similarity and risk, simplest and lowest-risk first. Each wave: automated pull request from the recipe, team review, the <strong>authorization test matrix<\/strong> run before and after (Q253), canary deployment with authentication success rate and error rate as promotion gates, then full rollout. Wave retrospectives feed back into the runbook.<\/p><p><strong>Phase 3 - Long tail.<\/strong> The services with genuinely blocked dependencies. These need individual decisions and executive visibility, because they are the ones that stall indefinitely.<\/p><p><strong>Risk controls throughout.<\/strong> Every service independently deployable and rollback-able; nothing else changing during the migration (no feature work in the same release); <code>spring-boot-properties-migrator<\/code> in each service for one release to surface configuration changes (Q254); and a canary period per wave rather than per service.<\/p><p><strong>Reporting.<\/strong> A single dashboard of services by version, updated automatically, with a target date. Visible progress is what keeps a months-long migration from stalling once the initial energy fades.<\/p><p><strong>The framing for leadership.<\/strong> Not &quot;we need to upgrade the framework&quot;, but: the current version loses support on a date, after which security patches stop; the cost of doing this deliberately over one quarter is X, and the cost of doing it under CVE pressure later is several times that plus unplanned outage risk. Attach the date and the number - that is what turns it from an engineering preference into a decision they can make.<\/p>", "source": "scenario-questions.md (S15)", "search": "plan a boot 2.7 to boot 3 migration across 40 services. clarify. what is the current spread - all on 2.7, or a range back to 2.3? are all on java 17 already? is there a shared bom or platform starter? how many teams, and what is their capacity? is anything forcing the timeline - a cve, an end-of-support date, a dependency requiring boot 3? what third-party and internal libraries are shared? decide the approach. not 40 parallel migrations, and not one big-bang. a pathfinder then wave model, because the first migration discovers the problems and every subsequent one should be cheaper. execute. phase 0 - prepare (2-3 weeks). - get every service to java 17 and boot 2.7.x latest first. two migrations at once makes failures unattributable. - fix all deprecation warnings on 2.7 - most boot 3 breakages are things 2.7 already warned about. - inventory the dependencies across all 40 services and identify which lack jakarta-compatible versions (q252). this is the long pole and it is external to you, so it must start first. anything with no upgrade path needs a decision - replace, fork, or isolate. - upgrade the internal shared libraries to publish jakarta-compatible artifacts, and to ship both spring.factories and autoconfiguration.imports during the transition (q185). phase 1 - pathfinder (2-3 weeks). one real but non-critical service, migrated by the platform team with the owning team. produce: - a migration runbook with the actual issues encountered, not the generic guide. - an openrewrite recipe covering the mechanical changes. - a documented security 5 to 6 change list for the estate's common patterns (q253). - a realistic effort estimate per service, sized by category. phase 2 - waves. group services by similarity and risk, simplest and lowest-risk first. each wave: automated pull request from the recipe, team review, the authorization test matrix run before and after (q253), canary deployment with authentication success rate and error rate as promotion gates, then full rollout. wave retrospectives feed back into the runbook. phase 3 - long tail. the services with genuinely blocked dependencies. these need individual decisions and executive visibility, because they are the ones that stall indefinitely. risk controls throughout. every service independently deployable and rollback-able; nothing else changing during the migration (no feature work in the same release); spring-boot-properties-migrator in each service for one release to surface configuration changes (q254); and a canary period per wave rather than per service. reporting. a single dashboard of services by version, updated automatically, with a target date. visible progress is what keeps a months-long migration from stalling once the initial energy fades. the framing for leadership. not \"we need to upgrade the framework\", but: the current version loses support on a date, after which security patches stop; the cost of doing this deliberately over one quarter is x, and the cost of doing it under cve pressure later is several times that plus unplanned outage risk. attach the date and the number - that is what turns it from an engineering preference into a decision they can make."}, {"n": 263, "category": 15, "difficulty": "C", "html": "STOMP over WebSocket in Spring - what does the handshake look like, and what does the simple broker actually do?", "answerTitle": "STOMP over WebSocket", "answer": "<p>WebSocket gives you a bidirectional byte pipe and nothing else - no routing, no addressing, no acknowledgment. STOMP is a small text protocol layered on top that adds <code>CONNECT<\/code>, <code>SUBSCRIBE<\/code>, <code>SEND<\/code> and destinations, which is what lets Spring apply its usual programming model to messages.<\/p><p>The sequence: the client issues an HTTP <code>GET<\/code> with <code>Upgrade: websocket<\/code>; a <code>HandshakeInterceptor<\/code> can inspect and copy attributes from the HTTP request into the WebSocket session; the handshake completes and the connection switches protocols. From then on nothing is HTTP - no filters, no <code>HttpServletRequest<\/code>, no per-request security.<\/p><pre><code class=\"lang-java\">@Configuration @EnableWebSocketMessageBroker\nclass WsConfig implements WebSocketMessageBrokerConfigurer {\n  public void registerStompEndpoints(StompEndpointRegistry r) {\n    r.addEndpoint(&quot;/ws&quot;).setAllowedOrigins(&quot;https://app.example.com&quot;);\n  }\n  public void configureMessageBroker(MessageBrokerRegistry r) {\n    r.setApplicationDestinationPrefixes(&quot;/app&quot;);   // routed to @MessageMapping\n    r.enableSimpleBroker(&quot;/topic&quot;, &quot;/queue&quot;);      // in-memory broker\n  }\n}<\/code><\/pre><p>The <strong>simple broker<\/strong> is an in-memory subscription registry with a scheduled heartbeat thread. It keeps a map of destination to sessions and writes messages out. It does not persist, does not acknowledge, does not survive a restart, and does not know about other instances - which is Q265.<\/p>", "source": "answers.md", "search": "stomp over websocket in spring - what does the handshake look like, and what does the simple broker actually do? websocket gives you a bidirectional byte pipe and nothing else - no routing, no addressing, no acknowledgment. stomp is a small text protocol layered on top that adds connect, subscribe, send and destinations, which is what lets spring apply its usual programming model to messages. the sequence: the client issues an http get with upgrade: websocket; a handshakeinterceptor can inspect and copy attributes from the http request into the websocket session; the handshake completes and the connection switches protocols. from then on nothing is http - no filters, no httpservletrequest, no per-request security. java @configuration @enablewebsocketmessagebroker class wsconfig implements websocketmessagebrokerconfigurer { public void registerstompendpoints(stompendpointregistry r) { r.addendpoint(\"/ws\").setallowedorigins(\"https://app.example.com\"); } public void configuremessagebroker(messagebrokerregistry r) { r.setapplicationdestinationprefixes(\"/app\"); // routed to @messagemapping r.enablesimplebroker(\"/topic\", \"/queue\"); // in-memory broker } } the simple broker is an in-memory subscription registry with a scheduled heartbeat thread. it keeps a map of destination to sessions and writes messages out. it does not persist, does not acknowledge, does not survive a restart, and does not know about other instances - which is q265."}, {"n": 264, "category": 15, "difficulty": "D", "html": "<code>@MessageMapping<\/code>, <code>@SendTo<\/code> and <code>SimpMessagingTemplate<\/code> - how does a message reach one specific user rather than everyone?", "answerTitle": "`@MessageMapping` and user destinations", "answer": "<p><code>@MessageMapping(&quot;/chat/{room}&quot;)<\/code> handles an inbound frame on an application destination; <code>@SendTo(&quot;/topic/room/{room}&quot;)<\/code> publishes the return value to a broadcast destination. Both run on the <code>clientInboundChannel<\/code> executor, not a servlet thread.<\/p><p>For a single user, the mechanism is the <strong>user destination<\/strong>. <code>SimpMessagingTemplate.convertAndSendToUser(&quot;alice&quot;, &quot;/queue/alerts&quot;, payload)<\/code> rewrites the destination to a session-unique one (<code>/queue/alerts-user&lt;sessionId&gt;<\/code>) that only that user&#x27;s session is subscribed to; the client subscribes to the plain <code>/user/queue/alerts<\/code>. <code>@SendToUser<\/code> does the same for a return value. The identity comes from <code>Principal<\/code> on the message, which is whatever the handshake established.<\/p><pre><code class=\"lang-java\">simpMessagingTemplate.convertAndSendToUser(order.getOwner(), &quot;/queue/orders&quot;, event);<\/code><\/pre><p><code>SimpMessagingTemplate<\/code> is also how a normal REST controller, a Kafka listener or a scheduled job pushes to a connected client - which is usually the real requirement, not chat.<\/p>", "source": "answers.md", "search": "@messagemapping, @sendto and simpmessagingtemplate - how does a message reach one specific user rather than everyone? @messagemapping(\"/chat/{room}\") handles an inbound frame on an application destination; @sendto(\"/topic/room/{room}\") publishes the return value to a broadcast destination. both run on the clientinboundchannel executor, not a servlet thread. for a single user, the mechanism is the user destination . simpmessagingtemplate.convertandsendtouser(\"alice\", \"/queue/alerts\", payload) rewrites the destination to a session-unique one (/queue/alerts-user<sessionid ) that only that user's session is subscribed to; the client subscribes to the plain /user/queue/alerts. @sendtouser does the same for a return value. the identity comes from principal on the message, which is whatever the handshake established. java simpmessagingtemplate.convertandsendtouser(order.getowner(), \"/queue/orders\", event); simpmessagingtemplate is also how a normal rest controller, a kafka listener or a scheduled job pushes to a connected client - which is usually the real requirement, not chat."}, {"n": 265, "category": 15, "difficulty": "T", "html": "Your WebSocket application works on one instance and breaks on three. Explain why, and what a broker relay changes.", "answerTitle": "Scaling WebSocket across instances", "answer": "<p>The simple broker&#x27;s subscription registry is <strong>local to the JVM<\/strong>. With three instances behind a load balancer, Alice is connected to instance 1 and the event that concerns her is produced on instance 3, which has no idea she exists. The message is silently dropped - no error, which is why this reaches production.<\/p><p>Three fixes, in increasing order of correctness:<\/p><ol><li><strong>Sticky sessions<\/strong> - does not help at all. It keeps a client pinned, but the <em>publisher<\/em> is still on the wrong instance.<\/li><li><strong>A shared broker relay<\/strong> - <code>enableStompBrokerRelay(&quot;/topic&quot;, &quot;/queue&quot;)<\/code> pointing at RabbitMQ or ActiveMQ with the STOMP plugin. Spring stops being the broker and becomes a proxy; subscriptions and messages live in the broker, so any instance can publish to any client. This is the supported answer, and it also gives you persistence and flow control.<\/li><li><strong>A pub/sub side channel<\/strong> - publish to Redis or Kafka and have every instance re-broadcast locally. Cheaper to run, but you have written a broker with no acknowledgment or backpressure, and every instance now processes every message.<\/li><\/ol><p>Related capacity point: each connection holds a socket, buffers and a session for its whole lifetime. <code>setSendTimeLimit<\/code> and <code>setSendBufferSizeLimit<\/code> matter, because one slow client otherwise consumes heap until the connection is force-closed.<\/p>", "source": "answers.md", "search": "your websocket application works on one instance and breaks on three. explain why, and what a broker relay changes. the simple broker's subscription registry is local to the jvm . with three instances behind a load balancer, alice is connected to instance 1 and the event that concerns her is produced on instance 3, which has no idea she exists. the message is silently dropped - no error, which is why this reaches production. three fixes, in increasing order of correctness: 1. sticky sessions - does not help at all. it keeps a client pinned, but the publisher is still on the wrong instance. 2. a shared broker relay - enablestompbrokerrelay(\"/topic\", \"/queue\") pointing at rabbitmq or activemq with the stomp plugin. spring stops being the broker and becomes a proxy; subscriptions and messages live in the broker, so any instance can publish to any client. this is the supported answer, and it also gives you persistence and flow control. 3. a pub/sub side channel - publish to redis or kafka and have every instance re-broadcast locally. cheaper to run, but you have written a broker with no acknowledgment or backpressure, and every instance now processes every message. related capacity point: each connection holds a socket, buffers and a session for its whole lifetime. setsendtimelimit and setsendbuffersizelimit matter, because one slow client otherwise consumes heap until the connection is force-closed."}, {"n": 266, "category": 15, "difficulty": "D", "html": "Authenticating a WebSocket connection - at the HTTP handshake or per STOMP frame? What is available in each case?", "answerTitle": "Authenticating a WebSocket", "answer": "<p>Two places, and the distinction matters.<\/p><p><strong>At the handshake<\/strong> the request is still HTTP, so the security filter chain, cookies and the <code>SecurityContext<\/code> all apply. Securing <code>/ws<\/code> in <code>authorizeHttpRequests<\/code> and copying the authenticated <code>Principal<\/code> into the session is the simplest correct approach for a browser client with a session cookie.<\/p><p><strong>Per STOMP frame<\/strong> is required when the credential is a bearer token, because browsers cannot set headers on the WebSocket handshake. The client sends the token in the <code>CONNECT<\/code> frame and you authenticate in a <code>ChannelInterceptor<\/code>:<\/p><pre><code class=\"lang-java\">@Override public void configureClientInboundChannel(ChannelRegistration reg) {\n  reg.interceptors(new ChannelInterceptor() {\n    public Message&lt;?&gt; preSend(Message&lt;?&gt; msg, MessageChannel ch) {\n      var acc = StompHeaderAccessor.wrap(msg);\n      if (StompCommand.CONNECT.equals(acc.getCommand())) {\n        acc.setUser(jwtAuthenticate(acc.getFirstNativeHeader(&quot;Authorization&quot;)));\n      }\n      return msg;\n    }\n  });\n}<\/code><\/pre><p>Two things people get wrong. First, <strong>the connection outlives the token<\/strong> - a 15-minute JWT on a connection open for six hours is authenticated by something long expired, so you need a re-authentication frame or a server-side expiry that closes the socket. Second, authorization is <em>per destination<\/em>, not per URL: <code>@PreAuthorize<\/code> on the <code>@MessageMapping<\/code> method, or <code>AuthorizationManager<\/code>-based message security, because subscribing to <code>/topic/admin<\/code> is an access decision no HTTP rule will ever see.<\/p>", "source": "answers.md", "search": "authenticating a websocket connection - at the http handshake or per stomp frame? what is available in each case? two places, and the distinction matters. at the handshake the request is still http, so the security filter chain, cookies and the securitycontext all apply. securing /ws in authorizehttprequests and copying the authenticated principal into the session is the simplest correct approach for a browser client with a session cookie. per stomp frame is required when the credential is a bearer token, because browsers cannot set headers on the websocket handshake. the client sends the token in the connect frame and you authenticate in a channelinterceptor: java @override public void configureclientinboundchannel(channelregistration reg) { reg.interceptors(new channelinterceptor() { public message<? presend(message<? msg, messagechannel ch) { var acc = stompheaderaccessor.wrap(msg); if (stompcommand.connect.equals(acc.getcommand())) { acc.setuser(jwtauthenticate(acc.getfirstnativeheader(\"authorization\"))); } return msg; } }); } two things people get wrong. first, the connection outlives the token - a 15-minute jwt on a connection open for six hours is authenticated by something long expired, so you need a re-authentication frame or a server-side expiry that closes the socket. second, authorization is per destination , not per url: @preauthorize on the @messagemapping method, or authorizationmanager-based message security, because subscribing to /topic/admin is an access decision no http rule will ever see."}, {"n": 267, "category": 15, "difficulty": "T", "html": "WebSocket versus SSE versus long polling - which do you choose, and what does a load balancer, proxy or corporate firewall do to each?", "answerTitle": "WebSocket, SSE and polling", "answer": "<table><thead><tr><th><\/th><th>WebSocket<\/th><th>SSE<\/th><th>Long polling<\/th><\/tr><\/thead><tbody><tr><td>Direction<\/td><td>Bidirectional<\/td><td>Server to client<\/td><td>Request/response<\/td><\/tr><tr><td>Transport<\/td><td>Upgrade, not HTTP after<\/td><td>Plain HTTP streaming<\/td><td>Plain HTTP<\/td><\/tr><tr><td>Reconnect<\/td><td>You implement it<\/td><td>Built into <code>EventSource<\/code>, with <code>Last-Event-ID<\/code><\/td><td>Natural<\/td><\/tr><tr><td>Proxy friendliness<\/td><td>Needs <code>Upgrade<\/code> support end to end<\/td><td>Works everywhere<\/td><td>Works everywhere<\/td><\/tr><tr><td>Server cost<\/td><td>Connection + session<\/td><td>Connection<\/td><td>Connection churn<\/td><\/tr><\/tbody><\/table><p>My default is <strong>SSE for server-push, WebSocket only when the client genuinely pushes too<\/strong> - dashboards, notifications, progress and streamed LLM tokens are all one-directional, and SSE gets automatic reconnect with event replay for free.<\/p><p>What the infrastructure does to each is the part candidates miss. Layer-7 proxies, corporate middleboxes and some API gateways strip the <code>Upgrade<\/code> header or fail to route it, so WebSocket fails in exactly the enterprise networks you cannot test from. Buffering proxies break SSE unless you disable buffering and send a periodic comment heartbeat, otherwise nothing arrives until the buffer fills. Idle timeouts on the load balancer (60 seconds on an AWS ALB by default) close both unless a heartbeat keeps them warm. And with HTTP/1.1 the browser&#x27;s six-connections-per-origin limit makes SSE tabs starve the rest of the page - HTTP/2 removes that.<\/p>", "source": "answers.md", "search": "websocket versus sse versus long polling - which do you choose, and what does a load balancer, proxy or corporate firewall do to each? websocket sse long polling --- --- --- --- direction bidirectional server to client request/response transport upgrade, not http after plain http streaming plain http reconnect you implement it built into eventsource, with last-event-id natural proxy friendliness needs upgrade support end to end works everywhere works everywhere server cost connection + session connection connection churn my default is sse for server-push, websocket only when the client genuinely pushes too - dashboards, notifications, progress and streamed llm tokens are all one-directional, and sse gets automatic reconnect with event replay for free. what the infrastructure does to each is the part candidates miss. layer-7 proxies, corporate middleboxes and some api gateways strip the upgrade header or fail to route it, so websocket fails in exactly the enterprise networks you cannot test from. buffering proxies break sse unless you disable buffering and send a periodic comment heartbeat, otherwise nothing arrives until the buffer fills. idle timeouts on the load balancer (60 seconds on an aws alb by default) close both unless a heartbeat keeps them warm. and with http/1.1 the browser's six-connections-per-origin limit makes sse tabs starve the rest of the page - http/2 removes that."}, {"n": 268, "category": 15, "difficulty": "D", "html": "Spring HATEOAS - <code>RepresentationModel<\/code>, <code>EntityModel<\/code>, <code>Link<\/code> and the HAL media type. What does an assembler give you?", "answerTitle": "Spring HATEOAS", "answer": "<p><code>RepresentationModel<\/code> is the base carrying a <code>Links<\/code> collection; <code>EntityModel&lt;T&gt;<\/code> wraps a payload with links; <code>CollectionModel&lt;T&gt;<\/code> wraps many; <code>PagedModel<\/code> adds pagination links. <code>WebMvcLinkBuilder.linkTo(methodOn(...))<\/code> builds URIs from the controller mapping rather than string concatenation, so a path change does not silently produce broken links.<\/p><pre><code class=\"lang-java\">EntityModel.of(order,\n    linkTo(methodOn(OrderController.class).one(order.getId())).withSelfRel(),\n    linkTo(methodOn(OrderController.class).cancel(order.getId())).withRel(&quot;cancel&quot;));<\/code><\/pre><p>A <code>RepresentationModelAssembler<\/code> moves that out of the controller into one testable place per resource, which matters because the value of hypermedia is consistency - links added ad hoc in handlers drift immediately. The default media type is HAL (<code>application/hal+json<\/code>); HAL-FORMS additionally describes the <em>inputs<\/em> an affordance needs, which is what makes a generic client possible.<\/p><p>The genuinely useful pattern is <strong>state-dependent affordances<\/strong>: include the <code>cancel<\/code> link only when the order is actually cancellable. The client stops encoding your state machine.<\/p>", "source": "answers.md", "search": "spring hateoas - representationmodel, entitymodel, link and the hal media type. what does an assembler give you? representationmodel is the base carrying a links collection; entitymodel<t wraps a payload with links; collectionmodel<t wraps many; pagedmodel adds pagination links. webmvclinkbuilder.linkto(methodon(...)) builds uris from the controller mapping rather than string concatenation, so a path change does not silently produce broken links. java entitymodel.of(order, linkto(methodon(ordercontroller.class).one(order.getid())).withselfrel(), linkto(methodon(ordercontroller.class).cancel(order.getid())).withrel(\"cancel\")); a representationmodelassembler moves that out of the controller into one testable place per resource, which matters because the value of hypermedia is consistency - links added ad hoc in handlers drift immediately. the default media type is hal (application/hal+json); hal-forms additionally describes the inputs an affordance needs, which is what makes a generic client possible. the genuinely useful pattern is state-dependent affordances : include the cancel link only when the order is actually cancellable. the client stops encoding your state machine."}, {"n": 269, "category": 15, "difficulty": "A", "html": "When does hypermedia genuinely earn its cost, and why do most REST APIs stop at level 2 of the Richardson model?", "answerTitle": "When hypermedia earns its cost", "answer": "<p>It earns its cost when the <em>client is not yours and cannot be redeployed with you<\/em>: long-lived partner integrations, public APIs with many independent consumers, or a generic UI driven by the API&#x27;s own description. In those cases, moving the state machine into the response is what lets you change flow without a coordinated release, and HAL-FORMS lets a client render actions it was never coded for.<\/p><p>It does not earn its cost in the common case: a single-page application and a mobile app, both written by the same organization, released alongside the API. The client already knows the URIs and the state machine, so the links are payload nobody reads, and every one of them costs a link builder, a test and bytes on the wire.<\/p><p>Why most APIs stop at Richardson level 2: the benefit only materializes if clients actually follow links instead of templating URLs, and almost none do - the moment one client hardcodes <code>/orders/{id}/cancel<\/code>, you have all the cost and none of the freedom. I would rather invest in an OpenAPI contract, consumer-driven contract tests and a clear versioning policy, which solve the real coupling problem for internal clients. The position to state in an interview is not &quot;HATEOAS is bad&quot; but &quot;hypermedia is a coupling trade, and I only pay for it where I cannot coordinate releases&quot;.<\/p>", "source": "answers.md", "search": "when does hypermedia genuinely earn its cost, and why do most rest apis stop at level 2 of the richardson model? it earns its cost when the client is not yours and cannot be redeployed with you : long-lived partner integrations, public apis with many independent consumers, or a generic ui driven by the api's own description. in those cases, moving the state machine into the response is what lets you change flow without a coordinated release, and hal-forms lets a client render actions it was never coded for. it does not earn its cost in the common case: a single-page application and a mobile app, both written by the same organization, released alongside the api. the client already knows the uris and the state machine, so the links are payload nobody reads, and every one of them costs a link builder, a test and bytes on the wire. why most apis stop at richardson level 2: the benefit only materializes if clients actually follow links instead of templating urls, and almost none do - the moment one client hardcodes /orders/{id}/cancel, you have all the cost and none of the freedom. i would rather invest in an openapi contract, consumer-driven contract tests and a clear versioning policy, which solve the real coupling problem for internal clients. the position to state in an interview is not \"hateoas is bad\" but \"hypermedia is a coupling trade, and i only pay for it where i cannot coordinate releases\"."}, {"n": 270, "category": 15, "difficulty": "T", "html": "CORS in Spring - <code>@CrossOrigin<\/code>, <code>CorsConfigurationSource<\/code>, <code>WebMvcConfigurer<\/code> and the gateway. Why must Spring Security know about CORS, and what breaks a preflight request?", "answerTitle": "CORS in Spring", "answer": "<p>CORS is enforced by the browser, not the server; your job is to send headers that authorize a cross-origin read. The preflight is an <code>OPTIONS<\/code> request the browser sends before any non-simple request (custom headers, <code>PUT<\/code>, <code>DELETE<\/code>, JSON content type), and it carries no credentials.<\/p><p>The three configuration points:<\/p><ul><li><code>@CrossOrigin<\/code> on a controller or method - fine for a demo, terrible at scale because policy ends up scattered.<\/li><li><code>WebMvcConfigurer.addCorsMappings<\/code> - central for MVC, but only applies to handler-mapped requests.<\/li><li>A <code>CorsConfigurationSource<\/code> bean plus <code>http.cors(withDefaults())<\/code> - the one I use, because it is the only one Spring Security sees.<\/li><\/ul><p><strong>Spring Security must know about CORS because its filter chain runs before the <code>DispatcherServlet<\/code>.<\/strong> A preflight <code>OPTIONS<\/code> carries no <code>Authorization<\/code> header and no cookie, so an authenticated rule rejects it with 401 before MVC&#x27;s CORS handling ever runs - and the browser reports a generic &quot;CORS error&quot; that sends people to change MVC config that was already correct. <code>http.cors()<\/code> installs <code>CorsFilter<\/code> early in the chain, which answers the preflight and short-circuits it.<\/p><p>Other things that break a preflight: <code>allowCredentials(true)<\/code> combined with <code>allowedOrigins(&quot;*&quot;)<\/code> is illegal and throws at startup (use <code>allowedOriginPatterns<\/code>); a header the client sends but <code>allowedHeaders<\/code> omits; a missing <code>exposedHeaders<\/code> so the client can read the response but not the header it needs; <code>maxAge<\/code> left at the default so every request is preflighted twice; and a gateway that adds its own CORS headers, producing duplicate <code>Access-Control-Allow-Origin<\/code> values which browsers reject. Decide in exactly one place - gateway or application, never both.<\/p>", "source": "answers.md", "search": "cors in spring - @crossorigin, corsconfigurationsource, webmvcconfigurer and the gateway. why must spring security know about cors, and what breaks a preflight request? cors is enforced by the browser, not the server; your job is to send headers that authorize a cross-origin read. the preflight is an options request the browser sends before any non-simple request (custom headers, put, delete, json content type), and it carries no credentials. the three configuration points: - @crossorigin on a controller or method - fine for a demo, terrible at scale because policy ends up scattered. - webmvcconfigurer.addcorsmappings - central for mvc, but only applies to handler-mapped requests. - a corsconfigurationsource bean plus http.cors(withdefaults()) - the one i use, because it is the only one spring security sees. spring security must know about cors because its filter chain runs before the dispatcherservlet. a preflight options carries no authorization header and no cookie, so an authenticated rule rejects it with 401 before mvc's cors handling ever runs - and the browser reports a generic \"cors error\" that sends people to change mvc config that was already correct. http.cors() installs corsfilter early in the chain, which answers the preflight and short-circuits it. other things that break a preflight: allowcredentials(true) combined with allowedorigins(\" \") is illegal and throws at startup (use allowedoriginpatterns); a header the client sends but allowedheaders omits; a missing exposedheaders so the client can read the response but not the header it needs; maxage left at the default so every request is preflighted twice; and a gateway that adds its own cors headers, producing duplicate access-control-allow-origin values which browsers reject. decide in exactly one place - gateway or application, never both."}, {"n": 271, "category": 16, "difficulty": "C", "html": "<code>JmsTemplate<\/code> and <code>@JmsListener<\/code> - what does <code>DefaultMessageListenerContainer<\/code> do per message, and how does <code>concurrency<\/code> behave?", "answerTitle": "`JmsTemplate` and `@JmsListener`", "answer": "<p><code>@JmsListener<\/code> is backed by a <code>DefaultMessageListenerContainer<\/code>, which runs its own threads outside the container&#x27;s request infrastructure. Each thread loops: take a connection and session from the pool, call <code>consumer.receive(receiveTimeout)<\/code>, and if a message arrives invoke the listener, then acknowledge or commit. If nothing arrives, the loop repeats - so the container is polling the broker, not being pushed to.<\/p><p><code>concurrency = &quot;3-10&quot;<\/code> sets minimum and maximum consumers, and <code>DefaultMessageListenerContainer<\/code> scales up only after <code>idleConsumerLimit<\/code> and <code>maxMessagesPerTask<\/code> thresholds are met, so ramp-up is deliberately slow. Two consequences worth stating: <strong>more consumers than queue partitions or than the database pool can serve is a self-inflicted outage<\/strong>, and for a topic (rather than a queue) concurrency above 1 duplicates delivery unless the subscription is shared.<\/p><p><code>JmsTemplate<\/code> is the send side and is synchronous by design: <code>convertAndSend<\/code> creates a session and producer, sends, and closes them.<\/p>", "source": "answers.md", "search": "jmstemplate and @jmslistener - what does defaultmessagelistenercontainer do per message, and how does concurrency behave? @jmslistener is backed by a defaultmessagelistenercontainer, which runs its own threads outside the container's request infrastructure. each thread loops: take a connection and session from the pool, call consumer.receive(receivetimeout), and if a message arrives invoke the listener, then acknowledge or commit. if nothing arrives, the loop repeats - so the container is polling the broker, not being pushed to. concurrency = \"3-10\" sets minimum and maximum consumers, and defaultmessagelistenercontainer scales up only after idleconsumerlimit and maxmessagespertask thresholds are met, so ramp-up is deliberately slow. two consequences worth stating: more consumers than queue partitions or than the database pool can serve is a self-inflicted outage , and for a topic (rather than a queue) concurrency above 1 duplicates delivery unless the subscription is shared. jmstemplate is the send side and is synchronous by design: convertandsend creates a session and producer, sends, and closes them."}, {"n": 272, "category": 16, "difficulty": "T", "html": "A plain <code>JmsTemplate<\/code> send is far slower than expected. What is it doing on every call, and what does <code>CachingConnectionFactory<\/code> fix?", "answerTitle": "Why `JmsTemplate` is slow", "answer": "<p>By default <code>JmsTemplate<\/code> creates a <strong>connection, session and producer per call, and closes them afterwards<\/strong>. On a real broker each connection is a TCP connect plus an authentication handshake, which is tens of milliseconds. Sending 1000 messages costs 1000 handshakes, and the throughput you measure is the broker&#x27;s connection rate, not its message rate.<\/p><p>The Spring model deliberately does no caching itself so it can participate in a JTA transaction, where the connection must come from the transaction-aware factory. <code>CachingConnectionFactory<\/code> fixes the common non-JTA case by caching the connection and a configurable number of sessions and producers per session:<\/p><pre><code class=\"lang-java\">@Bean ConnectionFactory connectionFactory(ConnectionFactory target) {\n  var f = new CachingConnectionFactory(target);\n  f.setSessionCacheSize(10);\n  return f;\n}<\/code><\/pre><p>Order-of-magnitude improvement for one bean. Caveats: <code>setSessionCacheSize<\/code> must exceed your concurrency or threads contend; do not put a caching factory in front of a JTA-managed XA factory; and on a listener container the container already manages its own sessions, so the caching factory is for the <em>send<\/em> side.<\/p>", "source": "answers.md", "search": "a plain jmstemplate send is far slower than expected. what is it doing on every call, and what does cachingconnectionfactory fix? by default jmstemplate creates a connection, session and producer per call, and closes them afterwards . on a real broker each connection is a tcp connect plus an authentication handshake, which is tens of milliseconds. sending 1000 messages costs 1000 handshakes, and the throughput you measure is the broker's connection rate, not its message rate. the spring model deliberately does no caching itself so it can participate in a jta transaction, where the connection must come from the transaction-aware factory. cachingconnectionfactory fixes the common non-jta case by caching the connection and a configurable number of sessions and producers per session: java @bean connectionfactory connectionfactory(connectionfactory target) { var f = new cachingconnectionfactory(target); f.setsessioncachesize(10); return f; } order-of-magnitude improvement for one bean. caveats: setsessioncachesize must exceed your concurrency or threads contend; do not put a caching factory in front of a jta-managed xa factory; and on a listener container the container already manages its own sessions, so the caching factory is for the send side."}, {"n": 273, "category": 16, "difficulty": "D", "html": "<code>sessionTransacted<\/code>, client acknowledge and <code>@Transactional<\/code> on a JMS listener - which of these actually redelivers a failed message?", "answerTitle": "Which acknowledgment actually redelivers", "answer": "<p>The question is where the &quot;I processed this&quot; decision lives.<\/p><ul><li><strong><code>sessionTransacted = true<\/code><\/strong> - a local JMS transaction. The message is delivered, the listener runs, and the session commits on normal return or rolls back on exception, which puts the message back for redelivery. This is what makes JMS redelivery work.<\/li><li><strong><code>AUTO_ACKNOWLEDGE<\/code><\/strong> (the default) - the container acknowledges after a successful listener call, so an exception does trigger redelivery, but there is no transaction, so nothing is grouped.<\/li><li><strong><code>CLIENT_ACKNOWLEDGE<\/code><\/strong> - you call <code>message.acknowledge()<\/code>, and it acknowledges every message delivered on that session so far, not just this one. Rarely what people intend.<\/li><li><strong><code>@Transactional<\/code> alone<\/strong> - a <em>database<\/em> transaction. It rolls back the database write; it says nothing about the message. Without <code>sessionTransacted<\/code>, the message was already acknowledged and is gone.<\/li><\/ul><p>The combination people reach for is <code>sessionTransacted = true<\/code> plus <code>@Transactional<\/code>, with the JMS transaction outside the database one. That is a best-efforts 1-phase commit, not atomicity: if the database commits and the JMS commit then fails, the message is redelivered and the work happens twice. So the real answer is the same as everywhere else in this pack - <strong>make the handler idempotent<\/strong> (an inbox table keyed by message ID in the same database transaction), and configure a redelivery limit and a DLQ so a poison message cannot loop forever.<\/p>", "source": "answers.md", "search": "sessiontransacted, client acknowledge and @transactional on a jms listener - which of these actually redelivers a failed message? the question is where the \"i processed this\" decision lives. - sessiontransacted = true - a local jms transaction. the message is delivered, the listener runs, and the session commits on normal return or rolls back on exception, which puts the message back for redelivery. this is what makes jms redelivery work. - auto_acknowledge (the default) - the container acknowledges after a successful listener call, so an exception does trigger redelivery, but there is no transaction, so nothing is grouped. - client_acknowledge - you call message.acknowledge(), and it acknowledges every message delivered on that session so far, not just this one. rarely what people intend. - @transactional alone - a database transaction. it rolls back the database write; it says nothing about the message. without sessiontransacted, the message was already acknowledged and is gone. the combination people reach for is sessiontransacted = true plus @transactional, with the jms transaction outside the database one. that is a best-efforts 1-phase commit, not atomicity: if the database commits and the jms commit then fails, the message is redelivered and the work happens twice. so the real answer is the same as everywhere else in this pack - make the handler idempotent (an inbox table keyed by message id in the same database transaction), and configure a redelivery limit and a dlq so a poison message cannot loop forever."}, {"n": 274, "category": 16, "difficulty": "D", "html": "Spring AMQP - <code>RabbitTemplate<\/code>, <code>@RabbitListener<\/code>, and how exchanges, queues and bindings get declared. Who should own the declarations?", "answerTitle": "Spring AMQP and declaration ownership", "answer": "<p><code>RabbitTemplate<\/code> sends and <code>@RabbitListener<\/code> consumes, with <code>SimpleMessageListenerContainer<\/code> (thread per consumer, <code>prefetch<\/code> messages in flight) or <code>DirectMessageListenerContainer<\/code> (dispatches on the client library&#x27;s threads, cheaper for many queues). Declaring topology is a separate concern: <code>Queue<\/code>, <code>TopicExchange<\/code> and <code>Binding<\/code> beans are picked up by <code>RabbitAdmin<\/code> and declared on connect, and <code>@RabbitListener(bindings = @QueueBinding(...))<\/code> does the same inline.<\/p><p>The ownership question is the real one, and my answer is that <strong>the consumer owns its queue and its binding, and nobody owns the exchange in application code<\/strong>. A producer that declares queues knows its consumers, which is exactly the coupling messaging was supposed to remove. Exchanges are shared infrastructure and belong in the same declarative infrastructure code as the cluster itself (Terraform, or the operator), because a rogue application declaring an exchange with different durability or arguments fails on mismatch - <code>PRECONDITION_FAILED<\/code> - and takes the channel down with it.<\/p><p>In production I also set <code>spring.rabbitmq.dynamic=false<\/code> for services that must not create topology, so a configuration typo fails loudly instead of quietly creating an unrouted queue that fills the disk.<\/p>", "source": "answers.md", "search": "spring amqp - rabbittemplate, @rabbitlistener, and how exchanges, queues and bindings get declared. who should own the declarations? rabbittemplate sends and @rabbitlistener consumes, with simplemessagelistenercontainer (thread per consumer, prefetch messages in flight) or directmessagelistenercontainer (dispatches on the client library's threads, cheaper for many queues). declaring topology is a separate concern: queue, topicexchange and binding beans are picked up by rabbitadmin and declared on connect, and @rabbitlistener(bindings = @queuebinding(...)) does the same inline. the ownership question is the real one, and my answer is that the consumer owns its queue and its binding, and nobody owns the exchange in application code . a producer that declares queues knows its consumers, which is exactly the coupling messaging was supposed to remove. exchanges are shared infrastructure and belong in the same declarative infrastructure code as the cluster itself (terraform, or the operator), because a rogue application declaring an exchange with different durability or arguments fails on mismatch - precondition_failed - and takes the channel down with it. in production i also set spring.rabbitmq.dynamic=false for services that must not create topology, so a configuration typo fails loudly instead of quietly creating an unrouted queue that fills the disk."}, {"n": 275, "category": 16, "difficulty": "T", "html": "Publisher confirms versus publisher returns in RabbitMQ - what does each detect, and which failure does neither catch?", "answerTitle": "Confirms versus returns", "answer": "<p>They answer different questions and both are off by default.<\/p><ul><li><strong>Publisher confirms<\/strong> answer &quot;did the <em>broker<\/em> take responsibility for this message?&quot; The broker acks after routing (and after persisting, for a durable queue). This catches broker unavailability, disk alarms and connection loss.<\/li><li><strong>Publisher returns<\/strong> answer &quot;was this message routed to at least one queue?&quot; If a mandatory message matches no binding, the broker returns it. Without this, a typo in the routing key is a silently discarded message - the publish succeeds, the confirm is positive, and the message never existed.<\/li><\/ul><pre><code class=\"lang-yaml\">spring.rabbitmq.publisher-confirm-type: correlated\nspring.rabbitmq.publisher-returns: true\nspring.rabbitmq.template.mandatory: true<\/code><\/pre><p>The failure <strong>neither catches<\/strong> is the consumer&#x27;s: the message was routed and persisted, and then the consumer rejected it, dead-lettered it, or processed it wrongly. A confirm is a broker receipt, not an end-to-end delivery guarantee. It also does not survive the producer crashing between the database commit and the publish - which is the outbox pattern&#x27;s entire reason for existing (Q79).<\/p>", "source": "answers.md", "search": "publisher confirms versus publisher returns in rabbitmq - what does each detect, and which failure does neither catch? they answer different questions and both are off by default. - publisher confirms answer \"did the broker take responsibility for this message?\" the broker acks after routing (and after persisting, for a durable queue). this catches broker unavailability, disk alarms and connection loss. - publisher returns answer \"was this message routed to at least one queue?\" if a mandatory message matches no binding, the broker returns it. without this, a typo in the routing key is a silently discarded message - the publish succeeds, the confirm is positive, and the message never existed. yaml spring.rabbitmq.publisher-confirm-type: correlated spring.rabbitmq.publisher-returns: true spring.rabbitmq.template.mandatory: true the failure neither catches is the consumer's: the message was routed and persisted, and then the consumer rejected it, dead-lettered it, or processed it wrongly. a confirm is a broker receipt, not an end-to-end delivery guarantee. it also does not survive the producer crashing between the database commit and the publish - which is the outbox pattern's entire reason for existing (q79)."}, {"n": 276, "category": 16, "difficulty": "D", "html": "RabbitMQ acknowledgment modes in Spring AMQP, <code>DLX<\/code> configuration, and retry with <code>RetryInterceptorBuilder<\/code>. Where does the retry actually happen?", "answerTitle": "Acknowledgment, DLX and where retry happens", "answer": "<p><code>AcknowledgeMode.AUTO<\/code> (Spring&#x27;s default, and confusingly <em>not<\/em> the AMQP auto-ack) acknowledges after the listener returns and rejects on exception. <code>MANUAL<\/code> gives you the <code>Channel<\/code> and delivery tag. <code>NONE<\/code> is fire-and-forget with no redelivery.<\/p><p>Dead-lettering is broker-side: the queue is declared with <code>x-dead-letter-exchange<\/code>, and a message that is rejected with <code>requeue=false<\/code>, expires, or overflows the queue length is republished there with an <code>x-death<\/code> header recording why and how many times.<\/p><p>Retry can happen in three places, and choosing wrongly is the classic mistake:<\/p><ol><li><strong>In-process, via <code>RetryInterceptorBuilder<\/code><\/strong> on the listener container - a stateless interceptor retries with backoff <em>on the consumer thread<\/em>, holding the message unacknowledged. Cheap and correct for a transient blip of a few hundred milliseconds. With a long backoff it blocks a consumer thread and, at prefetch scale, stalls the queue.<\/li><li><strong>Broker-side requeue<\/strong> - <code>requeue=true<\/code> puts the message back at the head immediately, so a permanently failing message becomes a hot loop that saturates the consumer. Almost never right without a delay.<\/li><li><strong>A delay queue<\/strong> - dead-letter to a queue with a TTL and no consumer, whose own DLX points back at the original exchange. Delay without holding a consumer thread, which is the pattern that scales.<\/li><\/ol><p>The rule I apply: retry in process only for short, transient faults; use a delayed retry queue for anything longer; and always terminate at a real DLQ with an alert and a documented redrive procedure. <code>spring.rabbitmq.listener.simple.default-requeue-rejected: false<\/code> is a default I always change, because leaving it true is how a single bad message consumes a cluster.<\/p>", "source": "answers.md", "search": "rabbitmq acknowledgment modes in spring amqp, dlx configuration, and retry with retryinterceptorbuilder. where does the retry actually happen? acknowledgemode.auto (spring's default, and confusingly not the amqp auto-ack) acknowledges after the listener returns and rejects on exception. manual gives you the channel and delivery tag. none is fire-and-forget with no redelivery. dead-lettering is broker-side: the queue is declared with x-dead-letter-exchange, and a message that is rejected with requeue=false, expires, or overflows the queue length is republished there with an x-death header recording why and how many times. retry can happen in three places, and choosing wrongly is the classic mistake: 1. in-process, via retryinterceptorbuilder on the listener container - a stateless interceptor retries with backoff on the consumer thread , holding the message unacknowledged. cheap and correct for a transient blip of a few hundred milliseconds. with a long backoff it blocks a consumer thread and, at prefetch scale, stalls the queue. 2. broker-side requeue - requeue=true puts the message back at the head immediately, so a permanently failing message becomes a hot loop that saturates the consumer. almost never right without a delay. 3. a delay queue - dead-letter to a queue with a ttl and no consumer, whose own dlx points back at the original exchange. delay without holding a consumer thread, which is the pattern that scales. the rule i apply: retry in process only for short, transient faults; use a delayed retry queue for anything longer; and always terminate at a real dlq with an alert and a documented redrive procedure. spring.rabbitmq.listener.simple.default-requeue-rejected: false is a default i always change, because leaving it true is how a single bad message consumes a cluster."}, {"n": 277, "category": 16, "difficulty": "T", "html": "<code>MessageConverter<\/code> and the <code>__TypeId__<\/code> header - why does a producer refactor break consumers, and how do you version a message payload safely?", "answerTitle": "`__TypeId__` and payload versioning", "answer": "<p><code>Jackson2JsonMessageConverter<\/code> writes the fully qualified producer class name into the <code>__TypeId__<\/code> header, and the consumer&#x27;s converter uses it to pick a target class. That means <strong>the fully qualified class name of the producer is part of your wire contract<\/strong>. Rename the package, move the class to a shared library, or split the service, and consumers fail deserialization with <code>ClassNotFoundException<\/code> for a change that touched no logic.<\/p><p>Fixes, in order of preference:<\/p><ol><li><strong>Map types explicitly<\/strong> with <code>DefaultJackson2JavaTypeMapper<\/code> and an ID-to-class map, so the wire carries a stable logical name (<code>order.created.v1<\/code>) and each side maps it to whatever class it likes.<\/li><li><strong>Force the target type<\/strong> on the consumer (<code>setDefaultType<\/code> with <code>TypePrecedence.INFERRED<\/code>, or the <code>@RabbitListener<\/code> parameter type), ignoring the header entirely.<\/li><li>Never accept an arbitrary class name from the wire - deserializing to a producer-chosen type is a gadget-chain risk, the same category as the polymorphic JSON problem in Q85. Kafka&#x27;s <code>spring.json.trusted.packages<\/code> exists for exactly this reason and should be an allow-list, never <code>*<\/code>.<\/li><\/ol><p>For versioning the payload itself: additive-only changes with a tolerant reader (unknown fields ignored, new fields optional with defaults), a version field in the envelope, and a new logical type ID when a change is genuinely breaking so old and new can be consumed side by side during the transition.<\/p>", "source": "answers.md", "search": "messageconverter and the __typeid__ header - why does a producer refactor break consumers, and how do you version a message payload safely? jackson2jsonmessageconverter writes the fully qualified producer class name into the __typeid__ header, and the consumer's converter uses it to pick a target class. that means the fully qualified class name of the producer is part of your wire contract . rename the package, move the class to a shared library, or split the service, and consumers fail deserialization with classnotfoundexception for a change that touched no logic. fixes, in order of preference: 1. map types explicitly with defaultjackson2javatypemapper and an id-to-class map, so the wire carries a stable logical name (order.created.v1) and each side maps it to whatever class it likes. 2. force the target type on the consumer (setdefaulttype with typeprecedence.inferred, or the @rabbitlistener parameter type), ignoring the header entirely. 3. never accept an arbitrary class name from the wire - deserializing to a producer-chosen type is a gadget-chain risk, the same category as the polymorphic json problem in q85. kafka's spring.json.trusted.packages exists for exactly this reason and should be an allow-list, never . for versioning the payload itself: additive-only changes with a tolerant reader (unknown fields ignored, new fields optional with defaults), a version field in the envelope, and a new logical type id when a change is genuinely breaking so old and new can be consumed side by side during the transition."}, {"n": 278, "category": 16, "difficulty": "D", "html": "Spring Integration - channels, endpoints, the <code>IntegrationFlow<\/code> DSL and the poller. What problem does it solve that plain code does not?", "answerTitle": "Spring Integration", "answer": "<p>Spring Integration is an implementation of the enterprise integration patterns: <code>MessageChannel<\/code>s connect endpoints, and endpoints are transformers, filters, routers, splitters, aggregators and service activators. The <code>IntegrationFlow<\/code> DSL wires them:<\/p><pre><code class=\"lang-java\">@Bean IntegrationFlow fileFlow(JdbcTemplate jdbc) {\n
