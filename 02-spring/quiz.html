return IntegrationFlow.from(Files.inboundAdapter(new File(&quot;/in&quot;)),\n                              c -&gt; c.poller(Pollers.fixedDelay(5000).maxMessagesPerPoll(10)))\n      .transform(Transformers.fileToString())\n      .split(s -&gt; s.delimiters(&quot;\\n&quot;))\n      .filter((String line) -&gt; !line.isBlank())\n      .handle(m -&gt; jdbc.update(&quot;insert into staging(line) values (?)&quot;, m.getPayload()))\n      .get();\n}<\/code><\/pre><p>What it gives you over plain code: <strong>channel adapters for protocols you would otherwise write by hand<\/strong> (file, FTP, SFTP, mail, TCP, MQTT, JDBC polling), and stateful patterns that are genuinely hard to get right - an aggregator with correlation, release and group timeout, a resequencer, a claim check, and a poller with transaction and error-channel semantics. Errors go to a dedicated error channel rather than being thrown into a caller that does not exist.<\/p><p>When it is justified: multi-protocol integration work, or a flow that needs those stateful patterns. When it is not: a straight &quot;consume from Kafka, transform, write to database&quot; pipeline, where the DSL adds an abstraction the on-call engineer has to learn and a stack trace nobody can read. My honest position is that Spring Integration is excellent at what it was designed for and routinely over-applied - and if the flow is one source, one transform and one sink, <code>@KafkaListener<\/code> and a service method is the maintainable choice.<\/p>", "source": "answers.md", "search": "spring integration - channels, endpoints, the integrationflow dsl and the poller. what problem does it solve that plain code does not? spring integration is an implementation of the enterprise integration patterns: messagechannels connect endpoints, and endpoints are transformers, filters, routers, splitters, aggregators and service activators. the integrationflow dsl wires them: java @bean integrationflow fileflow(jdbctemplate jdbc) { return integrationflow.from(files.inboundadapter(new file(\"/in\")), c - c.poller(pollers.fixeddelay(5000).maxmessagesperpoll(10))) .transform(transformers.filetostring()) .split(s - s.delimiters(\"\\n\")) .filter((string line) - !line.isblank()) .handle(m - jdbc.update(\"insert into staging(line) values (?)\", m.getpayload())) .get(); } what it gives you over plain code: channel adapters for protocols you would otherwise write by hand (file, ftp, sftp, mail, tcp, mqtt, jdbc polling), and stateful patterns that are genuinely hard to get right - an aggregator with correlation, release and group timeout, a resequencer, a claim check, and a poller with transaction and error-channel semantics. errors go to a dedicated error channel rather than being thrown into a caller that does not exist. when it is justified: multi-protocol integration work, or a flow that needs those stateful patterns. when it is not: a straight \"consume from kafka, transform, write to database\" pipeline, where the dsl adds an abstraction the on-call engineer has to learn and a stack trace nobody can read. my honest position is that spring integration is excellent at what it was designed for and routinely over-applied - and if the flow is one source, one transform and one sink, @kafkalistener and a service method is the maintainable choice."}, {"n": 279, "category": 16, "difficulty": "D", "html": "Spring Web Services - contract-first with <code>@Endpoint<\/code> and <code>@PayloadRoot<\/code>, WSDL generation, and where WS-Security fits. When is SOAP still the right answer in 2026?", "answerTitle": "Spring Web Services and SOAP", "answer": "<p>Spring-WS is deliberately <strong>contract-first<\/strong>: you write the XSD, generate the JAXB classes at build time (<code>jaxb2-maven-plugin<\/code>), and the WSDL is generated from the schema by <code>DefaultWsdl11Definition<\/code>. Endpoints are <code>@Endpoint<\/code> classes with <code>@PayloadRoot(namespace, localPart)<\/code> methods that receive and return JAXB objects; <code>MessageDispatcherServlet<\/code> routes by payload root rather than by URL.<\/p><p><code>XwsSecurityInterceptor<\/code> or <code>Wss4jSecurityInterceptor<\/code> handles WS-Security - signing, encryption, timestamps and username tokens applied at the <em>message<\/em> level rather than the transport level.<\/p><p>When SOAP is still right in 2026: when the counterparty dictates it, which is the honest answer for banking, insurance, telecom provisioning and government interfaces; when you need message-level signatures that survive intermediaries, where TLS terminating at a gateway is not sufficient for non-repudiation; and when WS-* features such as reliable messaging or <code>WS-AtomicTransaction<\/code> are contractual. What it genuinely offers is a machine-readable, strongly typed, enforceable contract - the thing REST needed OpenAPI to approximate.<\/p><p>For new internal services I would not choose it. The pattern I have used is an anti-corruption layer: one adapter service speaking SOAP outward and events or REST inward, so the XML and the WS-Security keystore management stay in one place rather than spreading through the estate.<\/p>", "source": "answers.md", "search": "spring web services - contract-first with @endpoint and @payloadroot, wsdl generation, and where ws-security fits. when is soap still the right answer in 2026? spring-ws is deliberately contract-first : you write the xsd, generate the jaxb classes at build time (jaxb2-maven-plugin), and the wsdl is generated from the schema by defaultwsdl11definition. endpoints are @endpoint classes with @payloadroot(namespace, localpart) methods that receive and return jaxb objects; messagedispatcherservlet routes by payload root rather than by url. xwssecurityinterceptor or wss4jsecurityinterceptor handles ws-security - signing, encryption, timestamps and username tokens applied at the message level rather than the transport level. when soap is still right in 2026: when the counterparty dictates it, which is the honest answer for banking, insurance, telecom provisioning and government interfaces; when you need message-level signatures that survive intermediaries, where tls terminating at a gateway is not sufficient for non-repudiation; and when ws- features such as reliable messaging or ws-atomictransaction are contractual. what it genuinely offers is a machine-readable, strongly typed, enforceable contract - the thing rest needed openapi to approximate. for new internal services i would not choose it. the pattern i have used is an anti-corruption layer: one adapter service speaking soap outward and events or rest inward, so the xml and the ws-security keystore management stay in one place rather than spreading through the estate."}, {"n": 280, "category": 16, "difficulty": "T", "html": "A listener annotated <code>@Transactional<\/code> consumes a message and writes to a database. Which transaction is that, what can still be lost, and what do you do instead?", "answerTitle": "`@Transactional` on a listener", "answer": "<p>It is a <strong>database transaction only<\/strong>. The message broker knows nothing about it. So the sequence is: the container delivers the message, the database transaction commits, and the container then acknowledges. Two gaps follow.<\/p><p>If the process dies <strong>after the database commit and before the acknowledgment<\/strong>, the message is redelivered and you process it again - a duplicate. If the transaction rolls back after an effect the database cannot undo (an email sent, an HTTP call made, a second message published), redelivery repeats that effect.<\/p><p>There is no fix inside the annotation. What actually works:<\/p><ul><li><strong>Consume idempotently.<\/strong> An inbox table with the message ID as the primary key, inserted inside the same transaction as the business write. A duplicate hits the unique constraint and the handler exits successfully. This turns at-least-once delivery into effectively-once processing, and it is the only part of the problem you can fully solve.<\/li><li><strong>Publish through an outbox.<\/strong> Never publish inside the transaction: write the event to an outbox table in the same commit and let a relay publish it (Q79). Otherwise a commit-then-crash loses the event, or a publish-then-rollback invents one.<\/li><li><strong>Do not do non-transactional work inside the transaction<\/strong> - the HTTP call and the email belong after commit, driven by the outbox or <code>@TransactionalEventListener(AFTER_COMMIT)<\/code>.<\/li><\/ul><p>For Kafka specifically, <code>@Transactional<\/code> on a <code>@KafkaListener<\/code> does not join a Kafka transaction unless a <code>KafkaTransactionManager<\/code> is in play, and even then exactly-once applies only to Kafka-to-Kafka flows, not to Kafka-plus-database (Q216).<\/p>", "source": "answers.md", "search": "a listener annotated @transactional consumes a message and writes to a database. which transaction is that, what can still be lost, and what do you do instead? it is a database transaction only . the message broker knows nothing about it. so the sequence is: the container delivers the message, the database transaction commits, and the container then acknowledges. two gaps follow. if the process dies after the database commit and before the acknowledgment , the message is redelivered and you process it again - a duplicate. if the transaction rolls back after an effect the database cannot undo (an email sent, an http call made, a second message published), redelivery repeats that effect. there is no fix inside the annotation. what actually works: - consume idempotently. an inbox table with the message id as the primary key, inserted inside the same transaction as the business write. a duplicate hits the unique constraint and the handler exits successfully. this turns at-least-once delivery into effectively-once processing, and it is the only part of the problem you can fully solve. - publish through an outbox. never publish inside the transaction: write the event to an outbox table in the same commit and let a relay publish it (q79). otherwise a commit-then-crash loses the event, or a publish-then-rollback invents one. - do not do non-transactional work inside the transaction - the http call and the email belong after commit, driven by the outbox or @transactionaleventlistener(after_commit). for kafka specifically, @transactional on a @kafkalistener does not join a kafka transaction unless a kafkatransactionmanager is in play, and even then exactly-once applies only to kafka-to-kafka flows, not to kafka-plus-database (q216)."}, {"n": 281, "category": 17, "difficulty": "C", "html": "<code>Job<\/code>, <code>Step<\/code>, <code>JobLauncher<\/code>, <code>JobRepository<\/code> and <code>JobExecution<\/code> - how do the pieces fit, and what do the metadata tables store?", "answerTitle": "The Spring Batch domain model", "answer": "<p>A <strong><code>Job<\/code><\/strong> is the unit of work; a <strong><code>Step<\/code><\/strong> is a phase of it; a <code>Job<\/code> has ordered steps with conditional flow. <strong><code>JobLauncher<\/code><\/strong> starts a job with <code>JobParameters<\/code>. <strong><code>JobRepository<\/code><\/strong> persists state - and everything restartable in Spring Batch follows from the fact that this state is in a database, not in memory.<\/p><p>The metadata tables:<\/p><table><thead><tr><th>Table<\/th><th>Holds<\/th><\/tr><\/thead><tbody><tr><td><code>BATCH_JOB_INSTANCE<\/code><\/td><td>One row per job name + identifying parameters<\/td><\/tr><tr><td><code>BATCH_JOB_EXECUTION<\/code><\/td><td>One row per attempt at an instance, with status and exit code<\/td><\/tr><tr><td><code>BATCH_JOB_EXECUTION_PARAMS<\/code><\/td><td>The parameters of that attempt<\/td><\/tr><tr><td><code>BATCH_JOB_EXECUTION_CONTEXT<\/code><\/td><td>Serialized job-level <code>ExecutionContext<\/code><\/td><\/tr><tr><td><code>BATCH_STEP_EXECUTION<\/code><\/td><td>Per step: read, write, commit, skip and rollback counts<\/td><\/tr><tr><td><code>BATCH_STEP_EXECUTION_CONTEXT<\/code><\/td><td>Serialized step-level <code>ExecutionContext<\/code>, including reader position<\/td><\/tr><\/tbody><\/table><p>Two distinctions interviewers probe. <strong><code>JobInstance<\/code> versus <code>JobExecution<\/code><\/strong>: the instance is &quot;the payroll run for 2026-08&quot;, the execution is one attempt at it; re-running after a failure creates a new execution against the same instance, which is what makes restart meaningful. And the repository is written to <em>transactionally alongside your chunk<\/em>, which is why it must live in a real database - the <code>Map<\/code>-based repository is for tests only, since restart is exactly the feature it cannot provide.<\/p>", "source": "answers.md", "search": "job, step, joblauncher, jobrepository and jobexecution - how do the pieces fit, and what do the metadata tables store? a job is the unit of work; a step is a phase of it; a job has ordered steps with conditional flow. joblauncher starts a job with jobparameters. jobrepository persists state - and everything restartable in spring batch follows from the fact that this state is in a database, not in memory. the metadata tables: table holds --- --- batch_job_instance one row per job name + identifying parameters batch_job_execution one row per attempt at an instance, with status and exit code batch_job_execution_params the parameters of that attempt batch_job_execution_context serialized job-level executioncontext batch_step_execution per step: read, write, commit, skip and rollback counts batch_step_execution_context serialized step-level executioncontext, including reader position two distinctions interviewers probe. jobinstance versus jobexecution : the instance is \"the payroll run for 2026-08\", the execution is one attempt at it; re-running after a failure creates a new execution against the same instance, which is what makes restart meaningful. and the repository is written to transactionally alongside your chunk , which is why it must live in a real database - the map-based repository is for tests only, since restart is exactly the feature it cannot provide."}, {"n": 282, "category": 17, "difficulty": "D", "html": "Chunk-oriented processing versus a <code>Tasklet<\/code> - when do you use each, and what is the transaction boundary in a chunk-oriented step?", "answerTitle": "Chunk versus `Tasklet`", "answer": "<p>A <strong><code>Tasklet<\/code><\/strong> is a single <code>execute()<\/code> method called repeatedly until it returns <code>FINISHED<\/code>, each call in its own transaction. Use it for operations that are not item-oriented: run a stored procedure, move a file, truncate a staging table, call a service.<\/p><p><strong>Chunk-oriented<\/strong> processing is read-process-write in batches:<\/p><pre><code class=\"lang-java\">new StepBuilder(&quot;importStep&quot;, jobRepository)\n    .&lt;InputRow, Customer&gt;chunk(500, transactionManager)\n    .reader(reader()).processor(processor()).writer(writer())\n    .faultTolerant().skipLimit(20).skip(ParseException.class)\n    .build();<\/code><\/pre><p>The transaction boundary is <strong>the chunk, not the item<\/strong>. Spring Batch opens a transaction, calls <code>read()<\/code> <code>chunkSize<\/code> times (accumulating in memory), calls <code>process()<\/code> on each, calls <code>write()<\/code> <strong>once with the whole list<\/strong>, updates the step execution counters in the same transaction, and commits. That single-call writer is the reason batch is fast - one <code>JDBC<\/code> batch insert per 500 rows rather than 500 round trips.<\/p><p>Choosing the chunk size is a real trade-off: larger means fewer commits and better throughput, but a bigger rollback on failure, more heap held, and longer locks. I start at 100-1000 and tune against the actual write cost.<\/p>", "source": "answers.md", "search": "chunk-oriented processing versus a tasklet - when do you use each, and what is the transaction boundary in a chunk-oriented step? a tasklet is a single execute() method called repeatedly until it returns finished, each call in its own transaction. use it for operations that are not item-oriented: run a stored procedure, move a file, truncate a staging table, call a service. chunk-oriented processing is read-process-write in batches: java new stepbuilder(\"importstep\", jobrepository) .<inputrow, customer chunk(500, transactionmanager) .reader(reader()).processor(processor()).writer(writer()) .faulttolerant().skiplimit(20).skip(parseexception.class) .build(); the transaction boundary is the chunk, not the item . spring batch opens a transaction, calls read() chunksize times (accumulating in memory), calls process() on each, calls write() once with the whole list , updates the step execution counters in the same transaction, and commits. that single-call writer is the reason batch is fast - one jdbc batch insert per 500 rows rather than 500 round trips. choosing the chunk size is a real trade-off: larger means fewer commits and better throughput, but a bigger rollback on failure, more heap held, and longer locks. i start at 100-1000 and tune against the actual write cost."}, {"n": 283, "category": 17, "difficulty": "T", "html": "A chunk fails on item 7 of 100. What has been committed, what is rolled back, and what does the reader do on restart?", "answerTitle": "What survives a mid-chunk failure", "answer": "<p>With a chunk size of 100 and a failure at item 7 of the second chunk: <strong>the first chunk is committed<\/strong> (items 1-100 are in the database and <code>BATCH_STEP_EXECUTION.write_count<\/code> says 100, in the same transaction). The second chunk rolls back entirely - items 101-107 are not written, and the counters do not advance. The step execution is marked <code>FAILED<\/code> and the <code>ExecutionContext<\/code> retains the position saved at the last successful commit.<\/p><p>On restart with the same <code>JobParameters<\/code>, Spring Batch finds the existing <code>JobInstance<\/code>, creates a new <code>JobExecution<\/code>, and the reader <strong>restores itself from the <code>ExecutionContext<\/code><\/strong>. How well depends entirely on the reader: <code>ItemStream<\/code> readers such as <code>FlatFileItemReader<\/code> and the paging readers save a row or page count in <code>update()<\/code> and skip forward on <code>open()<\/code>. A cursor reader re-executes its query and skips <code>n<\/code> rows, which is correct only if the underlying data has not changed. A custom reader that does not implement <code>ItemStream<\/code> restarts <strong>from the beginning<\/strong> and reprocesses the first 100 items - which is Q288&#x27;s point about idempotent writers.<\/p><p>If the step is fault-tolerant, there is a further subtlety: on a skippable exception Spring Batch rolls back and <strong>re-reads the chunk one item at a time<\/strong> to identify the offending item, so <code>process()<\/code> can be called more than once for the same item. Processors must therefore be side-effect free.<\/p>", "source": "answers.md", "search": "a chunk fails on item 7 of 100. what has been committed, what is rolled back, and what does the reader do on restart? with a chunk size of 100 and a failure at item 7 of the second chunk: the first chunk is committed (items 1-100 are in the database and batch_step_execution.write_count says 100, in the same transaction). the second chunk rolls back entirely - items 101-107 are not written, and the counters do not advance. the step execution is marked failed and the executioncontext retains the position saved at the last successful commit. on restart with the same jobparameters, spring batch finds the existing jobinstance, creates a new jobexecution, and the reader restores itself from the executioncontext . how well depends entirely on the reader: itemstream readers such as flatfileitemreader and the paging readers save a row or page count in update() and skip forward on open(). a cursor reader re-executes its query and skips n rows, which is correct only if the underlying data has not changed. a custom reader that does not implement itemstream restarts from the beginning and reprocesses the first 100 items - which is q288's point about idempotent writers. if the step is fault-tolerant, there is a further subtlety: on a skippable exception spring batch rolls back and re-reads the chunk one item at a time to identify the offending item, so process() can be called more than once for the same item. processors must therefore be side-effect free."}, {"n": 284, "category": 17, "difficulty": "D", "html": "<code>ItemReader<\/code> choices - <code>JdbcCursorItemReader<\/code> versus <code>JdbcPagingItemReader<\/code> versus a JPA reader. What breaks each one at scale?", "answerTitle": "Reader choices at scale", "answer": "<table><thead><tr><th>Reader<\/th><th>Mechanism<\/th><th>Breaks when<\/th><\/tr><\/thead><tbody><tr><td><code>JdbcCursorItemReader<\/code><\/td><td>One <code>ResultSet<\/code> streamed with a fetch size<\/td><td>The connection is held for the whole step; long transactions, replica conflicts, and no safe restart if the data changes<\/td><\/tr><tr><td><code>JdbcPagingItemReader<\/code><\/td><td>A new sorted, keyed query per page<\/td><td>Requires a stable unique sort key; <code>OFFSET<\/code> deepening if the implementation is naive, and rows shifting between pages<\/td><\/tr><tr><td><code>JpaPagingItemReader<\/code><\/td><td>Same, through the <code>EntityManager<\/code><\/td><td>Persistence-context growth; the reader clears it per page, which detaches entities the processor may still expect<\/td><\/tr><tr><td><code>RepositoryItemReader<\/code><\/td><td>Calls a Spring Data method with <code>Pageable<\/code><\/td><td>Convenient, same paging caveats, and easy to accidentally hide an N+1<\/td><\/tr><tr><td><code>FlatFileItemReader<\/code><\/td><td>Buffered line reader with a <code>LineMapper<\/code><\/td><td>Cheap and restartable by line count; a mid-file change invalidates the position<\/td><\/tr><tr><td><code>SynchronizedItemStreamReader<\/code> wrapper<\/td><td>Serializes reads<\/td><td>Needed to use a non-thread-safe reader in a multi-threaded step, and it becomes the bottleneck<\/td><\/tr><\/tbody><\/table><p>The rules I apply: <strong>cursor for a snapshot-consistent single-threaded pass over a stable table; paging for anything long-running, multi-threaded or restartable<\/strong>. Paging must sort by a unique, immutable key - sort by a non-unique column and rows appear twice or not at all across pages, which is a data bug no test catches. And keyset paging (<code>WHERE id &gt; :last ORDER BY id<\/code>) beats <code>OFFSET<\/code> once the table is large.<\/p>", "source": "answers.md", "search": "itemreader choices - jdbccursoritemreader versus jdbcpagingitemreader versus a jpa reader. what breaks each one at scale? reader mechanism breaks when --- --- --- jdbccursoritemreader one resultset streamed with a fetch size the connection is held for the whole step; long transactions, replica conflicts, and no safe restart if the data changes jdbcpagingitemreader a new sorted, keyed query per page requires a stable unique sort key; offset deepening if the implementation is naive, and rows shifting between pages jpapagingitemreader same, through the entitymanager persistence-context growth; the reader clears it per page, which detaches entities the processor may still expect repositoryitemreader calls a spring data method with pageable convenient, same paging caveats, and easy to accidentally hide an n+1 flatfileitemreader buffered line reader with a linemapper cheap and restartable by line count; a mid-file change invalidates the position synchronizeditemstreamreader wrapper serializes reads needed to use a non-thread-safe reader in a multi-threaded step, and it becomes the bottleneck the rules i apply: cursor for a snapshot-consistent single-threaded pass over a stable table; paging for anything long-running, multi-threaded or restartable . paging must sort by a unique, immutable key - sort by a non-unique column and rows appear twice or not at all across pages, which is a data bug no test catches. and keyset paging (where id :last order by id) beats offset once the table is large."}, {"n": 285, "category": 17, "difficulty": "D", "html": "Restartability - <code>ExecutionContext<\/code>, <code>JobParameters<\/code> identity, and <code>allowStartIfComplete<\/code>. Why does re-running a job with the same parameters fail?", "answerTitle": "Restartability and parameter identity", "answer": "<p><code>JobParameters<\/code> are the identity of a <code>JobInstance<\/code>. Spring Batch computes the instance from the job name plus the <strong>identifying<\/strong> parameters, and enforces that one instance runs to <code>COMPLETED<\/code> at most once. That is a feature: it prevents the same month&#x27;s payroll being run twice.<\/p><p>So <code>JobInstanceAlreadyCompleteException<\/code> on re-run means exactly that - this work already succeeded. Options:<\/p><ul><li>Add a genuinely identifying parameter (<code>runDate=2026-08-01<\/code>), which is the correct model for periodic jobs.<\/li><li>Mark a parameter non-identifying (<code>new JobParameter&lt;&gt;(value, String.class, false)<\/code>), so it is recorded but does not affect identity.<\/li><li><code>allowStartIfComplete(true)<\/code> on a step, which lets that step re-run within a restarted job even though it previously succeeded - right for idempotent setup or cleanup steps, wrong for the step that writes the ledger.<\/li><li>A <code>RunIdIncrementer<\/code>, which appends an incrementing <code>run.id<\/code> so every launch is a new instance - convenient, but it discards the duplicate-run protection, so I only use it for genuinely idempotent jobs.<\/li><\/ul><p>Restart also has limits: a step is restartable only up to <code>startLimit<\/code> (default <code>Integer.MAX_VALUE<\/code>), an execution stuck in <code>STARTED<\/code> after a hard kill must be marked <code>ABANDONED<\/code> or <code>FAILED<\/code> before restart, and a job whose reader is not an <code>ItemStream<\/code> restarts from zero.<\/p>", "source": "answers.md", "search": "restartability - executioncontext, jobparameters identity, and allowstartifcomplete. why does re-running a job with the same parameters fail? jobparameters are the identity of a jobinstance. spring batch computes the instance from the job name plus the identifying parameters, and enforces that one instance runs to completed at most once. that is a feature: it prevents the same month's payroll being run twice. so jobinstancealreadycompleteexception on re-run means exactly that - this work already succeeded. options: - add a genuinely identifying parameter (rundate=2026-08-01), which is the correct model for periodic jobs. - mark a parameter non-identifying (new jobparameter< (value, string.class, false)), so it is recorded but does not affect identity. - allowstartifcomplete(true) on a step, which lets that step re-run within a restarted job even though it previously succeeded - right for idempotent setup or cleanup steps, wrong for the step that writes the ledger. - a runidincrementer, which appends an incrementing run.id so every launch is a new instance - convenient, but it discards the duplicate-run protection, so i only use it for genuinely idempotent jobs. restart also has limits: a step is restartable only up to startlimit (default integer.max_value), an execution stuck in started after a hard kill must be marked abandoned or failed before restart, and a job whose reader is not an itemstream restarts from zero."}, {"n": 286, "category": 17, "difficulty": "T", "html": "Skip, retry and <code>noRollback<\/code> policies interact. Describe the failure mode of a skip policy combined with a stateful <code>ItemWriter<\/code>.", "answerTitle": "Skip, retry and stateful writers", "answer": "<p>Three fault-tolerance mechanisms interact:<\/p><ul><li><strong>Retry<\/strong> re-attempts an item on a listed exception. Because the chunk transaction has already rolled back, retry means <strong>the whole chunk is replayed<\/strong>, item by item.<\/li><li><strong>Skip<\/strong> logs the failing item and continues, up to <code>skipLimit<\/code>. Reaching the limit fails the step.<\/li><li><strong><code>noRollback<\/code><\/strong> declares an exception that should not roll back the chunk at all.<\/li><\/ul><p>The failure mode with a stateful <code>ItemWriter<\/code> is this: a skippable exception during write causes Spring Batch to roll back and reprocess the chunk one item at a time to find the culprit. A writer that holds internal state - an open file handle with a partially written buffer, an accumulated running total, a <code>StringBuilder<\/code>, an external HTTP client that has already sent - has <strong>already applied the effects of the first pass<\/strong>, and the database rollback does not undo it. The scan then applies them again. You get duplicated file lines, doubled totals, or duplicate downstream calls, and the counts in <code>BATCH_STEP_EXECUTION<\/code> look perfectly healthy.<\/p><p>The rules: writers must be stateless and idempotent (Q288), processors must be side-effect free because they may be invoked repeatedly for the same item, anything that must happen exactly once belongs in a <code>ChunkListener<\/code> or <code>StepExecutionListener<\/code> that is aware of rollback, and a <code>SkipListener<\/code> should record every skipped item somewhere durable - a skip limit of 100 with no record of <em>what<\/em> was skipped is silent data loss.<\/p>", "source": "answers.md", "search": "skip, retry and norollback policies interact. describe the failure mode of a skip policy combined with a stateful itemwriter. three fault-tolerance mechanisms interact: - retry re-attempts an item on a listed exception. because the chunk transaction has already rolled back, retry means the whole chunk is replayed , item by item. - skip logs the failing item and continues, up to skiplimit. reaching the limit fails the step. - norollback declares an exception that should not roll back the chunk at all. the failure mode with a stateful itemwriter is this: a skippable exception during write causes spring batch to roll back and reprocess the chunk one item at a time to find the culprit. a writer that holds internal state - an open file handle with a partially written buffer, an accumulated running total, a stringbuilder, an external http client that has already sent - has already applied the effects of the first pass , and the database rollback does not undo it. the scan then applies them again. you get duplicated file lines, doubled totals, or duplicate downstream calls, and the counts in batch_step_execution look perfectly healthy. the rules: writers must be stateless and idempotent (q288), processors must be side-effect free because they may be invoked repeatedly for the same item, anything that must happen exactly once belongs in a chunklistener or stepexecutionlistener that is aware of rollback, and a skiplistener should record every skipped item somewhere durable - a skip limit of 100 with no record of what was skipped is silent data loss."}, {"n": 287, "category": 17, "difficulty": "D", "html": "Scaling a batch job - multi-threaded step, partitioning, remote chunking and parallel flows. Which are safe with which readers?", "answerTitle": "Scaling a batch job", "answer": "<p>Four models, in increasing order of complexity:<\/p><ol><li><strong>Multi-threaded step<\/strong> - one step, a <code>TaskExecutor<\/code>, many threads sharing one reader and writer. Simple, but it requires thread-safe components, breaks reader restartability (the saved position is meaningless when threads interleave), and destroys ordering. Safe mainly with a <code>SynchronizedItemStreamReader<\/code> and <code>saveState(false)<\/code>.<\/li><li><strong>Parallel flows<\/strong> - independent steps running concurrently in a split. Trivially safe because nothing is shared; only useful when the work genuinely decomposes into different steps.<\/li><li><strong>Local partitioning<\/strong> - a <code>Partitioner<\/code> divides the input into ranges (customer IDs 1-1000, 1001-2000), and each partition gets its <strong>own step execution, own reader and own <code>ExecutionContext<\/code><\/strong>. This is the one I reach for: full restartability per partition, no shared state, and scaling is a matter of the grid size and the executor. It needs a partitionable key with a reasonably even distribution.<\/li><li><strong>Remote partitioning / remote chunking<\/strong> - the same, distributed over messaging. Remote partitioning sends only partition metadata (workers read their own data, so it scales the reader too); remote chunking sends the <em>items<\/em> to workers, so the manager&#x27;s reader remains the bottleneck and the network carries the payload. Remote chunking is only worth it when processing is far more expensive than reading.<\/li><\/ol><p>Reader safety is the deciding constraint: paging readers partition cleanly, cursor readers do not; anything relying on a saved position is incompatible with a shared multi-threaded step.<\/p>", "source": "answers.md", "search": "scaling a batch job - multi-threaded step, partitioning, remote chunking and parallel flows. which are safe with which readers? four models, in increasing order of complexity: 1. multi-threaded step - one step, a taskexecutor, many threads sharing one reader and writer. simple, but it requires thread-safe components, breaks reader restartability (the saved position is meaningless when threads interleave), and destroys ordering. safe mainly with a synchronizeditemstreamreader and savestate(false). 2. parallel flows - independent steps running concurrently in a split. trivially safe because nothing is shared; only useful when the work genuinely decomposes into different steps. 3. local partitioning - a partitioner divides the input into ranges (customer ids 1-1000, 1001-2000), and each partition gets its own step execution, own reader and own executioncontext . this is the one i reach for: full restartability per partition, no shared state, and scaling is a matter of the grid size and the executor. it needs a partitionable key with a reasonably even distribution. 4. remote partitioning / remote chunking - the same, distributed over messaging. remote partitioning sends only partition metadata (workers read their own data, so it scales the reader too); remote chunking sends the items to workers, so the manager's reader remains the bottleneck and the network carries the payload. remote chunking is only worth it when processing is far more expensive than reading. reader safety is the deciding constraint: paging readers partition cleanly, cursor readers do not; anything relying on a saved position is incompatible with a shared multi-threaded step."}, {"n": 288, "category": 17, "difficulty": "T", "html": "Why must an <code>ItemWriter<\/code> be idempotent even though each chunk is transactional?", "answerTitle": "Why writers must be idempotent", "answer": "<p>Because &quot;transactional&quot; bounds the <strong>database<\/strong> work in one chunk, and it does not bound anything else, nor does it prevent the chunk from running twice.<\/p><p>Four routes to a repeated write, none of which the chunk transaction addresses:<\/p><ol><li><strong>Restart with a non-restartable reader<\/strong> - the position was never saved, so the step re-reads from the start and rewrites everything already committed.<\/li><li><strong>The skip scan<\/strong> - a fault-tolerant chunk that fails is re-read item by item, so items in that chunk pass through the writer more than once.<\/li><li><strong>The commit-then-crash window<\/strong> - the database commits and the process dies before the job repository records it, or the step execution is left <code>STARTED<\/code> and later restarted from an earlier checkpoint.<\/li><li><strong>Non-database effects<\/strong> - files, HTTP calls, messages and emails are not in the transaction at all, so a rollback leaves them and a replay repeats them.<\/li><\/ol><p>Practically that means: upsert rather than insert (<code>ON CONFLICT DO UPDATE<\/code>, <code>MERGE<\/code>), use a natural or deterministic business key rather than a generated one, write files to a temporary path and rename atomically at step completion, and route messages through an outbox so the publish is part of the same commit. The test I actually run is &quot;execute the job twice against the same input and assert the end state is identical&quot; - if that fails, the job is not production-ready regardless of what the counters say.<\/p>", "source": "answers.md", "search": "why must an itemwriter be idempotent even though each chunk is transactional? because \"transactional\" bounds the database work in one chunk, and it does not bound anything else, nor does it prevent the chunk from running twice. four routes to a repeated write, none of which the chunk transaction addresses: 1. restart with a non-restartable reader - the position was never saved, so the step re-reads from the start and rewrites everything already committed. 2. the skip scan - a fault-tolerant chunk that fails is re-read item by item, so items in that chunk pass through the writer more than once. 3. the commit-then-crash window - the database commits and the process dies before the job repository records it, or the step execution is left started and later restarted from an earlier checkpoint. 4. non-database effects - files, http calls, messages and emails are not in the transaction at all, so a rollback leaves them and a replay repeats them. practically that means: upsert rather than insert (on conflict do update, merge), use a natural or deterministic business key rather than a generated one, write files to a temporary path and rename atomically at step completion, and route messages through an outbox so the publish is part of the same commit. the test i actually run is \"execute the job twice against the same input and assert the end state is identical\" - if that fails, the job is not production-ready regardless of what the counters say."}, {"n": 289, "category": 17, "difficulty": "D", "html": "Spring Batch 5 changes - <code>@EnableBatchProcessing<\/code> no longer required, builder APIs requiring a <code>JobRepository<\/code>, and typed <code>JobParameters<\/code>.", "answerTitle": "Spring Batch 5", "answer": "<p>The changes that matter on upgrade:<\/p><ul><li><strong><code>@EnableBatchProcessing<\/code> is no longer required<\/strong> - Boot 3 auto-configures the infrastructure when <code>spring-boot-starter-batch<\/code> is present. Worse, <em>adding<\/em> it now <strong>switches the auto-configuration off<\/strong> (it backs off via <code>@ConditionalOnMissingBean<\/code>), which is the opposite of the Batch 4 behavior and produces confusing failures on upgrade. Remove it unless you deliberately want manual control.<\/li><li><strong><code>JobBuilderFactory<\/code> and <code>StepBuilderFactory<\/code> are gone.<\/strong> Use <code>new JobBuilder(name, jobRepository)<\/code> and <code>new StepBuilder(name, jobRepository)<\/code>, passing the <code>JobRepository<\/code> and, for chunk steps, the <code>PlatformTransactionManager<\/code> explicitly. This is mechanical but touches every job configuration class.<\/li><li><strong><code>JobParameters<\/code> are typed and generic<\/strong> - <code>new JobParameter&lt;&gt;(value, String.class, true)<\/code>, with the boolean controlling whether the parameter is identifying. The default <code>JobParametersConverter<\/code> changed format, so the command-line syntax gained a type: <code>runDate(java.time.LocalDate)=2026-08-01<\/code>.<\/li><li><strong>Jakarta namespace and Java 17 baseline<\/strong>, in line with the rest of Boot 3.<\/li><li><strong>The metadata schema changed<\/strong> - new columns and sequence handling. In production, run the DDL upgrade script explicitly rather than relying on <code>spring.batch.jdbc.initialize-schema<\/code>, which I set to <code>never<\/code> outside of tests anyway.<\/li><li><code>JobLauncherApplicationRunner<\/code> replaced <code>JobLauncherCommandLineRunner<\/code>, and <code>spring.batch.job.name<\/code> replaced <code>spring.batch.job.names<\/code>.<\/li><\/ul>", "source": "answers.md", "search": "spring batch 5 changes - @enablebatchprocessing no longer required, builder apis requiring a jobrepository, and typed jobparameters. the changes that matter on upgrade: - @enablebatchprocessing is no longer required - boot 3 auto-configures the infrastructure when spring-boot-starter-batch is present. worse, adding it now switches the auto-configuration off (it backs off via @conditionalonmissingbean), which is the opposite of the batch 4 behavior and produces confusing failures on upgrade. remove it unless you deliberately want manual control. - jobbuilderfactory and stepbuilderfactory are gone. use new jobbuilder(name, jobrepository) and new stepbuilder(name, jobrepository), passing the jobrepository and, for chunk steps, the platformtransactionmanager explicitly. this is mechanical but touches every job configuration class. - jobparameters are typed and generic - new jobparameter< (value, string.class, true), with the boolean controlling whether the parameter is identifying. the default jobparametersconverter changed format, so the command-line syntax gained a type: rundate(java.time.localdate)=2026-08-01. - jakarta namespace and java 17 baseline , in line with the rest of boot 3. - the metadata schema changed - new columns and sequence handling. in production, run the ddl upgrade script explicitly rather than relying on spring.batch.jdbc.initialize-schema, which i set to never outside of tests anyway. - joblauncherapplicationrunner replaced joblaunchercommandlinerunner, and spring.batch.job.name replaced spring.batch.job.names."}, {"n": 290, "category": 17, "difficulty": "A", "html": "Running batch as a Kubernetes <code>Job<\/code> versus inside a long-lived Boot service - which do you choose, and how do you test either with <code>JobLauncherTestUtils<\/code>?", "answerTitle": "Kubernetes `Job` versus a long-lived service", "answer": "<p>I default to a <strong>Kubernetes <code>Job<\/code> or <code>CronJob<\/code> running the Boot application with <code>spring.batch.job.enabled=true<\/code><\/strong>, and a <code>spring.batch.job.name<\/code> selecting which job to run. The reasons are operational rather than architectural: the batch workload gets its own resource requests and limits, so a 4 GB sort does not evict the request-serving pods; it gets its own restart policy and backoff; failure is visible as a failed <code>Job<\/code> object rather than a log line inside a healthy service; and the pod exits, so nothing leaks between runs. Scheduling comes from the cluster, which removes the &quot;runs on every instance&quot; problem in Q217 entirely.<\/p><p>The exit code has to be wired correctly or Kubernetes thinks a failed job succeeded: <code>System.exit(SpringApplication.exit(context, ...))<\/code>, with Boot&#x27;s <code>ExitCodeGenerator<\/code> mapping the <code>JobExecution<\/code> status. This is the detail most teams miss.<\/p><p>I keep batch inside a long-lived service only when the job is small, frequent and needs the service&#x27;s warm caches or in-memory state, or when the platform has no job scheduler. Then it is <code>@Scheduled<\/code> plus ShedLock plus a bounded executor, and I accept that a heavy job competes with request traffic.<\/p><p>Testing is the same in both cases:<\/p><pre><code class=\"lang-java\">@SpringBootTest @SpringBatchTest\nclass ImportJobTest {\n  @Autowired JobLauncherTestUtils utils;\n  @Test void skipsBadRowsAndCommits() throws Exception {\n    var params = new JobParametersBuilder().addString(&quot;input&quot;, &quot;classpath:rows.csv&quot;).toJobParameters();\n    JobExecution exec = utils.launchJob(params);\n    assertThat(exec.getExitStatus()).isEqualTo(ExitStatus.COMPLETED);\n    assertThat(exec.getStepExecutions().iterator().next().getSkipCount()).isEqualTo(2);\n  }\n}<\/code><\/pre><p><code>launchStep<\/code> tests one step in isolation, <code>JobRepositoryTestUtils<\/code> clears metadata between tests, and the tests I insist on are the restart test (fail mid-way, relaunch, assert the end state) and the double-run idempotency test from Q288.<\/p>", "source": "answers.md", "search": "running batch as a kubernetes job versus inside a long-lived boot service - which do you choose, and how do you test either with joblaunchertestutils? i default to a kubernetes job or cronjob running the boot application with spring.batch.job.enabled=true , and a spring.batch.job.name selecting which job to run. the reasons are operational rather than architectural: the batch workload gets its own resource requests and limits, so a 4 gb sort does not evict the request-serving pods; it gets its own restart policy and backoff; failure is visible as a failed job object rather than a log line inside a healthy service; and the pod exits, so nothing leaks between runs. scheduling comes from the cluster, which removes the \"runs on every instance\" problem in q217 entirely. the exit code has to be wired correctly or kubernetes thinks a failed job succeeded: system.exit(springapplication.exit(context, ...)), with boot's exitcodegenerator mapping the jobexecution status. this is the detail most teams miss. i keep batch inside a long-lived service only when the job is small, frequent and needs the service's warm caches or in-memory state, or when the platform has no job scheduler. then it is @scheduled plus shedlock plus a bounded executor, and i accept that a heavy job competes with request traffic. testing is the same in both cases: java @springboottest @springbatchtest class importjobtest { @autowired joblaunchertestutils utils; @test void skipsbadrowsandcommits() throws exception { var params = new jobparametersbuilder().addstring(\"input\", \"classpath:rows.csv\").tojobparameters(); jobexecution exec = utils.launchjob(params); assertthat(exec.getexitstatus()).isequalto(exitstatus.completed); assertthat(exec.getstepexecutions().iterator().next().getskipcount()).isequalto(2); } } launchstep tests one step in isolation, jobrepositorytestutils clears metadata between tests, and the tests i insist on are the restart test (fail mid-way, relaunch, assert the end state) and the double-run idempotency test from q288."}, {"n": 291, "category": 18, "difficulty": "C", "html": "Spring Data MongoDB - <code>MongoTemplate<\/code> versus repositories, and how do you run an aggregation pipeline that a derived query cannot express?", "answerTitle": "`MongoTemplate` versus repositories", "answer": "<p>Repositories give derived queries, <code>@Query<\/code> with a JSON filter, paging and the same proxy mechanism as JPA (Q121). <code>MongoTemplate<\/code> is the lower-level API with the full command surface, and both share the same <code>MappingMongoConverter<\/code>, so entities map identically - mixing them is normal, not a smell.<\/p><p>Aggregation is the clearest case for the template, because a pipeline is not expressible as a derived query:<\/p><pre><code class=\"lang-java\">Aggregation agg = Aggregation.newAggregation(\n    Aggregation.match(Criteria.where(&quot;status&quot;).is(&quot;SHIPPED&quot;).and(&quot;createdAt&quot;).gte(from)),\n    Aggregation.group(&quot;customerId&quot;).sum(&quot;total&quot;).as(&quot;revenue&quot;).count().as(&quot;orders&quot;),\n    Aggregation.sort(Sort.Direction.DESC, &quot;revenue&quot;),\n    Aggregation.limit(20));\nList&lt;CustomerRevenue&gt; top = mongoTemplate\n    .aggregate(agg, &quot;orders&quot;, CustomerRevenue.class).getMappedResults();<\/code><\/pre><p>Other template-only work: bulk operations, <code>findAndModify<\/code> for atomic read-modify-write, partial updates with <code>Update.inc<\/code>/<code>set<\/code> (a repository <code>save()<\/code> rewrites the whole document, which loses concurrent field updates), and <code>$<\/code> positional array updates. <code>@Aggregation<\/code> on a repository method covers simple pipelines if you prefer to keep everything in the interface.<\/p><p>The practical caution: aggregation runs in the server with a 100 MB per-stage memory limit unless <code>allowDiskUse<\/code> is set, and <code>$match<\/code> must come first and hit an index or you have written a collection scan with extra steps.<\/p>", "source": "answers.md", "search": "spring data mongodb - mongotemplate versus repositories, and how do you run an aggregation pipeline that a derived query cannot express? repositories give derived queries, @query with a json filter, paging and the same proxy mechanism as jpa (q121). mongotemplate is the lower-level api with the full command surface, and both share the same mappingmongoconverter, so entities map identically - mixing them is normal, not a smell. aggregation is the clearest case for the template, because a pipeline is not expressible as a derived query: java aggregation agg = aggregation.newaggregation( aggregation.match(criteria.where(\"status\").is(\"shipped\").and(\"createdat\").gte(from)), aggregation.group(\"customerid\").sum(\"total\").as(\"revenue\").count().as(\"orders\"), aggregation.sort(sort.direction.desc, \"revenue\"), aggregation.limit(20)); list<customerrevenue top = mongotemplate .aggregate(agg, \"orders\", customerrevenue.class).getmappedresults(); other template-only work: bulk operations, findandmodify for atomic read-modify-write, partial updates with update.inc/set (a repository save() rewrites the whole document, which loses concurrent field updates), and $ positional array updates. @aggregation on a repository method covers simple pipelines if you prefer to keep everything in the interface. the practical caution: aggregation runs in the server with a 100 mb per-stage memory limit unless allowdiskuse is set, and $match must come first and hit an index or you have written a collection scan with extra steps."}, {"n": 292, "category": 18, "difficulty": "T", "html": "Embedding versus referencing a Mongo document - what forces the decision, and what breaks when the embedded array grows unbounded?", "answerTitle": "Embed or reference", "answer": "<p>Embed when the child is owned by the parent, read with it, and bounded - order lines, an address, a settings object. Reference when the child is shared, queried independently, or unbounded.<\/p><p>What forces the decision is the <strong>16 MB document limit combined with the fact that Mongo rewrites and re-indexes the whole document on update<\/strong>. An unbounded embedded array - audit entries, comments, events - is the classic modelling failure. Symptoms in order: documents outgrow their allocation so every update relocates them; index entries multiply because a multi-key index has one entry per array element; reads fetch megabytes to display ten items; the working set stops fitting in RAM and latency collapses; and finally writes fail outright at 16 MB, with the data now unmigratable in place.<\/p><p>The remedies are the <strong>subset pattern<\/strong> (embed the last 20, keep the full history in its own collection) and the <strong>bucket pattern<\/strong> (one document per customer per day holding up to N events). Both preserve the read that motivated embedding without an unbounded array.<\/p><p>I also treat &quot;we will just embed it, it is only a few&quot; as needing a stated upper bound. If nobody can state one, it is a reference.<\/p>", "source": "answers.md", "search": "embedding versus referencing a mongo document - what forces the decision, and what breaks when the embedded array grows unbounded? embed when the child is owned by the parent, read with it, and bounded - order lines, an address, a settings object. reference when the child is shared, queried independently, or unbounded. what forces the decision is the 16 mb document limit combined with the fact that mongo rewrites and re-indexes the whole document on update . an unbounded embedded array - audit entries, comments, events - is the classic modelling failure. symptoms in order: documents outgrow their allocation so every update relocates them; index entries multiply because a multi-key index has one entry per array element; reads fetch megabytes to display ten items; the working set stops fitting in ram and latency collapses; and finally writes fail outright at 16 mb, with the data now unmigratable in place. the remedies are the subset pattern (embed the last 20, keep the full history in its own collection) and the bucket pattern (one document per customer per day holding up to n events). both preserve the read that motivated embedding without an unbounded array. i also treat \"we will just embed it, it is only a few\" as needing a stated upper bound. if nobody can state one, it is a reference."}, {"n": 293, "category": 18, "difficulty": "D", "html": "Mongo transactions in Spring - what does <code>MongoTransactionManager<\/code> require from the deployment, and what should you do instead most of the time?", "answerTitle": "Mongo transactions", "answer": "<p><code>MongoTransactionManager<\/code> makes <code>@Transactional<\/code> work with Mongo, and it plugs into the same abstraction as JDBC (Q59) - <code>TransactionSynchronizationManager<\/code> binds the <code>ClientSession<\/code> to the thread, and the template picks it up.<\/p><p>What the deployment must provide: <strong>a replica set or sharded cluster with the WiredTiger engine<\/strong>. A standalone <code>mongod<\/code> cannot do transactions, which is the classic &quot;works in the test container, fails in the developer&#x27;s local Mongo&quot; report. Multi-document transactions have a default 60-second limit, hold snapshots that pressure the cache, and on a sharded cluster are considerably more expensive.<\/p><p>What to do instead most of the time: <strong>model so you do not need one<\/strong>. Mongo already gives single-document atomicity, so an aggregate that is one document needs no transaction - which is the same aggregate-boundary reasoning as Spring Data JDBC (Q138). Where an operation genuinely spans documents, <code>findAndModify<\/code> for atomic state transitions, an outbox document for downstream effects, and idempotent retries cover most cases. If your domain needs frequent multi-document ACID guarantees, that is evidence the data is relational and the store choice deserves revisiting - a more useful thing to say in an interview than reciting the configuration.<\/p>", "source": "answers.md", "search": "mongo transactions in spring - what does mongotransactionmanager require from the deployment, and what should you do instead most of the time? mongotransactionmanager makes @transactional work with mongo, and it plugs into the same abstraction as jdbc (q59) - transactionsynchronizationmanager binds the clientsession to the thread, and the template picks it up. what the deployment must provide: a replica set or sharded cluster with the wiredtiger engine . a standalone mongod cannot do transactions, which is the classic \"works in the test container, fails in the developer's local mongo\" report. multi-document transactions have a default 60-second limit, hold snapshots that pressure the cache, and on a sharded cluster are considerably more expensive. what to do instead most of the time: model so you do not need one . mongo already gives single-document atomicity, so an aggregate that is one document needs no transaction - which is the same aggregate-boundary reasoning as spring data jdbc (q138). where an operation genuinely spans documents, findandmodify for atomic state transitions, an outbox document for downstream effects, and idempotent retries cover most cases. if your domain needs frequent multi-document acid guarantees, that is evidence the data is relational and the store choice deserves revisiting - a more useful thing to say in an interview than reciting the configuration."}, {"n": 294, "category": 18, "difficulty": "D", "html": "Spring Data Elasticsearch - <code>ElasticsearchOperations<\/code>, index mappings, and reindexing behind an alias with no downtime.", "answerTitle": "Elasticsearch and zero-downtime reindex", "answer": "<p><code>ElasticsearchOperations<\/code> (and the repository abstraction over it) handles CRUD, criteria and native queries; <code>IndexOperations<\/code> manages mappings and aliases. Mappings should be <strong>explicit<\/strong> - dynamic mapping infers a type from the first document it sees, and a field that arrives as <code>&quot;12&quot;<\/code> before it arrives as <code>12<\/code> is now permanently a <code>keyword<\/code>. Since a mapping cannot be changed in place, a mapping change is a reindex.<\/p><p>The alias pattern makes that non-disruptive:<\/p><ol><li>Applications only ever read and write through an alias, <code>orders<\/code>, never a concrete index.<\/li><li>Create <code>orders-v2<\/code> with the new mapping.<\/li><li>Backfill it - <code>_reindex<\/code> from <code>orders-v1<\/code>, or replay from the source of record, which is better because it also fixes anything the old index got wrong.<\/li><li>Dual-write, or capture the changes since the backfill started, so <code>v2<\/code> catches up.<\/li><li>Atomically swap the alias in a single actions call - remove from <code>v1<\/code>, add to <code>v2<\/code>. Readers never see a window with no index.<\/li><li>Keep <code>v1<\/code> for a rollback window, then delete it.<\/li><\/ol><p>Sizing details worth knowing: shard count is fixed at creation, refresh interval controls the near-real-time visibility gap (raise it during a bulk load, then restore it), and <code>BulkOptions<\/code> with a few thousand documents per request beats per-document indexing by an order of magnitude.<\/p>", "source": "answers.md", "search": "spring data elasticsearch - elasticsearchoperations, index mappings, and reindexing behind an alias with no downtime. elasticsearchoperations (and the repository abstraction over it) handles crud, criteria and native queries; indexoperations manages mappings and aliases. mappings should be explicit - dynamic mapping infers a type from the first document it sees, and a field that arrives as \"12\" before it arrives as 12 is now permanently a keyword. since a mapping cannot be changed in place, a mapping change is a reindex. the alias pattern makes that non-disruptive: 1. applications only ever read and write through an alias, orders, never a concrete index. 2. create orders-v2 with the new mapping. 3. backfill it - _reindex from orders-v1, or replay from the source of record, which is better because it also fixes anything the old index got wrong. 4. dual-write, or capture the changes since the backfill started, so v2 catches up. 5. atomically swap the alias in a single actions call - remove from v1, add to v2. readers never see a window with no index. 6. keep v1 for a rollback window, then delete it. sizing details worth knowing: shard count is fixed at creation, refresh interval controls the near-real-time visibility gap (raise it during a bulk load, then restore it), and bulkoptions with a few thousand documents per request beats per-document indexing by an order of magnitude."}, {"n": 295, "category": 18, "difficulty": "T", "html": "Why is Elasticsearch a poor source of record, and what is the correct write path when it is your search tier?", "answerTitle": "Why Elasticsearch is not a source of record", "answer": "<p>Its guarantees are wrong for the job. Indexing is <strong>near-real-time, not immediate<\/strong> - a document is invisible until the next refresh (one second by default), so a read-after-write is not guaranteed. There are no multi-document transactions and no foreign keys. Mappings cannot change, so schema evolution means a reindex. Historically the replication model could lose acknowledged writes under partition, and while that improved substantially, the design point is search availability, not durability. And a corrupted index or a mistaken mapping has no <code>mongodump<\/code> equivalent that reconstructs your business data.<\/p><p>The correct write path is <strong>write to the system of record, then project into the index<\/strong>:<\/p><pre><code>service -&gt; PostgreSQL (source of record) -&gt; outbox table\n        -&gt; relay / CDC -&gt; event stream -&gt; indexer -&gt; Elasticsearch (behind an alias)<\/code><\/pre><p>Properties this gives you: the index is <strong>rebuildable at any time<\/strong> from the database (which is what makes a mapping change routine rather than an incident), the write path is not coupled to search availability, and search-side failures degrade a feature instead of failing the transaction. Never dual-write from the application to both, since that has no atomicity and drifts silently.<\/p><p>The consequence to design for is lag: the UI must tolerate a just-created item not yet appearing in search, which is the read-your-own-writes problem, usually solved by reading the item itself from the database on the detail page rather than from the index.<\/p>", "source": "answers.md", "search": "why is elasticsearch a poor source of record, and what is the correct write path when it is your search tier? its guarantees are wrong for the job. indexing is near-real-time, not immediate - a document is invisible until the next refresh (one second by default), so a read-after-write is not guaranteed. there are no multi-document transactions and no foreign keys. mappings cannot change, so schema evolution means a reindex. historically the replication model could lose acknowledged writes under partition, and while that improved substantially, the design point is search availability, not durability. and a corrupted index or a mistaken mapping has no mongodump equivalent that reconstructs your business data. the correct write path is write to the system of record, then project into the index : service - postgresql (source of record) - outbox table - relay / cdc - event stream - indexer - elasticsearch (behind an alias) properties this gives you: the index is rebuildable at any time from the database (which is what makes a mapping change routine rather than an incident), the write path is not coupled to search availability, and search-side failures degrade a feature instead of failing the transaction. never dual-write from the application to both, since that has no atomicity and drifts silently. the consequence to design for is lag: the ui must tolerate a just-created item not yet appearing in search, which is the read-your-own-writes problem, usually solved by reading the item itself from the database on the detail page rather than from the index."}, {"n": 296, "category": 18, "difficulty": "T", "html": "Two stores in one application - JPA and Mongo repositories in the same package. What goes wrong, and how does <code>@EnableJpaRepositories(basePackages = ...)<\/code> fix it?", "answerTitle": "Two stores in one application", "answer": "<p>Spring Data&#x27;s repository scanners are per-store, and each one is greedy. With <code>OrderRepository extends JpaRepository<\/code> and <code>AuditRepository extends MongoRepository<\/code> in the same package, <strong>both<\/strong> scanners try to claim both interfaces. Depending on version and ordering you get either a startup failure - along the lines of &quot;no property found&quot; or an inability to determine the module - or the quieter disaster where an interface is bound to the wrong store and queries go somewhere unexpected.<\/p><p>Spring Data uses strict, then relaxed, then finally ambiguous resolution: strict mode only claims an interface if the repository type is store-specific, or the domain type carries a store-specific annotation (<code>@Document<\/code> versus <code>@Entity<\/code>), or the package is exclusively configured for one store. Multiple stores means you must be explicit:<\/p><pre><code class=\"lang-java\">@Configuration\n@EnableJpaRepositories(basePackages = &quot;com.acme.orders.jpa&quot;,\n                       entityManagerFactoryRef = &quot;orderEmf&quot;,\n                       transactionManagerRef = &quot;orderTx&quot;)\n@EnableMongoRepositories(basePackages = &quot;com.acme.audit.mongo&quot;)\nclass PersistenceConfig { }<\/code><\/pre><p>The conventions I enforce: <strong>separate packages per store, never mixed<\/strong>; store-specific base interfaces (<code>JpaRepository<\/code>, not <code>CrudRepository<\/code>) so strict resolution succeeds; entities annotated for exactly one store; and explicit <code>basePackages<\/code> on every <code>@Enable*Repositories<\/code>. Transactions do not span the two - <code>@Transactional<\/code> picks one manager (Q66), and the other store&#x27;s write is outside it, so the same idempotency and outbox reasoning applies.<\/p>", "source": "answers.md", "search": "two stores in one application - jpa and mongo repositories in the same package. what goes wrong, and how does @enablejparepositories(basepackages = ...) fix it? spring data's repository scanners are per-store, and each one is greedy. with orderrepository extends jparepository and auditrepository extends mongorepository in the same package, both scanners try to claim both interfaces. depending on version and ordering you get either a startup failure - along the lines of \"no property found\" or an inability to determine the module - or the quieter disaster where an interface is bound to the wrong store and queries go somewhere unexpected. spring data uses strict, then relaxed, then finally ambiguous resolution: strict mode only claims an interface if the repository type is store-specific, or the domain type carries a store-specific annotation (@document versus @entity), or the package is exclusively configured for one store. multiple stores means you must be explicit: java @configuration @enablejparepositories(basepackages = \"com.acme.orders.jpa\", entitymanagerfactoryref = \"orderemf\", transactionmanagerref = \"ordertx\") @enablemongorepositories(basepackages = \"com.acme.audit.mongo\") class persistenceconfig { } the conventions i enforce: separate packages per store, never mixed ; store-specific base interfaces (jparepository, not crudrepository) so strict resolution succeeds; entities annotated for exactly one store; and explicit basepackages on every @enable repositories. transactions do not span the two - @transactional picks one manager (q66), and the other store's write is outside it, so the same idempotency and outbox reasoning applies."}, {"n": 297, "category": 18, "difficulty": "D", "html": "<code>@RedisHash<\/code> and Redis repositories versus using Redis as a cache - key expiry semantics, secondary indexes, and Spring Session with Spring Security.", "answerTitle": "Redis repositories, Spring Session and Security", "answer": "<p><code>@RedisHash(&quot;session&quot;)<\/code> with <code>CrudRepository<\/code> maps an object to a Redis hash and gives you repository semantics over Redis. The mechanics people get wrong:<\/p><ul><li><strong>Expiry is per object<\/strong>, via <code>@TimeToLive<\/code> or the <code>timeToLive<\/code> attribute, and Redis expires the hash. Spring Data additionally maintains a <strong>phantom copy<\/strong> with a slightly longer TTL plus keyspace-notification listeners, so it can clean up secondary indexes when the primary key expires. Keyspace notifications must be enabled on the server (<code>notify-keyspace-events Ex<\/code>) or indexes leak entries pointing at keys that no longer exist.<\/li><li><strong>Secondary indexes<\/strong> come from <code>@Indexed<\/code> and are implemented as Redis sets that Spring Data maintains on write. They are not free, they are not transactional with the primary write, and they are the main reason a Redis repository is more expensive than a plain <code>RedisTemplate<\/code> call.<\/li><\/ul><p>Cache versus store of record is the framing (Q140): as a repository you are treating Redis as a store, so you must answer what happens when it restarts without persistence, or fails over and loses the tail of the replication stream. Fine for sessions and ephemeral state; not fine for anything you cannot regenerate.<\/p><p><strong>Spring Session with Redis<\/strong> (<code>@EnableRedisHttpSession<\/code>) replaces the container&#x27;s <code>HttpSession<\/code> with a Redis-backed one via <code>SessionRepositoryFilter<\/code>, which must be ordered <strong>before<\/strong> the Spring Security filter chain so that <code>HttpSessionSecurityContextRepository<\/code> reads and writes the shared session (Q148). Boot orders it correctly by default; hand-registering the filter is how people break it. What you gain is stateless application instances - no sticky sessions, no session loss on deploy - plus centralized invalidation and concurrency control. What you pay is a Redis round trip on every request that touches the session, and a hard dependency: Redis down means nobody is logged in. Keep the session small (an ID and authorities, not a shopping cart), set an idle timeout, and use <code>flushMode<\/code> deliberately.<\/p>", "source": "answers.md", "search": "@redishash and redis repositories versus using redis as a cache - key expiry semantics, secondary indexes, and spring session with spring security. @redishash(\"session\") with crudrepository maps an object to a redis hash and gives you repository semantics over redis. the mechanics people get wrong: - expiry is per object , via @timetolive or the timetolive attribute, and redis expires the hash. spring data additionally maintains a phantom copy with a slightly longer ttl plus keyspace-notification listeners, so it can clean up secondary indexes when the primary key expires. keyspace notifications must be enabled on the server (notify-keyspace-events ex) or indexes leak entries pointing at keys that no longer exist. - secondary indexes come from @indexed and are implemented as redis sets that spring data maintains on write. they are not free, they are not transactional with the primary write, and they are the main reason a redis repository is more expensive than a plain redistemplate call. cache versus store of record is the framing (q140): as a repository you are treating redis as a store, so you must answer what happens when it restarts without persistence, or fails over and loses the tail of the replication stream. fine for sessions and ephemeral state; not fine for anything you cannot regenerate. spring session with redis (@enableredishttpsession) replaces the container's httpsession with a redis-backed one via sessionrepositoryfilter, which must be ordered before the spring security filter chain so that httpsessionsecuritycontextrepository reads and writes the shared session (q148). boot orders it correctly by default; hand-registering the filter is how people break it. what you gain is stateless application instances - no sticky sessions, no session loss on deploy - plus centralized invalidation and concurrency control. what you pay is a redis round trip on every request that touches the session, and a hard dependency: redis down means nobody is logged in. keep the session small (an id and authorities, not a shopping cart), set an idle timeout, and use flushmode deliberately."}, {"n": 298, "category": 19, "difficulty": "C", "html": "Spring Cloud Kubernetes - how do ConfigMaps and Secrets become a <code>PropertySource<\/code>, and what RBAC does the pod need?", "answerTitle": "ConfigMaps and Secrets as a `PropertySource`", "answer": "<p><code>spring-cloud-starter-kubernetes-client-config<\/code> registers a <code>PropertySource<\/code> during bootstrap (or via <code>spring.config.import: kubernetes:<\/code> in the <code>ConfigData<\/code> model, Q27) that reads a ConfigMap named after <code>spring.application.name<\/code> in the pod&#x27;s namespace and contributes its entries to the <code>Environment<\/code>. Keys can be flat (<code>key: value<\/code> pairs become properties directly) or a whole <code>application.yaml<\/code> entry that is parsed as YAML. Secrets work the same way, base64-decoded, and are disabled by default because reading them requires broader RBAC.<\/p><p>The pod needs a <code>Role<\/code> granting <code>get<\/code>, <code>list<\/code> and <code>watch<\/code> on <code>configmaps<\/code> (and <code>secrets<\/code> if enabled), bound to its service account:<\/p><pre><code class=\"lang-yaml\">rules:\n  - apiGroups: [&quot;&quot;]\n    resources: [&quot;configmaps&quot;, &quot;secrets&quot;]\n    verbs: [&quot;get&quot;, &quot;list&quot;, &quot;watch&quot;]<\/code><\/pre><p>The point I make when this comes up in design review: this is one of two ways to get a ConfigMap into an application, and the other one - mounting it as a volume or projecting it into environment variables - needs <strong>no permissions, no library and no API dependency<\/strong>, and Boot reads a mounted file natively through <code>spring.config.import: configtree:/etc/config/<\/code>. I only take the API-based route when I actively want dynamic reload; otherwise the mount is strictly simpler and does not give the pod read access to the namespace&#x27;s secrets.<\/p>", "source": "answers.md", "search": "spring cloud kubernetes - how do configmaps and secrets become a propertysource, and what rbac does the pod need? spring-cloud-starter-kubernetes-client-config registers a propertysource during bootstrap (or via spring.config.import: kubernetes: in the configdata model, q27) that reads a configmap named after spring.application.name in the pod's namespace and contributes its entries to the environment. keys can be flat (key: value pairs become properties directly) or a whole application.yaml entry that is parsed as yaml. secrets work the same way, base64-decoded, and are disabled by default because reading them requires broader rbac. the pod needs a role granting get, list and watch on configmaps (and secrets if enabled), bound to its service account: yaml rules: - apigroups: [\"\"] resources: [\"configmaps\", \"secrets\"] verbs: [\"get\", \"list\", \"watch\"] the point i make when this comes up in design review: this is one of two ways to get a configmap into an application, and the other one - mounting it as a volume or projecting it into environment variables - needs no permissions, no library and no api dependency , and boot reads a mounted file natively through spring.config.import: configtree:/etc/config/. i only take the api-based route when i actively want dynamic reload; otherwise the mount is strictly simpler and does not give the pod read access to the namespace's secrets."}, {"n": 299, "category": 19, "difficulty": "T", "html": "Config reload modes - <code>polling<\/code> versus <code>event<\/code>, <code>refresh<\/code> versus <code>restart_context<\/code> versus <code>shutdown<\/code>. Which would you enable in production, and why is automatic reload risky?", "answerTitle": "Reload modes", "answer": "<p><code>spring.cloud.kubernetes.reload<\/code> has two detection modes and three strategies.<\/p><p>Detection: <code>polling<\/code> re-reads the ConfigMap on an interval (works everywhere, costs API calls); <code>event<\/code> watches the Kubernetes API for changes (immediate, but needs <code>watch<\/code> permission and a resilient reconnect, and a watch that silently dies stops all updates with no symptom).<\/p><p>Strategies, in increasing order of blast radius:<\/p><ul><li><code>refresh<\/code> - fires <code>RefreshEvent<\/code>, rebinding <code>@ConfigurationProperties<\/code> and clearing <code>@RefreshScope<\/code> beans (Q38, Q206). Cheap, but only affects things that are actually refreshable.<\/li><li><code>restart_context<\/code> - closes and restarts the application context in place. Everything is rebuilt; connections are re-established; it takes real time and the pod stays <code>Ready<\/code> while doing it.<\/li><li><code>shutdown<\/code> - exits the process and lets Kubernetes restart the pod, which is a full rolling restart if the ConfigMap is shared.<\/li><\/ul><p>In production I default to <strong>reload disabled<\/strong>. The reasons are the ones that matter at 3am: a ConfigMap edit becomes an untracked, un-reviewed change that takes effect immediately across every pod simultaneously, with no rollout, no canary and no <code>kubectl rollout undo<\/code>. Pods that started at different times can hold different configurations, so behavior depends on pod age - the worst kind of bug to reproduce. Only a subset of state actually re-reads, so you get a half-applied configuration (a changed pool size that the existing <code>DataSource<\/code> ignores, for instance). And an operator editing a ConfigMap does not expect to restart a fleet, which <code>shutdown<\/code> does.<\/p><p>What I do instead: treat configuration as a deployment. Change the ConfigMap in Git, add a checksum annotation to the pod template so the change triggers a normal rolling update, and get a progressive rollout with health gating and a rollback path for free. I enable <code>refresh<\/code> only for a narrow, explicitly refreshable set - feature flags and log levels - and even those are better served by a purpose-built flag system.<\/p>", "source": "answers.md", "search": "config reload modes - polling versus event, refresh versus restart_context versus shutdown. which would you enable in production, and why is automatic reload risky? spring.cloud.kubernetes.reload has two detection modes and three strategies. detection: polling re-reads the configmap on an interval (works everywhere, costs api calls); event watches the kubernetes api for changes (immediate, but needs watch permission and a resilient reconnect, and a watch that silently dies stops all updates with no symptom). strategies, in increasing order of blast radius: - refresh - fires refreshevent, rebinding @configurationproperties and clearing @refreshscope beans (q38, q206). cheap, but only affects things that are actually refreshable. - restart_context - closes and restarts the application context in place. everything is rebuilt; connections are re-established; it takes real time and the pod stays ready while doing it. - shutdown - exits the process and lets kubernetes restart the pod, which is a full rolling restart if the configmap is shared. in production i default to reload disabled . the reasons are the ones that matter at 3am: a configmap edit becomes an untracked, un-reviewed change that takes effect immediately across every pod simultaneously, with no rollout, no canary and no kubectl rollout undo. pods that started at different times can hold different configurations, so behavior depends on pod age - the worst kind of bug to reproduce. only a subset of state actually re-reads, so you get a half-applied configuration (a changed pool size that the existing datasource ignores, for instance). and an operator editing a configmap does not expect to restart a fleet, which shutdown does. what i do instead: treat configuration as a deployment. change the configmap in git, add a checksum annotation to the pod template so the change triggers a normal rolling update, and get a progressive rollout with health gating and a rollback path for free. i enable refresh only for a narrow, explicitly refreshable set - feature flags and log levels - and even those are better served by a purpose-built flag system."}, {"n": 300, "category": 19, "difficulty": "D", "html": "<code>DiscoveryClient<\/code> backed by the Kubernetes API versus plain Service DNS - what do you gain, and what does it cost you in permissions and coupling?", "answerTitle": "`DiscoveryClient` versus Service DNS", "answer": "<p><code>spring-cloud-kubernete
