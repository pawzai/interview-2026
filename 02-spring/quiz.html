 that the repository is treated as a general-purpose query API by every caller, and that nobody owns the data layer.<\/p><p>What I do about it:<\/p><ul><li><strong>Separate reads from writes.<\/strong> The repository serves the aggregate for <em>writes<\/em>; read-heavy screens get purpose-built query objects returning DTOs, often with <code>JdbcClient<\/code> or a dedicated query service. That single split removes most of the sprawl, because the pressure came from read shapes.<\/li><li><strong>Push variability into parameters, not method names.<\/strong> One <code>Specification<\/code>-based <code>search(criteria, pageable)<\/code> replaces thirty <code>findByAAndBAndC<\/code> variants.<\/li><li><strong>Own the aggregate boundary.<\/strong> If a repository has finders for every field, the aggregate is probably too large or is being used as a database gateway rather than a domain concept.<\/li><li><strong>Review the data layer as a design artifact<\/strong>, not as incidental plumbing - I would put a named owner on it and include SQL review in the definition of done for new query methods.<\/li><li><strong>Instrument it.<\/strong> Query-count assertions in tests and per-query metrics make the cost of a careless finder visible, which changes behavior more than a guideline does.<\/li><\/ul><p>Realistically I would not clean up all 200 at once; I would freeze growth with the review rule, then consolidate the top twenty by call volume.<\/p>", "source": "answers.md", "search": "how do you stop a repository layer from growing into 200 bespoke query methods? two hundred bespoke finders is a symptom, not the disease. the causes are usually that every screen gets its own query method, that the repository is treated as a general-purpose query api by every caller, and that nobody owns the data layer. what i do about it: - separate reads from writes. the repository serves the aggregate for writes ; read-heavy screens get purpose-built query objects returning dtos, often with jdbcclient or a dedicated query service. that single split removes most of the sprawl, because the pressure came from read shapes. - push variability into parameters, not method names. one specification-based search(criteria, pageable) replaces thirty findbyaandbandc variants. - own the aggregate boundary. if a repository has finders for every field, the aggregate is probably too large or is being used as a database gateway rather than a domain concept. - review the data layer as a design artifact , not as incidental plumbing - i would put a named owner on it and include sql review in the definition of done for new query methods. - instrument it. query-count assertions in tests and per-query metrics make the cost of a careless finder visible, which changes behavior more than a guideline does. realistically i would not clean up all 200 at once; i would freeze growth with the review rule, then consolidate the top twenty by call volume."}, {"n": 143, "category": 8, "difficulty": "C", "html": "The <code>SecurityFilterChain<\/code> bean DSL - how are multiple chains selected and ordered?", "answerTitle": "Multiple `SecurityFilterChain` beans", "answer": "<p>Each <code>SecurityFilterChain<\/code> bean is registered with <code>FilterChainProxy<\/code>, which holds them <strong>in order<\/strong> and dispatches a request to the <strong>first chain whose <code>securityMatcher<\/code> matches<\/strong> - and only that chain. Chains are ordered by <code>@Order<\/code> on the bean method.<\/p><pre><code class=\"lang-java\">@Bean @Order(1) SecurityFilterChain actuator(HttpSecurity http) throws Exception {\n    return http.securityMatcher(&quot;/actuator/**&quot;)\n        .authorizeHttpRequests(a -&gt; a.anyRequest().hasRole(&quot;OPS&quot;))\n        .httpBasic(withDefaults()).build();\n}\n\n@Bean @Order(2) SecurityFilterChain api(HttpSecurity http) throws Exception {\n    return http.securityMatcher(&quot;/api/**&quot;)\n        .authorizeHttpRequests(a -&gt; a.anyRequest().authenticated())\n        .oauth2ResourceServer(o -&gt; o.jwt(withDefaults()))\n        .csrf(CsrfConfigurer::disable).sessionManagement(s -&gt; s.sessionCreationPolicy(STATELESS)).build();\n}<\/code><\/pre><p>This is how you give the API bearer-token authentication and the admin UI form login in one application, with genuinely independent configuration.<\/p>", "source": "answers.md", "search": "the securityfilterchain bean dsl - how are multiple chains selected and ordered? each securityfilterchain bean is registered with filterchainproxy, which holds them in order and dispatches a request to the first chain whose securitymatcher matches - and only that chain. chains are ordered by @order on the bean method. java @bean @order(1) securityfilterchain actuator(httpsecurity http) throws exception { return http.securitymatcher(\"/actuator/ \") .authorizehttprequests(a - a.anyrequest().hasrole(\"ops\")) .httpbasic(withdefaults()).build(); } @bean @order(2) securityfilterchain api(httpsecurity http) throws exception { return http.securitymatcher(\"/api/ \") .authorizehttprequests(a - a.anyrequest().authenticated()) .oauth2resourceserver(o - o.jwt(withdefaults())) .csrf(csrfconfigurer::disable).sessionmanagement(s - s.sessioncreationpolicy(stateless)).build(); } this is how you give the api bearer-token authentication and the admin ui form login in one application, with genuinely independent configuration."}, {"n": 144, "category": 8, "difficulty": "T", "html": "You define two chains and the first has no <code>securityMatcher<\/code>. What happens to the second, and why?", "answerTitle": "A chain with no matcher", "answer": "<p>A chain without <code>securityMatcher<\/code> matches <strong>every<\/strong> request. Since dispatch stops at the first match, a matcher-less chain ordered before another makes the later one <strong>completely unreachable<\/strong> - and there is no error, no warning, and no startup failure. The application simply enforces rules you did not intend.<\/p><p>The symptom is usually &quot;our API chain is being ignored and everything is redirecting to the login page&quot;, because the catch-all UI chain was declared first.<\/p><p>Rules I apply: always give every chain an explicit <code>@Order<\/code> and an explicit <code>securityMatcher<\/code>, except for exactly one deliberate catch-all which is ordered <strong>last<\/strong>. And test it - a parameterized test asserting the expected status for a representative URL per chain catches this immediately, whereas reading the configuration does not.<\/p>", "source": "answers.md", "search": "you define two chains and the first has no securitymatcher. what happens to the second, and why? a chain without securitymatcher matches every request. since dispatch stops at the first match, a matcher-less chain ordered before another makes the later one completely unreachable - and there is no error, no warning, and no startup failure. the application simply enforces rules you did not intend. the symptom is usually \"our api chain is being ignored and everything is redirecting to the login page\", because the catch-all ui chain was declared first. rules i apply: always give every chain an explicit @order and an explicit securitymatcher, except for exactly one deliberate catch-all which is ordered last . and test it - a parameterized test asserting the expected status for a representative url per chain catches this immediately, whereas reading the configuration does not."}, {"n": 145, "category": 8, "difficulty": "D", "html": "<code>AuthorizationManager<\/code> - the Spring Security 6 authorization model. What did it replace, and why?", "answerTitle": "`AuthorizationManager`", "answer": "<p>Spring Security 6 replaced the <code>AccessDecisionManager<\/code> / <code>AccessDecisionVoter<\/code> / <code>ConfigAttribute<\/code> model with a single functional interface:<\/p><pre><code class=\"lang-java\">AuthorizationDecision check(Supplier&lt;Authentication&gt; authentication, T object);<\/code><\/pre><p>The differences that matter: the <code>Authentication<\/code> is a <strong><code>Supplier<\/code><\/strong>, so it is only resolved if a rule actually needs it (a cheap <code>permitAll<\/code> no longer forces session lookup); the model is composable with <code>AuthorizationManagers.allOf<\/code>/<code>anyOf<\/code> rather than a voter-consensus strategy; it is used uniformly for web requests, method security and messaging, where previously each had its own mechanism; and it returns a decision object that can carry detail rather than an int vote.<\/p><p>A custom rule is now just a lambda or a small class, which makes tenant or ownership checks far easier to express than writing a voter did.<\/p>", "source": "answers.md", "search": "authorizationmanager - the spring security 6 authorization model. what did it replace, and why? spring security 6 replaced the accessdecisionmanager / accessdecisionvoter / configattribute model with a single functional interface: java authorizationdecision check(supplier<authentication authentication, t object); the differences that matter: the authentication is a supplier , so it is only resolved if a rule actually needs it (a cheap permitall no longer forces session lookup); the model is composable with authorizationmanagers.allof/anyof rather than a voter-consensus strategy; it is used uniformly for web requests, method security and messaging, where previously each had its own mechanism; and it returns a decision object that can carry detail rather than an int vote. a custom rule is now just a lambda or a small class, which makes tenant or ownership checks far easier to express than writing a voter did."}, {"n": 146, "category": 8, "difficulty": "D", "html": "<code>authorizeHttpRequests<\/code> versus the removed <code>authorizeRequests<\/code> - what changed semantically, not just in name?", "answerTitle": "`authorizeHttpRequests` versus `authorizeRequests`", "answer": "<p><code>authorizeRequests<\/code> used the old <code>FilterSecurityInterceptor<\/code> and voter model, and was removed in Spring Security 6. <code>authorizeHttpRequests<\/code> uses <code>AuthorizationFilter<\/code> and <code>AuthorizationManager<\/code>.<\/p><p>Semantic changes, not just a rename:<\/p><ul><li><strong><code>AuthorizationFilter<\/code> runs later in the chain<\/strong> than <code>FilterSecurityInterceptor<\/code> did, and by default it applies to <strong>all dispatcher types<\/strong> including <code>ERROR<\/code> and <code>FORWARD<\/code>. That means the <code>/error<\/code> dispatch is now authorized too - a common upgrade surprise where errors turn into 403s or redirect loops.<\/li><li>Matcher methods changed: <code>antMatchers<\/code>, <code>mvcMatchers<\/code> and <code>regexMatchers<\/code> were unified into <strong><code>requestMatchers<\/code><\/strong>, which selects an appropriate matcher implementation automatically and, importantly, uses MVC-aware matching when Spring MVC is present - which closes the path-matching mismatch that used to allow security bypasses.<\/li><li>Authentication is lazily resolved, as above.<\/li><\/ul>", "source": "answers.md", "search": "authorizehttprequests versus the removed authorizerequests - what changed semantically, not just in name? authorizerequests used the old filtersecurityinterceptor and voter model, and was removed in spring security 6. authorizehttprequests uses authorizationfilter and authorizationmanager. semantic changes, not just a rename: - authorizationfilter runs later in the chain than filtersecurityinterceptor did, and by default it applies to all dispatcher types including error and forward. that means the /error dispatch is now authorized too - a common upgrade surprise where errors turn into 403s or redirect loops. - matcher methods changed: antmatchers, mvcmatchers and regexmatchers were unified into requestmatchers , which selects an appropriate matcher implementation automatically and, importantly, uses mvc-aware matching when spring mvc is present - which closes the path-matching mismatch that used to allow security bypasses. - authentication is lazily resolved, as above."}, {"n": 147, "category": 8, "difficulty": "D", "html": "A custom <code>AuthenticationProvider<\/code> versus a custom filter - which do you write for which problem?", "answerTitle": "Custom `AuthenticationProvider` versus custom filter", "answer": "<p>Write an <strong><code>AuthenticationProvider<\/code><\/strong> when the credentials arrive through an existing mechanism and only the <em>verification<\/em> differs - validating against an LDAP directory, a legacy password store, or an extra factor. You implement <code>authenticate()<\/code> and <code>supports()<\/code>, and slot it into <code>ProviderManager<\/code>; everything else in the chain is unchanged.<\/p><p>Write a <strong>filter<\/strong> when the credentials arrive in a <em>new way<\/em> that no existing filter knows how to extract - a custom header, a signed request, an mTLS certificate attribute, an API key. The filter&#x27;s job is to extract the credential, build an unauthenticated <code>Authentication<\/code> token, hand it to the <code>AuthenticationManager<\/code>, and store the result.<\/p><p>The mistake I look for is a filter that does both extraction <em>and<\/em> verification, bypassing <code>AuthenticationManager<\/code> entirely. That works, and then it silently skips the event publishing, the credential erasure, the provider chain and the standard failure handling - so behavior diverges from the rest of the application in ways nobody documents.<\/p>", "source": "answers.md", "search": "a custom authenticationprovider versus a custom filter - which do you write for which problem? write an authenticationprovider when the credentials arrive through an existing mechanism and only the verification differs - validating against an ldap directory, a legacy password store, or an extra factor. you implement authenticate() and supports(), and slot it into providermanager; everything else in the chain is unchanged. write a filter when the credentials arrive in a new way that no existing filter knows how to extract - a custom header, a signed request, an mtls certificate attribute, an api key. the filter's job is to extract the credential, build an unauthenticated authentication token, hand it to the authenticationmanager, and store the result. the mistake i look for is a filter that does both extraction and verification, bypassing authenticationmanager entirely. that works, and then it silently skips the event publishing, the credential erasure, the provider chain and the standard failure handling - so behavior diverges from the rest of the application in ways nobody documents."}, {"n": 148, "category": 8, "difficulty": "D", "html": "<code>SecurityContextRepository<\/code> and the Spring Security 6 change that requires explicit saving.", "answerTitle": "`SecurityContextRepository` and explicit saving", "answer": "<p>In Spring Security 5, <code>SecurityContextPersistenceFilter<\/code> automatically <em>saved<\/em> the context to the <code>HttpSession<\/code> at the end of the request. In 6, that filter was replaced by <code>SecurityContextHolderFilter<\/code>, which <strong>only reads<\/strong> - saving is now the responsibility of whatever authenticates.<\/p><p>The built-in authentication filters do it correctly. <strong>Custom filters do not<\/strong>, unless you added it:<\/p><pre><code class=\"lang-java\">SecurityContext context = SecurityContextHolder.createEmptyContext();\ncontext.setAuthentication(authentication);\nSecurityContextHolder.setContext(context);\nsecurityContextRepository.saveContext(context, request, response);   // now required<\/code><\/pre><p>The rationale for the change is performance and correctness: the old filter had to inspect the context on every request to decide whether to save, which caused unnecessary session writes and made session replication expensive.<\/p>", "source": "answers.md", "search": "securitycontextrepository and the spring security 6 change that requires explicit saving. in spring security 5, securitycontextpersistencefilter automatically saved the context to the httpsession at the end of the request. in 6, that filter was replaced by securitycontextholderfilter, which only reads - saving is now the responsibility of whatever authenticates. the built-in authentication filters do it correctly. custom filters do not , unless you added it: java securitycontext context = securitycontextholder.createemptycontext(); context.setauthentication(authentication); securitycontextholder.setcontext(context); securitycontextrepository.savecontext(context, request, response); // now required the rationale for the change is performance and correctness: the old filter had to inspect the context on every request to decide whether to save, which caused unnecessary session writes and made session replication expensive."}, {"n": 149, "category": 8, "difficulty": "T", "html": "After upgrading to Security 6, authentication succeeds but the user is anonymous on the next request. What is the cause?", "answerTitle": "Authentication lost after upgrade", "answer": "<p>This is Q148 in its symptom form: a custom authentication filter sets the <code>SecurityContextHolder<\/code> but never calls <code>saveContext<\/code>. Under Security 5 the persistence filter saved it implicitly; under 6 nothing does, so the context exists for that request only and the next request is anonymous.<\/p><p>It is a particularly nasty upgrade bug because the failing request <em>succeeds<\/em> - login works, and the failure appears on the following request, so it looks like a session or cookie problem rather than a code problem.<\/p><p>Fixes: call <code>saveContext<\/code> explicitly (and construct a new context rather than mutating the existing one, which the API now warns about); or set <code>securityContextRepository<\/code> on the DSL and let the framework&#x27;s filters handle it; or for a stateless API, confirm you actually want <code>NullSecurityContextRepository<\/code> and the behavior is correct as-is.<\/p>", "source": "answers.md", "search": "after upgrading to security 6, authentication succeeds but the user is anonymous on the next request. what is the cause? this is q148 in its symptom form: a custom authentication filter sets the securitycontextholder but never calls savecontext. under security 5 the persistence filter saved it implicitly; under 6 nothing does, so the context exists for that request only and the next request is anonymous. it is a particularly nasty upgrade bug because the failing request succeeds - login works, and the failure appears on the following request, so it looks like a session or cookie problem rather than a code problem. fixes: call savecontext explicitly (and construct a new context rather than mutating the existing one, which the api now warns about); or set securitycontextrepository on the dsl and let the framework's filters handle it; or for a stateless api, confirm you actually want nullsecuritycontextrepository and the behavior is correct as-is."}, {"n": 150, "category": 8, "difficulty": "D", "html": "Session fixation protection strategies and session concurrency control.", "answerTitle": "Session fixation and concurrency", "answer": "<p><strong>Session fixation<\/strong>: an attacker sets a known session ID before login and reuses it afterwards. Spring&#x27;s default strategy is <code>changeSessionId()<\/code> (Servlet 3.1+), which keeps the session attributes but issues a new ID at authentication. <code>migrateSession<\/code> copies to a brand-new session; <code>newSession<\/code> starts empty; <code>none<\/code> disables protection and should never be used.<\/p><p><strong>Concurrency control<\/strong> limits simultaneous sessions per principal:<\/p><pre><code class=\"lang-java\">http.sessionManagement(s -&gt; s\n    .sessionFixation(f -&gt; f.changeSessionId())\n    .maximumSessions(1).maxSessionsPreventsLogin(false));<\/code><\/pre><p><code>maxSessionsPreventsLogin(false)<\/code> expires the oldest session; <code>true<\/code> rejects the new login. The operational catch is that this requires a <code>SessionRegistry<\/code>, and in a multi-instance deployment an in-memory registry only sees one instance&#x27;s sessions - so you need Spring Session with Redis for it to mean anything. Teams frequently enable it, test it locally, and ship something that does nothing in production.<\/p>", "source": "answers.md", "search": "session fixation protection strategies and session concurrency control. session fixation : an attacker sets a known session id before login and reuses it afterwards. spring's default strategy is changesessionid() (servlet 3.1+), which keeps the session attributes but issues a new id at authentication. migratesession copies to a brand-new session; newsession starts empty; none disables protection and should never be used. concurrency control limits simultaneous sessions per principal: java http.sessionmanagement(s - s .sessionfixation(f - f.changesessionid()) .maximumsessions(1).maxsessionspreventslogin(false)); maxsessionspreventslogin(false) expires the oldest session; true rejects the new login. the operational catch is that this requires a sessionregistry, and in a multi-instance deployment an in-memory registry only sees one instance's sessions - so you need spring session with redis for it to mean anything. teams frequently enable it, test it locally, and ship something that does nothing in production."}, {"n": 151, "category": 8, "difficulty": "D", "html": "<code>SecurityContextHolder<\/code> strategies - thread-local, inheritable thread-local and global. When would you change the default?", "answerTitle": "`SecurityContextHolder` strategies", "answer": "<ul><li><code>MODE_THREADLOCAL<\/code> (default) - per-thread, cleared at the end of each request.<\/li><li><code>MODE_INHERITABLETHREADLOCAL<\/code> - child threads inherit the context. Tempting for async, but dangerous with <strong>pooled<\/strong> threads: the inheritance happens at thread <em>creation<\/em>, so a pooled thread keeps whichever context it inherited first and later tasks silently run as the wrong user. That is a privilege-escalation bug, not just a nuisance.<\/li><li><code>MODE_GLOBAL<\/code> - one context for the whole JVM. Only for standalone single-user applications.<\/li><\/ul><p>I change the default essentially never. For async propagation the correct tools are <code>DelegatingSecurityContextAsyncTaskExecutor<\/code>, <code>DelegatingSecurityContextRunnable<\/code>, or a <code>TaskDecorator<\/code> - all of which copy the context per <em>task<\/em> rather than per thread, which is the semantics you actually want.<\/p>", "source": "answers.md", "search": "securitycontextholder strategies - thread-local, inheritable thread-local and global. when would you change the default? - mode_threadlocal (default) - per-thread, cleared at the end of each request. - mode_inheritablethreadlocal - child threads inherit the context. tempting for async, but dangerous with pooled threads: the inheritance happens at thread creation , so a pooled thread keeps whichever context it inherited first and later tasks silently run as the wrong user. that is a privilege-escalation bug, not just a nuisance. - mode_global - one context for the whole jvm. only for standalone single-user applications. i change the default essentially never. for async propagation the correct tools are delegatingsecuritycontextasynctaskexecutor, delegatingsecuritycontextrunnable, or a taskdecorator - all of which copy the context per task rather than per thread, which is the semantics you actually want."}, {"n": 152, "category": 8, "difficulty": "T", "html": "The security context is lost inside an <code>@Async<\/code> method. Why, and what are the fixes?", "answerTitle": "Security context in `@Async`", "answer": "<p>The context is thread-bound and <code>@Async<\/code> runs on a different thread, so the method sees an anonymous (or null) authentication and any <code>@PreAuthorize<\/code> on it fails or behaves as unauthenticated.<\/p><p>Three fixes:<\/p><ol><li><strong>Wrap the executor<\/strong> - <code>new DelegatingSecurityContextAsyncTaskExecutor(delegate)<\/code>, or set the strategy on the <code>ThreadPoolTaskExecutor<\/code> via a <code>TaskDecorator<\/code> that copies the context and clears it in a <code>finally<\/code>. This is the general answer and it should be applied to every executor in the application, alongside MDC and observation propagation.<\/li><li><strong>Pass the identity explicitly<\/strong> - the async method takes the user ID as a parameter rather than reading ambient state. Often the better design, because it makes the dependency visible.<\/li><li><strong>Re-authenticate as a system principal<\/strong> if the work genuinely is system work, so audit records are honest about who did it.<\/li><\/ol><p>The <code>finally<\/code> clear is not optional: leaving a context on a pooled thread means the next unrelated task inherits it.<\/p>", "source": "answers.md", "search": "the security context is lost inside an @async method. why, and what are the fixes? the context is thread-bound and @async runs on a different thread, so the method sees an anonymous (or null) authentication and any @preauthorize on it fails or behaves as unauthenticated. three fixes: 1. wrap the executor - new delegatingsecuritycontextasynctaskexecutor(delegate), or set the strategy on the threadpooltaskexecutor via a taskdecorator that copies the context and clears it in a finally. this is the general answer and it should be applied to every executor in the application, alongside mdc and observation propagation. 2. pass the identity explicitly - the async method takes the user id as a parameter rather than reading ambient state. often the better design, because it makes the dependency visible. 3. re-authenticate as a system principal if the work genuinely is system work, so audit records are honest about who did it. the finally clear is not optional: leaving a context on a pooled thread means the next unrelated task inherits it."}, {"n": 153, "category": 8, "difficulty": "T", "html": "How does security context propagation differ between a <code>ThreadPoolTaskExecutor<\/code> and virtual threads?", "answerTitle": "Pooled threads versus virtual threads", "answer": "<p>The propagation mechanism is identical - both are platform-level threads from the JVM&#x27;s perspective and neither inherits a <code>ThreadLocal<\/code> by default, so you need the same decorator either way.<\/p><p>What differs is the <strong>risk profile<\/strong>. A pooled thread is <em>reused<\/em>, so a context left behind leaks into the next task and can run someone else&#x27;s work as the wrong user. A virtual thread is created per task and discarded, so there is nothing to leak into - the failure mode disappears, though you still must <em>set<\/em> the context if the work needs it.<\/p><p>The other difference is scale: virtual threads make <code>ThreadLocal<\/code> copies per-task rather than per-pool-thread, so at 100,000 concurrent tasks the memory cost of copying a security context is real. <code>ScopedValue<\/code> is the forward-looking answer, and Spring Security is moving toward it.<\/p><p>So the summary: same fix, but pooled threads need the <code>finally<\/code> clear for <em>correctness<\/em>, while virtual threads need it only for hygiene.<\/p>", "source": "answers.md", "search": "how does security context propagation differ between a threadpooltaskexecutor and virtual threads? the propagation mechanism is identical - both are platform-level threads from the jvm's perspective and neither inherits a threadlocal by default, so you need the same decorator either way. what differs is the risk profile . a pooled thread is reused , so a context left behind leaks into the next task and can run someone else's work as the wrong user. a virtual thread is created per task and discarded, so there is nothing to leak into - the failure mode disappears, though you still must set the context if the work needs it. the other difference is scale: virtual threads make threadlocal copies per-task rather than per-pool-thread, so at 100,000 concurrent tasks the memory cost of copying a security context is real. scopedvalue is the forward-looking answer, and spring security is moving toward it. so the summary: same fix, but pooled threads need the finally clear for correctness , while virtual threads need it only for hygiene."}, {"n": 154, "category": 8, "difficulty": "D", "html": "<code>@EnableMethodSecurity<\/code> in 6.x - what changed from <code>@EnableGlobalMethodSecurity<\/code>, and how does <code>@AuthenticationPrincipal<\/code> resolve?", "answerTitle": "`@EnableMethodSecurity`", "answer": "<p>It replaced <code>@EnableGlobalMethodSecurity<\/code>, with three notable changes: <code>prePostEnabled<\/code> is <strong>true by default<\/strong> (so <code>@PreAuthorize<\/code> works with just the annotation); it uses <code>AuthorizationManager<\/code> throughout rather than the voter model; and it supports meta-annotations and generic type resolution properly, so you can define <code>@IsAdmin<\/code> as a composed annotation and use it everywhere.<\/p><p><code>@AuthenticationPrincipal<\/code> is resolved by an argument resolver and can navigate into the principal (<code>@AuthenticationPrincipal(expression = &quot;claims[&#x27;tenant&#x27;]&quot;)<\/code>), or be used on a custom principal type directly.<\/p><p>Enable <code>securedEnabled<\/code> or <code>jsr250Enabled<\/code> only if you actually use <code>@Secured<\/code> or <code>@RolesAllowed<\/code>; leaving several models active in one codebase produces inconsistent rules that no one can audit.<\/p>", "source": "answers.md", "search": "@enablemethodsecurity in 6.x - what changed from @enableglobalmethodsecurity, and how does @authenticationprincipal resolve? it replaced @enableglobalmethodsecurity, with three notable changes: prepostenabled is true by default (so @preauthorize works with just the annotation); it uses authorizationmanager throughout rather than the voter model; and it supports meta-annotations and generic type resolution properly, so you can define @isadmin as a composed annotation and use it everywhere. @authenticationprincipal is resolved by an argument resolver and can navigate into the principal (@authenticationprincipal(expression = \"claims['tenant']\")), or be used on a custom principal type directly. enable securedenabled or jsr250enabled only if you actually use @secured or @rolesallowed; leaving several models active in one codebase produces inconsistent rules that no one can audit."}, {"n": 155, "category": 8, "difficulty": "D", "html": "Adding custom SpEL functions to <code>@PreAuthorize<\/code> via a <code>MethodSecurityExpressionHandler<\/code>.", "answerTitle": "Custom SpEL in `@PreAuthorize`", "answer": "<p>Extend the expression handler to add domain-aware functions:<\/p><pre><code class=\"lang-java\">@Component(&quot;orders&quot;)\nclass OrderSecurity {\n    public boolean canEdit(Long orderId, Authentication auth) { ... }\n}<\/code><\/pre><p>then <code>@PreAuthorize(&quot;@orders.canEdit(#id, authentication)&quot;)<\/code> - referencing a bean by name is the simplest extension point and needs no custom handler at all. For deeper integration, register a <code>MethodSecurityExpressionHandler<\/code> with a custom <code>MethodSecurityExpressionOperations<\/code> subclass exposing new root-level functions (<code>isTenantMember(#id)<\/code>).<\/p><p>I prefer the bean-reference form: the logic is a normal Spring bean, so it is unit-testable, debuggable and refactorable, while a custom root object hides logic inside a security-framework extension that few engineers will ever read. Keep the expression itself trivial - a complex SpEL expression is untestable business logic in a string.<\/p>", "source": "answers.md", "search": "adding custom spel functions to @preauthorize via a methodsecurityexpressionhandler. extend the expression handler to add domain-aware functions: java @component(\"orders\") class ordersecurity { public boolean canedit(long orderid, authentication auth) { ... } } then @preauthorize(\"@orders.canedit( id, authentication)\") - referencing a bean by name is the simplest extension point and needs no custom handler at all. for deeper integration, register a methodsecurityexpressionhandler with a custom methodsecurityexpressionoperations subclass exposing new root-level functions (istenantmember( id)). i prefer the bean-reference form: the logic is a normal spring bean, so it is unit-testable, debuggable and refactorable, while a custom root object hides logic inside a security-framework extension that few engineers will ever read. keep the expression itself trivial - a complex spel expression is untestable business logic in a string."}, {"n": 156, "category": 8, "difficulty": "T", "html": "Does <code>@PreAuthorize<\/code> work on a method returning a <code>Stream<\/code> or a reactive type? What about <code>@PostAuthorize<\/code>?", "answerTitle": "`@PreAuthorize` on streams and reactive types", "answer": "<p><code>@PreAuthorize<\/code> works on any method regardless of return type, because it evaluates <strong>before<\/strong> invocation - so it is safe on <code>Stream<\/code> and reactive returns, provided the security context is available at call time (which for reactive means using <code>@EnableReactiveMethodSecurity<\/code> and the Reactor <code>Context<\/code>).<\/p><p><code>@PostAuthorize<\/code> and <code>@PostFilter<\/code> are the problem. They need the <em>result<\/em>, and for a <code>Stream<\/code> or a <code>Flux<\/code> the result is a lazy pipeline, not the data - so <code>@PostFilter<\/code> on a <code>Stream<\/code> either does not filter, or forces materialization, defeating the purpose. <code>@PostAuthorize<\/code> on a <code>Mono<\/code> also cannot inspect the eventual value without subscribing.<\/p><p><code>@EnableReactiveMethodSecurity<\/code> supports <code>@PreAuthorize<\/code> and <code>@PostAuthorize<\/code> on reactive returns, but <strong>not<\/strong> <code>@PreFilter<\/code>/<code>@PostFilter<\/code>. The practical guidance is unchanged either way: filter in the query, not after it - post-filtering a large result set is both a security-by-luck pattern and a performance defect.<\/p>", "source": "answers.md", "search": "does @preauthorize work on a method returning a stream or a reactive type? what about @postauthorize? @preauthorize works on any method regardless of return type, because it evaluates before invocation - so it is safe on stream and reactive returns, provided the security context is available at call time (which for reactive means using @enablereactivemethodsecurity and the reactor context). @postauthorize and @postfilter are the problem. they need the result , and for a stream or a flux the result is a lazy pipeline, not the data - so @postfilter on a stream either does not filter, or forces materialization, defeating the purpose. @postauthorize on a mono also cannot inspect the eventual value without subscribing. @enablereactivemethodsecurity supports @preauthorize and @postauthorize on reactive returns, but not @prefilter/@postfilter. the practical guidance is unchanged either way: filter in the query, not after it - post-filtering a large result set is both a security-by-luck pattern and a performance defect."}, {"n": 157, "category": 8, "difficulty": "D", "html": "Domain object security and ACLs - when is that machinery justified over a simple tenant predicate?", "answerTitle": "ACLs versus a tenant predicate", "answer": "<p>Spring Security ACLs give per-object, per-principal permissions with inheritance, stored in four dedicated tables and consulted per object. That is genuinely necessary for a document management or collaboration product where any user can be granted rights on any individual object.<\/p><p>For nearly everything else - multi-tenant SaaS, ownership checks, role-based access to a resource type - it is enormous overkill: four extra tables, a cache to keep coherent, a query per object, and machinery few engineers understand.<\/p><p>The alternative is to make authorization part of the <strong>query<\/strong>: <code>WHERE tenant_id = :tenant AND (owner_id = :user OR :user IN (SELECT ...))<\/code>, enforced at the data layer with row-level security or a Hibernate filter so it cannot be forgotten (<code>01-java<\/code> Q144). That is faster, simpler and provably applied.<\/p><p>I would adopt ACLs only when per-object grants are a first-class product feature, and even then I would evaluate a purpose-built permissions table against the framework&#x27;s schema first.<\/p>", "source": "answers.md", "search": "domain object security and acls - when is that machinery justified over a simple tenant predicate? spring security acls give per-object, per-principal permissions with inheritance, stored in four dedicated tables and consulted per object. that is genuinely necessary for a document management or collaboration product where any user can be granted rights on any individual object. for nearly everything else - multi-tenant saas, ownership checks, role-based access to a resource type - it is enormous overkill: four extra tables, a cache to keep coherent, a query per object, and machinery few engineers understand. the alternative is to make authorization part of the query : where tenant_id = :tenant and (owner_id = :user or :user in (select ...)), enforced at the data layer with row-level security or a hibernate filter so it cannot be forgotten (01-java q144). that is faster, simpler and provably applied. i would adopt acls only when per-object grants are a first-class product feature, and even then i would evaluate a purpose-built permissions table against the framework's schema first."}, {"n": 158, "category": 8, "difficulty": "D", "html": "Security headers in the DSL - HSTS, CSP, frame options, referrer policy. Which do you always set?", "answerTitle": "Security headers", "answer": "<p>Spring Security sets several by default: <code>X-Content-Type-Options: nosniff<\/code>, <code>X-Frame-Options: DENY<\/code>, <code>Cache-Control: no-cache, no-store<\/code>, and <code>Strict-Transport-Security<\/code> on HTTPS requests.<\/p><p>What I always configure explicitly:<\/p><pre><code class=\"lang-java\">http.headers(h -&gt; h\n    .httpStrictTransportSecurity(s -&gt; s.maxAgeInSeconds(31536000).includeSubDomains(true))\n    .contentSecurityPolicy(c -&gt; c.policyDirectives(&quot;default-src &#x27;self&#x27;; frame-ancestors &#x27;none&#x27;&quot;))\n    .referrerPolicy(r -&gt; r.policy(STRICT_ORIGIN_WHEN_CROSS_ORIGIN)));<\/code><\/pre><p><strong>CSP is the one that matters most<\/strong> and the one nobody sets, because it requires knowing what your pages load - and it is the primary defense that makes an XSS non-exploitable, which is what actually protects a token in a cookie (<code>01-java<\/code> Q140). Roll it out with <code>Content-Security-Policy-Report-Only<\/code> first, collect violation reports, then enforce.<\/p><p>For a pure JSON API most of these are irrelevant, but they cost nothing and protect against a browser being pointed at your API directly.<\/p>", "source": "answers.md", "search": "security headers in the dsl - hsts, csp, frame options, referrer policy. which do you always set? spring security sets several by default: x-content-type-options: nosniff, x-frame-options: deny, cache-control: no-cache, no-store, and strict-transport-security on https requests. what i always configure explicitly: java http.headers(h - h .httpstricttransportsecurity(s - s.maxageinseconds(31536000).includesubdomains(true)) .contentsecuritypolicy(c - c.policydirectives(\"default-src 'self'; frame-ancestors 'none'\")) .referrerpolicy(r - r.policy(strict_origin_when_cross_origin))); csp is the one that matters most and the one nobody sets, because it requires knowing what your pages load - and it is the primary defense that makes an xss non-exploitable, which is what actually protects a token in a cookie (01-java q140). roll it out with content-security-policy-report-only first, collect violation reports, then enforce. for a pure json api most of these are irrelevant, but they cost nothing and protect against a browser being pointed at your api directly."}, {"n": 159, "category": 8, "difficulty": "D", "html": "CSRF for a single-page application - <code>CookieCsrfTokenRepository<\/code> and the BREACH protection handler.", "answerTitle": "CSRF for a SPA", "answer": "<p>The SPA pattern is the <strong>double-submit cookie<\/strong>: the server writes a readable cookie, JavaScript reads it and echoes it in a header.<\/p><pre><code class=\"lang-java\">http.csrf(c -&gt; c\n    .csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse())\n    .csrfTokenRequestHandler(new SpaCsrfTokenRequestHandler()));<\/code><\/pre><p><code>withHttpOnlyFalse()<\/code> is required so the SPA can read it - which is safe here because the token&#x27;s purpose is to prove the request came from your origin, not to be a secret from your own page.<\/p><p>In Security 6, <code>XorCsrfTokenRequestAttributeHandler<\/code> became the default: it XORs the token with a random mask per response, so the encoded value differs each time. This is <strong>BREACH<\/strong> protection - without it, a compression side-channel can extract a stable token from an HTTPS response. The consequence is that the value in the cookie and the value expected in the header are encoded differently, which is where Q160 comes from.<\/p>", "source": "answers.md", "search": "csrf for a single-page application - cookiecsrftokenrepository and the breach protection handler. the spa pattern is the double-submit cookie : the server writes a readable cookie, javascript reads it and echoes it in a header. java http.csrf(c - c .csrftokenrepository(cookiecsrftokenrepository.withhttponlyfalse()) .csrftokenrequesthandler(new spacsrftokenrequesthandler())); withhttponlyfalse() is required so the spa can read it - which is safe here because the token's purpose is to prove the request came from your origin, not to be a secret from your own page. in security 6, xorcsrftokenrequestattributehandler became the default: it xors the token with a random mask per response, so the encoded value differs each time. this is breach protection - without it, a compression side-channel can extract a stable token from an https response. the consequence is that the value in the cookie and the value expected in the header are encoded differently, which is where q160 comes from."}, {"n": 160, "category": 8, "difficulty": "T", "html": "After upgrading to Security 6, CSRF fails for a SPA. Explain the deferred token loading issue and the fix.", "answerTitle": "CSRF breaking after the Security 6 upgrade", "answer": "<p>Two changes combine. First, the default <code>XorCsrfTokenRequestAttributeHandler<\/code> means the token must be <strong>resolved through the handler<\/strong> rather than compared raw. Second, <code>CsrfToken<\/code> loading became <strong>deferred<\/strong> for performance - the token is only generated when something actually accesses it, so if nothing reads it during the request, the cookie is never written and the SPA has no token to send.<\/p><p>The standard fix is a handler that opts the <em>header<\/em> comparison back to the plain value while keeping XOR for rendering, plus a filter that forces the token to be resolved:<\/p><pre><code class=\"lang-java\">final class SpaCsrfTokenRequestHandler extends CsrfTokenRequestAttributeHandler {\n    private final CsrfTokenRequestHandler xor = new XorCsrfTokenRequestAttributeHandler();\n    @Override public void handle(HttpServletRequest req, HttpServletResponse res, Supplier&lt;CsrfToken&gt; token) {\n        xor.handle(req, res, token);\n        req.getAttribute(CsrfToken.class.getName());   // force deferred token to render\n    }\n    @Override public String resolveCsrfTokenValue(HttpServletRequest req, CsrfToken token) {\n        return StringUtils.hasText(req.getHeader(token.getHeaderName()))\n            ? super.resolveCsrfTokenValue(req, token)     // raw value from header\n            : xor.resolveCsrfTokenValue(req, token);      // XOR value from form\n    }\n}<\/code><\/pre><p>This exact scenario is documented in the Spring Security migration guide, and being able to explain <em>why<\/em> rather than just pasting the class is the differentiator.<\/p>", "source": "answers.md", "search": "after upgrading to security 6, csrf fails for a spa. explain the deferred token loading issue and the fix. two changes combine. first, the default xorcsrftokenrequestattributehandler means the token must be resolved through the handler rather than compared raw. second, csrftoken loading became deferred for performance - the token is only generated when something actually accesses it, so if nothing reads it during the request, the cookie is never written and the spa has no token to send. the standard fix is a handler that opts the header comparison back to the plain value while keeping xor for rendering, plus a filter that forces the token to be resolved: java final class spacsrftokenrequesthandler extends csrftokenrequestattributehandler { private final csrftokenrequesthandler xor = new xorcsrftokenrequestattributehandler(); @override public void handle(httpservletrequest req, httpservletresponse res, supplier<csrftoken token) { xor.handle(req, res, token); req.getattribute(csrftoken.class.getname()); // force deferred token to render } @override public string resolvecsrftokenvalue(httpservletrequest req, csrftoken token) { return stringutils.hastext(req.getheader(token.getheadername())) ? super.resolvecsrftokenvalue(req, token) // raw value from header : xor.resolvecsrftokenvalue(req, token); // xor value from form } } this exact scenario is documented in the spring security migration guide, and being able to explain why rather than just pasting the class is the differentiator."}, {"n": 161, "category": 8, "difficulty": "D", "html": "<code>StrictHttpFirewall<\/code> and <code>RequestRejectedException<\/code> - why do legitimate-looking URLs get rejected?", "answerTitle": "`StrictHttpFirewall`", "answer": "<p><code>StrictHttpFirewall<\/code> is enabled by default and rejects requests before they reach any filter, throwing <code>RequestRejectedException<\/code> - which produces a bare 400 with no useful message, so it is often misdiagnosed as a routing or gateway problem.<\/p><p>It rejects: URL-encoded slashes (<code>%2F<\/code>, <code>%5C<\/code>), encoded percent signs, semicolons (path parameters), non-printable ASCII, backslashes, double slashes, and non-normalized paths.<\/p><p>The reason is that these are the classic <strong>path traversal and authorization bypass<\/strong> vectors: if the firewall allowed <code>%2f<\/code>, a rule protecting <code>/admin/**<\/code> could be bypassed by a path that the servlet container normalizes differently than the security matcher does.<\/p><p>If a legitimate URL is rejected - typically an ID containing a semicolon or an encoded slash - the correct fix is to change the URL design (put the value in a query parameter or encode it base64url), not to relax the firewall. If you must relax it, do so for exactly one character with a documented rationale, and never disable it wholesale.<\/p>", "source": "answers.md", "search": "stricthttpfirewall and requestrejectedexception - why do legitimate-looking urls get rejected? stricthttpfirewall is enabled by default and rejects requests before they reach any filter, throwing requestrejectedexception - which produces a bare 400 with no useful message, so it is often misdiagnosed as a routing or gateway problem. it rejects: url-encoded slashes (%2f, %5c), encoded percent signs, semicolons (path parameters), non-printable ascii, backslashes, double slashes, and non-normalized paths. the reason is that these are the classic path traversal and authorization bypass vectors: if the firewall allowed %2f, a rule protecting /admin/ could be bypassed by a path that the servlet container normalizes differently than the security matcher does. if a legitimate url is rejected - typically an id containing a semicolon or an encoded slash - the correct fix is to change the url design (put the value in a query parameter or encode it base64url), not to relax the firewall. if you must relax it, do so for exactly one character with a documented rationale, and never disable it wholesale."}, {"n": 162, "category": 8, "difficulty": "D", "html": "Securing Actuator - a separate filter chain, a management port, and what you expose to whom.", "answerTitle": "Securing Actuator", "answer": "<p>Three layers, and I use all of them:<\/p><ol><li><strong>A separate management port<\/strong> (<code>management.server.port=9090<\/code>) that the ingress or load balancer does not expose. This alone prevents internet reachability, and it is the highest-value control.<\/li><li><strong>A dedicated <code>SecurityFilterChain<\/code><\/strong> ordered first with <code>securityMatcher(EndpointRequest.toAnyEndpoint())<\/code>, permitting only <code>health<\/code> and <code>info<\/code> unauthenticated and requiring a role for the rest:<\/li><\/ol><pre><code class=\"lang-java\">http.securityMatcher(EndpointRequest.toAnyEndpoint())\n    .authorizeHttpRequests(a -&gt; a\n        .requestMatchers(EndpointRequest.to(&quot;health&quot;, &quot;info&quot;)).permitAll()\n        .anyRequest().hasRole(&quot;OPS&quot;));<\/code><\/pre><ol><li><strong>Minimal exposure<\/strong> - <code>management.endpoints.web.exposure.include<\/code> listing only what is needed, never <code>*<\/code>. <code>/env<\/code>, <code>/configprops<\/code>, <code>/heapdump<\/code>, <code>/threaddump<\/code>, <code>/loggers<\/code> and <code>/shutdown<\/code> are the ones that leak or allow mutation.<\/li><\/ol><p>Also: <code>management.endpoint.health.show-details=when-authorized<\/code> so an unauthenticated probe gets <code>UP<\/code> without a map of your dependencies, and health <em>groups<\/em> so liveness and readiness expose only what each needs (Q187).<\/p>", "source": "answers.md", "search": "securing actuator - a separate filter chain, a management port, and what you expose to whom. three layers, and i use all of them: 1. a separate management port (management.server.port=9090) that the ingress or load balancer does not expose. this alone prevents internet reachability, and it is the highest-value control. 2. a dedicated securityfilterchain ordered first with securitymatcher(endpointrequest.toanyendpoint()), permitting only health and info unauthenticated and requiring a role for the rest: java http.securitymatcher(endpointrequest.toanyendpoint()) .authorizehttprequests(a - a .requestmatchers(endpointrequest.to(\"health\", \"info\")).permitall() .anyrequest().hasrole(\"ops\")); 3. minimal exposure - management.endpoints.web.exposure.include listing only what is needed, never . /env, /configprops, /heapdump, /threaddump, /loggers and /shutdown are the ones that leak or allow mutation. also: management.endpoint.health.show-details=when-authorized so an unauthenticated probe gets up without a map of your dependencies, and health groups so liveness and readiness expose only what each needs (q187)."}, {"n": 163, "category": 8, "difficulty": "D", "html": "Testing security - <code>@WithMockUser<\/code>, a custom <code>@WithSecurityContext<\/code>, and <code>SecurityMockMvcRequestPostProcessors<\/code>.", "answerTitle": "Testing security", "answer": "<ul><li><code>@WithMockUser(roles = &quot;ADMIN&quot;)<\/code> - the simplest case; note it prefixes <code>ROLE_<\/code> for <code>roles<\/code> but not for <code>authorities<\/code>.<\/li><li><code>@WithUserDetails(&quot;alice&quot;)<\/code> - loads through your real <code>UserDetailsService<\/code>, so it exercises actual user data.<\/li><li>A custom <code>@WithSecurityContext<\/code> annotation with a <code>SecurityContextFactory<\/code> - the right approach for a custom principal type, a JWT with specific claims, or a tenant-scoped user. Worth building once per codebase.<\/li><li>Request post-processors for per-request control: <code>mockMvc.perform(get(&quot;/api/x&quot;).with(jwt().jwt(j -&gt; j.claim(&quot;scope&quot;, &quot;read&quot;))))<\/code>, plus <code>user()<\/code>, <code>csrf()<\/code> and <code>anonymous()<\/code>.<\/li><\/ul><p>For a resource server, <code>jwt()<\/code> is the important one because it bypasses the need for a real token or issuer while still exercising your authority-mapping logic - which is where the bugs are.<\/p>", "source": "answers.md", "search": "testing security - @withmockuser, a custom @withsecuritycontext, and securitymockmvcrequestpostprocessors. - @withmockuser(roles = \"admin\") - the simplest case; note it prefixes role_ for roles but not for authorities. - @withuserdetails(\"alice\") - loads through your real userdetailsservice, so it exercises actual user data. - a custom @withsecuritycontext annotation with a securitycontextfactory - the right approach for a custom principal type, a jwt with specific claims, or a tenant-scoped user. worth building once per codebase. - request post-processors for per-request control: mockmvc.perform(get(\"/api/x\").with(jwt().jwt(j - j.claim(\"scope\", \"read\")))), plus user(), csrf() and anonymous(). for a resource server, jwt() is the important one because it bypasses the need for a real token or issuer while still exercising your authority-mapping logic - which is where the bugs are."}, {"n": 164, "category": 8, "difficulty": "T", "html": "Why might a <code>@WebMvcTest<\/code> pass authorization checks that fail in production, or skip them entirely?", "answerTitle": "`@WebMvcTest` and security", "answer": "<p><code>@WebMvcTest<\/code> auto-configures Spring Security, but it only scans web-layer components - <code>@Controller<\/code>, <code>@ControllerAdvice<\/code>, <code>WebMvcConfigurer<\/code>, filters. Your <code>SecurityFilterChain<\/code> lives in a <code>@Configuration<\/code> class, which is <strong>not<\/strong> picked up. So the test runs against Spring Security&#x27;s <em>default<\/em> configuration (everything authenticated, HTTP Basic) rather than yours, and assertions about your rules are meaningless - they pass for the wrong reason, or fail confusingly.<\/p><p>Fix: <code>@WebMvcTest(controllers = X.class) @Import(SecurityConfig.class)<\/code> so the real chain is used.<\/p><p>The second trap is method security: <code>@PreAuthorize<\/code> on a <em>service<\/em> never runs in a <code>@WebMvcTest<\/code>, because the service is a <code>@MockBean<\/code>. Method-level rules need their own focused test with a real bean and <code>@EnableMethodSecurity<\/code>.<\/p><p>The general point worth making: slice tests give speed by omitting things, and you must know exactly what was omitted or you will trust a green test that verifies nothing.<\/p>", "source": "answers.md", "search": "why might a @webmvctest pass authorization checks that fail in production, or skip them entirely? @webmvctest auto-configures spring security, but it only scans web-layer components - @controller, @controlleradvice, webmvcconfigurer, filters. your securityfilterchain lives in a @configuration class, which is not picked up. so the test runs against spring security's default configuration (everything authenticated, http basic) rather than yours, and assertions about your rules are meaningless - they pass for the wrong reason, or fail confusingly. fix: @webmvctest(controllers = x.class) @import(securityconfig.class) so the real chain is used. the second trap is method security: @preauthorize on a service never runs in a @webmvctest, because the service is a @mockbean. method-level rules need their own focused test with a real bean and @enablemethodsecurity. the general point worth making: slice tests give speed by omitting things, and you must know exactly what was omitted or you will trust a green test that verifies nothing."}, {"n": 165, "category": 8, "difficulty": "D", "html": "Password encoder upgrades in place - <code>DelegatingPasswordEncoder<\/code> and <code>UserDetailsPasswordService<\/code>.", "answerTitle": "In-place password encoder upgrades", "answer": "<p><code>DelegatingPasswordEncoder<\/code> (the default from <code>PasswordEncoderFactories.createDelegatingPasswordEncoder()<\/code>) stores the algorithm as a prefix: <code>{bcrypt}$2a$10$...<\/code>. Matching dispatches on the prefix, so several algorithms coexist in one table.<\/p><p>To <em>upgrade<\/em> existing hashes, implement <code>UserDetailsPasswordService<\/code>:<\/p><pre><code class=\"lang-java\">public UserDetails updatePassword(UserDetails user, String newHash) {\n    repository.updatePassword(user.getUsername(), newHash);\n    return withNewPassword(user, newHash);\n}<\/code><\/pre><p><code>DaoAuthenticationProvider<\/code> calls it automatically when <code>passwordEncoder.upgradeEncoding(oldHash)<\/code> returns true - which happens when the stored algorithm or work factor is weaker than the current default. So users are migrated <strong>transparently on successful login<\/strong>, because that is the only moment the plaintext is available.<\/p><p>Users who never log in keep old hashes, so the migration needs an end date after which those accounts are forced through a reset. Stating that shows you have actually run the migration rather than read about it.<\/p>", "source": "answers.md", "search": "password encoder upgrades in place - delegatingpasswordencoder and userdetailspasswordservice. delegatingpasswordencoder (the default from passwordencoderfactories.createdelegatingpasswordencoder()) stores the algorithm as a prefix: {bcrypt}$2a$10$.... matching dispatches on the prefix, so several algorithms coexist in one table. to upgrade existing hashes, implement userdetailspasswordservice: java public userdetails updatepassword(userdetails user, string newhash) { repository.updatepassword(user.getusername(), newhash); return withnewpassword(user, newhash); } daoauthenticationprovider calls it automatically when passwordencoder.upgradeencoding(oldhash) returns true - which happens when the stored algorithm or work factor is weaker than the current default. so users are migrated transparently on successful login , because that is the only moment the plaintext is available. users who never log in keep old hashes, so the migration needs an end date after which those accounts are forced through a reset. stating that shows you have actually run the migration rather than read about it."}, {"n": 166, "category": 8, "difficulty": "A", "html": "How do you roll out a breaking security change across 40 services without an outage?", "answerTitle": "Rolling out a security change across 40 services", "answer": "<p>The mechanism depends on the change, but the <em>process<\/em> is what is being assessed.<\/p><ol><li><strong>Establish the blast radius.<\/strong> Which services, which callers, which of them are outside my control (partners, mobile apps with long release cycles). Mobile is usually the constraint that dictates the timeline.<\/li><li><strong>Make it dual-mode first.<\/strong> The change must accept both old and new for a period - accept both token formats, both header names, both cookie configurations. A security change that flips atomically across 40 services cannot be rolled back and will cause an outage.<\/li><li><strong>Ship it disabled<\/strong>, behind a flag, in the shared starter. Deploy widely with no behavior change.<\/li><li><strong>Enable in one low-risk service<\/strong>, verify with real traffic and with the metrics that prove it (authentication success rate, 401/403 rate by client, token format distribution).<\/li><li><strong>Instrument the old path<\/strong> so you can see exactly who is still using it, per client. This is what lets you make the retirement decision on evidence rather than on a deadline.<\/li><li><strong>Expand in waves<\/strong>, most-instrumented first, with an explicit rollback per wave.<\/li><li><strong>Retire the old path<\/strong> only when the metric is zero, and after contacting the remaining callers directly.<\/li><\/ol><p>Two things I would insist on: a <strong>security exception process<\/strong> for teams that genuinely cannot meet the timeline, so they escalate rather than hide; and a real deadline with executive support, because security migrations without a forcing function run forever.<\/p><blockquote><p><em>Hook: a security or authentication migration you drove across many services - the sequencing and the evidence you used to retire the old path.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you roll out a breaking security change across 40 services without an outage? the mechanism depends on the change, but the process is what is being assessed. 1. establish the blast radius. which services, which callers, which of them are outside my control (partners, mobile apps with long release cycles). mobile is usually the constraint that dictates the timeline. 2. make it dual-mode first. the change must accept both old and new for a period - accept both token formats, both header names, both cookie configurations. a security change that flips atomically across 40 services cannot be rolled back and will cause an outage. 3. ship it disabled , behind a flag, in the shared starter. deploy widely with no behavior change. 4. enable in one low-risk service , verify with real traffic and with the metrics that prove it (authentication success rate, 401/403 rate by client, token format distribution). 5. instrument the old path so you can see exactly who is still using it, per client. this is what lets you make the retirement decision on evidence rather than on a deadline. 6. expand in waves , most-instrumented first, with an explicit rollback per wave. 7. retire the old path only when the metric is zero, and after contacting the remaining callers directly. two things i would insist on: a security exception process for teams that genuinely cannot meet the timeline, so they escalate rather than hide; and a real deadline with executive support, because security migrations without a forcing function run forever. hook: a security or authentication migration you drove across many services - the sequencing and the evidence you used to retire the old path."}, {"n": 167, "category": 9, "difficulty": "D", "html": "Configuring a resource server with <code>issuer-uri<\/code> - what does Spring fetch at startup, and which validations does it perform by default?", "answerTitle": "Resource server with `issuer-uri`", "answer": "<pre><code class=\"lang-yaml\">spring.security.oauth2.resourceserver.jwt.issuer-uri: https://idp.example.com/realms/acme<\/code><\/pre><p>At startup Spring fetches <code>{issuer}/.well-known/openid-configuration<\/code> (or the OAuth2 equivalent), reads the <code>jwks_uri<\/code>, and builds a <code>JwtDecoder<\/code> (<code>NimbusJwtDecoder<\/code>) with a caching key source.<\/p><p>Default validations: <strong>signature<\/strong> against the JWKS keys, <strong><code>exp<\/code><\/strong> and <strong><code>nbf<\/code><\/strong> with a small clock skew, and <strong><code>iss<\/code><\/strong> matching the configured issuer. Notably, <strong>audience is not validated by default<\/strong> - which is a real security gap, because a token minted for a different service in the same realm will be accepted. That is Q168.<\/p><p>The startup fetch also means the application <strong>fails to start if the IdP is unreachable<\/strong>, which is a hard dependency worth knowing about. Use <code>jwk-set-uri<\/code> instead to skip discovery, and consider a readiness dependency rather than a startup one.<\/p>", "source": "answers.md", "search": "configuring a resource server with issuer-uri - what does spring fetch at startup, and which validations does it perform by default? yaml spring.security.oauth2.resourceserver.jwt.issuer-uri: https://idp.example.com/realms/acme at startup spring fetches {issuer}/.well-known/openid-configuration (or the oauth2 equivalent), reads the jwks_uri, and builds a jwtdecoder (nimbusjwtdecoder) with a caching key source. default validations: signature against the jwks keys, exp and nbf with a small clock skew, and iss matching the configured issuer. notably, audience is not validated by default - which is a real security gap, because a token minted for a different service in the same realm will be accepted. that is q168. the startup fetch also means the application fails to start if the idp is unreachable , which is a hard dependency worth knowing about. use jwk-set-uri instead to skip discovery, and consider a readiness dependency rather than a startup one."}, {"n": 168, "category": 9, "difficulty": "C", "html": "JWT validation - signature, issuer, audience and expiry. How do you add a custom validator?", "answerTitle": "Custom JWT validators", "answer": "<pre><code class=\"lang-java\">@Bean\nJwtDecoder jwtDecoder(OAuth2ResourceServerProperties props) {\n    NimbusJwtDecoder decoder = JwtDecoders.fromIssuerLocation(props.getJwt().getIssuerUri());\n    decoder.setJwtValidator(new DelegatingOAuth2TokenValidator&lt;&gt;(\n        JwtValidators.createDefaultWithIssuer(issuer),\n        new JwtClaimValidator&lt;List&lt;String&gt;&gt;(&quot;aud&quot;, a -&gt; a != null &amp;&amp; a.contains(&quot;orders-api&quot;)),\n        new JwtClaimValidator&lt;String&gt;(&quot;azp&quot;, &quot;trusted-client&quot;)));\n    return decoder;\n}<\/code><\/pre><p><strong>Audience validation should be considered mandatory<\/strong>, not optional: without it, any token from the same issuer - including one issued to a low-privilege client, or to a completely different service - is accepted by your API. This is a genuine privilege-escalation path in a shared-IdP estate, and it is the single most common resource server misconfiguration.<\/p><p>Other validators worth adding: a maximum token lifetime, required scopes for the service, and a <code>tid<\/code>/tenant claim check.<\/p>", "source": "answers.md", "search": "jwt validation - signature, issuer, audience and expiry. how do you add a custom validator? java @bean jwtdecoder jwtdecoder(oauth2resourceserverproperties props) { nimbusjwtdecoder decoder = jwtdecoders.fromissuerlocation(props.getjwt().getissueruri()); decoder.setjwtvalidator(new delegatingoauth2tokenvalidator< ( jwtvalidators.createdefaultwithissuer(issuer), new jwtclaimvalidator<list<string (\"aud\", a - a != null && a.contains(\"orders-api\")), new jwtclaimvalidator<string (\"azp\", \"trusted-client\"))); return decoder; } audience validation should be considered mandatory , not optional: without it, any token from the same issuer - including one issued to a low-privilege client, or to a completely different service - is accepted by your api. this is a genuine privilege-escalation path in a shared-idp estate, and it is the single most common resource server misconfiguration. other validators worth adding: a maximum token lifetime, required scopes for the service, and a tid/tenant claim check."}, {"n": 169, "category": 9, "difficulty": "T", "html": "Where do JWT claims become granted authorities, and why does <code>hasRole(&#x27;ADMIN&#x27;)<\/code> fail out of the box with a Keycloak or Cognito token?", "answerTitle": "Claims to authorities", "answer": "<p><code>JwtAuthenticationConverter<\/code> uses <code>JwtGrantedAuthoritiesConverter<\/code>, which by default reads the <strong><code>scope<\/code><\/strong> or <strong><code>scp<\/code><\/strong> claim and prefixes each value with <strong><code>SCOPE_<\/code><\/strong>. So a token with <code>scope: &quot;orders.read&quot;<\/code> produces the authority <code>SCOPE_orders.read<\/code>.<\/p><p><code>hasRole(&#x27;ADMIN&#x27;)<\/code> checks for <code>ROLE_ADMIN<\/code>, which no standard OIDC token contains - and Keycloak puts roles in <code>realm_access.roles<\/code>, Cognito in <code>cognito:groups<\/code>, Entra ID in <code>roles<\/code>. None of these is read by default, which is why authorization &quot;silently does nothing&quot; until configured.<\/p><pre><code class=\"lang-java\">@Bean JwtAuthenticationConverter converter() {\n    JwtAuthenticationConverter c = new JwtAuthenticationConverter();\n    c.setJwtGrantedAuthoritiesConverter(jwt -&gt; {\n        Map&lt;String, Object&gt; realm = jwt.getClaim(&quot;realm_access&quot;);\n        List&lt;String&gt; roles = realm == null ? List.of() : (List&lt;String&gt;) realm.get(&quot;roles&quot;);\n        return roles.stream().map(r -&gt; new SimpleGrantedAuthority(&quot;ROLE_&quot; + r)).toList();\n    });\n    return c;\n}<\/code><\/pre><p>Design guidance: use <code>hasAuthority(&#x27;SCOPE_...&#x27;)<\/code> for API scopes (what the <em>client<\/em> may do) and roles for user permissions (what the <em>user<\/em> may do), and do not conflate them - they answer different questions.<\/p>", "source": "answers.md", "search": "where do jwt claims become granted authorities, and why does hasrole('admin') fail out of the box with a keycloak or cognito token? jwtauthenticationconverter uses jwtgrantedauthoritiesconverter, which by default reads the scope or scp claim and prefixes each value with scope_ . so a token with scope: \"orders.read\" produces the authority scope_orders.read. hasrole('admin') checks for role_admin, which no standard oidc token contains - and keycloak puts roles in realm_access.roles, cognito in cognito:groups, entra id in roles. none of these is read by default, which is why authorization \"silently does nothing\" until configured. java @bean jwtauthenticationconverter converter() { jwtauthenticationconverter c = new jwtauthenticationconverter(); c.setjwtgrantedauthoritiesconverter(jwt - { map<string, object realm = jwt.getclaim(\"realm_access\"); list<string roles = realm == null ? list.of() : (list<string ) realm.get(\"roles\"); return roles.stream().map(r - new simplegrantedauthority(\"role_\" + r)).tolist(); }); return c; } design guidance: use hasauthority('scope_...') for api scopes (what the client may do) and roles for user permissions (what the user may do), and do not conflate them - they answer different questions."}, {"n": 170, "category": 9, "difficulty": "D", "html": "Opaque token introspection versus local JWT validation - when do you choose introspection, and what must you cache?", "answerTitle": "Introspection versus local validation", "answer": "<p><strong>Local JWT validation<\/strong> is a signature check with no network call, so it is fast and has no runtime dependency on the IdP - but the token is valid until it expires and cannot be revoked (<code>01-java<\/code> Q135), and any claim staleness is unbounded.<\/p><p><strong>Opaque token introspection<\/strong> (<code>spring.security.oauth2.resourceserver.opaquetoken.*<\/code>) calls the IdP&#x27;s introspection endpoint per request, so revocation is immediate and claims are always current. The costs are a network round trip on every request, a hard runtime dependency on the IdP, and load on it proportional to your traffic.<\/p><p>You must cache to make introspection viable - a short TTL (30-60 seconds) keyed on a hash of the token, which is a deliberate trade of revocation latency for throughput. Say that number out loud: &quot;we accept up to 60 seconds of stale authorization&quot; is an architectural decision, not an implementation detail.<\/p><p>I choose introspection when tokens are opaque by policy, when immediate revocation is a requirement (financial or admin operations), or when the token would otherwise carry sensitive claims. JWT otherwise.<\/p>", "source": "answers.md", "search": "opaque token introspection versus local jwt validation - when do you choose introspection, and what must you cache? local jwt validation is a signature check with no network call, so it is fast and has no runtime dependency on the idp - but the token is valid until it expires and cannot be revoked (01-java q135), and any claim staleness is unbounded. opaque token introspection (spring.security.oauth2.resourceserver.opaquetoken. ) calls the idp's introspection endpoint per request, so revocation is immediate and claims are always current. the costs are a network round trip on every request, a hard runtime dependency on the idp, and load on it proportional to your traffic. you must cache to make introspection viable - a short ttl (30-60 seconds) keyed on a hash of the token, which is a deliberate trade of revocation latency for throughput. say that number out loud: \"we accept up to 60 seconds of stale authorization\" is an architectural decision, not an implementation detail. i choose introspection when tokens are opaque by policy, when immediate revocation is a requirement (financial or admin operations), or when the token would otherwise carry sensitive claims. jwt otherwise."}, {"n": 171, "category": 9, "difficulty": "D", "html": "<code>OAuth2AuthorizedClientManager<\/code> - how do you make an authenticated machine-to-machine call with client credentials?", "answerTitle": "`OAuth2AuthorizedClientManager`", "answer": "<p>For machine-to-machine calls, register a client with the <code>client_credentials<\/code> grant and let Spring manage token acquisition, caching and refresh:<\/p><pre><code class=\"lang-java\">@Bean OAuth2AuthorizedClientManager manager(ClientRegistrationRepository reg,\n                                            OAuth2AuthorizedClientService svc) {\n    var provider = OAuth2AuthorizedClientProviderBuilder.builder()\n        .clientCredentials().refreshToken().build();\n    var manager = new AuthorizedClientServiceOAuth2AuthorizedClientManager(reg, svc);\n    manager.setAuthorizedClientProvider(provider);\n    return manager;\n}\n\nWebClient client = WebClient.builder()\n    .apply(new ServletOAuth2AuthorizedClientExchangeFilterFunction(manager)\n        .oauth2Configuration()).build();\n// then: .attributes(clientRegistrationId(&quot;inventory-api&quot;))<\/code><\/pre><p>The value is that token lifecycle - fetch, cache, refresh before expiry, retry on 401 - is handled for you, which is code teams otherwise write badly and repeatedly. <code>AuthorizedClientServiceOAuth2AuthorizedClientManager<\/code> is the variant for non-request contexts such as scheduled jobs, where there is no <code>HttpServletRequest<\/code> to bind to.<\/p>", "source": "answers.md", "search": "oauth2authorizedclientmanager - how do you make an authenticated machine-to-machine call with client credentials? for machine-to-machine calls, register a client with the client_credentials grant and let spring manage token acquisition, caching and refresh: java @bean oauth2authorizedclientmanager manager(clientregistrationrepository reg, oauth2authorizedclientservice svc) { var provider = oauth2authorizedclientproviderbuilder.builder() .clientcredentials().refreshtoken().build(); var manager = new authorizedclientserviceoauth2authorizedclientmanager(reg, svc); manager.setauthorizedclientprovider(provider); return manager; } webclient client = webclient.builder() .apply(new servletoauth2authorizedclientexchangefilterfunction(manager) .oauth2configuration()).build(); // then: .attributes(clientregistrationid(\"inventory-api\")) the value is that token lifecycle - fetch, cache, refresh before expiry, retry on 401 - is handled for you, which is code teams otherwise write badly and repeatedly. authorizedclientserviceoauth2authorizedclientmanager is the variant for non-request contexts such as scheduled jobs, where there is no httpservletrequest to bind to."}, {"n": 172, "category": 9, "difficulty": "D", "html": "Token relay through a gateway - propagating the user&#x27;s token versus performing a token exchange.", "answerTitle": "Token relay versus exchange", "answer": "<p><strong>Relay<\/strong> forwards the caller&#x27;s access token unchanged to the downstream. Simple, and the downstream sees the original user - but it means every service in the chain holds a token valid for <em>all<\/em> the audiences in it, so a compromise anywhere grants access everywhere. It also fails cleanly only if the token&#x27;s audience includes each downstream.<\/p><p><strong>Token exchange<\/strong> (RFC 8693) trades the incoming token for a new one scoped to the specific downstream, with a narrower audience and scope, optionally preserving the user identity through the <code>act<\/code> (actor) claim. That gives least privilege per hop and an auditable delegation chain.<\/p><p>Relay is acceptable within a single trust boundary where all services are equally trusted and the audience is correct. Exchange is what I would use crossing a trust boundary, calling a partner, or where a downstream should not be able to impersonate the user elsewhere.<\/p><p>In Spring Cloud Gateway, <code>TokenRelay<\/code> is a one-line filter; exchange requires an IdP that supports RFC 8693 and an explicit call, which is the practical reason relay is more common than it should be.<\/p>", "source": "answers.md", "search": "token relay through a gateway - propagating the user's token versus performing a token exchange. relay forwards the caller's access token unchanged to the downstream. simple, and the downstream sees the original user - but it means every service in the chain holds a token valid for all the audiences in it, so a compromise anywhere grants access everywhere. it also fails cleanly only if the token's audience includes each downstream. token exchange (rfc 8693) trades the incoming token for a new one scoped to the specific downstream, with a narrower audience and scope, optionally preserving the user identity through the act (actor) claim. that gives least privilege per hop and an auditable delegation chain. relay is acceptable within a single trust boundary where all services are equally trusted and the audience is correct. exchange is what i would use crossing a trust boundary, calling a partner, or where a downstream should not be able to impersonate the user elsewhere. in spring cloud gateway, tokenrelay is a one-line filter; exchange requires an idp that supports rfc 8693 and an explicit call, which is the practical reason relay is more common than it should be."}, {"n": 173, "category": 9, "difficulty": "D", "html": "<code>oauth2Login<\/code> versus <code>oauth2ResourceServer<\/code> versus <code>oauth2Client<\/code> - three different roles in one framework.", "answerTitle": "The three OAuth2 roles", "answer": "<ul><li><strong><code>oauth2ResourceServer<\/code><\/strong> - my API <em>validates<\/em> incoming tokens. This is what a backend service almost always needs.<\/li><li><strong><code>oauth2Login<\/code><\/strong> - my application <em>authenticates users<\/em> via an external IdP, receiving an ID token and establishing a session. This is a server-rendered web application acting as an OIDC relying party.<\/li><li><strong><code>oauth2Client<\/code><\/strong> - my application <em>obtains tokens to call other APIs<\/em>, either on a user&#x27;s behalf (authorization code) or as itself (client credentials).<\/li><\/ul><p>They are independent and often combined: a BFF uses <code>oauth2Login<\/code> for the user session and <code>oauth2Client<\/code> to call downstream APIs; a pure API uses only <code>oauth2ResourceServer<\/code>.<\/p><p>Candidates frequently conflate <code>oauth2Login<\/code> and <code>oauth2ResourceServer<\/code> and try to configure both for a stateless API, which produces confusing redirect-to-login behavior on a JSON endpoint. Naming the three roles cleanly is a quick credibility signal.<\/p>", "source": "answers.md", "search": "oauth2login versus oauth2resourceserver versus oauth2client - three different roles in one framework
