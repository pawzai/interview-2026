ls the build with a stack trace pointing at the exact line.<\/p><p>Runtime detection: <code>reactor.blockhound<\/code> in staging, plus alerting on event-loop thread saturation and on a latency profile where p50 and p99 rise together across unrelated endpoints - the signature of a starved loop.<\/p>", "source": "answers.md", "search": "one blocking call inside a webflux handler - describe exactly what happens and how you detect it in ci. the netty event loop has one thread per core (typically 2-8 for the whole application). a blocking call occupies one of them for its duration, so with four loop threads, four concurrent slow calls stall every request in the application , including health checks and requests that never touch that code. throughput collapses to a level far worse than a thread-per-request server, because there is no pool to absorb it. detection in ci is the actionable part: blockhound instruments the jvm to throw when a blocking call happens on a non-blocking thread. add it as a test dependency and install it in the test bootstrap, and a blocking jdbc call in a reactive path fails the build with a stack trace pointing at the exact line. runtime detection: reactor.blockhound in staging, plus alerting on event-loop thread saturation and on a latency profile where p50 and p99 rise together across unrelated endpoints - the signature of a starved loop."}, {"n": 109, "category": 6, "difficulty": "D", "html": "Reactor <code>Context<\/code> - why does <code>ThreadLocal<\/code> fail, and how do MDC and the security context propagate?", "answerTitle": "Reactor `Context`", "answer": "<p><code>ThreadLocal<\/code> fails because a reactive chain hops threads between operators; the value set at subscription time is not visible in a <code>map<\/code> running on another scheduler.<\/p><p>Reactor&#x27;s <code>Context<\/code> is an immutable key-value map attached to the <strong>subscription<\/strong> and propagated <strong>upstream<\/strong> (written with <code>contextWrite<\/code>, read with <code>deferContextual<\/code> or <code>Mono.deferContextual<\/code>). Because it travels with the subscription rather than the thread, it survives every thread switch.<\/p><p>Spring Security uses this for <code>ReactiveSecurityContextHolder<\/code>, which is just a well-known context key. For MDC and tracing, the Micrometer <strong>context-propagation<\/strong> library bridges <code>ThreadLocal<\/code> and Reactor <code>Context<\/code> automatically when enabled (<code>Hooks.enableAutomaticContextPropagation()<\/code>), which is what makes correlation IDs appear in logs without manual plumbing - and it is the first thing to check when they do not.<\/p>", "source": "answers.md", "search": "reactor context - why does threadlocal fail, and how do mdc and the security context propagate? threadlocal fails because a reactive chain hops threads between operators; the value set at subscription time is not visible in a map running on another scheduler. reactor's context is an immutable key-value map attached to the subscription and propagated upstream (written with contextwrite, read with defercontextual or mono.defercontextual). because it travels with the subscription rather than the thread, it survives every thread switch. spring security uses this for reactivesecuritycontextholder, which is just a well-known context key. for mdc and tracing, the micrometer context-propagation library bridges threadlocal and reactor context automatically when enabled (hooks.enableautomaticcontextpropagation()), which is what makes correlation ids appear in logs without manual plumbing - and it is the first thing to check when they do not."}, {"n": 110, "category": 6, "difficulty": "D", "html": "<code>flatMap<\/code> versus <code>concatMap<\/code> versus <code>flatMapSequential<\/code> - ordering and concurrency differences.", "answerTitle": "`flatMap` versus `concatMap` versus `flatMapSequential`", "answer": "<ul><li><code>flatMap<\/code> - subscribes to inner publishers <strong>eagerly and concurrently<\/strong>; results are interleaved in completion order. Fastest, no ordering.<\/li><li><code>concatMap<\/code> - subscribes to each inner publisher only after the previous completes. Ordered, <strong>sequential<\/strong>, so latency is the sum.<\/li><li><code>flatMapSequential<\/code> - subscribes eagerly and concurrently like <code>flatMap<\/code>, but <strong>buffers to emit in source order<\/strong>. Concurrency with ordering, at the cost of holding completed results while waiting for earlier ones.<\/li><\/ul><p>Choose by whether order matters and whether the downstream can tolerate concurrency. For calling an external API per element where order is irrelevant, <code>flatMap<\/code> with a concurrency bound; where the API must be called in order (a sequence of state transitions), <code>concatMap<\/code>.<\/p>", "source": "answers.md", "search": "flatmap versus concatmap versus flatmapsequential - ordering and concurrency differences. - flatmap - subscribes to inner publishers eagerly and concurrently ; results are interleaved in completion order. fastest, no ordering. - concatmap - subscribes to each inner publisher only after the previous completes. ordered, sequential , so latency is the sum. - flatmapsequential - subscribes eagerly and concurrently like flatmap, but buffers to emit in source order . concurrency with ordering, at the cost of holding completed results while waiting for earlier ones. choose by whether order matters and whether the downstream can tolerate concurrency. for calling an external api per element where order is irrelevant, flatmap with a concurrency bound; where the api must be called in order (a sequence of state transitions), concatmap."}, {"n": 111, "category": 6, "difficulty": "T", "html": "Why does <code>flatMap<\/code> with default concurrency overwhelm a downstream service, and how do you bound it?", "answerTitle": "Unbounded `flatMap`", "answer": "<p><code>flatMap<\/code> defaults to a concurrency of <code>Queues.SMALL_BUFFER_SIZE<\/code> - <strong>256<\/strong> in-flight inner subscriptions. So a <code>Flux<\/code> of 10,000 IDs fires 256 simultaneous HTTP calls at the downstream, which for a service sized for 20 concurrent requests is an accidental denial of service - and it looks like <em>their<\/em> outage, not yours.<\/p><p>Bound it explicitly: <code>flatMap(this::call, 8)<\/code>. I treat the two-argument form as mandatory in review; the default is almost never the right number, and it is invisible.<\/p><p>Also bound the client itself: the <code>WebClient<\/code> connection pool (<code>ConnectionProvider.builder().maxConnections(n).pendingAcquireMaxCount(m)<\/code>) provides a second limit, so a missed <code>flatMap<\/code> bound degrades into queueing rather than overload. And prefer <code>limitRate<\/code> on the source when the constraint is throughput rather than concurrency.<\/p>", "source": "answers.md", "search": "why does flatmap with default concurrency overwhelm a downstream service, and how do you bound it? flatmap defaults to a concurrency of queues.small_buffer_size - 256 in-flight inner subscriptions. so a flux of 10,000 ids fires 256 simultaneous http calls at the downstream, which for a service sized for 20 concurrent requests is an accidental denial of service - and it looks like their outage, not yours. bound it explicitly: flatmap(this::call, 8). i treat the two-argument form as mandatory in review; the default is almost never the right number, and it is invisible. also bound the client itself: the webclient connection pool (connectionprovider.builder().maxconnections(n).pendingacquiremaxcount(m)) provides a second limit, so a missed flatmap bound degrades into queueing rather than overload. and prefer limitrate on the source when the constraint is throughput rather than concurrency."}, {"n": 112, "category": 6, "difficulty": "D", "html": "Error handling - <code>onErrorResume<\/code>, <code>onErrorReturn<\/code>, <code>onErrorContinue<\/code> and <code>retryWhen<\/code> with backoff. Which is a trap?", "answerTitle": "Error handling operators", "answer": "<ul><li><code>onErrorReturn(fallback)<\/code> - a static fallback value.<\/li><li><code>onErrorResume(e -&gt; alternative)<\/code> - a fallback publisher; the general-purpose recovery operator.<\/li><li><code>onErrorMap<\/code> - translate to a domain exception, preserving the cause.<\/li><li><code>retryWhen(Retry.backoff(3, ofMillis(200)).jitter(0.5).filter(this::isTransient))<\/code> - the correct retry form: bounded, exponential, jittered, and filtered to transient errors.<\/li><\/ul><p><strong><code>onErrorContinue<\/code> is the trap.<\/strong> It does not behave like the others: it reaches <em>upstream<\/em> into operators that support it and makes them drop the offending element and continue, which violates the normal error-terminates-the-sequence contract. It works inconsistently depending on which operators are in the chain, it is invisible to the operator that actually failed, and it interacts badly with <code>flatMap<\/code>. Reactor&#x27;s own documentation discourages it. The correct way to skip bad elements is to handle the error <em>inside<\/em> the inner publisher: <code>flatMap(x -&gt; process(x).onErrorResume(e -&gt; Mono.empty()))<\/code>, which is explicit and local.<\/p>", "source": "answers.md", "search": "error handling - onerrorresume, onerrorreturn, onerrorcontinue and retrywhen with backoff. which is a trap? - onerrorreturn(fallback) - a static fallback value. - onerrorresume(e - alternative) - a fallback publisher; the general-purpose recovery operator. - onerrormap - translate to a domain exception, preserving the cause. - retrywhen(retry.backoff(3, ofmillis(200)).jitter(0.5).filter(this::istransient)) - the correct retry form: bounded, exponential, jittered, and filtered to transient errors. onerrorcontinue is the trap. it does not behave like the others: it reaches upstream into operators that support it and makes them drop the offending element and continue, which violates the normal error-terminates-the-sequence contract. it works inconsistently depending on which operators are in the chain, it is invisible to the operator that actually failed, and it interacts badly with flatmap. reactor's own documentation discourages it. the correct way to skip bad elements is to handle the error inside the inner publisher: flatmap(x - process(x).onerrorresume(e - mono.empty())), which is explicit and local."}, {"n": 113, "category": 6, "difficulty": "D", "html": "<code>WebClient<\/code> configuration - connection pool sizing, timeouts, and what <code>PrematureCloseException<\/code> usually means.", "answerTitle": "`WebClient` configuration", "answer": "<p>The defaults are not production-ready. What I always set:<\/p><pre><code class=\"lang-java\">ConnectionProvider provider = ConnectionProvider.builder(&quot;api&quot;)\n    .maxConnections(50).pendingAcquireTimeout(ofSeconds(2))\n    .maxIdleTime(ofSeconds(20)).maxLifeTime(ofMinutes(5)).build();\n\nHttpClient http = HttpClient.create(provider)\n    .option(CONNECT_TIMEOUT_MILLIS, 2000)\n    .responseTimeout(ofSeconds(5));<\/code><\/pre><p><code>maxIdleTime<\/code> <strong>must be shorter than the server&#x27;s or load balancer&#x27;s idle timeout<\/strong>. <code>PrematureCloseException<\/code> (or &quot;Connection prematurely closed BEFORE response&quot;) almost always means exactly that: the client reused a pooled connection that the far side had already closed, a race you cannot retry your way out of reliably. The fix is the idle-time setting, not a retry.<\/p><p>Also: <code>responseTimeout<\/code> bounds the whole response, while <code>CONNECT_TIMEOUT_MILLIS<\/code> bounds only connection establishment - you need both. And enable metrics on the connection provider so pool saturation is visible before it becomes latency.<\/p>", "source": "answers.md", "search": "webclient configuration - connection pool sizing, timeouts, and what prematurecloseexception usually means. the defaults are not production-ready. what i always set: java connectionprovider provider = connectionprovider.builder(\"api\") .maxconnections(50).pendingacquiretimeout(ofseconds(2)) .maxidletime(ofseconds(20)).maxlifetime(ofminutes(5)).build(); httpclient http = httpclient.create(provider) .option(connect_timeout_millis, 2000) .responsetimeout(ofseconds(5)); maxidletime must be shorter than the server's or load balancer's idle timeout . prematurecloseexception (or \"connection prematurely closed before response\") almost always means exactly that: the client reused a pooled connection that the far side had already closed, a race you cannot retry your way out of reliably. the fix is the idle-time setting, not a retry. also: responsetimeout bounds the whole response, while connect_timeout_millis bounds only connection establishment - you need both. and enable metrics on the connection provider so pool saturation is visible before it becomes latency."}, {"n": 114, "category": 6, "difficulty": "D", "html": "R2DBC versus JDBC - what you gain and what you give up.", "answerTitle": "R2DBC versus JDBC", "answer": "<p>R2DBC is a non-blocking database API, so a query does not occupy a thread while waiting. You gain the ability to keep the reactive stack pure end to end, and higher connection efficiency under very high concurrency.<\/p><p>You give up a great deal: <strong>no JPA<\/strong> - no dirty checking, no lazy loading, no entity graph, no first-level cache; Spring Data R2DBC is closer to Spring Data JDBC in capability. No JDBC-based tooling, fewer mature drivers, different and less familiar transaction semantics, and a much smaller pool of engineers who can debug it.<\/p><p>My position: R2DBC is justified when you are already fully reactive for a good reason and the database is a genuine bottleneck at very high concurrency. For most services in 2026, JDBC on virtual threads gives you the throughput benefit with the entire mature ecosystem intact.<\/p>", "source": "answers.md", "search": "r2dbc versus jdbc - what you gain and what you give up. r2dbc is a non-blocking database api, so a query does not occupy a thread while waiting. you gain the ability to keep the reactive stack pure end to end, and higher connection efficiency under very high concurrency. you give up a great deal: no jpa - no dirty checking, no lazy loading, no entity graph, no first-level cache; spring data r2dbc is closer to spring data jdbc in capability. no jdbc-based tooling, fewer mature drivers, different and less familiar transaction semantics, and a much smaller pool of engineers who can debug it. my position: r2dbc is justified when you are already fully reactive for a good reason and the database is a genuine bottleneck at very high concurrency. for most services in 2026, jdbc on virtual threads gives you the throughput benefit with the entire mature ecosystem intact."}, {"n": 115, "category": 6, "difficulty": "D", "html": "Reactive transactions with <code>TransactionalOperator<\/code> - how does the boundary differ from the servlet model?", "answerTitle": "Reactive transaction boundaries", "answer": "<p>The boundary is the <strong>subscription<\/strong>, not the thread (Q78). <code>TransactionalOperator<\/code> makes it explicit:<\/p><pre><code class=\"lang-java\">Mono&lt;Order&gt; result = orderRepository.save(order)\n    .flatMap(saved -&gt; auditRepository.save(auditFor(saved)).thenReturn(saved))\n    .as(transactionalOperator::transactional);<\/code><\/pre><p>Everything within that subscription shares the transaction via the Reactor <code>Context<\/code>. Consequences: work spawned onto a separate subscription (a <code>subscribe()<\/code> inside the chain, a fire-and-forget) is <strong>not<\/strong> in the transaction; and mixing blocking JDBC into a reactive transaction does not work at all, since the two bind their resources differently.<\/p><p><code>@Transactional<\/code> on a method returning <code>Mono<\/code>/<code>Flux<\/code> works with a <code>ReactiveTransactionManager<\/code>, but I prefer the operator form here because the boundary is visible - in reactive code, invisible boundaries are much harder to reason about than in imperative code.<\/p>", "source": "answers.md", "search": "reactive transactions with transactionaloperator - how does the boundary differ from the servlet model? the boundary is the subscription , not the thread (q78). transactionaloperator makes it explicit: java mono<order result = orderrepository.save(order) .flatmap(saved - auditrepository.save(auditfor(saved)).thenreturn(saved)) .as(transactionaloperator::transactional); everything within that subscription shares the transaction via the reactor context. consequences: work spawned onto a separate subscription (a subscribe() inside the chain, a fire-and-forget) is not in the transaction; and mixing blocking jdbc into a reactive transaction does not work at all, since the two bind their resources differently. @transactional on a method returning mono/flux works with a reactivetransactionmanager, but i prefer the operator form here because the boundary is visible - in reactive code, invisible boundaries are much harder to reason about than in imperative code."}, {"n": 116, "category": 6, "difficulty": "D", "html": "Testing with <code>StepVerifier<\/code> and <code>VirtualTimeScheduler<\/code>.", "answerTitle": "`StepVerifier`", "answer": "<pre><code class=\"lang-java\">StepVerifier.create(service.findOrders(customerId))\n    .expectNextMatches(o -&gt; o.status() == CONFIRMED)\n    .expectNextCount(2)\n    .verifyComplete();<\/code><\/pre><p>It subscribes, asserts the sequence of signals, and fails if the sequence differs. <code>expectError(Type.class)<\/code>, <code>expectSubscription<\/code>, <code>thenRequest(n)<\/code> for backpressure assertions, and <code>verify(Duration)<\/code> for a timeout.<\/p><p><code>StepVerifier.withVirtualTime(() -&gt; flux)<\/code> replaces the scheduler with a <code>VirtualTimeScheduler<\/code>, so <code>thenAwait(Duration.ofHours(1))<\/code> completes instantly. That is what makes retry-with-backoff, timeout and interval logic testable - otherwise the test either sleeps for real or is not written at all. The supplier form is required because the publisher must be assembled <em>after<\/em> the virtual scheduler is installed, which is a common mistake.<\/p>", "source": "answers.md", "search": "testing with stepverifier and virtualtimescheduler. java stepverifier.create(service.findorders(customerid)) .expectnextmatches(o - o.status() == confirmed) .expectnextcount(2) .verifycomplete(); it subscribes, asserts the sequence of signals, and fails if the sequence differs. expecterror(type.class), expectsubscription, thenrequest(n) for backpressure assertions, and verify(duration) for a timeout. stepverifier.withvirtualtime(() - flux) replaces the scheduler with a virtualtimescheduler, so thenawait(duration.ofhours(1)) completes instantly. that is what makes retry-with-backoff, timeout and interval logic testable - otherwise the test either sleeps for real or is not written at all. the supplier form is required because the publisher must be assembled after the virtual scheduler is installed, which is a common mistake."}, {"n": 117, "category": 6, "difficulty": "D", "html": "<code>WebFilter<\/code> and reactive Spring Security - how does the chain differ from the servlet filter chain?", "answerTitle": "`WebFilter` and reactive security", "answer": "<p><code>WebFilter<\/code> is the reactive analogue of a servlet <code>Filter<\/code>, but it returns <code>Mono&lt;Void&gt;<\/code> and composes through <code>chain.filter(exchange)<\/code> rather than a blocking call. The security chain is <code>WebFilterChainProxy<\/code> with <code>SecurityWebFilterChain<\/code> beans, configured through <code>ServerHttpSecurity<\/code> instead of <code>HttpSecurity<\/code>.<\/p><p>The structural difference: everything is non-blocking, so a filter that needs to load a user must return a <code>Mono<\/code> rather than block, and the security context lives in the Reactor <code>Context<\/code> rather than a <code>ThreadLocal<\/code>. <code>@EnableWebFluxSecurity<\/code> replaces <code>@EnableWebSecurity<\/code>, and <code>@EnableReactiveMethodSecurity<\/code> handles method security - with the limitation that it only supports reactive return types.<\/p>", "source": "answers.md", "search": "webfilter and reactive spring security - how does the chain differ from the servlet filter chain? webfilter is the reactive analogue of a servlet filter, but it returns mono<void and composes through chain.filter(exchange) rather than a blocking call. the security chain is webfilterchainproxy with securitywebfilterchain beans, configured through serverhttpsecurity instead of httpsecurity. the structural difference: everything is non-blocking, so a filter that needs to load a user must return a mono rather than block, and the security context lives in the reactor context rather than a threadlocal. @enablewebfluxsecurity replaces @enablewebsecurity, and @enablereactivemethodsecurity handles method security - with the limitation that it only supports reactive return types."}, {"n": 118, "category": 6, "difficulty": "T", "html": "Why does <code>SecurityContextHolder<\/code> return nothing in a WebFlux handler, and what do you use instead?", "answerTitle": "Reactive security context", "answer": "<p><code>SecurityContextHolder<\/code> is <code>ThreadLocal<\/code>-backed, and no thread owns a reactive request, so it returns nothing (or worse, another request&#x27;s context in a pooled thread - which is why relying on it here is a security bug, not just a nuisance).<\/p><p>Use <code>ReactiveSecurityContextHolder.getContext()<\/code>, which reads from the Reactor <code>Context<\/code>:<\/p><pre><code class=\"lang-java\">return ReactiveSecurityContextHolder.getContext()\n    .map(SecurityContext::getAuthentication)\n    .flatMap(auth -&gt; service.forUser(auth.getName()));<\/code><\/pre><p>Or simply accept <code>@AuthenticationPrincipal<\/code> as a controller parameter, which is resolved for you. In tests, <code>@WithMockUser<\/code> works if you add <code>WebTestClientConfigurer<\/code> <code>mockUser()<\/code>, since the context must be written into the subscription rather than a thread.<\/p>", "source": "answers.md", "search": "why does securitycontextholder return nothing in a webflux handler, and what do you use instead? securitycontextholder is threadlocal-backed, and no thread owns a reactive request, so it returns nothing (or worse, another request's context in a pooled thread - which is why relying on it here is a security bug, not just a nuisance). use reactivesecuritycontextholder.getcontext(), which reads from the reactor context: java return reactivesecuritycontextholder.getcontext() .map(securitycontext::getauthentication) .flatmap(auth - service.foruser(auth.getname())); or simply accept @authenticationprincipal as a controller parameter, which is resolved for you. in tests, @withmockuser works if you add webtestclientconfigurer mockuser(), since the context must be written into the subscription rather than a thread."}, {"n": 119, "category": 6, "difficulty": "A", "html": "WebFlux versus MVC on virtual threads in 2026 - what do you recommend, and what conditions change your answer?", "answerTitle": "WebFlux versus MVC on virtual threads", "answer": "<p>My recommendation in 2026 is <strong>MVC with virtual threads by default<\/strong>, and WebFlux only for specific, nameable reasons.<\/p><p>The reasoning: virtual threads deliver the concurrency benefit that was WebFlux&#x27;s main selling point, while preserving imperative code, usable stack traces, <code>ThreadLocal<\/code>-based tooling, JDBC and JPA, step debugging, and a hiring pool that can maintain it. The cognitive cost of reactive code is real and it is paid by every engineer who touches the codebase for years.<\/p><p>Conditions that change my answer:<\/p><ul><li><strong>Streaming and backpressure semantics<\/strong> - server-sent events to many clients, or consuming a fast upstream where you must signal &quot;slow down&quot;. Virtual threads give concurrency but not backpressure.<\/li><li><strong>A fully reactive stack already in place<\/strong> with reactive drivers and a team fluent in it - rewriting to MVC is not automatically an improvement.<\/li><li><strong>Very high connection counts with minimal per-request work<\/strong> - an API gateway or proxy, where event-loop efficiency genuinely wins. Spring Cloud Gateway is reactive for exactly this reason.<\/li><li><strong>Composition-heavy orchestration<\/strong> - fanning out to many services with fine-grained concurrency and timeout control, where the operator model is genuinely more expressive than imperative code.<\/li><\/ul><p>What I would not accept as a reason: &quot;it is faster&quot; without a measurement, or &quot;it is more modern&quot;.<\/p>", "source": "answers.md", "search": "webflux versus mvc on virtual threads in 2026 - what do you recommend, and what conditions change your answer? my recommendation in 2026 is mvc with virtual threads by default , and webflux only for specific, nameable reasons. the reasoning: virtual threads deliver the concurrency benefit that was webflux's main selling point, while preserving imperative code, usable stack traces, threadlocal-based tooling, jdbc and jpa, step debugging, and a hiring pool that can maintain it. the cognitive cost of reactive code is real and it is paid by every engineer who touches the codebase for years. conditions that change my answer: - streaming and backpressure semantics - server-sent events to many clients, or consuming a fast upstream where you must signal \"slow down\". virtual threads give concurrency but not backpressure. - a fully reactive stack already in place with reactive drivers and a team fluent in it - rewriting to mvc is not automatically an improvement. - very high connection counts with minimal per-request work - an api gateway or proxy, where event-loop efficiency genuinely wins. spring cloud gateway is reactive for exactly this reason. - composition-heavy orchestration - fanning out to many services with fine-grained concurrency and timeout control, where the operator model is genuinely more expressive than imperative code. what i would not accept as a reason: \"it is faster\" without a measurement, or \"it is more modern\"."}, {"n": 120, "category": 6, "difficulty": "A", "html": "You inherit a WebFlux service the team cannot debug or maintain. What do you do?", "answerTitle": "Inheriting an unmaintainable WebFlux service", "answer": "<p>I would not rewrite it first. A rewrite of a working system by a team that does not understand it produces a differently broken system, later.<\/p><p>My sequence:<\/p><ol><li><strong>Stabilize and measure.<\/strong> Add BlockHound in tests, checkpoint/<code>onOperatorDebug<\/code> or <code>ReactorDebugAgent<\/code> so stack traces are usable, proper context propagation so logs correlate, and metrics on the event loop and connection pools. Most &quot;unmaintainable&quot; reactive services are actually &quot;undebuggable&quot; ones, and this alone changes the situation.<\/li><li><strong>Find the real problem.<\/strong> Is it genuinely the paradigm, or is it unbounded <code>flatMap<\/code>, blocking calls on the loop, <code>onErrorContinue<\/code>, and no tests? Those are fixable defects, not architectural ones.<\/li><li><strong>Build the team&#x27;s capability<\/strong> deliberately - a short internal guide covering the ten operators they actually use, pairing on changes, and <code>StepVerifier<\/code> tests so changes are safe.<\/li><li><strong>Then decide.<\/strong> If after that the service is still a drag - typically when it is mostly blocking work wrapped in <code>boundedElastic<\/code>, which is the honest signal that reactive bought nothing - I would migrate incrementally: MVC with virtual threads, endpoint by endpoint behind the same contract, with the two coexisting during the transition. Never a big bang.<\/li><\/ol><p>The judgement being assessed is whether you can separate &quot;I dislike this&quot; from &quot;this is costing us&quot;, and whether you can make that case with evidence.<\/p>", "source": "answers.md", "search": "you inherit a webflux service the team cannot debug or maintain. what do you do? i would not rewrite it first. a rewrite of a working system by a team that does not understand it produces a differently broken system, later. my sequence: 1. stabilize and measure. add blockhound in tests, checkpoint/onoperatordebug or reactordebugagent so stack traces are usable, proper context propagation so logs correlate, and metrics on the event loop and connection pools. most \"unmaintainable\" reactive services are actually \"undebuggable\" ones, and this alone changes the situation. 2. find the real problem. is it genuinely the paradigm, or is it unbounded flatmap, blocking calls on the loop, onerrorcontinue, and no tests? those are fixable defects, not architectural ones. 3. build the team's capability deliberately - a short internal guide covering the ten operators they actually use, pairing on changes, and stepverifier tests so changes are safe. 4. then decide. if after that the service is still a drag - typically when it is mostly blocking work wrapped in boundedelastic, which is the honest signal that reactive bought nothing - i would migrate incrementally: mvc with virtual threads, endpoint by endpoint behind the same contract, with the two coexisting during the transition. never a big bang. the judgement being assessed is whether you can separate \"i dislike this\" from \"this is costing us\", and whether you can make that case with evidence."}, {"n": 121, "category": 7, "difficulty": "C", "html": "How does a repository <em>interface<\/em> become a working bean? Which proxy and which factory are involved?", "answerTitle": "From interface to bean", "answer": "<p><code>RepositoryBeanDefinitionRegistrarSupport<\/code> (an <code>ImportBeanDefinitionRegistrar<\/code>, activated by <code>@EnableJpaRepositories<\/code> or Boot&#x27;s auto-configuration) scans for interfaces extending <code>Repository<\/code> and registers a <code>JpaRepositoryFactoryBean<\/code> definition for each.<\/p><p>At creation, the factory builds a <strong>JDK dynamic proxy<\/strong> implementing your interface. Its interceptor chain resolves each call in order: is it a method of the base <code>SimpleJpaRepository<\/code> implementation, a method from a custom fragment, or a <em>derived<\/em> or <code>@Query<\/code> method to be executed by a <code>RepositoryQuery<\/code>? Derived queries are parsed at <strong>startup<\/strong>, which is why a typo in a method name fails at boot rather than at first call - a genuinely valuable property worth mentioning.<\/p>", "source": "answers.md", "search": "how does a repository interface become a working bean? which proxy and which factory are involved? repositorybeandefinitionregistrarsupport (an importbeandefinitionregistrar, activated by @enablejparepositories or boot's auto-configuration) scans for interfaces extending repository and registers a jparepositoryfactorybean definition for each. at creation, the factory builds a jdk dynamic proxy implementing your interface. its interceptor chain resolves each call in order: is it a method of the base simplejparepository implementation, a method from a custom fragment, or a derived or @query method to be executed by a repositoryquery? derived queries are parsed at startup , which is why a typo in a method name fails at boot rather than at first call - a genuinely valuable property worth mentioning."}, {"n": 122, "category": 7, "difficulty": "C", "html": "Query derivation from method names - the parsing rules, and where the approach breaks down.", "answerTitle": "Query derivation", "answer": "<p><code>PartTree<\/code> parses the method name after a subject keyword (<code>find<\/code>, <code>read<\/code>, <code>get<\/code>, <code>query<\/code>, <code>count<\/code>, <code>exists<\/code>, <code>delete<\/code>) and <code>By<\/code>, splitting the predicate on <code>And<\/code>/<code>Or<\/code>, then matching property paths against the entity graph, with keywords such as <code>Between<\/code>, <code>LessThan<\/code>, <code>Like<\/code>, <code>IgnoreCase<\/code>, <code>OrderBy<\/code>.<\/p><p>Where it breaks down: ambiguous property paths (<code>findByUserAddressZip<\/code> could be <code>user.addressZip<\/code> or <code>user.address.zip<\/code> - resolved by underscore, <code>findByUser_Address_Zip<\/code>); anything needing a join condition, an aggregate, a subquery or a projection; and method names that grow past readability - <code>findByStatusAndCreatedAtBetweenAndCustomerTypeInOrderByCreatedAtDesc<\/code> is a signal to switch to <code>@Query<\/code> or a <code>Specification<\/code>.<\/p><p>My guidance to teams: derivation for one or two predicates, <code>@Query<\/code> for anything fixed and complex, <code>Specification<\/code> or Querydsl for anything dynamic.<\/p>", "source": "answers.md", "search": "query derivation from method names - the parsing rules, and where the approach breaks down. parttree parses the method name after a subject keyword (find, read, get, query, count, exists, delete) and by, splitting the predicate on and/or, then matching property paths against the entity graph, with keywords such as between, lessthan, like, ignorecase, orderby. where it breaks down: ambiguous property paths (findbyuseraddresszip could be user.addresszip or user.address.zip - resolved by underscore, findbyuser_address_zip); anything needing a join condition, an aggregate, a subquery or a projection; and method names that grow past readability - findbystatusandcreatedatbetweenandcustomertypeinorderbycreatedatdesc is a signal to switch to @query or a specification. my guidance to teams: derivation for one or two predicates, @query for anything fixed and complex, specification or querydsl for anything dynamic."}, {"n": 123, "category": 7, "difficulty": "T", "html": "A finder returning <code>Optional<\/code>, <code>Stream<\/code>, <code>Page<\/code>, <code>Slice<\/code> or <code>List<\/code> - what changes in the SQL issued and in the transaction required?", "answerTitle": "Return types", "answer": "<ul><li><code>Optional&lt;T&gt;<\/code> / <code>T<\/code> - expects at most one row; more than one throws <code>IncorrectResultSizeDataAccessException<\/code>.<\/li><li><code>List&lt;T&gt;<\/code> - all rows materialized.<\/li><li><code>Page&lt;T&gt;<\/code> - the query plus a <strong>separate <code>COUNT<\/code> query<\/strong>.<\/li><li><code>Slice&lt;T&gt;<\/code> - fetches <code>pageSize + 1<\/code> rows to determine <code>hasNext<\/code>; no count query.<\/li><li><code>Stream&lt;T&gt;<\/code> - a cursor-based, lazily materialized result. <strong>Requires an open transaction and must be closed<\/strong> (try-with-resources), or you leak the connection.<\/li><li><code>Mono<\/code>/<code>Flux<\/code> - only with a reactive module.<\/li><\/ul><p>So the return type changes both the SQL issued and the transactional requirements of the caller, which is not obvious from the method signature. <code>Stream<\/code> and <code>Page<\/code> are the two that surprise people - the first because it needs a transaction the caller may not have, the second because of the hidden count.<\/p>", "source": "answers.md", "search": "a finder returning optional, stream, page, slice or list - what changes in the sql issued and in the transaction required? - optional<t / t - expects at most one row; more than one throws incorrectresultsizedataaccessexception. - list<t - all rows materialized. - page<t - the query plus a separate count query . - slice<t - fetches pagesize + 1 rows to determine hasnext; no count query. - stream<t - a cursor-based, lazily materialized result. requires an open transaction and must be closed (try-with-resources), or you leak the connection. - mono/flux - only with a reactive module. so the return type changes both the sql issued and the transactional requirements of the caller, which is not obvious from the method signature. stream and page are the two that surprise people - the first because it needs a transaction the caller may not have, the second because of the hidden count."}, {"n": 124, "category": 7, "difficulty": "D", "html": "Projections - interface-based, class/DTO-based, dynamic and nested. Which actually narrow the SQL?", "answerTitle": "Projections", "answer": "<ul><li><strong>Interface (closed)<\/strong> projection - getters matching entity properties. Spring Data generates a query selecting <strong>only those columns<\/strong>, so it is genuinely narrow. This is the efficient one.<\/li><li><strong>Interface (open)<\/strong> projection - any getter annotated <code>@Value(&quot;#{target.x + target.y}&quot;)<\/code>. Because the SpEL can reach anything, Spring Data <strong>loads the full entity<\/strong> and evaluates against it. No SQL narrowing at all.<\/li><li><strong>Class/DTO<\/strong> projection - a class (or record) whose constructor parameters match property names. Also produces a narrow query, and my preferred form because it is a real type with no proxy.<\/li><li><strong>Dynamic<\/strong> projection - <code>&lt;T&gt; List&lt;T&gt; findByStatus(Status s, Class&lt;T&gt; type)<\/code>, letting the caller choose the shape from one method.<\/li><\/ul><p>The distinction between closed and open interface projections is exactly the kind of detail that separates a candidate who has read the documentation from one who has profiled the SQL.<\/p>", "source": "answers.md", "search": "projections - interface-based, class/dto-based, dynamic and nested. which actually narrow the sql? - interface (closed) projection - getters matching entity properties. spring data generates a query selecting only those columns , so it is genuinely narrow. this is the efficient one. - interface (open) projection - any getter annotated @value(\" {target.x + target.y}\"). because the spel can reach anything, spring data loads the full entity and evaluates against it. no sql narrowing at all. - class/dto projection - a class (or record) whose constructor parameters match property names. also produces a narrow query, and my preferred form because it is a real type with no proxy. - dynamic projection - <t list<t findbystatus(status s, class<t type), letting the caller choose the shape from one method. the distinction between closed and open interface projections is exactly the kind of detail that separates a candidate who has read the documentation from one who has profiled the sql."}, {"n": 125, "category": 7, "difficulty": "T", "html": "Why can an interface projection with a nested projection still load the full entity graph?", "answerTitle": "Nested projections", "answer": "<p>A nested projection (<code>interface OrderView { CustomerView getCustomer(); }<\/code>) cannot be satisfied by a flat column selection, so Spring Data falls back to loading the <strong>full root entity<\/strong> and then wrapping the association in a projection proxy. The association is loaded according to its fetch strategy - which for a lazy <code>@ManyToOne<\/code> means an extra query per row, reproducing N+1 exactly where you thought you had optimized it.<\/p><p>The same happens with any open projection, because the SpEL expression could reference anything.<\/p><p>The reliable fix is a <strong>DTO projection with a constructor expression<\/strong> naming the exact columns across the join:<\/p><pre><code class=\"lang-java\">@Query(&quot;select new com.acme.OrderView(o.id, c.name) from Order o join o.customer c&quot;)\nList&lt;OrderView&gt; findViews();<\/code><\/pre><p>One query, exactly the columns needed, no proxies. The general lesson: verify projections by looking at the generated SQL, because the type signature tells you nothing about it.<\/p>", "source": "answers.md", "search": "why can an interface projection with a nested projection still load the full entity graph? a nested projection (interface orderview { customerview getcustomer(); }) cannot be satisfied by a flat column selection, so spring data falls back to loading the full root entity and then wrapping the association in a projection proxy. the association is loaded according to its fetch strategy - which for a lazy @manytoone means an extra query per row, reproducing n+1 exactly where you thought you had optimized it. the same happens with any open projection, because the spel expression could reference anything. the reliable fix is a dto projection with a constructor expression naming the exact columns across the join: java @query(\"select new com.acme.orderview(o.id, c.name) from order o join o.customer c\") list<orderview findviews(); one query, exactly the columns needed, no proxies. the general lesson: verify projections by looking at the generated sql, because the type signature tells you nothing about it."}, {"n": 126, "category": 7, "difficulty": "D", "html": "<code>Specification<\/code> and the Criteria API - composing dynamic queries without string building.", "answerTitle": "`Specification`", "answer": "<p><code>Specification&lt;T&gt;<\/code> wraps a JPA Criteria predicate and composes with <code>and<\/code>, <code>or<\/code> and <code>not<\/code>, which is how you build a dynamic query without concatenating strings:<\/p><pre><code class=\"lang-java\">static Specification&lt;Order&gt; hasStatus(Status s) {\n    return (root, query, cb) -&gt; s == null ? null : cb.equal(root.get(&quot;status&quot;), s);\n}\nrepository.findAll(hasStatus(status).and(createdAfter(from)), pageable);<\/code><\/pre><p>Returning <code>null<\/code> for an absent filter makes optional criteria compose cleanly. Strengths: type-safe-ish, dynamic, works with <code>Pageable<\/code> and <code>Page<\/code>, and it is injection-proof because values are bound as parameters.<\/p><p>Weaknesses: the Criteria API is verbose and reads poorly, <code>root.get(&quot;status&quot;)<\/code> is a stringly-typed reference that refactoring will not catch (use the generated JPA metamodel <code>Order_.status<\/code> to fix that), and complex joins with fetch semantics interact awkwardly with the count query used for <code>Page<\/code>.<\/p>", "source": "answers.md", "search": "specification and the criteria api - composing dynamic queries without string building. specification<t wraps a jpa criteria predicate and composes with and, or and not, which is how you build a dynamic query without concatenating strings: java static specification<order hasstatus(status s) { return (root, query, cb) - s == null ? null : cb.equal(root.get(\"status\"), s); } repository.findall(hasstatus(status).and(createdafter(from)), pageable); returning null for an absent filter makes optional criteria compose cleanly. strengths: type-safe-ish, dynamic, works with pageable and page, and it is injection-proof because values are bound as parameters. weaknesses: the criteria api is verbose and reads poorly, root.get(\"status\") is a stringly-typed reference that refactoring will not catch (use the generated jpa metamodel order_.status to fix that), and complex joins with fetch semantics interact awkwardly with the count query used for page."}, {"n": 127, "category": 7, "difficulty": "D", "html": "Querydsl versus Specifications versus a hand-written <code>@Query<\/code>. How do you choose?", "answerTitle": "Specifications versus Querydsl versus `@Query`", "answer": "<ul><li><strong><code>@Query<\/code><\/strong> - a fixed query. Most readable, easiest to review and to hand to a DBA, and easily verified with <code>EXPLAIN<\/code>. My default when the query does not vary.<\/li><li><strong><code>Specification<\/code><\/strong> - dynamic criteria, no extra dependency or build step. My default for search endpoints with optional filters.<\/li><li><strong>Querydsl<\/strong> - a generated, fully type-safe DSL (<code>QOrder.order.status.eq(...)<\/code>) that is far more readable than Criteria and survives refactoring. Better ergonomics, at the cost of an annotation processor, generated sources, and a build step that can complicate IDE setup and native builds.<\/li><\/ul><p>I choose Querydsl when there is a large amount of dynamic query construction and the team will invest in it; Specifications when it is a handful of endpoints; <code>@Query<\/code> for everything else. The failure mode to avoid is using all three in one codebase, which is common and makes the data layer unreadable.<\/p>", "source": "answers.md", "search": "querydsl versus specifications versus a hand-written @query. how do you choose? - @query - a fixed query. most readable, easiest to review and to hand to a dba, and easily verified with explain. my default when the query does not vary. - specification - dynamic criteria, no extra dependency or build step. my default for search endpoints with optional filters. - querydsl - a generated, fully type-safe dsl (qorder.order.status.eq(...)) that is far more readable than criteria and survives refactoring. better ergonomics, at the cost of an annotation processor, generated sources, and a build step that can complicate ide setup and native builds. i choose querydsl when there is a large amount of dynamic query construction and the team will invest in it; specifications when it is a handful of endpoints; @query for everything else. the failure mode to avoid is using all three in one codebase, which is common and makes the data layer unreadable."}, {"n": 128, "category": 7, "difficulty": "T", "html": "<code>@Modifying<\/code> - why do you need <code>clearAutomatically<\/code> and <code>flushAutomatically<\/code>, and what stale state appears without them?", "answerTitle": "`@Modifying`", "answer": "<p>A <code>@Modifying<\/code> query executes DML <strong>directly against the database<\/strong>, bypassing the persistence context entirely. Hibernate does not know what it changed.<\/p><p>That creates two problems, and each flag fixes one:<\/p><ul><li><code>flushAutomatically = true<\/code> - flushes pending changes <strong>before<\/strong> the query, so your in-memory modifications are not overwritten or ignored by the bulk statement.<\/li><li><code>clearAutomatically = true<\/code> - clears the persistence context <strong>after<\/strong>, so subsequently loaded entities are not served from the first-level cache with stale, pre-update state.<\/li><\/ul><p>Without them, code that runs <code>updateStatusToArchived()<\/code> and then reads the entity gets the <em>old<\/em> status back from the persistence context and silently writes it again on flush. Both flags are recommended, and a <code>@Modifying<\/code> query requires an active transaction.<\/p>", "source": "answers.md", "search": "@modifying - why do you need clearautomatically and flushautomatically, and what stale state appears without them? a @modifying query executes dml directly against the database , bypassing the persistence context entirely. hibernate does not know what it changed. that creates two problems, and each flag fixes one: - flushautomatically = true - flushes pending changes before the query, so your in-memory modifications are not overwritten or ignored by the bulk statement. - clearautomatically = true - clears the persistence context after , so subsequently loaded entities are not served from the first-level cache with stale, pre-update state. without them, code that runs updatestatustoarchived() and then reads the entity gets the old status back from the persistence context and silently writes it again on flush. both flags are recommended, and a @modifying query requires an active transaction."}, {"n": 129, "category": 7, "difficulty": "D", "html": "<code>@Query<\/code> with JPQL versus native SQL - pagination, sorting and when you must supply a <code>countQuery<\/code>.", "answerTitle": "`@Query`: JPQL versus native", "answer": "<p>JPQL is portable, validated at startup against the entity model, and integrates with the persistence context. Native SQL gives you database-specific features (window functions, CTEs, <code>ON CONFLICT<\/code>, full-text) at the cost of portability and startup validation.<\/p><p>For pagination with a native query you must supply a <code>countQuery<\/code>, because Spring Data cannot derive it reliably by string manipulation:<\/p><pre><code class=\"lang-java\">@Query(value = &quot;select * from orders where status = :s&quot;,\n       countQuery = &quot;select count(*) from orders where status = :s&quot;,\n       nativeQuery = true)\nPage&lt;Order&gt; findByStatus(@Param(&quot;s&quot;) String status, Pageable pageable);<\/code><\/pre><p>Sorting with <code>Pageable<\/code> works for JPQL but <strong>not<\/strong> for native queries with dynamic <code>Sort<\/code> - Spring Data cannot safely inject an ORDER BY into arbitrary SQL, and attempting it is where Q130 comes from.<\/p>", "source": "answers.md", "search": "@query with jpql versus native sql - pagination, sorting and when you must supply a countquery. jpql is portable, validated at startup against the entity model, and integrates with the persistence context. native sql gives you database-specific features (window functions, ctes, on conflict, full-text) at the cost of portability and startup validation. for pagination with a native query you must supply a countquery, because spring data cannot derive it reliably by string manipulation: java @query(value = \"select from orders where status = :s\", countquery = \"select count( ) from orders where status = :s\", nativequery = true) page<order findbystatus(@param(\"s\") string status, pageable pageable); sorting with pageable works for jpql but not for native queries with dynamic sort - spring data cannot safely inject an order by into arbitrary sql, and attempting it is where q130 comes from."}, {"n": 130, "category": 7, "difficulty": "T", "html": "Sorting a native query by a user-supplied column name - what is the risk and what is the correct handling?", "answerTitle": "Sorting a native query by user input", "answer": "<p>Column names cannot be bound as parameters, so a user-supplied sort column has to be concatenated into the SQL - which is <strong>SQL injection<\/strong>, in an application where everyone assumed JPA made that impossible.<\/p><p><code>Sort.by(userInput)<\/code> with a native query either fails or, if you build the string yourself, injects. <code>JpaSort.unsafe(&quot;...&quot;)<\/code> exists precisely to make the danger explicit in the code.<\/p><p>The correct handling is an <strong>allowlist<\/strong>: map an external sort key to a known column, and reject anything else.<\/p><pre><code class=\"lang-java\">private static final Map&lt;String, String&gt; SORTABLE =\n    Map.of(&quot;created&quot;, &quot;created_at&quot;, &quot;amount&quot;, &quot;total_amount&quot;);\nString column = SORTABLE.get(request.sort());\nif (column == null) throw new BadSortException(request.sort());<\/code><\/pre><p>Same rule for dynamic table names in schema-per-tenant setups. The general principle worth stating: every user-controlled <em>value<\/em> is a bound parameter; every user-controlled <em>identifier<\/em> is validated against a fixed allowlist.<\/p>", "source": "answers.md", "search": "sorting a native query by a user-supplied column name - what is the risk and what is the correct handling? column names cannot be bound as parameters, so a user-supplied sort column has to be concatenated into the sql - which is sql injection , in an application where everyone assumed jpa made that impossible. sort.by(userinput) with a native query either fails or, if you build the string yourself, injects. jpasort.unsafe(\"...\") exists precisely to make the danger explicit in the code. the correct handling is an allowlist : map an external sort key to a known column, and reject anything else. java private static final map<string, string sortable = map.of(\"created\", \"created_at\", \"amount\", \"total_amount\"); string column = sortable.get(request.sort()); if (column == null) throw new badsortexception(request.sort()); same rule for dynamic table names in schema-per-tenant setups. the general principle worth stating: every user-controlled value is a bound parameter; every user-controlled identifier is validated against a fixed allowlist."}, {"n": 131, "category": 7, "difficulty": "D", "html": "Custom repository fragments - composing behavior without an abstract base class.", "answerTitle": "Custom fragments", "answer": "<p>Define an interface and an implementation named with the <code>Impl<\/code> suffix, then have your repository extend both:<\/p><pre><code class=\"lang-java\">interface OrderRepositoryCustom { List&lt;OrderSummary&gt; search(SearchCriteria c); }\nclass OrderRepositoryCustomImpl implements OrderRepositoryCustom { @PersistenceContext EntityManager em; ... }\ninterface OrderRepository extends JpaRepository&lt;Order, Long&gt;, OrderRepositoryCustom {}<\/code><\/pre><p>Spring Data detects the <code>Impl<\/code> by naming convention and adds it to the proxy&#x27;s interceptor chain.<\/p><p>This is better than an abstract base class because fragments <strong>compose<\/strong> - several fragments can be mixed into one repository, and a fragment can be shared across repositories (a <code>SoftDeleteFragment<\/code> reused everywhere). It also keeps the hand-written <code>EntityManager<\/code> code in one clearly-marked place instead of leaking a second repository type into the service layer.<\/p>", "source": "answers.md", "search": "custom repository fragments - composing behavior without an abstract base class. define an interface and an implementation named with the impl suffix, then have your repository extend both: java interface orderrepositorycustom { list<ordersummary search(searchcriteria c); } class orderrepositorycustomimpl implements orderrepositorycustom { @persistencecontext entitymanager em; ... } interface orderrepository extends jparepository<order, long , orderrepositorycustom {} spring data detects the impl by naming convention and adds it to the proxy's interceptor chain. this is better than an abstract base class because fragments compose - several fragments can be mixed into one repository, and a fragment can be shared across repositories (a softdeletefragment reused everywhere). it also keeps the hand-written entitymanager code in one clearly-marked place instead of leaking a second repository type into the service layer."}, {"n": 132, "category": 7, "difficulty": "D", "html": "Auditing - <code>@CreatedBy<\/code>, <code>@LastModifiedDate<\/code> and <code>AuditorAware<\/code>. How does it behave for async or system-initiated writes?", "answerTitle": "Auditing", "answer": "<p>Enable with <code>@EnableJpaAuditing<\/code> and <code>@EntityListeners(AuditingEntityListener.class)<\/code>; then <code>@CreatedDate<\/code>, <code>@LastModifiedDate<\/code>, <code>@CreatedBy<\/code> and <code>@LastModifiedBy<\/code> are populated on persist and update. The user comes from an <code>AuditorAware&lt;String&gt;<\/code> bean, which normally reads <code>SecurityContextHolder<\/code>.<\/p><p>The interesting part is what happens when there is no user: an <code>@Async<\/code> method, a <code>@Scheduled<\/code> job, a Kafka consumer or a Flyway-triggered migration all have an empty security context, so <code>AuditorAware<\/code> must return a meaningful system identity rather than <code>Optional.empty()<\/code> (which leaves the column null and destroys the audit trail&#x27;s value).<\/p><pre><code class=\"lang-java\">return Optional.of(SecurityContextHolder.getContext())\n    .map(SecurityContext::getAuthentication).filter(Authentication::isAuthenticated)\n    .map(Authentication::getName).or(() -&gt; Optional.of(&quot;system:&quot; + applicationName));<\/code><\/pre><p>Also worth stating: JPA auditing records <em>who last touched the row<\/em>, not a history. If you need &quot;what changed and when&quot; for compliance, that is Hibernate Envers or an explicit audit table (see <code>01-java<\/code> Q225), not these four annotations.<\/p>", "source": "answers.md", "search": "auditing - @createdby, @lastmodifieddate and auditoraware. how does it behave for async or system-initiated writes? enable with @enablejpaauditing and @entitylisteners(auditingentitylistener.class); then @createddate, @lastmodifieddate, @createdby and @lastmodifiedby are populated on persist and update. the user comes from an auditoraware<string bean, which normally reads securitycontextholder. the interesting part is what happens when there is no user: an @async method, a @scheduled job, a kafka consumer or a flyway-triggered migration all have an empty security context, so auditoraware must return a meaningful system identity rather than optional.empty() (which leaves the column null and destroys the audit trail's value). java return optional.of(securitycontextholder.getcontext()) .map(securitycontext::getauthentication).filter(authentication::isauthenticated) .map(authentication::getname).or(() - optional.of(\"system:\" + applicationname)); also worth stating: jpa auditing records who last touched the row , not a history. if you need \"what changed and when\" for compliance, that is hibernate envers or an explicit audit table (see 01-java q225), not these four annotations."}, {"n": 133, "category": 7, "difficulty": "D", "html": "Optimistic locking through Spring Data - handling <code>OptimisticLockingFailureException<\/code> and retrying safely.", "answerTitle": "Optimistic locking through Spring Data", "answer": "<p>Add <code>@Version<\/code> to the entity; Hibernate appends <code>WHERE version = ?<\/code> to updates and throws <code>ObjectOptimisticLockingFailureException<\/code> (Spring&#x27;s <code>OptimisticLockingFailureException<\/code> hierarchy) when zero rows are affected.<\/p><p>Handling it correctly means <strong>reload, re-apply, retry<\/strong> - not retrying the same detached entity, which will fail identically forever. The retry must therefore wrap a boundary that starts a fresh transaction <em>and<\/em> re-reads:<\/p><pre><code class=\"lang-java\">@Retryable(retryFor = OptimisticLockingFailureException.class,\n           maxAttempts = 3, backoff = @Backoff(delay = 50, random = true))\n@Transactional\npublic void adjustStock(Long id, int delta) {\n    Product p = repository.findById(id).orElseThrow();  // fresh read each attempt\n    p.adjust(delta);\n}<\/code><\/pre><p>The retry aspect must be <strong>outside<\/strong> the transaction aspect (Q49), or every attempt joins the same doomed transaction. For a genuinely hot row, retries will thrash and pessimistic locking or an atomic <code>UPDATE ... SET qty = qty - ?<\/code> is the better answer.<\/p>", "source": "answers.md", "search": "optimistic locking through spring data - handling optimisticlockingfailureexception and retrying safely. add @version to the entity; hibernate appends where version = ? to updates and throws objectoptimisticlockingfailureexception (spring's optimisticlockingfailureexception hierarchy) when zero rows are affected. handling it correctly means reload, re-apply, retry - not retrying the same detached entity, which will fail identically forever. the retry must therefore wrap a boundary that starts a fresh transaction and re-reads: java @retryable(retryfor = optimisticlockingfailureexception.class, maxattempts = 3, backoff = @backoff(delay = 50, random = true)) @transactional public void adjuststock(long id, int delta) { product p = repository.findbyid(id).orelsethrow(); // fresh read each attempt p.adjust(delta); } the retry aspect must be outside the transaction aspect (q49), or every attempt joins the same doomed transaction. for a genuinely hot row, retries will thrash and pessimistic locking or an atomic update ... set qty = qty - ? is the better answer."}, {"n": 134, "category": 7, "difficulty": "D", "html": "Streaming a large result set with <code>Stream&lt;T&gt;<\/code> - what does it require from the transaction, the connection and the fetch size?", "answerTitle": "Streaming large results", "answer": "<pre><code class=\"lang-java\">@Transactional(readOnly = true)\npublic void export(Consumer&lt;Order&gt; sink) {\n    try (Stream&lt;Order&gt; stream = repository.streamAllByStatus(ACTIVE)) {\n        stream.forEach(sink);\n    }\n}<\/code><\/pre><p>Requirements, all of which are easy to get wrong: an <strong>open transaction<\/strong> for the whole consumption (the cursor lives on the connection); an explicit <strong>close<\/strong> (try-with-resources) or the connection leaks; a <strong>fetch size<\/strong> hint so the driver does not materialize everything anyway (<code>@QueryHints(@QueryHint(name = HINT_FETCH_SIZE, value = &quot;500&quot;))<\/code>, and on MySQL the fetch size must be <code>Integer.MIN_VALUE<\/code>); and periodic <code>entityManager.clear()<\/code>, because otherwise every streamed entity stays in the persistence context and you reproduce the <code>OutOfMemoryError<\/code> you were trying to avoid.<\/p><p>That last point is the one candidates miss - streaming fixes the JDBC buffer, not the first-level cache.<\/p>", "source": "answers.md", "search": "streaming a large result set with stream<t - what does it require from the transaction, the connection and the fetch size? java @transactional(readonly = true) public void export(consumer<order sink) { try (stream<order stream = repository.streamallbystatus(active)) { stream.foreach(sink); } } requirements, all of which are easy to get wrong: an open transaction for the whole consumption (the cursor lives on the connection); an explicit close (try-with-resources) or the connection leaks; a fetch size hint so the driver does not materialize everything anyway (@queryhints(@queryhint(name = hint_fetch_size, value = \"500\")), and on mysql the fetch size must be integer.min_value); and periodic entitymanager.clear(), because otherwise every streamed entity stays in the persistence context and you reproduce the outofmemoryerror you were trying to avoid. that last point is the one candidates miss - streaming fixes the jdbc buffer, not the first-level cache."}, {"n": 135, "category": 7, "difficulty": "T", "html": "Why does returning <code>Page<\/code> cost an extra query, and when should you use <code>Slice<\/code> or keyset pagination instead?", "answerTitle": "`Page` versus `Slice`", "answer": "<p><code>Page<\/code> needs the total element count to compute <code>getTotalPages()<\/code>, so it issues a second <code>COUNT<\/code> query. On a large filtered table that count can cost more than the page itself, and it is executed on <strong>every<\/strong> page request.<\/p><p><code>Slice<\/code> only fetches <code>pageSize + 1<\/code> rows to determine whether a next page exists - no count query. It gives you &quot;next&quot; and &quot;previous&quot; but not &quot;page 47 of 912&quot;.<\/p><p>Use <code>Slice<\/code> for infinite scroll and any &quot;next&quot; navigation, which is most modern UIs. Use <code>Page<\/code> only when the UI genuinely renders a total, and consider an approximate count (<code>reltuples<\/code> in Postgres) or a cached count if it does.<\/p><p>Beyond a few thousand pages, neither is right: <code>OFFSET<\/code> makes the database scan and discard, so cost grows with depth. That is when you move to keyset pagination (<code>01-java<\/code> Q158), which Spring Data supports directly with <code>ScrollPosition<\/code> and <code>Window&lt;T&gt;<\/code> on modern versions.<\/p>", "source": "answers.md", "search": "why does returning page cost an extra query, and when should you use slice or keyset pagination instead? page needs the total element count to compute gettotalpages(), so it issues a second count query. on a large filtered table that count can cost more than the page itself, and it is executed on every page request. slice only fetches pagesize + 1 rows to determine whether a next page exists - no count query. it gives you \"next\" and \"previous\" but not \"page 47 of 912\". use slice for infinite scroll and any \"next\" navigation, which is most modern uis. use page only when the ui genuinely renders a total, and consider an approximate count (reltuples in postgres) or a cached count if it does. beyond a few thousand pages, neither is right: offset makes the database scan and discard, so cost grows with depth. that is when you move to keyset pagination (01-java q158), which spring data supports directly with scrollposition and window<t on modern versions."}, {"n": 136, "category": 7, "difficulty": "D", "html": "<code>@EntityGraph<\/code> on a repository method - how does it interact with pagination and with <code>JOIN FETCH<\/code>?", "answerTitle": "`@EntityGraph`", "answer": "<p><code>@EntityGraph(attributePaths = {&quot;customer&quot;, &quot;items&quot;})<\/code> on a repository method turns lazy associations into a single fetch join for that query, declaratively and without writing JPQL. It is the cleanest fix for N+1 on a specific access path.<\/p><p>Its interactions are the same as <code>JOIN FETCH<\/code> because it <em>is<\/em> a fetch join underneath: fetching a <strong>collection<\/strong> with <code>Pageable<\/code> causes Hibernate to fetch all rows and paginate <strong>in memory<\/strong> (the <code>HHH000104<\/code> warning), and fetching two collections produces a cartesian product. Fetching <code>@ManyToOne<\/code> associations with pagination is safe.<\/p><p>So my rule is: entity graphs for to-one associations freely; for collections, either avoid pagination, or use <code>@BatchSize<\/code>/<code>default_batch_fetch_size<\/code>, or split into two queries (page the IDs, then fetch with the graph).<\/p>", "source": "answers.md", "search": "@entitygraph on a repository method - how does it interact with pagination and with join fetch? @entitygraph(attributepaths = {\"customer\", \"items\"}) on a repository method turns lazy associations into a single fetch join for that query, declaratively and without writing jpql. it is the cleanest fix for n+1 on a specific access path. its interactions are the same as join fetch because it is a fetch join underneath: fetching a collection with pageable causes hibernate to fetch all rows and paginate in memory (the hhh000104 warning), and fetching two collections produces a cartesian product. fetching @manytoone associations with pagination is safe. so my rule is: entity graphs for to-one associations freely; for collections, either avoid pagination, or use @batchsize/default_batch_fetch_size, or split into two queries (page the ids, then fetch with the graph)."}, {"n": 137, "category": 7, "difficulty": "D", "html": "Configuring two data sources - two <code>EntityManagerFactory<\/code> beans, <code>@EnableJpaRepositories<\/code> and the transaction manager wiring.", "answerTitle": "Two data sources", "answer": "<p>Beyond the transaction manager selection issue (Q66), the wiring itself must be explicit:<\/p><pre><code class=\"lang-java\">@Configuration\n@EnableJpaRepositories(basePackages = &quot;com.acme.orders.repo&quot;,\n    entityManagerFactoryRef = &quot;ordersEmf&quot;, transactionManagerRef = &quot;ordersTx&quot;)\nclass OrdersDataConfig {\n    @Bean @Primary @ConfigurationProperties(&quot;spring.datasource.orders&quot;)\n    DataSource ordersDataSource() { return DataSourceBuilder.create().build(); }\n    @Bean LocalContainerEntityManagerFactoryBean ordersEmf(...) { ... packages(&quot;com.acme.orders.domain&quot;) ... }\n    @Bean PlatformTransactionManager ordersTx(@Qualifier(&quot;ordersEmf&quot;) EntityManagerFactory emf) { ... }\n}<\/code><\/pre><p>Non-obvious requirements: entity packages must not overlap, or entities are managed by both units; one <code>DataSource<\/code> must be <code>@Primary<\/code> or Boot&#x27;s other auto-configurations (Flyway, Actuator health, Batch) fail to resolve; each needs its own Flyway or Liquibase configuration; and Hikari metrics must be tagged per pool or you cannot tell which one is saturated.<\/p><p>I would also ask whether two data sources are warranted at all - it is frequently a service boundary drawn in the wrong place.<\/p>", "source": "answers.md", "search": "configuring two data sources - two entitymanagerfactory beans, @enablejparepositories and the transaction manager wiring. beyond the transaction manager selection issue (q66), the wiring itself must be explicit: java @configuration @enablejparepositories(basepackages = \"com.acme.orders.repo\", entitymanagerfactoryref = \"ordersemf\", transactionmanagerref = \"orderstx\") class ordersdataconfig { @bean @primary @configurationproperties(\"spring.datasource.orders\") datasource ordersdatasource() { return datasourcebuilder.create().build(); } @bean localcontainerentitymanagerfactorybean ordersemf(...) { ... packages(\"com.acme.orders.domain\") ... } @bean platformtransactionmanager orderstx(@qualifier(\"ordersemf\") entitymanagerfactory emf) { ... } } non-obvious requirements: entity packages must not overlap, or entities are managed by both units; one datasource must be @primary or boot's other auto-configurations (flyway, actuator health, batch) fail to resolve; each needs its own flyway or liquibase configuration; and hikari metrics must be tagged per pool or you cannot tell which one is saturated. i would also ask whether two data sources are warranted at all - it is frequently a service boundary drawn in the wrong place."}, {"n": 138, "category": 7, "difficulty": "D", "html": "Spring Data JDBC versus JPA - the aggregate model, no lazy loading, no dirty checking. When is it the better choice?", "answerTitle": "Spring Data JDBC versus JPA", "answer": "<p>Spring Data JDBC implements a strict <strong>DDD aggregate<\/strong> model: an aggregate root and everything reachable from it is loaded and saved as a unit. There is no lazy loading, no dirty checking, no first-level cache, no session, and no proxies. Saving a root deletes and re-inserts its child collections by default.<\/p><p>That simplicity is the point. You always know what SQL runs, there is no <code>LazyInitializationException<\/code>, no N+1 by accident, no detached-entity confusion, and the mental model fits in one page - which matters more on a team than the feature list.<\/p><p>I choose it when aggregates are small and well-bounded, when the team has been repeatedly burned by JPA&#x27;s implicit behavior, or when the domain model is genuinely aggregate-shaped. I choose JPA when there is a large existing model, complex object graphs, or a need for the second-level cache and lazy loading. What I would not do is mix both against the same tables.<\/p>", "source": "answers.md", "search": "spring data jdbc versus jpa - the aggregate model, no lazy loading, no dirty checking. when is it the better choice? spring data jdbc implements a strict ddd aggregate model: an aggregate root and everything reachable from it is loaded and saved as a unit. there is no lazy loading, no dirty checking, no first-level cache, no session, and no proxies. saving a root deletes and re-inserts its child collections by default. that simplicity is the point. you always know what sql runs, there is no lazyinitializationexception, no n+1 by accident, no detached-entity confusion, and the mental model fits in one page - which matters more on a team than the feature list. i choose it when aggregates are small and well-bounded, when the team has been repeatedly burned by jpa's implicit behavior, or when the domain model is genuinely aggregate-shaped. i choose jpa when there is a large existing model, complex object graphs, or a need for the second-level cache and lazy loading. what i would not do is mix both against the same tables."}, {"n": 139, "category": 7, "difficulty": "D", "html": "<code>JdbcClient<\/code> and <code>JdbcTemplate<\/code> - when do you drop down to them, and how do you batch efficiently?", "answerTitle": "`JdbcClient` and `JdbcTemplate`", "answer": "<p><code>JdbcClient<\/code> (Spring 6.1) is the modern fluent wrapper - named parameters, typed mapping, <code>Optional<\/code> results, all in one readable call:<\/p><pre><code class=\"lang-java\">List&lt;OrderRow&gt; rows = jdbcClient.sql(&quot;select id, total from orders where status = :s&quot;)\n    .param(&quot;s&quot;, status).query(OrderRow.class).list();<\/code><\/pre><p>I drop to it when JPA is the wrong tool rather than a broken one: bulk operations, reporting queries with database-specific SQL, <code>INSERT ... ON CONFLICT<\/code>, window functions, or a hot path where entity overhead is measurable.<\/p><p>For batching, <code>JdbcTemplate.batchUpdate<\/code> with a <code>BatchPreparedStatementSetter<\/code>, chunked (typically 500-1000 rows per batch) so a single transaction does not grow unbounded. With JPA, batching requires <code>hibernate.jdbc.batch_size<\/code>, ordered inserts and updates, and a periodic <code>flush()<\/code> plus <code>clear()<\/code> - all easy to get wrong, which is why bulk work often belongs in JDBC anyway.<\/p>", "source": "answers.md", "search": "jdbcclient and jdbctemplate - when do you drop down to them, and how do you batch efficiently? jdbcclient (spring 6.1) is the modern fluent wrapper - named parameters, typed mapping, optional results, all in one readable call: java list<orderrow rows = jdbcclient.sql(\"select id, total from orders where status = :s\") .param(\"s\", status).query(orderrow.class).list(); i drop to it when jpa is the wrong tool rather than a broken one: bulk operations, reporting queries with database-specific sql, insert ... on conflict, window functions, or a hot path where entity overhead is measurable. for batching, jdbctemplate.batchupdate with a batchpreparedstatementsetter, chunked (typically 500-1000 rows per batch) so a single transaction does not grow unbounded. with jpa, batching requires hibernate.jdbc.batch_size, ordered inserts and updates, and a periodic flush() plus clear() - all easy to get wrong, which is why bulk work often belongs in jdbc anyway."}, {"n": 140, "category": 7, "difficulty": "D", "html": "Spring Data Redis - template configuration, serializer choice, and using Redis as a cache versus as a store of record.", "answerTitle": "Spring Data Redis", "answer": "<p>Configure <code>RedisTemplate<\/code> deliberately: the default <code>JdkSerializationRedisSerializer<\/code> produces unreadable, class-coupled binary that breaks on any class change and is a deserialization risk. Use <code>StringRedisSerializer<\/code> for keys and a JSON serializer for values, and use <code>StringRedisTemplate<\/code> where values are strings.<\/p><p><strong>Cache versus store of record<\/strong> is the design question. As a <em>cache<\/em>, everything must tolerate loss: every key has a TTL, the data is reconstructible from the source, and a Redis outage degrades latency rather than correctness (Q55). As a <em>store<\/em>, you must think about persistence (RDB/AOF), failover behavior, whether cluster mode splits your keys, and what happens to data in a failover - Redis is not a database with the durability guarantees people assume.<\/p><p>The recurring mistake I look for is a session store or a distributed lock built on a Redis configured as a cache with eviction enabled, so keys silently disappear under memory pressure and correctness quietly breaks. Also worth naming: <code>KEYS<\/code> in production is a stop-the-world scan - use <code>SCAN<\/code>.<\/p>", "source": "answers.md", "search": "spring data redis - template configuration, serializer choice, and using redis as a cache versus as a store of record. configure redistemplate deliberately: the default jdkserializationredisserializer produces unreadable, class-coupled binary that breaks on any class change and is a deserialization risk. use stringredisserializer for keys and a json serializer for values, and use stringredistemplate where values are strings. cache versus store of record is the design question. as a cache , everything must tolerate loss: every key has a ttl, the data is reconstructible from the source, and a redis outage degrades latency rather than correctness (q55). as a store , you must think about persistence (rdb/aof), failover behavior, whether cluster mode splits your keys, and what happens to data in a failover - redis is not a database with the durability guarantees people assume. the recurring mistake i look for is a session store or a distributed lock built on a redis configured as a cache with eviction enabled, so keys silently disappear under memory pressure and correctness quietly breaks. also worth naming: keys in production is a stop-the-world scan - use scan."}, {"n": 141, "category": 7, "difficulty": "T", "html": "Why does <code>save()<\/code> on a new entity with an assigned (non-generated) ID issue a <code>SELECT<\/code> first, and how do you avoid it?", "answerTitle": "`save()` on an assigned ID", "answer": "<p><code>SimpleJpaRepository.save()<\/code> calls <code>entityInformation.isNew(entity)<\/code>. The default implementation checks whether the <strong>ID is null<\/strong>. With a generated ID, a new entity has a null ID, so <code>persist()<\/code> is called. With an <strong>assigned<\/strong> ID (a UUID or business key you set yourself), the ID is never null, so Spring Data assumes it is detached and calls <code>merge()<\/code> - and <code>merge()<\/code> must first <code>SELECT<\/code> to see whether the row exists.<\/p><p>So every insert costs an extra round trip, and at scale that doubles your write latency.<\/p><p>Fixes, in order of preference:<\/p><ol><li>Implement <code>Persistable&lt;ID&gt;<\/code> and control <code>isNew()<\/code> yourself, typically with a transient <code>@Transient boolean isNew = true<\/code> reset in <code>@PostPersist<\/code>/<code>@PostLoad<\/code>.<\/li><li>Add <code>@Version<\/code>; Spring Data&#x27;s <code>JpaMetamodelEntityInformation<\/code> then uses a null version as the new-entity signal.<\/li><li>Add <code>@CreatedDate<\/code> with auditing, which is used similarly.<\/li><li>Call <code>entityManager.persist()<\/code> directly in a custom fragment when you know it is new.<\/li><\/ol><p>The same reasoning explains the equivalent behavior in Spring Data JDBC, where <code>isNew<\/code> is also ID-based.<\/p>", "source": "answers.md", "search": "why does save() on a new entity with an assigned (non-generated) id issue a select first, and how do you avoid it? simplejparepository.save() calls entityinformation.isnew(entity). the default implementation checks whether the id is null . with a generated id, a new entity has a null id, so persist() is called. with an assigned id (a uuid or business key you set yourself), the id is never null, so spring data assumes it is detached and calls merge() - and merge() must first select to see whether the row exists. so every insert costs an extra round trip, and at scale that doubles your write latency. fixes, in order of preference: 1. implement persistable<id and control isnew() yourself, typically with a transient @transient boolean isnew = true reset in @postpersist/@postload. 2. add @version; spring data's jpametamodelentityinformation then uses a null version as the new-entity signal. 3. add @createddate with auditing, which is used similarly. 4. call entitymanager.persist() directly in a custom fragment when you know it is new. the same reasoning explains the equivalent behavior in spring data jdbc, where isnew is also id-based."}, {"n": 142, "category": 7, "difficulty": "A", "html": "How do you stop a repository layer from growing into 200 bespoke query methods?", "answerTitle": "Preventing repository sprawl", "answer": "<p>Two hundred bespoke finders is a symptom, not the disease. The causes are usually that every screen gets its own query method,
