bind a raw secret into a properties object."}, {"n": 203, "category": 10, "difficulty": "D", "html": "Boot&#x27;s <code>DataSource<\/code> and HikariCP auto-configuration - which defaults must you override in production?", "answerTitle": "`DataSource` and Hikari defaults", "answer": "<p>Boot&#x27;s defaults are development defaults. In production I always set:<\/p><pre><code class=\"lang-yaml\">spring.datasource.hikari:\n  maximum-pool-size: 15            # derived, not guessed - see 01-java Q161\n  minimum-idle: 15                 # equal to max: avoid churn under spiky load\n  connection-timeout: 3000         # fail fast rather than queue forever\n  max-lifetime: 570000             # shorter than DB/LB idle timeout (e.g. 600s)\n  idle-timeout: 300000\n  leak-detection-threshold: 20000  # non-production, or generous in production\n  validation-timeout: 2000<\/code><\/pre><p>The reasoning that matters: <code>maximum-pool-size<\/code> is a <strong>concurrency limit<\/strong>, not a throughput dial - bigger is slower past saturation, and it must be multiplied by instance count against the database&#x27;s <code>max_connections<\/code>. <code>max-lifetime<\/code> must be shorter than any idle timeout on the database, proxy or NAT gateway, or you get intermittent &quot;connection reset&quot; errors that are nearly impossible to reproduce. <code>connection-timeout<\/code> decides whether a database slowdown becomes a fast failure or a pile-up.<\/p><p>I also always enable Hikari metrics and alert on <code>hikaricp_connections_pending<\/code>, which is the earliest reliable warning of database trouble.<\/p>", "source": "answers.md", "search": "boot's datasource and hikaricp auto-configuration - which defaults must you override in production? boot's defaults are development defaults. in production i always set: yaml spring.datasource.hikari: maximum-pool-size: 15 derived, not guessed - see 01-java q161 minimum-idle: 15 equal to max: avoid churn under spiky load connection-timeout: 3000 fail fast rather than queue forever max-lifetime: 570000 shorter than db/lb idle timeout (e.g. 600s) idle-timeout: 300000 leak-detection-threshold: 20000 non-production, or generous in production validation-timeout: 2000 the reasoning that matters: maximum-pool-size is a concurrency limit , not a throughput dial - bigger is slower past saturation, and it must be multiplied by instance count against the database's max_connections. max-lifetime must be shorter than any idle timeout on the database, proxy or nat gateway, or you get intermittent \"connection reset\" errors that are nearly impossible to reproduce. connection-timeout decides whether a database slowdown becomes a fast failure or a pile-up. i also always enable hikari metrics and alert on hikaricp_connections_pending, which is the earliest reliable warning of database trouble."}, {"n": 204, "category": 10, "difficulty": "A", "html": "How do you build a platform starter that 40 teams depend on without becoming their bottleneck?", "answerTitle": "A platform starter without becoming a bottleneck", "answer": "<p>The failure mode is a platform team that owns a starter every service must use, cannot keep up with requests, and becomes the thing everyone routes around. Avoiding it is mostly about defaults and governance rather than code.<\/p><p>Principles I apply:<\/p><ul><li><strong>Defaults, not mandates.<\/strong> Every bean is <code>@ConditionalOnMissingBean<\/code> and every feature is <code>@ConditionalOnProperty<\/code> with a sensible default, so a team can override any decision locally without a pull request to my repository. The starter is opinionated but never a straitjacket.<\/li><li><strong>Thin and composable.<\/strong> Several small starters (observability, security, resilience, messaging) rather than one monolith, so a team adopts what it needs.<\/li><li><strong>No <code>@ComponentScan<\/code>, no surprise beans<\/strong>, and no transitive dependency choices that constrain consumers - the fastest way to be resented is to force a library version.<\/li><li><strong>Inner source.<\/strong> Consumers can raise pull requests, with clear contribution docs and a review SLA. My team owns quality, not authorship.<\/li><li><strong>Versioning discipline<\/strong> - semantic versioning, a documented support window for the previous major, deprecation via configuration metadata (Q37) so warnings appear in the IDE, and migration notes with each release.<\/li><li><strong>Automated adoption<\/strong> - a bot raising the upgrade pull request against every consuming repository, with the pipeline proving it, so upgrading is a review rather than a project.<\/li><li><strong>Measure the right thing<\/strong> - not adoption count, but whether the starter reduces incidents and time-to-first-deploy. If teams are working around it, that is my defect to fix.<\/li><\/ul><blockquote><p><em>Hook: a platform library you owned - the adoption approach, and how you handled a breaking change.<\/em><\/p><\/blockquote>", "source": "answers.md", "search": "how do you build a platform starter that 40 teams depend on without becoming their bottleneck? the failure mode is a platform team that owns a starter every service must use, cannot keep up with requests, and becomes the thing everyone routes around. avoiding it is mostly about defaults and governance rather than code. principles i apply: - defaults, not mandates. every bean is @conditionalonmissingbean and every feature is @conditionalonproperty with a sensible default, so a team can override any decision locally without a pull request to my repository. the starter is opinionated but never a straitjacket. - thin and composable. several small starters (observability, security, resilience, messaging) rather than one monolith, so a team adopts what it needs. - no @componentscan, no surprise beans , and no transitive dependency choices that constrain consumers - the fastest way to be resented is to force a library version. - inner source. consumers can raise pull requests, with clear contribution docs and a review sla. my team owns quality, not authorship. - versioning discipline - semantic versioning, a documented support window for the previous major, deprecation via configuration metadata (q37) so warnings appear in the ide, and migration notes with each release. - automated adoption - a bot raising the upgrade pull request against every consuming repository, with the pipeline proving it, so upgrading is a review rather than a project. - measure the right thing - not adoption count, but whether the starter reduces incidents and time-to-first-deploy. if teams are working around it, that is my defect to fix. hook: a platform library you owned - the adoption approach, and how you handled a breaking change."}, {"n": 205, "category": 11, "difficulty": "D", "html": "Spring Cloud Config Server - refresh, encryption, and why many teams moved to ConfigMaps or Parameter Store instead.", "answerTitle": "Config Server", "answer": "<p>Config Server serves configuration from a Git (or Vault) backend, with per-application and per-profile resolution, encryption support (<code>{cipher}<\/code>), and refresh via <code>/actuator/refresh<\/code> or Spring Cloud Bus.<\/p><p>Why many teams moved away on Kubernetes: it adds a <strong>hard startup dependency<\/strong> - if Config Server is down, nothing starts, so it must be as available as everything that depends on it; it duplicates what the platform already provides through ConfigMaps, Secrets, Parameter Store and Secrets Manager; and it introduces a second, parallel place where configuration lives, which is exactly the drift problem it was meant to solve. Runtime refresh also proves less useful in practice than it sounds (Q206), since immutable deployments are the safer model anyway.<\/p><p>I would still use it when running outside Kubernetes, when configuration genuinely must be versioned in Git with review and audit, or in a large estate that needs one configuration model across heterogeneous platforms. Otherwise <code>spring.config.import<\/code> against the platform&#x27;s own store is simpler and has fewer failure modes.<\/p>", "source": "answers.md", "search": "spring cloud config server - refresh, encryption, and why many teams moved to configmaps or parameter store instead. config server serves configuration from a git (or vault) backend, with per-application and per-profile resolution, encryption support ({cipher}), and refresh via /actuator/refresh or spring cloud bus. why many teams moved away on kubernetes: it adds a hard startup dependency - if config server is down, nothing starts, so it must be as available as everything that depends on it; it duplicates what the platform already provides through configmaps, secrets, parameter store and secrets manager; and it introduces a second, parallel place where configuration lives, which is exactly the drift problem it was meant to solve. runtime refresh also proves less useful in practice than it sounds (q206), since immutable deployments are the safer model anyway. i would still use it when running outside kubernetes, when configuration genuinely must be versioned in git with review and audit, or in a large estate that needs one configuration model across heterogeneous platforms. otherwise spring.config.import against the platform's own store is simpler and has fewer failure modes."}, {"n": 206, "category": 11, "difficulty": "D", "html": "<code>@RefreshScope<\/code> - the proxy mechanism, and which beans it cannot refresh.", "answerTitle": "`@RefreshScope`", "answer": "<p>Covered mechanically in Q38. In the Spring Cloud context, the additional points are that <code>/actuator/refresh<\/code> rebinds the <code>Environment<\/code> and publishes <code>RefreshScopeRefreshedEvent<\/code>, and Spring Cloud Bus can broadcast that across the estate over a message broker.<\/p><p>What it cannot refresh: <code>@Value<\/code> in singletons, anything constructed at startup from a property (connection pools, clients with fixed base URLs, Kafka consumers), <code>@ConfigurationProperties<\/code>-derived objects created eagerly, and log levels (which have their own Actuator endpoint).<\/p><p>My practical position: bus-wide refresh across dozens of services is a distributed state change with no transactionality - some services refresh, some fail, and you cannot tell which configuration is live where. For anything that matters I prefer a rolling restart, which is observable, versioned and rollback-able. Refresh is fine for a threshold or a feature toggle, and a feature flag service does that job better.<\/p>", "source": "answers.md", "search": "@refreshscope - the proxy mechanism, and which beans it cannot refresh. covered mechanically in q38. in the spring cloud context, the additional points are that /actuator/refresh rebinds the environment and publishes refreshscoperefreshedevent, and spring cloud bus can broadcast that across the estate over a message broker. what it cannot refresh: @value in singletons, anything constructed at startup from a property (connection pools, clients with fixed base urls, kafka consumers), @configurationproperties-derived objects created eagerly, and log levels (which have their own actuator endpoint). my practical position: bus-wide refresh across dozens of services is a distributed state change with no transactionality - some services refresh, some fail, and you cannot tell which configuration is live where. for anything that matters i prefer a rolling restart, which is observable, versioned and rollback-able. refresh is fine for a threshold or a feature toggle, and a feature flag service does that job better."}, {"n": 207, "category": 11, "difficulty": "D", "html": "Spring Cloud Gateway - route predicates, filters and global filters. Why is it built on WebFlux?", "answerTitle": "Spring Cloud Gateway", "answer": "<p>Routes are matched by <strong>predicates<\/strong> (path, host, method, header, query, weight, time) and modified by <strong>filters<\/strong> (rewrite path, add or remove headers, circuit breaker, retry, rate limiter, token relay). Global filters apply to every route.<\/p><p>It is built on <strong>WebFlux and Netty<\/strong> because a gateway is the archetypal case for an event loop: thousands of concurrent connections doing almost no CPU work, just forwarding bytes. A thread-per-connection gateway would need an enormous thread count for the same concurrency.<\/p><p>Worth knowing on a modern baseline: <code>spring-cloud-gateway-server-mvc<\/code> provides a servlet-based gateway that works with virtual threads, for teams that want the routing model without the reactive stack. That is a reasonable choice now, though the reactive version remains the more mature and better-performing option at high connection counts.<\/p>", "source": "answers.md", "search": "spring cloud gateway - route predicates, filters and global filters. why is it built on webflux? routes are matched by predicates (path, host, method, header, query, weight, time) and modified by filters (rewrite path, add or remove headers, circuit breaker, retry, rate limiter, token relay). global filters apply to every route. it is built on webflux and netty because a gateway is the archetypal case for an event loop: thousands of concurrent connections doing almost no cpu work, just forwarding bytes. a thread-per-connection gateway would need an enormous thread count for the same concurrency. worth knowing on a modern baseline: spring-cloud-gateway-server-mvc provides a servlet-based gateway that works with virtual threads, for teams that want the routing model without the reactive stack. that is a reasonable choice now, though the reactive version remains the more mature and better-performing option at high connection counts."}, {"n": 208, "category": 11, "difficulty": "T", "html": "Why must you never make a blocking call inside a Gateway filter, and what is the symptom when someone does?", "answerTitle": "Blocking in a Gateway filter", "answer": "<p>The gateway has a handful of event loop threads for the entire process. A blocking call in a filter - a JDBC lookup for an API key, a synchronous HTTP call to an authorization service, a blocking cache client - occupies one of them for the whole duration.<\/p><p>The symptom is distinctive and worth naming: <strong>latency rises for every route, not just the one with the filter<\/strong>, throughput collapses non-linearly under load, and the gateway appears to hang while CPU sits near idle. Because it affects unrelated traffic, it is usually misdiagnosed as a network or downstream problem, and the gateway is the last place anyone looks.<\/p><p>Correct approaches: return a <code>Mono<\/code> and use <code>WebClient<\/code> for any lookup; use a reactive Redis client for shared state; cache locally with Caffeine so the common path has no I/O; and if a blocking library is unavoidable, <code>publishOn(Schedulers.boundedElastic())<\/code> to move it off the loop - explicitly, as a bridge. Enforce it with BlockHound in the gateway&#x27;s test suite (Q108), because this is exactly the codebase where one careless filter is catastrophic.<\/p>", "source": "answers.md", "search": "why must you never make a blocking call inside a gateway filter, and what is the symptom when someone does? the gateway has a handful of event loop threads for the entire process. a blocking call in a filter - a jdbc lookup for an api key, a synchronous http call to an authorization service, a blocking cache client - occupies one of them for the whole duration. the symptom is distinctive and worth naming: latency rises for every route, not just the one with the filter , throughput collapses non-linearly under load, and the gateway appears to hang while cpu sits near idle. because it affects unrelated traffic, it is usually misdiagnosed as a network or downstream problem, and the gateway is the last place anyone looks. correct approaches: return a mono and use webclient for any lookup; use a reactive redis client for shared state; cache locally with caffeine so the common path has no i/o; and if a blocking library is unavoidable, publishon(schedulers.boundedelastic()) to move it off the loop - explicitly, as a bridge. enforce it with blockhound in the gateway's test suite (q108), because this is exactly the codebase where one careless filter is catastrophic."}, {"n": 209, "category": 11, "difficulty": "D", "html": "Gateway rate limiting with Redis - the token bucket parameters and writing a <code>KeyResolver<\/code>.", "answerTitle": "Gateway rate limiting", "answer": "<pre><code class=\"lang-yaml\">filters:\n  - name: RequestRateLimiter\n    args:\n      redis-rate-limiter.replenishRate: 100      # sustained requests/second\n      redis-rate-limiter.burstCapacity: 200      # bucket size - the burst allowance\n      redis-rate-limiter.requestedTokens: 1\n      key-resolver: &quot;#{@principalKeyResolver}&quot;<\/code><\/pre><p>It is a token bucket implemented as an atomic Redis Lua script, so counting is correct across all gateway instances. <code>replenishRate<\/code> is the sustained rate, <code>burstCapacity<\/code> the bucket depth - setting them equal disallows bursts entirely, which is usually too strict for real clients.<\/p><p>The <code>KeyResolver<\/code> decides <em>what<\/em> is limited, and this is the important design choice:<\/p><pre><code class=\"lang-java\">@Bean KeyResolver principalKeyResolver() {\n    return exchange -&gt; exchange.getPrincipal().map(Principal::getName)\n        .defaultIfEmpty(&quot;anonymous&quot;);\n}<\/code><\/pre><p>Limiting by IP is a poor default because NAT and mobile carriers put thousands of users behind one address - you either block legitimate users or set the limit uselessly high. Limit by authenticated identity or API key where possible, and fall back to IP only for unauthenticated endpoints.<\/p><p>Also decide the Redis failure mode explicitly: fail-open preserves availability, fail-closed preserves protection, and the gateway defaults to denying when it cannot reach Redis.<\/p>", "source": "answers.md", "search": "gateway rate limiting with redis - the token bucket parameters and writing a keyresolver. yaml filters: - name: requestratelimiter args: redis-rate-limiter.replenishrate: 100 sustained requests/second redis-rate-limiter.burstcapacity: 200 bucket size - the burst allowance redis-rate-limiter.requestedtokens: 1 key-resolver: \" {@principalkeyresolver}\" it is a token bucket implemented as an atomic redis lua script, so counting is correct across all gateway instances. replenishrate is the sustained rate, burstcapacity the bucket depth - setting them equal disallows bursts entirely, which is usually too strict for real clients. the keyresolver decides what is limited, and this is the important design choice: java @bean keyresolver principalkeyresolver() { return exchange - exchange.getprincipal().map(principal::getname) .defaultifempty(\"anonymous\"); } limiting by ip is a poor default because nat and mobile carriers put thousands of users behind one address - you either block legitimate users or set the limit uselessly high. limit by authenticated identity or api key where possible, and fall back to ip only for unauthenticated endpoints. also decide the redis failure mode explicitly: fail-open preserves availability, fail-closed preserves protection, and the gateway defaults to denying when it cannot reach redis."}, {"n": 210, "category": 11, "difficulty": "C", "html": "Resilience4j with Spring Boot - <code>@CircuitBreaker<\/code>, <code>@Retry<\/code>, <code>@Bulkhead<\/code>, and the aspect ordering between them.", "answerTitle": "Resilience4j aspect ordering", "answer": "<p>Spring Boot&#x27;s Resilience4j integration applies aspects in a defined order, outermost first: <strong>Retry → CircuitBreaker → RateLimiter → TimeLimiter → Bulkhead → your method<\/strong>. It is configurable per aspect (<code>resilience4j.retry.retryAspectOrder<\/code> and equivalents).<\/p><p>That default order is correct, and being able to justify it matters more than reciting it:<\/p><ul><li><strong>Retry outermost<\/strong> so each attempt is observed by the circuit breaker and each gets a fresh timeout. If retry were innermost, three retries would happen inside one timeout and the breaker would see one long failure instead of three.<\/li><li><strong>Circuit breaker above the rate limiter<\/strong> so an open circuit fails immediately without consuming a permit.<\/li><li><strong>TimeLimiter inside<\/strong> so each individual attempt is bounded.<\/li><li><strong>Bulkhead closest to the call<\/strong> so it limits actual concurrent invocations.<\/li><\/ul><p>The failure I look for is retry configured <em>inside<\/em> a transaction (Q49) or a retry with no jitter, both of which turn a downstream blip into a synchronized retry storm. And always define the fallback: <code>@CircuitBreaker(name = &quot;inventory&quot;, fallbackMethod = &quot;cachedInventory&quot;)<\/code> - a breaker without a fallback just converts a slow failure into a fast one, which helps you but not the user.<\/p>", "source": "answers.md", "search": "resilience4j with spring boot - @circuitbreaker, @retry, @bulkhead, and the aspect ordering between them. spring boot's resilience4j integration applies aspects in a defined order, outermost first: retry → circuitbreaker → ratelimiter → timelimiter → bulkhead → your method . it is configurable per aspect (resilience4j.retry.retryaspectorder and equivalents). that default order is correct, and being able to justify it matters more than reciting it: - retry outermost so each attempt is observed by the circuit breaker and each gets a fresh timeout. if retry were innermost, three retries would happen inside one timeout and the breaker would see one long failure instead of three. - circuit breaker above the rate limiter so an open circuit fails immediately without consuming a permit. - timelimiter inside so each individual attempt is bounded. - bulkhead closest to the call so it limits actual concurrent invocations. the failure i look for is retry configured inside a transaction (q49) or a retry with no jitter, both of which turn a downstream blip into a synchronized retry storm. and always define the fallback: @circuitbreaker(name = \"inventory\", fallbackmethod = \"cachedinventory\") - a breaker without a fallback just converts a slow failure into a fast one, which helps you but not the user."}, {"n": 211, "category": 11, "difficulty": "D", "html": "OpenFeign - declarative clients, error decoding, and integration with Resilience4j and tracing.", "answerTitle": "OpenFeign", "answer": "<pre><code class=\"lang-java\">@FeignClient(name = &quot;inventory&quot;, configuration = InventoryConfig.class)\ninterface InventoryClient {\n    @GetMapping(&quot;/items/{sku}&quot;) Item byId(@PathVariable String sku);\n}<\/code><\/pre><p>It generates the HTTP client from the interface, integrating with Spring Cloud LoadBalancer for service discovery, Resilience4j for circuit breaking, and Micrometer for tracing and metrics.<\/p><p>Things to configure that are not defaults: an <code>ErrorDecoder<\/code> mapping status codes to domain exceptions (the default throws a generic <code>FeignException<\/code> that loses the response body); explicit connect and read timeouts; a <code>RequestInterceptor<\/code> for token propagation; and a real HTTP client implementation (Apache HttpClient 5 or OkHttp) with a bounded connection pool, since the default <code>HttpURLConnection<\/code> has no pooling.<\/p><p>Worth stating: Spring&#x27;s own <code>@HttpExchange<\/code> interfaces (Q97) now cover most of what Feign provided, without an extra dependency, and are the better choice for new code. Feign remains sensible in an estate already standardized on it.<\/p>", "source": "answers.md", "search": "openfeign - declarative clients, error decoding, and integration with resilience4j and tracing. java @feignclient(name = \"inventory\", configuration = inventoryconfig.class) interface inventoryclient { @getmapping(\"/items/{sku}\") item byid(@pathvariable string sku); } it generates the http client from the interface, integrating with spring cloud loadbalancer for service discovery, resilience4j for circuit breaking, and micrometer for tracing and metrics. things to configure that are not defaults: an errordecoder mapping status codes to domain exceptions (the default throws a generic feignexception that loses the response body); explicit connect and read timeouts; a requestinterceptor for token propagation; and a real http client implementation (apache httpclient 5 or okhttp) with a bounded connection pool, since the default httpurlconnection has no pooling. worth stating: spring's own @httpexchange interfaces (q97) now cover most of what feign provided, without an extra dependency, and are the better choice for new code. feign remains sensible in an estate already standardized on it."}, {"n": 212, "category": 11, "difficulty": "T", "html": "A Feign call made from inside a <code>@Transactional<\/code> method - what is the failure mode under load?", "answerTitle": "Feign inside a transaction", "answer": "<p>This is Q76 with a specific mechanism. The database connection is held for the whole HTTP call, so response time of the remote service directly consumes connection pool capacity: a 200ms call with a pool of 15 caps you at 75 requests per second on that path, and when the remote service degrades to 5 seconds you hold every connection and the <em>entire application<\/em> fails - including endpoints that never call inventory.<\/p><p>Feign makes it worse than a raw client in two ways: the call site looks like a local method invocation, so it does not read like I/O; and its default timeouts are generous (or, with some configurations, effectively unbounded), so a hung downstream holds the connection indefinitely.<\/p><p>The fix is structural: move the call outside the transaction, or persist an intent and perform the call asynchronously. Then the defensive layers - explicit Feign timeouts shorter than any transaction timeout, a circuit breaker, <code>LazyConnectionDataSourceProxy<\/code> as a net, and the ArchUnit rule from Q80.<\/p>", "source": "answers.md", "search": "a feign call made from inside a @transactional method - what is the failure mode under load? this is q76 with a specific mechanism. the database connection is held for the whole http call, so response time of the remote service directly consumes connection pool capacity: a 200ms call with a pool of 15 caps you at 75 requests per second on that path, and when the remote service degrades to 5 seconds you hold every connection and the entire application fails - including endpoints that never call inventory. feign makes it worse than a raw client in two ways: the call site looks like a local method invocation, so it does not read like i/o; and its default timeouts are generous (or, with some configurations, effectively unbounded), so a hung downstream holds the connection indefinitely. the fix is structural: move the call outside the transaction, or persist an intent and perform the call asynchronously. then the defensive layers - explicit feign timeouts shorter than any transaction timeout, a circuit breaker, lazyconnectiondatasourceproxy as a net, and the archunit rule from q80."}, {"n": 213, "category": 11, "difficulty": "D", "html": "Spring Cloud LoadBalancer after Ribbon - client-side balancing, instance health and caching.", "answerTitle": "Spring Cloud LoadBalancer", "answer": "<p>It replaced Netflix Ribbon, which is end-of-life. A <code>ServiceInstanceListSupplier<\/code> provides instances from the discovery client, and a <code>ReactorLoadBalancer<\/code> selects one - round-robin by default, with random available.<\/p><p>The useful capabilities are in the supplier decorators, and they are opt-in: health-check filtering (<code>health-check<\/code> supplier, which pings instances rather than trusting the registry), zone preference (<code>zone-preference<\/code>, which keeps traffic in-AZ and cuts both latency and cross-AZ data transfer cost), instance caching (on by default, so registry lookups are not per-request), and retry on a different instance.<\/p><p>On Kubernetes I would generally not use it: the Service abstraction already load balances, and adding client-side balancing means two mechanisms to reason about. It earns its place outside Kubernetes, or when you specifically need zone affinity or client-side health checks that the platform does not provide.<\/p>", "source": "answers.md", "search": "spring cloud loadbalancer after ribbon - client-side balancing, instance health and caching. it replaced netflix ribbon, which is end-of-life. a serviceinstancelistsupplier provides instances from the discovery client, and a reactorloadbalancer selects one - round-robin by default, with random available. the useful capabilities are in the supplier decorators, and they are opt-in: health-check filtering (health-check supplier, which pings instances rather than trusting the registry), zone preference (zone-preference, which keeps traffic in-az and cuts both latency and cross-az data transfer cost), instance caching (on by default, so registry lookups are not per-request), and retry on a different instance. on kubernetes i would generally not use it: the service abstraction already load balances, and adding client-side balancing means two mechanisms to reason about. it earns its place outside kubernetes, or when you specifically need zone affinity or client-side health checks that the platform does not provide."}, {"n": 214, "category": 11, "difficulty": "D", "html": "Spring Cloud Stream - binders, the functional programming model, error channels and DLQ configuration.", "answerTitle": "Spring Cloud Stream", "answer": "<p>It abstracts messaging behind the functional model - a <code>Supplier<\/code>, <code>Function<\/code> or <code>Consumer<\/code> bean is bound to a destination by a <strong>binder<\/strong> (Kafka, RabbitMQ, Kinesis, SQS):<\/p><pre><code class=\"lang-java\">@Bean Consumer&lt;OrderEvent&gt; processOrder() { return event -&gt; service.handle(event); }<\/code><\/pre><pre><code class=\"lang-yaml\">spring.cloud.stream.bindings.processOrder-in-0:\n  destination: orders\n  group: order-processor\n  consumer.max-attempts: 3<\/code><\/pre><p>Error handling: retries happen in-process by default, then the message goes to a DLQ if enabled (<code>spring.cloud.stream.kafka.bindings.*.consumer.enableDlq<\/code>). You can also subscribe to the per-binding error channel for custom handling.<\/p><p>The trade-off is honest to state: the abstraction buys you binder portability and less boilerplate, but it hides broker semantics that you eventually need - partition assignment, offset management, exactly-once configuration, consumer lag. Teams that adopt Stream to avoid learning Kafka find themselves debugging Kafka through an abstraction layer. I use it where messaging is simple and uniform, and the native <code>spring-kafka<\/code> API where the broker&#x27;s semantics matter.<\/p>", "source": "answers.md", "search": "spring cloud stream - binders, the functional programming model, error channels and dlq configuration. it abstracts messaging behind the functional model - a supplier, function or consumer bean is bound to a destination by a binder (kafka, rabbitmq, kinesis, sqs): java @bean consumer<orderevent processorder() { return event - service.handle(event); } yaml spring.cloud.stream.bindings.processorder-in-0: destination: orders group: order-processor consumer.max-attempts: 3 error handling: retries happen in-process by default, then the message goes to a dlq if enabled (spring.cloud.stream.kafka.bindings. .consumer.enabledlq). you can also subscribe to the per-binding error channel for custom handling. the trade-off is honest to state: the abstraction buys you binder portability and less boilerplate, but it hides broker semantics that you eventually need - partition assignment, offset management, exactly-once configuration, consumer lag. teams that adopt stream to avoid learning kafka find themselves debugging kafka through an abstraction layer. i use it where messaging is simple and uniform, and the native spring-kafka api where the broker's semantics matter."}, {"n": 215, "category": 11, "difficulty": "D", "html": "Spring for Apache Kafka - <code>@KafkaListener<\/code>, container concurrency, acknowledgment modes, <code>DefaultErrorHandler<\/code> and retry topics.", "answerTitle": "Spring for Apache Kafka", "answer": "<pre><code class=\"lang-java\">@KafkaListener(topics = &quot;orders&quot;, groupId = &quot;order-processor&quot;, concurrency = &quot;3&quot;)\npublic void handle(ConsumerRecord&lt;String, OrderEvent&gt; record, Acknowledgment ack) { ... }<\/code><\/pre><ul><li><strong><code>concurrency<\/code><\/strong> creates that many consumer threads in the container, capped usefully by the partition count (<code>01-java<\/code> Q175) - more consumers than partitions leaves some idle.<\/li><li><strong>Acknowledgment modes<\/strong>: <code>BATCH<\/code> (default), <code>RECORD<\/code>, or <code>MANUAL<\/code>/<code>MANUAL_IMMEDIATE<\/code> with an injected <code>Acknowledgment<\/code>. I disable auto-commit and acknowledge after successful processing, accepting at-least-once.<\/li><li><strong><code>DefaultErrorHandler<\/code><\/strong> with a <code>FixedBackOff<\/code> or <code>ExponentialBackOff<\/code> retries in-process, then invokes a recoverer - typically <code>DeadLetterPublishingRecoverer<\/code> sending to <code>&lt;topic&gt;.DLT<\/code>. Classify exceptions with <code>addNotRetryableExceptions<\/code> so a deserialization or validation failure goes straight to the DLT instead of retrying 10 times.<\/li><li><strong>Non-blocking retries<\/strong> (<code>@RetryableTopic<\/code>) move retries to separate delay topics, so a slow-to-succeed message does not block its partition - important, because in-process retry with backoff stalls every subsequent message in that partition.<\/li><li><strong><code>ErrorHandlingDeserializer<\/code><\/strong> wraps your deserializer so a poison message becomes a handled failure rather than an infinite consumer crash loop, which is otherwise a genuinely painful outage.<\/li><\/ul>", "source": "answers.md", "search": "spring for apache kafka - @kafkalistener, container concurrency, acknowledgment modes, defaulterrorhandler and retry topics. java @kafkalistener(topics = \"orders\", groupid = \"order-processor\", concurrency = \"3\") public void handle(consumerrecord<string, orderevent record, acknowledgment ack) { ... } - concurrency creates that many consumer threads in the container, capped usefully by the partition count (01-java q175) - more consumers than partitions leaves some idle. - acknowledgment modes : batch (default), record, or manual/manual_immediate with an injected acknowledgment. i disable auto-commit and acknowledge after successful processing, accepting at-least-once. - defaulterrorhandler with a fixedbackoff or exponentialbackoff retries in-process, then invokes a recoverer - typically deadletterpublishingrecoverer sending to <topic .dlt. classify exceptions with addnotretryableexceptions so a deserialization or validation failure goes straight to the dlt instead of retrying 10 times. - non-blocking retries (@retryabletopic) move retries to separate delay topics, so a slow-to-succeed message does not block its partition - important, because in-process retry with backoff stalls every subsequent message in that partition. - errorhandlingdeserializer wraps your deserializer so a poison message becomes a handled failure rather than an infinite consumer crash loop, which is otherwise a genuinely painful outage."}, {"n": 216, "category": 11, "difficulty": "T", "html": "A <code>@KafkaListener<\/code> method annotated <code>@Transactional<\/code> - which transaction is that, and how do you actually get atomicity with the database?", "answerTitle": "`@KafkaListener` with `@Transactional`", "answer": "<p>The annotation opens a <strong>database<\/strong> transaction. It does not make the Kafka consumption transactional, and it certainly does not make the two atomic.<\/p><p>What actually happens: the message is consumed, the database transaction commits, and then the offset is committed separately. If the process dies between them, the message is redelivered and the database work happens twice. If you commit the offset first and the database fails, the message is lost.<\/p><p>Options:<\/p><ul><li><strong>Kafka transactions<\/strong> (<code>KafkaTransactionManager<\/code>, <code>spring.kafka.producer.transaction-id-prefix<\/code>) give exactly-once <em>within Kafka<\/em> for consume-process-produce, atomically committing produced records and consumer offsets. They do <strong>not<\/strong> extend to your database.<\/li><li><strong><code>ChainedKafkaTransactionManager<\/code><\/strong> was the old attempt to span both and is deprecated for the same reason as Q67 - it is best-effort, not atomic.<\/li><li><strong>The correct answer<\/strong>: accept at-least-once delivery and make the handler <strong>idempotent<\/strong> - an inbox table recording processed message IDs in the <em>same<\/em> database transaction as the effect, so a redelivery is a no-op. Order the operations so the database commit happens before the offset commit, making duplicates the failure mode rather than loss.<\/li><\/ul><p>Stating &quot;exactly-once across Kafka and a database is not achievable; I design for idempotency instead&quot; is the answer being looked for.<\/p>", "source": "answers.md", "search": "a @kafkalistener method annotated @transactional - which transaction is that, and how do you actually get atomicity with the database? the annotation opens a database transaction. it does not make the kafka consumption transactional, and it certainly does not make the two atomic. what actually happens: the message is consumed, the database transaction commits, and then the offset is committed separately. if the process dies between them, the message is redelivered and the database work happens twice. if you commit the offset first and the database fails, the message is lost. options: - kafka transactions (kafkatransactionmanager, spring.kafka.producer.transaction-id-prefix) give exactly-once within kafka for consume-process-produce, atomically committing produced records and consumer offsets. they do not extend to your database. - chainedkafkatransactionmanager was the old attempt to span both and is deprecated for the same reason as q67 - it is best-effort, not atomic. - the correct answer : accept at-least-once delivery and make the handler idempotent - an inbox table recording processed message ids in the same database transaction as the effect, so a redelivery is a no-op. order the operations so the database commit happens before the offset commit, making duplicates the failure mode rather than loss. stating \"exactly-once across kafka and a database is not achievable; i design for idempotency instead\" is the answer being looked for."}, {"n": 217, "category": 11, "difficulty": "D", "html": "<code>@Scheduled<\/code> runs on every instance. Compare ShedLock, a database lock and leader election.", "answerTitle": "Scheduling in a cluster", "answer": "<p><code>@Scheduled<\/code> runs on <strong>every instance<\/strong>, so a nightly job on six pods runs six times. Options:<\/p><ul><li><strong>ShedLock<\/strong> - a lock row in a database or Redis, acquired for the duration with a minimum and maximum hold time. Minimal infrastructure, works with the existing <code>@Scheduled<\/code> annotation (<code>@SchedulerLock(name = &quot;...&quot;, lockAtMostFor = &quot;10m&quot;)<\/code>), and is my default. <code>lockAtMostFor<\/code> must exceed the worst-case runtime, or a second instance starts while the first is still running.<\/li><li><strong>A database advisory lock<\/strong> - the same idea implemented directly; fine, but you end up writing ShedLock.<\/li><li><strong>Leader election<\/strong> (Spring Integration&#x27;s <code>LeaderInitiator<\/code>, or Kubernetes leases) - one instance is leader and runs all scheduled work. Better when there are many jobs and you want them co-located, but adds a leadership protocol to reason about.<\/li><li><strong>An external scheduler<\/strong> - a Kubernetes <code>CronJob<\/code>, EventBridge Scheduler, or a workflow engine, invoking an endpoint or running a separate task. This is what I prefer for anything important, because the schedule becomes visible infrastructure with its own observability, retries and alerting, rather than being hidden inside an application.<\/li><\/ul><p>Whatever the mechanism, the job must be <strong>idempotent<\/strong> - locks fail, leaders change, and schedulers retry.<\/p>", "source": "answers.md", "search": "@scheduled runs on every instance. compare shedlock, a database lock and leader election. @scheduled runs on every instance , so a nightly job on six pods runs six times. options: - shedlock - a lock row in a database or redis, acquired for the duration with a minimum and maximum hold time. minimal infrastructure, works with the existing @scheduled annotation (@schedulerlock(name = \"...\", lockatmostfor = \"10m\")), and is my default. lockatmostfor must exceed the worst-case runtime, or a second instance starts while the first is still running. - a database advisory lock - the same idea implemented directly; fine, but you end up writing shedlock. - leader election (spring integration's leaderinitiator, or kubernetes leases) - one instance is leader and runs all scheduled work. better when there are many jobs and you want them co-located, but adds a leadership protocol to reason about. - an external scheduler - a kubernetes cronjob, eventbridge scheduler, or a workflow engine, invoking an endpoint or running a separate task. this is what i prefer for anything important, because the schedule becomes visible infrastructure with its own observability, retries and alerting, rather than being hidden inside an application. whatever the mechanism, the job must be idempotent - locks fail, leaders change, and schedulers retry."}, {"n": 218, "category": 11, "difficulty": "D", "html": "Spring Cloud AWS - <code>spring.config.import<\/code> for Parameter Store and Secrets Manager, and SQS listeners.", "answerTitle": "Spring Cloud AWS", "answer": "<p>Configuration import gives you Parameter Store and Secrets Manager as first-class property sources (Q29), resolved before the context starts and participating in normal precedence.<\/p><p>SQS listening is annotation-driven:<\/p><pre><code class=\"lang-java\">@SqsListener(value = &quot;orders-queue&quot;, maxConcurrentMessages = &quot;10&quot;)\npublic void handle(OrderMessage message, Acknowledgement ack) { ... }<\/code><\/pre><p>with acknowledgement modes (<code>ON_SUCCESS<\/code> by default), batch listeners, and visibility-timeout extension for long-running work - which is the setting people forget, causing the message to be redelivered while still being processed (<code>01-java<\/code> Q185).<\/p><p>It also provides S3 (including a <code>Resource<\/code> implementation so <code>s3://bucket/key<\/code> works with <code>ResourceLoader<\/code>), SNS, DynamoDB and CloudWatch metric export. Credentials come from the default provider chain, so IRSA or the ECS task role works with no configuration - which is the point.<\/p><p>The thing to verify per project: Spring Cloud AWS 3.x is a substantial rewrite on AWS SDK v2 with a different group ID and different property names, so the migration from 2.x is not a version bump.<\/p>", "source": "answers.md", "search": "spring cloud aws - spring.config.import for parameter store and secrets manager, and sqs listeners. configuration import gives you parameter store and secrets manager as first-class property sources (q29), resolved before the context starts and participating in normal precedence. sqs listening is annotation-driven: java @sqslistener(value = \"orders-queue\", maxconcurrentmessages = \"10\") public void handle(ordermessage message, acknowledgement ack) { ... } with acknowledgement modes (on_success by default), batch listeners, and visibility-timeout extension for long-running work - which is the setting people forget, causing the message to be redelivered while still being processed (01-java q185). it also provides s3 (including a resource implementation so s3://bucket/key works with resourceloader), sns, dynamodb and cloudwatch metric export. credentials come from the default provider chain, so irsa or the ecs task role works with no configuration - which is the point. the thing to verify per project: spring cloud aws 3.x is a substantial rewrite on aws sdk v2 with a different group id and different property names, so the migration from 2.x is not a version bump."}, {"n": 219, "category": 11, "difficulty": "D", "html": "Spring Cloud Contract - the producer and consumer sides, and where it fits relative to integration tests.", "answerTitle": "Spring Cloud Contract", "answer": "<p>The <strong>producer<\/strong> defines contracts (Groovy, YAML or Java DSL) describing request and response pairs. The build generates tests that run against the real producer, so the contract is verified to match the implementation, and publishes a <strong>stub JAR<\/strong> to the artifact repository. The <strong>consumer<\/strong> uses <code>@AutoConfigureStubRunner<\/code> to run against those stubs instead of a mock it wrote itself.<\/p><p>The value is that it closes the gap that unit tests with hand-written mocks leave open: your mock says the API returns <code>orderId<\/code>, the API actually returns <code>id<\/code>, both test suites are green, and integration fails. With contracts, the stub the consumer uses is generated from a contract the producer&#x27;s tests prove.<\/p><p>Where it fits: at service boundaries, replacing the need for a full end-to-end environment for API compatibility. It does not replace integration tests for your own database and messaging, and it is not free - contracts must be maintained, and the workflow (consumer-driven or producer-driven) needs an agreed process or teams argue about who owns the contract.<\/p><p>I would introduce it where two teams integrate and breakages are recurring, not across every service by default.<\/p>", "source": "answers.md", "search": "spring cloud contract - the producer and consumer sides, and where it fits relative to integration tests. the producer defines contracts (groovy, yaml or java dsl) describing request and response pairs. the build generates tests that run against the real producer, so the contract is verified to match the implementation, and publishes a stub jar to the artifact repository. the consumer uses @autoconfigurestubrunner to run against those stubs instead of a mock it wrote itself. the value is that it closes the gap that unit tests with hand-written mocks leave open: your mock says the api returns orderid, the api actually returns id, both test suites are green, and integration fails. with contracts, the stub the consumer uses is generated from a contract the producer's tests prove. where it fits: at service boundaries, replacing the need for a full end-to-end environment for api compatibility. it does not replace integration tests for your own database and messaging, and it is not free - contracts must be maintained, and the workflow (consumer-driven or producer-driven) needs an agreed process or teams argue about who owns the contract. i would introduce it where two teams integrate and breakages are recurring, not across every service by default."}, {"n": 220, "category": 11, "difficulty": "A", "html": "Which Spring Cloud components would you deliberately not adopt when running on Kubernetes, and why?", "answerTitle": "What not to adopt on Kubernetes", "answer": "<p>The general principle: do not run a second implementation of something the platform already provides, because you then own two systems that can disagree.<\/p><ul><li><strong>Eureka / service discovery<\/strong> - Kubernetes Services and DNS do this, with the platform&#x27;s own health awareness. Running Eureka adds a registry to operate and a second source of truth about instance health.<\/li><li><strong>Spring Cloud Config Server<\/strong> - ConfigMaps, Secrets and Parameter Store cover it (Q205), without a hard startup dependency on a service you must keep as available as everything else.<\/li><li><strong>Client-side load balancing<\/strong> - the Service handles it; add it only for zone affinity or client health checks the platform lacks (Q213).<\/li><li><strong>Spring Cloud Bus<\/strong> - a message broker for configuration refresh is a lot of machinery for something a rolling restart does more safely.<\/li><li><strong>Hystrix<\/strong> - end-of-life; use Resilience4j.<\/li><\/ul><p>What I <strong>would<\/strong> adopt: Resilience4j (application-level concerns the platform cannot see), Spring Cloud Stream or <code>spring-kafka<\/code> (messaging is genuinely application logic), Spring Cloud Gateway if I need application-aware routing beyond an ingress, Spring Cloud AWS for cloud service integration, and Contract for boundary testing.<\/p><p>The nuance I would add: if you also run outside Kubernetes, or need portability across environments, the calculus changes - and a service mesh overlaps with several of these too, so the honest answer is to pick one layer for each concern and be consistent about it.<\/p>", "source": "answers.md", "search": "which spring cloud components would you deliberately not adopt when running on kubernetes, and why? the general principle: do not run a second implementation of something the platform already provides, because you then own two systems that can disagree. - eureka / service discovery - kubernetes services and dns do this, with the platform's own health awareness. running eureka adds a registry to operate and a second source of truth about instance health. - spring cloud config server - configmaps, secrets and parameter store cover it (q205), without a hard startup dependency on a service you must keep as available as everything else. - client-side load balancing - the service handles it; add it only for zone affinity or client health checks the platform lacks (q213). - spring cloud bus - a message broker for configuration refresh is a lot of machinery for something a rolling restart does more safely. - hystrix - end-of-life; use resilience4j. what i would adopt: resilience4j (application-level concerns the platform cannot see), spring cloud stream or spring-kafka (messaging is genuinely application logic), spring cloud gateway if i need application-aware routing beyond an ingress, spring cloud aws for cloud service integration, and contract for boundary testing. the nuance i would add: if you also run outside kubernetes, or need portability across environments, the calculus changes - and a service mesh overlaps with several of these too, so the honest answer is to pick one layer for each concern and be consistent about it."}, {"n": 221, "category": 12, "difficulty": "D", "html": "The test context cache - what forms the cache key, and how do you keep the number of contexts small?", "answerTitle": "The context cache key", "answer": "<p><code>MergedContextConfiguration<\/code> is the key, comprising: the configuration classes and locations, the active profiles, the property sources (<code>@TestPropertySource<\/code>, inline properties), the context initializers, the <code>ContextCustomizer<\/code>s (which is where <code>@MockBean<\/code>, <code>@DynamicPropertySource<\/code> and web environment settings contribute), the parent context, and the <code>ContextLoader<\/code>.<\/p><p>Any difference produces a <strong>new context<\/strong>, each costing full startup time and heap. A suite with 40 distinct combinations starts 40 applications, which is where the &quot;why does our build take 25 minutes&quot; answer lives.<\/p><p>Keeping the count low: define a small number of standard test configurations and reuse them; put shared mocks in one <code>@TestConfiguration<\/code> imported everywhere rather than per-class <code>@MockBean<\/code> combinations; avoid per-class inline properties; and use <code>@DirtiesContext<\/code> almost never - it evicts the context and forces a rebuild for everything after it.<\/p><p>Measure it: enable <code>logging.level.org.springframework.test.context.cache=DEBUG<\/code> and the framework logs cache size, hit and miss counts. That number is the metric to drive down.<\/p>", "source": "answers.md", "search": "the test context cache - what forms the cache key, and how do you keep the number of contexts small? mergedcontextconfiguration is the key, comprising: the configuration classes and locations, the active profiles, the property sources (@testpropertysource, inline properties), the context initializers, the contextcustomizers (which is where @mockbean, @dynamicpropertysource and web environment settings contribute), the parent context, and the contextloader. any difference produces a new context , each costing full startup time and heap. a suite with 40 distinct combinations starts 40 applications, which is where the \"why does our build take 25 minutes\" answer lives. keeping the count low: define a small number of standard test configurations and reuse them; put shared mocks in one @testconfiguration imported everywhere rather than per-class @mockbean combinations; avoid per-class inline properties; and use @dirtiescontext almost never - it evicts the context and forces a rebuild for everything after it. measure it: enable logging.level.org.springframework.test.context.cache=debug and the framework logs cache size, hit and miss counts. that number is the metric to drive down."}, {"n": 222, "category": 12, "difficulty": "T", "html": "Which annotations silently create a new application context, and how do you measure how many your suite creates?", "answerTitle": "Silent context creation", "answer": "<p>The ones that create a new cache key, often unintentionally:<\/p><ul><li><code>@MockBean<\/code> / <code>@SpyBean<\/code> - <strong>each distinct set<\/strong> of mocked types is a different key. Two test classes mocking different services get two contexts.<\/li><li><code>@TestPropertySource<\/code> and <code>@SpringBootTest(properties = ...)<\/code> - any difference in inline properties.<\/li><li><code>@ActiveProfiles<\/code> - different profile sets.<\/li><li><code>@DynamicPropertySource<\/code> - contributes a customizer.<\/li><li><code>webEnvironment<\/code> - <code>MOCK<\/code>, <code>RANDOM_PORT<\/code> and <code>DEFINED_PORT<\/code> are all distinct.<\/li><li><code>@ContextConfiguration<\/code> with different classes, and different slice annotations.<\/li><li><code>@DirtiesContext<\/code> - evicts, so the next test rebuilds.<\/li><\/ul><p>Finding out how many you create: the cache logging above, or a <code>TestExecutionListener<\/code> that counts contexts. I have also had success simply sorting the build log by context startup lines - it is usually obvious which annotation combination is duplicated across dozens of classes.<\/p><p>The practical fix that gives the biggest win is consolidating <code>@MockBean<\/code> usage, because it is the most common and least obvious contributor.<\/p>", "source": "answers.md", "search": "which annotations silently create a new application context, and how do you measure how many your suite creates? the ones that create a new cache key, often unintentionally: - @mockbean / @spybean - each distinct set of mocked types is a different key. two test classes mocking different services get two contexts. - @testpropertysource and @springboottest(properties = ...) - any difference in inline properties. - @activeprofiles - different profile sets. - @dynamicpropertysource - contributes a customizer. - webenvironment - mock, random_port and defined_port are all distinct. - @contextconfiguration with different classes, and different slice annotations. - @dirtiescontext - evicts, so the next test rebuilds. finding out how many you create: the cache logging above, or a testexecutionlistener that counts contexts. i have also had success simply sorting the build log by context startup lines - it is usually obvious which annotation combination is duplicated across dozens of classes. the practical fix that gives the biggest win is consolidating @mockbean usage, because it is the most common and least obvious contributor."}, {"n": 223, "category": 12, "difficulty": "C", "html": "The test slice catalogue - which slice for which layer, and what each one deliberately does not load.", "answerTitle": "Slice tests", "answer": "<table><thead><tr><th>Slice<\/th><th>Loads<\/th><th>Notably excludes<\/th><\/tr><\/thead><tbody><tr><td><code>@WebMvcTest<\/code><\/td><td>Controllers, advice, filters, converters, security<\/td><td>Services, repositories, <code>@Configuration<\/code> classes<\/td><\/tr><tr><td><code>@DataJpaTest<\/code><\/td><td>Entities, repositories, embedded/configured DB, transactional + rollback<\/td><td>Web layer, services<\/td><\/tr><tr><td><code>@JdbcTest<\/code> / <code>@DataJdbcTest<\/code><\/td><td><code>JdbcTemplate<\/code>, <code>DataSource<\/code><\/td><td>JPA<\/td><\/tr><tr><td><code>@JsonTest<\/code><\/td><td>Jackson configuration, <code>JacksonTester<\/code><\/td><td>Everything else<\/td><\/tr><tr><td><code>@RestClientTest<\/code><\/td><td><code>RestTemplateBuilder<\/code>/<code>RestClient<\/code> plus <code>MockRestServiceServer<\/code><\/td><td>Web layer<\/td><\/tr><tr><td><code>@DataRedisTest<\/code>, <code>@DataMongoTest<\/code><\/td><td>The relevant data module<\/td><td>Others<\/td><\/tr><tr><td><code>@WebFluxTest<\/code><\/td><td>Reactive web layer, <code>WebTestClient<\/code><\/td><td>Services, repositories<\/td><\/tr><\/tbody><\/table><p>The critical property is that each slice <strong>excludes your <code>@Configuration<\/code> classes<\/strong>, so anything you configured yourself - security rules, custom converters, message converters, argument resolvers - is absent unless explicitly <code>@Import<\/code>ed. That is what makes slices fast and what makes them lie if you do not know it (Q164, Q230).<\/p>", "source": "answers.md", "search": "the test slice catalogue - which slice for which layer, and what each one deliberately does not load. slice loads notably excludes --- --- --- @webmvctest controllers, advice, filters, converters, security services, repositories, @configuration classes @datajpatest entities, repositories, embedded/configured db, transactional + rollback web layer, services @jdbctest / @datajdbctest jdbctemplate, datasource jpa @jsontest jackson configuration, jacksontester everything else @restclienttest resttemplatebuilder/restclient plus mockrestserviceserver web layer @dataredistest, @datamongotest the relevant data module others @webfluxtest reactive web layer, webtestclient services, repositories the critical property is that each slice excludes your @configuration classes , so anything you configured yourself - security rules, custom converters, message converters, argument resolvers - is absent unless explicitly @imported. that is what makes slices fast and what makes them lie if you do not know it (q164, q230)."}, {"n": 224, "category": 12, "difficulty": "D", "html": "<code>@TestConfiguration<\/code> versus <code>@Configuration<\/code> in tests, and when you need <code>@Import<\/code>.", "answerTitle": "`@TestConfiguration` versus `@Configuration`", "answer": "<p>A static nested <code>@Configuration<\/code> class inside a test <strong>replaces<\/strong> the application&#x27;s configuration for that test. A <code>@TestConfiguration<\/code> is <strong>additive<\/strong> - it supplements the primary configuration rather than replacing it, and it is not picked up by component scanning of the main application, so it cannot accidentally leak into production wiring.<\/p><p><code>@TestConfiguration<\/code> is what you want in almost every case: overriding one bean with a stub, adding a fixed <code>Clock<\/code>, or registering a test-only <code>RestClient<\/code> pointed at a mock server. Combine with <code>@Import(MyTestConfig.class)<\/code> to apply it to specific test classes, which also keeps the context cache key stable if you import the same configuration everywhere.<\/p>", "source": "answers.md", "search": "@testconfiguration versus @configuration in tests, and when you need @import. a static nested @configuration class inside a test replaces the application's configuration for that test. a @testconfiguration is additive - it supplements the primary configuration rather than replacing it, and it is not picked up by component scanning of the main application, so it cannot accidentally leak into production wiring. @testconfiguration is what you want in almost every case: overriding one bean with a stub, adding a fixed clock, or registering a test-only restclient pointed at a mock server. combine with @import(mytestconfig.class) to apply it to specific test classes, which also keeps the context cache key stable if you import the same configuration everywhere."}, {"n": 225, "category": 12, "difficulty": "D", "html": "<code>@MockBean<\/code> versus <code>@MockitoBean<\/code> (Spring 6.2) versus plain constructor-injected Mockito.", "answerTitle": "`@MockBean`, `@MockitoBean` and plain Mockito", "answer": "<p><code>@MockBean<\/code> (Boot) replaced a bean in the context with a Mockito mock; <strong><code>@MockitoBean<\/code> (Spring Framework 6.2)<\/strong> is the successor, moving the capability into the core framework, and <code>@MockBean<\/code> is deprecated from Boot 3.4. Both behave the same way for the context cache (Q222).<\/p><p>Plain Mockito with constructor injection needs no context at all:<\/p><pre><code class=\"lang-java\">var service = new OrderService(mockRepository, mockGateway);<\/code><\/pre><p>This runs in milliseconds, has no cache implications, and is what the vast majority of tests should use. It is also an argument for constructor injection (<code>01-java<\/code> Q111).<\/p><p>My guidance: default to plain Mockito unit tests; use <code>@MockitoBean<\/code> only when you genuinely need the Spring context <em>and<\/em> must stub a collaborator - typically in a <code>@WebMvcTest<\/code> where the controller&#x27;s service dependency must exist. And group those stubs so the cache key repeats.<\/p>", "source": "answers.md", "search": "@mockbean versus @mockitobean (spring 6.2) versus plain constructor-injected mockito. @mockbean (boot) replaced a bean in the context with a mockito mock; @mockitobean (spring framework 6.2) is the successor, moving the capability into the core framework, and @mockbean is deprecated from boot 3.4. both behave the same way for the context cache (q222). plain mockito with constructor injection needs no context at all: java var service = new orderservice(mockrepository, mockgateway); this runs in milliseconds, has no cache implications, and is what the vast majority of tests should use. it is also an argument for constructor injection (01-java q111). my guidance: default to plain mockito unit tests; use @mockitobean only when you genuinely need the spring context and must stub a collaborator - typically in a @webmvctest where the controller's service dependency must exist. and group those stubs so the cache key repeats."}, {"n": 226, "category": 12, "difficulty": "D", "html": "<code>@DynamicPropertySource<\/code> versus <code>@TestPropertySource<\/code> versus an <code>ApplicationContextInitializer<\/code>.", "answerTitle": "Test property mechanisms", "answer": "<ul><li><strong><code>@TestPropertySource(properties = ...)<\/code><\/strong> - static values known at compile time. Highest precedence among test property sources.<\/li><li><strong><code>@DynamicPropertySource<\/code><\/strong> - a static method registering values computed at runtime, evaluated <strong>before<\/strong> the context starts. This is what makes Testcontainers work, because the port is only known after the container starts:<\/li><\/ul><pre><code class=\"lang-java\">@DynamicPropertySource\nstatic void props(DynamicPropertyRegistry registry) {\n    registry.add(&quot;spring.datasource.url&quot;, postgres::getJdbcUrl);\n}<\/code><\/pre><p>Values are <code>Supplier<\/code>s, so they are resolved lazily at the right moment.<\/p><ul><li><strong><code>ApplicationContextInitializer<\/code><\/strong> - the most flexible, adding a whole <code>PropertySource<\/code> programmatically; used when you need conditional logic or many values.<\/li><\/ul><p>Since Boot 3.1, <code>@ServiceConnection<\/code> (Q227) removes most <code>@DynamicPropertySource<\/code> usage for supported containers.<\/p>", "source": "answers.md", "search": "@dynamicpropertysource versus @testpropertysource versus an applicationcontextinitializer. - @testpropertysource(properties = ...) - static values known at compile time. highest precedence among test property sources. - @dynamicpropertysource - a static method registering values computed at runtime, evaluated before the context starts. this is what makes testcontainers work, because the port is only known after the container starts: java @dynamicpropertysource static void props(dynamicpropertyregistry registry) { registry.add(\"spring.datasource.url\", postgres::getjdbcurl); } values are suppliers, so they are resolved lazily at the right moment. - applicationcontextinitializer - the most flexible, adding a whole propertysource programmatically; used when you need conditional logic or many values. since boot 3.1, @serviceconnection (q227) removes most @dynamicpropertysource usage for supported containers."}, {"n": 227, "category": 12, "difficulty": "D", "html": "Testcontainers with <code>@ServiceConnection<\/code> (Boot 3.1) and container reuse - how much boilerplate does it remove?", "answerTitle": "Testcontainers with `@ServiceConnection`", "answer": "<pre><code class=\"lang-java\">@SpringBootTest\n@Testcontainers\nclass OrderIntegrationTest {\n    @Container @ServiceConnection\n    static PostgreSQLContainer&lt;?&gt; postgres = new PostgreSQLContainer&lt;&gt;(&quot;postgres:16&quot;);\n}<\/code><\/pre><p><code>@ServiceConnection<\/code> (Boot 3.1) derives <em>all<\/em> the connection properties from the container - URL, username, password, driver - via a <code>ConnectionDetails<\/code> bean, replacing the <code>@DynamicPropertySource<\/code> block entirely. Supported for Postgres, MySQL, Redis, Kafka, MongoDB, RabbitMQ, Elasticsearch, LocalStack and more.<\/p><p><code>static<\/code> containers are started once per class and shared; <strong>reuse<\/strong> (<code>.withReuse(true)<\/code> plus <code>testcontainers.reuse.enable=true<\/code> in <code>~/.testcontainers.properties<\/code>) keeps them running between <em>runs<\/em>, which transforms the local development loop - the container starts once a day rather than once a build.<\/p><p>Boot 3.1 also added <code>@TestConfiguration<\/code> container beans plus <code>SpringApplication.from(...).with(TestContainersConfig.class)<\/code> so you can <strong>run the application locally<\/strong> against the same containers, which removes a whole class of &quot;works in tests, not locally&quot; friction.<\/p>", "source": "answers.md", "search": "testcontainers with @serviceconnection (boot 3.1) and container reuse - how much boilerplate does it remove? java @springboottest @testcontainers class orderintegrationtest { @container @serviceconnection static postgresqlcontainer<? postgres = new postgresqlcontainer< (\"postgres:16\"); } @serviceconnection (boot 3.1) derives all the connection properties from the container - url, username, password, driver - via a connectiondetails bean, replacing the @dynamicpropertysource block entirely. supported for postgres, mysql, redis, kafka, mongodb, rabbitmq, elasticsearch, localstack and more. static containers are started once per class and shared; reuse (.withreuse(true) plus testcontainers.reuse.enable=true in ~/.testcontainers.properties) keeps them running between runs , which transforms the local development loop - the container starts once a day rather than once a build. boot 3.1 also added @testconfiguration container beans plus springapplication.from(...).with(testcontainersconfig.class) so you can run the application locally against the same containers, which removes a whole class of \"works in tests, not locally\" friction."}, {"n": 228, "category": 12, "difficulty": "T", "html": "Why do <code>@Transactional<\/code> tests pass while production fails? List the specific things such a test cannot see.", "answerTitle": "What `@Transactional` tests hide", "answer": "<p>A <code>@Transactional<\/code> test rolls back at the end and, crucially, runs the test method and the application code in <strong>one transaction on one thread<\/strong>. That hides:<\/p><ul><li><strong>Commit-time failures<\/strong> - deferred constraints, database triggers, and anything that only fires on commit. The test never commits.<\/li><li><strong>Flush-timing bugs<\/strong> - the test and the code share a persistence context, so an entity you saved is visible without a flush; in production, with separate transactions, it may not be.<\/li><li><strong><code>LazyInitializationException<\/code><\/strong> - the session stays open for the whole test, so lazy loading always works. Production closes it at the transaction boundary and throws.<\/li><li><strong>Isolation and locking behavior<\/strong> - there is only one transaction, so you cannot observe concurrent access, deadlocks or optimistic lock failures.<\/li><li><strong>Auto-generated values and identity semantics<\/strong> that differ between <code>persist<\/code> and <code>merge<\/code> paths.<\/li><li><strong><code>@TransactionalEventListener(AFTER_COMMIT)<\/code><\/strong> - never fires, so the entire asynchronous half of your logic is untested (Q19).<\/li><\/ul><p>So <code>@Transactional<\/code> tests are fine for repository-level query verification. Anything asserting behavior across a transaction boundary needs a <strong>non-transactional<\/strong> test with explicit cleanup - <code>@Transactional(propagation = NOT_SUPPORTED)<\/code> or a truncate between tests - and that is where the real bugs are found.<\/p>", "source": "answers.md", "search": "why do @transactional tests pass while production fails? list the specific things such a test cannot see. a @transactional test rolls back at the end and, crucially, runs the test method and the application code in one transaction on one thread . that hides: - commit-time failures - deferred constraints, database triggers, and anything that only fires on commit. the test never commits. - flush-timing bugs - the test and the code share a persistence context, so an entity you saved is visible without a flush; in production, with separate transactions, it may not be. - lazyinitializationexception - the session stays open for the whole test, so lazy loading always works. production closes it at the transaction boundary and throws. - isolation and locking behavior - there is only one transaction, so you cannot observe concurrent access, deadlocks or optimistic lock failures. - auto-generated values and identity semantics that differ between persist and merge paths. - @transactionaleventlistener(after_commit) - never fires, so the entire asynchronous half of your logic is untested (q19). so @transactional tests are fine for repository-level query verification. anything asserting behavior across a transaction boundary needs a non-transactional test with explicit cleanup - @transactional(propagation = not_supported) or a truncate between tests - and that is where the real bugs are found."}, {"n": 229, "category": 12, "difficulty": "D", "html": "<code>MockMvc<\/code> versus <code>WebTestClient<\/code> versus <code>TestRestTemplate<\/code> versus <code>@SpringBootTest(webEnvironment = RANDOM_PORT)<\/code>.", "answerTitle": "The four web test styles", "answer": "<ul><li><strong><code>MockMvc<\/code><\/strong> - no server, no network; the <code>DispatcherServlet<\/code> is invoked directly with a mock request. Fastest, and the right default for controller logic.<\/li><li><strong><code>WebTestClient<\/code><\/strong> - fluent and reactive; works both against a mock server (<code>@WebFluxTest<\/code>, or bound to <code>MockMvc<\/code>) and a real port. Better assertions than <code>MockMvc<\/code> even for servlet applications.<\/li><li><strong><code>TestRestTemplate<\/code><\/strong> - a real HTTP client against a real port; blocking, with error handling suited to testing (it does not throw on 4xx/5xx).<\/li><li><strong><code>@SpringBootTest(webEnvironment = RANDOM_PORT)<\/code><\/strong> - starts the real embedded server, so the full stack including the actual servlet container, filters and serialization is exercised.<\/li><\/ul><p>My layering: <code>MockMvc<\/code> or <code>WebTestClient<\/code> on a slice for controller behavior, and a small number of <code>RANDOM_PORT<\/code> tests for the paths where the real stack matters - authentication, content negotiation, error handling, and anything that has broken in production before.<\/p>", "source": "answers.md", "search": "mockmvc versus webtestclient versus testresttemplate versus @springboottest(webenvironment = random_port). - mockmvc - no server, no network; the dispatcherservlet is invoked directly with a mock request. fastest, and the right default for controller logic. - webtestclient - fluent and reactive; works both against a mock server (@webfluxtest, or bound to mockmvc) and a real port. better assertions than mockmvc even for servlet applications. - testresttemplate - a real http client against a real port; blocking, with error handling suited to testing (it does not throw on 4xx/5xx). - @springboottest(webenvironment = random_port) - starts the real embedded server, so the full stack including the actual servlet container, filters and serialization is exercised. my layering: mockmvc or webtestclient on a slice for controller behavior, and a small number of random_port tests for the paths where the real stack matters - authentication, content negotiation, error handling, and anything that has broken in production before."}, {"n": 230, "category": 12, "difficulty": "T", "html": "Which classes of bug does <code>MockMvc<\/code> structurally fail to catch?", "answerTitle": "What `MockMvc` cannot catch", "answer": "<p>Because there is no server and no network:<\/p><ul><li><strong>Servlet container behavior<\/strong> - actual request parsing, URL decoding, header size limits, chunked encoding, HTTP/2 specifics.<\/li><li><strong>Filters not registered in the test<\/strong> - <code>MockMvc<\/code> only applies filters you add (or, with <code>@AutoConfigureMockMvc<\/code>, the Spring Security chain); container-registered filters and their ordering are not exercised.<\/li><li><strong>Real serialization over the wire<\/strong> - <code>MockMvc<\/code> uses the configured converters, but connection-level issues, compression, and streaming behavior are invisible.<\/li><li><strong>Async completion semantics<\/strong> - <code>asyncDispatch<\/code> must be invoked manually, so a bug in the async lifecycle is easy to miss.<\/li><li><strong>Anything configuration-dependent that the slice omitted<\/strong> (Q164) - security rules, custom converters, error handling.<\/li><li><strong>Response buffering and SSE<\/strong> behavior, which depend on the real container.<\/li><\/ul><p>The mitigation is not to abandon <code>MockMvc<\/code> - it is fast and appropriate - but to have a thin layer of real-port tests covering exactly these areas, and to know which category a given bug would fall into when deciding where to test.<\/p>", "source": "answers.md", "search": "which classes of bug does mockmvc structurally fail to catch? because there is no server and no network: - servlet container behavior - actual request parsing, url decoding, header size limits, chunked encoding, http/2 specifics. - filters not registered in the test - mockmvc only applies filters you add (or, with @autoconfiguremockmvc, the spring security chain); container-registered filters and their ordering are not exercised. - real serialization over the wire - mockmvc uses the configured converters, but connection-level issues, compression, and streaming behavior are invisible. - async completion semantics - asyncdispatch must be invoked manually, so a bug in the async lifecycle is easy to miss. - anything configuration-dependent that the slice omitted (q164) - security rules, custom converters, error handling. - response buffering and sse behavior, which depend on the real container. the mitigation is not to abandon mockmvc - it is fast and appropriate - but to have a thin layer of real-port tests covering exactly these areas, and to know which category a given bug would fall into when deciding where to test."}, {"n": 231, "category": 12, "difficulty": "D", "html": "Testing scheduled jobs, async methods and eventual behavior without <code>Thread.sleep<\/code>.", "answerTitle": "Testing async and scheduled behavior", "answer": "<p>Never <code>Thread.sleep<\/code>. Use <strong>Awaitility<\/strong>:<\/p><pre><code class=\"lang-java\">await().atMost(5, SECONDS).untilAsserted(() -&gt;\n    verify(notificationService).send(argThat(n -&gt; n.orderId().equals(id))));<\/code><\/pre><p>It polls until the assertion passes or the timeout expires, so the test is fast when things work and gives a clear failure when they do not.<\/p><p>For <strong>scheduled<\/strong> methods, do not wait for the schedule at all: extract the work into a method and test that directly, and separately assert the cron expression with a unit test on <code>CronExpression.parse(...).next(...)<\/code>. Testing that Spring&#x27;s scheduler works is testing the framework.<\/p><p>For <code>@Async<\/code>, either use Awaitility as above, or in tests replace the executor with a synchronous one so behavior is deterministic:<\/p><pre><code class=\"lang-java\">@TestConfiguration\nstatic class SyncExecutorConfig {\n    @Bean TaskExecutor applicationTaskExecutor() { return new SyncTaskExecutor(); }\n}<\/code><\/pre><p>Also inject a fixed <code>Clock<\/code> everywhere rather than using <code>Instant.now()<\/code>, so time-dependent logic is deterministic - that single practice eliminates a large share of flaky tests.<\/p>", "source": "answers.md", "search": "testing scheduled jobs, async methods and eventual behavior without thread.sleep. never thread.sleep. use awaitility : java await().atmost(5, seconds).untilasserted(() - verify(notificationservice).send(argthat(n - n.orderid().equals(id)))); it polls until the assertion passes or the timeout expires, so the test is fast when things work and gives a clear failure when they do not. for scheduled methods, do not wait for the schedule at all: extract the work into a method and test that directly, and separately assert the cron expression with a unit test on cronexpression.parse(...).next(...). testing that spring's scheduler works is testing the framework. for @async, either use awaitility as above, or in tests replace the executor with a synchronous one so behavior is deterministic: java @testconfiguration static class syncexecutorconfig { @bean taskexecutor applicationtaskexecutor() { return new synctaskexecutor(); } } also inject a fixed clock everywhere rather than using instant.now(), so time-dependent logic is deterministic - that single practice eliminates a large share of flaky tests."}, {"n": 232, "category": 12, "difficulty": "D", "html": "Testing Kafka or SQS consumers - embedded broker, Testcontainers, or a contrac
